<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GMFQ Timeframe No-Reload Test</title><style>:root{--bg:#03101a;--panel:#071a29;--line:#203e52;--text:#e8eef4;--muted:#8ca0b2;--green:#24d99a;--red:#ff5168}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{max-width:1400px;margin:0 auto;padding:28px}.hero{position:relative;border:1px solid #17384c;border-radius:10px;background:linear-gradient(90deg,#061726,#071a29);padding:22px;min-height:190px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.hero h1{margin:0 0 6px;font-family:Georgia,serif;font-size:34px}.hero p{margin:0;color:var(--muted)}.hero-tabs{display:flex;border:1px solid #263e51;border-radius:5px;overflow:hidden}.hero-tabs a{height:34px;min-width:52px;display:grid;place-items:center;color:#9aacba;text-decoration:none;border-right:1px solid #1b3345;font-size:11px}.hero-tabs a:last-child{border-right:0}.hero-tabs a.active{background:#144e83;color:#fff}.ticker-strip{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:26px}.ticker{height:82px;border:1px solid var(--line);border-radius:6px;background:linear-gradient(180deg,rgba(8,28,43,.97),rgba(5,21,33,.97));display:grid;grid-template-columns:1fr 83px;padding:10px;overflow:hidden}.ticker small{display:block;font-size:11px;font-weight:700}.ticker b{display:block;font-size:17px;margin-top:3px}.ticker em{display:block;font-style:normal;font-size:11px;font-weight:700;margin-top:5px}.up{color:var(--green)}.down{color:var(--red)}.ticker svg{width:82px;height:48px;align-self:end}.ticker polyline{fill:none;stroke-width:1.5}.ticker polyline.up{stroke:var(--green)}.ticker polyline.down{stroke:var(--red)}#status{margin-top:14px;color:#9fb2c0;font-size:12px}@media(max-width:900px){.ticker-strip{grid-template-columns:repeat(2,1fr)}.top{display:block}.hero-tabs{margin-top:18px;width:max-content}}</style></head><body><div class="wrap"><section class="hero"><div class="top"><div><h1>Timeframe no-reload test</h1><p>Il click deve cambiare solo ticker e URL, senza ricaricare o far saltare la pagina.</p></div><div class="hero-tabs"><a data-timeframe="1D" href="?tf=1D" class="active">1D</a><a data-timeframe="1W" href="?tf=1W">1W</a><a data-timeframe="1M" href="?tf=1M">1M</a><a data-timeframe="3M" href="?tf=3M">3M</a><a data-timeframe="YTD" href="?tf=YTD">YTD</a></div></div><div class="ticker-strip"></div><div id="status">SCRIPT OK…</div></section></div><script>(()=>{'use strict';const ROOT='../../live_data/sections/';const D_PATH=ROOT+'D.json',RATES_PATH=ROOT+'NATIVE_RATES_DATA.json',FX_PATH='https://raw.githubusercontent.com/robybizkit77-blip/global-macro-fx-quant/main/live_data/sections/ECB_G8_PRICE_HISTORY.json';const PAIRS=['EURUSD','GBPUSD','USDJPY','USDCAD','AUDUSD','NZDUSD'],ALLOWED=['1D','1W','1M','3M','YTD'];const params=new URLSearchParams(location.search);let d=null,rates=null,fx=null,heroPeriod=ALLOWED.includes(params.get('tf'))?params.get('tf'):'1D';const st=t=>document.getElementById('status').textContent=t;const n=v=>Number.isFinite(Number(v))?Number(v):null;const pct=(v,d=2)=>{const x=n(v);return x===null?'—':`${x>0?'+':''}${x.toFixed(d)}%`};async function load(p){const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error(`${p}: HTTP ${r.status}`);return r.json()}async function tryLoad(p){try{return await load(p)}catch{return null}}function sparkPoints(values,w=90,h=44,pad=2){const a=(values||[]).map(Number).filter(Number.isFinite);if(a.length<2)return `0,${h/2} ${w},${h/2}`;const lo=Math.min(...a),hi=Math.max(...a),span=(hi-lo)||1;return a.map((v,i)=>`${(pad+(w-2*pad)*(i/(a.length-1))).toFixed(1)},${(pad+(h-2*pad)*(1-(v-lo)/span)).toFixed(1)}`).join(' ')}function sampled(values,max=34){if(values.length<=max)return values;return Array.from({length:max},(_,i)=>values[Math.round(i*(values.length-1)/(max-1))])}function datedRows(){return(Array.isArray(fx?.rows)?fx.rows:[]).filter(r=>r?.Date).slice().sort((a,b)=>String(a.Date).localeCompare(String(b.Date)))}function startIndex(rows,p){if(rows.length<2)return 0;if(p==='1D')return Math.max(0,rows.length-2);const last=new Date(`${rows.at(-1).Date}T00:00:00Z`);let t;if(p==='YTD')t=new Date(Date.UTC(last.getUTCFullYear(),0,1));else{t=new Date(last);if(p==='1W')t.setUTCDate(t.getUTCDate()-7);if(p==='1M')t.setUTCMonth(t.getUTCMonth()-1);if(p==='3M')t.setUTCMonth(t.getUTCMonth()-3)}const ts=t.toISOString().slice(0,10);let i=rows.findIndex(r=>r.Date>=ts);if(i<0)i=0;return Math.min(i,rows.length-2)}function pairValue(row,label){const a=label.slice(0,3),b=label.slice(3,6),av=a==='EUR'?1:n(row?.[a]),bv=b==='EUR'?1:n(row?.[b]);return av&&bv?bv/av:null}function findPair(label){const wanted=label.replace('/','');return(Array.isArray(d?.pairs)?d.pairs:[]).find(x=>String(x?.pair||'').replace('/','')===wanted)||null}function fallbackPairCard(label,p){const row=findPair(label);if(!row)return null;const last=n(row.last);if(last===null)return null;const key={1W:'ret1w',1M:'ret1m',3M:'ret3m'}[p],ret=n(key?row[key]:null),profile=[0,row.ret1w,row.ret1m,row.ret3m,row.ret6m,row.ret1y].map(n).filter(v=>v!==null);return{label,value:last>=100?last.toFixed(2):last.toFixed(4),change:ret===null?'—':pct(ret,2),dir:(ret??0)>=0?'up':'down',values:profile}}function pairCard(label,p){const rows=datedRows();if(rows.length<2)return fallbackPairCard(label,p);const si=startIndex(rows,p),vals=rows.slice(si).map(r=>pairValue(r,label)).filter(v=>v!==null);if(vals.length<2)return fallbackPairCard(label,p);const first=vals[0],last=vals.at(-1),ret=(last/first-1)*100;return{label,value:last>=100?last.toFixed(2):last.toFixed(4),change:pct(ret,2),dir:ret>=0?'up':'down',values:sampled(vals)}}function rateHistory(series,key){const h=series?.[key];if(Array.isArray(h))return h.map(x=>({date:x?.date,value:n(x?.value)})).filter(x=>x.date&&x.value!==null);const dates=Array.isArray(h?.dates)?h.dates:[],values=Array.isArray(h?.values)?h.values:[];return dates.map((date,i)=>({date,value:n(values[i])})).filter(x=>x.date&&x.value!==null)}function rateCard(tenor,p){const usd=rates?.USD;if(!usd)return null;const h=rateHistory(usd,tenor===10?'history10':'history2');if(h.length<2)return null;const si=startIndex(h.map(x=>({Date:x.date})),p),win=h.slice(si),current=n(usd?.[`${tenor}Y`])??win.at(-1)?.value;if(current==null)return null;const first=win[0].value,delta=(current-first)*100;return{label:`US ${tenor}Y`,value:`${current.toFixed(2)}%`,change:`${delta>0?'+':''}${delta.toFixed(1)}bp`,dir:delta>=0?'up':'down',values:sampled(win.map(x=>x.value))}}function render(){const cards=[...PAIRS.map(p=>pairCard(p,heroPeriod)),rateCard(2,heroPeriod),rateCard(10,heroPeriod)].filter(Boolean);document.querySelector('.ticker-strip').innerHTML=cards.map(c=>`<div class="ticker"><div><small>${c.label}</small><b>${c.value}</b><em class="${c.dir}">${c.change}</em></div><svg viewBox="0 0 90 44"><polyline class="${c.dir}" points="${sparkPoints(c.values)}"/></svg></div>`).join('');st(`READY · timeframe=${heroPeriod} · cards=${cards.length} · FX=${fx?'OK':'fallback'}`)}document.querySelectorAll('.hero-tabs a[data-timeframe]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();heroPeriod=a.dataset.timeframe;document.querySelectorAll('.hero-tabs a[data-timeframe]').forEach(x=>x.classList.toggle('active',x===a));const u=new URL(location.href);u.searchParams.set('tf',heroPeriod);history.replaceState(null,'',u);render()}));(async()=>{try{st('SCRIPT OK · loading D…');d=await load(D_PATH);st('D OK · loading rates…');rates=await load(RATES_PATH);st('RATES OK · loading FX…');fx=await tryLoad(FX_PATH);render()}catch(e){st('FAIL · '+e.message)}})()})();</script></body></html>
