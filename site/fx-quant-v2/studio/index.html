function countryEvidence(c){

 return {core,activity:(m?.activity_momentum_research?.countries?.[c]||[]).filter(x=>valid(x)&&finite(x.momentum_pct)),lab:(m?.labour_inflation_dynamics?.countries?.[c]||[]).filter(valid),sector:(m?.sector_financial_dynamics?.countries?.[c]||[]).filter(valid)};
}
const changeWord=(x,e=.005)=>x>e?'in aumento':x< -e?'in calo':'quasi stabile';
function momentumWords(x){
 const n=x.momentum_pct,v=x.velocity_pp,a=x.acceleration_pp;
 if(!finite(n)||!finite(v))return 'direzione non verificata';
 let text=n>.005?'cresce':n< -.005?'si contrae':'è quasi stabile';
 if(n>.005)text+=v>.005?', a ritmo più rapido':v< -.005?', ma rallenta':'';
 else if(n< -.005)text+=v< -.005?', con contrazione più intensa':v>.005?', ma la contrazione si attenua':'';
 if(finite(a)&&Math.abs(a)>.005&&Math.abs(v)>.005&&v*a<0)text+='; il cambiamento di ritmo perde intensità';
 return text;
}

}

function commonRisk(streams,today){

 const dates=[...maps.SP500.keys()].filter(d=>riskCore.every(k=>maps[k].has(d))).sort();
 if(dates.length<6)return unavailable('Mancano sei osservazioni comuni.');
 const end=dates.at(-1),previous=dates.at(-2),start=dates.at(-6),gap=(x,y)=>(Date.parse(x+'T12:00:00Z')-Date.parse(y+'T12:00:00Z'))/864e5;

 const moves=from=>Object.fromEntries(riskCore.map(k=>[k,k==='VIX'?maps[k].get(end)-maps[k].get(from):k.includes('OAS')?100*(maps[k].get(end)-maps[k].get(from)):100*(maps[k].get(end)/maps[k].get(from)-1)]));

function macroChartRead(s,p){

}

function cotModel(c){

function commonMonetaryWindows(A,B,prices,today){
 if(!A||!B||!(prices instanceof Map)||!validDay(today))return {short:null,medium:null};
 const points=m=>(m.tenors?.['6m']||[]).filter(p=>validDay(p.date)&&p.date<=today&&finite(p.rate)&&!p.derived);
 const a=points(A),b=points(B),am=new Map(a.map(p=>[p.date,p])),bm=new Map(b.map(p=>[p.date,p]));
 const dates=[...am.keys()].filter(d=>bm.has(d)&&finite(prices.get(d))&&prices.get(d)>0).sort();
 const days=(x,y)=>(Date.parse(y+'T12:00:00Z')-Date.parse(x+'T12:00:00Z'))/864e5;
 const end=dates.at(-1);
 if(!end||days(end,today)>7)return {short:null,medium:null};
 function leg(m,from,to){
  const arr=(m.tenors?.['6m']||[]).filter(p=>p.date>=from&&p.date<=to);
  const first=arr[0],last=arr.at(-1);
  if(!first||!last||first.date!==from||last.date!==to||arr.some(p=>p.derived||!finite(p.rate)||p.source_class!==first.source_class))return null;
  const constant=arr.every(p=>p.contract===first.contract);
  if(!constant)return null;
  const ois=m.kind==='OIS'&&first.source_class==='OFFICIAL_TENOR';
  const identified=!!first.contract&&['OFFICIAL_TENOR','SECONDARY_SAME_CONTRACT','BANK_BILL_PROXY'].includes(first.source_class);
  const representative=m.kind==='FUTURES'&&first.source_class==='OFFICIAL_TENOR'&&!first.contract;
  if(!ois&&!identified&&!representative)return null;
  return {bp:100*(last.rate-first.rate),kind:m.kind,contract:first.contract||null,grade:representative?'REPRESENTATIVE':'OBSERVED'};
 }
 function window(n,maxSpan){
  if(dates.length<n+1)return null;
  const from=dates.at(-(n+1)),span=days(from,end);
  if(span<=0||span>maxSpan)return null;
  const x=leg(A,from,end),y=leg(B,from,end);
  if(!x||!y)return null;
  return {from,asof:end,n,span,aBp:x.bp,bBp:y.bp,relativeBp:x.bp-y.bp,fxPct:100*(prices.get(end)/prices.get(from)-1),
   grade:x.grade==='REPRESENTATIVE'||y.grade==='REPRESENTATIVE'?'REPRESENTATIVE':'OBSERVED',legs:[x,y]};
 }
 return {short:window(1,4),medium:window(5,12)};
}

 const observations=(one.observations||[]).filter(x=>prices.has(x.from)&&prices.has(x.to)).map(x=>({...x,fxPct:100*(prices.get(x.to)/prices.get(x.from)-1)}));
 const exact=(m)=>{const v=m.live;if(!v||v.grade!=='MATCHED_EXACT_INTERVAL'||!validDay(v.asof)||!validDay(v.from)||v.from>=v.asof||(Date.parse(day())-Date.parse(v.asof))/864e5>7||!prices.has(v.from)||!prices.has(v.asof))return null;

}

function nativeLibrary(){const files=[extra.dailyReports?.file,...(extra.weeklyReports?.files||[])].filter(f=>typeof f==='string'&&/^[A-Za-z0-9_.-]+\.html$/.test(f));const label=f=>f.startsWith('Briefing')?'Briefing Forex & Commodities':f.startsWith('Weekly_Global_Macro')?'Global Macro':f.startsWith('Weekly_Bank_FX')?'Bank FX':f.startsWith('Weekly_CB_Sentiment')?'Central Bank Sentiment':f.startsWith('Weekly_CB_Pricing')?'Curve monetarie G8':f.startsWith('COT_')?'COT settimanale':f.startsWith('Global_Markets')?'Global Markets Review':f.startsWith('Weekly_FX_Pair')?'Pair Selection':f;return heading('07 / research library','La ricerca da leggere','Ultime edizioni indicate dagli indici del sito; verifica la data del documento.')+(files.length?'<div class="grid3">'+files.map(f=>'<section class="panel report"><h2>'+safe(label(f))+'</h2><p class="note">'+safe(f.match(/20\d{2}-\d{2}-\d{2}/)?.[0]||f.replace(/_DARK.*$/,''))+'</p><a class="link" href="'+live+'reports/'+encodeURIComponent(f)+'" target="_blank" rel="noopener">Apri il report →</a></section>').join('')+'</div>':noEvidence('Indici dei report non disponibili'))}
function researchDock(){if(state.page==='rates')return nativeRates();if(state.page==='macro')return nativeMacro();if(state.page==='fx')return state.fxmode==='cot'?nativeCot():state.fxmode==='pairs'?nativeFX():'';if(state.page==='risk')return nativeRisk();return ''}
function openResearch(route){const map={macro:'macro',rates:'rates',banks:'rates',currencies:'fx',pairs:'fx',cot:'fx',risk:'risk',liquidity:'risk',news:'events',library:'library'};if(!map[route])return true;if(map[route]==='fx')state.fxmode=route==='cot'?'cot':route==='currencies'?'strength':'pairs';if(route==='news'||route==='library'){go(map[route]);return false}if(route==='currencies'){go('fx');return false}go(map[route]);document.getElementById('studio-research')?.scrollIntoView({block:'start'});return false}
const views={home:homeDesk,macro:macroEditorial,rates:banksRatesDesk,fx:fxUnified,risk:riskDesk,events:newsDesk,library:studioLibrary};
function render(){chartRegistry.clear();chartSerial=0;document.querySelector('#nav').innerHTML=routeList.map(([k,l])=>`<button class="${state.page===k?'active':''}" aria-current="${state.page===k?'page':'false'}" onclick="go('${k}')">${l}</button>`).join('');document.querySelector('#view').innerHTML=views[state.page]()+researchDock();}
function go(p){if(!views[p])return;state.page=p;try{history.replaceState(null,'','#'+p)}catch(_){}render();window.scrollTo({top:0,behavior:'instant'});}function chooseCurrency(c){state.ccy=c;go('macro')}function choosePair(a,b){state.base=a;state.quote=b;state.fxmode='pairs';go('fx')}if(views[location.hash.slice(1)])state.page=location.hash.slice(1);render();if(location.protocol!=='file:')refreshSources();
</script></body></html>
