function countryEvidence(c){
 const m=data.macro,core=m?.countries?.[c],valid=x=>x&&finite(x.level)&&finite(x.velocity_pp)&&x.measurement!=='WITHHELD'&&x.quality!=='SOURCE_CHECK_FAILED';
 return {core,activity:(m?.activity_momentum_research?.countries?.[c]||[]).filter(x=>valid(x)&&finite(x.momentum_pct)),lab:(m?.labour_inflation_dynamics?.countries?.[c]||[]).filter(valid),sector:(m?.sector_financial_dynamics?.countries?.[c]||[]).filter(valid)};
}
const changeWord=(x,e=.005)=>x>e?'in aumento':x< -e?'in calo':'quasi stabile';
function momentumWords(x){
 const n=x.momentum_pct,v=x.velocity_pp,a=x.acceleration_pp;
 if(!finite(n)||!finite(v))return 'direzione non verificata';
 let text=n>.005?'cresce':n< -.005?'si contrae':'è quasi stabile';
 if(n>.005)text+=v>.005?', a ritmo più rapido':v< -.005?', ma rallenta':'';
 else if(n< -.005)text+=v< -.005?', con contrazione più intensa':v>.005?', ma la contrazione si attenua':'';
 if(finite(a)&&Math.abs(a)>.005&&Math.abs(v)>.005&&v*a<0)text+='; il cambiamento di ritmo perde intensità';
 return text;
}
function sectorSentence(x){

 if(x.measurement==='RATE')return x.label+': '+changeWord(v)+' rispetto alla rilevazione precedente.';
 if(x.measurement==='BALANCE'||x.measurement==='INDEX')return x.label+': indicatore '+changeWord(v)+'; '+(n>0?'saldo/livello positivo':n<0?'saldo/livello negativo':'livello zero')+'.';
 return x.label+': '+changeWord(v)+'.';
}
function countryStory(c){

 const eps=.005,infUp=i&&i.velocity_pp>eps,infDown=i&&i.velocity_pp< -eps,weakJobs=u&&u.velocity_pp>eps,strongJobs=u&&u.velocity_pp< -eps;
 const inftext=i?i.label+' al '+fmt(i.level,1)+'% ('+i.reference_period+'), '+changeWord(i.velocity_pp)+(head&&head!==i?'; '+head.label+' '+changeWord(head.velocity_pp)+' ('+head.reference_period+')':'')+'.':'Dinamica dei prezzi non verificata.';
 const labtext=u?'Disoccupazione '+changeWord(u.velocity_pp)+' ('+fmt(u.level,1)+'%, '+u.reference_period+'). '+(jobs?jobs.label+' '+momentumWords(jobs)+'.':''):'Dinamica del lavoro incompleta.';

}

function exactRelativePricing(a,b){
 const api=window.FXQuantPricingHistory;if(!api)return null;
 const A=api.country(extra.oisHistory,a,0),B=api.country(extra.oisHistory,b,0);
 if(!A||!B)return null;
 const x=api.horizonMoves(A).find(r=>r.days===5),y=api.horizonMoves(B).find(r=>r.days===5);
 const good=r=>r&&finite(r.bp)&&r.derived===false&&!r.approximateWindow&&validDay(r.from)&&validDay(r.to)&&!/rollover|STIMA/i.test(r.basis||'');
 if(!good(x)||!good(y)||x.from!==y.from||x.to!==y.to||(Date.parse(day()+'T12:00:00Z')-Date.parse(x.to+'T12:00:00Z'))/864e5>7)return null;
 return {bp:x.bp-y.bp,from:x.from,to:x.to,basis:A.kind+' / '+B.kind,comparable:A.kind===B.kind&&['OIS','FUTURES'].includes(A.kind)};
}
function pairEvidence(a,b){

 const favored=x?.favored||null,factor=favored===a?1:favored===b?-1:0;
 const cotOK=A.q&&B.q&&A.q.date===B.q.date&&finite(A.oi)&&finite(B.oi)&&A.oi>0&&B.oi>0;
 const flow=cotOK?100*(A.q.delta1/A.oi-B.q.delta1/B.oi):null;
 const fxside=finite(px)&&Math.abs(px)>=.15?Math.sign(px):0,shortside=finite(px5)&&Math.abs(px5)>=.05?Math.sign(px5):0;
 const pside=rp&&Math.abs(rp.bp)>.05?Math.sign(rp.bp):0;
 const summary=!favored?'Nessun vantaggio fondamentale distinto':x.thesisStrength==='CONTRASTATA'?'Tesi a favore di '+favored+', ma contrastata':'Tesi stimata a favore di '+favored;
 const timing=!favored?'Il movimento del cambio non basta a identificare una tesi.':fxside===-factor||shortside===-factor?'Il prezzo non conferma pienamente la direzione stimata: non anticipare l’ingresso.':fxside===factor&&shortside===factor?'Il prezzo è coerente su 5 e 20 fixing; manca ancora la verifica tecnica e del rischio.':'Il prezzo non offre una conferma uniforme.';
 const rateText=rp?'Il differenziale dei riferimenti 6M '+direction(rp.bp,.05)+' (base meno controvaluta: '+bp(rp.bp)+'). '+dateIT(rp.from)+'–'+dateIT(rp.to)+'. '+(rp.comparable?'Confronto indicativo fra strumenti dello stesso tipo.':'Strumenti diversi: confronto indicativo, non spread OIS puro.'):'Manca un confronto settimanale omogeneo per date e contratti dei riferimenti monetari. Non calcoliamo una variazione relativa.';
 const flowText=cotOK?'Rispetto all’OI corrente di ciascun mercato, il netto settimanale '+(Math.abs(flow)<.005?'cambia in misura relativa simile':flow>0?'migliora maggiormente (o peggiora meno) per '+a:'migliora maggiormente (o peggiora meno) per '+b)+'. Non sono flussi spot.':'COT non confrontabile sulla stessa rilevazione.';

function commonRisk(streams,today){
 const unavailable=why=>({ok:false,why});
 if(!streams||!riskCore.every(k=>Array.isArray(streams[k]?.history)))return unavailable('Mancano storici di azionario, volatilità o credito.');
 const maps=Object.fromEntries(riskCore.map(k=>[k,new Map(streams[k].history.filter(x=>Array.isArray(x)&&/^\d{4}-\d{2}-\d{2}$/.test(x[0])&&x[0]<=today&&finite(x[1])&&x[1]>0))]));
 const dates=[...maps.SP500.keys()].filter(d=>riskCore.every(k=>maps[k].has(d))).sort();
 if(dates.length<6)return unavailable('Mancano sei osservazioni comuni.');
 const end=dates.at(-1),previous=dates.at(-2),start=dates.at(-6),gap=(x,y)=>(Date.parse(x+'T12:00:00Z')-Date.parse(y+'T12:00:00Z'))/864e5;
 if(gap(today,end)>6||gap(end,start)>14)return unavailable('La finestra comune è troppo vecchia o troppo discontinua (ultima data '+end+').');
 const moves=from=>Object.fromEntries(riskCore.map(k=>[k,k==='VIX'?maps[k].get(end)-maps[k].get(from):k.includes('OAS')?100*(maps[k].get(end)-maps[k].get(from)):100*(maps[k].get(end)/maps[k].get(from)-1)]));
 const recent=moves(previous),week=moves(start);
 const vote=m=>{const eq=m.SP500<-.1&&m.NASDAQCOM<-.1?-1:m.SP500>.1&&m.NASDAQCOM>.1?1:0,v=m.VIX>.25?-1:m.VIX<-.25?1:0,cr=m.HY_OAS>1&&m.IG_OAS>=0?-1:m.HY_OAS< -1&&m.IG_OAS<=0?1:0;return {eq,v,cr,state:eq&&eq===v&&v===cr?(eq===-1?'pressure':'relief'):'mixed'}};
 return {ok:true,end,previous,start,recent,week,short:vote(recent),medium:vote(week)};
}
function crossRiskStory(){
 const q=commonRisk(loaded.risk?data.risk?.streams:null,day());
 if(!q.ok)return {q,title:'Rischio non classificabile',what:q.why,meaning:'Le chiusure con date differenti non danno un segnale comune.',watch:'Verificare i prossimi dati allineati.'};
 const d=q.short.state,m=q.medium.state;
 const title=m==='pressure'?(d==='relief'?'Rimbalzo recente, ma la pressione sul rischio resta':'Pressione sul rischio nelle ultime cinque osservazioni'):m==='relief'?(d==='pressure'?'Il recupero incontra nuove tensioni':'Il rischio USA mostra segnali di distensione'):d==='pressure'?'L’ultima finestra comune mostra tensione':d==='relief'?'Distensione recente, quadro più ampio misto':'Azioni, volatilità e credito non danno un segnale uniforme';
 const word=(x,eps)=>x>eps?'sale':x< -eps?'scende':'varia poco';
 const describe=(x)=>'S&P 500 '+word(x.SP500,.1)+', Nasdaq '+word(x.NASDAQCOM,.1)+', VIX '+word(x.VIX,.25)+', HY '+word(x.HY_OAS,1)+' e IG '+word(x.IG_OAS,1)+'.';

 return {q,title,what:'Ultime cinque variazioni comuni fino al '+dateIT(q.end)+': '+describe(q.week)+' Ultima variazione comune: '+describe(q.recent),meaning,watch:'Verificare se azioni, VIX e spread continuano a confermarsi; confrontare poi differenziali FX e prezzo. Non dedurre automaticamente forza USD o JPY.'};

 return '<section id="studio-research" class="research-dock"><div class="eyebrow">ASPETTATIVE MONETARIE / G8</div><h2>Le otto curve: cosa sta cambiando</h2><p class="note">OIS, futures e proxy sono distinti. I tenori mancanti non sono interpolati.</p><div class="native-curve-grid">'+cards+'</div><section class="panel section-gap"><h2>'+flag[c]+' '+c+' · curva e repricing</h2><p>'+safe(monetaryRead(m)[0])+'</p>'+plainRead(...monetaryRead(m))+'<div class="grid2"><div>'+nativeChart([{name:'Ultima rilevazione',points:pts(rows,'rate')},{name:'Riferimento settimanale',points:rows.filter(p=>finite(p.week?.levelPrev)).map(p=>({date:p.tenor==='3m'?'03M':p.tenor==='6m'?'06M':'12M',value:p.week.levelPrev}))}], '%',tenorConnect)+'</div><div class="tablewrap"><table><thead><tr><th>Tenore</th><th>Livello</th><th>1D</th><th>1W</th><th>Data</th><th>Contratto</th></tr></thead><tbody>'+compare+'</tbody></table></div></div><p class="note">'+safe(m.source)+' · '+safe(m.quality)+'. Confronti certificati dal motore di pricing.</p></section><section class="panel section-gap"><h2>Storico monetario · '+c+'</h2>'+controlsNative([[30,'30 giorni'],[90,'90 giorni'],[0,'Tutto']],rateDays,'selectRateDays')+(h?nativeChart(tenors.map(t=>({name:t.toUpperCase(),points:h.tenors[t].map(p=>({...p,value:p.rate}))})),'%',window.FXQuantPricingHistory.connect):noEvidence('Storico non verificato'))+monetaryHistoryRead(h)+'<p class="note">Le interruzioni indicano date mancanti o cambi di contratto. I punti vuoti sono riferimenti ricostruiti.</p></section><section class="panel section-gap"><h2>Governativi · '+c+'</h2>'+nativeChart(gseries,'%')+governmentRead(gseries)+'<p class="note">Il movimento del front-end non equivale a quello del lungo termine; non attribuiamo tutto alla banca centrale.</p></section></section>';

function cotModel(c){
 const a=extra.cotHistory?.[c],engine=window.FXQuantCOTDeskV26;if(!a||!engine||!Array.isArray(a.dates))return null;
 const keys=['net','long','short','netoi','percentile'];if(keys.some(k=>!Array.isArray(a[k])||a[k].length!==a.dates.length))return null;
 const hist=a.dates.map((date,i)=>({date,...Object.fromEntries(keys.map(k=>[k,a[k][i]]))})).sort((a,b)=>a.date.localeCompare(b.date));
 if(hist.length<9||!hist.every((x,i)=>validDay(x.date)&&x.date<=day()&&(!i||x.date>hist[i-1].date)&&keys.every(k=>finite(x[k]))&&Math.abs(x.long-x.short-x.net)<1.1))return null;
 const fx=window.FXQuantCOTEvidence?.priceEvidence(c,hist,data.prices,day()),last=hist.at(-1),prev=hist.at(-2);
 const q=engine.statistics({ccy:c,hist,price1:fx?.price1??null,priceState:fx?.priceState||'non conclusivo',priceRow:fx?.priceRow},extra.cotPrior);
 return q?{q,hist,fx,last,prev}:null;
}

function nativeCot(){
 const all=FX.map(c=>cotModel(c)).filter(Boolean);if(!all.length)return noEvidence('Storico CFTC non disponibile');
 const ordered=all.sort((a,b)=>(b.q.rounded??-1)-(a.q.rounded??-1)),a=all.find(a=>a.q.ccy===state.ccy)||all[0],q=a.q,c=q.ccy,reading=window.FXQuantCOTDeskV26.reading(q);
 const rows=ordered.map(({q:x,last})=>'<tr><td><button onclick="selectCotCountry(\''+x.ccy+'\')">'+flag[x.ccy]+' '+x.ccy+'</button></td><td>'+cell(x.net,'',0)+'</td><td>'+cell(x.delta1,'',0)+'</td><td>'+cell(x.delta4,'',0)+'</td><td>'+cell(x.dLong,'',0)+'</td><td>'+cell(x.dShort,'',0)+'</td><td class="'+(x.crowd?'amber':'')+'">'+sign(last.netoi,1)+'%</td><td class="'+(x.rounded>=80?'green':x.rounded!==null&&x.rounded<=20?'native-purple':'')+'">'+(x.rounded===null?'—':x.rounded)+'</td><td>'+ (finite(x.z)?sign(x.z,2):'—')+'</td><td>'+safe(x.level)+'</td></tr>').join('');
 const h=a.hist.slice(-cotWeeks),p=(key)=>h.map(r=>({date:r.date,value:r[key]}));let series=cotMode==='gross'?[{name:'Long',points:p('long')},{name:'Short',points:p('short')}]:cotMode==='flow'?[{name:'Δ Net 1W',points:h.slice(1).map((r,i)=>({date:r.date,value:r.net-h[i].net}))}]:[{name:cotMode==='netoi'?'Net/OI':'Posizione netta',points:p(cotMode)}];
 const pr=a.fx?.prices||[];const price=pr.map(r=>({date:r.date||r.label,value:r.value??r.price})).filter(p=>finite(p.value));
 return '<section id="studio-research" class="research-dock"><div class="eyebrow">CFTC / LEGACY NON-COMMERCIAL</div><h2>Posizionamento G8 · '+safe(dateIT(q.date))+'</h2><p class="note">Percentile e Z-score del motore canonico (104 settimane precedenti). Stock, non ordini spot.</p><div class="panel"><div class="tablewrap"><table class="native-cot-table"><thead><tr><th>Valuta</th><th>Net</th><th>Δ 1W</th><th>Δ 4W</th><th>Δ Long</th><th>Δ Short</th><th>Net/OI</th><th>P104</th><th>Z104</th><th>Fascia</th></tr></thead><tbody>'+rows+'</tbody></table></div></div><section class="panel section-gap"><h2>'+flag[c]+' '+c+' · Cosa vedo davvero</h2><p>'+safe(reading?.fact)+'</p>'+simpleCot(q)+fold('Approfondimento quantitativo','<p>'+safe(reading?.judgment)+'</p><p>'+safe(reading?.verify)+'</p>')+controlsNative(FX.map(c=>[c,c]),c,'selectCotCountry')+'</section><section class="panel section-gap"><h2>Grafici COT e prezzo</h2>'+controlsNative([['net','Net'],['gross','Long / Short'],['flow','Δ settimanale'],['netoi','Net/OI']],cotMode,'selectCotMode')+controlsNative([[13,'13W'],[26,'26W'],[52,'52W'],[104,'104W']],cotWeeks,'selectCotWeeks')+'<div class="grid2"><div>'+nativeChart(series,cotMode==='netoi'?'%':'contratti')+'</div><div>'+nativeChart([{name:a.fx?.priceRow?.priceLabel||'Fixing BCE',points:price.slice(-cotWeeks)}])+'<p>'+safe(reading?.price)+'</p></div></div><p class="note">Estremo non significa inversione. Z-score e percentile non sono segnali di ingresso.</p></section></section>';
}

function researchDock(){if(state.page==='rates')return nativeRates();if(state.page==='macro')return nativeMacro();if(state.page==='fx')return state.fxmode==='cot'?nativeCot():state.fxmode==='pairs'?nativeFX():'';if(state.page==='risk')return nativeRisk();return ''}
function openResearch(route){const map={macro:'macro',rates:'rates',banks:'rates',currencies:'fx',pairs:'fx',cot:'fx',risk:'risk',liquidity:'risk',news:'events',library:'library'};if(!map[route])return true;if(map[route]==='fx')state.fxmode=route==='cot'?'cot':route==='currencies'?'strength':'pairs';if(route==='news'||route==='library'){go(map[route]);return false}if(route==='currencies'){go('fx');return false}go(map[route]);document.getElementById('studio-research')?.scrollIntoView({block:'start'});return false}
