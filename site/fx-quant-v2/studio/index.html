const FX=['USD','EUR','GBP','JPY','CHF','AUD','NZD','CAD'];const flag={USD:'🇺🇸',EUR:'🇪🇺',GBP:'🇬🇧',JPY:'🇯🇵',CHF:'🇨🇭',AUD:'🇦🇺',NZD:'🇳🇿',CAD:'🇨🇦'};const names={USD:'Stati Uniti',EUR:'Eurozona',GBP:'Regno Unito',JPY:'Giappone',CHF:'Svizzera',AUD:'Australia',NZD:'Nuova Zelanda',CAD:'Canada'};const rates={USD:['25/11',4.61,4.85],EUR:['26/11',3.0307478957,3.3053343107],GBP:['26/11',4.6605063283938675,5.143514781680511],JPY:['26/11',1.747,2.704],CHF:['30/09',.287,.586],CAD:['26/11',3.23,3.64],AUD:['25/11',4.586,4.823],NZD:['26/11',3.79,4.69]};const cot={AUD:[81148,263208,374281],CAD:[111591,156639,358186],CHF:[33456,41737,126410],EUR:[230074,372784,866032],GBP:[70999,103303,233499],JPY:[258756,142439,390361],NZD:[17291,80536,137149],USD:[36596,23251,55775]};const macro={AUD:[['Spesa famiglie (nominale)','2026-09',2.13,.17,.23]],CAD:[['PIL reale mensile','2026-08',.81,-.15,-.18],['Retail reale','2026-09',.97,-.46,-1.12]],CHF:[['Produzione industriale','2026-09',-4,-7.75,1.1],['Retail reale','2026-09',.86,-.47,-.4]],EUR:[['Produzione industriale','2026-09',-.65,-.24,.34],['Vendite al dettaglio reali','2026-09',-.48,-.35,0]],GBP:[['Produzione','2026-09',.03,.53,.23],['Retail reale','2026-10',.45,-.2,.2]],JPY:[['Produzione industriale','2026-09',.16,-1.08,-.78]],NZD:[['Retail reale','2026Q3',2.16,2.57,3.87]],USD:[['Produzione industriale','2026-10',.33,-.18,-.13],['Consumi reali','2026-10',.95,-.08,-.02]]};let prices=[{AUD:1.5904,CAD:1.5606,CHF:.9194,EUR:1,GBP:.8338,JPY:175.68,NZD:1.9823,USD:1.1172},{AUD:1.6487,CAD:1.5723,CHF:.9223,EUR:1,GBP:.83735,JPY:174.35,NZD:1.9968,USD:1.099},{AUD:1.6431,CAD:1.5608,CHF:.9157,EUR:1,GBP:.83504,JPY:174.81,NZD:1.999,USD:1.0957}];let market=[['S&P 500',7182.78,-.2543,'%','25/11'],['Nasdaq',23585.8,-.6225,'%','25/11'],['VIX',26.8,-1.49,' pt','26/11'],['HY OAS',3.72,9,' pb','24/11'],['Treasury 10Y',4.85,null,'','25/11'],['IG OAS',.98,1,' pb','24/11'],['Dow Jones',50182.95,.3284,'%','25/11'],['Euro Stoxx 50',6014.74,2.0406,'%','26/11']];let events const routeList=[['home','Control Room'],['macro','Macro'],['rates','Tassi'],['fx','Forex'],['risk','Cross-Asset'],['events','Calendario'],['library','Report']];const live=location.protocol==='file:'?'https://robybizkit77-blip.github.io/global-macro-fx-quant/site/fx-quant-v2/next/':new URL('../next/',location.href).href;let state={page:'home',ccy:'USD',base:'EUR',quote:'USD',days:20,fxmode:'pairs'};const fmt=(n,d=2)=>Number.isFinite(n)?Number(n).toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d}):"—";const sign=(n,d=2)=>`${n>0?'+':''}${fmt(n,d)}`;const tone=n=>n>0?'green':n<0?'red':'muted';const pRet=(a,b,w=20)=>100*((prices[2][b]/prices[2][a])/(prices[w===5?1:0][b]/prices[w===5?1:0][a])-1);const basket=(c,w=20)=>FX.filter(x=>x!==c).reduce((s,x)=>s+pRet(c,x,w),0)/7;const net=c=>cot[c][0]-cot[c][1];const oi=c=>100*net(c)/cot[c][2];const canonical=['EUR','GBP','AUD','NZD','USD','CAD','CHF','JPY'];const pairs=canonical.flatMap((a,i)=>canonical.slice(i+1).map(b=>({a,b,p:pRet(a,b,20)})));let topPairs=[...pairs].sort((a,b)=>Math.abs(b.p)-Math.abs(a.p));const cell=(n,unit='',d=2)=>`<span class="${tone(n)}">${sign(n,d)}${unit}</span>`;const cbutton=c=>`<button class="ccybtn" onclick="chooseCurrency('${c}')">${flag[c]} ${c}</button>`;const srcLink=(r,label='Apri il dossier completo')=>`<a class="link" href="${live}#${r}" onclick="return openResearch('${r}')">${label} →</a>`;const heading=(k,t,p)=>`<div class="view-title"><div class="eyebrow">${k}</div><h1>${t}</h1><p>${p}</p></div>`;const eventsHTML=(n=4)=>events.slice(0,n).map(e=>`<div class="event"><span class="day">${e[0]}</span><div><b>${flag[e[1]]} ${e[2]}</b><small>${e[3]}</small>${e[4]?`<a class="link" href="${e[4]}" target="_blank" rel="noopener">Fonte</a>`:''}</div></div>`).join('');function metrics(items){return `<div class="pulse">${items.map(([name,v,ch,u,date])=>`<div class="metric"><div class="label">${name}</div><div class="v">${fmt(v)}${name.includes('OAS')||name.includes('Treasury')?'%' function home(){return `<div class="hero"><div><div class="eyebrow">01 / lettura della seduta</div><h1>Il mercato non parla con una sola voce.</h1><p>Azionario USA in calo al 25/11, VIX in discesa al 26/11 e spread HY in allargamento al 24/11. Le evidenze sono miste e non simultanee: non classifico il regime come risk-on o risk-off.</p></div><div class="watch"><div class="eyebrow amber">Priorità di ricerca</div><p>Verificare l'allineamento tra azionario, volatilità e credito alla prossima chiusura comune. Lunedì: PIL svizzero. Non dedurre un trade da queste osservazioni.</p></div></div>${metrics(market.slice(0,5))}<div class="main-grid"><section class="panel"><div class="panel-head"><div><h2>Mappa valutaria G8</h2><small>Il prezzo prima, i driver da verificare</small></div><button onclick="go('fx')">Forex →</button></div>${matrix()}</section><div class="stack"><section class="panel"><div class="panel-head"><h2>Movimenti più ampi</h2><small>20 sedute</small></div>${pairRows(topPairs.slice(0,3))}<p class="note">Non è una selezione trade; nessun ranking fondamentale sostituito.</p></section><section class="panel"><div class="panel-head"><h2>Prossimi catalizzatori</h2><button onclick="go('events')">Tutti →</button></div>${eventsHTML(3)}</section></div></div>`}

const day=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Rome',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());

const source=(u,label='Fonte originale')=>urlSafe(u)?`<a class="link" href="${urlSafe(u)}" target="_blank" rel="noopener noreferrer">${safe(label)} ↗</a>`:'';

const judge=(title,what,why,watch)=>`<section class="judgement"><div class="eyebrow">Il giudizio del desk</div><h2>${title}</h2><p>${what}</p><p><b>Perché conta.</b> ${why}</p><p class="monitor"><b>Cosa monitorare.</b> ${watch}</p></section>`;
const stories={USD:['L’attività cresce, ma perde slancio','Produzione e consumi reali continuano a crescere nel campione di ottobre; entrambe le misure di momentum rallentano.','Non è una contrazione: il livello resta positivo. Se la frenata prosegue, potrebbe ridursi il sostegno dei tassi al dollaro.','Consumi reali, occupazione e aspettative Fed.'],EUR:['La debolezza dell’attività è ancora visibile','Nel campione di settembre produzione industriale e vendite reali sono in contrazione.','La produzione mostra una frenata meno rapida del peggioramento, ma il consumo resta debole. Non basta per dire che il ciclo ha invertito.','Inflazione flash e prossimi dati di attività, poi risposta della curva BCE.'],GBP:['Produzione in recupero, consumi meno dinamici','La produzione passa a una crescita marginale; il volume retail cresce ma a un ritmo più lento.','Le due componenti raccontano una ripresa disomogenea, non un’accelerazione generalizzata.','Salari, servizi e consumi reali per capire quanto margine ha la BoE.'],JPY:['L’industria perde velocità','La crescita della produzione è ancora marginalmente positiva ma il ritmo si è ridotto.','Il rallentamento industriale può limitare la sostenibilità di una stretta; non determina da solo la scelta della BoJ.','Salari reali, consumi e indicazioni della BoJ.'],CHF:['Industria in difficoltà, consumo più resistente','La produzione industriale è in contrazione; il retail reale cresce ma rallenta.','La domanda interna non compensa necessariamente la debolezza industriale.','PIL svizzero, inflazione e reazione del franco.'],AUD:['La spesa nominale delle famiglie accelera','La spesa nominale mostra una crescita più rapida nel campione disponibile.','Non sappiamo quanta parte dipenda da prezzi più alti: non è prova di forza dei consumi reali.','Volumi reali, lavoro e persistenza dell’inflazione.'],NZD:['I consumi reali mostrano un recupero','Il volume retail del terzo trimestre cresce e recupera velocità rispetto al precedente.','È un segnale favorevole della domanda, ma da solo non identifica l’intero ciclo.','Lavoro, credito e risposta delle attese RBNZ.'],CAD:['La crescita prosegue a ritmo più lento','PIL mensile e vendite reali sono ancora in espansione nel campione, con momentum in calo.','Il deterioramento è di ritmo, non una contrazione già dimostrata.','Consumi, lavoro e condizioni del credito.']};
function activityReading(c){const a=macro[c]||[];if(!loaded.macro)return stories[c];if(!a.length)return ['Attività da verificare','Manca una misura di attività utilizzabile.','Nessuna conclusione sul ciclo senza dati.','Attendere la prossima osservazione.'];const pos=a.filter(x=>x[2]>0).length,neg=a.filter(x=>x[2]<0).length,up=a.filter(x=>x[3]>0).length,down=a.filter(x=>x[3]<0).length;return [pos===a.length?(down===a.length?'L’attività cresce, ma rallenta':up===a.length?'Le misure di attività migliorano':'Crescita con segnali diversi'):neg===a.length?'Le misure di attività si contraggono':'Attività disomogenea',a.map(x=>`${safe(x[0])}: ${x[2]>0?'cresce':x[2]<0?'si contrae':'è stabile'}; il ritmo ${x[3]>0?'migliora':x[3]<0?'peggiora':'resta stabile'}.`).join(' '),'Il campione di attività non rappresenta l’intero ciclo. Le misure nominali non sono crescita reale.','Verificare inflazione, lavoro, domanda reale e trasmissione monetaria.'];}
function macroTable(c){return `<div class="tablewrap"><table><thead><tr><th>Indicatore</th><th>Momentum</th><th>Velocità</th><th>Accel.</th></tr></thead><tbody>${(macro[c]||[]).map(x=>`<tr><td style="white-space:normal">${safe(x[0])}<br><small>${safe(x[1])}</small></td><td>${cell(x[2],'%')}</td><td>${cell(x[3],' pp')}</td><td>${cell(x[4],' pp')}</td></tr>`).join('')}</tbody></table></div><p class="note">3M/3M per serie mensili del campione; retail NZD trimestrale. Storici revisionati, non point-in-time.</p>`}
function macroPillars(c){const row=data.macro?.countries?.[c];if(!row)return '<p class="note">PIL, inflazione e lavoro completi disponibili nel motore originale; non caricati nella fotografia locale.</p>'+srcLink('macro');const g=row.growth,i=row.inflation,l=row.labour;const dir=x=>x==='UP'?'in aumento':x==='DOWN'?'in calo':x==='FLAT'?'stabile':'direzione non verificata';return `<div class="editorial-list"><article><strong>Crescita</strong><p>${finite(g?.reported_value)?`PIL ${fmt(g.reported_value,1)}% (${safe(g.reference_quarter)}; ${g.reported_unit==='PERCENT_SAAR_ANNUALIZED'?'annualizzato':'unità originale'}). ${finite(g.prior_documented_quarter?.reported_value)?'Prima '+fmt(g.prior_documented_quarter.reported_value,1)+'%.':''}`:'Osservazione non disponibile.'}</p>${source(g?.publisher_source)}</article><article><strong>Inflazione</strong><p>${finite(i?.observation_value)?fmt(i.observation_value,1)+'% · '+dir(i.change_direction)+' · '+safe(i.observation_period):'Osservazione non disponibile.'}</p></article><article><strong>Lavoro</strong><p>${finite(l?.observation_value)?'Disoccupazione '+fmt(l.observation_value,1)+'% · '+dir(l.change_direction)+' · '+safe(l.observation_period):'Osservazione non disponibile.'}</p></article></div>`}
function macroEditorial(){const c=state.ccy;const v=activityReading(c);return heading('02 / global macro',`${flag[c]} ${names[c]} · Il ciclo economico`,'La lettura parte dall’economia, non dal punteggio.')+ccySelector()+judge(...v)+`<div class="grid2"><section class="panel"><h2>Cosa cambia nell’attività</h2><div class="editorial-list">${(macro[c]||[]).map(x=>`<article><strong>${safe(x[0])}</strong><p>${x[2]>=0?'Espansione':'Contrazione'} · ritmo ${x[3]>0?'in miglioramento':x[3]<0?'in peggioramento':'stabile'}. <span class="plain-chip">${safe(x[1])}</span></p></article>`).join('')}</div>${fold('Apri dati, velocità e accelerazione',macroTable(c))}</section><section class="panel"><h2>Crescita, inflazione e lavoro</h2>${macroPillars(c)}${srcLink('macro','Dossier macro completo · servizi, case, salari, credito e storico')}</section></div>`}
function cbReading(c){let b=data.cb?.[c],o=data.ois?.currencies?.[c];if(!b)return '<p class="evidence-flag">WANT/CAN non caricato: consulta il dossier originale.</p>'+srcLink('banks');return `<div class="editorial-list"><article><strong>WANT · Cosa comunica</strong><p>${safe(b.context||b.stance||'Comunicazione da verificare')}</p><small>Decisione ${dateIT(b.last_date)}</small></article><article><strong>CAN · Cosa le consente l’economia</strong><p>${safe(activityReading(c)[1])} L’inflazione e il lavoro vanno verificati insieme.</p>${srcLink('banks','WANT/CAN completo')}</article><article><strong>Il mercato</strong><p>${finite(o?.horizons?.['6m']?.rate)?'Riferimento 6M '+fmt(o.horizons['6m'].rate,2)+'% · '+safe(o.kind)+' · '+dateIT(o.horizons['6m'].as_of)+'. Non assimilare futures e OIS.':'Riferimento monetario non disponibile.'}</p></article></div>`}
function ratesEditorial(){const c=state.ccy,r=rates[c],spread=(r[2]-r[1])*100;return heading('03 / politica monetaria e tassi','Cosa vuole la banca. Cosa prezza il mercato.','Il front-end e il lungo termine rispondono a driver diversi.')+ccySelector()+judge(`${flag[c]} ${c} · Curva ${spread>0?'positiva':spread<0?'invertita':'piatta'}`,`Il rendimento a dieci anni è ${spread>0?'superiore':spread<0?'inferiore':'uguale'} al due anni (dati ${safe(r[0])}).`,'La pendenza della curva non indica da sola la prossima decisione della banca centrale. Il lungo termine incorpora anche crescita, inflazione e premi per il rischio.','Verificare il repricing monetario 6M, separato dai rendimenti governativi. '+(c==='CHF'&&r[0]==='30/09'?'Il riferimento CHF è datato: evitare confronti operativi.':''))+`<div class="grid2"><section class="panel"><h2>Politica monetaria · ${c}</h2>${cbReading(c)}${srcLink('rates','Curve monetarie e movimenti 1D/1W')}</section><section class="panel"><h2>Rendimenti governativi G8</h2><p class="note">Livelli e date, non una graduatoria hawkish.</p><div class="tablewrap"><table><thead><tr><th>Paese</th><th>2Y</th><th>10Y</th><th>Data</th></tr></thead><tbody>${FX.map(k=>`<tr><td>${cbutton(k)}</td><td>${fmt(rates[k][1])}%</td><td>${fmt(rates[k][2])}%</td><td>${safe(rates[k][0])}</td></tr>`).join('')}</tbody></table></div>${srcLink('rates','Storico e differenziali omogenei')}</section></div>`}

function homeEditorial(){const strongest=[...FX].sort((a,b)=>basket(b)-basket(a)),first=strongest[0],last=strongest.at(-1);const risk=market.slice(0,4);return `<div class="hero"><div><div class="eyebrow">01 / lettura della seduta</div><h1>Mercati da leggere insieme, non in isolamento.</h1><p>${first} è la valuta più forte e ${last} la più debole nel confronto dei fixing BCE delle ultime venti sedute. Azionario, volatilità e credito hanno date differenti: non forziamo un giudizio sul regime di rischio.</p></div><div class="watch"><div class="eyebrow amber">Giudizio operativo</div><p>${estimate?'Usa il vantaggio fondamentale stimato dal motore, poi verifica prezzo e rischio: nessun ingresso automatico.':'Il prezzo da solo non basta: verifica macro e repricing prima di scegliere una coppia.'}</p></div></div>${metrics(market.slice(0,5))}<div class="main-grid"><section class="panel"><div class="panel-head"><div><h2>Mappa valutaria G8</h2><small>Direzione e ritmo del prezzo</small></div><button onclick="go('fx')">Forex →</button></div>${matrixEditorial()}</section><div class="stack"><section class="panel"><div class="panel-head"><h2>${estimate?'Tesi da verificare':'Movimenti più ampi'}</h2><small>${estimate?'Motore esistente':'20 sedute'}</small></div>${estimate?estimate.pairs.slice(0,3).map(x=>`<button class="pairrow" onclick="choosePair('${x.base}','${x.quote}')"><div><strong>${safe(x.name)}</strong><br><small>${safe(x.thesisStrength)} · ${safe(x.tradeAttractiveness)}</small></div><span class="blue">›</span></button>`).join(''):pairRows(topPairs.slice(0,3))}<p class="note">Priorità di ricerca, non segnali.</p></section><section class="panel"><div class="panel-head"><h2>Prossimi catalizzatori</h2><button onclick="go('events')">Tutti →</button></div>${eventsHTML(3)}</section></div></div>`}
function pairEditorial(){const a=state.base,b=state.quote,x=estimate?.pairs?.find(v=>v.key===a+b||v.key===b+a);const m=pRet(a,b),recent=pRet(a,b,5);return judge(`${a}/${b} · ${x?.favored?'Tesi a favore di '+safe(x.favored):x?'Vantaggio non distinto':'Tesi fondamentale da verificare'}`,x?safe(x.story):`Il cambio ${m>=0?'sale':'scende'} nelle ultime venti sedute. ${Math.sign(m)===Math.sign(recent)?'Il movimento recente va nella stessa direzione.':'Il movimento recente va in direzione opposta.'}`,x?safe(x.thesisReason||'La stima fondamentale non equivale a un ingresso.'):'La forza relativa osservata non identifica da sola un vantaggio macro o monetario.',x?safe(x.tradeReason||x.missing):'Confrontare il repricing e la macro delle due valute; poi cercare una conferma del prezzo.')}
function fxEditorial(){const original=fxView();let j;if(state.fxmode==='pairs')j=pairEditorial();else if(state.fxmode==='strength'){const r=[...FX].sort((a,b)=>basket(b,state.days)-basket(a,state.days));j=judge(`${r[0]} guida il movimento relativo`,`Il prezzo premia ${r[0]} e penalizza ${r.at(-1)} nel confronto a ${state.days} sedute.`,'La forza del cambio può anticipare o contraddire macro e tassi. Non è prova di causalità.','Cercare conferme dai differenziali monetari e dal posizionamento.')}else{const r=[...FX].sort((a,b)=>oi(b)-oi(a));j=judge('Dove si concentra il posizionamento',`${r[0]} ha il netto/OI più alto, ${r.at(-1)} il più basso. Rilevazione ${dateIT(cotDate)}.`,'Il dato misura stock di posizioni futures, non flussi spot. Un estremo può persistere.','Verificare nuovi long, nuovi short e velocità nella serie settimanale prima di parlare di riposizionamento.')}return original.replace(/(<div class="controls">[\s\S]*?<\/div>)/,'$1'+j).replace('Tesi operativa: non calcolata nel prototipo.',estimate?'Tesi stimata sopra, nessun ingresso certificato.':'Tesi del motore non disponibile in questa esecuzione.').replace('27/11 BCE',dateIT(priceDates[2])+' BCE').replace('Net / Open Interest · 17 novembre','Net / Open Interest · '+dateIT(cotDate)).replace('Dati 17/11, non flussi spot.','Dati '+dateIT(cotDate)+', non flussi spot.')}
function riskEditorial(){return heading('05 / cross-asset','Rischio: azionario, volatilità e credito','Prima il quadro del mercato, poi gli approfondimenti sui singoli strumenti.')+judge('Il regime non è ancora certificato','Le quotazioni visualizzate possono appartenere a sedute differenti: ogni scheda conserva la data della fonte.','Non confondiamo un movimento del VIX con una conferma simultanea di azioni e credito.','Controllare la prossima finestra comune e la trasmissione ai cambi.')+metrics(market)+`<div class="grid2"><section class="panel"><h2>Mercato obbligazionario</h2><p>Gli spread IG/HY misurano il premio di rischio sul credito negoziato. Un loro allargamento indica maggior premio richiesto, non necessariamente una contrazione dei prestiti.</p>${srcLink('risk','Grafici dei mercati e rischio')}</section><section class="panel"><h2>Credito all’economia reale</h2><p>Riserve bancarie, prestiti e condizioni di concessione vanno letti separatamente per paese.</p>${srcLink('liquidity','Dossier G8 · liquidità e credito')}</section></div>`}
function eventEditorial(){const n=data.news?.items||[];return heading('06 / eventi e notizie','Cosa può cambiare la tesi','Distingui l’evento atteso dal dato pubblicato e dalla reazione effettiva.')+judge('Agenda prima delle previsioni',events.length?`Il prossimo evento nel feed è ${safe(events[0][2])} (${safe(events[0][0])}).`:'Nessun evento verificabile nella finestra caricata.','Senza consenso pre-evento non definiamo una sorpresa; la reazione dei prezzi richiede evidenze separate.','Controllare la fonte ufficiale e poi la risposta dei tassi e dei cambi.')+`<div class="grid2"><section class="panel"><h2>Prossimi eventi</h2>${eventsHTML(8)||'<p class="note">Nessun evento verificato.</p>'}</section><section class="panel"><h2>Ultime osservazioni documentate</h2>${n.length?n.slice(0,5).map(x=>`<article class="event"><div><b>${safe(x.title)}</b><small>${dateIT(x.as_of)} · ${safe(x.source)}</small>${fold('Dettaglio e fonte',`<p>${safe(x.detail)}</p>${source(x.source_url)}`)}</div></article>`).join(''):'<p class="evidence-flag">Feed delle notizie non caricato. Nessuna notizia inventata.</p>'}${srcLink('news')}</section></div>`}
function libraryEditorial(){return heading('07 / research library','La ricerca da leggere','Una sola edizione per categoria nel catalogo pubblicato.')+judge('Prima il briefing, poi gli approfondimenti','Il briefing introduce i catalizzatori della seduta; i report settimanali servono a verificare il contesto e l’evoluzione delle tesi.','Un file raggiungibile non certifica la freschezza o la qualità di una nuova edizione.','Controllare le date nel catalogo prima di usare un report.')+library().split('<div class="grid3">')[1]?.replace(/^/,'<div class="grid3">')}
const urls={prices:'live_data/sections/ECB_G8_PRICE_HISTORY.json',macro:'site/control-room-preview/macro-v3-current-evidence.json',rates:'live_data/sections/NATIVE_RATES_DATA.json',cot:'site/fx-quant-v2/next/cot-official-oi-v1.json',risk:'site/fx-quant-v2/cross-asset-live-data.json',calendar:'live_data/sections/CALENDAR_OPERATIONAL_VIEW.json',news:'live_data/sections/NEWS_PULSE_OPERATIONAL.json',cb:'live_data/sections/NATIVE_CB_DATA.json',ois:'site/fx-quant-v2/ois-pricing-snapshot.json',pairs:'live_data/sections/PAIR_SETUP_OPERATIONAL_VIEW.json',chf:'site/fx-quant-v2/chf-2y-estimate-research.json'};
function readJSON(path){return fetch(ROOT+path,{cache:'no-store',signal:AbortSignal.timeout(7000)}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()})}
function script(name){return new Promise((resolve,reject)=>{const el=document.createElement('script');el.src=ROOT+'site/fx-quant-v2/next/'+name;const timer=setTimeout(()=>{el.remove();reject(Error('timeout'))},7000);el.onload=()=>{clearTimeout(timer);resolve()};el.onerror=()=>{clearTimeout(timer);reject(Error('script unavailable'))};document.head.append(el)})}
function applyFeed(k,j){if(k==='prices'){const rows=(j.rows||[]).filter(r=>validDay(r.Date)&&FX.every(c=>finite(r[c])&&r[c]>0)).sort((a,b)=>a.Date.localeCompare(b.Date));if(rows.length<21||rows.at(-1).Date!==j.last_as_of)throw Error('fixing non validi');const z=[rows.at(-21),rows.at(-6),rows.at(-1)];prices=z;priceDates=z.map(r=>r.Date);topPairs=canonical.flatMap((a,i)=>canonical.slice(i+1).map(b=>({a,b,p:pRet(a,b)}))).sort((a,b)=>Math.abs(b.p)-Math.abs(a.p));}else if(k==='macro'){const rows=j.activity_momentum_research?.countries;if(!rows||!FX.every(c=>Array.isArray(rows[c])&&rows[c].some(x=>finite(x.momentum_pct)&&finite(x.velocity_pp)&&finite(x.acceleration_pp))))throw Error('macro incompleta');for(const c of FX)macro[c]=rows[c].filter(x=>finite(x.momentum_pct)&&finite(x.velocity_pp)&&finite(x.acceleration_pp)).map(x=>[x.label+(x.nominal_not_real?' (nominale)':''),x.reference_period,x.momentum_pct,x.velocity_pp,x.acceleration_pp]);}else if(k==='rates'){if(!FX.every(c=>validDay(j[c]?.date)&&finite(j[c]['2Y'])&&finite(j[c]['10Y'])))throw Error('tassi incompleti');for(const c of FX)rates[c]=[dateIT(j[c].date).slice(0,5),j[c]['2Y'],j[c]['10Y']];}else if(k==='cot'){if(j.schema!=='GMFQ_CFTC_OFFICIAL_OI_V1'||!validDay(j.as_of)||!FX.every(c=>{const x=j.currencies?.[c];return x?.date===j.as_of&&Number.isInteger(x.long)&&Number.isInteger(x.short)&&x.long-x.short===x.net&&Number.isInteger(x.open_interest)&&x.open_interest>0}))throw Error('OI non riconciliato');for(const c of FX){const x=j.currencies[c];cot[c]=[x.long,x.short,x.open_interest]}cotDate=j.as_of;}else if(k==='risk'){const specs=[['SP500','S&P 500'],['NASDAQCOM','Nasdaq'],['VIX','VIX'],['HY_OAS','HY OAS'],['IG_OAS','IG OAS'],['DJIA','Dow Jones'],['SX5E','Euro Stoxx 50']];if(!specs.every(([k])=>validDay(j.streams?.[k]?.date)&&finite(j.streams[k].value)))throw Error('mercati incompleti');market=specs.map(([k,n])=>{const x=j.streams[k],ch=k==='VIX'?x.value-x.previous:k.includes('OAS')?(x.value-x.previous)*100:x.change_1d_pct;return [n,x.value,finite(ch)?ch:null,k==='VIX'?' pt':k.includes('OAS')?' pb':'%',dateIT(x.date).slice(0,5)]});}else if(k==='calendar'){if(!Array.isArray(j.events))throw Error('agenda non valida');events=j.events.filter(x=>x.status==='UPCOMING'&&x.date>=day()&&FX.includes(x.ccy)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,12).map(x=>[dateIT(x.date).slice(0,5),x.ccy,safe(x.title),safe((x.time_local?x.time_local+' '+(x.timezone||''):'Orario da verificare')+' · '+(x.source_family||x.bank||'Fonte ufficiale')),urlSafe(x.source_url)]);}else if(k==='news'&&!Array.isArray(j.items))throw Error('news non valida');data[k]=j;loaded[k]=true;}
let busy=false;async function refreshSources(){if(busy)return;busy=true;const node=document.getElementById('source-state');node.textContent='Lettura dei feed pubblici…';document.getElementById('refresh').disabled=true;estimate=null;delete failed.engine;await Promise.all(Object.entries(urls).map(async([k,p])=>{try{applyFeed(k,await readJSON(p));delete failed[k]}catch(e){failed[k]=true;delete loaded[k];delete data[k]}}));if(['macro','prices','rates','ois','pairs'].every(k=>loaded[k])){try{await Promise.all([script('pair-rankings.js'),script('macro-strength-estimated-v1.js'),script('fx-rates-bridge.js').catch(()=>{})]);const x=window.FXQuantMacroEstimated?.evaluate({observed:data.macro,prices:data.prices,ois:data.ois,rates:data.rates,model:data.pairs,now:day(),rankingFn:window.FXQuantPairRankings?.currencyRanking});if(x?.status==='STIMA_OPERATIVA_NON_VALIDATA')estimate=window.FXQuantRatesBridge?.withChfCurrencyRanking?.(x,data.chf,day())||x;}catch(e){failed.engine=true}}const count=Object.keys(loaded).length;node.textContent=count?`${count}/${Object.keys(urls).length} feed letti · ${estimate?'motore FX disponibile':'motore FX non disponibile'} · date per fonte${Object.keys(failed).length?' · fonti mancanti: '+Object.keys(failed).join(', ')+'; valori residui di fotografia o ultima lettura':''}`:'Feed non raggiungibili · fotografia locale del 27 novembre';document.getElementById('refresh').disabled=false;busy=false;render()}

const researchGroups={macro:[['macro','Ciclo completo e grafici']],rates:[['rates','Curve OIS, governativi e differenziali'],['banks','Banche centrali · WANT/CAN']],fx:[['pairs','Dossier coppie e grafici'],['currencies','Dossier valute G8'],['cot','COT completo · tabella e storico']],risk:[['risk','Grafici cross-asset'],['liquidity','Liquidità e credito']],events:[['news','Calendario e notizie complete']],library:[['library','Catalogo report verificati']]};
const researchTitles={macro:'Ciclo economico · tutti gli indicatori',rates:'Curve monetarie G8 e rendimenti',banks:'Banche centrali · giudizio e fonti',pairs:'Dossier FX · tesi, rischio, prezzo',currencies:'Forza valutaria · dossier G8',cot:'COT · posizionamento, variazioni, percentili',risk:'Cross-asset · grafici e letture',liquidity:'Liquidità e credito · trasmissione',news:'Eventi e notizie',library:'Report e pubblicazioni'};
let researchSelection={}, frameCleanup=null;
function defaultResearch(){return state.page==='rates'?'rates':state.page==='fx'&&state.fxmode==='cot'?'cot':null}
function activeResearch(){const selection=researchSelection[state.page];return selection===undefined?defaultResearch():selection}
function researchDock(){
 const tabs=researchGroups[state.page];if(!tabs)return '';
 const active=activeResearch();
 return '<section id="studio-research" class="research-dock" aria-label="Dossier e grafici completi"><div class="panel-head"><div><div class="eyebrow">EVIDENZE / RICERCA COMPLETA</div><h2>Approfondisci con grafici e letture</h2></div></div><p class="note">Le viste originali, con le loro tabelle, fonti e controlli interattivi. Nessun nuovo calcolo.</p><div class="controls">'+tabs.map(([key,label])=>'<button type="button" data-research-tab="'+key+'" class="'+(active===key?'active':'')+'" aria-pressed="'+(active===key)+'" onclick="openResearch(\''+key+'\')">'+label+'</button>').join('')+'</div><div id="studio-research-body">'+(active?researchFrame(active):'<p class="research-empty">Scegli un dossier per esplorare storico, giudizio e fonti senza lasciare Studio.</p>')+'</div></section>'
}
function researchFrame(key){
 const url=live+'#'+key;
 return '<div class="panel-head"><h3>'+safe(researchTitles[key])+'</h3><a class="link" href="'+safe(url)+'" target="_blank" rel="noopener">Apri a schermo intero ↗</a></div><p id="studio-frame-status" class="research-note" role="status">Caricamento del dossier originale…</p><iframe id="studio-research-frame" class="research-frame" title="'+safe(researchTitles[key])+'" src="'+safe(url)+'" data-research-route="'+key+'"></iframe>'
}
function connectResearchFrame(){
 if(frameCleanup){frameCleanup();frameCleanup=null}
 const frame=document.getElementById('studio-research-frame');if(!frame)return;
 const route=frame.dataset.researchRoute,status=document.getElementById('studio-frame-status');
 let observer=null,resize=null,timer=null,selected=false;
 const clear=()=>{observer?.disconnect();resize?.disconnect();clearTimeout(timer)};
 frameCleanup=()=>{clear();frame.removeEventListener('load',loaded)};
 function loaded(){
  clear();selected=false;
  try{
   const doc=frame.contentDocument;if(!doc||!doc.getElementById('content'))throw Error('Dossier non accessibile');
   doc.getElementById('studio-embedded-style')?.remove();const style=doc.createElement('style');style.id='studio-embedded-style';
   style.textContent='body,html,#app,.app,.workspace{min-height:0!important;height:auto!important;overflow:visible!important}#sidebar,.topbar,.footer,.mobile-overlay{display:none!important}.app{display:block!important;grid-template-columns:none!important}.workspace{margin:0!important;padding:0!important;width:100%!important;max-width:none!important}.content{padding:10px!important;margin:0!important;min-height:0!important;max-width:none!important;width:100%!important}';
   doc.head.append(style);
   const content=doc.getElementById('content');
   const adjust=()=>{const h=Math.ceil(content.getBoundingClientRect().height+24);if(h>100&&Math.abs(frame.clientHeight-h)>2)frame.style.height=h+'px'};
   const ready=()=>{
    if(content.querySelector('.loading-view')||!content.querySelector('h1,h2'))return;
    if(!selected){
     selected=true;
     const c=state.ccy;
     const selectors={macro:'[data-ms-country="'+c+'"]',rates:'[data-ccy="'+c+'"]',banks:'[data-bank-country="'+c+'"]',currencies:'[data-cs-country="'+c+'"]',cot:'[data-ccy="'+c+'"]',liquidity:'[data-liq-country="'+c+'"]'};
     let choice=selectors[route]?content.querySelector(selectors[route]):null;
     if(route==='pairs'){const a=state.base,b=state.quote,k=data.pairs?.pairs?.[a+b]?a+b:b+a;choice=content.querySelector('button[data-pair="'+k+'"]')}
     if(choice&&choice.getAttribute('aria-pressed')!=='true')choice.click();
     status.textContent='Dossier originale · usa i controlli e i grafici qui sotto.';
    }
    adjust();
   };
   observer=new frame.contentWindow.MutationObserver(ready);observer.observe(content,{childList:true,subtree:true});
   resize=new frame.contentWindow.ResizeObserver(adjust);resize.observe(content);
   timer=setTimeout(()=>{if(!selected)status.textContent='Caricamento non confermato. Usa il collegamento a schermo intero.'},30000);
   ready();
  }catch(e){status.textContent='Vista integrata non disponibile in questo ambiente. Apri il dossier a schermo intero.'}
 }
 frame.addEventListener('load',loaded);
 if(frame.contentDocument?.readyState==='complete'&&frame.contentDocument?.getElementById('content'))loaded();
}
function openResearch(route){
 const entry=Object.entries(researchGroups).find(([,items])=>items.some(([key])=>key===route));if(!entry)return true;
 const page=entry[0];if(page==='fx')state.fxmode=route==='cot'?'cot':route==='currencies'?'strength':'pairs';
 researchSelection[page]=route;
 if(state.page!==page)go(page);else render();
 document.getElementById('studio-research')?.scrollIntoView({block:'start'});return false
}
const views={home:homeEditorial,macro:macroEditorial,rates:ratesEditorial,fx:fxEditorial,risk:riskEditorial,events:eventEditorial,library:libraryEditorial};
function render(){document.querySelector('#nav').innerHTML=routeList.map(([k,l])=>`<button class="${state.page===k?'active':''}" aria-current="${state.page===k?'page':'false'}" onclick="go('${k}')">${l}</button>`).join('');document.querySelector('#view').innerHTML=views[state.page]()+researchDock();connectResearchFrame();}
function go(p){if(!views[p])return;state.page=p;try{history.replaceState(null,'','#'+p)}catch(_){}render();window.scrollTo({top:0,behavior:'instant'});}function chooseCurrency(c){state.ccy=c;go('macro')}function choosePair(a,b){state.base=a;state.quote=b;state.fxmode='pairs';go('fx')}if(views[location.hash.slice(1)])state.page=location.hash.slice(1);render();if(location.protocol!=='file:')refreshSources();
</script></body></html>
