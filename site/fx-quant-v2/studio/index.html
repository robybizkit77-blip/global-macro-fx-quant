function rateView(){return heading('03 / politica monetaria e rates','Tassi: livello e differenziali','La tabella contiene rendimenti governativi, non aspettative OIS. I confronti relativi richiedono la stessa data.')+`<div class="grid2"><section class="panel"><div class="panel-head"><h2>Curve governative G8</h2><small>Ultime date per paese</small></div><div class="tablewrap"><table><thead><tr><th>Paese</th><th>2Y</th><th>10Y</th><th>2s10s</th><th>Data</th></tr></thead><tbody>${FX.map(c=>`<tr><td>${cbutton(c)}</td><td>${fmt(rates[c][1])}%</td><td>${fmt(rates[c][2])}%</td><td>${sign((rates[c][2]-rates[c][1])*100,0)} pb</td><td class="${c==='CHF'?'amber':''}">${rates[c][0]}</td></tr>`).join('')}</tbody></table></div></section><section class="panel"><h2>Curva e politica monetaria</h2>${ccySelector()}<div class="grid2"><div class="metric"><small>2Y ${state.ccy}</small><div class="v">${fmt(rates[state.ccy][1])}%</div></div><div class="metric"><small>10Y ${state.ccy}</small><div class="v">${fmt(rates[state.ccy][2])}%</div></div></div><div class="detail"><strong>Da distinguere</strong><p>Il 2Y riflette anche le aspettative di policy. Il 10Y comprende altri premi e driver. Le curve OIS e WANT/CAN non sono replicate nel prototipo.</p></div>${srcLink('rates','Curve OIS, futures e repricing') }<br>${srcLink('banks','WANT/CAN delle banche centrali')}</section></div>`}
function hbars(vals){let m=Math.max(1,...vals.map(x=>Math.abs(x[1])));return `<div class="chart">${vals.map(([c,n])=>`<div class="hbar"><b>${c}</b><div class="track"><i class="${n>=0?'pos':'neg'}" style="width:${Math.abs(n)/m*49}%;left:${n>=0?50:50-Math.abs(n)/m*49}%"></i></div><strong class="${tone(n)}">${sign(n)}%</strong></div>`).join('')}</div>`}
function fxView(){const modes=[['pairs','28 coppie'],['strength','Forza G8'],['cot','COT']];let body='';if(state.fxmode==='strength'){body=`<div class="grid2"><section class="panel"><h2>Forza relativa BCE</h2><div class="controls">${[5,20].map(n=>`<button class="${state.days===n?'active':''}" onclick="state.days=${n};render()">${n} sedute</button>`).join('')}</div>${hbars(FX.map(c=>[c,basket(c,state.days)]).sort((a,b)=>b[1]-a[1]))}<p class="note">Media dei sette rendimenti bilaterali, non il punteggio Enhanced.</p></section><section class="panel"><h2>Quadro comparativo</h2>${matrix()}${srcLink('currencies')}</section></div>`}else if(state.fxmode==='cot'){body=`<div class="grid2"><section class="panel"><h2>Net / Open Interest · 17 novembre</h2>${hbars(FX.map(c=>[c,oi(c)]).sort((a,b)=>b[1]-a[1]))}<p class="note">CFTC Legacy Futures Only; denominatori ufficiali del repository.</p></section><section class="panel"><h2>Posizioni non-commercial</h2><div class="tablewrap"><table><thead><tr><th>Valuta</th><th>Long</th><th>Short</th><th>Net</th></tr></thead><tbody>${FX.map(c=>`<tr><td>${cbutton(c)}</td><td>${fmt(cot[c][0],0)}</td><td>${fmt(cot[c][1],0)}</td><td>${cell(net(c),'',0)}</td></tr>`).join('')}</tbody></table></div>${srcLink('cot','Percentili 104W, variazioni, velocità e storico COT')}</section></div>`}else{let a=state.base,b=state.quote,r=rates[a],s=rates[b],same=r[0]===s[0];body=`<div class="main-grid"><section class="panel"><div class="panel-head"><h2>Confronta una coppia</h2><small>27/11 BCE</small></div><div class="controls"><label>Base <select aria-label="Valuta base" onchange="state.base=this.value;if(state.base===state.quote)state.quote=FX.find(c=>c!==state.base);render()">${FX.map(c=>`<option ${c===a?'selected':''}>${c}</option>`).join('')}</select></label><label>Controvaluta <select aria-label="Controvaluta" onchange="state.quote=this.value;if(state.quote===state.base)state.base=FX.find(c=>c!==state.quote);render()">${FX.map(c=>`<option ${c===b?'selected':''}>${c}</option>`).join('')}</select></label></div><h1>${flag[a]} ${a}/${b}</h1><div class="grid3"><div class="metric"><small>Fixing</small><div class="v">${fmt(prices[2][b]/prices[2][a],4)}</div></div><div class="metric"><small>5 sedute</small><div class="v ${tone(pRet(a,b,5))}">${sign(pRet(a,b,5))}%</div></div><div class="metric"><small>20 sedute</small><div class="v ${tone(pRet(a,b))}">${sign(pRet(a,b))}%</div></div></div><div class="detail"><h3>Macro relativa</h3><p>${a}: ${macro[a][0][0]} ${sign(macro[a][0][2])}% (${macro[a][0][1]}). ${b}: ${macro[b][0][0]} ${sign(macro[b][0][2])}% (${macro[b][0][1]}). Misure non necessariamente confrontabili: nessun vantaggio fondamentale dedotto.</p><h3>Tassi governativi</h3><p>${a} 2Y ${fmt(r[1])}% (${r[0]}); ${b} 2Y ${fmt(s[1])}% (${s[0]}). ${same?'Differenziale: '+sign((r[1]-s[1])*100,0)+' pb.':'Date diverse: differenziale non calcolato.'}</p><h3>Positioning</h3><p>Net/OI ${a}: ${sign(oi(a),1)}%; ${b}: ${sign(oi(b),1)}%. Dati 17/11, non flussi spot.</p></div><p class="amber">Tesi operativa: non calcolata nel prototipo.</p>${srcLink('pairs','Apri il motore originale delle 28 coppie')}</section><section class="panel"><div class="panel-head"><h2>28 coppie · movimento</h2><small>Ordine per valore assoluto</small></div>${pairRows(topPairs)}</section></div>`}return heading('04 / forex research','Dalle valute alle coppie','Un’unica area per forza relativa, confronto bilaterale e posizionamento; nessun nuovo modello operativo.')+`<div class="controls">${modes.map(([k,l])=>`<button class="${k===state.fxmode?'active':''}" onclick="state.fxmode='${k}';render()">${l}</button>`).join('')}</div>`+body}
function riskView(){return heading('05 / cross-asset','Mercati e condizioni finanziarie','Prezzi, volatilità e credito obbligazionario non sono equivalenti alle condizioni dei prestiti bancari.')+metrics(market)+`<div class="grid2"><section class="panel"><h2>Regime di rischio · non classificato</h2><div class="detail"><strong>Azionario</strong><p>S&P 500 e Nasdaq scendono al 25/11; Euro Stoxx 50 sale al 26/11. Non è un confronto simultaneo.</p></div><div class="detail"><strong>Credito e volatilità</strong><p>VIX 26,8 al 26/11; HY 372 pb al 24/11. Non basta per stabilire un unico shock di rischio.</p></div>${srcLink('risk','Grafici e dati completi')}</section><section class="panel"><h2>Liquidità e credito bancario</h2><p>Riserve, aggregati monetari, crescita del credito e condizioni di concessione sono nel dossier originale.</p><div class="empty section-gap">Non replicati nel prototipo: dati e fonti rimangono disponibili nel sito attuale.</div>${srcLink('liquidity','Dossier liquidità e credito G8')}<br><a class="link" href="https://robybizkit77-blip.github.io/global-macro-fx-quant/site/fx-quant-v2/cross-asset.html" target="_blank" rel="noopener">Monitor cross-asset completo ↗</a></section></div>`}
function eventsView(){return heading('06 / calendario e notizie','I prossimi catalizzatori','Calendario ufficiale recuperato dal progetto. Consenso non presente nel campione: nessuna sorpresa anticipata.')+`<div class="grid2"><section class="panel"><h2>Agenda macro e banche centrali</h2>${eventsHTML(8)}</section><section class="panel"><h2>Notizie e reazioni</h2><div class="empty section-gap">Il feed delle notizie non è caricato in questo prototipo. Nessuna notizia o attribuzione inventata.</div>${srcLink('news','Calendario completo e notizie del sito')}</section></div>`}
function library(){return heading('07 / research library','La ricerca da leggere','Accesso diretto al catalogo originale. Nessun file viene duplicato né dichiarato aggiornato senza verifica.')+`<div class="grid3">${[['Briefing giornaliero','Forex e commodities'],['Global Macro','Country Book'],['Bank FX','View delle banche'],['Central Bank Sentiment','WANT/CAN'],['Curve OIS','Repricing G8'],['COT','Posizionamento settimanale'],['Cross-Asset','Global Markets Review'],['Pair Selection','Ricerca sulle coppie']].map(([t,d])=>`<section class="panel report"><div class="eyebrow">Report</div><h2>${t}</h2><p>${d}</p>${srcLink('library','Vai al catalogo')}</section>`).join('')}</div>`}

const safe=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const finite=Number.isFinite;
const ROOT=location.protocol==='file:'?'https://robybizkit77-blip.github.io/global-macro-fx-quant/':new URL('../../../',location.href).href;
const data={}, loaded={},failed={};let estimate=null,priceDates=['2026-10-30','2026-11-20','2026-11-27'],cotDate='2026-11-17';
const day=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Rome',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const dateIT=d=>d?String(d).split('T')[0].split('-').reverse().join('/'):'n.d.';
const validDay=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&d<=day();
const urlSafe=u=>typeof u==='string'&&/^https:\/\//.test(u)?safe(u):'';
const source=(u,label='Fonte originale')=>urlSafe(u)?`<a class="link" href="${urlSafe(u)}" target="_blank" rel="noopener noreferrer">${safe(label)} ↗</a>`:'';
const fold=(label,body)=>`<details class="evidence-fold"><summary>${label}</summary>${body}</details>`;
const judge=(title,what,why,watch)=>`<section class="judgement"><div class="eyebrow">Il giudizio del desk</div><h2>${title}</h2><p>${what}</p><p><b>Perché conta.</b> ${why}</p><p class="monitor"><b>Cosa monitorare.</b> ${watch}</p></section>`;
const stories={USD:['L’attività cresce, ma perde slancio','Produzione e consumi reali continuano a crescere nel campione di ottobre; entrambe le misure di momentum rallentano.','Non è una contrazione: il livello resta positivo. Se la frenata prosegue, potrebbe ridursi il sostegno dei tassi al dollaro.','Consumi reali, occupazione e aspettative Fed.'],EUR:['La debolezza dell’attività è ancora visibile','Nel campione di settembre produzione industriale e vendite reali sono in contrazione.','La produzione mostra una frenata meno rapida del peggioramento, ma il consumo resta debole. Non basta per dire che il ciclo ha invertito.','Inflazione flash e prossimi dati di attività, poi risposta della curva BCE.'],GBP:['Produzione in recupero, consumi meno dinamici','La produzione passa a una crescita marginale; il volume retail cresce ma a un ritmo più lento.','Le due componenti raccontano una ripresa disomogenea, non un’accelerazione generalizzata.','Salari, servizi e consumi reali per capire quanto margine ha la BoE.'],JPY:['L’industria perde velocità','La crescita della produzione è ancora marginalmente positiva ma il ritmo si è ridotto.','Il rallentamento industriale può limitare la sostenibilità di una stretta; non determina da solo la scelta della BoJ.','Salari reali, consumi e indicazioni della BoJ.'],CHF:['Industria in difficoltà, consumo più resistente','La produzione industriale è in contrazione; il retail reale cresce ma rallenta.','La domanda interna non compensa necessariamente la debolezza industriale.','PIL svizzero, inflazione e reazione del franco.'],AUD:['La spesa nominale delle famiglie accelera','La spesa nominale mostra una crescita più rapida nel campione disponibile.','Non sappiamo quanta parte dipenda da prezzi più alti: non è prova di forza dei consumi reali.','Volumi reali, lavoro e persistenza dell’inflazione.'],NZD:['I consumi reali mostrano un recupero','Il volume retail del terzo trimestre cresce e recupera velocità rispetto al precedente.','È un segnale favorevole della domanda, ma da solo non identifica l’intero ciclo.','Lavoro, credito e risposta delle attese RBNZ.'],CAD:['La crescita prosegue a ritmo più lento','PIL mensile e vendite reali sono ancora in espansione nel campione, con momentum in calo.','Il deterioramento è di ritmo, non una contrazione già dimostrata.','Consumi, lavoro e condizioni del credito.']};
function activityReading(c){const a=macro[c]||[];if(!loaded.macro)return stories[c];if(!a.length)return ['Attività da verificare','Manca una misura di attività utilizzabile.','Nessuna conclusione sul ciclo senza dati.','Attendere la prossima osservazione.'];const pos=a.filter(x=>x[2]>0).length,neg=a.filter(x=>x[2]<0).length,up=a.filter(x=>x[3]>0).length,down=a.filter(x=>x[3]<0).length;return [pos===a.length?(down===a.length?'L’attività cresce, ma rallenta':up===a.length?'Le misure di attività migliorano':'Crescita con segnali diversi'):neg===a.length?'Le misure di attività si contraggono':'Attività disomogenea',a.map(x=>`${safe(x[0])}: ${x[2]>0?'cresce':x[2]<0?'si contrae':'è stabile'}; il ritmo ${x[3]>0?'migliora':x[3]<0?'peggiora':'resta stabile'}.`).join(' '),'Il campione di attività non rappresenta l’intero ciclo. Le misure nominali non sono crescita reale.','Verificare inflazione, lavoro, domanda reale e trasmissione monetaria.'];}
function macroTable(c){return `<div class="tablewrap"><table><thead><tr><th>Indicatore</th><th>Momentum</th><th>Velocità</th><th>Accel.</th></tr></thead><tbody>${(macro[c]||[]).map(x=>`<tr><td style="white-space:normal">${safe(x[0])}<br><small>${safe(x[1])}</small></td><td>${cell(x[2],'%')}</td><td>${cell(x[3],' pp')}</td><td>${cell(x[4],' pp')}</td></tr>`).join('')}</tbody></table></div><p class="note">3M/3M per serie mensili del campione; retail NZD trimestrale. Storici revisionati, non point-in-time.</p>`}
function macroPillars(c){const row=data.macro?.countries?.[c];if(!row)return '<p class="note">PIL, inflazione e lavoro completi disponibili nel motore originale; non caricati nella fotografia locale.</p>'+srcLink('macro');const g=row.growth,i=row.inflation,l=row.labour;const dir=x=>x==='UP'?'in aumento':x==='DOWN'?'in calo':x==='FLAT'?'stabile':'direzione non verificata';return `<div class="editorial-list"><article><strong>Crescita</strong><p>${finite(g?.reported_value)?`PIL ${fmt(g.reported_value,1)}% (${safe(g.reference_quarter)}; ${g.reported_unit==='PERCENT_SAAR_ANNUALIZED'?'annualizzato':'unità originale'}). ${finite(g.prior_documented_quarter?.reported_value)?'Prima '+fmt(g.prior_documented_quarter.reported_value,1)+'%.':''}`:'Osservazione non disponibile.'}</p>${source(g?.publisher_source)}</article><article><strong>Inflazione</strong><p>${finite(i?.observation_value)?fmt(i.observation_value,1)+'% · '+dir(i.change_direction)+' · '+safe(i.observation_period):'Osservazione non disponibile.'}</p></article><article><strong>Lavoro</strong><p>${finite(l?.observation_value)?'Disoccupazione '+fmt(l.observation_value,1)+'% · '+dir(l.change_direction)+' · '+safe(l.observation_period):'Osservazione non disponibile.'}</p></article></div>`}
function macroEditorial(){const c=state.ccy;const v=activityReading(c);return heading('02 / global macro',`${flag[c]} ${names[c]} · Il ciclo economico`,'La lettura parte dall’economia, non dal punteggio.')+ccySelector()+judge(...v)+`<div class="grid2"><section class="panel"><h2>Cosa cambia nell’attività</h2><div class="editorial-list">${(macro[c]||[]).map(x=>`<article><strong>${safe(x[0])}</strong><p>${x[2]>=0?'Espansione':'Contrazione'} · ritmo ${x[3]>0?'in miglioramento':x[3]<0?'in peggioramento':'stabile'}. <span class="plain-chip">${safe(x[1])}</span></p></article>`).join('')}</div>${fold('Apri dati, velocità e accelerazione',macroTable(c))}</section><section class="panel"><h2>Crescita, inflazione e lavoro</h2>${macroPillars(c)}${srcLink('macro','Dossier macro completo · servizi, case, salari, credito e storico')}</section></div>`}
function cbReading(c){let b=data.cb?.[c],o=data.ois?.currencies?.[c];if(!b)return '<p class="evidence-flag">WANT/CAN non caricato: consulta il dossier originale.</p>'+srcLink('banks');return `<div class="editorial-list"><article><strong>WANT · Cosa comunica</strong><p>${safe(b.context||b.stance||'Comunicazione da verificare')}</p><small>Decisione ${dateIT(b.last_date)}</small></article><article><strong>CAN · Cosa le consente l’economia</strong><p>${safe(activityReading(c)[1])} L’inflazione e il lavoro vanno verificati insieme.</p>${srcLink('banks','WANT/CAN completo')}</article><article><strong>Il mercato</strong><p>${finite(o?.horizons?.['6m']?.rate)?'Riferimento 6M '+fmt(o.horizons['6m'].rate,2)+'% · '+safe(o.kind)+' · '+dateIT(o.horizons['6m'].as_of)+'. Non assimilare futures e OIS.':'Riferimento monetario non disponibile.'}</p></article></div>`}
function ratesEditorial(){const c=state.ccy,r=rates[c],spread=(r[2]-r[1])*100;return heading('03 / politica monetaria e tassi','Cosa vuole la banca. Cosa prezza il mercato.','Il front-end e il lungo termine rispondono a driver diversi.')+ccySelector()+judge(`${flag[c]} ${c} · Curva ${spread>0?'positiva':spread<0?'invertita':'piatta'}`,`Il rendimento a dieci anni è ${spread>0?'superiore':spread<0?'inferiore':'uguale'} al due anni (dati ${safe(r[0])}).`,'La pendenza della curva non indica da sola la prossima decisione della banca centrale. Il lungo termine incorpora anche crescita, inflazione e premi per il rischio.','Verificare il repricing monetario 6M, separato dai rendimenti governativi. '+(c==='CHF'&&r[0]==='30/09'?'Il riferimento CHF è datato: evitare confronti operativi.':''))+`<div class="grid2"><section class="panel"><h2>Politica monetaria · ${c}</h2>${cbReading(c)}${srcLink('rates','Curve monetarie e movimenti 1D/1W')}</section><section class="panel"><h2>Rendimenti governativi G8</h2><p class="note">Livelli e date, non una graduatoria hawkish.</p><div class="tablewrap"><table><thead><tr><th>Paese</th><th>2Y</th><th>10Y</th><th>Data</th></tr></thead><tbody>${FX.map(k=>`<tr><td>${cbutton(k)}</td><td>${fmt(rates[k][1])}%</td><td>${fmt(rates[k][2])}%</td><td>${safe(rates[k][0])}</td></tr>`).join('')}</tbody></table></div>${srcLink('rates','Storico e differenziali omogenei')}</section></div>`}

function macroChartRead(s,p){

 const d=z.value-a.value,earlier=b?z.value-b.value:null,l=String(s.label||''),cat=s.category;
 const trend=finite(earlier)?(d*earlier<0?'L’ultima osservazione va contro il movimento delle ultime tre variazioni.':'Nelle ultime tre variazioni il livello '+direction(earlier)+'.'):'';
 let meaning='Il livello di questo indicatore non basta per giudicare l’intera economia.';
 if(/disoccupazione|sussidi disoccupazione/i.test(l)&&!/attesa|survey/i.test(l))meaning=d>0?'Un aumento è compatibile con un indebolimento del mercato del lavoro.':d<0?'Una riduzione è compatibile con un mercato del lavoro più solido.':'Non emerge un nuovo impulso dal lavoro.';
 else if(cat==='Inflazione')meaning='Se la serie è un tasso di inflazione, la direzione indica pressioni sui prezzi più o meno intense. Se è un indice dei prezzi, serve il suo tasso di crescita.';
 else if(cat==='Crescita'&&!/risparmio/i.test(l))meaning='Un miglioramento persistente è compatibile con più attività o domanda. Verificare se la misura è reale, nominale o già un tasso di crescita.';
 else if(/standard credito|condizioni credito/i.test(l))meaning='Per interpretare la survey serve la convenzione del segno: irrigidimento o disponibilità.';
 else if(cat==='Liquidità')meaning='Più moneta o riserve non significa automaticamente più credito o più spesa.';
 return plainRead(l+' '+direction(d),'Ultima rilevazione: '+z.date+'. '+trend,meaning,'Verificare continuità e coerenza con gli altri indicatori del settore.');
}

function cotModel(c){
 const a=extra.cotHistory?.[c],engine=window.FXQuantCOTDeskV26;if(!a||!engine||!Array.isArray(a.dates))return null;

 if(hist.length<9||!hist.every((x,i)=>validDay(x.date)&&x.date<=day()&&(!i||x.date>hist[i-1].date)&&keys.every(k=>finite(x[k]))&&Math.abs(x.long-x.short-x.net)<1.1))return null;

}
