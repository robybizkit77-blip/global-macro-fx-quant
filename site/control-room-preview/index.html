<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>GLOBAL MACRO FX QUANT — Control Room · Anteprima web</title>
<style>
html,body{margin:0;min-height:100%;background:#05121f;color:#cbd6e0;font:15px/1.5 system-ui,sans-serif}
main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:1rem;box-sizing:border-box}
small{color:#829eb5;display:block;margin-top:10px}
</style></head><body>
<main id="state"><div>GLOBAL MACRO FX QUANT<small>Caricamento Control Room v10…</small></div></main>
<script>
(async()=>{
  const paths=Array.from({length:32},(_,i)=>"parts/part-"+String(i).padStart(2,"0")+".txt");
  const parts=await Promise.all(paths.map(async path=>{
    const response=await fetch(path,{cache:"no-store"});
    if(!response.ok)throw new Error(path+" · HTTP "+response.status);
    return response.text();
  }));
  const html=parts.join("");
  if(!html.startsWith("<!doctype html>")||!html.includes("const PAGES="))throw new Error("Controllo integrità dell'anteprima non superato");
  document.open();
  document.write(html);
  document.close();
})().catch(error=>{
  console.error("[GMFQ Preview]",error);
  const state=document.getElementById("state");
  if(state)state.textContent="Impossibile caricare l'anteprima: "+error.message+". Riprova tra poco.";
});
</script></body></html>
