<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GMFQ — Caricamento Control Room</title><style>html,body{margin:0;background:#05121f;color:#cbd6e0;font:15px system-ui,sans-serif;}main{height:100vh;display:grid;place-items:center}small{color:#829eb5;display:block;margin-top:10px}</style></head><body><main id="state"><div>GLOBAL MACRO FX QUANT <small>Caricamento Control Room v10…</small></div></main><script>(async()=>{let parts=[];for(let i=0;i<32;i++){const name=`parts/part-${String(i).padStart(2,'0')}.txt`;const res=await fetch(name,{cache:'no-store'});if(!res.ok)throw new Error(`${name} · HTTP ${res.status}`);parts.push(await res.text())}const html=parts.join('');if(!html.startsWith('<!doctype html>')||!html.includes('const PAGES='))throw new Error('Integrità pagina non valida');document.open();document.write(html);document.close();})().catch(err=>{document.getElementById('state').textContent='Anteprima temporaneamente non disponibile: '+err.message;console.error(err)})</script></body></html>
