name: COT Story Payload Backfill One-Shot 2026-10-21

on:
  push:
    branches:
      - fix/cot-percentile-rounded-authority-20261021
    paths:
      - '.github/workflows/cot-story-payload-backfill-once-20261021.yml'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cot-percentile-rounded-authority-20261021
          fetch-depth: 1
      - name: Reconcile canonical COT narrative with numeric source
        shell: bash
        run: |
          set -euo pipefail
          python validation/build_cot_stories.py --audit-current >/tmp/cot-story-drift.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/cot-story-drift.json'))
          assert d['status']=='PASS' and d['current_drift_count']==0, d['current_drift']
          assert d['output']['USD']['signal']=='EXTREME LONG'
          print('COT_SOURCE_RECONCILIATION_PASS')
          PY
          python validation/update_live_derived_sections.py \
            --cot live_data/sections/V247_COT_STORIES.json --apply > /tmp/cot-derived-backfill.json
          python validation/build_live_manifest_v2.py \
            --write live_data/manifest.v2.json >/tmp/cot-reconciled-manifest.json
          python validation/check_live_update_contract.py >/tmp/cot-live-contract.json
          python validation/rebuild_live_data_runtime.py --verify-only >/tmp/cot-runtime-roundtrip.json
          python validation/check_cot_story_integrity.py
          python - <<'PY'
          import json,subprocess
          expected={'payload/part-00.txt','live_data/manifest.v2.json'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==expected, (changed,expected)
          receipt=json.load(open('/tmp/cot-derived-backfill.json'))
          assert receipt['status']=='PASS' and receipt['changed_payload_parts']==[0],receipt
          print('COT_BACKFILL_SCOPE_PASS',sorted(changed))
          PY
      - name: Commit strictly scoped derived payload and metadata to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- payload/part-00.txt live_data/manifest.v2.json
          git diff --cached --check
          git commit -m 'Rebuild derived COT narrative in root runtime and live manifest'
          git push origin HEAD:fix/cot-percentile-rounded-authority-20261021
