name: JPY METI growth history source proof V1
on:
  pull_request:
    paths:
      - 'validation/macro/probe_jpy_meti_growth_v1.py'
      - '.github/workflows/jpy-meti-growth-proof-v1.yml'
      - 'validation/macro/prepare_jpy_meti_growth_v1.py'
      - 'validation/macro/test_prepare_jpy_meti_growth_v1.py'
permissions:
  contents: read
jobs:
  source-proof:
    if: github.head_ref == 'research/jpy-meti-growth-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl
      - run: python -m validation.macro.probe_jpy_meti_growth_v1
      - run: python -m unittest validation.macro.test_prepare_jpy_meti_growth_v1 -v
      - name: Verify both exact official candidates
        run: |
          python -m validation.macro.prepare_jpy_meti_growth_v1 --candidate /tmp/jpy-meti/candidate.json --receipt /tmp/jpy-meti/receipt.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/jpy-meti/receipt.json'))
          assert len(d['series'])==2 and all(r['status'] in ('READY','NO_CHANGE') and r['after']>='2026-09' and r['exact_overlap']>=82 for r in d['series']),d
          PY
