name: Pair Compact Payload V1

on:
  workflow_dispatch:
  push:
    branches:
      - research-transmission-conviction-layer-v1-2026-10-07
    paths:
      - 'validation/DASHBOARD_PAIR_RENDER_PAYLOAD_V1_2026-10-07.json'
      - 'validation/FORWARD_ECB_FIXING_STATE_V1_2026-10-07.json'
      - 'validation/build_pair_compact_payload_v1.py'
      - 'validation/validate_pair_compact_payload_v1.py'
      - '.github/workflows/pair-compact-payload-v1.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact pair payload
        run: python validation/build_pair_compact_payload_v1.py
      - name: Validate compact pair payload
        run: python validation/validate_pair_compact_payload_v1.py
      - name: Commit generated pair payload if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/PAIR_COMPACT_PAYLOAD_V1_2026-10-07.json validation/PAIR_COMPACT_HISTORY_V1_2026-10-07.json
          if git diff --cached --quiet; then
            echo 'No compact pair payload change'
            exit 0
          fi
          git commit -m 'Update compact pair payload'
          git push origin HEAD:research-transmission-conviction-layer-v1-2026-10-07
