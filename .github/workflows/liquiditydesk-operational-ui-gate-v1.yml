name: Liquidity Desk Operational UI Gate V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'dashboard/liquiditydesk-operational-v1.js'
      - 'validation/ui/DASHBOARD_UI_OWNERSHIP_REGISTRY_V1_2026-10-15.json'
      - '.github/workflows/liquiditydesk-operational-ui-gate-v1.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'dashboard/liquiditydesk-operational-v1.js'
      - 'validation/ui/DASHBOARD_UI_OWNERSHIP_REGISTRY_V1_2026-10-15.json'
      - '.github/workflows/liquiditydesk-operational-ui-gate-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start dashboard
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/liquiditydesk-operational-ui.log 2>&1 &
          sleep 2
      - name: Verify Liquidity Desk desktop mobile
        run: |
          cat > liquiditydesk-operational-gate.js <<'EOF'
          const { chromium } = require('playwright');
          const CCYS=['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];
          async function run(viewport,label){
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport});
            const consoleErrors=[],pageErrors=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>['ACTIVE','FAIL'].includes(window.GMFQ_LIQUIDITYDESK_OPERATIONAL?.status),null,{timeout:120000});
            const boot=await page.evaluate(()=>window.GMFQ_LIQUIDITYDESK_OPERATIONAL);
            if(boot?.status!=='ACTIVE')throw new Error(label+' Liquidity boot '+JSON.stringify(boot));
            await page.evaluate(()=>window.showView?.('liquiditydesk'));
            for(const wanted of CCYS){
              const ok=await page.evaluate(w=>{const b=document.querySelector(`#v243CurrencyCards .v234CurrencyCard[data-c="${w}"]`);if(!b)return false;b.click();return true;},wanted);
              if(!ok)throw new Error(label+' missing Liquidity selector '+wanted);
              await page.waitForTimeout(180);
              const snap=await page.evaluate(()=>({audit:window.gmfqLiquidityDeskOperationalAudit?.(),country:String(document.getElementById('v243CountryName')?.textContent||''),text:String(document.getElementById('liquiditydesk')?.innerText||'')}));
              if(snap.audit?.schema!=='GMFQ_LIQUIDITYDESK_OPERATIONAL_UI_V1'||snap.audit?.status!=='ACTIVE'||snap.audit?.core_effect!=='NONE')throw new Error(label+' bad Liquidity audit '+wanted+' '+JSON.stringify(snap.audit));
              if(!snap.country.includes(wanted))throw new Error(label+' Liquidity selector/title desync '+wanted+' '+snap.country);
              if(!snap.text||snap.text.length<100)throw new Error(label+' empty Liquidity view '+wanted);
              const row=snap.audit?.coverage?.[wanted],cand=snap.audit?.candidates?.[wanted];
              if(row?.status!=='COMPLETO'||row?.freshness_status!=='COMPLETO'||!row?.latest_observation)throw new Error(label+' Liquidity source coverage '+wanted+' '+JSON.stringify(row));
              if(!row?.liquidity_dir||/NON DISPONIBILE|WITHHELD/i.test(String(row.liquidity_dir)))throw new Error(label+' Liquidity direction '+wanted+' '+JSON.stringify(row));
              if(!cand||cand.status==='WITHHELD'||cand.error)throw new Error(label+' Liquidity structural candidate '+wanted+' '+JSON.stringify(cand));
            }
            const final=await page.evaluate(()=>window.gmfqLiquidityDeskOperationalAudit?.());
            if(final?.integrity?.live_freshness_ok!==true||final?.integrity?.overlay_isolation_ok!==true)throw new Error(label+' Liquidity integrity '+JSON.stringify(final));
            if(final?.freshness_policy!=='SOURCE_NATIVE_CADENCE_HOLD_LAST_VALID_COMPONENT')throw new Error(label+' Liquidity freshness policy '+final?.freshness_policy);
            const runtimeErr=/\b[A-Za-z_$][\w$]*\s+is\s+not\s+defined\b|ReferenceError/i;
            if(consoleErrors.some(x=>runtimeErr.test(x))||pageErrors.some(x=>runtimeErr.test(x)))throw new Error(label+' runtime scope error '+consoleErrors.concat(pageErrors).join(' | '));
            await browser.close();console.log(label,'LIQUIDITYDESK_OPERATIONAL_UI_PASS');
          }
          (async()=>{await run({width:1440,height:1100},'desktop');await run({width:390,height:844},'mobile');console.log('LIQUIDITYDESK_OPERATIONAL_UI_GATE_V1 PASS');})().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node liquiditydesk-operational-gate.js
