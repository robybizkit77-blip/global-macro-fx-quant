name: GBP BoE rates probe
on:
  push:
    branches: [test-gbp-rates-boe-2026-09-30]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract BoE nominal spot curve
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS --retry 5 "https://www.bankofengland.co.uk/-/media/boe/files/statistics/yield-curves/latest-yield-curve-data.zip" -o boe.zip
          mkdir boe
          unzip -q boe.zip -d boe
          python - <<'PY'
          import zipfile,xml.etree.ElementTree as ET,re,datetime,math
          p="boe/GLC Nominal daily data current month.xlsx"
          NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main'
          RNS='http://schemas.openxmlformats.org/officeDocument/2006/relationships'
          PNS='http://schemas.openxmlformats.org/package/2006/relationships'
          ns={'m':NS,'r':RNS}
          def colnum(ref):
              s=re.match(r'([A-Z]+)',ref).group(1)
              n=0
              for ch in s:n=n*26+ord(ch)-64
              return n
          with zipfile.ZipFile(p) as z:
              shared=[]
              if 'xl/sharedStrings.xml' in z.namelist():
                  root=ET.fromstring(z.read('xl/sharedStrings.xml'))
                  for si in root.findall('{%s}si'%NS):
                      shared.append(''.join(t.text or '' for t in si.iter('{%s}t'%NS)))
              wb=ET.fromstring(z.read('xl/workbook.xml'))
              rels=ET.fromstring(z.read('xl/_rels/workbook.xml.rels'))
              relmap={x.attrib['Id']:x.attrib['Target'] for x in rels}
              target=None
              for s in wb.find('{%s}sheets'%NS):
                  if s.attrib['name']=='4. spot curve':
                      rid=s.attrib['{%s}id'%RNS]
                      target=relmap[rid]
              if not target: raise SystemExit("spot curve sheet not found")
              if not target.startswith('xl/'): target='xl/'+target.lstrip('/')
              root=ET.fromstring(z.read(target))
              rows={}
              for row in root.findall('.//{%s}sheetData/{%s}row'%(NS,NS)):
                  rn=int(row.attrib['r']); d={}
                  for c in row.findall('{%s}c'%NS):
                      ref=c.attrib.get('r'); typ=c.attrib.get('t'); v=c.find('{%s}v'%NS)
                      val=None
                      if typ=='s' and v is not None:
                          val=shared[int(v.text)]
                      elif v is not None:
                          val=v.text
                      d[colnum(ref)]=val
                  rows[rn]=d
              mats={int(k):float(v) for k,v in rows[4].items() if k>1 and v not in (None,'')}
              wanted=[2,5,10,25,30,40]
              cmap={}
              for w in wanted:
                  best=min(mats.items(),key=lambda kv:abs(kv[1]-w))
                  if abs(best[1]-w)<1e-6: cmap[w]=best[0]
              print("COLMAP",cmap)
              valid=[]
              for rn,d in rows.items():
                  a=d.get(1)
                  try: serial=float(a)
                  except: continue
                  if serial<40000: continue
                  vals={}
                  for w,col in cmap.items():
                      try: vals[w]=float(d.get(col))
                      except: vals[w]=None
                  if any(v is not None for v in vals.values()):
                      date=(datetime.datetime(1899,12,30)+datetime.timedelta(days=serial)).date().isoformat()
                      valid.append((date,vals,rn))
              print("VALID_ROWS",len(valid))
              for date,vals,rn in valid[-12:]:
                  print("OBS",date,"ROW",rn," ".join(f"{k}Y={vals[k]}" for k in wanted if k in vals))
          PY
