name: GBP BoE rates probe
on:
  push:
    branches: [test-gbp-rates-boe-2026-09-30]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect BoE latest yield curve
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS --retry 5 "https://www.bankofengland.co.uk/-/media/boe/files/statistics/yield-curves/latest-yield-curve-data.zip" -o boe.zip
          mkdir boe
          unzip -q boe.zip -d boe
          python - <<'PY'
          import zipfile,xml.etree.ElementTree as ET,re,os
          p="boe/GLC Nominal daily data current month.xlsx"
          ns={'m':'http://schemas.openxmlformats.org/spreadsheetml/2006/main',
              'r':'http://schemas.openxmlformats.org/officeDocument/2006/relationships',
              'pr':'http://schemas.openxmlformats.org/package/2006/relationships'}
          with zipfile.ZipFile(p) as z:
              shared=[]
              if 'xl/sharedStrings.xml' in z.namelist():
                  root=ET.fromstring(z.read('xl/sharedStrings.xml'))
                  for si in root.findall('m:si',ns):
                      shared.append(''.join(t.text or '' for t in si.findall('.//m:t',ns)))
              wb=ET.fromstring(z.read('xl/workbook.xml'))
              rels=ET.fromstring(z.read('xl/_rels/workbook.xml.rels'))
              relmap={x.attrib['Id']:x.attrib['Target'] for x in rels}
              sheets=[]
              for s in wb.find('m:sheets',ns):
                  name=s.attrib['name']; rid=s.attrib['{'+ns['r']+'}id']
                  target=relmap[rid]
                  if not target.startswith('xl/'): target='xl/'+target.lstrip('/')
                  sheets.append((name,target))
              print("SHEETS",[x[0] for x in sheets])
              for name,target in sheets:
                  root=ET.fromstring(z.read(target))
                  rows=[]
                  for row in root.findall('.//m:sheetData/m:row',ns):
                      vals=[]
                      for c in row.findall('m:c',ns):
                          ref=c.attrib.get('r','')
                          t=c.attrib.get('t')
                          v=c.find('m:v',ns)
                          inline=c.find('m:is',ns)
                          val=None
                          if t=='s' and v is not None:
                              try: val=shared[int(v.text)]
                              except: val=v.text
                          elif t=='inlineStr' and inline is not None:
                              val=''.join(x.text or '' for x in inline.findall('.//m:t',ns))
                          elif v is not None:
                              val=v.text
                          vals.append((ref,val))
                      if vals: rows.append(vals)
                  print("\nSHEET",name,"ROWS",len(rows))
                  for row in rows[:10]: print("HEAD",row[:20])
                  for row in rows[-10:]: print("TAIL",row[:20])
          PY
