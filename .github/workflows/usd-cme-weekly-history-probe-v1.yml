name: USD CME Weekly History Probe V1

on:
  push:
    branches:
      - validation-usd-cme-weekly-history-probe-v1-2026-10-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe official CME dated CSV files read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cme_probe evidence
          python3 - <<'PY'
          import csv, hashlib, io, json, re, subprocess
          from pathlib import Path

          dates=['20260923','20260930']
          out={'schema':'GMFQ_USD_CME_WEEKLY_HISTORY_PROBE_V1','status':'PROBE_ONLY','live_data_written':False,'dates':{}}
          for d in dates:
              rec={'date':d,'downloaded':False,'matches':[]}
              urls=[
                  f'https://www.cmegroup.com/ftp/fprf/csv/cmeg.fut.prf.{d}.csv',
                  f'https://www.cmegroup.com/ftp/fprf/csv/cmeg.fut.prf.{d}.csv.zip',
              ]
              target=Path('/tmp/cme_probe')/f'cmeg.fut.prf.{d}.csv'
              for url in urls:
                  p=subprocess.run(['curl','-fL','--retry','2','--connect-timeout','20','--max-time','120','-A','Mozilla/5.0 GMFQ-validation/1.0',url,'-o',str(target)],text=True,capture_output=True)
                  rec.setdefault('attempts',[]).append({'url':url,'returncode':p.returncode,'stderr_tail':p.stderr[-500:]})
                  if p.returncode==0 and target.exists() and target.stat().st_size>0:
                      raw=target.read_bytes()
                      # The first URL is plain CSV. Do not silently parse a ZIP as CSV.
                      if raw[:2]==b'PK':
                          rec['zip_route_seen']=url
                          target.unlink(missing_ok=True)
                          continue
                      rec['downloaded']=True; rec['source_url']=url; break
              if not rec['downloaded']:
                  out['dates'][d]=rec; continue
              raw=target.read_bytes(); text=raw.decode('utf-8','replace')
              rec['size']=len(raw); rec['sha256']=hashlib.sha256(raw).hexdigest()
              lines=text.splitlines()
              rec['header']=lines[0][:3000] if lines else ''
              upper=text.upper()
              rec['has_fed_funds_text']=bool(re.search(r'30.?DAY.?FED|FEDERAL.?FUNDS|FED.?FUNDS|30D.?FED',upper))
              settle_words=['SETTLE','SETTLEMENT','SETLPRICE','SETTLEPRICE','PX_SETTLE','FINAL SETTLEMENT']
              rec['settlement_terms_found']=[w for w in settle_words if w in upper]
              rec['contains_any_settlement_term']=bool(rec['settlement_terms_found'])
              # Keep only compact lines plausibly about 30-Day Fed Funds.
              for line in lines:
                  u=line.upper()
                  if re.search(r'30.?DAY.?FED|FEDERAL.?FUNDS|FED.?FUNDS|30D.?FED',u):
                      rec['matches'].append(line[:5000])
                      if len(rec['matches'])>=20: break
              rec['match_count']=len(rec['matches'])
              # Check whether known current settlements from PG10 occur anywhere.
              rec['known_pg10_prices_present']={p:(p in text) for p in ['95.8750','95.5950','95.2050']}
              out['dates'][d]=rec

          d23=out['dates'].get('20260923',{}); d30=out['dates'].get('20260930',{})
          if not (d23.get('downloaded') and d30.get('downloaded')):
              out['status']='DATED_CSV_ROUTE_NOT_ACCESSIBLE'
          elif d23.get('has_fed_funds_text') and d30.get('has_fed_funds_text') and d23.get('contains_any_settlement_term') and d30.get('contains_any_settlement_term'):
              out['status']='CANDIDATE_SETTLEMENT_ROUTE_FOUND__NEEDS_EXACT_CONTRACT_PARSE'
          elif d23.get('has_fed_funds_text') and d30.get('has_fed_funds_text'):
              out['status']='OFFICIAL_PRODUCT_REFERENCE_ONLY__NO_SETTLEMENT_FIELD_CONFIRMED'
          else:
              out['status']='OFFICIAL_DATED_CSV_FOUND__FED_FUNDS_NOT_CONFIRMED'

          Path('evidence/usd-cme-weekly-history-probe-v1.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps({'status':out['status'],'dates':{d:{'downloaded':r.get('downloaded'),'source_url':r.get('source_url'),'size':r.get('size'),'sha256':r.get('sha256'),'header':r.get('header'),'has_fed_funds_text':r.get('has_fed_funds_text'),'settlement_terms_found':r.get('settlement_terms_found'),'known_pg10_prices_present':r.get('known_pg10_prices_present'),'match_count':r.get('match_count'),'sample_matches':r.get('matches',[])[:4]} for d,r in out['dates'].items()}},indent=2))
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: usd-cme-weekly-history-probe-v1
          path: evidence/usd-cme-weekly-history-probe-v1.json
          if-no-files-found: error
