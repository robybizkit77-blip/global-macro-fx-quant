name: COT Extreme Reversal Cost Cluster V1

on:
  push:
    branches:
      - validation-cot-extreme-reversal-cost-cluster-v1-2026-10-12
  workflow_dispatch:

jobs:
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run frozen cost and clustering stress suite
        run: python validation/run_cot_extreme_reversal_cost_cluster_v1.py
      - name: Upload stress artifact
        uses: actions/upload-artifact@v4
        with:
          name: cot-extreme-reversal-cost-cluster-${{ github.run_id }}
          path: /tmp/cot-extreme-reversal-cost-cluster-v1
