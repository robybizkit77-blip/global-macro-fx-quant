      - 'validation/macro/test_v2_g8_gdp_q3_q4_2021_fiveyear_research_v1.py'
      - '.github/workflows/macro-gdp-multiquarter-research-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-only-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test chronological GDP vintages and research fixture
        run: python -m unittest validation.macro.test_v2_g8_gdp_multiquarter_pit_guard_v1 -v
      - name: Test 2025 Q4 first releases and revision vintage chronology
        run: python -m unittest validation.macro.test_v2_g8_gdp_q4_2025_release_research_v1 -v
      - name: Test 2025 Q3 first releases, delayed US and Japanese rebenchmark
        run: python -m unittest validation.macro.test_v2_g8_gdp_q3_2025_release_research_v1 -v
      - name: Test 2025 Q2 G8 release vintages and 5-quarter history
        run: python -m unittest validation.macro.test_v2_g8_gdp_q2_2025_release_research_v1 -v
      - name: Test 2025 Q1 real GDP first releases and cross-six-quarter vintages
        run: python -m unittest validation.macro.test_v2_g8_gdp_q1_2025_release_research_v1 -v
      - name: Test 2024 Q4 GDP official first releases and cross-seven-quarter history
        run: python -m unittest validation.macro.test_v2_g8_gdp_q4_2024_release_research_v1 -v
      - name: Test 2024 Q3 publisher vintages and eight-quarter history
        run: python -m unittest validation.macro.test_v2_g8_gdp_q3_2024_release_research_v1 -v
      - name: Validate 2024 Q2 G8 vintages and nine-quarter PIT research chronology
        run: python -m unittest validation.macro.test_v2_g8_gdp_q2_2024_release_research_v1 -v
      - name: Reconcile original Q2 2026 ledger and Q1 2024 into 10-quarter research
        run: python -m unittest validation.macro.test_v2_g8_gdp_unified_web_research_v1 -v
      - name: Test 2023 Q4 G8 first publisher statements and eleven-quarter PIT research
        run: python -m unittest validation.macro.test_v2_g8_gdp_q4_2023_release_research_v1 -v
      - name: Test unified eleven-quarter release view and unmodified Q2 2026 bridge
        run: python -m unittest validation.macro.test_v2_g8_gdp_unified_web_research_v1 -v
      - name: Test 2023 Q3 G8 first estimates and twelve-quarter research history
        run: python -m unittest validation.macro.test_v2_g8_gdp_q3_2023_release_research_v1 -v
      - name: Test Q2 2023 first-release research vintages and 13-quarter as-of protection
        run: python -m unittest validation.macro.test_v2_g8_gdp_q2_2023_release_research_v1 -v
      - name: Verify Q1 2023 GDP release history and 14-quarter research time travel
        run: python -m unittest validation.macro.test_v2_g8_gdp_q1_2023_release_research_v1 -v
      - name: Test 2022 Q4 G8 original GDP vintages and fifteen-quarter PIT chronology
        run: python -m unittest validation.macro.test_v2_g8_gdp_q4_2022_release_research_v1 -v
      - name: Test Q3 2022 original GDP vintages and sixteen-quarter release chronology
        run: python -m unittest validation.macro.test_v2_g8_gdp_q3_2022_release_research_v1 -v
      - name: Test original 2022Q2 GDP G8 vintages and seventeen-quarter research chronology
        run: python -m unittest validation.macro.test_v2_g8_gdp_q2_2022_release_research_v1 -v
      - name: Test Q1 2022 first release GDP G8 vintages and eighteen-quarter research history
        run: python -m unittest validation.macro.test_v2_g8_gdp_q1_2022_release_research_v1 -v
      - name: Test 2021 Q3-Q4 original G8 GDP release vintages and full five-year coverage
        run: python -m unittest validation.macro.test_v2_g8_gdp_q3_q4_2021_fiveyear_research_v1 -v
      - name: Verify operational data untouched
        run: git diff --exit-code HEAD^ HEAD -- live_data/sections/D.json live_data/sections/PAIR_SETUP_OPERATIONAL_VIEW.json
