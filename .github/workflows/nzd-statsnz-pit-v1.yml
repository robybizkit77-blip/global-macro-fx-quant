name: NZD Stats NZ PIT V1

on:
  push:
    branches:
      - research-transmission-conviction-layer-v1-2026-10-07
    paths:
      - 'validation/run_nzd_statsnz_pit_v1.py'
      - '.github/workflows/nzd-statsnz-pit-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build NZD first-release CPI and labour PIT
        run: python validation/run_nzd_statsnz_pit_v1.py
      - name: Guard frozen engine identifiers
        run: |
          python - <<'PY'
          import json
          p=json.load(open('validation/NZD_STATSNZ_PIT_V1_2026-10-07.json'))
          assert p['changes_engine_rules'] is False
          assert p['changes_live_data'] is False
          assert p['changes_oos_baseline'] is False
          assert p['coverage']['cpi_n'] >= 20 and p['coverage']['labour_n'] >= 20
          print('PASS')
          PY
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/pit_v1/NZD_CPI_HEADLINE_FIRST_RELEASE_2019_2026.csv history/pit_v1/NZD_UNEMPLOYMENT_FIRST_RELEASE_2019_2026.csv validation/NZD_STATSNZ_PIT_V1_2026-10-07.json
          git diff --cached --quiet || git commit -m "Materialize NZD Stats NZ first-release PIT"
          git push
