name: CAD CORRA archive probe

on:
  push:
    branches:
      - test-cad-corra-archive-2026-09-30

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Montréal Exchange public archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,html
          from urllib.parse import urljoin
          urls=[
            "https://www.m-x.ca/envoi/new_mcwx_mpcx_mvx_en.php",
            "https://www.m-x.ca/en/trading/data/quotes?symbol=CRA",
            "https://www.m-x.ca/en/trading/data/market-review",
            "https://www.m-x.ca/assets/application/js/market-review.1633382756.min.js"
          ]
          for url in urls:
              r=requests.get(url,timeout=30,headers={"User-Agent":"Mozilla/5.0"})
              print("\nURL",url,"STATUS",r.status_code,"LEN",len(r.content),"CT",r.headers.get("content-type"))
              txt=r.content.decode("utf-8","ignore")
              for line in txt.splitlines():
                  if re.search(r'end-of-day|archive|histor|market-review|futures|\.csv|\.zip|CRA|date',line,re.I):
                      line=re.sub(r'\s+',' ',line).strip()
                      if line:
                          print(line[:1500])
          print("\nDATE MAP / CRA SNAPSHOTS")
          j=requests.get("https://www.m-x.ca/files/json/market-reviews.json",timeout=30,headers={"User-Agent":"Mozilla/5.0"})
          print("MAP_STATUS",j.status_code,"LEN",len(j.content))
          mp=j.json()
          for ds in ["2026-09-22","2026-09-28","2026-09-29"]:
              ident=mp.get(ds)
              print("DATE_ID",ds,ident)
              if not ident: continue
              u=f"https://www.m-x.ca/en/trading/data/market-review?id={ident}"
              rr=requests.get(u,timeout=30,headers={"User-Agent":"Mozilla/5.0"})
              tx=rr.content.decode("utf-8","ignore")
              print("REVIEW",ds,"STATUS",rr.status_code,"LEN",len(tx))
              # print only CRA table rows and nearby header
              m=re.search(r'Three-Month CORRA Futures \(CRA\)(.*?)(?:Two-Year Government|</table>)',tx,re.S|re.I)
              if m:
                  block=re.sub(r'<[^>]+>','|',m.group(1))
                  block=html.unescape(re.sub(r'\s+',' ',block))
                  print("CRA_BLOCK",ds,block[:5000])
          PY
