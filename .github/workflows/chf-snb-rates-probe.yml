name: CHF SNB Rates Probe

on:
  push:
    branches:
      - staging-chf-rates-snb-probe-2026-09-30
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract SNB daily Confederation spot rates
        run: |
          pip install requests
          python - <<'PY'
          import requests,csv,io,json
          base='https://data.snb.ch/api/cube/rendoblid/data/csv/en'
          params={
            'dimSel':'D0(2J,10J0)',
            'fromDate':'2026-09-22',
            'toDate':'2026-09-29'
          }
          r=requests.get(base,params=params,timeout=120)
          print('HTTP',r.status_code,r.url,len(r.content))
          r.raise_for_status()
          text=r.content.decode('utf-8-sig','replace')
          print('RAW_BEGIN')
          print(text[:30000])
          print('RAW_END')
          rows=list(csv.reader(io.StringIO(text),delimiter=';'))
          print('ROWS',json.dumps(rows,ensure_ascii=False))
          PY
