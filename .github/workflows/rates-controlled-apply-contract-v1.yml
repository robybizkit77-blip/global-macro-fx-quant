name: Rates Controlled Apply Contract V1
# recertification trigger 2026-10-13

on:
  push:
    branches: [release-candidate-daily-data-orchestrator-v1-2026-10-12]
    paths:
      - '.github/workflows/rates-controlled-apply-contract-v1.yml'
      - 'validation/run_rates_audit.py'
      - 'validation/build_rates_candidate_from_audit.py'
      - 'validation/build_rates_audit_metadata.py'
      - 'validation/update_live_direct_section.py'
      - 'validation/update_live_derived_sections.py'
      - 'validation/fetch_rates_usd_jpy.py'
      - 'validation/fetch_rates_eur_gbp.py'
      - 'validation/fetch_rates_cad.py'
      - 'validation/fetch_rates_aud.py'
      - 'validation/RATES_SOURCE_ADAPTERS_V1_2026-10-05.json'
      - 'live_data/sections/NATIVE_RATES_DATA.json'
      - 'live_data/sections/RATES_AUDIT_METADATA.json'
      - 'live_data/manifest.v2.json'
      - 'payload/part-00.txt'
      - 'payload/part-15.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rates-controlled-apply-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: pip install openpyxl
      - name: Snapshot tracked runtime
        run: |
          sha256sum \
            live_data/sections/NATIVE_RATES_DATA.json \
            live_data/sections/RATES_AUDIT_METADATA.json \
            live_data/manifest.v2.json \
            payload/part-00.txt \
            payload/part-15.txt > /tmp/rates-runtime.before.sha256
      - name: Preflight canonical Rates mapping only
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open('live_data/manifest.v2.json'))
          assert m['schema']=='GMFQ_LIVE_DATA_MANIFEST_V2' and m['status']=='PASS'
          e={x['key']:x for x in m['sections']}['NATIVE_RATES_DATA']
          raw=pathlib.Path('live_data/sections/NATIVE_RATES_DATA.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==e['sha256']
          hits=[]
          for i in range(16):
              b=pathlib.Path(f'payload/part-{i:02d}.txt').read_bytes()
              if b.count(raw): hits.append((i,b.count(raw)))
          assert hits==[(e['part'],1)],(e,hits)
          print('RATES_CANONICAL_MAPPING_PREFLIGHT_PASS',hits)
          PY
      - name: Build official unified Rates candidate
        run: |
          mkdir -p /tmp/rates-contract
          python validation/run_rates_audit.py > /tmp/rates-contract/audit.json
          python validation/build_rates_candidate_from_audit.py \
            --audit /tmp/rates-contract/audit.json \
            --output /tmp/rates-contract/NATIVE_RATES_DATA.json \
            | tee /tmp/rates-contract/candidate-summary.json
          git diff --exit-code -- live_data payload
      - name: Enforce source temporal and paired-tenor contract
        run: |
          python - <<'PY'
          import json
          from datetime import date
          audit=json.load(open('/tmp/rates-contract/audit.json'))
          cand=json.load(open('/tmp/rates-contract/candidate-summary.json'))
          current=json.load(open('live_data/sections/NATIVE_RATES_DATA.json'))
          proposed=json.load(open('/tmp/rates-contract/NATIVE_RATES_DATA.json'))
          assert audit['status']=='PASS',audit
          assert cand['status'] in {'NO_UPDATES','CANDIDATE_READY'},cand
          live={'USD','EUR','GBP','JPY','CAD','AUD'}
          changed=set(cand.get('changed_currencies') or [])
          assert changed <= live,(changed,live)
          assert set(proposed)==set(current)=={'USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'}
          for c in changed:
              s=cand['currencies'][c]
              assert s['new_date']>s['old_date'],s
              assert s['new_date']<=date.today().isoformat(),s
              row=proposed[c]
              assert row['date']==s['new_date'],(c,row,s)
              assert float(row['2Y'])==float(s['2Y']) and float(row['10Y'])==float(s['10Y']),(c,row,s)
              t={x['tenor']:x for x in row.get('tenors',[])}
              assert t['2Y']['date']==t['10Y']['date']==s['new_date'],(c,t,s)
              assert float(t['2Y']['value'])==float(s['2Y']) and float(t['10Y']['value'])==float(s['10Y']),(c,t,s)
              h2=row['history2']; h10=row['history10']
              assert h2['last_date']==h10['last_date']==s['new_date'],(c,h2.get('last_date'),h10.get('last_date'))
              assert float(h2['last_value'])==float(s['2Y']) and float(h10['last_value'])==float(s['10Y']),(c,h2,h10)
          if cand['status']=='NO_UPDATES':
              assert proposed==current
          else:
              actual={c for c in current if current[c]!=proposed[c]}
              assert actual==changed,(actual,changed)
          assert audit['currencies']['CHF']['coverage_mode']!='LIVE_FETCH'
          assert audit['currencies']['NZD']['coverage_mode']!='LIVE_FETCH'
          print('RATES_SOURCE_TEMPORAL_PAIRED_TENOR_PASS',sorted(changed))
          PY
      - name: Controlled Rates-only apply on checkout
        run: |
          set -euo pipefail
          STATUS=$(python -c "import json; print(json.load(open('/tmp/rates-contract/candidate-summary.json'))['status'])")
          if [ "$STATUS" = "CANDIDATE_READY" ]; then
            python validation/update_live_direct_section.py \
              --section NATIVE_RATES_DATA \
              --replacement /tmp/rates-contract/NATIVE_RATES_DATA.json \
              --apply | tee /tmp/rates-contract/direct-apply.json
          else
            cmp <(tr -d '\n' < /tmp/rates-contract/NATIVE_RATES_DATA.json) <(tr -d '\n' < live_data/sections/NATIVE_RATES_DATA.json)
            echo '{"status":"NO_CHANGE","applied":false}' | tee /tmp/rates-contract/direct-apply.json
          fi
          python validation/build_rates_audit_metadata.py \
            --audit-date "$(date -u +%Y-%m-%d)" \
            --output /tmp/rates-contract/RATES_AUDIT_METADATA.json \
            | tee /tmp/rates-contract/metadata-build.json
          python validation/update_live_derived_sections.py \
            --rates /tmp/rates-contract/RATES_AUDIT_METADATA.json \
            --apply | tee /tmp/rates-contract/derived-apply.json
      - name: Enforce exact Rates-only diff scope and runtime identity
        run: |
          python - <<'PY'
          import json,pathlib,subprocess
          cand=json.load(open('/tmp/rates-contract/candidate-summary.json'))
          proposed=pathlib.Path('/tmp/rates-contract/NATIVE_RATES_DATA.json').read_bytes()
          live=pathlib.Path('live_data/sections/NATIVE_RATES_DATA.json').read_bytes()
          assert live==proposed
          assert pathlib.Path('payload/part-00.txt').read_bytes().count(proposed)==1
          allowed={
            'live_data/sections/NATIVE_RATES_DATA.json',
            'live_data/sections/RATES_AUDIT_METADATA.json',
            'payload/part-00.txt',
            'payload/part-15.txt'
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert not (changed-allowed),(sorted(changed),sorted(changed-allowed))
          assert 'live_data/manifest.v2.json' not in changed
          if cand['status']=='CANDIDATE_READY':
              assert {'live_data/sections/NATIVE_RATES_DATA.json','payload/part-00.txt'} <= changed
          meta=json.load(open('/tmp/rates-contract/RATES_AUDIT_METADATA.json'))
          actual=json.load(open('live_data/sections/RATES_AUDIT_METADATA.json'))
          assert actual==meta
          receipt=json.load(open('/tmp/rates-contract/derived-apply.json'))
          assert receipt['status']=='PASS' and receipt['apply'] is True
          print('RATES_ONLY_EXACT_DIFF_SCOPE_PASS',sorted(changed))
          PY
          sha256sum \
            live_data/sections/NATIVE_RATES_DATA.json \
            live_data/sections/RATES_AUDIT_METADATA.json \
            live_data/manifest.v2.json \
            payload/part-00.txt \
            payload/part-15.txt > /tmp/rates-contract/after-first.sha256
      - name: Prove converged Rates state is idempotent
        run: |
          python validation/build_rates_audit_metadata.py \
            --audit-date "$(date -u +%Y-%m-%d)" \
            --output /tmp/rates-contract/RATES_AUDIT_METADATA.second.json \
            > /tmp/rates-contract/metadata-build-second.json
          cmp /tmp/rates-contract/RATES_AUDIT_METADATA.json /tmp/rates-contract/RATES_AUDIT_METADATA.second.json
          python validation/update_live_derived_sections.py \
            --rates /tmp/rates-contract/RATES_AUDIT_METADATA.second.json \
            --apply > /tmp/rates-contract/derived-apply-second.json
          sha256sum \
            live_data/sections/NATIVE_RATES_DATA.json \
            live_data/sections/RATES_AUDIT_METADATA.json \
            live_data/manifest.v2.json \
            payload/part-00.txt \
            payload/part-15.txt > /tmp/rates-contract/after-second.sha256
          cmp /tmp/rates-contract/after-first.sha256 /tmp/rates-contract/after-second.sha256
          echo RATES_CONVERGED_STATE_IDEMPOTENT_PASS
      - name: Restore tracked runtime and verify zero mutation
        if: always()
        run: |
          git checkout -- \
            live_data/sections/NATIVE_RATES_DATA.json \
            live_data/sections/RATES_AUDIT_METADATA.json \
            live_data/manifest.v2.json \
            payload/part-00.txt \
            payload/part-15.txt
          sha256sum -c /tmp/rates-runtime.before.sha256
          git diff --exit-code -- live_data payload
      - name: Summary
        run: |
          echo 'Rates controlled apply contract: GREEN'
          echo 'Official live fetch lanes: USD EUR GBP JPY CAD AUD'
          echo 'NZD: official manual lane retained; runner access blocked'
          echo 'CHF: WITHHELD; source export blocked'
          echo '2Y/10Y paired update: enforced'
          echo 'Controlled Rates-only diff scope: 4 files maximum'
          echo 'Converged Rates state idempotence: enforced'
          echo 'Global manifest rebuild: intentionally NOT certified here because pre-existing Macro standalone/payload drift is a separate blocker'
          echo 'Tracked runtime mutation: NONE'
          echo 'Publication: NONE'
