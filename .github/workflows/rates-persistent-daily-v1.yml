name: Rates Persistent Daily V1

on:
  push:
    branches:
      - main
      - rates-persistent-daily-v1-2026-10-14
    paths:
      - '.github/workflows/rates-persistent-daily-v1.yml'
      - 'validation/rates_schedule_gate_v2.py'
      - 'validation/test_rates_schedule_gate_v2.py'
      - 'validation/build_rates_audit_metadata.py'
      - 'validation/test_rates_source_age_metadata_v1.py'
      - 'validation/rates/probe_blocked_official_sources_v1.py'
      - 'validation/rates/test_probe_blocked_official_sources_v1.py'
      - 'validation/rates/check_snb_same_basis_candidate_v1.py'
      - 'validation/rates/test_check_snb_same_basis_candidate_v1.py'
  pull_request:
    paths:
      - '.github/workflows/rates-persistent-daily-v1.yml'
      - 'validation/rates_schedule_gate_v2.py'
      - 'validation/test_rates_schedule_gate_v2.py'
      - 'validation/build_rates_audit_metadata.py'
      - 'validation/test_rates_source_age_metadata_v1.py'
      - 'validation/rates/probe_blocked_official_sources_v1.py'
      - 'validation/rates/test_probe_blocked_official_sources_v1.py'
      - 'validation/rates/check_snb_same_basis_candidate_v1.py'
      - 'validation/rates/test_check_snb_same_basis_candidate_v1.py'
  workflow_dispatch:
  schedule:
    # Europe/Rome target windows: 07:20-07:39, 08:00-08:19, 09:00-09:19 on working days.
    # Duplicate UTC entries cover CET/CEST; cron identity resolves each Rome slot even if GitHub queues >20min.
    - cron: '20 5 * * 1-5'
    - cron: '20 6 * * 1-5'
    - cron: '0 6 * * 1-5'
    - cron: '0 7 * * 1-5'
    - cron: '0 8 * * 1-5'

permissions:
  contents: write

concurrency:
  group: rates-persistent-daily-v1
  cancel-in-progress: false

jobs:
  persist-rates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Test delayed DST-safe Rates schedule gate
        run: python3 validation/test_rates_schedule_gate_v2.py
      - name: Test source-age status labels for blocked/manual Rates
        run: python3 validation/test_rates_source_age_metadata_v1.py

      - name: Resolve Rates schedule from UTC cron and Rome offset
        id: gate
        shell: bash
        env:
          RATES_TRIGGER_EVENT: ${{ github.event_name }}
          RATES_TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          python3 validation/rates_schedule_gate_v2.py \
            --event "$RATES_TRIGGER_EVENT" \
            --cron "$RATES_TRIGGER_CRON" \
            --output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.should_run == 'true'
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: python -m pip install --disable-pip-version-check --no-input openpyxl

      - name: Test official SNB/RBNZ access evidence classification
        if: steps.gate.outputs.should_run == 'true'
        run: python3 validation/rates/test_probe_blocked_official_sources_v1.py

      - name: Probe blocked SNB/RBNZ official endpoints (no value promotion)
        if: ${{ always() && steps.gate.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rates-persistent
          python3 validation/rates/probe_blocked_official_sources_v1.py \
            --output /tmp/rates-persistent/blocked-source-access.json
          python3 - <<'PY'
          import json,os
          p='/tmp/rates-persistent/blocked-source-access.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['probe_status']=='EVIDENCE_ONLY' and d['core_model_effect']=='NONE'
          lines=['## CHF/NZD official access check (read-only)']
          for name,info in d['results'].items():
              assert info['eligible_for_automatic_promotion'] is False
              lines.append('- '+name+': **'+info['access']+'**'+
                           (' (HTTP '+str(info['http_status'])+')' if info['http_status'] else ' (transport unavailable)'))
          lines.append('No yield data were ingested, estimated or promoted.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('\n'.join(lines)+'\n')
          PY

      - name: Test strict SNB same-basis 2Y/10Y candidate (no auto-promote)
        if: steps.gate.outputs.should_run == 'true'
        run: python3 validation/rates/test_check_snb_same_basis_candidate_v1.py

      - name: Read-only official Swiss source candidate
        if: ${{ always() && steps.gate.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rates-persistent
          python3 validation/rates/check_snb_same_basis_candidate_v1.py \
            --output /tmp/rates-persistent/snb-chf-source-candidate.json
          python3 - <<'PY'
          import json,os
          p='/tmp/rates-persistent/snb-chf-source-candidate.json'
          r=json.load(open(p))
          c=r['candidate']
          assert c['eligible_for_automatic_promotion'] is False
          assert r['auto_promotion'] is False and r['changed_native_rates'] is False
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('\nSNB CHF 2Y/10Y source candidate: **'+c['status']+'**. '+
                        'No automatically promoted rates or Macro scores.\n')
          PY

      - name: Build official Rates candidate
        id: candidate
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rates-persistent
          python validation/run_rates_audit.py > /tmp/rates-persistent/audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/rates-persistent/audit.json').read_text())
          status=a.get('status')
          summary=a.get('summary',{})
          print('RATES_AUDIT_STATUS',status,'SUMMARY',json.dumps(summary,ensure_ascii=False)[:4000])
          if status!='PASS':
              for c,v in a.get('currencies',{}).items():
                  print('RATES_AUDIT_CURRENCY',c,'status',v.get('status'),'coverage_mode',v.get('coverage_mode'),
                        'reason',str(v.get('reason',v.get('error','')))[:350])
              raise SystemExit('Rates audit fail-closed: current official source issue. Check uploaded audit.json')
          PY
          python validation/build_rates_candidate_from_audit.py \
            --audit /tmp/rates-persistent/audit.json \
            --output /tmp/rates-persistent/NATIVE_RATES_DATA.json \
            | tee /tmp/rates-persistent/candidate-summary.json
          STATUS="$(python -c "import json; print(json.load(open('/tmp/rates-persistent/candidate-summary.json'))['status'])")"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          test "$STATUS" = 'NO_UPDATES' -o "$STATUS" = 'CANDIDATE_READY'
          git diff --exit-code -- live_data payload

      - name: Validate no-update identity
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'NO_UPDATES'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          a=json.load(open('/tmp/rates-persistent/NATIVE_RATES_DATA.json'))
          b=json.load(open('live_data/sections/NATIVE_RATES_DATA.json'))
          assert a == b, 'NO_UPDATES candidate differs from live section'
          print('RATES_PERSISTENT_NO_UPDATE_IDENTITY_PASS')
          PY
          python validation/check_live_update_contract.py > /tmp/rates-persistent/live-contract.json
          python validation/rebuild_live_data_runtime.py --verify-only > /tmp/rates-persistent/runtime-roundtrip.json
          git diff --exit-code -- live_data payload

      # An unchanged 2Y/10Y snapshot can still become stale overnight.
      # Refresh source-age metadata without writing or inventing Rates levels.
      - name: Preview dated Rates source-age metadata with no new observation
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'NO_UPDATES'
        shell: bash
        run: |
          set -euo pipefail
          python validation/build_rates_audit_metadata.py \
            --audit-date "$(TZ=Europe/Rome date +%F)" \
            --output /tmp/rates-persistent/RATES_AUDIT_METADATA.json
          python validation/update_live_derived_sections.py \
            --rates /tmp/rates-persistent/RATES_AUDIT_METADATA.json \
            > /tmp/rates-persistent/derived-metadata-preview.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/rates-persistent/RATES_AUDIT_METADATA.json'))
          assert x['rates']['CHF']['status']=='VALIDATED_HISTORICAL_OFFICIAL_SNAPSHOT', x['rates']['CHF']
          assert x['rates']['NZD']['source_access']=='RBNZ_B2_MANUAL_DOUBLE_REVIEW', x['rates']['NZD']
          actual=json.load(open('live_data/sections/NATIVE_RATES_DATA.json'))
          assert all(x['rates'][c]['current_as_of']==actual[c]['date'] for c in actual)
          assert x['rates']['CHF']['action']=='CHECK_NEXT_SOURCE_PUBLICATION'
          assert x['rates']['NZD']['status'].startswith('MANUAL_REVIEWED_')
          print('RATES_METADATA_SOURCE_AGE_PREVIEW_PASS')
          PY

      - name: Persist date-only Rates metadata on main even without new yields
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'NO_UPDATES' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          TARGET_BRANCH: main
        run: |
          set -euo pipefail
          python validation/update_live_derived_sections.py \
            --rates /tmp/rates-persistent/RATES_AUDIT_METADATA.json \
            --apply > /tmp/rates-persistent/derived-metadata-apply.json
          python validation/build_live_manifest_v2.py \
            --write live_data/manifest.v2.json > /tmp/rates-persistent/metadata-manifest.json
          python validation/check_live_update_contract.py > /tmp/rates-persistent/metadata-live-contract.json
          python validation/rebuild_live_data_runtime.py --verify-only > /tmp/rates-persistent/metadata-roundtrip.json
          python - <<'PY'
          import json,subprocess
          c=json.load(open('/tmp/rates-persistent/metadata-live-contract.json'))
          r=json.load(open('/tmp/rates-persistent/metadata-roundtrip.json'))
          assert c['status']=='PASS' and r['status']=='PASS' and r.get('noop_roundtrip_byte_identical') is True
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={'live_data/sections/RATES_AUDIT_METADATA.json','live_data/manifest.v2.json','payload/part-15.txt'}
          assert changed <= allowed, f'Metadata-only diff escaped scope: {changed-allowed}'
          assert 'live_data/sections/NATIVE_RATES_DATA.json' not in changed
          print('RATES_METADATA_NO_OBSERVATION_CHANGE_PASS',sorted(changed))
          PY
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$REMOTE_SHA" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- live_data/sections/RATES_AUDIT_METADATA.json live_data/manifest.v2.json payload/part-15.txt
          if git diff --cached --quiet; then
            echo 'Source-age metadata already up to date'
            exit 0
          fi
          git commit -m 'Refresh dated G8 Rates source-age metadata without new yields'
          REMOTE_SHA_2="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$REMOTE_SHA_2" = "$GITHUB_SHA"
          git push origin "HEAD:$TARGET_BRANCH"
          echo RATES_SOURCE_AGE_ONLY_MAIN_UPDATE_PUSHED

      - name: Apply validated Rates candidate
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'CANDIDATE_READY'
        shell: bash
        run: |
          set -euo pipefail
          python validation/update_live_direct_section.py \
            --section NATIVE_RATES_DATA \
            --replacement /tmp/rates-persistent/NATIVE_RATES_DATA.json \
            --apply > /tmp/rates-persistent/direct-apply.json
          python validation/build_rates_audit_metadata.py \
            --audit-date "$(TZ=Europe/Rome date +%F)" \
            --output /tmp/rates-persistent/RATES_AUDIT_METADATA.json
          python validation/update_live_derived_sections.py \
            --rates /tmp/rates-persistent/RATES_AUDIT_METADATA.json \
            --apply > /tmp/rates-persistent/derived-apply.json
          python validation/build_live_manifest_v2.py \
            --write live_data/manifest.v2.json > /tmp/rates-persistent/manifest-build.json
          python validation/check_live_update_contract.py > /tmp/rates-persistent/live-contract.json
          python validation/rebuild_live_data_runtime.py --verify-only > /tmp/rates-persistent/runtime-roundtrip.json
          python - <<'PY'
          import json
          c=json.load(open('/tmp/rates-persistent/live-contract.json'))
          r=json.load(open('/tmp/rates-persistent/runtime-roundtrip.json'))
          assert c['status']=='PASS', c
          assert r['status']=='PASS' and r.get('noop_roundtrip_byte_identical') is True, r
          print('RATES_PERSISTENT_CONTRACT_PASS')
          PY

      - name: Enforce Rates-only tracked diff scope
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'CANDIDATE_READY'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/rates-persistent/changed.txt
          python - <<'PY'
          changed=set(open('/tmp/rates-persistent/changed.txt').read().splitlines())
          allowed={
            'live_data/sections/NATIVE_RATES_DATA.json',
            'live_data/sections/RATES_AUDIT_METADATA.json',
            'live_data/manifest.v2.json',
            'payload/part-00.txt',
            'payload/part-15.txt',
          }
          bad=sorted(changed-allowed)
          assert not bad, f'Rates scope violation: {bad}'
          assert 'live_data/sections/NATIVE_RATES_DATA.json' in changed, changed
          print('RATES_PERSISTENT_SCOPE_PASS', sorted(changed))
          PY

      - name: Validation branch leaves runtime unchanged
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'CANDIDATE_READY' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- live_data payload
          git diff --exit-code -- live_data payload
          echo RATES_PERSISTENT_VALIDATION_ONLY_PASS

      - name: Commit validated Rates update to main with remote-head lease
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'CANDIDATE_READY' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          TARGET_BRANCH: main
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$REMOTE_SHA" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            live_data/sections/NATIVE_RATES_DATA.json \
            live_data/sections/RATES_AUDIT_METADATA.json \
            live_data/manifest.v2.json \
            payload/part-00.txt \
            payload/part-15.txt
          git diff --cached --quiet && { echo 'No Rates changes to persist'; exit 0; }
          git commit -m 'Refresh daily Rates runtime from official sources'
          REMOTE_SHA_2="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$REMOTE_SHA_2" = "$GITHUB_SHA"
          git push origin "HEAD:$TARGET_BRANCH"
          echo RATES_PERSISTENT_MAIN_UPDATE_PUSHED

      - name: Upload Rates evidence
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rates-persistent-daily-${{ github.run_id }}
          path: /tmp/rates-persistent/
          if-no-files-found: warn
          retention-days: 30
