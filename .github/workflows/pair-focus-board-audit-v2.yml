name: Pair Focus Board Audit V2

on:
  push:
    branches:
      - 'validation-pair-focus-board-audit-v2-2026-10-12'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/gmfq-server.log 2>&1 &
          sleep 2
      - name: Verify focus board invariants
        run: |
          cat > focus-audit.js <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.status==='PASS' || !!window.__GMFQ_BOOTSTRAP_ERROR,null,{timeout:120000});
            const bootstrap=await page.evaluate(()=>window.__GMFQ_BOOTSTRAP_ERROR||null);
            if(bootstrap) throw new Error('bootstrap '+bootstrap);
            await page.evaluate(()=>{ if(typeof window.showView==='function') window.showView('pairs'); });
            await page.waitForFunction(()=>window.__GMFQ_PAIR_FOCUS_BOARD_STATE?.pair_count===28,null,{timeout:30000});
            const before=await page.evaluate(()=>({state:window.__GMFQ_PAIR_FOCUS_BOARD_STATE,html:document.getElementById('gmfq-pair-focus-board')?.innerHTML||'',fp:document.getElementById('gmfq-pair-focus-board')?.dataset?.gmfqFocusFingerprint||'',buttons:[...document.querySelectorAll('#gmfq-pair-focus-board [data-gmfq-focus-pair]')].map(x=>x.dataset.gmfqFocusPair),guard:document.querySelector('#gmfq-pair-focus-board .guard')?.textContent||''}));
            await page.waitForTimeout(650);
            const after=await page.evaluate(()=>({html:document.getElementById('gmfq-pair-focus-board')?.innerHTML||'',fp:document.getElementById('gmfq-pair-focus-board')?.dataset?.gmfqFocusFingerprint||''}));
            const s=before.state;
            if(!s || s.status!=='PASS_PRESENTATION_ONLY') throw new Error('bad state');
            if(s.pair_count!==28) throw new Error('pair count');
            if((s.counts.A+s.counts.B+s.counts.CTX+s.counts.WAIT)!==28) throw new Error('bucket sum');
            if(s.no_hidden_score!==true || s.within_bucket_order!=='ALPHABETICAL') throw new Error('ranking contract');
            if(s.changes_engine!==false || s.changes_pair_logic!==false || s.changes_bias!==false || s.changes_sizing!==false) throw new Error('mutation contract');
            if(s.research_decision_weight!==0 || s.research_state_verified!==true || s.research_affects_classification!==false) throw new Error('research guard');
            if(before.guard.trim()!=='Research / Quant: 0 PESO') throw new Error('guard wording '+before.guard);
            if(before.buttons.length!==28 || new Set(before.buttons).size!==28) throw new Error('button coverage');
            if(!before.fp || before.fp!==after.fp || before.html!==after.html) throw new Error('idempotence failure');
            if(errors.length) throw new Error('browser errors: '+errors.join(' | '));
            console.log(JSON.stringify({status:'PASS_PAIR_FOCUS_BOARD',counts:s.counts,buttons:before.buttons,research_weight:s.research_decision_weight,research_verified:s.research_state_verified},null,2));
            await page.screenshot({path:'pair-focus-board.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node focus-audit.js
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pair-focus-board-audit-v2
          path: |
            pair-focus-board.png
            /tmp/gmfq-server.log
