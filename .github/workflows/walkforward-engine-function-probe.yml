name: Walkforward Engine Function Probe

on:
  push:
    branches:
      - validation-price-ecb-history-v1-2026-10-06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Audit historical macro and 2Y input availability
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('history/MACRO_SERIES_2016_2026_RUNTIME_ARCHIVE_2026-10-01.js')
          t=p.read_text(errors='ignore').strip(); x=json.loads(t[t.find('=')+1:t.rfind(';')].strip())
          ids={
            'USD':'US_DGS2_history_DGS2','GBP':'GBP_RATES_2016_2026_2Y','JPY':'JPY_RATES_2016_2026_2Y',
            'CHF':'CH_CONFED_SPOT_2Y_history_value_pct','CAD':'CAD_RATES_2016_2026_2Y','AUD':'AU_FCMYGBAG2D_history_FCMYGBAG2D','NZD':'NZD_RATES_2016_2026_RBNZ_B2_2Y'}
          for c,series in x.items():
            cats={cat:sum(1 for s in series if s.get('category')==cat) for cat in ['Crescita','Lavoro']}
            rid=ids.get(c)
            rs=next((s for s in series if s.get('id')==rid),None) if rid else None
            print(c,'TOTAL',len(series),'CATS',cats,'RATE_ID',rid,'RATE_FOUND',bool(rs),'RATE_N',len(rs.get('values',[])) if rs else None)
            print(' LABOUR_IDS',[s.get('id') for s in series if s.get('category')=='Lavoro'])
            print(' GROWTH_IDS',[s.get('id') for s in series if s.get('category')=='Crescita'])
          PY
