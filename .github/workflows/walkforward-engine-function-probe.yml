name: Walkforward Engine Function Probe

on:
  push:
    branches:
      - validation-price-ecb-history-v1-2026-10-06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover historical JPY 2Y source from validated commit
        shell: bash
        run: |
          git fetch origin 1cb2a7e61dc42d4cd22b6e49c6369018703743e6 --depth=1
          git show 1cb2a7e61dc42d4cd22b6e49c6369018703743e6:data/sections/series_JPY.json > /tmp/series_JPY_old.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/series_JPY_old.json').read_text())
          hits=[x for x in a if x.get('id')=='JPY_RATES_2016_2026_2Y' or ('2Y' in str(x.get('id','')) and x.get('category') in ('Rates','Tassi'))]
          print('MATCHES',len(hits))
          for x in hits:
            print(json.dumps({
              'id':x.get('id'),'label':x.get('label'),'category':x.get('category'),
              'n_dates':len(x.get('dates',[])),'n_values':len(x.get('values',[])),
              'first_date':x.get('dates',[None])[0] if x.get('dates') else None,
              'last_date':x.get('dates',[None])[-1] if x.get('dates') else None,
              'first_values':x.get('values',[])[:5],
              'last_values':x.get('values',[])[-5:],
              'unit':x.get('unit'),'frequency':x.get('frequency'),'source_file':x.get('source_file')
            },indent=2))
          if not hits:
            print('RATE_LIKE_IDS')
            for x in a:
              if 'rate' in str(x.get('id','')).lower() or 'yield' in str(x.get('label','')).lower() or '2y' in str(x.get('id','')).lower():
                print(x.get('id'),x.get('label'),x.get('category'),len(x.get('values',[])))
          PY
