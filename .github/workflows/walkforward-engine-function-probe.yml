name: Walkforward Engine Function Probe

on:
  push:
    branches:
      - validation-price-ecb-history-v1-2026-10-06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Extract pair hierarchy logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          needles=['CONTRASTO STRUTTURALE FORTE','VANTAGGIO RELATIVO PARZIALE','PILASTRI DIVISI','macro_side','policy_side','macroSide','rateSide','ratesSide']
          files=list(Path('payload').glob('part-*.txt'))
          seen=set()
          for needle in needles:
            print(f'===== {needle} =====')
            found=False
            for p in files:
              text=p.read_text(errors='ignore')
              pos=text.find(needle)
              if pos>=0:
                key=(str(p),pos)
                if key not in seen:
                  seen.add(key)
                  print(f'FILE={p}')
                  print(text[max(0,pos-3500):min(len(text),pos+5500)])
                found=True
                break
            if not found: print('NOT_FOUND')
          PY
