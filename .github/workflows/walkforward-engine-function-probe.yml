name: Walkforward Engine Function Probe

on:
  push:
    branches:
      - validation-price-ecb-history-v1-2026-10-06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect frozen macro archive structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('history/MACRO_SERIES_2016_2026_RUNTIME_ARCHIVE_2026-10-01.js')
          t=p.read_text(errors='ignore').strip()
          eq=t.find('='); end=t.rfind(';')
          x=json.loads(t[eq+1:end if end>eq else None].strip())
          print('ROOT_TYPE',type(x).__name__)
          if isinstance(x,dict):
            print('ROOT_KEYS',list(x.keys())[:50])
            for k,v in x.items():
              print('KEY',k,'TYPE',type(v).__name__)
              if isinstance(v,dict): print(' SUBKEYS',list(v.keys())[:30])
              elif isinstance(v,list): print(' LEN',len(v),'FIRST_TYPE',type(v[0]).__name__ if v else None,'FIRST',str(v[0])[:1500] if v else '')
          for c in ['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD']:
            def walk(o,path='root',depth=0):
              if depth>3:return
              if isinstance(o,dict):
                if c in o:
                  v=o[c]; print('FOUND',c,'AT',path,'TYPE',type(v).__name__,'SAMPLE',str(v)[:3000])
                for kk,vv in list(o.items())[:50]: walk(vv,path+'.'+str(kk),depth+1)
            walk(x)
          PY
