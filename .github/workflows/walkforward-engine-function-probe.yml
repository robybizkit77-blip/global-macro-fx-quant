name: Walkforward Engine Function Probe

on:
  push:
    branches:
      - validation-price-ecb-history-v1-2026-10-06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Locate excess historical WITHHELD coverage
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from datetime import date
          from pathlib import Path
          Stext=Path('history/MACRO_SERIES_2016_2026_RUNTIME_ARCHIVE_2026-10-01.js').read_text(errors='ignore').strip()
          S=json.loads(Stext[Stext.find('=')+1:Stext.rfind(';')].strip())
          RID={'USD':'US_DGS2_history_DGS2','GBP':'GBP_RATES_2016_2026_2Y','JPY':'JPY_RATES_2016_2026_2Y','CHF':'CH_CONFED_SPOT_2Y_history_value_pct','CAD':'CAD_RATES_2016_2026_2Y','AUD':'AU_FCMYGBAG2D_history_FCMYGBAG2D','NZD':'NZD_RATES_2016_2026_RBNZ_B2_2Y'}
          def dk(x):
            s=str(x)
            try:return date(int(s[:4]),int(s[5:7]),1) if re.fullmatch(r'\d{4}-\d{2}',s) else date.fromisoformat(s[:10])
            except:return None
          for c in ['USD','GBP','JPY','CHF','CAD','AUD','NZD']:
            rid=RID[c]; rs=next(s for s in S[c] if s.get('id')==rid)
            pairs=[(dk(d),v) for d,v in zip(rs.get('dates',[]),rs.get('values',[])) if dk(d)]
            pairs.sort(key=lambda x:x[0])
            print('\n',c,'RATE',rid,'N',len(pairs),'FIRST5',pairs[:5],'LAST',pairs[-1] if pairs else None)
            # first date with at least 10 numeric observations
            valid=[]; first10=None
            for d,v in pairs:
              if isinstance(v,(int,float)):
                valid.append((d,v))
                if len(valid)==10 and first10 is None:first10=d
            print(c,'RATE_FIRST10',first10)
            for cat in ['Crescita','Lavoro']:
              print(c,cat)
              for s in [x for x in S[c] if x.get('category')==cat]:
                ds=[dk(d) for d,v in zip(s.get('dates',[]),s.get('values',[])) if dk(d) and isinstance(v,(int,float))]
                ds.sort()
                print(' ',s.get('id'),'label=',s.get('label'),'n=',len(ds),'first=',ds[0] if ds else None,'eighth=',ds[7] if len(ds)>=8 else None)
          PY
