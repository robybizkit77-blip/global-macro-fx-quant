name: Walkforward Engine Function Probe

on:
  push:
    branches:
      - validation-price-ecb-history-v1-2026-10-06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Extract derivePairDecisionFrame implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          names=['derivePairDecisionFrame','deriveCurrencyState','pairPillarSide','currencyMacroPolarity','macroPolarity','policyFamilyPolarity']
          files=list(Path('payload').glob('part-*.txt'))
          for name in names:
            print(f'===== {name} =====')
            found=False
            for p in files:
              text=p.read_text(errors='ignore')
              m=re.search(rf'function\s+{name}\s*\(',text)
              if m:
                print(f'FILE={p}')
                print(text[max(0,m.start()-2500):min(len(text),m.start()+9000)])
                found=True
                break
            if not found: print('NOT_FOUND')
          PY
