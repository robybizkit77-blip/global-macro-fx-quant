name: JPY Labour Propagation Audit

on:
  push:
    branches:
      - staging-macro-jpy-labour-v1-2026-10-05
    paths:
      - 'validation/audit_jpy_labour_paths.py'
      - 'validation/reverse_audit_jpy_labour.py'
      - 'validation/reverse_audit_macro_thermometer_dynamics.py'
      - 'validation/reverse_audit_macro_temperature_labels.py'
      - 'validation/trace_macro_runtime_semantics.py'
      - 'validation/trace_d_macro_derivation.py'
      - '.github/workflows/jpy-labour-propagation-audit.yml'
      - 'live_data/sections/D.json'
      - 'live_data/sections/MACRO_SERIES.json'
      - 'live_data/sections/MACRO_THERMOMETER_DATA.json'
      - 'payload/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run read-only JPY labour path audit
        run: python validation/audit_jpy_labour_paths.py
      - name: Reverse-audit JPY labour derivation
        run: python validation/reverse_audit_jpy_labour.py
      - name: Reverse-audit macro thermometer dynamics
        run: python validation/reverse_audit_macro_thermometer_dynamics.py
      - name: Reverse-audit macro temperature labels
        run: python validation/reverse_audit_macro_temperature_labels.py
      - name: Trace runtime macro semantics
        run: python validation/trace_macro_runtime_semantics.py
      - name: Trace D macro derivation contract
        run: python validation/trace_d_macro_derivation.py
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: jpy-labour-propagation-audit
          path: |
            validation/JPN_LABOUR_PROPAGATION_AUDIT_2026-10-05.json
            validation/JPN_LABOUR_REVERSE_AUDIT_2026-10-05.json
            validation/MACRO_THERMOMETER_DYNAMICS_REVERSE_AUDIT_2026-10-05.json
            validation/MACRO_TEMPERATURE_LABEL_AUDIT_2026-10-05.json
            validation/MACRO_RUNTIME_SEMANTICS_TRACE_2026-10-05.json
            validation/D_MACRO_DERIVATION_TRACE_2026-10-05.json
