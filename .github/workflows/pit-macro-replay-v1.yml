name: PIT Macro Replay V1

on:
  push:
    branches:
      - staging-usd-pit-readiness-2026-10-03
    paths:
      - 'validation/build_pit_macro_replay_v1.py'
      - '.github/workflows/pit-macro-replay-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-usd-pit-readiness-2026-10-03
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build PIT macro replay
        run: python validation/build_pit_macro_replay_v1.py
      - name: Commit PIT macro replay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/PIT_MACRO_REPLAY_V1_2026-10-03.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build PIT macro replay v1"
            git pull --rebase origin staging-usd-pit-readiness-2026-10-03
            git push origin HEAD:staging-usd-pit-readiness-2026-10-03
          fi
