name: CFTC Real Source Refresh Dry Run

on:
  workflow_dispatch:
  push:
    branches:
      - design-live-update-pipeline-v1-2026-10-05
    paths:
      - 'validation/verify_cftc_current_snapshot.py'
      - 'validation/build_cot_stories.py'
      - 'validation/update_live_derived_sections.py'
      - '.github/workflows/cftc-real-source-refresh-dryrun.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify official CFTC current snapshot against direct live data
        run: python3 validation/verify_cftc_current_snapshot.py | tee /tmp/cftc-official-verification.json

      - name: Build canonical COT stories from verified direct data
        run: python3 validation/build_cot_stories.py --output /tmp/V247_COT_STORIES.built.json | tee /tmp/cot-story-builder.json

      - name: Apply derived COT refresh in ephemeral workspace
        run: |
          python3 validation/update_live_derived_sections.py \
            --cot /tmp/V247_COT_STORIES.built.json \
            --apply | tee /tmp/cftc-derived-injector.json

      - name: Verify refresh scope and expected corrections
        run: |
          python3 - <<'PY'
          import json,subprocess
          src=json.load(open('/tmp/cftc-official-verification.json'))
          assert src['status']=='PASS',src
          assert src['direct_section_action']=='NO_CHANGE',src
          assert src['currencies']==8,src
          cot=json.load(open('live_data/sections/V247_COT_STORIES.json'))
          assert cot['CHF']['signal']=='EXTREME LONG',cot['CHF']
          assert cot['CAD']['signal']=='NEUTRALE',cot['CAD']
          assert all('open interest' not in x['funds_detail'].lower() for x in cot.values())
          changed=subprocess.check_output(['git','status','--short'],text=True).splitlines()
          paths=[x[3:] for x in changed]
          allowed={'live_data/sections/V247_COT_STORIES.json',*[f'payload/part-{i:02d}.txt' for i in range(16)]}
          bad=[p for p in paths if p not in allowed]
          if bad: raise SystemExit('Unexpected changed files: '+', '.join(bad))
          if 'live_data/sections/V250_COT_CHART_DATA.json' in paths:
              raise SystemExit('Direct COT section unexpectedly changed despite official equality')
          if 'live_data/sections/V247_COT_STORIES.json' not in paths:
              raise SystemExit('Derived story did not refresh')
          print(json.dumps({'status':'PASS','changed_files':paths,'official_as_of':src['as_of']},indent=2))
          PY

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 > /tmp/gmfq-cftc-refresh-server.log 2>&1 &
          echo $! > /tmp/gmfq-cftc-refresh-server.pid
          sleep 2

      - name: Run exact Engine Gate logic on real-source candidate
        shell: bash
        run: |
          awk "/cat > engine-audit.js <<'EOF'/{flag=1;next}/^          EOF$/{if(flag){exit}}flag{sub(/^          /,\"\");print}" .github/workflows/engine-logic-audit.yml > engine-audit.js
          test -s engine-audit.js
          sed -i 's#http://127.0.0.1:8765/#http://127.0.0.1:8767/#g' engine-audit.js
          node engine-audit.js

      - name: Run exact Browser Gate logic on real-source candidate
        shell: bash
        run: |
          awk "/cat > browser-audit.js <<'EOF'/{flag=1;next}/^          EOF$/{if(flag){exit}}flag{sub(/^          /,\"\");print}" .github/workflows/staging-browser-audit.yml > browser-audit.js
          test -s browser-audit.js
          sed -i 's#http://127.0.0.1:8000/#http://127.0.0.1:8767/#g' browser-audit.js
          node browser-audit.js

      - name: Confirm staging-only dry run
        run: |
          echo 'CFTC_REAL_SOURCE_REFRESH_DRYRUN_PASS_CANDIDATE'
          echo 'Official source verified. No commit of generated data, no main, no gh-pages, no schedule.'

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cftc-real-source-refresh-evidence
          if-no-files-found: warn
          path: |
            /tmp/cftc-official-verification.json
            /tmp/cot-story-builder.json
            /tmp/cftc-derived-injector.json
            /tmp/gmfq-cftc-refresh-server.log
            staging-browser-audit.png
