name: Apply Certified GBP Labour Overlay Candidate V1

on:
  push:
    branches:
      - validation-gbp-labour-freshness-v1-2026-10-12
    paths:
      - '.github/workflows/apply-certified-gbp-labour-overlay-candidate-v1.yml'

permissions:
  contents: write

env:
  TARGET_BRANCH: candidate-gbp-labour-canonical-overlay-2026-10-12
  EXPECTED_HEAD: 5e1c38fd4e651f7deef2028977930941cfb742e5
  EXPECTED_SERIES_SHA256: 13ebf5d4273757775a9de2c656f780e16bea260ac991edbf5827fd65c65cf242
  EXPECTED_HEAT_SHA256: be2fa04a60d6772a10279303736f82085bed6f375690d01f7301ed35162bfad2
  EXPECTED_MANIFEST_SHA256: aef695d0f6c4e1ee0492fb57c4fb20382efa7ba8bc122baddda89bc26e7fe72c
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  apply-certified-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce target lease and clean repository
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"

      - name: Rebuild the already-certified three-file candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gbp-certified/built
          python3 validation/build_macro_candidate.py \
            --candidate validation/candidates/gbp_labour_2026_07_strict_pit.json \
            --output-dir /tmp/gbp-certified/built \
            > /tmp/gbp-certified/builder.json
          cp /tmp/gbp-certified/built/MACRO_SERIES.json live_data/sections/MACRO_SERIES.json
          cp /tmp/gbp-certified/built/MACRO_THERMOMETER_DATA.json live_data/sections/MACRO_THERMOMETER_DATA.json
          python3 validation/build_live_manifest_v2.py --write live_data/manifest.v2.json \
            > /tmp/gbp-certified/manifest.json

      - name: Require exact certified hashes and exact diff scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum live_data/sections/MACRO_SERIES.json | awk '{print $1}')" = "$EXPECTED_SERIES_SHA256"
          test "$(sha256sum live_data/sections/MACRO_THERMOMETER_DATA.json | awk '{print $1}')" = "$EXPECTED_HEAT_SHA256"
          test "$(sha256sum live_data/manifest.v2.json | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA256"
          test -z "$(git diff --name-only -- payload)"
          git diff --name-only | sort > /tmp/gbp-certified/changed.txt
          printf '%s\n' \
            live_data/manifest.v2.json \
            live_data/sections/MACRO_SERIES.json \
            live_data/sections/MACRO_THERMOMETER_DATA.json \
            | sort > /tmp/gbp-certified/expected.txt
          diff -u /tmp/gbp-certified/expected.txt /tmp/gbp-certified/changed.txt

      - name: Re-run canonical contracts before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/check_live_update_contract.py > /tmp/gbp-certified/live-contract.json
          python3 validation/rebuild_live_data_runtime.py --verify-only > /tmp/gbp-certified/runtime-roundtrip.json
          python3 - <<'PY' > /tmp/gbp-certified/semantic.json
          import json
          from pathlib import Path
          s=json.loads(Path('live_data/sections/MACRO_SERIES.json').read_text())
          h=json.loads(Path('live_data/sections/MACRO_THERMOMETER_DATA.json').read_text())
          row=next(x for x in s['GBP'] if x['id']=='UK_UNEMP_RATE_history_value')
          lab=h['currencies']['GBP']['labour']
          m=json.loads(Path('live_data/manifest.v2.json').read_text())
          modes={x['key']:x['mode'] for x in m['sections']}
          assert row['last_date']=='2026-07' and abs(float(row['last_value'])-4.9)<1e-12
          assert lab['as_of']=='2026-07' and abs(float(lab['latest_value'])-4.9)<1e-12
          assert h['currencies']['GBP']['as_of_detail']['unemployment']=='2026-07'
          assert modes['MACRO_SERIES']=='RUNTIME_OVERLAY'
          assert modes['MACRO_THERMOMETER_DATA']=='RUNTIME_OVERLAY'
          print(json.dumps({'status':'PASS','gbp_labour_as_of':'2026-07','value':4.9,'percentile':lab['percentile'],'temperature':lab['temperature_label'],'direction':lab['direction'],'acceleration':lab['acceleration'],'payload_changed':False},indent=2))
          PY

      - name: Commit only the certified canonical artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live_data/sections/MACRO_SERIES.json live_data/sections/MACRO_THERMOMETER_DATA.json live_data/manifest.v2.json
          test -z "$(git diff --name-only --cached -- payload)"
          git commit -m 'Refresh GBP labour canonical Macro overlay to July 2026'
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Upload apply evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certified-gbp-labour-overlay-apply-${{ github.run_id }}
          path: /tmp/gbp-certified/
          if-no-files-found: warn
          retention-days: 60
