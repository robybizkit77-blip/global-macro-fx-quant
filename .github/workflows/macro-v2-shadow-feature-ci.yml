      - 'validation/macro/test_v2_eurusd_intraday_csv_research_v1.py'
      - 'validation/macro/v2_dukascopy_bi5_hour_probe_v1.py'
      - 'validation/macro/test_v2_dukascopy_bi5_hour_probe_v1.py'
      - 'validation/macro/v2_bls_eight_fx_bi5_probe_v1.py'
      - 'validation/macro/test_v2_bls_eight_fx_bi5_probe_v1.py'
      - 'validation/macro/MACRO_V2_EURUSD_INTRADAY_IMPORT_GATE_2026-10-23.md'
      - 'validation/macro/MACRO_V2_BLS_INTRADAY_EVIDENCE_ACQUISITION_2026-10-23.md'
      - 'validation/macro/v2_usd_labour_research_desk_brief_v1.py'
      - 'validation/macro/test_v2_usd_labour_research_desk_brief_v1.py'
      - 'validation/macro/v2_growth_inflation_g8_desk_inventory_v1.py'
      - 'validation/macro/test_v2_growth_inflation_g8_desk_inventory_v1.py'
      - 'validation/macro/MACRO_V2_EUR_HICP_SEP_2026_RELEASE_SEQUENCE_2026-10-24.json'
      - 'validation/macro/v2_growth_inflation_release_crosswalk_v1.py'
      - 'validation/macro/test_v2_growth_inflation_release_crosswalk_v1.py'
      - 'validation/macro/MACRO_V2_AUD_EUR_OFFICIAL_FRESHNESS_GAPS_2026-10-24.json'
      - 'validation/macro/v2_source_freshness_aud_eur_v1.py'
      - 'validation/macro/test_v2_source_freshness_aud_eur_v1.py'
      - 'validation/macro/fixtures/v2_abs_eurostat_2026_official_event_pilot.json'
      - 'validation/macro/v2_abs_eurostat_publication_event_replay_v1.py'
      - 'validation/macro/test_v2_abs_eurostat_publication_event_replay_v1.py'
      - 'validation/macro/MACRO_V2_ABS_EUROSTAT_OFFICIAL_EVENT_REPLAY_2026-10-24.md'
      - 'validation/macro/fixtures/v2_abs_complete_monthly_cpi_11_release_web_ledger_2026-10-24.json'
      - 'validation/macro/v2_abs_complete_monthly_cpi_11_release_replay_v1.py'
      - 'validation/macro/test_v2_abs_complete_monthly_cpi_11_release_replay_v1.py'
      - 'validation/macro/MACRO_V2_ABS_11_COMPLETE_MONTHLY_CPI_RELEASES_2026-10-24.md'
      - 'validation/macro/fixtures/v2_abs_trimmed_cross_publication_2026_v1.json'
      - 'validation/macro/v2_abs_trimmed_cross_publication_v1.py'
      - 'validation/macro/test_v2_abs_trimmed_cross_publication_v1.py'
      - 'validation/macro/MACRO_V2_ABS_TRIMMED_CROSS_PUBLICATION_VINTAGES_2026-10-24.md'
      - 'validation/macro/fixtures/v2_eurostat_hicp_sep2026_components_flash_final.json'
      - 'validation/macro/v2_eurostat_hicp_component_event_replay_v1.py'
      - 'validation/macro/test_v2_eurostat_hicp_component_event_replay_v1.py'
      - 'validation/macro/MACRO_V2_EUROSTAT_HICP_SEP_2026_COMPONENT_FLASH_FINAL_AUDIT.md'
      - 'validation/macro/fixtures/v2_eurostat_hicp_jul_sep_2026_flash_detailed_v1.json'
      - 'validation/macro/v2_eurostat_hicp_three_month_replay_v1.py'
      - 'validation/macro/test_v2_eurostat_hicp_three_month_replay_v1.py'
      - 'validation/macro/MACRO_V2_EUROSTAT_HICP_JUL_SEP_2026_SIX_RELEASE_WEB_REPLAY.md'
      - 'validation/macro/fixtures/v2_eurostat_hicp_may_june_2026_addendum_v1.json'
      - 'validation/macro/v2_eurostat_hicp_five_month_replay_v1.py'
      - 'validation/macro/test_v2_eurostat_hicp_five_month_replay_v1.py'
      - 'validation/macro/MACRO_V2_EUROSTAT_HICP_MAY_SEP_FIVE_MONTH_REPLAY_2026-10-24.md'
      - 'validation/macro/fixtures/v2_eurostat_hicp_mar_apr_2026_release_addendum_v1.json'
      - 'validation/macro/v2_eurostat_hicp_seven_month_replay_v1.py'
      - 'validation/macro/test_v2_eurostat_hicp_seven_month_replay_v1.py'
      - 'validation/macro/MACRO_V2_EUROSTAT_HICP_MAR_SEP_SEVEN_MONTH_REPLAY_2026-10-24.md'
      - 'validation/macro/fixtures/v2_eurostat_hicp_jan_feb_2026_corrigenda_v1.json'
      - 'validation/macro/v2_eurostat_hicp_nine_month_corrigendum_replay_v1.py'
      - 'validation/macro/test_v2_eurostat_hicp_nine_month_corrigendum_replay_v1.py'
      - 'validation/macro/MACRO_V2_EUROSTAT_JAN_SEP_NINE_MONTH_CORRIGENDA_2026-10-24.md'
      - 'validation/macro/fixtures/v2_eurostat_hicp_dec2025_ea20_transition_v1.json'
      - 'validation/macro/v2_eurostat_dec2025_regime_bridge_replay_v1.py'
      - 'validation/macro/test_v2_eurostat_dec2025_regime_bridge_replay_v1.py'
      - 'validation/macro/MACRO_V2_EUROSTAT_DEC2025_EA20_EA21_PIT_BRIDGE_2026-10-24.md'
      - 'validation/macro/v2_pit_g8_evidence_adapters_v1.py'
      - 'validation/macro/v2_pit_g8_control_plane_v1.py'
      - 'validation/macro/test_v2_pit_g8_control_plane_v1.py'
      - 'validation/macro/MACRO_V2_G8_SHARED_PIT_CONTROL_PLANE_2026-10-24.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-pit-feature-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test first-release and revision PIT guardrails (synthetic)
        run: python -m unittest validation.macro.test_v2_shadow_features_v1 -v
      - name: Replay five official BLS first-release web attestations without future leakage
        run: |
          set -euo pipefail
          python -m unittest validation.macro.test_v2_bls_unrate_first_release_pilot_v1 -v
          mkdir -p /tmp/macro-v2-shadow
          python -m validation.macro.v2_bls_unrate_first_release_pilot_v1 \
            --asof 2024-05-03T12:30:00Z \
            --out /tmp/macro-v2-shadow/bls-unrate-pilot.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/macro-v2-shadow/bls-unrate-pilot.json'))
          assert r['raw_features']['latest_period']=='2024-04'
          assert r['illustrative_normalization']['training_observations']==4
          assert r['archival_source_bytes_hashed'] is False
          assert r['full_historical_pit_certified'] is False
          assert r['ready_for_macro_scoring'] is False
          assert r['safe_to_publish_new_D'] is False
          assert r['safe_to_update_pair_theses'] is False
          assert r['writes_live_data'] is False
          print('BLS_FIRST_RELEASE_SHADOW_PILOT_GREEN_NOT_MODEL_CERTIFIED')
          PY
      - name: Inventory G8 observed sources without live model publication
        run: |
          set -euo pipefail
          mkdir -p /tmp/macro-v2-shadow
          python -m validation.macro.v2_shadow_features_v1 --out /tmp/macro-v2-shadow/inventory.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/macro-v2-shadow/inventory.json'))
          assert r['currency_count']==8 and r['inflation_labour_registered']==16
          assert r['growth_observation_series_total'] > 0
          for key in ('ready_for_live_feature_replay','ready_for_scoring',
                      'safe_to_publish_new_D','safe_to_update_pair_theses',
                      'writes_live_data'):
              assert r[key] is False, key
          print('V2_SHADOW_FEATURE_CONTRACT_PASS__NO_LIVE_SCORE_OR_PAIR_UPDATE')
          PY
      - name: Verify phase-2 PIT research normalization, leakage and missing-window controls
        run: |
          set -euo pipefail
          python -m unittest validation.macro.test_v2_shadow_intensity_v1 -v
          python - <<'PY'
          import json
          from pathlib import Path
          from validation.macro.test_v2_shadow_intensity_v1 import fixture
          from validation.macro.v2_shadow_intensity_v1 import build_shadow_intensity
          r=build_shadow_intensity(fixture())
          assert r['schema']=='GMFQ_MACRO_V2_SHADOW_INTENSITY_V1'
          assert r['training_first_releases']==24
          assert r['economic_dimension']=='LABOUR_TIGHTNESS'
          assert r['source_evidence_is_independently_certified'] is False
          for key in ('ready_for_macro_scoring','usable_for_backtest',
                      'safe_to_publish_new_D','safe_to_update_pair_theses','writes_live_data'):
              assert r[key] is False,key
          p=Path('/tmp/macro-v2-shadow/phase2-synthetic-receipt.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(r,indent=2)+'\\n')
          print('MACRO_V2_SHADOW_PHASE2_NO_LIVE_SCORE_GREEN',r['latest_period'])
          PY
      - name: Audit actual G8 24-pillar PIT-readiness without inventing release timestamps
        run: |
          set -euo pipefail
          python -m unittest validation.macro.test_v2_pit_coverage_readiness_v1 -v
          python -m validation.macro.v2_pit_coverage_readiness_v1 \
            --asof 2026-10-23 \
            --json-out /tmp/macro-v2-shadow/pit-readiness-g8.json \
            --markdown-out /tmp/macro-v2-shadow/pit-readiness-g8.md
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/macro-v2-shadow/pit-readiness-g8.json')
          x=json.loads(p.read_text())
          assert x['schema']=='GMFQ_MACRO_V2_G8_PIT_COVERAGE_READINESS_V1'
          assert x['summary']['observed_pillar_slots']==24
          assert x['summary']['registered_core_series']==16
          assert x['summary']['latest_core_official_web_anchors']==8
          assert x['summary']['latest_growth_official_web_anchors']==2
          assert x['summary']['certified_full_first_release_histories']==0
          assert x['summary']['eligible_live_macro_pillars']==0
          assert all(x[k] is False for k in
            ('safe_to_publish_new_D','safe_to_update_pair_theses','writes_live_data'))
          print('MACRO_V2_G8_24_OBSERVED_0_PIT_SCORE_CERTIFIED_PASS')
          PY
      - name: Validate 25 actual archived BLS U-3 first releases and compute historical shadow-only intensity
        run: |
          set -euo pipefail
          python -m unittest validation.macro.test_v2_bls_us_unrate_25_release_pilot_v1 -v
          python -m validation.macro.v2_bls_us_unrate_25_release_pilot_v1 \
            --out /tmp/macro-v2-shadow/us-labour-25-first-release-historical-pilot.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/macro-v2-shadow/us-labour-25-first-release-historical-pilot.json')
          x=json.loads(p.read_text())
          assert x['historical_cutoff']=='2025-11-20T13:30:00Z'
          assert x['training_releases']==24
          assert x['first_release_dates_officially_attested_in_archived_web_pages']==25
          assert x['october_2025_release_gap'] is True
          assert x['not_a_current_2026_macro_score'] is True
          assert x['current_first_release']==4.4
          assert abs(x['labour_tightness_intensity_not_currency_strength']+2.0234722784)<1e-6
          for key in ('independent_full_pit_certified','eligible_for_live_macro',
                      'eligible_for_backtest','safe_to_publish_new_D',
                      'safe_to_update_pair_theses','writes_live_data'):
              assert x[key] is False,key
          print('BLS_25_ACTUAL_FIRST_RELEASES_HISTORICAL_RESEARCH_PASS_NOT_LIVE_FX_SCORE')
          PY
      - name: Check missing October 2025 CPS observation and timestamped Nov-Dec research-only reentry
        run: |
          set -euo pipefail
          python -m unittest validation.macro.test_v2_bls_shutdown_sparse_reentry_v1 -v
          python -m validation.macro.v2_bls_shutdown_sparse_reentry_v1 \
            --asof 2026-01-09T13:30:00Z \
            --out /tmp/macro-v2-shadow/bls-shutdown-gap-reentry.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/macro-v2-shadow/bls-shutdown-gap-reentry.json').read_text())
          assert r['first_release_periods_available']==27
          assert r['reentered_first_releases']==2
          assert r['missing_2025_10_CPS_reference_period'] is True
          assert r['missing_2025_10_observation_imputed'] is False
          assert r['missing_2025_10_first_release_invented'] is False
          assert [x['reference_period'] for x in r['historical_reentry_snapshots']] == ['2025-11','2025-12']
          for x in r['historical_reentry_snapshots']:
              assert x['velocity_per_month'] is None
              assert x['acceleration_per_month_squared'] is None
              assert x['turning_point_per_month'] is None
          for k in ('safe_to_publish_new_D','safe_to_update_pair_theses',
                    'eligible_for_live_scoring','eligible_for_backtest','writes_live_data'):
              assert r[k] is False,k
          print('BLS_OCT_2025_STRUCTURAL_CPS_GAP_NOV_DEC_REENTRY_RESEARCH_ONLY_PASS')
          PY
      - name: Audit nine original BLS U3 2026 first releases and historical PIT event cutoffs
        run: |
          set -euo pipefail
          python -m unittest validation.macro.test_v2_bls_us_u3_2026_shadow_replay_v1 -v
          python -m validation.macro.v2_bls_us_u3_2026_shadow_replay_v1 \
            --asof 2026-10-23T12:00:00Z \
            --out /tmp/macro-v2-shadow/us-u3-2026-nine-first-releases.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/macro-v2-shadow/us-u3-2026-nine-first-releases.json').read_text())
          assert r['releases_2026_visible_at_cutoff']==9
          assert r['first_release_rows_visible_at_cutoff']==36
          assert r['latest_reference_period']=='2026-09'
          assert r['latest_rate_first_release_percent']==4.2
          assert r['latest_released_at']=='2026-10-02T12:30:00+00:00'
          assert abs(r['latest_research_descriptive_labour_intensity'])<1e-9
          assert r['consecutive_month_normalizer_eligible'] is False
          assert r['has_2025_10_missing_CPS_observation'] is True
          assert r['source_evidence_archive_bytes_hashed'] is False
          for key in ('eligible_for_current_macro_scoring','eligible_for_backtest',
                      'safe_to_publish_new_D','safe_to_update_pair_theses','writes_live_data'):
              assert r[key] is False,key
          print('BLS_US_U3_2026_JAN_SEP_FIRST_RELEASE_CUTOFF_GUARD_RESEARCH_ONLY_PASS')
          PY
      - name: Audit BLS to Treasury 2Y to ECB reference without inventing surprise, OIS or FX causality
        run: |
          set -euo pipefail
          python -m unittest validation.macro.test_v2_us_labour_market_association_audit_v1 -v
          python -m validation.macro.v2_us_labour_market_association_audit_v1 \
            --json-out /tmp/macro-v2-shadow/us-u3-2y-ecb-associations.json \
            --markdown-out /tmp/macro-v2-shadow/us-u3-2y-ecb-associations.md
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/macro-v2-shadow/us-u3-2y-ecb-associations.json').read_text())
          c=r['coverage']
          assert c['BLS_releases']==9
          assert c['UST2Y_daily_pairs_with_event_observation']==9
          assert c['UST2Y_clean_uninterrupted_normal_sessions']==6
          assert c['ECB_pre_and_first_later_fixings']==9
          assert c['OIS_true_release_aligned_windows']==0
          assert c['BLS_pre_release_consensus_synchronized']==0
          for row in r['events']:
              assert row['event_causal_conclusion'] is None
              assert row['usd_directional_prediction'] is None
              assert row['tradable_reaction_event'] is False
          for key in ('claim_causal_response','claim_intraday_repricing_or_OIS',
                      'claim_actual_surprise_against_consensus',
                      'eligible_for_backtest','safe_to_publish_new_D',
                      'safe_to_update_pair_theses','writes_live_data'):
              assert r[key] is False,key
          print('BLS_US_U3_9_EVENT_TREASURY_ECB_NO_FALSE_OIS_OR_CAUSAL_CLAIM_GREEN')
          PY
      - name: Enforce no fabricated event-time consensus, Treasury OIS or FX quotes
        run: |
          set -euo pipefail
          python -m unittest validation.macro.test_v2_bls_intraday_evidence_gate_v1 -v
          python -m validation.macro.v2_bls_intraday_evidence_gate_v1 --json-out /tmp/macro-v2-shadow/event-evidence-gap.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/macro-v2-shadow/event-evidence-gap.json').read_text())['audit']
          assert r['events']==9
          assert r['complete_event_windows']==0
          assert r['research_readiness']=='DATA_GAP'
          assert r['predictive_edge_validated'] is False
          assert r['safe_to_publish_new_D'] is False
          print('BLS_INTRADAY_9_EVENTS_ZERO_COMPLETE_WINDOWS_NO_PROMOTION_PASS')
          PY
      - name: Verify offline FX tick research gate, no real feed assumed
        run: python -m unittest validation.macro.test_v2_eurusd_intraday_csv_research_v1 -v
      - name: Validate BI5 hour decoding and bounded event-window selection
        run: python -m unittest validation.macro.test_v2_dukascopy_bi5_hour_probe_v1 -v
      - name: Try original October 2 Dukascopy BI5 hourly source (external availability)
        continue-on-error: true
        run: |
          timeout 35s python -m validation.macro.v2_dukascopy_bi5_hour_probe_v1 \
            --source-url https://datafeed.dukascopy.com/datafeed/EURUSD/2026/09/02/12h_ticks.bi5 \
            --timeout-s 30 --out /tmp/macro-v2-shadow/eurusd-bi5-oct02-first-real-hour.json
      - name: Report whether source bytes were actually acquired
        if: always()
        run: |
          if [ -f /tmp/macro-v2-shadow/eurusd-bi5-oct02-first-real-hour.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/macro-v2-shadow/eurusd-bi5-oct02-first-real-hour.json').read_text())
          assert r['schema']=='GMFQ_DUKASCOPY_EURUSD_BI5_ONE_HOUR_PROBE_V2',r
          assert r['source_path_calendar_utc']=='2026-10-02T12:00:00+00:00',r
          assert r['bi5_month_index_zero_based']==9,r
          assert r['source_bytes_externally_retrieved'] is True,r
          assert r['transport_receipt']['content_length']==r['source_bytes_n'],r
          assert r['source_license_independently_certified'] is False,r
          print('EXTERNAL_SOURCE_ACQUIRED',
                'ticks',r['tick_count'],
                'window_complete',r['fx_window_complete'],
                'hash',r['source_sha256'])
          PY
          else
            echo "EXTERNAL_SOURCE_NOT_ACQUIRED: no valid hourly source receipt; no quote is claimed"
          fi
      - name: Audit eight historical BLS event URLs, DST and synthetic window controls
        run: python -m unittest validation.macro.test_v2_bls_eight_fx_bi5_probe_v1 -v
      - name: Probe eight real source hours without false acquisition claims
        continue-on-error: true
        run: |
          timeout 200s python -m validation.macro.v2_bls_eight_fx_bi5_probe_v1 \
            --timeout 12 --attempts 1 \
            --out /tmp/macro-v2-shadow/eurusd-eight-bls-bi5-hour-receipts.json
      - name: Report real source-hour validation coverage
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/macro-v2-shadow/eurusd-eight-bls-bi5-hour-receipts.json')
          if not p.is_file():
              print('EIGHT_REAL_SOURCE_RECEIPT_NOT_AVAILABLE')
          else:
              r=json.loads(p.read_text())
              assert r['attempted_events']==8
              assert r['validated_source_hours']+r['unavailable_hours']==8
              assert r['safe_to_publish_new_D'] is False
