name: TEMP CAD Labour Certification Promotion

on:
  push:
    branches:
      - 'validation-macro-cad-labour-pit-bootstrap-2026-10-09'
    paths:
      - '.github/workflows/temp-cad-labour-certification-promotion.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild evidence and promote only CAD labour certification metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cad-labour-promote/replay
          cp validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json /tmp/cad-labour-promote/registry-before.json
          python3 validation/macro_pit_historical_bootstrap.py \
            --anchor-manifest validation/macro/cad_labour_historical_anchor_2026-08.json \
            --evidence-output /tmp/cad-labour-promote/evidence.json \
            --work-dir /tmp/cad-labour-promote/replay \
            > /tmp/cad-labour-promote/bootstrap.json
          python3 validation/macro_pit_registry_promotion.py \
            --evidence /tmp/cad-labour-promote/evidence.json \
            --proposed-registry /tmp/cad-labour-promote/proposed-registry.json \
            --receipt /tmp/cad-labour-promote/receipt.json \
            > /tmp/cad-labour-promote/promotion.json
          python3 - <<'PY'
          import copy, json
          from pathlib import Path
          before=json.loads(Path('/tmp/cad-labour-promote/registry-before.json').read_text())
          proposed=json.loads(Path('/tmp/cad-labour-promote/proposed-registry.json').read_text())
          receipt=json.loads(Path('/tmp/cad-labour-promote/receipt.json').read_text())
          evidence=json.loads(Path('/tmp/cad-labour-promote/evidence.json').read_text())
          key='CAD.labour'
          assert receipt['status']=='PASS',receipt
          assert receipt['target']==key,receipt
          assert receipt['promotion_action']=='PROPOSAL_CREATED',receipt
          assert receipt['evidence_class']=='RECONSTRUCTED_HISTORICAL_REPLAY',receipt
          assert evidence['macro_series_exact_match'] is True and evidence['heatmap_exact_match'] is True,evidence
          assert evidence['bootstrap_provenance']['official_release_pair_verified'] is True,evidence
          assert evidence['candidate']['observation_date']=='2026-08',evidence
          assert float(evidence['candidate']['value'])==6.4,evidence
          assert before['series'][key].get('historical_replay_certified') is not True,before['series'][key]
          p=proposed['series'][key]
          assert p['historical_replay_certified'] is True,p
          ref=p['historical_replay_evidence']
          assert ref['evidence_sha256']==receipt['current_evidence_sha256'],(ref,receipt)
          assert ref['manifest_sha256']==evidence['bootstrap_provenance']['manifest_sha256'],ref
          assert ref['macro_series_id']=='CA_UNEMP_RATE_history_value',ref
          assert ref['observation_date']=='2026-08' and float(ref['value'])==6.4,ref
          assert ref['evidence_class']=='RECONSTRUCTED_HISTORICAL_REPLAY'
          assert ref['official_release_pair_verified'] is True
          b=copy.deepcopy(before); q=copy.deepcopy(proposed)
          b['series'][key].pop('historical_replay_certified',None)
          q['series'][key].pop('historical_replay_certified',None)
          q['series'][key].pop('historical_replay_evidence',None)
          assert b==q,'proposal changed fields outside CAD.labour certification metadata'
          Path('validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json').write_text(json.dumps(proposed,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'status':'PASS','target':key,'evidence_sha256':ref['evidence_sha256'],'certified':True},indent=2))
          PY
          git diff --check
          test "$(git diff --name-only)" = 'validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json'
      - name: Commit registry certification metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json
          git commit -m 'Certify CAD labour historical replay'
          git push origin HEAD:validation-macro-cad-labour-pit-bootstrap-2026-10-09
