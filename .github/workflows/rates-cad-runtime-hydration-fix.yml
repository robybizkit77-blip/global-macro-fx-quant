name: Revert GBP Runtime Adapter Safely
on:
  push:
    branches: [staging-rates-g8-refresh-2026-10-07]
permissions:
  contents: write
jobs:
  revert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revert GBP adapter commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git cat-file -e 99f9ec51133e34b192893877e7943f4667792e71^{commit}
          git revert --no-edit 99f9ec51133e34b192893877e7943f4667792e71
          git diff --exit-code HEAD^
          git push origin HEAD:${GITHUB_REF_NAME}
