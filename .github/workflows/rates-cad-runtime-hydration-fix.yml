name: Rates GBP In-Place Canonical Fix
on:
  push:
    branches: [staging-rates-g8-refresh-2026-10-07]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch only literals inside existing GBP legacy block
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('payload/part-15.txt')
          s=p.read_text()
          data=json.loads(Path('live_data/sections/NATIVE_RATES_DATA.json').read_text())
          g=data['GBP']
          start='<script id="gmfq-gbp-rates-boe-20260930">'
          assert s.count(start)==1, s.count(start)
          a=s.index(start)
          b=s.index('</script>',a)+len('</script>')
          before=s[a:b]
          assert 'gmfq-gbp-canonical-prelegacy-capture' not in s
          assert 'gmfq-gbp-canonical-postlegacy-restore' not in s
          assert "date:'2026-09-29'" in before

          h2=dict(zip(g['history2']['dates'],g['history2']['values']))
          h10=dict(zip(g['history10']['dates'],g['history10']['values']))
          dates=[d for d in g['history2']['dates'] if d>='2026-09-23' and d in h10]
          assert dates and dates[-1]==g['date'], (dates[-5:],g['date'])
          rows='const rows=[\n' + ',\n'.join(
              f"      {{date:{json.dumps(d)},y2:{json.dumps(h2[d])},y10:{json.dumps(h10[d])}}}" for d in dates
          ) + '\n    ];'

          ten={x['tenor']:x for x in g['tenors']}
          w2=g['weekly2_validation']; w10=g['weekly10_validation']
          assert w2['start_date']==w10['start_date']
          snap=(
            'const snap={\n'
            f"      date:{json.dumps(g['date'])},\n"
            f"      source:{json.dumps(g['source'],ensure_ascii=False)},\n"
            f"      y2:{json.dumps(g['2Y'])},\n"
            f"      y5:{json.dumps(ten['5Y']['value'])},\n"
            f"      y10:{json.dumps(g['10Y'])},\n"
            f"      y30:{json.dumps(ten['30Y']['value'])},\n"
            f"      week_ref_date:{json.dumps(w2['start_date'])},\n"
            f"      week_ref_y2:{json.dumps(w2['start_value'])},\n"
            f"      week_ref_y10:{json.dumps(w10['start_value'])},\n"
            f"      chg2_bp:{json.dumps(g['chg2_bp'])},\n"
            f"      chg10_bp:{json.dumps(g['chg10_bp'])},\n"
            f"      curve_bp:{json.dumps(g['curve_bp'])}\n"
            '    };'
          )

          block=before
          block,n=re.subn(r'const rows=\[.*?\n    \];',rows,block,count=1,flags=re.S); assert n==1
          block,n=re.subn(r'const snap=\{.*?\n    \};',snap,block,count=1,flags=re.S); assert n==1
          oldcalc="const chg2=(snap.y2-snap.week_ref_y2)*100;\n    const chg10=(snap.y10-snap.week_ref_y10)*100;\n    const curve=(snap.y10-snap.y2)*100;"
          newcalc="const chg2=snap.chg2_bp;\n    const chg10=snap.chg10_bp;\n    const curve=snap.curve_bp;"
          assert block.count(oldcalc)==1
          block=block.replace(oldcalc,newcalc)

          replacements={
            "d.quality='FULL_CURRENT_VALIDATED';":f"d.quality={json.dumps(g['quality'])};",
            "d.curve_state='Bear steepening';":f"d.curve_state={json.dumps(g['curve_state'])};",
            "d.freshness_status='CURRENT_SAME_BASIS';":f"d.freshness_status={json.dumps(g['freshness_status'])};",
            "d.freshness_note='BoE official nominal government zero-coupon spot curve updated through 29 Sep 2026.';":f"d.freshness_note={json.dumps(g['freshness_note'],ensure_ascii=False)};",
            "d.history_status='FULL_HISTORY';":f"d.history_status={json.dumps(g.get('history_status','FULL_HISTORY'))};",
          }
          for old,new in replacements.items():
              assert block.count(old)==1, old
              block=block.replace(old,new)

          canonical_tenors=json.dumps(g['tenors'],ensure_ascii=False,separators=(',',':'))
          block,n=re.subn(r"d\.tenors=\[.*?\n    \];",f"d.tenors={canonical_tenors};",block,count=1,flags=re.S); assert n==1
          old_history="d.history_note='Same-basis official BoE nominal spot history; 23, 24, 25, 28 and 29 Sep tail synchronized from the official current-month workbook.';"
          assert block.count(old_history)==1
          block=block.replace(old_history,f"d.history_note={json.dumps(g.get('history_note','Same-basis official BoE nominal spot history synchronized through '+g['date']),ensure_ascii=False)};")

          # Script boundary and control-flow skeleton must remain exactly one block; no new scripts allowed.
          assert block.startswith(start) and block.endswith('</script>')
          assert block.count('<script')==1 and block.count('</script>')==1
          assert "const d=NATIVE_RATES_DATA?.GBP;" in block
          assert "rebuildTail(d.history2,'y2');" in block and "rebuildTail(d.history10,'y10');" in block
          assert f"date:{json.dumps(g['date'])}" in block
          assert f"const curve=snap.curve_bp;" in block
          assert 'gmfq-gbp-canonical-prelegacy-capture' not in block and 'gmfq-gbp-canonical-postlegacy-restore' not in block
          s=s[:a]+block+s[b:]
          p.write_text(s)
          print({'status':'GBP_IN_PLACE_CANONICAL_PATCH_PREPARED','date':g['date'],'2Y':g['2Y'],'10Y':g['10Y'],'curve_bp':g['curve_bp'],'rows':len(dates)})
          PY
      - name: Rebuild manifest and verify contract
        run: |
          set -euo pipefail
          python validation/build_live_manifest_v2.py > /tmp/manifest.v2.json
          mv /tmp/manifest.v2.json live_data/manifest.v2.json
          python validation/check_live_update_contract.py
      - name: Enforce exact runtime scope
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={'payload/part-15.txt','live_data/manifest.v2.json'}
          assert changed==allowed,(changed,allowed)
          print({'status':'SCOPE_PASS','changed':sorted(changed)})
          PY
      - name: Commit in-place GBP fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add payload/part-15.txt live_data/manifest.v2.json
          git commit -m 'Align legacy GBP Rates overlay to canonical snapshot'
          git push origin HEAD:${GITHUB_REF_NAME}
