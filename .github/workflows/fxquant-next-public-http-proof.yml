name: FX Quant NEXT public HTTP delivery proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fxquant-next-public-http-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify published Next page and assets over real public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://robybizkit77-blip.github.io/global-macro-fx-quant/site/fx-quant-v2/next"
          for attempt in $(seq 1 12); do
            if curl -fsSL --connect-timeout 8 --max-time 20 "$BASE/index.html?verify=$GITHUB_RUN_ID" -o /tmp/next-index.html \
              && curl -fsSL --connect-timeout 8 --max-time 20 "$BASE/app.js?verify=$GITHUB_RUN_ID" -o /tmp/next-app.js \
              && curl -fsSL --connect-timeout 8 --max-time 20 "$BASE/theme.css?verify=$GITHUB_RUN_ID" -o /tmp/next-theme.css \
              && grep -q 'id="quick-layer"' /tmp/next-index.html \
              && grep -q 'function atlasEvidence' /tmp/next-app.js \
              && curl -fsSL --connect-timeout 8 --max-time 20 "$BASE/cot-studio.js?verify=$GITHUB_RUN_ID" -o /tmp/next-cot.js \
              && curl -fsSL --connect-timeout 8 --max-time 20 "$BASE/cot-studio.css?verify=$GITHUB_RUN_ID" -o /tmp/next-cot.css \
              && curl -fsSL --connect-timeout 8 --max-time 20 "https://robybizkit77-blip.github.io/global-macro-fx-quant/live_data/sections/V250_COT_CHART_DATA.json?verify=$GITHUB_RUN_ID" -o /tmp/next-cot-data.json \
              && grep -q 'market-edition' /tmp/next-theme.css \
              && grep -q 'cot-studio.js' /tmp/next-index.html \
              && grep -q 'function verifiedRows' /tmp/next-cot.js \
              && grep -q 'cot-country-selector' /tmp/next-cot.css \
              && grep -q '"EUR"' /tmp/next-cot-data.json \
              && curl -fsSL --connect-timeout 8 --max-time 20 "$BASE/rates-studio.js?verify=$GITHUB_RUN_ID" -o /tmp/next-rates.js \
              && curl -fsSL --connect-timeout 8 --max-time 20 "$BASE/rates-studio.css?verify=$GITHUB_RUN_ID" -o /tmp/next-rates.css \
              && grep -q 'rates-studio.js' /tmp/next-index.html \
              && grep -q 'FXQuantRates' /tmp/next-rates.js \
              && grep -q 'rates-repricing-cards' /tmp/next-rates.css \
              && curl -fsSL --connect-timeout 8 --max-time 20 "$BASE/macro-studio.js?verify=$GITHUB_RUN_ID" -o /tmp/next-macro.js \
              && curl -fsSL --connect-timeout 8 --max-time 20 "$BASE/macro-studio.css?verify=$GITHUB_RUN_ID" -o /tmp/next-macro.css \
              && curl -fsSL --connect-timeout 8 --max-time 20 "https://robybizkit77-blip.github.io/global-macro-fx-quant/live_data/sections/MACRO_SERIES.json?verify=$GITHUB_RUN_ID" -o /tmp/next-macro-data.json \
              && grep -q 'macro-studio.js' /tmp/next-index.html \
              && grep -q 'FXQuantMacro' /tmp/next-macro.js \
              && grep -q 'macro-country-strip' /tmp/next-macro.css \
              && grep -q '"USD"' /tmp/next-macro-data.json \
              && curl -fsSL --connect-timeout 8 --max-time 20 "$BASE/currency-studio.js?verify=$GITHUB_RUN_ID" -o /tmp/next-country.js \
              && curl -fsSL --connect-timeout 8 --max-time 20 "$BASE/currency-studio.css?verify=$GITHUB_RUN_ID" -o /tmp/next-country.css \
              && curl -fsSL --connect-timeout 8 --max-time 20 "https://robybizkit77-blip.github.io/global-macro-fx-quant/live_data/sections/ECB_G8_PRICE_HISTORY.json?verify=$GITHUB_RUN_ID" -o /tmp/next-ecb-cross.json \
              && grep -q 'currency-studio.js' /tmp/next-index.html \
              && grep -q 'FXQuantCurrencies' /tmp/next-country.js \
              && grep -q 'currency-studio-selector' /tmp/next-country.css \
              && grep -Eq '"pair_count"[[:space:]]*:[[:space:]]*28' /tmp/next-ecb-cross.json; then
              echo "NEXT_PUBLIC_HTTP_200_VALIDATED"
              echo "PUBLIC_MAIN_NAV_READY=true"
              echo "PUBLIC_ATLAS_JS_READY=true"
              echo "PUBLIC_REDESIGN_CSS_READY=true"
              echo "PUBLIC_COT_104W_CHARTS_READY=true"
              echo "PUBLIC_COT_CFTC_DATA_READY=true"
              echo "PUBLIC_G8_RATES_OIS_RESEARCH_READY=true"
              echo "PUBLIC_G8_MACRO_DYNAMICS_READY=true"
              echo "PUBLIC_MACRO_204_SERIES_FEED_READY=true"
              echo "PUBLIC_G8_COUNTRY_RESEARCH_READY=true"
              echo "PUBLIC_ECB_561_FX_FIXINGS_READY=true"
              exit 0
            fi
            echo "NEXT_PUBLIC_NOT_READY attempt=$attempt"
            sleep 12
          done
          echo "NEXT_PUBLIC_HTTP_UNVERIFIED"
          exit 1
