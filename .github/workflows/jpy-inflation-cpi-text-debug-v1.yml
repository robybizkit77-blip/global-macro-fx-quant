name: JPY Inflation CPI Text Debug V1

on:
  push:
    branches:
      - validation-jpy-inflation-strict-pit-v1-2026-10-10

permissions:
  contents: read

jobs:
  debug-cpi-text:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pypdf==5.9.0
      - name: Print official 2018-01 national CPI PDF text
        run: |
          python - <<'PY'
          import html, io, re, urllib.request
          from urllib.parse import urlencode
          from pypdf import PdfReader
          BASE='https://www.e-stat.go.jp'
          params={
            'cycle':'1','layout':'datalist','month':'11010301','page':'1','result_back':'1',
            'tclass1':'000001085955','tclass2val':'0','toukei':'00200573',
            'tstat':'000001084976','year':'20180'
          }
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'GMFQ-Strict-PIT-debug/1.0','Accept-Language':'ja,en;q=0.8'})
              with urllib.request.urlopen(req,timeout=45) as r:
                  return r.read(), r.geturl()
          raw,_=get(BASE+'/stat-search/files?'+urlencode(params))
          page=html.unescape(raw.decode('utf-8','replace'))
          ids=[]
          for hit in re.finditer(r'(?:stat_infid|statInfId)=(\d+)',page,re.I):
              window=html.unescape(page[max(0,hit.start()-1400):hit.end()+1400])
              if '結果の概要（全国）' in window or '結果の概要(全国)' in window:
                  ids.append(hit.group(1))
          ids=list(dict.fromkeys(ids))
          print('IDS',ids)
          for sid in ids:
              meta,_=get(BASE+'/stat-search/files?'+urlencode({'stat_infid':sid}))
              plain=re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',html.unescape(meta.decode('utf-8','replace'))))
              if '消費者物価指数' not in plain or ('結果の概要（全国）' not in plain and '結果の概要(全国)' not in plain):
                  continue
              if not re.search(r'調査年月\s*2018年\s*1月',plain):
                  continue
              draw,final=get(BASE+'/stat-search/file-download?'+urlencode({'fileKind':'2','statInfId':sid}))
              print('SID',sid,'FINAL',final,'PDF',draw[:4])
              text='\n'.join((p.extract_text() or '') for p in PdfReader(io.BytesIO(draw)).pages[:4])
              text=text.replace('\u3000',' ').replace('−','-').replace('－','-')
              print('---TEXT START---')
              print(text[:12000])
              print('---TEXT END---')
          PY
