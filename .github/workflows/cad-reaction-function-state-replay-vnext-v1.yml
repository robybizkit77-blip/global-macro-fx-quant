name: CAD Reaction Function State Replay vNext V1

on:
  push:
    branches:
      - audit-minimum-robust-pit-dataset-2026-10-06
    paths:
      - 'validation/run_cad_reaction_function_state_replay_vnext_v1.py'
      - '.github/workflows/cad-reaction-function-state-replay-vnext-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-minimum-robust-pit-dataset-2026-10-06
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run CAD reaction-function state replay
        run: python validation/run_cad_reaction_function_state_replay_vnext_v1.py
      - name: Strict engine/live-data guard
        run: git diff --exit-code -- engine live_data
      - name: Commit diagnostic evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/CAD_REACTION_FUNCTION_STATE_REPLAY_VNEXT_V1_2026-10-06.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Materialize CAD reaction function state replay vNext"
            git pull --rebase origin audit-minimum-robust-pit-dataset-2026-10-06
            git push origin HEAD:audit-minimum-robust-pit-dataset-2026-10-06
          fi
