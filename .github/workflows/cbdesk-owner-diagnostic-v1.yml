name: CB Desk Owner Diagnostic V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cbdesk-owner-diagnostic-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start dashboard
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/cbdesk-owner-diagnostic-server.log 2>&1 &
          sleep 2
      - name: Inspect CB Desk live bindings
        run: |
          cat > cbdesk-owner-diagnostic.js <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1100}});
            const consoleErrors=[],pageErrors=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.settled_after_cad_chain===true,null,{timeout:120000});
            await page.evaluate(()=>window.showView?.('cbdesk'));
            await page.waitForTimeout(350);
            const initial=await page.evaluate(()=>{
              const norm=s=>String(s||'').replace(/\s+/g,' ').trim();
              const root=document.getElementById('cbdesk');
              const buttons=[...root.querySelectorAll('button')].slice(0,40).map((x,i)=>({i,text:norm(x.innerText),id:x.id||null,cls:x.className||null,attrs:Object.fromEntries([...x.attributes].map(a=>[a.name,a.value]))}));
              const fnNames=['renderNativeCbDesk','selectNativeCb','v234PolicyVsMarket','v234PricingCards','v234PricingQuality','v243SimpleCb','v235PolicyRateNumber'];
              const functions={};
              for(const k of fnNames){functions[k]=typeof window[k]==='function'?String(window[k]).slice(0,20000):{type:typeof window[k],value:window[k]??null};}
              const clone=v=>{try{return JSON.parse(JSON.stringify(v));}catch(e){return {error:String(e)}}};
              const cb=clone(window.__GMFQ_DATA?.NATIVE_CB_DATA||null);
              const ois=clone(window.__GMFQ_DATA?.OIS_DATA||null);
              const oisUi=typeof window.gmfqOisOperationalUiAudit==='function'?window.gmfqOisOperationalUiAudit():null;
              const policy=typeof window.corePolicyIntegrity==='function'?window.corePolicyIntegrity():null;
              const health=typeof window.productionHealthCheck==='function'?window.productionHealthCheck():null;
              return {schema:'GMFQ_CBDESK_OWNER_DIAGNOSTIC_V2',text:norm(root?.innerText).slice(0,4500),buttons,functions,NATIVE_CB_DATA:cb,OIS_DATA:ois,oisUi,policy,health};
            });
            const snapshots=[];
            for(const wanted of ['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD']){
              const clicked=await page.evaluate(w=>{const b=document.querySelector(`#v234CurrencyCards .v234CurrencyCard[data-c="${w}"]`);if(!b)return false;b.click();return true;},wanted);
              await page.waitForTimeout(150);
              const state=await page.evaluate(()=>({
                country:String(document.getElementById('v234CountryName')?.textContent||''),
                pricingQuality:String(document.getElementById('v234PricingQuality')?.textContent||''),
                market:String(document.getElementById('v234Market')?.textContent||''),
                marketWhy:String(document.getElementById('v234MarketWhy')?.textContent||''),
                policyRead:String(document.getElementById('v234PolicyRead')?.textContent||'').slice(0,1200)
              }));
              snapshots.push({wanted,clicked,...state});
            }
            const out={...initial,snapshots};console.log(JSON.stringify(out,null,2));
            if(initial.buttons.filter(x=>x.attrs?.['data-c']).length!==8)throw new Error('CB G8 selector coverage');
            if(snapshots.some(x=>!x.clicked||!x.country.includes(x.wanted)))throw new Error('CB selector/title desync');
            if(initial.policy?.ok!==true)throw new Error('Core policy integrity failed');
            if(initial.oisUi?.ok!==true||initial.oisUi?.summary?.operational_green!==8)throw new Error('OIS operational UI not 8/8');
            const runtimeErr=/\b[A-Za-z_$][\w$]*\s+is\s+not\s+defined\b|ReferenceError/i;
            if(consoleErrors.some(x=>runtimeErr.test(x))||pageErrors.some(x=>runtimeErr.test(x)))throw new Error('Runtime scope error: '+consoleErrors.concat(pageErrors).join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node cbdesk-owner-diagnostic.js | tee /tmp/cbdesk-owner-diagnostic.json
      - uses: actions/upload-artifact@v4
        with:
          name: cbdesk-owner-diagnostic-v1
          path: |
            /tmp/cbdesk-owner-diagnostic.json
            /tmp/cbdesk-owner-diagnostic-server.log
