name: CB Desk Owner Diagnostic V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cbdesk-owner-diagnostic-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start dashboard
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/cbdesk-owner-diagnostic-server.log 2>&1 &
          sleep 2
      - name: Inspect CB Desk live bindings
        run: |
          cat > cbdesk-owner-diagnostic.js <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1100}});
            const consoleErrors=[],pageErrors=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.settled_after_cad_chain===true,null,{timeout:120000});
            await page.evaluate(()=>window.showView?.('cbdesk'));
            await page.waitForTimeout(350);
            const inspect=async()=>page.evaluate(()=>{
              const norm=s=>String(s||'').replace(/\s+/g,' ').trim();
              const root=document.getElementById('cbdesk');
              const elems=[...root.querySelectorAll('*')].filter(x=>x.id||/cb|central|policy|pricing|currency/i.test(String(x.className||''))).slice(0,180).map(x=>({tag:x.tagName,id:x.id||null,cls:typeof x.className==='string'?x.className:null,text:norm(x.innerText).slice(0,180),attrs:Object.fromEntries([...x.attributes].filter(a=>/^data-/.test(a.name)).map(a=>[a.name,a.value]))}));
              const buttons=[...root.querySelectorAll('button')].slice(0,40).map((x,i)=>({i,text:norm(x.innerText),id:x.id||null,cls:x.className||null,attrs:Object.fromEntries([...x.attributes].map(a=>[a.name,a.value]))}));
              const globals=Object.keys(window).filter(k=>/central|cb|policy|pricing|ois/i.test(k)).sort().slice(0,300);
              const probes={};
              for(const k of globals){
                if(/integrity|audit|coverage|state|pricing/i.test(k)&&typeof window[k]==='function'){
                  try{const v=window[k]();if(v!==undefined)probes[k]=v;}catch(e){probes[k]={error:String(e)}}
                }
              }
              const dataKeys=Object.keys(window.__GMFQ_DATA||{}).filter(k=>/CB|CENTRAL|POLICY|PRICING|OIS/i.test(k)).sort();
              const data={};
              for(const k of dataKeys){
                const v=window.__GMFQ_DATA[k];
                data[k]=Array.isArray(v)?{type:'array',length:v.length,sample:v.slice(0,2)}:{type:typeof v,keys:v&&typeof v==='object'?Object.keys(v).slice(0,30):null};
              }
              return {schema:'GMFQ_CBDESK_OWNER_DIAGNOSTIC_V1',text:norm(root?.innerText).slice(0,5000),elements:elems,buttons,globals,probes,dataKeys,data,health:typeof window.productionHealthCheck==='function'?window.productionHealthCheck():null};
            });
            const initial=await inspect();
            const snapshots=[];
            for(const wanted of ['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD']){
              const clicked=await page.evaluate(w=>{const r=document.getElementById('cbdesk');const b=[...r.querySelectorAll('button')].find(x=>String(x.innerText||'').trim().startsWith(w)||x.dataset?.c===w||x.dataset?.ccy===w||x.dataset?.currency===w);if(!b)return false;b.click();return true;},wanted);
              await page.waitForTimeout(120);
              const text=await page.evaluate(()=>String(document.getElementById('cbdesk')?.innerText||'').replace(/\s+/g,' ').trim().slice(0,1200));
              snapshots.push({wanted,clicked,text});
            }
            const out={...initial,snapshots};console.log(JSON.stringify(out,null,2));
            if(!initial.text)throw new Error('CB Desk empty');
            if(initial.buttons.length<8)throw new Error('CB Desk selector has fewer than 8 buttons');
            if(snapshots.some(x=>!x.clicked))throw new Error('CB Desk selector click failed');
            for(const s of snapshots){if(!s.text.includes(s.wanted))throw new Error('CB Desk selection did not render '+s.wanted);}
            const runtimeErr=/\b[A-Za-z_$][\w$]*\s+is\s+not\s+defined\b|ReferenceError/i;
            if(consoleErrors.some(x=>runtimeErr.test(x))||pageErrors.some(x=>runtimeErr.test(x)))throw new Error('Runtime scope error: '+consoleErrors.concat(pageErrors).join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node cbdesk-owner-diagnostic.js | tee /tmp/cbdesk-owner-diagnostic.json
      - uses: actions/upload-artifact@v4
        with:
          name: cbdesk-owner-diagnostic-v1
          path: |
            /tmp/cbdesk-owner-diagnostic.json
            /tmp/cbdesk-owner-diagnostic-server.log
