name: FX Quant V2 Cross-Asset Published Source Refresh

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/cross_asset/**'
      - 'site/fx-quant-v2/cross-asset-live-data.json'
      - 'site/fx-quant-v2/cross-asset.html'
      - '.github/workflows/fx-quant-v2-cross-asset-sources.yml'
  push:
    branches: [main]
    paths:
      - 'validation/cross_asset/**'
      - 'site/fx-quant-v2/cross-asset-live-data.json'
      - 'site/fx-quant-v2/cross-asset.html'
      - '.github/workflows/fx-quant-v2-cross-asset-sources.yml'
  schedule:
    - cron: '50 7 * * 1-5'
    - cron: '25 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fx-quant-v2-cross-asset-sources
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source identity, cadence, no-rollback and no-interpolation
        run: python3 -m unittest discover -s validation/cross_asset -p 'test_collect_fxv2_daily_sources_v1.py' -v
      - name: Download independently dated FRED and Cboe observations
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python3 validation/cross_asset/collect_fxv2_daily_sources_v1.py --output /tmp/fxv2-cross-asset-candidate.json
          else
            python3 validation/cross_asset/collect_fxv2_daily_sources_v1.py
          fi
      - name: Stage validated V2 feed output (only source-date changes)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          FILE=site/fx-quant-v2/cross-asset-live-data.json
          if git diff --quiet -- "$FILE"; then
            echo 'FXV2_CROSS_ASSET_SOURCE_NO_CHANGE'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'data(fxv2): refresh independently dated public index, credit and volatility sources'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo 'FXV2_CROSS_ASSET_SOURCE_PUBLISHED_MAIN'
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo 'Unable to publish source after three optimistic main retries' >&2
          exit 1
      - name: Record research-only source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fxv2-cross-asset-collector
          path: |
            /tmp/fxv2-cross-asset-candidate.json
            site/fx-quant-v2/cross-asset-live-data.json
          if-no-files-found: warn
          retention-days: 14
