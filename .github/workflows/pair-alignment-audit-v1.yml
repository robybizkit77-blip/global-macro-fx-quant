name: Pair Alignment Audit V1

on:
  push:
    branches:
      - 'validation-pair-alignment-*'
  workflow_dispatch:

jobs:
  pair-alignment-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/gmfq-pair-alignment-server.log 2>&1 &
          echo $! > /tmp/gmfq-pair-alignment-server.pid
          sleep 2

      - name: Run 28-pair alignment audit
        run: |
          cat > pair-alignment-audit.js <<'EOF'
          const fs=require('fs');
          const {chromium}=require('playwright');
          const CCYS=['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];
          const PAIRS=['AUD/CAD','AUD/CHF','AUD/JPY','AUD/NZD','AUD/USD','CAD/CHF','CAD/JPY','CHF/JPY','EUR/AUD','EUR/CAD','EUR/CHF','EUR/GBP','EUR/JPY','EUR/NZD','EUR/USD','GBP/AUD','GBP/CAD','GBP/CHF','GBP/JPY','GBP/NZD','GBP/USD','NZD/CAD','NZD/CHF','NZD/JPY','NZD/USD','USD/CAD','USD/CHF','USD/JPY'];
          const REFERENCE_DATE='2026-10-12';

          // Point-in-time expected latest reference periods as known on REFERENCE_DATE.
          // Quarterly source contracts must NOT be judged with a monthly age threshold.
          // AUD inflation intentionally remains on the frozen quarterly ABS contract.
          const EXPECTED={
            USD:{inflation:{period:'2026-08',frequency:'monthly'},labour:{period:'2026-09',frequency:'monthly'}},
            EUR:{inflation:{period:'2026-09',frequency:'monthly'},labour:{period:'2026-08',frequency:'monthly'}},
            GBP:{inflation:{period:'2026-08',frequency:'monthly'},labour:{period:'2026-07',frequency:'rolling_3m_reference_end'}},
            JPY:{inflation:{period:'2026-08',frequency:'monthly'},labour:{period:'2026-08',frequency:'monthly'}},
            CHF:{inflation:{period:'2026-09',frequency:'monthly'},labour:{period:'2026-08',frequency:'monthly'}},
            CAD:{inflation:{period:'2026-08',frequency:'monthly'},labour:{period:'2026-08',frequency:'monthly'}},
            AUD:{inflation:{period:'2026-06',frequency:'quarterly_frozen_contract'},labour:{period:'2026-08',frequency:'monthly'}},
            NZD:{inflation:{period:'2026-06',frequency:'quarterly'},labour:{period:'2026-06',frequency:'quarterly'}}
          };

          function normMonth(x){
            const m=String(x||'').match(/^(\d{4})-(\d{2})/);
            return m?`${m[1]}-${m[2]}`:null;
          }
          function monthIndex(x){
            const m=normMonth(x);
            if(!m) return null;
            const [y,mo]=m.split('-').map(Number);
            return y*12+(mo-1);
          }
          function seriesFreshness(observed,contract){
            const obs=normMonth(observed);
            const exp=normMonth(contract?.period);
            const oi=monthIndex(obs), ei=monthIndex(exp);
            if(oi===null||ei===null) return {status:'UNKNOWN',observed:obs,expected:exp,frequency:contract?.frequency||null,lag_months:null};
            const lag=ei-oi;
            return {
              status:lag>0?'LAGGING':lag===0?'CURRENT':'AHEAD_OF_CONTRACT',
              observed:obs,
              expected:exp,
              frequency:contract?.frequency||null,
              lag_months:lag
            };
          }
          function macroFreshness(ccy,row){
            const contract=EXPECTED[ccy]||{};
            const inflation=seriesFreshness(row?.inflation?.as_of,contract.inflation);
            const labour=seriesFreshness(row?.labour?.as_of,contract.labour);
            const statuses=[inflation.status,labour.status];
            const status=statuses.includes('LAGGING')?'STALE':statuses.includes('UNKNOWN')?'UNKNOWN':'OK';
            return {status,inflation,labour};
          }
          function readJson(path){return JSON.parse(fs.readFileSync(path,'utf8'));}

          (async()=>{
            const macro=readJson('live_data/sections/MACRO_THERMOMETER_DATA.json');
            const ois=readJson('live_data/sections/OIS_DATA.json');
            const currencyFreshness={};
            for(const c of CCYS){
              const m=macro?.currencies?.[c]||null;
              const mf=macroFreshness(c,m);
              const os=ois?.currencies?.[c]?.status || ois?.[c]?.status || null;
              currencyFreshness[c]={macro:mf,ois_status:os};
            }

            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
            const response=await page.goto('http://127.0.0.1:8123/index.html',{waitUntil:'domcontentloaded',timeout:120000});
            if(!response||!response.ok()) throw new Error('HTTP load failed');
            await page.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.settled_after_cad_chain===true||window.__GMFQ_BOOTSTRAP_ERROR,null,{timeout:120000});
            const runtime=await page.evaluate(({CCYS,PAIRS})=>{
              const currencies=Object.fromEntries(CCYS.map(c=>[c,window.deriveCurrencyState?.(c)||null]));
              const pairs=Object.fromEntries(PAIRS.map(p=>[p,window.derivePairDecisionFrame?.(p)||null]));
              const audit=window.GMFQ_POST_GATE_FINAL_AUDIT||null;
              return {currencies,pairs,audit,bootstrapError:window.__GMFQ_BOOTSTRAP_ERROR||null};
            },{CCYS,PAIRS});
            await browser.close();
            if(runtime.bootstrapError) throw new Error(runtime.bootstrapError);
            if(errors.length) throw new Error('Browser errors: '+errors.join(' | '));

            const structuralIssues=[];
            const rows={};
            for(const pair of PAIRS){
              const [a,b]=pair.split('/');
              const sa=runtime.currencies[a], sb=runtime.currencies[b], f=runtime.pairs[pair];
              if(!sa||!sb||!f){structuralIssues.push('MISSING:'+pair);continue;}
              const macroSide=Number(sa.macro)>Number(sb.macro)?'A':Number(sb.macro)>Number(sa.macro)?'B':'TIE';
              const policySide=Number(sa.policy)>Number(sb.policy)?'A':Number(sb.policy)>Number(sa.policy)?'B':'TIE';
              if(f.structural?.macro?.side!==macroSide) structuralIssues.push('MACRO_SIDE:'+pair);
              if(f.structural?.policy?.side!==policySide) structuralIssues.push('POLICY_SIDE:'+pair);

              const freshness=[currencyFreshness[a].macro.status,currencyFreshness[b].macro.status];
              let temporal='FRESH';
              if(freshness.includes('STALE')) temporal='STALE_INPUT';
              else if(freshness.includes('UNKNOWN')) temporal='UNKNOWN_INPUT';
              const oisWithheld=[currencyFreshness[a].ois_status,currencyFreshness[b].ois_status].some(x=>x==='WITHHELD');
              rows[pair]={
                favored:f.fav,
                quality:f.quality,
                calculation:'OK',
                temporal,
                ois:oisWithheld?'PARTIAL_WITHHELD':'AVAILABLE_OR_NOT_REQUIRED',
                inputs:{[a]:currencyFreshness[a],[b]:currencyFreshness[b]}
              };
            }

            const counts=Object.values(rows).reduce((acc,r)=>{acc[r.temporal]=(acc[r.temporal]||0)+1;return acc;},{});
            const staleCurrencies=Object.entries(currencyFreshness).filter(([,v])=>v.macro.status==='STALE').map(([c])=>c);
            const report={
              schema:'GMFQ_PAIR_ALIGNMENT_AUDIT_V1',
              reference_date:REFERENCE_DATE,
              freshness_method:'PIT_EXPECTED_LATEST_PERIOD_BY_SOURCE_CONTRACT',
              expected_period_contracts:EXPECTED,
              runtime_baseline_as_of:runtime.audit?.as_of||null,
              pair_count:Object.keys(rows).length,
              structural_status:structuralIssues.length?'FAIL':'PASS',
              structural_issues:structuralIssues,
              stale_currencies:staleCurrencies,
              temporal_counts:counts,
              currencies:currencyFreshness,
              pairs:rows,
              verdict:structuralIssues.length?'BLOCK':staleCurrencies.length?'REFRESH_REQUIRED':'PASS_ALIGNED'
            };
            fs.writeFileSync('pair-alignment-audit.json',JSON.stringify(report,null,2));
            const stale=Object.entries(rows).filter(([,r])=>r.temporal!=='FRESH');
            const md=[
              '# Pair Alignment Audit V1',
              '',
              `- Reference date: ${REFERENCE_DATE}`,
              `- Runtime baseline as-of: ${report.runtime_baseline_as_of||'n/a'}`,
              `- 28-pair structural calculation: ${report.structural_status}`,
              `- Freshness method: ${report.freshness_method}`,
              `- Stale currencies: ${staleCurrencies.join(', ')||'none'}`,
              `- FRESH pairs: ${counts.FRESH||0}`,
              `- STALE_INPUT pairs: ${counts.STALE_INPUT||0}`,
              `- UNKNOWN_INPUT pairs: ${counts.UNKNOWN_INPUT||0}`,
              '',
              '## Pairs requiring freshness review',
              ...(stale.length?stale.map(([p,r])=>`- ${p}: ${r.temporal}`):['- None'])
            ].join('\n');
            fs.writeFileSync('pair-alignment-audit.md',md);
            console.log(JSON.stringify(report,null,2));
            if(structuralIssues.length) process.exit(1);
          })().catch(e=>{console.error('::error title=Pair alignment audit::'+String(e.message||e));process.exit(1)});
          EOF
          node pair-alignment-audit.js

      - name: Upload pair alignment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pair-alignment-audit-v1
          path: |
            pair-alignment-audit.json
            pair-alignment-audit.md
            /tmp/gmfq-pair-alignment-server.log
