name: USD CME ZQ Archive Probe V1

on:
  push:
    branches:
      - validation-usd-cme-zq-archive-probe-v1-2026-10-15
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probe official CME ZQ archive
        run: python validation/cb_pricing/probe_usd_cme_zq_archive_v1.py

      - name: Upload diagnostic receipt
        uses: actions/upload-artifact@v4
        with:
          name: usd-cme-zq-archive-probe-receipt
          path: validation/cb_pricing/usd_cme_zq_archive_probe_receipt_v1.json
          if-no-files-found: error
