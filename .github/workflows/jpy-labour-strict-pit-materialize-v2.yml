name: JPY Labour Strict PIT Materialize V2

on:
  push:
    branches:
      - 'validation-jpy-labour-strict-pit-v2-*'
    paths:
      - 'validation/materialize_jpy_labour_strict_pit_v2.py'
      - '.github/workflows/jpy-labour-strict-pit-materialize-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: pip install pypdf
      - name: Materialize all 104 first-release months read-only
        run: |
          mkdir -p /tmp/jpy-labour-strict
          python validation/materialize_jpy_labour_strict_pit_v2.py \
            --csv /tmp/jpy-labour-strict/JPY_LABOUR_LFS_STRICT_FIRST_RELEASE_2018_2026_08.csv \
            --evidence /tmp/jpy-labour-strict/JPY_LABOUR_STRICT_PIT_EVIDENCE_V2.json
      - name: Verify artifact invariants
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('/tmp/jpy-labour-strict')
          ev=json.loads((p/'JPY_LABOUR_STRICT_PIT_EVIDENCE_V2.json').read_text())
          rows=list(csv.DictReader((p/'JPY_LABOUR_LFS_STRICT_FIRST_RELEASE_2018_2026_08.csv').open()))
          assert ev['status']=='PASS'
          assert ev['evidence_class']=='STRICT_DIRECT_ARCHIVAL_PIT'
          assert len(rows)==104
          assert rows[0]['reference_month']=='2018-01' and rows[-1]['reference_month']=='2026-08'
          assert all(r['pit_status']=='STRICT_FIRST_RELEASE' for r in rows)
          assert all(r['sha256'] and len(r['sha256'])==64 for r in rows)
          assert all(r['release_time_jst']=='08:30' for r in rows)
          assert len({r['sha256'] for r in rows})==104
          assert ev['strict_rules']['revised_history_fallback_used'] is False
          PY
      - name: Enforce no repository writes
        run: git diff --exit-code
      - name: Upload strict PIT candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpy-labour-strict-pit-v2-${{ github.run_id }}
          path: /tmp/jpy-labour-strict/
          if-no-files-found: error
          retention-days: 90
