name: Macro V2 dated 2Y repricing and macro surprise admission - research
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/macro-v2-fx-2y-dated-repricing-surprise-ci.yml'
      - 'validation/macro/v2_fx_2y_repricing_surprise_admission_v1.py'
      - 'validation/macro/test_v2_fx_2y_repricing_surprise_admission_v1.py'
      - 'validation/macro/MACRO_V2_FX_2Y_CLOCK_MACRO_SURPRISE_ADMISSION_2026-10-28.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-repricing-observation-clock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact rate observation dates versus reported 2Y changes and future-consensus clock
        run: |
          python -m unittest validation.macro.test_v2_fx_2y_repricing_surprise_admission_v1 -v
      - name: Produce evidence and reject unproven 2Y/OIS causal FX repricing
        run: |
          python -m validation.macro.v2_fx_2y_repricing_surprise_admission_v1 --as-of 2026-10-28 --out /tmp/gmfq-fx-2y-repricing-surprise-admission-2026-10-28.json
          python - <<'PY'
          import json,os
          r=json.load(open('/tmp/gmfq-fx-2y-repricing-surprise-admission-2026-10-28.json'))
          s=r['summary']
          assert s['currencies']==8 and s['28_pair_universe']==28
          assert s['2Y_displayed_change_not_adjacent_history_count']==5
          assert s['2Y_pairs_same_last_observation_date']==4
          assert s['2Y_pairs_same_start_and_end_date_and_7day_gap']==4
          assert s['official_6m_OIS_pairs_weekly_repricing_time_normalized']==0
          assert s['secondary_future_forecasts_count']==2
          assert s['validated_macro_surprises']==0
          assert s['CB_Want_Can_verified_from_statement']==0
          assert s['FX_pair_directional_signals']==0 and s['FX_pair_rankings_rebuilt']==0
          assert not r['safe_to_publish_new_D']
          assert not r['safe_to_change_28_pair_states']
          assert r['2Y_instrument_conventions_unharmonized'] is True
          assert r['secondary_pre_release_forecasts_are_not_actual_surprises'] is True
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('### 2Y source-clock and macro-surprise admission test (RESEARCH)\n')
              f.write('- 5/8 displayed 2Y changes do not match last adjacent history observations; different reference scopes must not be called daily repricing.\n')
              f.write('- 4/28 pair 2Y historical windows share an EXACT last and preceding date; differences are descriptive, not tradable cross-country policy surprise.\n')
              f.write('- Only two future secondary pre-release macro forecasts; zero actual events with pre-event locked consensus; zero confirmed macro surprises.\n')
              f.write('- Missing explicit CB Want/Can publisher statements and synchronized 6M official OIS weekly reference dates; no new FX model score, Beta or Forward claims.\n')
          PY
      - name: Verify no source, Core, FX, Forward or site mutations
        run: |
          git diff --exit-code -- live_data site dashboard payload validation/forward/decision_snapshots
          test -z "$(git status --porcelain -- live_data site dashboard payload validation/forward/decision_snapshots)"
      - uses: actions/upload-artifact@v4
        with:
          name: macro-v2-2y-dated-repricing-surprise-admission
          path: /tmp/gmfq-fx-2y-repricing-surprise-admission-2026-10-28.json
          retention-days: 21
          if-no-files-found: error
