name: Pair Tutor DOM Preservation Audit V1

on:
  push:
    branches:
      - 'validation-pair-tutor-dom-preservation-audit-v1-2026-10-12'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8132 --bind 127.0.0.1 > /tmp/gmfq-pair-dom-server.log 2>&1 &
          sleep 2
      - name: Verify tutor DOM survives repeated pair rendering
        run: |
          cat > pair-tutor-dom-preservation-audit.js <<'EOF'
          const fs=require('fs');
          const {chromium}=require('playwright');
          const TARGETS=['EUR/USD','AUD/JPY','USD/JPY','CAD/CHF','EUR/AUD','NZD/USD','EUR/USD'];
          const REQUIRED=['gmfqPairTitle','gmfqPairText','gmfqPairDrivers','gmfqPairConfirm','gmfqPairReverse','gmfqPairConclusion'];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror:'+String(e.stack||e)));
            page.on('console',m=>{if(m.type()==='error') errors.push('console:'+m.text())});
            const r=await page.goto('http://127.0.0.1:8132/index.html',{waitUntil:'domcontentloaded',timeout:120000});
            if(!r||!r.ok()) throw new Error('HTTP load failed');
            await page.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.settled_after_cad_chain===true||window.__GMFQ_BOOTSTRAP_ERROR,null,{timeout:120000});
            await page.evaluate(()=>{ if(typeof window.showView==='function') window.showView('pairs'); });
            await page.waitForTimeout(400);
            const rows=[];
            for(const pair of TARGETS){
              const before=await page.evaluate(p=>window.derivePairDecisionFrame?.(p)||null,pair);
              const ok=await page.evaluate(p=>{
                const el=document.querySelector(`#pairs [data-pair="${p}"]`);
                if(!el) return false;
                el.click();
                return true;
              },pair);
              if(!ok) throw new Error('Missing pair card '+pair);
              await page.waitForTimeout(500);
              const after=await page.evaluate(({p,required})=>({
                frame:window.derivePairDecisionFrame?.(p)||null,
                missing:required.filter(id=>!document.getElementById(id)),
                text:String(document.getElementById('gmfqPairTutor')?.innerText||''),
                html:String(document.getElementById('gmfqPairTutor')?.innerHTML||''),
                state:window.__GMFQ_PAIR_READING_HIERARCHY_STATE||null
              }),{p:pair,required:REQUIRED});
              if(JSON.stringify(before)!==JSON.stringify(after.frame)) throw new Error('Decision frame changed '+pair);
              if(after.missing.length) throw new Error('Tutor DOM missing after '+pair+': '+after.missing.join(','));
              if(!after.html.includes('id="gmfqPairConfirm"')||!after.html.includes('id="gmfqPairReverse"')) throw new Error('Watch children destroyed '+pair);
              rows.push({pair,missing:after.missing,state:after.state,pass:true});
            }
            if(errors.length) throw new Error(errors.join(' | '));
            await browser.close();
            const report={schema:'GMFQ_PAIR_TUTOR_DOM_PRESERVATION_AUDIT_V1',head:process.env.GITHUB_SHA||null,sequence:rows,required_ids:REQUIRED,frame_changes:false,errors:[],verdict:'PASS_DOM_PRESERVED'};
            fs.writeFileSync('pair-tutor-dom-preservation-audit.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
          })().catch(e=>{console.error('::error title=Pair tutor DOM preservation audit::'+String(e.stack||e));process.exit(1)});
          EOF
          node pair-tutor-dom-preservation-audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pair-tutor-dom-preservation-audit-v1
          path: |
            pair-tutor-dom-preservation-audit.json
            /tmp/gmfq-pair-dom-server.log
