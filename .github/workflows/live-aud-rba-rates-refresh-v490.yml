name: Live AUD RBA Rates Refresh v490

on:
  push:
    branches: [staging-live-data-refresh-v1-2026-10-04]
    paths:
      - "validation/refresh_aud_rba_rates_v490.py"
      - ".github/workflows/live-aud-rba-rates-refresh-v490.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh AUD from official RBA F2
        run: python validation/refresh_aud_rba_rates_v490.py
      - name: Repack v490 payload
        run: python validation/repack_v490_from_live_data.py --write
      - name: Commit staged AUD rates refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_data/sections/NATIVE_RATES_DATA.json live_data/sections/D.json payload validation/JV_AUD_RBA_RATES_REFRESH_2026-10-04.json validation/V490_LIVE_DATA_REPACK_AUDIT_2026-10-04.json
          git commit -m "Refresh staged AUD RBA rates" || exit 0
          git push
