name: Macro Challenger Weekly V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/macro-challenger-weekly-v1.yml'
      - 'validation/forward/*macro_challenger_v1.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/macro-challenger-weekly-v1.yml'
      - 'validation/forward/*macro_challenger_v1.py'
  workflow_run:
    workflows:
      - 'Macro V3 Observed G8 28-Pair Public Context V1'
      - 'Rates Persistent Daily V1'
      - 'Price History Persistent Daily V1'
    types: [completed]
  schedule:
    - cron: '43 19 * * 1-5'
      timezone: Europe/Rome

permissions:
  contents: read

jobs:
  tests:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest validation.forward.test_macro_challenger_v1 -v

  freeze-and-observe:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: macro-challenger-weekly-v1-main
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recalculate 28 directions and freeze the first capture of the Rome day
        shell: bash
        run: |
          set -euo pipefail
          python -m validation.forward.macro_challenger_v1 capture \
            --receipt /tmp/macro-challenger-capture.json | tee -a "$GITHUB_STEP_SUMMARY"
          archive=research/macro-challenger-weekly-v1
          if [[ -d "$archive" ]]; then git add -- "$archive"; fi
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --name-status | awk -F '\t' '
            $1 != "A" || $2 !~ /^research\/macro-challenger-weekly-v1\/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$/ { bad=1 }
            END { exit bad }'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Freeze prospective weekly Macro challenger directions'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main --no-tags
            git rebase origin/main
            sleep "$((attempt * 2))"
          done
          exit 1
      - name: Compare mature outcomes with the archived Core and momentum forecasts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python -m validation.forward.macro_challenger_v1 evaluate \
            --receipt /tmp/macro-challenger-weekly-ecb.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain challenger and weekly ECB evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macro-challenger-weekly-${{ github.run_id }}
          path: |
            /tmp/macro-challenger-capture.json
            /tmp/macro-challenger-weekly-ecb.json
          if-no-files-found: error
          retention-days: 90
