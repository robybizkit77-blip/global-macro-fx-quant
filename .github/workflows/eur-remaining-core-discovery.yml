name: EUR Remaining Core Discovery

on:
  push:
    branches:
      - engine-freeze-v1-2026-10-02
    paths:
      - 'validation/discover_eur_remaining_core.py'
      - '.github/workflows/eur-remaining-core-discovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engine-freeze-v1-2026-10-02
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover EUR retail employment wage source candidates
        run: python validation/discover_eur_remaining_core.py
      - name: Commit EUR discovery result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/pit_batch/eurostat/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Discover remaining EUR Macro Core source candidates"
            git push origin HEAD:engine-freeze-v1-2026-10-02
          fi
