name: OIS Operational Green Coverage V1

on:
  pull_request:
    paths:
      - 'validation/cb_pricing/OIS_OPERATIONAL_COVERAGE_POLICY_V1_2026-10-15.json'
      - 'validation/cb_pricing/collect_cb_pricing_estimated_live_v1.py'
      - 'validation/cb_pricing/build_cb_pricing_estimated_v1.py'
      - 'validation/cb_pricing/build_ois_operational_view_v1.py'
      - 'validation/cb_pricing/ois_estimated_snapshot_v1.py'
      - 'validation/cb_pricing/history/OIS_ESTIMATED_SNAPSHOTS_V1.jsonl'
      - 'validation/cb_pricing/test_ois_operational_view_v1.py'
      - 'validation/cb_pricing/test_cb_pricing_estimated_v1.py'
      - 'live_data/sections/CB_PRICING_ESTIMATED.json'
      - 'live_data/sections/CB_PRICING_ESTIMATED_LIVE_QUOTES.json'
      - 'live_data/sections/OIS_OPERATIONAL_VIEW.json'
      - '.github/workflows/ois-operational-green-coverage-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot official and committed operational views
        run: |
          sha256sum live_data/sections/OIS_DATA.json > /tmp/ois.before.sha256
          cp live_data/sections/OIS_OPERATIONAL_VIEW.json /tmp/ois_operational.before.json
      - name: Rebuild estimated and operational OIS views
        run: |
          python validation/cb_pricing/build_cb_pricing_estimated_v1.py
          python validation/cb_pricing/build_ois_operational_view_v1.py
      - name: Verify committed operational view core is unchanged and V2 dated-only
        run: |
          python - <<'PY'
          import json

          before=json.load(open('/tmp/ois_operational.before.json'))
          after=json.load(open('live_data/sections/OIS_OPERATIONAL_VIEW.json'))

          def strip_additive_metadata(obj):
              if isinstance(obj, dict):
                  return {
                      k: strip_additive_metadata(v)
                      for k, v in obj.items()
                      if k not in {
                          'change_1d_bp',
                          'change_1w_bp',
                          'repricing_reference',
                          'input_mode',
                          'method_id',
                          'market_direction_proxy',
                      }
                  }
              if isinstance(obj, list):
                  return [strip_additive_metadata(x) for x in obj]
              return obj

          assert all(strip_additive_metadata(before['currencies'][c]) == strip_additive_metadata(after['currencies'][c]) for c in ('USD','EUR','GBP','JPY','CHF','CAD','AUD')), 'healthy currency semantic drift'
          summary=after['summary']
          assert summary['g8_total']==8
          assert summary['operational_green']+summary['operational_withheld']==8
          assert summary['green_official']+summary['green_estimated']==summary['operational_green']
          assert summary['operational_withheld']==sum(r['operational_status']=='WITHHELD' for r in after['currencies'].values())
          assert after['status']==('PARTIAL_WITHHELD' if summary['operational_withheld'] else 'GREEN_8_OF_8')
          for c in ('USD','EUR','CHF'):
              row=after['currencies'][c]
              assert row['backtest_eligible_as_official'] is False
              if row['operational_status']=='WITHHELD':
                  # Source freshness/curve completeness must fail closed per currency.
                  assert row['withheld_reason'] in ('STALE_OR_INCOMPLETE_PRICING',
                                                    'NO_USABLE_OFFICIAL_OR_ESTIMATED_PRICING'), row
                  assert all(row['horizons'][h]['rate'] is None for h in ('3m','6m','12m')), row
                  assert row['change_1d_available'] is False
                  assert row['change_1w_available'] is False
                  continue
              assert row['operational_status']=='GREEN_ESTIMATED', row
              assert row['input_mode'] in ('LIVE_SECONDARY_OVERLAY',
                                           'LIVE_SECONDARY_CONFLICT_INDICATIVE'), row
              assert row['method_id']=='TRADINGVIEW_DATED_FUTURES_SSR_V2', row
              # The snapshots lack a stable contract identity: never label
              # changes 1D/1W, including first clean Monday after a conflict.
              assert row['change_1d_available'] is False, row
              assert row['change_1w_available'] is False, row
              if row['input_mode']=='LIVE_SECONDARY_CONFLICT_INDICATIVE':
                  assert row['source_conflict_status']=='UNRESOLVED_SECONDARY_SOURCE_SAME_DAY_CONFLICT'
                  assert row['conflicted_source_eligible_for_repricing'] is False
                  assert row['direction_vs_policy'] in ('WITHHELD', None), row
                  assert all(row['horizons'][h]['policy_delta_bp'] is None for h in ('3m','6m','12m'))
              else:
                  assert row.get('source_conflict_status') is None
              assert row['repricing_reference']['missing_reference_policy']=='NULL_NOT_ZERO'
              assert row['repricing_reference']['homogeneous_method_required'] is True
              for h in ('3m','6m','12m'):
                  x=row['horizons'][h]
                  assert x['rate'] is not None, x
                  assert '!' not in str(x.get('contract') or ''), x
                  assert '!' not in str(x.get('symbol') or ''), x
                  assert 'change_1d_bp' in x
                  assert 'change_1w_bp' in x

          n=after['currencies']['NZD']
          assert n['operational_status'] in ('WITHHELD','GREEN_OFFICIAL','GREEN_ESTIMATED')
          if n['operational_status']=='WITHHELD':
              assert n['backtest_eligible_as_official'] is False
              assert all(n['horizons'][h]['rate'] is None for h in ('3m','6m','12m')), n
          else:
              assert all(n['horizons'][h]['rate'] is not None for h in ('3m','6m','12m')), n
              assert n['backtest_eligible_as_official'] is (n['operational_status']=='GREEN_OFFICIAL')
          for h in ('3m','6m','12m'):
              assert 'change_1d_bp' in n['horizons'][h]
              assert 'change_1w_bp' in n['horizons'][h]

          # market_direction_proxy is additive metadata, but if present it is
          # tightly governed and may never masquerade as OIS or alter policy deltas.
          for c, row in after['currencies'].items():
              proxy=row.get('market_direction_proxy')
              if proxy is None:
                  continue
              assert c=='NZD', (c, proxy)
              assert row['operational_status'] in ('WITHHELD','GREEN_OFFICIAL','GREEN_ESTIMATED')
              assert proxy['substitutes_for_ois_level'] is False
              assert proxy['status']=='LIVE_DIRECTIONAL_PROXY_READY'
              assert proxy['substitutes_for_ois_level'] is False
              assert proxy['policy_delta_from_proxy_allowed'] is False
              # Native RBNZ OIS anchor must remain unchanged by the ASX overlay.
              assert row['horizons']['3m']['rate'] is None, row
              assert row['horizons']['6m']['rate'] is None, row
              assert row['horizons']['12m']['rate'] is None, row
          print('PASS V2 dated-only OIS core determinism with governed NZD directional metadata')
          PY
      - name: Run coverage and estimated self-tests
        run: |
          python validation/cb_pricing/test_cb_pricing_estimated_v1.py
          python validation/cb_pricing/test_ois_operational_view_v1.py
      - name: Verify official OIS untouched
        run: |
          sha256sum -c /tmp/ois.before.sha256
          git diff --exit-code -- live_data/sections/OIS_DATA.json
