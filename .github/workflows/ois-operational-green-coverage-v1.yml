name: OIS Operational Green Coverage V1

on:
  pull_request:
    paths:
      - 'validation/cb_pricing/OIS_OPERATIONAL_COVERAGE_POLICY_V1_2026-10-15.json'
      - 'validation/cb_pricing/build_ois_operational_view_v1.py'
      - 'validation/cb_pricing/ois_estimated_snapshot_v1.py'
      - 'validation/cb_pricing/history/OIS_ESTIMATED_SNAPSHOTS_V1.jsonl'
      - 'validation/cb_pricing/test_ois_operational_view_v1.py'
      - 'live_data/sections/OIS_OPERATIONAL_VIEW.json'
      - '.github/workflows/ois-operational-green-coverage-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot official and committed operational views
        run: |
          sha256sum live_data/sections/OIS_DATA.json > /tmp/ois.before.sha256
          cp live_data/sections/OIS_OPERATIONAL_VIEW.json /tmp/ois_operational.before.json
      - name: Rebuild operational OIS view
        run: python validation/cb_pricing/build_ois_operational_view_v1.py
      - name: Verify committed operational view core is unchanged
        run: |
          python - <<'PY'
          import json

          before=json.load(open('/tmp/ois_operational.before.json'))
          after=json.load(open('live_data/sections/OIS_OPERATIONAL_VIEW.json'))

          def strip_additive_metadata(obj):
              if isinstance(obj, dict):
                  return {
                      k: strip_additive_metadata(v)
                      for k, v in obj.items()
                      if k not in {
                          'change_1d_bp',
                          'change_1w_bp',
                          'repricing_reference',
                          'input_mode',
                          'method_id',
                          'market_direction_proxy',
                      }
                  }
              if isinstance(obj, list):
                  return [strip_additive_metadata(x) for x in obj]
              return obj

          assert strip_additive_metadata(before) == strip_additive_metadata(after), 'non-additive operational OIS semantic drift'
          assert after['status']=='GREEN_8_OF_8'
          assert after['summary']=={
              'g8_total':8,
              'operational_green':8,
              'green_official':4,
              'green_estimated':4,
              'operational_withheld':0,
          }
          for c in ('USD','EUR','CHF','NZD'):
              row=after['currencies'][c]
              assert row['operational_status']=='GREEN_ESTIMATED'
              assert row['backtest_eligible_as_official'] is False
              assert row['repricing_reference']['missing_reference_policy']=='NULL_NOT_ZERO'
              assert row['repricing_reference']['homogeneous_method_required'] is True
              assert row['method_id'] in {'NATIVE_CB_ESTIMATED_V1','TRADINGVIEW_EXCHANGE_LABELLED_FUTURES_SSR_V1'}
              for h in ('3m','6m','12m'):
                  assert 'change_1d_bp' in row['horizons'][h]
                  assert 'change_1w_bp' in row['horizons'][h]

          # market_direction_proxy is additive metadata, but if present it is
          # tightly governed and may never masquerade as OIS or alter policy deltas.
          for c, row in after['currencies'].items():
              proxy=row.get('market_direction_proxy')
              if proxy is None:
                  continue
              assert c=='NZD', (c, proxy)
              assert row['operational_status']=='GREEN_ESTIMATED'
              assert row['input_mode']=='NATIVE_CB_FALLBACK'
              assert row['method_id']=='NATIVE_CB_ESTIMATED_V1'
              assert row['backtest_eligible_as_official'] is False
              assert proxy['status']=='LIVE_DIRECTIONAL_PROXY_READY'
              assert proxy['substitutes_for_ois_level'] is False
              assert proxy['policy_delta_from_proxy_allowed'] is False
              # Native RBNZ OIS anchor must remain unchanged by the ASX overlay.
              assert row['horizons']['3m']['rate']==3.0, row
              assert row['horizons']['6m']['rate'] is None, row
              assert row['horizons']['12m']['rate'] is None, row
          print('PASS core determinism with governed additive repricing/directional metadata')
          PY
      - name: Run coverage self-test
        run: python validation/cb_pricing/test_ois_operational_view_v1.py
      - name: Verify official OIS untouched
        run: sha256sum -c /tmp/ois.before.sha256
