name: JPY Wages CPI PIT Materialization V2
on:
  push:
    branches:
      - audit-jpy-reaction-source-probe-v1-2026-10-06
    paths:
      - validation/materialize_jpy_wages_cpi_pit_v2.py
      - .github/workflows/jpy-wages-cpi-pit-materialization-v2.yml
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pypdf
      - name: Materialize corrected JPY wages and CPI PIT panels
        run: python validation/materialize_jpy_wages_cpi_pit_v2.py
      - name: Show parse diagnostics
        run: |
          python - <<'PY'
          import json
          p='validation/JPY_WAGES_CPI_PIT_MATERIALIZATION_V1_2026-10-06.json'
          x=json.load(open(p,encoding='utf-8'))
          print('STATUS',x.get('status'))
          print('WAGES_ERRORS',json.dumps(x.get('wages',{}).get('errors',{}),ensure_ascii=False,indent=2))
          print('CPI_ERRORS',json.dumps(x.get('cpi',{}).get('errors',{}),ensure_ascii=False,indent=2))
          PY
      - name: Require corrected 67 by 67 GREEN evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('validation/JPY_WAGES_CPI_PIT_MATERIALIZATION_V1_2026-10-06.json')
          x=json.loads(p.read_text())
          assert x.get('status')=='PASS_67_67_GREEN', x.get('status')
          assert x.get('materializer_revision')=='2.2', x.get('materializer_revision')
          assert x['wages']['rows']==67 and x['cpi']['rows']==67
          PY
      - name: Independent frozen sample CPI assertions
        run: |
          python - <<'PY'
          import csv
          p='history/pit_v1/JPY_CPI_HEADLINE_CORE_FIRST_RELEASE_2018_2023_07.csv'
          rows={r['reference_month']:r for r in csv.DictReader(open(p,encoding='utf-8'))}
          checks={('2018-01','headline_cpi_yoy_pct'):1.4,('2018-01','core_cpi_yoy_pct'):0.9,('2020-07','headline_cpi_yoy_pct'):0.3,('2020-07','core_cpi_yoy_pct'):0.0,('2023-07','headline_cpi_yoy_pct'):3.3,('2023-07','core_cpi_yoy_pct'):3.1}
          for (m,k),v in checks.items():
              got=float(rows[m][k]); assert abs(got-v)<1e-9,(m,k,got,v)
          print('CPI frozen sample assertions GREEN')
          PY
      - name: Strict engine live OOS guard
        run: |
          if git diff --name-only HEAD^ | grep -E '^(engine/|live_data/|validation/CANONICAL_ENGINE_OOS_T0_V3_2026-10-01.json$)'; then
            echo 'Protected runtime/OOS files changed'; exit 1
          fi
      - name: Commit corrected panels and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history/pit_v1/JPY_WAGES_SCHEDULED_CASH_EARNINGS_FIRST_RELEASE_2018_2023_07.csv history/pit_v1/JPY_CPI_HEADLINE_CORE_FIRST_RELEASE_2018_2023_07.csv validation/JPY_WAGES_CPI_PIT_MATERIALIZATION_V1_2026-10-06.json
          git diff --cached --quiet && exit 0
          git commit -m 'Correct JPY wages CPI PIT panels with scoped CPI parser V2.2'
          git push
