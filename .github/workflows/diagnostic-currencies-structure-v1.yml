name: Diagnostic Currencies Structure V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnostic-currencies-structure-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start dashboard
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/currencies-structure-server.log 2>&1 &
          sleep 2
      - name: Audit concise Currencies mobile structure
        run: |
          cat > currencies-structure.js <<'EOF'
          const { chromium }=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>window.GMFQ_PREMIUM_SHELL?.status==='ACTIVE'&&window.GMFQ_PRODUCT_LANGUAGE?.status==='ACTIVE'&&window.GMFQ_CURRENCIES_OPERATIONAL?.status==='ACTIVE',null,{timeout:120000});
            await page.evaluate(()=>window.showView?.('currencies'));
            await page.waitForTimeout(800);
            const out=await page.evaluate(()=>{
              const root=document.getElementById('currencies');
              const clean=x=>String(x||'').replace(/\s+/g,' ').trim();
              const vis=el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};
              const sig=el=>{const r=el.getBoundingClientRect();return {id:el.id||null,className:typeof el.className==='string'?el.className:null,h:Math.round(r.height),w:Math.round(r.width),text:clean(el.innerText).slice(0,120)};};
              const direct=[...root.children].filter(vis).map(sig);
              const big=[...root.querySelectorAll('[id],.card,[class*="Card"],[class*="Grid"],[class*="grid"]')].filter(vis).map(sig).filter(x=>x.h>=180).sort((a,b)=>b.h-a.h).slice(0,24);
              const headings=[...root.querySelectorAll('h1,h2,h3,h4')].filter(vis).map(x=>clean(x.innerText)).filter(Boolean);
              const rb=root.getBoundingClientRect();
              return {
                schema:'GMFQ_CURRENCIES_STRUCTURE_DIAGNOSTIC_V1',
                selected:window.GMFQ_CURRENCIES_OPERATIONAL?.selected_currency||null,
                pageScreens:Math.round((rb.height/844)*100)/100,
                rootHeight:Math.round(rb.height),
                direct,big,headings,
                selectorCards:document.querySelectorAll('#currencyGrid .ccy').length,
                integrity:window.currencyUiIntegrity?.()||null
              };
            });
            fs.writeFileSync('/tmp/currencies-structure-v1.json',JSON.stringify(out,null,2));
            console.log('CURRENCIES_DIAGNOSTIC_SUMMARY '+JSON.stringify(out));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node currencies-structure.js
      - uses: actions/upload-artifact@v4
        with:
          name: currencies-structure-v1
          path: /tmp/currencies-structure-v1.json
          if-no-files-found: error
