name: AUD Hysteresis Sequence Probe V1

on:
  push:
    branches:
      - 'validation-aud-hysteresis-sequence-probe-v1-2026-10-12'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect runtime sequence around AUD pricing and hysteresis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          pats=['CB_LIQ_HYSTERESIS_STATE','GMFQ_AUD_POST_RBA_PRICING_AUDIT','DIRECT_EXCHANGE_POST_DECISION_CURRENT','cbStructuralChangeCandidate','applyCbLiquidityHysteresis','PENDING_MARKET_CONFIRMATION','PENDING_POST_DECISION']
          out={p:[] for p in pats}
          allowed={'.html','.js','.json','.py','.mjs','.cjs'}
          for path in Path('.').rglob('*'):
            if not path.is_file() or path.suffix.lower() not in allowed: continue
            if any(part in {'.git','node_modules'} for part in path.parts): continue
            try: text=path.read_text(encoding='utf-8')
            except: continue
            for p in pats:
              for m in list(re.finditer(re.escape(p),text))[:20]:
                a=max(0,m.start()-2500); b=min(len(text),m.start()+4500)
                out[p].append({'path':str(path),'pos':m.start(),'context':text[a:b]})
          Path('aud-hysteresis-sequence-probe.json').write_text(json.dumps(out,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps({k:[x['path'] for x in v] for k,v in out.items()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aud-hysteresis-sequence-probe-v1
          path: aud-hysteresis-sequence-probe.json
