name: AUD Hysteresis Sequence Probe V1

on:
  push:
    branches:
      - 'validation-aud-hysteresis-sequence-probe-v1-2026-10-12'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect runtime sequence around AUD pricing and hysteresis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          text=Path('index.html').read_text(encoding='utf-8')
          pats=['CB_LIQ_HYSTERESIS_STATE','GMFQ_AUD_POST_RBA_PRICING_AUDIT','DIRECT_EXCHANGE_POST_DECISION_CURRENT','cbStructuralChangeCandidate','applyCbLiquidityHysteresis','PENDING_MARKET_CONFIRMATION']
          out={}
          for p in pats:
            hits=[m.start() for m in re.finditer(re.escape(p),text)]
            rows=[]
            for pos in hits[:20]:
              a=max(0,pos-3500); b=min(len(text),pos+5000)
              rows.append(text[a:b])
            out[p]={'count':len(hits),'contexts':rows}
          Path('aud-hysteresis-sequence-probe.json').write_text(json.dumps(out,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps({k:v['count'] for k,v in out.items()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aud-hysteresis-sequence-probe-v1
          path: aud-hysteresis-sequence-probe.json
