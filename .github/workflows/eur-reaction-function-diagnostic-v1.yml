name: EUR Reaction Function Diagnostic V1
on:
  push:
    branches: [audit-minimum-robust-pit-dataset-2026-10-06]
    paths:
      - 'validation/run_eur_reaction_function_diagnostic_v1.py'
      - 'history/pit_v1/EUR_HICP_SERVICES_FIRST_PUBLISHED_2024_2026.csv'
      - 'history/pit_v1/EUR_NEGOTIATED_WAGES_CERTIFIED_VINTAGES_SEED.csv'
      - '.github/workflows/eur-reaction-function-diagnostic-v1.yml'
permissions:
  contents: write
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-minimum-robust-pit-dataset-2026-10-06
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run EUR reaction function diagnostic
        run: python validation/run_eur_reaction_function_diagnostic_v1.py
      - name: Confirm engine and live data untouched
        run: git diff --exit-code -- engine live_data
      - name: Commit diagnostic evidence only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/EUR_REACTION_FUNCTION_DIAGNOSTIC_V1_2026-10-06.json
          git diff --cached --quiet || git commit -m "Add EUR reaction function diagnostic evidence"
          git push
