name: TEMP EUR Labour Series Repair

on:
  push:
    branches:
      - 'validation-macro-eur-labour-pit-bootstrap-2026-10-09'
    paths:
      - '.github/workflows/temp-eur-labour-series-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append only official August EUR unemployment point
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('live_data/sections/MACRO_SERIES.json')
          doc=json.loads(p.read_text())
          rows=[r for r in doc['EUR'] if r.get('id')=='EA_UNEMP_history_value']
          assert len(rows)==1
          r=rows[0]
          assert r['dates'][-1]=='2026-07' and float(r['values'][-1])==6.4
          assert r.get('last_date')=='2026-07' and float(r.get('last_value'))==6.4
          assert '2026-08' not in r['dates']
          r['dates'].append('2026-08'); r['values'].append(6.4)
          r['last_date']='2026-08'; r['last_value']=6.4
          p.write_text(json.dumps(doc,ensure_ascii=False,separators=(',',':'))+'\n')
          heat=json.loads(Path('live_data/sections/MACRO_THERMOMETER_DATA.json').read_text())['currencies']['EUR']['labour']
          assert heat['as_of'][:7]=='2026-08' and float(heat['latest_value'])==6.4 and float(heat['history'][-1])==6.4
          PY
          git diff --check
          test "$(git diff --name-only)" = 'live_data/sections/MACRO_SERIES.json'
      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live_data/sections/MACRO_SERIES.json
          git commit -m 'Align EUR labour series with official August release'
          git push origin HEAD:validation-macro-eur-labour-pit-bootstrap-2026-10-09
