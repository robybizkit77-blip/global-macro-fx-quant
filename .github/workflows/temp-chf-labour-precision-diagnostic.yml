name: TEMP CHF Labour Precision Repair

on:
  push:
    branches:
      - repair-chf-labour-heatmap-precision-2026-10-09
    paths:
      - '.github/workflows/temp-chf-labour-precision-diagnostic.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact CHF labour canonical precision repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from validation.build_macro_candidate import percentile, direction, acceleration, temperature_label

          hp=Path('live_data/sections/MACRO_THERMOMETER_DATA.json')
          sp=Path('live_data/sections/MACRO_SERIES.json')
          heat=json.loads(hp.read_text())
          series=json.loads(sp.read_text())
          h=heat['currencies']['CHF']['labour']
          s=next(x for x in series['CHF'] if x['id']=='CH_UNEMP_RATE_history_value')
          exact=float(s['last_value'])
          assert exact == 3.13682671641221
          assert float(h['latest_value']) == exact
          assert float(h['history'][-1]) == 3.136827
          assert float(h['percentile']) == 81.7
          assert float(h['temperature_score']) == 81.7
          assert h['temperature_label'] == 'MOLTO_CALDO'
          assert h['direction'] == 'SALE'
          assert h['acceleration'] == 'RALLENTA'

          h['history'][-1]=exact
          vals=[float(x) for x in h['history']]
          pct=percentile(vals, exact)
          assert pct == 82.1
          assert direction(vals) == 'SALE'
          assert acceleration(vals) == 'RALLENTA'
          label=temperature_label(pct, heat['thresholds'])
          assert label == 'MOLTO_CALDO'
          h['percentile']=pct
          h['temperature_score']=pct
          h['temperature_label']=label

          hp.write_text(json.dumps(heat,ensure_ascii=False,separators=(',',':'))+'\n')
          print(json.dumps({'status':'PASS','history_last':exact,'percentile':pct,'temperature_label':label,'direction':h['direction'],'acceleration':h['acceleration']},indent=2))
          PY
          git diff -- live_data/sections/MACRO_THERMOMETER_DATA.json
          git diff --exit-code -- live_data/sections/MACRO_SERIES.json
      - name: Commit repair to staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live_data/sections/MACRO_THERMOMETER_DATA.json
          git diff --cached --quiet && { echo 'No repair required'; exit 0; }
          git commit -m 'Repair CHF labour heatmap precision consistency'
          git push origin HEAD:repair-chf-labour-heatmap-precision-2026-10-09
