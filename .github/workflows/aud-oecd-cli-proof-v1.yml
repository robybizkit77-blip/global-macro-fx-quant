name: AUD OECD CLI source proof V1
on:
  pull_request:
    paths:
      - 'validation/macro/probe_aud_oecd_cli_v1.py'
      - '.github/workflows/aud-oecd-cli-proof-v1.yml'
permissions:
  contents: read
jobs:
  source-proof:
    if: github.head_ref == 'research/aud-oecd-cli-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m validation.macro.probe_aud_oecd_cli_v1
