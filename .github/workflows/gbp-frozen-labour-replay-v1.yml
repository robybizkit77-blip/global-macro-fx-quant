name: GBP Frozen Labour Replay V1

on:
  push:
    branches:
      - audit-minimum-robust-pit-dataset-2026-10-06
    paths:
      - 'validation/run_gbp_frozen_labour_replay_v1.py'
      - 'history/pit_v1/GBP_LABOUR_A01_CERTIFIED_VINTAGES_2018_2026.csv'
      - '.github/workflows/gbp-frozen-labour-replay-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-minimum-robust-pit-dataset-2026-10-06
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen GBP Labour replay
        run: python validation/run_gbp_frozen_labour_replay_v1.py
      - name: Confirm engine and live data untouched
        run: git diff --exit-code -- engine live_data
      - name: Commit evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/GBP_FROZEN_LABOUR_REPLAY_V1_2026-10-06.json
          if git diff --cached --quiet; then
            echo "No evidence change"
          else
            git commit -m "Add GBP frozen Labour replay evidence"
            git pull --rebase origin audit-minimum-robust-pit-dataset-2026-10-06
            git push origin HEAD:audit-minimum-robust-pit-dataset-2026-10-06
          fi
