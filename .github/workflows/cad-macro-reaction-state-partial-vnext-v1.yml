name: CAD Macro Reaction State Partial vNext V1
on:
  push:
    branches: [audit-minimum-robust-pit-dataset-2026-10-06]
    paths:
      - 'validation/run_cad_macro_reaction_state_partial_vnext_v1.py'
      - '.github/workflows/cad-macro-reaction-state-partial-vnext-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-minimum-robust-pit-dataset-2026-10-06
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run partial macro reaction-state replay
        run: python validation/run_cad_macro_reaction_state_partial_vnext_v1.py
      - name: Strict engine/live-data guard
        run: git diff --exit-code -- engine live_data
      - name: Commit diagnostic evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/CAD_MACRO_REACTION_STATE_PARTIAL_VNEXT_V1_2026-10-06.json
          git diff --cached --quiet || git commit -m "Materialize CAD partial macro reaction-state replay"
          git push
