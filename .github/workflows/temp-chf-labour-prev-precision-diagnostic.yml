name: TEMP CHF Labour Previous Precision Repair

on:
  push:
    branches:
      - validation-macro-chf-labour-pit-bootstrap-2026-10-09-v2
    paths:
      - '.github/workflows/temp-chf-labour-prev-precision-diagnostic.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact previous CHF labour precision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from validation.build_macro_candidate import percentile, direction, acceleration, temperature_label

          hp=Path('live_data/sections/MACRO_THERMOMETER_DATA.json')
          sp=Path('live_data/sections/MACRO_SERIES.json')
          heat=json.loads(hp.read_text())
          series=json.loads(sp.read_text())
          h=heat['currencies']['CHF']['labour']
          s=next(x for x in series['CHF'] if x['id']=='CH_UNEMP_RATE_history_value')
          vals=[float(x) for x in s['values']]
          exact_prev=vals[-2]
          exact_cur=vals[-1]
          assert exact_prev == 3.13579541769569
          assert exact_cur == 3.13682671641221
          assert float(h['history'][-2]) == 3.135795
          assert float(h['history'][-1]) == exact_cur
          h['history'][-2]=exact_prev
          repaired=[float(x) for x in h['history']]
          assert percentile(repaired,exact_cur) == 82.1
          assert direction(repaired) == 'SALE'
          assert acceleration(repaired) == 'RALLENTA'
          assert temperature_label(82.1,heat['thresholds']) == 'MOLTO_CALDO'
          assert float(h['percentile']) == 82.1
          assert float(h['temperature_score']) == 82.1
          assert h['temperature_label'] == 'MOLTO_CALDO'
          assert h['direction'] == 'SALE'
          assert h['acceleration'] == 'RALLENTA'
          hp.write_text(json.dumps(heat,ensure_ascii=False,separators=(',',':'))+'\n')
          print(json.dumps({'status':'PASS','history_previous':exact_prev,'history_current':exact_cur,'derived_unchanged':True},indent=2))
          PY
          git diff -- live_data/sections/MACRO_THERMOMETER_DATA.json
          git diff --exit-code -- live_data/sections/MACRO_SERIES.json
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live_data/sections/MACRO_THERMOMETER_DATA.json
          git diff --cached --quiet && { echo 'No repair required'; exit 0; }
          git commit -m 'Repair CHF labour previous heatmap precision'
          git push origin HEAD:validation-macro-chf-labour-pit-bootstrap-2026-10-09-v2
