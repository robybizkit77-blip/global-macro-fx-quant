name: EUR ECB 2Y10Y V10 1440/390 Candidate Visual QA (no publish)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/eur-2y10y-v10-candidate-browser-v1.yml'
      - 'validation/rates/qa_v10_eur2y10y_candidate_visual_v1.cjs'
      - 'site/control-room-preview/home-navigation-v10.js'
      - 'validation/rates/build_eur_full_2y_10y_ecb_history_candidate_v1.py'
      - 'validation/build_rates_candidate_from_audit.py'
      - 'validation/rates/EUR_2Y10Y_CANDIDATE_BROWSER_VISUAL_AUDIT_2026-10-26.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-vs-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore approved gh-pages v10 32-part visual payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages --no-tags
          mkdir -p site/control-room-preview/parts
          for i in $(seq -w 0 31); do
            git show "origin/gh-pages:site/control-room-preview/parts/part-$i.txt" > "site/control-room-preview/parts/part-$i.txt"
          done
          test "$(find site/control-room-preview/parts -type f | wc -l)" -eq 32
          echo APPROVED_V10_32_PART_VISUAL_BASELINE_LOADED

      - name: Install Chrome/Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-audit --no-fund playwright
          # The Ubuntu runner has Chromium runtime libraries already.
          # Download only the headless shell used by chromium.launch;
          # apt-get --with-deps was stalling the earlier QA run.
          npx playwright install --only-shell chromium
          node --check validation/rates/qa_v10_eur2y10y_candidate_visual_v1.cjs

      - name: Inspect already-published ECB EUR source rebase
        id: source_state
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          src=json.load(open('live_data/sections/NATIVE_RATES_DATA.json'))
          eur=src['EUR']
          published=(eur.get('history_status')=='FULL_ECB_SAME_BASIS_2Y_10Y_OFFICIAL_PUBLISHED'
                     and eur.get('historical_curve_rebase',{}).get('status')=='PUBLISHED_AFTER_SOURCE_AND_BROWSER_QA'
                     and len(eur['history2']['dates'])==len(eur['history10']['dates'])
                     and eur['history2']['dates'][-1]==eur['history10']['dates'][-1]==eur['date']
                     and len(eur['history2']['dates'])>=282)
          print('published='+str(published).lower())
          PY
      - name: Verify published rebase status is not mistaken for a fresh candidate
        if: steps.source_state.outputs.published == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('live_data/sections/NATIVE_RATES_DATA.json'))['EUR']
          r=d['historical_curve_rebase']
          assert r['source_rebase_not_market_move']
          assert r['chf_reference_beta_recalibration_not_official_chf_yield']
          assert r['historical_first_release_pit_certified'] is False
          assert d['history2']['dates'][-1]==d['history10']['dates'][-1]==d['date']
          print('ECB_PREVIOUSLY_PUBLISHED_REBASE_SOURCE_CHECK_PASS',d['date'])
          PY

      - name: Targeted actual v10 Rates/CHF browser QA on unchanged original site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8818 --bind 127.0.0.1 > /tmp/eur-v10-original-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 2
          node validation/rates/qa_v10_eur2y10y_candidate_visual_v1.cjs \
            --scenario before --chf-10y 0.39472560216237235 \
            --out /tmp/eur-original-v10-browser-receipt.json \
            --screenshots /tmp/eur-v10-visual-proof/before | tee /tmp/eur-original-v10-browser.log
          mkdir -p /tmp/eur-v10-visual-proof/before
          test -n "$(find /tmp/eur-v10-visual-proof/before -name '*.png' -print -quit)"
          kill "$server" 2>/dev/null || true
          wait "$server" 2>/dev/null || true
          echo V10_ORIGINAL_1440_390_FULL_BROWSER_GREEN

      - name: Fetch original official ECB paired yields and build candidate
        if: steps.source_state.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --max-time 45 \
            'https://data-api.ecb.europa.eu/service/data/YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_2Y?startPeriod=2025-09-16&endPeriod=2026-10-22&format=csvdata' \
            -H 'Accept: text/csv' -o /tmp/eur-v10-2y-source.csv
          curl --fail --location --silent --show-error --retry 2 --max-time 45 \
            'https://data-api.ecb.europa.eu/service/data/YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_10Y?startPeriod=2025-09-16&endPeriod=2026-10-22&format=csvdata' \
            -H 'Accept: text/csv' -o /tmp/eur-v10-10y-source.csv
          python -m validation.rates.build_eur_full_2y_10y_ecb_history_candidate_v1 \
            --ecb-2y-original /tmp/eur-v10-2y-source.csv \
            --ecb-10y-original /tmp/eur-v10-10y-source.csv \
            --candidate /tmp/eur-v10-validated-candidate.json \
            --receipt /tmp/eur-v10-source-receipt.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/eur-v10-source-receipt.json'))
          assert r['per_tenor_official_parity']['2Y']['overlap_yield_mismatches']==260
          assert r['per_tenor_official_parity']['10Y']['overlap_yield_mismatches']==260
          assert not r['actual_production_promotion']
          print('V10_CANDIDATE_ORIGINAL_BCE_SOURCE_VERIFIED')
          PY

      - name: Targeted actual v10 Rates/CHF browser QA on corrected source in detached worktree
        if: steps.source_state.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="$GITHUB_WORKSPACE/node_modules"
          staged="$RUNNER_TEMP/gmfq-ecb-v10-browser-stage"
          git worktree add --detach "$staged" HEAD
          mkdir -p "$staged/site/control-room-preview/parts"
          cp -a site/control-room-preview/parts/. "$staged/site/control-room-preview/parts/"
          (
            cd "$staged"
            python validation/update_live_direct_section.py \
              --section NATIVE_RATES_DATA \
              --replacement /tmp/eur-v10-validated-candidate.json \
              --apply > /tmp/eur-v10-stage-apply.json
            python validation/build_live_manifest_v2.py \
              --write live_data/manifest.v2.json > /tmp/eur-v10-stage-manifest.json
            python validation/check_live_update_contract.py > /tmp/eur-v10-stage-contract.json
            python validation/rebuild_live_data_runtime.py --verify-only > /tmp/eur-v10-stage-runtime.json
            python - <<'PY'
          import json
          a=json.load(open('/tmp/eur-v10-stage-contract.json'))
          b=json.load(open('/tmp/eur-v10-stage-runtime.json'))
          assert a['status']=='PASS' and b['status']=='PASS'
          assert b.get('noop_roundtrip_byte_identical') is True
          print('CANDIDATE_V10_DATA_PAYLOAD_STAGED_WITH_INTEGRITY_PASS')
          PY
            python3 -m http.server 8818 --bind 127.0.0.1 > /tmp/eur-v10-candidate-server.log 2>&1 &
            server=$!
            trap 'kill "$server" 2>/dev/null || true' EXIT
            sleep 2
            node validation/rates/qa_v10_eur2y10y_candidate_visual_v1.cjs \
              --scenario after --chf-10y 0.5102548462926042 \
              --out /tmp/eur-candidate-v10-browser-receipt.json \
              --screenshots /tmp/eur-v10-visual-proof/after | tee /tmp/eur-candidate-v10-browser.log
            mkdir -p /tmp/eur-v10-visual-proof/after
            test -n "$(find /tmp/eur-v10-visual-proof/after -name '*.png' -print -quit)"
            kill "$server" 2>/dev/null || true
            wait "$server" 2>/dev/null || true
          )
          git worktree remove --force "$staged"
          test -z "$(git status --porcelain -- live_data payload site/website-v1)"
          echo V10_EUR_2Y10Y_CANDIDATE_1440_390_FULL_BROWSER_GREEN

      - name: Confirm before/after browser screenshot evidence and two viewports
        if: steps.source_state.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          a={x.name for x in Path('/tmp/eur-v10-visual-proof/before').glob('*.png')}
          b={x.name for x in Path('/tmp/eur-v10-visual-proof/after').glob('*.png')}
          assert a and a==b,(sorted(a),sorted(b))
          assert any('desktop' in n for n in b),sorted(b)
          assert any('mobile' in n for n in b),sorted(b)
          for name in b:
              assert (Path('/tmp/eur-v10-visual-proof/before')/name).stat().st_size>1000
              assert (Path('/tmp/eur-v10-visual-proof/after')/name).stat().st_size>1000
          print('V10_1440_390_BROWSER_BASELINE_CANDIDATE_IMAGES_VERIFIED',len(b),sorted(b))
          PY

      - name: Check approved published 1440/390 browser receipts
        if: steps.source_state.outputs.published == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('/tmp/eur-original-v10-browser-receipt.json'))
          assert r['status']=='TARGETED_BROWSER_CANDIDATE_GREEN',r
          assert len(r['cases'])==2
          assert {x['label'] for x in r['cases']}=={'desktop','mobile'}
          assert all(x['observed']['source_rebase_status']=='PUBLISHED_AFTER_SOURCE_AND_BROWSER_QA'
                     and x['observed']['no_core_effect']
                     and x['observed']['no_pair_effect']
                     and x['observed']['proxy_not_official']
                     for x in r['cases'])
          imgs={x.name for x in Path('/tmp/eur-v10-visual-proof/before').glob('*.png')}
          assert {'desktop-v10-rates.png','desktop-v10-home.png',
                  'mobile-v10-rates.png','mobile-v10-home.png'}<=imgs,imgs
          print('APPROVED_ECB_REBASE_PUBLISHED_DESKTOP_MOBILE_PROOF_PASS')
          PY

      - name: Save desktop/mobile evidence both before/after
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eur-2y10y-v10-1440-390-browser-before-after
          path: /tmp/eur-v10-visual-proof/
          if-no-files-found: warn
          retention-days: 14

      - name: No production promotion; independent morning-calendar source integrity issue remains open
        if: always()
        run: |
          echo 'The actual approved 32-part v10 CHF/EUR Rates rendering was browser-tested before/after at 1440px and 390px. This is targeted QA, NOT the full v10 A-Z suite.' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.source_state.outputs.published }}" = "true" ]; then
            echo '**Already published ECB historical rebase: verified current official 2Y/10Y and CHf low-confidence research proxy without rerunning obsolete fixed-period candidate. No operational data rewritten in this PR.**' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '**Unpublished ECB source: staged research-only candidate with full before/after browser QA. No live promotion.**' >> "$GITHUB_STEP_SUMMARY"
          fi
