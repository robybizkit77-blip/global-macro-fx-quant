name: Control Room v10 Full G8 Browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/control-room-preview/index.html'
      - 'site/control-room-preview/home-navigation-v10.js'
      - 'live_data/sections/DXY_SYNTHETIC_ECB.json'
      - 'validation/qa_control_room_v10_browser.js'
      - 'validation/test_control_room_home_first_read_v1.js'
      - 'validation/test_control_room_home_fx_risk_observations_v1.js'
      - 'validation/test_control_room_pending_source_dossiers_v1.js'
      - 'site/control-room-preview/ois-pricing-estimates-v1.js'
      - 'validation/test_control_room_g8_visible_pricing_v1.js'
      - 'validation/test_control_room_partial_chf_graded_chart_v1.js'
      - 'validation/test_control_room_chf_nzd_rates_research_v1.js'
      - 'validation/test_nzd_rbnz_b2_latest_web_research_v1.js'
      - 'live_data/sections/NZD_B2_GOVT_LATEST_WEB_RESEARCH.json'
      - 'validation/qa_ois_g8_estimates_v1.js'
      - 'validation/cb_pricing/audit_estimated_ois_reliability_v1.py'
      - 'validation/cb_pricing/test_audit_estimated_ois_reliability_v1.py'
      - 'validation/cb_pricing/eur_estr_contract_benchmark_bridge_v1.py'
      - 'validation/cb_pricing/test_eur_estr_contract_benchmark_bridge_v1.py'
      - 'validation/cb_pricing/eur_independent_spot_ois_forward_research_v1.py'
      - 'validation/cb_pricing/probe_eurex_clearing_discount_curve_v1.py'
      - 'validation/cb_pricing/test_probe_eurex_clearing_discount_curve_v1.py'
      - 'validation/cb_pricing/test_eur_independent_spot_ois_forward_research_v1.py'
      - 'validation/cb_pricing/probe_cme_term_estr_public_download_v1.py'
      - '.github/workflows/control-room-v10-full-g8-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-and-navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve unchanged v10 32-part approved visual baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages --no-tags
          mkdir -p site/control-room-preview/parts
          for i in $(seq -w 0 31); do
            git show "origin/gh-pages:site/control-room-preview/parts/part-$i.txt" > "site/control-room-preview/parts/part-$i.txt"
          done
          test "$(find site/control-room-preview/parts -type f | wc -l)" -eq 32
          echo V10_REFERENCE_32_PARTS_UNTOUCHED
      - name: Fast JavaScript syntax preflight
        run: |
          node --check validation/qa_control_room_v10_browser.js
          node --check site/control-room-preview/home-navigation-v10.js
          node validation/test_control_room_home_first_read_v1.js
          node validation/test_control_room_home_fx_risk_observations_v1.js
          node --check site/control-room-preview/ois-pricing-estimates-v1.js
          node validation/test_control_room_g8_visible_pricing_v1.js
          node validation/test_control_room_partial_chf_graded_chart_v1.js
          node validation/test_control_room_chf_nzd_rates_research_v1.js
          node validation/test_nzd_rbnz_b2_latest_web_research_v1.js
          node validation/qa_ois_g8_estimates_v1.js
      - name: Audit four estimated currencies' historical source reliability (research only)
        run: |
          python3 -m unittest validation.cb_pricing.test_audit_estimated_ois_reliability_v1 -v
          python3 -m validation.cb_pricing.audit_estimated_ois_reliability_v1 --out /tmp/ois-estimate-reliability.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/ois-estimate-reliability.json').read_text())
          assert x['quotes_observed']>=86
          assert x['total_matched_same_contract_changes']>=74
          assert x['currencies_with_verified_OIS_accuracy']==0
          assert x['directional_hit_rate_vs_OIS'] is None
          assert x['eligible_to_reprice_CB_or_28_pairs'] is False
          print('OIS_ESTIMATE_RESEARCH_DATA_CHECK_GREEN_INDEPENDENT_OIS_ACCURACY_UNVALIDATED')
          PY
      - name: Upload research reliability receipt (not official OIS scores)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ois-estimate-reliability-research-v1
          path: /tmp/ois-estimate-reliability.json
          if-no-files-found: warn
      - name: Independent EUR FST3 window alignment research-only
        run: |
          python3 -m unittest validation.cb_pricing.test_eur_estr_contract_benchmark_bridge_v1 -v
          python3 -m validation.cb_pricing.eur_estr_contract_benchmark_bridge_v1 --out /tmp/eur-estr-benchmark-readiness.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('/tmp/eur-estr-benchmark-readiness.json').read_text())
          # Append-only futures quotes grow each session; require coverage, not a frozen count.
          assert o['eur_archived_futures_observations']>=28
          assert o['eur_archived_futures_observations'] == o['started_compounding_period_quote_count'] + o['not_yet_started_or_start_day_quote_count']
          assert o['distinct_eurex_futures_periods']>=4
          assert o['admissible_same_window_pairs']==0
          assert o['actual_model_OIS_level_MAE_bp'] is None
          assert o['eligible_to_change_OIS_operational_feed'] is False
          assert o['writes_live_data'] is False
          print('EUR_FST3_FOUR_EXACT_ACCRUAL_WINDOWS_PASS_NO_OIS_MAE_INVENTED')
          PY
      - name: Upload EUR benchmark alignment research receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eur-fst3-benchmark-readiness-v1
          path: /tmp/eur-estr-benchmark-readiness.json
          if-no-files-found: warn
      - name: EUR independent spot OIS to exact future-period research sanity-check (synthetic tests only)
        run: |
          python3 -m unittest validation.cb_pricing.test_eur_independent_spot_ois_forward_research_v1 -v
          echo EUR_SPOT_OIS_BOOTSTRAP_RESEARCH_ONLY_NO_MAE_CLAIM
      - name: Probe official Eurex Clearing public discount curve (one dated request, no live-data writes)
        run: |
          python3 -m unittest validation.cb_pricing.test_probe_eurex_clearing_discount_curve_v1 -v
          python3 -m validation.cb_pricing.probe_eurex_clearing_discount_curve_v1 --once --out /tmp/eurex-clearing-curve-probe.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('/tmp/eurex-clearing-curve-probe.json').read_text())
          assert o['schema']=='GMFQ_EUREX_CLEARING_CURVE_PUBLIC_PROBE_V2'
          assert o['MAE_vs_true_OIS_bp'] is None
          assert o['eligible_to_modify_live_OIS_or_FX'] is False
          if o['status']=='EXACT_29OCT_ESTR_DISCOUNT_FACTORS_FOUND':
              assert o['expected_curve_id']=='EUR.ESTR.1D'
              assert o['matched_observations_count']==2
              assert all(r['source_day']=='2026-10-29' for r in o['matched_futures'])
          print('NO_OIS_ACCURACY_GRADE_OR_LIVE_REPRICING_PROMOTION')
          print('EUREX_CLEARING_CURVE_SOURCE_PROBE',o['status'])
          PY
      - name: Upload source probe receipt (no raw settlement curve)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eurex-clearing-ois-discount-curve-source-probe
          path: /tmp/eurex-clearing-curve-probe.json
          if-no-files-found: warn
      - name: Install browser runner
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local preview server
        run: |
          python3 -m http.server 8818 --bind 127.0.0.1 >/tmp/gmfq-v10-browser-qa.log 2>&1 &
          sleep 2
      - name: Verify native cards, DXY, all G8 data and no panel clipping
        run: node validation/qa_control_room_v10_browser.js
      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-room-v10-g8-visual-evidence
          path: v10-qa-images/**
          if-no-files-found: warn
