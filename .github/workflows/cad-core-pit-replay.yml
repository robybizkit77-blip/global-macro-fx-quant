name: CAD Core PIT Replay

on:
  push:
    branches:
      - engine-freeze-v1-2026-10-02
    paths:
      - 'validation/build_cad_core_pit_replay.py'
      - '.github/workflows/cad-core-pit-replay.yml'
      - 'validation/PIT_SIGNAL_SENSITIVITY_CA_MACRO_FULL_2020_2026_V1_2026-10-02.json'
      - 'validation/PIT_REPLAY_CA_RATES_POLICY_2020_2026_V1_2026-10-02.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engine-freeze-v1-2026-10-02
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build CAD core PIT replay
        run: python validation/build_cad_core_pit_replay.py
      - name: Commit core replay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/PIT_REPLAY_CA_CORE_MACRO_RATES_2020_2026_V1_2026-10-02.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build CAD core Macro Rates PIT replay"
            git pull --rebase origin engine-freeze-v1-2026-10-02
            git push origin HEAD:engine-freeze-v1-2026-10-02
          fi
