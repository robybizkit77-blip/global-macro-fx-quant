name: Staging EUR Macro Series Realign V1

on:
  push:
    branches:
      - 'staging-eur-macro-series-realign-*'
    paths:
      - '.github/workflows/staging-eur-macro-series-realign-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose official EUR labour candidate against canonical runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/eur-realign/live
          python3 validation/sources/eur_eurostat_core.py \
            --dimension labour \
            --output /tmp/eur-realign/live/candidate.json \
            --audit-output /tmp/eur-realign/live/source-audit.json >/tmp/eur-realign/live/source-run.json
          python3 - <<'PY'
          import copy, json
          from pathlib import Path
          from validation.build_macro_candidate import apply_candidate

          series=json.loads(Path('live_data/sections/MACRO_SERIES.json').read_text())
          heat=json.loads(Path('live_data/sections/MACRO_THERMOMETER_DATA.json').read_text())
          before_series=copy.deepcopy(series); before_heat=copy.deepcopy(heat)
          c=json.loads(Path('/tmp/eur-realign/live/candidate.json').read_text())
          a=json.loads(Path('/tmp/eur-realign/live/source-audit.json').read_text())
          assert c['observation_date'][:7]=='2026-08' and float(c['value'])==6.4
          assert a['prior_period'][:7]=='2026-07' and float(a['prior_value'])==6.4
          result=apply_candidate(series,heat,c)

          def walk(b,x,path=''):
              out=[]
              if type(b)!=type(x): return [(path,b,x)]
              if isinstance(b,dict):
                  for k in sorted(set(b)|set(x)):
                      p=f'{path}/{k}'
                      if k not in b: out.append((p,None,x[k]))
                      elif k not in x: out.append((p,b[k],None))
                      else: out.extend(walk(b[k],x[k],p))
              elif isinstance(b,list):
                  if b!=x: out.append((path,b,x))
              elif b!=x: out.append((path,b,x))
              return out

          heat_diff=walk(before_heat,heat)
          series_diff=walk(before_series,series)
          print(json.dumps({
            'candidate':c,
            'audit':a,
            'result':result,
            'heat_diff':[{'path':p,'before':b,'after':x} for p,b,x in heat_diff],
            'series_diff':[{'path':p,'before':b,'after':x} for p,b,x in series_diff],
          },ensure_ascii=False,indent=2))
          assert result['series_action']=='APPEND_NEW'
          assert series_diff, 'expected EUR series append missing'
          assert heat_diff, 'expected diagnostic heatmap divergence missing'
          PY
          git diff --exit-code -- live_data payload
