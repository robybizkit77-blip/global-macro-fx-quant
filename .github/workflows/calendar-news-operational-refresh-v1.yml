name: Calendar News Operational Refresh V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/build_calendar_operational_v1.py'
      - 'validation/refresh_macro_consensus_secondary_v1.py'
      - 'validation/macro/freeze_pre_release_consensus_v1.py'
      - 'validation/macro/capture_official_postrelease_actuals_v1.py'
      - 'validation/macro/build_macro_event_market_context_v1.py'
      - 'validation/macro/test_build_macro_event_market_context_v1.py'
      - 'validation/macro/fixtures/macro_event_market_preanchor_oct28_v1.json'
      - 'validation/macro/MACRO_EVENT_PRE_RELEASE_MARKET_ANCHORS_V1.jsonl'
      - 'validation/macro/test_capture_official_postrelease_actuals_v1.py'
      - 'validation/macro/MACRO_OFFICIAL_ACTUAL_FIRST_SEEN_V1.jsonl'
      - 'validation/macro/test_freeze_pre_release_consensus_v1.py'
      - 'validation/macro/fixtures/pre_release_oct28_usd_cad_fixture_v1.json'
      - 'validation/macro/MACRO_PRE_RELEASE_CONSENSUS_LEDGER_V1.jsonl'
      - 'validation/build_news_pulse_operational_v1.py'
      - 'validation/news_reaction_evidence_v1.py'
      - 'validation/collect_official_news_rss_v1.py'
      - 'validation/test_calendar_news_daily_recheck_v1.py'
      - 'validation/calendar/verify_future_macro_coverage_v1.py'
      - 'validation/calendar/test_verify_future_macro_coverage_v1.py'
      - 'validation/calendar/promote_fomc_oct28_official_cb_catchup_v1.py'
      - 'validation/calendar/promote_boj_oct30_official_cb_catchup_v1.py'
      - 'validation/calendar/test_promote_fomc_oct28_official_cb_catchup_v1.py'
      - 'validation/calendar/test_promote_boj_oct30_official_cb_catchup_v1.py'
      - 'validation/calendar/MACRO_RELEASE_SOURCE_REGISTRY_V1.json'
      - 'live_data/sections/MACRO_RELEASE_OFFICIAL_SEED_V1.json'
      - 'live_data/sections/MACRO_CONSENSUS_SECONDARY_V1.json'
      - 'live_data/sections/NATIVE_CB_DATA.json'
      - 'live_data/sections/OIS_OPERATIONAL_VIEW.json'
      - 'live_data/sections/MACRO_THERMOMETER_DATA.json'
      - '.github/workflows/calendar-news-operational-refresh-v1.yml'
  push:
    branches: [main]
    paths:
      - 'validation/build_calendar_operational_v1.py'
      - 'validation/refresh_macro_consensus_secondary_v1.py'
      - 'validation/macro/freeze_pre_release_consensus_v1.py'
      - 'validation/macro/capture_official_postrelease_actuals_v1.py'
      - 'validation/macro/build_macro_event_market_context_v1.py'
      - 'validation/macro/test_build_macro_event_market_context_v1.py'
      - 'validation/macro/fixtures/macro_event_market_preanchor_oct28_v1.json'
      - 'validation/macro/MACRO_EVENT_PRE_RELEASE_MARKET_ANCHORS_V1.jsonl'
      - 'validation/macro/test_capture_official_postrelease_actuals_v1.py'
      - 'validation/macro/MACRO_OFFICIAL_ACTUAL_FIRST_SEEN_V1.jsonl'
      - 'validation/macro/test_freeze_pre_release_consensus_v1.py'
      - 'validation/macro/fixtures/pre_release_oct28_usd_cad_fixture_v1.json'
      - 'validation/macro/MACRO_PRE_RELEASE_CONSENSUS_LEDGER_V1.jsonl'
      - 'validation/build_news_pulse_operational_v1.py'
      - 'validation/news_reaction_evidence_v1.py'
      - 'validation/collect_official_news_rss_v1.py'
      - 'validation/test_calendar_news_daily_recheck_v1.py'
      - 'validation/calendar/verify_future_macro_coverage_v1.py'
      - 'validation/calendar/test_verify_future_macro_coverage_v1.py'
      - 'validation/calendar/promote_fomc_oct28_official_cb_catchup_v1.py'
      - 'validation/calendar/promote_boj_oct30_official_cb_catchup_v1.py'
      - 'validation/calendar/test_promote_fomc_oct28_official_cb_catchup_v1.py'
      - 'validation/calendar/test_promote_boj_oct30_official_cb_catchup_v1.py'
      - 'validation/calendar/MACRO_RELEASE_SOURCE_REGISTRY_V1.json'
      - 'live_data/sections/MACRO_RELEASE_OFFICIAL_SEED_V1.json'
      - 'live_data/sections/MACRO_CONSENSUS_SECONDARY_V1.json'
      - 'live_data/sections/NATIVE_CB_DATA.json'
      - 'live_data/sections/OIS_OPERATIONAL_VIEW.json'
      - 'live_data/sections/MACRO_THERMOMETER_DATA.json'
      - '.github/workflows/calendar-news-operational-refresh-v1.yml'
  schedule:
    # Early weekday availability check: 05:17 CET / 06:17 CEST.
    # The existing 06:17 UTC run is retained as an independent backup.
    - cron: '17 4 * * 1-5'
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Keep both existing 05:17/07:17 CET Calendar source rechecks when a
# delayed scheduled event overlaps another build. The early VIX recovery
# follows only successful scheduled Calendar runs, so dropping the pending
# schedule would silently remove that independent prebrief opportunity.
# PR validation is isolated from production and all writers remain serialized.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('calendar-news-validation-pr-{0}', github.event.pull_request.number) || 'calendar-news-operational-refresh-v1' }}
  queue: max
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit the verified October 28 FOMC decision into CB source (no model effect)
        run: |
          set -euo pipefail
          python -m unittest validation.calendar.test_promote_fomc_oct28_official_cb_catchup_v1 -v
          python validation/calendar/promote_fomc_oct28_official_cb_catchup_v1.py \
            --output /tmp/gmfq-fomc-oct28-candidate.json \
            | tee /tmp/gmfq-fomc-oct28-receipt.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/gmfq-fomc-oct28-receipt.json'))
          assert d['status'] in {
             'OFFICIAL_FOMC_2026_10_28_CATCHUP_READY',
             'ALREADY_CERTIFIED_NO_CHANGE','SKIP_NEWER_CERTIFIED_USD_DECISION'
          }
          PY
          if python - <<'PY'
          import json
          d=json.load(open('/tmp/gmfq-fomc-oct28-receipt.json'))
          raise SystemExit(0 if d['changed'] else 1)
          PY
          then
            python validation/update_live_direct_section.py \
              --section NATIVE_CB_DATA \
              --replacement /tmp/gmfq-fomc-oct28-candidate.json \
              --apply > /tmp/gmfq-fomc-section-apply.json
          else
            echo FOMC_ALREADY_CERTIFIED_NO_PAYLOAD_UPDATE
          fi
          python validation/build_live_manifest_v2.py \
            --write live_data/manifest.v2.json > /tmp/gmfq-fomc-manifest-check.json
          python validation/check_live_update_contract.py > /tmp/gmfq-fomc-live-contract.json
          python validation/rebuild_live_data_runtime.py --verify-only \
            > /tmp/gmfq-fomc-runtime-check.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/gmfq-fomc-oct28-receipt.json'))
          m=json.load(open('/tmp/gmfq-fomc-manifest-check.json'))
          c=json.load(open('/tmp/gmfq-fomc-live-contract.json'))
          r=json.load(open('/tmp/gmfq-fomc-runtime-check.json'))
          assert m['status']=='PASS' and c['status']=='PASS'
          assert r['status']=='PASS' and r['noop_roundtrip_byte_identical'] is True
          assert d['rate_level_changed'] is False
          assert d['market_pricing_unchanged'] is True
          assert d['core_or_ois_or_pair_effect']=='NONE'
          print('OFFICIAL_FOMC_CB_SOURCE_INTEGRITY_PASS',d['status'])
          PY

      - name: Admit verified October 30 BoJ HOLD decision and December next meeting (no repricing rewrite)
        run: |
          set -euo pipefail
          python -m unittest validation.calendar.test_promote_boj_oct30_official_cb_catchup_v1 -v
          python validation/calendar/promote_boj_oct30_official_cb_catchup_v1.py \
            --output /tmp/gmfq-boj-oct30-candidate.json \
            | tee /tmp/gmfq-boj-oct30-receipt.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/gmfq-boj-oct30-receipt.json'))
          assert d['status'] in {
             'OFFICIAL_BOJ_2026_10_30_CATCHUP_READY',
             'ALREADY_CERTIFIED_NO_CHANGE','SKIP_NEWER_CERTIFIED_JPY_DECISION'
          }
          assert d['rate_level_changed'] is False
          assert d['market_pricing_unchanged'] is True
          assert d['core_or_ois_or_pair_effect']=='NONE'
          PY
          if python - <<'PY'
          import json
          d=json.load(open('/tmp/gmfq-boj-oct30-receipt.json'))
          raise SystemExit(0 if d['changed'] else 1)
          PY
          then
            python validation/update_live_direct_section.py \
              --section NATIVE_CB_DATA \
              --replacement /tmp/gmfq-boj-oct30-candidate.json \
              --apply > /tmp/gmfq-boj-section-apply.json
          else
            echo BOJ_OCT30_ALREADY_CERTIFIED_NO_PAYLOAD_UPDATE
          fi
          python validation/build_live_manifest_v2.py \
            --write live_data/manifest.v2.json > /tmp/gmfq-boj-manifest-check.json
          python validation/check_live_update_contract.py > /tmp/gmfq-boj-live-contract.json
          python validation/rebuild_live_data_runtime.py --verify-only \
            > /tmp/gmfq-boj-runtime-check.json
          python - <<'PY'
          import json
          for name in ('manifest','live-contract','runtime'):
              path={'manifest':'/tmp/gmfq-boj-manifest-check.json',
                    'live-contract':'/tmp/gmfq-boj-live-contract.json',
                    'runtime':'/tmp/gmfq-boj-runtime-check.json'}[name]
              d=json.load(open(path))
              assert d['status']=='PASS', (name,d)
              if name=='runtime':
                  assert d['noop_roundtrip_byte_identical'] is True
          print('OFFICIAL_BOJ_OCT30_CB_SOURCE_INTEGRITY_PASS')
          PY

      - name: Refresh public secondary consensus
        run: |
          set -euo pipefail
          python validation/refresh_macro_consensus_secondary_v1.py
      - name: Validate frozen pre-release macro forecast ledger with synthetic and October 28 contract tests
        run: python -m unittest validation.macro.test_freeze_pre_release_consensus_v1 -v
      - name: Append source-observed consensus only while event is genuinely in the future
        run: |
          set -euo pipefail
          python -m validation.macro.freeze_pre_release_consensus_v1 \
            | tee /tmp/macro-pre-release-consensus-lock-receipt.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/macro-pre-release-consensus-lock-receipt.json'))
          assert x['status']=='PRE_RELEASE_CONSENSUS_FROZEN_OR_ALREADY_ARCHIVED'
          assert x['safe_to_publish_core'] is False
          assert x['safe_to_update_28_pairs'] is False
          assert x['safe_for_beta'] is False and x['safe_for_forward'] is False
          print('MACRO_CONSENSUS_PRE_RELEASE_FROZEN_NO_MODEL_PROMOTION',
                x['new_forecasts_frozen'],x['records_after'])
          PY

      - name: Test future issuer actual admission and immutable frozen consensus linkage
        run: python -m unittest validation.macro.test_capture_official_postrelease_actuals_v1 -v
      - name: Check official post-release ECI/GDP and preserve only first verified source observation
        shell: bash
        run: |
          set -euo pipefail
          python -m validation.macro.capture_official_postrelease_actuals_v1 \
            | tee /tmp/macro-official-actuals-receipt.json
          python - <<'PY'
          import json,os
          x=json.load(open('/tmp/macro-official-actuals-receipt.json'))
          assert x['status']=='OFFICIAL_ACTUAL_POST_RELEASE_FIRST_CAPTURE_MONITOR'
          assert x['actual_first_release_PIT_verified'] is False
          assert x['fx_or_rates_causality_verified'] is False
          assert x['Core_changed'] is False and x['Beta_or_Forward_changed'] is False
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fd:
              fd.write('### Frozen forecast → official issuer actuals (descriptive only)\n')
              fd.write('- First official actuals observed this run: '+str(x['new_actuals'])+
                       '; archived total: '+str(x['total_actuals'])+'\n')
              for key,state in x['states'].items():
                  fd.write('- '+key+': **'+state+'**\n')
              fd.write('- No pre-scheduled fetch, no first-release PIT claim, no causal FX repricing, Core, Beta or Forward promotion.\n')
          PY

      - name: Test real dated pre-event market anchors and conservative post-event comparisons
        run: python -m unittest validation.macro.test_build_macro_event_market_context_v1 -v
      - name: Archive first-seen pre-announcement 2Y/10Y ECB FX and official 6M futures source anchors
        shell: bash
        run: |
          set -euo pipefail
          python -m validation.macro.build_macro_event_market_context_v1 \
            --receipt /tmp/macro-event-market-context-receipt.json
          python - <<'PY'
          import json,os
          d=json.load(open('/tmp/macro-event-market-context-receipt.json'))
          a=d['anchor'];c=d['context']
          assert a['status']=='MACRO_PRE_RELEASE_MARKET_ANCHOR_CHECK'
          assert a['writes_live_model'] is False
          assert a['safe_for_new_FX_signal'] is False
          assert c['summary']['events']==2
          assert c['summary']['issuer_event_intraday_reactions_certified']==0
          assert c['summary']['FX_signals']==0
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as o:
              o.write('### Macro event before/after calendar context, NOT verified release-market causality\n')
              o.write('- Early pre-event market anchors saved: '+str(a['added_anchors'])+
                      '; total '+str(a['total_anchors'])+'.\n')
              for e in c['events']:
                  o.write('- '+e['event_key']+': **'+e['state']+'**.\n')
              o.write('- 2Y government yields are not pure CB policy; CAD futures are not OIS, USD 6M remains estimated/absent from official source.\n')
          PY

      - name: Test source recheck distinct from content modification
        run: python validation/test_calendar_news_daily_recheck_v1.py
      - name: Build operational Calendar and News Pulse
        run: |
          set -euo pipefail
          python validation/build_calendar_operational_v1.py
          python validation/build_news_pulse_operational_v1.py
      - name: Verify source-matched future G8 dates and honest partial coverage
        run: python -m unittest validation.calendar.test_verify_future_macro_coverage_v1 -v

      - name: Validate operational outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cal=json.loads(Path('live_data/sections/CALENDAR_OPERATIONAL_VIEW.json').read_text())
          con=json.loads(Path('live_data/sections/MACRO_CONSENSUS_SECONDARY_V1.json').read_text())
          news=json.loads(Path('live_data/sections/NEWS_PULSE_OPERATIONAL.json').read_text())
          assert cal['schema']=='GMFQ_CALENDAR_OPERATIONAL_VIEW_V3'
          assert cal['status']=='ACTIVE_CB_PLUS_MACRO_OFFICIAL_WITH_SECONDARY_CONTEXT'
          from validation.calendar.verify_future_macro_coverage_v1 import verify
          from datetime import datetime, timezone
          seed=json.loads(Path('live_data/sections/MACRO_RELEASE_OFFICIAL_SEED_V1.json').read_text())
          cb=json.loads(Path('live_data/sections/NATIVE_CB_DATA.json').read_text())
          receipt=verify(cal,seed,cb,datetime.now(timezone.utc))
          print('CALENDAR_FUTURE_SOURCE_PARITY',receipt)
          assert cal['scope']['core_score_impact']==0
          assert cal['scope']['consensus_context_only'] is True
          assert cal['scope']['consensus_never_changes_official_date'] is True
          macro=[e for e in cal['events'] if e['event_type']!='CENTRAL_BANK_DECISION']
          assert {e['ccy'] for e in macro}==set(cal['scope']['macro_release_currencies'])
          assert all(str(e['quality']).startswith('OFFICIAL_') for e in macro)
          assert all(e.get('consensus_status') in {'AVAILABLE','PREVIOUS_ONLY','NOT_PRESENT'} for e in macro)
          assert con['provider']=='FOREX_FACTORY_FAIR_ECONOMY_WEEKLY'
          assert con['provider_field']=='forecast'
          assert con['rules']['estimate_field_is_consensus_only'] is True
          assert con['rules']['actual_not_used_as_pre_release_consensus'] is True
          assert con['rules']['official_calendar_remains_primary'] is True
          assert con['rules']['never_change_release_date'] is True
          assert con['rules']['public_json_secondary_source'] is True
          assert con['rules']['weekly_feed_scope'] is True
          assert news['schema']=='GMFQ_NEWS_PULSE_OPERATIONAL_V1'
          ev=news['macro_event_market_context']
          assert ev['schema']=='GMFQ_MACRO_EVENT_CONTEXT_DAILY_MATCH_V1'
          assert ev['summary']['events']==2
          assert ev['summary']['issuer_event_intraday_reactions_certified']==0
          assert ev['summary']['FX_signals']==0
          assert all(e['FX_trade_signal'] is None and e['event_causality_verified'] is False
                     and e['eligible_for_Core_Beta_Forward'] is False
                     for e in ev['events'])
          assert news['status']=='ACTIVE_DETERMINISTIC_LAYERS'
          assert news['items']
          external=news['official_releases']
          assert external['schema']=='GMFQ_OFFICIAL_RSS_HEADLINES_V1'
          assert external['source_count']==9
          assert 0 <= external['source_failures'] <= external['source_count']
          assert external['status'] in {
            'SOURCES_UNAVAILABLE','PARTIAL_SOURCES',
            'VERIFIED_NO_RECENT_RELEASES','VERIFIED_OFFICIAL_RELEASES'
          }
          assert external['core_effect']=='NONE'
          assert external['reaction_proof_contract']['verified_event_reactions']==0
          assert external['reaction_proof_contract']['daily_rates_are_not_event_window_proof'] is True
          assert all(x.get('reaction_evidence',{}).get('market_reaction')=='NOT_MEASURED'
                     and x['reaction_evidence']['causal_attribution']=='NOT_ESTABLISHED'
                     and x['reaction_evidence']['status']=='NOT_VERIFIABLE_INTRADAY'
                     for x in external['headlines'])
          assert all(x['quality']=='OFFICIAL_RSS_DATED_LINK' and x.get('url') and x.get('published_at_utc') for x in external['headlines'])
          assert all(x.get('desk_context',{}).get('operational_relevance') in {'MONITOR','REVIEW','CONTEXT'} and
                     x['desk_context']['analysis_basis']=='SOURCE_HEADLINE_ONLY' and
                     x['desk_context']['market_direction']=='NOT_DETERMINED' and
                     x['desk_context']['market_reaction']=='NOT_MEASURED' and
                     x['desk_context']['why_watch'] and x['desk_context']['verify_next']
                     for x in external['headlines'])
          assert news['scope']['external_news_feed']=='OFFICIAL_G8_CB_EIA_RSS_SEPARATE_HEADLINE_ONLY'
          print('OFFICIAL_NEWS_RSS_RECEIPT', external['status'], len(external['headlines']))
          print('CALENDAR_NEWS_OPERATIONAL_REFRESH_PASS',len(cal['events']),len(macro),cal['coverage']['consensus_available_events'],len(news['items']),news['content_as_of'])
          PY
      - name: Persist changed operational views
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          changed="$(git diff --name-only -- live_data/sections/CALENDAR_OPERATIONAL_VIEW.json live_data/sections/MACRO_CONSENSUS_SECONDARY_V1.json live_data/sections/NEWS_PULSE_OPERATIONAL.json validation/macro/MACRO_PRE_RELEASE_CONSENSUS_LEDGER_V1.jsonl validation/macro/MACRO_OFFICIAL_ACTUAL_FIRST_SEEN_V1.jsonl validation/macro/MACRO_EVENT_PRE_RELEASE_MARKET_ANCHORS_V1.jsonl live_data/sections/NATIVE_CB_DATA.json live_data/manifest.v2.json payload/part-00.txt)"
          if [ -z "$changed" ]; then echo CALENDAR_NEWS_NO_CHANGE; exit 0; fi
          unexpected="$(git diff --name-only | grep -Ev '^(live_data/sections/CALENDAR_OPERATIONAL_VIEW.json|live_data/sections/MACRO_CONSENSUS_SECONDARY_V1.json|live_data/sections/NEWS_PULSE_OPERATIONAL.json|validation/macro/MACRO_PRE_RELEASE_CONSENSUS_LEDGER_V1.jsonl|validation/macro/MACRO_OFFICIAL_ACTUAL_FIRST_SEEN_V1.jsonl|validation/macro/MACRO_EVENT_PRE_RELEASE_MARKET_ANCHORS_V1.jsonl|live_data/sections/NATIVE_CB_DATA.json|live_data/manifest.v2.json|payload/part-00.txt)$' || true)"
          test -z "$unexpected" || { echo "Unexpected changes: $unexpected" >&2; exit 1; }
          REMOTE_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          LOCAL_SHA="$(git rev-parse HEAD)"
          test "$REMOTE_SHA" = "$LOCAL_SHA" || { echo 'main moved during Calendar/News refresh' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live_data/sections/CALENDAR_OPERATIONAL_VIEW.json live_data/sections/MACRO_CONSENSUS_SECONDARY_V1.json live_data/sections/NEWS_PULSE_OPERATIONAL.json validation/macro/MACRO_PRE_RELEASE_CONSENSUS_LEDGER_V1.jsonl validation/macro/MACRO_OFFICIAL_ACTUAL_FIRST_SEEN_V1.jsonl validation/macro/MACRO_EVENT_PRE_RELEASE_MARKET_ANCHORS_V1.jsonl live_data/sections/NATIVE_CB_DATA.json live_data/manifest.v2.json payload/part-00.txt
          git commit -m 'Refresh certified FOMC policy date and operational Calendar/News'
          git push origin HEAD:main
