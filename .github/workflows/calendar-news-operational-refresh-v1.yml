name: Calendar News Operational Refresh V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/build_calendar_operational_v1.py'
      - 'validation/build_news_pulse_operational_v1.py'
      - 'live_data/sections/NATIVE_CB_DATA.json'
      - 'live_data/sections/OIS_OPERATIONAL_VIEW.json'
      - 'live_data/sections/MACRO_THERMOMETER_DATA.json'
      - '.github/workflows/calendar-news-operational-refresh-v1.yml'
  push:
    branches: [main]
    paths:
      - 'validation/build_calendar_operational_v1.py'
      - 'validation/build_news_pulse_operational_v1.py'
      - 'live_data/sections/NATIVE_CB_DATA.json'
      - 'live_data/sections/OIS_OPERATIONAL_VIEW.json'
      - 'live_data/sections/MACRO_THERMOMETER_DATA.json'
      - '.github/workflows/calendar-news-operational-refresh-v1.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendar-news-operational-refresh-v1
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build operational Calendar and News Pulse
        run: |
          set -euo pipefail
          python validation/build_calendar_operational_v1.py
          python validation/build_news_pulse_operational_v1.py
      - name: Validate operational outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cal=json.loads(Path('live_data/sections/CALENDAR_OPERATIONAL_VIEW.json').read_text())
          news=json.loads(Path('live_data/sections/NEWS_PULSE_OPERATIONAL.json').read_text())
          assert cal['schema']=='GMFQ_CALENDAR_OPERATIONAL_VIEW_V1'
          assert cal['coverage']['cb_schedule_available']==8
          assert all(e['quality']=='OFFICIAL_SCHEDULE_FROM_CERTIFIED_CB_LAYER' for e in cal['events'])
          assert news['schema']=='GMFQ_NEWS_PULSE_OPERATIONAL_V1'
          assert news['status']=='ACTIVE_DETERMINISTIC_LAYERS'
          assert news['items']
          assert all(x.get('as_of') for x in news['items'])
          print('CALENDAR_NEWS_OPERATIONAL_REFRESH_PASS',len(cal['events']),len(news['items']),news['content_as_of'])
          PY
      - name: Persist changed operational views
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          changed="$(git diff --name-only -- live_data/sections/CALENDAR_OPERATIONAL_VIEW.json live_data/sections/NEWS_PULSE_OPERATIONAL.json)"
          if [ -z "$changed" ]; then echo CALENDAR_NEWS_NO_CHANGE; exit 0; fi
          unexpected="$(git diff --name-only | grep -Ev '^(live_data/sections/CALENDAR_OPERATIONAL_VIEW.json|live_data/sections/NEWS_PULSE_OPERATIONAL.json)$' || true)"
          test -z "$unexpected" || { echo "Unexpected changes: $unexpected" >&2; exit 1; }
          REMOTE_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          LOCAL_SHA="$(git rev-parse HEAD)"
          test "$REMOTE_SHA" = "$LOCAL_SHA" || { echo 'main moved during Calendar/News refresh' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live_data/sections/CALENDAR_OPERATIONAL_VIEW.json live_data/sections/NEWS_PULSE_OPERATIONAL.json
          git commit -m 'Refresh operational Calendar and News Pulse'
          git push origin HEAD:main
