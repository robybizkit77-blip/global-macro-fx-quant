name: Research platform independent browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/fx-quant-v2/research/**'
      - 'validation/qa_research_rebuild.cjs'
      - '.github/workflows/research-rebuild-browser.yml'
permissions:
  contents: read
jobs:
  research-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Validate new standalone design against actual canonical data
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/research-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/site/fx-quant-v2/research/ >/dev/null && break; sleep 1; done
          node validation/qa_research_rebuild.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-platform-visual-review
          path: research-*.png
          if-no-files-found: ignore
