name: PIT Lookahead Guard
on:
  push:
    branches: [staging-usd-pit-readiness-2026-10-03]
    paths:
      - 'validation/audit_pit_lookahead_guard.py'
      - '.github/workflows/pit-lookahead-guard.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python validation/audit_pit_lookahead_guard.py
      - name: Commit audit artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/PIT_LOOKAHEAD_GUARD_AUDIT_2026-10-03.json
          git diff --cached --quiet || git commit -m 'Add PIT lookahead guard audit artifact'
          git push
# retrigger after BEA observation mapping fix
