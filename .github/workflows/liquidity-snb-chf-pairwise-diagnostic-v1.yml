name: Liquidity SNB CHF Pairwise Diagnostic V1

on:
  push:
    branches: [release-candidate-daily-data-orchestrator-v1-2026-10-12]
    paths:
      - 'validation/diagnose_snb_chf_pairwise_aggregation_v1.py'
      - '.github/workflows/liquidity-snb-chf-pairwise-diagnostic-v1.yml'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pairwise-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot tracked runtime
        run: sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/runtime.before.sha256
      - name: Test SNB pairwise aggregations
        run: python validation/diagnose_snb_chf_pairwise_aggregation_v1.py | tee /tmp/chf-pairwise.json
      - name: Classify result without forced promotion
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/chf-pairwise.json'))
          assert d['schema']=='GMFQ_SNB_CHF_PAIRWISE_AGGREGATION_DIAGNOSTIC_V1',d
          assert d['promotion_eligible'] is False and d['runtime_mutated'] is False and d['publication_performed'] is False,d
          for lane in ('sight_top','credit_top'):
              if d[lane]:
                  b=d[lane][0]
                  print(lane,'best=',b)
                  if b['overlap']>=12 and b['exact_ratio']==1.0:
                      print('EXACT_PAIRWISE_MATCH_FOUND_REQUIRES_SEPARATE_CONTRACT',lane,b)
                  else:
                      print('NO_EXACT_PAIRWISE_MATCH',lane,b)
          PY
      - name: Verify tracked runtime unchanged
        run: |
          sha256sum -c /tmp/runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Summary
        run: |
          echo 'CHF pairwise aggregation probe complete'
          echo 'Promotion: NONE'
          echo 'Tracked runtime mutation: NONE'
