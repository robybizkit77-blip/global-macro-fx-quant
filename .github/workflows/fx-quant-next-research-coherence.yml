name: FX Quant Next Research Coherence QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/fx-quant-v2/**'
      - 'site/control-room-preview/macro-v3-current-evidence.json'
      - 'live_data/sections/**'
      - 'validation/qa_next_*.cjs'
      - 'validation/pair_thesis/**'
      - '.github/workflows/fx-quant-next-research-coherence.yml'
  push:
    branches: [main]
    paths:
      - 'site/fx-quant-v2/next/**'
      - 'live_data/sections/NATIVE_RATES_DATA.json'
      - 'live_data/sections/DXY_SYNTHETIC_ECB.json'
      - 'live_data/sections/PAIR_SETUP_OPERATIONAL_VIEW.json'
      - 'live_data/sections/MACRO_THERMOMETER_DATA.json'
      - 'live_data/sections/V247_COT_STORIES.json'
      - 'site/fx-quant-v2/cross-asset-live-data.json'
      - 'site/fx-quant-v2/ois-pricing-snapshot.json'
      - 'validation/qa_next_research_coherence_v1.cjs'
      - 'live_data/sections/V250_COT_CHART_DATA.json'
      - 'live_data/sections/NEWS_PULSE_OPERATIONAL.json'
      - 'live_data/sections/CALENDAR_OPERATIONAL_VIEW.json'
      - 'validation/qa_next_research_editorials_v7.cjs'
      - 'validation/qa_next_research_decision_v9.cjs'
      - 'validation/qa_next_fx_rates_bridge_v13.cjs'
      - 'validation/publishing/test_next_rates_pricing_moves_v1.cjs'
      - 'validation/publishing/test_next_pricing_history_v1.cjs'
      - 'validation/publishing/test_next_relative_pricing_v1.cjs'
      - 'validation/publishing/test_next_pair_monetary_bridge_v1.cjs'
      - 'site/fx-quant-v2/next/pair-monetary-bridge-v1.js'
      - 'site/fx-quant-v2/next/rates-relative-pricing-v1.js'
      - 'site/fx-quant-v2/next/rates-pricing-history-v1.js'
      - 'site/fx-quant-v2/next/rates-pricing-history-v1.json'
      - 'validation/qa_next_pair_coverage_v15.cjs'
      - 'validation/qa_next_aud_f2_daily_research_v16.cjs'
      - 'validation/qa_next_chf_nzd_provenance_v17.cjs'
      - 'validation/qa_next_research_library_v1.cjs'
      - 'validation/qa_next_macro_calendar_v1.cjs'
      - 'validation/qa_next_pairs_clarity_v1.cjs'
      - 'validation/pair_thesis/update_history_v1.cjs'
      - 'validation/pair_thesis/test_history_v1.cjs'
      - 'site/fx-quant-v2/chf-snb-paired-history.json'
      - 'site/fx-quant-v2/nzd-b2-postroll-web-research.json'
      - 'site/fx-quant-v2/aud-rba-f2-history-research.json'
      - 'live_data/sections/ECB_G8_PRICE_HISTORY.json'
      - '.github/workflows/fx-quant-next-research-coherence.yml'
  workflow_dispatch:
  schedule:
    - cron: '18 8 * * 1-5'
    - cron: '18 18 * * 1-5'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('fx-quant-next-research-coherence-pr-{0}', github.event.pull_request.number) || 'fx-quant-next-research-coherence-main' }}
  cancel-in-progress: true

jobs:
  research-coherence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check changing story, matched evidence, source dates and missing data
        run: node validation/qa_next_research_coherence_v1.cjs
      - name: Verify editorial continuity across every Next research studio
        run: node validation/qa_next_research_editorials_v7.cjs
      - name: Verify FX research-to-decision journey, prices and conservative shortlist
        run: node validation/qa_next_research_decision_v9.cjs
      - name: Verify source-aligned FX and government 2Y evidence, without OIS fiction
        run: node validation/qa_next_fx_rates_bridge_v13.cjs
      - name: Verify source-dated 1D/1W OIS/futures research, missing dates and rollover
        run: node validation/publishing/test_next_rates_pricing_moves_v1.cjs
      - name: Verify all G8 historical 3M/6M/12M pricing and no synthetic OIS curve
        run: node validation/publishing/test_next_pricing_history_v1.cjs
      - name: Verify same-date relative 6M policy-pricing research and FX dossier handoff
        run: node validation/publishing/test_next_relative_pricing_v1.cjs
      - name: Verify FX pair monetary 6M validation for 28 crosses with Rates handoff
        run: node validation/publishing/test_next_pair_monetary_bridge_v1.cjs
      - name: Verify per-pair status across all 28 G8 crosses and missing-data guardrails
        run: node validation/qa_next_pair_coverage_v15.cjs
      - name: Verify quarantined RBA F2 daily research source and no Core promotion
        run: node validation/qa_next_aud_f2_daily_research_v16.cjs
      - name: Verify dated CHF SNB and NZD post-roll provenance without trading confirmation
        run: node validation/qa_next_chf_nzd_provenance_v17.cjs
      - name: Verify Research Library public HTML reports, links, categories and dates
        run: node validation/qa_next_research_library_v1.cjs
      - name: Verify operational G8 macro calendar with Rome times and missing-consensus safety
        run: node validation/qa_next_macro_calendar_v1.cjs
      - name: Verify pair thesis history for all 28 G8 crosses without invented signals
        run: node validation/pair_thesis/test_history_v1.cjs
      - name: Verify compact Pair Explorer and nonduplicated optional research panels
        run: node validation/qa_next_pairs_clarity_v1.cjs
