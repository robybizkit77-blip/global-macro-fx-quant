name: GBP Inflation Strict PIT Materialize V1

on:
  push:
    branches: ['validation-gbp-inflation-strict-pit-v1-*']
    paths:
      - 'validation/materialize_gbp_inflation_strict_pit_v1.py'
      - '.github/workflows/gbp-inflation-strict-pit-materialize-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize-twice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently materialize ONS first-release chain twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gbp-inflation-strict/{a,b}
          python validation/materialize_gbp_inflation_strict_pit_v1.py --csv /tmp/gbp-inflation-strict/a/GBP_INFLATION_STRICT_FIRST_RELEASE_2018_2026_08.csv --evidence /tmp/gbp-inflation-strict/a/evidence.json
          python validation/materialize_gbp_inflation_strict_pit_v1.py --csv /tmp/gbp-inflation-strict/b/GBP_INFLATION_STRICT_FIRST_RELEASE_2018_2026_08.csv --evidence /tmp/gbp-inflation-strict/b/evidence.json
      - name: Enforce semantic equivalence and strict direct PIT invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path('/tmp/gbp-inflation-strict')
          a=json.loads((root/'a/evidence.json').read_text()); b=json.loads((root/'b/evidence.json').read_text())
          assert a['status']==b['status']=='PASS'
          assert a['semantic_rowset_sha256']==b['semantic_rowset_sha256']
          assert a['coverage']==b['coverage']=={'start':'2018-01','end':'2026-08','expected_months':104,'materialized_months':104}
          rows=list(csv.DictReader((root/'a/GBP_INFLATION_STRICT_FIRST_RELEASE_2018_2026_08.csv').open()))
          assert len(rows)==104 and rows[0]['reference_month']=='2018-01' and rows[-1]['reference_month']=='2026-08'
          assert all(r['pit_status']=='STRICT_FIRST_RELEASE' and r['release_date'] and r['source_url'] and r['page_sha256'] for r in rows)
          assert len({r['page_sha256'] for r in rows})==104
          by={r['reference_month']:r for r in rows}
          anchors={'2018-01':('3.0','2018-02-13'),'2020-01':('1.8','2020-02-19'),'2026-08':('3.1','2026-09-16')}
          for month,expected in anchors.items():
              r=by[month]; assert (r['headline_cpi_yoy_pct'],r['release_date'])==expected,(month,r)
          print(json.dumps({'status':'PASS','semantic_rowset_sha256':a['semantic_rowset_sha256'],'anchors':anchors},indent=2))
          PY
      - name: Enforce no repository writes
        run: git diff --exit-code
      - name: Upload source evidence and reproducible datasets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbp-inflation-strict-pit-v1-${{ github.run_id }}
          path: /tmp/gbp-inflation-strict/
          if-no-files-found: error
          retention-days: 90
