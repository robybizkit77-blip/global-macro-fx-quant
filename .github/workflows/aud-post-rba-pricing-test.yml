name: AUD post-RBA pricing browser test
on:
  push:
    branches: [test-aud-post-rba-pricing-2026-09-30]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/s.log 2>&1 &
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=15000 --dump-dom http://127.0.0.1:8000/ > rendered.html 2>/tmp/c.log
          ! grep -q "Errore caricamento dashboard" rendered.html
          ! grep -q "Caricamento GLOBAL MACRO FX QUANT" rendered.html
          grep -q 'data-aud-post-rba-pricing="PASS"' rendered.html
          grep -q "COMPLETO_DIRECT_ASX_POST_DECISION" rendered.html
          grep -q "42" rendered.html
          test "$(wc -c < rendered.html)" -gt 500000
          echo "PASS: AUD post-RBA pricing rendered"
          echo "Rendered bytes: $(wc -c < rendered.html)"
          grep -q "GMFQ_RUNTIME_VALIDATION_MANIFEST" rendered.html
