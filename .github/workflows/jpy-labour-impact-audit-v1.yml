name: JPY Labour Impact Audit V1

on:
  push:
    branches: ['audit-jpy-labour-impact-v1-2026-10-12']
    paths: ['.github/workflows/jpy-labour-impact-audit-v1.yml']

permissions:
  contents: read

env:
  BASE_SHA: '782aaaae13660389835491d593a22ff5c66f0997'

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Prepare baseline and servers
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/gmfq-jpy-base "$BASE_SHA"
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/jpy-candidate.log 2>&1 &
          (cd /tmp/gmfq-jpy-base && python3 -m http.server 8001 --bind 127.0.0.1 >/tmp/jpy-base.log 2>&1 &)
          sleep 2
      - name: Compare JPY state, JPY pairs, and Focus Board
        shell: bash
        run: |
          cat > jpy-impact-audit.js <<'EOF'
          const {chromium}=require('playwright');
          const JPY_PAIRS=['AUD/JPY','CAD/JPY','CHF/JPY','EUR/JPY','GBP/JPY','NZD/JPY','USD/JPY'];
          const ALL=['AUD/CAD','AUD/CHF','AUD/JPY','AUD/NZD','AUD/USD','CAD/CHF','CAD/JPY','CHF/JPY','EUR/AUD','EUR/CAD','EUR/CHF','EUR/GBP','EUR/JPY','EUR/NZD','EUR/USD','GBP/AUD','GBP/CAD','GBP/CHF','GBP/JPY','GBP/NZD','GBP/USD','NZD/CAD','NZD/CHF','NZD/JPY','NZD/USD','USD/CAD','USD/CHF','USD/JPY'];
          const slim=f=>({fav:f?.fav??null,quality:f?.quality??null,setup:f?.setup??null,macro:f?.structural?.macro??null,policy:f?.structural?.policy??null,ratesGap:f?.structural?.ratesGap??null,priceReading:f?.priceReading??null});
          async function snap(browser,url){
            const p=await browser.newPage({viewport:{width:1440,height:1100}}); const ce=[],pe=[];
            p.on('console',m=>{if(m.type()==='error')ce.push(m.text())}); p.on('pageerror',e=>pe.push(String(e)));
            const r=await p.goto(url,{waitUntil:'domcontentloaded',timeout:120000}); if(!r?.ok())throw new Error('HTTP '+url);
            await p.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.status==='PASS'&&typeof window.derivePairDecisionFrame==='function'&&typeof window.deriveCurrencyState==='function',null,{timeout:120000});
            await p.waitForFunction(()=>window.__GMFQ_PAIR_FOCUS_BOARD_STATE?.pair_count===28,null,{timeout:120000});
            const out=await p.evaluate(async ({JPY_PAIRS,ALL})=>{const h=await fetch('/live_data/sections/MACRO_THERMOMETER_DATA.json',{cache:'no-store'}).then(r=>r.json());return {lab:h.currencies.JPY.labour,state:deriveCurrencyState('JPY'),pairs:Object.fromEntries(JPY_PAIRS.map(x=>[x,derivePairDecisionFrame(x)])),all:Object.fromEntries(ALL.map(x=>[x,derivePairDecisionFrame(x)])),board:window.__GMFQ_PAIR_FOCUS_BOARD_STATE};},{JPY_PAIRS,ALL});
            await p.close(); if(ce.length||pe.length)throw new Error(JSON.stringify({ce,pe})); return out;
          }
          (async()=>{const b=await chromium.launch({headless:true}); const a=await snap(b,'http://127.0.0.1:8001/'),c=await snap(b,'http://127.0.0.1:8000/'); await b.close();
            if(a.lab.latest_value!==2.5||c.lab.latest_value!==2.6)throw new Error('JPY labour values '+JSON.stringify({a:a.lab,c:c.lab}));
            const jdiff={},alldiff={},bsig={}; for(const p of JPY_PAIRS){const x=slim(a.pairs[p]),y=slim(c.pairs[p]);if(JSON.stringify(x)!==JSON.stringify(y))jdiff[p]={before:x,after:y};} for(const p of ALL){const x=slim(a.all[p]),y=slim(c.all[p]);if(JSON.stringify(x)!==JSON.stringify(y))alldiff[p]={before:x,after:y};const u=a.board.signatures?.[p],v=c.board.signatures?.[p];if(JSON.stringify(u)!==JSON.stringify(v))bsig[p]={before:u,after:v};}
            const out={status:'PASS_JPY_LABOUR_IMPACT_AUDIT',data:{before:{as_of:a.lab.as_of,value:a.lab.latest_value,percentile:a.lab.percentile,label:a.lab.temperature_label},after:{as_of:c.lab.as_of,value:c.lab.latest_value,percentile:c.lab.percentile,label:c.lab.temperature_label}},jpy_state:{before:a.state,after:c.state,changed:JSON.stringify(a.state)!==JSON.stringify(c.state)},jpy_pair_diff_count:Object.keys(jdiff).length,jpy_pair_diffs:jdiff,all_pair_diff_count:Object.keys(alldiff).length,all_pair_diffs:alldiff,focus_board:{before:a.board.counts,after:c.board.counts,signature_diff_count:Object.keys(bsig).length,signature_diffs:bsig},research_weight:c.board.research_decision_weight,pair_count:c.board.pair_count}; console.log(JSON.stringify(out,null,2)); require('fs').writeFileSync('/tmp/jpy-impact.json',JSON.stringify(out,null,2));})().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node jpy-impact-audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jpy-labour-impact-${{ github.run_id }}
          path: /tmp/jpy-impact.json
          if-no-files-found: warn
          retention-days: 60
