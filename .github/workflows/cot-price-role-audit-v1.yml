name: COT Price Role Audit V1

on:
  push:
    branches:
      - 'validation-cot-price-role-audit-v1-2026-10-12'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8139 --bind 127.0.0.1 >/tmp/gmfq-cot-price-audit-server.log 2>&1 &
          sleep 2
      - name: Locate pair price narrative source
        run: |
          cat > audit.js <<'EOF'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.stack||e)));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            const r=await page.goto('http://127.0.0.1:8139/index.html',{waitUntil:'domcontentloaded',timeout:120000});
            if(!r||!r.ok())throw new Error('HTTP load failed');
            await page.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.settled_after_cad_chain===true||window.__GMFQ_BOOTSTRAP_ERROR,null,{timeout:120000});
            const out=await page.evaluate(()=>{
              const needles=['MERCATO GIÀ ALLINEATO','PREZZO NON RISOLUTIVO','DIVERGENZA DA MONITORARE'];
              const hits=[];
              [...document.scripts].forEach((s,i)=>{
                const text=s.textContent||'';
                for(const needle of needles){
                  const idx=text.indexOf(needle);
                  if(idx>=0){
                    hits.push({scriptIndex:i,src:s.src||'INLINE',needle,context:text.slice(Math.max(0,idx-4500),Math.min(text.length,idx+4500))});
                  }
                }
              });
              return {
                hits,
                eurusd:window.derivePairDecisionFrame?.('EUR/USD'),
                bootstrapError:window.__GMFQ_BOOTSTRAP_ERROR||null
              };
            });
            await browser.close();
            if(out.bootstrapError)throw new Error(out.bootstrapError);
            if(errors.length)throw new Error('Browser errors: '+errors.join(' | '));
            fs.writeFileSync('cot-price-role-audit.json',JSON.stringify({schema:'GMFQ_PAIR_PRICE_SOURCE_LOCATOR_V1',...out},null,2));
            console.log(JSON.stringify({hitCount:out.hits.length,hits:out.hits,eurusd:out.eurusd},null,2));
            if(!out.hits.length)process.exit(2);
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cot-price-role-audit-v1
          path: |
            cot-price-role-audit.json
            /tmp/gmfq-cot-price-audit-server.log
