name: COT Price Role Audit V1

on:
  push:
    branches:
      - 'validation-cot-price-role-audit-v1-2026-10-12'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8139 --bind 127.0.0.1 >/tmp/gmfq-cot-price-audit-server.log 2>&1 &
          sleep 2
      - name: Trace canonical pair frame price helper
        run: |
          cat > audit.js <<'EOF'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.stack||e)));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            const r=await page.goto('http://127.0.0.1:8139/index.html',{waitUntil:'domcontentloaded',timeout:120000});
            if(!r||!r.ok())throw new Error('HTTP load failed');
            await page.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.settled_after_cad_chain===true||window.__GMFQ_BOOTSTRAP_ERROR,null,{timeout:120000});
            const out=await page.evaluate(()=>{
              const src={};
              const add=(name,fn)=>{try{if(typeof fn==='function')src[name]=Function.prototype.toString.call(fn)}catch(e){}};
              try{add('canonicalPairDecisionFrame',canonicalPairDecisionFrame)}catch(e){}
              try{add('pairPriceConfirmation',pairPriceConfirmation)}catch(e){}
              try{add('pairPriceSide',pairPriceSide)}catch(e){}
              try{add('pairPriceReading',pairPriceReading)}catch(e){}
              try{add('relativePriceSide',relativePriceSide)}catch(e){}
              try{add('certifiedPairForMarket',certifiedPairForMarket)}catch(e){}
              const canonical=src.canonicalPairDecisionFrame||'';
              const identifiers=[...new Set((canonical.match(/\b[A-Za-z_$][A-Za-z0-9_$]*\s*\(/g)||[]).map(x=>x.replace(/\s*\($/,'')))].sort();
              const helpers={};
              for(const name of identifiers){
                try{
                  const fn=eval(name);
                  if(typeof fn==='function') helpers[name]=Function.prototype.toString.call(fn);
                }catch(e){}
              }
              return {
                canonical,
                identifiers,
                helpers,
                eurusd:window.derivePairDecisionFrame?.('EUR/USD'),
                certified:window.certifiedPairForMarket?.('EUR/USD'),
                bootstrapError:window.__GMFQ_BOOTSTRAP_ERROR||null
              };
            });
            await browser.close();
            if(out.bootstrapError)throw new Error(out.bootstrapError);
            if(errors.length)throw new Error('Browser errors: '+errors.join(' | '));
            fs.writeFileSync('cot-price-role-audit.json',JSON.stringify({schema:'GMFQ_PAIR_PRICE_SOURCE_TRACE_V1',...out},null,2));
            console.log(JSON.stringify({canonical:out.canonical,identifiers:out.identifiers,helpers:out.helpers,eurusd:out.eurusd,certified:out.certified},null,2));
            if(!out.canonical)process.exit(2);
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cot-price-role-audit-v1
          path: |
            cot-price-role-audit.json
            /tmp/gmfq-cot-price-audit-server.log
