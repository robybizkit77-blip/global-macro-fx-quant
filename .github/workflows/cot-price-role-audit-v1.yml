name: COT Price Role Audit V1

on:
  push:
    branches:
      - 'validation-cot-price-role-audit-v1-2026-10-12'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8139 --bind 127.0.0.1 >/tmp/gmfq-cot-price-audit-server.log 2>&1 &
          sleep 2
      - name: Trace pair price source and certify structural roles
        run: |
          cat > audit.js <<'EOF'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.stack||e)));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            const r=await page.goto('http://127.0.0.1:8139/index.html',{waitUntil:'domcontentloaded',timeout:120000});
            if(!r||!r.ok())throw new Error('HTTP load failed');
            await page.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.settled_after_cad_chain===true||window.__GMFQ_BOOTSTRAP_ERROR,null,{timeout:120000});
            await page.waitForTimeout(400);
            const out=await page.evaluate(()=>{
              const clone=x=>{try{return JSON.parse(JSON.stringify(x))}catch{return null}};
              const stable=x=>JSON.stringify(x);
              const pairs=(D?.pairs||[]).map(x=>x.pair);
              const frames=()=>Object.fromEntries(pairs.map(p=>[p,clone(window.derivePairDecisionFrame?.(p))]));
              const structuralSignature=fs=>Object.fromEntries(Object.entries(fs).map(([p,f])=>[p,{fav:f?.fav,quality:f?.quality,structural:f?.structural,macroSide:f?.macroSide,policySide:f?.policySide}]));
              const baseline=frames();
              const baselineStructural=structuralSignature(baseline);
              const structuralKeys=[...new Set(Object.values(baseline).flatMap(f=>Object.keys(f?.structural||{})))].sort();

              const eurCotBefore=clone(D?.cot?.EUR);
              const eurStateBefore=clone(window.deriveCurrencyState?.('EUR'));
              let cotRiskChanged=false,cotStructuralUnchanged=false;
              if(D?.cot?.EUR&&typeof D.cot.EUR==='object'){
                Object.assign(D.cot.EUR,{pct:99.9,net_oi:55,netoi:55});
                cotRiskChanged=window.deriveCurrencyState?.('EUR')?.cotRisk!==eurStateBefore?.cotRisk;
                cotStructuralUnchanged=stable(structuralSignature(frames()))===stable(baselineStructural);
                Object.keys(D.cot.EUR).forEach(k=>delete D.cot.EUR[k]);
                Object.assign(D.cot.EUR,eurCotBefore);
              }

              const pairRow=clone((D?.pairs||[]).find(x=>x.pair==='EUR/USD'));
              const dKeys=Object.keys(D||{}).sort();
              const dPriceLike={};
              for(const k of dKeys.filter(k=>/price|market|pair|spot|fx/i.test(k))){ dPriceLike[k]=clone(D[k]); }
              const globals={};
              for(const k of Object.keys(window).filter(k=>/price|market|pair|spot|fx/i.test(k)).sort()){
                const v=window[k];
                if(typeof v==='function') globals[k]={type:'function',source:String(v).slice(0,800)};
                else if(v&&typeof v==='object'){
                  const c=clone(v);
                  if(c!==null) globals[k]={type:Array.isArray(v)?'array':'object',preview:c};
                }
              }
              const eurIntel=clone(currencyIntelData?.EUR);
              return {
                pairCount:pairs.length,structuralKeys,cotRiskChanged,cotStructuralUnchanged,
                eurusdFrame:clone(baseline['EUR/USD']),pairRow,dKeys,dPriceLike,globals,eurIntel,
                frameFields:[...new Set(Object.values(baseline).flatMap(f=>Object.keys(f||{})))].sort(),
                restored:stable(structuralSignature(frames()))===stable(baselineStructural),
                bootstrapError:window.__GMFQ_BOOTSTRAP_ERROR||null
              };
            });
            await browser.close();
            if(out.bootstrapError)throw new Error(out.bootstrapError);
            if(errors.length)throw new Error('Browser errors: '+errors.join(' | '));
            const assertions={
              all28Pairs:out.pairCount===28,
              structuralKeysOnlyMacroPolicyRatesGap:JSON.stringify(out.structuralKeys)===JSON.stringify(['macro','policy','ratesGap']),
              cotRiskActuallyChanged:out.cotRiskChanged===true,
              cotCannotChangePairStructure:out.cotStructuralUnchanged===true,
              runtimeRestored:out.restored===true
            };
            const ok=Object.values(assertions).every(Boolean);
            const summary={schema:'GMFQ_COT_PRICE_ROLE_AUDIT_V4_DISCOVERY',status:ok?'PASS_STRUCTURAL_ROLE_TRACE_PRICE':'FAIL',assertions,...out};
            fs.writeFileSync('cot-price-role-audit.json',JSON.stringify(summary,null,2));
            console.log(JSON.stringify({status:summary.status,assertions,structuralKeys:out.structuralKeys,eurusdFrame:out.eurusdFrame,pairRow:out.pairRow,dPriceLike:out.dPriceLike,globalNames:Object.keys(out.globals),eurIntel:out.eurIntel},null,2));
            if(!ok)process.exit(2);
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cot-price-role-audit-v1
          path: |
            cot-price-role-audit.json
            /tmp/gmfq-cot-price-audit-server.log
