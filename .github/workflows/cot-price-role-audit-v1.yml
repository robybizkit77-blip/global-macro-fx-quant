name: COT Price Role Audit V1

on:
  push:
    branches:
      - 'validation-cot-price-role-audit-v1-2026-10-12'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8139 --bind 127.0.0.1 >/tmp/gmfq-cot-price-audit-server.log 2>&1 &
          sleep 2
      - name: Resolve certified pair price state sensitivity
        run: |
          cat > audit.js <<'EOF'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.stack||e)));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            const r=await page.goto('http://127.0.0.1:8139/index.html',{waitUntil:'domcontentloaded',timeout:120000});
            if(!r||!r.ok())throw new Error('HTTP load failed');
            await page.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.settled_after_cad_chain===true||window.__GMFQ_BOOTSTRAP_ERROR,null,{timeout:120000});
            const out=await page.evaluate(()=>{
              const clone=x=>{try{return JSON.parse(JSON.stringify(x))}catch{return null}};
              const stable=x=>JSON.stringify(x);
              const frame=()=>clone(window.derivePairDecisionFrame?.('EUR/USD'));
              const structural=f=>({fav:f?.fav,quality:f?.quality,structural:f?.structural,macroSide:f?.macroSide,policySide:f?.policySide});
              const cert=window.certifiedPairForMarket?.('EUR/USD');
              const baseline=frame();
              const baselineCert=clone(cert);
              const tests=[];
              const run=(name,apply,restore)=>{
                try{
                  apply();
                  const f=frame();
                  tests.push({name,frame:f,priceChanged:f?.priceReading!==baseline?.priceReading||f?.priceNote!==baseline?.priceNote||f?.watch!==baseline?.watch,structureUnchanged:stable(structural(f))===stable(structural(baseline))});
                }finally{restore();}
              };
              if(cert){
                const ps=cert.price_state;
                run('price_state_DIVERGE',()=>{cert.price_state='DIVERGE'},()=>{cert.price_state=ps});
                run('price_state_DIVERGENT',()=>{cert.price_state='DIVERGENT'},()=>{cert.price_state=ps});
                run('price_state_NOT_CONFIRM',()=>{cert.price_state='NOT_CONFIRM'},()=>{cert.price_state=ps});
                const pc=cert?.dominant_driver_current?.price_confirmation;
                if(cert.dominant_driver_current) run('dominant_price_DIVERGED',()=>{cert.dominant_driver_current.price_confirmation='PRICE_DIVERGED'},()=>{cert.dominant_driver_current.price_confirmation=pc});
                const conf=clone(cert.confirms), div=clone(cert.diverges);
                run('confirm_diverge_arrays',()=>{cert.confirms=(conf||[]).filter(x=>x!=='price');cert.diverges=[...(div||[]).filter(x=>x!=='price'),'price']},()=>{cert.confirms=conf;cert.diverges=div});
                const lp=cert?.layer_directions?.price;
                if(cert.layer_directions) run('layer_direction_flip',()=>{cert.layer_directions.price=lp==='A'?'B':'A'},()=>{cert.layer_directions.price=lp});
              }
              const mapping=(D?.pairs||[]).map(x=>x.pair).map(p=>{const c=window.certifiedPairForMarket?.(p),f=window.derivePairDecisionFrame?.(p);return {p,price_state:c?.price_state,price_dir:c?.layer_directions?.price,frame:f?.priceReading,fav:f?.fav}});
              return {baseline,baselineCert,tests,mapping,restored:stable(frame())===stable(baseline),bootstrapError:window.__GMFQ_BOOTSTRAP_ERROR||null};
            });
            await browser.close();
            if(out.bootstrapError)throw new Error(out.bootstrapError);
            if(errors.length)throw new Error('Browser errors: '+errors.join(' | '));
            const responsive=out.tests.filter(t=>t.priceChanged);
            const safe=responsive.length>0&&responsive.every(t=>t.structureUnchanged)&&out.restored;
            const summary={schema:'GMFQ_PAIR_PRICE_STATE_SENSITIVITY_V1',status:safe?'PASS':'REVIEW_REQUIRED',responsive_tests:responsive.map(x=>x.name),...out};
            fs.writeFileSync('cot-price-role-audit.json',JSON.stringify(summary,null,2));
            console.log(JSON.stringify(summary,null,2));
            if(!safe)process.exit(2);
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cot-price-role-audit-v1
          path: |
            cot-price-role-audit.json
            /tmp/gmfq-cot-price-audit-server.log
