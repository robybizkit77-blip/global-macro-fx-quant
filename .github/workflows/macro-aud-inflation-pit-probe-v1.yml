name: Macro AUD Inflation PIT Probe V1

on:
  push:
    branches:
      - 'validation-macro-aud-inflation-pit-bootstrap-*'
    paths:
      - '.github/workflows/macro-aud-inflation-pit-probe-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read canonical tail and ABS live candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aud-cpi-probe
          python3 validation/sources/aud_abs_core.py \
            --dimension inflation \
            --output /tmp/aud-cpi-probe/candidate.json \
            --audit-output /tmp/aud-cpi-probe/audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          series=json.loads(Path('live_data/sections/MACRO_SERIES.json').read_text())
          heat=json.loads(Path('live_data/sections/MACRO_THERMOMETER_DATA.json').read_text())
          candidate=json.loads(Path('/tmp/aud-cpi-probe/candidate.json').read_text())
          target=next(r for r in series['AUD'] if r.get('id')=='AU_CPI_HEADLINE_Q_YOY_history_value')
          h=heat['currencies']['AUD']['inflation']
          obs=h.get('observations') or h.get('history') or []
          print(json.dumps({
            'status':'AUD_INFLATION_PIT_PROBE',
            'candidate':candidate,
            'canonical_series':{
              'dates_tail':target.get('dates',[])[-5:],
              'values_tail':target.get('values',[])[-5:],
              'last_date':target.get('last_date'),
              'last_value':target.get('last_value'),
              'frequency':target.get('frequency'),
              'unit':target.get('unit'),
              'source_file':target.get('source_file')
            },
            'heatmap':{
              'series_id':h.get('series_id'),
              'frequency':h.get('frequency'),
              'transformation':h.get('transformation'),
              'source':h.get('source'),
              'observations_tail':obs[-5:] if isinstance(obs,list) else obs
            }
          }, indent=2))
          PY
