name: Macro Single-Series Overlay Apply Gate V2

on:
  push:
    branches:
      - validation-gbp-labour-freshness-v1-2026-10-12
    paths:
      - '.github/workflows/macro-single-series-overlay-apply-gate-v2.yml'
      - 'validation/candidates/gbp_labour_2026_07_strict_pit.json'
      - 'validation/build_macro_candidate.py'
      - 'validation/build_live_manifest_v2.py'
      - 'validation/check_live_update_contract.py'
      - 'validation/rebuild_live_data_runtime.py'

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate-overlay-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build validated GBP labour candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/macro-overlay-apply/built
          python3 validation/build_macro_candidate.py \
            --candidate validation/candidates/gbp_labour_2026_07_strict_pit.json \
            --output-dir /tmp/macro-overlay-apply/built \
            | tee /tmp/macro-overlay-apply/builder.json
          git diff --exit-code -- live_data payload

      - name: Apply canonical Macro overlay files only
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/macro-overlay-apply/built/MACRO_SERIES.json live_data/sections/MACRO_SERIES.json
          cp /tmp/macro-overlay-apply/built/MACRO_THERMOMETER_DATA.json live_data/sections/MACRO_THERMOMETER_DATA.json
          python3 validation/build_live_manifest_v2.py --write live_data/manifest.v2.json \
            | tee /tmp/macro-overlay-apply/manifest.json

          test -z "$(git diff --name-only -- payload)"
          git diff --name-only > /tmp/macro-overlay-apply/changed-files.txt
          python3 - <<'PY'
          from pathlib import Path
          changed=set(Path('/tmp/macro-overlay-apply/changed-files.txt').read_text().splitlines())
          allowed={
            'live_data/sections/MACRO_SERIES.json',
            'live_data/sections/MACRO_THERMOMETER_DATA.json',
            'live_data/manifest.v2.json',
          }
          if changed != allowed:
              raise SystemExit(f'overlay apply scope violation: {sorted(changed)}')
          print('MACRO_OVERLAY_APPLY_SCOPE_PASS')
          PY

      - name: Verify live contract and frozen payload runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/check_live_update_contract.py \
            | tee /tmp/macro-overlay-apply/live-contract.json
          python3 validation/rebuild_live_data_runtime.py --verify-only \
            | tee /tmp/macro-overlay-apply/runtime-roundtrip.json

      - name: Verify GBP canonical observation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/macro-overlay-apply/gbp-verification.json
          import json
          from pathlib import Path
          s=json.loads(Path('live_data/sections/MACRO_SERIES.json').read_text())
          h=json.loads(Path('live_data/sections/MACRO_THERMOMETER_DATA.json').read_text())
          row=next(x for x in s['GBP'] if x['id']=='UK_UNEMP_RATE_history_value')
          labour=h['currencies']['GBP']['labour']
          detail=h['currencies']['GBP']['as_of_detail']['unemployment']
          assert row['last_date']=='2026-07', row
          assert abs(float(row['last_value'])-4.9)<1e-12, row
          assert labour['as_of']=='2026-07', labour
          assert detail=='2026-07', detail
          assert abs(float(labour['latest_value'])-4.9)<1e-12, labour
          out={
            'status':'PASS_GBP_LABOUR_2026_07_CANONICAL_OVERLAY',
            'last_date':row['last_date'],
            'last_value':row['last_value'],
            'heatmap_as_of':labour['as_of'],
            'percentile':labour['percentile'],
            'temperature_label':labour['temperature_label'],
            'direction':labour['direction'],
            'acceleration':labour['acceleration'],
            'payload_changed':False,
          }
          print(json.dumps(out,indent=2))
          PY

      - name: Upload validated candidate files and evidence
        uses: actions/upload-artifact@v4
        with:
          name: macro-overlay-apply-gate-v2-${{ github.run_id }}
          path: |
            /tmp/macro-overlay-apply/
            live_data/sections/MACRO_SERIES.json
            live_data/sections/MACRO_THERMOMETER_DATA.json
            live_data/manifest.v2.json
          if-no-files-found: error
          retention-days: 60
