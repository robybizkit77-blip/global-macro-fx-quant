name: Replay Original Walkforward With Frozen Price

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: npm init -y >/dev/null 2>&1 && npm install --save-dev playwright
      - name: Extract exact original V9.3 script and swap only Price input
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/historical-walkforward-v93.yml')
          text=p.read_text()
          start=text.index("cat > walkforward.js <<'EOF'") + len("cat > walkforward.js <<'EOF'")
          end=text.index('\n          EOF', start)
          js=text[start:end]
          js='\n'.join(line[10:] if line.startswith('          ') else line for line in js.splitlines())
          anchor="await page.waitForTimeout(2500);"
          inject="""await page.waitForTimeout(2500);\n            const frozenPrice=JSON.parse(fs.readFileSync('history/ECB_FX_G8_2018_2026_CANONICAL_V1.json','utf8'));\n            const legacyPriceDiff=await page.evaluate(rows=>{\n              const ccys=['USD','GBP','JPY','CHF','CAD','AUD','NZD'];\n              const fm=new Map(rows.map(r=>[String(r.Date),r]));\n              const legacy=(D?.prices||[]);\n              const lm=new Map(legacy.map(r=>[String(r.Date),r]));\n              const diffs=[]; let overlap=0, exactRows=0;\n              for(const old of legacy){\n                const fresh=fm.get(String(old.Date)); if(!fresh) continue; overlap++;\n                const cells=[];\n                for(const c of ccys){\n                  const a=Number(old[c]), b=Number(fresh[c]);\n                  if(Number.isFinite(a)&&Number.isFinite(b)&&Math.abs(a-b)>1e-12) cells.push({ccy:c,legacy:a,frozen:b,diff:a-b});\n                }\n                if(cells.length) diffs.push({date:String(old.Date),cells}); else exactRows++;\n              }\n              const missingInLegacy=rows.filter(r=>!lm.has(String(r.Date))).map(r=>r.Date);\n              const missingInFrozen=legacy.filter(r=>!fm.has(String(r.Date))).map(r=>r.Date);\n              window.__GMFQ_LEGACY_PRICE_ROWS=legacy;\n              return {legacy_rows:legacy.length,frozen_rows:rows.length,overlap,exact_rows:exactRows,diff_row_count:diffs.length,diffs,missing_in_legacy:missingInLegacy,missing_in_frozen_count:missingInFrozen.length,missing_in_frozen_first:missingInFrozen.slice(0,10),missing_in_frozen_last:missingInFrozen.slice(-10)};\n            },frozenPrice.rows);\n            console.log('LEGACY_PRICE_DIFF='+JSON.stringify(legacyPriceDiff));\n            await page.evaluate(rows=>{window.__GMFQ_FROZEN_PRICE_ROWS=rows},frozenPrice.rows);"""
          if anchor not in js: raise SystemExit('page anchor not found')
          js=js.replace(anchor,inject,1)
          old="const prices=(D?.prices||[]).map(r=>({t:parseDate(r.Date),r})).filter(x=>x.t!=null).sort((a,b)=>a.t-b.t);"
          new="const legacyPrices=(window.__GMFQ_LEGACY_PRICE_ROWS||[]).map(r=>({t:parseDate(r.Date),r})).filter(x=>x.t!=null).sort((a,b)=>a.t-b.t);\n              const prices=(window.__GMFQ_FROZEN_PRICE_ROWS||[]).map(r=>({t:parseDate(r.Date),r})).filter(x=>x.t!=null).sort((a,b)=>a.t-b.t);"
          if old not in js: raise SystemExit('price source line not found')
          js=js.replace(old,new,1)
          marker="function stats(filter){"
          diag="""function pxAtFrom(arr,pair,t){\n                const row=arr.find(x=>x.t>=t); if(!row)return null;\n                const [a,b]=pair.split('/');\n                const qa=a==='EUR'?1:Number(row.r[a]), qb=b==='EUR'?1:Number(row.r[b]);\n                if(!Number.isFinite(qa)||!Number.isFinite(qb)||qa===0)return null;\n                return {t:row.t,p:qb/qa};\n              }\n              const correctionT=Date.UTC(2026,8,1), correctionH=28, correctionTarget=correctionT+correctionH*MS;\n              const correctionDiag=[];\n              for(const pair of pairs){\n                const s=pairClass(pair,correctionT);\n                if(s.quality!=='VANTAGGIO RELATIVO PARZIALE'||!s.fav)continue;\n                const f0=pxAtFrom(prices,pair,correctionT), f1=pxAtFrom(prices,pair,correctionTarget);\n                const l0=pxAtFrom(legacyPrices,pair,correctionT), l1=pxAtFrom(legacyPrices,pair,correctionTarget);\n                if(!f0||!f1||!l0||!l1)continue;\n                const [a,b]=pair.split('/');\n                const sign=s.fav===a?1:-1;\n                const frozenRet=(f1.p/f0.p-1)*100*sign;\n                const legacyRet=(l1.p/l0.p-1)*100*sign;\n                correctionDiag.push({pair,fav:s.fav,legacy_exit:iso(l1.t),frozen_exit:iso(f1.t),legacy_ret:legacyRet,frozen_ret:frozenRet,hit_flip:(legacyRet>0)!==(frozenRet>0)});\n              }\n              """
          if marker not in js: raise SystemExit('stats marker not found')
          js=js.replace(marker,diag+marker,1)
          retmarker="quality_counts_4w:qualityCounts,"
          if retmarker not in js: raise SystemExit('return marker not found')
          js=js.replace(retmarker,"price_correction_2026_09_29:correctionDiag,\n                "+retmarker,1)
          Path('/tmp/walkforward-frozen.js').write_text(js)
          print('EXTRACTED_BYTES',len(js))
          print('PRICE_SWAP_OK',new in js)
          PY
      - name: Run exact original logic against frozen ECB Price
        shell: bash
        run: |
          NODE_PATH="$PWD/node_modules" node /tmp/walkforward-frozen.js | tee /tmp/walkforward-frozen.log
      - name: Assert structural and strong-series parity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('/tmp/walkforward-frozen.log').read_text()
          expected=[
            '"CONTRASTO STRUTTURALE FORTE": 316',
            '"VANTAGGIO RELATIVO PARZIALE": 961',
            '"PILASTRI DIVISI": 340',
            '"NESSUN CONTRASTO": 397',
            '"WITHHELD": 926',
            '"hit": 0.47151898734177217',
            '"mean": -0.052889186538895',
            '"median": -0.05247623147417446',
            '"hit": 0.48417721518987344',
            '"mean": -0.10259913446550911',
            '"median": -0.12587913944271945',
            '"hit": 0.5463258785942492',
            '"mean": 0.18855289675144257',
            '"median": 0.4649024727875428',
            '"missing_in_legacy":["2026-09-29"]'
          ]
          missing=[x for x in expected if x not in t]
          if missing:
            print('MISSING_REQUIRED_MARKERS',missing)
            raise SystemExit(1)
          print('STRUCTURAL_AND_STRONG_PARITY=PASS')
          PY
      - name: Restore benchmark output written by original script
        run: git checkout -- validation/HISTORICAL_WALKFORWARD_V93_2026-10-01.json
      - name: Confirm repository untouched
        run: git diff --exit-code
      - name: Upload replay log
        uses: actions/upload-artifact@v4
        with:
          name: original-v93-frozen-price-replay
          if-no-files-found: error
          retention-days: 14
          path: /tmp/walkforward-frozen.log
