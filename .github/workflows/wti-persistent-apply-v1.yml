name: WTI Persistent Apply V1

on:
  push:
    branches:
      - validation-wti-direct-eia-controlled-apply-v1-2026-10-14
    paths:
      - '.github/workflows/wti-persistent-apply-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persist-wti-current:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Fetch direct official EIA WTI candidate
        shell: bash
        run: |
          set -euo pipefail
          python validation/fetch_eia_wti_candidate_v1.py --out /tmp/wti-candidate.json | tee /tmp/wti-source-receipt.json

      - name: Build and validate WTI-only full replacement
        shell: bash
        run: |
          set -euo pipefail
          cp live_data/sections/D.json /tmp/D.before.json
          python validation/apply_eia_wti_candidate_v1.py \
            --candidate /tmp/wti-candidate.json \
            --replacement-out /tmp/D.wti.replacement.json | tee /tmp/wti-apply-receipt.json
          python - <<'PY'
          import json
          before=json.load(open('/tmp/D.before.json'))
          after=json.load(open('/tmp/D.wti.replacement.json'))
          br=dict(before['risk']); ar=dict(after['risk'])
          old=br.pop('WTI'); new=ar.pop('WTI')
          assert br==ar, 'non-WTI risk data changed'
          b2=dict(before); a2=dict(after); b2['risk']=br; a2['risk']=ar
          assert b2==a2, 'data outside D.risk.WTI changed'
          assert len(old.get('dates',[]))==3, old
          assert len(new['dates'])>6000
          assert new['source']=='U.S. Energy Information Administration'
          assert new['series_id']=='RWTC'
          assert new['fred_mirror_series_id']=='DCOILWTICO'
          print('WTI_PERSISTENT_APPLY_SEMANTIC_SCOPE_PASS', len(old['dates']), '->', len(new['dates']), new['last_date'])
          PY

      - name: Apply direct section and rebuild canonical manifest
        shell: bash
        run: |
          set -euo pipefail
          python validation/update_live_direct_section.py \
            --section D --replacement /tmp/D.wti.replacement.json --apply
          python validation/build_live_manifest_v2.py --write live_data/manifest.v2.json > /tmp/manifest-rebuild.json
          python validation/check_live_update_contract.py > /tmp/live-update-contract.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/live-update-contract.json'))
          assert r['status']=='PASS', r
          print('WTI_PERSISTENT_APPLY_LIVE_CONTRACT_PASS')
          PY

      - name: Enforce exact tracked data diff scope
        run: |
          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' \
            'live_data/manifest.v2.json' \
            'live_data/sections/D.json' \
            'payload/part-00.txt' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Prove idempotence before commit
        shell: bash
        run: |
          set -euo pipefail
          python validation/apply_eia_wti_candidate_v1.py \
            --candidate /tmp/wti-candidate.json \
            --replacement-out /tmp/D.wti.second.json > /tmp/wti-idempotence.json
          cmp -s live_data/sections/D.json /tmp/D.wti.second.json
          echo WTI_PERSISTENT_APPLY_IDEMPOTENT_PASS

      - name: Commit with remote-head lease
        env:
          TARGET_BRANCH: validation-wti-direct-eia-controlled-apply-v1-2026-10-14
        run: |
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$REMOTE_SHA" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live_data/sections/D.json payload/part-00.txt live_data/manifest.v2.json
          git diff --cached --quiet && { echo 'No persistent WTI changes to commit'; exit 1; }
          git commit -m 'Replace WTI placeholder with official EIA history'
          REMOTE_SHA_2="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$REMOTE_SHA_2" = "$GITHUB_SHA"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: No publication side effect
        run: echo WTI_PERSISTENT_APPLY_COMMIT_ONLY_NO_PUBLICATION
