name: Macro USD Labour PIT Probe V1

on:
  push:
    branches:
      - 'validation-macro-usd-labour-pit-bootstrap-*'
    paths:
      - '.github/workflows/macro-usd-labour-pit-probe-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare official BLS unemployment with canonical runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/usd-labour-probe
          python3 validation/sources/us_bls_core_macro.py \
            --output-dir /tmp/usd-labour-probe \
            --start-year 2025 --end-year 2026
          python3 - <<'PY'
          import json
          from pathlib import Path
          series=json.loads(Path('live_data/sections/MACRO_SERIES.json').read_text())
          heat=json.loads(Path('live_data/sections/MACRO_THERMOMETER_DATA.json').read_text())
          candidate=json.loads(Path('/tmp/usd-labour-probe/labour-candidate.json').read_text())
          audit=json.loads(Path('/tmp/usd-labour-probe/source-audit.json').read_text())
          target=next(r for r in series['USD'] if r.get('id')=='US_UNRATE_history_value')
          h=heat['currencies']['USD']['labour']
          obs=h.get('observations') or h.get('history') or []
          print(json.dumps({
            'status':'USD_LABOUR_PIT_PROBE',
            'candidate':candidate,
            'official_pair':audit['labour'],
            'canonical_series':{
              'dates_tail':target.get('dates',[])[-5:],
              'values_tail':target.get('values',[])[-5:],
              'last_date':target.get('last_date'),
              'last_value':target.get('last_value'),
              'frequency':target.get('frequency'),
              'unit':target.get('unit'),
              'source_file':target.get('source_file')
            },
            'heatmap':{
              'series_id':h.get('series_id'),
              'frequency':h.get('frequency'),
              'transformation':h.get('transformation'),
              'source':h.get('source'),
              'observations_tail':obs[-5:] if isinstance(obs,list) else obs
            }
          }, indent=2))
          PY
