name: EURUSD Curve Regime Break Diagnostic V1

on:
  push:
    branches:
      - validation-eurusd-curve-regime-break-v1-2026-10-11
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  EUR_INFLATION_ARTIFACT_ID: '11674452706'
  EUR_INFLATION_ARTIFACT_DIGEST: 'sha256:ddab80f0b0cfe51a5e8b37dc482d77285353916cf499d7be3791273fdc677c6d'
  EUR_LABOUR_ARTIFACT_ID: '11678794954'
  EUR_LABOUR_ARTIFACT_DIGEST: 'sha256:933a0032ba3712050d7306908a3c64fd23a2c7731cd68f44cf4f4c6ea7b0e677'
  RATES_STORE_SHA: '0f4f45190fa5d5e010650026a30a0f981373ec34'

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download exact certified EUR Macro artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cr/inf /tmp/cr/lab
          python - <<'PY'
          import json, os, subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          for aid,digest in [
            (os.environ['EUR_INFLATION_ARTIFACT_ID'],os.environ['EUR_INFLATION_ARTIFACT_DIGEST']),
            (os.environ['EUR_LABOUR_ARTIFACT_ID'],os.environ['EUR_LABOUR_ARTIFACT_DIGEST'])]:
              m=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts/{aid}'],text=True))
              assert m['expired'] is False and m.get('digest') == digest
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EUR_INFLATION_ARTIFACT_ID}/zip" > /tmp/cr/inf.zip
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EUR_LABOUR_ARTIFACT_ID}/zip" > /tmp/cr/lab.zip
          unzip -q /tmp/cr/inf.zip -d /tmp/cr/inf
          unzip -q /tmp/cr/lab.zip -d /tmp/cr/lab
          python - <<'PY'
          import json
          for folder,expected in [
            ('inf','fd19fea3a286b327019b9727a79ade5e51550cfc073538139ac3f600d81c68b1'),
            ('lab','b8b9384ac5aefa293521137d5df9f713585d232c21999a59916f7058161113f9')]:
              a=json.load(open(f'/tmp/cr/{folder}/a/evidence.json')); b=json.load(open(f'/tmp/cr/{folder}/b/evidence.json'))
              assert a['status']=='PASS' and b['status']=='PASS'
              assert a['semantic_rowset_sha256']==b['semantic_rowset_sha256']==expected
          PY

      - name: Borrow exact frozen certified Rates histories
        run: |
          set -euo pipefail
          mkdir -p /tmp/cr/rates
          git fetch --depth=1 origin "$RATES_STORE_SHA"
          git checkout FETCH_HEAD -- validation/rates_pit_rowsets/eur_rates_2y_10y_temporal_pit_v1.csv validation/rates_pit_rowsets/usd_rates_2y_10y_temporal_pit_v1.csv
          cp validation/rates_pit_rowsets/eur_rates_2y_10y_temporal_pit_v1.csv /tmp/cr/rates/eur.csv
          cp validation/rates_pit_rowsets/usd_rates_2y_10y_temporal_pit_v1.csv /tmp/cr/rates/usd.csv
          python - <<'PY'
          import csv
          for p in ['/tmp/cr/rates/eur.csv','/tmp/cr/rates/usd.csv']:
              rows=list(csv.DictReader(open(p,newline='',encoding='utf-8-sig')))
              assert len(rows)>2000
              assert all(r['observation_date'] < r['first_eligible_decision_date'] for r in rows)
          PY
          git reset --hard "$GITHUB_SHA"
          git clean -fd

      - name: Download official ECB EURUSD history
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 --max-time 120 'https://data-api.ecb.europa.eu/service/data/EXR/D.USD.EUR.SP00.A?startPeriod=2018-03-01&endPeriod=2026-09-30&format=csvdata' -o /tmp/cr/ecb.csv
          test -s /tmp/cr/ecb.csv

      - name: Run fixed curve regime-break diagnostic
        run: |
          set -euo pipefail
          INF=/tmp/cr/inf/a/EUR_INFLATION_STRICT_FIRST_RELEASE_FLASH_2018_2026_09.csv
          LAB=/tmp/cr/lab/a/EUR_LABOUR_STRICT_FIRST_RELEASE_2018_2026_08.csv
          python validation/eurusd_curve_regime_break_diagnostic_v1.py --inflation "$INF" --labour "$LAB" --eur-rates /tmp/cr/rates/eur.csv --usd-rates /tmp/cr/rates/usd.csv --ecb /tmp/cr/ecb.csv --output /tmp/cr/result.json
          python validation/eurusd_curve_regime_break_diagnostic_v1.py --inflation "$INF" --labour "$LAB" --eur-rates /tmp/cr/rates/eur.csv --usd-rates /tmp/cr/rates/usd.csv --ecb /tmp/cr/ecb.csv --output /tmp/cr/result-b.json >/dev/null
          cmp /tmp/cr/result.json /tmp/cr/result-b.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/cr/result.json'))
          assert r['status']=='DIAGNOSTIC_COMPLETE'
          assert r['scope']['snapshot_count']==102
          assert r['scope']['oos_path_points']==65
          assert r['method']['rolling_correlation_window_fixed_months']==24
          assert r['method']['rolling_correlation_uses_training_only'] is True
          assert r['method']['hyperparameter_tuning'] is False
          assert r['method']['threshold_search'] is False
          assert r['method']['regime_switch_rule_fitted'] is False
          assert r['policy']['production_backtest_authorized'] is False
          assert r['policy']['production_signal_authorized'] is False
          assert r['diagnostic_readout']['date_based_curve_disable_rule_authorized'] is False
          assert r['diagnostic_readout']['observable_regime_gate_identified'] is False
          print(json.dumps({'blocks':r['fixed_block_summary'],'signal_flips':r['2025_to_2026_07_signal_flip_months'],'damage':r['2025_to_2026_07_damage_months']},indent=2,sort_keys=True))
          PY

      - name: Assert repository clean
        run: test -z "$(git status --porcelain)"

      - uses: actions/upload-artifact@v4
        with:
          name: eurusd-curve-regime-break-${{ github.run_id }}
          path: /tmp/cr/result.json
          retention-days: 90
