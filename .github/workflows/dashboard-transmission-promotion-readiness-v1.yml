name: Dashboard Transmission Promotion Readiness V1

on:
  push:
    branches:
      - research-transmission-conviction-layer-v1-2026-10-07
    paths:
      - 'validation/check_dashboard_transmission_promotion_readiness_v1.py'
      - 'validation/DASHBOARD_PAIR_RENDER_PAYLOAD_V1_2026-10-07.json'
      - 'validation/CENTRAL_BANK_REACTION_FUNCTION_EVIDENCE_MAP_V3_2026-10-07.json'
      - '.github/workflows/dashboard-transmission-promotion-readiness-v1.yml'

permissions:
  contents: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-transmission-conviction-layer-v1-2026-10-07
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate promotion readiness
        run: python validation/check_dashboard_transmission_promotion_readiness_v1.py
      - name: Guard no accidental promotion
        run: |
          python - <<'PY'
          import json
          p=json.load(open('validation/DASHBOARD_TRANSMISSION_PROMOTION_READINESS_V1_2026-10-07.json',encoding='utf-8'))
          assert p['status'] == 'NOT_READY_FOR_PRODUCTION'
          assert p['engine_changed'] is False
          assert p['live_data_changed'] is False
          assert p['oos_baseline_changed'] is False
          assert 'FORWARD_VALIDATION_NOT_YET_ACCUMULATED' in p['blockers']
          print('PASS: research layer remains non-promoted')
          PY
      - name: Commit readiness evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/DASHBOARD_TRANSMISSION_PROMOTION_READINESS_V1_2026-10-07.json
          git diff --cached --quiet && exit 0
          git commit -m "Record dashboard transmission promotion readiness V1"
          git push
