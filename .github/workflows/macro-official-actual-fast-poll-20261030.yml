name: Macro 30 October 2026 targeted official actual fast checks

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/macro-official-actual-fast-poll-20261030.yml'
      - 'validation/macro/one_date_oct30_official_actual_fast_poll_gate_v1.py'
      - 'validation/macro/capture_official_postrelease_actuals_v1.py'
      - 'validation/macro/publish_oct30_official_actual_retry_v1.py'
      - 'validation/macro/test_publish_oct30_official_actual_retry_v1.py'
      - 'validation/macro/test_one_date_oct30_official_actual_fast_poll_gate_v1.py'
      - 'validation/macro/MACRO_20261030_OFFICIAL_ACTUAL_FAST_CHECK_PLAN.md'
  workflow_dispatch:
  schedule:
    # Friday October 30 2026, event 12:30Z=13:30 CET.
    # 13:37, 13:57, 14:27, 15:07 CET planned; GitHub may start late.
    # Cron repeats annually; a hard-coded year guard suppresses later polls.
    - cron: '37,57 12 30 10 *'
    - cron: '27 13 30 10 *'
    - cron: '7 14 30 10 *'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('macro-actual-qa-{0}', github.ref) || 'calendar-news-operational-refresh-v1' }}
  cancel-in-progress: false

jobs:
  regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No-network UTC timing, official actual and market context tests
        run: |
          python -m unittest validation.macro.test_one_date_oct30_official_actual_fast_poll_gate_v1 -v
          python -m unittest validation.macro.test_publish_oct30_official_actual_retry_v1 -v
          python -m unittest validation.macro.test_capture_official_postrelease_actuals_v1 -v
          python -m unittest validation.macro.test_build_macro_event_market_context_v1 -v
      - name: Pre-release reference state only, no future issuer HTTP
        run: python -m validation.macro.one_date_oct30_official_actual_fast_poll_gate_v1

  live-source-recheck:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real UTC/2026/archived-forecast/actual-missing guard
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          python -m validation.macro.one_date_oct30_official_actual_fast_poll_gate_v1 \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"
      - name: Test official actual capture and market-source contracts
        if: steps.gate.outputs.should_poll == 'true'
        run: |
          python -m unittest validation.macro.test_one_date_oct30_official_actual_fast_poll_gate_v1 -v
          python -m unittest validation.macro.test_publish_oct30_official_actual_retry_v1 -v
          python -m unittest validation.macro.test_capture_official_postrelease_actuals_v1 -v
          python -m unittest validation.macro.test_build_macro_event_market_context_v1 -v
      - name: Recheck publisher actuals and safely persist with bounded main reconciliation
        if: steps.gate.outputs.should_poll == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m validation.macro.publish_oct30_official_actual_retry_v1 \
            --receipt /tmp/macro-oct30-safe-publish-receipt.json
          python - <<'PY'
          import json,os
          r=json.load(open('/tmp/macro-oct30-safe-publish-receipt.json'))
          assert r['schema']=='GMFQ_20261030_ACTUAL_SAFE_RECHECK_MAIN_CAS_RETRIES_V1'
          assert r['writes_Core_Beta_Forward'] is False
          assert r['status'] in {
              'OFFICIAL_ACTUAL_RECORDED_ON_MAIN',
              'NO_NEW_OFFICIAL_ACTUAL_SOURCE',
          }
          assert 1<=r['attempts']<=3
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('### Verified official actual publication attempt\n')
              f.write('- Status: **'+r['status']+'**\n')
              f.write('- Attempts: '+str(r['attempts'])+
                      ' (if main moved: re-check issuer and reconcile original ledger).\n')
              f.write('- New verified issuer observations in final attempt: '+
                      str(r['official_capture']['new_actuals'])+'.\n')
              f.write('- Source observation timestamp follows completed page fetch and parse; not publisher first disclosure.\n')
              f.write('- No artificial OIS/2Y/FX event causality or Core/Beta/Forward write.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.should_poll == 'true'
        with:
          name: macro-20261030-official-release-evidence-receipt
          path: |
            /tmp/macro-oct30-safe-publish-receipt.json
          retention-days: 14
          if-no-files-found: error
