name: CAD Inflation Strict PIT Materialize V1

on:
  push:
    branches:
      - 'validation-cad-inflation-strict-pit-v1-*'
    paths:
      - 'validation/materialize_cad_inflation_strict_pit_v1.py'
      - 'validation/macro/cad_inflation_strict_pit_evidence_v1_2026-10-09.json'
      - 'validation/macro/cad_inflation_strict_pit_receipt_v1_2026-10-09.json'
      - '.github/workflows/cad-inflation-strict-pit-materialize-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize all 104 CAD inflation first-release months read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cad-inflation-strict
          python validation/materialize_cad_inflation_strict_pit_v1.py \
            --csv /tmp/cad-inflation-strict/CAD_CPI_STRICT_FIRST_RELEASE_2018_2026_08.csv \
            --evidence /tmp/cad-inflation-strict/CAD_INFLATION_STRICT_PIT_EVIDENCE_V1.json
      - name: Verify strict PIT invariants and pinned certification contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('/tmp/cad-inflation-strict')
          ev=json.loads((p/'CAD_INFLATION_STRICT_PIT_EVIDENCE_V1.json').read_text())
          pin=json.loads(Path('validation/macro/cad_inflation_strict_pit_evidence_v1_2026-10-09.json').read_text())
          receipt=json.loads(Path('validation/macro/cad_inflation_strict_pit_receipt_v1_2026-10-09.json').read_text())
          rows=list(csv.DictReader((p/'CAD_CPI_STRICT_FIRST_RELEASE_2018_2026_08.csv').open()))
          assert ev['status']=='PASS'
          assert ev['evidence_class']=='STRICT_DIRECT_ARCHIVAL_PIT'
          assert ev['target']=='CAD.inflation'
          assert len(rows)==104
          assert rows[0]['reference_month']=='2018-01' and rows[-1]['reference_month']=='2026-08'
          assert all(r['pit_status']=='STRICT_FIRST_RELEASE' for r in rows)
          assert len({r['combined_sha256'] for r in rows})==104
          assert len({r['table_sha256'] for r in rows})==104
          assert all(r['release_date'] and r['release_time']=='08:30' and r['timezone']=='Eastern Time' for r in rows)
          assert ev['route_counts']=={'STATCAN_THE_DAILY_PLUS_TABLE1':104}
          assert ev['strict_rules']['full_precision_derived_from_release_table_indexes'] is True
          assert ev['strict_rules']['revised_history_fallback_used'] is False
          expected='d35f3da5a41ea5550a3d51bc9d7087aeef7c8901a2ef59a48cd7bd674c1dce2a'
          assert ev['semantic_rowset_sha256']==pin['semantic_rowset_sha256']==receipt['invariants']['semantic_rowset_sha256']==expected
          for key in ('status','target','evidence_class','authority','coverage','series_contract','route_counts','unique_combined_source_hashes','unique_table_hashes','publication_time_basis','strict_rules','changes_live_data','changes_engine_rules'):
              assert ev[key]==pin[key], key
          anchors=pin['anchor_checks']
          assert set(anchors)=={'2018-01','2020-04','2020-07','2022-01','2024-12','2026-08'}
          by_month={r['reference_month']:r for r in rows}
          for month, anchor in anchors.items():
              row=by_month[month]
              assert float(row['cpi_index_current'])==anchor['current'], month
              assert float(row['cpi_index_prior_year'])==anchor['prior_year'], month
              assert float(row['cpi_yoy_full_precision'])==anchor['yoy'], month
              assert row['release_date']==anchor['release_date'], month
          assert pin['source_validation']['base_main_sha']=='81c828bf67a4328ffc43334b72538a501e5819d4'
          assert pin['source_validation']['validated_source_sha']=='72e1b72d502dce328041413f01d0d77fea8be306'
          assert pin['source_validation']['artifact_id']==receipt['artifact_id']==11639347271
          assert pin['source_validation']['artifact_digest']==receipt['artifact_digest']=='sha256:4362b894f75ae4e90b5db43e8a824b8038301bcbbaf34752b2df9bb34256b35c'
          assert receipt['verdict']=='STRICT_DIRECT_ARCHIVAL_PIT_CERTIFIABLE'
          assert receipt['coverage']['months']==104
          assert receipt['promotion_effect_if_merged']['strict_direct_archival_pit']=='7/16'
          PY
      - name: Enforce no repository writes
        run: git diff --exit-code
      - name: Upload reproducible strict PIT dataset and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-inflation-strict-pit-v1-${{ github.run_id }}
          path: /tmp/cad-inflation-strict/
          if-no-files-found: error
          retention-days: 90
