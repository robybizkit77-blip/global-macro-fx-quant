name: USD Macro Data Probe

on:
  push:
    branches:
      - staging-usd-macro-2026-09-30
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull canonical USD BEA/FRED series
        run: |
          pip install requests pandas
          python - <<'PY'
          import requests,pandas as pd,io,json
          ids=['PCEPI','PCEPILFE','PCEC96','DSPIC96','PI','PSAVERT']
          out={}
          for sid in ids:
              url='https://fred.stlouisfed.org/graph/fredgraph.csv'
              r=requests.get(url,params={'id':sid,'cosd':'2026-01-01','coed':'2026-09-30'},timeout=120)
              print('HTTP',sid,r.status_code,r.url,len(r.content))
              r.raise_for_status()
              df=pd.read_csv(io.BytesIO(r.content))
              print('SERIES',sid)
              print(df.tail(12).to_string(index=False))
              out[sid]=df.tail(12).to_dict('records')
          print('FINAL='+json.dumps(out,default=str))
          PY
