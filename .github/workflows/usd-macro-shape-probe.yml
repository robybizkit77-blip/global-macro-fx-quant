name: USD Macro Shape Probe

on:
  push:
    branches:
      - staging-usd-macro-2026-09-30
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright package
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/gmfq-server.log 2>&1 &
          sleep 2
      - name: Inspect exact canonical USD series objects
        run: |
          cat > probe.js <<'EOF'
          const { chromium }=require('playwright');
          const { execSync }=require('child_process');
          (async()=>{
            const chromePath=execSync('command -v google-chrome-stable || command -v google-chrome || command -v chromium').toString().trim();
            const browser=await chromium.launch({headless:true,executablePath:chromePath,args:['--no-sandbox']});
            const page=await browser.newPage();
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle',timeout:120000});
            const x=await page.evaluate(()=>{
              const ids=[
                'US_PCEPI_history_value',
                'US_PCEPILFE_history_value',
                'US_PCEC96_history_value',
                'US_DSPIC96_history_DSPIC96',
                'US_PI_history_PI',
                'US_PSAVERT_history_PSAVERT'
              ];
              const raw=Object.fromEntries(ids.map(id=>[id,(S.USD||[]).find(z=>z.id===id)||null]));
              const therm={
                inflation:window.GMFQ_MACRO_THERMOMETER?.series?.('USD','inflation')||null,
                labour:window.GMFQ_MACRO_THERMOMETER?.series?.('USD','labour')||null
              };
              return {raw,therm,macro:D.macro.USD,canonical:window.CANONICAL_LAYER_STATE?.USD?.macro||null};
            });
            console.log('USD_SERIES_RAW='+JSON.stringify(x,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node probe.js
