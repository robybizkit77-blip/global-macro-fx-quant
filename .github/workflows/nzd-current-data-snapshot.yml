name: NZD Current Data Snapshot
on:
  push:
    branches: [staging-nzd-data-refresh-2026-10-01]
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y >/dev/null 2>&1 && npm install --save-dev playwright
      - name: Print NZD runtime snapshot
        run: |
          cat > snap.js <<'EOF'
          const {chromium}=require('playwright');
          const {execSync,spawn}=require('child_process');
          (async()=>{
            const srv=spawn('python3',['-m','http.server','8765'],{stdio:'ignore'});
            await new Promise(r=>setTimeout(r,1000));
            const cp=execSync('command -v google-chrome-stable || command -v google-chrome || command -v chromium').toString().trim();
            const browser=await chromium.launch({headless:true,executablePath:cp,args:['--no-sandbox']});
            const page=await browser.newPage();
            await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'networkidle',timeout:120000});
            await page.waitForTimeout(2500);
            const out=await page.evaluate(()=>({
              rateData:typeof NATIVE_RATES_DATA!=='undefined'?NATIVE_RATES_DATA.NZD:null,
              liqData:typeof NATIVE_LIQ_DATA!=='undefined'?NATIVE_LIQ_DATA.NZD:null,
              macroNZD:typeof D!=='undefined'?D.macro?.NZD:null,
              sourceAudit:(window.FINAL_SOURCE_POLICY_AUDIT?.RATES||window.FINAL_SOURCE_POLICY_AUDIT?.rates||{})?.NZD||null,
              liqAudit:window.FINAL_SOURCE_POLICY_AUDIT?.LIQUIDITY?.NZD||null,
              refresh:window.PRODUCTION_RATES_REFRESH_STATUS?.rates_refresh?.NZD||null,
              fingerprint:typeof forwardValidationSummary==='function'?forwardValidationSummary()?.current_rules_fingerprint:null
            }));
            console.log('===NZD_SNAPSHOT===');
            console.log(JSON.stringify(out,null,2));
            console.log('===END_NZD_SNAPSHOT===');
            await browser.close();srv.kill();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node snap.js
