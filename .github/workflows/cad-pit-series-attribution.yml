name: CAD PIT Series Attribution
on:
  push:
    branches: [staging-usd-pit-readiness-2026-10-03]
    paths:
      - 'validation/audit_cad_pit_series_attribution.py'
      - '.github/workflows/cad-pit-series-attribution.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run series attribution audit
        run: python validation/audit_cad_pit_series_attribution.py
      - name: Commit audit artifact
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/CAD_PIT_REVISION_SERIES_ATTRIBUTION_2026-10-03.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record CAD PIT series attribution audit'
          git push
