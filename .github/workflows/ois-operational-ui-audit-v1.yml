name: OIS Operational UI Audit V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'dashboard/ois-operational-monitor-v1.js'
      - 'dashboard/product-language-v1.js'
      - 'live_data/sections/OIS_OPERATIONAL_VIEW.json'
      - '.github/workflows/publish-dashboard-pages-v1.yml'
      - '.github/workflows/ois-operational-ui-audit-v1.yml'
  push:
    branches:
      - 'validation-ois-operational-ui-*'
      - main
    paths:
      - 'index.html'
      - 'dashboard/ois-operational-monitor-v1.js'
      - 'dashboard/product-language-v1.js'
      - 'live_data/sections/OIS_OPERATIONAL_VIEW.json'
      - '.github/workflows/publish-dashboard-pages-v1.yml'
      - '.github/workflows/ois-operational-ui-audit-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start local dashboard server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/ois-ui-server.log 2>&1 &
          echo $! > /tmp/ois-ui-server.pid
          sleep 2
      - name: Audit desktop and mobile operational OIS render
        run: |
          cat > ois-ui-audit.js <<'EOF'
          const { chromium }=require('playwright');
          const CCYS=['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];
          async function run(viewport,label){
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport});
            const errors=[];
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            page.on('pageerror',e=>errors.push(String(e)));
            const response=await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:120000});
            if(!response||!response.ok())throw new Error(label+' HTTP load failed');
            await page.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.settled_after_cad_chain===true,null,{timeout:120000});
            await page.waitForFunction(()=>window.GMFQ_OIS_OPERATIONAL_UI?.status==='READY',null,{timeout:30000});
            await page.evaluate(()=>window.showView?.('ratesdesk'));
            await page.waitForTimeout(250);
            const result=await page.evaluate(({CCYS})=>{
              const audit=window.gmfqOisOperationalUiAudit?.();
              const host=document.getElementById('v401OisBlock');
              const cards=[...(host?.querySelectorAll('.oisPathCard')||[])];
              const badges=[...(host?.querySelectorAll('.oisPathMeta')||[])].map(x=>x.textContent.trim());
              const rows=[...(host?.querySelectorAll('.oisReprice tbody tr')||[])];
              const tickers=[...(host?.querySelectorAll('.oisPathCcy')||[])].map(x=>x.textContent.trim());
              const foot=host?.querySelector('.oisFoot')?.textContent||'';
              const chf=window.GMFQ_OIS_OPERATIONAL_UI?.data?.currencies?.CHF;
              const chfNote=host?.querySelector('[data-ois-ccy="CHF"] [data-ois-chf-window]');
              const chfTerms=['3m','6m','12m'];
              const validCHF=chf?.operational_status==='GREEN_ESTIMATED'&&
                chf?.method_id==='TRADINGVIEW_DATED_FUTURES_SSR_V2'&&
                !chf?.source_conflict_status&&
                chfTerms.every(h=>chf.horizons?.[h]?.quote_timestamp_verified===true&&
                  chf.horizons?.[h]?.accrual_start&&chf.horizons?.[h]?.expiration);
              const chfText=chfNote?.textContent||'';
              const chfDatesPresent=validCHF?chfTerms.every(h=>{
                const q=chf.horizons[h],d=q.accrual_start;
                return chfText.includes(q.contract)&&
                  chfText.includes(d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4));
              }):true;
              const docOverflow=document.documentElement.scrollWidth-window.innerWidth;
              const hostOverflow=host?host.scrollWidth-host.clientWidth:null;
              const active=document.getElementById('ratesdesk')?.classList.contains('active')===true;
              return {
                audit,active,cards:cards.length,rows:rows.length,badges,tickers,
                hasOfficial:badges.filter(x=>x==='OFFICIAL'||x==='Ufficiale').length,
                hasEstimated:badges.filter(x=>x==='ESTIMATED'||x==='Stimato').length,
                hasAllCurrencies:CCYS.every(c=>tickers.includes(c)),
                hasNullPolicy:foot.includes('NULL ≠ 0 bp'),
                chfExpected:!!validCHF,chfVisible:!!chfNote,chfDatesPresent,
                chfCaveat:chfText.includes('NON OIS SPOT')&&chfText.includes('non equivale a rialzi o tagli'),
                docOverflow,hostOverflow,
                hostBox:host?{w:host.getBoundingClientRect().width,h:host.getBoundingClientRect().height}:null,
                finalAudit:window.GMFQ_POST_GATE_FINAL_AUDIT||null
              };
            },{CCYS});
            console.log(label,JSON.stringify(result,null,2));
            if(errors.length)throw new Error(label+' console/page errors: '+errors.join(' | '));
            if(result.finalAudit?.status!=='PASS')throw new Error(label+' canonical final audit not PASS');
            if(!result.active)throw new Error(label+' ratesdesk not active');
            if(result.audit?.ok!==true||result.audit?.summary?.operational_green+result.audit?.summary?.operational_withheld!==8)throw new Error(label+' OIS UI audit failed: '+JSON.stringify(result.audit));
            if(result.audit?.host_count!==1)throw new Error(label+' OIS host count mismatch');
            if(result.cards!==8||result.rows!==8)throw new Error(label+' expected 8 cards/rows');
            if(result.hasOfficial!==result.audit.summary.green_official||
               result.hasEstimated!==result.audit.summary.green_estimated||
               result.badges.filter(x=>x==='WITHHELD'||x==='SCENARIO').length!==result.audit.summary.operational_withheld)
               throw new Error(label+' dynamic quality split mismatch');
            if(result.audit.nzd_scenario_count!==Number(result.audit.nzd_scenario_expected))throw new Error(label+' NZD research scenario integrity failure');
            if(!result.hasAllCurrencies||!result.hasNullPolicy)throw new Error(label+' content integrity failure');
            if(result.chfExpected&&(!result.chfVisible||!result.chfDatesPresent||!result.chfCaveat))
              throw new Error(label+' CHF futures accrual-window context not rendered accurately');
            if(!result.chfExpected&&result.chfVisible)
              throw new Error(label+' CHF accrual context displayed without verified dated futures');
            if(!result.hostBox||result.hostBox.w<=0||result.hostBox.h<=0)throw new Error(label+' OIS host not rendered');
            if(result.hostOverflow!=null&&result.hostOverflow>4)throw new Error(label+' OIS host horizontal overflow '+result.hostOverflow);
            await page.screenshot({path:`ois-operational-${label}.png`,fullPage:true});
            await browser.close();
          }
          (async()=>{await run({width:1440,height:1100},'desktop');await run({width:390,height:844},'mobile');})().catch(e=>{console.error('::error title=OIS UI audit::'+String(e.message||e));process.exit(1)});
          EOF
          node ois-ui-audit.js
      - name: Upload OIS UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ois-operational-ui-audit
          path: |
            ois-operational-desktop.png
            ois-operational-mobile.png
            /tmp/ois-ui-server.log
