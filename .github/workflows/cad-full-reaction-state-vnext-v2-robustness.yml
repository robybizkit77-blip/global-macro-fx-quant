name: CAD Full Reaction State vNext V2 Robustness
on:
  push:
    paths:
      - 'validation/run_cad_full_reaction_state_vnext_v2_robustness.py'
      - '.github/workflows/cad-full-reaction-state-vnext-v2-robustness.yml'
      - 'validation/CAD_FULL_REACTION_STATE_VNEXT_V2_2026-10-06.json'
permissions:
  contents: write
jobs:
  robustness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-minimum-robust-pit-dataset-2026-10-06
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run robustness
        run: python validation/run_cad_full_reaction_state_vnext_v2_robustness.py
      - name: Strict engine/live-data guard
        run: git diff --exit-code -- engine live_data
      - name: Commit evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/CAD_FULL_REACTION_STATE_VNEXT_V2_ROBUSTNESS_2026-10-06.json
          git diff --cached --quiet || git commit -m 'Add CAD v2 reaction-state robustness evidence'
          git pull --rebase origin audit-minimum-robust-pit-dataset-2026-10-06
          git push origin HEAD:audit-minimum-robust-pit-dataset-2026-10-06
