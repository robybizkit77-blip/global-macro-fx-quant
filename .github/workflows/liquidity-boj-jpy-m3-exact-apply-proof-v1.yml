name: Liquidity BOJ JPY M3 Revision-Aware Apply Proof V1

on:
  pull_request:
    paths: ['validation/fetch_boj_jpy_m3_exact_candidate.py', 'validation/apply_boj_jpy_m3_exact_candidate.py', '.github/workflows/liquidity-boj-jpy-m3-exact-apply-proof-v1.yml', 'live_data/sections/NATIVE_LIQ_DATA.json']
  push:
    branches: [main]
    paths: ['validation/fetch_boj_jpy_m3_exact_candidate.py', 'validation/apply_boj_jpy_m3_exact_candidate.py', '.github/workflows/liquidity-boj-jpy-m3-exact-apply-proof-v1.yml', 'live_data/sections/NATIVE_LIQ_DATA.json']
  workflow_dispatch:

permissions: {contents: read}

jobs:
  prove-revision-aware-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Snapshot tracked runtime
        run: sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/runtime.before.sha256
      - name: Collect exact official BOJ M3 candidate
        run: python validation/fetch_boj_jpy_m3_exact_candidate.py --out /tmp/candidate.json
      - name: Prove candidate semantics or fail-closed veto
        run: |
          python - <<'PY'
          import json
          c=json.load(open('/tmp/candidate.json'))
          assert c['schema']=='GMFQ_LIQUIDITY_JPY_M3_REVISION_AWARE_CANDIDATE_V1', c
          s=c['source']; assert (s.get('publisher'),s.get('database'),s.get('series_id'),s.get('frequency'),s.get('seasonal_adjustment'))==('Bank of Japan','MD02','MAM1XAM3M3MO','MONTHLY','Seasonally Adjusted'),s
          if c['status']=='GREEN_REVISION_AWARE_CANDIDATE':
              assert c['revision_window']['months']==3, c
              assert all(c['revision_window']['start_date']<=x['date']<=c['revision_window']['end_date'] for x in c['revised_observations']), c
              assert c['candidate_update_available']==bool(c['revised_observations'] or c['appended_observations']), c
              print('JPY_M3_REVISION_AWARE_CANDIDATE_PASS')
          else:
              assert c['status'] in {'WITHHELD_REVISION_OUTSIDE_WINDOW','WITHHELD_SOURCE_UNAVAILABLE'},c
              assert c['fail_closed'] is True and not c['candidate_update_available'],c
              print('JPY_M3_REVISION_AWARE_VETO_PASS')
          PY
      - name: Dry-run and ephemeral apply
        run: |
          if [ "$(python -c "import json; print(json.load(open('/tmp/candidate.json'))['status'])")" != GREEN_REVISION_AWARE_CANDIDATE ]; then exit 0; fi
          python validation/apply_boj_jpy_m3_exact_candidate.py --candidate /tmp/candidate.json > /tmp/dry.json
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/runtime.json
          python validation/apply_boj_jpy_m3_exact_candidate.py --candidate /tmp/candidate.json --runtime /tmp/runtime.json --apply > /tmp/apply.json
          python - <<'PY'
          import json
          c=json.load(open('/tmp/candidate.json')); d=json.load(open('/tmp/dry.json')); r=json.load(open('/tmp/apply.json'))
          assert d['schema']==r['schema']=='GMFQ_LIQUIDITY_JPY_M3_REVISION_AWARE_APPLY_RECEIPT_V1'
          assert d['applied'] is False and r['applied']==bool(c['candidate_update_available'])
          assert r['revised_months']==c['revised_observations']
          assert r['appended_months']==c['appended_observations']
          PY
      - name: Verify tracked runtime was not mutated
        run: |
          sha256sum -c /tmp/runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
