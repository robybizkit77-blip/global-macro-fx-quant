name: Final Alignment Audit V1

on:
  push:
    branches:
      - 'validation-final-alignment-audit-v1-2026-10-12'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8147 --bind 127.0.0.1 > /tmp/gmfq-final-alignment-server.log 2>&1 &
          sleep 2
      - name: Run final alignment audit
        run: |
          cat > final-alignment-audit.js <<'EOF'
          const fs=require('fs');
          const {chromium}=require('playwright');
          const CCYS=['USD','EUR','GBP','JPY','CHF','AUD','NZD','CAD'];
          const PAIRS=[];for(let i=0;i<CCYS.length;i++)for(let j=i+1;j<CCYS.length;j++)PAIRS.push(`${CCYS[i]}/${CCYS[j]}`);
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.stack||e)));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            const r=await page.goto('http://127.0.0.1:8147/index.html',{waitUntil:'domcontentloaded',timeout:120000});
            if(!r||!r.ok())throw new Error('HTTP load failed');
            await page.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.settled_after_cad_chain===true||window.__GMFQ_BOOTSTRAP_ERROR,null,{timeout:120000});
            await page.waitForFunction(()=>{
              const p=window.__GMFQ_PRICE_FRESHNESS_GATE_STATE?.status;
              const c=window.__GMFQ_COT_FRESHNESS_GATE_STATE?.status;
              const x=window.__GMFQ_COT_PROVENANCE_REALIGN_STATE?.status;
              return ((p&&!p.startsWith('WAITING_'))&&(c&&!c.startsWith('WAITING_'))&&x)||window.__GMFQ_BOOTSTRAP_ERROR;
            },null,{timeout:120000});

            const out=await page.evaluate(({CCYS,PAIRS})=>{
              const clone=x=>{try{return JSON.parse(JSON.stringify(x))}catch{return null}};
              const D0=window.__GMFQ_DATA||{};
              const currencies=Object.fromEntries(CCYS.map(c=>[c,clone(window.deriveCurrencyState?.(c))]));
              const pairs=Object.fromEntries(PAIRS.map(p=>[p,clone(window.derivePairDecisionFrame?.(p))]));
              const structural=f=>({fav:f?.fav??null,quality:f?.quality??null,setup:f?.setup??null,structural:f?.structural??null,macroSide:f?.macroSide??null,policySide:f?.policySide??null});
              const baselinePair=Object.fromEntries(PAIRS.map(p=>[p,structural(pairs[p])]));

              const layers={
                macroSeries:D0.MACRO_SERIES||window.MACRO_SERIES||null,
                macroThermometer:D0.MACRO_THERMOMETER_DATA||window.MACRO_THERMOMETER_DATA||null,
                rates:D0.NATIVE_RATES_DATA||window.NATIVE_RATES_DATA||null,
                cb:D0.NATIVE_CB_DATA||window.NATIVE_CB_DATA||null,
                liquidity:D0.NATIVE_LIQ_DATA||window.NATIVE_LIQ_DATA||null,
                cot:D0.V250_COT_CHART_DATA||window.V250_COT_CHART_DATA||null
              };
              const directCoverage={};
              for(const k of ['macroSeries','rates','cb','liquidity','cot']) directCoverage[k]=CCYS.filter(c=>layers[k]?.[c]!=null);
              const macroThermometer={present:!!layers.macroThermometer,key_count:layers.macroThermometer&&typeof layers.macroThermometer==='object'?Object.keys(layers.macroThermometer).length:0};

              const cotLatest={};
              for(const c of CCYS){const d=layers.cot?.[c]?.dates;cotLatest[c]=Array.isArray(d)&&d.length?String(d[d.length-1]).slice(0,10):null;}

              const post=clone(window.GMFQ_POST_GATE_FINAL_AUDIT||null);
              const ois=post?.ois||{};
              const oisStatuses=Object.fromEntries(CCYS.map(c=>[c,ois[c]||null]));
              const oisActive=CCYS.filter(c=>oisStatuses[c]==='ACTIVE');
              const oisWithheld=CCYS.filter(c=>String(oisStatuses[c]||'').startsWith('WITHHELD'));

              const gateSummary={
                price:clone(window.__GMFQ_PRICE_FRESHNESS_GATE_STATE),
                cotRealign:clone(window.__GMFQ_COT_PROVENANCE_REALIGN_STATE),
                cot:clone(window.__GMFQ_COT_FRESHNESS_GATE_STATE),
                risk:clone(window.__GMFQ_RISK_FRESHNESS_GATE_STATE||null),
                post
              };
              const provenance={
                productionCot:clone(window.PRODUCTION_PRICE_COT_LIQ_AUDIT?.cot||null),
                priceAsOf:window.GMFQ_ECB_PRICE_AUDIT?.as_of||window.D?.prices?.at?.(-1)?.Date||null
              };

              const pairContextLeaks=Object.entries(pairs).filter(([p,f])=>f?.cot!=null||f?.cotRisk!=null||f?.liq!=null||f?.liquidity!=null||f?.liquidityOverlay!=null||f?.funding!=null).map(([p,f])=>({p,cot:f?.cot,cotRisk:f?.cotRisk,liq:f?.liq,liquidity:f?.liquidity,funding:f?.funding}));

              const originalCurrency=window.deriveCurrencyState;
              const neutralization={};
              function compareWith(transform,name){
                const wrapped=function(c){const s=clone(originalCurrency(c));return s?transform(s,c):s};
                window.deriveCurrencyState=wrapped;try{deriveCurrencyState=wrapped}catch(e){}
                const now=Object.fromEntries(PAIRS.map(p=>[p,structural(clone(window.derivePairDecisionFrame(p)))]));
                neutralization[name]=PAIRS.filter(p=>JSON.stringify(now[p])!==JSON.stringify(baselinePair[p])).map(p=>({p,before:baselinePair[p],after:now[p]}));
              }
              compareWith(s=>{s.cotRisk='';return s},'cotStructuralDiffs');
              compareWith(s=>{s.liq=0;return s},'liquidityStructuralDiffs');
              compareWith(s=>{s.price=0;s.confirmation='PREZZO NON RISOLUTIVO';return s},'priceStructuralDiffs');
              window.deriveCurrencyState=originalCurrency;try{deriveCurrencyState=originalCurrency}catch(e){}

              const hysteresis=clone(window.CB_LIQ_HYSTERESIS_STATE||null);
              const dom={
                pairConfirm:!!document.getElementById('gmfqPairConfirm'),
                pairReverse:!!document.getElementById('gmfqPairReverse'),
                cotBanner:document.getElementById('gmfqCotFreshnessBanner')?{display:getComputedStyle(document.getElementById('gmfqCotFreshnessBanner')).display,text:document.getElementById('gmfqCotFreshnessBanner').textContent||''}:null
              };
              return {currencies,pairs,directCoverage,macroThermometer,cotLatest,oisStatuses,oisActive,oisWithheld,gateSummary,provenance,pairContextLeaks,neutralization,hysteresis,dom,bootstrapError:window.__GMFQ_BOOTSTRAP_ERROR||null};
            },{CCYS,PAIRS});
            await browser.close();

            const failures=[];
            if(out.bootstrapError)failures.push('BOOTSTRAP:'+out.bootstrapError);
            if(errors.length)failures.push('BROWSER_ERRORS:'+errors.join(' | '));
            if(Object.keys(out.currencies||{}).length!==8)failures.push('CURRENCY_COUNT');
            if(Object.keys(out.pairs||{}).length!==28)failures.push('PAIR_COUNT');
            for(const c of CCYS){if(!out.currencies?.[c]||typeof out.currencies[c].base!=='string'||!out.currencies[c].base.trim())failures.push('CURRENCY_STATE:'+c);}
            for(const p of PAIRS){if(!out.pairs?.[p]||typeof out.pairs[p]!=='object')failures.push('PAIR_FRAME:'+p);}
            for(const k of ['macroSeries','rates','cb','liquidity','cot']) if((out.directCoverage?.[k]||[]).length!==8) failures.push('LAYER_COVERAGE:'+k+':'+JSON.stringify(out.directCoverage?.[k]||[]));
            if(!out.macroThermometer?.present||out.macroThermometer.key_count<1)failures.push('MACRO_THERMOMETER_MISSING:'+JSON.stringify(out.macroThermometer));
            if(Object.values(out.oisStatuses||{}).filter(Boolean).length!==8)failures.push('OIS_STATUS_COVERAGE:'+JSON.stringify(out.oisStatuses));
            if((out.oisActive||[]).length<4)failures.push('OIS_ACTIVE_TOO_LOW:'+JSON.stringify(out.oisStatuses));
            if((out.oisActive||[]).length+(out.oisWithheld||[]).length!==8)failures.push('OIS_STATUS_NOT_EXPLICIT:'+JSON.stringify(out.oisStatuses));
            if(out.gateSummary?.price?.status!=='PASS_FRESH_PRICE_UNCHANGED'||out.gateSummary?.price?.price_asof!=='2026-10-12')failures.push('PRICE_GATE:'+JSON.stringify(out.gateSummary?.price));
            if(out.gateSummary?.cotRealign?.status!=='PASS_CANONICAL_COT_PROVENANCE_REALIGNED'||out.gateSummary?.cotRealign?.canonical_as_of!=='2026-10-06')failures.push('COT_REALIGN:'+JSON.stringify(out.gateSummary?.cotRealign));
            if(out.gateSummary?.cot?.status!=='PASS_FRESH_COT_UNCHANGED'||out.gateSummary?.cot?.cot_asof!=='2026-10-06'||Number(out.gateSummary?.cot?.calendar_lag_days)>10)failures.push('COT_GATE:'+JSON.stringify(out.gateSummary?.cot));
            if(!/^PASS_(FRESH|WITHHELD)/.test(String(out.gateSummary?.risk?.status||'')))failures.push('RISK_GATE:'+JSON.stringify(out.gateSummary?.risk));
            if(new Set(Object.values(out.cotLatest||{})).size!==1||Object.values(out.cotLatest||{})[0]!=='2026-10-06')failures.push('COT_SERIES_DATES:'+JSON.stringify(out.cotLatest));
            if(out.provenance?.productionCot?.current_as_of!=='2026-10-06')failures.push('COT_PROVENANCE:'+JSON.stringify(out.provenance));
            if(out.pairContextLeaks.length)failures.push('PAIR_CONTEXT_LEAK:'+JSON.stringify(out.pairContextLeaks));
            for(const k of ['cotStructuralDiffs','liquidityStructuralDiffs','priceStructuralDiffs'])if((out.neutralization?.[k]||[]).length)failures.push(k+':'+JSON.stringify(out.neutralization[k]));
            if(out.hysteresis?.AUD?.cb?.status==='PENDING_MARKET_CONFIRMATION')failures.push('AUD_CB_STALE_PENDING');
            if(!out.dom?.pairConfirm||!out.dom?.pairReverse)failures.push('PAIR_DOM_MISSING:'+JSON.stringify(out.dom));
            if(out.dom?.cotBanner&&out.dom.cotBanner.display!=='none')failures.push('COT_FRESH_BANNER_VISIBLE:'+JSON.stringify(out.dom.cotBanner));

            const verdict={
              schema:'GMFQ_FINAL_ALIGNMENT_AUDIT_V2',
              status:failures.length?'FAIL_FINAL_ALIGNMENT':'PASS_FINAL_ALIGNMENT',
              currency_count:Object.keys(out.currencies||{}).length,
              pair_count:Object.keys(out.pairs||{}).length,
              coverage:out.directCoverage,
              macro_thermometer:out.macroThermometer,
              ois:{statuses:out.oisStatuses,active:out.oisActive,withheld:out.oisWithheld},
              price_status:out.gateSummary?.price?.status||null,
              cot_realign_status:out.gateSummary?.cotRealign?.status||null,
              cot_status:out.gateSummary?.cot?.status||null,
              risk_status:out.gateSummary?.risk?.status||null,
              cot_asof:out.gateSummary?.cot?.cot_asof||null,
              cot_lag_days:out.gateSummary?.cot?.calendar_lag_days??null,
              structural_diffs:{cot:(out.neutralization?.cotStructuralDiffs||[]).length,liquidity:(out.neutralization?.liquidityStructuralDiffs||[]).length,price:(out.neutralization?.priceStructuralDiffs||[]).length},
              pair_context_leaks:out.pairContextLeaks.length,
              failures
            };
            fs.writeFileSync('final-alignment-audit.json',JSON.stringify({...verdict,detail:out,console_errors:errors},null,2));
            console.log(JSON.stringify(verdict,null,2));
            if(failures.length)throw new Error(failures.join('\n'));
          })().catch(e=>{console.error('::error title=Final alignment audit::'+String(e.stack||e));process.exit(1)});
          EOF
          node final-alignment-audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-alignment-audit-v1
          path: |
            final-alignment-audit.json
            /tmp/gmfq-final-alignment-server.log
