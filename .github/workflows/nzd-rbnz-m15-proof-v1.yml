name: NZD RBNZ M15 expectations source proof V1
on:
  pull_request:
    paths:
      - 'validation/macro/prepare_nzd_rbnz_m15_v1.py'
      - 'validation/macro/test_prepare_nzd_rbnz_m15_v1.py'
      - '.github/workflows/nzd-rbnz-m15-proof-v1.yml'
permissions:
  contents: read
jobs:
  source-proof:
    if: github.head_ref == 'fix/nzd-rbnz-m15-expectations-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4 openpyxl
      - run: python -m unittest validation.macro.test_prepare_nzd_rbnz_m15_v1 -v
      - name: Inspect published direct M15 workbook schema and historical identities
        run: |
          python - <<'PY'
          import io,json
          from pathlib import Path
          from openpyxl import load_workbook
          from validation.macro.probe_nzd_rbnz_employment_sfm_v1 import fetch
          url="https://rbnz.govt.nz/-/media/project/sites/rbnz/files/statistics/series/m/m15/hm15.xlsx"
          raw=fetch(url)
          wb=load_workbook(io.BytesIO(raw),read_only=True,data_only=True)
          for ws in wb.worksheets:
              if ws.max_row==1 and ws.max_column==1:ws.reset_dimensions()
              print("M15_LAYOUT",ws.title,ws.max_row,ws.max_column)
              from itertools import islice
              print("M15_HEAD",json.dumps([[str(v)[:160] for v in row[:30]] for row in islice(ws.iter_rows(values_only=True),16)],ensure_ascii=False))
          wb.close()
          PY
      - name: Verify exact official M15 quarter and release
        run: |
          python -m validation.macro.prepare_nzd_rbnz_m15_v1 --candidate /tmp/nzd-m15/candidate.json --receipt /tmp/nzd-m15/receipt.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/nzd-m15/receipt.json'))
          assert len(r['series'])==8 and all(x['status'] in ('READY','NO_CHANGE') and x['after']>='2026-12' and x['overlap']>=4 for x in r['series']),r
          PY
