name: Website Macro Data QA

on:
  push:
    branches:
      - main
    paths:
      - 'site/website-v1/macro-data.*'
      - 'live_data/sections/MACRO_SERIES.json'
      - 'live_data/sections/MACRO_THERMOMETER_DATA.json'
      - 'live_data/sections/COUNTRY_CTX.json'
      - 'live_data/sections/MACRO_RELEASE_OFFICIAL_SEED_V1.json'
      - '.github/workflows/website-macro-data-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macro-data-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Macro source contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const js=fs.readFileSync('site/website-v1/macro-data.js','utf8');
          const html=fs.readFileSync('site/website-v1/macro-data.html','utf8');
          for(const required of ['MACRO_SERIES.json','MACRO_THERMOMETER_DATA.json','COUNTRY_CTX.json','MACRO_RELEASE_OFFICIAL_SEED_V1.json']){
            if(!js.includes(required))throw new Error(`Missing canonical Macro source: ${required}`);
          }
          for(const legacy of ["load('D.json')","load('WHAT_CHANGED.json')"]){
            if(js.includes(legacy))throw new Error(`Legacy Macro dependency reintroduced: ${legacy}`);
          }
          if(!js.includes("dataset.macroSource='MACRO_SERIES'"))throw new Error('Macro source marker missing');
          if(!html.includes('operationalbridge1'))throw new Error('Macro bridge cache-bust missing');
          console.log('MACRO_SOURCE_CONTRACT_PASS');
          NODE
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start Website V1
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/macro-data-qa.log 2>&1 &
          sleep 2
      - name: Verify Macro Data desktop and mobile
        run: |
          cat > macro-data-qa.js <<'NODE'
          const { chromium }=require('playwright');
          const base='http://127.0.0.1:8000/site/website-v1/';
          async function audit(viewport,label){
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            const r=await page.goto(base+'macro-data.html',{waitUntil:'networkidle',timeout:120000});
            if(!r||!r.ok())throw new Error(`${label}: HTTP ${r?.status()}`);
            await page.waitForFunction(()=>document.documentElement.dataset.macroDataPage==='READY',null,{timeout:30000});
            const x=await page.evaluate(()=>({
              cards:document.querySelectorAll('.macro-card').length,
              buttons:document.querySelectorAll('#macro-select button').length,
              sectors:document.querySelectorAll('.macro-sector-row').length,
              source:document.documentElement.dataset.macroSource,
              coverage:document.documentElement.dataset.macroCoverage,
              body:(document.body.innerText||''),
              overflow:document.documentElement.scrollWidth-window.innerWidth
            }));
            if(x.cards!==8||x.buttons!==8)throw new Error(`${label}: G8 coverage ${x.cards} cards / ${x.buttons} selectors`);
            if(x.source!=='MACRO_SERIES'||x.coverage!=='8')throw new Error(`${label}: canonical source/coverage ${x.source}/${x.coverage}`);
            if(x.sectors<4)throw new Error(`${label}: sector detail too thin (${x.sectors})`);
            for(const bad of ['undefined','[object Object]','NaN'])if(x.body.includes(bad))throw new Error(`${label}: bad token ${bad}`);
            for(const required of ['Prossimi release','Cosa sta cambiando','Nessuno score ricostruito'])if(!x.body.includes(required))throw new Error(`${label}: missing ${required}`);
            if(x.body.includes('Score Macro WITHHELD · D.json'))throw new Error(`${label}: legacy D.json UI still visible`);
            if(x.overflow>12)throw new Error(`${label}: hard horizontal overflow ${x.overflow}px`);
            if(errors.length)throw new Error(`${label}: browser errors ${errors.join(' | ')}`);
            await page.screenshot({path:`macro-data-${label}.png`,fullPage:false});
            await browser.close();
            return x;
          }
          (async()=>{
            const desktop=await audit({width:1672,height:905},'desktop');
            const mobile=await audit({width:390,height:844},'mobile');
            console.log('WEBSITE_MACRO_DATA_QA_PASS',JSON.stringify({desktopCards:desktop.cards,mobileCards:mobile.cards,source:desktop.source,coverage:desktop.coverage}));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node macro-data-qa.js
      - name: Upload Macro Data evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-macro-data-qa-${{ github.run_id }}
          path: |
            macro-data-desktop.png
            macro-data-mobile.png
          if-no-files-found: warn
          retention-days: 30
