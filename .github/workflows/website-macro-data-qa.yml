name: Website Macro Data QA

on:
  push:
    branches:
      - website-reference-lock-2026-10-16
    paths:
      - 'site/website-v1/macro-data.*'
      - 'site/website-v1/app.js'
      - 'live_data/sections/D.json'
      - 'live_data/sections/COUNTRY_CTX.json'
      - 'live_data/sections/MACRO_RELEASE_OFFICIAL_SEED_V1.json'
      - 'live_data/sections/WHAT_CHANGED.json'
      - '.github/workflows/website-macro-data-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macro-data-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start Website V1
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/macro-data-qa.log 2>&1 &
          sleep 2
      - name: Verify Macro Data desktop and mobile
        run: |
          cat > /tmp/macro-data-qa.js <<'NODE'
          const { chromium }=require('playwright');
          const fs=require('fs');
          const base='http://127.0.0.1:8000/site/website-v1/';
          async function audit(viewport,label){
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            const r=await page.goto(base+'macro-data.html',{waitUntil:'networkidle',timeout:120000});
            if(!r||!r.ok())throw new Error(`${label}: HTTP ${r?.status()}`);
            await page.waitForFunction(()=>document.documentElement.dataset.macroDataPage==='READY',null,{timeout:30000});
            const x=await page.evaluate(()=>({
              cards:document.querySelectorAll('.macro-card').length,
              buttons:document.querySelectorAll('#macro-select button').length,
              sectors:document.querySelectorAll('.macro-sector-row').length,
              body:(document.body.innerText||''),
              overflow:document.documentElement.scrollWidth-window.innerWidth,
              active:[...document.querySelectorAll('.nav a.active')].map(a=>a.textContent.trim())
            }));
            if(x.cards!==8||x.buttons!==8)throw new Error(`${label}: G8 coverage ${x.cards} cards / ${x.buttons} selectors`);
            if(x.sectors<4)throw new Error(`${label}: sector detail too thin (${x.sectors})`);
            for(const bad of ['undefined','[object Object]','NaN'])if(x.body.includes(bad))throw new Error(`${label}: bad token ${bad}`);
            if(!x.body.includes('Prossimi release')||!x.body.includes('Cosa sta cambiando'))throw new Error(`${label}: operational sections missing`);
            if(x.overflow>12)throw new Error(`${label}: hard horizontal overflow ${x.overflow}px`);
            if(errors.length)throw new Error(`${label}: browser errors ${errors.join(' | ')}`);
            await page.screenshot({path:`macro-data-${label}.png`,fullPage:false});
            await browser.close();
            return x;
          }
          (async()=>{
            const desktop=await audit({width:1672,height:905},'desktop');
            const mobile=await audit({width:390,height:844},'mobile');
            const browser=await chromium.launch({headless:true});
            const home=await browser.newPage({viewport:{width:1672,height:905}});
            await home.goto(base,{waitUntil:'networkidle',timeout:120000});
            const href=await home.locator('.nav-sub a').filter({hasText:'Macro Data'}).getAttribute('href');
            if(href!=='macro-data.html')throw new Error(`Home Macro Data route invalid: ${href}`);
            await browser.close();
            console.log('WEBSITE_MACRO_DATA_QA_PASS',JSON.stringify({desktopCards:desktop.cards,mobileCards:mobile.cards,homeRoute:href}));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/macro-data-qa.js
      - name: Upload Macro Data evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-macro-data-qa-${{ github.run_id }}
          path: |
            macro-data-desktop.png
            macro-data-mobile.png
          if-no-files-found: warn
          retention-days: 30
