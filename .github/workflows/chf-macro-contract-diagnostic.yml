name: CHF Macro Contract Diagnostic

on:
  push:
    branches:
      - validation-chf-official-v1-2026-10-06
    paths:
      - 'validation/diagnose_chf_macro_contract.py'
      - '.github/workflows/chf-macro-contract-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print frozen CHF contract
        run: python validation/diagnose_chf_macro_contract.py
      - name: Inspect official SNB cube APIs for CHF labour and CPI
        run: |
          python - <<'PY'
          import json, urllib.request
          for cube in ('amarbma','ambeschkla','plkopr'):
              url=f'https://data.snb.ch/api/cube/{cube}/data/json/en'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; global-macro-fx-quant/1.0)'})
              with urllib.request.urlopen(req,timeout=45) as r:
                  raw=r.read(); print('CUBE',cube,'HTTP',r.status,'TYPE',r.headers.get('Content-Type'),'BYTES',len(raw))
              obj=json.loads(raw)
              print('TOP_KEYS',cube,list(obj)[:30] if isinstance(obj,dict) else type(obj).__name__)
              txt=json.dumps(obj,ensure_ascii=False)
              print('HAS_2026_08',cube,'2026-08' in txt or '2026-08-01' in txt)
              # Print compact recursive records containing Aug 2026 or unemployment/CPI labels.
              hits=[]
              def walk(x,path=''):
                  if len(hits)>=80:return
                  if isinstance(x,dict):
                      s=json.dumps(x,ensure_ascii=False)
                      if ('2026-08' in s or 'unemployment' in s.lower() or 'jobless' in s.lower() or 'consumer price' in s.lower()) and len(s)<5000:
                          hits.append((path,s[:4500]))
                      for k,v in x.items():walk(v,f'{path}/{k}')
                  elif isinstance(x,list):
                      for i,v in enumerate(x):walk(v,f'{path}/{i}')
              walk(obj)
              for p,s in hits[:40]: print('HIT',cube,p,s)
          PY
