name: CHF Macro Contract Diagnostic

on:
  push:
    branches:
      - validation-chf-official-v1-2026-10-06
    paths:
      - 'validation/diagnose_chf_macro_contract.py'
      - '.github/workflows/chf-macro-contract-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print frozen CHF contract
        run: python validation/diagnose_chf_macro_contract.py
      - name: Discover SNB labour-market cube links
        run: |
          python - <<'PY'
          import re, urllib.request
          urls=['https://data.snb.ch/en/topics/uvo','https://data.snb.ch/fr/topics/uvo','https://data.snb.ch/de/topics/uvo']
          for url in urls:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  text=r.read().decode('utf-8','replace')
              print('URL',url,'BYTES',len(text))
              links=sorted(set(re.findall(r'href=["\']([^"\']*(?:cube|labour|arbeits|march)[^"\']*)["\']',text,re.I)))
              for x in links[:200]: print('LINK',x)
              for pat in ('Labour market','Arbeitsmarkt','Marché du travail','unemployment','Arbeitslosenquote','chômage'):
                  i=text.lower().find(pat.lower())
                  if i>=0: print('CONTEXT',pat,text[max(0,i-1000):i+2000].replace('\n',' ')[:3000])
          PY
