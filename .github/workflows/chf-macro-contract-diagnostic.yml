name: CHF Macro Contract Diagnostic

on:
  push:
    branches:
      - validation-chf-official-v1-2026-10-06
    paths:
      - 'validation/diagnose_chf_macro_contract.py'
      - '.github/workflows/chf-macro-contract-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print frozen CHF contract
        run: python validation/diagnose_chf_macro_contract.py
      - name: Inspect official SNB series headers
        run: |
          python - <<'PY'
          import json, urllib.request
          for cube in ('amarbma','plkopr'):
              url=f'https://data.snb.ch/api/cube/{cube}/data/json/en'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; global-macro-fx-quant/1.0)'})
              with urllib.request.urlopen(req,timeout=45) as r: obj=json.load(r)
              print('CUBE',cube,'SERIES',len(obj['timeseries']))
              for i,ts in enumerate(obj['timeseries']):
                  vals=ts.get('values') or []
                  aug=[v for v in vals if v.get('date')=='2026-08']
                  print('SERIES',i,'HEADER',json.dumps(ts.get('header'),ensure_ascii=False),'AUG',json.dumps(aug,ensure_ascii=False))
          PY
