name: CHF Macro Contract Diagnostic

on:
  push:
    branches:
      - validation-chf-official-v1-2026-10-06
    paths:
      - 'validation/diagnose_chf_macro_contract.py'
      - '.github/workflows/chf-macro-contract-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Print frozen CHF contract
        run: python validation/diagnose_chf_macro_contract.py
      - name: Install Playwright chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Discover rendered SNB labour-market links
        run: |
          node - <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            await page.goto('https://data.snb.ch/en/topics/uvo',{waitUntil:'networkidle',timeout:90000});
            const links=await page.locator('a').evaluateAll(as=>as.map(a=>({text:(a.innerText||'').trim(),href:a.href})).filter(x=>/labour|unemployment|market/i.test(x.text)||/cube/i.test(x.href)));
            console.log(JSON.stringify(links,null,2));
            console.log('BODY_MATCHES');
            const body=await page.locator('body').innerText();
            for(const line of body.split('\n').filter(x=>/labour market|unemployment/i.test(x))) console.log(line);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
