name: Diagnostic Product Language V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnostic-product-language-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start dashboard
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/product-language-server.log 2>&1 &
          sleep 2
      - name: Audit visible user-facing labels
        run: |
          cat > product-language-audit.js <<'EOF'
          const { chromium }=require('playwright');
          const fs=require('fs');
          const VIEWS=['overview','wow','themes','calendar','news','risk','currencies','pairs','macro','inflationlabour','ratesdesk','cbdesk','liquiditydesk','cot','method','forwarddesk'];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1100}});
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>window.GMFQ_PREMIUM_SHELL?.status==='ACTIVE',null,{timeout:120000});
            await page.waitForTimeout(800);
            const out={schema:'GMFQ_PRODUCT_LANGUAGE_DIAGNOSTIC_V1',status:'PASS_OBSERVATIONAL',views:{}};
            for(const view of VIEWS){
              await page.evaluate(v=>window.showView?.(v),view);
              await page.waitForTimeout(view==='ratesdesk'?400:180);
              out.views[view]=await page.evaluate(v=>{
                const root=document.getElementById(v);
                const clean=x=>String(x||'').replace(/\s+/g,' ').trim();
                const headings=[...root.querySelectorAll('h1,h2,h3,h4,[class*="title"],[class*="Title"],[class*="headline"],[class*="Headline"]')]
                  .filter(x=>x.offsetParent!==null).map(x=>clean(x.textContent)).filter(Boolean);
                const shortLabels=[...root.querySelectorAll('button,.badge,.pill,.label,[class*="label"],[class*="Label"],[class*="kicker"],[class*="Kicker"]')]
                  .filter(x=>x.offsetParent!==null).map(x=>clean(x.textContent)).filter(x=>x&&x.length<=90);
                return {headings:[...new Set(headings)].slice(0,60),labels:[...new Set(shortLabels)].slice(0,100),sample:clean(root.innerText).slice(0,1800)};
              },view);
            }
            fs.writeFileSync('/tmp/product-language-diagnostic-v1.json',JSON.stringify(out,null,2));
            console.log(JSON.stringify(out,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node product-language-audit.js
      - uses: actions/upload-artifact@v4
        with:
          name: product-language-diagnostic-v1
          path: /tmp/product-language-diagnostic-v1.json
          if-no-files-found: error
