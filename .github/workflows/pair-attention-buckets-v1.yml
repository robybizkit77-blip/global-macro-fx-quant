name: Pair Attention Buckets V1

on:
  workflow_dispatch:
  push:
    branches:
      - research-transmission-conviction-layer-v1-2026-10-07
    paths:
      - 'validation/PAIR_COMPACT_PAYLOAD_V1_2026-10-07.json'
      - 'validation/build_pair_attention_buckets_v1.py'
      - 'validation/validate_pair_attention_buckets_v1.py'
      - '.github/workflows/pair-attention-buckets-v1.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pair attention buckets
        run: python validation/build_pair_attention_buckets_v1.py
      - name: Validate pair attention buckets
        run: python validation/validate_pair_attention_buckets_v1.py
      - name: Commit generated payload if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/PAIR_ATTENTION_BUCKETS_V1_2026-10-07.json
          if git diff --cached --quiet; then
            echo 'No attention bucket change'
            exit 0
          fi
          git commit -m 'Update pair attention buckets payload'
          git push origin HEAD:research-transmission-conviction-layer-v1-2026-10-07
