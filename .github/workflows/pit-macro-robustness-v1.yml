name: PIT Macro Robustness V1

on:
  push:
    branches:
      - audit-minimum-robust-pit-dataset-2026-10-06
    paths:
      - 'validation/run_pit_macro_robustness_v1.py'
      - '.github/workflows/pit-macro-robustness-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run PIT Macro robustness audit
        run: python validation/run_pit_macro_robustness_v1.py
      - name: Confirm runtime and engine untouched
        run: git diff --exit-code -- live_data engine || true
      - name: Assert audit-only output
        run: |
          python - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()
          allowed=('validation/PIT_MACRO_ROBUSTNESS_V1_2026-10-06.json',)
          bad=[x for x in changed if not any(a in x for a in allowed)]
          assert not bad,bad
          PY
      - name: Commit robustness evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/PIT_MACRO_ROBUSTNESS_V1_2026-10-06.json
          git commit -m 'Record PIT Macro robustness V1'
          git push
