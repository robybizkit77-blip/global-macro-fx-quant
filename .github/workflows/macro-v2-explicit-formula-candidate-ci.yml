name: Macro V2 explicit domestic formula candidate QA (research, unscheduled)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/macro-v2-explicit-formula-candidate-ci.yml'
      - 'validation/macro/v2_domestic_candidate_explicit_formula_v1.py'
      - 'validation/macro/test_v2_domestic_candidate_explicit_formula_v1.py'
      - 'validation/macro/v2_source_robustness_triage_v1.py'
      - 'validation/macro/test_v2_source_robustness_triage_v1.py'
      - 'validation/macro/v2_zero_mad_ordinal_quality_v1.py'
      - 'validation/macro/test_v2_zero_mad_ordinal_quality_v1.py'
      - 'validation/macro/fixtures/v2_g8_frozen_domestic_research_coordinates_2026_10_27.json'
      - 'validation/macro/v2_core_beta_evidence_desk_v1.py'
      - 'validation/macro/test_v2_core_beta_evidence_desk_v1.py'
      - 'validation/macro/MACRO_V2_EXPLICIT_DOMESTIC_FORMULA_CANDIDATE_2026-10-27.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-formula:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test fixed formula, 8 country axes, sensitivity and no live writes
        run: |
          python -m unittest validation.macro.test_v2_domestic_candidate_explicit_formula_v1 -v
          # Read-only regression on a visibly OLD Oct-27 economic research fixture.
          python - <<'PY'
          import json
          from pathlib import Path
          from validation.macro.test_v2_domestic_candidate_explicit_formula_v1 import frozen_research_shadow
          from validation.macro.v2_domestic_candidate_explicit_formula_v1 import build
          x=build(frozen_research_shadow(),json.loads(Path('live_data/sections/D.json').read_text()))
          assert x['economic_as_of']=='2026-10-27'
          assert [x['summary'][k] for k in (
              'countries_robust_hypothetical_axis_shift_0p10_z',
              'countries_robust_hypothetical_axis_shift_0p25_z',
              'countries_robust_hypothetical_axis_shift_0p50_z')] == [4,2,0]
          assert x['safe_to_publish_D'] is False
          Path('/tmp/gmfq-domestic-macro-candidate.json').write_text(json.dumps(x,indent=2)+'\n')
          print('FROZEN_2026_10_27_G8_STRESS_4_2_0_RESEARCH_ONLY')
          PY
      - name: Audit current source availability independently of frozen formula
        id: admission
        run: |
          python -m validation.macro.v2_domestic_candidate_explicit_formula_v1 --readiness-only --out /tmp/gmfq-current-macro-input-readiness.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads(Path('/tmp/gmfq-current-macro-input-readiness.json').read_text())
          assert x['schema']=='GMFQ_MACRO_V2_G8_CURRENT_SOURCE_READINESS_V1'
          assert x['eligible_to_publish_D'] is False
          assert x['eligible_to_recompute_28_pairs'] is False
          assert x['no_missing_z_substituted'] is True
          assert x['zero_mad_ordinals_never_become_numeric_features'] is True
          assert x['zero_mad_context_descriptors_validated']==len(x['zero_mad_source_keys'])
          assert x['currencies_with_three_research_axes']+x['currencies_blocked']==8
          for key in x['zero_mad_source_keys']:
              ccy,pillar=key.split('.')
              row=x['countries'][ccy]['axes'][pillar]
              desc=row['zero_mad_descriptive_context_only']
              assert desc is not None
              assert desc['numeric_replacement_z'] is None
              assert desc['eligible_for_activity_score'] is False
              assert desc['not_historical_PIT'] is True
              assert row['strict_numeric_z'] is None
              assert row['z_available_for_RESEARCH_ONLY'] is False
          if 'EUR.labour' in x['zero_mad_source_keys']:
              eur=x['countries']['EUR']['axes']['labour']
              assert eur['upstream_status']=='NO_Z_ZERO_ROBUST_DISPERSION'
              assert eur['zero_mad_descriptive_context_only']['ordinal_relation']=='ABOVE_ALL_PRIOR'
              assert x['strict_eight_country_candidate_allowed_now'] is False
          complete=x['strict_eight_country_candidate_allowed_now']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('complete='+str(complete).lower()+'\n')
          print('MACRO_CURRENT_SOURCE_'+('EIGHT_RESEARCH_AXES_ONLY' if complete else 'BLOCKED_MISSING_Z'))
          print('BLOCKERS:',x['blocked'])
          print('ZERO_MAD_ORDINAL_DESCRIPTORS:',x['zero_mad_context_descriptors_validated'])
          PY
      - name: Audit first-web 24-axis gaps and exact frozen candidate boundary margins
        run: |
          python -m unittest validation.macro.test_v2_source_robustness_triage_v1 -v
          python -m validation.macro.v2_g8_24_axis_training_history_gap_audit_v1 --output /tmp/gmfq-macro-source-gap-20261026.json
          python -m validation.macro.v2_source_robustness_triage_v1 \
            --gap /tmp/gmfq-macro-source-gap-20261026.json \
            --candidate /tmp/gmfq-domestic-macro-candidate.json \
            --readiness /tmp/gmfq-current-macro-input-readiness.json \
            --out /tmp/gmfq-macro-source-robustness-triage.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/gmfq-macro-source-robustness-triage.json').read_text())
          n=r['summary']
          assert r['schema']=='GMFQ_MACRO_V2_SOURCE_AND_ROBUSTNESS_TRIAGE_V1'
          assert n['g8_currencies']==8 and n['source_axes']==24
          assert n['fully_certified_historical_PIT_axes']==0
          assert n['candidate_countries_weight_robust']+n['candidate_countries_weight_ambiguous']==8
          assert set(n['missing_window_axes'])=={'USD.inflation','CHF.labour'}
          assert n['mathematically_contiguous_windows']==22
          assert r['snapshots_are_not_synchronous_and_cannot_be_joined_into_backtest']
          assert not r['safe_to_publish_new_D'] and not r['safe_to_recalculate_28_pairs']
          assert not r['safe_to_use_for_beta_or_forward'] and not r['writes_live_data']
          print('MACRO_V2_24_AXIS_SOURCE_AND_EXACT_STRESS_RESEARCH_ONLY_PASS',n)
          PY
      - name: Build downloadable integrated beta evidence review, without new FX scoring
        if: steps.admission.outputs.complete == 'true'
        run: |
          python -m unittest validation.macro.test_v2_core_beta_evidence_desk_v1 -v
          python -m validation.macro.v2_core_beta_evidence_desk_v1 --as-of "$(TZ=Europe/Rome date +%Y-%m-%d)" --receipt /tmp/gmfq-core-beta-evidence-desk.json --html /tmp/gmfq-core-beta-evidence-desk.html
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/gmfq-core-beta-evidence-desk.json').read_text())
          h=Path('/tmp/gmfq-core-beta-evidence-desk.html').read_text()
          assert x['schema']=='GMFQ_MACRO_V2_G8_28PAIR_BETA_EVIDENCE_DESK_V1'
          assert x['summary']['country_count']==8 and x['summary']['legacy_pair_count']==28
          kinds=[r['six_month_source_class'] for r in x['countries'].values()]
          assert x['summary']['official_policy_pricing']==kinds.count('OFFICIAL_POLICY_PRICING')
          assert x['summary']['indicative_policy_pricing']==kinds.count('ESTIMATED_POLICY_PRICING_NOT_OFFICIAL')
          assert x['summary']['pre_decision_6m_quotes']==sum(y.startswith('PRE_DECISION_') for y in kinds)
          assert x['summary']['context_only_non_policy_6m']==8-x['summary']['official_policy_pricing']-x['summary']['indicative_policy_pricing']
          cad=x['countries']['CAD']
          assert cad['official_current_cb_rate_pct']==2.50
          if cad['six_month_source_class']=='PRE_DECISION_OFFICIAL_QUOTE_NO_CURRENT_POLICY_DELTA':
              assert cad['six_month_policy_delta_bp'] is None
              assert cad['ois_prior_policy_rate_pct_if_pre_decision']==2.25
          else:
              assert cad['six_month_source_class']=='OFFICIAL_POLICY_PRICING'
              assert cad['six_month_policy_delta_bp'] is not None
          assert x['summary']['new_country_FX_scores']==0
          assert not x['safe_to_republish_D'] and not x['forecast_or_entry_generated']
          assert h.count('<article class="country">')==8
          print('CORE_V2_INTEGRATED_BETA_RESEARCH_PREVIEW_PASS')
          PY
      - name: Explicitly withhold Beta preview when Macro data are incomplete
        if: steps.admission.outputs.complete != 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/gmfq-current-macro-input-readiness.json').read_text())
          assert x['strict_eight_country_candidate_allowed_now'] is False
          assert x['currencies_blocked'] >= 1
          withheld={
              'status':'WITHHELD_CURRENT_BETA_ECONOMIC_INPUT_NOT_COMPUTABLE',
              'economic_source_as_of':x['as_of'],
              'source_blockers':x['blocked'],
              'zero_mad_descriptive_context':{
                  c+'.'+p: data['zero_mad_descriptive_context_only']
                  for c,row in x['countries'].items()
                  for p,data in row['axes'].items()
                  if data.get('zero_mad_descriptive_context_only') is not None
              },
              'zero_mad_numeric_substitutions':0,
              'beta_preview_generated':False,
              'current_FX_scores_generated':0,
              'current_28_pair_theses_generated':0,
              'safe_to_publish_D':False,
              'note':'Archived 27-Oct regression PASS is NOT a current G8 Beta validation.',
          }
          Path('/tmp/gmfq-core-beta-withheld.json').write_text(json.dumps(withheld,indent=2)+'\n')
          print('BETA_PREVIEW_WITHHELD_CORRECTLY',x['blocked'])
          PY
      - name: Check exact forbidden publication diff
        run: |
          git diff --exit-code -- live_data payload site dashboard
          test -z "$(git status --porcelain -- live_data payload site dashboard)"
      - uses: actions/upload-artifact@v4
        with:
          name: macro-v2-domestic-candidate-${{ github.run_id }}
          path: |
            /tmp/gmfq-domestic-macro-candidate.json
            /tmp/gmfq-current-macro-input-readiness.json
            /tmp/gmfq-macro-source-gap-20261026.json
            /tmp/gmfq-macro-source-robustness-triage.json
            /tmp/gmfq-core-beta-withheld.json
            /tmp/gmfq-core-beta-evidence-desk.json
            /tmp/gmfq-core-beta-evidence-desk.html
          if-no-files-found: error
          retention-days: 30
