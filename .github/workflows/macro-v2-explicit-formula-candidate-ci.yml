name: Macro V2 explicit domestic formula candidate QA (research, unscheduled)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/macro-v2-explicit-formula-candidate-ci.yml'
      - 'validation/macro/v2_g8_growth_cross_country_comparability_v1.py'
      - 'validation/macro/test_v2_g8_growth_cross_country_comparability_v1.py'
      - 'validation/macro/MACRO_V2_G8_GDP_COMPARABILITY_2026-10-29.md'
      - 'validation/macro/v2_domestic_candidate_explicit_formula_v1.py'
      - 'validation/macro/test_v2_domestic_candidate_explicit_formula_v1.py'
      - 'validation/macro/v2_core_beta_evidence_desk_v1.py'
      - 'validation/macro/test_v2_core_beta_evidence_desk_v1.py'
      - 'validation/macro/MACRO_V2_EXPLICIT_DOMESTIC_FORMULA_CANDIDATE_2026-10-27.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-formula:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test fixed formula, 8 country axes, sensitivity and no live writes
        run: |
          python -m unittest validation.macro.test_v2_domestic_candidate_explicit_formula_v1 -v
          python -m unittest validation.macro.test_v2_core_beta_evidence_desk_v1 -v
          python -m validation.macro.v2_domestic_candidate_explicit_formula_v1 --as-of 2026-10-27 --out /tmp/gmfq-domestic-macro-candidate.json
      - name: Build downloadable integrated beta evidence review, without new FX scoring
        run: |
          python -m validation.macro.v2_core_beta_evidence_desk_v1 --as-of 2026-10-28 --receipt /tmp/gmfq-core-beta-evidence-desk.json --html /tmp/gmfq-core-beta-evidence-desk.html
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/gmfq-core-beta-evidence-desk.json').read_text())
          h=Path('/tmp/gmfq-core-beta-evidence-desk.html').read_text()
          assert x['schema']=='GMFQ_MACRO_V2_G8_28PAIR_BETA_EVIDENCE_DESK_V1'
          assert x['summary']['country_count']==8 and x['summary']['legacy_pair_count']==28
          kinds=[r['six_month_source_class'] for r in x['countries'].values()]
          assert x['summary']['official_policy_pricing']==kinds.count('OFFICIAL_POLICY_PRICING')
          assert x['summary']['indicative_policy_pricing']==kinds.count('ESTIMATED_POLICY_PRICING_NOT_OFFICIAL')
          assert x['summary']['pre_decision_6m_quotes']==sum(y.startswith('PRE_DECISION_') for y in kinds)
          assert x['summary']['context_only_non_policy_6m']==8-x['summary']['official_policy_pricing']-x['summary']['indicative_policy_pricing']
          cad=x['countries']['CAD']
          assert cad['official_current_cb_rate_pct']==2.50
          if cad['six_month_source_class']=='PRE_DECISION_OFFICIAL_QUOTE_NO_CURRENT_POLICY_DELTA':
              assert cad['six_month_policy_delta_bp'] is None
              assert cad['ois_prior_policy_rate_pct_if_pre_decision']==2.25
          else:
              assert cad['six_month_source_class']=='OFFICIAL_POLICY_PRICING'
              assert cad['six_month_policy_delta_bp'] is not None
          assert x['summary']['new_country_FX_scores']==0
          assert not x['safe_to_republish_D'] and not x['forecast_or_entry_generated']
          assert h.count('<article class="country">')==8
          print('CORE_V2_INTEGRATED_BETA_RESEARCH_PREVIEW_PASS')
          PY
      - name: Test same-quarter GDP versus own-history intensity across all 28 pairs
        run: |
          python -m unittest validation.macro.test_v2_g8_growth_cross_country_comparability_v1 -v
          python -m validation.macro.v2_g8_growth_cross_country_comparability_v1 --out /tmp/gmfq-g8-gdp-comparability-20261029.json
          python - <<'PY'
          import json,os
          x=json.load(open('/tmp/gmfq-g8-gdp-comparability-20261029.json'))
          t=x['summary']
          assert t['economies']==8 and t['pairs_audited_for_descriptive_representation']==28
          assert (t['within_history_vs_qoq_order_agreements']+
                  t['within_history_vs_qoq_order_inversions']+
                  t['pairs_with_order_ties'])==28
          assert t['original_release_day_binary_certified_training_panels']==0
          assert t['eligible_cross_country_FX_strength_pairs']==0
          assert t['pairs_with_EUR_or_CHF_definition_caveats']==13
          assert all(x[k] is False for k in ('safe_to_publish_D',
                     'safe_to_recalculate_28_pairs','safe_for_beta',
                     'safe_for_forward','writes_live_data'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('### G8 GDP economic comparability: research, not Forex ranking\\n')
              out.write(f"- 28 cross-economy GDP QoQ vs own-history z comparisons: {t['within_history_vs_qoq_order_agreements']} order agreements, {t['within_history_vs_qoq_order_inversions']} inversions, {t['pairs_with_order_ties']} ties.\\n")
              out.write('- Q2-2026 original GDP first-web source statements, USD SAAR converted; EUR population and CHF sports flags explicit. No GDP-to-FX ranking or model promotion.\\n')
          PY
      - name: Check exact forbidden publication diff
        run: |
          git diff --exit-code -- live_data payload site dashboard
          test -z "$(git status --porcelain -- live_data payload site dashboard)"
      - uses: actions/upload-artifact@v4
        with:
          name: macro-v2-domestic-candidate-${{ github.run_id }}
          path: |
            /tmp/gmfq-domestic-macro-candidate.json
            /tmp/gmfq-core-beta-evidence-desk.json
            /tmp/gmfq-core-beta-evidence-desk.html
            /tmp/gmfq-g8-gdp-comparability-20261029.json
          if-no-files-found: error
          retention-days: 30
