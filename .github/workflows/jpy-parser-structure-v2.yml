name: JPY Parser Structure V2
on:
  push:
    branches:
      - audit-jpy-reaction-source-probe-v1-2026-10-06
    paths:
      - validation/inspect_jpy_parser_structure_v2.py
      - .github/workflows/jpy-parser-structure-v2.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas openpyxl xlrd
      - name: Inspect parser structure
        run: python validation/inspect_jpy_parser_structure_v2.py
      - name: Strict engine live OOS guard
        run: |
          if git diff --name-only HEAD^ | grep -E '^(engine/|live_data/|validation/CANONICAL_ENGINE_OOS_T0_V3_2026-10-01.json$)'; then
            echo 'Protected runtime/OOS files changed'; exit 1
          fi
      - name: Commit inspection evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/JPY_PARSER_STRUCTURE_V2_2026-10-06.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record JPY parser structure V2 evidence'
          git push
