name: Final Visual QA V1

# The historical workflow name is retained, but the actual current routes
# replace quarantined root dashboard globals and archived 16-view assumptions.
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'payload/**'
      - 'dashboard/**'
      - 'site/control-room-preview/**'
      - 'site/fx-quant-v2/next/**'
      - 'live_data/**'
      - 'validation/qa_final_visual_active_routes_v2.cjs'
      - '.github/workflows/final-visual-qa-v1.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'payload/**'
      - 'dashboard/**'
      - 'site/control-room-preview/**'
      - 'site/fx-quant-v2/next/**'
      - 'live_data/**'
      - 'validation/qa_final_visual_active_routes_v2.cjs'
      - '.github/workflows/final-visual-qa-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('final-visual-qa-pr-{0}', github.event.pull_request.number) || 'final-visual-qa-main' }}
  cancel-in-progress: true

jobs:
  visual-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate current QA syntax
        run: node --check validation/qa_final_visual_active_routes_v2.cjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/final-visual-qa-server.log 2>&1 &
          sleep 2
      - name: Verify real redirect, G8 / 28-pair feeds and 8 Next sections on desktop/mobile
        run: node validation/qa_final_visual_active_routes_v2.cjs
      - name: Preserve screenshots and audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-visual-qa-active-routes
          path: visual-qa-evidence/
          if-no-files-found: warn
          retention-days: 14
