name: OIS G8 History Persistent Daily V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ois-g8-history-persistent-daily-v1.yml'
      - 'validation/cb_pricing/ois_g8_history_snapshot_v1.py'
      - 'validation/cb_pricing/test_ois_g8_history_snapshot_v1.py'
      - 'validation/cb_pricing/ois_g8_schedule_gate_v1.py'
      - 'validation/cb_pricing/test_ois_g8_schedule_gate_v1.py'
      - 'validation/cb_pricing/push_ois_refresh_with_lease_v1.py'
      - 'validation/cb_pricing/test_push_ois_refresh_with_lease_v1.py'
      - 'validation/cb_pricing/OIS_SOURCE_ACCESS_PLAN_V1_2026-10-19.json'
      - 'validation/cb_pricing/audit_ois_source_access_v1.py'
      - 'validation/cb_pricing/test_audit_ois_source_access_v1.py'
      - 'validation/cb_pricing/build_ois_source_readiness_view_v1.py'
      - 'validation/cb_pricing/check_ois_readiness_parity_v1.py'
      - 'validation/cb_pricing/test_check_ois_readiness_parity_v1.py'
      - 'validation/cb_pricing/test_build_ois_source_readiness_view_v1.py'
      - 'live_data/sections/OIS_SOURCE_READINESS_VIEW.json'
  workflow_dispatch:
  schedule:
    # Europe/Rome target: 08:15 on working days.
    # Duplicate UTC entries cover CET/CEST; accept the correct scheduled slot even if GitHub starts late.
    - cron: '15 6 * * 1-5'
    - cron: '15 7 * * 1-5'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ois-g8-history-persistent-daily-v1.yml'
      - 'validation/cb_pricing/ois_g8_history_snapshot_v1.py'
      - 'validation/cb_pricing/test_ois_g8_history_snapshot_v1.py'
      - 'validation/cb_pricing/ois_g8_schedule_gate_v1.py'
      - 'validation/cb_pricing/test_ois_g8_schedule_gate_v1.py'
      - 'validation/cb_pricing/push_ois_refresh_with_lease_v1.py'
      - 'validation/cb_pricing/test_push_ois_refresh_with_lease_v1.py'
      - 'validation/cb_pricing/OIS_SOURCE_ACCESS_PLAN_V1_2026-10-19.json'
      - 'validation/cb_pricing/audit_ois_source_access_v1.py'
      - 'validation/cb_pricing/test_audit_ois_source_access_v1.py'
      - 'validation/cb_pricing/build_ois_source_readiness_view_v1.py'
      - 'validation/cb_pricing/check_ois_readiness_parity_v1.py'
      - 'validation/cb_pricing/test_check_ois_readiness_parity_v1.py'
      - 'validation/cb_pricing/test_build_ois_source_readiness_view_v1.py'
      - 'live_data/sections/OIS_SOURCE_READINESS_VIEW.json'
      - 'validation/cb_pricing/ois_estimated_snapshot_v1.py'
      - 'validation/cb_pricing/ois_same_contract_history_v1.py'
      - 'validation/cb_pricing/reconcile_ois_secondary_conflicts_v1.py'
      - 'validation/cb_pricing/test_reconcile_ois_secondary_conflicts_v1.py'
      - 'validation/cb_pricing/history/OIS_SAME_CONTRACT_CONFLICTS_V1.jsonl'
      - 'validation/cb_pricing/test_ois_same_contract_history_v1.py'
      - 'validation/cb_pricing/history/OIS_SAME_CONTRACT_QUOTES_V1.jsonl'
      - 'validation/cb_pricing/build_ois_operational_view_v1.py'
      - 'validation/cb_pricing/build_cb_pricing_estimated_v1.py'
      - 'validation/cb_pricing/collect_cb_pricing_estimated_live_v1.py'
      - 'validation/cb_pricing/collect_nzd_asx_directional_proxy_v1.py'

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ois-g8-pr-{0}', github.event.pull_request.number) || 'ois-operational-main-writer-v1' }}
  cancel-in-progress: false

jobs:
  persist-g8-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # When this run waited behind another OIS writer, event SHA is stale.
          # For production always start from the newest validated main.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 50
          persist-credentials: true

      - name: Rome schedule gate (DST and GitHub cron delay tolerant)
        id: gate
        shell: bash
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          python3 validation/cb_pricing/ois_g8_schedule_gate_v1.py \
            --event "$GH_EVENT_NAME" --cron "$GH_EVENT_SCHEDULE" \
            --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.should_run == 'true'
        with:
          python-version: '3.12'

      - name: Test G8 history, DST gate and safe main-writer lease
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python validation/cb_pricing/test_ois_g8_history_snapshot_v1.py
          python validation/cb_pricing/test_ois_g8_schedule_gate_v1.py
          python validation/cb_pricing/test_push_ois_refresh_with_lease_v1.py

      - name: Snapshot protected official runtime
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          sha256sum live_data/sections/OIS_DATA.json > /tmp/OIS_DATA.before.sha256
          sha256sum live_data/sections/NATIVE_CB_DATA.json > /tmp/NATIVE_CB_DATA.before.sha256

      - name: Refresh informational USD EUR CHF curves
        if: steps.gate.outputs.should_run == 'true'
        run: python validation/cb_pricing/collect_cb_pricing_estimated_live_v1.py

      - name: Refresh NZD directional market proxy
        if: steps.gate.outputs.should_run == 'true'
        run: python validation/cb_pricing/collect_nzd_asx_directional_proxy_v1.py

      - name: Quarantine conflicting source bars before estimated/G8 persistence
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python validation/cb_pricing/test_reconcile_ois_secondary_conflicts_v1.py
          python validation/cb_pricing/reconcile_ois_secondary_conflicts_v1.py --write

      - name: Rebuild estimated pricing layer
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          python validation/cb_pricing/build_cb_pricing_estimated_v1.py
          python validation/cb_pricing/test_cb_pricing_estimated_v1.py

      - name: Verify same-contract quote lineage
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python validation/cb_pricing/test_ois_same_contract_history_v1.py
          python validation/cb_pricing/ois_same_contract_history_v1.py --write

      - name: Persist estimated homogeneous snapshots
        if: steps.gate.outputs.should_run == 'true'
        run: python validation/cb_pricing/ois_estimated_snapshot_v1.py

      - name: Rebuild G8 operational OIS view
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          python validation/cb_pricing/build_ois_operational_view_v1.py
          python validation/cb_pricing/test_ois_operational_view_v1.py

      - name: Audit missing OIS sources and licensing (read-only, no promotion)
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python validation/cb_pricing/test_audit_ois_source_access_v1.py
          python validation/cb_pricing/audit_ois_source_access_v1.py \
            --summary "$GITHUB_STEP_SUMMARY" \
            --output /tmp/ois-source-access-audit-v1.json

      - name: Generate read-only OIS source readiness for Preview v10
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python validation/cb_pricing/test_build_ois_source_readiness_view_v1.py
          python validation/cb_pricing/build_ois_source_readiness_view_v1.py
          python validation/cb_pricing/check_ois_readiness_parity_v1.py
          python validation/cb_pricing/test_check_ois_readiness_parity_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('live_data/sections/OIS_SOURCE_READINESS_VIEW.json').read_text())
          view=json.loads(Path('live_data/sections/OIS_OPERATIONAL_VIEW.json').read_text())
          assert x['schema']=='GMFQ_OIS_SOURCE_READINESS_VIEW_V1'
          assert x['operational_summary']==view['summary']
          assert x['blocked_currency_count']==view['summary']['operational_withheld']
          assert x['prices_omitted'] and x['no_automatic_promotions']
          assert x['no_core_score_effect'] and x['no_bias_effect']
          assert x['no_sizing_effect'] and x['no_backtest_effect']
          pending={k for k,row in view['currencies'].items()
                   if row['operational_status'] in {'WITHHELD','GREEN_ESTIMATED'}}
          assert set(x['currencies'])==pending
          print('OIS_SOURCE_READINESS_PUBLIC_CONTRACT_PASS',x['as_of'],x['blocked_currency_count'])
          PY

      - name: Persist unified G8 curve history
        if: steps.gate.outputs.should_run == 'true'
        run: python validation/cb_pricing/ois_g8_history_snapshot_v1.py

      - name: Verify G8 coverage and lineage
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('validation/cb_pricing/history/OIS_G8_SNAPSHOTS_V1.jsonl')
          rows=[json.loads(x) for x in p.read_text().splitlines() if x.strip()]
          latest={}
          for row in rows:
              latest[row['currency']]=row
          want={'USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'}
          assert set(latest)==want,(set(latest),want)
          view=json.loads(Path('live_data/sections/OIS_OPERATIONAL_VIEW.json').read_text())
          for c,row in latest.items():
              current=view['currencies'][c]
              assert row['schema']=='GMFQ_OIS_G8_SNAPSHOT_V1',row
              assert row['operational_status']==current['operational_status'],(c,row,current)
              assert row['method_id'],row
              assert set(row['horizons'])=={'3m','6m','12m'},row
              if current['operational_status']=='WITHHELD':
                  assert row['quality']=='UNAVAILABLE',row
                  assert row['method_id']=='WITHHELD_FAIL_CLOSED_V1',row
                  assert row['source_as_of'] is None,row
                  assert row['backtest_eligible_as_official'] is False,row
                  assert all(v['rate'] is None and v['policy_delta_bp'] is None
                             for v in row['horizons'].values()),row
              else:
                  assert row['quality'] in {'OFFICIAL_CERTIFIED','ESTIMATED_INFORMATIONAL'},row
                  assert row['source_as_of']==current['as_of'],row
                  assert all(v['rate'] is not None for v in row['horizons'].values()),row
          print('OIS_G8_HISTORY_COVERAGE_PASS',view['summary'])
          PY

      - name: Enforce official runtime immutability
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          sha256sum -c /tmp/OIS_DATA.before.sha256
          sha256sum -c /tmp/NATIVE_CB_DATA.before.sha256
          git diff --exit-code -- live_data/sections/OIS_DATA.json live_data/sections/NATIVE_CB_DATA.json

      - name: Enforce writable scope
        id: scope
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          changed=sorted(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={
            'live_data/sections/CB_PRICING_ESTIMATED_LIVE_QUOTES.json',
            'live_data/sections/NZD_CB_PRICING_DIRECTIONAL_PROXY.json',
            'live_data/sections/CB_PRICING_ESTIMATED.json',
            'live_data/sections/OIS_OPERATIONAL_VIEW.json',
            'live_data/sections/OIS_SOURCE_READINESS_VIEW.json',
            'validation/cb_pricing/history/OIS_ESTIMATED_SNAPSHOTS_V1.jsonl',
            'validation/cb_pricing/history/OIS_SAME_CONTRACT_QUOTES_V1.jsonl',
            'validation/cb_pricing/history/OIS_SAME_CONTRACT_CONFLICTS_V1.jsonl',
            'validation/cb_pricing/history/OIS_G8_SNAPSHOTS_V1.jsonl',
          }
          assert set(changed).issubset(allowed),(changed,sorted(allowed))
          print('OIS_G8_HISTORY_SCOPE_PASS',changed)
          open('/tmp/ois-g8-history-changed.flag','w').write('yes\n' if changed else 'no\n')
          PY
          echo "changed=$(cat /tmp/ois-g8-history-changed.flag)" >> "$GITHUB_OUTPUT"

      - name: Commit validated G8 OIS history to main with bounded safe rebase
        if: steps.gate.outputs.should_run == 'true' && steps.scope.outputs.changed == 'yes' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python validation/cb_pricing/push_ois_refresh_with_lease_v1.py \
            --base-sha "$BASE_SHA" --mode g8 --attempts 4

      - name: Confirm clean no-change case
        if: steps.gate.outputs.should_run == 'true' && steps.scope.outputs.changed == 'no'
        run: git diff --exit-code
