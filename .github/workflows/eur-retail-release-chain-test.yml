name: EUR Retail Release Chain Test

on:
  push:
    branches: [engine-freeze-v1-2026-10-02]
    paths:
      - validation/test_eur_retail_release_chain.py
      - .github/workflows/eur-retail-release-chain-test.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engine-freeze-v1-2026-10-02
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf
      - name: Test release chain
        run: python validation/test_eur_retail_release_chain.py
