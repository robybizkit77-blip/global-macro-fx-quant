name: Liquidity BoE GBP Conditions Apply Proof V1

on:
  push:
    branches:
      - release-candidate-daily-data-orchestrator-v1-2026-10-12
    paths:
      - 'validation/fetch_boe_gbp_credit_conditions_candidate.py'
      - 'validation/apply_boe_gbp_credit_conditions_candidate.py'
      - '.github/workflows/liquidity-boe-gbp-conditions-apply-proof-v1.yml'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot tracked runtime
        run: sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/runtime.before.sha256
      - name: Collect official BoE GBP conditions candidate
        run: python validation/fetch_boe_gbp_credit_conditions_candidate.py --out /tmp/gbp-conditions.json
      - name: Dry-run controlled applier
        run: python validation/apply_boe_gbp_credit_conditions_candidate.py --candidate /tmp/gbp-conditions.json | tee /tmp/gbp-conditions-dry.json
      - name: Apply on ephemeral runtime copy
        run: |
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/NATIVE_LIQ_DATA.gbp-conditions.json
          python validation/apply_boe_gbp_credit_conditions_candidate.py --candidate /tmp/gbp-conditions.json --runtime /tmp/NATIVE_LIQ_DATA.gbp-conditions.json --apply | tee /tmp/gbp-conditions-apply.json
      - name: Verify append-only GBP conditions contract
        run: |
          python - <<'PY'
          import json
          c=json.load(open('/tmp/gbp-conditions.json'))
          dry=json.load(open('/tmp/gbp-conditions-dry.json'))
          r=json.load(open('/tmp/gbp-conditions-apply.json'))
          original=json.load(open('live_data/sections/NATIVE_LIQ_DATA.json'))['GBP']['conditions']
          applied=json.load(open('/tmp/NATIVE_LIQ_DATA.gbp-conditions.json'))['GBP']['conditions']
          assert c['schema']=='GMFQ_LIQUIDITY_GBP_CCS_CONDITIONS_CANDIDATE_V1', c
          assert c['source']['publisher']=='Bank of England', c
          assert c['proof']['candidate_row_count']==1, c
          assert c['proof']['overlap_count']==42 and c['proof']['exact_match_count']==42, c
          assert c['proof']['exact_match_ratio']==1.0, c
          assert c['proof']['runtime_history_unchanged_by_current_vintage'] is True, c
          assert c['proof']['identity_transform'] is True, c
          assert c['new_observations']==[{'date':'2026-Q3','value':-0.1}], c
          assert dry['status']=='DRY_RUN_UPDATE_AVAILABLE' and dry['applied'] is False, dry
          assert r['status']=='APPENDED' and r['applied'] is True, r
          assert r['appended_observations']==1, r
          assert r['runtime_history_rewritten'] is False and r['publication_performed'] is False, r
          n=len(original['dates'])
          assert applied['dates'][:n]==original['dates']
          assert applied['values'][:n]==original['values']
          assert applied['dates'][-1]=='2026-Q3'
          assert float(applied['values'][-1])==-0.1
          assert len(applied['dates'])==len(applied['values'])==n+1
          print('GBP_CONDITIONS_CONTROLLED_APPLY_PROOF_PASS', c['new_observations'])
          PY
      - name: Verify tracked runtime unchanged
        run: |
          sha256sum -c /tmp/runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
