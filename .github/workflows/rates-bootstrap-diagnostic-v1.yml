name: Rates Bootstrap Diagnostic V1
on:
  push:
    branches:
      - staging-rates-g8-refresh-2026-10-07
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/gmfq-server.log 2>&1 &
          sleep 2
      - name: Diagnose bootstrap only
        run: |
          cat > bootstrap-diagnostic.js <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const consoleErrors=[]; const pageErrors=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            const response=await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(5000);
            const state=await page.evaluate(()=>({
              title:document.title,
              body:(document.body?.innerText||'').slice(0,2000),
              dataset:{...document.documentElement.dataset},
              hasNativeRates:!!(window.NATIVE_RATES_DATA||window.__GMFQ_DATA?.NATIVE_RATES_DATA),
              hasFinalAudit:!!window.GMFQ_POST_GATE_FINAL_AUDIT,
              readyState:document.readyState
            }));
            console.log('BOOTSTRAP_DIAGNOSTIC '+JSON.stringify({http:response?.status(),state,consoleErrors,pageErrors},null,2));
            await browser.close();
          })().catch(e=>{console.error('BOOTSTRAP_DIAGNOSTIC_FATAL '+String(e?.stack||e));process.exit(1)});
          EOF
          node bootstrap-diagnostic.js
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rates-bootstrap-diagnostic
          path: /tmp/gmfq-server.log
