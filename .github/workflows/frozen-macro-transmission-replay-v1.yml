name: Frozen Macro Transmission Replay V1

on:
  push:
    branches:
      - research-transmission-conviction-layer-v1-2026-10-07
    paths:
      - 'validation/replay_transmission_with_frozen_macro_anchor_v1.py'
      - 'validation/FROZEN_MACRO_ANCHOR_PARITY_AUDIT_V1_2026-10-07.json'
      - 'validation/DASHBOARD_PAIR_SIGNED_INPUTS_V1_2026-10-07.json'
      - '.github/workflows/frozen-macro-transmission-replay-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replay strict transmission with frozen Macro anchor
        run: python validation/replay_transmission_with_frozen_macro_anchor_v1.py
      - name: Validate replay
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('validation/FROZEN_MACRO_TRANSMISSION_REPLAY_V1_2026-10-07.json').read_text())
          assert x['schema']=='GMFQ_FROZEN_MACRO_TRANSMISSION_REPLAY_V1'
          assert len(x['pairs'])==28
          assert x['rule_change'] is False
          assert x['distribution']['unchanged_pairs']+x['distribution']['changed_pairs']==28
          assert all(v is False for v in x['guards'].values())
          print(x['distribution'])
          PY
      - name: Commit replay output if changed
        run: |
          if git diff --quiet -- validation/FROZEN_MACRO_TRANSMISSION_REPLAY_V1_2026-10-07.json && git ls-files --error-unmatch validation/FROZEN_MACRO_TRANSMISSION_REPLAY_V1_2026-10-07.json >/dev/null 2>&1; then
            echo 'No replay change'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/FROZEN_MACRO_TRANSMISSION_REPLAY_V1_2026-10-07.json
          git commit -m 'Generate frozen macro transmission replay'
          git push
