name: AUD Macro Contract Diagnostic

on:
  push:
    branches:
      - validation-aud-abs-v1-2026-10-06
    paths:
      - '.github/workflows/aud-contract-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print AUD target series storage schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          series=json.loads(Path('live_data/sections/MACRO_SERIES.json').read_text())
          targets={'AU_CPI_HEADLINE_Q_YOY_history_value','AU_UNEMP_RATE_history_value'}
          for r in series['AUD']:
              if not isinstance(r,dict) or r.get('id') not in targets:
                  continue
              print('TARGET=',r['id'])
              print('KEYS=',sorted(r.keys()))
              for k,v in r.items():
                  if isinstance(v,list):
                      print(k,'len=',len(v),'first=',v[0] if v else None,'last=',v[-1] if v else None)
                  elif isinstance(v,dict):
                      keys=list(v.keys())
                      print(k,'dict_keys_sample=',keys[:5],'last_keys=',keys[-5:] if keys else [])
                  elif k not in ('values',):
                      print(k,'=',v)
          PY
