name: EUR ECB rates probe
on:
  push:
    branches: [test-eur-rates-ecb-2026-09-30]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ECB AAA YC
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,csv,io
          tenors=["2Y","5Y","10Y","30Y"]
          for t in tenors:
              u=f"https://data-api.ecb.europa.eu/service/data/YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_{t}?format=csvdata&startPeriod=2026-09-22"
              r=requests.get(u,timeout=60,headers={"User-Agent":"Mozilla/5.0","Accept":"text/csv"})
              print("TENOR",t,"STATUS",r.status_code,"LEN",len(r.content),r.headers.get("content-type"))
              if r.status_code!=200:
                  print(r.text[:1000]); continue
              rows=list(csv.DictReader(io.StringIO(r.text)))
              for row in rows[-10:]:
                  print("OBS",t,row.get("TIME_PERIOD"),row.get("OBS_VALUE"),row.get("KEY"))
          PY
