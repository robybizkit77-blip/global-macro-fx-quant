name: Liquidity SNB CHF Sight Deposits Diagnostic V1

on:
  push:
    branches:
      - release-candidate-daily-data-orchestrator-v1-2026-10-12
    paths:
      - 'validation/diagnose_snb_chf_sight_deposits_v1.py'
      - '.github/workflows/liquidity-snb-chf-sight-deposits-diagnostic-v1.yml'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare official SNB sight-deposit variants to runtime
        run: python validation/diagnose_snb_chf_sight_deposits_v1.py | tee /tmp/chf-sight-deposits.json
      - name: Enforce diagnostic-only contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/chf-sight-deposits.json'))
          assert d['schema']=='GMFQ_LIQUIDITY_CHF_SIGHT_DEPOSITS_DIAGNOSTIC_V1'
          assert d['status']=='DIAGNOSTIC_ONLY_NO_PROMOTION'
          assert d['runtime_mutated'] is False
          assert d['publication_performed'] is False
          assert d['promotion_performed'] is False
          print('RUNTIME',d['runtime'])
          for k,v in d['results'].items():
              print(k,'best_scale',v.get('best_scale_factor'),'best_score',v.get('best_score'),'error',v.get('error'))
          PY
      - name: Verify tracked runtime unchanged
        run: git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
