name: Forward ECB Reference Outcomes V1 (research only)

on:
  pull_request:
    branches: [main]
    paths:
      # Reference outcome tests depend on the V2 beta source tier and quarantine logic.
      # Include these paths so a change such as PR #863 cannot bypass ECB safety CI.
      - 'validation/macro/v2_core_beta_evidence_desk_v1.py'
      - 'validation/macro/test_v2_core_beta_evidence_desk_v1.py'
      - 'validation/forward/observe_official_ecb_reference_outcomes_v1.py'
      - 'validation/forward/test_observe_official_ecb_reference_outcomes_v1.py'
      - 'validation/forward/observe_v2_research_ecb_reference_returns_v1.py'
      - 'validation/forward/test_observe_v2_research_ecb_reference_returns_v1.py'
      - 'validation/forward/audit_v2_prospective_cohort_independence_v1.py'
      - 'validation/forward/test_audit_v2_prospective_cohort_independence_v1.py'
      - 'validation/forward/V2_FORWARD_COHORT_EVALUATION_CONTRACT_2026-10-28.md'
      - 'validation/macro/v2_eur_labour_zero_mad_diagnostic_v1.py'
      - 'validation/macro/test_v2_eur_labour_zero_mad_diagnostic_v1.py'
      - 'validation/macro/v2_zero_mad_ordinal_quality_v1.py'
      - 'validation/macro/test_v2_zero_mad_ordinal_quality_v1.py'
      - 'validation/macro/V2_ZERO_MAD_ORDINAL_QUALITY_PROTOCOL_2026-10-30.md'
      - 'validation/forward/ECB_FORWARD_REFERENCE_OUTCOMES_RUNBOOK_2026-10-26.md'
      - '.github/workflows/forward-ecb-reference-outcomes-v1.yml'
  workflow_dispatch:
  push:
    # One-time production validation after this pre-existing observer changes.
    # The time gate below still forbids any early or weekend write.
    branches: [main]
    paths: ['.github/workflows/forward-ecb-reference-outcomes-v1.yml']
  workflow_run:
    # Reuse ALREADY scheduled workflows. No additional cron or pipeline.
    # A delayed scheduled Forward completion can recover missed ECB outcomes
    # even when the hourly scheduler has stalled. No retrospective T0.
    # Bot-authored source commits do not reliably trigger push workflows.
    workflows: ['Hourly Certified Alert Readiness V1', 'Forward Frozen Core Prospective Daily V1']
    types: [completed]
  schedule:
    # Europe/Rome weekday 21:15; both clock offsets, strict UTC/DST gate.
    - cron: '15 19 * * 1-5'
    - cron: '15 20 * * 1-5'

permissions:
  contents: write

concurrency:
  group: forward-ecb-reference-outcomes-v1
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate reference outcome source and horizon safety
        run: |
          python -m py_compile validation/forward/observe_official_ecb_reference_outcomes_v1.py validation/forward/test_observe_official_ecb_reference_outcomes_v1.py
          python -m unittest validation.forward.test_observe_official_ecb_reference_outcomes_v1 -v
          python -m unittest validation.forward.test_observe_v2_research_ecb_reference_returns_v1 -v
          python -m unittest validation.forward.test_audit_v2_prospective_cohort_independence_v1 -v
      - name: Confirm current repository has no faux matured outcomes
        run: |
          python -m validation.forward.observe_official_ecb_reference_outcomes_v1 --receipt /tmp/gmfq-forward-ecb-ref-audit.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/gmfq-forward-ecb-ref-audit.json'))
          assert d['status']=='REFERENCE_ONLY_NOT_TRADE_PERFORMANCE'
          assert d['no_fake_costs'] and d['no_trading_pnl_claims']
          assert all(r['trade_net_return'] is None and r['trade_cost_bps'] is None for r in d['new_rows'])
          assert all(r['capture_class']=='FROZEN_CORE_BASELINE_OBSERVATION' for r in d['new_rows'])
          print('PROSPECTIVE_ECB_REFERENCE_ONLY_NO_CERTIFIED_TRADES',d['new_reference_observations'])
          PY
      - name: Verify V2 shadow observer separately, without invented results
        run: |
          python -m validation.forward.observe_v2_research_ecb_reference_returns_v1 --receipt /tmp/v2-research-outcome-audit.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/v2-research-outcome-audit.json'))
          assert d['status']=='FEATURE_OUTCOME_ASSOCIATION_PANEL_ONLY_NO_PREDICTIVE_VALIDATION'
          assert d['no_actual_PnL_or_beta_performance_claim']
          assert all(r['trade_net_return'] is None and
                     r['trade_direction'] is None and
                     r['beta_predictive_accuracy'] is None and
                     r['model_alpha_claim'] is False for r in d['new_rows'])
          print('V2_SHADOW_REFERENCE_OBSERVER_NO_PROFIT_CLAIMS_PASS',d['new_matured_reference_rows'])
          PY
      - name: Require cohort/date independence audit before any V2 validation language
        run: |
          python -m validation.forward.audit_v2_prospective_cohort_independence_v1             --receipt /tmp/gmfq-v2-prospective-cohort-independence.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/gmfq-v2-prospective-cohort-independence.json').read_text())
          assert d['schema']=='GMFQ_V2_PROSPECTIVE_FX_COHORT_DEPENDENCE_AUDIT_V1'
          assert d['number_of_independent_EUR_base_FX_quote_levels_per_date_at_most']==7
          assert d['canonical_28_pair_crosses_per_snapshot']==28
          assert d['no_cross_pair_independence_assumption'] is True
          assert d['no_naive_pair_level_p_values'] is True
          assert d['source_survivorship_audit_includes_missing_unobserved_rows'] is True
          assert d['new_candidate_predictive_accuracy_or_alpha_claimed'] is False
          assert d['allowed_to_promote_D_or_28_pairs'] is False
          print('V2_FORWARD_28_PAIR_DEPENDENCE_COHORT_READINESS_PASS')
          PY
      - name: Diagnose EUR labour zero MAD without modifying the frozen economic formula
        run: |
          python -m unittest validation.macro.test_v2_eur_labour_zero_mad_diagnostic_v1 -v
          python -m validation.macro.v2_eur_labour_zero_mad_diagnostic_v1 --receipt /tmp/gmfq-v2-eur-labour-mad-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/gmfq-v2-eur-labour-mad-audit.json").read_text())
          assert d["schema"]=="GMFQ_EUR_LABOUR_ZERO_MAD_DIAGNOSTIC_V1"
          assert d["authorized_fallback_method"] is None
          assert d["safe_to_use_as_forward_v2_numeric_feature"] is False
          assert d["writes_live_data"] is False
          assert d["writes_frozen_forward_journals"] is False
          print("EUR_LABOUR_SCALE_DIAGNOSTIC", d["status"], d["current_economic_period"])
          PY
      - name: Test research-only zero-MAD ordinal status without numeric fallback
        run: |
          python -m unittest validation.macro.test_v2_zero_mad_ordinal_quality_v1 -v
          python -m validation.macro.v2_zero_mad_ordinal_quality_v1 --receipt /tmp/gmfq-v2-zero-mad-ordinal-quality.json
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path("/tmp/gmfq-v2-zero-mad-ordinal-quality.json").read_text())
          assert v["policy_id"]=="V2-ZERO-MAD-ORDINAL-QUALITY-V1"
          assert v["strict_numeric_z_imputation_count"]==0
          assert v["can_write_forward_v2_journal"] is False
          assert v["can_feed_preregistered_H1"] is False
          assert v["changes_prior_frozen_snapshots"] is False
          assert v["writes_live_data"] is False
          assert all(x["numeric_replacement_z"] is None
                     and x["eligible_for_forward_features"] is False
                     for x in v["zero_mad_components"].values())
          print("ZERO_MAD_ORDINAL_QUALITY_NO_NUMERIC_FALLBACK_PASS",
                sorted(v["zero_mad_components"]))
          PY
      - name: Audit preregistered V2 H1 2Y repricing research (read-only)
        run: |
          python -m py_compile validation/forward/evaluate_v2_h1_2y_repricing_readonly_v1.py
          python -m unittest validation.forward.test_evaluate_v2_h1_2y_repricing_readonly_v1 -v
          python -m validation.forward.evaluate_v2_h1_2y_repricing_readonly_v1 --receipt /tmp/gmfq-v2-h1-research-only.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/gmfq-v2-h1-research-only.json'))
          assert p["protocol"]=="V2-H1-2Y-REPRICING-1W-V1"
          assert p["not_a_v2_signal_or_predictive_validation"] is True
          assert p["writes_live_data"] is False
          d=p["operational_2y_source_readiness"]
          assert d["all_G8_checked"] is True
          assert d["does_not_certify_H1_pair_or_outcome"] is True
          assert d["no_rates_or_forward_journal_mutation"] is True
          assert d["diagnostic_scope"]=="OPERATIONAL_CURRENT_SOURCE_NOT_FROZEN_T0"
          print("H1_2Y_SOURCE_STATUS",{
              c:v["state"] for c,v in d["currency_status"].items()})
          assert p["no_naive_pair_level_inference"] is True
          print("H1_RESEARCH_ONLY_NO_SCORE_NO_PNL",p["status"])
          PY
      - name: Read-only CI cannot touch production
        run: |
          test -z "$(git status --porcelain -- live_data site dashboard payload validation/forward/decision_snapshots)"
          echo ECB_REFERENCE_COMPARISON_CI_NO_PRODUCTION_MUTATION

  observe:
    needs: test
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       (github.event.workflow_run.name == 'Hourly Certified Alert Readiness V1' ||
        github.event.workflow_run.name == 'Forward Frozen Core Prospective Daily V1') &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'schedule')

    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce Rome business day and source clock
        id: gate
        env:
          EVENT_TYPE: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import os
          now=datetime.now(timezone.utc).astimezone(ZoneInfo('Europe/Rome'))
          expected='15 19 * * 1-5' if now.utcoffset().total_seconds()==7200 else '15 20 * * 1-5'
          valid=(now.weekday()<5 and now.hour>=21 and
                 (os.environ['EVENT_TYPE']!='schedule' or os.environ['CRON']==expected))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('valid='+('true' if valid else 'false')+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Forward ECB daily reference comparison\n')
              f.write('- Rome now: '+now.isoformat()+'\n')
              f.write('- Eligible schedule: '+str(valid)+'\n')
              f.write('- Scope: daily ECB fixing movement; NOT realized trading performance.\n')
          print('ECB_REFERENCE_OBSERVER_TIME_GATE',valid, 'trigger', os.environ['EVENT_TYPE'], 'Rome', now.isoformat())
          PY
      - name: Compare only genuine matured snapshot horizons
        if: steps.gate.outputs.valid == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m validation.forward.observe_official_ecb_reference_outcomes_v1 \
            --receipt /tmp/gmfq-forward-ecb-ref-receipt.json --append-journal
          python - <<'PY'
          import json,os
          d=json.load(open('/tmp/gmfq-forward-ecb-ref-receipt.json'))
          assert d['status']=='REFERENCE_ONLY_NOT_TRADE_PERFORMANCE'
          assert d['no_fake_costs'] and d['no_model_effect']
          assert all(r['trade_net_return'] is None and r['trade_pnl'] is None for r in d['new_rows'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('- Newly observed reference comparisons: '+str(d['new_reference_observations'])+'\n')
              f.write('- Missing / waiting: '+str(d['blocked_and_waiting'])+'\n')
          PY
      - name: Observe mature V2 shadow ECB references separately (best effort)
        if: steps.gate.outputs.valid == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Never interfere with existing frozen-Core comparison if V2 research
          # is absent or incomplete. Outcome snapshots are observational only.
          if python -m validation.forward.observe_v2_research_ecb_reference_returns_v1               --receipt /tmp/gmfq-v2-research-reference-observer.json               --append-journal > /tmp/gmfq-v2-research-reference-summary.json; then
            cat /tmp/gmfq-v2-research-reference-summary.json
            python - <<'PY'
          import json,os
          d=json.load(open('/tmp/gmfq-v2-research-reference-summary.json'))
          assert d['status']=='FEATURE_OUTCOME_ASSOCIATION_PANEL_ONLY_NO_PREDICTIVE_VALIDATION'
          assert d['no_actual_PnL_or_beta_performance_claim']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as o:
              o.write('- V2 shadow *reference-only* rows: '+str(d['new_matured_reference_rows'])+
                      '; beta predictive accuracy still NOT certified.\n')
          PY
          else
            echo 'V2_REFERENCE_OBSERVER_FAILED_WITHOUT_BLOCKING_LEGACY_COMPARISONS' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Record V2 date-cluster completeness without false pair-level sample size
        if: steps.gate.outputs.valid == 'true'
        run: |
          python -m validation.forward.audit_v2_prospective_cohort_independence_v1             --receipt /tmp/gmfq-v2-cohort-coverage-daily.json
          python - <<'PY'
          import json,os
          d=json.load(open('/tmp/gmfq-v2-cohort-coverage-daily.json'))
          assert d['no_naive_pair_level_p_values'] and not d['allowed_to_promote_D_or_28_pairs']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as o:
              o.write('- V2 independent prospectively observed *capture days*: '+
                      str(d['total_frozen_capture_date_clusters'])+
                      '; FX 28 pair rows are shared-currency dependent, **NOT 28 trials**.\n')
              for name,x in d['per_horizon'].items():
                  o.write('  - '+name+': matured dates '+
                          str(x['capture_date_clusters_with_elapsed_horizon'])+
                          ', observed rows '+str(x['recorded_reference_pair_rows'])+
                          '/'+str(x['possible_reference_pair_rows_at_matured_dates'])+
                          ', missing '+str(x['not_observed_yet_pair_rows'])+'\n')
          PY
      - name: Prevent other file mutation
        if: steps.gate.outputs.valid == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines()
          allowed={
              'validation/forward/reference_observations/ECB_REFERENCE_COMPARISONS_V1.jsonl',
              'validation/forward/reference_observations/V2_RESEARCH_ECB_REFERENCE_RETURNS_V1.jsonl'
          }
          for line in paths:
              if line[3:] not in allowed:
                  raise SystemExit('UNEXPECTED_REFERENCE_OBSERVER_MUTATION '+line)
          print('FORWARD_REFERENCE_JOURNAL_ONLY')
          PY
      - name: Commit only new non-executable ECB reference comparisons
        if: steps.gate.outputs.valid == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f validation/forward/reference_observations/ECB_REFERENCE_COMPARISONS_V1.jsonl &&                 ! -f validation/forward/reference_observations/V2_RESEARCH_ECB_REFERENCE_RETURNS_V1.jsonl ]]; then
            echo 'NO_MATURED_REFERENCE_OBSERVATIONS_YET' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if test -f validation/forward/reference_observations/ECB_REFERENCE_COMPARISONS_V1.jsonl; then
            git add validation/forward/reference_observations/ECB_REFERENCE_COMPARISONS_V1.jsonl
          fi
          if test -f validation/forward/reference_observations/V2_RESEARCH_ECB_REFERENCE_RETURNS_V1.jsonl; then
            git add validation/forward/reference_observations/V2_RESEARCH_ECB_REFERENCE_RETURNS_V1.jsonl
          fi
          if git diff --cached --quiet; then
            echo 'REFERENCE_COMPARISONS_ALREADY_RECORDED_NO_COMMIT' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Append genuine forward ECB daily reference comparisons (no PnL)"
          # Neither a rebase nor a force push is allowed: each observation
          # must preserve its originating source commit and chronology.
          git push origin HEAD:main
          echo 'Immutable reference-only observations committed on main.' >> "$GITHUB_STEP_SUMMARY"
