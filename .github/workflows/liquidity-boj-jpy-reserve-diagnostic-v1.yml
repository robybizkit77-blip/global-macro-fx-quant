name: Liquidity BOJ JPY Reserve Diagnostic V1

on:
  push:
    branches:
      - release-candidate-daily-data-orchestrator-v1-2026-10-12
    paths:
      - 'validation/diagnose_boj_jpy_reserve_balances_v1.py'
      - '.github/workflows/liquidity-boj-jpy-reserve-diagnostic-v1.yml'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot tracked runtime hash
        run: sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/runtime.before.sha256
      - name: Discover MD08 series and compare with runtime
        run: |
          python validation/diagnose_boj_jpy_reserve_balances_v1.py | tee /tmp/jpy-reserve-diagnostic.json
      - name: Enforce fail-closed diagnostic contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/jpy-reserve-diagnostic.json'))
          assert d['schema']=='GMFQ_LIQUIDITY_JPY_RESERVE_DIAGNOSTIC_V1', d
          assert d['source']['publisher']=='Bank of Japan', d
          assert d['source']['database']=='MD08', d
          assert d['status'] in {'EXACT_MD08_SERIES_RUNTIME_MATCH_PROVEN','WITHHELD_EXACT_SERIES_OR_RUNTIME_MATCH_PENDING'}, d
          assert d['automation_ready'] is False, d
          assert d['runtime_mutated'] is False, d
          assert d['publication_performed'] is False, d
          if d['status']=='EXACT_MD08_SERIES_RUNTIME_MATCH_PROVEN':
              s=d['best_candidate']['score']
              assert s['overlap'] >= 12, s
              assert s['exact_ratio'] == 1.0, s
              assert d['promotion_eligible'] is True, d
          else:
              assert d['promotion_eligible'] is False, d
          print('JPY_RESERVE_DIAGNOSTIC_STATUS',d['status'])
          print('BEST',d['best_candidate'])
          PY
      - name: Verify tracked runtime unchanged
        run: |
          sha256sum -c /tmp/runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
