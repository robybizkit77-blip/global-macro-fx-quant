name: GBP ONS MGSX Temporal Identity V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/sources/gbp_ons_core.py'
      - 'validation/macro/gbp_ons_temporal_guard_v1.py'
      - 'validation/macro/test_gbp_ons_temporal_guard_v1.py'
      - 'validation/macro/stage_gbp_ons_dual_period_repair_v1.py'
      - 'validation/macro/GBP_MGSX_ROLLING_WINDOW_FIRST_RELEASE_MAP_2026-10-20.json'
      - 'validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json'
      - 'validation/test_gbp_ons_source.py'
      - 'validation/fixtures/gbp_ons_unemployment_contract.json'
      - '.github/workflows/macro-persistent-daily-v1.yml'
      - '.github/workflows/gbp-ons-mgsx-temporal-v1.yml'
  push:
    branches: [main]
    paths:
      - 'validation/sources/gbp_ons_core.py'
      - 'validation/macro/gbp_ons_temporal_guard_v1.py'
      - 'validation/macro/test_gbp_ons_temporal_guard_v1.py'
      - 'validation/macro/stage_gbp_ons_dual_period_repair_v1.py'
      - 'validation/macro/GBP_MGSX_ROLLING_WINDOW_FIRST_RELEASE_MAP_2026-10-20.json'
      - 'validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json'
      - 'validation/test_gbp_ons_source.py'
      - 'validation/fixtures/gbp_ons_unemployment_contract.json'
      - '.github/workflows/macro-persistent-daily-v1.yml'
      - '.github/workflows/gbp-ons-mgsx-temporal-v1.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * 1-5'

permissions:
  contents: read

jobs:
  rolling-window-and-first-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registered G8 source identity matches canonical labels
        shell: bash
        run: |
          set -euo pipefail
          python validation/macro/check_macro_source_registry.py > /tmp/registry-audit.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/registry-audit.json'))
          assert d['status']=='PASS',d
          assert d['historical_replay_certified_count']==16,d
          print('MACRO_G8_REGISTRY_SOURCE_CONTRACT_PASS')
          PY
      - name: Verify ONS source parser and builder still respect CPI contract
        run: python validation/test_gbp_ons_source.py
      - name: Prove LFS MGSX centered-month vs canonical end-month and quarantine
        run: python -m unittest validation.macro.test_gbp_ons_temporal_guard_v1 -v
      - name: Certify corrected GBP canonical July/August first-release periods
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gbp-ons-temporal
          python -m validation.macro.gbp_ons_temporal_guard_v1 \
            --receipt /tmp/gbp-ons-temporal/guard.json > /tmp/gbp-ons-temporal/result.log
          python - <<'PY'
          import json,os
          x=json.load(open('/tmp/gbp-ons-temporal/guard.json'))
          assert x['status']=='ALLOW_GBP_LABOUR_SOURCE_REFRESH',x
          assert x['safe_to_persist_gbp_labour'] is True
          assert x['historical_rebase_approved'] is False
          assert x['structural_fx_label_rebase_approved'] is False
          assert x['canonical_source_latest_period']=='2026-08'
          assert x['issues']==[]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## ONS UK LFS first-release source and rolling-month parity\n\n')
              out.write('**GBP labour daily refresh UNBLOCKED**: source July end-month 4.9%, August end-month 4.7%.\n\n')
              out.write('Economic Macro scores and the 28 FX structural judgments are NOT re-certified.\n')
          print('GBP_LFS_FIRST_RELEASE_JULY_AUGUST_RUNTIME_CORRECT_PASS')
          PY
          git diff --exit-code -- live_data/sections/MACRO_SERIES.json live_data/sections/MACRO_THERMOMETER_DATA.json live_data/sections/D.json live_data/sections/PAIR_SETUP_OPERATIONAL_VIEW.json
      - name: Retain corrected UK source temporal audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbp-ons-temporal-audit-${{ github.run_id }}
          path: /tmp/gbp-ons-temporal/
          if-no-files-found: warn
          retention-days: 45
