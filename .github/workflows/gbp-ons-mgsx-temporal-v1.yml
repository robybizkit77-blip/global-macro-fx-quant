name: GBP ONS MGSX Temporal Identity V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/sources/gbp_ons_core.py'
      - 'validation/macro/gbp_ons_temporal_guard_v1.py'
      - 'validation/macro/test_gbp_ons_temporal_guard_v1.py'
      - 'validation/macro/GBP_MGSX_ROLLING_WINDOW_FIRST_RELEASE_MAP_2026-10-20.json'
      - 'validation/test_gbp_ons_source.py'
      - 'validation/fixtures/gbp_ons_unemployment_contract.json'
      - '.github/workflows/macro-persistent-daily-v1.yml'
      - '.github/workflows/gbp-ons-mgsx-temporal-v1.yml'
  push:
    branches: [main]
    paths:
      - 'validation/sources/gbp_ons_core.py'
      - 'validation/macro/gbp_ons_temporal_guard_v1.py'
      - 'validation/macro/test_gbp_ons_temporal_guard_v1.py'
      - 'validation/macro/GBP_MGSX_ROLLING_WINDOW_FIRST_RELEASE_MAP_2026-10-20.json'
      - 'validation/test_gbp_ons_source.py'
      - 'validation/fixtures/gbp_ons_unemployment_contract.json'
      - '.github/workflows/macro-persistent-daily-v1.yml'
      - '.github/workflows/gbp-ons-mgsx-temporal-v1.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * 1-5'

permissions:
  contents: read

jobs:
  rolling-window-and-first-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify ONS source parser and builder still respect CPI contract
        run: python validation/test_gbp_ons_source.py
      - name: Prove LFS MGSX centered-month vs canonical end-month and quarantine
        run: python -m unittest validation.macro.test_gbp_ons_temporal_guard_v1 -v
      - name: Capture read-only observed GBP canonical temporal blocker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gbp-ons-temporal
          python -m validation.macro.gbp_ons_temporal_guard_v1 \
            --receipt /tmp/gbp-ons-temporal/guard.json > /tmp/gbp-ons-temporal/result.log
          python - <<'PY'
          import json,os
          x=json.load(open('/tmp/gbp-ons-temporal/guard.json'))
          assert x['status']=='HOLD_UNTIL_EXPLICIT_PERIOD_VINTAGE_REPAIR'
          assert x['safe_to_persist_gbp_labour'] is False
          assert x['historical_rebase_approved'] is False
          assert x['canonical_source_latest_period']=='2026-07'
          changes={row['action'] for row in x['issues']}
          assert 'VINTAGE_OR_PERIOD_VALUE_MISMATCH' in changes
          assert 'MISSING_FIRST_RELEASE_WINDOW' in changes
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## UK ONS MGSX end-month PIT QA\n')
              out.write('**GBP labour daily persistence: temporarily quarantined**\n\n')
              out.write('ONS JUL 2026 center month = June-August window END August. ')
              out.write('Canonical July currently 4.7 but May-July first release was 4.9. ')
              out.write('Requires atomic reviewed July/August repair.\n\n')
              out.write('Other 15 G8 inflation/labour source refreshes remain enabled.\n')
          print('GBP_LFS_FIRST_RELEASE_MAPPING_PASS_QUARANTINE_ACTIVE')
          PY
          git diff --exit-code -- live_data/sections/MACRO_SERIES.json live_data/sections/MACRO_THERMOMETER_DATA.json live_data/sections/D.json live_data/sections/PAIR_SETUP_OPERATIONAL_VIEW.json
      - name: Publish blocker receipt as GitHub Actions artifact only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbp-ons-temporal-audit-${{ github.run_id }}
          path: /tmp/gbp-ons-temporal/
          if-no-files-found: warn
          retention-days: 45
