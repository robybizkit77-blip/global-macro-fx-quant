name: Macro Inflation Labour Owner Diagnostic V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/macro-inflationlabour-owner-diagnostic-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start dashboard
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/macro-owner-diagnostic-server.log 2>&1 &
          sleep 2
      - name: Inspect Macro and Inflation Labour bindings
        run: |
          cat > macro-owner-diagnostic.js <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1100}});
            const consoleErrors=[],pageErrors=[];
            page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.settled_after_cad_chain===true,null,{timeout:120000});
            const out=await page.evaluate(()=>{
              const norm=s=>String(s||'').replace(/\s+/g,' ').trim();
              const viewInfo=id=>{
                const el=document.getElementById(id);
                return {
                  exists:!!el,
                  text:norm(el?.innerText).slice(0,5000),
                  htmlLength:el?.innerHTML?.length||0,
                  operationalOwners:el?[...el.querySelectorAll('[data-gmfq-operational]')].map(x=>x.getAttribute('data-gmfq-operational')):[],
                  buttons:el?[...el.querySelectorAll('button')].slice(0,40).map(x=>({text:norm(x.innerText),id:x.id||null,ccy:x.dataset?.ccy||x.dataset?.currency||null})):[],
                  selects:el?[...el.querySelectorAll('select')].map(x=>({id:x.id||null,value:x.value,options:[...x.options].map(o=>o.value)})):[]
                };
              };
              let coverage=null;
              try{coverage=typeof window.macroBlockCoverage==='function'?window.macroBlockCoverage():null}catch(e){coverage={error:String(e)}}
              const globals=Object.keys(window).filter(k=>/macro|inflation|labou?r|heatmap/i.test(k)).sort().slice(0,200);
              const series={};
              for(const c of ['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD']){
                const rows=Array.isArray(window.S?.[c])?window.S[c]:[];
                series[c]={
                  count:rows.length,
                  categories:Object.fromEntries(['Crescita','Inflazione','Lavoro'].map(cat=>[cat,rows.filter(x=>x?.category===cat).map(x=>({id:x.id||null,label:x.label||null,last:x.last??x.value??null,last_date:x.last_date||x.dates?.at?.(-1)||null,source:x.source_file||x.source||null})).slice(0,12)]))
                };
              }
              return {
                schema:'GMFQ_MACRO_INFLATIONLABOUR_OWNER_DIAGNOSTIC_V1',
                macro:viewInfo('macro'),
                inflationlabour:viewInfo('inflationlabour'),
                coverage,
                series,
                globals,
                health:typeof window.productionHealthCheck==='function'?window.productionHealthCheck():null
              };
            });
            console.log(JSON.stringify(out,null,2));
            if(!out.macro.exists||!out.inflationlabour.exists) throw new Error('Target views missing');
            if(!out.coverage) throw new Error('macroBlockCoverage unavailable');
            if(Object.keys(out.series||{}).length!==8) throw new Error('G8 series missing');
            const runtimeErr=/\b[A-Za-z_$][\w$]*\s+is\s+not\s+defined\b|ReferenceError/i;
            if(consoleErrors.some(x=>runtimeErr.test(x))||pageErrors.some(x=>runtimeErr.test(x))) throw new Error('Runtime scope error: '+consoleErrors.concat(pageErrors).join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node macro-owner-diagnostic.js | tee /tmp/macro-owner-diagnostic.json
      - uses: actions/upload-artifact@v4
        with:
          name: macro-inflationlabour-owner-diagnostic-v1
          path: |
            /tmp/macro-owner-diagnostic.json
            /tmp/macro-owner-diagnostic-server.log
