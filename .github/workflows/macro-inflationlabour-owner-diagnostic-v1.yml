name: Macro Inflation Labour Owner Diagnostic V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/macro-inflationlabour-owner-diagnostic-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start dashboard
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/macro-owner-diagnostic-server.log 2>&1 &
          sleep 2
      - name: Inspect Macro and Inflation Labour bindings
        run: |
          cat > macro-owner-diagnostic.js <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1100}});
            const consoleErrors=[],pageErrors=[];
            page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.settled_after_cad_chain===true,null,{timeout:120000});
            await page.evaluate(()=>window.showView?.('macro'));
            await page.waitForTimeout(250);

            const inspect=async()=>page.evaluate(()=>{
              const norm=s=>String(s||'').replace(/\s+/g,' ').trim();
              const macro=document.getElementById('macro');
              const heat=document.getElementById('inflationlabour');
              const elementRows=el=>[...el.querySelectorAll('*')]
                .filter(x=>x.id || /macro|country|heat|inflation|labou?r/i.test(String(x.className||'')))
                .slice(0,120)
                .map(x=>({tag:x.tagName,id:x.id||null,cls:typeof x.className==='string'?x.className:null,text:norm(x.innerText).slice(0,140)}));
              return {
                macroText:norm(macro?.innerText).slice(0,1300),
                macroButtons:[...macro.querySelectorAll('button')].map((x,i)=>({i,text:norm(x.innerText),id:x.id||null,cls:x.className||null,attrs:Object.fromEntries([...x.attributes].map(a=>[a.name,a.value]))})),
                macroElements:elementRows(macro),
                heatElements:elementRows(heat),
                heatText:norm(heat?.innerText).slice(0,1200),
                coverage:typeof window.macroBlockCoverage==='function'?window.macroBlockCoverage():null,
                macroIntegrity:typeof window.macroCategoryIntegrity==='function'?window.macroCategoryIntegrity():null,
                globals:Object.keys(window).filter(k=>/renderMacro|renderInflation|renderDynamicHeatmap|MacroLab/i.test(k)).sort()
              };
            });

            const initial=await inspect();
            const snapshots=[];
            for(const wanted of ['USD','EUR','CAD']){
              const clicked=await page.evaluate(w=>{
                const macro=document.getElementById('macro');
                const btn=[...macro.querySelectorAll('button')].find(x=>String(x.innerText||'').trim().startsWith(w));
                if(!btn) return false;
                btn.click(); return true;
              },wanted);
              await page.waitForTimeout(180);
              const state=await page.evaluate(()=>{
                const t=String(document.getElementById('macro')?.innerText||'').replace(/\s+/g,' ').trim();
                return t.slice(0,900);
              });
              snapshots.push({wanted,clicked,text:state});
            }
            const out={schema:'GMFQ_MACRO_INFLATIONLABOUR_OWNER_DIAGNOSTIC_V2',initial,snapshots};
            console.log(JSON.stringify(out,null,2));
            if(!initial.coverage||initial.macroIntegrity?.ok!==true) throw new Error('Canonical macro integrity unavailable');
            if(initial.macroButtons.length<8) throw new Error('Macro selector has fewer than 8 buttons');
            if(snapshots.some(x=>!x.clicked)) throw new Error('Macro selector click failed');
            for(const s of snapshots){ if(!new RegExp('\\b'+s.wanted+'\\b').test(s.text)) throw new Error('Macro selection did not render '+s.wanted); }
            const ccys=['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];
            for(const c of ccys){
              for(const cat of ['Crescita','Inflazione','Lavoro']){
                const x=initial.coverage?.[c]?.[cat];
                if(!x||!(x.count>0)||!x.latest||!x.source) throw new Error('Coverage incomplete '+c+' '+cat);
              }
            }
            const runtimeErr=/\b[A-Za-z_$][\w$]*\s+is\s+not\s+defined\b|ReferenceError/i;
            if(consoleErrors.some(x=>runtimeErr.test(x))||pageErrors.some(x=>runtimeErr.test(x))) throw new Error('Runtime scope error: '+consoleErrors.concat(pageErrors).join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node macro-owner-diagnostic.js | tee /tmp/macro-owner-diagnostic.json
      - uses: actions/upload-artifact@v4
        with:
          name: macro-inflationlabour-owner-diagnostic-v1
          path: |
            /tmp/macro-owner-diagnostic.json
            /tmp/macro-owner-diagnostic-server.log
