name: JPY Inflation Date Debug 2019-03

on:
  push:
    branches:
      - validation-jpy-inflation-strict-pit-v1-2026-10-10
    paths:
      - validation/debug_jpy_cpi_2019_03_date.py
      - .github/workflows/jpy-inflation-date-debug-2019-03.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check pypdf==5.9.0
      - name: Inspect official 2019-03 CPI date
        run: python validation/debug_jpy_cpi_2019_03_date.py
