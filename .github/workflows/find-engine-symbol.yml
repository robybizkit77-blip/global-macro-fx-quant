name: Find Engine Symbol

on:
  push:
    branches:
      - staging-usd-pit-readiness-2026-10-03
    paths:
      - 'validation/find_engine_symbol.py'
      - '.github/workflows/find-engine-symbol.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-usd-pit-readiness-2026-10-03
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate normalizedSeriesImpulse
        run: python validation/find_engine_symbol.py
      - name: Commit locator report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/ENGINE_SYMBOL_NORMALIZED_SERIES_IMPULSE_2026-10-03.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Record normalizedSeriesImpulse location"
            git pull --rebase origin staging-usd-pit-readiness-2026-10-03
            git push origin HEAD:staging-usd-pit-readiness-2026-10-03
          fi
