name: Daily Data Orchestrator V2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/daily-data-orchestrator-v2.yml'
      - 'validation/orchestration/DAILY_DATA_ORCHESTRATOR_V2_2026-10-15.json'
      - 'validation/orchestration/check_daily_data_orchestrator_v2.py'
      - 'validation/orchestration/check_morning_readiness_v1.py'
      - 'validation/orchestration/test_check_morning_readiness_v1.py'
      - 'validation/orchestration/test_morning_source_drift_contract_v1.py'
      - 'validation/orchestration/test_prebrief_offhour_dst_schedule_v1.py'
      - 'validation/orchestration/check_morning_delivery_sla_v1.py'
      - 'validation/orchestration/test_check_morning_delivery_sla_v1.py'
      - 'validation/orchestration/check_child_execution_steps_v1.py'
      - 'validation/orchestration/test_check_child_execution_steps_v1.py'
      - 'validation/orchestration/test_orchestrator_readonly_api_retry_v1.py'
      - 'validation/orchestration/plan_premorning_calendar_news_recovery_v1.py'
      - 'validation/orchestration/test_plan_premorning_calendar_news_recovery_v1.py'
      - 'validation/orchestration/plan_premorning_vix_recovery_v1.py'
      - 'validation/orchestration/test_plan_premorning_vix_recovery_v1.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-data-orchestrator-v2.yml'
      - 'validation/orchestration/DAILY_DATA_ORCHESTRATOR_V2_2026-10-15.json'
      - 'validation/orchestration/check_daily_data_orchestrator_v2.py'
      - 'validation/orchestration/check_morning_readiness_v1.py'
      - 'validation/orchestration/test_check_morning_readiness_v1.py'
      - 'validation/orchestration/test_morning_source_drift_contract_v1.py'
      - 'validation/orchestration/test_prebrief_offhour_dst_schedule_v1.py'
      - 'validation/orchestration/check_morning_delivery_sla_v1.py'
      - 'validation/orchestration/test_check_morning_delivery_sla_v1.py'
      - 'validation/orchestration/check_child_execution_steps_v1.py'
      - 'validation/orchestration/test_check_child_execution_steps_v1.py'
      - 'validation/orchestration/test_orchestrator_readonly_api_retry_v1.py'
      - 'validation/orchestration/plan_premorning_calendar_news_recovery_v1.py'
      - 'validation/orchestration/test_plan_premorning_calendar_news_recovery_v1.py'
      - 'validation/orchestration/plan_premorning_vix_recovery_v1.py'
      - 'validation/orchestration/test_plan_premorning_vix_recovery_v1.py'
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to run'
        required: true
        default: morning
        type: choice
        options:
          - prebrief
          - premorning
          - morning
          - close
          - night
          - full
  schedule:
    # Europe/Rome 04:43 preparation for the 08:00 study briefing.
    # Off-hour minute avoids GitHub's documented top-of-hour scheduler load;
    # earlier start adds 17 minutes of buffer without advancing source vintages.
    # Previous trading-day FX fixes/rates are already source-published by this slot.
    - cron: '43 2 * * 1-5'
    - cron: '43 3 * * 1-5'
    # Europe/Rome 07:45 pre-morning. Duplicate UTC entries cover CEST/CET; offset gate selects one.
    - cron: '45 5 * * 1-5'
    - cron: '45 6 * * 1-5'
    # Europe/Rome 09:10: second-source catch-up after the 08:00 briefing.
    - cron: '10 7 * * 1-5'
    - cron: '10 8 * * 1-5'
    # Europe/Rome 18:30 close.
    - cron: '30 16 * * 1-5'
    - cron: '30 17 * * 1-5'
    # Europe/Rome 00:50 after each Mon-Fri trading day.
    - cron: '50 22 * * 1-5'
    - cron: '50 23 * * 1-5'

permissions:
  contents: read
  actions: write

# Serialize *production* schedule and manual dispatch phases on the original
# queue; all market-data writers must keep running one at a time.
# Separate pull_request/push contract-only CI (which never dispatches children)
# so frequent code validations cannot hold up the 04:43/07:45 production queue.
# queue: max preserves all pending production runs. GitHub may still delay
# delivery of a scheduled event; this change is not a punctuality guarantee.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('daily-data-orchestrator-v2-ci-pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && 'daily-data-orchestrator-v2-ci-push' || 'daily-data-orchestrator-v2' }}
  queue: max
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  TZ_NAME: Europe/Rome

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify orchestration contract
        run: python validation/orchestration/check_daily_data_orchestrator_v2.py
      - name: Test morning freshness and DST-aware source windows
        run: python validation/orchestration/test_check_morning_readiness_v1.py
      - name: Test live-vintage and source-backed calendar guards for 08:00
        run: python -m unittest validation.orchestration.test_morning_source_drift_contract_v1 -v
      - name: Test 04:43 Rome off-hour DST prebrief schedule
        run: python validation/orchestration/test_prebrief_offhour_dst_schedule_v1.py
      - name: Test 08:00 Rome delivery SLA and failure receipts
        run: python validation/orchestration/test_check_morning_delivery_sla_v1.py
      - name: Test fail-closed evidence for all orchestrated child steps
        run: python validation/orchestration/test_check_child_execution_steps_v1.py
      - name: Bash syntax-check serialized refresh before any dispatch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          text=Path('.github/workflows/daily-data-orchestrator-v2.yml').read_text(encoding='utf-8')
          section=text.split('      - name: Run serialized refresh sequence\n',1)[1].split(
              '      - name: Retain exact child-step proof',1)[0]
          embedded=section.split('        run: |\n',1)[1].splitlines()
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in embedded)+'\n'
          subprocess.run(['bash','-n'],input=script,text=True,check=True)
          if len([line for line in script.splitlines() if line.strip()=='workflows=('])!=5:
              raise SystemExit('ORCHESTRATOR_PHASE_ARRAY_COUNT_DRIFT')
          print('ORCHESTRATOR_SERIALIZED_BASH_SYNTAX_PASS')
          PY
      - name: Test pre-morning Calendar/News selective recheck recovery
        run: python -m unittest validation.orchestration.test_plan_premorning_calendar_news_recovery_v1 -v
      - name: Test 07:45 selective official VIX close recovery
        run: python -m unittest validation.orchestration.test_plan_premorning_vix_recovery_v1 -v
      - name: Test transient GitHub run/job reads without duplicate dispatch
        run: python validation/orchestration/test_orchestrator_readonly_api_retry_v1.py

  orchestrate:
    needs: contract
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Resolve phase with Europe/Rome DST gate
        id: phase
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            phase="${{ inputs.phase }}"
          else
            offset=$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(int(datetime.now(ZoneInfo('Europe/Rome')).utcoffset().total_seconds() // 3600))
          PY
          )
            sched='${{ github.event.schedule }}'
            phase=skip
            case "$sched|$offset" in
              '43 2 * * 1-5|2'|'43 3 * * 1-5|1') phase=prebrief ;;
              '45 5 * * 1-5|2'|'45 6 * * 1-5|1') phase=premorning ;;
              '10 7 * * 1-5|2'|'10 8 * * 1-5|1') phase=morning ;;
              '30 16 * * 1-5|2'|'30 17 * * 1-5|1') phase=close ;;
              '50 22 * * 1-5|2'|'50 23 * * 1-5|1') phase=night ;;
            esac
          fi
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "Resolved phase: $phase"

      # EVERY active phase needs source scripts for the fail-closed check
      # of actual child job steps. The prebrief/premorning phases additionally
      # use this same checkout for the pre-publication source audit.
      # A missing checkout in the manual/09:10 "morning" phase previously
      # stopped after its first successful child with ENOENT on the proof script.
      - name: Checkout main for pre-publication source audit
        if: ${{ steps.phase.outputs.phase != 'skip' }}
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Run serialized refresh sequence
        id: refresh
        if: ${{ steps.phase.outputs.phase != 'skip' }}
        shell: bash
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
        run: |
          set -euo pipefail

          dispatch_and_wait() {
            local wf="$1"
            local api="repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}"
            local dispatch_result run_id response_run_url response_html_url
            local status conclusion json child_event child_branch child_sha child_url

            # GitHub workflow_dispatch API (2026) now provides the exact run
            # identity. Do NOT scan recent runs or pick an unrelated manual
            # dispatch if two executions of this workflow occur together.
            dispatch_result=$(gh api --method POST \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "${api}/dispatches" -f ref=main -F return_run_details=true)
            run_id=$(jq -er '.workflow_run_id | select(type=="number" and .>0)' <<<"$dispatch_result")
            response_run_url=$(jq -er '.run_url | select(type=="string")' <<<"$dispatch_result")
            response_html_url=$(jq -er '.html_url | select(type=="string")' <<<"$dispatch_result")
            if [[ "$response_run_url" != "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" ||
                  "$response_html_url" != "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}" ]]; then
              echo "Workflow dispatch response did not identify the expected run: ${wf}" >&2
              return 1
            fi
            echo "${wf} -> directly dispatched run #${run_id}"
            for _ in $(seq 1 360); do
              # Only retry READS: never repeat an ambiguous POST dispatch
              # because that could create duplicate child workflow runs.
              if ! json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"); then
                echo "CHILD_RUN_API_TRANSIENT: ${wf} #${run_id}, retry run-status GET" >&2
                sleep 10
                continue
              fi
              status=$(jq -r '.status' <<<"$json")
              conclusion=$(jq -r '.conclusion // empty' <<<"$json")
              if [[ "$status" == "completed" ]]; then
                # A child SUCCESS is meaningful only if it belongs to the
                # dispatched workflow on main. Preserve exact run evidence,
                # including failures, before deciding whether to proceed.
                child_event=$(jq -r '.event // empty' <<<"$json")
                child_branch=$(jq -r '.head_branch // empty' <<<"$json")
                child_sha=$(jq -r '.head_sha // empty' <<<"$json")
                child_url=$(jq -r '.html_url // empty' <<<"$json")
                if [[ "$child_event" != "workflow_dispatch" || "$child_branch" != "main" ||
                      ! "$child_sha" =~ ^[0-9a-f]{40}$ ||
                      "$child_url" != "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}" ]]; then
                  echo "Child run identity failed: ${wf} #${run_id}, event=${child_event}, branch=${child_branch}, sha=${child_sha}" >&2
                  return 1
                fi
                echo "${wf} -> ${conclusion} (run #${run_id}; sha ${child_sha})"
                echo "- [${wf} · run #${run_id}](${child_url}) — **${conclusion}**, main commit \`${child_sha}\`" >> "$GITHUB_STEP_SUMMARY"
                [[ "$conclusion" == "success" ]] || return 1
                # Workflow-level SUCCESS can hide a skipped job or the
                # acquisition step never running (especially with schedule
                # admission gates). Confirm the exact child run's actual job
                # and required steps before allowing the next workflow.
                local child_jobs_file child_proof_file
                mkdir -p /tmp/orchestration-child-step-evidence
                child_jobs_file="/tmp/orchestration-child-step-evidence/run-${run_id}-jobs.json"
                child_proof_file="/tmp/orchestration-child-step-evidence/run-${run_id}-proof.json"
                for attempt in 1 2 3 4 5; do
                  # An API failure must not escape set -e on attempt #1.
                  # Discard any partial/old response; a missing jobs receipt
                  # remains FAIL-CLOSED after the bounded retries.
                  if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > "$child_jobs_file"; then
                    if python3 validation/orchestration/check_child_execution_steps_v1.py \
                      --workflow "$wf" \
                      --jobs-file "$child_jobs_file" \
                      --output "$child_proof_file"; then
                      echo "- Required source steps for ${wf} #${run_id}: **EXECUTED** (including legitimate no-change runs)" >> "$GITHUB_STEP_SUMMARY"
                      return 0
                    fi
                  else
                    rm -f "$child_jobs_file"
                    echo "CHILD_JOBS_API_TRANSIENT: ${wf} #${run_id}, attempt ${attempt}/5" >&2
                  fi
                  if [[ "$attempt" -lt 5 ]]; then sleep 3; fi
                done
                echo "CHILD_REQUIRED_STEPS_NOT_EXECUTED: ${wf} run #${run_id}; see ${child_proof_file}" >&2
                return 1
              fi
              sleep 10
            done
            echo "Timed out waiting for ${wf} run ${run_id}" >&2
            return 1
          }

          run_phase() {
            local phase="$1"
            local workflows=()
            case "$phase" in
              prebrief)
                # Strictly serial: official/estimated daily data, then a final
                # read-only certification and Pages publication before the user studies.
                # CB Pricing has its own independent 06:00/06:30/07:00 Rome schedule.
                # Its external CAD Market Review outage must not block FX/Macro/News/VIX.
                # Keep CAD source quality/staleness independently validated at publication.
                # Non-daily residual series keep their own collector cadence.
                workflows=(
                  macro-persistent-daily-v1.yml
                  rates-persistent-daily-v1.yml
                  ois-estimated-snapshot-repricing-v1.yml
                  calendar-news-operational-refresh-v1.yml
                  vix-persistent-apply-v1.yml
                  final-e2e-certification-gate-v3.yml
                  publish-dashboard-pages-v1.yml
                )
                ;;
              premorning)
                # Selectively recover missing prebrief Macro without duplicating a certified run.
                # CB Pricing runs separately before 08:00.
                # Calendar/News is a selective RECOVERY, not a blind duplicate:
                # skip its independent collector if it already checked both
                # public views today (Europe/Rome); retry stale or invalid evidence.
                workflows=(
                  macro-persistent-daily-v1.yml
                  calendar-news-operational-refresh-v1.yml
                  rates-persistent-daily-v1.yml
                  vix-persistent-apply-v1.yml
                  final-e2e-certification-gate-v3.yml
                  publish-dashboard-pages-v1.yml
                )
                ;;
              morning)
                # CB Pricing already has independent 06:00/06:30/07:00 Rome
                # source retries. An isolated external CAD/MX failure must not
                # abort the 09:10 catch-up of FX/Macro/OIS/Calendar/Pages.
                # Daily G8 CB statuses are separately checked by the publisher.
                workflows=(
                  macro-persistent-daily-v1.yml
                  rates-persistent-daily-v1.yml
                  ois-estimated-snapshot-repricing-v1.yml
                  liquidity-jpy-m3-persistent-daily-v1.yml
                  chf-residual-proxy-refresh-v1.yml
                  jpy-reserve-balances-proxy-refresh-v1.yml
                  calendar-news-operational-refresh-v1.yml
                  final-e2e-certification-gate-v3.yml
                  publish-dashboard-pages-v1.yml
                )
                ;;
              close)
                workflows=(
                  price-persistent-daily-v1.yml
                  calendar-news-operational-refresh-v1.yml
                  final-e2e-certification-gate-v3.yml
                  publish-dashboard-pages-v1.yml
                )
                ;;
              night)
                workflows=(
                  vix-persistent-apply-v1.yml
                  wti-persistent-rebuild-v1.yml
                  brent-market-proxy-refresh-v1.yml
                  calendar-news-operational-refresh-v1.yml
                  final-e2e-certification-gate-v3.yml
                  publish-dashboard-pages-v1.yml
                )
                ;;
              *) echo "Unknown phase: $phase" >&2; return 2 ;;
            esac

            echo "## Daily Data Orchestrator V2 — ${phase}" >> "$GITHUB_STEP_SUMMARY"
            for wf in "${workflows[@]}"; do
              # Latest same-day main Macro run must prove real executed source steps.
              # Skip duplicates for active runs, but never call them certified.
              if [[ "$phase" == "premorning" && "$wf" == "macro-persistent-daily-v1.yml" ]]; then
                macro_done=false
                macro_runs=""
                if macro_runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/macro-persistent-daily-v1.yml/runs?branch=main&per_page=100")"; then
                  today_utc="$(date -u +%F)"
                  macro_latest="$(jq -c --arg day "$today_utc" '
                    [.workflow_runs[] | select(.head_branch=="main") |
                     select(.event=="schedule" or .event=="workflow_dispatch") |
                     select(.created_at[0:10] == $day)] |
                    sort_by(.created_at, .id) | last // {}' <<<"$macro_runs")"
                  macro_id="$(jq -r '.id // empty' <<<"$macro_latest")"
                  macro_status="$(jq -r '.status // empty' <<<"$macro_latest")"
                  macro_conclusion="$(jq -r '.conclusion // empty' <<<"$macro_latest")"
                  if [[ "$macro_status" == "queued" || "$macro_status" == "in_progress" ||
                        "$macro_status" == "waiting" || "$macro_status" == "pending" ]]; then
                    echo "- 07:45 Macro: **ACTIVE NOT CERTIFIED**, run #${macro_id}, no duplicate" >> "$GITHUB_STEP_SUMMARY"
                    continue
                  fi
                  if [[ "$macro_status" == "completed" && "$macro_conclusion" == "success" ]] &&
                    macro_jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${macro_id}/jobs?per_page=100")"; then
                    macro_steps="$(jq -c '.jobs[] | select(.name=="persist-macro" and .status=="completed" and .conclusion=="success") | .steps' <<<"$macro_jobs")"
                    if [[ -n "$macro_steps" ]] && jq -e --arg a 'Snapshot baseline and registry contract' \
                      --arg b 'Fetch and PIT-verify all 16 core series independently' \
                      --arg c 'Confirm no-change case' \
                      --arg d 'Commit validated Macro update to main with remote-head lease' '
                      [.[] | select(.conclusion=="success") | .name] as $ok |
                      ($ok | index($a)) != null and ($ok | index($b)) != null and
                      (($ok | index($c)) != null or ($ok | index($d)) != null)
                    ' <<<"$macro_steps" >/dev/null; then
                      macro_done=true
                    fi
                  fi
                fi
                if [[ "$macro_done" == true ]]; then
                  echo "- 07:45 Macro: **SKIPPED**, actual source verification executed today in run #${macro_id}" >> "$GITHUB_STEP_SUMMARY"
                  continue
                fi
                echo "- 07:45 Macro: **RECOVERY**, no proven successful same-day check" >> "$GITHUB_STEP_SUMMARY"
              fi
              # A missed/failed 04:43 Calendar/News check must be recoverable
              # during the 07:45 safety pass. When BOTH producer receipts have
              # already been rechecked today, avoid duplicate source work.
              # The 04:43 primary and 05:17 independent collector still lead.
              if [[ "$phase" == "premorning" && "$wf" == "calendar-news-operational-refresh-v1.yml" ]]; then
                if python3 validation/orchestration/plan_premorning_calendar_news_recovery_v1.py \
                  --source-dir live_data/sections; then
                  echo "- 07:45 Calendar/News: **SKIPPED** (both sources already rechecked today, Rome); no new acquisition claimed" >> "$GITHUB_STEP_SUMMARY"
                  continue
                fi
                echo "- 07:45 Calendar/News: **RETRY** (missing or stale same-day source receipt)" >> "$GITHUB_STEP_SUMMARY"
              fi
              # If the overnight Cboe source or 07:17 Calendar-triggered VIX
              # recovery was late, 07:45 gets one selective official fetch.
              # Read the latest main source, not the older orchestrator checkout.
              if [[ "$phase" == "premorning" && "$wf" == "vix-persistent-apply-v1.yml" ]]; then
                git fetch origin --no-tags --depth=1 '+refs/heads/main:refs/remotes/origin/main'
                git show origin/main:live_data/sections/D.json > /tmp/premorning-vix-current-main.json
                if python3 validation/orchestration/plan_premorning_vix_recovery_v1.py \
                  --source-file /tmp/premorning-vix-current-main.json; then
                  echo "- 07:45 VIX: **SKIPPED** (official prior-session Cboe close already validated on latest main)" >> "$GITHUB_STEP_SUMMARY"
                  continue
                fi
                echo "- 07:45 VIX: **RETRY** (last official Cboe date/integrity still needs verification)" >> "$GITHUB_STEP_SUMMARY"
              fi
              # Final E2E is a structural check, not proof that dated
              # market sources are ready. Refuse the explicit 04:43/07:45
              # Pages dispatch unless the actual refreshed main feeds pass.
              if [[ "$wf" == "publish-dashboard-pages-v1.yml" ]] &&
                 [[ "$phase" == "prebrief" || "$phase" == "premorning" ]]; then
                git fetch origin --no-tags --depth=1 '+refs/heads/main:refs/remotes/origin/main'
                git reset --hard origin/main
                audited_sha=$(git rev-parse HEAD)
                python3 validation/orchestration/check_morning_readiness_v1.py \
                  --strict-daily --pipeline-outcome success \
                  --output /tmp/morning-readiness-prepublish.json \
                  > /tmp/morning-readiness-prepublish.log
                latest_main_sha=$(git ls-remote origin refs/heads/main | awk '{print $1}')
                if [[ "$latest_main_sha" != "$audited_sha" ]]; then
                  echo "Main changed after pre-publication readiness audit; refusing stale approval" >&2
                  return 1
                fi
                echo "- Pre-publication source readiness **PASS** on main \`${audited_sha}\` for ${phase}" >> "$GITHUB_STEP_SUMMARY"
              fi
              dispatch_and_wait "$wf"
            done
          }

          case "$PHASE" in
            prebrief|premorning|morning|close|night) run_phase "$PHASE" ;;
            full)
              run_phase prebrief
              run_phase premorning
              run_phase morning
              run_phase close
              run_phase night
              ;;
            *) echo "Nothing to run for phase=${PHASE}" ;;
          esac

      - name: Retain exact child-step proof for all orchestration phases
        if: ${{ always() && steps.phase.outputs.phase != 'skip' }}
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-child-step-proof-${{ github.run_id }}
          path: /tmp/orchestration-child-step-evidence/*-proof.json
          if-no-files-found: warn
          retention-days: 21

      # Re-check the LATEST main commit after the dispatched child workflows
      # have updated it; the orchestration runner itself did not mutate data.
      - name: Checkout refreshed production sources for 08:00 audit
        if: ${{ always() && (steps.phase.outputs.phase == 'prebrief' || steps.phase.outputs.phase == 'premorning') }}
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Audit true source dates for the morning study
        if: ${{ always() && (steps.phase.outputs.phase == 'prebrief' || steps.phase.outputs.phase == 'premorning') }}
        shell: bash
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
        run: |
          set -euo pipefail
          python3 validation/orchestration/test_check_morning_readiness_v1.py
          python3 validation/orchestration/check_morning_readiness_v1.py \
            --pipeline-outcome "$REFRESH_OUTCOME" \
            --output /tmp/morning-readiness-v1.json > /tmp/morning-readiness-v1.log
          python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/morning-readiness-v1.json', encoding='utf-8'))
          problems=d['critical_daily_problems']
          evidence=d['evidence']
          macro=evidence['MACRO_OBSERVATIONS_G8']
          lines=[
            '## Control Room · 08:00 morning source readiness',
            '- Status: **'+d['operational_state']+'**',
            '- Refresh pipeline outcome: **'+d['refresh_pipeline_outcome']+'**',
            '- Expected last weekday session: '+d['expected_previous_weekday'],
            '- Checked at Europe/Rome: '+d['checked_at_rome'],
            '- Daily source exceptions: '+(', '.join(problems) if problems else 'none'),
            '- FX official: '+str(evidence['FX_OFFICIAL_FIXING']['as_of']),
            '- Pair price: '+str(evidence['PAIR_PRICE']['as_of']),
            '- VIX official close: '+str(evidence['VIX_OFFICIAL_CLOSE']['as_of']),
            '- Macro score: **'+str(evidence['MACRO_BASELINE']['as_of'])+' (historical, not automatically recalculated)**',
            '- Rates missing previous-session freshness: '+', '.join(c for c,v in evidence['RATES_2Y_10Y'].items() if v['status']!='RECENT_OFFICIAL'),
            '- OIS official: '+', '.join(evidence['OIS_G8']['official']),
            '- OIS estimated: '+', '.join(evidence['OIS_G8']['estimated']),
            '- OIS withheld: '+', '.join(evidence['OIS_G8']['withheld']),
            '- Weekly COT is assessed on its own release cadence, not as a daily price.',
            '- Publication date lag can reflect a legitimate official market holiday; investigate before overriding.',
          ]
          lines.append('- Macro observed reference periods: '+str(macro['observed'])+
                       '/'+str(macro['expected'])+'; historical Macro score is separate')
          news_vintage=evidence['NEWS_CONTENT_VINTAGE']
          lines.append('- News Pulse market content: '+str(news_vintage['content_as_of'])+
                       ' ('+news_vintage['status']+'); build date is separate')
          lines.append('- Documented non-blocking source gaps: '+
                       (', '.join(d.get('documented_nonblocking_gaps',[])) or 'none'))
          lines.append('- Macro source exceptions: '+
                       (', '.join(macro['invalid']) if macro['invalid'] else 'none'))
          for ccy in ('USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'):
              inflation=macro['rows'][ccy+'.inflation']
              labour=macro['rows'][ccy+'.labour']
              lines.append('- '+ccy+' observed periods (NOT release dates): Inflation '+
                           str(inflation['reference_period'])+'; Labour '+
                           str(labour['reference_period']))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('\n'.join(lines)+'\n')
          print('MORNING_READINESS',d['operational_state'],'PROBLEMS',problems)
          if problems:
              raise SystemExit('Daily inputs not ready: do not report all-green source freshness')
          PY

      # All child refreshes, the Pages publish step and public HTTP proof
      # have finished before this receipt is evaluated. A late success must
      # remain LATE; it must not count as an 08:00 delivery.
      - name: Certify 08:00 morning delivery deadline
        if: ${{ always() && (steps.phase.outputs.phase == 'prebrief' || steps.phase.outputs.phase == 'premorning') }}
        shell: bash
        run: |
          set -euo pipefail
          outcome=0
          python3 validation/orchestration/check_morning_delivery_sla_v1.py \
            --phase "${{ steps.phase.outputs.phase }}" \
            --readiness /tmp/morning-readiness-v1.json \
            --output /tmp/morning-delivery-sla-v1.json \
            > /tmp/morning-delivery-sla-v1.log || outcome=$?
          python3 - <<'PY'
          import json, os
          d=json.load(open('/tmp/morning-delivery-sla-v1.json',encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('\n## 08:00 Europe/Rome delivery deadline\n')
              out.write('- Result: **'+d['status']+'**\n')
              out.write('- Target: '+d['target_rome']+'\n')
              out.write('- Evaluated: '+d['evaluated_at_rome']+'\n')
              out.write('- Source + publication sequence passed: '+str(d['source_and_publication_sequence_successful'])+'\n')
              out.write('- On-time: **'+str(d['on_time'])+'**\n')
              out.write('- Non-blocking data caveats: '+
                        (', '.join(d.get('documented_nonblocking_gaps',[])) or 'none')+'\n')
          print('MORNING_0800_SLA_RESULT', d['status'], 'ON_TIME', d['on_time'])
          PY
          exit "$outcome"

      - name: Retain morning source readiness evidence
        if: ${{ always() && (steps.phase.outputs.phase == 'prebrief' || steps.phase.outputs.phase == 'premorning') }}
        uses: actions/upload-artifact@v4
        with:
          name: control-room-morning-readiness-${{ github.run_id }}
          path: |
            /tmp/morning-readiness*.json
            /tmp/morning-delivery-sla-v1.json
          if-no-files-found: warn
          retention-days: 21

      - name: Record skipped duplicate DST schedule
        if: ${{ steps.phase.outputs.phase == 'skip' }}
        run: echo 'Duplicate DST cron intentionally skipped.' >> "$GITHUB_STEP_SUMMARY"
