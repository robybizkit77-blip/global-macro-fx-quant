name: Daily Data Orchestrator V2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/daily-data-orchestrator-v2.yml'
      - 'validation/orchestration/DAILY_DATA_ORCHESTRATOR_V2_2026-10-15.json'
      - 'validation/orchestration/check_daily_data_orchestrator_v2.py'
      - 'validation/orchestration/check_morning_readiness_v1.py'
      - 'validation/orchestration/test_check_morning_readiness_v1.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-data-orchestrator-v2.yml'
      - 'validation/orchestration/DAILY_DATA_ORCHESTRATOR_V2_2026-10-15.json'
      - 'validation/orchestration/check_daily_data_orchestrator_v2.py'
      - 'validation/orchestration/check_morning_readiness_v1.py'
      - 'validation/orchestration/test_check_morning_readiness_v1.py'
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to run'
        required: true
        default: morning
        type: choice
        options:
          - prebrief
          - premorning
          - morning
          - close
          - night
          - full
  schedule:
    # Europe/Rome 05:00 preparation for the 08:00 study briefing.
    # Previous trading-day FX fixes/rates are already source-published by this slot.
    - cron: '0 3 * * 1-5'
    - cron: '0 4 * * 1-5'
    # Europe/Rome 07:45 pre-morning. Duplicate UTC entries cover CEST/CET; offset gate selects one.
    - cron: '45 5 * * 1-5'
    - cron: '45 6 * * 1-5'
    # Europe/Rome 09:10: second-source catch-up after the 08:00 briefing.
    - cron: '10 7 * * 1-5'
    - cron: '10 8 * * 1-5'
    # Europe/Rome 18:30 close.
    - cron: '30 16 * * 1-5'
    - cron: '30 17 * * 1-5'
    # Europe/Rome 00:50 after each Mon-Fri trading day.
    - cron: '50 22 * * 1-5'
    - cron: '50 23 * * 1-5'

permissions:
  contents: read
  actions: write

concurrency:
  group: daily-data-orchestrator-v2
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  TZ_NAME: Europe/Rome

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify orchestration contract
        run: python validation/orchestration/check_daily_data_orchestrator_v2.py
      - name: Test morning freshness and DST-aware source windows
        run: python validation/orchestration/test_check_morning_readiness_v1.py

  orchestrate:
    needs: contract
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Resolve phase with Europe/Rome DST gate
        id: phase
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            phase="${{ inputs.phase }}"
          else
            offset=$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(int(datetime.now(ZoneInfo('Europe/Rome')).utcoffset().total_seconds() // 3600))
          PY
          )
            sched='${{ github.event.schedule }}'
            phase=skip
            case "$sched|$offset" in
              '0 3 * * 1-5|2'|'0 4 * * 1-5|1') phase=prebrief ;;
              '45 5 * * 1-5|2'|'45 6 * * 1-5|1') phase=premorning ;;
              '10 7 * * 1-5|2'|'10 8 * * 1-5|1') phase=morning ;;
              '30 16 * * 1-5|2'|'30 17 * * 1-5|1') phase=close ;;
              '50 22 * * 1-5|2'|'50 23 * * 1-5|1') phase=night ;;
            esac
          fi
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "Resolved phase: $phase"

      - name: Run serialized refresh sequence
        id: refresh
        if: ${{ steps.phase.outputs.phase != 'skip' }}
        shell: bash
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
        run: |
          set -euo pipefail

          dispatch_and_wait() {
            local wf="$1"
            local api="repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}"
            local before run_id status conclusion json

            before=$(gh api "${api}/runs?branch=main&event=workflow_dispatch&per_page=20" | jq '[.workflow_runs[].id] | max // 0')
            echo "Dispatching ${wf} (after run id ${before})"
            gh api --method POST "${api}/dispatches" -f ref=main >/dev/null

            run_id=""
            for _ in $(seq 1 120); do
              json=$(gh api "${api}/runs?branch=main&event=workflow_dispatch&per_page=20")
              run_id=$(jq -r --argjson b "$before" '[.workflow_runs[] | select(.id > $b)] | sort_by(.id) | .[0].id // empty' <<<"$json")
              [[ -n "$run_id" ]] && break
              sleep 5
            done
            [[ -n "$run_id" ]] || { echo "No dispatched run found for ${wf}" >&2; return 1; }

            echo "${wf} -> run ${run_id}"
            for _ in $(seq 1 360); do
              json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
              status=$(jq -r '.status' <<<"$json")
              conclusion=$(jq -r '.conclusion // empty' <<<"$json")
              if [[ "$status" == "completed" ]]; then
                echo "${wf} -> ${conclusion}"
                [[ "$conclusion" == "success" ]] || return 1
                return 0
              fi
              sleep 10
            done
            echo "Timed out waiting for ${wf} run ${run_id}" >&2
            return 1
          }

          run_phase() {
            local phase="$1"
            local workflows=()
            case "$phase" in
              prebrief)
                # Strictly serial: official/estimated daily data, then a final
                # read-only certification and Pages publication before the user studies.
                # Non-daily residual series keep their own collector cadence.
                workflows=(
                  macro-persistent-daily-v1.yml
                  rates-persistent-daily-v1.yml
                  cb-pricing-persistent-daily-v1.yml
                  ois-estimated-snapshot-repricing-v1.yml
                  calendar-news-operational-refresh-v1.yml
                  vix-persistent-apply-v1.yml
                  final-e2e-certification-gate-v3.yml
                  publish-dashboard-pages-v1.yml
                )
                ;;
              premorning)
                workflows=(
                  rates-persistent-daily-v1.yml
                  cb-pricing-persistent-daily-v1.yml
                  final-e2e-certification-gate-v3.yml
                  publish-dashboard-pages-v1.yml
                )
                ;;
              morning)
                workflows=(
                  macro-persistent-daily-v1.yml
                  rates-persistent-daily-v1.yml
                  cb-pricing-persistent-daily-v1.yml
                  ois-estimated-snapshot-repricing-v1.yml
                  liquidity-jpy-m3-persistent-daily-v1.yml
                  chf-residual-proxy-refresh-v1.yml
                  jpy-reserve-balances-proxy-refresh-v1.yml
                  calendar-news-operational-refresh-v1.yml
                  final-e2e-certification-gate-v3.yml
                  publish-dashboard-pages-v1.yml
                )
                ;;
              close)
                workflows=(
                  price-persistent-daily-v1.yml
                  calendar-news-operational-refresh-v1.yml
                  final-e2e-certification-gate-v3.yml
                  publish-dashboard-pages-v1.yml
                )
                ;;
              night)
                workflows=(
                  vix-persistent-apply-v1.yml
                  wti-persistent-rebuild-v1.yml
                  brent-market-proxy-refresh-v1.yml
                  calendar-news-operational-refresh-v1.yml
                  final-e2e-certification-gate-v3.yml
                  publish-dashboard-pages-v1.yml
                )
                ;;
              *) echo "Unknown phase: $phase" >&2; return 2 ;;
            esac

            echo "## Daily Data Orchestrator V2 — ${phase}" >> "$GITHUB_STEP_SUMMARY"
            for wf in "${workflows[@]}"; do
              dispatch_and_wait "$wf"
              echo "- ✅ ${wf}" >> "$GITHUB_STEP_SUMMARY"
            done
          }

          case "$PHASE" in
            prebrief|premorning|morning|close|night) run_phase "$PHASE" ;;
            full)
              run_phase prebrief
              run_phase premorning
              run_phase morning
              run_phase close
              run_phase night
              ;;
            *) echo "Nothing to run for phase=${PHASE}" ;;
          esac

      # Re-check the LATEST main commit after the dispatched child workflows
      # have updated it; the orchestration runner itself did not mutate data.
      - name: Checkout refreshed production sources for 08:00 audit
        if: ${{ always() && (steps.phase.outputs.phase == 'prebrief' || steps.phase.outputs.phase == 'premorning') }}
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Audit true source dates for the morning study
        if: ${{ always() && (steps.phase.outputs.phase == 'prebrief' || steps.phase.outputs.phase == 'premorning') }}
        shell: bash
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
        run: |
          set -euo pipefail
          python3 validation/orchestration/test_check_morning_readiness_v1.py
          python3 validation/orchestration/check_morning_readiness_v1.py \
            --pipeline-outcome "$REFRESH_OUTCOME" \
            --output /tmp/morning-readiness-v1.json > /tmp/morning-readiness-v1.log
          python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/morning-readiness-v1.json', encoding='utf-8'))
          problems=d['critical_daily_problems']
          evidence=d['evidence']
          macro=evidence['MACRO_OBSERVATIONS_G8']
          lines=[
            '## Control Room · 08:00 morning source readiness',
            '- Status: **'+d['operational_state']+'**',
            '- Refresh pipeline outcome: **'+d['refresh_pipeline_outcome']+'**',
            '- Expected last weekday session: '+d['expected_previous_weekday'],
            '- Checked at Europe/Rome: '+d['checked_at_rome'],
            '- Daily source exceptions: '+(', '.join(problems) if problems else 'none'),
            '- FX official: '+str(evidence['FX_OFFICIAL_FIXING']['as_of']),
            '- Pair price: '+str(evidence['PAIR_PRICE']['as_of']),
            '- VIX official close: '+str(evidence['VIX_OFFICIAL_CLOSE']['as_of']),
            '- Macro score: **'+str(evidence['MACRO_BASELINE']['as_of'])+' (historical, not automatically recalculated)**',
            '- Rates missing previous-session freshness: '+', '.join(c for c,v in evidence['RATES_2Y_10Y'].items() if v['status']!='RECENT_OFFICIAL'),
            '- OIS official: '+', '.join(evidence['OIS_G8']['official']),
            '- OIS estimated: '+', '.join(evidence['OIS_G8']['estimated']),
            '- OIS withheld: '+', '.join(evidence['OIS_G8']['withheld']),
            '- Weekly COT is assessed on its own release cadence, not as a daily price.',
            '- Publication date lag can reflect a legitimate official market holiday; investigate before overriding.',
          ]
          lines.append('- Macro observed reference periods: '+str(macro['observed'])+
                       '/'+str(macro['expected'])+'; historical Macro score is separate')
          lines.append('- Macro source exceptions: '+
                       (', '.join(macro['invalid']) if macro['invalid'] else 'none'))
          for ccy in ('USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'):
              inflation=macro['rows'][ccy+'.inflation']
              labour=macro['rows'][ccy+'.labour']
              lines.append('- '+ccy+' observed periods (NOT release dates): Inflation '+
                           str(inflation['reference_period'])+'; Labour '+
                           str(labour['reference_period']))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('\n'.join(lines)+'\n')
          print('MORNING_READINESS',d['operational_state'],'PROBLEMS',problems)
          if problems:
              raise SystemExit('Daily inputs not ready: do not report all-green source freshness')
          PY

      - name: Retain morning source readiness evidence
        if: ${{ always() && (steps.phase.outputs.phase == 'prebrief' || steps.phase.outputs.phase == 'premorning') }}
        uses: actions/upload-artifact@v4
        with:
          name: control-room-morning-readiness-${{ github.run_id }}
          path: /tmp/morning-readiness-v1.json
          if-no-files-found: warn
          retention-days: 21

      - name: Record skipped duplicate DST schedule
        if: ${{ steps.phase.outputs.phase == 'skip' }}
        run: echo 'Duplicate DST cron intentionally skipped.' >> "$GITHUB_STEP_SUMMARY"
