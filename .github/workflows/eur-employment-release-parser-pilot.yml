name: EUR Employment Release Parser Pilot

on:
  workflow_dispatch:
  push:
    branches: [engine-freeze-v1-2026-10-02]
    paths:
      - validation/parse_eur_employment_release_seed.py
      - validation/pit_batch/eurostat/archive/EUR_EMPLOYMENT_OFFICIAL_RELEASE_SEED_V1_2026-10-02.json
      - .github/workflows/eur-employment-release-parser-pilot.yml

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse verified Eurostat release seed
        run: python validation/parse_eur_employment_release_seed.py
      - name: Commit parser result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/pit_batch/eurostat/archive/EUR_EMPLOYMENT_RELEASE_PARSE_PILOT_V1_2026-10-02.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Record EUR employment release parser pilot"
            git pull --rebase origin engine-freeze-v1-2026-10-02
            git push origin HEAD:engine-freeze-v1-2026-10-02
          fi
