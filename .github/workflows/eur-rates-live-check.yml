name: EUR rates live site check
on:
  push:
    branches: [test-eur-rates-ecb-aaa-2026-09-30]
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public payload and runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 2 https://robybizkit77-blip.github.io/global-macro-fx-quant/payload/part-15.txt -o live-part15.txt
          grep -q "gmfq-eur-rates-ecb-aaa-20260930" live-part15.txt
          grep -q "3.2105877756" live-part15.txt
          grep -q "3.6076715398" live-part15.txt
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=15000 --dump-dom https://robybizkit77-blip.github.io/global-macro-fx-quant/ > live.html 2>/tmp/live.log
          ! grep -q "Errore caricamento dashboard" live.html
          ! grep -q "Caricamento GLOBAL MACRO FX QUANT" live.html
          grep -q 'data-eur-rates-audit="PASS"' live.html
          grep -q 'data-eur-rates-asof="2026-09-29"' live.html
          test "$(wc -c < live.html)" -gt 500000
          echo "PASS: public EUR ECB AAA rates live"
          echo "Rendered bytes: $(wc -c < live.html)"
