name: CAD Turning Two Checkpoint Confirmation
on:
  push:
    branches: [staging-usd-pit-readiness-2026-10-03]
    paths:
      - 'validation/audit_cad_turning_two_checkpoint_confirmation.py'
      - '.github/workflows/cad-turning-two-checkpoint-confirmation.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python validation/audit_cad_turning_two_checkpoint_confirmation.py
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/CAD_TURNING_TWO_CHECKPOINT_CONFIRMATION_AUDIT_2026-10-03.json
          git diff --cached --quiet || git commit -m "Add CAD two-checkpoint turning confirmation audit"
          git push
