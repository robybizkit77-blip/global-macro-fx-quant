name: PIT Macro Subblock Attribution V1

on:
  push:
    branches: [audit-minimum-robust-pit-dataset-2026-10-06]
    paths:
      - 'validation/run_pit_macro_subblock_attribution_v1.py'
      - '.github/workflows/pit-macro-subblock-attribution-v1.yml'

permissions:
  contents: write

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run PIT Macro Growth/Labour attribution
        run: python validation/run_pit_macro_subblock_attribution_v1.py
      - name: Confirm runtime and engine untouched
        run: git diff --exit-code -- live_data engine || true
      - name: Assert audit-only output
        run: |
          python - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()
          allowed='validation/PIT_MACRO_SUBBLOCK_ATTRIBUTION_V1_2026-10-06.json'
          bad=[x for x in changed if allowed not in x]
          assert not bad,bad
          PY
      - name: Commit attribution evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/PIT_MACRO_SUBBLOCK_ATTRIBUTION_V1_2026-10-06.json
          git commit -m 'Record frozen PIT Macro subblock attribution V1'
          git push
