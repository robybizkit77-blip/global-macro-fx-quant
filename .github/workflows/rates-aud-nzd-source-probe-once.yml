name: Rates AUD NZD Source Probe Once

on:
  push:
    branches:
      - validation-rates-aud-nzd-live-fetch-2026-10-08
    paths:
      - '.github/workflows/rates-aud-nzd-source-probe-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect official RBA F2 CSV
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --user-agent 'GLOBAL-MACRO-FX-QUANT rates validation' \
            'https://www.rba.gov.au/statistics/tables/csv/f2-data.csv' -o /tmp/rba-f2.csv
          echo '=== RBA F2 first 15 lines ==='
          sed -n '1,15p' /tmp/rba-f2.csv
      - name: Download official RBNZ B2 via canonical data-index URL
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --user-agent 'GLOBAL-MACRO-FX-QUANT rates validation' \
            'https://rbnz.govt.nz/-/media/project/sites/rbnz/files/statistics/series/b/b2/hb2-daily-close.xlsx' \
            -o /tmp/rbnz-b2.xlsx
          test -s /tmp/rbnz-b2.xlsx
          file /tmp/rbnz-b2.xlsx
      - name: Inspect RBNZ workbook structure and latest rows
        run: |
          python3 -m pip install --disable-pip-version-check openpyxl
          python3 - <<'PY'
          import openpyxl, json
          p='/tmp/rbnz-b2.xlsx'
          wb=openpyxl.load_workbook(p, read_only=True, data_only=True)
          print('SHEETS', wb.sheetnames)
          for ws in wb.worksheets:
              print('===',ws.title,'===')
              rows=[]
              for i,row in enumerate(ws.iter_rows(values_only=True), start=1):
                  vals=list(row)
                  if any(v is not None for v in vals):
                      if i<=20: print(i, json.dumps(vals[:24], default=str))
                      rows.append((i,vals))
              print('LAST_NONEMPTY')
              for i,vals in rows[-8:]: print(i,json.dumps(vals[:24],default=str))
      - name: Upload probe inputs
        uses: actions/upload-artifact@v4
        with:
          name: rates-aud-nzd-source-probe
          path: |
            /tmp/rba-f2.csv
            /tmp/rbnz-b2.xlsx
          if-no-files-found: error
          retention-days: 7
