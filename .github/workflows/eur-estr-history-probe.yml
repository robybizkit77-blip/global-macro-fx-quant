name: EUR ESTR History Probe

on:
  push:
    branches:
      - staging-eur-estr-history-parse-2026-09-30
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
          pip install pandas xlrd openpyxl

      - name: Discover Eurex report links and download targets
        run: |
          cat > probe.js <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({acceptDownloads:true});
            const url='https://www.eurex.com/dynamic/action/ex-en/data/trading-files/product-and-price-report/66/Product-and-Price-Report';
            await page.goto(url,{waitUntil:'networkidle',timeout:120000});

            const rows = await page.locator('body').evaluate(() => {
              const all=[...document.querySelectorAll('a')];
              return all.map(a=>({text:(a.innerText||'').trim(),href:a.href||'',parent:(a.parentElement?.innerText||'').trim()}))
                .filter(x=>/Download/i.test(x.text)||/CB00[12] Product and Price Report/i.test(x.parent));
            });
            console.log('LINK_SCAN='+JSON.stringify(rows.slice(0,300),null,2));

            const targets = {};
            for (const date of ['Sep 28, 2026','Sep 23, 2026']) {
              const dateNode = page.getByText(date,{exact:true}).first();
              if(await dateNode.count()){
                const card = dateNode.locator('xpath=ancestor::*[self::div or self::li or self::article][.//a][1]');
                const links = await card.locator('a').evaluateAll(as=>as.map(a=>({text:(a.innerText||'').trim(),href:a.href||''})));
                targets[date]=links;
              }
            }
            console.log('TARGETS='+JSON.stringify(targets,null,2));

            for(const [date,links] of Object.entries(targets)){
              let n=0;
              for(const l of links){
                if(!l.href) continue;
                try{
                  const resp=await page.request.get(l.href,{timeout:120000});
                  const ct=resp.headers()['content-type']||'';
                  const buf=await resp.body();
                  const safe=date.replace(/[^0-9A-Za-z]+/g,'_')+'_'+(++n);
                  const ext=ct.includes('sheet')||ct.includes('excel')?'xls':(ct.includes('zip')?'zip':'bin');
                  fs.writeFileSync(`downloads/${safe}.${ext}`,buf);
                  console.log('DOWNLOADED',date,l.text,l.href,ct,buf.length,`downloads/${safe}.${ext}`);
                }catch(e){console.log('DOWNLOAD_FAIL',date,l.href,String(e));}
              }
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          mkdir -p downloads
          node probe.js

      - name: Inspect downloaded XML files for FST3
        run: |
          python - <<'PY'
          import os, zipfile, json, re, xml.etree.ElementTree as ET
          root='downloads'
          hits=[]
          for fn in sorted(os.listdir(root)):
              p=os.path.join(root,fn)
              if not zipfile.is_zipfile(p):
                  continue
              with zipfile.ZipFile(p) as z:
                  for name in z.namelist():
                      if not name.lower().endswith('.xml'):
                          continue
                      data=z.read(name)
                      text=data.decode('utf-8','ignore')
                      print('XML',fn,name,'bytes',len(data),'FST3_count',text.upper().count('FST3'))
                      # Print compact context around every FST3 occurrence.
                      for m in re.finditer('FST3',text,re.I):
                          s=max(0,m.start()-1800); e=min(len(text),m.end()+5000)
                          ctx=text[s:e].replace('><','>\n<')
                          print('FST3_CONTEXT_BEGIN',fn)
                          print(ctx)
                          print('FST3_CONTEXT_END',fn)
                          hits.append({'file':fn,'xml':name,'offset':m.start(),'context':ctx[:12000]})
                      # Also parse XML and emit any element subtree containing FST3.
                      try:
                          rootel=ET.fromstring(data)
                          parent={c:p for p in rootel.iter() for c in p}
                          for el in rootel.iter():
                              blob=' '.join([el.tag, el.text or '']+[str(v) for v in el.attrib.values()])
                              if 'FST3' in blob.upper():
                                  cur=el
                                  for _ in range(4):
                                      if cur in parent: cur=parent[cur]
                                  xmltxt=ET.tostring(cur,encoding='unicode')
                                  print('FST3_SUBTREE_BEGIN',fn)
                                  print(xmltxt[:30000])
                                  print('FST3_SUBTREE_END',fn)
                      except Exception as e:
                          print('XML_PARSE_ERROR',fn,str(e))
          print('HITS_COUNT',len(hits))
          PY

      - name: Upload probe files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eur-estr-history-probe
          path: downloads
