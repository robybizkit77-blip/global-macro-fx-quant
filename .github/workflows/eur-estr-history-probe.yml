name: EUR ESTR Contract Probe

on:
  push:
    branches:
      - staging-eur-estr-history-parse-2026-09-30
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse Eurex daily statistics at contract level
        run: |
          pip install pandas xlrd requests
          python - <<'PY'
          import io, requests, pandas as pd, re, json
          urls={
            '2026-09-28':'https://www.eurex.com/resource/blob/5598608/6751d12c5792756e2201001b9bbdc5ec/data/dailystat_20260928.xls',
            '2026-09-23':'https://www.eurex.com/resource/blob/5587244/b10f267f148bc82e2a993fe9b54ab78c/data/dailystat_20260923.xls'
          }
          needles=['FST3','202612','202703','202709','DEC 26','MAR 27','SEP 27','DEC-26','MAR-27','SEP-27']
          for dt,url in urls.items():
              b=requests.get(url,timeout=120).content
              xl=pd.ExcelFile(io.BytesIO(b))
              df=xl.parse('Eurex Daily Statistics',header=None,dtype=str)
              print('DATE',dt,'SHAPE',df.shape)
              print('HEADERS_0_40')
              print(df.iloc[:40].fillna('').to_string(index=True,header=False,max_cols=60))
              for needle in needles:
                  mask=df.apply(lambda col: col.astype(str).str.contains(needle,case=False,na=False,regex=False)).any(axis=1)
                  idx=list(df.index[mask])
                  print('NEEDLE',dt,needle,'ROWS',idx[:100])
                  for i in idx[:30]:
                      lo=max(0,i-2); hi=min(len(df),i+3)
                      print('ROW_BLOCK',dt,needle,i)
                      print(df.iloc[lo:hi].fillna('').to_string(index=True,header=False,max_cols=60))
              # scan numeric price-like 97.xx values near FST3 area and globally with row content
              price_rows=[]
              for i,row in df.iterrows():
                  vals=[str(x) for x in row.tolist() if str(x)!='nan']
                  if any(re.fullmatch(r'97\.\d{2,6}',v.strip()) for v in vals):
                      price_rows.append(i)
              print('PRICE97_ROWS_COUNT',dt,len(price_rows),'SAMPLE',price_rows[:120])
              for i in price_rows[:80]:
                  txt=' | '.join(str(x) for x in df.iloc[i].tolist() if str(x)!='nan')
                  if any(k in txt.upper() for k in ['FST3','ESTR','EURO STR','DEC','MAR','SEP','2026','2027']):
                      print('PRICE_ROW_RELEVANT',dt,i,txt[:6000])
          PY
