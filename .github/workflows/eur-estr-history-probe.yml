name: EUR ESTR History Probe

on:
  push:
    branches:
      - staging-eur-estr-history-parse-2026-09-30
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Linear scan official Eurex CB001 XML for FST3
        run: |
          pip install requests
          python - <<'PY'
          import requests, zipfile, io, re
          urls={
            '2026-09-28':'https://www.eurex.com/resource/blob/5595402/c77f82fac9fd707b5ec2c2e88de5c361/data/90rptcb001publi20260928.zip',
            '2026-09-23':'https://www.eurex.com/resource/blob/5585444/87703cbd7db64f8b70a12d045e399df0/data/90rptcb001publi20260923.zip'
          }
          for dt,url in urls.items():
              r=requests.get(url,timeout=120); r.raise_for_status()
              z=zipfile.ZipFile(io.BytesIO(r.content))
              data=z.read(z.namelist()[0]).decode('utf-8','ignore')
              pos=[m.start() for m in re.finditer('FST3',data,re.I)]
              print('DATE',dt,'FST3_OCCURRENCES',len(pos),'XML_CHARS',len(data))
              for i,p in enumerate(pos[:80]):
                  s=max(0,p-2200); e=min(len(data),p+6500)
                  ctx=data[s:e].replace('><','>\n<')
                  print(f'CTX_BEGIN {dt} {i} offset={p}')
                  print(ctx)
                  print(f'CTX_END {dt} {i}')
          PY
