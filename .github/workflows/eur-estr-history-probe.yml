name: EUR ESTR Eurex API Probe

on:
  push:
    branches:
      - staging-eur-estr-history-parse-2026-09-30
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Capture Eurex API traffic
        run: |
          cat > probe.js <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            page.on('request',req=>{
              const u=req.url();
              if(/\/api\/v\d+\//i.test(u)) console.log('API_REQ',req.method(),u,'POST',req.postData()||'');
            });
            page.on('response',async res=>{
              const u=res.url();
              if(/\/api\/v\d+\//i.test(u)){
                let body='';
                try{body=(await res.text()).slice(0,50000)}catch(e){}
                console.log('API_RESP',res.status(),u,'BODY',body);
              }
            });
            const url='https://www.eurex.com/ex-en/markets/int/mon/3m-euro-str-futures/estr/Three-Month-Euro-STR-Futures-3402480';
            await page.goto(url,{waitUntil:'networkidle',timeout:120000});
            await page.waitForTimeout(5000);
            console.log('PAGE_URL',page.url());
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node probe.js
