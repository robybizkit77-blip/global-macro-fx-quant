name: EUR ESTR Widget Script Probe

on:
  push:
    branches:
      - staging-eur-estr-history-parse-2026-09-30
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect Eurex prices-statistics widget source
        run: |
          pip install requests
          python - <<'PY'
          import requests,re
          url='https://www.eurex.com/resource/themes/eurex-facelift/js/prices-statistics-3466696-63.js'
          s=requests.get(url,timeout=120).text
          print('SIZE',len(s))
          pats=['fullOrderBook','contractDate','contract-date','Fetch Data','fetchData','datepicker','histor','quote','settlement','marketData']
          for pat in pats:
              poss=[m.start() for m in re.finditer(re.escape(pat),s,re.I)]
              print('PATTERN',pat,'COUNT',len(poss))
              for p in poss[:30]:
                  print('CTX',pat,p,s[max(0,p-3000):p+8000])
          # surface strings that look like dynamic action URLs
          urls=sorted(set(re.findall(r'["\']([^"\']*![-A-Za-z0-9_/?=&.]+)["\']',s)))
          print('ACTION_STRINGS',urls[:500])
          PY
