name: EUR ESTR History Probe

on:
  push:
    branches:
      - staging-eur-estr-history-parse-2026-09-30
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and parse official Eurex CB001 XML
        run: |
          pip install requests
          python - <<'PY'
          import requests, zipfile, io, re, xml.etree.ElementTree as ET, json

          urls={
            '2026-09-28':'https://www.eurex.com/resource/blob/5595402/c77f82fac9fd707b5ec2c2e88de5c361/data/90rptcb001publi20260928.zip',
            '2026-09-23':'https://www.eurex.com/resource/blob/5585444/87703cbd7db64f8b70a12d045e399df0/data/90rptcb001publi20260923.zip'
          }

          def stripns(tag): return tag.split('}',1)[-1]
          def flat(el):
              out=[]
              for x in el.iter():
                  t=stripns(x.tag)
                  v=(x.text or '').strip()
                  if v:
                      out.append((t,v))
                  for k,val in x.attrib.items():
                      out.append((stripns(k),str(val)))
              return out

          results={}
          for dt,url in urls.items():
              r=requests.get(url,timeout=120)
              r.raise_for_status()
              z=zipfile.ZipFile(io.BytesIO(r.content))
              name=z.namelist()[0]
              data=z.read(name)
              print('SOURCE',dt,url,'zip_bytes',len(r.content),'xml_bytes',len(data),'xml_name',name)
              root=ET.fromstring(data)

              candidates=[]
              seen=set()
              for el in root.iter():
                  pairs=flat(el)
                  txt=' | '.join(f'{k}={v}' for k,v in pairs)
                  if 'FST3' not in txt.upper():
                      continue
                  # Keep compact likely instrument/price records, not huge document ancestors.
                  if len(txt)>12000:
                      continue
                  key=txt[:4000]
                  if key in seen: continue
                  seen.add(key)
                  score=0
                  up=txt.upper()
                  for w in ['SETT','PRICE','EXPIR','CONTRACT','MATUR','DATE','OPEN','CLOSE','INSTR','PRODUCT']:
                      if w in up: score+=1
                  candidates.append((score,len(txt),txt))

              candidates=sorted(candidates,key=lambda x:(-x[0],x[1]))[:80]
              print('CANDIDATE_COUNT',dt,len(candidates))
              for i,(score,n,txt) in enumerate(candidates[:40]):
                  print(f'CANDIDATE {dt} #{i} score={score} len={n}')
                  print(txt[:10000])

              results[dt]=[x[2] for x in candidates[:40]]

          print('RESULT_JSON='+json.dumps(results,ensure_ascii=False))
          PY
