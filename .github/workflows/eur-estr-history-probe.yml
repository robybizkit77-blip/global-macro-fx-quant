name: EUR ESTR History Probe

on:
  push:
    branches:
      - staging-eur-estr-history-parse-2026-09-30
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan official Eurex CB002 price XML for FST3
        run: |
          pip install requests
          python - <<'PY'
          import requests, zipfile, io, re
          urls={
            '2026-09-28':'https://www.eurex.com/resource/blob/5595268/4ce7a39c4801a834613321ea14fd02e8/data/90rptcb002publi20260928.zip',
            '2026-09-23':'https://www.eurex.com/resource/blob/5585438/b28451ff709d8ff409f85d3655511075/data/90rptcb002publi20260923.zip'
          }
          for dt,url in urls.items():
              r=requests.get(url,timeout=120); r.raise_for_status()
              z=zipfile.ZipFile(io.BytesIO(r.content))
              xmlname=z.namelist()[0]
              data=z.read(xmlname).decode('utf-8','ignore')
              pos=[m.start() for m in re.finditer('FST3',data,re.I)]
              print('SOURCE',dt,url,'XML',xmlname,'CHARS',len(data),'FST3_OCCURRENCES',len(pos))
              for i,p in enumerate(pos[:80]):
                  s=max(0,p-2600); e=min(len(data),p+9000)
                  ctx=data[s:e].replace('><','>\n<')
                  print(f'CTX_BEGIN {dt} {i} offset={p}')
                  print(ctx)
                  print(f'CTX_END {dt} {i}')
          PY
