name: Macro USD Labour Replay Diff Probe V1

on:
  push:
    branches:
      - 'validation-macro-usd-labour-pit-bootstrap-*'
    paths:
      - '.github/workflows/macro-usd-labour-replay-diff-probe-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce USD labour replay and print target-only exact diff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/usd-labour-diff && mkdir -p /tmp/usd-labour-diff
          set +e
          python3 validation/macro_pit_historical_bootstrap.py \
            --anchor-manifest validation/macro/usd_labour_historical_anchor_2026-09.json \
            --evidence-output /tmp/usd-labour-diff/evidence.json \
            --work-dir /tmp/usd-labour-diff/replay \
            > /tmp/usd-labour-diff/run.log 2>&1
          rc=$?
          set -e
          cat /tmp/usd-labour-diff/run.log
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('/tmp/usd-labour-diff/replay')
          print('FILES', [str(p) for p in sorted(root.rglob('*')) if p.is_file()])
          canonical=json.loads(Path('live_data/sections/MACRO_SERIES.json').read_text())
          target=next(x for x in canonical['USD'] if x.get('id')=='US_UNRATE_history_value')
          print('CANONICAL_TARGET=', json.dumps(target, indent=2, ensure_ascii=False))
          for p in root.rglob('*.json'):
              try: data=json.loads(p.read_text())
              except Exception: continue
              hits=[]
              def walk(x, path=''):
                  if isinstance(x, dict):
                      if x.get('id')=='US_UNRATE_history_value' or x.get('macro_series_id')=='US_UNRATE_history_value': hits.append((path,x))
                      for k,v in x.items(): walk(v, path+'/'+str(k))
                  elif isinstance(x,list):
                      for i,v in enumerate(x): walk(v,path+'/'+str(i))
              walk(data)
              for path,obj in hits:
                  print('HIT', p, path)
                  print(json.dumps(obj, indent=2, ensure_ascii=False))
          PY
          exit 0
