name: RBA AUD Exchange Settlement Balances Research Refresh V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/liquidity/refresh_rba_aud_es_balances_v1.py'
      - 'validation/liquidity/test_refresh_rba_aud_es_balances_v1.py'
      - '.github/workflows/rba-aud-es-balances-research-refresh-v1.yml'
  workflow_dispatch:
  schedule:
    # Weekly official RBA balance-sheet publication; check Thurs/Fri.
    - cron: '29 7 * * 4,5'
  push:
    branches: [main]
    paths:
      - 'validation/liquidity/refresh_rba_aud_es_balances_v1.py'
      - 'validation/liquidity/test_refresh_rba_aud_es_balances_v1.py'
      - '.github/workflows/rba-aud-es-balances-research-refresh-v1.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: rba-aud-es-balances-research-v1
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test historic anchor and current RBA source overlap without writes
        run: |
          python -m unittest validation.liquidity.test_refresh_rba_aud_es_balances_v1 -v
          python validation/liquidity/refresh_rba_aud_es_balances_v1.py --receipt /tmp/rba-source-proof.json
          git diff --exit-code
  source-only:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify official RBA ES reserves, parity anchor, and no FX claims
        run: python -m unittest validation.liquidity.test_refresh_rba_aud_es_balances_v1 -v
      - name: Snapshot canonical AUD liquidity and FX rankings
        run: |
          sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/aud-es-runtime.before
          sha256sum live_data/sections/PAIR_SETUP_OPERATIONAL_VIEW.json > /tmp/aud-es-fx.before
      - name: Fetch weekly RBA balance-sheet ES reserves as source-isolated research
        run: |
          python validation/liquidity/refresh_rba_aud_es_balances_v1.py \
            --apply --receipt /tmp/aud-rba-es-balances-receipt.json
          cat /tmp/aud-rba-es-balances-receipt.json >> "$GITHUB_STEP_SUMMARY"
      - name: Verify canonical files unchanged and strict sidecar-only mutations
        run: |
          sha256sum -c /tmp/aud-es-runtime.before /tmp/aud-es-fx.before
          python - <<'PY'
          import subprocess
          allowed={'site/fx-quant-v2/next/aud-rba-es-balances-research-v1.js'}
          modified=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert modified<=allowed,modified
          print('RBA_ES_RESERVES_RESEARCH_ONLY_PASS',sorted(modified))
          PY
      - name: Commit only verified RBA ES research
        run: |
          set -euo pipefail
          path=site/fx-quant-v2/next/aud-rba-es-balances-research-v1.js
          if git diff --quiet -- "$path"; then
            echo 'RBA_ES_RESEARCH_NO_CHANGE' >> "$GITHUB_STEP_SUMMARY"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- "$path"
            git commit -m 'Refresh official RBA settlement reserve balances (research only)'
            git fetch origin main --no-tags
            git rebase origin/main
            git push origin HEAD:main
            echo 'RBA_ES_RESEARCH_SOURCE_PERSISTED' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Mirror exact validated source to GitHub Pages with lease
        id: pages-sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=site/fx-quant-v2/next/aud-rba-es-balances-research-v1.js
          git fetch origin main --no-tags
          source_blob="$(git hash-object "$path")"
          test "$(git rev-parse "origin/main:$path")" = "$source_blob" || {
            echo 'RBA_ES_REMOTE_SOURCE_MOVED_WITHHELD'; exit 1;
          }
          git fetch origin gh-pages --no-tags
          pages_sha="$(git rev-parse origin/gh-pages)"
          git worktree add --detach /tmp/aud-es-research-pages origin/gh-pages
          mkdir -p /tmp/aud-es-research-pages/site/fx-quant-v2/next
          cp "$path" "/tmp/aud-es-research-pages/$path"
          cd /tmp/aud-es-research-pages
          if git diff --quiet -- "$path"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'RBA_ES_PAGES_ALREADY_CURRENT' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$(git diff --name-only)" = "$path"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$path"
          git commit -m 'Mirror RBA ES reserve balance research only'
          test "$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')" = "$pages_sha" || {
            echo 'RBA_ES_PAGES_RACE_WITHHELD'; exit 1;
          }
          git fetch origin main --no-tags
          test "$(git rev-parse "origin/main:$path")" = "$source_blob" || {
            echo 'RBA_ES_SOURCE_RACE_WITHHELD'; exit 1;
          }
          git push --force-with-lease=refs/heads/gh-pages:$pages_sha origin HEAD:gh-pages
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo 'RBA_ES_PAGES_MIRRORED' >> "$GITHUB_STEP_SUMMARY"
      - name: Queue Pages rebuild after source mirror
        if: steps.pages-sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds")"
          jq -e '.status == "queued" or .status == "building"' <<<"$result" >/dev/null
          echo 'RBA_ES_PAGES_BUILD_REQUEST_ACCEPTED' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain source and publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rba-aud-exchange-settlement-balances-receipt
          path: /tmp/aud-rba-es-balances-receipt.json
          if-no-files-found: warn
          retention-days: 14
