name: EUR Eurex FST3 History Probe Once

on:
  push:
    branches:
      - validation-cb-pricing-eur-2026-10-08
    paths:
      - .github/workflows/eur-eurex-fst3-history-probe-once.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation-cb-pricing-eur-2026-10-08
      - name: Probe official Eurex FST3 data endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/eur_probe validation/cb_pricing
          base='https://www.eurex.com'
          urls=(
            '/ex-en/markets/int/mon/3m-euro-str-futures/estr/3402482!fullOrderBook'
            '/ex-en/markets/int/mon/3m-euro-str-futures/estr/3402482!fullOrderBook?rif=1'
            '/ex-en/data/statistics/market-statistics-online/100!onlineStats'
            '/resource/themes/eurex-facelift/js/prices-statistics-3466696-63.js'
          )
          i=0
          for u in "${urls[@]}"; do
            i=$((i+1))
            echo "FETCH ${base}${u}"
            curl -fLsS --retry 2 -A 'Mozilla/5.0' "${base}${u}" -o "/tmp/eur_probe/probe${i}.txt" || true
          done
          # Try common date parameter shapes against the official FST3 endpoint. Do not infer values.
          n=10
          for d in 2026-09-22 2026-09-28 2026-09-29; do
            for q in "date=${d}" "tradeDate=${d}" "businessDate=${d}" "asOfDate=${d}" "fromDate=${d}&toDate=${d}"; do
              n=$((n+1))
              curl -LsS --retry 1 -A 'Mozilla/5.0' "${base}/ex-en/markets/int/mon/3m-euro-str-futures/estr/3402482!fullOrderBook?${q}" -o "/tmp/eur_probe/probe${n}.txt" || true
              printf '%s\t%s\n' "$n" "$q" >> /tmp/eur_probe/query_map.tsv
            done
          done
          python3 - <<'PY'
          import pathlib,re,json,hashlib
          root=pathlib.Path('/tmp/eur_probe')
          out={'source':'Eurex official public endpoints','product':'FST3','target_dates':['2026-09-22','2026-09-28','2026-09-29'],'responses':{},'js_hints':[],'queries':{}}
          qmap={}
          qp=root/'query_map.tsv'
          if qp.exists():
              for line in qp.read_text().splitlines():
                  a,b=line.split('\t',1); qmap[int(a)]=b
          for p in sorted(root.glob('probe*.txt')):
              text=p.read_text(encoding='utf-8',errors='replace')
              num=int(re.search(r'(\d+)',p.stem).group(1))
              info={'bytes':len(text),'sha256':hashlib.sha256(text.encode()).hexdigest(),'contains_FST3':'FST3' in text,'contains_2026_09_22':'2026-09-22' in text,'contains_2026_09_28':'2026-09-28' in text,'contains_2026_09_29':'2026-09-29' in text}
              # collect recognizable contract and price snippets only; no numeric interpretation yet
              snippets=[]
              for key in ['Dec 2026','Mar 2027','Sep 2027','settlement','lastPrice','tradeDate','businessDate','dateFrom','dateTo','fromDate','toDate']:
                  start=0; low=text.lower(); k=key.lower()
                  while True:
                      i=low.find(k,start)
                      if i<0: break
                      snippets.append({'key':key,'snippet':text[max(0,i-350):i+900]})
                      start=i+len(k)
                      if len(snippets)>=30: break
                  if len(snippets)>=30: break
              info['snippets']=snippets
              out['responses'][p.name]=info
              if num in qmap: out['queries'][p.name]=qmap[num]
              if num==4:
                  for pat in [r'url\s*[:=]\s*["\']([^"\']+)',r'ajax[^\n]{0,500}',r'fromDate[^\n]{0,300}',r'toDate[^\n]{0,300}',r'businessDate[^\n]{0,300}',r'tradeDate[^\n]{0,300}']:
                      for m in re.findall(pat,text,re.I):
                          out['js_hints'].append(m if isinstance(m,str) else ''.join(m))
          dest=pathlib.Path('validation/cb_pricing/EUR_EUREX_FST3_ENDPOINT_PROBE_2026-10-08.json')
          dest.write_text(json.dumps(out,indent=2),encoding='utf-8')
          print('responses',len(out['responses']),'js_hints',len(out['js_hints']))
          PY
      - name: Commit endpoint evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/cb_pricing/EUR_EUREX_FST3_ENDPOINT_PROBE_2026-10-08.json
          git diff --cached --quiet && exit 0
          git commit -m 'Capture Eurex FST3 endpoint probe evidence'
          git push origin HEAD:validation-cb-pricing-eur-2026-10-08
