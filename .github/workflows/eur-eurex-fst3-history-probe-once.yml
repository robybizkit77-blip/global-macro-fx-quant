name: EUR Eurex FST3 History Probe Once

on:
  push:
    branches:
      - validation-cb-pricing-eur-2026-10-08
    paths:
      - .github/workflows/eur-eurex-fst3-history-probe-once.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation-cb-pricing-eur-2026-10-08
      - name: Resolve and download official Eurex daily statistics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/eurex validation/cb_pricing
          base='https://www.eurex.com'
          for p in 1 2 3 4 5; do
            curl -fLsS --retry 2 -A 'Mozilla/5.0' "$base/ex-en/data/statistics/trading-statistics/122!search?pageNum=$p&hitsPerPage=100&query=&state=" -o "/tmp/eurex/page$p.html"
          done
          python3 - <<'PY'
          import pathlib,re,html,json
          joined='\n'.join(p.read_text(errors='replace') for p in sorted(pathlib.Path('/tmp/eurex').glob('page*.html')))
          links={}
          for iso,stamp in [('2026-09-22','20260922'),('2026-09-28','20260928'),('2026-09-29','20260929')]:
              m=re.search(r'href="([^"]*dailystat_'+stamp+r'\.xls[^"]*)"',joined,re.I)
              if m: links[iso]=html.unescape(m.group(1))
          pathlib.Path('/tmp/eurex/links.json').write_text(json.dumps(links,indent=2))
          print(links)
          if len(links)!=3: raise SystemExit('Could not resolve all official daily statistic files')
          PY
          python3 - <<'PY'
          import pathlib,json,subprocess
          base='https://www.eurex.com'; links=json.loads(pathlib.Path('/tmp/eurex/links.json').read_text())
          for d,u in links.items():
              if u.startswith('/'): u=base+u
              out=f'/tmp/eurex/{d}.xls'
              subprocess.run(['curl','-fLsS','--retry','2','-A','Mozilla/5.0',u,'-o',out],check=True)
              print(d,u,pathlib.Path(out).stat().st_size)
          PY
      - name: Inspect XLS for FST3 and settlement-like fields
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q pandas xlrd
          python3 - <<'PY'
          import pandas as pd, pathlib, json, hashlib, re
          out={'source':'Eurex official daily Trading statistics XLS','product':'FST3','dates':{}}
          for f in sorted(pathlib.Path('/tmp/eurex').glob('2026-09-*.xls')):
              rec={'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'sheets':{},'fst3_rows':[]}
              book=pd.ExcelFile(f)
              for s in book.sheet_names:
                  df=pd.read_excel(f,sheet_name=s,header=None,dtype=str)
                  mask=df.apply(lambda col: col.astype(str).str.contains('FST3',case=False,na=False)).any(axis=1)
                  hits=df[mask]
                  rec['sheets'][s]={'rows':len(df),'cols':len(df.columns),'fst3_hits':len(hits)}
                  for idx,row in hits.iterrows():
                      vals=[None if pd.isna(v) else str(v) for v in row.tolist()]
                      rec['fst3_rows'].append({'sheet':s,'row':int(idx),'values':vals})
              out['dates'][f.stem]=rec
          pathlib.Path('validation/cb_pricing/EUR_EUREX_FST3_DAILY_STATS_PROBE_2026-10-08.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print({d:len(v['fst3_rows']) for d,v in out['dates'].items()})
          if not all(v['fst3_rows'] for v in out['dates'].values()): raise SystemExit('FST3 missing from one or more official XLS files')
          PY
      - name: Commit daily statistics evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/cb_pricing/EUR_EUREX_FST3_DAILY_STATS_PROBE_2026-10-08.json
          git diff --cached --quiet && exit 0
          git commit -m 'Capture Eurex FST3 daily statistics evidence'
          git push origin HEAD:validation-cb-pricing-eur-2026-10-08
