name: EUR Eurex FST3 History Probe Once

on:
  push:
    branches:
      - validation-cb-pricing-eur-2026-10-08
    paths:
      - .github/workflows/eur-eurex-fst3-history-probe-once.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation-cb-pricing-eur-2026-10-08
      - name: Download exact official Eurex daily statistics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/eurex validation/cb_pricing
          base='https://www.eurex.com'
          cat > /tmp/eurex/links.tsv <<'EOF'
          2026-09-22	/resource/blob/5584466/da34c877548294364fc294063a623811/data/dailystat_20260922.xls
          2026-09-28	/resource/blob/5598608/6751d12c5792756e2201001b9bbdc5ec/data/dailystat_20260928.xls
          2026-09-29	/resource/blob/5601548/d80dd279274d0ddf9b87eccf7eaef7af/data/dailystat_20260929.xls
          EOF
          while IFS=$'\t' read -r d u; do
            curl -fLsS --retry 2 -A 'Mozilla/5.0' "$base$u" -o "/tmp/eurex/$d.xls"
            echo "$d $u $(stat -c%s /tmp/eurex/$d.xls) bytes"
          done < /tmp/eurex/links.tsv
      - name: Inspect XLS for FST3 and headers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q pandas xlrd
          python3 - <<'PY'
          import pandas as pd, pathlib, json, hashlib
          out={'source':'Eurex official daily Trading statistics XLS','product':'FST3','dates':{}}
          for f in sorted(pathlib.Path('/tmp/eurex').glob('2026-09-*.xls')):
              rec={'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'sheets':{},'fst3_rows':[]}
              book=pd.ExcelFile(f)
              for s in book.sheet_names:
                  df=pd.read_excel(f,sheet_name=s,header=None,dtype=str)
                  mask=df.apply(lambda col: col.astype(str).str.contains('FST3',case=False,na=False)).any(axis=1)
                  hits=df[mask]
                  # preserve a few rows above each hit to recover headers/column meaning
                  rec['sheets'][s]={'rows':len(df),'cols':len(df.columns),'fst3_hits':len(hits)}
                  for idx,row in hits.iterrows():
                      vals=[None if pd.isna(v) else str(v) for v in row.tolist()]
                      context=[]
                      for j in range(max(0,int(idx)-8),int(idx)+1):
                          r=df.iloc[j]
                          context.append({'row':j,'values':[None if pd.isna(v) else str(v) for v in r.tolist()]})
                      rec['fst3_rows'].append({'sheet':s,'row':int(idx),'values':vals,'context':context})
              out['dates'][f.stem]=rec
          pathlib.Path('validation/cb_pricing/EUR_EUREX_FST3_DAILY_STATS_PROBE_2026-10-08.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print({d:len(v['fst3_rows']) for d,v in out['dates'].items()})
          if len(out['dates']) != 3: raise SystemExit('Expected three official XLS files')
          if not all(v['fst3_rows'] for v in out['dates'].values()): raise SystemExit('FST3 missing from one or more official XLS files')
          PY
      - name: Commit daily statistics evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/cb_pricing/EUR_EUREX_FST3_DAILY_STATS_PROBE_2026-10-08.json
          git diff --cached --quiet && exit 0
          git commit -m 'Capture Eurex FST3 daily statistics evidence'
          git push origin HEAD:validation-cb-pricing-eur-2026-10-08
