name: JPY TONA Browser Audit

on:
  push:
    branches:
      - staging-jpy-tona-history-probe-2026-09-30
  workflow_dispatch:

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright package
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/gmfq-server.log 2>&1 &
          sleep 2
      - name: Verify JPY ACTIVE runtime
        run: |
          cat > browser-audit.js <<'EOF'
          const { chromium } = require('playwright');
          const { execSync } = require('child_process');
          (async()=>{
            const chromePath=execSync('command -v google-chrome-stable || command -v google-chrome || command -v chromium').toString().trim();
            const browser=await chromium.launch({headless:true,executablePath:chromePath,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            const consoleErrors=[], pageErrors=[], httpErrors=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('response',r=>{if(r.status()>=400) httpErrors.push({status:r.status(),url:r.url()})});
            const res=await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle',timeout:120000});
            if(!res?.ok()) throw new Error('HTTP load failed');
            await page.waitForFunction(()=>document.documentElement.getAttribute('data-post-gate-final-audit'),null,{timeout:120000});
            const x=await page.evaluate(()=>{
              const jpy=window.__GMFQ_DATA?.OIS_DATA?.currencies?.JPY;
              const cb=(typeof NATIVE_CB_DATA!=='undefined' ? NATIVE_CB_DATA?.JPY?.market_pricing : null);
              return {
                finalAudit:window.GMFQ_POST_GATE_FINAL_AUDIT||null,
                jpyAudit:window.GMFQ_JPY_TONA_AUDIT||null,
                jpyStatus:window.GMFQ_OIS?.currency?.('JPY')?.status||null,
                eurStatus:window.GMFQ_OIS?.currency?.('EUR')?.status||null,
                gbpStatus:window.GMFQ_OIS?.currency?.('GBP')?.status||null,
                cadStatus:window.GMFQ_OIS?.currency?.('CAD')?.status||null,
                jpy,cb,
                bodyTextLength:document.body?.innerText?.length||0
              };
            });
            console.log(JSON.stringify({x,consoleErrors,pageErrors,httpErrors},null,2));
            if(x.finalAudit?.status!=='PASS') throw new Error('Final audit '+JSON.stringify(x.finalAudit));
            if(x.jpyAudit?.status!=='PASS') throw new Error('JPY audit '+JSON.stringify(x.jpyAudit));
            if(x.jpyStatus!=='ACTIVE'||x.eurStatus!=='ACTIVE'||x.gbpStatus!=='ACTIVE'||x.cadStatus!=='ACTIVE') throw new Error('ACTIVE status mismatch');
            const h=x.jpy?.horizons||{};
            const near=(a,b)=>Math.abs(Number(a)-Number(b))<1e-9;
            if(!near(h['3m']?.rate,1.555)||!near(h['6m']?.rate,1.755)||!near(h['12m']?.rate,2.119)) throw new Error('JPY rate mismatch');
            if(!near(h['3m']?.change_1d_bp,6.5)||!near(h['3m']?.change_1w_bp,6.5)) throw new Error('JPY 3m changes mismatch');
            if(!near(h['6m']?.change_1d_bp,6.5)||!near(h['6m']?.change_1w_bp,6.5)) throw new Error('JPY 6m changes mismatch');
            if(!near(h['12m']?.change_1d_bp,-2.2)||!near(h['12m']?.change_1w_bp,10.1)) throw new Error('JPY 12m changes mismatch');
            if(!x.cb||!near(x.cb.h3m,1.555)||!near(x.cb.h6m,1.755)||!near(x.cb.h12m,2.119)) throw new Error('JPY CB pricing mismatch');
            const nonBenignHttp=httpErrors.filter(e=>!String(e.url).endsWith('/favicon.ico'));
            const nonBenignConsole=consoleErrors.filter(e=>!String(e).includes('404'));
            if(nonBenignHttp.length||nonBenignConsole.length||pageErrors.length) throw new Error('Browser errors '+JSON.stringify({nonBenignHttp,nonBenignConsole,pageErrors,httpErrors}));
            if(x.bodyTextLength<1000) throw new Error('Body too small');
            await page.screenshot({path:'jpy-tona-browser-audit.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node browser-audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jpy-tona-browser-audit
          path: |
            jpy-tona-browser-audit.png
            /tmp/gmfq-server.log
