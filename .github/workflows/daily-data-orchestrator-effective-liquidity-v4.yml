name: Daily Data Orchestrator Effective Liquidity V4

on:
  push:
    branches:
      - release-candidate-daily-data-orchestrator-v1-2026-10-12
    paths:
      - 'validation/run_daily_data_orchestrator_effective_v4.py'
      - 'validation/run_daily_data_orchestrator_effective_v3.py'
      - 'validation/liquidity/LIQUIDITY_POLICY_OVERRIDE_JPY_M3_V1_2026-10-13.json'
      - 'validation/liquidity/JPY_M3_PROVENANCE_RESOLUTION_2026-10-13.json'
      - 'validation/fetch_boj_jpy_m3_exact_candidate.py'
      - 'validation/apply_boj_jpy_m3_exact_candidate.py'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
      - '.github/workflows/daily-data-orchestrator-effective-liquidity-v4.yml'
  pull_request:
    branches:
      - release-candidate-freshness-registry-v1-2026-10-12
    paths:
      - 'validation/run_daily_data_orchestrator_effective_v4.py'
      - 'validation/run_daily_data_orchestrator_effective_v3.py'
      - 'validation/liquidity/LIQUIDITY_POLICY_OVERRIDE_JPY_M3_V1_2026-10-13.json'
      - 'validation/liquidity/JPY_M3_PROVENANCE_RESOLUTION_2026-10-13.json'
      - 'validation/fetch_boj_jpy_m3_exact_candidate.py'
      - 'validation/apply_boj_jpy_m3_exact_candidate.py'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
      - '.github/workflows/daily-data-orchestrator-effective-liquidity-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  effective-liquidity-v4-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot tracked runtime
        run: sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/runtime.before.sha256
      - name: Build effective V4 receipt
        run: |
          python validation/run_daily_data_orchestrator_effective_v4.py > /tmp/effective-v4.json
          cat /tmp/effective-v4.json
      - name: Enforce 16 READY / 10 pending
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/effective-v4.json'))
          liq=d['lanes']['LIQUIDITY']
          assert liq['automation_ready_subseries']==16, liq
          assert liq['mapping_pending_subseries']==10, liq
          assert liq['verified_subseries']==16, liq
          assert liq['unresolved_subseries']==10, liq
          assert liq['total_subseries']==26, liq
          assert liq['jpy_m3_automation_ready'] is True, liq
          assert liq['jpy_m3_controlled_apply_proven'] is True, liq
          assert liq['jpy_m3_series_id']=='MAM1XAM3M3MO', liq
          assert liq['jpy_m3_collector']=='validation/fetch_boj_jpy_m3_exact_candidate.py', liq
          assert liq['jpy_m3_applier']=='validation/apply_boj_jpy_m3_exact_candidate.py', liq
          assert liq['jpy_m3_apply_proof_run_id']==38398784280, liq
          assert liq['jpy_m3_official_tail']=={'date':'2026-08','value':16377129.0}, liq
          o=d['effective_liquidity_overlay_v4']
          assert o['ready']==16 and o['pending']==10 and o['total']==26, o
          assert o['runtime_mutated'] is False and o['publication_performed'] is False, o
          print('EFFECTIVE_LIQUIDITY_V4_16_10_PASS')
          PY
      - name: Re-prove BOJ JPY M3 controlled apply on runtime copy
        run: |
          python validation/fetch_boj_jpy_m3_exact_candidate.py --out /tmp/jpy-m3.json
          python validation/apply_boj_jpy_m3_exact_candidate.py --candidate /tmp/jpy-m3.json > /tmp/jpy-m3-dry.json
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/NATIVE_LIQ_DATA.jpy-m3.json
          python validation/apply_boj_jpy_m3_exact_candidate.py --candidate /tmp/jpy-m3.json --runtime /tmp/NATIVE_LIQ_DATA.jpy-m3.json --apply > /tmp/jpy-m3-apply.json
          python - <<'PY'
          import json
          c=json.load(open('/tmp/jpy-m3.json'))
          dry=json.load(open('/tmp/jpy-m3-dry.json'))
          r=json.load(open('/tmp/jpy-m3-apply.json'))
          original=json.load(open('live_data/sections/NATIVE_LIQ_DATA.json'))['JPY']['money']
          applied=json.load(open('/tmp/NATIVE_LIQ_DATA.jpy-m3.json'))['JPY']['money']
          assert c['source']['database']=='MD02' and c['source']['series_id']=='MAM1XAM3M3MO', c
          assert c['runtime_overlap_count']==128 and c['runtime_exact_match_count']==128, c
          assert c['runtime_exact_match_ratio']==1.0, c
          assert c['runtime_history_unchanged_by_current_vintage'] is True, c
          assert c['latest_date']=='2026-08' and float(c['latest_value'])==16377129.0, c
          assert c['new_observations']==[], c
          assert dry['status']=='NO_CHANGE' and dry['applied'] is False, dry
          assert r['status']=='NO_CHANGE' and r['applied'] is False and r['appended_observations']==0, r
          assert applied==original, (applied, original)
          print('JPY_M3_CONTROLLED_APPLY_REPROOF_PASS')
          PY
      - name: Verify tracked runtime unchanged
        run: |
          sha256sum -c /tmp/runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Summary
        run: |
          echo 'Effective Liquidity V4 coverage: 16 READY / 10 pending / 26 total'
          echo 'JPY money BOJ M3 controlled apply: GREEN'
          echo 'Tracked runtime mutation: NONE'
          echo 'Publication: NONE'
