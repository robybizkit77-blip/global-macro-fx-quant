name: CHF FSO growth history source proof V1
on:
  pull_request:
    paths:
      - 'validation/macro/probe_chf_fso_growth_history_v1.py'
      - '.github/workflows/chf-fso-growth-history-proof-v1.yml'
permissions:
  contents: read
jobs:
  source-proof:
    if: github.head_ref == 'research/chf-fso-growth-history-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl
      - run: python -m validation.macro.probe_chf_fso_growth_history_v1
