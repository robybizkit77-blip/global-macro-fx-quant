name: OIS Gap Closure Gate
on:
  push:
    branches: [staging-ois-gap-closure-2026-10-01]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y >/dev/null 2>&1 && npm install --save-dev playwright
      - name: Verify OIS gap closure
        run: |
          cat > verify.js <<'EOF'
          const {chromium}=require('playwright');
          const {execSync,spawn}=require('child_process');
          (async()=>{
            const srv=spawn('python3',['-m','http.server','8765'],{stdio:'ignore'});
            await new Promise(r=>setTimeout(r,1000));
            const cp=execSync('command -v google-chrome-stable || command -v google-chrome || command -v chromium').toString().trim();
            const browser=await chromium.launch({headless:true,executablePath:cp,args:['--no-sandbox']});
            const page=await browser.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'networkidle',timeout:120000});
            await page.waitForTimeout(2500);
            const out=await page.evaluate(()=>({
              fp:typeof forwardValidationSummary==='function'?forwardValidationSummary()?.current_rules_fingerprint:null,
              pairs:(D?.pairs||[]).length,
              closure:window.GMFQ_OIS_GAP_CLOSURE||null,
              activation:window.GMFQ_OIS_SOURCE_MONITOR?.activationState?.()||null,
              unresolved:typeof unresolvedSourceChecks==='function'?unresolvedSourceChecks().map(x=>x.id):[],
              hard:(typeof productionHealthCheck==='function'?productionHealthCheck()?.hard_errors:[])||[]
            }));
            out.js=errors;
            console.log(JSON.stringify(out,null,2));
            await browser.close();srv.kill();
            const issues=[];
            if(out.fp!=='3356baf0')issues.push('fingerprint');
            if(out.pairs!==28)issues.push('pairs');
            if(out.closure?.status!=='PASS')issues.push('closure');
            if(out.activation?.active!==5||out.activation?.withheld!==3)issues.push('activation '+JSON.stringify(out.activation));
            if(JSON.stringify(out.unresolved)!==JSON.stringify(['USD_CB_PRICING']))issues.push('unresolved '+JSON.stringify(out.unresolved));
            if(out.hard.length)issues.push('hard '+JSON.stringify(out.hard));
            if(out.js.length)issues.push('js '+JSON.stringify(out.js));
            if(issues.length){console.error(issues);process.exit(1);}
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node verify.js
