name: Eurostat Vintage Discovery

on:
  push:
    branches:
      - engine-freeze-v1-2026-10-02
    paths:
      - 'validation/discover_eurostat_vintages.py'
      - '.github/workflows/eurostat-vintage-discovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engine-freeze-v1-2026-10-02
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover Eurostat real-time/vintage dataflows
        run: python validation/discover_eurostat_vintages.py
      - name: Commit discovery result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/eurostat_discovery/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Discover Eurostat vintage dataflows"
            git push origin HEAD:engine-freeze-v1-2026-10-02
          fi
