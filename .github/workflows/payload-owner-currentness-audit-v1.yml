name: Payload Owner Currentness Audit V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'payload/**'
      - 'dashboard/**'
      - 'validation/ui/audit_payload_owner_currentness_v1.js'
      - '.github/workflows/payload-owner-currentness-audit-v1.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'payload/**'
      - 'dashboard/**'
      - 'validation/ui/audit_payload_owner_currentness_v1.js'
      - '.github/workflows/payload-owner-currentness-audit-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start dashboard
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/payload-owner-currentness-server.log 2>&1 &
          sleep 2
      - name: Audit remaining payload owners desktop/mobile
        run: node validation/ui/audit_payload_owner_currentness_v1.js | tee /tmp/payload-owner-currentness.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payload-owner-currentness-audit-v1
          path: |
            payload-owner-currentness-evidence/**
            /tmp/payload-owner-currentness-server.log
