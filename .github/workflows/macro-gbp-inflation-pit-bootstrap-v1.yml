name: Macro GBP Inflation PIT Bootstrap V1

on:
  push:
    branches:
      - 'validation-macro-gbp-inflation-pit-bootstrap-*'
    paths:
      - '.github/workflows/macro-gbp-inflation-pit-bootstrap-v1.yml'
      - 'validation/macro_pit_historical_bootstrap.py'
      - 'validation/test_macro_pit_historical_bootstrap.py'
      - 'validation/macro_pit_registry_promotion.py'
      - 'validation/test_macro_pit_registry_promotion.py'
      - 'validation/macro/gbp_inflation_historical_anchor_2026-08.json'
      - 'validation/sources/gbp_ons_core.py'
      - 'validation/build_macro_candidate.py'
      - 'validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json'
      - 'live_data/sections/MACRO_SERIES.json'
      - 'live_data/sections/MACRO_THERMOMETER_DATA.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macro-gbp-inflation-pit-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  historical-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run bootstrap and promotion fail-closed tests
        run: |
          python3 validation/test_macro_pit_historical_bootstrap.py
          python3 validation/test_macro_pit_registry_promotion.py

      - name: Verify current official ONS CPI candidate read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gbp-cpi-bootstrap/live
          python3 validation/sources/gbp_ons_core.py \
            --dimension inflation \
            --output /tmp/gbp-cpi-bootstrap/live/candidate.json \
            --audit-output /tmp/gbp-cpi-bootstrap/live/source-audit.json \
            | tee /tmp/gbp-cpi-bootstrap/live/source-run.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/gbp-cpi-bootstrap/live/candidate.json').read_text())
          a=json.loads(Path('/tmp/gbp-cpi-bootstrap/live/source-audit.json').read_text())
          m=json.loads(Path('validation/macro/gbp_inflation_historical_anchor_2026-08.json').read_text())
          assert c['currency']=='GBP' and c['dimension']=='inflation'
          assert c['series_id']==m['series_id']=='D7G7'
          assert c['macro_series_id']==m['target']['macro_series_id']=='UK_CPI_HEADLINE_YOY_history_value'
          assert c['observation_date'][:7]==m['current']['observation_date'][:7]
          assert float(c['value'])==float(m['current']['value'])==3.1
          assert a['prior_period'][:7]==m['previous']['observation_date'][:7]
          assert float(a['prior_value'])==float(m['previous']['value'])==2.9
          assert a['mode']=='live' and a['candidate_only'] is True and a['live_data_written'] is False
          print(json.dumps({'status':'CURRENT_OFFICIAL_GBP_CPI_MATCH','candidate':c,'prior':{'period':a['prior_period'],'value':a['prior_value']}}, indent=2))
          PY
          git diff --exit-code -- live_data/sections/MACRO_SERIES.json live_data/sections/MACRO_THERMOMETER_DATA.json

      - name: Run historical PIT bootstrap replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gbp-cpi-bootstrap/replay
          python3 validation/macro_pit_historical_bootstrap.py \
            --anchor-manifest validation/macro/gbp_inflation_historical_anchor_2026-08.json \
            --evidence-output /tmp/gbp-cpi-bootstrap/macro_pit_anchor_evidence.json \
            --work-dir /tmp/gbp-cpi-bootstrap/replay \
            | tee /tmp/gbp-cpi-bootstrap/bootstrap-run.json

      - name: Verify review-only registry promotion or pinned certification
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/macro_pit_registry_promotion.py \
            --evidence /tmp/gbp-cpi-bootstrap/macro_pit_anchor_evidence.json \
            --proposed-registry /tmp/gbp-cpi-bootstrap/proposed-registry.json \
            --receipt /tmp/gbp-cpi-bootstrap/promotion-receipt.json \
            | tee /tmp/gbp-cpi-bootstrap/promotion-run.json
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path

          canonical=json.loads(Path('validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json').read_text())
          proposed=json.loads(Path('/tmp/gbp-cpi-bootstrap/proposed-registry.json').read_text())
          receipt=json.loads(Path('/tmp/gbp-cpi-bootstrap/promotion-receipt.json').read_text())
          evidence=json.loads(Path('/tmp/gbp-cpi-bootstrap/macro_pit_anchor_evidence.json').read_text())
          key='GBP.inflation'
          row=canonical['series'][key]
          prow=proposed['series'][key]

          assert receipt['status']=='PASS'
          assert receipt['target']==key
          assert receipt['evidence_class']=='RECONSTRUCTED_HISTORICAL_REPLAY'
          assert evidence['bootstrap_provenance']['official_release_pair_verified'] is True
          assert evidence['bootstrap_provenance']['before_state'].startswith('RECONSTRUCTED_')
          assert prow['historical_replay_certified'] is True
          pref=prow['historical_replay_evidence']
          assert pref['evidence_class']=='RECONSTRUCTED_HISTORICAL_REPLAY'
          assert pref['official_release_pair_verified'] is True
          assert pref['macro_series_id']==evidence['target']['macro_series_id']
          assert pref['observation_date']==evidence['candidate']['observation_date']
          assert float(pref['value'])==float(evidence['candidate']['value'])

          if row.get('historical_replay_certified') is not True:
              assert receipt['promotion_action']=='PROPOSAL_CREATED'
              c2=json.loads(json.dumps(canonical)); p2=json.loads(json.dumps(proposed))
              c2['series'][key].pop('historical_replay_certified',None)
              p2['series'][key].pop('historical_replay_certified',None)
              p2['series'][key].pop('historical_replay_evidence',None)
              assert c2==p2, 'promotion proposal changed fields outside GBP inflation certification metadata'
          else:
              assert receipt['promotion_action'] in {'METADATA_ENRICHMENT_PROPOSED','ALREADY_CERTIFIED'}
              existing=row['historical_replay_evidence']
              assert existing['macro_series_id']==pref['macro_series_id']
              assert existing['observation_date']==pref['observation_date']
              assert float(existing['value'])==float(pref['value'])
              assert pref['evidence_sha256']==existing['evidence_sha256']
              assert pref['before_git_head']==existing['before_git_head']
              assert pref['after_git_head']==existing['after_git_head']
              assert len(existing['evidence_sha256'])==64
              subprocess.run(['git','merge-base','--is-ancestor',existing['after_git_head'],'HEAD'], check=True)
              if receipt['promotion_action']=='ALREADY_CERTIFIED':
                  assert proposed==canonical

          print(json.dumps({
              'status':'GBP_INFLATION_CERTIFICATION_SCOPE_PASS',
              'target':key,
              'promotion_action':receipt['promotion_action'],
              'evidence_class':'RECONSTRUCTED_HISTORICAL_REPLAY'
          }, indent=2))
          PY

      - name: Enforce no canonical publication
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- live_data payload validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json

      - name: Upload bootstrap and promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-gbp-inflation-pit-bootstrap-${{ github.run_id }}
          path: /tmp/gbp-cpi-bootstrap/
          if-no-files-found: error
          retention-days: 90
