name: Macro G8 Structural Rebase Readiness V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/macro/rebase_readiness_v1.py'
      - 'validation/macro/test_rebase_readiness_v1.py'
      - 'validation/macro/rebase_joint_gate_v1.py'
      - 'validation/macro/test_rebase_joint_gate_v1.py'
      - 'validation/macro/score_formula_provenance_v1.py'
      - 'validation/macro/test_score_formula_provenance_v1.py'
      - 'validation/macro/latest_release_pit_ledger_v1.py'
      - 'validation/macro/test_latest_release_pit_ledger_v1.py'
      - 'validation/macro/test_rebase_workflow_event_coverage_v1.py'
      - 'validation/macro/legacy_v2_score_evidence_bridge_v1.py'
      - 'validation/macro/test_legacy_v2_score_evidence_bridge_v1.py'
      - 'validation/macro/v2_g8_quarterly_gdp_research_target_v1.py'
      - 'validation/macro/test_v2_g8_quarterly_gdp_research_target_v1.py'
      - 'validation/macro/CORE_G8_OFFICIAL_RELEASE_WEB_ATTESTATIONS_2026-10-20.json'
      - 'validation/macro/CORE_G8_OFFICIAL_RELEASE_WEB_ATTESTATIONS_2026-10-22.json'
      - 'validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json'
      - '.github/workflows/macro-g8-rebase-readiness-v1.yml'
      - 'live_data/sections/D.json'
      - 'live_data/sections/MACRO_SERIES.json'
      - 'live_data/sections/MACRO_THERMOMETER_DATA.json'
      - 'live_data/sections/PAIR_SETUP_OPERATIONAL_VIEW.json'
      - 'live_data/sections/NATIVE_RATES_DATA.json'
      - 'live_data/sections/OIS_OPERATIONAL_VIEW.json'
  push:
    branches: [main]
    paths:
      - 'validation/macro/rebase_readiness_v1.py'
      - 'validation/macro/test_rebase_readiness_v1.py'
      - 'validation/macro/rebase_joint_gate_v1.py'
      - 'validation/macro/test_rebase_joint_gate_v1.py'
      - 'validation/macro/score_formula_provenance_v1.py'
      - 'validation/macro/test_score_formula_provenance_v1.py'
      - 'validation/macro/latest_release_pit_ledger_v1.py'
      - 'validation/macro/test_latest_release_pit_ledger_v1.py'
      - 'validation/macro/test_rebase_workflow_event_coverage_v1.py'
      - 'validation/macro/legacy_v2_score_evidence_bridge_v1.py'
      - 'validation/macro/test_legacy_v2_score_evidence_bridge_v1.py'
      - 'validation/macro/v2_g8_quarterly_gdp_research_target_v1.py'
      - 'validation/macro/test_v2_g8_quarterly_gdp_research_target_v1.py'
      - 'validation/macro/CORE_G8_OFFICIAL_RELEASE_WEB_ATTESTATIONS_2026-10-20.json'
      - 'validation/macro/CORE_G8_OFFICIAL_RELEASE_WEB_ATTESTATIONS_2026-10-22.json'
      - 'validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json'
      - '.github/workflows/macro-g8-rebase-readiness-v1.yml'
      - 'live_data/sections/D.json'
      - 'live_data/sections/MACRO_SERIES.json'
      - 'live_data/sections/MACRO_THERMOMETER_DATA.json'
      - 'live_data/sections/PAIR_SETUP_OPERATIONAL_VIEW.json'
      - 'live_data/sections/NATIVE_RATES_DATA.json'
      - 'live_data/sections/OIS_OPERATIONAL_VIEW.json'
  workflow_run:
    workflows:
      - 'Macro Persistent Daily V1'
      - 'Rates Persistent Daily V1'
      - 'Pair Setup Operational View V1'
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1-5'
permissions:
  contents: read

concurrency:
  group: macro-g8-rebase-readiness-v1
  cancel-in-progress: false

jobs:
  source-to-engine-contract:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify every Macro rebase audit input triggers this workflow
        run: python -m unittest validation.macro.test_rebase_workflow_event_coverage_v1 -v
      - name: Verify G8 lineage, observation PIT, pair coverage and fail-closed no-write
        run: python -m unittest validation.macro.test_rebase_readiness_v1 -v
      - name: Independently verify historical scalar scores vs display/directional code
        run: |
          set -euo pipefail
          mkdir -p /tmp/macro-g8-rebase
          python -m unittest validation.macro.test_score_formula_provenance_v1 -v
          python -m validation.macro.score_formula_provenance_v1 --out /tmp/macro-g8-rebase/score-boundary.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          x=json.load(open('/tmp/macro-g8-rebase/score-boundary.json'))
          assert x['historical_scalar_scores']==24
          assert x['ready_for_numeric_macro_rebase'] is False
          assert x['safe_to_update_28_pair_theses'] is False
          print('**24 frozen scalar scores are readable, but economic score-generating formulas remain UNCERTIFIED.**')
          PY
      - name: Produce immutable evidence for all 16 macro sources, Growth and 28 pairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/macro-g8-rebase
          python validation/macro/rebase_readiness_v1.py \
            --out /tmp/macro-g8-rebase/readiness.json \
            --markdown /tmp/macro-g8-rebase/summary.md
          cat /tmp/macro-g8-rebase/summary.md >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json
          x=json.load(open('/tmp/macro-g8-rebase/readiness.json'))
          assert x['source_lineage']=='PASS'
          assert x['structural_rebase']=='BLOCKED_SCORE_CONTRACT'
          assert x['safe_to_publish_D'] is False
          assert x['safe_to_update_structural_pair_preferences'] is False
          assert x['registered_macro_series']==16 and x['tracked_pairs']==28
          print('MACRO_G8_PIT_LINEAGE_PASS_STRUCTURAL_REBASE_BLOCKED')
          PY
          git diff --exit-code -- live_data/sections/D.json \
            live_data/sections/PAIR_SETUP_OPERATIONAL_VIEW.json
      - name: Validate 16-source latest official release PIT evidence (read only)
        run: python -m unittest validation.macro.test_latest_release_pit_ledger_v1 -v
      - name: Audit frozen 24 Macro scores against real V2 24-pillar source evidence (research only)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest validation.macro.test_legacy_v2_score_evidence_bridge_v1 -v
          python -m validation.macro.legacy_v2_score_evidence_bridge_v1 \
            --out /tmp/macro-g8-rebase/legacy-v2-24-score-crosswalk.json \
            --markdown /tmp/macro-g8-rebase/legacy-v2-24-score-mismatch-dossier.md
          cat /tmp/macro-g8-rebase/legacy-v2-24-score-mismatch-dossier.md >> "$GITHUB_STEP_SUMMARY"
          # Exact source discrepancies in searchable logs; no score generation.
          python - <<'PY'
          import json
          rows=json.load(open('/tmp/macro-g8-rebase/legacy-v2-24-score-crosswalk.json'))['rows']
          for r in rows:
              if r['source_reconciliation_class'] == 'TECHNICAL_ID_FREQUENCY_MATCH_PIT_NOT_CERTIFIED':
                  continue
              print('MACRO_SOURCE_RECONCILIATION',
                    r['currency'], r['pillar'],
                    'canonical=', r['canonical_source_id'], r['canonical_frequency'],
                    'candidate=', r['candidate_source_id'], r['candidate_frequency'],
                    'reason=', r['source_reconciliation_class'])
          PY
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r=json.load(open('/tmp/macro-g8-rebase/legacy-v2-24-score-crosswalk.json'))
          s=r['summary']
          assert s['historical_scalar_values']==24 and s['eligible_for_new_numeric_scores']==0
          assert r['safe_to_publish_new_D'] is False and r['writes_live_data'] is False
          print('**Legacy Macro 24 scalar → V2 24 evidence crosswalk, read only.**')
          print('Matching source/frequency: '+str(s['source_id_and_frequency_matches'])+'/24; '
                'wrong: '+str(s['candidate_wrong_id_or_frequency'])+
                '; absent: '+str(s['candidate_missing'])+
                '. New scores certified: **0**.')
          PY
      - name: Research-only G8 quarterly real GDP target with same-vintage QoQ gate
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest validation.macro.test_v2_g8_quarterly_gdp_research_target_v1 -v
          python -m validation.macro.v2_g8_quarterly_gdp_research_target_v1 \
            --out /tmp/macro-g8-rebase/gdp-quarterly-research-target-v1.json \
            --markdown /tmp/macro-g8-rebase/gdp-quarterly-research-target-v1.md
          cat /tmp/macro-g8-rebase/gdp-quarterly-research-target-v1.md >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json
          r=json.load(open('/tmp/macro-g8-rebase/gdp-quarterly-research-target-v1.json'))
          assert len(r['rows'])==8
          assert r['summary']['official_primary_GDP_PIT_source_series_admitted']==0
          assert r['can_replace_2026_09_25_D_macro'] is False
          assert r['can_change_28_pair_theses'] is False
          assert r['writes_live_data'] is False
          print('G8_GROWTH_GDP_RESEARCH_DESIGN_VERIFIED_NO_MACRO_PROMOTION')
          PY
      - name: Join source-to-engine and official release PIT evidence (no Macro rebase)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest validation.macro.test_rebase_joint_gate_v1 -v
          python -m validation.macro.rebase_joint_gate_v1 \
            --out /tmp/macro-g8-rebase/joint-gate.json \
            --markdown /tmp/macro-g8-rebase/joint-summary.md
          cat /tmp/macro-g8-rebase/joint-summary.md >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json
          x=json.load(open('/tmp/macro-g8-rebase/joint-gate.json'))
          assert x['status']=='AUDITED_NOT_AUTHORIZED_FOR_MACRO_REBASE'
          assert x['source_lineage']=='PASS' and x['source_rows_compared']==16
          assert x['pair_count']==28 and sum(x['release_grades'].values())==16
          assert x['safe_to_publish_new_D'] is False and x['safe_to_update_pair_thesis'] is False
          assert x['writes_live_data'] is False and len(x['mandatory_open_gates'])==4
          print('MACRO_JOINT_RELEASE_AND_SCORE_GATE_PASS_NO_REBASE')
          PY
          git diff --exit-code -- live_data/sections/D.json \
            live_data/sections/PAIR_SETUP_OPERATIONAL_VIEW.json \
            live_data/sections/MACRO_SERIES.json \
            live_data/sections/MACRO_THERMOMETER_DATA.json

      - name: Upload independent read-only Macro rebase readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-g8-rebase-readiness-${{ github.run_id }}
          path: /tmp/macro-g8-rebase/
          if-no-files-found: warn
          retention-days: 30
