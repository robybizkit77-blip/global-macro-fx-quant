name: Forward ECB Fixing Outcomes V1

on:
  workflow_dispatch:
  schedule:
    - cron: '30 16 * * 1-5'
  push:
    branches:
      - research-transmission-conviction-layer-v1-2026-10-07
    paths:
      - 'validation/run_forward_ecb_fixing_outcomes_v1.py'
      - 'validation/FORWARD_SNAPSHOT_LEDGER_V1_2026-10-07.json'
      - 'validation/DASHBOARD_PAIR_RENDER_PAYLOAD_V1_2026-10-07.json'
      - '.github/workflows/forward-ecb-fixing-outcomes-v1.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-transmission-conviction-layer-v1-2026-10-07
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update forward ECB fixing state
        run: python validation/run_forward_ecb_fixing_outcomes_v1.py
      - name: Validate immutability and schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('validation/FORWARD_ECB_FIXING_STATE_V1_2026-10-07.json')
          x=json.loads(p.read_text())
          assert x['schema']=='GMFQ_FORWARD_ECB_FIXING_STATE_V1'
          assert x['primary_horizon']==20
          assert x['guards']['changes_engine_rules'] is False
          assert x['guards']['changes_live_data'] is False
          assert x['guards']['changes_oos_baseline'] is False
          assert x['guards']['retroactive_label_changes'] is False
          for sid,r in x['snapshots'].items():
              if r['entry_locked']:
                  assert len(r['entry_prices'])==28
                  assert all(v>0 for v in r['entry_prices'].values())
              for o in r['outcomes'].values():
                  assert len(o['pair_results'])==28
          print('FORWARD_ECB_STATE_VALID')
          PY
      - name: Commit forward state if changed
        run: |
          if git diff --quiet -- validation/FORWARD_ECB_FIXING_STATE_V1_2026-10-07.json && [ -f validation/FORWARD_ECB_FIXING_STATE_V1_2026-10-07.json ]; then
            echo 'No forward state change'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/FORWARD_ECB_FIXING_STATE_V1_2026-10-07.json
          git commit -m 'Update forward ECB fixing outcome state' || exit 0
          git push origin HEAD:research-transmission-conviction-layer-v1-2026-10-07
