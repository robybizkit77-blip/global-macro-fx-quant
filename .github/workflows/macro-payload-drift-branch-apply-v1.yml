name: Macro Payload Drift Branch Apply V1

on:
  push:
    branches:
      - release-candidate-daily-data-orchestrator-v1-2026-10-12
    paths:
      - .github/workflows/macro-payload-drift-branch-apply-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-v1-ephemeral-manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-candidate-daily-data-orchestrator-v1-2026-10-12
          fetch-depth: 0

      - name: Patch V1 ephemeral manifest convergence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/daily-data-orchestrator-v1.yml')
          s=p.read_text(encoding='utf-8')
          old="""          if [ \"$state\" = \"DETACHED\" ]; then
            python3 validation/repair_detached_direct_section.py --section MACRO_THERMOMETER_DATA --apply | tee /tmp/daily-orchestrator-v1/repair-macro-thermometer.json
            python3 validation/repair_detached_direct_section.py --section MACRO_SERIES --apply | tee /tmp/daily-orchestrator-v1/repair-macro-series.json
            python3 validation/build_live_manifest_v2.py --write live_data/manifest.v2.json | tee /tmp/daily-orchestrator-v1/manifest-after.log
          else
            echo 'MACRO_ALREADY_ALIGNED_NO_REPAIR_REQUIRED'
          fi
"""
          new="""          if [ \"$state\" = \"DETACHED\" ]; then
            python3 validation/repair_detached_direct_section.py --section MACRO_THERMOMETER_DATA --apply | tee /tmp/daily-orchestrator-v1/repair-macro-thermometer.json
            python3 validation/repair_detached_direct_section.py --section MACRO_SERIES --apply | tee /tmp/daily-orchestrator-v1/repair-macro-series.json
          else
            echo 'MACRO_ALREADY_ALIGNED_NO_REPAIR_REQUIRED'
          fi
          # Price is applied ephemerally before this step, so the manifest must
          # describe the current ephemeral payload in both ALIGNED and DETACHED states.
          python3 validation/build_live_manifest_v2.py --write live_data/manifest.v2.json | tee /tmp/daily-orchestrator-v1/manifest-after.log
"""
          if s.count(old) != 1:
              raise SystemExit(f'expected Macro apply block once, found {s.count(old)}')
          s=s.replace(old,new,1)
          old2="expected={'payload/part-15.txt'} if state=='ALIGNED' else {'live_data/manifest.v2.json','payload/part-00.txt','payload/part-01.txt','payload/part-15.txt'}"
          new2="expected={'live_data/manifest.v2.json','payload/part-15.txt'} if state=='ALIGNED' else {'live_data/manifest.v2.json','payload/part-00.txt','payload/part-01.txt','payload/part-15.txt'}"
          if s.count(old2) != 1:
              raise SystemExit(f'expected diff-scope line once, found {s.count(old2)}')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
          test "$(git diff --name-only)" = ".github/workflows/daily-data-orchestrator-v1.yml"
          git diff --check

      - name: Create workflow-only commit and attempt branch update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/daily-data-orchestrator-v1.yml
          test "$(git diff --cached --name-only)" = ".github/workflows/daily-data-orchestrator-v1.yml"
          git commit -m 'Regenerate ephemeral manifest before V1 contract checks'
          git rev-parse HEAD | tee /tmp/v1-patch-commit.txt
          # GitHub may reject updating a workflow with GITHUB_TOKEN. The object is still
          # transferred; the branch ref is advanced separately with an explicit lease.
          git push origin HEAD:release-candidate-daily-data-orchestrator-v1-2026-10-12
