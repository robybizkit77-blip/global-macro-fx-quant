name: Macro Payload Drift Branch Apply V1

on:
  push:
    branches:
      - release-candidate-daily-data-orchestrator-v1-2026-10-12
    paths:
      - .github/workflows/macro-payload-drift-branch-apply-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-v1-state-newline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-candidate-daily-data-orchestrator-v1-2026-10-12
          fetch-depth: 0

      - name: Fix literal backslash newline in Macro state file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/daily-data-orchestrator-v1.yml')
          s=p.read_text(encoding='utf-8')
          old_a="write('ALIGNED\\\\n')"
          new_a="write('ALIGNED\\n')"
          old_d="write('DETACHED\\\\n')"
          new_d="write('DETACHED\\n')"
          if s.count(old_a)!=1 or s.count(old_d)!=1:
              raise SystemExit((s.count(old_a),s.count(old_d)))
          s=s.replace(old_a,new_a,1).replace(old_d,new_d,1)
          p.write_text(s,encoding='utf-8')
          PY
          test "$(git diff --name-only)" = ".github/workflows/daily-data-orchestrator-v1.yml"
          git diff --check

      - name: Create workflow-only commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/daily-data-orchestrator-v1.yml
          test "$(git diff --cached --name-only)" = ".github/workflows/daily-data-orchestrator-v1.yml"
          git commit -m 'Fix Macro runtime state newline in V1'
          git rev-parse HEAD
          git push origin HEAD:release-candidate-daily-data-orchestrator-v1-2026-10-12
