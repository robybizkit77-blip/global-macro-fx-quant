name: Liquidity BoC CAD M2++ Apply Proof V1

on:
  pull_request:
    paths:
      - 'validation/fetch_boc_cad_m2pp_candidate.py'
      - 'validation/apply_boc_cad_m2pp_candidate.py'
      - '.github/workflows/liquidity-boc-cad-m2pp-apply-proof-v1.yml'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
  push:
    branches:
      - validation-cad-m2pp-controlled-apply-clean-v1-2026-10-14
      - main
    paths:
      - 'validation/fetch_boc_cad_m2pp_candidate.py'
      - 'validation/apply_boc_cad_m2pp_candidate.py'
      - '.github/workflows/liquidity-boc-cad-m2pp-apply-proof-v1.yml'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-controlled-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot tracked runtime hash
        run: sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/runtime.before.sha256

      - name: Collect official BoC candidate
        run: python validation/fetch_boc_cad_m2pp_candidate.py --out /tmp/cad-m2pp-candidate.json

      - name: Dry-run controlled apply
        run: |
          python validation/apply_boc_cad_m2pp_candidate.py --candidate /tmp/cad-m2pp-candidate.json > /tmp/cad-m2pp-dry-run.json
          cat /tmp/cad-m2pp-dry-run.json

      - name: Ephemeral apply on runtime copy
        run: |
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/NATIVE_LIQ_DATA.json
          python validation/apply_boc_cad_m2pp_candidate.py --candidate /tmp/cad-m2pp-candidate.json --runtime /tmp/NATIVE_LIQ_DATA.json --apply > /tmp/cad-m2pp-apply.json
          cat /tmp/cad-m2pp-apply.json

      - name: Verify receipt and append-only semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          candidate=json.loads(Path('/tmp/cad-m2pp-candidate.json').read_text())
          dry=json.loads(Path('/tmp/cad-m2pp-dry-run.json').read_text())
          receipt=json.loads(Path('/tmp/cad-m2pp-apply.json').read_text())
          original=json.loads(Path('live_data/sections/NATIVE_LIQ_DATA.json').read_text())
          applied=json.loads(Path('/tmp/NATIVE_LIQ_DATA.json').read_text())
          assert candidate['runtime_match_confirmed'] is True
          assert candidate['source']['series_id']=='V41552801'
          assert candidate['source']['publisher']=='Bank of Canada'
          assert dry['schema']=='GMFQ_LIQUIDITY_CAD_M2PP_APPLY_RECEIPT_V1'
          assert dry['applied'] is False
          assert receipt['schema']=='GMFQ_LIQUIDITY_CAD_M2PP_APPLY_RECEIPT_V1'
          assert receipt['publication_performed'] is False
          o=original['CAD']['money']; a=applied['CAD']['money']; n=len(o['dates'])
          assert a['dates'][:n] == o['dates']
          assert a['values'][:n] == o['values']
          assert len(a['dates']) == len(a['values']) == n + receipt['appended_observations']
          if candidate['candidate_update_available']:
              assert receipt['status']=='UPDATE_AVAILABLE' and receipt['applied'] is True
              assert a['last_date'] == candidate['latest_date']
              assert float(a['last_value']) == float(candidate['latest_value'])
          else:
              assert receipt['status']=='NO_CHANGE' and receipt['applied'] is False
              assert a == o
          PY

      - name: Verify tracked runtime was not mutated
        run: |
          sha256sum -c /tmp/runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json

      - name: Summary
        run: |
          echo 'CAD M2++ official provenance + append-only controlled apply proof: GREEN'
          echo 'Tracked runtime mutation: NONE'
          echo 'Publication: NONE'
