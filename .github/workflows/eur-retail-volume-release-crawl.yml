name: EUR Retail Volume Release Crawl

on:
  workflow_dispatch:
  push:
    branches: [engine-freeze-v1-2026-10-02]
    paths:
      - validation/crawl_eur_retail_from_archive_index.py
      - .github/workflows/eur-retail-volume-release-crawl.yml

permissions:
  contents: write

concurrency:
  group: eur-retail-volume-release-crawl
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engine-freeze-v1-2026-10-02
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl official Eurostat archive index and retail releases
        run: python validation/crawl_eur_retail_from_archive_index.py
      - name: Commit retail PIT crawl
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/pit_batch/eurostat/archive/EUR_RETAIL_VOLUME_DATED_RELEASE_CRAWL_V1_2026-10-02.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build EUR retail volume first-release crawl from archive index"
            git pull --rebase origin engine-freeze-v1-2026-10-02
            git push origin HEAD:engine-freeze-v1-2026-10-02
          fi
