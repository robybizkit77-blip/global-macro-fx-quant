name: Macro G8 Growth First Release PIT Readiness V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/macro-g8-growth-first-release-v1.yml'
      - 'validation/macro/GROWTH_FIRST_RELEASE_OFFICIAL_WEB_ATTESTATIONS_2026-10-20.json'
      - 'validation/macro/growth_first_release_readiness_v1.py'
      - 'validation/macro/test_growth_first_release_readiness_v1.py'
      - 'validation/macro/latest_release_pit_ledger_v1.py'
      - 'live_data/sections/MACRO_SERIES.json'
      - 'live_data/sections/D.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/macro-g8-growth-first-release-v1.yml'
      - 'validation/macro/GROWTH_FIRST_RELEASE_OFFICIAL_WEB_ATTESTATIONS_2026-10-20.json'
      - 'validation/macro/growth_first_release_readiness_v1.py'
      - 'validation/macro/test_growth_first_release_readiness_v1.py'
      - 'validation/macro/latest_release_pit_ledger_v1.py'
      - 'live_data/sections/MACRO_SERIES.json'
      - 'live_data/sections/D.json'
  workflow_run:
    workflows:
      - 'Macro Persistent Daily V1'
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '05 10 * * 1-5'

permissions:
  contents: read

concurrency:
  group: macro-g8-growth-first-release-v1
  cancel-in-progress: false

jobs:
  growth-source-and-definition-proof:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 21 Growth series and official release definition regression tests
        run: python -m unittest validation.macro.test_growth_first_release_readiness_v1 -v
      - name: Audit official source matches and missing proof for 21 G8 Growth inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/macro-g8-growth
          python -m validation.macro.growth_first_release_readiness_v1 \
            --out /tmp/macro-g8-growth/growth-pit-readiness.json \
            --markdown /tmp/macro-g8-growth/summary.md
          cat /tmp/macro-g8-growth/summary.md >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json
          x=json.load(open('/tmp/macro-g8-growth/growth-pit-readiness.json'))
          assert x['source_lineage']=='PASS' and x['growth_series_count']==21
          assert x['growth_country_count']==8
          assert x['safe_to_refresh_growth_score'] is False
          assert x['safe_to_refresh_qualitative_macro_labels'] is False
          assert x['safe_to_publish_D'] is False
          assert x['historical_value_vintages_certified'] is False
          print('GROWTH_G8_OFFICIAL_RELEASE_METADATA_PARTIAL_WITHHELD_PASS')
          PY
          git diff --exit-code -- live_data/sections/D.json live_data/sections/PAIR_SETUP_OPERATIONAL_VIEW.json
      - name: Retain exact source/date/definition matches and unverified inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-g8-growth-pit-audit-${{ github.run_id }}
          path: /tmp/macro-g8-growth/
          if-no-files-found: warn
          retention-days: 45
