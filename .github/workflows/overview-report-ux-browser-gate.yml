name: Overview Report UX Browser Gate

on:
  push:
    branches: [staging-overview-report-ux-2026-10-01]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: npm init -y >/dev/null 2>&1 && npm install --save-dev playwright
      - name: Verify overview runtime
        run: |
          cat > verify.js <<'EOF'
          const {chromium}=require('playwright');
          const {execSync,spawn}=require('child_process');
          (async()=>{
            const srv=spawn('python3',['-m','http.server','8765'],{stdio:'ignore'});
            await new Promise(r=>setTimeout(r,1000));
            const cp=execSync('command -v google-chrome-stable || command -v google-chrome || command -v chromium').toString().trim();
            const browser=await chromium.launch({headless:true,executablePath:cp,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1600,height:1000}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'networkidle',timeout:120000});
            await page.waitForTimeout(3000);
            const out=await page.evaluate(()=>{
              const ccys=['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];
              const fwd=typeof forwardValidationSummary==='function'?forwardValidationSummary():null;
              const health=typeof productionHealthCheck==='function'?productionHealthCheck():null;
              const host=document.querySelector('#overview .gmfqOverviewExecutive');
              const text=host?.innerText||'';
              return {
                fingerprint:fwd?.current_rules_fingerprint||null,
                pair_count:(D?.pairs||[]).length,
                currency_states:ccys.map(c=>deriveCurrencyState(c)?.base||null),
                health_status:health?.status||null,
                hard_errors:health?.hard_errors||[],
                panels:host?.querySelectorAll('.gmfqReportPanel').length||0,
                has_state:text.includes('Chi è forte e chi è debole?'),
                has_change:text.includes('Dove si sta muovendo il quadro?'),
                has_watch:text.includes('Cosa merita davvero attenzione?'),
                has_legacy:text.includes('FX · STRUTTURA ATTUALE')
              };
            });
            await page.screenshot({path:'overview-report-ux.png',fullPage:false});
            await browser.close(); srv.kill();
            const issues=[];
            if(out.fingerprint!=='3356baf0') issues.push('fingerprint '+out.fingerprint);
            if(out.pair_count!==28) issues.push('pair_count '+out.pair_count);
            if(out.currency_states.some(x=>!x)) issues.push('missing currency state');
            if(out.hard_errors.length) issues.push('hard_errors '+JSON.stringify(out.hard_errors));
            if(errors.length) issues.push('JS errors '+JSON.stringify(errors));
            if(out.panels!==3||!out.has_state||!out.has_change||!out.has_watch) issues.push('overview panels '+JSON.stringify(out));
            if(out.has_legacy) issues.push('legacy executive strip still visible');
            console.log('===OVERVIEW_GATE_START===');
            console.log(JSON.stringify({status:issues.length?'FAIL':'PASS',...out,issues},null,2));
            console.log('===OVERVIEW_GATE_END===');
            if(issues.length) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node verify.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overview-report-ux-preview
          path: overview-report-ux.png
