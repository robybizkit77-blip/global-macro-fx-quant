name: Forward Monitor UI Gate V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'payload/**'
      - 'dashboard/forwarddesk-operational-v1.js'
      - 'validation/ui/DASHBOARD_UI_OWNERSHIP_REGISTRY_V1_2026-10-15.json'
      - '.github/workflows/forward-monitor-ui-gate-v1.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'payload/**'
      - 'dashboard/forwarddesk-operational-v1.js'
      - 'validation/ui/DASHBOARD_UI_OWNERSHIP_REGISTRY_V1_2026-10-15.json'
      - '.github/workflows/forward-monitor-ui-gate-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start dashboard
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/forward-monitor-ui.log 2>&1 &
          sleep 2
      - name: Verify Forward Monitor desktop and mobile
        run: |
          cat > forward-monitor-gate.js <<'EOF'
          const { chromium } = require('playwright');
          async function run(viewport,label){
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport});
            const consoleErrors=[],pageErrors=[];
            page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>['ACTIVE','FAIL'].includes(window.GMFQ_FORWARDDESK_OPERATIONAL?.status),null,{timeout:120000});
            await page.evaluate(()=>window.showView?.('forwarddesk'));
            await page.waitForTimeout(900);
            const out=await page.evaluate(()=>{
              const el=document.getElementById('forwarddesk');
              const text=(el?.innerText||'').replace(/\s+/g,' ').trim();
              const summary=typeof window.forwardValidationSummary==='function'?window.forwardValidationSummary():null;
              const operational=typeof window.gmfqForwardDeskOperationalAudit==='function'?window.gmfqForwardDeskOperationalAudit():null;
              return {
                exists:!!el,
                visible:!!el&&getComputedStyle(el).display!=='none'&&el.getBoundingClientRect().height>0,
                textLength:text.length,
                undefinedSymbols:[...text.matchAll(/\b([A-Za-z_$][\w$]*)\s+is\s+not\s+defined\b/g)].map(m=>m[1]),
                hasReferenceError:/ReferenceError/i.test(text),
                pathRiskHelper:typeof window.gmfqForwardPathRiskStats,
                snapshotBasketHelper:typeof window.gmfqForwardSnapshotBasketSeries,
                pairedOverlayHelper:typeof window.gmfqForwardPairedOverlayStats,
                summary,
                operational,
                integrity:typeof window.forwardLedgerIntegrity==='function'?window.forwardLedgerIntegrity():null
              };
            });
            if(!out.exists||!out.visible||out.textLength<100) throw new Error(label+' Forward view not rendered');
            if(out.undefinedSymbols.length||out.hasReferenceError) throw new Error(label+' Forward visible runtime error: '+JSON.stringify(out.undefinedSymbols));
            if(out.pathRiskHelper!=='function'||out.snapshotBasketHelper!=='function'||out.pairedOverlayHelper!=='function') throw new Error(label+' Forward helper chain not bridged');
            if(out.integrity && out.integrity.ok!==true) throw new Error(label+' Forward ledger integrity failed');
            if(out.operational?.schema!=='GMFQ_FORWARDDESK_OPERATIONAL_UI_V1'||out.operational?.status!=='ACTIVE'||out.operational?.core_effect!=='NONE'||out.operational?.owner_count!==1) throw new Error(label+' Forward operational owner invalid '+JSON.stringify(out.operational));
            if(out.operational?.scope!=='OBSERVATIONAL_FORWARD_VALIDATION_ONLY') throw new Error(label+' Forward scope drift '+JSON.stringify(out.operational));
            const runtimeErr=/\b[A-Za-z_$][\w$]*\s+is\s+not\s+defined\b|ReferenceError/i;
            if(consoleErrors.some(x=>runtimeErr.test(x))) throw new Error(label+' Forward console scope error: '+consoleErrors.join(' | '));
            if(pageErrors.some(x=>runtimeErr.test(x))) throw new Error(label+' Forward page scope error: '+pageErrors.join(' | '));
            console.log(label,'FORWARD_MONITOR_UI_PASS',JSON.stringify({textLength:out.textLength,snapshots:out.summary?.snapshots??null,outcomes:out.summary?.outcomes??null,ledger_ok:out.integrity?.ok??null,owner_count:out.operational?.owner_count??null}));
            await browser.close();
          }
          (async()=>{await run({width:1440,height:1100},'desktop');await run({width:390,height:844},'mobile');console.log('FORWARD_MONITOR_UI_GATE_V1 PASS');})().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node forward-monitor-gate.js
