name: Eurostat EUR Archive Crawl

on:
  push:
    branches:
      - engine-freeze-v1-2026-10-02
    paths:
      - 'validation/crawl_eurostat_eur_archive.py'
      - '.github/workflows/eurostat-eur-archive-crawl.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eurostat-eur-archive-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engine-freeze-v1-2026-10-02
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Crawl Eurostat release archive for EUR retail and employment
        run: python validation/crawl_eurostat_eur_archive.py
      - name: Commit archive manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/pit_batch/eurostat/archive/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build Eurostat EUR retail and employment release archive manifest"
            git push origin HEAD:engine-freeze-v1-2026-10-02
          fi
