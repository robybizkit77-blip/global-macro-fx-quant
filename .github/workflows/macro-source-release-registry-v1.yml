name: Macro Source Release Registry V1

on:
  workflow_dispatch:
  push:
    branches: [research-transmission-conviction-layer-v1-2026-10-07]
    paths:
      - 'validation/build_macro_source_release_registry_v1.py'
      - 'validation/validate_macro_source_release_registry_v1.py'
      - 'live_data/sections/MACRO_THERMOMETER_DATA.json'
      - '.github/workflows/macro-source-release-registry-v1.yml'

permissions:
  contents: write

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-transmission-conviction-layer-v1-2026-10-07
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build macro source release registry
        run: python validation/build_macro_source_release_registry_v1.py
      - name: Validate macro source release registry
        run: python validation/validate_macro_source_release_registry_v1.py
      - name: Guard zero live mutation
        run: git diff --exit-code -- live_data payload
      - name: Commit registry evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/MACRO_SOURCE_RELEASE_REGISTRY_V1_2026-10-07.json
          git diff --cached --quiet || git commit -m 'Materialize macro source release registry V1'
          git push origin HEAD:research-transmission-conviction-layer-v1-2026-10-07
