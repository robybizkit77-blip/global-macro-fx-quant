name: AUD Hysteresis Pure Recalc V1

on:
  push:
    branches:
      - 'validation-aud-hysteresis-pure-recalc-v1-2026-10-12'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8136 --bind 127.0.0.1 > /tmp/gmfq-aud-hyst-recalc-server.log 2>&1 &
          sleep 2
      - name: Simulate native AUD CB hysteresis realignment
        run: |
          cat > aud-hysteresis-pure-recalc.js <<'EOF'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.stack||e)));
            page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
            const r=await page.goto('http://127.0.0.1:8136/index.html',{waitUntil:'domcontentloaded',timeout:120000});
            if(!r||!r.ok()) throw new Error('HTTP load failed');
            await page.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.settled_after_cad_chain===true||window.__GMFQ_BOOTSTRAP_ERROR,null,{timeout:120000});
            const out=await page.evaluate(()=>{
              const clone=x=>{try{return JSON.parse(JSON.stringify(x))}catch{return null}};
              const stable=x=>JSON.stringify(x);
              const audPairs=(D?.pairs||[]).map(x=>x.pair).filter(p=>p.includes('AUD'));
              const before={
                pure:clone(cbStructuralChangeCandidate('AUD')),
                hysteresis:clone(window.CB_LIQ_HYSTERESIS_STATE?.AUD?.cb),
                memory:clone(window.CB_LIQ_CHANGE_MEMORY?.['AUD:cb']),
                currency:clone(window.deriveCurrencyState?.('AUD')),
                pairs:Object.fromEntries(audPairs.map(p=>[p,clone(window.derivePairDecisionFrame?.(p))]))
              };
              const recalculated=clone(evaluateCbLiquidityHysteresis('AUD'));
              const after={
                hysteresis:clone(recalculated?.cb),
                memory:clone(window.CB_LIQ_CHANGE_MEMORY?.['AUD:cb']),
                currency:clone(window.deriveCurrencyState?.('AUD')),
                pairs:Object.fromEntries(audPairs.map(p=>[p,clone(window.derivePairDecisionFrame?.(p))]))
              };
              return {
                before,after,recalculated,audPairs,
                assertions:{
                  pureCandidateIsCurrent:before.pure?.status==='CANDIDATE'&&before.pure?.candidate===before.hysteresis?.current,
                  realignedStatusNoChange:after.hysteresis?.status==='NO_CHANGE',
                  realignedCandidateCurrent:after.hysteresis?.candidate===after.hysteresis?.current,
                  policyUnchanged:before.currency?.policy===after.currency?.policy,
                  currencyUnchanged:stable(before.currency)===stable(after.currency),
                  pairFramesUnchanged:stable(before.pairs)===stable(after.pairs),
                  memoryNoDirectionalMutation:(before.memory?.lastCurrent===after.memory?.lastCurrent)&&(after.memory?.candidate==null)&&(Number(after.memory?.streak||0)===0)
                },
                bootstrapError:window.__GMFQ_BOOTSTRAP_ERROR||null
              };
            });
            await browser.close();
            if(out.bootstrapError) throw new Error(out.bootstrapError);
            if(errors.length) throw new Error('Browser errors: '+errors.join(' | '));
            const ok=Object.values(out.assertions).every(Boolean);
            fs.writeFileSync('aud-hysteresis-pure-recalc.json',JSON.stringify({schema:'GMFQ_AUD_HYSTERESIS_REALIGNMENT_SIM_V1',status:ok?'PASS':'FAIL',...out},null,2));
            console.log(JSON.stringify({status:ok?'PASS':'FAIL',before:out.before.hysteresis,after:out.after.hysteresis,memoryBefore:out.before.memory,memoryAfter:out.after.memory,policyBefore:out.before.currency?.policy,policyAfter:out.after.currency?.policy,audPairs:out.audPairs,assertions:out.assertions},null,2));
            if(!ok) process.exitCode=2;
          })().catch(e=>{console.error('::error title=AUD hysteresis realignment simulation::'+String(e.stack||e));process.exit(1)});
          EOF
          node aud-hysteresis-pure-recalc.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aud-hysteresis-pure-recalc-v1
          path: |
            aud-hysteresis-pure-recalc.json
            /tmp/gmfq-aud-hyst-recalc-server.log
