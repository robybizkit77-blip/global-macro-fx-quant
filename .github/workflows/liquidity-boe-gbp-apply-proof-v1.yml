name: Liquidity BoE GBP Apply Proof V1

on:
  push:
    branches:
      - release-candidate-daily-data-orchestrator-v1-2026-10-12
    paths:
      - 'validation/fetch_boe_gbp_liquidity_candidates.py'
      - 'validation/apply_boe_gbp_liquidity_candidates.py'
      - '.github/workflows/liquidity-boe-gbp-apply-proof-v1.yml'
      - 'validation/liquidity/LIQUIDITY_SOURCE_POLICY_V1_2026-10-12.json'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-controlled-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot tracked runtime hash
        run: sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/runtime.before.sha256

      - name: Collect official BoE candidates
        run: python validation/fetch_boe_gbp_liquidity_candidates.py --out /tmp/gbp-boe-candidates.json

      - name: Dry-run controlled apply
        run: |
          python validation/apply_boe_gbp_liquidity_candidates.py \
            --candidate /tmp/gbp-boe-candidates.json \
            > /tmp/gbp-boe-dry-run.json
          cat /tmp/gbp-boe-dry-run.json

      - name: Ephemeral apply on runtime copy
        run: |
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/NATIVE_LIQ_DATA.json
          python validation/apply_boe_gbp_liquidity_candidates.py \
            --candidate /tmp/gbp-boe-candidates.json \
            --runtime /tmp/NATIVE_LIQ_DATA.json \
            --apply \
            > /tmp/gbp-boe-apply.json
          cat /tmp/gbp-boe-apply.json

      - name: Verify append-only semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/gbp-boe-candidates.json').read_text())
          r=json.loads(Path('/tmp/gbp-boe-apply.json').read_text())
          original=json.loads(Path('live_data/sections/NATIVE_LIQ_DATA.json').read_text())
          applied=json.loads(Path('/tmp/NATIVE_LIQ_DATA.json').read_text())
          assert c['schema']=='GMFQ_LIQUIDITY_GBP_BOE_CANDIDATES_V1'
          assert r['schema']=='GMFQ_LIQUIDITY_GBP_BOE_APPLY_RECEIPT_V1'
          assert r['publication_performed'] is False
          mapping={'GBP.liquidity':'liquidity','GBP.credit':'credit'}
          for key,runtime_key in mapping.items():
              row=c['results'][key]
              assert row['runtime_match_confirmed'] is True
              o=original['GBP'][runtime_key]
              a=applied['GBP'][runtime_key]
              n=len(o['dates'])
              assert a['dates'][:n]==o['dates']
              assert a['values'][:n]==o['values']
              assert len(a['dates'])==len(a['values'])
              assert len(a['dates'])==n+r['results'][key]['appended_observations']
              if row['candidate_update_available']:
                  assert a['last_date']==row['latest_date']
                  assert float(a['last_value'])==float(row['latest_value'])
              else:
                  assert r['results'][key]['appended_observations']==0
          PY

      - name: Verify tracked runtime was not mutated
        run: |
          sha256sum -c /tmp/runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json

      - name: Summary
        run: |
          echo 'GBP BoE reserves + secured lending controlled apply proof: GREEN'
          echo 'Tracked runtime mutation: NONE'
          echo 'Publication: NONE'
          echo 'Current proof trigger: 2026-10-13'
