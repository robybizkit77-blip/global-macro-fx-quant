name: Macro V3 Observed G8 28-Pair Public Context V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/macro/publish_v3_current_context_v1.py'
      - 'validation/publishing/verify_pages_http_delivery_v1.py'
      - 'validation/publishing/test_verify_pages_http_delivery_v1.py'
      - 'validation/macro/v3_current_g8_28pair_economic_evidence_v1.py'
      - 'validation/macro/recurring_macro_context_v1.py'
      - 'validation/macro/test_recurring_macro_context_v1.py'
      - 'validation/macro/test_v3_current_g8_28pair_economic_evidence_v1.py'
      - 'validation/macro/ons_quarterly_gdp_v1.py'
      - 'validation/macro/test_ons_quarterly_gdp_v1.py'
      - 'validation/macro/ONS_FIRST_QUARTERLY_GDP_V1.json'
      - 'validation/macro/esri_quarterly_gdp_v1.py'
      - 'validation/macro/test_esri_quarterly_gdp_v1.py'
      - 'validation/macro/ESRI_FIRST_QUARTERLY_GDP_V1.json'
      - 'validation/macro/statsnz_quarterly_gdp_v1.py'
      - 'validation/macro/test_statsnz_quarterly_gdp_v1.py'
      - 'validation/macro/STATSNZ_QUARTERLY_GDP_V1.json'
      - 'validation/macro/eurostat_quarterly_gdp_v1.py'
      - 'validation/macro/test_eurostat_quarterly_gdp_v1.py'
      - 'validation/macro/EUROSTAT_QUARTERLY_GDP_V1.json'
      - 'validation/macro/statcan_quarterly_gdp_v1.py'
      - 'validation/macro/test_statcan_quarterly_gdp_v1.py'
      - 'validation/macro/STATCAN_QUARTERLY_GDP_V1.json'
      - 'validation/macro/abs_quarterly_gdp_v1.py'
      - 'validation/macro/test_abs_quarterly_gdp_v1.py'
      - 'validation/macro/ABS_QUARTERLY_GDP_V1.json'
      - 'validation/macro/seco_quarterly_gdp_v1.py'
      - 'validation/macro/test_seco_quarterly_gdp_v1.py'
      - 'validation/macro/SECO_FLASH_QUARTERLY_GDP_V1.json'
      - 'validation/macro/v3_gdp_q3_official_overlay_v1.py'
      - 'validation/macro/fixtures/v3_gdp_q3_2026_official_web_updates_v1.json'
      - '.github/workflows/macro-v3-observed-context-publication-v1.yml'
  push:
    branches: [main]
    paths:
      - 'validation/macro/esri_quarterly_gdp_v1.py'
      - 'validation/macro/test_esri_quarterly_gdp_v1.py'
      - 'validation/macro/statsnz_quarterly_gdp_v1.py'
      - 'validation/macro/test_statsnz_quarterly_gdp_v1.py'
      - 'validation/macro/STATSNZ_QUARTERLY_GDP_V1.json'
      - 'validation/macro/eurostat_quarterly_gdp_v1.py'
      - 'validation/macro/test_eurostat_quarterly_gdp_v1.py'
      - 'validation/macro/EUROSTAT_QUARTERLY_GDP_V1.json'
      - 'validation/macro/statcan_quarterly_gdp_v1.py'
      - 'validation/macro/test_statcan_quarterly_gdp_v1.py'
      - 'validation/macro/STATCAN_QUARTERLY_GDP_V1.json'
      - 'validation/macro/abs_quarterly_gdp_v1.py'
      - 'validation/macro/test_abs_quarterly_gdp_v1.py'
      - 'validation/macro/ABS_QUARTERLY_GDP_V1.json'
      - 'validation/macro/seco_quarterly_gdp_v1.py'
      - 'validation/macro/test_seco_quarterly_gdp_v1.py'
      - 'validation/macro/ons_quarterly_gdp_v1.py'
      - 'validation/macro/test_ons_quarterly_gdp_v1.py'
      - 'validation/macro/v3_current_g8_28pair_economic_evidence_v1.py'
      - 'validation/macro/recurring_macro_context_v1.py'
      - 'validation/macro/test_recurring_macro_context_v1.py'
      - 'validation/macro/v3_gdp_q3_official_overlay_v1.py'
      - 'validation/macro/fixtures/v3_gdp_q3_2026_official_web_updates_v1.json'
      - 'validation/macro/publish_v3_current_context_v1.py'
      - 'validation/publishing/verify_pages_http_delivery_v1.py'
      - 'validation/publishing/test_verify_pages_http_delivery_v1.py'
      - '.github/workflows/macro-v3-observed-context-publication-v1.yml'
  workflow_run:
    workflows: ['Macro Persistent Daily V1', 'Calendar News Operational Refresh V1']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('macro-v3-context-validation-pr-{0}', github.event.pull_request.number) || 'publish-dashboard-pages-v1' }}
  queue: max
  cancel-in-progress: false

jobs:
  source-audited-public-context:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public HTTP exact-byte audit regression (stale CDN must fail)
        run: python validation/publishing/test_verify_pages_http_delivery_v1.py
      - name: Source integrity regression (8 economies and 28 pairs)
        run: |
          python -m unittest validation.macro.test_v3_current_g8_28pair_economic_evidence_v1 -v
          python -m unittest validation.macro.test_recurring_macro_context_v1 -v
          python -m unittest validation.macro.test_ons_quarterly_gdp_v1 -v
          python -m unittest validation.macro.test_esri_quarterly_gdp_v1 -v
          python -m unittest validation.macro.test_seco_quarterly_gdp_v1 -v
          python -m unittest validation.macro.test_abs_quarterly_gdp_v1 -v
          python -m unittest validation.macro.test_statcan_quarterly_gdp_v1 -v
          python -m unittest validation.macro.test_eurostat_quarterly_gdp_v1 -v
          python -m unittest validation.macro.test_statsnz_quarterly_gdp_v1 -v
      - name: Collect and archive the latest ONS UK quarterly first estimate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python -m validation.macro.ons_quarterly_gdp_v1 --apply | tee /tmp/ons-quarterly-gdp-collection.json
          cat /tmp/ons-quarterly-gdp-collection.json >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'SOURCE_UNAVAILABLE_ARCHIVE_RETAINED' /tmp/ons-quarterly-gdp-collection.json; then
            echo "::warning::Latest ONS bulletin was not validated; using prior verified GDP evidence."
          fi
      - name: Collect and archive the next Japanese ESRI preliminary GDP edition
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python -m validation.macro.esri_quarterly_gdp_v1 --apply | tee /tmp/esri-quarterly-gdp-collection.json
          cat /tmp/esri-quarterly-gdp-collection.json >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'SOURCE_UNAVAILABLE_ARCHIVE_RETAINED' /tmp/esri-quarterly-gdp-collection.json; then
            echo "::warning::Latest ESRI preliminary GDP was not validated; using prior verified GDP evidence."
          fi
      - name: Collect and archive the next Swiss SECO flash GDP edition
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python -m validation.macro.seco_quarterly_gdp_v1 --apply | tee /tmp/seco-quarterly-gdp-collection.json
          cat /tmp/seco-quarterly-gdp-collection.json >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'SOURCE_UNAVAILABLE_ARCHIVE_RETAINED' /tmp/seco-quarterly-gdp-collection.json; then
            echo "::warning::Latest SECO flash GDP was not validated; using prior verified GDP evidence."
          elif grep -q '"prior_fallback_reason"' /tmp/seco-quarterly-gdp-collection.json; then
            echo "::warning::SECO detailed prior quarter was not validated; comparing against its archived flash."
          fi
      - name: Verify ABS parser against published June edition (new collector PR)
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/abs-recurring-quarterly-gdp-20261125'
        run: |
          python -m validation.macro.abs_quarterly_gdp_v1 --verify-quarter 2026Q2 > /tmp/abs-q2-proof.json
          python -c "import json; d=json.load(open('/tmp/abs-q2-proof.json')); assert (d['reported_value'],d['prior_qoq']) == (0.4,0.3)"
      - name: Collect and archive the next Australian ABS quarterly GDP edition
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python -m validation.macro.abs_quarterly_gdp_v1 --apply | tee /tmp/abs-quarterly-gdp-collection.json
          cat /tmp/abs-quarterly-gdp-collection.json >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'SOURCE_UNAVAILABLE_ARCHIVE_RETAINED' /tmp/abs-quarterly-gdp-collection.json; then
            echo "::warning::ABS quarterly bulletin not validated; retaining prior verified GDP."
          fi
      - name: Verify StatCan parser against published June edition (new collector PR)
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/statcan-recurring-quarterly-gdp-20261126'
        run: |
          python -m validation.macro.statcan_quarterly_gdp_v1 --verify-q2 > /tmp/statcan-q2-proof.json
          python -c "import json; d=json.load(open('/tmp/statcan-q2-proof.json')); assert (d['reported_value'],d['prior_qoq'],d['next_release_day']) == (0.8,0.1,'2026-11-30')"
      - name: Collect and archive the next Canadian StatCan quarterly GDP edition
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python -m validation.macro.statcan_quarterly_gdp_v1 --apply | tee /tmp/statcan-quarterly-gdp-collection.json
          cat /tmp/statcan-quarterly-gdp-collection.json >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'SOURCE_UNAVAILABLE_ARCHIVE_RETAINED' /tmp/statcan-quarterly-gdp-collection.json; then
            echo "::warning::StatCan quarterly bulletin not validated; retaining prior verified GDP."
          fi
      - name: Set up pinned Stats NZ browser fallback
        if: github.event_name != 'pull_request' || github.head_ref == 'fix/statsnz-recurring-quarterly-gdp-20261126'
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
      - name: Verify Stats NZ parser against published June edition (new collector PR)
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/statsnz-recurring-quarterly-gdp-20261126'
        run: |
          python -m validation.macro.statsnz_quarterly_gdp_v1 --verify-quarter 2026Q2 > /tmp/statsnz-q2-proof.json
          python -c "import json; d=json.load(open('/tmp/statsnz-q2-proof.json')); assert (d['reported_value'],d['prior_qoq']) == (0.2,0.9)"
      - name: Collect and archive the next New Zealand Stats NZ quarterly GDP edition
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python -m validation.macro.statsnz_quarterly_gdp_v1 --apply | tee /tmp/statsnz-quarterly-gdp-collection.json
          cat /tmp/statsnz-quarterly-gdp-collection.json >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'SOURCE_UNAVAILABLE_ARCHIVE_RETAINED' /tmp/statsnz-quarterly-gdp-collection.json; then
            echo "::warning::Stats NZ quarterly bulletin not validated; retaining prior verified GDP."
          fi
      - name: Verify Eurostat GDP parser against official November edition
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/eurostat-recurring-quarterly-gdp-20261126'
        run: |
          python -m validation.macro.eurostat_quarterly_gdp_v1 --verify-day 2026-11-13 > /tmp/eurostat-q3-proof.json
          python -c "import json; d=json.load(open('/tmp/eurostat-q3-proof.json')); assert (d['quarter'],d['reported_value'],d['prior_qoq']) == ('2026Q3',0.4,0.6)"
      - name: Collect and archive Eurostat GDP releases including revisions
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python -m validation.macro.eurostat_quarterly_gdp_v1 --apply | tee /tmp/eurostat-quarterly-gdp-collection.json
          cat /tmp/eurostat-quarterly-gdp-collection.json >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'SOURCE_UNAVAILABLE_ARCHIVE_RETAINED' /tmp/eurostat-quarterly-gdp-collection.json; then
            echo "::warning::Eurostat GDP bulletin not validated; retaining prior verified GDP."
          fi
      - name: Generate verified public Macro V3 context
        run: |
          set -euo pipefail
          python -m validation.macro.publish_v3_current_context_v1
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path('site/control-room-preview/macro-v3-current-evidence.json')
          d=json.loads(f.read_text())
          assert d['summary']['currencies']==8
          assert d['summary']['economic_dimensions']==24
          assert d['summary']['pairs']==28
          assert len(d['countries'])==8 and len(d['pair_context'])==28
          assert d['status']=='OBSERVED_ECONOMIC_CONTEXT_NOT_FX_SIGNAL'
          assert d['safe_to_republish_D'] is False
          assert d['safe_to_recompute_structural_pair_theses'] is False
          assert d['eligible_for_trading_or_forward_backtest'] is False
          assert all(c['macro_score'] is None and c['FX_strength'] is None for c in d['countries'].values())
          assert all(p['pair_trade_bias'] is None for p in d['pair_context'].values())
          print('MACRO_V3_PUBLIC_CONTEXT_8_G8_24_AXES_28_PAIRS_PASS')
          PY
      - name: Exact source and website write scope; canonical D untouched
        run: |
          set -euo pipefail
          git diff --exit-code -- live_data payload dashboard index.html
          test -z "$(git status --porcelain -- live_data payload dashboard index.html)"
          test -f site/control-room-preview/macro-v3-current-evidence.json
          echo 'MACRO_V3_PUBLICATION_NO_CANONICAL_SIGNAL_MUTATION_PASS'
      - name: Persist the Macro research snapshot and GDP archives with scoped retry (main only)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from validation.macro.persist_calendar_news_safe_v12 import persist

          print(json.dumps(persist(
              managed=('site/control-room-preview/macro-v3-current-evidence.json',
                       'validation/macro/ONS_FIRST_QUARTERLY_GDP_V1.json',
                       'validation/macro/ESRI_FIRST_QUARTERLY_GDP_V1.json',
                       'validation/macro/SECO_FLASH_QUARTERLY_GDP_V1.json',
                       'validation/macro/ABS_QUARTERLY_GDP_V1.json',
                       'validation/macro/STATCAN_QUARTERLY_GDP_V1.json',
                       'validation/macro/STATSNZ_QUARTERLY_GDP_V1.json',
                       'validation/macro/EUROSTAT_QUARTERLY_GDP_V1.json'),
              protected=(
                  'live_data/sections/NEWS_PULSE_OPERATIONAL.json',
                  'live_data/sections/MACRO_SERIES.json',
                  'live_data/sections/MACRO_THERMOMETER_DATA.json',
                  'live_data/sections/D.json',
                  'live_data/sections/PAIR_SETUP_OPERATIONAL_VIEW.json',
                  'validation/macro/v2_*.py',
                  'validation/macro/v3_*.py',
                  'validation/macro/publish_v3_current_context_v1.py',
                  'validation/macro/ons_quarterly_gdp_v1.py',
                  'validation/macro/ONS_FIRST_QUARTERLY_GDP_V1.json',
                  'validation/macro/esri_quarterly_gdp_v1.py',
                  'validation/macro/ESRI_FIRST_QUARTERLY_GDP_V1.json',
                  'validation/macro/statsnz_quarterly_gdp_v1.py',
                  'validation/macro/STATSNZ_QUARTERLY_GDP_V1.json',
                  'validation/macro/eurostat_quarterly_gdp_v1.py',
                  'validation/macro/EUROSTAT_QUARTERLY_GDP_V1.json',
                  'validation/macro/statcan_quarterly_gdp_v1.py',
                  'validation/macro/STATCAN_QUARTERLY_GDP_V1.json',
                  'validation/macro/abs_quarterly_gdp_v1.py',
                  'validation/macro/ABS_QUARTERLY_GDP_V1.json',
                  'validation/macro/seco_quarterly_gdp_v1.py',
                  'validation/macro/SECO_FLASH_QUARTERLY_GDP_V1.json',
                  'validation/macro/capture_uk_ch_gdp_official_firstseen_v11.py',
                  'validation/macro/capture_official_postrelease_actuals_v1.py',
                  'validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json',
                  'validation/macro/fixtures/*gdp*.json',
              ),
              commit_message='Publish observed Macro V3 G8 and 28-pair research context',
          )))
          PY
      - name: Mirror verified V3 file to gh-pages with remote-head lease
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          TARGET="site/control-room-preview/macro-v3-current-evidence.json"
          git fetch origin main gh-pages --no-tags
          git show "origin/main:$TARGET" | cmp - "$TARGET" || { echo 'Main source drift' >&2; exit 1; }
          PAGE_SHA="$(git rev-parse origin/gh-pages)"
          WORKTREE="$(mktemp -d)"
          git worktree add --detach "$WORKTREE" origin/gh-pages
          mkdir -p "$WORKTREE/site/control-room-preview"
          cp "$TARGET" "$WORKTREE/$TARGET"
          cd "$WORKTREE"
          git add -- "$TARGET"
          if ! git diff --cached --quiet; then
            CHANGED="$(git diff --cached --name-only)"
            test "$CHANGED" = "$TARGET" || { echo "Unexpected changed files $CHANGED" >&2; exit 1; }
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish only Macro V3 observed G8 source snapshot'
            REMOTE="$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')"
            test "$REMOTE" = "$PAGE_SHA" || { echo 'Pages advanced; fail closed' >&2; exit 1; }
            git push --force-with-lease=refs/heads/gh-pages:"$PAGE_SHA" origin HEAD:gh-pages
          fi
          git show "HEAD:$TARGET" | cmp - "${{ github.workspace }}/$TARGET"
          echo MACRO_V3_GHPAGES_EXACT_SOURCE_PROOF_PASS
      - name: Explicitly queue Pages build after bot push
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cfg="$(gh api "repos/${GITHUB_REPOSITORY}/pages")"
          test "$(jq -r '.source.branch' <<<"$cfg")" = "gh-pages"
          test "$(jq -r '.source.path' <<<"$cfg")" = "/"
          TARGET_SHA="$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')"
          last="$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" 2>/dev/null || echo '{}')"
          last_sha="$(jq -r '.commit // empty' <<<"$last")"
          last_status="$(jq -r '.status // empty' <<<"$last")"
          if [[ "$last_sha" == "$TARGET_SHA" &&
                ( "$last_status" == "built" || "$last_status" == "building" || "$last_status" == "queued" ) ]]; then
            echo "PAGES_BUILD_ALREADY_TARGETING_V3 $TARGET_SHA"
          else
            r="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds")"
            jq -e '.status == "queued" or .status == "building"' <<<"$r" >/dev/null
            echo "MACRO_V3_PAGES_BUILD_EXPLICITLY_QUEUED $TARGET_SHA"
          fi
      - name: Certify actual public Macro V3 HTTP bytes after Pages build
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from validation.publishing.verify_pages_http_delivery_v1 import BASE_URL, verify

          target = 'site/control-room-preview/macro-v3-current-evidence.json'
          source = json.loads(Path(target).read_text(encoding='utf-8'))
          assert source['status'] == 'OBSERVED_ECONOMIC_CONTEXT_NOT_FX_SIGNAL'
          assert source['summary']['currencies'] == 8
          assert source['summary']['economic_dimensions'] == 24
          assert source['summary']['pairs'] == 28
          assert source['summary']['pair_trade_signals_generated'] == 0
          report = verify(
              Path('.'), BASE_URL, (target,),
              budget_seconds=300, interval_seconds=10, timeout_seconds=12,
          )
          Path('/tmp/macro-v3-public-http-delivery-proof.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print('MACRO_V3_PUBLIC_HTTP_SHA256', json.dumps(report, sort_keys=True), flush=True)
          if report['status'] != 'PASS':
              raise SystemExit('PUBLIC_MACRO_V3_HTTP_DELIVERY_NOT_CERTIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-v3-observed-public-receipt-${{ github.run_id }}
          path: |
            site/control-room-preview/macro-v3-current-evidence.json
            /tmp/macro-v3-public-http-delivery-proof.json
            /tmp/ons-quarterly-gdp-collection.json
            /tmp/esri-quarterly-gdp-collection.json
            /tmp/abs-quarterly-gdp-collection.json
            /tmp/abs-q2-proof.json
            /tmp/statcan-quarterly-gdp-collection.json
            /tmp/statcan-q2-proof.json
            /tmp/eurostat-quarterly-gdp-collection.json
            /tmp/eurostat-q3-proof.json
            /tmp/statsnz-quarterly-gdp-collection.json
            /tmp/statsnz-q2-proof.json
          if-no-files-found: warn
          retention-days: 14
