name: JPY e-Stat Live Verification V1

on:
  workflow_dispatch:
  push:
    branches:
      - validation-macro-source-jpy-estat-v1-2026-10-05

permissions:
  contents: read

jobs:
  live-source-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E_STAT_APP_ID: ${{ secrets.E_STAT_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require e-Stat API credential
        shell: bash
        run: |
          if [ -z "${E_STAT_APP_ID}" ]; then
            echo "E_STAT_APP_ID repository secret is not configured."
            exit 1
          fi

      - name: Probe latest unemployed-person rate observations
        run: |
          python - <<'PY'
          from validation.sources.jpy_estat_unemployment import fetch_payload, class_maps, values, DEFAULT_STATS_DATA_ID
          import os, json
          p=fetch_payload(os.environ['E_STAT_APP_ID'], DEFAULT_STATS_DATA_ID)
          maps=class_maps(p)
          rows=[]
          for v in values(p):
              if (str(v.get('@tab'))=='02' and str(v.get('@cat01'))=='000' and str(v.get('@cat02'))=='0' and
                  str(v.get('@cat03'))=='08' and str(v.get('@cat04'))=='00' and str(v.get('@area'))=='00000'):
                  tc=str(v.get('@time',''))
                  rows.append((tc, maps.get('time',{}).get(tc,tc), v.get('$'), v.get('@unit')))
          print('TARGET_CLASS', json.dumps({
              'tab':maps.get('tab',{}).get('02'), 'cat01':maps.get('cat01',{}).get('000'),
              'cat02':maps.get('cat02',{}).get('0'), 'cat03':maps.get('cat03',{}).get('08'),
              'cat04':maps.get('cat04',{}).get('00'), 'area':maps.get('area',{}).get('00000')
          }, ensure_ascii=False))
          print('LATEST_TARGET_ROWS', json.dumps(rows[-24:], ensure_ascii=False))
          PY

      - name: Fetch official JPY unemployment and build candidate
        run: |
          mkdir -p /tmp/gmfq-jpy-estat-live
          python validation/sources/jpy_estat_unemployment.py \
            --output /tmp/gmfq-jpy-estat-live/candidate.json \
            --audit-output /tmp/gmfq-jpy-estat-live/source-audit.json

      - name: Pass live candidate through canonical macro builder
        run: |
          python validation/build_macro_candidate.py \
            --candidate /tmp/gmfq-jpy-estat-live/candidate.json \
            --output-dir /tmp/gmfq-jpy-estat-live/built

      - name: Assert candidate is JPY labour and source is official
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/gmfq-jpy-estat-live/candidate.json').read_text())
          a=json.loads(Path('/tmp/gmfq-jpy-estat-live/source-audit.json').read_text())
          s=json.loads(Path('/tmp/gmfq-jpy-estat-live/built/summary.json').read_text())
          assert c['currency']=='JPY', c
          assert c['dimension']=='labour', c
          assert c['source']=='Statistics Bureau of Japan / e-Stat', c
          assert a['mode']=='live', a
          assert a['live_data_written'] is False, a
          assert s['status']=='PASS', s
          assert s['live_data_modified'] is False, s
          assert s['observation_date']==c['observation_date'], (s,c)
          assert float(s['new_value'])==float(c['value']), (s,c)
          print(json.dumps({
              'status':'PASS',
              'observation_date':c['observation_date'],
              'value':c['value'],
              'prior_period':a['prior_period'],
              'prior_value':a['prior_value'],
              'delta':a['delta'],
              'series_action':s['series_action'],
              'live_data_modified':False
          }, indent=2))
          PY

      - name: Confirm repository live data remained untouched
        run: |
          git diff --exit-code -- \
            live_data/sections/MACRO_SERIES.json \
            live_data/sections/MACRO_THERMOMETER_DATA.json

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: jpy-estat-live-verification
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/gmfq-jpy-estat-live/candidate.json
            /tmp/gmfq-jpy-estat-live/source-audit.json
            /tmp/gmfq-jpy-estat-live/built/summary.json
