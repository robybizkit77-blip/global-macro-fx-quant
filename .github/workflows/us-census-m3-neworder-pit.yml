name: US Census M3 NEWORDER PIT Crawl

on:
  push:
    branches: [staging-usd-pit-readiness-2026-10-03]
    paths:
      - validation/crawl_us_census_m3_neworder_pit.py
      - .github/workflows/us-census-m3-neworder-pit.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us-census-m3-neworder-pit
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-usd-pit-readiness-2026-10-03
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pypdf
      - name: Crawl Census M3 historical NEWORDER releases
        run: python validation/crawl_us_census_m3_neworder_pit.py
      - name: Commit Census M3 PIT batch artifact
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/pit_batch/census/CENSUS_M3_NEWORDER_PIT_BATCH_V1_2026-10-03.json || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build Census M3 NEWORDER PIT batch"
            git pull --rebase origin staging-usd-pit-readiness-2026-10-03
            git push origin HEAD:staging-usd-pit-readiness-2026-10-03
          fi
