name: JPY Reaction Discovery Diagnostic V1
on:
  push:
    branches:
      - audit-jpy-reaction-source-probe-v1-2026-10-06
    paths:
      - .github/workflows/jpy-reaction-discovery-diagnostic-v1.yml
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print exact discovery results
        run: |
          python - <<'PY'
          import importlib.util, json
          p='validation/run_jpy_reaction_function_replay_v1.py'
          spec=importlib.util.spec_from_file_location('r',p)
          r=importlib.util.module_from_spec(spec); spec.loader.exec_module(r)
          for kind in ('wages','cpi'):
              good,scan=r.discover(kind)
              print('\nKIND',kind,'GOOD',len(good))
              for x in scan:
                  print(json.dumps({k:v for k,v in x.items() if k!='rows'},ensure_ascii=False,indent=2))
          PY
