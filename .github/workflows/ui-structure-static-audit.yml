name: UI Structure Static Audit
on:
  push:
    branches:
      - staging-usd-pit-readiness-2026-10-03
    paths:
      - 'validation/audit_ui_structure.py'
      - '.github/workflows/ui-structure-static-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run UI structure audit
        run: python validation/audit_ui_structure.py
      - name: Commit audit artifact if changed
        run: |
          if git diff --quiet -- validation/UI_STRUCTURE_STATIC_AUDIT_2026-10-03.json && git ls-files --error-unmatch validation/UI_STRUCTURE_STATIC_AUDIT_2026-10-03.json >/dev/null 2>&1; then
            echo 'No audit changes'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/UI_STRUCTURE_STATIC_AUDIT_2026-10-03.json
          git commit -m 'Record UI structure static audit'
          git push
