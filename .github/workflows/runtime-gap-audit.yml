name: Runtime Gap Audit

on:
  push:
    branches:
      - staging-runtime-gap-audit-2026-09-30
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright package
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/gmfq-server.log 2>&1 &
          sleep 2
      - name: Collect runtime gap inventory
        run: |
          cat > runtime-gap-audit.js <<'EOF'
          const { chromium } = require('playwright');
          const { execSync } = require('child_process');
          (async()=>{
            const chromePath=execSync('command -v google-chrome-stable || command -v google-chrome || command -v chromium').toString().trim();
            const browser=await chromium.launch({headless:true,executablePath:chromePath,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            const consoleErrors=[], pageErrors=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            const res=await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle',timeout:120000});
            if(!res?.ok()) throw new Error('HTTP load failed');
            await page.waitForFunction(()=>document.documentElement.getAttribute('data-post-gate-final-audit'),null,{timeout:120000});
            const out=await page.evaluate(()=>{
              const ccys=['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];
              const rates={};
              for(const c of ccys){
                const d=(typeof NATIVE_RATES_DATA!=='undefined' ? NATIVE_RATES_DATA?.[c] : null);
                rates[c]=d?{
                  date:d.date||d.current_as_of||null,
                  source:d.source||null,
                  quality:d.quality||null,
                  freshness_status:d.freshness_status||null,
                  history_status:d.history_status||null,
                  y2:d['2Y']??d.y2??null,
                  y10:d['10Y']??d.y10??null,
                  chg2_bp:d.chg2_bp??null,
                  chg10_bp:d.chg10_bp??null,
                  curve_bp:d.curve_bp??null
                }:null;
              }
              const therm={};
              for(const c of ccys){
                try{
                  therm[c]={
                    labour:window.GMFQ_MACRO_THERMOMETER?.series?.(c,'labour')||null,
                    inflation:window.GMFQ_MACRO_THERMOMETER?.series?.(c,'inflation')||null
                  };
                }catch(e){therm[c]={error:String(e)}}
              }
              let unresolved=[];
              try{unresolved=(typeof unresolvedSourceChecks==='function'?unresolvedSourceChecks():[])}catch(e){unresolved=[{error:String(e)}]}
              const sourcePolicy=window.FINAL_SOURCE_POLICY_AUDIT||null;
              const freshness=window.LIVE_FRESHNESS_REGISTRY||window.PRODUCTION_LIVE_FRESHNESS||window.PRODUCTION_FRESHNESS_REGISTRY||null;
              const health=typeof productionHealthCheck==='function'?productionHealthCheck():null;
              const ois=Object.fromEntries(ccys.map(c=>[c,window.GMFQ_OIS?.currency?.(c)?.status||'WITHHELD']));
              return {
                title:document.title,
                finalAudit:window.GMFQ_POST_GATE_FINAL_AUDIT||null,
                fullSystemAudit:window.GMFQ_FULL_SYSTEM_AUDIT||null,
                rates,
                therm,
                unresolved,
                sourcePolicy,
                freshness,
                health,
                ois,
                risk:window.MODEL_STATE?.globalRisk||null,
                calendar:window.PRODUCTION_AUX_DATA?.calendar||window.AUX_DATA?.calendar||null,
                news:window.PRODUCTION_AUX_DATA?.news||window.AUX_DATA?.news||null
              };
            });
            console.log('RUNTIME_GAP_AUDIT='+JSON.stringify({out,consoleErrors,pageErrors},null,2));
            if(pageErrors.length) throw new Error('Page errors '+pageErrors.join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node runtime-gap-audit.js
