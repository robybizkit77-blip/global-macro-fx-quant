name: Loader Cache Browser Probe

on:
  push:
    branches:
      - test-loader-cache-browser-audit-2026-10-05
  workflow_dispatch:

jobs:
  loader-cache-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/gmfq-server.log 2>&1 &
          sleep 2

      - name: Probe loader and browser cache
        run: |
          cat > loader-cache-probe.js <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:1200}});
            const consoleErrors=[];
            const pageErrors=[];
            page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
            page.on('pageerror',e=>pageErrors.push(String(e)));

            async function snapshot(label){
              await page.waitForFunction(() => document.documentElement.getAttribute('data-post-gate-final-audit'), null, {timeout:120000});
              return await page.evaluate((label)=>{
                const payload = performance.getEntriesByType('resource')
                  .filter(e=>e.name.includes('/payload/part-'))
                  .map(e=>({name:e.name.split('/').pop(), transferSize:e.transferSize, encodedBodySize:e.encodedBodySize, duration:e.duration}));
                return {
                  label,
                  title: document.title,
                  finalAudit: window.GMFQ_POST_GATE_FINAL_AUDIT || null,
                  payloadCount: payload.length,
                  payloadTransferBytes: payload.reduce((a,e)=>a+(e.transferSize||0),0),
                  payloadEncodedBytes: payload.reduce((a,e)=>a+(e.encodedBodySize||0),0),
                  payloadDurationMs: payload.reduce((a,e)=>a+(e.duration||0),0),
                  bodyTextLength: document.body?.innerText?.length || 0,
                  payload
                };
              },label);
            }

            let r = await page.goto('http://127.0.0.1:8000/', {waitUntil:'networkidle', timeout:120000});
            if(!r || !r.ok()) throw new Error('HTTP load failed');
            const first = await snapshot('first');

            r = await page.reload({waitUntil:'networkidle', timeout:120000});
            if(!r || !r.ok()) throw new Error('HTTP reload failed');
            const second = await snapshot('second');

            console.log(JSON.stringify({first,second,consoleErrors,pageErrors},null,2));

            if(first.finalAudit?.status!=='PASS' || second.finalAudit?.status!=='PASS') throw new Error('Final audit not PASS');
            if(first.payloadCount!==16 || second.payloadCount!==16) throw new Error(`Unexpected payload count ${first.payloadCount}/${second.payloadCount}`);
            if(first.bodyTextLength<1000 || second.bodyTextLength<1000) throw new Error('Rendered body unexpectedly small');
            if(consoleErrors.length || pageErrors.length) throw new Error('Browser errors detected');
            if(!(second.payloadTransferBytes < first.payloadTransferBytes)) throw new Error(`Cache ineffective: first=${first.payloadTransferBytes} second=${second.payloadTransferBytes}`);

            await browser.close();
          })().catch(e=>{ console.error('::error title=Loader cache probe::'+String(e.message||e)); process.exit(1); });
          EOF
          node loader-cache-probe.js
