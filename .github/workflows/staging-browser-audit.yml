name: Safe Batched Refresh Benchmark

on:
  push:
    branches:
      - test-loader-cache-browser-audit-2026-10-05
  workflow_dispatch:

jobs:
  safe-batched-refresh-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build baseline and safe batched probes
        run: |
          cat payload/part-00.txt payload/part-01.txt payload/part-02.txt payload/part-03.txt payload/part-04.txt payload/part-05.txt payload/part-06.txt payload/part-07.txt payload/part-08.txt payload/part-09.txt payload/part-10.txt payload/part-11.txt payload/part-12.txt payload/part-13.txt payload/part-14.txt payload/part-15.txt > baseline.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('baseline.html')
          s=p.read_text()
          defs=list(re.finditer(r'function\s+stableModelRefresh\s*\(\s*\)',s))
          calls=list(re.finditer(r'(?<!function\s)\bstableModelRefresh\s*\(\s*\)',s))
          print('function_defs=',len(defs),'call_sites=',len(calls))
          if len(defs)!=1:
              raise SystemExit(f'Expected exactly one stableModelRefresh definition, found {len(defs)}')
          s2=re.sub(r'(?<!function\s)\bstableModelRefresh\s*\(\s*\)', '(window.__GMFQ_STABLE_REFRESH_QUEUED=true)', s)
          marker='<script id="gmfq-post-gate-final-audit-settlement">'
          if marker not in s2:
              raise SystemExit('final audit marker missing')
          one='<script id="gmfq-single-final-stable-refresh">try{if(typeof stableModelRefresh===\'function\')stableModelRefresh();}catch(e){console.error(\'single-final-refresh\',e);}</script>\n'
          s2=s2.replace(marker,one+marker,1)
          if len(re.findall(r'function\s+stableModelRefresh\s*\(\s*\)',s2))!=1:
              raise SystemExit('stableModelRefresh definition damaged')
          Path('batched.html').write_text(s2)
          PY
          grep -q 'GMFQ_RUNTIME_VALIDATION_MANIFEST' baseline.html
          grep -q 'gmfq-single-final-stable-refresh' batched.html
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/gmfq-server.log 2>&1 &
          sleep 2
      - name: Compare baseline vs safe batched refresh
        run: |
          cat > benchmark.js <<'EOF'
          const { chromium } = require('playwright');
          const PAIRS=['AUD/CAD','AUD/CHF','AUD/JPY','AUD/NZD','AUD/USD','CAD/CHF','CAD/JPY','CHF/JPY','EUR/AUD','EUR/CAD','EUR/CHF','EUR/GBP','EUR/JPY','EUR/NZD','EUR/USD','GBP/AUD','GBP/CAD','GBP/CHF','GBP/JPY','GBP/NZD','GBP/USD','NZD/CAD','NZD/CHF','NZD/JPY','NZD/USD','USD/CAD','USD/CHF','USD/JPY'];
          const CCYS=['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];
          async function measure(browser,path,label){
            const context=await browser.newContext({viewport:{width:1440,height:1200}});
            const page=await context.newPage();
            await page.addInitScript(()=>{
              window.__GMFQ_LONG_TASKS=[];
              try{new PerformanceObserver(list=>{for(const e of list.getEntries()) window.__GMFQ_LONG_TASKS.push({start:e.startTime,duration:e.duration});}).observe({entryTypes:['longtask']});}catch(e){}
            });
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error') errors.push(m.text());});
            const t0=Date.now();
            const r=await page.goto('http://127.0.0.1:8000/'+path,{waitUntil:'domcontentloaded',timeout:120000});
            if(!r||!r.ok()) throw new Error(label+' HTTP load failed');
            const domContentLoadedMs=Date.now()-t0;
            await page.waitForFunction(()=>document.title.startsWith('GLOBAL MACRO FX QUANT —'),null,{timeout:120000});
            const runtimeTitleMs=Date.now()-t0;
            await page.waitForFunction(()=>{const txt=document.body?.innerText||'';return txt.length>1000;},null,{timeout:120000});
            const usableUiMs=Date.now()-t0;
            await page.waitForFunction(()=>document.documentElement.getAttribute('data-post-gate-final-audit'),null,{timeout:120000});
            const finalAuditMs=Date.now()-t0;
            const state=await page.evaluate(({CCYS,PAIRS})=>{
              const longTasks=window.__GMFQ_LONG_TASKS||[];
              const currencies={};
              for(const c of CCYS) currencies[c]=window.deriveCurrencyState?.(c)||null;
              const pairs={};
              for(const p of PAIRS) pairs[p]=window.derivePairDecisionFrame?.(p)||null;
              return {
                finalAudit:window.GMFQ_POST_GATE_FINAL_AUDIT||null,
                currencies,pairs,
                ois:Object.fromEntries(CCYS.map(c=>[c,window.GMFQ_OIS?.currency?.(c)?.status||null])),
                longTaskCount:longTasks.length,
                longTaskTotalMs:longTasks.reduce((a,e)=>a+e.duration,0),
                longestLongTaskMs:longTasks.reduce((a,e)=>Math.max(a,e.duration),0),
                bodyTextLength:document.body?.innerText?.length||0,
                queued:window.__GMFQ_STABLE_REFRESH_QUEUED===true
              };
            },{CCYS,PAIRS});
            await context.close();
            return {label,domContentLoadedMs,runtimeTitleMs,usableUiMs,finalAuditMs,errors,state};
          }
          function stableProjection(x){
            return JSON.stringify({
              finalAudit:x.state.finalAudit,
              currencies:x.state.currencies,
              pairs:x.state.pairs,
              ois:x.state.ois
            });
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const baseline=await measure(browser,'baseline.html','baseline');
            const batched=await measure(browser,'batched.html','batched');
            const identical=stableProjection(baseline)===stableProjection(batched);
            const comparison={
              identicalCanonicalState:identical,
              usableUiImprovementMs:baseline.usableUiMs-batched.usableUiMs,
              usableUiImprovementPct:Number((100*(baseline.usableUiMs-batched.usableUiMs)/baseline.usableUiMs).toFixed(2)),
              finalAuditImprovementMs:baseline.finalAuditMs-batched.finalAuditMs,
              longTaskTotalImprovementMs:baseline.state.longTaskTotalMs-batched.state.longTaskTotalMs,
              longestTaskImprovementMs:baseline.state.longestLongTaskMs-batched.state.longestLongTaskMs
            };
            console.log(JSON.stringify({baseline,batched,comparison},null,2));
            if(baseline.errors.length||batched.errors.length) throw new Error('Browser errors detected');
            if(baseline.state.finalAudit?.status!=='PASS'||batched.state.finalAudit?.status!=='PASS') throw new Error('Final audit not PASS');
            if(!identical) throw new Error('Canonical state differs after safe batching');
            await browser.close();
          })().catch(e=>{console.error('::error title=Safe batched refresh benchmark::'+String(e.message||e));process.exit(1);});
          EOF
          node benchmark.js
