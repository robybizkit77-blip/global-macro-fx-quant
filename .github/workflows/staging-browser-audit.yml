name: Staging Browser Audit

on:
  push:
    branches:
      - staging-nzd-ois-gate-2026-09-30
      - staging-global-coherence-v490-20260930
      - staging-live-data-refresh-v1-2026-10-04
  workflow_dispatch:

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/gmfq-server.log 2>&1 &
          echo $! > /tmp/gmfq-server.pid
          sleep 2

      - name: Run browser audit
        run: |
          cat > browser-audit.js <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:1200}});
            const consoleErrors=[];
            const pageErrors=[];
            page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
            page.on('pageerror',e=>pageErrors.push(String(e)));
            const response = await page.goto('http://127.0.0.1:8000/', {waitUntil:'networkidle', timeout:120000});
            if(!response || !response.ok()) throw new Error('HTTP load failed');
            await page.waitForFunction(() => document.documentElement.getAttribute('data-post-gate-final-audit'), null, {timeout:120000});
            await page.waitForTimeout(1200);

            const result = await page.evaluate(() => {
              const audit = window.GMFQ_POST_GATE_FINAL_AUDIT || null;
              const scriptOrder=[...document.scripts].map(s=>s.id);
              const cad=window.NATIVE_RATES_DATA?.CAD||window.__GMFQ_DATA?.NATIVE_RATES_DATA?.CAD||null;
              const sections = {};
              for (const v of ['currencies','ratesdesk','pairs','cot','risk','macro','inflationlabour','themes']) {
                try {
                  if (typeof window.showView === 'function') window.showView(v);
                  const el = document.getElementById(v);
                  sections[v] = {exists:!!el, active:!!el?.classList?.contains('active')};
                } catch(e) {
                  sections[v] = {exists:!!document.getElementById(v), error:String(e)};
                }
              }
              const currencyStates={};
              for (const c of ['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD']) {
                currencyStates[c]=typeof window.deriveCurrencyState==='function' ? window.deriveCurrencyState(c) : null;
              }
              if (typeof window.selectCurrency==='function') window.selectCurrency('EUR',true);
              const eurText=document.body?.innerText||'';
              if (typeof window.selectCurrency==='function') window.selectCurrency('JPY',true);
              const jpyText=document.body?.innerText||'';
              if (typeof window.openPairDetail==='function') window.openPairDetail('USD/JPY');
              const usdjpy=typeof window.derivePairDecisionFrame==='function' ? window.derivePairDecisionFrame('USD/JPY') : null;
              const withheldText={};
              for (const c of ['USD','CHF','NZD']) {
                if (typeof window.selectNativeCb==='function') window.selectNativeCb(c);
                withheldText[c]=document.body?.innerText||'';
              }
              return {
                title: document.title,
                finalAudit: audit,
                cadHydration:{
                  native2Y:Number(cad?.['2Y']), native10Y:Number(cad?.['10Y']), nativeCurveBp:Number(cad?.curve_bp),
                  macro2Y:Number(window.__GMFQ_DATA?.D?.macro?.CAD?.rate2y),
                  metadataAsOf:window.__GMFQ_DATA?.RATES_AUDIT_METADATA?.rates?.CAD?.current_as_of||null,
                  auditStatus:window.GMFQ_CAD_RATES_AUDIT?.status||null,
                  settledAfterStableRefresh:window.GMFQ_CAD_RATES_AUDIT?.settled_after_stable_refresh===true,
                  integrity:{basisOk:(typeof window.ratesCanonicalBasisIntegrity==='function'?window.ratesCanonicalBasisIntegrity():null)?.ok??null,visibleOk:(typeof window.visibleRatesSnapshotIntegrity==='function'?window.visibleRatesSnapshotIntegrity():null)?.ok??null},
                  order:{hydration:scriptOrder.indexOf('gmfq-live-rates-audit-metadata-hydration'),integrity:scriptOrder.indexOf('gmfq-cad-live-hydration-integrity'),finalAudit:scriptOrder.indexOf('gmfq-post-gate-final-audit-20260930')}
                },
                fullSystemAudit: window.GMFQ_FULL_SYSTEM_AUDIT || null,
                ratesMetadata: window.__GMFQ_DATA?.RATES_AUDIT_METADATA || null,
                ois: {
                  USD: window.GMFQ_OIS?.currency?.('USD')?.status || null,
                  EUR: window.GMFQ_OIS?.currency?.('EUR')?.status || null,
                  GBP: window.GMFQ_OIS?.currency?.('GBP')?.status || null,
                  JPY: window.GMFQ_OIS?.currency?.('JPY')?.status || null,
                  CHF: window.GMFQ_OIS?.currency?.('CHF')?.status || null,
                  CAD: window.GMFQ_OIS?.currency?.('CAD')?.status || null,
                  AUD: window.GMFQ_OIS?.currency?.('AUD')?.status || null,
                  NZD: window.GMFQ_OIS?.currency?.('NZD')?.status || null
                },
                sections,
                currencyStates,
                usdjpy,
                coherenceText:{eur:eurText,jpy:jpyText,withheld:withheldText},
                bodyTextLength: document.body?.innerText?.length || 0
              };
            });

            console.log(JSON.stringify({result,consoleErrors,pageErrors},null,2));

            if(!String(result.title||'').startsWith('GLOBAL MACRO FX QUANT')) throw new Error('Unexpected title: '+result.title);
            if(!result.finalAudit) throw new Error('Final audit missing');
            const cad=result.cadHydration||{};
            if(cad.native2Y!==3.27 || cad.macro2Y!==3.27 || cad.native10Y!==3.94 || cad.nativeCurveBp!==67) throw new Error('CAD live hydration values fail: '+JSON.stringify(cad));
            if(cad.metadataAsOf!=='2026-10-01' || cad.integrity?.basisOk!==true || cad.integrity?.visibleOk!==true) throw new Error('CAD metadata/integrity chain fail: '+JSON.stringify(cad));
            if(cad.auditStatus!=='PASS' || cad.settledAfterStableRefresh!==true) throw new Error('CAD settled audit fail: '+JSON.stringify(cad));
            if(cad.order?.hydration<0 || cad.order?.integrity<0 || cad.order?.finalAudit<0 || cad.order.hydration>=cad.order.integrity || cad.order.integrity>=cad.order.finalAudit) throw new Error('CAD hydration/integrity/final-audit order fail: '+JSON.stringify(cad.order));
            if(!result.ratesMetadata || result.ratesMetadata.schema!=='GMFQ_RATES_AUDIT_METADATA_V1') throw new Error('Rates live audit metadata missing');
            for(const [ccy,date] of Object.entries(result.ratesMetadata.expected_rates||{})){
              const row=(window=>window)(result).ratesMetadata.rates?.[ccy];
              if(!row || row.current_as_of!==date) throw new Error('Rates metadata/context mismatch '+ccy);
            }
            if(result.finalAudit.status!=='PASS' || result.finalAudit?.settled_after_cad_chain!==true) throw new Error('Final audit FAIL: '+JSON.stringify(result.finalAudit));
            if(result.finalAudit?.counts?.currencies!==8 || result.finalAudit?.counts?.pairs!==28) throw new Error('Universe count failure: '+JSON.stringify(result.finalAudit?.counts));
            if(result.bodyTextLength < 1000) throw new Error('Rendered body unexpectedly small');
            if(pageErrors.length) throw new Error('Page errors: '+pageErrors.join(' | '));
            if(consoleErrors.length) throw new Error('Console errors: '+consoleErrors.join(' | '));

            const jpy=result.currencyStates.JPY||{};
            if(jpy.base!=='COSTRUTTIVA' || jpy.macro!==0 || jpy.policy!==1) throw new Error('JPY coherence failure: '+JSON.stringify(jpy));
            const usdjpy=result.usdjpy||{};
            if(usdjpy.quality!=='VANTAGGIO RELATIVO PARZIALE' || usdjpy.fav!=='USD' || usdjpy.macroSide!=='USD' || usdjpy.policySide!==null || !usdjpy.structural?.ratesGap?.material || usdjpy.structural?.ratesGap?.side!=='USD') throw new Error('USD/JPY current canonical structure failure: '+JSON.stringify(usdjpy));
            if(!result.coherenceText.eur.includes('QUADRO DI FONDO') || !result.coherenceText.eur.includes('CAMBIAMENTO RECENTE')) throw new Error('EUR level/change separation missing');
            if(result.coherenceText.jpy.includes('Macro e Tassi/CB favoriscono entrambi JPY')) throw new Error('JPY wording still overstates support');

            const expected={USD:'WITHHELD',EUR:'ACTIVE',GBP:'ACTIVE',JPY:'ACTIVE',CHF:'WITHHELD',CAD:'ACTIVE',AUD:'ACTIVE',NZD:'WITHHELD'};
            for(const [k,v] of Object.entries(expected)){
              if(result.ois[k]!==v) throw new Error(`OIS ${k}: ${result.ois[k]} != ${v}`);
            }
            for (const c of ['USD','CHF','NZD']) {
              const txt=result.coherenceText.withheld[c]||'';
              if(!txt.includes('front-end osservato')) throw new Error(`OIS/front-end wording failure ${c}`);
            }

            await page.screenshot({path:'staging-browser-audit.png',fullPage:true});
            await browser.close();
          })().catch(e=>{ console.error('::error title=Browser audit detail::'+String(e.message||e)); process.exit(1); });
          EOF
          node browser-audit.js

      - name: Upload screenshot and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-browser-audit
          path: |
            staging-browser-audit.png
            /tmp/gmfq-server.log
