name: Startup Timing Probe

on:
  push:
    branches:
      - test-loader-cache-browser-audit-2026-10-05
  workflow_dispatch:

jobs:
  startup-timing-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/gmfq-server.log 2>&1 &
          sleep 2
      - name: Measure startup phases
        run: |
          cat > startup-timing-probe.js <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            await page.addInitScript(()=>{
              window.__GMFQ_LONG_TASKS=[];
              try{
                new PerformanceObserver(list=>{
                  for(const e of list.getEntries()) window.__GMFQ_LONG_TASKS.push({start:e.startTime,duration:e.duration});
                }).observe({entryTypes:['longtask']});
              }catch(e){}
            });
            const t0=Date.now();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error') errors.push(m.text());});
            const r=await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:120000});
            if(!r||!r.ok()) throw new Error('HTTP load failed');
            const domContentLoadedMs=Date.now()-t0;

            await page.waitForFunction(()=>document.title.startsWith('GLOBAL MACRO FX QUANT —'),null,{timeout:120000});
            const runtimeTitleMs=Date.now()-t0;

            await page.waitForFunction(()=>{
              const txt=document.body?.innerText||'';
              return txt.length>1000 && !txt.trim().startsWith('Caricamento GLOBAL MACRO FX QUANT');
            },null,{timeout:120000});
            const usableUiMs=Date.now()-t0;

            await page.waitForFunction(()=>document.documentElement.getAttribute('data-post-gate-final-audit'),null,{timeout:120000});
            const finalAuditMs=Date.now()-t0;

            const metrics=await page.evaluate(()=>{
              const nav=performance.getEntriesByType('navigation')[0];
              const longTasks=window.__GMFQ_LONG_TASKS||[];
              const resources=performance.getEntriesByType('resource').filter(e=>e.name.includes('/payload/part-'));
              return {
                navigation:nav?{
                  responseEnd:nav.responseEnd,
                  domInteractive:nav.domInteractive,
                  domContentLoadedEventEnd:nav.domContentLoadedEventEnd,
                  loadEventEnd:nav.loadEventEnd
                }:null,
                longTaskCount:longTasks.length,
                longTaskTotalMs:longTasks.reduce((a,e)=>a+e.duration,0),
                longestLongTaskMs:longTasks.reduce((a,e)=>Math.max(a,e.duration),0),
                longTasks:longTasks.sort((a,b)=>b.duration-a.duration).slice(0,20),
                payloadTransferBytes:resources.reduce((a,e)=>a+(e.transferSize||0),0),
                payloadEncodedBytes:resources.reduce((a,e)=>a+(e.encodedBodySize||0),0),
                finalAudit:window.GMFQ_POST_GATE_FINAL_AUDIT||null,
                bodyTextLength:document.body?.innerText?.length||0
              };
            });
            console.log(JSON.stringify({domContentLoadedMs,runtimeTitleMs,usableUiMs,finalAuditMs,errors,metrics},null,2));
            if(errors.length) throw new Error('Browser errors: '+errors.join(' | '));
            if(metrics.finalAudit?.status!=='PASS') throw new Error('Final audit not PASS');
            await browser.close();
          })().catch(e=>{console.error('::error title=Startup timing probe::'+String(e.message||e));process.exit(1);});
          EOF
          node startup-timing-probe.js
