name: Startup Batch Browser Gate

on:
  push:
    branches:
      - test-startup-batch-browser-audit-2026-10-05
  workflow_dispatch:

jobs:
  startup-batch-browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/gmfq-server.log 2>&1 &
          sleep 2
      - name: Run optimized loader gate
        run: |
          cat > gate.js <<'EOF'
          const { chromium } = require('playwright');
          const CCYS=['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];
          const PAIRS=['AUD/CAD','AUD/CHF','AUD/JPY','AUD/NZD','AUD/USD','CAD/CHF','CAD/JPY','CHF/JPY','EUR/AUD','EUR/CAD','EUR/CHF','EUR/GBP','EUR/JPY','EUR/NZD','EUR/USD','GBP/AUD','GBP/CAD','GBP/CHF','GBP/JPY','GBP/NZD','GBP/USD','NZD/CAD','NZD/CHF','NZD/JPY','NZD/USD','USD/CAD','USD/CHF','USD/JPY'];
          const EXPECTED_OIS={USD:'WITHHELD',EUR:'ACTIVE',GBP:'ACTIVE',JPY:'ACTIVE',CHF:'WITHHELD',CAD:'ACTIVE',AUD:'ACTIVE',NZD:'WITHHELD'};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});
            await page.addInitScript(()=>{
              window.__GMFQ_LONG_TASKS=[];
              try{new PerformanceObserver(list=>{for(const e of list.getEntries())window.__GMFQ_LONG_TASKS.push({start:e.startTime,duration:e.duration});}).observe({entryTypes:['longtask']});}catch(e){}
            });
            const t0=Date.now();
            const r=await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:120000});
            if(!r||!r.ok())throw new Error('HTTP load failed');
            await page.waitForFunction(()=>document.title.startsWith('GLOBAL MACRO FX QUANT —'),null,{timeout:120000});
            const titleMs=Date.now()-t0;
            await page.waitForFunction(()=>{const x=document.body?.innerText||'';return x.length>1000&&!x.startsWith('Caricamento GLOBAL MACRO FX QUANT');},null,{timeout:120000});
            const usableUiMs=Date.now()-t0;
            await page.waitForFunction(()=>document.documentElement.getAttribute('data-post-gate-final-audit'),null,{timeout:120000});
            const finalAuditMs=Date.now()-t0;
            const first=await page.evaluate(({CCYS,PAIRS})=>{
              const currencies=Object.fromEntries(CCYS.map(c=>[c,window.deriveCurrencyState?.(c)||null]));
              const pairs=Object.fromEntries(PAIRS.map(p=>[p,window.derivePairDecisionFrame?.(p)||null]));
              const ois=Object.fromEntries(CCYS.map(c=>[c,window.GMFQ_OIS?.currency?.(c)?.status||null]));
              const longTasks=window.__GMFQ_LONG_TASKS||[];
              const resources=performance.getEntriesByType('resource').filter(e=>e.name.includes('/payload/part-'));
              return {
                finalAudit:window.GMFQ_POST_GATE_FINAL_AUDIT||null,
                currencies,pairs,ois,
                queued:window.__GMFQ_STABLE_REFRESH_QUEUED===true,
                bodyTextLength:document.body?.innerText?.length||0,
                longTaskTotalMs:longTasks.reduce((a,e)=>a+e.duration,0),
                longestLongTaskMs:longTasks.reduce((a,e)=>Math.max(a,e.duration),0),
                payloadTransferBytes:resources.reduce((a,e)=>a+(e.transferSize||0),0)
              };
            },{CCYS,PAIRS});

            for(const view of ['currencies','ratesdesk','pairs','cot','risk','macro','inflationlabour','themes']){
              await page.evaluate(v=>window.showView?.(v),view);
              const exists=await page.evaluate(v=>!!document.getElementById(v),view);
              if(!exists)throw new Error('Missing view '+view);
            }
            for(const c of CCYS) await page.evaluate(c=>window.selectCurrency?.(c,true),c);
            for(const p of ['USD/JPY','EUR/USD','AUD/CAD','GBP/CHF']) await page.evaluate(p=>window.openPairDetail?.(p),p);
            for(const c of CCYS) await page.evaluate(c=>window.selectNativeCb?.(c),c);

            const firstTransfer=first.payloadTransferBytes;
            await page.reload({waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>document.documentElement.getAttribute('data-post-gate-final-audit'),null,{timeout:120000});
            const second=await page.evaluate(()=>{
              const resources=performance.getEntriesByType('resource').filter(e=>e.name.includes('/payload/part-'));
              return {
                finalAudit:window.GMFQ_POST_GATE_FINAL_AUDIT||null,
                transfer:resources.reduce((a,e)=>a+(e.transferSize||0),0),
                bodyTextLength:document.body?.innerText?.length||0
              };
            });

            const summary={titleMs,usableUiMs,finalAuditMs,errors,firstTransfer,secondTransfer:second.transfer,first,second};
            console.log(JSON.stringify(summary,null,2));
            if(errors.length)throw new Error('Browser errors: '+errors.join(' | '));
            if(first.finalAudit?.status!=='PASS'||second.finalAudit?.status!=='PASS')throw new Error('Final audit not PASS');
            if(Object.values(first.currencies).some(v=>!v))throw new Error('Missing currency state');
            if(Object.values(first.pairs).some(v=>!v))throw new Error('Missing pair frame');
            for(const [c,v] of Object.entries(EXPECTED_OIS))if(first.ois[c]!==v)throw new Error(`OIS ${c}: ${first.ois[c]} != ${v}`);
            if(!first.queued)throw new Error('Bootstrap batching flag was not exercised');
            if(first.bodyTextLength<1000||second.bodyTextLength<1000)throw new Error('Rendered body too small');
            if(!(second.transfer<firstTransfer))throw new Error(`Cache ineffective: ${firstTransfer} -> ${second.transfer}`);
            if(usableUiMs>7000)throw new Error(`Optimized usable UI exceeded 7s gate: ${usableUiMs}`);
            await page.screenshot({path:'startup-batch-browser-gate.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error('::error title=Startup batch browser gate::'+String(e.message||e));process.exit(1);});
          EOF
          node gate.js
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-batch-browser-gate
          path: |
            startup-batch-browser-gate.png
            /tmp/gmfq-server.log
