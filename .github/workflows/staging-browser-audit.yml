name: Staging Browser Audit

on:
  push:
    branches:
      - 'staging-*'
      - 'release-*'
      - 'validation-*'
  workflow_dispatch:

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/gmfq-server.log 2>&1 &
          echo $! > /tmp/gmfq-server.pid
          sleep 2

      - name: Run browser integrity audit
        run: |
          cat > browser-audit.js <<'EOF'
          const { chromium } = require('playwright');
          const CCYS=['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];
          const PAIRS=['AUD/CAD','AUD/CHF','AUD/JPY','AUD/NZD','AUD/USD','CAD/CHF','CAD/JPY','CHF/JPY','EUR/AUD','EUR/CAD','EUR/CHF','EUR/GBP','EUR/JPY','EUR/NZD','EUR/USD','GBP/AUD','GBP/CAD','GBP/CHF','GBP/JPY','GBP/NZD','GBP/USD','NZD/CAD','NZD/CHF','NZD/JPY','NZD/USD','USD/CAD','USD/CHF','USD/JPY'];
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:1200}});
            const consoleErrors=[];
            const pageErrors=[];
            page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
            page.on('pageerror',e=>pageErrors.push(String(e)));
            const response = await page.goto('http://127.0.0.1:8000/', {waitUntil:'domcontentloaded', timeout:120000});
            if(!response || !response.ok()) throw new Error('HTTP load failed');
            await page.waitForTimeout(5000);

            const result = await page.evaluate(async ({CCYS,PAIRS}) => {
              const audit = window.GMFQ_POST_GATE_FINAL_AUDIT || null;
              const sections = {};
              for (const v of ['currencies','ratesdesk','pairs','cot','risk','macro','inflationlabour','themes']) {
                try {
                  if (typeof window.showView === 'function') window.showView(v);
                  const el = document.getElementById(v);
                  sections[v] = {exists:!!el, active:!!el?.classList?.contains('active')};
                } catch(e) {
                  sections[v] = {exists:!!document.getElementById(v), error:String(e)};
                }
              }
              const currencyStates=Object.fromEntries(CCYS.map(c=>[c,typeof window.deriveCurrencyState==='function'?window.deriveCurrencyState(c):null]));
              const pairFrames=Object.fromEntries(PAIRS.map(p=>[p,typeof window.derivePairDecisionFrame==='function'?window.derivePairDecisionFrame(p):null]));
              if (typeof window.selectCurrency==='function') window.selectCurrency('EUR',true);
              const eurText=document.body?.innerText||'';
              const ois=Object.fromEntries(CCYS.map(c=>[c,window.GMFQ_OIS?.currency?.(c)?.status||null]));
              const ratesBasis=typeof window.ratesCanonicalBasisIntegrity==='function' ? window.ratesCanonicalBasisIntegrity() : null;
              const nativeRates=window.__GMFQ_DATA?.NATIVE_RATES_DATA || window.NATIVE_RATES_DATA || null;
              const ratesMeta=window.__GMFQ_DATA?.RATES_AUDIT_METADATA || null;
              const canonicalResponse=await fetch('/live_data/sections/NATIVE_RATES_DATA.json',{cache:'no-store'});
              if(!canonicalResponse.ok) throw new Error('Canonical Rates fetch failed '+canonicalResponse.status);
              const canonicalRates=await canonicalResponse.json();
              return {
                title: document.title,
                finalAudit: audit,
                cadAudit: window.GMFQ_CAD_RATES_AUDIT || null,
                cadHydration: window.GMFQ_CAD_LIVE_HYDRATION_INTEGRITY || null,
                legacyCadOverlay: window.GMFQ_LEGACY_CAD_RATES_OVERLAY_DISABLED || null,
                ratesBasis,
                sections,currencyStates,pairFrames,ois,nativeRates,ratesMeta,canonicalRates,
                coherenceText:{eur:eurText},
                bodyTextLength: document.body?.innerText?.length || 0
              };
            },{CCYS,PAIRS});

            console.log(JSON.stringify({result,consoleErrors,pageErrors},null,2));

            const R=result.nativeRates, C=result.canonicalRates;
            if(!R) throw new Error('NATIVE_RATES_DATA missing in browser runtime');
            if(!C) throw new Error('Canonical NATIVE_RATES_DATA file missing');
            const sameNum=(a,b)=> (a==null&&b==null) || (Number.isFinite(Number(a))&&Number.isFinite(Number(b))&&Math.abs(Number(a)-Number(b))<1e-8);
            for(const ccy of CCYS){
              const live=R[ccy], canonical=C[ccy];
              if(!live || !canonical) throw new Error('Rates object missing '+ccy+': live='+!!live+' canonical='+!!canonical);
              if(live.date!==canonical.date || !sameNum(live['2Y'],canonical['2Y']) || !sameNum(live['10Y'],canonical['10Y']) || !sameNum(live.curve_bp,canonical.curve_bp)){
                throw new Error('G8 Rates runtime/canonical mismatch '+ccy+': live='+JSON.stringify({date:live.date,y2:live['2Y'],y10:live['10Y'],curve_bp:live.curve_bp})+' canonical='+JSON.stringify({date:canonical.date,y2:canonical['2Y'],y10:canonical['10Y'],curve_bp:canonical.curve_bp}));
              }
            }
            console.log('G8_RATES_RUNTIME_PARITY_PASS '+CCYS.join(','));

            const cad=R.CAD, nzd=R.NZD;
            if(!cad || cad.date!=='2026-10-06' || Math.abs(Number(cad['2Y'])-3.23)>1e-9 || Math.abs(Number(cad['10Y'])-3.92)>1e-9) throw new Error('CAD refresh mismatch: '+JSON.stringify(cad));
            if(!nzd || nzd.date!=='2026-10-05' || Math.abs(Number(nzd['2Y'])-3.83)>1e-9 || Math.abs(Number(nzd['10Y'])-5.04)>1e-9) throw new Error('NZD refresh mismatch: '+JSON.stringify(nzd));
            const M=result.ratesMeta;
            if(!M || M.schema!=='GMFQ_RATES_AUDIT_METADATA_V2') throw new Error('Rates metadata V2 missing: '+JSON.stringify(M));
            if(M.rates?.AUD?.status!=='CURRENT_BY_SOURCE_CADENCE') throw new Error('AUD freshness mismatch: '+JSON.stringify(M.rates?.AUD));
            if(M.rates?.CHF?.status!=='WITHHELD_SOURCE_BLOCKED' || M.rates?.CHF?.action!=='WITHHOLD') throw new Error('CHF freshness mismatch: '+JSON.stringify(M.rates?.CHF));
            console.log('RATES_FRESHNESS_ASSERTIONS_PASS CAD=2026-10-06 NZD=2026-10-05 AUD=CURRENT_BY_SOURCE_CADENCE CHF=WITHHOLD');

            if(!String(result.title||'').startsWith('GLOBAL MACRO FX QUANT')) throw new Error('Unexpected title: '+result.title);
            if(!result.finalAudit) throw new Error('Final audit missing');
            if(result.finalAudit.settled_after_cad_chain!==true) throw new Error('Final audit not settled; diagnostics='+JSON.stringify({finalAudit:result.finalAudit,cadAudit:result.cadAudit,cadHydration:result.cadHydration,legacyCadOverlay:result.legacyCadOverlay}));
            if(result.finalAudit.status!=='PASS') throw new Error('Final audit FAIL: '+JSON.stringify(result.finalAudit));
            if(result.finalAudit?.counts?.currencies!==8 || result.finalAudit?.counts?.pairs!==28) throw new Error('Canonical count mismatch: '+JSON.stringify(result.finalAudit?.counts));
            if(result.finalAudit?.canonical?.consistency_ok!==true || result.finalAudit?.canonical?.view_ok!==true) throw new Error('Canonical integrity failure');
            if(result.finalAudit?.rates?.basis_ok!==true || result.finalAudit?.rates?.visible_ok!==true) throw new Error('Rates integrity failure');
            if(result.ratesBasis?.ok!==true) throw new Error('Live rates basis integrity failure: '+JSON.stringify(result.ratesBasis));
            if(Array.isArray(result.finalAudit?.issues) && result.finalAudit.issues.length) throw new Error('Final audit issues: '+JSON.stringify(result.finalAudit.issues));
            if(result.bodyTextLength < 1000) throw new Error('Rendered body unexpectedly small');
            if(pageErrors.length) throw new Error('Page errors: '+pageErrors.join(' | '));
            if(consoleErrors.length) throw new Error('Console errors: '+consoleErrors.join(' | '));

            for(const [view,s] of Object.entries(result.sections)){
              if(!s?.exists || s?.error) throw new Error('View integrity failure '+view+': '+JSON.stringify(s));
            }
            for(const [c,s] of Object.entries(result.currencyStates)){
              if(!s || typeof s.base!=='string' || ![-1,0,1].includes(s.macro) || ![-1,0,1].includes(s.policy)) throw new Error('Currency state malformed '+c+': '+JSON.stringify(s));
            }
            for(const [pair,f] of Object.entries(result.pairFrames)){
              if(!f || typeof f.quality!=='string' || !f.quality) throw new Error('Pair frame missing '+pair+': '+JSON.stringify(f));
              const [a,b]=pair.split('/');
              if(!['—',a,b].includes(f.fav)) throw new Error('Pair favored side malformed '+pair+': '+JSON.stringify(f));
              if(!f.structural || !f.structural.macro || !f.structural.policy || !f.structural.ratesGap) throw new Error('Pair structural frame malformed '+pair+': '+JSON.stringify(f));
            }
            for(const [c,status] of Object.entries(result.ois)){
              if(!['ACTIVE','WITHHELD'].includes(status)) throw new Error('OIS status malformed '+c+': '+status);
            }
            if(!result.coherenceText.eur.includes('QUADRO DI FONDO') || !result.coherenceText.eur.includes('CAMBIAMENTO RECENTE')) throw new Error('Level/change separation missing');

            await page.screenshot({path:'staging-browser-audit.png',fullPage:true});
            await browser.close();
          })().catch(e=>{ console.error('::error title=Browser audit detail::'+String(e.message||e)); process.exit(1); });
          EOF
          node browser-audit.js

      - name: Upload screenshot and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-browser-audit
          path: |
            staging-browser-audit.png
            /tmp/gmfq-server.log

# diagnostic G8 Rates runtime/canonical parity audit 2026-10-07
# rerun after EUR canonical runtime adapter 2026-10-07
# rerun after GBP canonical runtime adapter 2026-10-07
