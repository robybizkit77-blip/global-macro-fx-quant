name: Staging Browser Audit

on:
  push:
    branches:
      - staging-nzd-ois-gate-2026-09-30
  workflow_dispatch:

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright

      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/gmfq-server.log 2>&1 &
          echo $! > /tmp/gmfq-server.pid
          sleep 2

      - name: Run browser audit
        run: |
          cat > browser-audit.js <<'EOF'
          const { chromium } = require('playwright');
const { execSync } = require('child_process');
          (async()=>{
            const chromePath = execSync('which google-chrome || which chromium || which chromium-browser').toString().trim();
            const browser = await chromium.launch({headless:true, executablePath:chromePath});
            const page = await browser.newPage({viewport:{width:1440,height:1200}});
            const consoleErrors=[];
            const pageErrors=[];
            page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
            page.on('pageerror',e=>pageErrors.push(String(e)));
            const response = await page.goto('http://127.0.0.1:8000/', {waitUntil:'networkidle', timeout:120000});
            if(!response || !response.ok()) throw new Error('HTTP load failed');
            await page.waitForFunction(() => document.documentElement.getAttribute('data-post-gate-final-audit'), null, {timeout:120000});

            const result = await page.evaluate(() => {
              const audit = window.GMFQ_POST_GATE_FINAL_AUDIT || null;
              const sections = {};
              for (const v of ['currencies','ratesdesk','pairs','cot','risk','macro','inflationlabour','themes']) {
                try {
                  if (typeof window.showView === 'function') window.showView(v);
                  const el = document.getElementById(v);
                  sections[v] = {exists:!!el, active:!!el?.classList?.contains('active')};
                } catch(e) {
                  sections[v] = {exists:!!document.getElementById(v), error:String(e)};
                }
              }
              return {
                title: document.title,
                finalAudit: audit,
                fullSystemAudit: window.GMFQ_FULL_SYSTEM_AUDIT || null,
                ois: {
                  USD: window.GMFQ_OIS?.currency?.('USD')?.status || null,
                  EUR: window.GMFQ_OIS?.currency?.('EUR')?.status || null,
                  GBP: window.GMFQ_OIS?.currency?.('GBP')?.status || null,
                  JPY: window.GMFQ_OIS?.currency?.('JPY')?.status || null,
                  CHF: window.GMFQ_OIS?.currency?.('CHF')?.status || null,
                  CAD: window.GMFQ_OIS?.currency?.('CAD')?.status || null,
                  AUD: window.GMFQ_OIS?.currency?.('AUD')?.status || null,
                  NZD: window.GMFQ_OIS?.currency?.('NZD')?.status || null
                },
                sections,
                bodyTextLength: document.body?.innerText?.length || 0
              };
            });

            console.log(JSON.stringify({result,consoleErrors,pageErrors},null,2));

            if(!String(result.title||'').startsWith('GLOBAL MACRO FX QUANT')) throw new Error('Unexpected title: '+result.title);
            if(!result.finalAudit) throw new Error('Final audit missing');
            if(result.finalAudit.status!=='PASS') throw new Error('Final audit FAIL: '+JSON.stringify(result.finalAudit));
            if(result.bodyTextLength < 1000) throw new Error('Rendered body unexpectedly small');
            if(pageErrors.length) throw new Error('Page errors: '+pageErrors.join(' | '));
            if(consoleErrors.length) throw new Error('Console errors: '+consoleErrors.join(' | '));

            const expected={USD:'WITHHELD',EUR:'WITHHELD',GBP:'ACTIVE',JPY:'WITHHELD',CHF:'WITHHELD',CAD:'ACTIVE',AUD:'WITHHELD',NZD:'WITHHELD'};
            for(const [k,v] of Object.entries(expected)){
              if(result.ois[k]!==v) throw new Error(`OIS ${k}: ${result.ois[k]} != ${v}`);
            }

            await page.screenshot({path:'staging-browser-audit.png',fullPage:true});
            await browser.close();
          })().catch(e=>{ console.error(e); process.exit(1); });
          EOF
          node browser-audit.js

      - name: Upload screenshot and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-browser-audit
          path: |
            staging-browser-audit.png
            /tmp/gmfq-server.log
