name: Static Runtime Benchmark

on:
  push:
    branches:
      - test-loader-cache-browser-audit-2026-10-05
  workflow_dispatch:

jobs:
  static-runtime-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build static probe
        run: |
          cat payload/part-00.txt payload/part-01.txt payload/part-02.txt payload/part-03.txt payload/part-04.txt payload/part-05.txt payload/part-06.txt payload/part-07.txt payload/part-08.txt payload/part-09.txt payload/part-10.txt payload/part-11.txt payload/part-12.txt payload/part-13.txt payload/part-14.txt payload/part-15.txt > static-probe.html
          grep -q 'GMFQ_RUNTIME_VALIDATION_MANIFEST' static-probe.html
          wc -c static-probe.html
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/gmfq-server.log 2>&1 &
          sleep 2
      - name: Compare loader vs static runtime
        run: |
          cat > benchmark.js <<'EOF'
          const { chromium } = require('playwright');
          async function measure(browser,path,label){
            const context=await browser.newContext({viewport:{width:1440,height:1200}});
            const page=await context.newPage();
            await page.addInitScript(()=>{
              window.__GMFQ_LONG_TASKS=[];
              try{new PerformanceObserver(list=>{for(const e of list.getEntries()) window.__GMFQ_LONG_TASKS.push({start:e.startTime,duration:e.duration});}).observe({entryTypes:['longtask']});}catch(e){}
            });
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error') errors.push(m.text());});
            const t0=Date.now();
            const r=await page.goto('http://127.0.0.1:8000/'+path,{waitUntil:'domcontentloaded',timeout:120000});
            if(!r||!r.ok()) throw new Error(label+' HTTP load failed');
            const domContentLoadedMs=Date.now()-t0;
            await page.waitForFunction(()=>document.title.startsWith('GLOBAL MACRO FX QUANT —'),null,{timeout:120000});
            const runtimeTitleMs=Date.now()-t0;
            await page.waitForFunction(()=>{const txt=document.body?.innerText||'';return txt.length>1000&&!txt.trim().startsWith('Caricamento GLOBAL MACRO FX QUANT');},null,{timeout:120000});
            const usableUiMs=Date.now()-t0;
            await page.waitForFunction(()=>document.documentElement.getAttribute('data-post-gate-final-audit'),null,{timeout:120000});
            const finalAuditMs=Date.now()-t0;
            const metrics=await page.evaluate(()=>{
              const longTasks=window.__GMFQ_LONG_TASKS||[];
              const nav=performance.getEntriesByType('navigation')[0];
              return {
                finalAudit:window.GMFQ_POST_GATE_FINAL_AUDIT||null,
                longTaskCount:longTasks.length,
                longTaskTotalMs:longTasks.reduce((a,e)=>a+e.duration,0),
                longestLongTaskMs:longTasks.reduce((a,e)=>Math.max(a,e.duration),0),
                topLongTasks:longTasks.sort((a,b)=>b.duration-a.duration).slice(0,8),
                transferSize:nav?.transferSize||0,
                encodedBodySize:nav?.encodedBodySize||0,
                bodyTextLength:document.body?.innerText?.length||0
              };
            });
            await context.close();
            return {label,domContentLoadedMs,runtimeTitleMs,usableUiMs,finalAuditMs,errors,metrics};
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const loader=await measure(browser,'','loader');
            const statik=await measure(browser,'static-probe.html','static');
            const comparison={
              usableUiImprovementMs:loader.usableUiMs-statik.usableUiMs,
              usableUiImprovementPct:Number((100*(loader.usableUiMs-statik.usableUiMs)/loader.usableUiMs).toFixed(2)),
              finalAuditImprovementMs:loader.finalAuditMs-statik.finalAuditMs,
              longestTaskImprovementMs:loader.metrics.longestLongTaskMs-statik.metrics.longestLongTaskMs
            };
            console.log(JSON.stringify({loader,static:statik,comparison},null,2));
            if(loader.errors.length||statik.errors.length) throw new Error('Browser errors detected');
            if(loader.metrics.finalAudit?.status!=='PASS'||statik.metrics.finalAudit?.status!=='PASS') throw new Error('Final audit not PASS');
            await browser.close();
          })().catch(e=>{console.error('::error title=Static runtime benchmark::'+String(e.message||e));process.exit(1);});
          EOF
          node benchmark.js
