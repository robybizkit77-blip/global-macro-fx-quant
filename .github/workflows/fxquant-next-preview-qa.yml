name: FX Quant NEXT isolated design and interaction QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/fx-quant-v2/next/**'
      - 'validation/qa_fxquant_next.cjs'
      - 'validation/qa_next_research_coherence_v1.cjs'
      - '.github/workflows/fxquant-next-preview-qa.yml'
      - '.github/workflows/fx-quant-next-research-coherence.yml'
  push:
    branches: [main]
    paths:
      - 'site/fx-quant-v2/next/**'
      - 'validation/qa_fxquant_next.cjs'
      - 'validation/build_fxquant_next_offline.py'
      - '.github/workflows/fxquant-next-preview-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('fxquant-next-preview-qa-pr-{0}', github.event.pull_request.number) || 'fxquant-next-preview-qa-main' }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local reference-data web server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/fxquant-next-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/site/fx-quant-v2/next/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: QA nine research routes and click-to-open FX dossiers on desktop/mobile
        run: node validation/qa_fxquant_next.cjs
      - name: Package the real site as one offline-review HTML
        run: python3 validation/build_fxquant_next_offline.py
      - name: Deliver standalone HTML review build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fxquant-next-offline-review
          path: fxquant-next-offline/FX_Quant_NEXT_Anteprima_Offline.html
          if-no-files-found: warn
          retention-days: 14
      - name: Retain current pair-journey screenshots and functional receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fxquant-next-browser-proof
          path: fxquant-next-browser-evidence/
          if-no-files-found: warn
          retention-days: 14
