name: Eurostat Vintage Schema Probe

on:
  push:
    branches:
      - engine-freeze-v1-2026-10-02
    paths:
      - 'validation/probe_eurostat_vintage_schema.py'
      - '.github/workflows/eurostat-vintage-schema-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engine-freeze-v1-2026-10-02
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe exact Eurostat vintage dimensions
        run: python validation/probe_eurostat_vintage_schema.py
      - name: Commit schema probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/pit_batch/eurostat/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Probe Eurostat vintage dataset schemas"
            git push origin HEAD:engine-freeze-v1-2026-10-02
          fi
