name: JPY Reaction Function Replay V1
on:
  push:
    branches:
      - audit-jpy-reaction-runner-v1-2026-10-06
    paths:
      - 'validation/run_jpy_reaction_function_replay_v1.py'
      - 'validation/JPY_REACTION_FUNCTION_V1_SPEC_2026-10-06.json'
      - 'history/pit_v1/**JPY**'
      - '.github/workflows/jpy-reaction-function-replay-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-jpy-reaction-runner-v1-2026-10-06
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen JPY reaction replay gate
        run: python validation/run_jpy_reaction_function_replay_v1.py
      - name: Strict engine live OOS guard
        run: |
          git diff --exit-code HEAD -- engine live_data validation/CANONICAL_ENGINE_OOS_T0_V3_2026-10-01.json
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/JPY_REACTION_FUNCTION_REPLAY_V1_2026-10-06.json
          if git diff --cached --quiet; then
            echo 'No evidence change'
          else
            git commit -m 'Record JPY reaction function replay evidence'
            git push
          fi
