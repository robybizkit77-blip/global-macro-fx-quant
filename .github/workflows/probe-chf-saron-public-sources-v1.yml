name: Probe CHF SARON Public Sources V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/probe-chf-saron-public-sources-v1.yml'
      - 'validation/cb_pricing/probe_chf_saron_public_sources_v1.py'
      - 'validation/cb_pricing/test_probe_chf_saron_public_sources_v1.py'
      - 'validation/cb_pricing/OIS_SOURCE_ACCESS_PLAN_V1_2026-10-19.json'
      - 'validation/cb_pricing/CHF_SIX_SARON_HISTORICAL_CONTEXT_SOURCE_CONTRACT_V1_2026-10-20.json'
      - 'validation/cb_pricing/audit_chf_six_saron_context_v1.py'
      - 'validation/cb_pricing/test_audit_chf_six_saron_context_v1.py'
      - 'validation/cb_pricing/CHF_SIX_SARON_SOURCE_LICENSE_REVIEW_2026-10-20.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chf-saron-source-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe-chf:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test exchange identity and fail-closed quote boundaries
        run: python validation/cb_pricing/test_probe_chf_saron_public_sources_v1.py

      - name: Test official SIX historical-context semantics and license barriers
        run: |
          set -euo pipefail
          python -m unittest validation.cb_pricing.test_audit_chf_six_saron_context_v1 -v
          python -m validation.cb_pricing.audit_chf_six_saron_context_v1 --out /tmp/chf-six-saron-context-audit.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/chf-six-saron-context-audit.json'))
          assert d['status']=='PASS_SOURCE_SEMANTICS__WITHHELD_LICENSE_AND_FETCH'
          assert len(d['authoritative_symbols'])==4
          for key in ('forward_policy_curve_available','ois_forward_level_available',
                      'policy_repricing_1d_1w_available','official_chf_ois_promotion_eligible',
                      'derived_data_rights_certified','automated_ingestion_authorized',
                      'numeric_source_pit_snapshot_certified','safe_to_update_live_ois',
                      'safe_to_change_control_room','writes_live_data'):
              assert d[key] is False, key
          assert d['published_market_rates'] is None
          print('SIX_SARON_CONTEXT_GOVERNANCE_PASS_WITHHELD')
          PY

      - name: Probe ICE SA3 and current Eurex FSR3 official product pages
        run: |
          python validation/cb_pricing/probe_chf_saron_public_sources_v1.py \
            --output /tmp/chf-saron-source-proof.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Enforce no market-price or repository mutation
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          python - <<'PY'
          import json
          a=json.load(open('/tmp/chf-saron-source-proof.json'))
          assert a['status'] in {'CONTRACT_IDENTITIES_VISIBLE_BUT_EOD_HISTORY_NOT_CERTIFIED','CONTRACT_IDENTITY_OR_ACCESS_INCOMPLETE'}
          assert a['legacy_eurex_contract_status']=='DISCONTINUED_2021'
          assert a['current_eurex_code']=='FSR3'
          assert a['ice_code']=='SA3'
          assert a['ice_and_eurex_are_interchangeable'] is False
          assert a['historical_same_contracts_T_T1_T5_proven'] is False
          assert a['redistribution_rights_or_subscription_certified'] is False
          assert a['market_prices_captured_or_exported'] is False
          assert a['operational_status_promotion_allowed'] is False
          assert a['official_ois_data_mutation_allowed'] is False
          assert len(a['source_checks'])==2
          print('CHF_SARON_SOURCE_PROBE_ZERO_MUTATION_PASS')
          PY

      - name: Attach source availability evidence
        uses: actions/upload-artifact@v4
        with:
          name: chf-saron-readonly-source-proof
          path: |
            /tmp/chf-saron-source-proof.json
            /tmp/chf-six-saron-context-audit.json
          if-no-files-found: error
