name: Liquidity JPY M3 Persistent Daily V1
# Candidate receipts bind every permitted BOJ revision to its old runtime value.
# PR synchronization also exercises the validation-branch runtime-restore guard.

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/liquidity-jpy-m3-persistent-daily-v1.yml
      - validation/fetch_boj_jpy_m3_exact_candidate.py
      - validation/apply_boj_jpy_m3_exact_candidate.py
      - validation/check_liquidity_remaining_blockers_v1.py
      - live_data/sections/NATIVE_LIQ_DATA.json
  push:
    branches:
      - main
    paths:
      - .github/workflows/liquidity-jpy-m3-persistent-daily-v1.yml
      - validation/fetch_boj_jpy_m3_exact_candidate.py
      - validation/apply_boj_jpy_m3_exact_candidate.py
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1-5'
    - cron: '0 1 * * 1-5'
    - cron: '30 0 * * 1-5'
    - cron: '30 1 * * 1-5'

permissions:
  contents: write

concurrency:
  group: liquidity-jpy-m3-persistent-daily-v1
  cancel-in-progress: false

jobs:
  persist-jpy-m3:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rome schedule gate
        id: gate
        shell: bash
        run: |
          hhmm="$(TZ=Europe/Rome date +'%H:%M')"
          if [[ "${{ github.event_name }}" != schedule || " 02:00 02:30 " == *" $hhmm "* ]]; then
            echo should_run=true >> "$GITHUB_OUTPUT"
          else
            echo should_run=false >> "$GITHUB_OUTPUT"
          fi
      - name: Snapshot baseline and withholding contract
        if: steps.gate.outputs.should_run == 'true'
        run: |
          mkdir -p /tmp/jpy-m3
          git rev-parse HEAD > /tmp/jpy-m3/base-sha
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/jpy-m3/before.json
          python validation/check_liquidity_remaining_blockers_v1.py > /tmp/jpy-m3/withheld-before.json
      - name: Fetch official revision-aware BOJ candidate
        id: candidate
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python validation/fetch_boj_jpy_m3_exact_candidate.py --out /tmp/jpy-m3/candidate.json | tee /tmp/jpy-m3/fetch.json
          python - <<'PY'
          import json
          c=json.load(open('/tmp/jpy-m3/candidate.json'))
          assert c['schema']=='GMFQ_LIQUIDITY_JPY_M3_REVISION_AWARE_CANDIDATE_V1',c
          if c['status']=='GREEN_REVISION_AWARE_CANDIDATE':
              assert c['revision_window']['months']==3,c
              assert all(c['revision_window']['start_date']<=x['date']<=c['revision_window']['end_date'] for x in c['revised_observations']),c
          else: assert c['status'] in {'WITHHELD_REVISION_OUTSIDE_WINDOW','WITHHELD_SOURCE_UNAVAILABLE'} and c['fail_closed'] is True,c
          PY
          STATUS="$(python -c "import json; c=json.load(open('/tmp/jpy-m3/candidate.json')); print('UPDATE_AVAILABLE' if c['status']=='GREEN_REVISION_AWARE_CANDIDATE' and c['candidate_update_available'] else ('NO_CHANGE' if c['status']=='GREEN_REVISION_AWARE_CANDIDATE' else c['status']))")"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
      - name: Apply exact JPY.money revision and append only
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'UPDATE_AVAILABLE'
        run: |
          python validation/apply_boj_jpy_m3_exact_candidate.py --candidate /tmp/jpy-m3/candidate.json > /tmp/jpy-m3/dry.json
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/jpy-m3/candidate-runtime.json
          python validation/apply_boj_jpy_m3_exact_candidate.py --candidate /tmp/jpy-m3/candidate.json --runtime /tmp/jpy-m3/candidate-runtime.json --apply > /tmp/jpy-m3/apply.json
          python validation/update_live_direct_section.py --section NATIVE_LIQ_DATA --replacement /tmp/jpy-m3/candidate-runtime.json --apply > /tmp/jpy-m3/direct-apply.json
      - name: Enforce exact scope, rebuild, roundtrip and blockers
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'UPDATE_AVAILABLE'
        run: |
          python - <<'PY'
          import json
          before=json.load(open('/tmp/jpy-m3/before.json')); after=json.load(open('live_data/sections/NATIVE_LIQ_DATA.json')); receipt=json.load(open('/tmp/jpy-m3/apply.json'))
          assert receipt['revised_months'] or receipt['appended_months'], receipt
          for ccy in before:
              if ccy!='JPY': assert before[ccy]==after[ccy]
          assert {k:before['JPY'][k] for k in before['JPY'] if k!='money'}=={k:after['JPY'][k] for k in after['JPY'] if k!='money'}
          print('JPY_M3_REVISION_AND_APPEND_EXACT_SCOPE_PASS')
          PY
          python validation/build_live_manifest_v2.py --write live_data/manifest.v2.json
          python validation/check_live_update_contract.py
          python validation/rebuild_live_data_runtime.py --verify-only
          python validation/check_liquidity_remaining_blockers_v1.py > /tmp/jpy-m3/withheld-after.json
          python - <<'PY'
          import json,subprocess
          w=json.load(open('/tmp/jpy-m3/withheld-after.json'))
          assert w['exact_blockers']==['CHF.liquidity','CHF.credit','JPY.liquidity'] and (w['ready'],w['withheld'],w['total'])==(23,3,26),w
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed=={'live_data/sections/NATIVE_LIQ_DATA.json','live_data/manifest.v2.json','payload/part-00.txt'},changed
          PY
      - name: Validate no-change identity
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status != 'UPDATE_AVAILABLE'
        run: |
          python validation/check_live_update_contract.py
          python validation/rebuild_live_data_runtime.py --verify-only
          python validation/check_liquidity_remaining_blockers_v1.py
          git diff --exit-code -- live_data payload
      - name: Validation branch restores runtime
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'UPDATE_AVAILABLE' && github.ref != 'refs/heads/main'
        run: |
          git restore --source=HEAD --worktree -- live_data payload
          git diff --exit-code -- live_data payload
      - name: Persist to main with remote-head lease
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'UPDATE_AVAILABLE' && github.ref == 'refs/heads/main'
        run: |
          BASE="$(cat /tmp/jpy-m3/base-sha)"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$BASE" || { echo 'main moved during JPY M3 refresh' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- live_data/sections/NATIVE_LIQ_DATA.json live_data/manifest.v2.json payload/part-00.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh JPY M3 liquidity runtime from Bank of Japan revisions'
          git push --force-with-lease=refs/heads/main:$BASE origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.should_run == 'true'
        with:
          name: liquidity-jpy-m3-persistent-${{ github.run_id }}
          path: /tmp/jpy-m3/
          if-no-files-found: warn
          retention-days: 30
