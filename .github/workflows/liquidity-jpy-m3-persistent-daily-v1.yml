name: Liquidity JPY M3 Persistent Daily V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/liquidity-jpy-m3-persistent-daily-v1.yml'
      - 'validation/fetch_boj_jpy_m3_exact_candidate.py'
      - 'validation/apply_boj_jpy_m3_exact_candidate.py'
      - 'validation/check_liquidity_remaining_blockers_v1.py'
      - 'validation/liquidity/JPY_M3_PROVENANCE_RESOLUTION_2026-10-13.json'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/liquidity-jpy-m3-persistent-daily-v1.yml'
  workflow_dispatch:
  schedule:
    # BOJ monthly money-stock releases are normally published at 08:50 JST.
    # Retry after 02:00 Europe/Rome; duplicate UTC entries cover CET/CEST.
    - cron: '0 0 * * 1-5'
    - cron: '0 1 * * 1-5'
    - cron: '30 0 * * 1-5'
    - cron: '30 1 * * 1-5'

permissions:
  contents: write

concurrency:
  group: liquidity-jpy-m3-persistent-daily-v1
  cancel-in-progress: false

jobs:
  persist-jpy-m3:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Rome schedule gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          hhmm="$(TZ=Europe/Rome date +'%H:%M')"
          allowed='02:00 02:30'
          if [[ "${{ github.event_name }}" != "schedule" || " $allowed " == *" $hhmm "* ]]; then
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
          fi
          echo "event=${{ github.event_name }} rome_time=$hhmm"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.should_run == 'true'
        with:
          python-version: '3.12'

      - name: Snapshot exact baseline and withholding contract
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/liquidity-jpy-m3-persistent
          git rev-parse HEAD > /tmp/liquidity-jpy-m3-persistent/base-sha
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/liquidity-jpy-m3-persistent/NATIVE_LIQ_DATA.before.json
          python validation/check_liquidity_remaining_blockers_v1.py > /tmp/liquidity-jpy-m3-persistent/withheld-before.json

      - name: Fetch exact official BOJ M3 candidate
        id: candidate
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python validation/fetch_boj_jpy_m3_exact_candidate.py \
            --out /tmp/liquidity-jpy-m3-persistent/candidate.json \
            | tee /tmp/liquidity-jpy-m3-persistent/fetch.json
          python - <<'PY'
          import json
          c=json.load(open('/tmp/liquidity-jpy-m3-persistent/candidate.json'))
          assert c['schema']=='GMFQ_LIQUIDITY_JPY_M3_EXACT_CANDIDATE_V1', c
          s=c['source']
          assert (s['publisher'],s['database'],s['series_id'],s['frequency']) == ('Bank of Japan','MD02','MAM1XAM3M3MO','MONTHLY'), s
          assert s['seasonal_adjustment']=='Seasonally Adjusted', s
          if c['status']=='GREEN_SOURCE_CANDIDATE_ONLY':
              assert c['runtime_match_confirmed'] is True, c
              assert c['runtime_history_unchanged_by_current_vintage'] is True, c
              assert c['runtime_exact_match_count']==c['runtime_overlap_count']>=128, c
              assert c['runtime_exact_match_ratio']==1.0, c
              print('JPY_M3_EXACT_CANDIDATE_PASS')
          else:
              assert c['status']=='WITHHELD_HISTORY_REVISION', c
              assert c['fail_closed'] is True and c['candidate_update_available'] is False, c
              assert c['runtime_mutated'] is False and c['publication_performed'] is False, c
              assert c['history_revision_detected'] is True and c['history_revision_mismatches'], c
              print('JPY_M3_HISTORY_REVISION_VETO_PASS')
          PY
          STATUS="$(python -c "import json; c=json.load(open('/tmp/liquidity-jpy-m3-persistent/candidate.json')); print('UPDATE_AVAILABLE' if c['status']=='GREEN_SOURCE_CANDIDATE_ONLY' and c['candidate_update_available'] else ('NO_CHANGE' if c['status']=='GREEN_SOURCE_CANDIDATE_ONLY' else c['status']))")"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          git diff --exit-code -- live_data payload

      - name: Dry-run and apply only the validated JPY M3 append
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'UPDATE_AVAILABLE'
        shell: bash
        run: |
          set -euo pipefail
          python validation/apply_boj_jpy_m3_exact_candidate.py \
            --candidate /tmp/liquidity-jpy-m3-persistent/candidate.json \
            > /tmp/liquidity-jpy-m3-persistent/dry-run.json
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/liquidity-jpy-m3-persistent/NATIVE_LIQ_DATA.candidate.json
          python validation/apply_boj_jpy_m3_exact_candidate.py \
            --candidate /tmp/liquidity-jpy-m3-persistent/candidate.json \
            --runtime /tmp/liquidity-jpy-m3-persistent/NATIVE_LIQ_DATA.candidate.json --apply \
            > /tmp/liquidity-jpy-m3-persistent/apply.json
          python validation/update_live_direct_section.py \
            --section NATIVE_LIQ_DATA \
            --replacement /tmp/liquidity-jpy-m3-persistent/NATIVE_LIQ_DATA.candidate.json --apply \
            > /tmp/liquidity-jpy-m3-persistent/direct-apply.json

      - name: Enforce append-only exact scope and rebuild runtime contract
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'UPDATE_AVAILABLE'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          before=json.load(open('/tmp/liquidity-jpy-m3-persistent/NATIVE_LIQ_DATA.before.json'))
          after=json.load(open('live_data/sections/NATIVE_LIQ_DATA.json'))
          candidate=json.load(open('/tmp/liquidity-jpy-m3-persistent/candidate.json'))
          receipt=json.load(open('/tmp/liquidity-jpy-m3-persistent/apply.json'))
          assert receipt['status']=='UPDATE_AVAILABLE' and receipt['applied'] is True, receipt
          assert before.keys()==after.keys()
          for ccy in before:
              if ccy != 'JPY': assert before[ccy]==after[ccy], ccy
          old=before['JPY']; new=after['JPY']
          assert set(old)==set(new) and {k:old[k] for k in old if k!='money'}=={k:new[k] for k in new if k!='money'}
          o=old['money']; n=new['money']; count=len(o['dates'])
          assert n['dates'][:count]==o['dates'] and n['values'][:count]==o['values']
          assert len(n['dates'])==len(n['values'])==count+receipt['appended_observations']
          assert n['last_date']==candidate['latest_date'] and float(n['last_value'])==float(candidate['latest_value'])
          print('JPY_M3_APPEND_ONLY_EXACT_SCOPE_PASS')
          PY
          python validation/build_live_manifest_v2.py --write live_data/manifest.v2.json > /tmp/liquidity-jpy-m3-persistent/manifest.json
          python validation/check_live_update_contract.py > /tmp/liquidity-jpy-m3-persistent/live-contract.json
          python validation/rebuild_live_data_runtime.py --verify-only > /tmp/liquidity-jpy-m3-persistent/runtime-roundtrip.json
          python validation/check_liquidity_remaining_blockers_v1.py > /tmp/liquidity-jpy-m3-persistent/withheld-after.json
          python - <<'PY'
          import json, subprocess
          contract=json.load(open('/tmp/liquidity-jpy-m3-persistent/live-contract.json'))
          roundtrip=json.load(open('/tmp/liquidity-jpy-m3-persistent/runtime-roundtrip.json'))
          withheld=json.load(open('/tmp/liquidity-jpy-m3-persistent/withheld-after.json'))
          assert contract['status']=='PASS', contract
          assert roundtrip['status']=='PASS' and roundtrip['noop_roundtrip_byte_identical'] is True, roundtrip
          assert withheld['exact_blockers']==['CHF.liquidity','CHF.credit','JPY.liquidity'], withheld
          assert (withheld['ready'],withheld['withheld'],withheld['total'])==(23,3,26), withheld
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={'live_data/sections/NATIVE_LIQ_DATA.json','live_data/manifest.v2.json','payload/part-00.txt'}
          assert changed==allowed, (changed,allowed)
          print('JPY_M3_LIVE_CONTRACT_ROUNDTRIP_SCOPE_AND_WITHHELD_PASS')
          PY

      - name: Validate no-change identity
        if: steps.gate.outputs.should_run == 'true' && (steps.candidate.outputs.status == 'NO_CHANGE' || steps.candidate.outputs.status == 'WITHHELD_HISTORY_REVISION')
        shell: bash
        run: |
          set -euo pipefail
          python validation/check_live_update_contract.py > /tmp/liquidity-jpy-m3-persistent/live-contract.json
          python validation/rebuild_live_data_runtime.py --verify-only > /tmp/liquidity-jpy-m3-persistent/runtime-roundtrip.json
          python validation/check_liquidity_remaining_blockers_v1.py > /tmp/liquidity-jpy-m3-persistent/withheld-after.json
          git diff --exit-code -- live_data payload
          echo JPY_M3_PERSISTENT_NO_MUTATION_IDENTITY_PASS

      - name: Validation branch restores runtime
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'UPDATE_AVAILABLE' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --worktree -- live_data payload
          git diff --exit-code -- live_data payload
          echo JPY_M3_PERSISTENT_VALIDATION_ONLY_RESTORE_PASS

      - name: Commit validated JPY M3 update to main with remote-head lease
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'UPDATE_AVAILABLE' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(cat /tmp/liquidity-jpy-m3-persistent/base-sha)"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$BASE" || { echo 'main moved during JPY M3 refresh' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- live_data/sections/NATIVE_LIQ_DATA.json live_data/manifest.v2.json payload/part-00.txt
          git diff --cached --quiet && { echo 'No JPY M3 change to persist'; exit 0; }
          git commit -m 'Refresh JPY M3 liquidity runtime from Bank of Japan'
          git push --force-with-lease=refs/heads/main:$BASE origin HEAD:main
          echo JPY_M3_PERSISTENT_MAIN_UPDATE_PUSHED

      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.should_run == 'true'
        with:
          name: liquidity-jpy-m3-persistent-${{ github.run_id }}
          path: /tmp/liquidity-jpy-m3-persistent/
          if-no-files-found: warn
          retention-days: 30
