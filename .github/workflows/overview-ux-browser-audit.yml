name: Overview UX Browser Audit

on:
  push:
    branches:
      - staging-overview-ux-v490-2026-09-30

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright package
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/gmfq-server.log 2>&1 &
          sleep 2
      - name: Verify overview UX and runtime
        run: |
          cat > overview-audit.js <<'EOF'
          const { chromium } = require('playwright');
          const { execSync } = require('child_process');
          (async()=>{
            const chromePath=execSync('command -v google-chrome-stable || command -v google-chrome || command -v chromium').toString().trim();
            const browser=await chromium.launch({headless:true,executablePath:chromePath,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            const consoleErrors=[],pageErrors=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            const res=await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle',timeout:120000});
            if(!res?.ok()) throw new Error('HTTP load failed');
            await page.waitForFunction(()=>document.documentElement.getAttribute('data-post-gate-final-audit'),null,{timeout:120000});
            if(typeof page.evaluate==='function') await page.evaluate(()=>window.showView?.('overview'));
            await page.waitForSelector('.gmfqOverviewExecutive .gmfqExecCard',{timeout:30000});
            const x=await page.evaluate(()=>{
              const cards=[...document.querySelectorAll('.gmfqOverviewExecutive .gmfqExecCard')].map(el=>el.innerText);
              const grid=document.querySelector('.v302OverviewGrid');
              return {
                finalAudit:window.GMFQ_POST_GATE_FINAL_AUDIT||null,
                cardCount:cards.length,
                cards,
                gridCards:grid?[...grid.querySelectorAll('.v302OCard')].length:0,
                bodyTextLength:document.body?.innerText?.length||0,
                ois:Object.fromEntries(['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'].map(c=>[c,window.GMFQ_OIS?.currency?.(c)?.status||'WITHHELD']))
              };
            });
            console.log(JSON.stringify({x,consoleErrors,pageErrors},null,2));
            if(x.finalAudit?.status!=='PASS') throw new Error('Final audit '+JSON.stringify(x.finalAudit));
            if(x.cardCount!==4) throw new Error('Expected 4 executive cards, got '+x.cardCount);
            if(x.gridCards!==8) throw new Error('Expected 8 currency cards below, got '+x.gridCards);
            for(const label of ['STA MIGLIORANDO','STA PEGGIORANDO','POSSIBILE SVOLTA','SEPARAZIONE STRUTTURALE']){
              if(!x.cards.join('\n').toUpperCase().includes(label)) throw new Error('Missing '+label);
            }
            const expected={USD:'WITHHELD',EUR:'ACTIVE',GBP:'ACTIVE',JPY:'ACTIVE',CHF:'WITHHELD',CAD:'ACTIVE',AUD:'ACTIVE',NZD:'WITHHELD'};
            for(const [k,v] of Object.entries(expected)) if(x.ois[k]!==v) throw new Error('OIS regression '+k);
            const nonBenignConsole=consoleErrors.filter(e=>!String(e).includes('404')); if(nonBenignConsole.length||pageErrors.length) throw new Error('Browser errors '+JSON.stringify({nonBenignConsole,pageErrors,consoleErrors}));
            if(x.bodyTextLength<1000) throw new Error('Body too small');
            await page.screenshot({path:'overview-ux-audit.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node overview-audit.js
