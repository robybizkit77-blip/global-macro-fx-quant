name: EUR Eurex FST3 Controlled Activation Proof V1

on:
  push:
    branches:
      - validation-eur-eurex-fst3-price-report-probe-v1-2026-10-15
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build official EUR source snapshot and activation candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/cb_pricing/collect_eur_eurex_fst3.py --as-of 2026-10-14 --output /tmp/eur.snapshot.json
          python3 validation/cb_pricing/build_eur_eurex_fst3_candidate.py --snapshot /tmp/eur.snapshot.json --output /tmp/eur.candidate.json
          python3 - <<'PY'
          import json
          s=json.load(open('/tmp/eur.snapshot.json')); c=json.load(open('/tmp/eur.candidate.json'))
          assert c['status']=='READY_FOR_CONTROLLED_ACTIVATION_PROOF'
          assert c['policy_rate']==2.5
          assert c['meeting_path'][0]['date']=='2026-10-29'
          assert c['horizons']['3m']['policy_delta_bp']==21.75
          assert c['horizons']['6m']['policy_delta_bp']==48.75
          assert c['horizons']['12m']['policy_delta_bp']==70.75
          assert c['change_direction_1d']=='DOWN'
          assert c['change_direction_1w']=='UP'
          print('EUR_CANDIDATE_CONTRACT_PASS')
          PY
      - name: Controlled EUR-only dry-run apply
        shell: bash
        run: |
          set -euo pipefail
          cp live_data/sections/OIS_DATA.json /tmp/OIS.before.json
          cp live_data/sections/NATIVE_CB_DATA.json /tmp/NATIVE.before.json
          cp payload/part-00.txt /tmp/part-00.before.txt
          cp live_data/manifest.v2.json /tmp/manifest.before.json
          python3 validation/cb_pricing/apply_eur_eurex_fst3_candidate.py --candidate /tmp/eur.candidate.json
          python3 validation/build_live_manifest_v2.py --write live_data/manifest.v2.json >/tmp/manifest-build.json
          python3 validation/check_live_update_contract.py >/tmp/live-contract-check.json
          python3 validation/rebuild_live_data_runtime.py --verify-only >/tmp/runtime-roundtrip.json
          python3 - <<'PY'
          import json,pathlib,subprocess
          bo=json.loads(pathlib.Path('/tmp/OIS.before.json').read_text()); ao=json.loads(pathlib.Path('live_data/sections/OIS_DATA.json').read_text())
          bn=json.loads(pathlib.Path('/tmp/NATIVE.before.json').read_text()); an=json.loads(pathlib.Path('live_data/sections/NATIVE_CB_DATA.json').read_text())
          co=[k for k in bo['currencies'] if bo['currencies'][k]!=ao['currencies'][k]]; cn=[k for k in bn if bn[k]!=an[k]]
          if co!=['EUR'] or cn!=['EUR']: raise SystemExit(f'bad semantic scope OIS={co} NATIVE={cn}')
          changed=sorted(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected=sorted(['live_data/manifest.v2.json','live_data/sections/NATIVE_CB_DATA.json','live_data/sections/OIS_DATA.json','payload/part-00.txt'])
          if changed!=expected: raise SystemExit(f'bad file scope {changed}')
          c=json.loads(pathlib.Path('/tmp/eur.candidate.json').read_text())
          e=ao['currencies']['EUR']
          if e['status']!='ACTIVE' or e['as_of']!=c['as_of']: raise SystemExit('EUR dry-run runtime activation mismatch')
          if e['source_meta']['contract_mapping']!=c['contract_mapping']: raise SystemExit('EUR contract mapping missing')
          print(json.dumps({'status':'EUR_CONTROLLED_DRY_RUN_PASS','semantic_scope':co,'file_scope':expected,'as_of':c['as_of']},indent=2))
          PY
      - name: Restore tracked runtime and prove no publication
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- live_data/manifest.v2.json live_data/sections/OIS_DATA.json live_data/sections/NATIVE_CB_DATA.json payload/part-00.txt || true
          if ! git diff --quiet; then git status --short; exit 1; fi
          echo EUR_CONTROLLED_DRY_RUN_RESTORED_NO_PUBLICATION
      - name: Upload activation evidence
        uses: actions/upload-artifact@v4
        with:
          name: eur-eurex-fst3-controlled-activation-proof
          path: |
            /tmp/eur.snapshot.json
            /tmp/eur.candidate.json
            /tmp/manifest-build.json
            /tmp/live-contract-check.json
            /tmp/runtime-roundtrip.json
          if-no-files-found: error
          retention-days: 30
