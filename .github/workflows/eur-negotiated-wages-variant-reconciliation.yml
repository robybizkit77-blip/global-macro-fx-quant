name: EUR Negotiated Wages Variant Reconciliation

on:
  workflow_dispatch:
  push:
    branches: [engine-freeze-v1-2026-10-02]
    paths:
      - validation/reconcile_eur_negotiated_wages_variants.py
      - .github/workflows/eur-negotiated-wages-variant-reconciliation.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engine-freeze-v1-2026-10-02
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare ECB INW variants to runtime
        run: python validation/reconcile_eur_negotiated_wages_variants.py
      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/pit_batch/ecb/EUR_NEGOTIATED_WAGES_VARIANT_RECONCILIATION_V1_2026-10-02.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Reconcile EUR negotiated wages ECB variants"
            git pull --rebase origin engine-freeze-v1-2026-10-02
            git push origin HEAD:engine-freeze-v1-2026-10-02
          fi
