name: Structured Vintage Bulk Extract

on:
  workflow_dispatch:
  push:
    branches: [engine-freeze-v1-2026-10-02]
    paths:
      - validation/extract_structured_vintages.py
      - .github/workflows/structured-vintage-bulk-extract.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engine-freeze-v1-2026-10-02
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas
      - name: Extract structured official vintages
        run: python validation/extract_structured_vintages.py
      - name: Commit extracted candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/raw_structured
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Extract structured CAD vintage candidates"
            git pull --rebase origin engine-freeze-v1-2026-10-02
            git push origin HEAD:engine-freeze-v1-2026-10-02
          fi
