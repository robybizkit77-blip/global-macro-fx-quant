name: Diagnostic Inflation Labour Structure V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnostic-inflationlabour-structure-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start dashboard
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/inflationlabour-structure-server.log 2>&1 &
          sleep 2
      - name: Audit Inflation Labour DOM structure
        run: |
          cat > inflationlabour-structure.js <<'EOF'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>window.GMFQ_PREMIUM_SHELL?.status==='ACTIVE'&&window.GMFQ_PRODUCT_LANGUAGE?.status==='ACTIVE',null,{timeout:120000});
            await page.evaluate(()=>window.showView?.('inflationlabour'));
            await page.waitForTimeout(800);
            const out=await page.evaluate(()=>{
              const root=document.getElementById('inflationlabour');
              const clean=x=>String(x||'').replace(/\s+/g,' ').trim();
              const sig=el=>{const r=el.getBoundingClientRect();const s=getComputedStyle(el);return {tag:el.tagName.toLowerCase(),id:el.id||null,className:typeof el.className==='string'?el.className:null,text:clean(el.innerText).slice(0,220),h:Math.round(r.height),w:Math.round(r.width),display:s.display,gridTemplateColumns:s.gridTemplateColumns,overflowX:s.overflowX};};
              const direct=[...root.children].map(sig);
              const nodes=[...root.querySelectorAll('section,article,.card,[class*="Card"],[class*="card"],[class*="Grid"],[class*="grid"],table')].filter(el=>el.offsetParent!==null).map(sig).slice(0,100);
              const headings=[...root.querySelectorAll('h1,h2,h3,h4')].filter(el=>el.offsetParent!==null).map(el=>({heading:clean(el.innerText),parent:sig(el.parentElement)}));
              const cards=[...root.querySelectorAll('[data-c], [data-ccy]')].filter(el=>el.offsetParent!==null).map(sig).slice(0,40);
              return {schema:'GMFQ_INFLATIONLABOUR_STRUCTURE_DIAGNOSTIC_V1',root:sig(root),direct,nodes,headings,cards};
            });
            console.log(JSON.stringify(out,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node inflationlabour-structure.js
