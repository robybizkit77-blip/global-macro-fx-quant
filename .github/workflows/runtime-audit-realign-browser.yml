name: Runtime Audit Realign Browser

on:
  push:
    branches:
      - staging-runtime-audit-realign-2026-09-30
  workflow_dispatch:

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright package
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/gmfq-server.log 2>&1 &
          sleep 2
      - name: Verify post-gate audit synchronization
        run: |
          cat > browser-audit.js <<'EOF'
          const { chromium } = require('playwright');
          const { execSync } = require('child_process');
          (async()=>{
            const chromePath=execSync('command -v google-chrome-stable || command -v google-chrome || command -v chromium').toString().trim();
            const browser=await chromium.launch({headless:true,executablePath:chromePath,args:['--no-sandbox']});
            const page=await browser.newPage();
            const consoleErrors=[], pageErrors=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            const res=await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle',timeout:120000});
            if(!res?.ok()) throw new Error('HTTP load failed');
            await page.waitForFunction(()=>document.documentElement.getAttribute('data-runtime-audit-realign'),null,{timeout:120000});
            const x=await page.evaluate(()=>({
              finalAudit:window.GMFQ_POST_GATE_FINAL_AUDIT||null,
              fullAudit:window.GMFQ_FULL_SYSTEM_AUDIT||null,
              realign:window.GMFQ_RUNTIME_AUDIT_REALIGN||null
            }));
            console.log(JSON.stringify({x,consoleErrors,pageErrors},null,2));
            if(x.finalAudit?.status!=='PASS') throw new Error('Final audit not PASS');
            if(x.realign?.status!=='PASS') throw new Error('Realign not PASS');
            const a=JSON.stringify(x.finalAudit?.ois||{});
            const b=JSON.stringify(x.fullAudit?.ois||{});
            if(a!==b) throw new Error('OIS audit mismatch '+a+' != '+b);
            if(x.fullAudit?.post_gate_sync!=='PASS') throw new Error('Full audit not synced');
            if(x.fullAudit?.source_audit?.cb_pricing?.AUD?.quality!=='COMPLETO_DIRECT_ASX_SETTLEMENT_HISTORY') throw new Error('AUD source audit stale');
            if(x.fullAudit?.source_audit?.cb_pricing?.JPY?.quality!=='COMPLETO_DIRECT_TFX_SETTLEMENT_HISTORY') throw new Error('JPY source audit stale');
            if(x.fullAudit?.source_audit?.cb_pricing?.EUR?.quality!=='COMPLETO_DIRECT_EXCHANGE_SETTLEMENT_HISTORY') throw new Error('EUR source audit stale');
            if(consoleErrors.length||pageErrors.length) throw new Error('Browser errors '+consoleErrors.concat(pageErrors).join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node browser-audit.js
