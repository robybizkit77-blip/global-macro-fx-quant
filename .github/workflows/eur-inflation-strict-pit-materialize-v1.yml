name: EUR Inflation Strict PIT Materialize V1

on:
  push:
    branches: ['validation-eur-inflation-strict-pit-v1-*']
    paths:
      - 'validation/materialize_eur_inflation_strict_pit_v1.py'
      - '.github/workflows/eur-inflation-strict-pit-materialize-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize-twice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently materialize Eurostat first-release flash chain twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/eur-inflation-strict/{a,b}
          python validation/materialize_eur_inflation_strict_pit_v1.py --csv /tmp/eur-inflation-strict/a/EUR_INFLATION_STRICT_FIRST_RELEASE_FLASH_2018_2026_09.csv --evidence /tmp/eur-inflation-strict/a/evidence.json
          python validation/materialize_eur_inflation_strict_pit_v1.py --csv /tmp/eur-inflation-strict/b/EUR_INFLATION_STRICT_FIRST_RELEASE_FLASH_2018_2026_09.csv --evidence /tmp/eur-inflation-strict/b/evidence.json
      - name: Enforce semantic equivalence and strict direct PIT invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path('/tmp/eur-inflation-strict')
          a=json.loads((root/'a/evidence.json').read_text()); b=json.loads((root/'b/evidence.json').read_text())
          assert a['status']==b['status']=='PASS'
          assert a['semantic_rowset_sha256']==b['semantic_rowset_sha256']
          assert a['coverage']==b['coverage']=={'start':'2018-01','end':'2026-09','expected_months':105,'materialized_months':105}
          rows=list(csv.DictReader((root/'a/EUR_INFLATION_STRICT_FIRST_RELEASE_FLASH_2018_2026_09.csv').open()))
          assert len(rows)==105 and rows[0]['reference_month']=='2018-01' and rows[-1]['reference_month']=='2026-09'
          assert all(r['pit_status']=='STRICT_FIRST_RELEASE_FLASH' and r['release_date'] and r['source_url'] and r['page_sha256'] for r in rows)
          assert len({r['page_sha256'] for r in rows})==105
          by={r['reference_month']:r for r in rows}
          anchors={'2018-01':('1.3','2018-01-31'),'2020-01':('1.4','2020-01-31'),'2026-08':('3.3','2026-09-01'),'2026-09':('3.8','2026-10-02')}
          for month,expected in anchors.items():
              r=by[month]; assert (r['headline_hicp_yoy_pct'],r['release_date'])==expected,(month,r)
          print(json.dumps({'status':'PASS','semantic_rowset_sha256':a['semantic_rowset_sha256'],'anchors':anchors},indent=2))
          PY
      - name: Enforce no repository writes
        run: git diff --exit-code
      - name: Upload source evidence and reproducible datasets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eur-inflation-strict-pit-v1-${{ github.run_id }}
          path: /tmp/eur-inflation-strict/
          if-no-files-found: error
          retention-days: 90
