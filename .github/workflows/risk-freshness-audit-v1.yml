name: Risk Freshness Audit V1

on:
  push:
    branches:
      - 'validation-risk-freshness-audit-v1-2026-10-12'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8142 --bind 127.0.0.1 >/tmp/gmfq-risk-freshness-audit-server.log 2>&1 &
          sleep 2
      - name: Simulate fail-closed risk freshness gate
        run: |
          cat > audit.js <<'EOF'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.stack||e)));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            const r=await page.goto('http://127.0.0.1:8142/index.html',{waitUntil:'domcontentloaded',timeout:120000});
            if(!r||!r.ok())throw new Error('HTTP load failed');
            await page.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.settled_after_cad_chain===true||window.__GMFQ_BOOTSTRAP_ERROR,null,{timeout:120000});
            await page.waitForTimeout(300);
            const out=await page.evaluate(()=>{
              const clone=x=>{try{return JSON.parse(JSON.stringify(x))}catch{return null}};
              const stable=x=>JSON.stringify(x);
              const businessLag=(from,to)=>{
                if(!from||!to)return null;
                let a=new Date(String(from).slice(0,10)+'T12:00:00Z'),b=new Date(String(to).slice(0,10)+'T12:00:00Z');
                if(!(a<b))return 0;
                let n=0; while(a<b){a.setUTCDate(a.getUTCDate()+1);const d=a.getUTCDay();if(d!==0&&d!==6)n++;} return n;
              };
              const riskDates={vix:D.risk?.VIX?.dates?.at(-1)||null,brent:D.risk?.Brent?.dates?.at(-1)||null,wti:D.risk?.WTI?.dates?.at(-1)||null,gold:D.risk?.Gold?.dates?.at(-1)||null,china:D.risk?.['China CLI']?.dates?.at(-1)||null};
              const priceAsOf=D.prices?.at(-1)?.Date||null;
              const lag={vix:businessLag(riskDates.vix,priceAsOf),brent:businessLag(riskDates.brent,priceAsOf)};
              const baselineRisk=clone(window.deriveGlobalRiskState?.());
              const pairs=(D?.pairs||[]).map(x=>x.pair);
              const before=Object.fromEntries(pairs.map(p=>[p,clone(window.derivePairDecisionFrame?.(p))]));
              const beforeSig=Object.fromEntries(Object.entries(before).map(([p,f])=>[p,{fav:f?.fav,quality:f?.quality,structural:f?.structural}]));
              const original=window.deriveGlobalRiskState;
              const guarded=function(){
                const base=original();
                const px=D.prices?.at(-1)?.Date||null;
                const vd=D.risk?.VIX?.dates?.at(-1)||null,bd=D.risk?.Brent?.dates?.at(-1)||null;
                const lv=businessLag(vd,px),lb=businessLag(bd,px);
                if(px && ((lv!=null&&lv>1)||(lb!=null&&lb>1))){
                  return {state:'WITHHELD',cls:'riskMixedTxt',detail:`snapshot rischio non abbastanza recente rispetto al Price ${px}`,driver:'Freshness gate',affected:[],vix:base?.vix??null,brent1m:base?.brent1m??null,china:base?.china??null,freshness:{price_asof:px,vix_asof:vd,brent_asof:bd,vix_business_lag:lv,brent_business_lag:lb,max_business_lag:1}};
                }
                return base;
              };
              window.deriveGlobalRiskState=guarded;
              try{deriveGlobalRiskState=guarded}catch(e){}
              if(typeof rebuildCanonicalState==='function')rebuildCanonicalState();
              const guardedRisk=clone(window.deriveGlobalRiskState());
              const canonical=clone(window.getCanonicalGlobalRisk?.());
              const after=Object.fromEntries(pairs.map(p=>[p,clone(window.derivePairDecisionFrame?.(p))]));
              const afterSig=Object.fromEntries(Object.entries(after).map(([p,f])=>[p,{fav:f?.fav,quality:f?.quality,structural:f?.structural}]));
              const overlaySample=clone(['EUR/USD','AUD/JPY','CAD/JPY'].map(p=>({p,html:window.pairRiskOverlay?.(p)})));
              return {riskDates,priceAsOf,lag,baselineRisk,guardedRisk,canonical,overlaySample,pairStructuralUnchanged:stable(beforeSig)===stable(afterSig),pairCount:pairs.length,isolation:clone(window.riskEventIsolationIntegrity?.()),bootstrapError:window.__GMFQ_BOOTSTRAP_ERROR||null};
            });
            await browser.close();
            if(out.bootstrapError)throw new Error(out.bootstrapError);
            if(errors.length)throw new Error('Browser errors: '+errors.join(' | '));
            const a={all28Pairs:out.pairCount===28,currentSnapshotActuallyStale:out.lag.vix>1&&out.lag.brent>1,guardReturnsWithheld:out.guardedRisk?.state==='WITHHELD',canonicalBecomesWithheld:out.canonical?.state==='WITHHELD',riskOverlaySuppressed:out.overlaySample.every(x=>!x.html),pairStructureUnchanged:out.pairStructuralUnchanged===true,isolationStillPasses:out.isolation?.ok===true};
            const ok=Object.values(a).every(Boolean);
            const summary={schema:'GMFQ_RISK_FRESHNESS_GATE_SIM_V1',status:ok?'PASS':'FAIL',assertions:a,...out};
            fs.writeFileSync('risk-freshness-audit.json',JSON.stringify(summary,null,2));
            console.log(JSON.stringify(summary,null,2));
            if(!ok)process.exit(2);
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: risk-freshness-audit-v1
          path: |
            risk-freshness-audit.json
            /tmp/gmfq-risk-freshness-audit-server.log
