name: One-off Oct27 production prebrief E2E retest - DELETE AFTER RUN
on:
  push:
    branches:
      - ops/one-shot-live-prebrief-retest-20261027
    paths:
      - '.github/workflows/one-shot-live-prebrief-retest-20261027.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-one-time-existing-orchestrator:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Dispatch already-existing production pipeline once, no duplicated collectors
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api --method POST -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${REPO}/actions/workflows/daily-data-orchestrator-v2.yml/dispatches" \
            -f ref=main -f 'inputs[phase]=prebrief' -F return_run_details=true)"
          echo "$response" | jq -e '{workflow_run_id,run_url,html_url}'
          id="$(echo "$response" | jq -er '.workflow_run_id | select(type=="number" and .>0)')"
          echo "### One-time production prebrief E2E: [run ${id}](https://github.com/${REPO}/actions/runs/${id})" >> "$GITHUB_STEP_SUMMARY"
          echo 'Verification: child workflows and publication must separately pass; dispatch is NOT a success claim.' >> "$GITHUB_STEP_SUMMARY"
