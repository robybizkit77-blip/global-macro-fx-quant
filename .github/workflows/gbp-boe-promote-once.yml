name: GBP BoE OIS Publish Once

on:
  push:
    branches:
      - validation-cb-pricing-gbp-2026-10-08
    paths:
      - .github/workflows/gbp-boe-promote-once.yml

permissions:
  contents: write

jobs:
  publish-gh-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          path: source-main
          persist-credentials: false

      - name: Checkout current gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public
          persist-credentials: true

      - name: Copy only certified runtime files from main
        shell: bash
        run: |
          cp source-main/live_data/manifest.v2.json public/live_data/manifest.v2.json
          cp source-main/live_data/sections/OIS_DATA.json public/live_data/sections/OIS_DATA.json
          cp source-main/live_data/sections/NATIVE_CB_DATA.json public/live_data/sections/NATIVE_CB_DATA.json
          cp source-main/payload/part-00.txt public/payload/part-00.txt

      - name: Verify public runtime contract and exact scope
        working-directory: public
        shell: bash
        run: |
          python3 validation/check_live_update_contract.py
          python3 validation/rebuild_live_data_runtime.py --verify-only
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          expected=$(printf '%s\n' \
            live_data/manifest.v2.json \
            live_data/sections/NATIVE_CB_DATA.json \
            live_data/sections/OIS_DATA.json \
            payload/part-00.txt | sort)
          actual=$(printf '%s\n' "${changed[@]}" | sort)
          test "$actual" = "$expected"
          cmp -s live_data/manifest.v2.json ../source-main/live_data/manifest.v2.json
          cmp -s live_data/sections/OIS_DATA.json ../source-main/live_data/sections/OIS_DATA.json
          cmp -s live_data/sections/NATIVE_CB_DATA.json ../source-main/live_data/sections/NATIVE_CB_DATA.json
          cmp -s payload/part-00.txt ../source-main/payload/part-00.txt
          echo GBP_GHPAGES_PARITY_PASS

      - name: Commit GBP runtime to gh-pages
        working-directory: public
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live_data/manifest.v2.json live_data/sections/OIS_DATA.json live_data/sections/NATIVE_CB_DATA.json payload/part-00.txt
          git commit -m 'Publish GBP SONIA OIS pricing runtime'
          git push origin HEAD:gh-pages
