name: BoE GBP Weekly Reserves Research Refresh V1

on:
  workflow_dispatch:
  schedule:
    # BoE Weekly Report: published Thursday for Wednesday close.
    - cron: '39 8 * * 4,5'
  push:
    branches: [main]
    paths:
      - 'validation/liquidity/refresh_boe_gbp_reserves_v1.py'
      - 'validation/liquidity/test_refresh_boe_gbp_reserves_v1.py'
      - '.github/workflows/boe-gbp-reserves-research-refresh-v1.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: boe-gbp-weekly-reserves-research-v1
  cancel-in-progress: false

jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify weekly BoE reserves, release dates, and no Core FX promotion
        run: python -m unittest validation.liquidity.test_refresh_boe_gbp_reserves_v1 -v
      - name: Snapshot G8 native liquidity and pair ranking before update
        run: |
          sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/boe-gbp-liq.before
          sha256sum live_data/sections/PAIR_SETUP_OPERATIONAL_VIEW.json > /tmp/boe-gbp-pairs.before
      - name: Fetch BoE official weekly reserve balances as separate research
        run: |
          python validation/liquidity/refresh_boe_gbp_reserves_v1.py \
            --apply --receipt /tmp/boe-gbp-reserves-receipt.json
          cat /tmp/boe-gbp-reserves-receipt.json >> "$GITHUB_STEP_SUMMARY"
      - name: Verify canonical G8 and FX untouched, only research sidecar changed
        run: |
          sha256sum -c /tmp/boe-gbp-liq.before /tmp/boe-gbp-pairs.before
          python - <<'PY'
          import subprocess
          allowed={'site/fx-quant-v2/next/gbp-boe-reserves-research-v1.js'}
          changes=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changes<=allowed,changes
          print('BOE_GBP_RESERVES_SIDE_CAR_ONLY_PASS',sorted(changes))
          PY
      - name: Save only BoE GBP reserve research sidecar to main
        run: |
          set -euo pipefail
          path=site/fx-quant-v2/next/gbp-boe-reserves-research-v1.js
          if git diff --quiet -- "$path"; then
            echo 'BOE_GBP_RESERVES_NO_CHANGE' >> "$GITHUB_STEP_SUMMARY"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- "$path"
            git commit -m 'Refresh BoE sterling reserve balances (research only)'
            git fetch origin main --no-tags
            git rebase origin/main
            git push origin HEAD:main
            echo 'BOE_GBP_RESERVES_RESEARCH_SAVED' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Mirror exact validated BoE research file to GitHub Pages with lease
        id: pages-sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=site/fx-quant-v2/next/gbp-boe-reserves-research-v1.js
          git fetch origin main --no-tags
          source_blob="$(git hash-object "$path")"
          test "$(git rev-parse "origin/main:$path")" = "$source_blob" || {
            echo 'BOE_GBP_REMOTE_SOURCE_MOVED_WITHHELD'; exit 1;
          }
          git fetch origin gh-pages --no-tags
          pages_sha="$(git rev-parse origin/gh-pages)"
          git worktree add --detach /tmp/boe-gbp-reserves-pages origin/gh-pages
          mkdir -p /tmp/boe-gbp-reserves-pages/site/fx-quant-v2/next
          cp "$path" "/tmp/boe-gbp-reserves-pages/$path"
          cd /tmp/boe-gbp-reserves-pages
          if git diff --quiet -- "$path"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'BOE_GBP_RESERVES_PAGES_ALREADY_CURRENT' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$(git diff --name-only)" = "$path"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$path"
          git commit -m 'Mirror official BoE GBP reserve balances research only'
          test "$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')" = "$pages_sha" || {
            echo 'BOE_GBP_PAGES_BRANCH_MOVED_WITHHELD'; exit 1;
          }
          git fetch origin main --no-tags
          test "$(git rev-parse "origin/main:$path")" = "$source_blob" || {
            echo 'BOE_GBP_SOURCE_BLOB_MOVED_WITHHELD'; exit 1;
          }
          git push --force-with-lease=refs/heads/gh-pages:$pages_sha origin HEAD:gh-pages
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo 'BOE_GBP_RESERVES_PAGES_MIRRORED' >> "$GITHUB_STEP_SUMMARY"
      - name: Queue Pages build after source mirror
        if: steps.pages-sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds")"
          jq -e '.status == "queued" or .status == "building"' <<<"$result" >/dev/null
          echo 'BOE_GBP_PAGES_BUILD_ACCEPTED' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve dated source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boe-gbp-official-reserves-receipt
          path: /tmp/boe-gbp-reserves-receipt.json
          if-no-files-found: warn
          retention-days: 14
