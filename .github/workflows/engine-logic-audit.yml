name: Engine Logic Audit

on:
  push:
    branches:
      - 'release-*'
      - 'validation-*'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/gmfq-engine-server.log 2>&1 &
          echo $! > /tmp/gmfq-engine-server.pid
          sleep 2

      - name: Run engine integrity gate
        run: |
          cat > engine-audit.js <<'EOF'
          const { chromium } = require('playwright');
          const CCYS=['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];
          const PAIRS=['AUD/CAD','AUD/CHF','AUD/JPY','AUD/NZD','AUD/USD','CAD/CHF','CAD/JPY','CHF/JPY','EUR/AUD','EUR/CAD','EUR/CHF','EUR/GBP','EUR/JPY','EUR/NZD','EUR/USD','GBP/AUD','GBP/CAD','GBP/CHF','GBP/JPY','GBP/NZD','GBP/USD','NZD/CAD','NZD/CHF','NZD/JPY','NZD/USD','USD/CAD','USD/CHF','USD/JPY'];

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const consoleErrors=[];
            const pageErrors=[];
            page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));

            const response=await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'domcontentloaded',timeout:120000});
            if(!response || !response.ok()) throw new Error('HTTP load failed');
            await page.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.settled_after_cad_chain===true,null,{timeout:120000});

            const snapshot=()=>page.evaluate(({CCYS,PAIRS})=>{
              const currencies={};
              for(const c of CCYS){
                const s=window.deriveCurrencyState?.(c)||null;
                currencies[c]=s?{base:s.base,macro:Number(s.macro||0),policy:Number(s.policy||0),change:s.improvementState||null}:null;
              }
              const pairs={};
              for(const p of PAIRS){
                const f=window.derivePairDecisionFrame?.(p)||null;
                pairs[p]=f?{
                  fav:f.fav,
                  quality:f.quality,
                  macroSide:f.structural?.macro?.side??null,
                  policySide:f.structural?.policy?.side??null,
                  ratesMaterial:!!f.structural?.ratesGap?.material,
                  ratesSide:f.structural?.ratesGap?.side??null
                }:null;
              }
              return {currencies,pairs};
            },{CCYS,PAIRS});

            const before=await snapshot();

            const structural=await page.evaluate(({CCYS,PAIRS})=>{
              const issues=[];
              const requiredFns=['deriveCurrencyState','derivePairDecisionFrame','rebuildCanonicalState','stableModelRefresh','ratesCanonicalBasisIntegrity','visibleRatesSnapshotIntegrity'];
              for(const fn of requiredFns){ if(typeof window[fn]!=='function') issues.push('MISSING_FUNCTION:'+fn); }

              const states={};
              for(const c of CCYS){
                const s=window.deriveCurrencyState?.(c)||null;
                states[c]=s;
                if(!s){issues.push('MISSING_CURRENCY:'+c);continue;}
                const m=Number(s.macro||0), p=Number(s.policy||0);
                if(![-1,0,1].includes(m)||![-1,0,1].includes(p)) issues.push('BAD_AXIS:'+c);
                let expected='MISTA';
                if(m>0&&p>0) expected='FORTE';
                else if(m<0&&p<0) expected='FRAGILE';
                else if((m>0&&p===0)||(p>0&&m===0)) expected='COSTRUTTIVA';
                else if((m<0&&p===0)||(p<0&&m===0)) expected='DEBOLE';
                if(s.base!==expected) issues.push(`CURRENCY_RULE:${c}:${s.base}!=${expected}`);
              }

              if(PAIRS.length!==28) issues.push('PAIR_COUNT:'+PAIRS.length);
              for(const p of PAIRS){
                const [a,b]=String(p).split('/');
                const sa=states[a], sb=states[b];
                const f=window.derivePairDecisionFrame?.(p)||null;
                if(!f){issues.push('MISSING_PAIR_FRAME:'+p);continue;}
                const macroSide=Number(sa?.macro||0)>Number(sb?.macro||0)?'A':Number(sb?.macro||0)>Number(sa?.macro||0)?'B':'TIE';
                const policySide=Number(sa?.policy||0)>Number(sb?.policy||0)?'A':Number(sb?.policy||0)>Number(sa?.policy||0)?'B':'TIE';
                if(f.structural?.macro?.side!==macroSide) issues.push(`PAIR_MACRO:${p}`);
                if(f.structural?.policy?.side!==policySide) issues.push(`PAIR_POLICY:${p}`);

                let expectedFav='—';
                let expectedQuality=null;
                if(macroSide!=='TIE'&&macroSide===policySide){expectedFav=macroSide==='A'?a:b;expectedQuality='CONTRASTO STRUTTURALE FORTE';}
                else if(macroSide!=='TIE'&&policySide==='TIE'){expectedFav=macroSide==='A'?a:b;expectedQuality='VANTAGGIO RELATIVO PARZIALE';}
                else if(policySide!=='TIE'&&macroSide==='TIE'){expectedFav=policySide==='A'?a:b;expectedQuality='VANTAGGIO RELATIVO PARZIALE';}
                else if(macroSide!=='TIE'&&policySide!=='TIE'&&macroSide!==policySide){expectedFav='—';expectedQuality='PILASTRI DIVISI';}
                if(f.fav!==expectedFav) issues.push(`PAIR_FAV:${p}:${f.fav}!=${expectedFav}`);
                if(expectedQuality&&f.quality!==expectedQuality) issues.push(`PAIR_QUALITY:${p}:${f.quality}!=${expectedQuality}`);
                if(!expectedQuality&&!['NESSUN CONTRASTO','SEPARAZIONE RATES MATERIALE'].includes(f.quality)) issues.push(`PAIR_TIE_QUALITY:${p}:${f.quality}`);
              }

              const final=window.GMFQ_POST_GATE_FINAL_AUDIT||null;
              if(!final||final.status!=='PASS'||final.settled_after_cad_chain!==true) issues.push('FINAL_AUDIT_NOT_SETTLED_PASS');
              if(final?.counts?.currencies!==8||final?.counts?.pairs!==28) issues.push('FINAL_COUNTS');
              const rb=window.ratesCanonicalBasisIntegrity?.();
              const rv=window.visibleRatesSnapshotIntegrity?.();
              if(rb?.ok!==true) issues.push('RATES_BASIS');
              if(rv?.ok!==true) issues.push('RATES_VISIBLE');
              return {issues,final,rb,rv};
            },{CCYS,PAIRS});

            if(structural.issues.length) throw new Error('Structural integrity failure: '+JSON.stringify(structural.issues));
            if(consoleErrors.length) throw new Error('Console errors: '+consoleErrors.join(' | '));
            if(pageErrors.length) throw new Error('Page errors: '+pageErrors.join(' | '));

            await page.evaluate(()=>{
              for(let i=0;i<3;i++){
                window.rebuildCanonicalState?.();
                window.stableModelRefresh?.();
                window.v302ConsolidatedSync?.();
              }
            });
            await page.waitForTimeout(1200);
            const after=await snapshot();
            if(JSON.stringify(before)!==JSON.stringify(after)) throw new Error('Refresh idempotence failure');

            console.log(JSON.stringify({status:'PASS',currencies:Object.keys(before.currencies).length,pairs:Object.keys(before.pairs).length,rates_basis:structural.rb?.ok,rates_visible:structural.rv?.ok},null,2));
            await browser.close();
          })().catch(e=>{console.error('::error title=Engine integrity gate::'+String(e.message||e));process.exit(1)});
          EOF
          node engine-audit.js

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-logic-audit
          path: /tmp/gmfq-engine-server.log
