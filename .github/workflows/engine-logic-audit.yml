name: Engine Logic Audit

on:
  push:
    branches: [staging-engine-logic-audit-2026-09-30]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install browser
        run: npm init -y >/dev/null 2>&1 && npm install --save-dev playwright
      - name: Inspect engine source and runtime
        run: |
          echo "=== SOURCE DEFINITIONS ==="
          grep -RniE "function (changeBuckets|derivePairDecisionFrame|v475MacroTutorModel|v232CountrySnapshot|stableModelRefresh|rebuildCanonicalState)|const (changeBuckets|derivePairDecisionFrame)|FX · Sta migliorando" payload index.html | head -300 || true
          cat > audit.js <<'EOF'
          const {chromium}=require('playwright');
          const {execSync,spawn}=require('child_process');
          const fs=require('fs');
          (async()=>{
            const srv=spawn('python3',['-m','http.server','8765'],{stdio:'ignore'});
            await new Promise(r=>setTimeout(r,1000));
            const cp=execSync('command -v google-chrome-stable || command -v google-chrome || command -v chromium').toString().trim();
            const browser=await chromium.launch({headless:true,executablePath:cp,args:['--no-sandbox']});
            const page=await browser.newPage();
            const errors=[];
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'networkidle',timeout:120000});
            const out=await page.evaluate(()=>{
              const safe=(fn,fb=null)=>{try{return fn()}catch(e){return {error:String(e?.message||e),fallback:fb}}};
              const ccys=['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];
              const per={};
              for(const c of ccys){
                const snap=safe(()=>v232CountrySnapshot(c));
                const tutor=safe(()=>v475MacroTutorModel(c,snap));
                const ois=safe(()=>window.GMFQ_OIS?.currency?.(c));
                per[c]={snap,tutor,ois,derived:safe(()=>deriveCurrencyState(c)),improvement:safe(()=>currencyImprovementDiagnostic(c))};
              }
              return {
                per,
                canonical:safe(()=>window.GMFQ_CANONICAL_STATE),
                dashboard:safe(()=>window.DASHBOARD_DATA||window.D),
                fullAudit:safe(()=>window.GMFQ_FULL_SYSTEM_AUDIT),
                postGate:safe(()=>window.GMFQ_POST_GATE_FINAL_AUDIT),
                functions:{
                  changeBuckets:safe(()=>changeBuckets.toString()),
                  derivePairDecisionFrame:safe(()=>derivePairDecisionFrame.toString()),
                  v475MacroTutorModel:safe(()=>v475MacroTutorModel.toString()),
                  v232CountrySnapshot:safe(()=>v232CountrySnapshot.toString()),
                  stableModelRefresh:safe(()=>stableModelRefresh.toString()),
                  deriveCurrencyState:safe(()=>deriveCurrencyState.toString()),
                  currencyImprovementDiagnostic:safe(()=>currencyImprovementDiagnostic.toString()),
                  buildCanonicalCurrencyState:safe(()=>buildCanonicalCurrencyState.toString()),
                  rebuildCanonicalState:safe(()=>rebuildCanonicalState.toString())
                },
                currencyRules:safe(()=>{
                  const rows=ccys.map(c=>{
                    const x=deriveCurrencyState(c)||{};
                    const m=Number(x.macro||0), p=Number(x.policy||0);
                    let expected='MISTA';
                    if(m>0&&p>0) expected='FORTE';
                    else if(m<0&&p<0) expected='FRAGILE';
                    else if((m>0&&p===0)||(p>0&&m===0)) expected='COSTRUTTIVA';
                    else if((m<0&&p===0)||(p<0&&m===0)) expected='DEBOLE';
                    return {c,macro:m,policy:p,base:x.base,expected,improvement:x.improvementState,
                      mismatch:x.base!==expected};
                  });
                  return {rows,issues:rows.filter(x=>x.mismatch)};
                }),
                allPairFrames:safe(()=>{
                  const rows=[...(D?.pairs||[])].map(x=>{
                    const p=x.pair, f=derivePairDecisionFrame(p)||{};
                    const ms=f.structural?.macro?.side??null, ps=f.structural?.policy?.side??null;
                    let expectedFav='—', expectedQuality='NESSUN CONTRASTO';
                    if(ms!=='TIE' && ms===ps){ expectedFav=ms==='A'?p.split('/')[0]:p.split('/')[1]; expectedQuality='CONTRASTO STRUTTURALE FORTE'; }
                    else if(ms!=='TIE' && ps==='TIE'){ expectedFav=ms==='A'?p.split('/')[0]:p.split('/')[1]; expectedQuality='VANTAGGIO RELATIVO PARZIALE'; }
                    else if(ps!=='TIE' && ms==='TIE'){ expectedFav=ps==='A'?p.split('/')[0]:p.split('/')[1]; expectedQuality='VANTAGGIO RELATIVO PARZIALE'; }
                    else if(ms!=='TIE' && ps!=='TIE' && ms!==ps){ expectedFav='—'; expectedQuality='PILASTRI DIVISI'; }
                    return {pair:p,fav:f.fav,quality:f.quality,macroSide:ms,policySide:ps,expectedFav,expectedQuality,
                      ruleMismatch:f.fav!==expectedFav || !([expectedQuality,'SEPARAZIONE RATES MATERIALE','NESSUN CONTRASTO'].includes(f.quality) || f.quality===expectedQuality)};
                  });
                  return {rows,issues:rows.filter(x=>x.ruleMismatch)};
                }),
                pairConsistency:safe(()=>{
                  const rows=[...(D?.pairs||[])].map(x=>{
                    const p=x.pair, [a,b]=String(p).split('/');
                    const sa=deriveCurrencyState(a), sb=deriveCurrencyState(b);
                    const absoluteMacroSide=(Number(sa?.macro||0)>Number(sb?.macro||0))?'A':
                      (Number(sb?.macro||0)>Number(sa?.macro||0))?'B':'TIE';
                    const rawPair=D?.pairStates?.[p]||{};
                    const rawMacro=rawPair.layers?.macro??rawPair.layer_directions?.macro;
                    const rawSide=rawMacro==='A'||rawMacro===a?'A':
                      rawMacro==='B'||rawMacro===b?'B':
                      /mix|mist/i.test(String(rawMacro||''))?'TIE':'NONE';
                    const frame=derivePairDecisionFrame(p);
                    return {
                      pair:p,a,b,
                      currencyMacro:{a:Number(sa?.macro||0),b:Number(sb?.macro||0),side:absoluteMacroSide},
                      pairRawMacro:{raw:rawMacro??null,side:rawSide},
                      frameMacroSide:frame?.structural?.macro?.side??null,
                      fav:frame?.fav??null,
                      quality:frame?.quality??null,
                      legacyMismatch:rawSide!=='NONE'&&rawSide!==absoluteMacroSide,
                      engineMismatch:(frame?.structural?.macro?.side??null)!==absoluteMacroSide
                    };
                  });
                  return {
                    rows,
                    legacyMismatches:rows.filter(x=>x.legacyMismatch),
                    legacyCount:rows.filter(x=>x.legacyMismatch).length,
                    engineMismatches:rows.filter(x=>x.engineMismatch),
                    engineCount:rows.filter(x=>x.engineMismatch).length
                  };
                }),
                eur:{
                  nativeMacro:safe(()=>NATIVE_MACRO_DATA?.EUR),
                  nativeRates:safe(()=>NATIVE_RATES_DATA?.EUR),
                  nativeCb:safe(()=>NATIVE_CB_DATA?.EUR),
                  canonicalCurrency:safe(()=>window.GMFQ_CANONICAL_STATE?.currencies?.EUR),
                  improvement:safe(()=>currencyImprovementDiagnostic('EUR')),
                  derived:safe(()=>deriveCurrencyState('EUR')),
                  pairFrames:safe(()=>[...(D?.pairs||[])].filter(x=>String(x.pair).includes('EUR')).map(x=>({p:x.pair,f:derivePairDecisionFrame(x.pair)}))),
                  macroTutor:safe(()=>v475MacroTutorModel('EUR',v232CountrySnapshot('EUR')))
                }
              };
            });
            console.log('===RUNTIME_JSON_START===');
            console.log(JSON.stringify(out,null,2));
            console.log('===RUNTIME_JSON_END===');
            console.log('===ERRORS===',JSON.stringify(errors));
            await browser.close(); srv.kill();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node audit.js
