name: Engine Logic Audit

permissions:
  contents: write

on:
  push:
    branches: [staging-engine-logic-audit-2026-09-30, engine-freeze-v1-2026-10-02]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install browser
        run: npm init -y >/dev/null 2>&1 && npm install --save-dev playwright
      - name: Inspect engine source and runtime
        run: |
          echo "=== SOURCE DEFINITIONS ==="
          grep -RniE "function (changeBuckets|derivePairDecisionFrame|v475MacroTutorModel|v232CountrySnapshot|stableModelRefresh|rebuildCanonicalState)|const (changeBuckets|derivePairDecisionFrame)|FX · Sta migliorando" payload index.html | head -300 || true
          cat > audit.js <<'EOF'
          const {chromium}=require('playwright');
          const {execSync,spawn}=require('child_process');
          const fs=require('fs');
          (async()=>{
            const srv=spawn('python3',['-m','http.server','8765'],{stdio:'ignore'});
            await new Promise(r=>setTimeout(r,1000));
            const cp=execSync('command -v google-chrome-stable || command -v google-chrome || command -v chromium').toString().trim();
            const browser=await chromium.launch({headless:true,executablePath:cp,args:['--no-sandbox']});
            const page=await browser.newPage();
            const errors=[];
            const httpFailures=[];
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('response',res=>{if(res.status()>=400)httpFailures.push({status:res.status(),url:res.url()})});
            await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'networkidle',timeout:120000});
            const out=await page.evaluate(async()=>{
              const safe=(fn,fb=null)=>{try{return fn()}catch(e){return {error:String(e?.message||e),fallback:fb}}};
              const ccys=['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];
              const per={};
              for(const c of ccys){
                const snap=safe(()=>v232CountrySnapshot(c));
                const tutor=safe(()=>v475MacroTutorModel(c,snap));
                const ois=safe(()=>window.GMFQ_OIS?.currency?.(c));
                per[c]={snap,tutor,ois,derived:safe(()=>deriveCurrencyState(c)),improvement:safe(()=>currencyImprovementDiagnostic(c))};
              }
              return {
                per,
                canonical:safe(()=>window.GMFQ_CANONICAL_STATE),
                dashboard:safe(()=>window.DASHBOARD_DATA||window.D),
                fullAudit:safe(()=>window.GMFQ_FULL_SYSTEM_AUDIT),
                postGate:safe(()=>window.GMFQ_POST_GATE_FINAL_AUDIT),
                functions:{
                  changeBuckets:safe(()=>changeBuckets.toString()),
                  derivePairDecisionFrame:safe(()=>derivePairDecisionFrame.toString()),
                  v475MacroTutorModel:safe(()=>v475MacroTutorModel.toString()),
                  v232CountrySnapshot:safe(()=>v232CountrySnapshot.toString()),
                  stableModelRefresh:safe(()=>stableModelRefresh.toString()),
                  deriveCurrencyState:safe(()=>deriveCurrencyState.toString()),
                  currencyImprovementDiagnostic:safe(()=>currencyImprovementDiagnostic.toString()),
                  buildCanonicalCurrencyState:safe(()=>buildCanonicalCurrencyState.toString()),
                  rebuildCanonicalState:safe(()=>rebuildCanonicalState.toString())
                },
                lazyLoadInvariance:await (async()=>{
                  const snap=()=>({
                    currencies:Object.fromEntries(ccys.map(c=>{const x=deriveCurrencyState(c)||{};return [c,{base:x.base,macro:x.macro,policy:x.policy,change:x.improvementState,confirmation:x.confirmation}]})),
                    dynamics:Object.fromEntries(ccys.map(c=>{const g=blockDynamics(c,'Crescita'),l=blockDynamics(c,'Lavoro');return [c,{growth:g?{direction:g.direction,accelDir:g.accelDir,turning:g.turning,n:g.n}:null,labour:l?{direction:l.direction,accelDir:l.accelDir,turning:l.turning,n:l.n}:null}]})),
                    pairs:Object.fromEntries([...(D?.pairs||[])].map(x=>{const f=derivePairDecisionFrame(x.pair)||{};return [x.pair,{fav:f.fav,quality:f.quality,macro:f.structural?.macro?.side,policy:f.structural?.policy?.side,price:f.priceReading}]}))
                  });
                  const before=snap();
                  let loadError=null;
                  try{ if(typeof window.loadFullMacroSeries==='function') await window.loadFullMacroSeries(); }
                  catch(e){ loadError=String(e?.message||e); }
                  const after=snap();
                  return {ok:!loadError && JSON.stringify(before)===JSON.stringify(after),loadError,before,after};
                })(),
                refreshStability:safe(()=>{
                  const before={
                    currencies:Object.fromEntries(ccys.map(c=>{const x=deriveCurrencyState(c)||{};return [c,{base:x.base,macro:x.macro,policy:x.policy,change:x.improvementState}]})),
                    pairs:Object.fromEntries([...(D?.pairs||[])].map(x=>{const f=derivePairDecisionFrame(x.pair)||{};return [x.pair,{fav:f.fav,quality:f.quality,macro:f.structural?.macro?.side,policy:f.structural?.policy?.side}]}))
                  };
                  for(let i=0;i<3;i++){
                    try{rebuildCanonicalState();}catch(e){}
                    try{stableModelRefresh();}catch(e){}
                    try{window.v302ConsolidatedSync?.();}catch(e){}
                  }
                  const after={
                    currencies:Object.fromEntries(ccys.map(c=>{const x=deriveCurrencyState(c)||{};return [c,{base:x.base,macro:x.macro,policy:x.policy,change:x.improvementState}]})),
                    pairs:Object.fromEntries([...(D?.pairs||[])].map(x=>{const f=derivePairDecisionFrame(x.pair)||{};return [x.pair,{fav:f.fav,quality:f.quality,macro:f.structural?.macro?.side,policy:f.structural?.policy?.side}]}))
                  };
                  const same=JSON.stringify(before)===JSON.stringify(after);
                  return {ok:same,before,after};
                }),
                uiSemanticAudit:safe(()=>{
                  const issues=[];
                  const ccys=['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];
                  const expected={};
                  ccys.forEach(c=>{
                    const x=deriveCurrencyState(c)||{};
                    expected[c]={base:x.base||null,change:x.improvementState||null};
                  });
                  const overviewText=document.getElementById('overview')?.innerText||'';
                  const currencyText=document.getElementById('currency')?.innerText||document.body.innerText||'';
                  // Semantic guardrails: recent change must never be presented as structural strength.
                  if(/FX\s*·\s*Sta migliorando/i.test(overviewText)) issues.push('OVERVIEW_OLD_AMBIGUOUS_FX_IMPROVING_LABEL');
                  if(/FX\s*·\s*Sta peggiorando/i.test(overviewText)) issues.push('OVERVIEW_OLD_AMBIGUOUS_FX_WORSENING_LABEL');
                  if(!/FX\s*·\s*Struttura attuale/i.test(overviewText)) issues.push('OVERVIEW_MISSING_STRUCTURAL_STATE_SECTION');
                  if(!/FX\s*·\s*Migliora di recente/i.test(overviewText)) issues.push('OVERVIEW_MISSING_RECENT_IMPROVEMENT_SECTION');
                  // Pair desk must expose the canonical pillars, not legacy directional wording.
                  const pairText=document.getElementById('pairs')?.innerText||document.body.innerText||'';
                  if(!/Macro/i.test(pairText) || !/Tassi\s*\/\s*CB|Tassi\/CB/i.test(pairText)) issues.push('PAIR_DESK_MISSING_CANONICAL_PILLARS');
                  return {ok:issues.length===0,issues,expected};
                }),
                currencyRules:safe(()=>{
                  const rows=ccys.map(c=>{
                    const x=deriveCurrencyState(c)||{};
                    const m=Number(x.macro||0), p=Number(x.policy||0);
                    let expected='MISTA';
                    if(m>0&&p>0) expected='FORTE';
                    else if(m<0&&p<0) expected='FRAGILE';
                    else if((m>0&&p===0)||(p>0&&m===0)) expected='COSTRUTTIVA';
                    else if((m<0&&p===0)||(p<0&&m===0)) expected='DEBOLE';
                    return {c,macro:m,policy:p,base:x.base,expected,improvement:x.improvementState,
                      mismatch:x.base!==expected};
                  });
                  return {rows,issues:rows.filter(x=>x.mismatch)};
                }),
                allPairFrames:safe(()=>{
                  const rows=[...(D?.pairs||[])].map(x=>{
                    const p=x.pair, f=derivePairDecisionFrame(p)||{};
                    const ms=f.structural?.macro?.side??null, ps=f.structural?.policy?.side??null;
                    let expectedFav='—', expectedQuality='NESSUN CONTRASTO';
                    if(ms!=='TIE' && ms===ps){ expectedFav=ms==='A'?p.split('/')[0]:p.split('/')[1]; expectedQuality='CONTRASTO STRUTTURALE FORTE'; }
                    else if(ms!=='TIE' && ps==='TIE'){ expectedFav=ms==='A'?p.split('/')[0]:p.split('/')[1]; expectedQuality='VANTAGGIO RELATIVO PARZIALE'; }
                    else if(ps!=='TIE' && ms==='TIE'){ expectedFav=ps==='A'?p.split('/')[0]:p.split('/')[1]; expectedQuality='VANTAGGIO RELATIVO PARZIALE'; }
                    else if(ms!=='TIE' && ps!=='TIE' && ms!==ps){ expectedFav='—'; expectedQuality='PILASTRI DIVISI'; }
                    return {pair:p,fav:f.fav,quality:f.quality,macroSide:ms,policySide:ps,expectedFav,expectedQuality,
                      ruleMismatch:f.fav!==expectedFav || !([expectedQuality,'SEPARAZIONE RATES MATERIALE','NESSUN CONTRASTO'].includes(f.quality) || f.quality===expectedQuality)};
                  });
                  return {rows,issues:rows.filter(x=>x.ruleMismatch)};
                }),
                pairConsistency:safe(()=>{
                  const rows=[...(D?.pairs||[])].map(x=>{
                    const p=x.pair, [a,b]=String(p).split('/');
                    const sa=deriveCurrencyState(a), sb=deriveCurrencyState(b);
                    const absoluteMacroSide=(Number(sa?.macro||0)>Number(sb?.macro||0))?'A':
                      (Number(sb?.macro||0)>Number(sa?.macro||0))?'B':'TIE';
                    const rawPair=D?.pairStates?.[p]||{};
                    const rawMacro=rawPair.layers?.macro??rawPair.layer_directions?.macro;
                    const rawSide=rawMacro==='A'||rawMacro===a?'A':
                      rawMacro==='B'||rawMacro===b?'B':
                      /mix|mist/i.test(String(rawMacro||''))?'TIE':'NONE';
                    const frame=derivePairDecisionFrame(p);
                    return {
                      pair:p,a,b,
                      currencyMacro:{a:Number(sa?.macro||0),b:Number(sb?.macro||0),side:absoluteMacroSide},
                      pairRawMacro:{raw:rawMacro??null,side:rawSide},
                      frameMacroSide:frame?.structural?.macro?.side??null,
                      fav:frame?.fav??null,
                      quality:frame?.quality??null,
                      legacyMismatch:rawSide!=='NONE'&&rawSide!==absoluteMacroSide,
                      engineMismatch:(frame?.structural?.macro?.side??null)!==absoluteMacroSide
                    };
                  });
                  return {
                    rows,
                    legacyMismatches:rows.filter(x=>x.legacyMismatch),
                    legacyCount:rows.filter(x=>x.legacyMismatch).length,
                    engineMismatches:rows.filter(x=>x.engineMismatch),
                    engineCount:rows.filter(x=>x.engineMismatch).length
                  };
                }),
                eur:{
                  nativeMacro:safe(()=>NATIVE_MACRO_DATA?.EUR),
                  nativeRates:safe(()=>NATIVE_RATES_DATA?.EUR),
                  nativeCb:safe(()=>NATIVE_CB_DATA?.EUR),
                  canonicalCurrency:safe(()=>window.GMFQ_CANONICAL_STATE?.currencies?.EUR),
                  improvement:safe(()=>currencyImprovementDiagnostic('EUR')),
                  derived:safe(()=>deriveCurrencyState('EUR')),
                  pairFrames:safe(()=>[...(D?.pairs||[])].filter(x=>String(x.pair).includes('EUR')).map(x=>({p:x.pair,f:derivePairDecisionFrame(x.pair)}))),
                  macroTutor:safe(()=>v475MacroTutorModel('EUR',v232CountrySnapshot('EUR')))
                }
              };
            });
            console.log('===RUNTIME_JSON_START===');
            console.log(JSON.stringify(out,null,2));
            console.log('===RUNTIME_JSON_END===');
            console.log('===ERRORS===',JSON.stringify(errors));
            const gates={
              lazyLoadInvariance:!!out?.lazyLoadInvariance?.ok,
              refreshStability:!!out?.refreshStability?.ok,
              currencyRules:(out?.currencyRules?.issues||[]).length===0,
              pairConsistency:(out?.pairConsistency?.engineCount||0)===0,
              pairFrames:(out?.allPairFrames?.issues||[]).length===0,
              runtimeErrors:errors.length===0 && httpFailures.length===0
            };
            console.log('===AUDIT_GATES===',JSON.stringify(gates));
            const failed=Object.entries(gates).filter(([,v])=>!v).map(([k])=>k);
            const auditResult={
              schema:'GMFQ_ENGINE_LOGIC_AUDIT_LATEST_V1',
              generated_at:new Date().toISOString(),
              gates,
              failed,
              lazyLoadInvariance:out?.lazyLoadInvariance||null,
              refreshStability:out?.refreshStability||null,
              currencyRules:out?.currencyRules||null,
              pairConsistency:out?.pairConsistency||null,
              allPairFrames:out?.allPairFrames||null,
              runtimeErrors:errors,
              httpFailures
            };
            fs.mkdirSync('validation',{recursive:true});
            fs.writeFileSync('validation/ENGINE_LOGIC_AUDIT_LATEST.json',JSON.stringify(auditResult,null,2));
            await browser.close(); srv.kill();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node audit.js
      - name: Commit machine-readable audit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/ENGINE_LOGIC_AUDIT_LATEST.json
          if git diff --cached --quiet; then
            echo "No audit result changes"
          else
            git commit -m "Record latest engine logic audit result"
            git push origin HEAD:engine-freeze-v1-2026-10-02
          fi
      - name: Enforce audit gates
        run: |
          python - <<'PY'
          import json,sys
          p='validation/ENGINE_LOGIC_AUDIT_LATEST.json'
          j=json.load(open(p,encoding='utf-8'))
          print('GATES',json.dumps(j.get('gates',{}),sort_keys=True))
          failed=j.get('failed') or []
          if failed:
              print('FAILED:', ', '.join(failed))
              sys.exit(2)
          print('ALL ENGINE AUDIT GATES PASSED')
          PY
