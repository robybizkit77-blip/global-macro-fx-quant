name: JPY TONA History Probe

on:
  push:
    branches:
      - staging-jpy-tona-history-probe-2026-09-30
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build matched TFX TONA curve
        run: |
          pip install requests
          python - <<'PY'
          import requests,csv,io,json
          q=[
            ('HistoricalFuturesData[period_start_type]','date'),
            ('HistoricalFuturesData[period_start][year]','2026'),
            ('HistoricalFuturesData[period_start][month]','9'),
            ('HistoricalFuturesData[period_start][day]','18'),
            ('HistoricalFuturesData[period_end_type]','date'),
            ('HistoricalFuturesData[period_end][year]','2026'),
            ('HistoricalFuturesData[period_end][month]','9'),
            ('HistoricalFuturesData[period_end][day]','29'),
            ('HistoricalFuturesData[product_type1][]','無担保コールオーバーナイト３ヵ月金利先物'),
            ('HistoricalFuturesData[product_type2]','1'),
            ('HistoricalFuturesData[get_preference][]','day_settlement_price'),
            ('HistoricalFuturesData[get_preference][]','trading_volume'),
            ('HistoricalFuturesData[get_preference][]','open_interest_quantity'),
            ('HistoricalFuturesData[get_preference][]','last'),
            ('HistoricalFuturesData[submit_type]','csv'),
          ]
          r=requests.get('https://www.tfx.co.jp/en/historical/futures/result',params=q,timeout=120)
          r.raise_for_status()
          rows=list(csv.reader(io.StringIO(r.content.decode('cp932','replace'))))
          data=[]
          for row in rows[4:]:
              if len(row)<8 or row[1] != 'Three-month TONA Futures': continue
              data.append({
                'contract':row[2],'date':row[3],
                'last':row[4] or None,
                'volume':int(row[5].replace(',','') or 0),
                'settlement':float(row[6]) if row[6] else None,
                'open_interest':int(row[7].replace(',','') or 0)
              })
          wanted=['26.12','27.03','27.09']
          dates=['2026-09-18','2026-09-28','2026-09-29']
          grid={}
          for d in dates:
              grid[d]={}
              for con in wanted:
                  grid[d][con]=next((z for z in data if z['date']==d and z['contract']==con),None)
          print('GRID='+json.dumps(grid,ensure_ascii=False,sort_keys=True))
          labels={'3m':'26.12','6m':'27.03','12m':'27.09'}
          out={}
          for h,con in labels.items():
              cur=grid['2026-09-29'][con]; d1=grid['2026-09-28'][con]; w1=grid['2026-09-18'][con]
              if not all([cur,d1,w1]):
                  out[h]={'error':'missing row','contract':con}; continue
              cr=100-cur['settlement']; r1=100-d1['settlement']; rw=100-w1['settlement']
              out[h]={
                'contract':con,
                'current_rate':round(cr,6),
                'rate_1d':round(r1,6),
                'rate_1w':round(rw,6),
                'change_1d_bp':round((cr-r1)*100,6),
                'change_1w_bp':round((cr-rw)*100,6),
                'current_settlement':cur['settlement'],
                'settlement_1d':d1['settlement'],
                'settlement_1w':w1['settlement'],
                'current_volume':cur['volume'],
                'current_open_interest':cur['open_interest'],
                'prev_volume':d1['volume'],
                'prev_open_interest':d1['open_interest'],
                'week_ref_volume':w1['volume'],
                'week_ref_open_interest':w1['open_interest']
              }
          print('FINAL='+json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY
