name: OIS Estimated Snapshot Repricing V1

on:
  pull_request:
    paths:
      - 'validation/cb_pricing/OIS_ESTIMATED_REPRICING_CONTRACT_V1_2026-10-15.json'
      - 'validation/cb_pricing/collect_cb_pricing_estimated_live_v1.py'
      - 'validation/cb_pricing/collect_nzd_asx_directional_proxy_v1.py'
      - 'validation/cb_pricing/nzd_asx_scenario_sensitivity_v2.py'
      - 'validation/cb_pricing/test_nzd_asx_scenario_sensitivity_v2.py'
      - 'validation/cb_pricing/build_cb_pricing_estimated_v1.py'
      - 'validation/cb_pricing/ois_estimated_snapshot_v1.py'
      - 'validation/cb_pricing/test_ois_estimated_snapshot_v1.py'
      - 'validation/cb_pricing/ois_same_contract_history_v1.py'
      - 'validation/cb_pricing/ois_estimated_snapshot_v1.py'
      - 'validation/cb_pricing/reconcile_ois_secondary_conflicts_v1.py'
      - 'validation/cb_pricing/test_reconcile_ois_secondary_conflicts_v1.py'
      - 'validation/cb_pricing/ois_uncontested_contract_moves_v1.py'
      - 'validation/cb_pricing/test_ois_uncontested_contract_moves_v1.py'
      - 'validation/cb_pricing/history/OIS_SAME_CONTRACT_CONFLICTS_V1.jsonl'
      - 'validation/cb_pricing/test_ois_same_contract_history_v1.py'
      - 'validation/cb_pricing/test_ois_operational_view_v1.py'
      - 'validation/cb_pricing/test_ois_official_runtime_parity_v1.py'
      - 'validation/cb_pricing/build_ois_source_readiness_view_v1.py'
      - 'validation/cb_pricing/audit_ois_source_access_v1.py'
      - 'validation/cb_pricing/test_audit_ois_source_access_v1.py'
      - 'validation/cb_pricing/check_ois_readiness_parity_v1.py'
      - 'validation/cb_pricing/test_check_ois_readiness_parity_v1.py'
      - 'validation/cb_pricing/test_build_ois_source_readiness_view_v1.py'
      - 'validation/cb_pricing/history/OIS_SAME_CONTRACT_QUOTES_V1.jsonl'
      - 'validation/cb_pricing/push_ois_refresh_with_lease_v1.py'
      - 'validation/cb_pricing/test_push_ois_refresh_with_lease_v1.py'
      - 'validation/cb_pricing/build_ois_operational_view_v1.py'
      - 'live_data/sections/CB_PRICING_ESTIMATED_LIVE_QUOTES.json'
      - 'live_data/sections/NZD_CB_PRICING_DIRECTIONAL_PROXY.json'
      - 'validation/cb_pricing/history/OIS_ESTIMATED_SNAPSHOTS_V1.jsonl'
      - '.github/workflows/ois-estimated-snapshot-repricing-v1.yml'
  push:
    branches: [main]
    paths:
      - 'validation/cb_pricing/OIS_ESTIMATED_REPRICING_CONTRACT_V1_2026-10-15.json'
      - 'validation/cb_pricing/collect_cb_pricing_estimated_live_v1.py'
      - 'validation/cb_pricing/collect_nzd_asx_directional_proxy_v1.py'
      - 'validation/cb_pricing/nzd_asx_scenario_sensitivity_v2.py'
      - 'validation/cb_pricing/test_nzd_asx_scenario_sensitivity_v2.py'
      - 'validation/cb_pricing/build_cb_pricing_estimated_v1.py'
      - 'validation/cb_pricing/ois_estimated_snapshot_v1.py'
      - 'validation/cb_pricing/test_ois_estimated_snapshot_v1.py'
      - 'validation/cb_pricing/ois_same_contract_history_v1.py'
      - 'validation/cb_pricing/ois_estimated_snapshot_v1.py'
      - 'validation/cb_pricing/reconcile_ois_secondary_conflicts_v1.py'
      - 'validation/cb_pricing/test_reconcile_ois_secondary_conflicts_v1.py'
      - 'validation/cb_pricing/ois_uncontested_contract_moves_v1.py'
      - 'validation/cb_pricing/test_ois_uncontested_contract_moves_v1.py'
      - 'validation/cb_pricing/history/OIS_SAME_CONTRACT_CONFLICTS_V1.jsonl'
      - 'validation/cb_pricing/test_ois_same_contract_history_v1.py'
      - 'validation/cb_pricing/test_ois_operational_view_v1.py'
      - 'validation/cb_pricing/test_ois_official_runtime_parity_v1.py'
      - 'validation/cb_pricing/build_ois_source_readiness_view_v1.py'
      - 'validation/cb_pricing/audit_ois_source_access_v1.py'
      - 'validation/cb_pricing/test_audit_ois_source_access_v1.py'
      - 'validation/cb_pricing/check_ois_readiness_parity_v1.py'
      - 'validation/cb_pricing/test_check_ois_readiness_parity_v1.py'
      - 'validation/cb_pricing/test_build_ois_source_readiness_view_v1.py'
      - 'validation/cb_pricing/history/OIS_SAME_CONTRACT_QUOTES_V1.jsonl'
      - 'validation/cb_pricing/push_ois_refresh_with_lease_v1.py'
      - 'validation/cb_pricing/test_push_ois_refresh_with_lease_v1.py'
      - 'validation/cb_pricing/build_ois_operational_view_v1.py'
      - 'live_data/sections/CB_PRICING_ESTIMATED_LIVE_QUOTES.json'
      - 'live_data/sections/NZD_CB_PRICING_DIRECTIONAL_PROXY.json'
      - 'validation/cb_pricing/history/OIS_ESTIMATED_SNAPSHOTS_V1.jsonl'
      - '.github/workflows/ois-estimated-snapshot-repricing-v1.yml'
  workflow_run:
    workflows: ['CB Pricing Persistent Daily V1']
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * 1-5'

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ois-estimated-pr-{0}', github.event.pull_request.number) || 'ois-operational-main-writer-v1' }}
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 50
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test safe unattended OIS main-writer lease
        run: python validation/cb_pricing/test_push_ois_refresh_with_lease_v1.py

      - name: Capture base and official runtime fingerprints
        shell: bash
        run: |
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          sha256sum live_data/sections/OIS_DATA.json > /tmp/ois.before.sha256
          sha256sum live_data/sections/NATIVE_CB_DATA.json > /tmp/native.before.sha256

      - name: Collect live secondary USD EUR CHF curves
        run: python validation/cb_pricing/collect_cb_pricing_estimated_live_v1.py

      - name: Collect official ASX NZD directional rates proxy
        run: python validation/cb_pricing/collect_nzd_asx_directional_proxy_v1.py

      - name: Test NZD ASX bank-bill scenario source and frozen research calibration
        run: python validation/cb_pricing/test_nzd_asx_scenario_sensitivity_v2.py

      - name: Audit current NZD 3M/6M/12M bank-bill scenarios (research only)
        continue-on-error: true
        run: |
          python validation/cb_pricing/nzd_asx_scenario_sensitivity_v2.py \
            --output /tmp/nzd-bankbill-scenario-sensitivity-v2.json

      - name: Retain NZD empirical basis-stress receipt, not OIS pricing
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nzd-asx-bankbill-scenario-sensitivity-v2
          path: /tmp/nzd-bankbill-scenario-sensitivity-v2.json
          if-no-files-found: warn
          retention-days: 14

      - name: Quarantine unresolved same-day secondary quote conflicts before pricing
        shell: bash
        run: |
          set -euo pipefail
          python validation/cb_pricing/test_reconcile_ois_secondary_conflicts_v1.py
          python validation/cb_pricing/test_ois_uncontested_contract_moves_v1.py
          python validation/cb_pricing/reconcile_ois_secondary_conflicts_v1.py --write

      - name: Rebuild estimated input and pre-snapshot operational view
        run: |
          python validation/cb_pricing/build_cb_pricing_estimated_v1.py
          python validation/cb_pricing/build_ois_operational_view_v1.py

      - name: Validate same-dated-contract history and existing source evidence
        run: |
          python validation/cb_pricing/test_ois_same_contract_history_v1.py
          python validation/cb_pricing/ois_same_contract_history_v1.py

      - name: Append same-contract bar observations (existing schedule, no new job)
        if: github.event_name != 'pull_request'
        run: python validation/cb_pricing/ois_same_contract_history_v1.py --write

      - name: Audit independently verified clean contracts despite other conflicted tenors
        run: |
          python validation/cb_pricing/ois_uncontested_contract_moves_v1.py \
            --output /tmp/ois-uncontested-tenor-moves-v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/ois-uncontested-tenor-moves-v1.json').read_text())
          assert r['status']=='PASS_RESEARCH_DIAGNOSTIC_NOT_OIS_OR_POLICY_REPRICING'
          assert r['summary']['total_horizons']==9
          assert r['summary']['official_ois_promotions']==0
          assert r['summary']['policy_deltas_computed']==0
          assert r['summary']['fx_signals_computed']==0
          assert not r['writes_live_data'] and not r['writes_history']
          print('OIS_UNCONTESTED_PER_TENOR_RESEARCH_EVIDENCE_PASS',r['summary'])
          PY

      - name: Retain OIS research-only per-contract source-quality receipt
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ois-uncontested-tenor-evidence
          path: /tmp/ois-uncontested-tenor-moves-v1.json
          if-no-files-found: warn
          retention-days: 14

      - name: Record changed estimated snapshots
        if: github.event_name != 'pull_request'
        run: python validation/cb_pricing/ois_estimated_snapshot_v1.py

      - name: Rebuild repricing-aware operational view
        run: python validation/cb_pricing/build_ois_operational_view_v1.py

      - name: Rebuild matching read-only source readiness from this exact OIS view
        run: |
          python validation/cb_pricing/test_audit_ois_source_access_v1.py
          python validation/cb_pricing/audit_ois_source_access_v1.py --output /tmp/ois-estimated-source-audit-v1.json
          python validation/cb_pricing/build_ois_source_readiness_view_v1.py
          python validation/cb_pricing/test_build_ois_source_readiness_view_v1.py
          python validation/cb_pricing/check_ois_readiness_parity_v1.py
          python validation/cb_pricing/test_check_ois_readiness_parity_v1.py

      - name: Self-test and governance checks
        run: |
          python validation/cb_pricing/test_cb_pricing_estimated_v1.py
          python validation/cb_pricing/test_ois_operational_view_v1.py
          python validation/cb_pricing/test_ois_official_runtime_parity_v1.py
          python validation/cb_pricing/check_ois_readiness_parity_v1.py
          python validation/cb_pricing/test_ois_estimated_snapshot_v1.py
          python validation/cb_pricing/test_ois_same_contract_history_v1.py
          sha256sum -c /tmp/ois.before.sha256
          sha256sum -c /tmp/native.before.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('live_data/sections/OIS_OPERATIONAL_VIEW.json').read_text())
          p=json.loads(Path('live_data/sections/NZD_CB_PRICING_DIRECTIONAL_PROXY.json').read_text())
          summary=v['summary']
          assert summary['g8_total']==8
          assert summary['operational_green']+summary['operational_withheld']==8
          assert summary['green_official']+summary['green_estimated']==summary['operational_green']
          assert summary['operational_withheld']==sum(r['operational_status']=='WITHHELD' for r in v['currencies'].values())
          assert v['status']==('PARTIAL_WITHHELD' if summary['operational_withheld'] else 'GREEN_8_OF_8')
          for c in ('USD','EUR','CHF'):
              r=v['currencies'][c]
              if r['operational_status']=='WITHHELD':
                  assert r['backtest_eligible_as_official'] is False, r
                  assert all(r['horizons'][h]['rate'] is None for h in ('3m','6m','12m')), r
                  continue
              assert r['operational_status']=='GREEN_ESTIMATED', r
              assert r['input_mode'] in ('LIVE_SECONDARY_OVERLAY',
                                         'LIVE_SECONDARY_CONFLICT_INDICATIVE'), r
              if r['input_mode']=='LIVE_SECONDARY_CONFLICT_INDICATIVE':
                  assert r['source_conflict_status']=='UNRESOLVED_SECONDARY_SOURCE_SAME_DAY_CONFLICT'
                  assert r['conflicted_source_eligible_for_repricing'] is False
                  assert r['change_1d_available'] is False and r['change_1w_available'] is False
                  assert all(x['policy_delta_bp'] is None and x['change_1d_bp'] is None
                             and x['change_1w_bp'] is None for x in r['horizons'].values())
              assert r['method_id']=='TRADINGVIEW_DATED_FUTURES_SSR_V2', r
              assert r['backtest_eligible_as_official'] is False
              assert r['repricing_reference']['homogeneous_method_required'] is True
              for h in ('3m','6m','12m'):
                  x=r['horizons'][h]
                  assert x['rate'] is not None
                  assert '!' not in str(x.get('contract')), x
                  assert '!' not in str(x.get('symbol')), x
                  assert 'change_1d_bp' in x and 'change_1w_bp' in x
          n=v['currencies']['NZD']
          assert n['operational_status'] in ('WITHHELD','GREEN_OFFICIAL','GREEN_ESTIMATED')
          if n['operational_status']=='WITHHELD':
              assert n['backtest_eligible_as_official'] is False
              assert all(n['horizons'][h]['rate'] is None for h in ('3m','6m','12m')), n
          else:
              assert all(n['horizons'][h]['rate'] is not None for h in ('3m','6m','12m')), n
              assert n['backtest_eligible_as_official'] is (n['operational_status']=='GREEN_OFFICIAL')
          proxy=n['market_direction_proxy']
          assert proxy['status']=='LIVE_DIRECTIONAL_PROXY_READY', proxy
          assert proxy['substitutes_for_ois_level'] is False, proxy
          assert proxy['policy_delta_from_proxy_allowed'] is False, proxy
          assert p['governance']['substitutes_for_ois_level'] is False
          assert p['governance']['policy_delta_from_proxy_allowed'] is False
          for h in ('3m','6m','12m'):
              x=proxy['horizons'][h]
              assert x['implied_bank_bill_rate'] is not None, x
              assert 'change_1d_bp' in x and 'change_1w_bp' in x
          print('OIS_ESTIMATED_REPRICING_GOVERNANCE_PASS')
          PY
          git diff --exit-code -- live_data/sections/OIS_DATA.json live_data/sections/NATIVE_CB_DATA.json

      - name: Persist operational history and view on main with bounded safe rebase
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python validation/cb_pricing/push_ois_refresh_with_lease_v1.py \
            --base-sha "$BASE_SHA" --mode estimated --attempts 4
