name: Liquidity BoC CAD SLOS Apply Proof V1

on:
  push:
    branches:
      - release-candidate-daily-data-orchestrator-v1-2026-10-12
    paths:
      - 'validation/fetch_boc_cad_slos_conditions_candidate.py'
      - 'validation/apply_boc_cad_slos_conditions_candidate.py'
      - '.github/workflows/liquidity-boc-cad-slos-apply-proof-v1.yml'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot tracked runtime
        run: sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/runtime.before.sha256
      - name: Collect official BoC CAD SLOS candidate
        run: python validation/fetch_boc_cad_slos_conditions_candidate.py --out /tmp/cad-slos-candidate.json
      - name: Dry-run controlled applier
        run: python validation/apply_boc_cad_slos_conditions_candidate.py --candidate /tmp/cad-slos-candidate.json | tee /tmp/cad-slos-dry.json
      - name: Apply on ephemeral runtime copy
        run: |
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/runtime-copy.json
          python validation/apply_boc_cad_slos_conditions_candidate.py --candidate /tmp/cad-slos-candidate.json --runtime /tmp/runtime-copy.json --apply | tee /tmp/cad-slos-apply.json
      - name: Verify append-only CAD SLOS contract
        run: |
          python - <<'PY'
          import json
          before=json.load(open('live_data/sections/NATIVE_LIQ_DATA.json'))
          after=json.load(open('/tmp/runtime-copy.json'))
          cand=json.load(open('/tmp/cad-slos-candidate.json'))
          dry=json.load(open('/tmp/cad-slos-dry.json'))
          applied=json.load(open('/tmp/cad-slos-apply.json'))
          assert cand['schema']=='GMFQ_LIQUIDITY_CAD_SLOS_CONDITIONS_CANDIDATE_V1', cand
          assert cand['source']['series_id']=='SLOS_BUS_LEND', cand
          p=cand['proof']
          assert p['overlap_count']==42 and p['exact_match_count']==42 and p['exact_match_ratio']==1.0, p
          assert p['runtime_history_unchanged_by_current_vintage'] is True, p
          assert p['identity_transform'] is True, p
          b=before['CAD']['conditions']; a=after['CAD']['conditions']
          assert a['dates'][:len(b['dates'])]==b['dates']
          assert a['values'][:len(b['values'])]==b['values']
          assert len(a['dates'])==len(b['dates'])+len(cand['new_observations'])
          assert len(a['values'])==len(a['dates'])
          assert dry['runtime_history_rewritten'] is False
          assert applied['runtime_history_rewritten'] is False
          assert applied['publication_performed'] is False
          print('CAD_SLOS_LATEST', cand['latest_date'], cand['latest_value'])
          print('CAD_SLOS_NEW_OBSERVATIONS', cand['new_observations'])
          print('CAD_SLOS_APPLY_STATUS', applied['status'])
          PY
      - name: Verify tracked runtime unchanged
        run: |
          sha256sum -c /tmp/runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
