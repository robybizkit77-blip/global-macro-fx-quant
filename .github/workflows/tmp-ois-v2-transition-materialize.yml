name: TMP OIS V2 Transition Materialize

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-ois-v2-transition-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-ois-specific-contracts-v2-2026-10-15
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate exact V2 state
        run: |
          python validation/cb_pricing/collect_cb_pricing_estimated_live_v1.py
          python validation/cb_pricing/build_cb_pricing_estimated_v1.py
          python validation/cb_pricing/build_ois_operational_view_v1.py
      - name: Validate transition state
        run: |
          python - <<'PY'
          import json
          e=json.load(open('live_data/sections/CB_PRICING_ESTIMATED.json'))
          v=json.load(open('live_data/sections/OIS_OPERATIONAL_VIEW.json'))
          assert v['summary']=={'g8_total':8,'operational_green':8,'green_official':4,'green_estimated':4,'operational_withheld':0}
          for c in ('USD','EUR','CHF'):
              assert e['currencies'][c]['method_id']=='TRADINGVIEW_DATED_FUTURES_SSR_V2'
              assert v['currencies'][c]['method_id']=='TRADINGVIEW_DATED_FUTURES_SSR_V2'
              assert v['currencies'][c]['change_1d_available'] is False
              assert v['currencies'][c]['change_1w_available'] is False
              for h in ('3m','6m','12m'):
                  x=e['currencies'][c]['horizons'][h]
                  assert '!' not in str(x.get('contract')), (c,h,x)
                  assert '!' not in str(x.get('symbol')), (c,h,x)
          assert e['currencies']['EUR']['horizons']['6m']['contract']=='FST3Z2026'
          assert e['currencies']['EUR']['horizons']['6m']['rate']==2.715
          print('OIS_V2_TRANSITION_STATE_PASS')
          PY
      - name: Persist generated snapshots to PR branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live_data/sections/CB_PRICING_ESTIMATED_LIVE_QUOTES.json \
                  live_data/sections/CB_PRICING_ESTIMATED.json \
                  live_data/sections/OIS_OPERATIONAL_VIEW.json
          if git diff --cached --quiet; then
            echo 'Transition snapshots already aligned.'
            exit 0
          fi
          git commit -m 'Materialize corrected dated-futures OIS V2 snapshots'
          git push origin HEAD:fix-ois-specific-contracts-v2-2026-10-15
