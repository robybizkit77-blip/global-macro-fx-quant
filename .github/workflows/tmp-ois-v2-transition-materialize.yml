name: TMP OIS V2 Transition Materialize

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-ois-v2-transition-materialize.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate V2 state
        run: |
          python validation/cb_pricing/collect_cb_pricing_estimated_live_v1.py
          python validation/cb_pricing/build_cb_pricing_estimated_v1.py
          python validation/cb_pricing/build_ois_operational_view_v1.py
      - name: Emit exact transition JSON
        run: |
          python - <<'PY'
          import json
          paths=[
            'live_data/sections/CB_PRICING_ESTIMATED_LIVE_QUOTES.json',
            'live_data/sections/CB_PRICING_ESTIMATED.json',
            'live_data/sections/OIS_OPERATIONAL_VIEW.json',
          ]
          for p in paths:
              print('GMFQ_BEGIN', p)
              print(json.dumps(json.load(open(p)), ensure_ascii=False, sort_keys=True, separators=(',', ':')))
              print('GMFQ_END', p)
          PY
