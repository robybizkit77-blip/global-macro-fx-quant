name: Price ECB Browser Audit

on:
  push:
    branches:
      - staging-price-ecb-2026-09-30
  workflow_dispatch:

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright package
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/gmfq-server.log 2>&1 &
          sleep 2
      - name: Verify ECB price runtime
        run: |
          cat > browser-audit.js <<'EOF'
          const { chromium }=require('playwright');
          const { execSync }=require('child_process');
          (async()=>{
            const chromePath=execSync('command -v google-chrome-stable || command -v google-chrome || command -v chromium').toString().trim();
            const browser=await chromium.launch({headless:true,executablePath:chromePath,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            const consoleErrors=[], pageErrors=[], httpErrors=[];
            page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('response',r=>{if(r.status()>=400) httpErrors.push({status:r.status(),url:r.url()})});
            const res=await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle',timeout:120000});
            if(!res?.ok()) throw new Error('HTTP load failed');
            await page.waitForFunction(()=>document.documentElement.getAttribute('data-ecb-price-audit'),null,{timeout:120000});
            const x=await page.evaluate(()=>({
              priceAudit:window.GMFQ_ECB_PRICE_AUDIT||null,
              finalAudit:window.GMFQ_POST_GATE_FINAL_AUDIT||null,
              last:D.prices.at(-1)||null,
              pairCount:D.pairs?.length||0,
              consistency:typeof canonicalConsistencyQa==='function'?canonicalConsistencyQa():null,
              viewQa:typeof canonicalViewQa==='function'?canonicalViewQa():null,
              priceFresh:window.DATA_FRESHNESS_REGISTRY?.PRICE||null,
              sourcePrice:window.FINAL_SOURCE_POLICY_AUDIT?.PRICE||window.FINAL_SOURCE_POLICY_AUDIT?.price||null,
              freshnessIntegrity:typeof freshnessRegistryIntegrity==='function'?freshnessRegistryIntegrity():null,
              health:typeof productionHealthCheck==='function'?productionHealthCheck():null
            }));
            console.log(JSON.stringify({x,consoleErrors,pageErrors,httpErrors},null,2));
            const exp={Date:'2026-09-30',EUR:1,USD:1.1355,GBP:0.85463,JPY:178.27,CHF:0.9478,CAD:1.6105,AUD:1.6297,NZD:2.0115};
            if(x.priceAudit?.status!=='PASS') throw new Error('Price audit not PASS');
            for(const [k,v] of Object.entries(exp)){
              if(k==='Date'){ if(x.last?.[k]!==v) throw new Error('Date mismatch'); }
              else if(Math.abs(Number(x.last?.[k])-v)>1e-10) throw new Error(k+' mismatch '+x.last?.[k]);
            }
            if(x.pairCount!==28) throw new Error('Pair count '+x.pairCount);
            if(x.consistency?.ok!==true) throw new Error('Canonical consistency fail '+JSON.stringify(x.consistency));
            if(x.viewQa?.ok!==true) throw new Error('Canonical view fail '+JSON.stringify(x.viewQa));
            if(x.priceFresh?.as_of!=='2026-09-30') throw new Error('Price freshness stale');
            if(x.sourcePrice?.current_as_of!=='2026-09-30') throw new Error('Source registry stale');
            if(x.finalAudit?.status!=='PASS') throw new Error('Final audit not PASS');
            if(x.freshnessIntegrity?.ok!==true) throw new Error('Freshness integrity fail '+JSON.stringify(x.freshnessIntegrity));
            const dataHard=(x.health?.hard_errors||[]).filter(e=>/FRESHNESS_DESYNC|PAIR_|STATE_MISSING|NARRATIVE_DATA_MISSING|MISSING_NATIVE|MISSING_CB_|MISSING_CORE_MACRO_BLOCK/.test(String(e)));
            if(dataHard.length) throw new Error('Data health hard errors '+JSON.stringify(dataHard));
            const nonBenignHttp=httpErrors.filter(e=>!String(e.url).endsWith('/favicon.ico'));
            const nonBenignConsole=consoleErrors.filter(e=>!String(e).includes('404'));
            if(nonBenignHttp.length||nonBenignConsole.length||pageErrors.length) throw new Error('Browser errors '+JSON.stringify({nonBenignHttp,nonBenignConsole,pageErrors}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node browser-audit.js
