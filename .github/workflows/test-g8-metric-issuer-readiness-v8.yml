name: G8 Exact Macro Metric and BLS CPI Preflight V8

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/macro/g8_metric_issuer_contract_v8.py'
      - 'validation/macro/preflight_us_cpi_official_actual_v8.py'
      - 'validation/macro/capture_us_cpi_exact_actuals_v10.py'
      - 'validation/macro/build_us_cpi_desk_research_note_v13.py'
      - 'validation/macro/test_build_us_cpi_desk_research_note_v13.py'
      - 'validation/macro/verify_bls_archived_issuer_replay_v12.py'
      - 'validation/macro/capture_uk_ch_gdp_official_firstseen_v11.py'
      - 'validation/macro/test_capture_uk_ch_gdp_firstseen_v11.py'
      - 'validation/macro/MACRO_UK_CH_GDP_OFFICIAL_FIRST_SEEN_V11.jsonl'
      - 'validation/macro/test_capture_us_cpi_exact_actuals_v10.py'
      - 'validation/macro/MACRO_BLS_CPI_EXACT_ACTUAL_FIRST_SEEN_V10.jsonl'
      - 'validation/macro/freeze_exact_metric_forecasts_v9.py'
      - 'validation/macro/test_freeze_exact_metric_forecasts_v9.py'
      - 'validation/macro/MACRO_EXACT_METRIC_FORECAST_FIRST_SEEN_V9.jsonl'
      - 'validation/macro/test_g8_metric_issuer_readiness_v8.py'
      - 'validation/macro/build_g8_macro_event_lifecycle_v7.py'
      - 'validation/macro/freeze_pre_release_consensus_v1.py'
      - 'validation/refresh_macro_consensus_secondary_v1.py'
      - '.github/workflows/calendar-news-operational-refresh-v1.yml'
      - '.github/workflows/test-g8-metric-issuer-readiness-v8.yml'
  push:
    branches: [main]
    paths:
      - 'validation/macro/g8_metric_issuer_contract_v8.py'
      - 'validation/macro/preflight_us_cpi_official_actual_v8.py'
      - 'validation/macro/capture_us_cpi_exact_actuals_v10.py'
      - 'validation/macro/build_us_cpi_desk_research_note_v13.py'
      - 'validation/macro/test_build_us_cpi_desk_research_note_v13.py'
      - 'validation/macro/verify_bls_archived_issuer_replay_v12.py'
      - 'validation/macro/capture_uk_ch_gdp_official_firstseen_v11.py'
      - 'validation/macro/test_capture_uk_ch_gdp_firstseen_v11.py'
      - 'validation/macro/MACRO_UK_CH_GDP_OFFICIAL_FIRST_SEEN_V11.jsonl'
      - 'validation/macro/test_capture_us_cpi_exact_actuals_v10.py'
      - 'validation/macro/MACRO_BLS_CPI_EXACT_ACTUAL_FIRST_SEEN_V10.jsonl'
      - 'validation/macro/freeze_exact_metric_forecasts_v9.py'
      - 'validation/macro/test_freeze_exact_metric_forecasts_v9.py'
      - 'validation/macro/MACRO_EXACT_METRIC_FORECAST_FIRST_SEEN_V9.jsonl'
      - 'validation/macro/test_g8_metric_issuer_readiness_v8.py'
      - 'validation/macro/build_g8_macro_event_lifecycle_v7.py'
      - 'validation/macro/freeze_pre_release_consensus_v1.py'
      - 'validation/refresh_macro_consensus_secondary_v1.py'
      - '.github/workflows/test-g8-metric-issuer-readiness-v8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-metric-and-source-clock-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test old signed forecasts, V7 and explicit metric preflight V8
        run: |
          python -m unittest \
            validation.macro.test_freeze_pre_release_consensus_v1 \
            validation.macro.test_build_g8_macro_event_lifecycle_v7 \
            validation.macro.test_g8_metric_issuer_readiness_v8 \
            validation.macro.test_freeze_exact_metric_forecasts_v9 \
            validation.macro.test_capture_us_cpi_exact_actuals_v10 \
            validation.macro.test_build_us_cpi_desk_research_note_v13 \
            validation.macro.test_capture_uk_ch_gdp_firstseen_v11 -v
      - name: Run offline BLS source gate with no HTTP or model writes
        run: |
          python -m validation.macro.preflight_us_cpi_official_actual_v8 \
            --output /tmp/g8-us-cpi-preflight-v8.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/g8-us-cpi-preflight-v8.json'))
          assert x['status'] in {
            'BEFORE_RELEASE_NO_HTTP','HTTP_DISABLED_NO_ACTUAL_OBSERVED',
            'OUTSIDE_FIRST_OBSERVATION_REVIEW_WINDOW_NO_HTTP'
          },x
          assert x['actual_pct'] is None
          assert x['surprise_pp'] is None and x['fx_signal'] is None
          assert x['source_first_publication_PIT_verified'] is False
          print('G8_METRIC_V8_OFFLINE_CONTRACT_PASS')
          PY
      - name: Replay archived official BLS CPI HTML when accessible
        shell: bash
        run: |
          set -euo pipefail
          python -m validation.macro.verify_bls_archived_issuer_replay_v12 \
            | tee /tmp/g8-bls-cpi-real-september-archive-replay.json
          python - <<'PY'
          import json,os
          r=json.load(open('/tmp/g8-bls-cpi-real-september-archive-replay.json'))
          assert r['status'] in {
            'HISTORICAL_BLS_ARCHIVE_FOUR_EXACT_ACTUALS_VERIFIED',
            'HISTORICAL_BLS_ARCHIVE_HTTP_UNAVAILABLE_NO_VALIDATION_CLAIM'
          },r
          assert r['October_2026_actual_observed'] is False
          if not r['verified_historical_issuer_html']:
              print('::warning::BLS historical archive HTTP unavailable; real issuer parser NOT verified')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fp:
              fp.write('### Historical BLS CPI release HTML regression\n')
              fp.write('- '+r['status']+'\n')
              fp.write('- This is September data for parser validation only, not October actuals.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: g8-exact-metric-bls-cpi-preflight-v8
          path: |
            /tmp/g8-us-cpi-preflight-v8.json
            /tmp/g8-bls-cpi-real-september-archive-replay.json
          retention-days: 14
      - name: No operational payload changed
        run: test -z "$(git status --porcelain -- live_data site payload)"
