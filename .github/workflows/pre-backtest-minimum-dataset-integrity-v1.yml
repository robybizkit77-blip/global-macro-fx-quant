name: Pre Backtest Minimum Dataset Integrity V1

on:
  push:
    branches:
      - audit-minimum-robust-pit-dataset-2026-10-06
    paths:
      - 'validation/pre_backtest_minimum_dataset_integrity.py'
      - '.github/workflows/pre-backtest-minimum-dataset-integrity-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen dataset integrity gate
        run: python validation/pre_backtest_minimum_dataset_integrity.py
      - name: Confirm runtime and engine untouched
        run: |
          git diff --exit-code -- live_data
          test -z "$(git status --porcelain | grep -E '^(.. )?(live_data/|.*engine.*)' || true)"
      - name: Commit integrity evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/PRE_BACKTEST_MINIMUM_DATASET_INTEGRITY_2026-10-06.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record minimum PIT dataset pre-backtest integrity PASS'
          git push
