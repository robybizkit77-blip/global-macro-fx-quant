name: TEMP USD Inflation Split Repair

on:
  push:
    branches:
      - 'validation-macro-usd-inflation-split-pit-2026-10-09'
    paths:
      - '.github/workflows/temp-usd-inflation-split-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch USD split candidate and date-keyed heatmap tail
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy,json
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              assert n==1,(path,n,old[:100])
              p.write_text(s.replace(old,new,1))

          adapter='validation/sources/us_bls_core_macro.py'
          replace_once(adapter,
'''    cpi_yoy = yoy_from_index(cpi_index)
    if len(labour) < 2:
''',
'''    cpi_yoy = yoy_from_index(cpi_index)
    cpi_index_by_date = dict(cpi_index)
    if len(labour) < 2:
''')
          replace_once(adapter,
'''            "value": latest_inf[1],
            "source": inf_source,
''',
'''            "value": latest_inf[1],
            "series_value": cpi_index_by_date[latest_inf[0]],
            "series_unit": "Index 1982-1984=100",
            "source": inf_source,
''')
          replace_once(adapter,
'''            "prior_value": prior_inf[1] if prior_inf else None,
            "calculation": "100 * (CUSR0000SA0_t / CUSR0000SA0_t-12 - 1)",
''',
'''            "prior_value": prior_inf[1] if prior_inf else None,
            "latest_index": cpi_index_by_date[latest_inf[0]],
            "prior_year_index": cpi_index_by_date[f"{int(latest_inf[0][:4])-1:04d}-{latest_inf[0][5:7]}"],
            "calculation": "100 * (CUSR0000SA0_t / CUSR0000SA0_same_month_prior_year - 1)",
''')

          sp=Path('live_data/sections/MACRO_SERIES.json')
          hp=Path('live_data/sections/MACRO_THERMOMETER_DATA.json')
          series=json.loads(sp.read_text()); before_series=copy.deepcopy(series)
          heat=json.loads(hp.read_text()); before_heat=copy.deepcopy(heat)
          row=next(r for r in series['USD'] if r.get('id')=='US_CPIAUCSL_history_value')
          dates=[str(x)[:7] for x in row['dates']]; vals=[float(x) for x in row['values']]
          by=dict(zip(dates,vals))
          assert row['last_date'][:7]=='2026-08' and abs(float(row['last_value'])-334.131)<1e-12
          assert '2025-10' not in by

          keyed=[]
          for d,v in zip(dates,vals):
              y,m=map(int,d.split('-')); prior=f'{y-1:04d}-{m:02d}'
              if prior in by:
                  keyed.append((d,(v/by[prior]-1.0)*100.0))
          repair=[(d,v) for d,v in keyed if d>='2025-11']
          assert [d for d,_ in repair]==['2025-11','2025-12','2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07','2026-08'],repair

          h=heat['currencies']['USD']['inflation']; hist=[float(x) for x in h['history']]
          assert len(hist)==120
          expected_old=[2.9883,3.002262,2.82868,2.664589,3.320206,3.947027,4.270033,3.72653,3.539751,3.712958]
          assert all(abs(a-b)<1e-6 for a,b in zip(hist[-10:],expected_old)),hist[-10:]
          hist[-10:]=[v for _,v in repair]
          h['history']=hist
          h['latest_value']=hist[-1]
          h['as_of']='2026-08-01'
          heat['currencies']['USD'].setdefault('as_of_detail',{})['inflation']='2026-08-01'

          below=sum(1 for x in hist if x < hist[-1]); equal=sum(1 for x in hist if x == hist[-1])
          pct=round(100.0*(below+0.5*equal)/len(hist),1)
          h['percentile']=pct; h['temperature_score']=pct
          label=None
          for t in heat['thresholds']:
              lo,hi=float(t['min']),float(t['max'])
              if lo <= pct < hi or (pct==100.0 and hi==100.0): label=str(t['label']); break
          assert label is not None
          h['temperature_label']=label
          d=hist[-1]-hist[-2]
          h['direction']='SALE' if d>1e-12 else 'SCENDE' if d<-1e-12 else 'STABILE'
          d1=hist[-2]-hist[-3]; d2=hist[-1]-hist[-2]; dd=d2-d1
          h['acceleration']='ACCELERA' if dd>1e-12 else 'RALLENTA' if dd<-1e-12 else 'STABILE'

          assert series==before_series,'raw MACRO_SERIES must remain byte-semantically unchanged'
          for c in heat['currencies']:
              if c!='USD': assert heat['currencies'][c]==before_heat['currencies'][c],c
          for dim in heat['currencies']['USD']:
              if dim not in ('inflation','as_of_detail'):
                  assert heat['currencies']['USD'][dim]==before_heat['currencies']['USD'][dim],dim
          old_detail=before_heat['currencies']['USD'].get('as_of_detail',{}); new_detail=heat['currencies']['USD'].get('as_of_detail',{})
          for k,v in old_detail.items():
              if k!='inflation': assert new_detail.get(k)==v,(k,new_detail.get(k),v)

          hp.write_text(json.dumps(heat,ensure_ascii=False,separators=(',',':'))+'\n')
          print(json.dumps({'status':'PASS','repair':repair,'latest':h['latest_value'],'percentile':pct,'temperature':label,'direction':h['direction'],'acceleration':h['acceleration']},indent=2))
          PY
          mkdir -p /tmp/usd-split-repair
          python3 validation/sources/us_bls_core_macro.py --output-dir /tmp/usd-split-repair
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/usd-split-repair/inflation-candidate.json').read_text())
          assert c['observation_date'][:7]=='2026-08'
          assert abs(float(c['value'])-3.353016322755642)<1e-9,c
          assert abs(float(c['series_value'])-334.131)<1e-12,c
          assert c['series_unit']=='Index 1982-1984=100'
          print(json.dumps({'status':'USD_SPLIT_CANDIDATE_PASS','candidate':c},indent=2))
          PY
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = $'live_data/sections/MACRO_THERMOMETER_DATA.json\nvalidation/sources/us_bls_core_macro.py'
      - name: Commit bounded USD inflation repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live_data/sections/MACRO_THERMOMETER_DATA.json validation/sources/us_bls_core_macro.py
          git commit -m 'Repair USD inflation date-keyed YoY heatmap'
          git push origin HEAD:validation-macro-usd-inflation-split-pit-2026-10-09
