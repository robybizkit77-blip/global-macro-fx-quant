name: TEMP USD Inflation Split Repair

on:
  push:
    branches:
      - 'validation-macro-usd-inflation-split-pit-2026-10-09'
    paths:
      - '.github/workflows/temp-usd-inflation-split-repair.yml'
      - 'validation/temp_usd_inflation_split_repair.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded USD inflation split repair
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/temp_usd_inflation_split_repair.py
          mkdir -p /tmp/usd-split-repair
          python3 validation/sources/us_bls_core_macro.py --output-dir /tmp/usd-split-repair
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/usd-split-repair/inflation-candidate.json').read_text())
          assert c['observation_date'][:7]=='2026-08'
          assert abs(float(c['value'])-3.353016322755642)<1e-9,c
          assert abs(float(c['series_value'])-334.131)<1e-12,c
          assert c['series_unit']=='Index 1982-1984=100'
          print(json.dumps({'status':'USD_SPLIT_CANDIDATE_PASS','candidate':c},indent=2))
          PY
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = $'live_data/sections/MACRO_THERMOMETER_DATA.json\nvalidation/sources/us_bls_core_macro.py'
      - name: Commit bounded USD inflation repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live_data/sections/MACRO_THERMOMETER_DATA.json validation/sources/us_bls_core_macro.py
          git commit -m 'Repair USD inflation date-keyed YoY heatmap'
          git push origin HEAD:validation-macro-usd-inflation-split-pit-2026-10-09
