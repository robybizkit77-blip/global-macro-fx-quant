name: USD CPI Revised SA Index Files Transport V1

on:
  push:
    branches:
      - validation-usd-cpi-release-archive-transport-v1-2026-10-11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official revised SA index workbooks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/usd-cpi-revised-sa
          python validation/macro/probe_usd_cpi_revised_sa_indexes_transport_v1.py \
            --output /tmp/usd-cpi-revised-sa/result.json
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usd-cpi-revised-sa-index-files-${{ github.run_id }}
          path: /tmp/usd-cpi-revised-sa/
          retention-days: 90
