name: Rates Desk Operational UI Gate V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'payload/part-07.txt'
      - 'validation/rates/test_v233_rates_source_age_guard_v1.js'
      - 'dashboard/ratesdesk-operational-v1.js'
      - 'validation/ui/DASHBOARD_UI_OWNERSHIP_REGISTRY_V1_2026-10-15.json'
      - '.github/workflows/ratesdesk-operational-ui-gate-v1.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'payload/part-07.txt'
      - 'validation/rates/test_v233_rates_source_age_guard_v1.js'
      - 'dashboard/ratesdesk-operational-v1.js'
      - 'validation/ui/DASHBOARD_UI_OWNERSHIP_REGISTRY_V1_2026-10-15.json'
      - '.github/workflows/ratesdesk-operational-ui-gate-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce live-source age and historic-no-FX Rates labels
        run: node validation/rates/test_v233_rates_source_age_guard_v1.js
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start dashboard
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/ratesdesk-operational-ui.log 2>&1 &
          sleep 2
      - name: Verify Rates Desk desktop mobile
        run: |
          cat > ratesdesk-operational-gate.js <<'EOF'
          const { chromium } = require('playwright');
          const CCYS=['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];
          async function run(viewport,label){
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport});
            const consoleErrors=[],pageErrors=[];
            page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>window.GMFQ_RATESDESK_OPERATIONAL?.status==='ACTIVE',null,{timeout:120000});
            const state=await page.evaluate(()=>window.gmfqRatesDeskOperationalAudit?.());
            if(state?.schema!=='GMFQ_RATESDESK_OPERATIONAL_UI_V1'||state?.status!=='ACTIVE'||state?.core_effect!=='NONE') throw new Error(label+' bad Rates state '+JSON.stringify(state));
            if(state.owner_count!==1||state.ois_owner_count!==1) throw new Error(label+' owner count drift '+JSON.stringify(state));
            if(state.coverage!==8||new Set(state.currencies||[]).size!==8) throw new Error(label+' G8 selector coverage '+JSON.stringify(state.currencies));
            if(state.timing_integrity?.ok!==true||state.basis_integrity?.ok!==true||state.visible_integrity?.ok!==true) throw new Error(label+' canonical integrity '+JSON.stringify(state));
            for(const c of CCYS){const r=state.rates2y?.[c];if(!r?.last_date||r.last_value==null) throw new Error(label+' missing 2Y '+c+' '+JSON.stringify(r));}
            await page.evaluate(()=>window.showView?.('ratesdesk'));
            for(const wanted of ['USD','EUR','CHF','CAD']){
              const ok=await page.evaluate(w=>{const b=document.querySelector(`#v233CurrencyCards .v233CurrencyCard[data-c="${w}"]`);if(!b)return false;b.click();return true;},wanted);
              if(!ok) throw new Error(label+' missing Rates selector '+wanted);
              await page.waitForTimeout(180);
              const country=await page.evaluate(()=>String(document.getElementById('v233CountryName')?.textContent||''));
              if(!country.includes(wanted)) throw new Error(label+' Rates selector/title desync '+wanted+' '+country);
              const visible=await page.evaluate(()=>window.visibleRatesSnapshotIntegrity?.());
              if(visible?.ok!==true) throw new Error(label+' visible integrity after '+wanted+' '+JSON.stringify(visible));
            }
            const runtimeErr=/\b[A-Za-z_$][\w$]*\s+is\s+not\s+defined\b|ReferenceError/i;
            if(consoleErrors.some(x=>runtimeErr.test(x))||pageErrors.some(x=>runtimeErr.test(x))) throw new Error(label+' runtime scope error '+consoleErrors.concat(pageErrors).join(' | '));
            await browser.close();
            console.log(label,'RATESDESK_OPERATIONAL_UI_PASS');
          }
          (async()=>{await run({width:1440,height:1100},'desktop');await run({width:390,height:844},'mobile');console.log('RATESDESK_OPERATIONAL_UI_GATE_V1 PASS');})().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node ratesdesk-operational-gate.js
