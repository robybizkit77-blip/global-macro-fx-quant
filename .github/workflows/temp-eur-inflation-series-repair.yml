name: TEMP EUR Inflation Series Repair

on:
  push:
    branches:
      - 'validation-macro-eur-inflation-pit-bootstrap-2026-10-09'
    paths:
      - '.github/workflows/temp-eur-inflation-series-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append only September EUR inflation flash observation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('live_data/sections/MACRO_SERIES.json')
          doc=json.loads(p.read_text())
          rows=[r for r in doc['EUR'] if r.get('id')=='EA_HICP_HEADLINE_YOY_history_value']
          assert len(rows)==1
          r=rows[0]
          assert r['dates'][-1]=='2026-08' and float(r['values'][-1])==3.2
          assert r.get('last_date')=='2026-08' and float(r.get('last_value'))==3.2
          assert '2026-09' not in r['dates']
          r['dates'].append('2026-09'); r['values'].append(3.8)
          r['last_date']='2026-09'; r['last_value']=3.8
          p.write_text(json.dumps(doc,ensure_ascii=False,separators=(',',':'))+'\n')
          heat=json.loads(Path('live_data/sections/MACRO_THERMOMETER_DATA.json').read_text())['currencies']['EUR']['inflation']
          assert heat['as_of'][:7]=='2026-09' and float(heat['latest_value'])==3.8 and float(heat['history'][-1])==3.8
          PY
          git diff --check
          test "$(git diff --name-only)" = 'live_data/sections/MACRO_SERIES.json'
      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live_data/sections/MACRO_SERIES.json
          git commit -m 'Align EUR inflation series with September flash estimate'
          git push origin HEAD:validation-macro-eur-inflation-pit-bootstrap-2026-10-09
