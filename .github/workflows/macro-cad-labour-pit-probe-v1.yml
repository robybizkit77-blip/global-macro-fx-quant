name: Macro CAD Labour PIT Probe V1

on:
  push:
    branches:
      - 'validation-macro-cad-labour-pit-bootstrap-*'
    paths:
      - '.github/workflows/macro-cad-labour-pit-probe-v1.yml'
      - 'validation/sources/cad_statcan_core.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official Statistics Canada labour and canonical runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cad-labour-probe
          python3 validation/sources/cad_statcan_core.py \
            --dimension labour \
            --output /tmp/cad-labour-probe/candidate.json \
            --audit-output /tmp/cad-labour-probe/source-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/cad-labour-probe/candidate.json').read_text())
          a=json.loads(Path('/tmp/cad-labour-probe/source-audit.json').read_text())
          ms=json.loads(Path('live_data/sections/MACRO_SERIES.json').read_text())
          row=[r for r in ms['CAD'] if r.get('id')==c['macro_series_id']][0]
          heat=json.loads(Path('live_data/sections/MACRO_THERMOMETER_DATA.json').read_text())['currencies']['CAD']['labour']
          print(json.dumps({
            'candidate':c,
            'audit':a,
            'canonical_tail':list(zip(row['dates'][-8:],row['values'][-8:])),
            'canonical_last_date':row.get('last_date'),
            'canonical_last_value':row.get('last_value'),
            'heatmap_tail':heat.get('history',[])[-8:],
            'heatmap_latest_value':heat.get('latest_value'),
            'heatmap_as_of':heat.get('as_of'),
            'heatmap_series_id':heat.get('series_id'),
            'heatmap_frequency':heat.get('frequency'),
            'heatmap_transformation':heat.get('transformation')
          },indent=2))
          assert a['candidate_only'] is True and a['live_data_written'] is False
          assert a['seasonal_adjustment']=='seasonally adjusted'
          assert c['observation_date'][:7]=='2026-08' and float(c['value'])==6.4
          assert a['prior_period'][:7]=='2026-07' and float(a['prior_value'])==6.4
          assert row['last_date']=='2026-08' and float(row['last_value'])==6.4
          assert heat['as_of']=='2026-08' and float(heat['latest_value'])==6.4
          assert heat['series_id']=='CA_UNEMP_RATE' and heat['frequency']=='M' and heat['transformation']=='level'
          PY
          git diff --exit-code -- live_data
