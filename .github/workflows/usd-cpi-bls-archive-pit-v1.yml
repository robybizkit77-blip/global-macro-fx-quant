name: USD CPI BLS Archive PIT V1
on:
  push:
    branches: [audit-minimum-robust-pit-dataset-2026-10-06]
    paths:
      - 'validation/materialize_us_cpi_bls_archive_v1.py'
      - '.github/workflows/usd-cpi-bls-archive-pit-v1.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-minimum-robust-pit-dataset-2026-10-06
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize USD CPI PIT from BLS archive
        run: python validation/materialize_us_cpi_bls_archive_v1.py
      - name: Strict engine/live-data guard
        run: git diff --exit-code HEAD~1 -- engine live_data
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history/pit_v1/USD_CPI_HEADLINE_CORE_FIRST_RELEASE_2016_2026.csv validation/USD_CPI_BLS_ARCHIVE_PIT_MATERIALIZATION_2026-10-06.json
          git diff --cached --quiet || git commit -m 'Add USD CPI BLS archive PIT evidence'
          git pull --rebase origin audit-minimum-robust-pit-dataset-2026-10-06
          git push origin HEAD:audit-minimum-robust-pit-dataset-2026-10-06
