name: TEMP AUD Inflation Contract Repair Apply

on:
  push:
    branches:
      - 'validation-macro-aud-inflation-contract-repair-2026-10-09'
    paths:
      - '.github/workflows/temp-aud-inflation-contract-repair-apply.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit canonical AUD quarterly CPI against ABS Table 17
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, io, urllib.request, zipfile
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta
          from decimal import Decimal, ROUND_HALF_UP
          from pathlib import Path

          url='https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/consumer-price-index-australia/jun-2026/6401017.xlsx'
          data=urllib.request.urlopen(url,timeout=30).read()
          NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main'; RNS='http://schemas.openxmlformats.org/officeDocument/2006/relationships'
          z=zipfile.ZipFile(io.BytesIO(data)); ns={'m':NS,'r':RNS}
          shared=[]
          if 'xl/sharedStrings.xml' in z.namelist():
            sr=ET.fromstring(z.read('xl/sharedStrings.xml'))
            shared=[''.join(t.text or '' for t in si.iter(f'{{{NS}}}t')) for si in sr.findall('m:si',ns)]
          wb=ET.fromstring(z.read('xl/workbook.xml')); rr=ET.fromstring(z.read('xl/_rels/workbook.xml.rels'))
          rels={e.attrib['Id']:e.attrib['Target'] for e in rr}
          sh=next(x for x in wb.find('m:sheets',ns) if x.attrib['name']=='Data1')
          target=rels[sh.attrib[f'{{{RNS}}}id']]
          root=ET.fromstring(z.read('xl/'+target))
          obs=[]
          for row in root.findall('.//m:sheetData/m:row',ns):
            rn=row.attrib['r']; cells={}
            for c in row.findall('m:c',ns):
              ref=c.attrib.get('r',''); typ=c.attrib.get('t'); v=c.find('m:v',ns); val=None if v is None else v.text
              if typ=='s' and val is not None: val=shared[int(val)]
              if val is not None: cells[ref]=val
            a,j=cells.get('A'+rn),cells.get('J'+rn)
            if not a or not j: continue
            try:
              dt=datetime(1899,12,30)+timedelta(days=int(Decimal(a))); idx=Decimal(j)
            except Exception: continue
            obs.append((dt,idx))
          obs.sort()
          official={}
          for i,(dt,idx) in enumerate(obs):
            if i<4: continue
            pdt,pidx=obs[i-4]
            if pdt.month!=dt.month or pdt.year!=dt.year-1: continue
            yoy=((idx/pidx)-Decimal('1'))*Decimal('100')
            official[f'{dt.year:04d}-{dt.month:02d}']=float(yoy.quantize(Decimal('0.1'),rounding=ROUND_HALF_UP))

          s=json.loads(Path('live_data/sections/MACRO_SERIES.json').read_text())
          row=next(x for x in s['AUD'] if x.get('id')=='AU_CPI_HEADLINE_Q_YOY_history_value')
          mismatches=[]; matches=0
          for d,v in zip(row['dates'],row['values']):
            q=d[:7]
            if q not in official: continue
            ov=official[q]
            if abs(float(v)-ov)>1e-12: mismatches.append({'period':q,'canonical':v,'abs_table17':ov})
            else: matches+=1
          print(json.dumps({'canonical_count':len(row['dates']),'comparable_count':matches+len(mismatches),'matches':matches,'mismatch_count':len(mismatches),'mismatches':mismatches,'official_tail':{k:official[k] for k in sorted(official)[-12:]}},indent=2))
          PY
