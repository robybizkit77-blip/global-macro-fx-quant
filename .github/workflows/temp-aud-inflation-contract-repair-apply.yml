name: TEMP AUD Inflation Contract Repair Apply

on:
  push:
    branches:
      - 'validation-macro-aud-inflation-contract-repair-2026-10-09'
    paths:
      - '.github/workflows/temp-aud-inflation-contract-repair-apply.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild evidence and promote only AUD inflation certification metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aud-promote/replay
          cp validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json /tmp/aud-promote/registry-before.json
          python3 validation/macro_pit_historical_bootstrap.py \
            --anchor-manifest validation/macro/aud_inflation_historical_anchor_2026-06.json \
            --evidence-output /tmp/aud-promote/evidence.json \
            --work-dir /tmp/aud-promote/replay \
            > /tmp/aud-promote/bootstrap.json
          python3 validation/macro_pit_registry_promotion.py \
            --evidence /tmp/aud-promote/evidence.json \
            --proposed-registry /tmp/aud-promote/proposed-registry.json \
            --receipt /tmp/aud-promote/receipt.json \
            > /tmp/aud-promote/promotion.json
          python3 - <<'PY'
          import copy, hashlib, json
          from pathlib import Path
          before=json.loads(Path('/tmp/aud-promote/registry-before.json').read_text())
          proposed=json.loads(Path('/tmp/aud-promote/proposed-registry.json').read_text())
          receipt=json.loads(Path('/tmp/aud-promote/receipt.json').read_text())
          evidence_path=Path('/tmp/aud-promote/evidence.json')
          evidence=json.loads(evidence_path.read_text())
          evidence_sha=hashlib.sha256(evidence_path.read_bytes()).hexdigest()
          key='AUD.inflation'
          assert receipt['status']=='PASS',receipt
          assert receipt['target']==key,receipt
          assert receipt['promotion_action']=='PROPOSAL_CREATED',receipt
          assert receipt['evidence_class']=='RECONSTRUCTED_HISTORICAL_REPLAY',receipt
          assert receipt['current_evidence_sha256']==evidence_sha,(receipt,evidence_sha)
          assert evidence['macro_series_exact_match'] is True and evidence['heatmap_exact_match'] is True,evidence
          assert evidence['bootstrap_provenance']['official_release_pair_verified'] is True,evidence
          assert evidence['candidate']['observation_date']=='2026-06' and float(evidence['candidate']['value'])==3.9,evidence
          assert before['series'][key].get('historical_replay_certified') is not True,before['series'][key]
          p=proposed['series'][key]
          assert p['historical_replay_certified'] is True,p
          ref=p['historical_replay_evidence']
          assert ref['evidence_sha256']==evidence_sha,(ref,evidence_sha)
          assert ref['manifest_sha256']==evidence['bootstrap_provenance']['manifest_sha256'],ref
          assert ref['observation_date']=='2026-06' and float(ref['value'])==3.9,ref
          assert ref['before_git_head']==evidence['anchor']['before_git_head'],ref
          assert ref['after_git_head']==evidence['anchor']['after_git_head'],ref
          b=copy.deepcopy(before); q=copy.deepcopy(proposed)
          b['series'][key].pop('historical_replay_certified',None)
          q['series'][key].pop('historical_replay_certified',None)
          q['series'][key].pop('historical_replay_evidence',None)
          assert b==q,'proposal changed fields outside AUD.inflation certification metadata'
          Path('validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json').write_text(json.dumps(proposed,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'status':'PASS','target':key,'evidence_sha256':evidence_sha,'certified':True},indent=2))
          PY
          git diff --check
          test "$(git diff --name-only)" = 'validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json'
      - name: Commit registry certification metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json
          git commit -m 'Certify AUD inflation historical replay'
          git push origin HEAD:validation-macro-aud-inflation-contract-repair-2026-10-09
