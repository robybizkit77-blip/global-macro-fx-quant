name: TEMP AUD Inflation Contract Repair Apply

on:
  push:
    branches:
      - 'validation-macro-aud-inflation-contract-repair-2026-10-09'
    paths:
      - '.github/workflows/temp-aud-inflation-contract-repair-apply.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ABS Table 17 quarterly CPI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet openpyxl
          python3 - <<'PY'
          import io, urllib.request
          from openpyxl import load_workbook

          releases = {
            'dec-2025': 'https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/consumer-price-index-australia/dec-2025/6401017.xlsx',
            'mar-2026': 'https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/consumer-price-index-australia/mar-2026/6401017.xlsx',
            'jun-2026': 'https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/consumer-price-index-australia/jun-2026/6401017.xlsx',
          }
          for release, url in releases.items():
            data = urllib.request.urlopen(url, timeout=30).read()
            wb = load_workbook(io.BytesIO(data), data_only=True, read_only=True)
            print(f'\n===== {release} =====')
            print('sheets:', wb.sheetnames)
            for ws in wb.worksheets:
              print(f'\nSHEET {ws.title} rows={ws.max_row} cols={ws.max_column}')
              # Table 17 is small. Show the right-most 14 columns for the first 16 rows
              # and the bottom 12 rows, preserving cell coordinates.
              ranges=[]
              rsets=list(range(1,min(ws.max_row,16)+1))
              rsets += list(range(max(1,ws.max_row-11),ws.max_row+1))
              seen=set()
              for r in rsets:
                if r in seen: continue
                seen.add(r)
                vals=[]
                for c in range(max(1,ws.max_column-13),ws.max_column+1):
                  v=ws.cell(r,c).value
                  if v not in (None,''):
                    vals.append(f'{ws.cell(r,c).coordinate}={v!r}')
                if vals:
                  print(' | '.join(vals))
          PY
