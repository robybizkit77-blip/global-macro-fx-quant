name: TEMP AUD Inflation Contract Repair Apply

on:
  push:
    branches:
      - 'validation-macro-aud-inflation-contract-repair-2026-10-09'
    paths:
      - '.github/workflows/temp-aud-inflation-contract-repair-apply.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect AUD inflation canonical contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('live_data/sections/MACRO_SERIES.json').read_text())
          h=json.loads(Path('live_data/sections/MACRO_THERMOMETER_DATA.json').read_text())
          row=next(x for x in s['AUD'] if x.get('id')=='AU_CPI_HEADLINE_Q_YOY_history_value')
          heat=h['currencies']['AUD']['inflation']
          print(json.dumps({
            'id': row.get('id'),
            'label': row.get('label'),
            'unit': row.get('unit'),
            'frequency': row.get('frequency'),
            'source': row.get('source'),
            'transformation': row.get('transformation'),
            'dates_tail': row.get('dates', [])[-10:],
            'values_tail': row.get('values', [])[-10:],
            'last_date': row.get('last_date'),
            'last_value': row.get('last_value'),
            'thermometer': heat,
          }, indent=2, ensure_ascii=False))
          PY
