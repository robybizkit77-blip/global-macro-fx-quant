name: TEMP AUD Inflation Contract Repair Apply

on:
  push:
    branches:
      - 'validation-macro-aud-inflation-contract-repair-2026-10-09'
    paths:
      - '.github/workflows/temp-aud-inflation-contract-repair-apply.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ABS Table 17 quarterly CPI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, re, urllib.request, zipfile
          import xml.etree.ElementTree as ET
          url='https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/consumer-price-index-australia/jun-2026/6401017.xlsx'
          data=urllib.request.urlopen(url,timeout=30).read()
          z=zipfile.ZipFile(io.BytesIO(data))
          ns={'m':'http://schemas.openxmlformats.org/spreadsheetml/2006/main','r':'http://schemas.openxmlformats.org/officeDocument/2006/relationships'}
          shared=[]
          if 'xl/sharedStrings.xml' in z.namelist():
            root=ET.fromstring(z.read('xl/sharedStrings.xml'))
            for si in root.findall('m:si',ns):
              shared.append(''.join(t.text or '' for t in si.iter('{%s}t'%ns['m'])))
          wb=ET.fromstring(z.read('xl/workbook.xml'))
          relroot=ET.fromstring(z.read('xl/_rels/workbook.xml.rels'))
          rels={e.attrib['Id']:e.attrib['Target'] for e in relroot}
          for sh in wb.find('m:sheets',ns):
            name=sh.attrib['name']; rid=sh.attrib['{%s}id'%ns['r']]
            target=rels[rid]
            if not target.startswith('worksheets/'):
              continue
            path='xl/'+target
            root=ET.fromstring(z.read(path))
            rows=[]
            for row in root.findall('.//m:sheetData/m:row',ns):
              vals=[]
              for c in row.findall('m:c',ns):
                ref=c.attrib.get('r',''); typ=c.attrib.get('t'); v=c.find('m:v',ns)
                val='' if v is None else v.text
                if typ=='s' and val!='': val=shared[int(val)]
                elif typ=='inlineStr':
                  val=''.join(t.text or '' for t in c.iter('{%s}t'%ns['m']))
                vals.append((ref,val))
              text=' | '.join(str(v) for _,v in vals)
              if any(x in text for x in ('Dec-25','Mar-26','Jun-26','Dec 2025','Mar 2026','Jun 2026','Percentage change from corresponding quarter')):
                rows.append(vals)
            if rows:
              print('\nSHEET',name)
              for r in rows: print(r)
          PY
