name: TEMP AUD Inflation Contract Repair Apply

on:
  push:
    branches:
      - 'validation-macro-aud-inflation-contract-repair-2026-10-09'
    paths:
      - '.github/workflows/temp-aud-inflation-contract-repair-apply.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ABS Table 17 quarterly CPI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, urllib.request, zipfile
          import xml.etree.ElementTree as ET

          releases = {
            'dec-2025': 'https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/consumer-price-index-australia/dec-2025/6401017.xlsx',
            'mar-2026': 'https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/consumer-price-index-australia/mar-2026/6401017.xlsx',
            'jun-2026': 'https://www.abs.gov.au/statistics/economy/price-indexes-and-inflation/consumer-price-index-australia/jun-2026/6401017.xlsx',
          }
          NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main'
          RNS='http://schemas.openxmlformats.org/officeDocument/2006/relationships'
          ns={'m':NS,'r':RNS}
          for release,url in releases.items():
            data=urllib.request.urlopen(url,timeout=30).read()
            z=zipfile.ZipFile(io.BytesIO(data))
            shared=[]
            if 'xl/sharedStrings.xml' in z.namelist():
              sr=ET.fromstring(z.read('xl/sharedStrings.xml'))
              shared=[''.join(t.text or '' for t in si.iter(f'{{{NS}}}t')) for si in sr.findall('m:si',ns)]
            wb=ET.fromstring(z.read('xl/workbook.xml'))
            rr=ET.fromstring(z.read('xl/_rels/workbook.xml.rels'))
            rels={e.attrib['Id']:e.attrib['Target'] for e in rr}
            print(f'\n===== {release} =====')
            for sh in wb.find('m:sheets',ns):
              name=sh.attrib['name']; target=rels[sh.attrib[f'{{{RNS}}}id']]
              if not target.startswith('worksheets/'): continue
              root=ET.fromstring(z.read('xl/'+target))
              rows=root.findall('.//m:sheetData/m:row',ns)
              print(f'\nSHEET {name} rows={len(rows)}')
              # Dump all non-empty cells from the final 18 physical rows; this captures latest periods
              # regardless of whether Excel encoded period labels as strings or numeric date serials.
              for row in rows[-18:]:
                vals=[]
                for c in row.findall('m:c',ns):
                  ref=c.attrib.get('r',''); typ=c.attrib.get('t'); v=c.find('m:v',ns)
                  val='' if v is None else v.text
                  if typ=='s' and val!='': val=shared[int(val)]
                  elif typ=='inlineStr': val=''.join(t.text or '' for t in c.iter(f'{{{NS}}}t'))
                  if val!='': vals.append(f'{ref}={val}')
                if vals: print(' | '.join(vals))
          PY
