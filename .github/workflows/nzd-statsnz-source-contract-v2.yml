# Consolidated NZD source certification
name: NZD Stats NZ Source Contract V2

on:
  push:
    branches:
      - validation-macro-g8-source-consolidation-2026-10-08
    paths:
      - 'validation/sources/nzd_statsnz_core.py'
      - 'validation/fixtures/nzd_statsnz_cpi_contract.json'
      - 'validation/fixtures/nzd_statsnz_unemployment_contract.json'
      - 'validation/build_macro_candidate.py'
      - '.github/workflows/nzd-statsnz-source-contract-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot canonical live data before certification
        run: sha256sum live_data/sections/MACRO_SERIES.json live_data/sections/MACRO_THERMOMETER_DATA.json > /tmp/nzd-before.sha256
      - name: Run deterministic Stats NZ parser-builder contract
        run: python validation/test_nzd_statsnz_source.py
      - name: Fetch official Stats NZ inflation candidate
        run: |
          mkdir -p /tmp/gmfq-nzd/inflation
          python validation/sources/nzd_statsnz_core.py --dimension inflation \
            --output /tmp/gmfq-nzd/inflation/candidate.json \
            --audit-output /tmp/gmfq-nzd/inflation/source-audit.json
      - name: Pass NZD inflation candidate through canonical macro builder
        run: python validation/build_macro_candidate.py --candidate /tmp/gmfq-nzd/inflation/candidate.json --output-dir /tmp/gmfq-nzd/inflation/built
      - name: Fetch official Stats NZ labour candidate
        run: |
          mkdir -p /tmp/gmfq-nzd/labour
          python validation/sources/nzd_statsnz_core.py --dimension labour \
            --output /tmp/gmfq-nzd/labour/candidate.json \
            --audit-output /tmp/gmfq-nzd/labour/source-audit.json
      - name: Pass NZD labour candidate through canonical macro builder
        run: python validation/build_macro_candidate.py --candidate /tmp/gmfq-nzd/labour/candidate.json --output-dir /tmp/gmfq-nzd/labour/built
      - name: Verify Stats NZ provenance freshness and read-only contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          heat=json.loads(Path('live_data/sections/MACRO_THERMOMETER_DATA.json').read_text())['currencies']['NZD']
          out={}
          for dim in ('inflation','labour'):
              r=Path('/tmp/gmfq-nzd')/dim
              c=json.loads((r/'candidate.json').read_text()); a=json.loads((r/'source-audit.json').read_text()); s=json.loads((r/'built/summary.json').read_text())
              assert c['currency']=='NZD' and c['dimension']==dim and c['source']=='Stats NZ',c
              assert a['mode']=='live' and a['candidate_only'] is True and a['live_data_written'] is False,a
              assert a['source_url'].startswith('https://www.stats.govt.nz/') and a['retrieval_url'].startswith('https://www.stats.govt.nz/'),a
              assert s['status']=='PASS' and s['live_data_modified'] is False,s
              assert s['observation_date']==c['observation_date'],(s,c)
              current=str(heat[dim]['as_of'])[:10]
              assert c['observation_date'] >= current,(c,current)
              out[dim]={'series_id':c['series_id'],'macro_series_id':c['macro_series_id'],'observation_date':c['observation_date'],'value':c['value'],'series_action':s['series_action'],'storage_date':s.get('storage_date'),'retrieval_url':a['retrieval_url'],'upstream_series_id':a.get('upstream_series_id')}
          assert out['inflation']['series_id']=='NZ_CPI_HEADLINE_YOY',out
          assert out['labour']['series_id']=='NZ_UNEMP_RATE' and out['labour']['upstream_series_id']=='HLFQ.S1F3S',out
          print(json.dumps({'status':'PASS','source':'Stats NZ','results':out,'live_data_modified':False,'dynamic_release_discovery':False},indent=2))
          PY
      - name: Confirm repository live data remained untouched
        run: |
          sha256sum -c /tmp/nzd-before.sha256
          git diff --exit-code -- live_data/sections/MACRO_SERIES.json live_data/sections/MACRO_THERMOMETER_DATA.json
      - name: Upload Stats NZ verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nzd-statsnz-source-verification-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: /tmp/gmfq-nzd/
