name: Historical Rates Inventory

on:
  workflow_dispatch:
  push:
    branches: [staging-historical-walkforward-v93-2026-10-01]
    paths:
      - '.github/workflows/historical-rates-inventory.yml'

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install browser
        run: npm init -y >/dev/null 2>&1 && npm install --save-dev playwright
      - name: Inventory historical rates
        run: |
          cat > inv.js <<'EOF'
          const {chromium}=require('playwright'); const {execSync,spawn}=require('child_process');
          (async()=>{
            const srv=spawn('python3',['-m','http.server','8765'],{stdio:'ignore'}); await new Promise(r=>setTimeout(r,1000));
            const cp=execSync('command -v google-chrome-stable || command -v google-chrome || command -v chromium').toString().trim();
            const b=await chromium.launch({headless:true,executablePath:cp,args:['--no-sandbox']}); const p=await b.newPage();
            await p.goto('http://127.0.0.1:8765/index.html',{waitUntil:'networkidle',timeout:120000});
            const out=await p.evaluate(()=>{
              const ccys=['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];
              const z={};
              for(const c of ccys){
                const hits=(S?.[c]||[]).filter(x=>{
                  const q=[x.id,x.label,x.category,x.source_file].join(' ');
                  return /RATES|2Y|2 Y|YIELD|DGS2|ZC_2Y|FCMYGBAG|B2/i.test(q);
                }).map(x=>({
                  id:x.id,label:x.label,category:x.category,source_file:x.source_file,
                  n:(x.values||[]).length,
                  first:(x.dates||[])[0]||null,last:(x.dates||[]).at(-1)||null,
                  frequency:x.frequency||x.freq||null,unit:x.unit||x.units||null
                }));
                const n=NATIVE_RATES_DATA?.[c]||{};
                z[c]={series:hits,native_keys:Object.keys(n),native_source:n.source||null,native_quality:n.quality||null};
              }
              return z;
            });
            console.log('===RATES_INV_START==='); console.log(JSON.stringify(out,null,2)); console.log('===RATES_INV_END===');
            await b.close(); srv.kill();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node inv.js
