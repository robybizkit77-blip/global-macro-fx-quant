name: Dashboard Pair Signed Inputs V1
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate live contract first
        run: python validation/check_live_update_contract.py
      - name: Build signed pair inputs
        run: python validation/build_dashboard_pair_signed_inputs_v1.py
      - name: Guard frozen research baseline
        run: |
          python - <<'PY'
          import json
          p=json.load(open('validation/DASHBOARD_PAIR_SIGNED_INPUTS_V1_2026-10-07.json'))
          assert p['engine_commit']=='ff52198a75cc67f7dae96fc2bbf65623f170791c'
          assert p['rules_fingerprint']=='3356baf0'
          assert len(p['pairs'])==28
          assert p['guards']['final_transmission_rule_applied'] is False
          assert p['guards']['changes_engine_rules'] is False
          assert p['guards']['changes_live_data'] is False
          assert p['guards']['changes_oos_baseline'] is False
          print('PASS baseline guard')
          PY
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/DASHBOARD_PAIR_SIGNED_INPUTS_V1_2026-10-07.json
          git diff --cached --quiet || git commit -m 'Materialize dashboard pair signed inputs V1'
          git push
