name: FX Quant V2 Daily Browser QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/fx-quant-v2/**'
      - 'validation/qa_fx_quant_v2_browser.cjs'
      - 'validation/qa_fxv2_home_concept_v1.cjs'
      - 'validation/qa_fxv2_home_wow_v5.cjs'
      - 'validation/qa_fxv2_home_simple_v6.cjs'
      - 'validation/test_fxv2_home_source_dates_20261106.cjs'
      - 'validation/test_fxv2_same_origin_multi_page_feeds_v1.cjs'
      - 'validation/qa_fxv2_ois_2y_fx_context_v1.cjs'
      - 'validation/qa_fx_quant_v2_freshness.cjs'
      - 'validation/fxv2_research_core_readiness_v1.cjs'
      - 'validation/test_fxv2_research_core_readiness_v1.cjs'
      - 'validation/qa_fxv2_rates_working_v1.cjs'
      - 'validation/qa_fxv2_rates_research_overlay_v1.cjs'
      - 'validation/qa_fxv2_rates_per_tenor_dates_v1.cjs'
      - 'site/fx-quant-v2/assets/rates-dated-pricing-v1.js'
      - 'validation/qa_fxv2_ois_provenance_v2.cjs'
      - 'validation/qa_fxv2_ois_relative_live_parity_v1.cjs'
      - 'validation/qa_fxv2_same_contract_reading_v1.cjs'
      - 'validation/qa_fxv2_ois_2y_fx_context_v1.cjs'
      - 'validation/qa_fxv2_pair_macro_pricing_bridge_v1.cjs'
      - 'validation/qa_fxv2_liquidity_credit_overlay_v1.cjs'
      - 'validation/qa_fxv2_macro_pair_observed_v1.cjs'
      - 'validation/qa_fxv2_macro_dynamic_pair_research_v1.cjs'
      - 'validation/qa_fxv2_macro_rates_price_evidence_v1.cjs'
      - 'validation/publishing/wait_fxv2_public_revision_v1.py'
      - 'validation/publishing/test_wait_fxv2_public_revision_v1.py'
      - 'validation/publishing/check_next_research_library_delivery_v1.py'
      - 'validation/publishing/test_check_next_research_library_delivery_v1.py'
      - 'validation/publishing/check_next_weekly_editorial_preflight_v1.py'
      - 'validation/publishing/test_next_weekly_editorial_preflight_v1.py'
      - '.github/workflows/fx-quant-v2-browser-daily-qa.yml'
  push:
    branches: [main]
    paths:
      - 'site/fx-quant-v2/**'
      - 'validation/qa_fx_quant_v2_browser.cjs'
      - 'validation/qa_fxv2_home_concept_v1.cjs'
      - 'validation/qa_fxv2_home_wow_v5.cjs'
      - 'validation/qa_fxv2_home_simple_v6.cjs'
      - 'validation/test_fxv2_home_source_dates_20261106.cjs'
      - 'validation/test_fxv2_same_origin_multi_page_feeds_v1.cjs'
      - 'validation/qa_fxv2_ois_2y_fx_context_v1.cjs'
      - 'validation/qa_fx_quant_v2_freshness.cjs'
      - 'validation/fxv2_research_core_readiness_v1.cjs'
      - 'validation/test_fxv2_research_core_readiness_v1.cjs'
      - 'validation/qa_fxv2_rates_working_v1.cjs'
      - 'validation/qa_fxv2_rates_research_overlay_v1.cjs'
      - 'validation/qa_fxv2_rates_per_tenor_dates_v1.cjs'
      - 'site/fx-quant-v2/assets/rates-dated-pricing-v1.js'
      - 'validation/qa_fxv2_ois_provenance_v2.cjs'
      - 'validation/qa_fxv2_ois_relative_live_parity_v1.cjs'
      - 'validation/qa_fxv2_same_contract_reading_v1.cjs'
      - 'validation/qa_fxv2_ois_2y_fx_context_v1.cjs'
      - 'validation/qa_fxv2_pair_macro_pricing_bridge_v1.cjs'
      - 'validation/qa_fxv2_liquidity_credit_overlay_v1.cjs'
      - 'validation/qa_fxv2_macro_pair_observed_v1.cjs'
      - 'validation/qa_fxv2_macro_dynamic_pair_research_v1.cjs'
      - 'validation/qa_fxv2_macro_rates_price_evidence_v1.cjs'
      - 'validation/publishing/wait_fxv2_public_revision_v1.py'
      - 'validation/publishing/test_wait_fxv2_public_revision_v1.py'
      - 'validation/publishing/check_next_research_library_delivery_v1.py'
      - 'validation/publishing/test_check_next_research_library_delivery_v1.py'
      - 'validation/publishing/check_next_weekly_editorial_preflight_v1.py'
      - 'validation/publishing/test_next_weekly_editorial_preflight_v1.py'
      - '.github/workflows/fx-quant-v2-browser-daily-qa.yml'
  schedule:
    - cron: '20 8 * * 1-5'
  workflow_dispatch:
  workflow_run:
    # A source writer may commit with GITHUB_TOKEN: browser QA must follow
    # the successful isolated site publisher, never race the source commit.
    workflows: ['Publish FX Quant V2 (isolated site)']
    types: [completed]

permissions:
  contents: read

concurrency:
  # A new post-publish run must not cancel a queued pull-request test.
  # Keep one production queue while separating each PR's proof.
  group: ${{ github.event_name == 'pull_request' && format('fxv2-browser-qa-pr-{0}', github.event.pull_request.number) || 'fx-quant-v2-browser-daily-qa' }}
  # PR revisions supersede their own obsolete browser jobs; never cancel production QA.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  v2-working-rate-model-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate FXV2 working rates and dated IG/HY credit overlay independently
        run: |
          node validation/test_fxv2_home_source_dates_20261106.cjs
          node validation/test_fxv2_same_origin_multi_page_feeds_v1.cjs
          node validation/qa_fxv2_rates_working_v1.cjs
          node validation/qa_fxv2_rates_research_overlay_v1.cjs
          node validation/qa_fxv2_rates_per_tenor_dates_v1.cjs
          node validation/qa_fxv2_ois_provenance_v2.cjs
          node validation/qa_fxv2_ois_relative_live_parity_v1.cjs
          node validation/qa_fxv2_same_contract_reading_v1.cjs
          node validation/qa_fxv2_ois_2y_fx_context_v1.cjs
          node validation/qa_fxv2_pair_macro_pricing_bridge_v1.cjs
          node validation/qa_fxv2_liquidity_credit_overlay_v1.cjs
          node validation/qa_fxv2_macro_pair_observed_v1.cjs
          node validation/qa_fxv2_macro_dynamic_pair_research_v1.cjs
          node validation/qa_fxv2_macro_rates_price_evidence_v1.cjs
          python3 -m unittest validation.publishing.test_wait_fxv2_public_revision_v1 -v
          python3 -m unittest validation.publishing.test_check_next_research_library_delivery_v1 -v
          python3 -m unittest validation.publishing.test_next_weekly_editorial_preflight_v1 -v
          python3 -m validation.publishing.check_next_weekly_editorial_preflight_v1
  v2-freshness-audit:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test two-track V2 research vs Core certification contract
        run: node validation/test_fxv2_research_core_readiness_v1.cjs
      - name: Read canonical source dates and emit separate research/Core readiness receipts
        run: node validation/qa_fx_quant_v2_freshness.cjs
      - name: Save source freshness JSON and readable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fxv2-source-freshness
          path: fxv2-freshness-evidence/
          if-no-files-found: error
          retention-days: 30
  v2-browser-audit:
    # Public browser QA is deferred until publisher completion; PR tests run locally.
    if: >-
      github.event_name != 'push' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser tooling
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local V2 preview for pull requests
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/fxv2-browser-server.log 2>&1 &
          sleep 2
      - name: Confirm public site exposes the same revision as approved main
        if: github.event_name != 'pull_request'
        run: python3 -m validation.publishing.wait_fxv2_public_revision_v1
      - name: Certify latest eight Research Library editions by HTTP 200 and exact SHA-256
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m validation.publishing.check_next_research_library_delivery_v1 \
            --http --output "$RUNNER_TEMP/next-research-library-delivery.json" \
            --budget-seconds 180
      - name: Preserve dated Research Library HTTP delivery receipt
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: next-research-library-public-proof
          path: ${{ runner.temp }}/next-research-library-delivery.json
          if-no-files-found: warn
          retention-days: 21
      - name: Verify published CHF/NZD research JSON matches approved main (public HTTPS)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from validation.publishing.verify_pages_http_delivery_v1 import BASE_URL,verify
          root=Path('.')
          paths=(
              'site/fx-quant-v2/chf-nzd-benchmark-research.json',
              'site/fx-quant-v2/chf-snb-paired-history.json',
              'site/fx-quant-v2/nzd-b2-postroll-web-research.json',
          )
          proof=verify(root,BASE_URL,paths,budget_seconds=180,interval_seconds=10,timeout_seconds=12)
          Path('/tmp/fxv2-chf-nzd-public-http-proof.json').write_text(
              json.dumps(proof,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as summary:
              summary.write('\n### CHF/NZD dated research — public HTTP byte parity\n')
              for item in proof['checks']:
                  summary.write('- '+item['path']+': **'+
                      ('MATCH' if item['http_200_and_sha256_match'] else 'NOT VERIFIED')+
                      '**; HTTP '+str(item['http_status'])+'\n')
          if proof['status']!='PASS':
              raise SystemExit('CHF_NZD_RESEARCH_PUBLIC_HTTP_NOT_SAME_AS_MAIN')
          research=json.loads((root/paths[0]).read_text(encoding='utf-8'))
          chf=json.loads((root/paths[1]).read_text(encoding='utf-8'))
          nzd=json.loads((root/paths[2]).read_text(encoding='utf-8'))
          expected=research['NZD']
          latest=nzd['daily_observations'][-1]
          assert expected['latest_date']==latest['date']
          assert expected['latest_2Y']==latest['2Y'] and expected['latest_10Y']==latest['10Y']
          assert research['CHF']['paired_date']==chf['last_observation_date']
          assert research['eligible_for_fx_pair_engine'] is False
          assert nzd['eligible_for_core'] is False and nzd['eligible_for_fx_pair_engine'] is False
          assert chf['eligible_for_core'] is False
          print('CHF_NZD_RESEARCH_PUBLIC_HTTP_200_SHA256_AND_DATED_SOURCES_MATCH')
          PY
      - name: Audit desktop 1440px and mobile 390px across all 12 sections
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            FXV2_MODE=pr-local FXV2_BASE=http://127.0.0.1:8000/site/fx-quant-v2 node validation/qa_fx_quant_v2_browser.cjs
          else
            FXV2_MODE=public FXV2_BASE=https://robybizkit77-blip.github.io/global-macro-fx-quant/site/fx-quant-v2 node validation/qa_fx_quant_v2_browser.cjs
          fi
      - name: Audit isolated Global Macro Home concept on desktop/mobile
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            FXV2_BASE=http://127.0.0.1:8000/site/fx-quant-v2 node validation/qa_fxv2_home_concept_v1.cjs
          else
            FXV2_BASE=https://robybizkit77-blip.github.io/global-macro-fx-quant/site/fx-quant-v2 node validation/qa_fxv2_home_concept_v1.cjs
          fi
      - name: Audit standalone Cinematic V5 Home (desktop and mobile)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            FXV2_BASE=http://127.0.0.1:8000/site/fx-quant-v2 node validation/qa_fxv2_home_wow_v5.cjs
          else
            FXV2_BASE=https://robybizkit77-blip.github.io/global-macro-fx-quant/site/fx-quant-v2 node validation/qa_fxv2_home_wow_v5.cjs
          fi
      - name: Audit simplified narrative Home V6 in desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            FXV2_BASE=http://127.0.0.1:8000/site/fx-quant-v2 node validation/qa_fxv2_home_simple_v6.cjs
          else
            FXV2_BASE=https://robybizkit77-blip.github.io/global-macro-fx-quant/site/fx-quant-v2 node validation/qa_fxv2_home_simple_v6.cjs
          fi
      - name: Preserve QA receipt and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fxv2-browser-evidence
          path: fxv2-browser-evidence/
          if-no-files-found: warn
          retention-days: 14
