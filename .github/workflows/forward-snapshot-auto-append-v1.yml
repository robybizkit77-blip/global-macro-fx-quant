name: Forward Snapshot Auto Append V1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append-if-changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-transmission-conviction-layer-v1-2026-10-07
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate live contract first
        run: python validation/check_live_update_contract.py
      - name: Append snapshot only on semantic change
        run: python validation/append_forward_snapshot_if_changed_v1.py
      - name: Validate aggregate ledger
        run: python validation/validate_forward_snapshot_ledger_v1.py
      - name: Validate frozen pair snapshots and manifest
        run: python validation/validate_forward_pair_snapshots_v1.py
      - name: Commit appended snapshot if any
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/FORWARD_SNAPSHOT_LEDGER_V1_2026-10-07.json validation/forward/MANIFEST_V1.json validation/forward/snapshots/*.json
          if git diff --cached --quiet; then
            echo 'No semantic change; no new snapshot'
            exit 0
          fi
          git commit -m 'Append changed causal forward snapshot with frozen pairs'
          git push origin HEAD:research-transmission-conviction-layer-v1-2026-10-07
