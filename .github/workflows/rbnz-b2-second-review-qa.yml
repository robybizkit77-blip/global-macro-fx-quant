name: RBNZ B2 Second Independent Published Page Review QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/fixtures/rbnz_b2_independent_source_review_2026-10-19.json'
      - 'validation/check_rbnz_b2_second_review_v1.py'
      - '.github/workflows/rbnz-b2-second-review-qa.yml'
  push:
    branches: [main]
    paths:
      - 'validation/fixtures/rbnz_b2_independent_source_review_2026-10-19.json'
      - 'validation/check_rbnz_b2_second_review_v1.py'
      - '.github/workflows/rbnz-b2-second-review-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate independent page read vs recorded official table
        run: |
          python -m py_compile validation/check_rbnz_b2_second_review_v1.py
          python validation/check_rbnz_b2_second_review_v1.py
          git diff --exit-code -- live_data payload site
