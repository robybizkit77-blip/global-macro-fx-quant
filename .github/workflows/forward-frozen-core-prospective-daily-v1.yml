name: Forward Frozen Core Prospective Daily V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/forward/**'
      - 'validation/test_forward_decision_logger_v1.py'
      - 'validation/forward/hourly_recovery_gate_v1.py'
      - 'validation/forward/test_hourly_recovery_gate_v1.py'
      - 'validation/macro/v2_core_beta_evidence_desk_v1.py'
      - 'validation/macro/test_v2_core_beta_evidence_desk_v1.py'
      - '.github/workflows/forward-frozen-core-prospective-daily-v1.yml'
  workflow_dispatch:
  workflow_run:
    # Same existing process, event-driven recovery after the OFFICIAL 28-pair
    # price overlay has been validated. No extra cron or fake T0 backfill.
    workflows: ['Pair Setup Operational View V1', 'Hourly Certified Alert Readiness V1']
    types: [completed]
  schedule:
    # 19:30 Rome primary and 20:30 Rome same-day backup.
    # The CET/CEST cron union is filtered by the explicit DST admission gate.
    - cron: '30 17 * * 1-5'
    - cron: '30 18 * * 1-5'
    - cron: '30 19 * * 1-5'

permissions:
  contents: write

concurrency:
  group: forward-frozen-core-prospective-daily-v1
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      eligible: ${{ steps.early_gate.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
      - name: Gate existing hourly retries before expensive tests
        id: early_gate
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          UPSTREAM: ${{ github.event.workflow_run.name }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          python3 validation/forward/hourly_recovery_gate_v1.py --event "$EVENT" --upstream "$UPSTREAM" --upstream-event "$UPSTREAM_EVENT" --output "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.early_gate.outputs.eligible == 'true'
        with:
          python-version: '3.12'
      - name: Compile observational-only forward modules
        if: steps.early_gate.outputs.eligible == 'true'
        run: |
          python -m py_compile validation/forward/admit_frozen_core_prospective_capture_v1.py validation/forward/log_core_decision_v1.py validation/forward/test_frozen_core_prospective_capture_v11.py validation/forward/capture_v2_research_prospective_evidence_v1.py
      - name: Verify frozen provenance, schema and no daily duplicates
        if: steps.early_gate.outputs.eligible == 'true'
        run: |
          python -m unittest validation.forward.test_hourly_recovery_gate_v1 -v
          python -m unittest validation.forward.test_frozen_core_prospective_capture_v11 -v
          python validation/test_forward_decision_logger_v1.py
          python -m unittest validation.forward.test_attach_core_outcomes_safety_v1 -v
          python -m unittest validation.forward.test_capture_v2_research_prospective_evidence_v1 -v
          python -m unittest validation.forward.test_v2_full_command_capture_path_v1 -v

  capture:
    needs: test
    if: >-
      needs.test.outputs.eligible == 'true' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        (github.event.workflow_run.name == 'Pair Setup Operational View V1' ||
         (github.event.workflow_run.name == 'Hourly Certified Alert Readiness V1' &&
          github.event.workflow_run.event == 'schedule'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit only official same-day 28-pair market observations
        id: admit
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from validation.forward.admit_frozen_core_prospective_capture_v1 import (
              assess, schedule_attempt, FX, PAIR, CORE
          )
          now=dt.datetime.now(dt.timezone.utc)
          rome=now.astimezone(ZoneInfo('Europe/Rome'))
          attempt=schedule_attempt(now,os.environ['EVENT'],
                                   os.environ.get('SCHEDULE_CRON') or '')
          if attempt=='SKIPPED_DUPLICATE_DST_UTC_SLOT':
              status='SKIPPED_DUPLICATE_DST_UTC_SLOT'
              reasons=['WRONG_UTC_CRON_FOR_ROME_DST']
          else:
              r=assess(now,json.loads(FX.read_text(encoding='utf-8')),
                          json.loads(PAIR.read_text(encoding='utf-8')),
                          json.loads(CORE.read_text(encoding='utf-8')))
              status=r['status'];reasons=r['checks']
          admitted=status=='ADMITTED_PROSPECTIVE_BASELINE_OBSERVATION'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('admitted='+('true' if admitted else 'false')+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## Forward prospective observation (no fresh Core re-run)\n')
              out.write('- Attempt: **'+attempt+'** (actual cutoff only, no 19:30 backfill)\n')
              out.write('- Status: **'+status+'**\n')
              out.write('- Blockers: '+(', '.join(reasons) if reasons else 'none')+'\n')
              out.write('- Time: '+now.isoformat()+'\n')
              out.write('- New signal calculated: **NO**; no estimates or backfill.\n')
          print('PROSPECTIVE_ADMISSION',status,'REASONS',reasons)
          PY
      - name: Append immutable daily 28-pair frozen-Core observation only
        if: steps.admit.outputs.admitted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cutoff=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          localday=$(TZ=Europe/Rome date +%Y%m%d)
          python validation/forward/log_core_decision_v1.py --decision-cutoff "$cutoff" --run-id "frozen-core-${localday}" > /tmp/forward-snapshot-capture.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/forward-snapshot-capture.json'))
          assert d['no_forward_outcomes_in_snapshot'] is True
          assert d['observational_only'] is True
          assert d['result']['written'] in (0,28)
          print('FORWARD_SNAPSHOT_RESEARCH_ONLY_CAPTURE',d['result'])
          PY
      - name: Freeze independent V2 research features beside today's ECB T0 (best effort)
        id: v2_shadow
        if: steps.admit.outputs.admitted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Existing frozen-Core snapshot must remain PRIMARY, even if the
          # independent V2 research feature computation fails.
          status='V2_RESEARCH_SOURCE_FAILURE'
          if python -m validation.forward.capture_v2_research_prospective_evidence_v1 > /tmp/v2-research-prospective-capture.json; then
            cat /tmp/v2-research-prospective-capture.json
            status="$(python -c "import json; print(json.load(open('/tmp/v2-research-prospective-capture.json'))['status'])" || echo 'V2_RESEARCH_RECEIPT_INVALID')"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          case "$status" in
            PROSPECTIVE_SHADOW_RESEARCH_SNAPSHOT_APPEND_OK|EXISTING_DATE_ALREADY_FROZEN_NO_OVERWRITE)
              echo "- V2 independent research capture: **$status**" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "- V2 independent research capture: **FAILED / NOT CAPTURED ($status)**. Frozen-Core write remains primary; job will be marked RED only AFTER its persistence." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
      - name: Verify only immutable forward-ledger files changed
        if: steps.admit.outputs.admitted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          x=subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines()
          for line in x:
              path=line[3:]
              if path not in (
                  'validation/forward/decision_snapshots/CORE_DECISION_SNAPSHOTS_V1.jsonl',
                  'validation/forward/candidate_shadow_snapshots/V2_MACRO_EVIDENCE_SNAPSHOTS_V1.jsonl'
              ) and not (
                 path.startswith('validation/forward/receipts/') and path.endswith('__V1.json')
              ):
                  raise SystemExit('UNEXPECTED_MUTATION '+line)
          print('FORWARD_ONLY_LEDGER_AND_PROOF_FILES')
          PY
      - name: Commit new prospective observation only, no forced push
        if: steps.admit.outputs.admitted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add validation/forward/decision_snapshots/CORE_DECISION_SNAPSHOTS_V1.jsonl validation/forward/receipts/
          if test -f validation/forward/candidate_shadow_snapshots/V2_MACRO_EVIDENCE_SNAPSHOTS_V1.jsonl; then
            git add validation/forward/candidate_shadow_snapshots/V2_MACRO_EVIDENCE_SNAPSHOTS_V1.jsonl
          fi
          if git diff --cached --quiet; then
            echo 'FORWARD_ALREADY_CAPTURED_TODAY_NO_COMMIT' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Capture prospective frozen Core daily observation (no new signal)"
          # A source branch change means source provenance no longer matches
          # the latest main; fail closed, never force or rebase the evidence.
          git push origin HEAD:main
          echo '- Prospective observation: **committed to main** (unaltered baseline date).' >> "$GITHUB_STEP_SUMMARY"
      - name: Certify V2 research capture separately after primary Core commit
        if: steps.admit.outputs.admitted == 'true'
        shell: bash
        env:
          V2_SHADOW_STATUS: ${{ steps.v2_shadow.outputs.status }}
        run: |
          set -euo pipefail
          # This executes AFTER primary legacy snapshot persistence. A V2
          # failure must not leave a misleading GREEN service run, but must
          # never erase or prevent the separately committed legacy observation.
          case "$V2_SHADOW_STATUS" in
            PROSPECTIVE_SHADOW_RESEARCH_SNAPSHOT_APPEND_OK|EXISTING_DATE_ALREADY_FROZEN_NO_OVERWRITE)
              echo 'V2_RESEARCH_CAPTURE_REAL_OR_IDEMPOTENT_PASS'
              ;;
            *)
              echo "::error::V2_RESEARCH_CAPTURE_FAILED_AFTER_LEGACY_PERSISTENCE status=$V2_SHADOW_STATUS"
              echo '- Final outcome: **PARTIAL, V2 research capture not recorded**.' >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
