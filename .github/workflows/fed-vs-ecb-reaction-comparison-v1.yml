name: Fed vs ECB Reaction Comparison V1
on:
  push:
    paths:
      - 'validation/build_fed_vs_ecb_reaction_comparison_v1.py'
      - '.github/workflows/fed-vs-ecb-reaction-comparison-v1.yml'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-minimum-robust-pit-dataset-2026-10-06
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Fed vs ECB comparison
        run: python validation/build_fed_vs_ecb_reaction_comparison_v1.py
      - name: Strict engine/live-data guard
        run: git diff --exit-code -- engine live_data
      - name: Commit evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/FED_VS_ECB_REACTION_FUNCTION_COMPARISON_V1_2026-10-06.json
          git diff --cached --quiet || git commit -m 'Add Fed vs ECB reaction-function comparison evidence'
          git pull --rebase origin audit-minimum-robust-pit-dataset-2026-10-06
          git push origin HEAD:audit-minimum-robust-pit-dataset-2026-10-06
