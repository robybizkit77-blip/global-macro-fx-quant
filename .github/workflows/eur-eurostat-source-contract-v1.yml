name: EUR Eurostat Source Contract V1

on:
  push:
    branches:
      - validation-eur-eurostat-v1-2026-10-06
    paths:
      - 'validation/sources/eur_eurostat_core.py'
      - 'validation/fixtures/eur_eurostat_hicp_contract.json'
      - 'validation/fixtures/eur_eurostat_unemployment_contract.json'
      - 'validation/test_eur_eurostat_source.py'
      - '.github/workflows/eur-eurostat-source-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run deterministic Eurostat parser-builder contract
        run: python validation/test_eur_eurostat_source.py

      - name: Fetch official live Eurostat inflation candidate
        run: |
          mkdir -p /tmp/gmfq-eur-eurostat-live/inflation
          python validation/sources/eur_eurostat_core.py \
            --dimension inflation \
            --output /tmp/gmfq-eur-eurostat-live/inflation/candidate.json \
            --audit-output /tmp/gmfq-eur-eurostat-live/inflation/source-audit.json

      - name: Pass live EUR inflation candidate through canonical macro builder
        run: |
          python validation/build_macro_candidate.py \
            --candidate /tmp/gmfq-eur-eurostat-live/inflation/candidate.json \
            --output-dir /tmp/gmfq-eur-eurostat-live/inflation/built

      - name: Fetch official live Eurostat labour candidate
        run: |
          mkdir -p /tmp/gmfq-eur-eurostat-live/labour
          python validation/sources/eur_eurostat_core.py \
            --dimension labour \
            --output /tmp/gmfq-eur-eurostat-live/labour/candidate.json \
            --audit-output /tmp/gmfq-eur-eurostat-live/labour/source-audit.json

      - name: Pass live EUR labour candidate through canonical macro builder
        run: |
          python validation/build_macro_candidate.py \
            --candidate /tmp/gmfq-eur-eurostat-live/labour/candidate.json \
            --output-dir /tmp/gmfq-eur-eurostat-live/labour/built

      - name: Verify Eurostat provenance and read-only contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected={
            'inflation':('prc_hicp_minr','EA_HICP_HEADLINE_YOY','reported_yoy_rate'),
            'labour':('une_rt_m','EA_UNEMP','level'),
          }
          out={}
          for dim,(dataset,series_id,transformation) in expected.items():
              root=Path('/tmp/gmfq-eur-eurostat-live')/dim
              c=json.loads((root/'candidate.json').read_text())
              a=json.loads((root/'source-audit.json').read_text())
              s=json.loads((root/'built/summary.json').read_text())
              assert c['currency']=='EUR' and c['dimension']==dim, c
              assert c['source']=='Eurostat', c
              assert c['series_id']==series_id, c
              assert c['transformation']==transformation, c
              assert a['dataset']==dataset, a
              assert a['mode']=='live', a
              assert a['live_data_written'] is False, a
              assert s['status']=='PASS' and s['live_data_modified'] is False, s
              assert s['observation_date']==c['observation_date'], (s,c)
              assert abs(float(s['new_value'])-float(c['value'])) < 1e-10, (s,c)
              out[dim]={'observation_date':c['observation_date'],'value':c['value'],'series_action':s['series_action']}
          print(json.dumps({'status':'PASS','source':'Eurostat','results':out,'live_data_modified':False}, indent=2))
          PY

      - name: Confirm repository live data remained untouched
        run: |
          git diff --exit-code -- \
            live_data/sections/MACRO_SERIES.json \
            live_data/sections/MACRO_THERMOMETER_DATA.json

      - name: Upload Eurostat verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: eur-eurostat-source-verification
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/gmfq-eur-eurostat-live/inflation/candidate.json
            /tmp/gmfq-eur-eurostat-live/inflation/source-audit.json
            /tmp/gmfq-eur-eurostat-live/inflation/built/summary.json
            /tmp/gmfq-eur-eurostat-live/labour/candidate.json
            /tmp/gmfq-eur-eurostat-live/labour/source-audit.json
            /tmp/gmfq-eur-eurostat-live/labour/built/summary.json
