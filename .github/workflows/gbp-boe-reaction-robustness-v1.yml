name: GBP BoE Reaction Robustness V1
on:
  push:
    branches: [audit-minimum-robust-pit-dataset-2026-10-06]
    paths:
      - 'validation/run_gbp_boe_reaction_robustness_v1.py'
      - 'validation/GBP_BOE_REACTION_FUNCTION_DIAGNOSTIC_V1_2026-10-06.json'
      - '.github/workflows/gbp-boe-reaction-robustness-v1.yml'
permissions:
  contents: write
jobs:
  robustness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-minimum-robust-pit-dataset-2026-10-06
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run robustness and walk-forward
        run: python validation/run_gbp_boe_reaction_robustness_v1.py
      - name: Confirm engine and live data untouched
        run: git diff --exit-code -- engine live_data
      - name: Commit evidence only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/GBP_BOE_REACTION_ROBUSTNESS_WALKFORWARD_V1_2026-10-06.json
          git diff --cached --quiet || git commit -m "Add GBP BoE reaction robustness evidence"
          git fetch origin audit-minimum-robust-pit-dataset-2026-10-06
          git rebase origin/audit-minimum-robust-pit-dataset-2026-10-06
          git push origin HEAD:audit-minimum-robust-pit-dataset-2026-10-06
