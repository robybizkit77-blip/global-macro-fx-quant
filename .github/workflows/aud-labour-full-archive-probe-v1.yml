name: AUD Labour Full Archive Probe V1

on:
  push:
    branches:
      - 'validation-aud-labour-strict-pit-v1-*'
    paths:
      - 'validation/probe_aud_labour_full_archive_v1.py'
      - '.github/workflows/aud-labour-full-archive-probe-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe all 104 official ABS monthly releases
        shell: bash
        run: |
          set -euo pipefail
          python validation/probe_aud_labour_full_archive_v1.py
      - name: Enforce read-only repository state
        run: git diff --exit-code
      - name: Upload full discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aud-labour-full-archive-probe-${{ github.run_id }}
          path: /tmp/aud-labour-full-archive-probe.json
          if-no-files-found: warn
          retention-days: 90
