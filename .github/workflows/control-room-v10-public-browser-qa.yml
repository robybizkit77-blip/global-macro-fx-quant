name: Control Room v10 Public Browser QA

on:
  push:
    branches: [main]
    paths:
      - 'site/control-room-preview/index.html'
      - 'site/control-room-preview/home-navigation-v10.js'
      - 'validation/qa_control_room_v10_public.js'
      - '.github/workflows/control-room-v10-public-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-room-v10-public-browser-qa
  cancel-in-progress: false

jobs:
  validate-public-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wait for exact published loader and addon from main
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            git fetch origin gh-pages --no-tags --quiet
            if python - <<'PY'
          import hashlib,subprocess,sys
          from pathlib import Path
          files=['site/control-room-preview/index.html','site/control-room-preview/home-navigation-v10.js']
          for path in files:
              local=Path(path).read_bytes()
              try: published=subprocess.check_output(['git','show',f'origin/gh-pages:{path}'],stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:sys.exit(1)
              if hashlib.sha256(local).digest()!=hashlib.sha256(published).digest():sys.exit(1)
          print('PUBLIC_GHPAGES_V10_SOURCE_PARITY_PASS')
          PY
            then break
            fi
            if [ "$attempt" -eq 45 ]; then echo 'Public branch did not reach the approved source' >&2; exit 1; fi
            sleep 8
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check public URL with actual feeds and navigation
        run: node validation/qa_control_room_v10_public.js
