name: Control Room v10 Public Browser QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/qa_control_room_v10_public.js'
      - 'validation/control_room_public_ois_eligibility_v1.js'
      - 'validation/test_control_room_public_ois_eligibility_v1.js'
      - 'validation/control_room_nzd_public_contract_v1.js'
      - 'validation/test_control_room_nzd_public_contract_v1.js'
      - 'validation/test_control_room_rome_calendar_v1.js'
      - 'validation/test_control_room_pending_source_dossiers_v1.js'
      - 'validation/cb_pricing/build_ois_source_readiness_view_v1.py'
      - 'validation/cb_pricing/test_build_ois_source_readiness_view_v1.py'
      - 'validation/check_nzd_rates_reviewed_snapshot_v1.py'
      - 'site/control-room-preview/ois-pricing-estimates-v1.js'
      - 'validation/test_control_room_g8_visible_pricing_v1.js'
      - 'validation/test_control_room_partial_chf_graded_chart_v1.js'
      - 'validation/test_control_room_chf_nzd_rates_research_v1.js'
      - 'validation/test_nzd_rbnz_b2_latest_web_research_v1.js'
      - 'live_data/sections/NZD_B2_GOVT_LATEST_WEB_RESEARCH.json'
      - 'validation/test_fed_pricing_freshness_audit_v1.cjs'
      - 'validation/test_control_room_rates_history_calendar_v1.js'
      - 'site/control-room-preview/home-navigation-v10.js'
      - 'site/control-room-preview/index.html'
      - '.github/workflows/control-room-v10-public-browser-qa.yml'
  push:
    branches: [main]
    paths:
      - 'site/control-room-preview/index.html'
      - 'site/control-room-preview/home-navigation-v10.js'
      - 'validation/qa_control_room_v10_public.js'
      - 'validation/control_room_public_ois_eligibility_v1.js'
      - 'validation/test_control_room_public_ois_eligibility_v1.js'
      - 'validation/control_room_nzd_public_contract_v1.js'
      - 'validation/test_control_room_nzd_public_contract_v1.js'
      - 'validation/test_control_room_rome_calendar_v1.js'
      - 'validation/test_control_room_pending_source_dossiers_v1.js'
      - 'validation/cb_pricing/build_ois_source_readiness_view_v1.py'
      - 'validation/cb_pricing/test_build_ois_source_readiness_view_v1.py'
      - 'validation/check_nzd_rates_reviewed_snapshot_v1.py'
      - 'site/control-room-preview/ois-pricing-estimates-v1.js'
      - 'validation/test_control_room_g8_visible_pricing_v1.js'
      - 'validation/test_fed_pricing_freshness_audit_v1.cjs'
      - 'validation/test_control_room_rates_history_calendar_v1.js'
      - '.github/workflows/control-room-v10-public-browser-qa.yml'
  workflow_run:
    workflows: ['Publish Control Room Market Data V1']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-room-v10-public-browser-qa
  cancel-in-progress: false

jobs:
  validate-public-site:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - name: Wait for exact published loader and addon from main
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            # A PR tests the already-published site; its candidate addon is
            # intentionally NOT on gh-pages yet. Candidate code has a separate
            # Playwright job. Compare production main -> production gh-pages.
            git fetch origin main gh-pages --no-tags --quiet
            if python - <<'PY'
          import hashlib,os,subprocess,sys
          from pathlib import Path
          files=['site/control-room-preview/index.html','site/control-room-preview/home-navigation-v10.js']
          if os.getenv('GITHUB_EVENT_NAME') != 'pull_request':
              files.append('site/control-room-preview/ois-pricing-estimates-v1.js')
          for path in files:
              try:
                  expected=(subprocess.check_output(['git','show',f'origin/main:{path}'],stderr=subprocess.DEVNULL)
                      if os.getenv('GITHUB_EVENT_NAME')=='pull_request' else Path(path).read_bytes())
                  published=subprocess.check_output(['git','show',f'origin/gh-pages:{path}'],stderr=subprocess.DEVNULL)
              except (subprocess.CalledProcessError,OSError):sys.exit(1)
              if hashlib.sha256(expected).digest()!=hashlib.sha256(published).digest():sys.exit(1)
          print('PUBLIC_GHPAGES_V10_SOURCE_PARITY_PASS')
          PY
            then break
            fi
            if [ "$attempt" -eq 45 ]; then echo 'Public branch did not reach the approved source' >&2; exit 1; fi
            sleep 8
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail-closed source-age and estimate QA fixtures
        run: |
          node --check validation/control_room_public_ois_eligibility_v1.js
          node --check validation/test_control_room_public_ois_eligibility_v1.js
          node --check validation/qa_control_room_v10_public.js
          node validation/test_control_room_public_ois_eligibility_v1.js
      - name: Verify G8 official curve date/value pairing and JPY chronological recovery
        run: |
          node --check site/control-room-preview/home-navigation-v10.js
          node --check validation/test_control_room_rates_history_calendar_v1.js
          node validation/test_control_room_rates_history_calendar_v1.js
          node --check validation/test_control_room_cot_bce_price_context_v1.js
          node validation/test_control_room_cot_bce_price_context_v1.js
          node --check validation/test_fed_pricing_freshness_audit_v1.cjs
          node validation/test_fed_pricing_freshness_audit_v1.cjs
      - name: Install Playwright browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check NZD reviewed source and recent vs historical public QA fixtures
        run: |
          python validation/check_nzd_rates_reviewed_snapshot_v1.py
          node --check validation/control_room_nzd_public_contract_v1.js
          node --check validation/test_control_room_nzd_public_contract_v1.js
          node validation/test_control_room_nzd_public_contract_v1.js
          node validation/test_control_room_rome_calendar_v1.js
          node validation/test_control_room_pending_source_dossiers_v1.js
          node validation/test_control_room_g8_visible_pricing_v1.js
          node validation/test_control_room_partial_chf_graded_chart_v1.js
          node validation/test_control_room_chf_nzd_rates_research_v1.js
          node validation/test_nzd_rbnz_b2_latest_web_research_v1.js
          python validation/cb_pricing/test_build_ois_source_readiness_view_v1.py
      - name: Validate Preview browser QA JavaScript syntax
        run: node --check validation/qa_control_room_v10_public.js
      - name: Check public URL with actual feeds and navigation
        run: node validation/qa_control_room_v10_public.js
