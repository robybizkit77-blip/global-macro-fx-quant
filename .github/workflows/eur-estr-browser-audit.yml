name: EUR ESTR Browser Audit

on:
  push:
    branches:
      - staging-eur-estr-history-parse-2026-09-30
  workflow_dispatch:

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/gmfq-server.log 2>&1 &
          sleep 2
      - name: Verify EUR ACTIVE runtime
        run: |
          cat > browser-audit.js <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const { execSync } = require('child_process');
            const chromePath=execSync('command -v google-chrome-stable || command -v google-chrome || command -v chromium').toString().trim();
            console.log('CHROME_PATH',chromePath);
            const browser=await chromium.launch({headless:true,executablePath:chromePath,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            const consoleErrors=[], pageErrors=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            const res=await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle',timeout:120000});
            if(!res?.ok()) throw new Error('HTTP load failed');
            await page.waitForFunction(()=>document.documentElement.getAttribute('data-post-gate-final-audit'),null,{timeout:120000});
            const x=await page.evaluate(()=>{
              const eur=window.__GMFQ_DATA?.OIS_DATA?.currencies?.EUR;
              return {
                title:document.title,
                finalAudit:window.GMFQ_POST_GATE_FINAL_AUDIT||null,
                eurAudit:window.GMFQ_EUR_ESTR_HISTORY_AUDIT||null,
                eurStatus:window.GMFQ_OIS?.currency?.('EUR')?.status||null,
                gbpStatus:window.GMFQ_OIS?.currency?.('GBP')?.status||null,
                cadStatus:window.GMFQ_OIS?.currency?.('CAD')?.status||null,
                eur,
                nativePricing:window.NATIVE_CB_DATA?.EUR?.market_pricing||null,
                bodyTextLength:document.body?.innerText?.length||0
              };
            });
            console.log(JSON.stringify({x,consoleErrors,pageErrors},null,2));
            if(x.finalAudit?.status!=='PASS') throw new Error('Final audit '+JSON.stringify(x.finalAudit));
            if(x.eurAudit?.status!=='PASS') throw new Error('EUR audit '+JSON.stringify(x.eurAudit));
            if(x.eurStatus!=='ACTIVE'||x.gbpStatus!=='ACTIVE'||x.cadStatus!=='ACTIVE') throw new Error('ACTIVE status mismatch');
            if(Math.abs(Number(x.eur?.horizons?.['3m']?.rate)-2.7975)>1e-9) throw new Error('EUR 3m mismatch');
            if(Math.abs(Number(x.eur?.horizons?.['6m']?.rate)-3.13)>1e-9) throw new Error('EUR 6m mismatch');
            if(Math.abs(Number(x.eur?.horizons?.['12m']?.rate)-3.3975)>1e-9) throw new Error('EUR 12m mismatch');
            if(Math.abs(Number(x.nativePricing?.h3m)-2.7975)>1e-9) throw new Error('Native pricing mismatch');
            if(consoleErrors.length||pageErrors.length) throw new Error('Browser errors: '+consoleErrors.concat(pageErrors).join(' | '));
            if(x.bodyTextLength<1000) throw new Error('Body too small');
            await page.screenshot({path:'eur-estr-browser-audit.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node browser-audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eur-estr-browser-audit
          path: |
            eur-estr-browser-audit.png
            /tmp/gmfq-server.log
