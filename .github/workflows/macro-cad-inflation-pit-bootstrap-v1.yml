name: Macro CAD Inflation PIT Bootstrap V1

on:
  push:
    branches:
      - 'validation-macro-cad-inflation-pit-bootstrap-*'
    paths:
      - '.github/workflows/macro-cad-inflation-pit-bootstrap-v1.yml'
      - 'validation/macro_pit_historical_bootstrap.py'
      - 'validation/test_macro_pit_historical_bootstrap.py'
      - 'validation/macro_pit_registry_promotion.py'
      - 'validation/test_macro_pit_registry_promotion.py'
      - 'validation/macro/cad_inflation_historical_anchor_2026-08.json'
      - 'validation/sources/cad_statcan_core.py'
      - 'validation/build_macro_candidate.py'
      - 'validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json'
      - 'live_data/sections/MACRO_SERIES.json'
      - 'live_data/sections/MACRO_THERMOMETER_DATA.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macro-cad-inflation-pit-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  historical-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run bootstrap and promotion fail-closed tests
        run: |
          python3 validation/test_macro_pit_historical_bootstrap.py
          python3 validation/test_macro_pit_registry_promotion.py

      - name: Verify current official Statistics Canada CPI candidate read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cad-cpi-bootstrap/live
          python3 validation/sources/cad_statcan_core.py \
            --dimension inflation \
            --output /tmp/cad-cpi-bootstrap/live/candidate.json \
            --audit-output /tmp/cad-cpi-bootstrap/live/source-audit.json \
            | tee /tmp/cad-cpi-bootstrap/live/source-run.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/cad-cpi-bootstrap/live/candidate.json').read_text())
          a=json.loads(Path('/tmp/cad-cpi-bootstrap/live/source-audit.json').read_text())
          m=json.loads(Path('validation/macro/cad_inflation_historical_anchor_2026-08.json').read_text())
          assert c['currency']=='CAD' and c['dimension']=='inflation'
          assert c['series_id']==m['series_id']=='CA_CPI_HEADLINE_YOY'
          assert c['macro_series_id']==m['target']['macro_series_id']=='CA_CPI_HEADLINE_YOY_history_value'
          assert c['observation_date'][:7]==m['current']['observation_date'][:7]
          assert float(c['value'])==float(m['current']['value'])==3.0
          assert a['mode']=='live' and a['candidate_only'] is True and a['live_data_written'] is False
          print(json.dumps({'status':'CURRENT_OFFICIAL_CAD_CPI_MATCH','candidate':c}, indent=2))
          PY
          git diff --exit-code -- live_data/sections/MACRO_SERIES.json live_data/sections/MACRO_THERMOMETER_DATA.json

      - name: Run historical PIT bootstrap replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cad-cpi-bootstrap/replay
          python3 validation/macro_pit_historical_bootstrap.py \
            --anchor-manifest validation/macro/cad_inflation_historical_anchor_2026-08.json \
            --evidence-output /tmp/cad-cpi-bootstrap/macro_pit_anchor_evidence.json \
            --work-dir /tmp/cad-cpi-bootstrap/replay \
            | tee /tmp/cad-cpi-bootstrap/bootstrap-run.json

      - name: Verify review-only registry promotion or pinned certification
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/macro_pit_registry_promotion.py \
            --evidence /tmp/cad-cpi-bootstrap/macro_pit_anchor_evidence.json \
            --proposed-registry /tmp/cad-cpi-bootstrap/proposed-registry.json \
            --receipt /tmp/cad-cpi-bootstrap/promotion-receipt.json \
            | tee /tmp/cad-cpi-bootstrap/promotion-run.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          canonical=json.loads(Path('validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json').read_text())
          proposed=json.loads(Path('/tmp/cad-cpi-bootstrap/proposed-registry.json').read_text())
          receipt=json.loads(Path('/tmp/cad-cpi-bootstrap/promotion-receipt.json').read_text())
          evidence=json.loads(Path('/tmp/cad-cpi-bootstrap/macro_pit_anchor_evidence.json').read_text())
          key='CAD.inflation'
          row=canonical['series'][key]
          prow=proposed['series'][key]
          assert receipt['status']=='PASS' and receipt['target']==key
          assert receipt['evidence_class']=='RECONSTRUCTED_HISTORICAL_REPLAY'
          assert evidence['bootstrap_provenance']['official_release_pair_verified'] is True
          assert prow['historical_replay_certified'] is True
          pref=prow['historical_replay_evidence']
          assert pref['evidence_class']=='RECONSTRUCTED_HISTORICAL_REPLAY'
          assert pref['official_release_pair_verified'] is True
          assert pref['macro_series_id']==evidence['target']['macro_series_id']
          assert pref['observation_date']==evidence['candidate']['observation_date']
          assert float(pref['value'])==float(evidence['candidate']['value'])
          if row.get('historical_replay_certified') is not True:
              assert receipt['promotion_action']=='PROPOSAL_CREATED'
              c2=json.loads(json.dumps(canonical)); p2=json.loads(json.dumps(proposed))
              c2['series'][key].pop('historical_replay_certified',None)
              p2['series'][key].pop('historical_replay_certified',None)
              p2['series'][key].pop('historical_replay_evidence',None)
              assert c2==p2
          print(json.dumps({'status':'CAD_INFLATION_CERTIFICATION_SCOPE_PASS','target':key,'promotion_action':receipt['promotion_action']}, indent=2))
          PY

      - name: Enforce no canonical publication
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- live_data payload validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json

      - name: Upload bootstrap and promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-cad-inflation-pit-bootstrap-${{ github.run_id }}
          path: /tmp/cad-cpi-bootstrap/
          if-no-files-found: error
          retention-days: 90
