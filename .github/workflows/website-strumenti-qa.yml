name: Website Strumenti QA

on:
  push:
    branches:
      - website-reference-lock-2026-10-16
    paths:
      - 'site/website-v1/strumenti.*'
      - 'site/website-v1/app.js'
      - 'site/website-v1/price-runtime.js'
      - 'live_data/sections/NATIVE_RATES_DATA.json'
      - 'live_data/sections/OIS_OPERATIONAL_VIEW.json'
      - 'live_data/sections/V250_COT_CHART_DATA.json'
      - 'live_data/sections/PAIR_SETUP_OPERATIONAL_VIEW.json'
      - '.github/workflows/website-strumenti-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strumenti-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start Website V1
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/strumenti-qa.log 2>&1 &
          sleep 2
      - name: Verify tools math, canonical data and mobile layout
        run: |
          cat > strumenti-qa.js <<'NODE'
          const { chromium }=require('playwright');
          const base='http://127.0.0.1:8000/site/website-v1/';
          async function audit(viewport,label){
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            const r=await page.goto(base+'strumenti.html',{waitUntil:'networkidle',timeout:120000});if(!r||!r.ok())throw new Error(`${label}: HTTP ${r?.status()}`);
            await page.waitForFunction(()=>document.documentElement.dataset.strumentiPage==='READY'&&document.documentElement.dataset.strumentiMatrix==='READY',null,{timeout:30000});
            const x=await page.evaluate(()=>({
              a:document.querySelectorAll('#tool-a option').length,b:document.querySelectorAll('#tool-b option').length,
              rates:document.querySelectorAll('#rates-matrix .diff-cell[data-row]').length,
              ois:document.querySelectorAll('#ois-matrix-tools .diff-cell[data-row]').length,
              title:document.getElementById('compare-title')?.textContent||'',
              setup:document.getElementById('setup-view')?.innerText||'',
              priceRuntime:document.documentElement.getAttribute('data-website-price-runtime'),
              overflow:document.documentElement.scrollWidth-window.innerWidth,
              body:document.body.innerText||''
            }));
            if(x.a!==8||x.b!==8)throw new Error(`${label}: selector coverage ${x.a}/${x.b}`);
            if(x.rates!==64||x.ois!==64)throw new Error(`${label}: matrix coverage rates=${x.rates} ois=${x.ois}`);
            if(!x.title.includes('EUR/USD'))throw new Error(`${label}: default comparator orientation unexpected: ${x.title}`);
            if(!x.setup.toUpperCase().includes('VANTAGGIO STRUTTURALE'))throw new Error(`${label}: setup panel missing`);
            if(x.priceRuntime!=='CURRENT_OFFICIAL')throw new Error(`${label}: canonical Price runtime not ready`);
            for(const bad of ['undefined','[object Object]','NaN'])if(x.body.includes(bad))throw new Error(`${label}: bad token ${bad}`);
            if(x.overflow>12)throw new Error(`${label}: hard horizontal overflow ${x.overflow}px`);
            const anti=await page.evaluate(()=>{
              const check=host=>{const cells=[...document.querySelectorAll(`${host} .diff-cell[data-row]`)];const map=new Map(cells.map(c=>[`${c.dataset.row}:${c.dataset.col}`,c.textContent.trim()]));let tested=0;for(const c of cells){const a=c.dataset.row,b=c.dataset.col,v=c.textContent.trim(),w=map.get(`${b}:${a}`);if(a===b){if(v!=='0')return{ok:false,why:`diag ${a}=${v}`};continue}if(v==='—'||w==='—')continue;const x=Number(v),y=Number(w);if(!Number.isFinite(x)||!Number.isFinite(y)||Math.abs(x+y)>1)return{ok:false,why:`${a}/${b}: ${v} vs ${w}`};tested++;}return{ok:true,tested};};return{rates:check('#rates-matrix'),ois:check('#ois-matrix-tools')};
            });
            if(!anti.rates.ok||anti.rates.tested<40)throw new Error(`${label}: rates antisymmetry failed ${JSON.stringify(anti.rates)}`);
            if(!anti.ois.ok||anti.ois.tested<10)throw new Error(`${label}: OIS antisymmetry failed ${JSON.stringify(anti.ois)}`);
            await page.selectOption('#tool-a','GBP');await page.selectOption('#tool-b','JPY');await page.waitForTimeout(100);
            const changed=await page.locator('#compare-title').innerText();if(!changed.includes('GBP/JPY'))throw new Error(`${label}: comparator selector did not update (${changed})`);
            await page.click('#ois-horizon [data-h="12m"]');await page.waitForTimeout(100);if(!(await page.locator('#ois-horizon [data-h="12m"]').getAttribute('class')||'').includes('active'))throw new Error(`${label}: OIS horizon switch failed`);
            await page.screenshot({path:`strumenti-${label}.png`,fullPage:false});
            if(errors.length)throw new Error(`${label}: browser errors ${errors.join(' | ')}`);await browser.close();
          }
          (async()=>{await audit({width:1672,height:905},'desktop');await audit({width:390,height:844},'mobile');const browser=await chromium.launch({headless:true});const home=await browser.newPage({viewport:{width:1672,height:905}});await home.goto(base,{waitUntil:'networkidle'});const href=await home.locator('.nav-sub a').filter({hasText:'Strumenti'}).getAttribute('href');if(href!=='strumenti.html')throw new Error(`Home Strumenti route invalid: ${href}`);await browser.close();console.log('WEBSITE_STRUMENTI_QA_PASS')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node strumenti-qa.js
      - name: Upload Strumenti evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-strumenti-qa-${{ github.run_id }}
          path: |
            strumenti-desktop.png
            strumenti-mobile.png
          if-no-files-found: warn
          retention-days: 30
