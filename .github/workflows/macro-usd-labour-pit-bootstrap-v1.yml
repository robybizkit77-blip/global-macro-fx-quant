name: Macro USD Labour PIT Bootstrap V1
# Temporary format-cleanup execution on the already validated USD labour path.

on:
  push:
    branches:
      - 'validation-macro-usd-labour-pit-bootstrap-*'
    paths:
      - '.github/workflows/macro-usd-labour-pit-bootstrap-v1.yml'
      - 'validation/macro_pit_historical_bootstrap.py'
      - 'validation/test_macro_pit_historical_bootstrap.py'
      - 'validation/macro_pit_registry_promotion.py'
      - 'validation/test_macro_pit_registry_promotion.py'
      - 'validation/macro/usd_labour_historical_anchor_2026-09.json'
      - 'validation/sources/us_bls_core_macro.py'
      - 'validation/build_macro_candidate.py'
      - 'validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json'
      - 'live_data/sections/MACRO_SERIES.json'
      - 'live_data/sections/MACRO_THERMOMETER_DATA.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-usd-labour-pit-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  historical-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run bootstrap and promotion fail-closed tests
        run: |
          python3 validation/test_macro_pit_historical_bootstrap.py
          python3 validation/test_macro_pit_registry_promotion.py

      - name: Verify current official BLS unemployment candidate read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/usd-labour-bootstrap/live
          python3 validation/sources/us_bls_core_macro.py \
            --output-dir /tmp/usd-labour-bootstrap/live \
            --start-year 2025 --end-year 2026 \
            | tee /tmp/usd-labour-bootstrap/live/source-run.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/usd-labour-bootstrap/live/labour-candidate.json').read_text())
          a=json.loads(Path('/tmp/usd-labour-bootstrap/live/source-audit.json').read_text())
          m=json.loads(Path('validation/macro/usd_labour_historical_anchor_2026-09.json').read_text())
          assert c['currency']=='USD' and c['dimension']=='labour'
          assert c['series_id']==m['series_id']=='UNRATE'
          assert c['macro_series_id']==m['target']['macro_series_id']=='US_UNRATE_history_value'
          assert c['observation_date'][:7]==m['current']['observation_date'][:7]
          assert float(c['value'])==float(m['current']['value'])==4.2
          assert a['labour']['prior_period'][:7]==m['previous']['observation_date'][:7]
          assert float(a['labour']['prior_value'])==float(m['previous']['value'])==4.1
          assert a['mode']=='live' and a['candidate_only'] is True and a['live_data_written'] is False
          print(json.dumps({'status':'CURRENT_OFFICIAL_USD_LABOUR_MATCH','candidate':c,'official_pair':a['labour']}, indent=2))
          PY
          git diff --exit-code -- live_data/sections/MACRO_SERIES.json live_data/sections/MACRO_THERMOMETER_DATA.json

      - name: Run historical PIT bootstrap replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/usd-labour-bootstrap/replay
          python3 validation/macro_pit_historical_bootstrap.py \
            --anchor-manifest validation/macro/usd_labour_historical_anchor_2026-09.json \
            --evidence-output /tmp/usd-labour-bootstrap/macro_pit_anchor_evidence.json \
            --work-dir /tmp/usd-labour-bootstrap/replay \
            | tee /tmp/usd-labour-bootstrap/bootstrap-run.json

      - name: Verify review-only registry promotion or pinned certification
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/macro_pit_registry_promotion.py \
            --evidence /tmp/usd-labour-bootstrap/macro_pit_anchor_evidence.json \
            --proposed-registry /tmp/usd-labour-bootstrap/proposed-registry.json \
            --receipt /tmp/usd-labour-bootstrap/promotion-receipt.json \
            | tee /tmp/usd-labour-bootstrap/promotion-run.json
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          canonical=json.loads(Path('validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json').read_text())
          proposed=json.loads(Path('/tmp/usd-labour-bootstrap/proposed-registry.json').read_text())
          receipt=json.loads(Path('/tmp/usd-labour-bootstrap/promotion-receipt.json').read_text())
          evidence=json.loads(Path('/tmp/usd-labour-bootstrap/macro_pit_anchor_evidence.json').read_text())
          key='USD.labour'
          row=canonical['series'][key]
          prow=proposed['series'][key]
          assert receipt['status']=='PASS' and receipt['target']==key
          assert receipt['evidence_class']=='RECONSTRUCTED_HISTORICAL_REPLAY'
          assert evidence['bootstrap_provenance']['official_release_pair_verified'] is True
          assert evidence['bootstrap_provenance']['before_state'].startswith('RECONSTRUCTED_')
          assert prow['historical_replay_certified'] is True
          pref=prow['historical_replay_evidence']
          assert pref['evidence_class']=='RECONSTRUCTED_HISTORICAL_REPLAY'
          assert pref['official_release_pair_verified'] is True
          assert pref['macro_series_id']==evidence['target']['macro_series_id']
          assert pref['observation_date']==evidence['candidate']['observation_date']
          assert float(pref['value'])==float(evidence['candidate']['value'])
          if row.get('historical_replay_certified') is not True:
              assert receipt['promotion_action']=='PROPOSAL_CREATED'
              c2=json.loads(json.dumps(canonical)); p2=json.loads(json.dumps(proposed))
              c2['series'][key].pop('historical_replay_certified',None)
              p2['series'][key].pop('historical_replay_certified',None)
              p2['series'][key].pop('historical_replay_evidence',None)
              assert c2==p2, 'promotion proposal changed fields outside USD labour certification metadata'
          else:
              assert receipt['promotion_action'] in {'METADATA_ENRICHMENT_PROPOSED','ALREADY_CERTIFIED'}
              existing=row['historical_replay_evidence']
              assert pref['evidence_sha256']==existing['evidence_sha256']
              assert pref['before_git_head']==existing['before_git_head']
              assert pref['after_git_head']==existing['after_git_head']
              subprocess.run(['git','merge-base','--is-ancestor',existing['after_git_head'],'HEAD'], check=True)
          print(json.dumps({'status':'USD_LABOUR_CERTIFICATION_SCOPE_PASS','target':key,'promotion_action':receipt['promotion_action']}, indent=2))
          PY

      - name: Enforce no canonical publication
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- live_data payload validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json

      - name: Upload bootstrap and promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-usd-labour-pit-bootstrap-${{ github.run_id }}
          path: /tmp/usd-labour-bootstrap/
          if-no-files-found: error
          retention-days: 90

      - name: Restore canonical registry formatting and push format-only commit
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json')
          s=p.read_text()
          replacements={
'''    "currencies": [
      "USD",
      "EUR",
      "GBP",
      "JPY",
      "CHF",
      "CAD",
      "AUD",
      "NZD"
    ],''':'    "currencies": ["USD", "EUR", "GBP", "JPY", "CHF", "CAD", "AUD", "NZD"],',
'''    "dimensions": [
      "inflation",
      "labour"
    ],''':'    "dimensions": ["inflation", "labour"],',
'''    "supported_currencies": [
      "USD",
      "EUR",
      "GBP",
      "JPY",
      "CHF",
      "CAD",
      "AUD",
      "NZD"
    ],''':'    "supported_currencies": ["USD", "EUR", "GBP", "JPY", "CHF", "CAD", "AUD", "NZD"],',
'''    "supported_dimensions": [
      "inflation",
      "labour"
    ]''':'    "supported_dimensions": ["inflation", "labour"]'
          }
          for old,new in replacements.items():
              assert s.count(old)==1
              s=s.replace(old,new)
          p.write_text(s)
          PY
          python3 -m json.tool validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json >/dev/null
          git diff --exit-code -- live_data payload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json
          git commit -m 'Restore canonical registry formatting after USD labour promotion'
          git push origin HEAD:${GITHUB_REF_NAME}
