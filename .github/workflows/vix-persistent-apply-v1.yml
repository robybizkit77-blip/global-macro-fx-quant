name: VIX Persistent Apply V1

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/vix-persistent-apply-v1.yml', 'validation/fetch_cboe_vix_candidate_v2.py', 'validation/apply_cboe_vix_candidate_v1.py', 'validation/risk/test_vix_persistent_schedule_contract_v1.py']
  push:
    branches: [main]
    paths: ['.github/workflows/vix-persistent-apply-v1.yml', 'validation/fetch_cboe_vix_candidate_v2.py', 'validation/apply_cboe_vix_candidate_v1.py', 'validation/risk/test_vix_persistent_schedule_contract_v1.py']
  workflow_dispatch:
  schedule:
    # UTC duplicates cover CET/CEST; delayed GitHub runs must still check Cboe.
    # The candidate's official-date, maximum-business-day-lag, and anchored
    # append/idempotence gates (not wall-clock minutes) decide whether to write.
    - cron: '15 21 * * 1-5'
    - cron: '45 21 * * 1-5'
    - cron: '15 22 * * 1-5'
    - cron: '45 22 * * 1-5'

permissions: {contents: write}
concurrency: {group: vix-persistent-apply-v1, cancel-in-progress: false}

jobs:
  persist-vix-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: true}
      - name: Admit delayed Rome schedule runs (source freshness is the real gate)
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          echo "VIX admission: event=${{ github.event_name }} Rome time=$(TZ=Europe/Rome date +'%Y-%m-%d %H:%M:%S %Z')"
          echo 'should_run=true' >> "$GITHUB_OUTPUT"
          echo 'VIX_SCHEDULER_ADMISSION_PASS — every delayed scheduled run checks the official Cboe date and full source anchor'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.should_run == 'true'
        with: {python-version: '3.12'}
      - name: Regression-test delayed schedule, strict source/anchor and main push lease
        if: steps.gate.outputs.should_run == 'true'
        run: python -m unittest validation.risk.test_vix_persistent_schedule_contract_v1 -v
      - name: Snapshot baseline
        if: steps.gate.outputs.should_run == 'true'
        run: |
          mkdir -p /tmp/vix-persistent
          git rev-parse HEAD > /tmp/vix-persistent/base-sha
          cp live_data/sections/D.json /tmp/vix-persistent/D.before.json
      - name: Fetch official Cboe candidate and build replacement
        id: candidate
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          python validation/fetch_cboe_vix_candidate_v2.py --as-of "$(date -u +%F)" --out /tmp/vix-persistent/candidate.json | tee /tmp/vix-persistent/source-receipt.json
          python validation/apply_cboe_vix_candidate_v1.py --candidate /tmp/vix-persistent/candidate.json --replacement-out /tmp/vix-persistent/D.replacement.json | tee /tmp/vix-persistent/apply-receipt.json
          python - <<'PY'
          import json
          c=json.load(open('/tmp/vix-persistent/candidate.json')); r=json.load(open('/tmp/vix-persistent/apply-receipt.json'))
          assert c['status']=='GREEN_OFFICIAL_SOURCE_CANDIDATE' and c['source']['publisher']=='Cboe Global Markets',c
          assert c['business_day_lag']<=c['max_business_day_lag'] and r['other_risk_keys_preserved'] is True,(c,r)
          PY
          if cmp -s live_data/sections/D.json /tmp/vix-persistent/D.replacement.json; then echo 'status=NO_CHANGE' >> "$GITHUB_OUTPUT"; else echo 'status=UPDATE_AVAILABLE' >> "$GITHUB_OUTPUT"; fi
      - name: Apply update, rebuild runtime and validate exact scope
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'UPDATE_AVAILABLE'
        run: |
          set -euo pipefail
          python validation/update_live_direct_section.py --section D --replacement /tmp/vix-persistent/D.replacement.json --apply > /tmp/vix-persistent/direct-apply.json
          python validation/build_live_manifest_v2.py --write live_data/manifest.v2.json > /tmp/vix-persistent/manifest-rebuild.json
          python validation/check_live_update_contract.py > /tmp/vix-persistent/live-contract.json
          python validation/rebuild_live_data_runtime.py --verify-only > /tmp/vix-persistent/runtime-roundtrip.json
          python - <<'PY'
          import json,subprocess
          before=json.load(open('/tmp/vix-persistent/D.before.json')); after=json.load(open('live_data/sections/D.json'))
          br=dict(before['risk']); ar=dict(after['risk']); bv=br.pop('VIX'); av=ar.pop('VIX')
          assert br==ar and {**before,'risk':br}=={**after,'risk':ar}
          assert av['dates'][:len(bv['dates'])]==bv['dates'] and av['values'][:len(bv['values'])]==bv['values'] and len(av['dates'])>len(bv['dates'])
          assert json.load(open('/tmp/vix-persistent/live-contract.json'))['status']=='PASS'
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())=={'live_data/sections/D.json','live_data/manifest.v2.json','payload/part-00.txt'}
          PY
      - name: Validate no-change identity
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'NO_CHANGE'
        run: |
          set -euo pipefail
          python validation/check_live_update_contract.py
          python validation/rebuild_live_data_runtime.py --verify-only
          cmp -s live_data/sections/D.json /tmp/vix-persistent/D.replacement.json
          git diff --exit-code -- live_data payload
      - name: Validation branch restores runtime
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'UPDATE_AVAILABLE' && github.ref != 'refs/heads/main'
        run: |
          git restore --source=HEAD --worktree -- live_data payload
          git diff --exit-code -- live_data payload
      - name: Persist to main with remote-head lease
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'UPDATE_AVAILABLE' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          BASE="$(cat /tmp/vix-persistent/base-sha)"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$BASE"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- live_data/sections/D.json live_data/manifest.v2.json payload/part-00.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh VIX runtime from official Cboe close'
          git push --force-with-lease=refs/heads/main:$BASE origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.should_run == 'true'
        with:
          name: vix-persistent-${{ github.run_id }}
          path: /tmp/vix-persistent/
          if-no-files-found: warn
          retention-days: 30
