name: Publish Dashboard Pages V1

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/publish-dashboard-pages-v1.yml','index.html','payload/**','dashboard/**','live_data/sections/OIS_DATA.json','live_data/sections/OIS_OPERATIONAL_VIEW.json','live_data/sections/CALENDAR_OPERATIONAL_VIEW.json','live_data/sections/NEWS_PULSE_OPERATIONAL.json','live_data/sections/MACRO_THERMOMETER_DATA.json','live_data/sections/MACRO_SERIES.json','live_data/sections/D.json','live_data/sections/ESTIMATED_RESIDUAL_GAPS.json','live_data/sections/V247_COT_STORIES.json','live_data/sections/RATES_AUDIT_METADATA.json','live_data/manifest.v2.json','live_data/sections/NATIVE_CB_DATA.json','live_data/sections/CHF_SNB_10Y_SPOT_CONTEXT.json','live_data/sections/NZD_CB_PRICING_DIRECTIONAL_PROXY.json','live_data/sections/NZD_B2_GOVT_WEB_REVIEW_CONTEXT.json','live_data/sections/OIS_SOURCE_READINESS_VIEW.json','validation/publishing/verify_pages_http_delivery_v1.py','validation/publishing/test_verify_pages_http_delivery_v1.py','validation/publishing/test_pages_operational_ois_summary_source_v1.py','validation/publishing/check_control_room_feed_mirrors_v1.py','validation/publishing/test_macro_series_pages_mirror_v1.py','validation/cb_pricing/check_ois_readiness_parity_v1.py','validation/cb_pricing/test_check_ois_readiness_parity_v1.py','validation/calendar/verify_future_macro_coverage_v1.py','validation/calendar/test_verify_future_macro_coverage_v1.py','validation/publishing/check_pages_morning_readiness_v1.py','validation/publishing/test_pages_morning_readiness_v1.py','validation/publishing/test_pages_main_source_lease_v1.py','validation/publishing/check_pages_0800_delivery_sla_v1.py','validation/publishing/test_check_pages_0800_delivery_sla_v1.py','validation/orchestration/test_morning_source_drift_contract_v1.py']
  push:
    branches: [main]
    paths: ['.github/workflows/publish-dashboard-pages-v1.yml','index.html','payload/**','dashboard/**','live_data/sections/OIS_DATA.json','live_data/sections/OIS_OPERATIONAL_VIEW.json','live_data/sections/CALENDAR_OPERATIONAL_VIEW.json','live_data/sections/NEWS_PULSE_OPERATIONAL.json','live_data/sections/MACRO_THERMOMETER_DATA.json','live_data/sections/MACRO_SERIES.json','live_data/sections/D.json','live_data/sections/ESTIMATED_RESIDUAL_GAPS.json','live_data/sections/V247_COT_STORIES.json','live_data/sections/RATES_AUDIT_METADATA.json','live_data/manifest.v2.json','live_data/sections/NATIVE_CB_DATA.json','live_data/sections/CHF_SNB_10Y_SPOT_CONTEXT.json','live_data/sections/NZD_CB_PRICING_DIRECTIONAL_PROXY.json','live_data/sections/NZD_B2_GOVT_WEB_REVIEW_CONTEXT.json','live_data/sections/OIS_SOURCE_READINESS_VIEW.json','validation/publishing/verify_pages_http_delivery_v1.py','validation/publishing/test_verify_pages_http_delivery_v1.py','validation/publishing/test_pages_operational_ois_summary_source_v1.py','validation/publishing/check_control_room_feed_mirrors_v1.py','validation/publishing/test_macro_series_pages_mirror_v1.py','validation/cb_pricing/check_ois_readiness_parity_v1.py','validation/cb_pricing/test_check_ois_readiness_parity_v1.py','validation/calendar/verify_future_macro_coverage_v1.py','validation/calendar/test_verify_future_macro_coverage_v1.py','validation/publishing/check_pages_morning_readiness_v1.py','validation/publishing/test_pages_morning_readiness_v1.py','validation/publishing/test_pages_main_source_lease_v1.py','validation/publishing/check_pages_0800_delivery_sla_v1.py','validation/publishing/test_check_pages_0800_delivery_sla_v1.py','validation/orchestration/test_morning_source_drift_contract_v1.py']
  workflow_run:
    workflows: ['Macro Persistent Daily V1','CB Pricing Persistent Daily V1','OIS Estimated Snapshot Repricing V1','OIS G8 History Persistent Daily V1','Calendar News Operational Refresh V1','Macro 30 October 2026 targeted official actual fast checks','Price Persistent Daily V1','Rates Persistent Daily V1','COT Persistent Weekly V1','Liquidity JPY M3 Persistent Daily V1','VIX Persistent Apply V1','WTI Persistent Rebuild V1','Brent Market Proxy Refresh V1','Gold Secondary Market Proxy Refresh V1','CHF Residual Proxy Refresh V1','JPY Reserve Balances Proxy Refresh V1']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# Preserve pending morning writes/retries instead of replacing an older
# pending run when another workflow/event is triggered in the same group.
# Each attempt remains serialized; downstream source/lease checks still apply.
# PR validation never occupies the production writer/retry queue.
# All main, workflow_run, workflow_dispatch and schedule triggers retain
# the original shared production group and serialized writes.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-validation-pr-{0}', github.event.pull_request.number) || 'publish-dashboard-pages-v1' }}
  queue: max
  cancel-in-progress: false

jobs:
  publish-pages:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Confirm actual Pages source configuration (read-only PR check)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cfg="$(gh api "repos/${GITHUB_REPOSITORY}/pages")"
          jq -e '.source.branch == "gh-pages" and .source.path == "/"' <<<"$cfg" > /dev/null
          echo "PAGES_SOURCE_GH_PAGES_ROOT_CONFIRMED"
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest")"
          jq -e '.status and .commit' <<<"$latest" > /dev/null
          echo "PAGES_BUILD_LATEST_READ_OK"

      - name: Assert exact operational OIS summary source before publishing (not canonical OIS_DATA)
        run: python validation/publishing/test_pages_operational_ois_summary_source_v1.py

      - name: Verify all 15 Control Room sources have a single Pages mirror owner
        run: python validation/publishing/check_control_room_feed_mirrors_v1.py

      - name: Test standalone Macro series mirror ownership without changing Core D
        run: python validation/publishing/test_macro_series_pages_mirror_v1.py

      - name: Test bounded public HTTP convergence contract
        run: python validation/publishing/test_verify_pages_http_delivery_v1.py

      - name: Fail closed on stale pending-source dossier before public mirror
        run: |
          python validation/cb_pricing/check_ois_readiness_parity_v1.py
          python validation/cb_pricing/test_check_ois_readiness_parity_v1.py

      - name: Test next-morning source-drift guards (read-only)
        run: python -m unittest validation.orchestration.test_morning_source_drift_contract_v1 -v
      - name: Verify current dashboard runtime before publication
        shell: bash
        run: |
          set -euo pipefail
          python validation/check_live_update_contract.py | tee /tmp/pages-live-contract.json
          python validation/rebuild_live_data_runtime.py --verify-only | tee /tmp/pages-runtime-roundtrip.json
          python validation/build_calendar_operational_v1.py | tee /tmp/pages-calendar-build.json
          python -m unittest validation.calendar.test_verify_future_macro_coverage_v1 -v
          python - <<'PY'
          import json
          from pathlib import Path
          contract=json.load(open('/tmp/pages-live-contract.json'))
          runtime=json.load(open('/tmp/pages-runtime-roundtrip.json'))
          calendar_build=json.load(open('/tmp/pages-calendar-build.json'))
          assert contract['status']=='PASS', contract
          assert runtime['status']=='PASS' and runtime.get('noop_roundtrip_byte_identical') is True, runtime
          assert calendar_build['status']=='PASS', calendar_build
          index=Path('index.html').read_text(encoding='utf-8')
          parts=[Path(f'payload/part-{i:02d}.txt') for i in range(16)]
          assert all(p.is_file() for p in parts)
          for p in parts: assert str(p).replace('\\','/') in index, p
          payload='\n'.join(p.read_text(encoding='utf-8') for p in parts)
          assert 'GMFQ_RUNTIME_VALIDATION_MANIFEST' in payload
          assert '<script id="gmfq-post-gate-final-audit-settlement">' in payload
          assets=[
            'dashboard/ois-operational-monitor-v1.js','dashboard/calendar-news-operational-v1.js',
            'dashboard/top-themes-operational-v1.js','dashboard/what-changed-operational-v1.js',
            'dashboard/risk-operational-v1.js','dashboard/cotdesk-operational-v1.js','dashboard/pairs-operational-v1.js',
            'dashboard/overview-asof-operational-v1.js','dashboard/currencies-operational-v1.js',
            'dashboard/macro-operational-v1.js','dashboard/ratesdesk-operational-v1.js',
            'dashboard/cbdesk-operational-v1.js','dashboard/liquiditydesk-operational-v1.js','dashboard/forwarddesk-operational-v1.js',
            'dashboard/editorial-freshness-guard-v1.js','dashboard/premium-shell-v1.js','dashboard/product-language-v1.js','dashboard/overview-hierarchy-v1.js','dashboard/inflationlabour-hierarchy-v1.js','dashboard/calendar-hierarchy-v1.js','dashboard/themes-hierarchy-v1.js','dashboard/currencies-hierarchy-v1.js'
          ]
          for asset in assets:
              assert asset in index, asset
              p=Path(asset); assert p.is_file() and p.stat().st_size>1000, asset
          ois_official=json.loads(Path('live_data/sections/OIS_DATA.json').read_text())
          ois=json.loads(Path('live_data/sections/OIS_OPERATIONAL_VIEW.json').read_text())
          assert ois_official['schema_version'] and set(ois_official['currencies'])=={'USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'}
          assert {c for c,v in ois_official['currencies'].items() if v['status']=='ACTIVE'}=={
            c for c,v in ois['currencies'].items() if v['operational_status']=='GREEN_OFFICIAL'}
          cal=json.loads(Path('live_data/sections/CALENDAR_OPERATIONAL_VIEW.json').read_text())
          news=json.loads(Path('live_data/sections/NEWS_PULSE_OPERATIONAL.json').read_text())
          macro_heat=json.loads(Path('live_data/sections/MACRO_THERMOMETER_DATA.json').read_text())
          d=json.loads(Path('live_data/sections/D.json').read_text())
          residual=json.loads(Path('live_data/sections/ESTIMATED_RESIDUAL_GAPS.json').read_text())
          # Publish the derived COT story and runtime manifest with the same
          # payload that passed the numeric->story->payload integrity gate.
          import hashlib
          story_bytes=Path('live_data/sections/V247_COT_STORIES.json').read_bytes()
          story=json.loads(story_bytes)
          manifest=json.loads(Path('live_data/manifest.v2.json').read_text())
          spec=next(x for x in manifest['sections'] if x['key']=='V247_COT_STORIES')
          assert spec['mode']=='DERIVED_BUILDER_REQUIRED'
          assert spec['bytes']==len(story_bytes)
          assert spec['sha256']==hashlib.sha256(story_bytes).hexdigest()
          if story['USD']['today'].startswith('CFTC al 2026-10-13:'):
              assert story['USD']['signal']=='EXTREME LONG'
          print('COT_PAGES_ATOMIC_PREFLIGHT_GREEN')
          # Protect mirror semantics before making additional public copies.
          cb=json.loads(Path('live_data/sections/NATIVE_CB_DATA.json').read_text())
          g8={'USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'}
          assert set(cb)==g8 and all(isinstance(cb[c].get('rate'),(int,float))
            and cb[c].get('last_date') and cb[c].get('next_meeting')
            and cb[c].get('market_pricing',{}).get('as_of') for c in g8)
          chf=json.loads(Path('live_data/sections/CHF_SNB_10Y_SPOT_CONTEXT.json').read_text())
          assert chf['schema']=='GMFQ_CHF_SNB_10Y_SPOT_CONTEXT_V1'
          assert chf['status']=='OFFICIAL_PUBLISHED_10Y_INFORMATIONAL'
          assert chf['ois_or_saron'] is False and chf['has_current_2y'] is False
          assert chf['eligible_for_core_signals'] is False
          assert chf['eligible_for_curve_spreads'] is False
          nzd=json.loads(Path('live_data/sections/NZD_CB_PRICING_DIRECTIONAL_PROXY.json').read_text())
          assert nzd['schema']=='GMFQ_NZD_CB_PRICING_DIRECTIONAL_PROXY_V1'
          # B2 is a two-web-read research context, not an official
          # production rates feed and never an authorized scoring input.
          b2=json.loads(Path('live_data/sections/NZD_B2_GOVT_WEB_REVIEW_CONTEXT.json').read_text())
          assert b2['schema']=='GMFQ_NZD_B2_GOVT_WEB_REVIEW_CONTEXT_V1'
          assert b2['status']=='TWO_WEB_READS_MATCH__UNAPPROVED_RESEARCH_ONLY'
          assert b2['governance']['official_canonical_untouched'] is True
          assert b2['governance']['eligible_for_rate_spreads'] is False
          assert b2['governance']['eligible_for_automatic_promotion'] is False
          assert b2['governance']['live_data_promotion_allowed'] is False
          assert b2['governance']['core_score_effect']=='NONE'
          assert nzd['status']=='LIVE_DIRECTIONAL_PROXY_READY'
          assert nzd['currency']=='NZD' and 'B_FOR_DIRECTION' in nzd['confidence_grade']
          readiness=json.loads(Path('live_data/sections/OIS_SOURCE_READINESS_VIEW.json').read_text())
          assert readiness['schema']=='GMFQ_OIS_SOURCE_READINESS_VIEW_V1'
          assert readiness['status']=='READ_ONLY_SOURCE_READINESS'
          assert all(readiness[x] is True for x in
            ('no_automatic_promotions','no_backtest_effect','no_bias_effect',
             'no_core_score_effect','no_sizing_effect','prices_omitted'))
          print('CONTROL_ROOM_FOUR_REFERENCE_FEEDS_READ_ONLY_GREEN')
          assert ois['schema']=='GMFQ_OIS_OPERATIONAL_VIEW_V1'
          summary=ois['summary']
          assert summary['g8_total']==8
          assert summary['operational_green'] + summary['operational_withheld']==8
          assert summary['green_official'] + summary['green_estimated']==summary['operational_green']
          assert set(ois['currencies'])=={'USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'}
          assert sum(r['operational_status'].startswith('GREEN_') for r in ois['currencies'].values())==summary['operational_green']
          assert sum(r['operational_status']=='WITHHELD' for r in ois['currencies'].values())==summary['operational_withheld']
          for ccy,row in ois['currencies'].items():
              assert row['operational_status'] in {'GREEN_OFFICIAL','GREEN_ESTIMATED','WITHHELD'},ccy
              if row['operational_status']=='WITHHELD':
                  assert all(point.get('rate') is None for point in row['horizons'].values()),ccy
          from validation.validate_ois_operational_freshness import check
          from datetime import datetime, timezone
          assert not check(ois,datetime.now(timezone.utc).date()), 'stale GREEN curve in publication candidate'
          assert cal['schema']=='GMFQ_CALENDAR_OPERATIONAL_VIEW_V3'
          assert cal['status']=='ACTIVE_CB_PLUS_MACRO_OFFICIAL_WITH_SECONDARY_CONTEXT'
          from validation.calendar.verify_future_macro_coverage_v1 import verify as verify_future
          seed=json.loads(Path('live_data/sections/MACRO_RELEASE_OFFICIAL_SEED_V1.json').read_text())
          cb_source=json.loads(Path('live_data/sections/NATIVE_CB_DATA.json').read_text())
          from datetime import datetime, timezone
          future=verify_future(cal,seed,cb_source,datetime.now(timezone.utc))
          print('CALENDAR_FUTURE_COVERAGE_SOURCE_PARITY',future)
          assert cal['scope']['core_score_impact']==0 and cal['scope']['consensus_context_only'] is True and cal['scope']['consensus_never_changes_official_date'] is True
          macro=[e for e in cal['events'] if e.get('event_type')!='CENTRAL_BANK_DECISION']
          assert macro and all(e.get('consensus_status') in {'AVAILABLE','PREVIOUS_ONLY','NOT_PRESENT'} for e in macro)
          assert all(str(e.get('quality','')).startswith('OFFICIAL_') for e in macro)
          assert news['schema']=='GMFQ_NEWS_PULSE_OPERATIONAL_V1' and news['items']
          assert macro_heat['status']=='ACTIVE' and set(macro_heat['currencies'])=={'USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'}
          assert isinstance(d.get('risk',{}).get('VIX'),dict) and isinstance(d.get('risk',{}).get('WTI'),dict)
          brent=residual.get('lanes',{}).get('BRENT.market_proxy',{})
          assert brent.get('status')=='MARKET_PROXY_ACTIVE_SECONDARY' and brent.get('official_canonical_untouched') is True
          print('DASHBOARD_PUBLICATION_PREFLIGHT_PASS')
          PY

      - name: Validate publication scope only
        if: github.event_name == 'pull_request'
        run: echo DASHBOARD_PUBLICATION_VALIDATION_ONLY_PASS

      # Apply to every non-PR entrypoint: push, workflow_run, and manual
      # dispatch. The morning data gate MUST be ahead of the first gh-pages
      # mutation, not merely inside the parent Daily Data Orchestrator.
      - name: Test independent morning source-readiness publisher gate
        run: |
          python3 validation/publishing/test_pages_morning_readiness_v1.py
          python3 validation/publishing/test_pages_main_source_lease_v1.py
          python3 validation/publishing/test_check_pages_0800_delivery_sla_v1.py

      - name: Block incomplete morning sources before any Pages write
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/publishing/check_pages_morning_readiness_v1.py \
            --output /tmp/pages-morning-readiness.json
          python3 - <<'PY'
          import json,os
          report=json.load(open('/tmp/pages-morning-readiness.json', encoding='utf-8'))
          news=report.get('news_content_vintage') or {}
          gaps=report.get('documented_nonblocking_gaps') or []
          if report.get('morning_gate_required'):
              lines=[
                  '### Pages 08:00 market-content provenance',
                  '- Source-readiness: **'+report['status']+'**',
                  '- News market content: '+str(news.get('content_as_of') or 'not verified'),
                  '- News content classification: '+str(news.get('status') or 'not verified'),
                  '- Non-blocking caveats: '+(', '.join(gaps) if gaps else 'none'),
              ]
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as output:
                  output.write('\n'.join(lines)+'\n')
          PY

      - name: Retain cross-trigger morning Pages gate receipt
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pages-morning-readiness-${{ github.run_id }}
          path: /tmp/pages-morning-readiness.json
          if-no-files-found: warn

      - name: Publish dashboard runtime and operational assets to gh-pages with lease
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_MAIN_SHA="$(git rev-parse HEAD)"
          assert_source_main_current() {
            local observed_main
            observed_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            if [[ -z "$observed_main" || "$observed_main" != "$SOURCE_MAIN_SHA" ]]; then
              echo "PAGES_SOURCE_MAIN_MOVED: validated=$SOURCE_MAIN_SHA current=$observed_main; refuse stale publication" >&2
              return 1
            fi
          }
          assert_source_main_current
          git fetch origin gh-pages --no-tags
          REMOTE_SHA="$(git rev-parse origin/gh-pages)"
          rm -rf /tmp/gmfq-pages
          git worktree add --detach /tmp/gmfq-pages origin/gh-pages
          mkdir -p /tmp/gmfq-pages/payload /tmp/gmfq-pages/dashboard /tmp/gmfq-pages/live_data/sections
          cp index.html /tmp/gmfq-pages/index.html
          cp payload/part-*.txt /tmp/gmfq-pages/payload/
          for f in ois-operational-monitor-v1.js calendar-news-operational-v1.js top-themes-operational-v1.js what-changed-operational-v1.js risk-operational-v1.js cotdesk-operational-v1.js pairs-operational-v1.js overview-asof-operational-v1.js currencies-operational-v1.js macro-operational-v1.js ratesdesk-operational-v1.js cbdesk-operational-v1.js liquiditydesk-operational-v1.js forwarddesk-operational-v1.js editorial-freshness-guard-v1.js premium-shell-v1.js product-language-v1.js overview-hierarchy-v1.js inflationlabour-hierarchy-v1.js calendar-hierarchy-v1.js themes-hierarchy-v1.js currencies-hierarchy-v1.js; do cp "dashboard/$f" "/tmp/gmfq-pages/dashboard/$f"; done
          for f in OIS_DATA.json OIS_OPERATIONAL_VIEW.json CALENDAR_OPERATIONAL_VIEW.json NEWS_PULSE_OPERATIONAL.json MACRO_THERMOMETER_DATA.json MACRO_SERIES.json D.json ESTIMATED_RESIDUAL_GAPS.json V247_COT_STORIES.json RATES_AUDIT_METADATA.json NATIVE_CB_DATA.json CHF_SNB_10Y_SPOT_CONTEXT.json NZD_CB_PRICING_DIRECTIONAL_PROXY.json NZD_B2_GOVT_WEB_REVIEW_CONTEXT.json OIS_SOURCE_READINESS_VIEW.json; do cp "live_data/sections/$f" "/tmp/gmfq-pages/live_data/sections/$f"; done
          cp live_data/manifest.v2.json /tmp/gmfq-pages/live_data/manifest.v2.json
          cd /tmp/gmfq-pages
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())|set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          allowed={'index.html',
            'dashboard/ois-operational-monitor-v1.js','dashboard/calendar-news-operational-v1.js','dashboard/top-themes-operational-v1.js','dashboard/what-changed-operational-v1.js','dashboard/risk-operational-v1.js','dashboard/cotdesk-operational-v1.js','dashboard/pairs-operational-v1.js','dashboard/overview-asof-operational-v1.js','dashboard/currencies-operational-v1.js','dashboard/macro-operational-v1.js','dashboard/ratesdesk-operational-v1.js','dashboard/cbdesk-operational-v1.js','dashboard/liquiditydesk-operational-v1.js','dashboard/forwarddesk-operational-v1.js','dashboard/editorial-freshness-guard-v1.js','dashboard/premium-shell-v1.js','dashboard/product-language-v1.js','dashboard/overview-hierarchy-v1.js','dashboard/inflationlabour-hierarchy-v1.js','dashboard/calendar-hierarchy-v1.js','dashboard/themes-hierarchy-v1.js','dashboard/currencies-hierarchy-v1.js',
            'live_data/sections/OIS_DATA.json','live_data/sections/OIS_OPERATIONAL_VIEW.json','live_data/sections/CALENDAR_OPERATIONAL_VIEW.json','live_data/sections/NEWS_PULSE_OPERATIONAL.json','live_data/sections/MACRO_THERMOMETER_DATA.json','live_data/sections/MACRO_SERIES.json','live_data/sections/D.json','live_data/sections/ESTIMATED_RESIDUAL_GAPS.json',
            'live_data/sections/V247_COT_STORIES.json','live_data/sections/RATES_AUDIT_METADATA.json','live_data/manifest.v2.json',
            'live_data/sections/NATIVE_CB_DATA.json',
            'live_data/sections/CHF_SNB_10Y_SPOT_CONTEXT.json',
            'live_data/sections/NZD_CB_PRICING_DIRECTIONAL_PROXY.json','live_data/sections/NZD_B2_GOVT_WEB_REVIEW_CONTEXT.json',
            'live_data/sections/OIS_SOURCE_READINESS_VIEW.json',
            *[f'payload/part-{i:02d}.txt' for i in range(16)]}
          unexpected={p for p in changed if p not in allowed}
          if unexpected: raise SystemExit(f'Pages exact-scope violation: {sorted(unexpected)}')
          print('DASHBOARD_PAGES_SCOPE_PASS',sorted(changed)) if changed else print('DASHBOARD_PAGES_ALREADY_CURRENT')
          PY
          git add -- index.html payload/part-*.txt dashboard/*.js live_data/sections/OIS_DATA.json live_data/sections/OIS_OPERATIONAL_VIEW.json live_data/sections/CALENDAR_OPERATIONAL_VIEW.json live_data/sections/NEWS_PULSE_OPERATIONAL.json live_data/sections/MACRO_THERMOMETER_DATA.json live_data/sections/MACRO_SERIES.json live_data/sections/D.json live_data/sections/ESTIMATED_RESIDUAL_GAPS.json live_data/sections/V247_COT_STORIES.json live_data/sections/RATES_AUDIT_METADATA.json live_data/manifest.v2.json live_data/sections/NATIVE_CB_DATA.json live_data/sections/CHF_SNB_10Y_SPOT_CONTEXT.json live_data/sections/NZD_CB_PRICING_DIRECTIONAL_PROXY.json live_data/sections/NZD_B2_GOVT_WEB_REVIEW_CONTEXT.json live_data/sections/OIS_SOURCE_READINESS_VIEW.json
          if git diff --cached --quiet; then
            assert_source_main_current
            echo DASHBOARD_PAGES_ALREADY_CURRENT
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publish dashboard runtime from validated main ${SOURCE_MAIN_SHA}"
          REMOTE_SHA_2="$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')"
          test "$REMOTE_SHA_2" = "$REMOTE_SHA" || { echo 'gh-pages moved during publication' >&2; exit 1; }
          # The gh-pages lease alone does not protect against an upstream
          # main update between checkout and commit. Check that source too.
          assert_source_main_current
          git push --force-with-lease=refs/heads/gh-pages:$REMOTE_SHA origin HEAD:gh-pages
          echo DASHBOARD_PAGES_PUBLISHED

      - name: Ensure actual Pages build follows automated gh-pages push
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A GITHUB_TOKEN git push to gh-pages is NOT a Pages-build trigger.
          # GitHub Pages must be configured to publish from gh-pages / (root).
          cfg="$(gh api "repos/${GITHUB_REPOSITORY}/pages")"
          branch="$(jq -r '.source.branch // empty' <<<"$cfg")"
          folder="$(jq -r '.source.path // empty' <<<"$cfg")"
          if [[ "$branch" != "gh-pages" || "$folder" != "/" ]]; then
            echo "PAGES_SOURCE_UNEXPECTED: expected branch=gh-pages path=/, got branch=$branch path=$folder" >&2
            exit 1
          fi
          target_sha="$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')"
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" 2>/dev/null || echo '{}')"
          latest_sha="$(jq -r '.commit // empty' <<<"$latest")"
          latest_status="$(jq -r '.status // empty' <<<"$latest")"
          if [[ "$latest_sha" == "$target_sha" && ( "$latest_status" == "built" || "$latest_status" == "building" || "$latest_status" == "queued" ) ]]; then
            echo "PAGES_BUILD_ALREADY_TARGETING_SHA $target_sha ($latest_status)"
          else
            echo "PAGES_BUILD_REQUIRED latest_build=$latest_sha latest_status=$latest_status target=$target_sha"
            request="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds")"
            jq -e '.status == "queued" || .status == "building"' <<<"$request" >/dev/null
            echo "PAGES_BUILD_EXPLICITLY_QUEUED $target_sha"
          fi

      - name: Verify published files against validated main
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages --no-tags
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          # Share one manifest with the public HTTP proof: no partial
          # gh-pages GREEN when another runtime segment is stale.
          from validation.publishing.verify_pages_http_delivery_v1 import FILES
          paths=list(FILES)
          rows=[]
          for name in paths:
              source=pathlib.Path(name).read_bytes()
              published=subprocess.check_output(['git','show',f'origin/gh-pages:{name}'])
              same=hashlib.sha256(source).digest()==hashlib.sha256(published).digest()
              rows.append({'path':name,'same':same,'sha256':hashlib.sha256(published).hexdigest()})
          # This gate checks the operational G8 OIS mix, NOT OIS_DATA.json.
          # OIS_DATA is the canonical official dataset and has no 'summary'.
          operational=pathlib.Path('live_data/sections/OIS_OPERATIONAL_VIEW.json')
          obj=json.loads(operational.read_text())
          assert obj['schema']=='GMFQ_OIS_OPERATIONAL_VIEW_V1', obj.get('schema')
          assert obj['summary']['g8_total']==8
          assert obj['summary']['operational_green']+obj['summary']['operational_withheld']==8
          from datetime import datetime,timezone
          from validation.validate_ois_operational_freshness import check
          assert not check(obj,datetime.now(timezone.utc).date()), 'freshness preflight failed'
          report={'status':'PASS' if all(x['same'] for x in rows) else 'FAIL',
                  'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                  'pages_commit':subprocess.check_output(['git','rev-parse','origin/gh-pages'],text=True).strip(),
                  'files':rows,'ois_summary':obj['summary'],
                  'scope':'GIT_BRANCH_CONSISTENCY_ONLY_NOT_PUBLIC_HTTP'}
          pathlib.Path('/tmp/pages-delivery-proof.json').write_text(json.dumps(report,indent=2))
          print('PAGES_DELIVERY_PROOF',json.dumps(report))
          if report['status']!='PASS':raise SystemExit('Published files differ from validated main')
          PY

      - name: Verify public Pages HTTP delivery after bounded CDN propagation
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python validation/publishing/verify_pages_http_delivery_v1.py \
            --budget-seconds 600 --interval-seconds 10 \
            --output /tmp/pages-public-http-proof.json

      # This receipt does not rely on Daily Data Orchestrator V2 succeeding.
      # Independent source workflows can publish before 08:00; late public
      # propagation can also be certified accurately as late, not GREEN.
      - name: Record independent 08:00 Rome public delivery receipt
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/publishing/check_pages_0800_delivery_sla_v1.py \
            --source /tmp/pages-morning-readiness.json \
            --public /tmp/pages-public-http-proof.json \
            --output /tmp/pages-0800-delivery-sla.json
          python3 - <<'PY'
          import json, os
          d=json.load(open('/tmp/pages-0800-delivery-sla.json',encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('\n### Independent 08:00 Rome public HTTP receipt\n')
              out.write('- Status: **'+d['status']+'**\n')
              out.write('- Source check: '+str(d['source_checked_at_rome'])+'\n')
              out.write('- Exact public HTTP verified: '+str(d['public_verified_at_rome'])+'\n')
              out.write('- File coverage: '+str(d['verified_file_count'])+'\n')
              out.write('- CB policy watch: '+str(d['cb_policy_watch_status'])+'\n')
              out.write('- Same-day CB still pending: '+(', '.join(d['cb_policy_pending_currencies']) if d['cb_policy_pending_currencies'] else 'none / unknown')+'\n')
              out.write('- HTTP publication is distinct from issuer-policy verification.\n')
              out.write('- This does not depend on a successful parent orchestrator.\n')
          PY

      - name: Upload delivery evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pages-delivery-proof
          path: |
            /tmp/pages-delivery-proof.json
            /tmp/pages-public-http-proof.json
            /tmp/pages-0800-delivery-sla.json
          if-no-files-found: warn
