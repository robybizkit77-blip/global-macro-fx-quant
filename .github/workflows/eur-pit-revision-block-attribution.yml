name: EUR PIT Revision Block Attribution
on:
  push:
    branches: [staging-usd-pit-readiness-2026-10-03]
    paths:
      - 'validation/audit_eur_revision_block_attribution.py'
      - '.github/workflows/eur-pit-revision-block-attribution.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-usd-pit-readiness-2026-10-03
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python validation/audit_eur_revision_block_attribution.py
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/EUR_PIT_REVISION_BLOCK_ATTRIBUTION_2026-10-03.json
          git diff --cached --quiet || git commit -m 'Record EUR PIT revision block attribution'
          git push
