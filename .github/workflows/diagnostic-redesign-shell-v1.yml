name: Diagnostic Redesign Shell V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnostic-redesign-shell-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start dashboard
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/redesign-shell-server.log 2>&1 &
          sleep 2
      - name: Audit real DOM shell and computed design desktop mobile
        run: |
          cat > redesign-shell-diagnostic.js <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          function pickStyle(s){return {display:s.display,position:s.position,width:s.width,height:s.height,background:s.backgroundColor,color:s.color,fontFamily:s.fontFamily,fontSize:s.fontSize,fontWeight:s.fontWeight,borderRadius:s.borderRadius,border:s.border,boxShadow:s.boxShadow,padding:s.padding,margin:s.margin,gap:s.gap};}
          async function run(viewport,label){
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e))); page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.settled_after_cad_chain===true,null,{timeout:120000});
            await page.waitForTimeout(1200);
            const out=await page.evaluate(({label,viewport})=>{
              const styleOf=(el)=>{if(!el)return null;const s=getComputedStyle(el);return {display:s.display,position:s.position,width:s.width,height:s.height,background:s.backgroundColor,color:s.color,fontFamily:s.fontFamily,fontSize:s.fontSize,fontWeight:s.fontWeight,borderRadius:s.borderRadius,border:s.border,boxShadow:s.boxShadow,padding:s.padding,margin:s.margin,gap:s.gap};};
              const sig=(el)=>({tag:el.tagName.toLowerCase(),id:el.id||null,className:typeof el.className==='string'?el.className:null,text:String(el.innerText||'').replace(/\s+/g,' ').trim().slice(0,140),style:styleOf(el)});
              const candidates=[...document.querySelectorAll('body *')].filter(el=>{const x=((el.id||'')+' '+(typeof el.className==='string'?el.className:'')).toLowerCase();return /(sidebar|side-|nav|topbar|top-bar|header|shell|layout|content|main|brand|logo)/.test(x)}).slice(0,80).map(sig);
              const body=getComputedStyle(document.body),root=getComputedStyle(document.documentElement);
              const vars={}; for(const k of [...root]) if(k.startsWith('--')) vars[k]=root.getPropertyValue(k).trim();
              const active=document.querySelector('.view.active,[data-view].active');
              const navButtons=[...document.querySelectorAll('button,a')].filter(x=>/(overview|valute|coppie|macro|rates|central|liquid|cot|metodo|forward|news|risk|temi)/i.test(String(x.textContent||''))).slice(0,40).map(sig);
              const cards=[...document.querySelectorAll('.card,[class*="Card"],[class*="card"]')].filter(x=>x.offsetParent!==null).slice(0,20).map(sig);
              const headings=[...document.querySelectorAll('h1,h2,h3,[class*="title"],[class*="Title"]')].filter(x=>x.offsetParent!==null).slice(0,25).map(sig);
              return {label,viewport,url:location.href,title:document.title,body:styleOf(document.body),html:styleOf(document.documentElement),rootVars:vars,bodyChildren:[...document.body.children].map(sig).slice(0,25),candidates,navButtons,cards,headings,activeView:active?sig(active):null,bodyTextSample:String(document.body.innerText||'').replace(/\s+/g,' ').trim().slice(0,1000)};
            },{label,viewport});
            await browser.close(); return {out,errors};
          }
          (async()=>{
            const result={schema:'GMFQ_REDESIGN_SHELL_DIAGNOSTIC_V1',status:'PASS_OBSERVATIONAL',desktop:await run({width:1440,height:1100},'desktop'),mobile:await run({width:390,height:844},'mobile')};
            fs.writeFileSync('/tmp/redesign-shell-diagnostic-v1.json',JSON.stringify(result,null,2));
            console.log(JSON.stringify(result,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node redesign-shell-diagnostic.js
      - uses: actions/upload-artifact@v4
        with:
          name: redesign-shell-diagnostic-v1
          path: /tmp/redesign-shell-diagnostic-v1.json
          if-no-files-found: error
