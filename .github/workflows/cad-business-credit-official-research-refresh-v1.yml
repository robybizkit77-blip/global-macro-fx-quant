name: CAD Official Business Credit Research Refresh V1

on:
  workflow_dispatch:
  schedule:
    # Daily check of a monthly Bank of Canada release, off GitHub's hour boundary.
    - cron: '37 6 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'validation/liquidity/refresh_boc_cad_business_credit_v1.py'
      - 'validation/liquidity/test_refresh_boc_cad_business_credit_v1.py'
      - '.github/workflows/cad-business-credit-official-research-refresh-v1.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: cad-official-business-credit-research-v1
  cancel-in-progress: false

jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test official series, revisions, chronology and strict research isolation
        run: python -m unittest validation.liquidity.test_refresh_boc_cad_business_credit_v1 -v
      - name: Snapshot canonical G8 liquidity and FX Core files
        run: |
          sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/cad-credit-runtime.before
          sha256sum live_data/sections/PAIR_SETUP_OPERATIONAL_VIEW.json > /tmp/cad-credit-fx.before
      - name: Fetch issuer Valet monthly credit with guarded research-only apply
        id: acquire
        run: |
          python validation/liquidity/refresh_boc_cad_business_credit_v1.py \
            --apply --receipt /tmp/cad-official-credit-receipt.json
          cat /tmp/cad-official-credit-receipt.json >> "$GITHUB_STEP_SUMMARY"
      - name: Verify write boundary before any commit
        run: |
          sha256sum -c /tmp/cad-credit-runtime.before /tmp/cad-credit-fx.before
          python - <<'PY'
          from pathlib import Path
          import subprocess
          allowed='site/fx-quant-v2/next/cad-official-credit-research-v1.js'
          modified=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert all(p==allowed for p in modified), modified
          print('CAD_OFFICIAL_RESEARCH_ONLY_DIFF_PASS:',modified)
          PY
      - name: Commit candidate sidecar only, no Core or ranking writes
        run: |
          set -euo pipefail
          path=site/fx-quant-v2/next/cad-official-credit-research-v1.js
          if git diff --quiet -- "$path"; then
            echo "Official series checked, no new change to research sidecar." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$path"
          git commit -m "Refresh official BoC CAD business-loan stock (research-only)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "Research sidecar updated; no canonical FX or liquidity mutation." >> "$GITHUB_STEP_SUMMARY"
      - name: Mirror validated CAD research file to gh-pages with branch lease
        if: success()
        id: pages-sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=site/fx-quant-v2/next/cad-official-credit-research-v1.js
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          current_sha="$(git rev-parse HEAD)"
          test "$main_sha" = "$current_sha" || { echo 'CAD_RESEARCH_MAIN_MOVED_DO_NOT_PUBLISH_STALE'; exit 1; }
          git fetch origin gh-pages --no-tags
          remote_sha="$(git rev-parse origin/gh-pages)"
          git worktree add --detach /tmp/cad-credit-pages origin/gh-pages
          mkdir -p "/tmp/cad-credit-pages/site/fx-quant-v2/next"
          cp "$path" "/tmp/cad-credit-pages/$path"
          cd /tmp/cad-credit-pages
          if git diff --quiet -- "$path"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "CAD_PAGES_RESEARCH_ALREADY_CURRENT" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$(git diff --name-only)" = "$path"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$path"
          git commit -m 'Mirror validated BoC CAD credit research only'
          test "$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')" = "$remote_sha" || {
            echo 'CAD_RESEARCH_GH_PAGES_MOVED_WITHHELD'; exit 1;
          }
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$main_sha" || {
            echo 'CAD_RESEARCH_MAIN_MOVED_WITHHELD'; exit 1;
          }
          git push --force-with-lease=refs/heads/gh-pages:$remote_sha origin HEAD:gh-pages
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "CAD_PAGES_RESEARCH_MIRRORED" >> "$GITHUB_STEP_SUMMARY"
      - name: Explicitly queue Pages build after GITHUB_TOKEN mirror
        if: steps.pages-sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds")"
          jq -e '.status == "queued" || .status == "building"' <<<"$response" >/dev/null
          echo "CAD_PAGES_BUILD_REQUEST_ACCEPTED" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-business-credit-official-source-receipt
          path: /tmp/cad-official-credit-receipt.json
          if-no-files-found: warn
          retention-days: 14
