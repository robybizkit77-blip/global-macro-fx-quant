name: Diagnostic JPY Labour Adapter V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnostic-jpy-inflation-dirty-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install adapter dependencies
        run: python -m pip install --disable-pip-version-check requests pandas openpyxl beautifulsoup4 lxml

      - name: Probe JPY labour adapter and live page structure
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/jpy-labour-adapter-probe
          mkdir -p "$root"

          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "E_STAT_APP_ID_SET=$([ -n "${E_STAT_APP_ID:-}" ] && echo yes || echo no)"
            echo "STATUS_BEFORE_BEGIN"
            git status --porcelain=v1
            echo "STATUS_BEFORE_END"
          } > "$root/environment.txt"

          python - <<'PY' > "$root/page-structure.txt" 2>&1
          import importlib.util
          from pathlib import Path
          from bs4 import BeautifulSoup

          path = Path('validation/sources/jpy_statistics_bureau_unemployment.py')
          spec = importlib.util.spec_from_file_location('jpy_labour_source', path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          html = mod.fetch_html()
          soup = BeautifulSoup(html, 'html.parser')
          text = soup.get_text(' ', strip=True)

          print('html_len=', len(html))
          print('text_len=', len(text))
          for needle in ['2026年', '完全失業率', '季節調整値', 'ポイント', '月次']:
              print(f'{needle!r}: html={html.find(needle)} text={text.find(needle)}')
          print('tables=', len(soup.find_all('table')))
          print('iframes=', [(x.get('src'), x.get('title')) for x in soup.find_all('iframe')])
          print('frames=', [(x.get('src'), x.get('title')) for x in soup.find_all('frame')])
          print('scripts_src=', [x.get('src') for x in soup.find_all('script') if x.get('src')][-20:])
          print('--- TEXT AROUND TITLE ---')
          p = text.find('2026年')
          print(repr(text[max(0,p-250):p+1800]))
          print('--- HTML AROUND UNEMPLOYMENT-LIKE TOKENS ---')
          for needle in ['失業', 'roudou', 'table']:
              p = html.find(needle)
              print(needle, p, repr(html[max(0,p-300):p+1200]) if p >= 0 else '')
          print('--- LINKS NEAR MAIN CONTENT ---')
          for a in soup.find_all('a'):
              label = ' '.join(a.stripped_strings)
              href = a.get('href')
              if any(k in label for k in ['結果', '概要', '時系列', '原表']) or (href and 'sokuhou' in href):
                  print(repr(label), repr(href))
          PY

          python - <<'PY' > "$root/fallback-contract.txt" 2>&1
          from pathlib import Path
          p=Path('live_data/source_contracts/macro_history/jpy_labour_estat_contract_v1.json')
          print(f'path={p}')
          print(f'exists={p.exists()}')
          PY

          set +e
          python validation/macro_adapter_pit_handoff.py \
            --currency JPY --dimension labour \
            --output "$root/candidate.json" \
            --audit-output "$root/adapter-audit.json" \
            > "$root/stdout.txt" 2> "$root/stderr.txt"
          rc=$?
          set -e

          echo "$rc" > "$root/rc.txt"
          {
            echo "STATUS_AFTER_BEGIN"
            git status --porcelain=v1
            echo "STATUS_AFTER_END"
          } > "$root/status-after.txt"

          {
            echo "RC=$rc"
            echo "STDOUT_BEGIN"
            cat "$root/stdout.txt"
            echo "STDOUT_END"
            echo "STDERR_BEGIN"
            cat "$root/stderr.txt"
            echo "STDERR_END"
            echo "PAGE_STRUCTURE_BEGIN"
            cat "$root/page-structure.txt"
            echo "PAGE_STRUCTURE_END"
          } | tee "$root/result.txt"

          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jpy-labour-adapter-probe-${{ github.run_id }}
          path: /tmp/jpy-labour-adapter-probe/
          if-no-files-found: error
          retention-days: 3
