name: Diagnostic JPY Labour Adapter V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnostic-jpy-inflation-dirty-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install adapter dependencies
        run: python -m pip install --disable-pip-version-check requests pandas openpyxl beautifulsoup4 lxml

      - name: Probe JPY labour adapter and fallback contract
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/jpy-labour-adapter-probe
          mkdir -p "$root"

          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "E_STAT_APP_ID_SET=$([ -n "${E_STAT_APP_ID:-}" ] && echo yes || echo no)"
            echo "STATUS_BEFORE_BEGIN"
            git status --porcelain=v1
            echo "STATUS_BEFORE_END"
          } > "$root/environment.txt"

          python - <<'PY' > "$root/fallback-contract.txt" 2>&1
          import json
          from pathlib import Path
          p=Path('live_data/source_contracts/macro_history/jpy_labour_estat_contract_v1.json')
          print(f'path={p}')
          print(f'exists={p.exists()}')
          if p.exists():
              obj=json.loads(p.read_text())
              rows=obj.get('rows') if isinstance(obj, dict) else None
              print(f'top_type={type(obj).__name__}')
              print(f'keys={sorted(obj.keys()) if isinstance(obj, dict) else None}')
              print(f'rows_type={type(rows).__name__ if rows is not None else None}')
              print(f'rows_count={len(rows) if isinstance(rows, list) else None}')
              if isinstance(rows, list) and rows:
                  print(f'first_row_keys={sorted(rows[0].keys()) if isinstance(rows[0], dict) else None}')
                  print(f'last_row_keys={sorted(rows[-1].keys()) if isinstance(rows[-1], dict) else None}')
          PY

          set +e
          python validation/macro_adapter_pit_handoff.py \
            --currency JPY --dimension labour \
            --output "$root/candidate.json" \
            --audit-output "$root/adapter-audit.json" \
            > "$root/stdout.txt" 2> "$root/stderr.txt"
          rc=$?
          set -e

          echo "$rc" > "$root/rc.txt"
          {
            echo "STATUS_AFTER_BEGIN"
            git status --porcelain=v1
            echo "STATUS_AFTER_END"
          } > "$root/status-after.txt"

          {
            echo "RC=$rc"
            echo "STDOUT_BEGIN"
            cat "$root/stdout.txt"
            echo "STDOUT_END"
            echo "STDERR_BEGIN"
            cat "$root/stderr.txt"
            echo "STDERR_END"
            echo "FALLBACK_CONTRACT_BEGIN"
            cat "$root/fallback-contract.txt"
            echo "FALLBACK_CONTRACT_END"
          } | tee "$root/result.txt"

          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jpy-labour-adapter-probe-${{ github.run_id }}
          path: /tmp/jpy-labour-adapter-probe/
          if-no-files-found: error
          retention-days: 3
