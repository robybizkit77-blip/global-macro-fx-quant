name: BoE GBP Rates Probe

on:
  push:
    branches: [staging-live-data-refresh-v1-2026-10-04]
    paths:
      - ".github/workflows/boe-gbp-rates-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official BoE latest yield curve ZIP
        run: |
          python - <<'PY'
          import io, json, pathlib, urllib.request, zipfile
          url='https://www.bankofengland.co.uk/-/media/boe/files/statistics/yield-curves/latest-yield-curve-data.zip'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 GMFQ/1.0'})
          raw=urllib.request.urlopen(req,timeout=60).read()
          z=zipfile.ZipFile(io.BytesIO(raw))
          out={'schema':'GMFQ_BOE_GBP_RATES_PROBE_V1','zip_url':url,'files':z.namelist()}
          pathlib.Path('validation/BOE_GBP_RATES_PROBE_2026-10-04.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/BOE_GBP_RATES_PROBE_2026-10-04.json
          git commit -m "Probe official BoE latest yield curve ZIP" || exit 0
          git push
