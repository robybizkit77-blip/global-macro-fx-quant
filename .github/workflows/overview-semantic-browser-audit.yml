name: Overview Semantic Browser Audit

on:
  push:
    branches:
      - staging-overview-semantic-fix-v490-2026-09-30

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/gmfq-server.log 2>&1 &
          sleep 2
      - name: Verify semantic separation
        run: |
          cat > audit.js <<'EOF'
          const { chromium } = require('playwright');
          const { execSync } = require('child_process');
          (async()=>{
            const chromePath=execSync('command -v google-chrome-stable || command -v google-chrome || command -v chromium').toString().trim();
            const browser=await chromium.launch({headless:true,executablePath:chromePath,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            const consoleErrors=[],pageErrors=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            const res=await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle',timeout:120000});
            if(!res?.ok()) throw new Error('HTTP load failed');
            await page.waitForFunction(()=>document.documentElement.getAttribute('data-post-gate-final-audit'),null,{timeout:120000});
            await page.evaluate(()=>window.showView?.('overview'));
            await page.waitForSelector('.gmfqOverviewExecutive');
            const x=await page.evaluate(()=>{
              const top=[...document.querySelectorAll('.gmfqOverviewExecutive .k')].map(x=>x.textContent.trim());
              const root=document.getElementById('gmfqCurrencyOverview');
              const lower=root?.innerText||'';
              return {
                top,lower,
                semanticScope:root?.getAttribute('data-semantic-scope')||null,
                finalAudit:window.GMFQ_POST_GATE_FINAL_AUDIT||null,
                currencyCount:Number(window.GMFQ_POST_GATE_FINAL_AUDIT?.counts?.currencies||0),
                pairCount:Number(window.GMFQ_POST_GATE_FINAL_AUDIT?.counts?.pairs||0)
              };
            });
            console.log(JSON.stringify({x,consoleErrors,pageErrors},null,2));
            if(x.finalAudit?.status!=='PASS') throw new Error('Final audit not PASS');
            if(x.currencyCount!==8||x.pairCount!==28) throw new Error('Count regression');
            const joined=x.top.join(' | ').toUpperCase();
            for(const k of ['FX · STA MIGLIORANDO','FX · STA PEGGIORANDO','FX · POSSIBILE SVOLTA']) if(!joined.includes(k)) throw new Error('Missing '+k);
            const lo=x.lower.toUpperCase();
            for(const k of ['FOCUS MACRO','MACRO IN MIGLIORAMENTO','MACRO IN PEGGIORAMENTO','MACRO MISTA / POSSIBILE SVOLTA']) if(!lo.includes(k)) throw new Error('Missing lower '+k);
            if(!lo.includes('NON È LA DIREZIONE FX COMPLESSIVA')) throw new Error('Missing explicit distinction');
            if(x.semanticScope!=='MACRO_ONLY') throw new Error('Semantic scope missing');
            const nonBenign=consoleErrors.filter(e=>!String(e).includes('404'));
            if(nonBenign.length||pageErrors.length) throw new Error('Browser errors '+JSON.stringify({nonBenign,pageErrors}));
            await page.screenshot({path:'overview-semantic-audit.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node audit.js
