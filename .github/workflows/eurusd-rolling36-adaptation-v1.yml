name: EURUSD Rolling36 Adaptation Diagnostic V1
on:
  push:
    branches: [validation-eurusd-rolling36-adaptation-v1-2026-10-11]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  EUR_INFLATION_ARTIFACT_ID: '11674452706'
  EUR_INFLATION_ARTIFACT_DIGEST: 'sha256:ddab80f0b0cfe51a5e8b37dc482d77285353916cf499d7be3791273fdc677c6d'
  EUR_LABOUR_ARTIFACT_ID: '11678794954'
  EUR_LABOUR_ARTIFACT_DIGEST: 'sha256:933a0032ba3712050d7306908a3c64fd23a2c7731cd68f44cf4f4c6ea7b0e677'
  RATES_STORE_SHA: '0f4f45190fa5d5e010650026a30a0f981373ec34'
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download exact certified EUR Macro artifacts
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r36/inf /tmp/r36/lab
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          for aid,digest in [(os.environ['EUR_INFLATION_ARTIFACT_ID'],os.environ['EUR_INFLATION_ARTIFACT_DIGEST']),(os.environ['EUR_LABOUR_ARTIFACT_ID'],os.environ['EUR_LABOUR_ARTIFACT_DIGEST'])]:
              m=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts/{aid}'],text=True)); assert not m['expired'] and m.get('digest')==digest
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EUR_INFLATION_ARTIFACT_ID}/zip" > /tmp/r36/inf.zip
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EUR_LABOUR_ARTIFACT_ID}/zip" > /tmp/r36/lab.zip
          unzip -q /tmp/r36/inf.zip -d /tmp/r36/inf; unzip -q /tmp/r36/lab.zip -d /tmp/r36/lab
          python - <<'PY'
          import json
          for f,h in [('inf','fd19fea3a286b327019b9727a79ade5e51550cfc073538139ac3f600d81c68b1'),('lab','b8b9384ac5aefa293521137d5df9f713585d232c21999a59916f7058161113f9')]:
              a=json.load(open(f'/tmp/r36/{f}/a/evidence.json')); b=json.load(open(f'/tmp/r36/{f}/b/evidence.json')); assert a['status']==b['status']=='PASS'; assert a['semantic_rowset_sha256']==b['semantic_rowset_sha256']==h
          PY
      - name: Borrow exact frozen Rates histories
        run: |
          set -euo pipefail
          mkdir -p /tmp/r36/rates
          git fetch --depth=1 origin "$RATES_STORE_SHA"
          git checkout FETCH_HEAD -- validation/rates_pit_rowsets/eur_rates_2y_10y_temporal_pit_v1.csv validation/rates_pit_rowsets/usd_rates_2y_10y_temporal_pit_v1.csv
          cp validation/rates_pit_rowsets/eur_rates_2y_10y_temporal_pit_v1.csv /tmp/r36/rates/eur.csv; cp validation/rates_pit_rowsets/usd_rates_2y_10y_temporal_pit_v1.csv /tmp/r36/rates/usd.csv
          git reset --hard "$GITHUB_SHA"; git clean -fd
      - name: Download official ECB EURUSD history
        run: |
          curl -fL --retry 3 --connect-timeout 20 --max-time 120 'https://data-api.ecb.europa.eu/service/data/EXR/D.USD.EUR.SP00.A?startPeriod=2018-03-01&endPeriod=2026-09-30&format=csvdata' -o /tmp/r36/ecb.csv
          test -s /tmp/r36/ecb.csv
      - name: Run fixed rolling-36 diagnostic
        run: |
          set -euo pipefail
          INF=/tmp/r36/inf/a/EUR_INFLATION_STRICT_FIRST_RELEASE_FLASH_2018_2026_09.csv; LAB=/tmp/r36/lab/a/EUR_LABOUR_STRICT_FIRST_RELEASE_2018_2026_08.csv
          python validation/eurusd_rolling36_adaptation_v1.py --inflation "$INF" --labour "$LAB" --eur-rates /tmp/r36/rates/eur.csv --usd-rates /tmp/r36/rates/usd.csv --ecb /tmp/r36/ecb.csv --output /tmp/r36/result.json
          python validation/eurusd_rolling36_adaptation_v1.py --inflation "$INF" --labour "$LAB" --eur-rates /tmp/r36/rates/eur.csv --usd-rates /tmp/r36/rates/usd.csv --ecb /tmp/r36/ecb.csv --output /tmp/r36/result-b.json >/dev/null
          cmp /tmp/r36/result.json /tmp/r36/result-b.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/r36/result.json')); assert r['status']=='DIAGNOSTIC_COMPLETE'; assert r['scope']['snapshot_count']==102; assert r['scope']['oos_predictions_per_model']==65; assert r['method']['rolling_window_months_fixed']==36; assert r['method']['window_search'] is False; assert r['method']['post_hoc_architecture_test'] is True; assert r['policy']['production_signal_authorized'] is False; print(json.dumps({'comparison':r['comparison_2025_to_2026_07'],'models':r['models']},indent=2,sort_keys=True))
          PY
      - name: Assert repository clean
        run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: eurusd-rolling36-adaptation-${{ github.run_id }}
          path: /tmp/r36/result.json
          retention-days: 90
