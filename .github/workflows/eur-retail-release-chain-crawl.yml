name: EUR Retail Release Chain Crawl

on:
  push:
    branches: [engine-freeze-v1-2026-10-02]
    paths:
      - validation/crawl_eur_retail_release_chain.py
      - validation/run_eur_retail_release_chain_chunk.py
      - .github/workflows/eur-retail-release-chain-crawl.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eur-retail-release-chain-crawl
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engine-freeze-v1-2026-10-02
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf
      - name: Crawl Retail release-chain to completion in bounded chunks
        run: |
          for i in 1 2 3 4; do
            echo "=== Retail PIT chunk $i/4 ==="
            python validation/run_eur_retail_release_chain_chunk.py
            if python - <<'PY'
          import json,sys
          p='validation/pit_batch/eurostat/archive/EUR_RETAIL_VOLUME_CHAIN_PIT_V1_2026-10-02.json'
          j=json.load(open(p))
          s=j.get('summary',{})
          print('coverage',s.get('parsed_months'),'/',s.get('expected_months'),'complete=',s.get('complete'),'terminal_error=',s.get('terminal_error'))
          sys.exit(0 if s.get('complete') else 1)
          PY
            then
              echo "Retail PIT chain complete."
              break
            fi
          done
      - name: Commit chain checkpoint
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/pit_batch/eurostat/archive/EUR_RETAIL_VOLUME_CHAIN_PIT_V1_2026-10-02.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Advance EUR retail PIT release chain checkpoint"
            git pull --rebase origin engine-freeze-v1-2026-10-02
            git push origin HEAD:engine-freeze-v1-2026-10-02
          fi
