name: Dashboard Pair Render Payload V1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-transmission-conviction-layer-v1-2026-10-07
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate live contract first
        run: python validation/check_live_update_contract.py
      - name: Build UI-ready payload
        run: python validation/build_dashboard_pair_render_payload_v1.py
      - name: Guard descriptive-only contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('validation/DASHBOARD_PAIR_RENDER_PAYLOAD_V1_2026-10-07.json',encoding='utf-8'))
          assert p['guards']['changes_engine_rules'] is False
          assert p['guards']['changes_live_data'] is False
          assert p['guards']['production_promotion'] is False
          assert p['guards']['return_fitting'] is False
          assert p['guards']['predictive_claim'] is False
          assert p['display_contract']['never_hide_rule_sensitive'] is True
          assert p['display_contract']['never_convert_withheld_to_neutral'] is True
          assert len(p['pairs']) == 28
          print('PASS: render payload guards')
          PY
      - name: Commit payload evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/DASHBOARD_PAIR_RENDER_PAYLOAD_V1_2026-10-07.json
          git diff --cached --quiet && exit 0
          git commit -m "Build dashboard pair render payload V1"
          git push
