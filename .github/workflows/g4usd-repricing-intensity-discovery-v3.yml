name: G4USD Repricing Intensity Discovery V3

on:
  push:
    branches:
      - validation-g4usd-repricing-intensity-discovery-v3-2026-10-11
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze V3 contract
        run: |
          python - <<'PY'
          import json
          c=json.load(open('validation/G4USD_FRONT_END_REPRICING_INTENSITY_DISCOVERY_CONTRACT_V3_2026-10-11.json'))
          assert c['status']=='PREDECLARED_EXPLORATORY_NO_V3_RESULTS_OBSERVED'
          assert c['intensity_definition']['threshold_selection']=='FIXED_ECONOMIC_BP_THRESHOLDS_PREDECLARED_BEFORE_V3_OUTPUTS'
          assert c['intensity_definition']['no_percentile_thresholds'] is True
          assert c['governance']['no_edge_certification'] is True
          assert c['governance']['no_rescue_tuning_after_outputs'] is True
          print('V3_CONTRACT_FROZEN_PASS')
          PY
      - name: Download exact GREEN readiness artifact
        uses: actions/download-artifact@v4
        with:
          name: g4usd-alignment-integration-readiness-fast-v3-38169617850
          path: /tmp/v3
          github-token: ${{ github.token }}
          repository: robybizkit77-blip/global-macro-fx-quant
          run-id: 38169617850
      - name: Reconstruct exact corrected alignment source
        run: |
          mkdir -p /tmp/v3/canonical-fixed
          for f in /tmp/v3/canonical/*.csv; do
            b=$(basename "$f")
            python validation/g4usd_canonical_release_date_normalizer_v1.py --source "$f" --output "/tmp/v3/canonical-fixed/$b"
          done
          python validation/g4usd_front_end_macro_cb_alignment_v1.py \
            --frozen-oos /tmp/v3/frozen_oos.json \
            --eur-inflation /tmp/v3/canonical-fixed/eur_inflation.csv \
            --eur-labour /tmp/v3/canonical-fixed/eur_labour.csv \
            --jpy-inflation /tmp/v3/canonical-fixed/jpy_inflation.csv \
            --jpy-labour /tmp/v3/canonical-fixed/jpy_labour.csv \
            --cad-inflation /tmp/v3/canonical-fixed/cad_inflation.csv \
            --cad-labour /tmp/v3/canonical-fixed/cad_labour.csv \
            --aud-inflation /tmp/v3/canonical-fixed/aud_inflation.csv \
            --aud-labour /tmp/v3/canonical-fixed/aud_labour.csv \
            --usd-inflation /tmp/v3/canonical-fixed/usd_inflation.csv \
            --usd-labour /tmp/v3/canonical-fixed/usd_labour.csv \
            --output /tmp/v3/alignment-source.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/v3/alignment-source.json'))
          assert r['state_results']['CONTRADICTORY']['n']==67
          assert abs(r['state_results']['CONTRADICTORY']['sharpe']-1.1348751274937703)<1e-12
          assert r['edge_survival'] is False
          print('V3_SOURCE_REPRODUCED_PASS')
          PY
      - name: Execute fixed-threshold repricing intensity discovery
        run: |
          python validation/g4usd_front_end_repricing_intensity_discovery_v3.py \
            --alignment-result /tmp/v3/alignment-source.json \
            --output /tmp/v3/repricing-intensity-v3.json
      - name: Validate V3 governance and completeness
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/v3/repricing-intensity-v3.json'))
          assert r['status']=='EXPLORATORY_DIAGNOSTIC_COMPLETE_NOT_EDGE_CERTIFICATION'
          assert r['source_contradictory_n']==67
          assert sum(v['n'] for v in r['bucket_results'].values())==67
          g=r['governance']
          assert g['edge_certified'] is False
          assert g['production_signal_authorized'] is False
          assert g['sizing_authorized'] is False
          assert g['future_unseen_confirmation_required'] is True
          assert g['no_threshold_search'] is True
          assert g['no_rescue_tuning_after_outputs'] is True
          print('V3_OUTPUT_GOVERNANCE_PASS')
          PY
      - name: Upload V3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: g4usd-repricing-intensity-discovery-v3-${{ github.run_id }}
          path: |
            /tmp/v3/repricing-intensity-v3.json
            validation/G4USD_FRONT_END_REPRICING_INTENSITY_DISCOVERY_CONTRACT_V3_2026-10-11.json
          if-no-files-found: error
          retention-days: 30
