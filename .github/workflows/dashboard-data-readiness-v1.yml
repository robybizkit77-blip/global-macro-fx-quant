name: Dashboard Data Readiness V1

on:
  workflow_dispatch:
  push:
    branches:
      - research-transmission-conviction-layer-v1-2026-10-07
    paths:
      - 'validation/DASHBOARD_DATA_READINESS_V1_2026-10-07.json'
      - 'validation/validate_dashboard_data_readiness_v1.py'
      - '.github/workflows/dashboard-data-readiness-v1.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate dashboard data readiness
        run: python validation/validate_dashboard_data_readiness_v1.py
