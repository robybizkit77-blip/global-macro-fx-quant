name: CAD Full Reaction State vNext V1
on:
  push:
    branches: [audit-minimum-robust-pit-dataset-2026-10-06]
    paths:
      - 'validation/run_cad_full_reaction_state_vnext_v1.py'
      - '.github/workflows/cad-full-reaction-state-vnext-v1.yml'
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-minimum-robust-pit-dataset-2026-10-06
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run CAD full reaction-state replay
        run: python validation/run_cad_full_reaction_state_vnext_v1.py
      - name: Strict engine/live-data guard
        run: git diff --exit-code -- engine live_data
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/CAD_FULL_REACTION_STATE_VNEXT_V1_2026-10-06.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add CAD full reaction-state vNext evidence'
          git pull --rebase origin audit-minimum-robust-pit-dataset-2026-10-06
          git push origin HEAD:audit-minimum-robust-pit-dataset-2026-10-06
