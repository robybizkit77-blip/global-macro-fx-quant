name: TEMP CAD Inflation Registry Contract Repair

on:
  push:
    branches:
      - validation-macro-cad-inflation-contract-repair-2026-10-09
    paths:
      - '.github/workflows/temp-cad-inflation-registry-contract-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align only CAD inflation registry transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json')
          s=p.read_text()
          start=s.index('"CAD.inflation"')
          try:
              end=s.index('"AUD.labour"', start)
          except ValueError:
              end=len(s)
          block=s[start:end]
          needle='"transformation": "reported_yoy_rate"'
          repl='"transformation": "derived_yoy_from_index"'
          assert block.count(needle)==1, block.count(needle)
          out=s[:start]+block.replace(needle,repl,1)+s[end:]
          p.write_text(out)
          data=json.loads(out)
          row=data['series']['CAD.inflation']
          assert row['transformation']=='derived_yoy_from_index'
          assert row['historical_replay_certified'] is False
          print(json.dumps(row,indent=2))
          PY
          git diff --numstat -- validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json
          test "$(git diff --numstat -- validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json | awk '{print $1+$2}')" -le 2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json
          git commit -m 'Align CAD inflation registry transformation contract'
          git push
