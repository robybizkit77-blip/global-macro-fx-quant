name: FX Quant Next Independent FREE Hourly Desk

# This writer owns ONLY gh-pages:/market-desk/; V2 rsync --delete cannot erase it.
# Standalone research feed for the WEBSITE only. No external paid AI/API,
# no ChatGPT Automations interactions, no modifications to existing alerts.
on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/home/build_free_hourly_desk_v1.py'
      - 'validation/home/test_build_free_hourly_desk_v1.py'
      - 'site/fx-quant-v2/next/hourly-desk-ui-v1.js'
      - 'site/fx-quant-v2/next/app.js'
      - 'site/fx-quant-v2/next/index.html'
      - 'validation/publishing/test_next_independent_hourly_desk_v1.cjs'
      - '.github/workflows/next-independent-ai-hourly-desk-v1.yml'
  push:
    branches: [main]
    paths:
      - 'validation/home/build_free_hourly_desk_v1.py'
      - 'validation/home/test_build_free_hourly_desk_v1.py'
      - 'validation/publishing/test_next_independent_hourly_desk_v1.cjs'
      - 'site/fx-quant-v2/next/hourly-desk-ui-v1.js'
      - 'site/fx-quant-v2/next/app.js'
      - '.github/workflows/next-independent-ai-hourly-desk-v1.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
concurrency:
  group: next-independent-hourly-market-desk-v1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Offline zero-cost source and narrative regressions
        run: |
          python -m unittest validation.home.test_build_free_hourly_desk_v1 -v
          node validation/publishing/test_next_independent_hourly_desk_v1.cjs
  generate-and-publish:
    # PRs only run tests; never publish to the public site.
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Recover previous valid FREE public edition
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages --depth=1 --no-tags
          if git show origin/gh-pages:market-desk/hourly-market-desk-current.json \
            > "$RUNNER_TEMP/previous-hourly-desk.json" 2>/dev/null; then
            echo 'Prior edition found; publish only if the source digest changes.' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '{}\n' > "$RUNNER_TEMP/previous-hourly-desk.json"
          fi
      - name: Build FREE market picture from market data and official RSS
        shell: bash
        run: |
          set -euo pipefail
          python validation/home/build_free_hourly_desk_v1.py \
            --root . \
            --previous "$RUNNER_TEMP/previous-hourly-desk.json" \
            --output "$RUNNER_TEMP/hourly-market-desk-current.json"
      - name: Publish only the independent FREE market picture on Pages
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin gh-pages --no-tags
            dir="$RUNNER_TEMP/free-hourly-pages-$attempt"
            git worktree add --detach "$dir" origin/gh-pages
            mkdir -p "$dir/market-desk"
            cp "$RUNNER_TEMP/hourly-market-desk-current.json" "$dir/market-desk/hourly-market-desk-current.json"
            (
              cd "$dir"
              git add -- market-desk/hourly-market-desk-current.json
              if git diff --cached --quiet; then
                echo 'FREE_MARKET_DESK_UNCHANGED: preserving original edition timestamp'
                exit 0
              fi
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m "Publish zero-API-cost hourly market narrative; existing alerts untouched"
              git push origin HEAD:gh-pages
            ) && {
              echo 'FREE_HOURLY_DESK_PUBLICATION_OK' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            }
            if [ "$attempt" = 3 ]; then
              echo 'Public site remains on its previous valid edition.' >&2
              exit 1
            fi
            sleep 3
          done
      - name: Retain independent free research edition for audit
        uses: actions/upload-artifact@v4
        with:
          name: next-free-hourly-desk-${{ github.run_id }}
          path: ${{ runner.temp }}/hourly-market-desk-current.json
          retention-days: 14
