name: FX Quant Next Independent FREE Hourly Desk

# This writer owns ONLY gh-pages:/market-desk/; V2 rsync --delete cannot erase it.
# Publishes a separate verification receipt even when the substantive edition is unchanged.
# Standalone research feed for the WEBSITE only. No external paid AI/API,
# no ChatGPT Automations interactions, no modifications to existing alerts.
on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/home/build_free_hourly_desk_v1.py'
      - 'validation/home/test_build_free_hourly_desk_v1.py'
      - 'site/fx-quant-v2/next/hourly-desk-ui-v1.js'
      - 'site/fx-quant-v2/next/hourly-desk-ui-v1.css'
      - 'site/fx-quant-v2/next/app.js'
      - 'site/fx-quant-v2/next/index.html'
      - 'validation/publishing/test_next_independent_hourly_desk_v1.cjs'
      - '.github/workflows/next-independent-ai-hourly-desk-v1.yml'
  push:
    branches: [main]
    paths:
      - 'validation/home/build_free_hourly_desk_v1.py'
      - 'validation/home/test_build_free_hourly_desk_v1.py'
      - 'validation/publishing/test_next_independent_hourly_desk_v1.cjs'
      - 'site/fx-quant-v2/next/hourly-desk-ui-v1.js'
      - 'site/fx-quant-v2/next/hourly-desk-ui-v1.css'
      - 'site/fx-quant-v2/next/app.js'
      - '.github/workflows/next-independent-ai-hourly-desk-v1.yml'
  # Rebuild on completed production source runs, including late releases and
  # unchanged observations, even if the scheduled desk tick is delayed.
  workflow_run:
    workflows:
      - Calendar News Operational Refresh V1
      - FX Quant V2 Cross-Asset Published Source Refresh
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
concurrency:
  group: next-independent-hourly-market-desk-v1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Offline zero-cost source and narrative regressions
        run: |
          python -m unittest validation.home.test_build_free_hourly_desk_v1 -v
          node validation/publishing/test_next_independent_hourly_desk_v1.cjs
  generate-and-publish:
    # PRs only run tests; never publish to the public site.
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success' &&
        contains(fromJSON('["schedule","push","workflow_dispatch","workflow_run"]'),
                 github.event.workflow_run.event)))
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Recover previous valid FREE public edition
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages --depth=1 --no-tags
          if git show origin/gh-pages:market-desk/hourly-market-desk-current.json \
            > "$RUNNER_TEMP/previous-hourly-desk.json" 2>/dev/null; then
            echo 'Prior edition found; publish only if the source digest changes.' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '{}\n' > "$RUNNER_TEMP/previous-hourly-desk.json"
          fi
      - name: Build FREE market picture from market data and official RSS
        shell: bash
        run: |
          set -euo pipefail
          python validation/home/build_free_hourly_desk_v1.py \
            --root . \
            --previous "$RUNNER_TEMP/previous-hourly-desk.json" \
            --output "$RUNNER_TEMP/hourly-market-desk-current.json" \
            --check-output "$RUNNER_TEMP/hourly-market-desk-check.json"
      - name: Publish only the independent FREE market picture on Pages
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin gh-pages --no-tags
            dir="$RUNNER_TEMP/free-hourly-pages-$attempt"
            git worktree add --detach "$dir" origin/gh-pages
            mkdir -p "$dir/market-desk"
            cp "$RUNNER_TEMP/hourly-market-desk-current.json" "$dir/market-desk/hourly-market-desk-current.json"
            cp "$RUNNER_TEMP/hourly-market-desk-check.json" "$dir/market-desk/hourly-market-desk-check.json"
            (
              cd "$dir"
              git add -- market-desk/hourly-market-desk-current.json market-desk/hourly-market-desk-check.json
              if git diff --cached --quiet; then
                echo 'FREE_MARKET_DESK_NO_NEW_CHECK: both receipt and edition unchanged'
                exit 0
              fi
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m "Publish free market edition and independently timed source check; alerts untouched"
              git push origin HEAD:gh-pages
            ) && {
              echo 'FREE_HOURLY_DESK_PUBLICATION_OK' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            }
            if [ "$attempt" = 3 ]; then
              echo 'Public site remains on its previous valid edition.' >&2
              exit 1
            fi
            sleep 3
          done
      - name: Verify the public edition and its source receipt after Pages delivery
        shell: bash
        env:
          PARENT_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/home-public-proof/market-desk"
          cp "$RUNNER_TEMP"/hourly-market-desk-{current,check}.json "$RUNNER_TEMP/home-public-proof/market-desk/"
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          from shutil import copyfile
          from validation.publishing.verify_pages_http_delivery_v1 import BASE_URL, verify

          runner = Path(os.environ["RUNNER_TEMP"])
          root = runner / "home-public-proof"
          paths = ["market-desk/hourly-market-desk-current.json", "market-desk/hourly-market-desk-check.json"]
          if os.environ.get("PARENT_WORKFLOW") == "FX Quant V2 Cross-Asset Published Source Refresh":
              path = Path("site/fx-quant-v2/cross-asset-live-data.json")
              (root / path).parent.mkdir(parents=True, exist_ok=True)
              copyfile(path, root / path)
              paths.append(str(path))
          proof = verify(root, BASE_URL, tuple(paths), budget_seconds=180, interval_seconds=10)
          (runner / "next-home-public-proof.json").write_text(json.dumps(proof, indent=2) + "\n")
          print("NEXT_HOME_PUBLIC_HTTP", proof["status"], flush=True)
          if proof["status"] != "PASS":
              raise SystemExit("Home feed or input did not reach public Pages")
          PYTHON
      - name: Retain independent free research edition for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-free-hourly-desk-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hourly-market-desk-current.json
            ${{ runner.temp }}/hourly-market-desk-check.json
            ${{ runner.temp }}/next-home-public-proof.json
          retention-days: 14


  record-failed-attempt:
    # Never replace the last successful source receipt on failure.
    needs: [validate, generate-and-publish]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success' &&
        contains(fromJSON('["schedule","push","workflow_dispatch","workflow_run"]'),
                 github.event.workflow_run.event))) &&
      (needs.validate.result == 'failure' ||
       needs.generate-and-publish.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - name: Record failed desk attempt without replacing last valid edition
        shell: bash
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          receipt = {
              "schema": "GMFQ_NEXT_HOURLY_FAILURE_V1",
              "status": "FAILED",
              "recorded_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "phase": "VALIDATION" if os.environ["VALIDATE_RESULT"] == "failure" else "BUILD_OR_PUBLICATION",
              "run_url": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "meaning": "A failure was recorded; the last successful source receipt is unchanged."
          }
          (Path(os.environ["RUNNER_TEMP"]) / "hourly-market-desk-failure.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
          for attempt in 1 2 3; do
            git fetch origin gh-pages --no-tags
            dir="$RUNNER_TEMP/free-hourly-failure-$attempt"
            git worktree add --detach "$dir" origin/gh-pages
            mkdir -p "$dir/market-desk"
            cp "$RUNNER_TEMP/hourly-market-desk-failure.json" "$dir/market-desk/hourly-market-desk-failure.json"
            (
              cd "$dir"
              git add -- market-desk/hourly-market-desk-failure.json
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git diff --cached --quiet || git commit -m "Record failed hourly desk attempt without changing successful receipt"
              git push origin HEAD:gh-pages
            ) && exit 0
            sleep 3
          done
          exit 1
