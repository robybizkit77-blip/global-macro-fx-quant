name: Liquidity Fed USD M2 Apply Proof V1

on:
  push:
    branches:
      - release-candidate-daily-data-orchestrator-v1-2026-10-12
    paths:
      - 'validation/fetch_fed_usd_m2_candidate.py'
      - 'validation/apply_fed_usd_m2_candidate.py'
      - '.github/workflows/liquidity-fed-usd-m2-apply-proof-v1.yml'
      - 'validation/liquidity/LIQUIDITY_SOURCE_POLICY_V1_2026-10-12.json'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-controlled-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot tracked runtime hash
        run: sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/runtime.before.sha256

      - name: Collect official Fed H6 candidate
        run: python validation/fetch_fed_usd_m2_candidate.py --out /tmp/usd-m2-candidate.json

      - name: Dry-run controlled apply
        run: |
          python validation/apply_fed_usd_m2_candidate.py \
            --candidate /tmp/usd-m2-candidate.json \
            > /tmp/usd-m2-dry-run.json
          cat /tmp/usd-m2-dry-run.json

      - name: Ephemeral apply on runtime copy
        run: |
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/NATIVE_LIQ_DATA.json
          python validation/apply_fed_usd_m2_candidate.py \
            --candidate /tmp/usd-m2-candidate.json \
            --runtime /tmp/NATIVE_LIQ_DATA.json \
            --apply \
            > /tmp/usd-m2-apply.json
          cat /tmp/usd-m2-apply.json

      - name: Verify receipt and append-only semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          candidate=json.loads(Path('/tmp/usd-m2-candidate.json').read_text())
          receipt=json.loads(Path('/tmp/usd-m2-apply.json').read_text())
          original=json.loads(Path('live_data/sections/NATIVE_LIQ_DATA.json').read_text())
          applied=json.loads(Path('/tmp/NATIVE_LIQ_DATA.json').read_text())

          assert candidate['runtime_match_confirmed'] is True
          assert candidate['source']['series_id']=='H6/H6_M2/M2.M'
          assert receipt['schema']=='GMFQ_LIQUIDITY_USD_M2_APPLY_RECEIPT_V1'
          assert receipt['publication_performed'] is False

          o=original['USD']['liquidity']
          a=applied['USD']['liquidity']
          n=len(o['dates'])
          assert a['dates'][:n] == o['dates']
          assert a['values'][:n] == o['values']
          assert len(a['dates']) == len(a['values'])
          assert len(a['dates']) == n + receipt['appended_observations']
          if candidate['candidate_update_available']:
              assert receipt['status']=='UPDATE_AVAILABLE'
              assert receipt['applied'] is True
              assert a['last_date'] == candidate['latest_date']
              assert float(a['last_value']) == float(candidate['latest_value'])
          else:
              assert receipt['status']=='NO_CHANGE'
              assert receipt['applied'] is False
              assert a == o
          PY

      - name: Verify tracked runtime was not mutated
        run: |
          sha256sum -c /tmp/runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json

      - name: Summary
        run: |
          echo 'USD M2 official provenance + append-only controlled apply proof: GREEN'
          echo 'Tracked runtime mutation: NONE'
          echo 'Publication: NONE'
