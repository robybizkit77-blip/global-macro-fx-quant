name: Control Room Site Audit

on:
  push:
    branches:
      - 'staging-control-room-*'
  workflow_dispatch:

jobs:
  site-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/gmfq-site-server.log 2>&1 &
          sleep 2
      - name: Audit new Control Room
        run: |
          cat > control-room-audit.js <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            const consoleErrors=[]; const pageErrors=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            let mainFrameNavigations=0;
            page.on('framenavigated',f=>{if(f===page.mainFrame())mainFrameNavigations++;});
            const url='http://127.0.0.1:8000/site/website-v1/index.html';
            const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
            if(!res||!res.ok())throw new Error('Home HTTP load failed');
            await page.waitForFunction(()=>document.documentElement.getAttribute('data-market-snapshot')==='READY',{timeout:120000});
            await page.waitForFunction(()=>document.documentElement.getAttribute('data-website-live-adapter')==='READY',{timeout:120000});

            const before=await page.evaluate(()=>({
              url:location.href,
              hero:document.documentElement.getAttribute('data-hero-period'),
              hierarchy:document.documentElement.getAttribute('data-hierarchy-period'),
              ticker:[...document.querySelectorAll('.ticker-strip .ticker')].map(x=>x.innerText.trim()),
              y:scrollY
            }));
            const navBefore=mainFrameNavigations;
            await page.locator('.hero-tabs [data-timeframe="1W"]').click();
            await page.waitForFunction(()=>document.documentElement.getAttribute('data-hero-period')==='1W');
            const after=await page.evaluate(()=>({
              url:location.href,
              hero:document.documentElement.getAttribute('data-hero-period'),
              ticker:[...document.querySelectorAll('.ticker-strip .ticker')].map(x=>x.innerText.trim()),
              y:scrollY
            }));
            if(mainFrameNavigations!==navBefore)throw new Error('Hero timeframe caused a document navigation/reload');
            if(!after.url.includes('tf=1W'))throw new Error('Hero URL state did not update');
            if(after.hero!=='1W')throw new Error('Hero period did not update');
            if(JSON.stringify(before.ticker)===JSON.stringify(after.ticker))throw new Error('Hero ticker values did not change on 1W');

            const hBefore=await page.locator('.hierarchy .rankrow').allTextContents();
            await page.locator('.hierarchy .mini-tabs b').filter({hasText:'1W'}).click();
            await page.waitForFunction(()=>document.documentElement.getAttribute('data-hierarchy-period')==='1W');
            const hAfter=await page.locator('.hierarchy .rankrow').allTextContents();
            if(JSON.stringify(hBefore)===JSON.stringify(hAfter))throw new Error('Hierarchy did not change on 1W');

            const linkChecks=await page.evaluate(()=>{
              const labels=['Valute','Tassi','Banche centrali','Posizionamento','Coppie','Rischio/Eventi','Top Themes','Library','Watchlist','Screener','Macro Data','Strumenti','Alert','Impostazioni'];
              return Object.fromEntries(labels.map(label=>{
                const a=[...document.querySelectorAll('.nav a')].find(x=>x.querySelector('b')?.textContent.trim()===label);
                return [label,a?.getAttribute('href')||null];
              }));
            });
            for(const [label,href] of Object.entries(linkChecks))if(!href||href==='#')throw new Error(`Broken nav link: ${label} => ${href}`);

            const cards=await page.locator('.ticker-strip .ticker').count();
            if(cards!==8)throw new Error('Expected 8 hero ticker cards, got '+cards);
            if(consoleErrors.length)throw new Error('Console errors: '+consoleErrors.join(' | '));
            if(pageErrors.length)throw new Error('Page errors: '+pageErrors.join(' | '));

            console.log(JSON.stringify({before,after,linkChecks,cards,mainFrameNavigations},null,2));
            await page.screenshot({path:'control-room-site-audit.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error('::error title=Control Room Site Audit::'+String(e.message||e));process.exit(1)});
          EOF
          node control-room-audit.js
      - name: Upload screenshot and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-room-site-audit
          path: |
            control-room-site-audit.png
            /tmp/gmfq-site-server.log
