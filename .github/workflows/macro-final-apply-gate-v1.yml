name: Macro Final Apply Gate V1

on:
  push:
    branches:
      - 'feature/macro-final-apply-gate-*'
    paths:
      - 'validation/macro_final_apply_gate.py'
      - 'validation/test_macro_final_apply_gate.py'
      - '.github/workflows/macro-final-apply-gate-v1.yml'
      - '.github/workflows/macro-safe-publication-gate-v1.yml'
  workflow_dispatch:
    inputs:
      safe_publication_run_id:
        description: GitHub Actions run id that produced macro-safe-publication-proposal-<run_id>
        required: true
        type: string
      candidate_branch:
        description: Optional release-macro-final-apply-* branch name; blank uses the run id
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read
  pull-requests: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: macro-final-apply-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verifier-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test final apply verifier and fail-closed mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/test_macro_final_apply_gate.py | tee /tmp/macro-final-apply-selftest.json
      - name: Prove verifier self-test is read-only
        shell: bash
        run: git diff --exit-code -- live_data payload validation/macro
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-final-apply-selftest-${{ github.run_id }}
          path: /tmp/macro-final-apply-selftest.json
          if-no-files-found: error

  final-apply:
    if: github.event_name == 'workflow_dispatch'
    needs: verifier-self-test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require dispatch from canonical main workflow
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo "Final apply must be dispatched from main, got $GITHUB_REF" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Freeze current main base SHA
        id: base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          BASE_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN="$(git rev-parse origin/main)"
          test "$BASE_SHA" = "$REMOTE_MAIN"
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "FINAL_APPLY_BASE_SHA=$BASE_SHA"

      - name: Download exact Safe Publication proposal artifact
        uses: actions/download-artifact@v4
        with:
          name: macro-safe-publication-proposal-${{ inputs.safe_publication_run_id }}
          path: /tmp/macro-final-apply/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.safe_publication_run_id }}

      - name: Verify receipt, PIT evidence, candidate, base SHA and all hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/macro_final_apply_gate.py \
            --artifact-root /tmp/macro-final-apply/source \
            --expected-base-sha '${{ steps.base.outputs.sha }}' \
            --output /tmp/macro-final-apply/verification.json \
            | tee /tmp/macro-final-apply/verification.stdout.json

      - name: Resolve and validate candidate branch name
        id: branch
        shell: bash
        env:
          REQUESTED: ${{ inputs.candidate_branch }}
          RUN_ID: ${{ inputs.safe_publication_run_id }}
        run: |
          set -euo pipefail
          BRANCH="$REQUESTED"
          if [ -z "$BRANCH" ]; then BRANCH="release-macro-final-apply-${RUN_ID}"; fi
          case "$BRANCH" in
            release-macro-final-apply-*) ;;
            *) echo "Candidate branch must match release-macro-final-apply-*" >&2; exit 1 ;;
          esac
          if [ "$BRANCH" = main ] || [ "$BRANCH" = gh-pages ]; then
            echo 'Forbidden target branch' >&2; exit 1
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Candidate branch already exists; refusing to overwrite: $BRANCH" >&2
            exit 1
          fi
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Apply proposal to ephemeral checkout only
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$(find /tmp/macro-final-apply/source -type f -name proposal.patch -print)"
          test "$(printf '%s\n' "$PATCH" | sed '/^$/d' | wc -l)" -eq 1
          git apply --check "$PATCH"
          git apply "$PATCH"

          RECEIPT="$(find /tmp/macro-final-apply/source -type f -name receipt.json -print)"
          MANIFEST="$(find /tmp/macro-final-apply/source -type f -name file-sha256.json -print)"
          test "$(printf '%s\n' "$RECEIPT" | sed '/^$/d' | wc -l)" -eq 1
          test "$(printf '%s\n' "$MANIFEST" | sed '/^$/d' | wc -l)" -eq 1
          export RECEIPT MANIFEST
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          receipt=json.load(open(os.environ['RECEIPT']))
          manifest=json.load(open(os.environ['MANIFEST']))
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          expected=receipt['changed_files']
          if changed != expected and set(changed) != set(expected):
              raise SystemExit(f'exact diff scope mismatch: changed={changed!r} expected={expected!r}')
          if set(manifest) != set(expected):
              raise SystemExit('hash manifest scope differs from receipt')
          for rel,want in manifest.items():
              p=pathlib.Path(rel)
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              if got != want:
                  raise SystemExit(f'post-apply hash mismatch: {rel}: {got} != {want}')
          forbidden=[p for p in changed if not p.startswith(('live_data/','payload/'))]
          if forbidden:
              raise SystemExit(f'forbidden final diff paths: {forbidden!r}')
          print('FINAL_APPLY_EXACT_DIFF_AND_HASH_PASS')
          PY

      - name: Run full local runtime and integrity preflight before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/check_live_update_contract.py | tee /tmp/macro-final-apply/live-update-contract.json
          python3 validation/check_cb_pricing_source_registry.py | tee /tmp/macro-final-apply/cb-pricing-source-registry.json
          python3 validation/test_cb_pricing_source_registry_failclosed.py | tee /tmp/macro-final-apply/cb-pricing-failclosed-negative.json
          python3 validation/rebuild_live_data_runtime.py --verify-only | tee /tmp/macro-final-apply/runtime-roundtrip.json

      - name: Commit only to candidate branch and push
        id: candidate
        shell: bash
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git switch -c "$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- live_data payload
          git diff --cached --quiet && { echo 'No candidate diff to commit' >&2; exit 1; }
          git commit -m "Apply certified macro publication candidate"
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA"

      - name: Wait for exact candidate SHA full gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          expected=('Live Update Preflight V1' 'Engine Logic Audit' 'Staging Browser Audit')
          for attempt in $(seq 1 90); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${CANDIDATE_SHA}&event=push&per_page=100")"
            all_green=true
            for name in "${expected[@]}"; do
              row="$(printf '%s' "$runs" | jq -c --arg n "$name" --arg s "$CANDIDATE_SHA" '[.workflow_runs[] | select(.name==$n and .head_sha==$s)] | sort_by(.created_at) | last // empty')"
              if [ -z "$row" ]; then
                echo "$name: waiting for run"
                all_green=false
                continue
              fi
              status="$(printf '%s' "$row" | jq -r '.status')"
              conclusion="$(printf '%s' "$row" | jq -r '.conclusion // ""')"
              url="$(printf '%s' "$row" | jq -r '.html_url')"
              echo "$name: status=$status conclusion=$conclusion $url"
              if [ "$status" = completed ] && [ "$conclusion" != success ]; then
                echo "$name failed for exact candidate SHA $CANDIDATE_SHA" >&2
                exit 1
              fi
              if [ "$status" != completed ] || [ "$conclusion" != success ]; then
                all_green=false
              fi
            done
            if [ "$all_green" = true ]; then
              echo 'ALL_EXACT_CANDIDATE_GATES_GREEN'
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out before all exact candidate SHA gates were GREEN' >&2
          exit 1

      - name: Re-verify base SHA did not move and candidate diff stayed exact
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main '${{ steps.branch.outputs.name }}' --no-tags
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$BASE_SHA" || { echo "main moved: $BASE_SHA -> $CURRENT_MAIN" >&2; exit 1; }
          RECEIPT="$(find /tmp/macro-final-apply/source -type f -name receipt.json -print)"
          export RECEIPT BASE_SHA CANDIDATE_SHA
          python3 - <<'PY'
          import json, os, subprocess
          expected=json.load(open(os.environ['RECEIPT']))['changed_files']
          actual=subprocess.check_output(['git','diff','--name-only',f"{os.environ['BASE_SHA']}..{os.environ['CANDIDATE_SHA']}"],text=True).splitlines()
          if set(actual) != set(expected):
              raise SystemExit(f'candidate/base exact diff drift: actual={actual!r} expected={expected!r}')
          print('FINAL_CANDIDATE_BASE_DIFF_PASS')
          PY

      - name: Create review-only PR to main after all GREEN
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          SAFE_RUN_ID: ${{ inputs.safe_publication_run_id }}
        run: |
          set -euo pipefail
          PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title 'Apply certified macro publication candidate' \
            --body "Final Apply Gate V1 passed fail-closed verification.\n\n- Safe Publication run: ${SAFE_RUN_ID}\n- Base main SHA: ${BASE_SHA}\n- Candidate SHA: ${CANDIDATE_SHA}\n- Receipt/evidence/candidate/hash: verified\n- Exact diff scope: verified\n- Live Update Preflight V1: GREEN on candidate SHA\n- Engine Logic Audit: GREEN on candidate SHA\n- Staging Browser Audit: GREEN on candidate SHA\n- Direct main write: NO\n- Auto-merge: NO\n- gh-pages publication: NO\n\nManual review/merge required.")"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "FINAL_APPLY_PR_CREATED=$PR_URL"

      - name: Upload final apply evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-final-apply-evidence-${{ github.run_id }}
          path: /tmp/macro-final-apply/
          if-no-files-found: warn
          retention-days: 60

      - name: Governance invariant
        if: always()
        shell: bash
        run: |
          echo 'Final Apply Gate never pushes to main, never enables auto-merge, and never publishes gh-pages.'
          echo 'A PR is created only after receipt/evidence/candidate/base/hash verification, exact candidate diff verification, and all three canonical candidate-SHA gates are GREEN.'
