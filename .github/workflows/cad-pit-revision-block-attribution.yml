name: CAD PIT Revision Block Attribution
on:
  push:
    branches:
      - staging-usd-pit-readiness-2026-10-03
    paths:
      - 'validation/audit_cad_revision_block_attribution.py'
      - '.github/workflows/cad-pit-revision-block-attribution.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run CAD revision block attribution audit
        run: python validation/audit_cad_revision_block_attribution.py
      - name: Commit audit artifact
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/CAD_PIT_REVISION_BLOCK_ATTRIBUTION_2026-10-03.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record CAD PIT revision block attribution audit'
          git push
