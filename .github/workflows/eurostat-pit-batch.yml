name: Eurostat PIT Batch

on:
  push:
    branches:
      - engine-freeze-v1-2026-10-02
    paths:
      - 'validation/extract_eurostat_pit_batch.py'
      - '.github/workflows/eurostat-pit-batch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engine-freeze-v1-2026-10-02
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract Eurostat EUR PIT batch
        run: python validation/extract_eurostat_pit_batch.py
      - name: Commit EUR PIT batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/pit_batch/eurostat/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Materialize Eurostat EUR industrial production and unemployment PIT batch"
            git push origin HEAD:engine-freeze-v1-2026-10-02
          fi
