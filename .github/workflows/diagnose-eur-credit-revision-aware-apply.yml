name: Diagnose EUR Credit Revision-Aware Apply

on:
  push:
    branches:
      - release-candidate-daily-data-orchestrator-v1-2026-10-12
    paths:
      - 'validation/fetch_ecb_eur_nfc_loans_revision_aware_candidate.py'
      - 'validation/apply_ecb_eur_nfc_loans_revision_aware_candidate.py'
      - '.github/workflows/diagnose-eur-credit-revision-aware-apply.yml'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eur-credit-revision-aware-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot tracked runtime
        run: sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/runtime.before.sha256
      - name: Build official ECB revision-aware candidate
        run: |
          python validation/fetch_ecb_eur_nfc_loans_revision_aware_candidate.py --out /tmp/eur-credit.json
          cat /tmp/eur-credit.json
      - name: Validate source identity and revision contract
        run: |
          python - <<'PY'
          import json
          c=json.load(open('/tmp/eur-credit.json'))
          assert c['schema']=='GMFQ_LIQUIDITY_EUR_NFC_LOANS_REVISION_AWARE_CANDIDATE_V1', c
          assert c['status']=='GREEN_SOURCE_CANDIDATE_ONLY', c
          assert c['source']['series_key']=='BSI.M.U2.N.A.A20.A.1.U2.2240.Z01.E', c
          p=c['proof']
          assert p['revision_aware_append_only'] is True, p
          assert p['historical_runtime_values_frozen'] is True, p
          assert p['identity_transform_for_new_observations'] is True, p
          assert p['overlap_count'] >= 12, p
          assert p['exact_match_count'] > 0, p
          assert p['revision_mismatch_count'] >= 1, p
          assert c['candidate_pipeline_ready'] is True, c
          assert c['runtime_mutated'] is False and c['publication_performed'] is False, c
          print('EUR_CREDIT_REVISION_AWARE_SOURCE_CONTRACT_PASS')
          PY
      - name: Dry-run controlled apply
        run: |
          python validation/apply_ecb_eur_nfc_loans_revision_aware_candidate.py --candidate /tmp/eur-credit.json > /tmp/eur-credit-dry.json
          cat /tmp/eur-credit-dry.json
      - name: Prove controlled apply on runtime copy
        run: |
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/NATIVE_LIQ_DATA.eur-credit.json
          python validation/apply_ecb_eur_nfc_loans_revision_aware_candidate.py --candidate /tmp/eur-credit.json --runtime /tmp/NATIVE_LIQ_DATA.eur-credit.json --apply > /tmp/eur-credit-apply.json
          cat /tmp/eur-credit-apply.json
          python - <<'PY'
          import json
          c=json.load(open('/tmp/eur-credit.json'))
          dry=json.load(open('/tmp/eur-credit-dry.json'))
          r=json.load(open('/tmp/eur-credit-apply.json'))
          original=json.load(open('live_data/sections/NATIVE_LIQ_DATA.json'))['EUR']['credit']
          applied=json.load(open('/tmp/NATIVE_LIQ_DATA.eur-credit.json'))['EUR']['credit']
          n=len(original['dates'])
          assert applied['dates'][:n]==original['dates'], (applied, original)
          assert applied['values'][:n]==original['values'], (applied, original)
          assert r['runtime_history_rewritten'] is False, r
          assert r['revision_aware_append_only'] is True, r
          assert dry['applied'] is False, dry
          expected=len(c['new_observations'])
          assert dry['appended_observations']==expected, (dry,c)
          assert r['appended_observations']==expected, (r,c)
          if expected:
              assert r['applied'] is True and r['status']=='UPDATE_AVAILABLE', r
              assert applied['dates'][-1]==c['new_observations'][-1]['date'], (applied,c)
              assert float(applied['values'][-1])==float(c['new_observations'][-1]['value']), (applied,c)
          else:
              assert r['applied'] is False and r['status']=='NO_CHANGE', r
          print('EUR_CREDIT_REVISION_AWARE_CONTROLLED_APPLY_PASS')
          PY
      - name: Verify tracked runtime unchanged
        run: |
          sha256sum -c /tmp/runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Summary
        run: |
          echo 'EUR.credit exact ECB series: BSI.M.U2.N.A.A20.A.1.U2.2240.Z01.E'
          echo 'Historical current-vintage revisions: accepted diagnostically, never rewritten'
          echo 'Controlled append-only apply: tested on runtime copy'
          echo 'Tracked runtime mutation: NONE'
          echo 'Publication: NONE'
