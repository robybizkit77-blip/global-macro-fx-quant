name: CAD PIT Revision Distribution Audit
on:
  push:
    branches:
      - staging-usd-pit-readiness-2026-10-03
    paths:
      - 'validation/audit_cad_pit_revision_distribution.py'
      - '.github/workflows/cad-pit-revision-distribution-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run CAD PIT revision distribution audit
        run: python validation/audit_cad_pit_revision_distribution.py
      - name: Commit audit artifact if changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/CAD_PIT_REVISION_DISTRIBUTION_AUDIT_2026-10-03.json
          if git diff --cached --quiet; then
            echo 'No audit changes'
            exit 0
          fi
          git commit -m 'Record CAD PIT revision distribution audit'
          git push
