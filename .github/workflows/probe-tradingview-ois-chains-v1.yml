name: Probe TradingView OIS Chains V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'validation/cb_pricing/probe_tradingview_ois_chains_v1.py'
      - '.github/workflows/probe-tradingview-ois-chains-v1.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe server-visible futures chains
        run: python validation/cb_pricing/probe_tradingview_ois_chains_v1.py
