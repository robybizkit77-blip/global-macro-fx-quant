name: CFTC Rollback Verify

on:
  push:
    branches:
      - design-live-update-pipeline-v1-2026-10-05
    paths:
      - '.github/workflows/cftc-rollback-verify.yml'

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRE_REFRESH_SHA: 25478513e0b946eade134d7b866fac3ba1957a20
      VALIDATED_REFRESH_SHA: b4eab760484c10ed1216a1c39a837318f6db9b4b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record validated candidate hashes
        run: |
          git show "$VALIDATED_REFRESH_SHA:live_data/sections/V247_COT_STORIES.json" | sha256sum | awk '{print $1}' > /tmp/candidate-story.sha
          git show "$VALIDATED_REFRESH_SHA:payload/part-00.txt" | sha256sum | awk '{print $1}' > /tmp/candidate-part00.sha
          git show "$VALIDATED_REFRESH_SHA:live_data/manifest.v2.json" | sha256sum | awk '{print $1}' > /tmp/candidate-manifest.sha

      - name: Restore previous validated live state in ephemeral workspace
        run: |
          git checkout "$PRE_REFRESH_SHA" -- live_data/sections/V247_COT_STORIES.json payload/part-00.txt live_data/manifest.v2.json
          python3 - <<'PY'
          import json
          d=json.load(open('live_data/sections/V247_COT_STORIES.json'))
          assert d['CHF']['signal']=='NEUTRALE',d['CHF']
          assert d['CAD']['signal']=='EXTREME LONG',d['CAD']
          print('ROLLBACK_STATE_RESTORED_PASS')
          PY

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium

      - name: Start server on rollback state
        run: |
          python3 -m http.server 8769 --bind 127.0.0.1 > /tmp/gmfq-rollback-server.log 2>&1 &
          echo $! > /tmp/gmfq-rollback-server.pid
          sleep 2

      - name: Engine Gate on rollback state
        shell: bash
        run: |
          awk "/cat > engine-audit.js <<'EOF'/{flag=1;next}/^          EOF$/{if(flag){exit}}flag{sub(/^          /,\"\");print}" .github/workflows/engine-logic-audit.yml > engine-audit.js
          test -s engine-audit.js
          sed -i 's#http://127.0.0.1:8765/#http://127.0.0.1:8769/#g' engine-audit.js
          node engine-audit.js

      - name: Browser Gate on rollback state
        shell: bash
        run: |
          awk "/cat > browser-audit.js <<'EOF'/{flag=1;next}/^          EOF$/{if(flag){exit}}flag{sub(/^          /,\"\");print}" .github/workflows/staging-browser-audit.yml > browser-audit.js
          test -s browser-audit.js
          sed -i 's#http://127.0.0.1:8000/#http://127.0.0.1:8769/#g' browser-audit.js
          node browser-audit.js

      - name: Reapply current canonical CFTC derived state from source layer
        run: |
          python3 validation/build_cot_stories.py --output /tmp/V247_COT_STORIES.reapply.json > /tmp/reapply-builder.json
          python3 validation/update_live_derived_sections.py --cot /tmp/V247_COT_STORIES.reapply.json --apply > /tmp/reapply-injector.json
          python3 validation/build_live_manifest_v2.py > /tmp/reapply-manifest.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/reapply-manifest.json'))
          assert d['status']=='PASS',d
          open('live_data/manifest.v2.json','w').write(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Verify reapply is byte-identical to validated candidate
        run: |
          test "$(sha256sum live_data/sections/V247_COT_STORIES.json | awk '{print $1}')" = "$(cat /tmp/candidate-story.sha)"
          test "$(sha256sum payload/part-00.txt | awk '{print $1}')" = "$(cat /tmp/candidate-part00.sha)"
          test "$(sha256sum live_data/manifest.v2.json | awk '{print $1}')" = "$(cat /tmp/candidate-manifest.sha)"
          python3 - <<'PY'
          import json
          d=json.load(open('live_data/sections/V247_COT_STORIES.json'))
          assert d['CHF']['signal']=='EXTREME LONG',d['CHF']
          assert d['CAD']['signal']=='NEUTRALE',d['CAD']
          print(json.dumps({'status':'PASS','rollback':'GATES_PASS','reapply':'BYTE_IDENTICAL_TO_VALIDATED_CANDIDATE'},indent=2))
          PY

      - name: Confirm no persistent mutation
        run: |
          echo 'ROLLBACK_VERIFICATION_PASS_CANDIDATE'
          echo 'Ephemeral only: no push, no main, no gh-pages, no schedule.'
