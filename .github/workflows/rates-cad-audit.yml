name: Rates CAD Audit
on:
  workflow_dispatch:
  push:
    branches:
      - staging-rates-cad-2026-10-05
    paths:
      - 'validation/fetch_rates_cad.py'
      - '.github/workflows/rates-cad-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and compare official CAD rates
        run: python validation/fetch_rates_cad.py
      - name: Upload audit output
        uses: actions/upload-artifact@v4
        with:
          name: rates-cad-audit
          path: validation/rates_cad_audit_output.json
