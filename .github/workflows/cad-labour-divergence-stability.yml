name: CAD Labour Divergence Stability
on:
  push:
    branches: [staging-usd-pit-readiness-2026-10-03]
    paths:
      - 'validation/audit_cad_labour_divergence_stability.py'
      - '.github/workflows/cad-labour-divergence-stability.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-usd-pit-readiness-2026-10-03
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python validation/audit_cad_labour_divergence_stability.py
      - name: Commit audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/CAD_LABOUR_DIVERGENCE_STABILITY_AUDIT_2026-10-03.json
          git diff --cached --quiet || git commit -m 'Add CAD labour divergence stability audit result'
          git push
