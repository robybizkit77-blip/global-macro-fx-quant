name: Patch Daily Orchestrator V1 Macro Aligned State

on:
  push:
    branches:
      - release-candidate-daily-data-orchestrator-v1-2026-10-12
    paths:
      - '.github/workflows/patch-daily-orchestrator-v1-macro-aligned.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release-candidate-daily-data-orchestrator-v1-2026-10-12

      - name: Patch stale Macro detached-state assumption
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path=Path('.github/workflows/daily-data-orchestrator-v1.yml')
          text=path.read_text(encoding='utf-8')
          start='      - name: Prove current Macro sections are detached from runtime\n'
          end='      - name: Restore tracked runtime after proof\n'
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit('macro block anchors are not unique')
          a=text.index(start)
          b=text.index(end,a)

          replacement=r'''      - name: Validate current Macro alignment state
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 validation/build_live_manifest_v2.py --write /tmp/daily-orchestrator-v1/manifest.before.json > /tmp/daily-orchestrator-v1/manifest-before.log 2>&1
          rc=$?
          set -e
          cat /tmp/daily-orchestrator-v1/manifest-before.log
          python3 - "$rc" <<'PY'
          import json,sys
          rc=int(sys.argv[1])
          m=json.load(open('/tmp/daily-orchestrator-v1/manifest.before.json'))
          rows={x['key']:x for x in m['sections']}
          macro=('MACRO_THERMOMETER_DATA','MACRO_SERIES')
          if rc == 0:
              assert m['status']=='PASS', m
              for key in macro:
                  assert rows[key]['occurrences_in_payload']==1, (key, rows[key])
              open('/tmp/daily-orchestrator-v1/macro-runtime-state','w').write('ALIGNED\n')
              print('MACRO_RUNTIME_ALREADY_ALIGNED_PASS')
          else:
              assert m['status']=='FAIL', m
              for key in macro:
                  assert rows[key]['occurrences_in_payload']==0, (key, rows[key])
              open('/tmp/daily-orchestrator-v1/macro-runtime-state','w').write('DETACHED\n')
              print('LEGACY_DETACHED_MACRO_RUNTIME_CONFIRMED')
          PY

      - name: Ephemerally repair Macro only when detached
        shell: bash
        run: |
          set -euo pipefail
          state="$(cat /tmp/daily-orchestrator-v1/macro-runtime-state)"
          if [ "$state" = "DETACHED" ]; then
            python3 validation/repair_detached_direct_section.py --section MACRO_THERMOMETER_DATA --apply | tee /tmp/daily-orchestrator-v1/repair-macro-thermometer.json
            python3 validation/repair_detached_direct_section.py --section MACRO_SERIES --apply | tee /tmp/daily-orchestrator-v1/repair-macro-series.json
            python3 validation/build_live_manifest_v2.py --write live_data/manifest.v2.json | tee /tmp/daily-orchestrator-v1/manifest-after.log
          else
            echo 'MACRO_ALREADY_ALIGNED_NO_REPAIR_REQUIRED'
          fi

      - name: Validate Macro runtime and exact diff scope
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/check_live_update_contract.py | tee /tmp/daily-orchestrator-v1/live-contract-after.log
          python3 validation/rebuild_live_data_runtime.py --verify-only | tee /tmp/daily-orchestrator-v1/runtime-roundtrip-after.json
          python3 - <<'PY'
          import subprocess
          state=open('/tmp/daily-orchestrator-v1/macro-runtime-state').read().strip()
          changed=subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          print('EPHEMERAL_CHANGED_FILES', changed, 'MACRO_STATE', state)
          if state == 'ALIGNED':
              expected={'payload/part-15.txt'}
          elif state == 'DETACHED':
              expected={'live_data/manifest.v2.json','payload/part-00.txt','payload/part-01.txt','payload/part-15.txt'}
          else:
              raise SystemExit(f'unknown Macro state: {state}')
          if set(changed) != expected:
              raise SystemExit(f'unexpected ephemeral diff scope: {changed}; expected={sorted(expected)}')
          PY

'''
          path.write_text(text[:a]+replacement+text[b:],encoding='utf-8')
          PY

      - name: Enforce exact patch scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = ".github/workflows/daily-data-orchestrator-v1.yml"
          git diff --check

      - name: Commit V1 aligned-state repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/daily-data-orchestrator-v1.yml
          git commit -m 'Accept aligned Macro runtime in Daily Orchestrator V1'
          git push origin HEAD:release-candidate-daily-data-orchestrator-v1-2026-10-12
