name: Macro EUR Inflation PIT Bootstrap V1

on:
  push:
    branches:
      - 'validation-macro-eur-inflation-pit-bootstrap-*'
    paths:
      - '.github/workflows/macro-eur-inflation-pit-bootstrap-v1.yml'
      - 'validation/macro_pit_historical_bootstrap.py'
      - 'validation/test_macro_pit_historical_bootstrap.py'
      - 'validation/macro_pit_registry_promotion.py'
      - 'validation/test_macro_pit_registry_promotion.py'
      - 'validation/macro/eur_inflation_historical_anchor_2026-09.json'
      - 'validation/sources/eur_eurostat_core.py'
      - 'validation/build_macro_candidate.py'
      - 'validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json'
      - 'live_data/sections/MACRO_SERIES.json'
      - 'live_data/sections/MACRO_THERMOMETER_DATA.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-eur-inflation-pit-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  historical-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run bootstrap and promotion fail-closed tests
        run: |
          python3 validation/test_macro_pit_historical_bootstrap.py
          python3 validation/test_macro_pit_registry_promotion.py
      - name: Verify current official Eurostat inflation candidate read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/eur-inflation-bootstrap/live
          python3 validation/sources/eur_eurostat_core.py --dimension inflation --output /tmp/eur-inflation-bootstrap/live/candidate.json --audit-output /tmp/eur-inflation-bootstrap/live/source-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/eur-inflation-bootstrap/live/candidate.json').read_text())
          a=json.loads(Path('/tmp/eur-inflation-bootstrap/live/source-audit.json').read_text())
          m=json.loads(Path('validation/macro/eur_inflation_historical_anchor_2026-09.json').read_text())
          assert c['currency']=='EUR' and c['dimension']=='inflation'
          assert c['series_id']==m['series_id']=='EA_HICP_HEADLINE_YOY'
          assert c['macro_series_id']==m['target']['macro_series_id']=='EA_HICP_HEADLINE_YOY_history_value'
          assert c['observation_date'][:7]==m['current']['observation_date'][:7]
          assert float(c['value'])==float(m['current']['value'])==3.8
          assert a['prior_period'][:7]==m['previous']['observation_date'][:7]
          assert float(a['prior_value'])==float(m['previous']['value'])==3.2
          assert a['candidate_only'] is True and a['live_data_written'] is False
          PY
          git diff --exit-code -- live_data/sections/MACRO_SERIES.json live_data/sections/MACRO_THERMOMETER_DATA.json
      - name: Run historical PIT bootstrap replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/eur-inflation-bootstrap/replay
          python3 validation/macro_pit_historical_bootstrap.py --anchor-manifest validation/macro/eur_inflation_historical_anchor_2026-09.json --evidence-output /tmp/eur-inflation-bootstrap/macro_pit_anchor_evidence.json --work-dir /tmp/eur-inflation-bootstrap/replay
      - name: Verify and apply only EUR inflation certification
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/macro_pit_registry_promotion.py --evidence /tmp/eur-inflation-bootstrap/macro_pit_anchor_evidence.json --proposed-registry /tmp/eur-inflation-bootstrap/proposed-registry.json --receipt /tmp/eur-inflation-bootstrap/promotion-receipt.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          canonical=json.loads(Path('validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json').read_text())
          proposed=json.loads(Path('/tmp/eur-inflation-bootstrap/proposed-registry.json').read_text())
          receipt=json.loads(Path('/tmp/eur-inflation-bootstrap/promotion-receipt.json').read_text())
          evidence=json.loads(Path('/tmp/eur-inflation-bootstrap/macro_pit_anchor_evidence.json').read_text())
          key='EUR.inflation'; row=canonical['series'][key]; prow=proposed['series'][key]
          assert receipt['status']=='PASS' and receipt['target']==key
          assert receipt['evidence_class']=='RECONSTRUCTED_HISTORICAL_REPLAY'
          assert evidence['bootstrap_provenance']['official_release_pair_verified'] is True
          assert prow['historical_replay_certified'] is True
          assert float(prow['historical_replay_evidence']['value'])==3.8
          if row.get('historical_replay_certified') is not True:
              assert receipt['promotion_action']=='PROPOSAL_CREATED'
              c2=json.loads(json.dumps(canonical)); p2=json.loads(json.dumps(proposed))
              c2['series'][key].pop('historical_replay_certified',None)
              p2['series'][key].pop('historical_replay_certified',None)
              p2['series'][key].pop('historical_replay_evidence',None)
              assert c2==p2
              Path('validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json').write_text(json.dumps(proposed,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          else:
              assert receipt['promotion_action'] in {'METADATA_ENRICHMENT_PROPOSED','ALREADY_CERTIFIED'}
          PY
          if ! git diff --quiet -- validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json; then
            test "$(git diff --name-only)" = 'validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json
            git commit -m 'Certify EUR inflation historical replay'
            git push origin HEAD:validation-macro-eur-inflation-pit-bootstrap-2026-10-09
          fi
      - name: Upload bootstrap and promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-eur-inflation-pit-bootstrap-${{ github.run_id }}
          path: /tmp/eur-inflation-bootstrap/
          if-no-files-found: error
          retention-days: 90
