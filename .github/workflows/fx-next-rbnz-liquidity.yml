name: FX Quant Next RBNZ Monthly Liquidity Research

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fx-next-rbnz-liquidity.yml'
      - 'validation/publishing/collect_next_rbnz_liquidity.py'
      - 'validation/publishing/test_collect_next_rbnz_liquidity.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/fx-next-rbnz-liquidity.yml'
      - 'validation/publishing/collect_next_rbnz_liquidity.py'
      - 'validation/publishing/test_collect_next_rbnz_liquidity.py'
  schedule:
    # Check daily: C60 is released mid-month, D10/C50 at month end.
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test historical backfill and revision guard
        run: python3 -m unittest validation.publishing.test_collect_next_rbnz_liquidity -v
      - name: Read and validate all three live source tables
        run: python3 validation/publishing/collect_next_rbnz_liquidity.py "$RUNNER_TEMP/nzd.js" --require-c60

      - name: Inspect official D10 and C50 workbook identities and recent observations
        if: github.head_ref == 'research/rbnz-workbook-history-20261127'
        run: |
          python3 -m pip install openpyxl==3.1.5
          python3 - <<'PY'
          import io, hashlib, urllib.request, urllib.parse
          from openpyxl import load_workbook
          urls={
            'D10':'https://www.rbnz.govt.nz/-/media/project/sites/rbnz/files/statistics/series/d-f-r/d10/hd10.xlsx',
            'C50':'https://www.rbnz.govt.nz/-/media/project/sites/rbnz/files/statistics/series/c/c50/hc50.xlsx',
          }
          for key,url in urls.items():
              req=urllib.request.Request(url,headers={'User-Agent':'RBNZ-Automated-Agent/GlobalMacroFXQuant/LiquidityResearch'})
              with urllib.request.urlopen(req,timeout=25) as response:
                  assert urllib.parse.urlsplit(response.geturl()).hostname in ('www.rbnz.govt.nz','rbnz.govt.nz')
                  raw=response.read(2000001)
              assert len(raw)<2000001 and raw.startswith(b'PK')
              wb=load_workbook(io.BytesIO(raw),read_only=True,data_only=True)
              print('WORKBOOK',key,hashlib.sha256(raw).hexdigest(),wb.sheetnames)
              for ws in wb:
                  print('SHEET',ws.title,ws.max_row,ws.max_column)
                  if ws.max_column>100 or ws.max_row>20000: continue
                  rows=list(ws.values)
                  for i,row in enumerate(rows[:18],1):
                      print('HEADER',i,repr(row)[:3000])
                  for i,row in enumerate(rows[-12:],len(rows)-11):
                      print('TAIL',i,repr(row)[:3000])
              wb.close()
          PY

  refresh:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: write
    concurrency:
      group: next-rbnz-liquidity-refresh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh official D10, C50 and C60 data
        env:
          TARGET: site/fx-quant-v2/next/nzd-rbnz-liquidity-research-v1.js
        run: |
          set -euo pipefail
          python3 validation/publishing/collect_next_rbnz_liquidity.py "$TARGET" | tee -a "$GITHUB_STEP_SUMMARY"
          git add -- "$TARGET"
          if git diff --cached --quiet; then
            echo "Already current" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Refresh official NZD D10/C50/C60 research'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
