name: FX Quant Next RBNZ Monthly Liquidity Research

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fx-next-rbnz-liquidity.yml'
      - 'validation/publishing/collect_next_rbnz_liquidity.py'
      - 'validation/publishing/test_collect_next_rbnz_liquidity.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/fx-next-rbnz-liquidity.yml'
      - 'validation/publishing/collect_next_rbnz_liquidity.py'
      - 'validation/publishing/test_collect_next_rbnz_liquidity.py'
  schedule:
    # Check daily: C60 is released mid-month, D10/C50 at month end.
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install openpyxl==3.1.5
      - name: Test historical backfill and revision guard
        run: python3 -m unittest validation.publishing.test_collect_next_rbnz_liquidity -v
      - name: Read and validate all three live source tables
        run: |
          cp site/fx-quant-v2/next/nzd-rbnz-liquidity-research-v1.js "$RUNNER_TEMP/nzd.js"
          python3 validation/publishing/collect_next_rbnz_liquidity.py "$RUNNER_TEMP/nzd.js" --require-c60
          python3 -c 'import json,sys; d=json.loads(open(sys.argv[1]).read().split(" = ",1)[1].strip().removesuffix(";")); assert len(d["history"])>=36 and d["history_backfill"]["first_release_pit_verified"] is False; print("RBNZ_36_MONTHS_VERIFIED",len(d["history"]))' "$RUNNER_TEMP/nzd.js"

  refresh:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
    concurrency:
      group: next-rbnz-liquidity-refresh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 -m pip install openpyxl==3.1.5
      - name: Refresh official D10, C50 and C60 data
        env:
          TARGET: site/fx-quant-v2/next/nzd-rbnz-liquidity-research-v1.js
        run: |
          set -euo pipefail
          python3 validation/publishing/collect_next_rbnz_liquidity.py "$TARGET" | tee -a "$GITHUB_STEP_SUMMARY"
          git add -- "$TARGET"
          if git diff --cached --quiet; then
            echo "Already current" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Refresh official NZD D10/C50/C60 research'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
