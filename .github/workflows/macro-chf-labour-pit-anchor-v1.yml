name: Macro CHF Labour PIT Anchor V1

on:
  push:
    branches:
      - 'validation-macro-chf-labour-pit-anchor-*'
    paths:
      - '.github/workflows/macro-chf-labour-pit-anchor-v1.yml'
      - '.github/workflows/macro-single-series-pit-refresh-v1.yml'
      - 'validation/sources/chf_snb_official_core.py'
      - 'validation/build_macro_candidate.py'
      - 'validation/macro_pit_anchor_contract.py'
      - 'validation/update_live_direct_section.py'
      - 'validation/build_live_manifest_v2.py'
      - 'validation/check_live_update_contract.py'
      - 'validation/rebuild_live_data_runtime.py'
      - 'live_data/sections/MACRO_SERIES.json'
      - 'live_data/sections/MACRO_THERMOMETER_DATA.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macro-chf-labour-pit-anchor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_json: ${{ steps.candidate.outputs.candidate_json }}
      macro_series_id: ${{ steps.candidate.outputs.macro_series_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build live CHF labour candidate from official SNB source
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/chf-labour-pit
          python3 validation/sources/chf_snb_official_core.py \
            --dimension labour \
            --output /tmp/chf-labour-pit/candidate.json \
            --audit-output /tmp/chf-labour-pit/source-audit.json \
            | tee /tmp/chf-labour-pit/source-run.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          candidate = json.loads(Path('/tmp/chf-labour-pit/candidate.json').read_text())
          audit = json.loads(Path('/tmp/chf-labour-pit/source-audit.json').read_text())

          expected = {
              'currency': 'CHF',
              'dimension': 'labour',
              'source': 'Swiss National Bank',
              'series_id': 'QIXJ1A',
              'frequency': 'M',
              'transformation': 'level',
          }
          got = {key: candidate.get(key) for key in expected}
          if got != expected:
              raise SystemExit(f'CHF labour source contract mismatch: expected={expected} got={got}')
          if candidate.get('unit') != '%':
              raise SystemExit(f"CHF labour unit mismatch: {candidate.get('unit')!r}")
          if not candidate.get('macro_series_id'):
              raise SystemExit('CHF labour candidate did not resolve a canonical MACRO_SERIES id')
          if audit.get('mode') != 'live':
              raise SystemExit(f'expected live SNB mode, got {audit.get("mode")!r}')
          if audit.get('candidate_only') is not True or audit.get('live_data_written') is not False:
              raise SystemExit(f'SNB adapter violated candidate-only contract: {audit}')

          series = json.loads(Path('live_data/sections/MACRO_SERIES.json').read_text())
          rows = [row for row in series['CHF'] if isinstance(row, dict) and str(row.get('id')) == candidate['macro_series_id']]
          if len(rows) != 1:
              raise SystemExit(f"resolved macro_series_id is not unique in CHF runtime: {candidate['macro_series_id']}")
          row = rows[0]
          dates = row.get('dates')
          if not isinstance(dates, list) or not dates:
              raise SystemExit('CHF labour canonical series has no date history')

          current_date = str(dates[-1])
          candidate_date = str(candidate['observation_date'])
          current_month = current_date[:7]
          candidate_month = candidate_date[:7]
          if len(current_month) != 7 or len(candidate_month) != 7:
              raise SystemExit(f'invalid monthly date comparison: current={current_date!r} candidate={candidate_date!r}')
          if candidate_month <= current_month:
              raise SystemExit(
                  'NO_NEW_ECONOMIC_OBSERVATION: '
                  f'CHF labour candidate month {candidate_month} is not newer than runtime {current_month}'
              )

          print(json.dumps({
              'status': 'CHF_LABOUR_NEW_ECONOMIC_OBSERVATION_PASS',
              'macro_series_id': candidate['macro_series_id'],
              'runtime_observation_date': current_date,
              'candidate_observation_date': candidate_date,
              'runtime_month': current_month,
              'candidate_month': candidate_month,
              'candidate_value': candidate['value'],
              'source': candidate['source'],
              'series_id': candidate['series_id'],
          }, indent=2))
          PY

          python3 validation/build_macro_candidate.py \
            --candidate /tmp/chf-labour-pit/candidate.json \
            --output-dir /tmp/chf-labour-pit/built \
            | tee /tmp/chf-labour-pit/builder.json

          git diff --exit-code -- live_data payload validation/macro

          CANDIDATE_JSON="$(jq -c . /tmp/chf-labour-pit/candidate.json)"
          MACRO_SERIES_ID="$(jq -r .macro_series_id /tmp/chf-labour-pit/candidate.json)"
          echo "candidate_json=$CANDIDATE_JSON" >> "$GITHUB_OUTPUT"
          echo "macro_series_id=$MACRO_SERIES_ID" >> "$GITHUB_OUTPUT"

      - name: Upload source candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-chf-labour-source-${{ github.run_id }}
          path: /tmp/chf-labour-pit/
          if-no-files-found: error
          retention-days: 60

      - name: Enforce source stage is read-only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- live_data payload validation/macro

  pit-anchor:
    needs: source-candidate
    uses: ./.github/workflows/macro-single-series-pit-refresh-v1.yml
    with:
      refresh_scope: single_series
      currency: CHF
      dimension: labour
      macro_series_id: ${{ needs.source-candidate.outputs.macro_series_id }}
      dry_run: false
      candidate_json: ${{ needs.source-candidate.outputs.candidate_json }}
