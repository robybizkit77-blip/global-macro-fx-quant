name: G4USD Dovish Divergence Forward Shadow V1

on:
  push:
    branches:
      - validation-g4usd-dovish-divergence-forward-shadow-v1-2026-10-11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen forward contract and ledger
        run: |
          mkdir -p /tmp/forward-shadow
          python validation/g4usd_dovish_divergence_forward_shadow_v1.py \
            --contract validation/G4USD_DOVISH_DIVERGENCE_FORWARD_SHADOW_CONTRACT_V1_2026-10-11.json \
            --ledger validation/G4USD_DOVISH_DIVERGENCE_FORWARD_SHADOW_LEDGER_V1.json \
            --output /tmp/forward-shadow/receipt.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/forward-shadow/receipt.json'))
          assert r['status']=='WAITING_FOR_UNSEEN_OBSERVATIONS'
          assert r['signals_total']==0
          assert r['matured_3m']==0
          assert r['forward_edge_confirmed'] is False
          assert r['production_signal_authorized'] is False
          assert r['sizing_authorized'] is False
          assert r['no_rescue_tuning'] is True
          print('FORWARD_SHADOW_INITIAL_FREEZE_PASS')
          PY
      - name: Upload forward shadow receipt
        uses: actions/upload-artifact@v4
        with:
          name: g4usd-dovish-divergence-forward-shadow-v1-${{ github.run_id }}
          path: |
            /tmp/forward-shadow/receipt.json
            validation/G4USD_DOVISH_DIVERGENCE_FORWARD_SHADOW_CONTRACT_V1_2026-10-11.json
            validation/G4USD_DOVISH_DIVERGENCE_FORWARD_SHADOW_LEDGER_V1.json
          if-no-files-found: error
          retention-days: 90
