name: USD CME Settlement Probe

on:
  push:
    branches:
      - staging-usd-cme-settlement-probe-2026-09-30
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect CME settlement page source and APIs
        run: |
          pip install requests beautifulsoup4
          python - <<'PY'
          import requests,re,json
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0'})
          urls={
            'ZQ':'https://www.cmegroup.com/markets/interest-rates/stirs/30-day-federal-fund.settlements.html',
            'SR3':'https://www.cmegroup.com/markets/interest-rates/stirs/three-month-sofr.settlements.html'
          }
          for k,u in urls.items():
              r=s.get(u,timeout=120)
              print('PAGE',k,r.status_code,len(r.text),r.url)
              txt=r.text
              for pat in ['productId','product-id','Settlements/Futures/Settlements','CmeWS','globex','clearingCode','quoteCode','SR3','ZQ']:
                  poss=[m.start() for m in re.finditer(re.escape(pat),txt,re.I)]
                  print('PAT',k,pat,'COUNT',len(poss))
                  for p in poss[:20]:
                      print('CTX',k,pat,txt[max(0,p-1800):p+5000])
              scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',txt,re.I)
              print('SCRIPTS',k,json.dumps(scripts[-80:]))
          # Probe likely legacy CME settlement endpoints/product ids.
          ids=['305','41','8462','8463','8464','8563','11764','11765']
          for pid in ids:
              for d in ['09/29/2026','09/28/2026','09/22/2026']:
                  u=f'https://www.cmegroup.com/CmeWS/mvc/Settlements/Futures/Settlements/{pid}/FUT'
                  try:
                      rr=s.get(u,params={'strategy':'DEFAULT','tradeDate':d,'pageSize':'500','isProtected':'false'},timeout=60)
                      if rr.status_code==200 and len(rr.text)>100:
                          print('API',pid,d,rr.status_code,rr.url,rr.text[:30000])
                      else:
                          print('API_STATUS',pid,d,rr.status_code,len(rr.text))
                  except Exception as e:
                      print('API_ERR',pid,d,repr(e))
          PY
