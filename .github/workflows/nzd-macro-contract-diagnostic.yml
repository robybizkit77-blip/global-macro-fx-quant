name: NZD Macro Contract Diagnostic

on:
  push:
    branches:
      - validation-nzd-statsnz-v1-2026-10-06
    paths:
      - 'validation/diagnose_nzd_macro_contract.py'
      - '.github/workflows/nzd-macro-contract-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print frozen NZD contract
        run: python validation/diagnose_nzd_macro_contract.py
      - name: Inspect official Stats NZ June 2026 labour ZIP
        run: |
          python - <<'PY'
          import io, urllib.request, zipfile
          url='https://www.stats.govt.nz/assets/Uploads/Labour-market-statistics/Labour-market-statistics-June-2026-quarter/Download-data/labour-market-statistics-june-2026-quarter.zip'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; global-macro-fx-quant/1.0)'})
          with urllib.request.urlopen(req,timeout=45) as r:
              raw=r.read()
              print('ZIP',r.status,r.headers.get('Content-Type'),len(raw))
          z=zipfile.ZipFile(io.BytesIO(raw))
          print('FILES',len(z.namelist()))
          for name in z.namelist(): print('FILE',name)
          needle='HLFQ.S1F3S'
          matches=[]
          for name in z.namelist():
              if name.endswith('/'):
                  continue
              data=z.read(name)
              for enc in ('utf-8-sig','utf-8','cp1252','latin1'):
                  try:
                      txt=data.decode(enc);break
                  except UnicodeDecodeError: txt=None
              if txt and needle in txt:
                  lines=[line for line in txt.splitlines() if needle in line]
                  matches.append((name,lines[:10]))
          print('SERIES_MATCHES',len(matches))
          for name,lines in matches:
              print('MATCH_FILE',name)
              for line in lines: print('MATCH_LINE',line[:1500])
          if not matches:
              raise SystemExit('HLFQ.S1F3S not found in official ZIP')
          PY