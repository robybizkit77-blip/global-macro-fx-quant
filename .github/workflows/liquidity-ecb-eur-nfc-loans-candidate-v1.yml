name: Liquidity ECB EUR NFC Loans Candidate V1

on:
  push:
    branches:
      - release-candidate-daily-data-orchestrator-v1-2026-10-12
    paths:
      - '.github/workflows/liquidity-ecb-eur-nfc-loans-candidate-v1.yml'
      - 'validation/fetch_ecb_eur_nfc_loans_candidate.py'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official ECB EUR NFC loans candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/fetch_ecb_eur_nfc_loans_candidate.py | tee /tmp/eur-nfc-loans.log
          python3 - <<'PY'
          import json
          c=json.load(open('validation/liquidity-eur-nfc-loans-candidate.json'))
          assert c['schema']=='GMFQ_LIQUIDITY_EUR_NFC_LOANS_CANDIDATE_V1', c
          assert c['source']['series_id']=='BSI.M.U2.Y.U.A20.A.1.U2.2240.Z01.E', c
          assert c['runtime_match_confirmed'] is True, c
          assert c['status']=='GREEN_SOURCE_CANDIDATE_ONLY', c
          assert c['publication_performed'] is False
          assert c['runtime_mutated'] is False
          print('LIQUIDITY_ECB_EUR_NFC_LOANS_PASS', c['runtime']['last_date'], '->', c['latest_date'], c['latest_value'])
          PY
      - name: Ensure no tracked runtime mutation
        shell: bash
        run: |
          rm -f validation/liquidity-eur-nfc-loans-candidate.json
          git diff --exit-code -- live_data payload
