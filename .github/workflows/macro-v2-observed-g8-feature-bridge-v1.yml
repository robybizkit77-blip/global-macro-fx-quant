      - 'validation/macro/fixtures/EUR_HICP_FLASH_STRICT_FIRST_RELEASE_2018_2026_09.csv.xz.b64'
      - 'validation/macro/fixtures/AUD_CPI_Q_YOY_STRICT_FIRST_RELEASE_2018_2026Q2.csv.xz.b64'
      - 'validation/macro/MACRO_V2_EUR_AUD_ARCHIVAL_139_FIRST_RELEASES_2026-10-27.md'
      - 'validation/macro/test_v2_g8_source_semantic_reconciliation_v1.py'
      - 'validation/macro/MACRO_V2_4_G8_SOURCE_SEMANTIC_RECONCILIATION_2026-10-27.md'
      - 'validation/macro/aud_inflation_strict_pit_evidence_v1_2026-10-09.json'
      - 'validation/macro/eur_inflation_strict_pit_evidence_v1_2026-10-10.json'
