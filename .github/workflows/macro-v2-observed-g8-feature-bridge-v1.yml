  push:
    branches: [main]
    paths:
      - '.github/workflows/macro-v2-observed-g8-feature-bridge-v1.yml'
      - 'validation/macro/v2_g8_observed_feature_bridge_v1.py'
      - 'validation/macro/v2_g8_three_axis_economic_shadow_v1.py'
      - 'validation/macro/v2_g8_sensitivity_release_clock_v1.py'
      - 'validation/macro/v2_g8_labour_inflation_web_asof_timeline_v1.py'
      - 'validation/macro/v2_g8_source_semantic_reconciliation_v1.py'
      - 'validation/macro/v2_eur_aud_archival_first_web_overlay_v1.py'
      - 'validation/macro/v2_eur_ea_regime_chf_precision_guard_v1.py'
