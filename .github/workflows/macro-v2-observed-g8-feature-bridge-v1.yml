name: Macro V2 Observed G8 Feature Bridge (research only)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/macro-v2-observed-g8-feature-bridge-v1.yml'
      - 'validation/macro/v2_g8_observed_feature_bridge_v1.py'
      - 'validation/macro/v2_g8_three_axis_economic_shadow_v1.py'
      - 'validation/macro/v2_g8_sensitivity_release_clock_v1.py'
      - 'validation/macro/v2_g8_labour_inflation_web_asof_timeline_v1.py'
      - 'validation/macro/test_v2_g8_labour_inflation_web_asof_timeline_v1.py'
      - 'validation/macro/MACRO_V2_G8_INFLATION_LABOUR_SOURCE_ASOF_LEDGER_2026-10-27.md'
      - 'validation/macro/v2_pit_g8_evidence_adapters_v1.py'
      - 'validation/macro/v2_pit_g8_latest_web_adapters_v1.py'
      - 'validation/macro/v2_pit_g8_remaining_core_adapters_v1.py'
      - 'validation/macro/test_v2_g8_sensitivity_release_clock_v1.py'
      - 'validation/macro/MACRO_V2_SENSITIVITY_GDP_CLOCK_REVIEW_2026-10-27.md'
      - 'validation/macro/test_v2_g8_three_axis_economic_shadow_v1.py'
      - 'validation/macro/MACRO_V2_THREE_AXIS_RESEARCH_CONTRACT_2026-10-27.md'
      - 'validation/macro/v2_g8_gdp_first_web_growth_features_v1.py'
      - 'validation/macro/test_v2_g8_gdp_first_web_growth_features_v1.py'
      - 'validation/macro/v2_g8_gdp_unified_web_research_v1.py'
      - 'validation/macro/v2_g8_gdp_multiquarter_pit_guard_v1.py'
      - 'validation/macro/fixtures/v2_g8_gdp_*'
      - 'validation/macro/fixtures/v2_g8_quarterly_gdp_q2_2026_web_release_ledger_v1.json'
      - 'validation/macro/v2_us_shutdown_gap_research_v1.py'
      - 'validation/macro/test_v2_g8_observed_feature_bridge_v1.py'
      - 'validation/macro/v2_g8_quarterly_gdp_web_release_ledger_v1.py'
      - 'validation/macro/fixtures/v2_g8_quarterly_gdp_q2_2026_web_release_ledger_v1.json'
      - 'validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json'
      - 'live_data/sections/MACRO_SERIES.json'
      - 'live_data/sections/MACRO_THERMOMETER_DATA.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/macro-v2-observed-g8-feature-bridge-v1.yml'
      - 'validation/macro/v2_g8_observed_feature_bridge_v1.py'
      - 'validation/macro/v2_g8_three_axis_economic_shadow_v1.py'
      - 'validation/macro/v2_g8_sensitivity_release_clock_v1.py'
      - 'validation/macro/v2_g8_labour_inflation_web_asof_timeline_v1.py'
      - 'validation/macro/test_v2_g8_labour_inflation_web_asof_timeline_v1.py'
      - 'validation/macro/MACRO_V2_G8_INFLATION_LABOUR_SOURCE_ASOF_LEDGER_2026-10-27.md'
      - 'validation/macro/v2_pit_g8_evidence_adapters_v1.py'
      - 'validation/macro/v2_pit_g8_latest_web_adapters_v1.py'
      - 'validation/macro/v2_pit_g8_remaining_core_adapters_v1.py'
      - 'validation/macro/test_v2_g8_sensitivity_release_clock_v1.py'
      - 'validation/macro/MACRO_V2_SENSITIVITY_GDP_CLOCK_REVIEW_2026-10-27.md'
      - 'validation/macro/test_v2_g8_three_axis_economic_shadow_v1.py'
      - 'validation/macro/MACRO_V2_THREE_AXIS_RESEARCH_CONTRACT_2026-10-27.md'
      - 'validation/macro/v2_g8_gdp_first_web_growth_features_v1.py'
      - 'validation/macro/test_v2_g8_gdp_first_web_growth_features_v1.py'
      - 'validation/macro/v2_g8_gdp_unified_web_research_v1.py'
      - 'validation/macro/v2_g8_gdp_multiquarter_pit_guard_v1.py'
      - 'validation/macro/fixtures/v2_g8_gdp_*'
      - 'validation/macro/fixtures/v2_g8_quarterly_gdp_q2_2026_web_release_ledger_v1.json'
      - 'validation/macro/v2_us_shutdown_gap_research_v1.py'
      - 'validation/macro/test_v2_g8_observed_feature_bridge_v1.py'
      - 'validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json'
      - 'live_data/sections/MACRO_SERIES.json'
      - 'live_data/sections/MACRO_THERMOMETER_DATA.json'
  workflow_run:
    workflows: ['Macro Persistent Daily V1']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-observed-feature-bridge:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test G8 feature transformation and no-score isolation
        run: python -m unittest validation.macro.test_v2_g8_observed_feature_bridge_v1 -v
      - name: Test original-web GDP 12-quarter prior-only Growth normalisation
        run: python -m unittest validation.macro.test_v2_g8_gdp_first_web_growth_features_v1 -v
      - name: Test G8 macro shadow 3-axis semantics and quality gates
        run: python -m unittest validation.macro.test_v2_g8_three_axis_economic_shadow_v1 -v
      - name: Test G8 weight perturbations and 64 GDP research publication clocks
        run: python -m unittest validation.macro.test_v2_g8_sensitivity_release_clock_v1 -v
      - name: Test 16 inflation labour official issuer release chronology
        run: python -m unittest validation.macro.test_v2_g8_labour_inflation_web_asof_timeline_v1 -v
      - name: Build read-only current observational feature receipt
        run: |
          python -m validation.macro.v2_g8_observed_feature_bridge_v1 \
            --output /tmp/macro-v2-observed-g8-feature-bridge.json
          python - <<'PY'
          import json, os
          x=json.load(open('/tmp/macro-v2-observed-g8-feature-bridge.json'))
          assert x['summary']['economic_dimension_slots']==24
          assert x['summary']['registered_inflation_labour_slots']==16
          assert x['summary']['growth_scores_computed']==0
          assert x['summary']['fx_strength_scores_computed']==0
          assert x['summary']['gdp_descriptive_research_growth_features']==8
          assert x['summary']['gdp_features_with_definition_caveats']==2
          assert x['gdp_initial_web_features_not_model_growth_scores'] is True
          assert all(t['safe_to_promote_growth_score'] is False for t in
                     x['growth_quarterly_gdp_initial_web_research_features'].values())
          assert x['summary']['descriptive_inputs_strict_plus_separate_estimates'] <= 16
          assert x['optional_us_gap_estimates_not_replacements_for_strict_z'] is True
          assert all(z['allow_macro_score'] is False and z['allow_pair_ranking'] is False
                     for z in x['us_bls_shutdown_research_estimates'].values())
          assert x['safe_to_publish_new_D'] is False
          assert x['safe_to_update_pair_theses'] is False
          assert x['safe_to_use_for_beta'] is False
          assert x['safe_to_use_for_forward'] is False
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Macro V2 — observed G8 research features, NOT Core D\n')
              out.write('- Registered inflation/labour source slots: **16/16**\n')
              out.write('- Descriptive research z values: **%s/16** (revised history, NOT PIT)\n' %
                        x['summary']['descriptive_research_z_available'])
              out.write('- Excluded/insufficient research z: **%s/16**\n' %
                        x['summary']['descriptive_research_z_unavailable'])
              out.write('- Additional BLS October-2025 shutdown gap-aware RESEARCH ESTIMATES: **%s/16** (separate; NOT strict z/PIT)\n' %
                        x['summary']['additional_us_gap_aware_estimates'])
              out.write('- This exception is limited to one documented 2025-10 US gap; no missing economic values are filled.\n')
              out.write('- GDP Q2 2026 official-web descriptions visible: **%s/8**\n' %
                        x['summary']['growth_web_observations_visible'])
              out.write('- GDP quantitative descriptive 12-quarter Growth features: **%s/8** (initial web statements, NOT PIT)\n' %
                        x['summary']['gdp_descriptive_research_growth_features'])
              out.write('- GDP definitions caveated (EA population/CHF sports): **%s/8**; not admitted to FX scores or comparisons.\n' %
                        x['summary']['gdp_features_with_definition_caveats'])
              out.write('- New Growth scores: **0**; FX strength and pair thesis updates: **0**\n')
              for key, val in x['inflation_labour'].items():
                  if val['research_robust_z'] is None:
                      out.write('- %s: **%s**; absent prior periods: %s\n' %
                                (key, val['status'], ', '.join(val['missing_prior_periods'])))
              out.write('- This job PASS means **research bridge computation**, not D.json calibration or first-release vintage certification.\n')
          PY
      - name: Compute research-only three-axis G8 scenario receipt
        run: |
          python -m validation.macro.v2_g8_three_axis_economic_shadow_v1 \
            --output /tmp/macro-v2-three-axis-g8-research.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/macro-v2-three-axis-g8-research.json'))
          assert d['summary']['economies']==8
          assert d['summary']['research_axes']==24
          assert d['summary']['research_activity_balances_calculated']==8
          assert d['summary']['countries_with_estimated_source_axes']==1
          assert d['summary']['countries_with_GDP_measurement_caveats']==2
          assert d['summary']['macro_model_scores_approved']==0
          assert d['summary']['FX_scores_approved']==0
          assert d['summary']['pair_rankings_recalculated']==0
          assert d['safe_to_publish_new_D'] is False
          assert d['safe_to_update_pair_theses'] is False
          assert d['safe_for_beta'] is False and d['safe_for_forward'] is False
          assert all(x['fx_currency_strength_score'] is None and
                     x['fx_directional_bias'] is None and
                     x['economic_cycle_certified'] is None
                     for x in d['countries'].values())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as w:
              w.write('\n### Macro V2 — candidate three-axis economics (NOT FX scores)\n')
              w.write('- Shadow economies: **8/8**, axes: **24/24** (growth, labour tightness, price pressure).\n')
              w.write('- USD: two **estimated** source axes; EUR/CHF: GDP definition caveats.\n')
              w.write('- Activity combines only growth and labour 50/50 (hypothesis). Inflation stands alone.\n')
              w.write('- Economic regime/model approval: **0**. No core scores, FX ranks, Beta or Forward.\n')
          PY
      - name: Test sensitivity and GDP cutoff replay (NO score approval)
        run: |
          python -m validation.macro.v2_g8_sensitivity_release_clock_v1 \
            --output /tmp/macro-v2-weight-stress-gdp-clock.json
          python - <<'PY'
          import json, os
          r=json.load(open('/tmp/macro-v2-weight-stress-gdp-clock.json'))
          assert r['summary']['currencies']==8
          assert r['summary']['GDP_release_clock_cases']==64
          assert r['summary']['FX_out_of_sample_trials']==0
          assert r['summary']['certified_macro_scores']==0
          assert r['GDP_web_release_clock']['summary']['cutoff_guard_failures']==0
          assert r['macro_labour_inflation_historic_pit_replay_still_missing'] is True
          assert r['no_trading_edge_or_predictive_performance_demonstrated'] is True
          assert r['safe_to_publish_new_D'] is False
          assert r['safe_to_update_pair_theses'] is False
          assert r['safe_to_use_for_beta'] is False
          assert r['safe_to_use_for_forward'] is False
          assert all(row['pair_ranking_eligible'] is False for row in
                     r['weights_and_input_stress']['countries'].values())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('\n### G8 Macro V2 sensitivity / GDP research release-clock audit\n')
              out.write('- GDP first-web cutoff gates: **64/64** (8 economies × 8 quarters).\n')
              out.write('- Country activity bucket sensitivity to alternative weights: **%s/8** cases.\n' %
                        r['summary']['countries_where_bucket_changes_with_weights'])
              out.write('- Country activity bucket sensitivity to chosen ±0.25z shocks: **%s/8** cases.\n' %
                        r['summary']['countries_where_bucket_changes_with_input_shock'])
              out.write('- Original source-day bytes certified: **0**; actual FX out-of-sample tests: **0**.\n')
              out.write('- Passing this gate NEVER authorizes D.json, 28-pair ranking, Beta or Forward Test.\n')
          PY
      - name: Replay 16 issuer publication streams day-by-day (no PIT certification)
        run: |
          python -m validation.macro.v2_g8_labour_inflation_web_asof_timeline_v1 \
            --output /tmp/macro-v2-g8-inflation-labour-release-chronology.json
          python - <<'PY'
          import json, os
          r=json.load(open('/tmp/macro-v2-g8-inflation-labour-release-chronology.json'))
          m=r['summary']
          assert m['G8_currencies']==8
          assert m['inflation_labour_source_slots']==16
          assert m['slots_with_candidate_publisher_web_research']==16
          assert m['joint_PIT_training_histories_certified']==0
          assert m['FX_backtests_performed']==0
          assert m['live_macro_scores_created']==0
          assert r['later_revisions_never_retroactively_substituted_into_earlier_snapshots']
          assert r['safe_to_publish_new_D'] is False
          assert r['safe_to_change_28_pairs'] is False
          assert r['safe_for_beta'] is False
          assert r['safe_for_forward'] is False
          assert r['writes_live_data'] is False
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('\n### Macro V2 — observed issuer-web release chronology (NOT PIT certified)\n')
              out.write('- 16/16 G8 inflation/labour candidate source streams, %s actual publication gates checked.\n' %
                        m['independent_event_boundaries_checked'])
              out.write('- Canonical series/frequency matches: **%s/16**; mismatches: **%s/16**.\n' %
                        (m['series_frequency_exact_candidate_matches'],
                         m['candidate_source_mismatches_or_frequency_mismatches']))
              out.write('- Visible source first-web records on cutoff: **%s/16**.\n' %
                        m['slots_with_visible_first_web_on_end_date'])
              out.write('- Daily as-of snapshots: **%s**; missing releases are not filled.\n' %
                        r['window']['daily_snapshots'])
              out.write('- Model-ready histories: **0**; no new D, FX ranking, Beta or Forward.\n')
          PY
      - name: Retain dated shadow evidence (never publish to live_data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-v2-observed-research-${{ github.run_id }}
          path: |
            /tmp/macro-v2-observed-g8-feature-bridge.json
            /tmp/macro-v2-three-axis-g8-research.json
            /tmp/macro-v2-weight-stress-gdp-clock.json
            /tmp/macro-v2-g8-inflation-labour-release-chronology.json
          if-no-files-found: warn
          retention-days: 21
