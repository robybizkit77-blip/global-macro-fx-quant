name: CAD Turning Point Sensitivity
on:
  push:
    branches: [staging-usd-pit-readiness-2026-10-03]
    paths:
      - 'validation/audit_cad_turning_point_sensitivity.py'
      - '.github/workflows/cad-turning-point-sensitivity.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-usd-pit-readiness-2026-10-03
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python validation/audit_cad_turning_point_sensitivity.py
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/CAD_TURNING_POINT_SENSITIVITY_AUDIT_2026-10-03.json
          git diff --cached --quiet || git commit -m "Add CAD turning-point sensitivity audit result"
          git push
