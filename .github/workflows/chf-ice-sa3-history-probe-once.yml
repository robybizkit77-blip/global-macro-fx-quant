name: CHF ICE SA3 History Probe Once

on:
  push:
    branches:
      - validation-cb-pricing-chf-2026-10-08
    paths:
      - .github/workflows/chf-ice-sa3-history-probe-once.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation-cb-pricing-chf-2026-10-08
      - name: Extract embedded official ICE SA3 market payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ice validation/cb_pricing
          page='https://www.ice.com/products/72270612/Three-Month-Saron-Index-Futures-Contract/data?marketId=6097635'
          curl -fLsS --retry 2 -A 'Mozilla/5.0' "$page" -o /tmp/ice/page.html
          python3 - <<'PY'
          import pathlib,re,json,html
          txt=pathlib.Path('/tmp/ice/page.html').read_text(errors='replace')
          out={'page_bytes':len(txt.encode()),'tokens':{},'json_scripts':[],'possible_dates':sorted(set(re.findall(r'20\d{2}-\d{2}-\d{2}',txt)))}
          keys=['settlementMarket','finalSettlement','marketId','marketData','settlement','history','historical','price','openInterest','volume']
          for key in keys:
              arr=[]
              for m in re.finditer(re.escape(key),txt,re.I):
                  arr.append(html.unescape(txt[max(0,m.start()-350):m.start()+900]))
                  if len(arr)>=20: break
              out['tokens'][key]=arr
          for m in re.finditer(r'<script([^>]*)>(.*?)</script>',txt,re.I|re.S):
              attrs,body=m.group(1),m.group(2).strip()
              if not body: continue
              if any(k.lower() in body.lower() for k in ['6097635','settlementmarket','finalsettlement','marketid']):
                  out['json_scripts'].append({'attrs':attrs[:500],'body':html.unescape(body[:30000])})
                  if len(out['json_scripts'])>=10: break
          # collect relative paths that look like data services
          paths=[]
          for p in re.findall(r'["\'](/[^"\']{3,300})["\']',txt):
              pl=p.lower()
              if any(k in pl for k in ['market','price','settle','history','chart','product','data','api']): paths.append(html.unescape(p))
          out['candidate_paths']=list(dict.fromkeys(paths))[:200]
          pathlib.Path('validation/cb_pricing/CHF_ICE_SA3_EMBEDDED_PAYLOAD_PROBE_2026-10-08.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print('dates',out['possible_dates'][:30])
          print('candidate_paths',len(out['candidate_paths']))
          print('json_scripts',len(out['json_scripts']))
          for k,v in out['tokens'].items(): print(k,len(v))
          PY
      - name: Commit ICE embedded payload evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/cb_pricing/CHF_ICE_SA3_EMBEDDED_PAYLOAD_PROBE_2026-10-08.json
          git diff --cached --quiet && exit 0
          git commit -m 'Capture ICE SA3 embedded market payload evidence'
          git push origin HEAD:validation-cb-pricing-chf-2026-10-08
