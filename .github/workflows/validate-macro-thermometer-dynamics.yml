name: Validate Macro Thermometer Dynamics

on:
  push:
    branches: [staging-live-data-refresh-v1-2026-10-04]
    paths:
      - "validation/validate_macro_thermometer_dynamics.py"
      - ".github/workflows/validate-macro-thermometer-dynamics.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate existing dynamics labels
        run: python validation/validate_macro_thermometer_dynamics.py
      - name: Commit audit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/MACRO_THERMOMETER_DYNAMICS_VALIDATION_2026-10-04.json
          git commit -m "Validate macro thermometer dynamics" || exit 0
          git push
