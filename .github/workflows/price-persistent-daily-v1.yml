name: Price Persistent Daily V1

on:
  push:
    branches:
      - main
      - price-persistent-daily-v1-2026-10-14
    paths:
      - '.github/workflows/price-persistent-daily-v1.yml'
      - 'validation/price_schedule_gate_v1.py'
      - 'validation/test_price_schedule_gate_v1.py'
      - 'validation/refresh_live_manifest_v2.py'
      - 'live_data/manifest.v2.json'
  pull_request:
    paths:
      - '.github/workflows/price-persistent-daily-v1.yml'
      - 'validation/price_schedule_gate_v1.py'
      - 'validation/test_price_schedule_gate_v1.py'
      - 'validation/refresh_live_manifest_v2.py'
      - 'live_data/manifest.v2.json'
  workflow_run:
    # Independent existing ECB history producer can recover a missed/delayed
    # Price cron once its official history acquisition has completed.
    # No additional schedule and no publication from PR/failed parents.
    workflows: ['Price History Persistent Daily V1']
    types: [completed]
  workflow_dispatch:
  schedule:
    # Europe/Rome retries after the ECB reference-rate publication window.
    # Duplicate UTC entries cover CET/CEST; the local gate admits only 17:10, 17:40, 18:10.
    - cron: '10 15 * * 1-5'
    - cron: '10 16 * * 1-5'
    - cron: '40 15 * * 1-5'
    - cron: '40 16 * * 1-5'
    - cron: '10 17 * * 1-5'
    - cron: '10 18 * * 1-5'

permissions:
  contents: write

# Do not discard one pending price recovery if another scheduled retry arrives.
# PR validation does not occupy the production writer queue.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('price-validation-pr-{0}', github.event.pull_request.number) || 'price-persistent-daily-v1' }}
  queue: max
  cancel-in-progress: false

jobs:
  persist-price:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Test ECB Price Rome schedule gate (DST and late GitHub runners)
        run: python3 validation/test_price_schedule_gate_v1.py

      - name: Resolve Price UTC cron slot with Rome DST and delay-tolerant gate
        id: gate
        shell: bash
        env:
          PRICE_TRIGGER_EVENT: ${{ github.event_name }}
          PRICE_TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          python3 validation/price_schedule_gate_v1.py \
            --event "$PRICE_TRIGGER_EVENT" \
            --cron "$PRICE_TRIGGER_CRON" \
            --output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.should_run == 'true'
        with:
          python-version: '3.12'

      - name: Fetch and validate official ECB Price candidate
        id: candidate
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/price-persistent
          python validation/fetch_ecb_g8_price_candidate.py --out /tmp/price-persistent/candidate.json > /tmp/price-persistent/fetch.txt
          python - <<'PY'
          import json,re
          from datetime import date
          c=json.load(open('/tmp/price-persistent/candidate.json'))
          text=open('payload/part-15.txt',encoding='utf-8').read()
          m=re.findall(r'<script id="gmfq-price-ecb-(\d{8})">',text)
          assert len(m)==1,m
          current=f'{m[0][:4]}-{m[0][4:6]}-{m[0][6:8]}'
          assert c['schema']=='GMFQ_ECB_G8_PRICE_CANDIDATE_V1',c
          assert c['status']=='CANDIDATE_OFFICIAL',c
          assert c['base']=='EUR' and c['pair_count']==28,c
          assert set(c['rates'])=={'EUR','USD','GBP','JPY','CHF','CAD','AUD','NZD'},c
          assert float(c['rates']['EUR'])==1.0 and all(float(v)>0 for v in c['rates'].values()),c
          assert c['as_of']>=current,(c['as_of'],current)
          assert c['as_of']<=date.today().isoformat(),(c['as_of'],date.today().isoformat())
          print('PRICE_PERSISTENT_CANDIDATE_PASS',current,'->',c['as_of'])
          PY
          git diff --exit-code -- payload/part-15.txt live_data/manifest.v2.json

      - name: Apply candidate and classify Price result
        id: apply
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python validation/apply_ecb_g8_price_candidate.py --candidate /tmp/price-persistent/candidate.json --apply > /tmp/price-persistent/apply.json
          cat /tmp/price-persistent/apply.json
          STATUS="$(python -c "import json; print(json.load(open('/tmp/price-persistent/apply.json'))['status'])")"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          test "$STATUS" = 'NO_CHANGE' -o "$STATUS" = 'UPDATE_AVAILABLE'

      - name: Refresh and validate live manifest V2
        id: manifest
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python validation/refresh_live_manifest_v2.py --apply > /tmp/price-persistent/manifest-refresh.json
          cat /tmp/price-persistent/manifest-refresh.json
          STATUS="$(python -c "import json; print(json.load(open('/tmp/price-persistent/manifest-refresh.json'))['status'])")"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          test "$STATUS" = 'NO_CHANGE' -o "$STATUS" = 'UPDATE_AVAILABLE'
          python validation/check_live_update_contract.py > /tmp/price-persistent/live-contract.json
          cat /tmp/price-persistent/live-contract.json

      - name: Validate combined scope and idempotence
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={'payload/part-15.txt','live_data/manifest.v2.json'}
          unexpected=changed-allowed
          assert not unexpected, f'unexpected Price persistence scope: {sorted(unexpected)}'
          print('PRICE_MANIFEST_SCOPE_PASS',sorted(changed))
          PY
          python validation/apply_ecb_g8_price_candidate.py --candidate /tmp/price-persistent/candidate.json --apply > /tmp/price-persistent/apply-second.json
          python validation/refresh_live_manifest_v2.py --apply > /tmp/price-persistent/manifest-second.json
          python validation/check_live_update_contract.py > /tmp/price-persistent/live-contract-second.json
          python - <<'PY'
          import json,re
          c=json.load(open('/tmp/price-persistent/candidate.json'))
          p=json.load(open('/tmp/price-persistent/apply-second.json'))
          m=json.load(open('/tmp/price-persistent/manifest-second.json'))
          assert p['status']=='NO_CHANGE' and p['applied'] is False,p
          assert m['status']=='NO_CHANGE' and m['applied'] is False,m
          text=open('payload/part-15.txt',encoding='utf-8').read()
          compact=c['as_of'].replace('-','')
          assert len(re.findall(r'<script id="gmfq-price-ecb-\d{8}">',text))==1
          assert f'<script id="gmfq-price-ecb-{compact}">' in text
          print('PRICE_MANIFEST_IDEMPOTENCE_PASS')
          PY

      - name: Validation branch leaves persistent files unchanged
        if: steps.gate.outputs.should_run == 'true' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- payload/part-15.txt live_data/manifest.v2.json
          git diff --exit-code -- payload/part-15.txt live_data/manifest.v2.json
          echo PRICE_MANIFEST_VALIDATION_ONLY_PASS

      - name: Commit validated Price and manifest update to main with remote-head lease
        if: >-
          steps.gate.outputs.should_run == 'true' && github.ref == 'refs/heads/main' &&
          (steps.apply.outputs.status == 'UPDATE_AVAILABLE' || steps.manifest.outputs.status == 'UPDATE_AVAILABLE')
        shell: bash
        env:
          TARGET_BRANCH: main
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$REMOTE_SHA" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add payload/part-15.txt live_data/manifest.v2.json
          git diff --cached --quiet && { echo 'No Price/manifest changes to persist'; exit 0; }
          git commit -m 'Refresh daily FX Price runtime and live manifest'
          REMOTE_SHA_2="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$REMOTE_SHA_2" = "$GITHUB_SHA"
          git push origin "HEAD:$TARGET_BRANCH"
          echo PRICE_MANIFEST_MAIN_UPDATE_PUSHED

      - name: Upload Price evidence
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: price-persistent-daily-${{ github.run_id }}
          path: /tmp/price-persistent/
          if-no-files-found: warn
          retention-days: 30
