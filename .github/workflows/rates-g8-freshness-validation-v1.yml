name: Rates G8 Freshness Validation V1
on:
  push:
    branches:
      - fix-rates-g8-freshness-nzd-live-2026-10-07
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: pip install openpyxl
      - name: Run unified Rates audit V2
        run: |
          set -euo pipefail
          python validation/run_rates_audit.py | tee /tmp/rates-audit.json
      - name: Assert NZD official fallback and AUD CHF explicit freshness states
        run: |
          python - <<'PY'
          import json
          a=json.load(open('/tmp/rates-audit.json'))
          assert a['status']=='PASS', a
          n=a['currencies']['NZD']
          assert n['coverage_mode'] in {'LIVE_FETCH','MANUAL_OFFICIAL_VERIFICATION'}, n
          assert n['official']['date']=='2026-10-05', n
          assert abs(float(n['official']['2Y'])-3.83)<1e-9, n
          assert abs(float(n['official']['10Y'])-5.04)<1e-9, n
          assert n['state']=='UPDATE_AVAILABLE', n
          if n['coverage_mode']=='MANUAL_OFFICIAL_VERIFICATION':
              assert 'rbnz.govt.nz' in str(n.get('source_url') or ''), n
          au=a['currencies']['AUD']
          assert au['coverage_mode']=='OFFICIAL_CADENCE_ASSERTION', au
          assert au['state']=='NO_CHANGE', au
          ch=a['currencies']['CHF']
          assert ch['state']=='WITHHOLD', ch
          assert ch['coverage_mode']=='SOURCE_EXPORT_BLOCKED', ch
          print({'NZD':n,'AUD':au,'CHF':ch})
          PY
      - name: Build candidate
        run: |
          set -euo pipefail
          python validation/build_rates_candidate_from_audit.py --audit /tmp/rates-audit.json --output /tmp/NATIVE_RATES_DATA.json | tee /tmp/candidate-summary.json
          python - <<'PY'
          import json
          s=json.load(open('/tmp/candidate-summary.json'))
          assert s['status']=='CANDIDATE_READY', s
          assert 'NZD' in s['changed_currencies'], s
          n=s['currencies']['NZD']
          assert n['new_date']=='2026-10-05', n
          assert abs(float(n['2Y'])-3.83)<1e-9 and abs(float(n['10Y'])-5.04)<1e-9, n
          print(s)
          PY
      - name: Build audit-derived metadata against candidate
        run: |
          cp live_data/sections/NATIVE_RATES_DATA.json /tmp/original-rates.json
          cp /tmp/NATIVE_RATES_DATA.json live_data/sections/NATIVE_RATES_DATA.json
          python validation/build_rates_audit_metadata.py --audit-date 2026-10-07 --audit /tmp/rates-audit.json --output /tmp/RATES_AUDIT_METADATA.json | tee /tmp/metadata-summary.json
          python - <<'PY'
          import json
          m=json.load(open('/tmp/RATES_AUDIT_METADATA.json'))
          assert m['rates']['NZD']['status'] in {'CURRENT_OFFICIAL_SAME_BASIS','CURRENT_OFFICIAL_SAME_BASIS_MANUAL_VERIFIED'}, m['rates']['NZD']
          assert m['rates']['NZD']['action']=='UPDATED', m['rates']['NZD']
          assert m['rates']['CHF']['status']=='WITHHELD_SOURCE_BLOCKED', m['rates']['CHF']
          assert m['rates']['CHF']['action']=='WITHHOLD', m['rates']['CHF']
          assert m['rates']['AUD']['status']=='CURRENT_BY_SOURCE_CADENCE', m['rates']['AUD']
          assert m['expected_rates']['NZD']=='2026-10-05', m['expected_rates']
          print(m['rates'])
          PY
          mv /tmp/original-rates.json live_data/sections/NATIVE_RATES_DATA.json
      - uses: actions/upload-artifact@v4
        with:
          name: rates-g8-freshness-validation-v1
          path: |
            /tmp/rates-audit.json
            /tmp/candidate-summary.json
            /tmp/NATIVE_RATES_DATA.json
            /tmp/RATES_AUDIT_METADATA.json
          if-no-files-found: error
