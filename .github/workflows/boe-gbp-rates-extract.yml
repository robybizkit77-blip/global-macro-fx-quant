name: BoE GBP Rates Extract

on:
  push:
    branches: [staging-live-data-refresh-v1-2026-10-04]
    paths:
      - ".github/workflows/boe-gbp-rates-extract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install openpyxl
        run: pip install openpyxl
      - name: Extract BoE nominal spot 2Y and 10Y
        run: |
          python - <<'PY'
          import io,json,pathlib,urllib.request,zipfile,openpyxl,datetime
          url='https://www.bankofengland.co.uk/-/media/boe/files/statistics/yield-curves/latest-yield-curve-data.zip'
          raw=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 GMFQ/1.0'}),timeout=60).read()
          z=zipfile.ZipFile(io.BytesIO(raw))
          name='GLC Nominal daily data current month.xlsx'
          wb=openpyxl.load_workbook(io.BytesIO(z.read(name)),data_only=True,read_only=True)
          out={'schema':'GMFQ_BOE_GBP_RATES_EXTRACT_V1','zip_url':url,'workbook':name,'sheets':wb.sheetnames,'sheet_previews':{}}
          for ws in wb.worksheets:
            rows=[]
            for i,row in enumerate(ws.iter_rows(values_only=True)):
              rows.append(list(row))
              if i>=14: break
            out['sheet_previews'][ws.title]=rows
          pathlib.Path('validation/BOE_GBP_RATES_STRUCTURE_2026-10-04.json').write_text(json.dumps(out,default=str,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'sheets':wb.sheetnames},indent=2))
          PY
      - name: Commit structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/BOE_GBP_RATES_STRUCTURE_2026-10-04.json
          git commit -m "Inspect BoE nominal curve workbook structure" || exit 0
          git push
