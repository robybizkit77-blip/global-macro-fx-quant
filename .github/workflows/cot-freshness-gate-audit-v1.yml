name: COT Freshness Gate Audit V1

on:
  push:
    branches:
      - 'validation-cot-freshness-gate-v1-2026-10-12'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8145 --bind 127.0.0.1 > /tmp/gmfq-cot-gate-server.log 2>&1 &
          sleep 2
      - name: Validate COT freshness gate
        run: |
          cat > cot-gate-audit.js <<'EOF'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.stack||e)));
            page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
            const r=await page.goto('http://127.0.0.1:8145/index.html',{waitUntil:'domcontentloaded',timeout:120000});
            if(!r||!r.ok()) throw new Error('HTTP load failed');
            await page.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.settled_after_cad_chain===true||window.__GMFQ_BOOTSTRAP_ERROR,null,{timeout:120000});
            await page.waitForFunction(()=>{
              const p=window.__GMFQ_PRICE_FRESHNESS_GATE_STATE?.status;
              const c=window.__GMFQ_COT_FRESHNESS_GATE_STATE?.status;
              return ((p&&p!=='WAITING_FOR_PRICE_PROVENANCE')&&(c&&c!=='WAITING_FOR_COT_PROVENANCE'))||window.__GMFQ_BOOTSTRAP_ERROR;
            },null,{timeout:120000});
            const out=await page.evaluate(()=>{
              const clone=x=>{try{return JSON.parse(JSON.stringify(x))}catch{return null}};
              const ccys=['USD','EUR','GBP','JPY','CHF','AUD','NZD','CAD'];
              const pairs=[];for(let i=0;i<ccys.length;i++)for(let j=i+1;j<ccys.length;j++)pairs.push(`${ccys[i]}/${ccys[j]}`);
              const gate=clone(window.__GMFQ_COT_FRESHNESS_GATE_STATE);
              const guardedCurrency=window.deriveCurrencyState;
              const originalCurrency=guardedCurrency?.__gmfqOriginal;
              const currencies=Object.fromEntries(ccys.map(c=>[c,clone(guardedCurrency(c))]));
              const currenciesBefore=typeof originalCurrency==='function'?Object.fromEntries(ccys.map(c=>[c,clone(originalCurrency(c))])):{};
              const pairsNow=Object.fromEntries(pairs.map(p=>[p,clone(window.derivePairDecisionFrame(p))]));
              const currencyFailures=Object.entries(currencies).filter(([c,s])=>String(s?.cotRisk||'').trim()!==''||s?.cotFreshness?.status!=='WITHHELD_STALE').map(([c,s])=>({c,s}));
              const currencyCoreDiffs=[];
              for(const c of ccys){
                const a=currenciesBefore[c]||{},b=currencies[c]||{};
                const before={base:a.base,macro:a.macro,policy:a.policy,policyContext:a.policyContext,price:a.price,confirmation:a.confirmation,liq:a.liq,driver:a.driver};
                const after={base:b.base,macro:b.macro,policy:b.policy,policyContext:b.policyContext,price:b.price,confirmation:b.confirmation,liq:b.liq,driver:b.driver};
                if(JSON.stringify(before)!==JSON.stringify(after))currencyCoreDiffs.push({c,before,after});
              }
              const rawCot=clone(window.D?.cot||{});
              const rawCotFingerprint=Object.fromEntries(ccys.map(c=>[c,{pct:rawCot?.[c]?.pct,net_oi:rawCot?.[c]?.net_oi,chg_net_1w:rawCot?.[c]?.chg_net_1w,state_label:rawCot?.[c]?.state_label}]));
              const expectedRaw={
                USD:{pct:78.846154,net_oi:22.3},EUR:{pct:8.653846,net_oi:-6.4},GBP:{pct:3.846154,net_oi:-33.7},JPY:{pct:64.423077,net_oi:19},CHF:{pct:84.615385,net_oi:-20},AUD:{pct:33.653846,net_oi:-15.3},NZD:{pct:76.923077,net_oi:-11.2},CAD:{pct:65.384615,net_oi:-17.1}
              };
              const rawCotDiffs=[];
              for(const c of ccys){const a=expectedRaw[c],b=rawCotFingerprint[c]||{};if(Math.abs(Number(a.pct)-Number(b.pct))>1e-6||Math.abs(Number(a.net_oi)-Number(b.net_oi))>1e-6)rawCotDiffs.push({c,expected:a,actual:b});}
              const pairStructuralFailures=Object.entries(pairsNow).filter(([p,f])=>!f||f.fav==null||f.quality==null||f.setup==null||f.structural==null).map(([p,f])=>({p,f}));
              const helpers={
                early:typeof window.cotEarlyWarning==='function'?window.cotEarlyWarning('EUR'):null,
                summary:typeof window.v224CotSummary==='function'?clone(window.v224CotSummary('EUR')):null,
                pairRow:typeof window.v228CotRow==='function'?clone(window.v228CotRow('USD/EUR',pairsNow['USD/EUR'])):null,
                riskClass:typeof window.v315CotRiskClass==='function'?window.v315CotRiskClass('EUR'):null,
                heat:typeof window.cotHeatState==='function'?clone(window.cotHeatState('EUR')):null
              };
              const banner=document.getElementById('gmfqCotFreshnessBanner');
              const bannerText=banner?.textContent||'';
              const romeParts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Rome',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
              const rm=Object.fromEntries(romeParts.filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
              const currentRomeDate=`${rm.year}-${rm.month}-${rm.day}`;
              return {gate,currentRomeDate,currencies,currenciesBefore,pairsNow,currencyFailures,currencyCoreDiffs,pairStructuralFailures,rawCotFingerprint,rawCotDiffs,helpers,bannerText,provenance:clone(window.PRODUCTION_PRICE_COT_LIQ_AUDIT?.cot),bootstrapError:window.__GMFQ_BOOTSTRAP_ERROR||null};
            });
            await browser.close();
            fs.writeFileSync('cot-freshness-gate-audit.json',JSON.stringify({schema:'GMFQ_COT_FRESHNESS_GATE_AUDIT_V1',...out,consoleErrors:errors},null,2));
            console.log(JSON.stringify({gate:out.gate,currentRomeDate:out.currentRomeDate,currencyFailures:out.currencyFailures.length,currencyCoreDiffs:out.currencyCoreDiffs.length,pairStructuralFailures:out.pairStructuralFailures.length,rawCotDiffs:out.rawCotDiffs,helpers:out.helpers,bannerText:out.bannerText,provenance:out.provenance},null,2));
            if(out.bootstrapError)throw new Error(out.bootstrapError);
            if(errors.length)throw new Error('Browser errors: '+errors.join(' | '));
            if(out.gate?.status!=='PASS_WITHHELD_STALE_COT')throw new Error('COT gate did not withhold stale snapshot: '+JSON.stringify(out.gate));
            if(out.gate?.cot_asof!=='2026-09-22'||out.gate?.reference_asof!==out.currentRomeDate||out.gate?.calendar_lag_days!==20)throw new Error('COT freshness dates unexpected: '+JSON.stringify({gate:out.gate,currentRomeDate:out.currentRomeDate}));
            if(out.currencyFailures.length)throw new Error('Currency COT failures: '+JSON.stringify(out.currencyFailures));
            if(out.currencyCoreDiffs.length)throw new Error('Currency core changed: '+JSON.stringify(out.currencyCoreDiffs));
            if(out.pairStructuralFailures.length)throw new Error('Pair structural frame incomplete: '+JSON.stringify(out.pairStructuralFailures));
            if(out.rawCotDiffs.length)throw new Error('Underlying D.cot mutated: '+JSON.stringify(out.rawCotDiffs));
            if(out.provenance?.current_as_of!=='2026-09-22')throw new Error('COT provenance mutated: '+JSON.stringify(out.provenance));
            if(!/COT WITHHELD PER FRESHNESS/i.test(out.bannerText))throw new Error('COT stale banner missing: '+out.bannerText);
            if(!/WITHHELD/i.test(String(out.helpers.early||'')))throw new Error('cotEarlyWarning not fail-closed: '+JSON.stringify(out.helpers));
            if(out.helpers.summary?.cls!=='neu'||!/WITHHELD/i.test(out.helpers.summary?.text||''))throw new Error('COT summary not fail-closed: '+JSON.stringify(out.helpers));
            if(out.helpers.pairRow?.side!=='WITHHELD')throw new Error('COT pair row not fail-closed: '+JSON.stringify(out.helpers));
            if(out.helpers.riskClass!=='neu'||out.helpers.heat?.ext!==false)throw new Error('COT risk visuals not neutralized: '+JSON.stringify(out.helpers));
          })().catch(e=>{console.error('::error title=COT freshness gate audit::'+String(e.stack||e));process.exit(1)});
          EOF
          node cot-gate-audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cot-freshness-gate-audit-v1
          path: |
            cot-freshness-gate-audit.json
            /tmp/gmfq-cot-gate-server.log
