name: OIS Estimated Curve Reliability Research QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/cb_pricing/audit_estimated_ois_reliability_v1.py'
      - 'validation/cb_pricing/probe_eurex_historical_estr_source_v1.py'
      - 'validation/cb_pricing/test_probe_eurex_historical_estr_source_v1.py'
      - 'validation/cb_pricing/eur_estr_contract_benchmark_bridge_v1.py'
      - 'validation/cb_pricing/eur_independent_spot_ois_forward_research_v1.py'
      - 'validation/cb_pricing/test_eur_independent_spot_ois_forward_research_v1.py'
      - 'validation/cb_pricing/test_eur_estr_contract_benchmark_bridge_v1.py'
      - 'validation/cb_pricing/probe_cme_term_estr_public_download_v1.py'
      - 'validation/cb_pricing/test_audit_estimated_ois_reliability_v1.py'
      - 'validation/cb_pricing/history/OIS_SAME_CONTRACT_QUOTES_V1.jsonl'
      - 'validation/cb_pricing/NZD_BB_CASH_RESEARCH_CALIBRATION_V1_2026-10-21.json'
      - '.github/workflows/ois-estimate-reliability-research-qa-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test only research provenance, no OIS skill claims
        run: |
          python -m unittest validation.cb_pricing.test_audit_estimated_ois_reliability_v1 -v
          python -m validation.cb_pricing.audit_estimated_ois_reliability_v1 --out /tmp/ois-estimate-reliability.json
      - name: EUR exact forward accrual windows and synthetic independent benchmark tests
        run: |
          python -m unittest validation.cb_pricing.test_eur_estr_contract_benchmark_bridge_v1 -v
          python -m validation.cb_pricing.eur_estr_contract_benchmark_bridge_v1 --out /tmp/eur-estr-benchmark-readiness.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/eur-estr-benchmark-readiness.json').read_text())
          assert x['eur_archived_futures_observations']==28
          assert x['distinct_eurex_futures_periods']==4
          assert x['admissible_same_window_pairs']==0
          assert x['actual_model_OIS_level_MAE_bp'] is None
          assert x['predicted_OIS_direction_hit_rate'] is None
          assert x['eligible_to_change_OIS_operational_feed'] is False
          print('EUR_FST3_EXACT_WINDOWS_4_VALIDATED_BENCHMARK_MATCHES_0')
          PY
      - name: One official CME CSV availability request, metadata only, no ingestion
        run: |
          python -m validation.cb_pricing.probe_cme_term_estr_public_download_v1 --once --out /tmp/cme-term-estr-source-access.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/cme-term-estr-source-access.json').read_text())
          assert x['independent_OIS_same_forward_period_benchmark'] is False
          assert x['eligible_to_modify_live_OIS_or_FX'] is False
          assert x['downloaded_data_stored'] is False
          print('CME_TERM_ESTR_SPOT_REFERENCE_CANNOT_VALIDATE_FST3_DIRECTLY',x['status'])
          PY
      - name: EUR independent spot OIS research bridge synthetic-only QA
        run: |
          python -m unittest validation.cb_pricing.test_eur_independent_spot_ois_forward_research_v1 -v
          echo EUR_OIS_SPOT_FORWARD_RESEARCH_RECONSTRUCTION_QA_ONLY
      - name: Check observed historical Eurex Clearing URLs, without generating archive links
        run: |
          python -m unittest validation.cb_pricing.test_probe_eurex_historical_estr_source_v1 -v
          python -m validation.cb_pricing.probe_eurex_historical_estr_source_v1 --once --out /tmp/eurex-historic-source-access.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/eurex-historic-source-access.json').read_text())
          assert x['schema']=='GMFQ_EUREX_OIS_HISTORICAL_ACCESS_RESEARCH_V1'
          assert x['different_dates_verified']<=2
          assert x['EUR_OIS_MAE_bp'] is None and x['EUR_OIS_hit_rate'] is None
          assert x['new_schedule_added'] is False and x['changes_live_OIS_or_FX'] is False
          print('EUREX_21OCT_SOURCE_VERIFIED',x['historic_21oct_public_source_verified'])
          PY
      - name: "Gate: no OIS benchmark equals no validated OIS MAE or hit rate"
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('/tmp/ois-estimate-reliability.json').read_text())
          assert o['schema']=='GMFQ_ESTIMATED_OIS_RELIABILITY_RESEARCH_V1'
          assert o['quotes_observed']>=1
          assert o['currencies_with_verified_OIS_accuracy']==0
          assert o['independent_synchronized_OIS_reference_count']==0
          assert o['level_MAE_vs_OIS'] is None
          assert o['directional_hit_rate_vs_OIS'] is None
          assert o['eligible_to_reprice_CB_or_28_pairs'] is False
          assert o['eligible_to_publish_official_OIS'] is False
          assert o['eligible_for_H1_or_Forward'] is False
          assert o['writes_live_data'] is False
          for c in ('USD','EUR','CHF','NZD'):
              row=o['currencies'][c]
              assert row['level_error_MAE_bp'] is None
              assert row['direction_accuracy_percent'] is None
              assert row['reliability_grade_for_OIS_accuracy']=='NOT_VALIDATED_NO_INDEPENDENT_OIS_REFERENCE'
          nz=o['currencies']['NZD']
          assert nz['monthly_bill_minus_OCR_holdout_MAE_bp']==16.333
          print('OIS_RESEARCH_INDEPENDENT_BENCHMARK_NOT_AVAILABLE_NO_TRADING_PROMOTION')
          PY
      - name: "Gate: protect actual site, currency scores, 28 pairs and schedulers"
        run: |
          python - <<'PY'
          import subprocess
          allowed={
             'validation/cb_pricing/audit_estimated_ois_reliability_v1.py',
             'validation/cb_pricing/probe_eurex_historical_estr_source_v1.py',
             'validation/cb_pricing/test_probe_eurex_historical_estr_source_v1.py',
             'validation/cb_pricing/eur_estr_contract_benchmark_bridge_v1.py',
             'validation/cb_pricing/eur_independent_spot_ois_forward_research_v1.py',
             'validation/cb_pricing/test_eur_independent_spot_ois_forward_research_v1.py',
             'validation/cb_pricing/test_eur_estr_contract_benchmark_bridge_v1.py',
             'validation/cb_pricing/test_audit_estimated_ois_reliability_v1.py',
             'validation/cb_pricing/probe_cme_term_estr_public_download_v1.py',
             'validation/cb_pricing/test_audit_estimated_ois_reliability_v1.py',
             '.github/workflows/ois-estimate-reliability-research-qa-v1.yml',
             '.github/workflows/control-room-v10-full-g8-browser-qa.yml',
             '.github/workflows/control-room-v10-full-g8-browser-qa.yml',
          }
          changed=set(subprocess.check_output(
             ['git','diff','--name-only','origin/main...HEAD'],text=True).splitlines())
          assert changed<=allowed, 'unapproved research change: '+repr(sorted(changed-allowed))
          print('RESEARCH_ONLY_NO_LIVE_DATA_SITE_CRON_OR_MODEL_WRITES')
          PY
      - name: Archive empirical evidence and explicit OIS-accuracy no-go
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ois-estimate-reliability-research-v1
          path: |
            /tmp/ois-estimate-reliability.json
            /tmp/eur-estr-benchmark-readiness.json
            /tmp/cme-term-estr-source-access.json
            /tmp/eurex-historic-source-access.json
          if-no-files-found: warn
