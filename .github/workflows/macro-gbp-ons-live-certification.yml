name: GBP ONS Macro Live Certification

# Re-certify the current adapter contract on every relevant source change.
on:
  push:
    branches:
      - validation-macro-eur-certified-2026-10-08
    paths:
      - 'validation/sources/gbp_ons_core.py'
      - 'validation/fixtures/gbp_ons_cpi_contract.json'
      - 'validation/fixtures/gbp_ons_unemployment_contract.json'
      - 'validation/test_gbp_ons_source.py'
      - 'validation/build_macro_candidate.py'
      - '.github/workflows/macro-gbp-ons-live-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot runtime before source verification
        run: sha256sum live_data/sections/MACRO_SERIES.json live_data/sections/MACRO_THERMOMETER_DATA.json live_data/manifest.v2.json > /tmp/gbp-macro-before.sha256
      - name: Run deterministic ONS parser-builder contract
        run: python validation/test_gbp_ons_source.py
      - name: Fetch and build official live ONS candidates
        shell: bash
        run: |
          set -euo pipefail
          for D in inflation labour; do
            mkdir -p "/tmp/gmfq-gbp-ons-live/${D}"
            python validation/sources/gbp_ons_core.py \
              --dimension "$D" \
              --output "/tmp/gmfq-gbp-ons-live/${D}/candidate.json" \
              --audit-output "/tmp/gmfq-gbp-ons-live/${D}/source-audit.json"
            python validation/build_macro_candidate.py \
              --candidate "/tmp/gmfq-gbp-ons-live/${D}/candidate.json" \
              --output-dir "/tmp/gmfq-gbp-ons-live/${D}/built"
          done
      - name: Verify ONS provenance and canonical builder contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected={'inflation':('D7G7','reported_yoy_rate'),'labour':('MGSX','level')}
          out={}
          for dim,(series_id,transformation) in expected.items():
              root=Path('/tmp/gmfq-gbp-ons-live')/dim
              c=json.loads((root/'candidate.json').read_text())
              a=json.loads((root/'source-audit.json').read_text())
              s=json.loads((root/'built/summary.json').read_text())
              assert c['currency']=='GBP' and c['dimension']==dim, c
              assert c['source']=='Office for National Statistics', c
              assert c['series_id']==series_id and c['transformation']==transformation, c
              assert a['upstream_series_id']==series_id, a
              assert a['mode']=='live' and a['live_data_written'] is False, a
              assert s['status']=='PASS' and s['live_data_modified'] is False, s
              assert s['observation_date']==c['observation_date'], (s,c)
              out[dim]={'macro_series_id':c['macro_series_id'],'observation_date':c['observation_date'],'value':c['value'],'series_action':s['series_action']}
          print(json.dumps({'status':'GBP_ONS_LIVE_CERTIFICATION_PASS','results':out,'live_data_modified':False}, indent=2))
          PY
      - name: Run generic macro self-test and registry audit
        run: |
          python validation/build_macro_candidate.py --self-test
          python validation/macro/check_macro_source_registry.py
      - name: Prove certification is read-only
        run: |
          sha256sum -c /tmp/gbp-macro-before.sha256
          git diff --exit-code -- live_data payload
      - name: Upload ONS verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: gbp-ons-live-macro-certification-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: /tmp/gmfq-gbp-ons-live/
