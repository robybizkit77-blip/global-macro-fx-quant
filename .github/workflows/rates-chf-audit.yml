name: Rates CHF Audit
on:
  push:
    branches:
      - staging-rates-chf-2026-10-05
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official SNB CHF 2Y 10Y
        run: |
          pip install requests
          python validation/fetch_rates_chf.py
