name: Macro NZD Inflation PIT Probe V1

on:
  push:
    branches:
      - 'validation-macro-nzd-inflation-pit-bootstrap-*'
    paths:
      - '.github/workflows/macro-nzd-inflation-pit-probe-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official Stats NZ inflation and canonical runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nzd-inflation-probe
          python3 validation/sources/nzd_statsnz_core.py \
            --dimension inflation \
            --output /tmp/nzd-inflation-probe/candidate.json \
            --audit-output /tmp/nzd-inflation-probe/source-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/nzd-inflation-probe/candidate.json').read_text())
          a=json.loads(Path('/tmp/nzd-inflation-probe/source-audit.json').read_text())
          ms=json.loads(Path('live_data/sections/MACRO_SERIES.json').read_text())
          row=[r for r in ms['NZD'] if r.get('id')==c['macro_series_id']][0]
          heat=json.loads(Path('live_data/sections/MACRO_THERMOMETER_DATA.json').read_text())['currencies']['NZD']['inflation']
          print(json.dumps({
            'candidate':c,
            'audit':a,
            'canonical_tail':list(zip(row['dates'][-4:],row['values'][-4:])),
            'canonical_last_date':row.get('last_date'),
            'canonical_last_value':row.get('last_value'),
            'heatmap_tail':heat.get('history',[])[-4:],
            'heatmap_latest_value':heat.get('latest_value'),
            'heatmap_as_of':heat.get('as_of')
          },indent=2))
          assert a['candidate_only'] is True and a['live_data_written'] is False
          PY
          git diff --exit-code -- live_data
