name: Macro Persistent Daily V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/macro-persistent-daily-v1.yml'
      - 'validation/macro_adapter_pit_handoff.py'
      - 'validation/macro/check_macro_source_registry.py'
      - 'validation/macro/collect_us_nz_household_firm_sources_v1.py'
      - 'validation/macro/reconcile_us_real_households_countrybook_v2.py'
      - 'validation/macro/prepare_us_revised_household_canonical_v1.py'
      - 'validation/macro/test_prepare_us_revised_household_canonical_v1.py'
      - 'validation/macro/test_reconcile_us_real_households_countrybook_v2.py'
      - 'validation/orchestration/audit_g8_source_coverage_v1.py'
      - 'validation/orchestration/test_audit_g8_source_coverage_v1.py'
      - 'validation/macro/test_collect_us_nz_household_firm_sources_v1.py'
      - 'validation/macro/test_macro_official_source_label_contract_v1.py'
      - 'validation/macro/persist_calendar_news_safe_v12.py'
      - 'validation/macro/test_persist_macro_safe_v1.py'
      - 'validation/macro/capture_g8_prospective_v1.py'
      - 'validation/macro/test_capture_g8_prospective_v1.py'
      - 'validation/macro/score_g8_prospective_v1.py'
      - 'validation/macro/test_score_g8_prospective_v1.py'
      - 'validation/sources/cad_statcan_core.py'
      - 'validation/test_cad_statcan_transport.py'
      - 'validation/macro_pit_anchor_contract.py'
      - 'validation/build_macro_candidate.py'
      - 'validation/update_live_direct_section.py'
      - 'validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json'
      - 'validation/macro/gbp_ons_temporal_guard_v1.py'
      - 'validation/macro/GBP_MGSX_ROLLING_WINDOW_FIRST_RELEASE_MAP_2026-10-20.json'
      - 'validation/sources/gbp_ons_core.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/macro-persistent-daily-v1.yml'
      # Registry preflight fixes must be exercised by the actual production child.
      - 'validation/macro/check_macro_source_registry.py'
      - 'validation/macro/collect_us_nz_household_firm_sources_v1.py'
      - 'validation/macro/reconcile_us_real_households_countrybook_v2.py'
      - 'validation/macro/prepare_us_revised_household_canonical_v1.py'
      - 'validation/macro/test_prepare_us_revised_household_canonical_v1.py'
      - 'validation/macro/test_reconcile_us_real_households_countrybook_v2.py'
      - 'validation/orchestration/audit_g8_source_coverage_v1.py'
      - 'validation/orchestration/test_audit_g8_source_coverage_v1.py'
      - 'validation/macro/test_collect_us_nz_household_firm_sources_v1.py'
      - 'validation/macro/test_macro_official_source_label_contract_v1.py'
      - 'validation/macro/persist_calendar_news_safe_v12.py'
      - 'validation/macro/test_persist_macro_safe_v1.py'
      - 'validation/macro/capture_g8_prospective_v1.py'
      - 'validation/macro/test_capture_g8_prospective_v1.py'
      - 'validation/macro/score_g8_prospective_v1.py'
      - 'validation/macro/test_score_g8_prospective_v1.py'
  workflow_dispatch:
  # Early source-watch -> Calendar/News -> Macro. Serial dependency
  # avoids simultaneous main-branch writes by Calendar and Macro when an
  # independent GitHub schedule was delayed or dropped.
  # Only recovery-triggered Calendar runs qualify; routine scheduled or
  # orchestrator-dispatched Calendar checks must not relaunch Macro.
  workflow_run:
    workflows: ['Calendar News Operational Refresh V1']
    types: [completed]
  schedule:
    - cron: '35 6 * * 1-5'

permissions:
  contents: write

concurrency:
  group: macro-persistent-daily-main
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  persist-macro:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'workflow_run')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install adapter dependencies
        run: python -m pip install --disable-pip-version-check requests pandas openpyxl beautifulsoup4 lxml

      - name: Verify CAD official ZIP transport quarantine (offline)
        run: python validation/test_cad_statcan_transport.py

      - name: Verify BLS transient transport quarantine and PIT fail-closed rules (offline)
        run: python -m unittest validation.test_us_bls_transport_withheld_v1 -v

      - name: Guard EUR JPY NZD official source-label identity and reject spoofing
        run: python -m unittest validation.macro.test_macro_official_source_label_contract_v1 -v

      - name: Verify Macro safe persistence under independent concurrent Git writers
        run: python -m unittest validation.macro.test_persist_macro_safe_v1 -v

      - name: Verify first-seen G8 forecast freeze and append-only safeguards
        run: |
          node --check site/fx-quant-v2/next/g8-growth-shadow.js
          python -m unittest validation.macro.test_capture_g8_prospective_v1 -v
          python -m unittest validation.macro.test_score_g8_prospective_v1 -v

      # Read-only baseline before issuer collection, including rates and
      # expected-policy source quality; not evidence of a new release.
      - name: Snapshot G8 data before official Macro refresh
        shell: bash
        run: |
          set -euo pipefail
          python validation/orchestration/audit_g8_source_coverage_v1.py \
            --output /tmp/macro-persistent/g8-source-before.json

      - name: Snapshot baseline and registry contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/macro-persistent
          : > /tmp/macro-persistent/updates.txt
          git rev-parse HEAD > /tmp/macro-persistent/base-sha
          cp live_data/sections/MACRO_SERIES.json /tmp/macro-persistent/MACRO_SERIES.before.json
          cp live_data/sections/MACRO_THERMOMETER_DATA.json /tmp/macro-persistent/MACRO_THERMOMETER_DATA.before.json
          cp live_data/manifest.v2.json /tmp/macro-persistent/manifest.before.json
          python validation/macro/check_macro_source_registry.py > /tmp/macro-persistent/registry.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/macro-persistent/registry.json'))
          assert d['status']=='PASS', d
          print('MACRO_REGISTRY_PASS')
          PY

      - name: Fetch and PIT-verify all 16 core series independently
        id: refresh
        shell: bash
        run: |
          set -euo pipefail
          updated=0
          for ccy in USD EUR GBP JPY CHF CAD AUD NZD; do
            for dim in inflation labour; do
              key="${ccy}_${dim}"
              work="/tmp/macro-persistent/${key}"
              mkdir -p "$work"

              if [ "$key" = "GBP_labour" ]; then
                # The canonical July 2026 rate currently holds the June-Aug
                # MGSX-centered value. Do NOT append a new August point before
                # reconciling July first release 4.9 and August first release 4.7.
                python -m validation.macro.gbp_ons_temporal_guard_v1 \
                  --receipt "$work/temporal-guard.json" > "$work/temporal-guard.log"
                decision="$(python -c "import json; print(json.load(open('$work/temporal-guard.json'))['status'])")"
                if [ "$decision" != "ALLOW_GBP_LABOUR_SOURCE_REFRESH" ]; then
                  echo "GBP_labour $decision; quarantined only this source, continue other currencies"
                  echo "- GBP labour: $decision — correction requires reviewed July/August first-release PIT replay; other Macro series run normally" >> "$GITHUB_STEP_SUMMARY"
                  continue
                fi
              fi

              # A returned 75 is exclusively the registered StatCan transport
              # outage after bounded retries: no data candidate was emitted.
              # Keep CAD's canonical snapshot untouched; continue other G8.
              # Any parser, provenance or PIT error (other exit code) is fatal.
              set +e
              python validation/macro_adapter_pit_handoff.py \
                --currency "$ccy" --dimension "$dim" \
                --output "$work/candidate.json" \
                --audit-output "$work/adapter-audit.json"
              adapter_rc=$?
              set -e
              if [ "$ccy" = "CAD" ] && [ "$adapter_rc" -eq 75 ]; then
                test ! -e "$work/candidate.json" || { echo "$key produced an uncertified candidate" >&2; exit 1; }
                echo "$key SOURCE_TRANSPORT_WITHHELD_NO_CANDIDATE"
                echo "- CAD $dim: official StatCan ZIP transport unavailable; canonical data unchanged and no fabricated candidate" >> "$GITHUB_STEP_SUMMARY"
                printf '%s\n' "$key" >> /tmp/macro-persistent/transport-withheld.txt
                continue
              fi
              if [ "$ccy" = "USD" ] && [ "$adapter_rc" -eq 76 ]; then
                test ! -e "$work/candidate.json" || { echo "$key unexpectedly produced a candidate" >&2; exit 1; }
                test ! -e "$work/adapter-audit.json" || { echo "$key unexpectedly produced an adapter audit" >&2; exit 1; }
                echo "$key BLS_OFFICIAL_TRANSPORT_WITHHELD_NO_CANDIDATE"
                echo "- USD $dim: BLS official public API temporarily unavailable (bounded HTTP retries exhausted); canonical value retained, not marked fresh, no fabricated candidate" >> "$GITHUB_STEP_SUMMARY"
                printf '%s\n' "$key" >> /tmp/macro-persistent/transport-withheld.txt
                continue
              fi
              test "$adapter_rc" -eq 0 || exit "$adapter_rc"
              test -s "$work/candidate.json" && test -s "$work/adapter-audit.json"

              series_id="$(python - <<PY
          import json
          print(json.load(open('$work/candidate.json'))['macro_series_id'])
          PY
          )"

              freshness="$(python - <<PY
          import json, math
          from pathlib import Path
          candidate=json.load(open('$work/candidate.json'))
          series=json.load(open('live_data/sections/MACRO_SERIES.json'))
          heat=json.load(open('live_data/sections/MACRO_THERMOMETER_DATA.json'))
          rows=series['$ccy']
          hits=[r for r in rows if isinstance(r,dict) and r.get('id')==candidate['macro_series_id']]
          if len(hits)!=1:
              raise SystemExit(f"$key canonical target count={len(hits)}")
          row=hits[0]
          dates=row.get('dates') or []
          values=row.get('values') or []
          if not dates or len(dates)!=len(values):
              raise SystemExit('$key canonical target has invalid dates/values')
          candidate_month=str(candidate['observation_date'])[:7]
          canonical_month=str(dates[-1])[:7]
          if candidate_month < canonical_month:
              status='NO_UPDATE_STALE_OFFICIAL_SOURCE'
          elif candidate_month == canonical_month:
              series_value=float(candidate.get('series_value',candidate['value']))
              heat_value=float(candidate['value'])
              canonical_series=float(values[-1])
              canonical_heat=float(heat['currencies']['$ccy']['$dim']['latest_value'])
              same_series=math.isclose(series_value,canonical_series,rel_tol=0.0,abs_tol=1e-12)
              same_heat=math.isclose(heat_value,canonical_heat,rel_tol=0.0,abs_tol=1e-12)
              status='NO_UPDATE_CANONICAL_MATCH' if same_series and same_heat else 'ACTIONABLE'
          else:
              status='ACTIONABLE'
          receipt={
              'status':status,
              'candidate_date':candidate['observation_date'],
              'canonical_latest_date':dates[-1],
              'actionable':status=='ACTIONABLE',
          }
          Path('$work/freshness.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          print(status)
          PY
          )"

              if [ "$freshness" != "ACTIONABLE" ]; then
                echo "$key $freshness"
                continue
              fi

              python validation/build_macro_candidate.py \
                --candidate "$work/candidate.json" \
                --output-dir "$work/built" > "$work/builder.json"

              if cmp -s "$work/built/MACRO_SERIES.json" live_data/sections/MACRO_SERIES.json && \
                 cmp -s "$work/built/MACRO_THERMOMETER_DATA.json" live_data/sections/MACRO_THERMOMETER_DATA.json; then
                echo "$key NO_UPDATE"
                continue
              fi

              evidence="$work/evidence"
              python validation/macro_pit_anchor_contract.py capture-before \
                --evidence-dir "$evidence" --currency "$ccy" --dimension "$dim" --macro-series-id "$series_id"

              cp "$work/built/MACRO_SERIES.json" live_data/sections/MACRO_SERIES.json
              cp "$work/built/MACRO_THERMOMETER_DATA.json" live_data/sections/MACRO_THERMOMETER_DATA.json

              python validation/macro_pit_anchor_contract.py capture-after \
                --evidence-dir "$evidence" --currency "$ccy" --dimension "$dim" --macro-series-id "$series_id" --allow-live-data-dirty

              python validation/macro_pit_anchor_contract.py verify \
                --evidence-dir "$evidence" --currency "$ccy" --dimension "$dim" --macro-series-id "$series_id" \
                --candidate "$work/candidate.json" --evidence-output "$work/pit-evidence.json"

              python - <<PY
          import json
          d=json.load(open('$work/pit-evidence.json'))
          assert d['status']=='PASS', d
          assert len(d['atomic_delta']['changed_rows'])==1, d
          print('$key PIT_PASS')
          PY

              cp "$evidence/before/MACRO_SERIES.json" live_data/sections/MACRO_SERIES.json
              cp "$evidence/before/MACRO_THERMOMETER_DATA.json" live_data/sections/MACRO_THERMOMETER_DATA.json
              git diff --exit-code -- live_data/sections/MACRO_SERIES.json live_data/sections/MACRO_THERMOMETER_DATA.json

              echo "$key" >> /tmp/macro-persistent/updates.txt
              updated=$((updated+1))
            done
          done
          echo "updated=$updated" >> "$GITHUB_OUTPUT"
          echo "MACRO_SERIES_UPDATED=$updated"

      - name: Compose all PIT-verified updates and apply atomically
        if: steps.refresh.outputs.updated != '0'
        shell: bash
        run: |
          set -euo pipefail
          compose=/tmp/macro-persistent/composed
          mkdir -p "$compose/current"
          cp live_data/sections/MACRO_SERIES.json "$compose/current/MACRO_SERIES.json"
          cp live_data/sections/MACRO_THERMOMETER_DATA.json "$compose/current/MACRO_THERMOMETER_DATA.json"

          while read -r key; do
            [ -n "$key" ] || continue
            work="/tmp/macro-persistent/${key}"
            rm -rf "$compose/next"
            python validation/build_macro_candidate.py \
              --candidate "$work/candidate.json" \
              --series-input "$compose/current/MACRO_SERIES.json" \
              --heatmap-input "$compose/current/MACRO_THERMOMETER_DATA.json" \
              --output-dir "$compose/next" > "$work/compose-builder.json"
            cp "$compose/next/MACRO_SERIES.json" "$compose/current/MACRO_SERIES.json"
            cp "$compose/next/MACRO_THERMOMETER_DATA.json" "$compose/current/MACRO_THERMOMETER_DATA.json"
          done < /tmp/macro-persistent/updates.txt

          python validation/update_live_direct_section.py \
            --section MACRO_THERMOMETER_DATA \
            --replacement "$compose/current/MACRO_THERMOMETER_DATA.json" --apply \
            > /tmp/macro-persistent/apply-heat.json
          python validation/build_live_manifest_v2.py --write live_data/manifest.v2.json > /tmp/macro-persistent/manifest-after-heat.json
          python validation/update_live_direct_section.py \
            --section MACRO_SERIES \
            --replacement "$compose/current/MACRO_SERIES.json" --apply \
            > /tmp/macro-persistent/apply-series.json

      - name: Final runtime gates and exact scope
        if: steps.refresh.outputs.updated != '0'
        shell: bash
        run: |
          set -euo pipefail
          python validation/build_live_manifest_v2.py --write live_data/manifest.v2.json > /tmp/macro-persistent/manifest.json
          python validation/check_live_update_contract.py > /tmp/macro-persistent/live-contract.json
          python validation/rebuild_live_data_runtime.py --verify-only > /tmp/macro-persistent/runtime-roundtrip.json
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={
            'live_data/sections/MACRO_SERIES.json',
            'live_data/sections/MACRO_THERMOMETER_DATA.json',
            'live_data/manifest.v2.json',
            'payload/part-00.txt',
            'payload/part-01.txt',
          }
          if not changed or not changed.issubset(allowed):
              raise SystemExit(f'Macro exact-scope violation: {sorted(changed)}')
          required={'live_data/sections/MACRO_SERIES.json','live_data/sections/MACRO_THERMOMETER_DATA.json'}
          if not required.issubset(changed):
              raise SystemExit(f'Macro core sections missing from diff: {sorted(changed)}')
          print('MACRO_FINAL_SCOPE_PASS', sorted(changed))
          PY

      - name: Validation branch restores runtime
        if: github.ref != 'refs/heads/main' && always()
        shell: bash
        run: |
          git restore --source=HEAD --worktree -- live_data payload
          git diff --exit-code -- live_data payload

      - name: Persist validated Macro update safely across independent main changes
        if: github.ref == 'refs/heads/main' && steps.refresh.outputs.updated != '0'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from validation.macro.persist_calendar_news_safe_v12 import persist
          managed=(
              'live_data/sections/MACRO_SERIES.json',
              'live_data/sections/MACRO_THERMOMETER_DATA.json',
              'live_data/manifest.v2.json',
              'payload/part-00.txt',
              'payload/part-01.txt',
          )
          receipt=persist(managed=managed, max_attempts=4,
                          commit_message='Refresh daily Macro runtime from official sources')
          assert receipt['status']=='PERSISTED', receipt
          print(json.dumps(receipt,sort_keys=True))
          PY

      - name: Confirm no-change case
        if: steps.refresh.outputs.updated == '0'
        run: git diff --exit-code -- live_data payload

      # Source observation is deliberately outside the 16-series PIT adapter.
      # It produces a dated research artifact, NOT canonical financial data.
      # One existing weekday workflow / same cron; no new scheduler.
      - name: Verify and collect US/NZ household-firm sources (research only)
        if: success()
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m unittest validation.macro.test_collect_us_nz_household_firm_sources_v1 -v
          python -m validation.macro.collect_us_nz_household_firm_sources_v1 \
            --out /tmp/macro-persistent/household-firm-publisher-intake-v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/macro-persistent/household-firm-publisher-intake-v1.json')
          j=json.loads(p.read_text())
          assert j['schema']=='GMFQ_HOUSEHOLD_FIRMS_ISSUER_INTAKE_RESEARCH_V1'
          assert len(j['sources'])==4
          assert j['source_series_modified'] is False
          assert j['fx_signal_generated'] is False
          assert j['new_scheduler_created'] is False
          with Path(__import__('os').environ['GITHUB_STEP_SUMMARY']).open('a') as out:
              out.write('### Households / firms source read-only intake\n')
              out.write('- '+str(j['source_count_verified'])+'/4 sources independently fetched and checked\n')
              out.write('- New revised series candidates: '+
                        (', '.join(j['usable_new_revised_monthly_candidates']) or 'none')+'\n')
              out.write('- No current-live series / 28-pair signal modifications\n')
          PY

      - name: Verify BEA/FRED revised-vintage Country Book (research only)
        id: us_households_reconcile
        if: success()
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m unittest validation.macro.test_reconcile_us_real_households_countrybook_v2 -v
          if [[ ! -s /tmp/macro-persistent/household-firm-publisher-intake-v1.json ]]; then
            echo 'US_HOUSEHOLDS_RESEARCH_WITHHELD: no source intake receipt'
            exit 1
          fi
          python -m validation.macro.reconcile_us_real_households_countrybook_v2 \
            --intake /tmp/macro-persistent/household-firm-publisher-intake-v1.json \
            --json-out /tmp/macro-persistent/us-households-revised-countrybook-v2.json \
            --md-out /tmp/macro-persistent/us-households-revised-countrybook-v2.md
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads(Path('/tmp/macro-persistent/us-households-revised-countrybook-v2.json').read_text())
          assert j['status']=='TWO_REVISED_REAL_SERIES_RECONCILED_WITH_BEA_ISSUER_RESEARCH_ONLY'
          assert j['replaces_live_macro_series'] is False
          assert j['affects_28_pair_core'] is False
          assert j['series_pit_certified'] is False
          assert len(j['revised_series']['PCEC96']['complete_revised_history'])>=82
          assert len(j['revised_series']['DSPIC96']['complete_revised_history'])>=82
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('\n'+Path('/tmp/macro-persistent/us-households-revised-countrybook-v2.md').read_text()+'\n')
          PY

      # Independent off-core gate: if BEA/FRED is unavailable, do not change
      # either series. The existing 16 official inflation/labour series
      # remain operational, and research receipt records the failure.
      - name: Prepare two-series revised US household canonical replacement
        id: us_households_prep
        if: steps.us_households_reconcile.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m unittest validation.macro.test_prepare_us_revised_household_canonical_v1 -v
          python -m validation.macro.prepare_us_revised_household_canonical_v1 \
            --research-note /tmp/macro-persistent/us-households-revised-countrybook-v2.json \
            --candidate-out /tmp/macro-persistent/MACRO_SERIES_US_REVISED_PREP.json \
            --report-out /tmp/macro-persistent/us-households-revised-promotion-preflight-v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('/tmp/macro-persistent/us-households-revised-promotion-preflight-v1.json').read_text())
          assert j['status'] in {
              'REVISED_US_HOUSEHOLDS_READY_FOR_CANONICAL_APPLY',
              'NO_CHANGE_VERIFIED_REVISED_VINTAGE'
          },j
          assert j['first_release_pit_eligible'] is False
          assert j['g8_unchanged_other_than_two_us_household_series'] is True
          PY

      # The same gate was exercised on real BEA/FRED sources and validated
      # using the direct payload/manifest round trip on the PR branch.
      # Persist MAIN only with checked fast-forward; never force-push
      # overlapping CPI/news/macro edits. No other currencies or FX signals.
      - name: Promote verified revised US real PCE/DPI canonical pair safely
        if: github.ref == 'refs/heads/main' && steps.us_households_prep.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          status="$(python - <<'PY'
          import json
          j=json.load(open('/tmp/macro-persistent/us-households-revised-promotion-preflight-v1.json'))
          print(j['status'])
          PY
          )"
          if [ "$status" = NO_CHANGE_VERIFIED_REVISED_VINTAGE ]; then
            echo 'US_REVISED_HOUSEHOLDS_ALREADY_CURRENT_NO_COMMIT'
            exit 0
          fi
          test "$status" = REVISED_US_HOUSEHOLDS_READY_FOR_CANONICAL_APPLY
          python validation/update_live_direct_section.py \
            --section MACRO_SERIES \
            --replacement /tmp/macro-persistent/MACRO_SERIES_US_REVISED_PREP.json \
            --apply > /tmp/macro-persistent/us-households-canonical-direct-apply-v1.json
          python validation/build_live_manifest_v2.py \
            --write live_data/manifest.v2.json \
            > /tmp/macro-persistent/us-households-canonical-manifest-v1.json
          python validation/check_live_update_contract.py \
            > /tmp/macro-persistent/us-households-canonical-live-contract-v1.json
          python validation/rebuild_live_data_runtime.py --verify-only \
            > /tmp/macro-persistent/us-households-canonical-runtime-v1.json
          python -m validation.macro.build_g8_causal_evidence_bridge_v2 \
            --json-out /tmp/macro-persistent/us-households-canonical-g8-research.json \
            --md-out /tmp/macro-persistent/us-households-canonical-g8-research.md
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          d=json.loads(Path('live_data/sections/MACRO_SERIES.json').read_text())
          prepared=json.load(open('/tmp/macro-persistent/us-households-revised-promotion-preflight-v1.json'))
          expected_month=prepared['reference_month']+'-01'
          rows={r['id']:r for r in d['USD']}
          for ident in ('US_PCEC96_history_value','US_DSPIC96_history_DSPIC96'):
              row=rows[ident]
              assert row['last_date']==expected_month
              assert row['frequency']=='M'
              assert row['unit']=='Billions of Chained 2017 Dollars SAAR'
              assert row['current_vintage_provenance']['source_series_first_release_PIT_certified'] is False
          allowed={'live_data/sections/MACRO_SERIES.json',
                   'live_data/manifest.v2.json',
                   'payload/part-00.txt','payload/part-01.txt'}
          diff=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert diff and diff.issubset(allowed),diff
          PY
          python - <<'PY'
          import json
          from validation.macro.persist_calendar_news_safe_v12 import persist
          managed=(
            'live_data/sections/MACRO_SERIES.json',
            'live_data/manifest.v2.json',
            'payload/part-00.txt',
            'payload/part-01.txt',
          )
          print(json.dumps(persist(managed=managed),sort_keys=True))
          PY

      # Existing Macro refresh cadence only. Freeze a single first-seen
      # prospective model vintage per Rome date, even on no-new-source days.
      # Commits an append-only research file with GitHub Contents create-only;
      # never mutates historical receipts, official datasets or FX signals.
      - name: Persist research-only G8 shadow vintage from refreshed main
        if: github.ref == 'refs/heads/main' && success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python -m validation.macro.capture_g8_prospective_v1 \
            --revision origin/main \
            --output /tmp/macro-persistent/g8-prospective-capture.json \
            --publish

      # Compare only earliest frozen forecasts with first subsequently
      # recorded observations. Outputs are append-only; no hindsight refits.
      - name: Certify prospective first-seen errors without issuer PIT claims
        if: github.ref == 'refs/heads/main' && success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python -m validation.macro.score_g8_prospective_v1 \
            --revision origin/main \
            --output /tmp/macro-persistent/g8-first-seen-outcomes.json \
            --publish

      # Read the exact versioned main commit *after* existing collectors
      # and safe persistence. Compare against this job's pre-collector
      # sources, not only workflow success or a modified local workspace.
      - name: G8 persisted-source audit of refreshed main (read-only)
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          baseline=/tmp/macro-persistent/g8-source-before.json
          if [[ ! -s "$baseline" ]]; then
            echo 'G8_SOURCE_AUDIT_WITHHELD_NO_BEFORE_SNAPSHOT' >&2
            exit 1
          fi
          git fetch --no-tags origin main
          source_sha="$(git rev-parse origin/main)"
          export G8_SOURCE_SHA="$source_sha"
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          from validation.orchestration.audit_g8_source_coverage_v1 import FILES
          sha=os.environ['G8_SOURCE_SHA']
          root=Path('/tmp/macro-persistent/g8-source-persisted-main')
          for rel in FILES.values():
              data=subprocess.check_output(['git','show',f'{sha}:{rel}'])
              target=root/rel
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
          (root/'source-main-commit.txt').write_text(sha+'\n',encoding='utf-8')
          print('G8_MAIN_SOURCE_SNAPSHOT_SHA',sha)
          PY
          python validation/orchestration/audit_g8_source_coverage_v1.py \
            --root /tmp/macro-persistent/g8-source-persisted-main \
            --before "$baseline" \
            --output /tmp/macro-persistent/g8-source-after.json \
            --summary
          echo "- Source receipt after **persisted main** commit: \`$source_sha\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- A workflow can succeed without new source observations; this receipt is not an issuer release timestamp.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-persistent-evidence-${{ github.run_id }}
          path: /tmp/macro-persistent/
          if-no-files-found: warn
          retention-days: 30