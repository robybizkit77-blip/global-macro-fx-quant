  # avoids simultaneous main-branch writes by Calendar and Macro when an
  # independent GitHub schedule was delayed or dropped.
  # Only recovery-triggered Calendar runs qualify; routine scheduled or
  # orchestrator-dispatched Calendar checks must not relaunch Macro.
  workflow_run:
    workflows: ['Calendar News Operational Refresh V1']
    types: [completed]
  schedule:
    - cron: '35 6 * * 1-5'

permissions:
  contents: write

concurrency:
  # PR source proofs must never replace a queued production refresh or another PR.
  group: ${{ github.event_name == 'pull_request' && format('macro-persistent-validation-pr-{0}', github.event.pull_request.number) || 'macro-persistent-daily-main' }}
  queue: max
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  chf-snb-source-proof:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/chf-snb-money-revised-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Validate source contract and independent failure behavior
        run: python -m unittest validation.macro.test_prepare_chf_snb_revised_v1 -v
      - name: Verify official SNB exact source metadata and history
        run: |
          python -m validation.macro.prepare_chf_snb_revised_v1 --candidate /tmp/chf-snb-proof/candidate.json --receipt /tmp/chf-snb-proof/receipt.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/chf-snb-proof/receipt.json'))
          for r in d['series']: print(r)
          assert len(d['series'])==2
          # Prove each verified row and require meaningful real-source coverage;
          # independent withheld rows are explicit, never promoted.
          approved=[r for r in d['series'] if r['status'] in ('READY','NO_CHANGE')]
          assert len(approved)==2,d
          assert all(r['after']>=r['before'] and r['after']>='2026-09' for r in approved),d
          assert all(r.get('reason') for r in d['series'] if r['status']=='WITHHELD'),d
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chf-snb-source-proof
          path: /tmp/chf-snb-proof/receipt.json
          if-no-files-found: warn

