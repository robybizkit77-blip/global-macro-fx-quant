name: Control Room Site V2 QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/control-room-v2/**'
      - '.github/workflows/control-room-site-v2-qa.yml'
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/cr-v2.log 2>&1 &
          sleep 2
      - name: Capture V2
        run: |
          cat > cr-v2.js <<'EOF'
          const { chromium }=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1440,height:810},deviceScaleFactor:1});await p.goto('http://127.0.0.1:8000/site/control-room-v2/',{waitUntil:'networkidle',timeout:120000});await p.waitForTimeout(1200);await p.screenshot({path:'control-room-v2.png',fullPage:true});await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node cr-v2.js
      - uses: actions/upload-artifact@v4
        with:
          name: control-room-site-v2
          path: control-room-v2.png