name: JPY Macro First Release Feasibility V1

on:
  push:
    branches:
      - validation-jpy-lfs-pit-feasibility-v1-2026-10-06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check pypdf==6.1.1
      - name: Probe archived official Labour first-release PDFs
        run: |
          mkdir -p /tmp/gmfq-jpy-pit
          python validation/jpy_lfs_first_release_probe.py \
            --months 2018-01 2019-01 2023-01 \
            --output /tmp/gmfq-jpy-pit/labour.json
      - name: Probe archived METI industrial-production first releases
        run: |
          python validation/jpy_iip_first_release_probe.py \
            --output /tmp/gmfq-jpy-pit/iip.json
      - name: Probe archived METI tertiary-activity first releases
        run: |
          python validation/jpy_ita_first_release_probe.py \
            --output /tmp/gmfq-jpy-pit/ita.json
      - name: Assert feasibility boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          l=json.loads(Path('/tmp/gmfq-jpy-pit/labour.json').read_text())
          iip=json.loads(Path('/tmp/gmfq-jpy-pit/iip.json').read_text())
          ita=json.loads(Path('/tmp/gmfq-jpy-pit/ita.json').read_text())
          assert l['status']=='PASS',l
          assert l['labour_block_series_count']==2,l
          assert l['revised_history_fallback_used'] is False,l
          assert iip['status']=='PASS',iip
          assert iip['growth_series_count']==1,iip
          assert iip['publication_timestamp_in_source'] is True,iip
          assert ita['status']=='PASS',ita
          assert ita['growth_series_count']==1,ita
          assert ita['publication_date_in_source'] is True,ita
          assert iip['revised_history_fallback_used'] is False,iip
          assert ita['revised_history_fallback_used'] is False,ita
          assert l['pit_activation'] is False and iip['pit_activation'] is False and ita['pit_activation'] is False
          print(json.dumps({
            'status':'JPY_MACRO_PIT_RECONSTRUCTION_STRUCTURALLY_FEASIBLE',
            'labour_series_count':l['labour_block_series_count'],
            'growth_series_count':iip['growth_series_count']+ita['growth_series_count'],
            'pit_activation':False,
            'labour':l,'industrial_production':iip,'tertiary_activity':ita
          },indent=2,ensure_ascii=False))
          PY
      - name: Confirm repository untouched
        run: git diff --exit-code
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: jpy-macro-first-release-feasibility-v1
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/gmfq-jpy-pit/labour.json
            /tmp/gmfq-jpy-pit/iip.json
            /tmp/gmfq-jpy-pit/ita.json
