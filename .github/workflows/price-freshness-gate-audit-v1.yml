name: Price Freshness Gate Audit V1

on:
  push:
    branches:
      - 'validation-price-freshness-gate-v1-2026-10-12'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8143 --bind 127.0.0.1 > /tmp/gmfq-price-gate-server.log 2>&1 &
          sleep 2
      - name: Validate Price freshness gate
        run: |
          cat > price-gate-audit.js <<'EOF'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.stack||e)));
            page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
            const r=await page.goto('http://127.0.0.1:8143/index.html',{waitUntil:'domcontentloaded',timeout:120000});
            if(!r||!r.ok()) throw new Error('HTTP load failed');
            await page.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.settled_after_cad_chain===true||window.__GMFQ_BOOTSTRAP_ERROR,null,{timeout:120000});
            await page.waitForFunction(()=>window.__GMFQ_PRICE_FRESHNESS_GATE_STATE||window.__GMFQ_BOOTSTRAP_ERROR,null,{timeout:120000});
            const out=await page.evaluate(()=>{
              const clone=x=>{try{return JSON.parse(JSON.stringify(x))}catch{return null}};
              const ccys=['USD','EUR','GBP','JPY','CHF','AUD','NZD','CAD'];
              const pairs=[]; for(let i=0;i<ccys.length;i++) for(let j=i+1;j<ccys.length;j++) pairs.push(`${ccys[i]}/${ccys[j]}`);
              const gate=clone(window.__GMFQ_PRICE_FRESHNESS_GATE_STATE);
              const guardedCurrency=window.deriveCurrencyState;
              const guardedPair=window.derivePairDecisionFrame;
              const originalCurrency=guardedCurrency?.__gmfqOriginal;
              const originalPair=guardedPair?.__gmfqOriginal;
              const currencies=Object.fromEntries(ccys.map(c=>[c,clone(guardedCurrency(c))]));
              const pairsNow=Object.fromEntries(pairs.map(p=>[p,clone(guardedPair(p))]));
              const currenciesBefore=typeof originalCurrency==='function'?Object.fromEntries(ccys.map(c=>[c,clone(originalCurrency(c))])):{};
              const pairsBefore=typeof originalPair==='function'?Object.fromEntries(pairs.map(p=>[p,clone(originalPair(p))])):{};
              const currencyFailures=Object.entries(currencies).filter(([c,s])=>s?.price!==0||s?.confirmation!=='PREZZO NON RISOLUTIVO'||s?.priceFreshness?.status!=='WITHHELD_STALE').map(([c,s])=>({c,s}));
              const pairFailures=Object.entries(pairsNow).filter(([p,f])=>f?.priceReading!=='PREZZO NON RISOLUTIVO'||f?.priceFreshness?.status!=='WITHHELD_STALE').map(([p,f])=>({p,f}));
              const currencyCoreDiffs=[];
              for(const c of ccys){
                const a=currenciesBefore[c]||{},b=currencies[c]||{};
                const before={base:a.base,macro:a.macro,policy:a.policy,policyContext:a.policyContext,liq:a.liq,driver:a.driver};
                const after={base:b.base,macro:b.macro,policy:b.policy,policyContext:b.policyContext,liq:b.liq,driver:b.driver};
                if(JSON.stringify(before)!==JSON.stringify(after)) currencyCoreDiffs.push({c,before,after});
              }
              const structuralDiffs=[];
              for(const p of pairs){
                const a=pairsBefore[p]||{},b=pairsNow[p]||{};
                const before={fav:a.fav,quality:a.quality,setup:a.setup,structural:a.structural,macroSide:a.macroSide,policySide:a.policySide};
                const after={fav:b.fav,quality:b.quality,setup:b.setup,structural:b.structural,macroSide:b.macroSide,policySide:b.policySide};
                if(JSON.stringify(before)!==JSON.stringify(after)) structuralDiffs.push({p,before,after});
              }
              const romeParts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Rome',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
              const romeMap=Object.fromEntries(romeParts.filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
              const currentRomeDate=`${romeMap.year}-${romeMap.month}-${romeMap.day}`;
              return {gate,currentRomeDate,currencies,pairsNow,currenciesBefore,pairsBefore,currencyFailures,pairFailures,currencyCoreDiffs,structuralDiffs,ecbAudit:clone(window.GMFQ_ECB_PRICE_AUDIT),bootstrapError:window.__GMFQ_BOOTSTRAP_ERROR||null};
            });
            await browser.close();
            fs.writeFileSync('price-freshness-gate-audit.json',JSON.stringify({schema:'GMFQ_PRICE_FRESHNESS_GATE_AUDIT_V2',...out,consoleErrors:errors},null,2));
            console.log(JSON.stringify({gate:out.gate,currentRomeDate:out.currentRomeDate,currencyFailures:out.currencyFailures.length,pairFailures:out.pairFailures.length,currencyCoreDiffs:out.currencyCoreDiffs.length,structuralDiffs:out.structuralDiffs.length,ecbAsOf:out.ecbAudit?.as_of,ecbPairCount:out.ecbAudit?.pair_count,exampleEUR:out.currencies.EUR,exampleCAD:out.currencies.CAD,exampleUSDEUR:out.pairsNow['USD/EUR']},null,2));
            if(out.bootstrapError) throw new Error(out.bootstrapError);
            if(errors.length) throw new Error('Browser errors: '+errors.join(' | '));
            if(out.gate?.status!=='PASS_WITHHELD_STALE_PRICE') throw new Error('Price gate did not withhold stale snapshot: '+JSON.stringify(out.gate));
            if(out.gate?.reference_asof!==out.currentRomeDate) throw new Error('Price gate reference date is not current Europe/Rome date: '+JSON.stringify({gate:out.gate,currentRomeDate:out.currentRomeDate}));
            if(out.gate?.business_lag==null||out.gate.business_lag<=1) throw new Error('Price business lag not stale: '+JSON.stringify(out.gate));
            if(out.currencyFailures.length) throw new Error('Currency Price failures: '+JSON.stringify(out.currencyFailures));
            if(out.pairFailures.length) throw new Error('Pair Price failures: '+JSON.stringify(out.pairFailures));
            if(out.currencyCoreDiffs.length) throw new Error('Currency structural core changed: '+JSON.stringify(out.currencyCoreDiffs));
            if(out.structuralDiffs.length) throw new Error('Pair structural fields changed: '+JSON.stringify(out.structuralDiffs));
            if(out.ecbAudit?.as_of!=='2026-09-30'||out.ecbAudit?.pair_count!==28) throw new Error('Underlying ECB Price audit mutated: '+JSON.stringify(out.ecbAudit));
          })().catch(e=>{console.error('::error title=Price freshness gate audit::'+String(e.stack||e));process.exit(1)});
          EOF
          node price-gate-audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-freshness-gate-audit-v1
          path: |
            price-freshness-gate-audit.json
            /tmp/gmfq-price-gate-server.log
