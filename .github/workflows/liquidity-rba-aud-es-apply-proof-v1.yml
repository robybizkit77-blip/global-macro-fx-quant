name: Liquidity RBA AUD ES Apply Proof V1

on:
  push:
    branches:
      - release-candidate-daily-data-orchestrator-v1-2026-10-12
    paths:
      - 'validation/fetch_rba_aud_es_balances_candidate.py'
      - 'validation/apply_rba_aud_es_balances_candidate.py'
      - '.github/workflows/liquidity-rba-aud-es-apply-proof-v1.yml'
      - 'validation/liquidity/LIQUIDITY_SOURCE_POLICY_V1_2026-10-12.json'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-controlled-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot tracked runtime hash
        run: sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/runtime.before.sha256
      - name: Collect official RBA candidate
        run: python validation/fetch_rba_aud_es_balances_candidate.py --out /tmp/aud-es-candidate.json
      - name: Dry-run controlled apply
        run: |
          python validation/apply_rba_aud_es_balances_candidate.py --candidate /tmp/aud-es-candidate.json > /tmp/aud-es-dry-run.json
          cat /tmp/aud-es-dry-run.json
      - name: Ephemeral apply on runtime copy
        run: |
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/NATIVE_LIQ_DATA.json
          python validation/apply_rba_aud_es_balances_candidate.py --candidate /tmp/aud-es-candidate.json --runtime /tmp/NATIVE_LIQ_DATA.json --apply > /tmp/aud-es-apply.json
          cat /tmp/aud-es-apply.json
      - name: Verify weekly append-only semantics
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          c=json.loads(Path('/tmp/aud-es-candidate.json').read_text())
          r=json.loads(Path('/tmp/aud-es-apply.json').read_text())
          o=json.loads(Path('live_data/sections/NATIVE_LIQ_DATA.json').read_text())['AUD']['liquidity']
          a=json.loads(Path('/tmp/NATIVE_LIQ_DATA.json').read_text())['AUD']['liquidity']
          assert c['proof']['runtime_last_matches_official'] is True
          assert c['proof']['recent_20_exact'] is True
          assert c['source']['series_id']=='AESAT'
          assert c['snapshot_contract']['runtime_frequency']=='WEEKLY_SNAPSHOT'
          assert c['snapshot_contract']['interpolation_allowed'] is False
          assert r['schema']=='GMFQ_LIQUIDITY_AUD_ES_BALANCES_APPLY_RECEIPT_V1'
          assert r['publication_performed'] is False
          n=len(o['dates'])
          assert a['dates'][:n]==o['dates']
          assert a['values'][:n]==o['values']
          assert len(a['dates'])==len(a['values'])==n+r['appended_observations']
          if c['candidate_update_available']:
              assert r['status']=='UPDATE_AVAILABLE' and r['applied'] is True
              assert a['last_date']==c['latest_eligible_snapshot_date']
              assert float(a['last_value'])==float(c['latest_eligible_snapshot_value'])
              wd=c['snapshot_contract']['weekday']
              for d in a['dates'][n:]:
                  assert datetime.strptime(d,'%Y-%m-%d').date().weekday()==wd
          else:
              assert r['status']=='NO_CHANGE' and r['applied'] is False
          PY
      - name: Verify tracked runtime was not mutated
        run: |
          sha256sum -c /tmp/runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Summary
        run: |
          echo 'AUD ES official provenance + weekly append-only controlled apply proof: GREEN'
          echo 'Tracked runtime mutation: NONE'
          echo 'Publication: NONE'
