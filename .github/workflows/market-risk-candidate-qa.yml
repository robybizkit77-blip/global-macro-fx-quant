name: Market Risk Candidate QA
on:
  pull_request:
    paths:
      - 'validation/build_market_risk_candidate.py'
      - 'tests/website_v1/test_market_risk_candidate.py'
      - '.github/workflows/market-risk-candidate-qa.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test isolated feed parser and freshness
        run: python tests/website_v1/test_market_risk_candidate.py
      - name: Probe real VIX and WTI sources (candidate only)
        run: |
          python validation/build_market_risk_candidate.py --output /tmp/market-risk-candidate.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/market-risk-candidate.json'))
          for name,entry in p['instruments'].items():
              print(name,entry['status'],entry.get('date','—'),entry.get('reason',''))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-risk-source-probe
          path: /tmp/market-risk-candidate.json
          if-no-files-found: warn
