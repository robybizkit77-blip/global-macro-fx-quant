name: Macro Data Integrity Audit

on:
  push:
    branches: [staging-backtest-canonical-core-2026-10-01]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install browser
        run: npm init -y >/dev/null 2>&1 && npm install --save-dev playwright
      - name: Audit macro and rates series
        run: |
          cat > data-audit.js <<'EOF'
          const {chromium}=require('playwright');
          const {execSync,spawn}=require('child_process');
          (async()=>{
            const srv=spawn('python3',['-m','http.server','8765'],{stdio:'ignore'});
            await new Promise(r=>setTimeout(r,1000));
            const cp=execSync('command -v google-chrome-stable || command -v google-chrome || command -v chromium').toString().trim();
            const browser=await chromium.launch({headless:true,executablePath:cp,args:['--no-sandbox']});
            const page=await browser.newPage();
            await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'networkidle',timeout:120000});
            const out=await page.evaluate(()=>{
              const ccys=['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];
              const parseKey=(v)=>{
                const s=String(v||'');
                let m=s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
                if(m)return Number(m[1])*10000+Number(m[2])*100+Number(m[3]);
                m=s.match(/^(\d{4})-(\d{2})$/);
                if(m)return Number(m[1])*10000+Number(m[2])*100+1;
                m=s.match(/^(\d{4})-?Q([1-4])$/i);
                if(m)return Number(m[1])*10000+(Number(m[2])*3)*100+1;
                m=s.match(/^(\d{4})-W(\d{2})$/i);
                if(m)return Number(m[1])*1000+Number(m[2]);
                const months={Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
                m=s.match(/^([A-Z][a-z]{2})-(\d{2})$/);
                if(m&&months[m[1]])return (2000+Number(m[2]))*10000+months[m[1]]*100+1;
                const t=Date.parse(s);
                return Number.isFinite(t)?t:null;
              };
              const rows=[];
              for(const c of ccys){
                for(const x of (S?.[c]||[])){
                  if(!['Crescita','Lavoro','Rates'].includes(x.category))continue;
                  const ds=x.dates||[], vs=x.values||[];
                  const keys=ds.map(parseKey);
                  let nonmono=0,dups=0,unparsed=0;
                  const seen=new Set();
                  keys.forEach((k,i)=>{
                    if(k==null){unparsed++;return;}
                    if(seen.has(k))dups++; else seen.add(k);
                    if(i>0&&keys[i-1]!=null&&k<keys[i-1])nonmono++;
                  });
                  rows.push({c,category:x.category,label:x.label,n:ds.length,lengthMatch:ds.length===vs.length,unparsed,dups,nonmono,lastDate:ds.at(-1)||null,lastValue:vs.at(-1)??null});
                }
              }
              const critical=rows.filter(x=>!x.lengthMatch||x.dups||x.nonmono||x.unparsed);
              const jy=rate2YSeries('JPY');
              return {
                rows,critical,
                jpy2y:{
                  lastDates:(jy?.dates||[]).slice(-20),
                  lastValues:(jy?.values||[]).slice(-20),
                  lastDate:jy?.last_date||jy?.dates?.at(-1)||null,
                  lastValue:jy?.last_value??jy?.values?.at(-1)??null,
                  dynamics:currencyDynamics('JPY')?.rates||null,
                  state:deriveCurrencyState('JPY')||null
                }
              };
            });
            console.log('===DATA_AUDIT_START===');
            console.log(JSON.stringify(out,null,2));
            console.log('===DATA_AUDIT_END===');
            await browser.close(); srv.kill();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node data-audit.js
