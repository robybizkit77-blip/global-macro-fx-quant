name: Materialize GBP BoE OIS 2Y V1
on:
  push:
    branches: [audit-minimum-robust-pit-dataset-2026-10-06]
    paths:
      - 'validation/materialize_gbp_boe_ois_2y_v1.py'
      - '.github/workflows/materialize-gbp-boe-ois-2y-v1.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-minimum-robust-pit-dataset-2026-10-06
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook readers
        run: pip install -q pandas openpyxl
      - name: Materialize official BoE OIS 2Y
        run: python validation/materialize_gbp_boe_ois_2y_v1.py
      - name: Confirm engine and live data untouched
        run: git diff --exit-code -- engine live_data
      - name: Commit PIT evidence only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add history/pit_v1/GBP_BOE_OIS_SPOT_2Y_DAILY_2018_2026.csv validation/GBP_BOE_OIS_2Y_MATERIALIZATION_2026-10-06.json
          git diff --cached --quiet || git commit -m "Materialize GBP BoE OIS 2Y history"
          git push
