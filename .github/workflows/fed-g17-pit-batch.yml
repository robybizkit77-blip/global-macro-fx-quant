name: Fed G17 PIT Batch

on:
  push:
    branches:
      - engine-freeze-v1-2026-10-02
    paths:
      - 'validation/extract_fed_g17_pit.py'
      - '.github/workflows/fed-g17-pit-batch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engine-freeze-v1-2026-10-02
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract Fed G17 first-release PIT panel
        run: python validation/extract_fed_g17_pit.py
      - name: Commit Fed PIT panel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/pit_batch/fed_g17/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Materialize Fed G17 industrial production PIT batch"
            git push origin HEAD:engine-freeze-v1-2026-10-02
          fi
