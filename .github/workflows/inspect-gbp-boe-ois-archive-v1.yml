name: Inspect GBP BoE OIS Archive V1
on:
  push:
    branches: [audit-minimum-robust-pit-dataset-2026-10-06]
    paths:
      - 'validation/inspect_gbp_boe_ois_archive_v1.py'
      - '.github/workflows/inspect-gbp-boe-ois-archive-v1.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-minimum-robust-pit-dataset-2026-10-06
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook readers
        run: pip install -q pandas openpyxl xlrd
      - name: Inspect official BoE OIS archive
        run: python validation/inspect_gbp_boe_ois_archive_v1.py
      - name: Confirm engine and live data untouched
        run: git diff --exit-code -- engine live_data
      - name: Commit inspection evidence only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/GBP_BOE_OIS_ARCHIVE_INSPECTION_2026-10-06.json
          git diff --cached --quiet || git commit -m "Add BoE OIS archive inspection evidence"
          git push
