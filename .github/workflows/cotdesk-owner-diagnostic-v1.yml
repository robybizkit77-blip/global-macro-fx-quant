name: COT Desk Owner Diagnostic V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cotdesk-owner-diagnostic-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start dashboard
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/cotdesk-owner-diagnostic-server.log 2>&1 &
          sleep 2
      - name: Inspect COT Desk live bindings
        run: |
          cat > cotdesk-owner-diagnostic.js <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1100}});
            const consoleErrors=[],pageErrors=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.settled_after_cad_chain===true,null,{timeout:120000});
            await page.evaluate(()=>window.showView?.('cot'));
            await page.waitForTimeout(350);
            const initial=await page.evaluate(()=>{
              const norm=s=>String(s||'').replace(/\s+/g,' ').trim();
              const root=document.getElementById('cot');
              const buttons=[...root.querySelectorAll('button')].slice(0,80).map((x,i)=>({i,text:norm(x.innerText),id:x.id||null,cls:x.className||null,attrs:Object.fromEntries([...x.attributes].map(a=>[a.name,a.value]))}));
              const elements=[...root.querySelectorAll('*')].filter(x=>x.id||/cot|position|net|percent|currency|country/i.test(String(x.className||''))).slice(0,260).map(x=>({tag:x.tagName,id:x.id||null,cls:typeof x.className==='string'?x.className:null,text:norm(x.innerText).slice(0,240),attrs:Object.fromEntries([...x.attributes].filter(a=>/^data-/.test(a.name)).map(a=>[a.name,a.value]))}));
              const globals=Object.keys(window).filter(k=>/cot|position|cftc|percentile/i.test(k)).sort().slice(0,350);
              const functions={};
              for(const k of globals){if(typeof window[k]==='function'){try{functions[k]=String(window[k]).slice(0,12000)}catch(e){}}}
              const probes={};
              for(const k of globals){if(/integrity|audit|coverage|state|series/i.test(k)&&typeof window[k]==='function'){try{const v=window[k]();if(v!==undefined)probes[k]=v}catch(e){probes[k]={error:String(e)}}}}
              const dataKeys=Object.keys(window.__GMFQ_DATA||{}).filter(k=>/COT|POSITION|CFTC/i.test(k)).sort();
              const data={}; for(const k of dataKeys){const v=window.__GMFQ_DATA[k];data[k]=Array.isArray(v)?{type:'array',length:v.length,sample:v.slice(0,3)}:{type:typeof v,keys:v&&typeof v==='object'?Object.keys(v).slice(0,60):null,sample:v&&typeof v==='object'?Object.fromEntries(Object.entries(v).slice(0,2)):null};}
              const d=window.__GMFQ_DATA?.D||window.D||null;
              return {schema:'GMFQ_COTDESK_OWNER_DIAGNOSTIC_V1',text:norm(root?.innerText).slice(0,8000),buttons,elements,globals,functions,probes,dataKeys,data,dCot:d?.cot||null,health:typeof window.productionHealthCheck==='function'?window.productionHealthCheck():null};
            });
            const snapshots=[];
            for(const wanted of ['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD']){
              const clicked=await page.evaluate(w=>{const r=document.getElementById('cot');const b=[...r.querySelectorAll('button')].find(x=>String(x.innerText||'').trim().startsWith(w)||x.dataset?.c===w||x.dataset?.ccy===w||x.dataset?.currency===w);if(!b)return false;b.click();return true;},wanted);
              await page.waitForTimeout(140);
              const text=await page.evaluate(()=>String(document.getElementById('cot')?.innerText||'').replace(/\s+/g,' ').trim().slice(0,1800));
              snapshots.push({wanted,clicked,text});
            }
            const out={...initial,snapshots}; console.log(JSON.stringify(out,null,2));
            if(!initial.text) throw new Error('COT Desk empty');
            if(initial.buttons.length<8) throw new Error('COT Desk selector has fewer than 8 buttons');
            if(snapshots.some(x=>!x.clicked)) throw new Error('COT Desk selector click failed');
            for(const s of snapshots){if(!s.text.includes(s.wanted)) throw new Error('COT Desk selection did not render '+s.wanted);}
            const runtimeErr=/\b[A-Za-z_$][\w$]*\s+is\s+not\s+defined\b|ReferenceError/i;
            if(consoleErrors.some(x=>runtimeErr.test(x))||pageErrors.some(x=>runtimeErr.test(x))) throw new Error('Runtime scope error: '+consoleErrors.concat(pageErrors).join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node cotdesk-owner-diagnostic.js | tee /tmp/cotdesk-owner-diagnostic.json
      - uses: actions/upload-artifact@v4
        with:
          name: cotdesk-owner-diagnostic-v1
          path: |
            /tmp/cotdesk-owner-diagnostic.json
            /tmp/cotdesk-owner-diagnostic-server.log
          if-no-files-found: error
