name: Overview UI Polish Gate

on:
  push:
    branches: [staging-overview-ui-polish-2026-10-01]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: npm init -y >/dev/null 2>&1 && npm install --save-dev playwright
      - name: Verify desktop and mobile
        run: |
          cat > verify.js <<'EOF'
          const {chromium}=require('playwright');
          const {execSync,spawn}=require('child_process');
          (async()=>{
            const srv=spawn('python3',['-m','http.server','8765'],{stdio:'ignore'});
            await new Promise(r=>setTimeout(r,1000));
            const cp=execSync('command -v google-chrome-stable || command -v google-chrome || command -v chromium').toString().trim();
            const browser=await chromium.launch({headless:true,executablePath:cp,args:['--no-sandbox']});
            const errors=[];
            async function check(name,viewport,path){
              const page=await browser.newPage({viewport});
              page.on('pageerror',e=>errors.push(name+': '+String(e)));
              await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'networkidle',timeout:120000});
              await page.waitForTimeout(2500);
              const out=await page.evaluate(()=>{
                const host=document.querySelector('#overview .gmfqOverviewExecutive');
                const rect=host?.getBoundingClientRect();
                const html=document.documentElement;
                const fwd=typeof forwardValidationSummary==='function'?forwardValidationSummary():null;
                const health=typeof productionHealthCheck==='function'?productionHealthCheck():null;
                const boxes=[...document.querySelectorAll('#overview .gmfqStateBox')];
                return {
                  fingerprint:fwd?.current_rules_fingerprint||null,
                  pair_count:(D?.pairs||[]).length,
                  panels:host?.querySelectorAll('.gmfqReportPanel').length||0,
                  state_boxes:boxes.length,
                  has_color:boxes.some(b=>getComputedStyle(b).borderColor!=='rgba(143, 167, 181, 0.18)'),
                  overflow_x:Math.max(html.scrollWidth,document.body.scrollWidth)-window.innerWidth, offenders:[...document.querySelectorAll('body *')].map(el=>{const r=el.getBoundingClientRect();return {tag:el.tagName,cls:String(el.className||'').slice(0,100),id:el.id||'',text:String(el.textContent||'').trim().slice(0,60),parent_tag:el.parentElement?.tagName||'',parent_cls:String(el.parentElement?.className||'').slice(0,120),parent_id:el.parentElement?.id||'',left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width)}}).filter(x=>x.right>window.innerWidth+2||x.left<-2).sort((a,b)=>Math.max(b.right-window.innerWidth,-b.left)-Math.max(a.right-window.innerWidth,-a.left)).slice(0,12),
                  host_width:rect?.width||0,
                  hard_errors:health?.hard_errors||[]
                };
              });
              await page.screenshot({path,fullPage:false});
              await page.close();
              return out;
            }
            const desktop=await check('desktop',{width:1600,height:1000},'overview-ui-desktop.png');
            const mobile=await check('mobile',{width:390,height:844},'overview-ui-mobile.png');
            await browser.close();srv.kill();
            const issues=[];
            for(const [name,out] of Object.entries({desktop,mobile})){
              if(out.fingerprint!=='3356baf0')issues.push(name+' fingerprint '+out.fingerprint);
              if(out.pair_count!==28)issues.push(name+' pair_count '+out.pair_count);
              if(out.panels!==3||out.state_boxes!==4)issues.push(name+' layout '+JSON.stringify(out));
              if(!out.has_color)issues.push(name+' color hierarchy missing');
              if(out.overflow_x>2)issues.push(name+' horizontal overflow '+out.overflow_x);
              if(out.hard_errors.length)issues.push(name+' hard_errors '+JSON.stringify(out.hard_errors));
            }
            if(errors.length)issues.push('JS errors '+JSON.stringify(errors));
            console.log(JSON.stringify({status:issues.length?'FAIL':'PASS',desktop,mobile,issues},null,2));
            if(issues.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node verify.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overview-ui-polish-preview
          path: |
            overview-ui-desktop.png
            overview-ui-mobile.png
