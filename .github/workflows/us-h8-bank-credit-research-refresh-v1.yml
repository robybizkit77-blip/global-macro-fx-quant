name: US Fed H8 Bank Credit Research Refresh V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/liquidity/refresh_us_h8_bank_credit_fred_v1.py'
      - 'validation/liquidity/test_refresh_us_h8_bank_credit_fred_v1.py'
      - '.github/workflows/us-h8-bank-credit-research-refresh-v1.yml'
  workflow_dispatch:
  schedule:
    # Check the weekly H.8 and quarterly SLOOS sources on weekdays.
    - cron: '51 6 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'validation/liquidity/refresh_us_h8_bank_credit_fred_v1.py'
      - 'validation/liquidity/test_refresh_us_h8_bank_credit_fred_v1.py'
      - '.github/workflows/us-h8-bank-credit-research-refresh-v1.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: us-fed-h8-bank-credit-research-v1
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate H8, SLOOS and M2 offline and probe live M2
        run: |
          python -m unittest validation.liquidity.test_refresh_us_h8_bank_credit_fred_v1 -v
          python - <<'PY'
          from datetime import date
          from validation.liquidity.refresh_us_h8_bank_credit_fred_v1 import fetch,parse_m2,M2_API
          data=parse_m2(fetch(M2_API),today=date.today())
          print('M2_LIVE_SOURCE_PASS',data['latest_observation'],data['values'][-1])
          PY
  source-only:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Fed series identity, cadence and research publication
        run: python -m unittest validation.liquidity.test_refresh_us_h8_bank_credit_fred_v1 -v
      - name: Snapshot canonical liquidity and FX ranking
        run: |
          sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/h8-runtime.before
          sha256sum live_data/sections/PAIR_SETUP_OPERATIONAL_VIEW.json > /tmp/h8-fx.before
      - name: Collect Fed H8 bank credit, SLOOS and M2 via FRED
        run: |
          python validation/liquidity/refresh_us_h8_bank_credit_fred_v1.py \
            --apply --receipt /tmp/us-h8-fred-receipt.json
          cat /tmp/us-h8-fred-receipt.json >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce zero canonical writes and exact publication scope
        run: |
          sha256sum -c /tmp/h8-runtime.before /tmp/h8-fx.before
          python - <<'PY'
          import subprocess
          whitelist={'site/fx-quant-v2/next/us-h8-bank-credit-research-v1.js'}
          diff=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert diff<=whitelist,diff
          print('US_H8_RESEARCH_ONLY_SOURCE_DIFF_PASS',sorted(diff))
          PY
      - name: Persist only updated research sidecar on main
        run: |
          set -euo pipefail
          path=site/fx-quant-v2/next/us-h8-bank-credit-research-v1.js
          if git diff --quiet -- "$path"; then
            echo "US_H8_OFFICIAL_NO_CHANGE" >> "$GITHUB_STEP_SUMMARY"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "$path"
            git commit -m "Refresh Fed H8 bank credit source (research only)"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            echo "US_H8_RESEARCH_ONLY_PERSISTED" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Mirror scoped H8 source sidecar to GitHub Pages with lease
        id: pages-sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=site/fx-quant-v2/next/us-h8-bank-credit-research-v1.js
          git fetch origin main --no-tags
          local_source="$(git hash-object "$path")"
          test "$(git rev-parse "origin/main:$path")" = "$local_source" || {
            echo 'US_H8_SOURCE_BLOB_CHANGED_WITHHELD'; exit 1;
          }
          git fetch origin gh-pages --no-tags
          remote_pages="$(git rev-parse origin/gh-pages)"
          git worktree add --detach /tmp/h8-credit-pages origin/gh-pages
          mkdir -p /tmp/h8-credit-pages/site/fx-quant-v2/next
          cp "$path" "/tmp/h8-credit-pages/$path"
          cd /tmp/h8-credit-pages
          if git diff --quiet -- "$path"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "US_H8_PAGES_ALREADY_CURRENT" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$(git diff --name-only)" = "$path"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$path"
          git commit -m 'Mirror verified Fed H8 source research only'
          test "$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')" = "$remote_pages" || {
            echo 'US_H8_PAGES_BRANCH_MOVED_WITHHELD'; exit 1;
          }
          git fetch origin main --no-tags
          test "$(git rev-parse "origin/main:$path")" = "$local_source" || {
            echo 'US_H8_REMOTE_SOURCE_CHANGED_WITHHELD'; exit 1;
          }
          git push --force-with-lease=refs/heads/gh-pages:$remote_pages origin HEAD:gh-pages
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "US_H8_PAGES_SOURCE_MIRRORED" >> "$GITHUB_STEP_SUMMARY"
      - name: Queue explicit Pages build if H8 source mirrored
        if: steps.pages-sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          output="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds")"
          jq -e '.status == "queued" or .status == "building"' <<<"$output" >/dev/null
          echo "US_H8_PAGES_BUILD_REQUEST_ACCEPTED" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-fed-h8-credit-official-source-receipt
          path: /tmp/us-h8-fred-receipt.json
          if-no-files-found: warn
          retention-days: 14
