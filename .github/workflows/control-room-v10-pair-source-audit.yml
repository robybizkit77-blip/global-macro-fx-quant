name: Control Room v10 Pair Source Coverage Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/audit_control_room_pair_coverage_v1.py'
      - 'validation/test_control_room_pair_coverage_v1.py'
      - '.github/workflows/control-room-v10-pair-source-audit.yml'
      - 'live_data/sections/PAIR_SETUP_OPERATIONAL_VIEW.json'
      - 'live_data/sections/ECB_G8_PRICE_HISTORY.json'
      - 'live_data/sections/NATIVE_RATES_DATA.json'
      - 'live_data/sections/OIS_OPERATIONAL_VIEW.json'
      - 'live_data/sections/V250_COT_CHART_DATA.json'
      - 'live_data/sections/D.json'
  push:
    branches: [main]
    paths:
      - 'validation/audit_control_room_pair_coverage_v1.py'
      - 'validation/test_control_room_pair_coverage_v1.py'
      - '.github/workflows/control-room-v10-pair-source-audit.yml'
      - 'live_data/sections/PAIR_SETUP_OPERATIONAL_VIEW.json'
      - 'live_data/sections/ECB_G8_PRICE_HISTORY.json'
      - 'live_data/sections/NATIVE_RATES_DATA.json'
      - 'live_data/sections/OIS_OPERATIONAL_VIEW.json'
      - 'live_data/sections/V250_COT_CHART_DATA.json'
      - 'live_data/sections/D.json'
  workflow_run:
    workflows:
      - 'Price History Persistent Daily V1'
      - 'Rates Persistent Daily V1'
      - 'COT Persistent Weekly V1'
      - 'Pair Setup Operational View V1'
      - 'CB Pricing Persistent Daily V1'
    types: [completed]
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-room-v10-pair-source-audit
  cancel-in-progress: false

jobs:
  source-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check fail-closed source-coverage contract
        run: python -m unittest validation.test_control_room_pair_coverage_v1 -v
      - name: Audit all 28 canonical pairs (do not promote stale or estimated feeds)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gmfq-pair-audit
          python validation/audit_control_room_pair_coverage_v1.py \
            --out /tmp/gmfq-pair-audit/coverage.json \
            --markdown /tmp/gmfq-pair-audit/summary.md
          cat /tmp/gmfq-pair-audit/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo 'INTEGRITY_PASS_DOES_NOT_MEAN_ALL_FEEDS_CURRENT'
      - name: Preserve dated coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-room-v10-pair-source-audit
          path: /tmp/gmfq-pair-audit/
          if-no-files-found: warn
          retention-days: 30
