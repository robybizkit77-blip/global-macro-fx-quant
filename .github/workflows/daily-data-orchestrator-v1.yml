name: Daily Data Orchestrator V1

on:
  push:
    branches:
      - validation-daily-data-orchestrator-v1-2026-10-12
      - release-candidate-daily-data-orchestrator-v1-2026-10-12
  pull_request:
    branches:
      - release-candidate-freshness-registry-v1-2026-10-12
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-data-orchestrator-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Freshness Registry schema
        run: python3 validation/check_freshness_registry.py

      - name: Build fail-closed orchestrator receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/daily-orchestrator-v1
          python3 validation/run_daily_data_orchestrator_v1.py | tee /tmp/daily-orchestrator-v1/receipt.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/daily-orchestrator-v1/receipt.json'))
          assert d['schema']=='GMFQ_DAILY_DATA_ORCHESTRATOR_RECEIPT_V1', d
          assert d['promotion_performed'] is False, d
          assert d['live_data_published'] is False, d
          assert d['gh_pages_published'] is False, d
          assert d['automatic_publication'] is False, d
          assert d['lanes']['RISK']['guard_proven'] is True, d['lanes']['RISK']
          print('DAILY_ORCHESTRATOR_FAIL_CLOSED_PASS', d['blocking_lanes'])
          PY

      - name: Probe Risk official sources
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/fetch_cboe_vix_candidate.py | tee /tmp/daily-orchestrator-v1/risk-vix.log
          python3 validation/fetch_eia_brent_probe.py | tee /tmp/daily-orchestrator-v1/risk-brent.log
          python3 - <<'PY'
          import json
          v=json.load(open('validation/risk-vix-candidate.json'))
          b=json.load(open('validation/risk-brent-probe.json'))
          assert v['status']=='GREEN_SOURCE_CANDIDATE_ONLY', v
          assert v['business_day_lag'] <= 1, v
          assert b['status']=='WITHHELD_OFFICIAL_SOURCE_TOO_SLOW_FOR_GATE', b
          assert b['business_day_lag'] > b['max_business_day_lag'], b
          assert not v['runtime_mutated'] and not v['publication_performed']
          assert not b['runtime_mutated'] and not b['publication_performed']
          print('RISK_FAIL_CLOSED_PASS')
          PY

      - name: Prove base Liquidity controlled applies on copies
        shell: bash
        run: |
          set -euo pipefail
          sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/daily-orchestrator-v1/liq.before.sha256

          python3 validation/fetch_boc_cad_m2pp_candidate.py >/tmp/daily-orchestrator-v1/cad.log
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/daily-orchestrator-v1/liq-cad.json
          python3 validation/apply_boc_cad_m2pp_candidate.py --candidate validation/liquidity-cad-m2pp-candidate.json --runtime /tmp/daily-orchestrator-v1/liq-cad.json --apply >/tmp/daily-orchestrator-v1/cad-apply.json

          python3 validation/fetch_ecb_eur_excess_liquidity_candidate.py >/tmp/daily-orchestrator-v1/eur.log

          python3 validation/fetch_fed_usd_m2_candidate.py >/tmp/daily-orchestrator-v1/usd.log
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/daily-orchestrator-v1/liq-usd.json
          python3 validation/apply_fed_usd_m2_candidate.py --candidate validation/liquidity-usd-m2-candidate.json --runtime /tmp/daily-orchestrator-v1/liq-usd.json --apply >/tmp/daily-orchestrator-v1/usd-apply.json

          python3 validation/fetch_boe_gbp_liquidity_candidates.py >/tmp/daily-orchestrator-v1/gbp.log
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/daily-orchestrator-v1/liq-gbp.json
          python3 validation/apply_boe_gbp_liquidity_candidates.py --candidate validation/liquidity-gbp-boe-candidates.json --runtime /tmp/daily-orchestrator-v1/liq-gbp.json --apply >/tmp/daily-orchestrator-v1/gbp-apply.json

          python3 validation/fetch_boj_jpy_bank_credit_candidate.py >/tmp/daily-orchestrator-v1/jpy.log
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/daily-orchestrator-v1/liq-jpy.json
          python3 validation/apply_boj_jpy_bank_credit_candidate.py --candidate validation/liquidity-jpy-bank-credit-candidate.json --runtime /tmp/daily-orchestrator-v1/liq-jpy.json --apply >/tmp/daily-orchestrator-v1/jpy-apply.json

          sha256sum -c /tmp/daily-orchestrator-v1/liq.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
          echo LIQUIDITY_CONTROLLED_APPLY_PASS

      - name: Prove Price controlled apply and restore
        shell: bash
        run: |
          set -euo pipefail
          sha256sum payload/part-15.txt > /tmp/daily-orchestrator-v1/price.before.sha256
          python3 validation/fetch_ecb_g8_price_candidate.py --out /tmp/daily-orchestrator-v1/price-candidate.json
          python3 validation/apply_ecb_g8_price_candidate.py --candidate /tmp/daily-orchestrator-v1/price-candidate.json --apply | tee /tmp/daily-orchestrator-v1/price-apply.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/daily-orchestrator-v1/price-apply.json'))
          assert r['schema']=='GMFQ_ECB_G8_PRICE_APPLY_RECEIPT_V1', r
          assert r['status'] in {'UPDATE_AVAILABLE','NO_CHANGE'}, r
          assert r['publication_performed'] is False, r
          PY
          git checkout -- payload/part-15.txt
          sha256sum -c /tmp/daily-orchestrator-v1/price.before.sha256
          echo PRICE_CONTROLLED_APPLY_PASS

      - name: Validate Macro aligned runtime and global manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/build_live_manifest_v2.py --write /tmp/daily-orchestrator-v1/manifest.current.json | tee /tmp/daily-orchestrator-v1/manifest-current.log
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/daily-orchestrator-v1/manifest.current.json'))
          rows={x['key']:x for x in m['sections']}
          for key in ('MACRO_THERMOMETER_DATA','MACRO_SERIES'):
              assert rows[key]['occurrences_in_payload']==1, (key, rows[key])
          assert m['status']=='PASS', m
          print('MACRO_RUNTIME_ALIGNED_PASS')
          PY
          python3 validation/check_live_update_contract.py | tee /tmp/daily-orchestrator-v1/live-contract.log
          python3 validation/rebuild_live_data_runtime.py --verify-only | tee /tmp/daily-orchestrator-v1/runtime-roundtrip.json
          git diff --exit-code -- live_data payload

      - name: Clean generated candidates
        if: always()
        shell: bash
        run: |
          rm -f validation/risk-vix-candidate.json validation/risk-brent-probe.json \
            validation/liquidity-cad-m2pp-candidate.json validation/liquidity-eur-excess-candidate.json \
            validation/liquidity-usd-m2-candidate.json validation/liquidity-gbp-boe-candidates.json \
            validation/liquidity-jpy-bank-credit-candidate.json
          git checkout -- payload/part-15.txt || true
          git diff --exit-code -- live_data payload

      - name: Upload orchestrator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-data-orchestrator-v1-${{ github.run_id }}
          path: /tmp/daily-orchestrator-v1/
          if-no-files-found: error
          retention-days: 30
