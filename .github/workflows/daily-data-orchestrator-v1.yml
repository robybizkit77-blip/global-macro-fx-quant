name: Daily Data Orchestrator V1

on:
  push:
    branches:
      - validation-daily-data-orchestrator-v1-2026-10-12
    paths:
      - '.github/workflows/daily-data-orchestrator-v1.yml'
      - 'validation/run_daily_data_orchestrator_v1.py'
      - 'validation/FRESHNESS_REGISTRY_V1_2026-10-12.json'
      - 'live_data/sections/D.json'
      - 'live_data/sections/RATES_AUDIT_METADATA.json'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
      - 'validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-data-orchestrator-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Freshness Registry schema
        run: python3 validation/check_freshness_registry.py

      - name: Build fail-closed orchestrator receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/daily-orchestrator-v1
          python3 validation/run_daily_data_orchestrator_v1.py | tee /tmp/daily-orchestrator-v1/receipt.json

      - name: Enforce expected current blockers
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/daily-orchestrator-v1/receipt.json'))
          assert d['schema']=='GMFQ_DAILY_DATA_ORCHESTRATOR_RECEIPT_V1', d
          assert d['status']=='BLOCKED_EXPECTED_GAPS_NO_PUBLICATION', d
          expected={'PRICE','LIQUIDITY','RISK'}
          got=set(d['blocking_lanes'])
          assert expected.issubset(got), (expected, got)
          assert d['promotion_performed'] is False
          assert d['live_data_published'] is False
          assert d['gh_pages_published'] is False
          assert d['automatic_publication'] is False
          print('DAILY_ORCHESTRATOR_FAIL_CLOSED_PASS', sorted(got))
          PY

      - name: Diagnose current manifest versus payload and sections
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/build_live_manifest_v2.py --write /tmp/daily-orchestrator-v1/manifest.candidate.json | tee /tmp/daily-orchestrator-v1/manifest-build.json
          python3 validation/rebuild_live_data_runtime.py --verify-only | tee /tmp/daily-orchestrator-v1/runtime-roundtrip.json
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/daily-orchestrator-v1/manifest.candidate.json'))
          rows={x['key']:x for x in m['sections']}
          for key in ('MACRO_THERMOMETER_DATA','MACRO_SERIES'):
              x=rows[key]
              print(key, 'bytes=', x['bytes'], 'payload_occurrences=', x['occurrences_in_payload'], 'part=', x['part'], 'sha256=', x['sha256'])
          if m['status']!='PASS':
              raise SystemExit('candidate manifest cannot be rebuilt cleanly from current payload/sections')
          PY

      - name: Compare tracked manifest with deterministic candidate
        shell: bash
        run: |
          set -euo pipefail
          if cmp -s live_data/manifest.v2.json /tmp/daily-orchestrator-v1/manifest.candidate.json; then
            echo MANIFEST_ALREADY_ALIGNED
          else
            echo MANIFEST_METADATA_STALE
            python3 - <<'PY'
          import json
          old=json.load(open('live_data/manifest.v2.json'))
          new=json.load(open('/tmp/daily-orchestrator-v1/manifest.candidate.json'))
          oldr={x['key']:x for x in old['sections']}; newr={x['key']:x for x in new['sections']}
          changed=[]
          for k in sorted(set(oldr)|set(newr)):
              if oldr.get(k)!=newr.get(k): changed.append(k)
          print('MANIFEST_CHANGED_KEYS', changed)
          if changed != ['MACRO_SERIES','MACRO_THERMOMETER_DATA']:
              raise SystemExit(f'unexpected manifest drift: {changed}')
          PY
          fi

      - name: Prove diagnostic is read-only
        run: git diff --exit-code -- live_data payload

      - name: Upload orchestrator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-data-orchestrator-v1-${{ github.run_id }}
          path: /tmp/daily-orchestrator-v1/
          if-no-files-found: error
          retention-days: 30
