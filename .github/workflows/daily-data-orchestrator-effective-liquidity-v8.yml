name: Daily Data Orchestrator Effective Liquidity V8

on:
  push:
    branches:
      - release-candidate-daily-data-orchestrator-v1-2026-10-12
    paths:
      - 'validation/run_daily_data_orchestrator_effective_v8.py'
      - 'validation/run_daily_data_orchestrator_effective_v7.py'
      - 'validation/liquidity/LIQUIDITY_POLICY_OVERRIDE_EUR_M3_REVISION_AWARE_V1_2026-10-13.json'
      - 'validation/fetch_ecb_eur_m3_revision_aware_candidate.py'
      - 'validation/apply_ecb_eur_m3_revision_aware_candidate.py'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
      - '.github/workflows/daily-data-orchestrator-effective-liquidity-v8.yml'
  pull_request:
    branches:
      - release-candidate-freshness-registry-v1-2026-10-12
    paths:
      - 'validation/run_daily_data_orchestrator_effective_v8.py'
      - 'validation/run_daily_data_orchestrator_effective_v7.py'
      - 'validation/liquidity/LIQUIDITY_POLICY_OVERRIDE_EUR_M3_REVISION_AWARE_V1_2026-10-13.json'
      - 'validation/fetch_ecb_eur_m3_revision_aware_candidate.py'
      - 'validation/apply_ecb_eur_m3_revision_aware_candidate.py'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
      - '.github/workflows/daily-data-orchestrator-effective-liquidity-v8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  effective-liquidity-v8-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot tracked runtime
        run: sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/runtime.before.sha256
      - name: Build effective V8 receipt
        run: |
          python validation/run_daily_data_orchestrator_effective_v8.py > /tmp/effective-v8.json
          cat /tmp/effective-v8.json
      - name: Enforce 20 READY / 6 pending
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/effective-v8.json')); liq=d['lanes']['LIQUIDITY']
          assert liq['automation_ready_subseries']==20 and liq['mapping_pending_subseries']==6, liq
          assert liq['verified_subseries']==20 and liq['unresolved_subseries']==6 and liq['total_subseries']==26, liq
          assert liq['eur_m3_automation_ready'] is True and liq['eur_m3_controlled_apply_proven'] is True, liq
          assert liq['eur_m3_revision_aware_append_only'] is True and liq['eur_m3_real_append_replay_proven'] is True, liq
          assert liq['eur_m3_series_key']=='BSI.M.U2.Y.V.M30.X.1.U2.2300.Z01.E', liq
          assert liq['eur_m3_apply_proof_run_id']==38403997402, liq
          assert liq['eur_m3_official_tail']=={'date':'2026-08','value':17646463.0}, liq
          o=d['effective_liquidity_overlay_v8']
          assert o['ready']==20 and o['pending']==6 and o['total']==26 and o['runtime_mutated'] is False and o['publication_performed'] is False, o
          print('EFFECTIVE_LIQUIDITY_V8_20_6_PASS')
          PY
      - name: Re-prove EUR M3 official append replay
        run: |
          python - <<'PY'
          import json
          src='live_data/sections/NATIVE_LIQ_DATA.json'; out='/tmp/NATIVE_LIQ_DATA.eur-m3-replay.json'
          p=json.load(open(src)); lane=p['EUR']['money']
          assert len(lane['dates'])==len(lane['values']) and len(lane['dates'])>=2, lane
          removed_date=str(lane['dates'][-1]); removed_value=float(lane['values'][-1])
          lane['dates']=lane['dates'][:-1]; lane['values']=lane['values'][:-1]
          if 'last_date' in lane: lane['last_date']=lane['dates'][-1]
          if 'last_value' in lane: lane['last_value']=lane['values'][-1]
          json.dump(p,open(out,'w'),separators=(',',':'))
          open('/tmp/eur-m3-removed.json','w').write(json.dumps({'date':removed_date,'value':removed_value}))
          PY
          python validation/fetch_ecb_eur_m3_revision_aware_candidate.py --runtime /tmp/NATIVE_LIQ_DATA.eur-m3-replay.json --out /tmp/eur-m3-replay-candidate.json
          cp /tmp/NATIVE_LIQ_DATA.eur-m3-replay.json /tmp/NATIVE_LIQ_DATA.eur-m3-applied.json
          python validation/apply_ecb_eur_m3_revision_aware_candidate.py --candidate /tmp/eur-m3-replay-candidate.json --runtime /tmp/NATIVE_LIQ_DATA.eur-m3-applied.json --apply > /tmp/eur-m3-replay-apply.json
          python - <<'PY'
          import json
          before=json.load(open('/tmp/NATIVE_LIQ_DATA.eur-m3-replay.json'))['EUR']['money']
          after=json.load(open('/tmp/NATIVE_LIQ_DATA.eur-m3-applied.json'))['EUR']['money']
          c=json.load(open('/tmp/eur-m3-replay-candidate.json')); r=json.load(open('/tmp/eur-m3-replay-apply.json')); removed=json.load(open('/tmp/eur-m3-removed.json'))
          n=len(before['dates'])
          assert after['dates'][:n]==before['dates'] and after['values'][:n]==before['values'], (before,after)
          assert len(c['new_observations'])==1, c
          obs=c['new_observations'][0]
          assert r['applied'] is True and r['appended_observations']==1 and r['runtime_history_rewritten'] is False, r
          assert str(obs['date'])[:7]==str(removed['date'])[:7]=='2026-08', (obs,removed)
          assert float(obs['value'])==17646463.0, obs
          assert str(after['dates'][-1])[:7]=='2026-08' and float(after['values'][-1])==17646463.0, after
          print('EUR_M3_V8_REAL_APPEND_REPROOF_PASS')
          PY
      - name: Verify tracked runtime unchanged
        run: |
          sha256sum -c /tmp/runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Summary
        run: |
          echo 'Effective Liquidity V8 coverage: 20 READY / 6 pending / 26 total'
          echo 'EUR M3 ECB revision-aware append-only real replay: GREEN'
          echo 'Tracked runtime mutation: NONE'
          echo 'Publication: NONE'
