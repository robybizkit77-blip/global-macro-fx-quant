name: Daily Data Orchestrator Effective Liquidity V1

on:
  push:
    branches:
      - release-candidate-daily-data-orchestrator-v1-2026-10-12
    paths:
      - 'validation/run_daily_data_orchestrator_effective_v1.py'
      - 'validation/run_daily_data_orchestrator_v1.py'
      - 'validation/liquidity/LIQUIDITY_POLICY_OVERRIDE_AUD_ES_V1_2026-10-13.json'
      - 'validation/liquidity/LIQUIDITY_POLICY_OVERRIDE_EUR_M3_V1_2026-10-13.json'
      - 'validation/liquidity/JPY_RESERVE_PROVENANCE_RESOLUTION_2026-10-13.json'
      - 'validation/liquidity/CHF_SIGHT_DEPOSITS_PROVENANCE_RESOLUTION_2026-10-13.json'
      - 'validation/liquidity/CHF_CREDIT_PROVENANCE_RESOLUTION_2026-10-13.json'
      - 'validation/fetch_rba_aud_es_balances_candidate.py'
      - 'validation/apply_rba_aud_es_balances_candidate.py'
      - 'validation/fetch_boe_gbp_liquidity_candidates.py'
      - 'validation/apply_boe_gbp_liquidity_candidates.py'
      - 'validation/fetch_fed_usd_bank_credit_candidate.py'
      - 'validation/diagnose_fed_usd_bank_credit_revision_v1.py'
      - 'validation/diagnose_fed_usd_sloos_conditions_v1.py'
      - 'validation/fetch_fed_usd_sloos_conditions_candidate.py'
      - 'validation/apply_fed_usd_sloos_conditions_candidate.py'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
      - '.github/workflows/daily-data-orchestrator-effective-liquidity-v1.yml'
  pull_request:
    branches:
      - release-candidate-freshness-registry-v1-2026-10-12
    paths:
      - 'validation/run_daily_data_orchestrator_effective_v1.py'
      - 'validation/run_daily_data_orchestrator_v1.py'
      - 'validation/liquidity/LIQUIDITY_POLICY_OVERRIDE_AUD_ES_V1_2026-10-13.json'
      - 'validation/liquidity/LIQUIDITY_POLICY_OVERRIDE_EUR_M3_V1_2026-10-13.json'
      - 'validation/liquidity/JPY_RESERVE_PROVENANCE_RESOLUTION_2026-10-13.json'
      - 'validation/liquidity/CHF_SIGHT_DEPOSITS_PROVENANCE_RESOLUTION_2026-10-13.json'
      - 'validation/liquidity/CHF_CREDIT_PROVENANCE_RESOLUTION_2026-10-13.json'
      - 'validation/fetch_rba_aud_es_balances_candidate.py'
      - 'validation/apply_rba_aud_es_balances_candidate.py'
      - 'validation/fetch_boe_gbp_liquidity_candidates.py'
      - 'validation/apply_boe_gbp_liquidity_candidates.py'
      - 'validation/fetch_fed_usd_bank_credit_candidate.py'
      - 'validation/diagnose_fed_usd_bank_credit_revision_v1.py'
      - 'validation/diagnose_fed_usd_sloos_conditions_v1.py'
      - 'validation/fetch_fed_usd_sloos_conditions_candidate.py'
      - 'validation/apply_fed_usd_sloos_conditions_candidate.py'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
      - '.github/workflows/daily-data-orchestrator-effective-liquidity-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  effective-liquidity-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build effective orchestrator receipt
        run: |
          python validation/run_daily_data_orchestrator_effective_v1.py > /tmp/effective-receipt.json
          cat /tmp/effective-receipt.json
      - name: Enforce 11 READY / 15 pending
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/effective-receipt.json'))
          liq=d['lanes']['LIQUIDITY']
          assert liq['automation_ready_subseries']==11, liq
          assert liq['mapping_pending_subseries']==15, liq
          assert liq['verified_subseries']==11, liq
          assert liq['unresolved_subseries']==15, liq
          assert liq['total_subseries']==26, liq
          assert liq['aud_es_automation_ready'] is True, liq
          assert liq['aud_es_controlled_apply_proven'] is True, liq
          assert liq['aud_es_applier']=='validation/apply_rba_aud_es_balances_candidate.py', liq
          assert d['effective_liquidity_overlay']['ready']==11
          assert d['effective_liquidity_overlay']['pending']==15
          assert d['effective_liquidity_overlay']['runtime_mutated'] is False
          assert d['effective_liquidity_overlay']['publication_performed'] is False
          print('EFFECTIVE_LIQUIDITY_11_15_PASS')
          PY
      - name: Re-prove AUD controlled apply on runtime copy
        run: |
          sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/runtime.before.sha256
          python validation/fetch_rba_aud_es_balances_candidate.py --out /tmp/aud-es.json
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/NATIVE_LIQ_DATA.json
          python validation/apply_rba_aud_es_balances_candidate.py --candidate /tmp/aud-es.json --runtime /tmp/NATIVE_LIQ_DATA.json --apply > /tmp/aud-es-apply.json
          cat /tmp/aud-es-apply.json
          sha256sum -c /tmp/runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Prove GBP controlled apply on runtime copy
        run: |
          sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/gbp-runtime.before.sha256
          python validation/fetch_boe_gbp_liquidity_candidates.py --out /tmp/gbp-boe-candidates.json
          python validation/apply_boe_gbp_liquidity_candidates.py --candidate /tmp/gbp-boe-candidates.json > /tmp/gbp-boe-dry-run.json
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/NATIVE_LIQ_DATA.gbp.json
          python validation/apply_boe_gbp_liquidity_candidates.py --candidate /tmp/gbp-boe-candidates.json --runtime /tmp/NATIVE_LIQ_DATA.gbp.json --apply > /tmp/gbp-boe-apply.json
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/gbp-boe-candidates.json').read_text())
          dry=json.loads(Path('/tmp/gbp-boe-dry-run.json').read_text())
          r=json.loads(Path('/tmp/gbp-boe-apply.json').read_text())
          original=json.loads(Path('live_data/sections/NATIVE_LIQ_DATA.json').read_text())
          applied=json.loads(Path('/tmp/NATIVE_LIQ_DATA.gbp.json').read_text())
          assert c['schema']=='GMFQ_LIQUIDITY_GBP_BOE_CANDIDATES_V1', c
          assert dry['schema']=='GMFQ_LIQUIDITY_GBP_BOE_APPLY_RECEIPT_V1', dry
          assert r['schema']=='GMFQ_LIQUIDITY_GBP_BOE_APPLY_RECEIPT_V1', r
          assert dry['publication_performed'] is False and r['publication_performed'] is False
          assert dry['applied'] is False and r['applied'] is True
          mapping={'GBP.liquidity':'liquidity','GBP.credit':'credit'}
          expected_series={'GBP.liquidity':'RPWB56A','GBP.credit':'LPMVTYI'}
          for key,runtime_key in mapping.items():
              row=c['results'][key]
              assert row['source']['series_id']==expected_series[key], row
              assert row['runtime_match_confirmed'] is True, row
              assert row['latest_date'] >= row['runtime']['last_date'], row
              o=original['GBP'][runtime_key]
              a=applied['GBP'][runtime_key]
              n=len(o['dates'])
              assert a['dates'][:n]==o['dates'], key
              assert a['values'][:n]==o['values'], key
              assert len(a['dates'])==len(a['values'])
              assert len(a['dates'])==n+r['results'][key]['appended_observations'], (key,r['results'][key])
              if row['candidate_update_available']:
                  assert a['last_date']==row['latest_date'], (key,a['last_date'],row['latest_date'])
                  assert float(a['last_value'])==float(row['latest_value']), (key,a['last_value'],row['latest_value'])
              else:
                  assert r['results'][key]['appended_observations']==0, r['results'][key]
          print('GBP_CONTROLLED_APPLY_PROOF_PASS')
          print(json.dumps({'candidates': c['results'], 'receipt': r['results']}, indent=2))
          PY
          sha256sum -c /tmp/gbp-runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Prove Fed SLOOS controlled apply on runtime copy
        run: |
          sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/usd-sloos-runtime.before.sha256
          python validation/fetch_fed_usd_sloos_conditions_candidate.py --out /tmp/usd-sloos.json
          python validation/apply_fed_usd_sloos_conditions_candidate.py --candidate /tmp/usd-sloos.json > /tmp/usd-sloos-dry-run.json
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/NATIVE_LIQ_DATA.usd-sloos.json
          python validation/apply_fed_usd_sloos_conditions_candidate.py --candidate /tmp/usd-sloos.json --runtime /tmp/NATIVE_LIQ_DATA.usd-sloos.json --apply > /tmp/usd-sloos-apply.json
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/usd-sloos.json').read_text())
          dry=json.loads(Path('/tmp/usd-sloos-dry-run.json').read_text())
          r=json.loads(Path('/tmp/usd-sloos-apply.json').read_text())
          original=json.loads(Path('live_data/sections/NATIVE_LIQ_DATA.json').read_text())['USD']['conditions']
          applied=json.loads(Path('/tmp/NATIVE_LIQ_DATA.usd-sloos.json').read_text())['USD']['conditions']
          assert c['schema']=='GMFQ_LIQUIDITY_USD_SLOOS_CONDITIONS_CANDIDATE_V1', c
          assert c['source']['series_id']=='SLOOS/SLOOS/SUBLPDCILS_N.Q', c
          assert c['proof']['overlap_count']==43, c
          assert c['proof']['exact_match_count']==43, c
          assert c['proof']['exact_match_ratio']==1.0, c
          assert c['proof']['runtime_history_unchanged_by_current_vintage'] is True, c
          assert dry['schema']=='GMFQ_LIQUIDITY_USD_SLOOS_CONDITIONS_APPLY_RECEIPT_V1', dry
          assert r['schema']=='GMFQ_LIQUIDITY_USD_SLOOS_CONDITIONS_APPLY_RECEIPT_V1', r
          assert dry['publication_performed'] is False and r['publication_performed'] is False
          assert dry['applied'] is False
          assert r['runtime_history_rewritten'] is False
          n=len(original['dates'])
          assert applied['dates'][:n]==original['dates']
          assert applied['values'][:n]==original['values']
          assert len(applied['dates'])==len(applied['values'])==n+r['appended_observations']
          if c['candidate_update_available']:
              assert r['applied'] is True
              assert applied['last_date']==c['latest_date']
              assert float(applied['last_value'])==float(c['latest_value'])
          else:
              assert r['applied'] is False
              assert r['appended_observations']==0
              assert applied==original
          print('USD_SLOOS_CONTROLLED_APPLY_PROOF_PASS')
          print(json.dumps({'candidate': c, 'receipt': r}, indent=2))
          PY
          sha256sum -c /tmp/usd-sloos-runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Verify persisted BOJ JPY reserve blocker
        run: |
          sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/jpy-runtime.before.sha256
          python - <<'PY'
          import json
          p='validation/liquidity/JPY_RESERVE_PROVENANCE_RESOLUTION_2026-10-13.json'
          d=json.load(open(p))
          assert d['schema']=='GMFQ_LIQUIDITY_JPY_RESERVE_PROVENANCE_RESOLUTION_V1', d
          assert d['source']['publisher']=='Bank of Japan', d
          assert d['source']['database']=='MD08', d
          assert d['status']=='WITHHELD_EXACT_SERIES_OR_RUNTIME_MATCH_PENDING', d
          assert d['proof']['metadata_candidate_count']==93, d
          assert d['proof']['tested_series_count']==93, d
          b=d['proof']['best_candidate']
          assert b['series_code']=='MACAB1181', b
          assert b['overlap']==128, b
          assert b['exact']==0 and b['exact_ratio']==0.0, b
          assert d['promotion_eligible'] is False, d
          assert d['automation_ready'] is False, d
          assert d['fail_closed'] is True, d
          assert d['runtime_mutated'] is False, d
          assert d['publication_performed'] is False, d
          print('JPY_RESERVE_PERSISTED_BLOCKER_PASS', b)
          PY
          sha256sum -c /tmp/jpy-runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Verify persisted SNB CHF sight blocker
        run: |
          sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/chf-sight-runtime.before.sha256
          python - <<'PY'
          import json
          p='validation/liquidity/CHF_SIGHT_DEPOSITS_PROVENANCE_RESOLUTION_2026-10-13.json'
          d=json.load(open(p))
          assert d['schema']=='GMFQ_LIQUIDITY_CHF_SIGHT_DEPOSITS_PROVENANCE_RESOLUTION_V1', d
          assert d['source']['publisher']=='Swiss National Bank', d
          assert d['status']=='WITHHELD_EXACT_VARIANT_RUNTIME_MATCH_PENDING', d
          b=d['proof']['best_variant']
          assert b['overlap']==13 and b['exact']==0, b
          assert d['proof']['runtime_match_certified'] is False, d
          assert d['promotion_eligible'] is False, d
          assert d['automation_ready'] is False, d
          assert d['fail_closed'] is True, d
          assert d['runtime_mutated'] is False, d
          assert d['publication_performed'] is False, d
          print('CHF_SIGHT_PERSISTED_BLOCKER_PASS', b)
          PY
          sha256sum -c /tmp/chf-sight-runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Verify persisted SNB CHF credit blocker
        run: |
          sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/chf-credit-runtime.before.sha256
          python - <<'PY'
          import json
          p='validation/liquidity/CHF_CREDIT_PROVENANCE_RESOLUTION_2026-10-13.json'
          d=json.load(open(p))
          assert d['schema']=='liquidity_chf_credit_provenance_resolution_v1', d
          assert d['source_family']['provider']=='SNB', d
          assert d['source_family']['cube']=='bakredinausbm', d
          probe=d['live_cube_probe']
          assert probe['candidate_count']==6, probe
          b=probe['best_candidate']
          assert b['identity']=='AV1 | A | T1 | B', b
          assert b['overlap']==13 and b['exact']==0, b
          assert probe['runtime_match_certified'] is False, probe
          r=d['resolution']
          assert r['status']=='SOURCE_FAMILY_MAPPED_EXACT_SERIES_UNRESOLVED', r
          assert r['runtime_match_certified'] is False, r
          assert r['automation_ready'] is False, r
          assert r['fail_closed'] is True, r
          op=d['operational_impact']
          assert op['runtime_changed'] is False, op
          assert op['publication_performed'] is False, op
          assert op['effective_coverage_ready']==11, op
          assert op['effective_coverage_pending']==15, op
          assert op['effective_coverage_total']==26, op
          print('CHF_CREDIT_PERSISTED_BLOCKER_PASS', b)
          PY
          sha256sum -c /tmp/chf-credit-runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Diagnose Fed H8 USD bank credit scale and revision contract
        run: |
          sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/usd-credit-runtime.before.sha256
          python validation/diagnose_fed_usd_bank_credit_revision_v1.py | tee /tmp/usd-bank-credit-revision.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/usd-bank-credit-revision.json'))
          assert d['schema']=='GMFQ_LIQUIDITY_USD_BANK_CREDIT_REVISION_DIAGNOSTIC_V1', d
          assert d['source']['publisher']=='Board of Governors of the Federal Reserve System', d
          assert d['source']['series_id']=='H8/H8/B1001NCBA', d
          assert d['source']['scale_to_runtime']==0.001, d
          assert d['proof']['overlap_count'] > 0, d
          assert d['automation_ready'] is False, d
          assert d['promotion_performed'] is False, d
          assert d['runtime_mutated'] is False, d
          assert d['publication_performed'] is False, d
          print('USD_CREDIT_DIAGNOSTIC', d['interpretation'], d['proof'])
          PY
          sha256sum -c /tmp/usd-credit-runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Summary
        run: |
          echo 'Effective Liquidity coverage: 11 READY / 15 pending / 26 total'
          echo 'GBP BoE controlled apply proof: executed on isolated runtime copy'
          echo 'USD SLOOS controlled apply proof: executed on isolated runtime copy'
          echo 'JPY reserve provenance blocker: persisted fail-closed evidence'
          echo 'CHF sight-deposit blocker: persisted fail-closed evidence'
          echo 'CHF credit blocker: persisted fail-closed evidence'
          echo 'USD bank credit: scale/revision diagnostic only, no promotion'
          echo 'Tracked runtime mutation: NONE'
          echo 'Publication: NONE'
