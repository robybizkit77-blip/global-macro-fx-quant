name: Daily Data Orchestrator Effective Liquidity V1

on:
  push:
    branches:
      - release-candidate-daily-data-orchestrator-v1-2026-10-12
    paths:
      - 'validation/run_daily_data_orchestrator_effective_v1.py'
      - 'validation/run_daily_data_orchestrator_v1.py'
      - 'validation/liquidity/LIQUIDITY_POLICY_OVERRIDE_AUD_ES_V1_2026-10-13.json'
      - 'validation/liquidity/LIQUIDITY_POLICY_OVERRIDE_EUR_M3_V1_2026-10-13.json'
      - 'validation/liquidity/JPY_RESERVE_PROVENANCE_RESOLUTION_2026-10-13.json'
      - 'validation/fetch_rba_aud_es_balances_candidate.py'
      - 'validation/apply_rba_aud_es_balances_candidate.py'
      - 'validation/diagnose_boj_jpy_reserve_balances_v1.py'
      - 'validation/probe_snb_chf_exact_variants_v1.py'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
      - '.github/workflows/daily-data-orchestrator-effective-liquidity-v1.yml'
  pull_request:
    branches:
      - release-candidate-freshness-registry-v1-2026-10-12
    paths:
      - 'validation/run_daily_data_orchestrator_effective_v1.py'
      - 'validation/run_daily_data_orchestrator_v1.py'
      - 'validation/liquidity/LIQUIDITY_POLICY_OVERRIDE_AUD_ES_V1_2026-10-13.json'
      - 'validation/liquidity/LIQUIDITY_POLICY_OVERRIDE_EUR_M3_V1_2026-10-13.json'
      - 'validation/liquidity/JPY_RESERVE_PROVENANCE_RESOLUTION_2026-10-13.json'
      - 'validation/fetch_rba_aud_es_balances_candidate.py'
      - 'validation/apply_rba_aud_es_balances_candidate.py'
      - 'validation/diagnose_boj_jpy_reserve_balances_v1.py'
      - 'validation/probe_snb_chf_exact_variants_v1.py'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
      - '.github/workflows/daily-data-orchestrator-effective-liquidity-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  effective-liquidity-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build effective orchestrator receipt
        run: |
          python validation/run_daily_data_orchestrator_effective_v1.py > /tmp/effective-receipt.json
          cat /tmp/effective-receipt.json
      - name: Enforce 11 READY / 15 pending
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/effective-receipt.json'))
          liq=d['lanes']['LIQUIDITY']
          assert liq['automation_ready_subseries']==11, liq
          assert liq['mapping_pending_subseries']==15, liq
          assert liq['verified_subseries']==11, liq
          assert liq['unresolved_subseries']==15, liq
          assert liq['total_subseries']==26, liq
          assert liq['aud_es_automation_ready'] is True, liq
          assert liq['aud_es_controlled_apply_proven'] is True, liq
          assert liq['aud_es_applier']=='validation/apply_rba_aud_es_balances_candidate.py', liq
          assert d['effective_liquidity_overlay']['ready']==11
          assert d['effective_liquidity_overlay']['pending']==15
          assert d['effective_liquidity_overlay']['runtime_mutated'] is False
          assert d['effective_liquidity_overlay']['publication_performed'] is False
          print('EFFECTIVE_LIQUIDITY_11_15_PASS')
          PY
      - name: Re-prove AUD controlled apply on runtime copy
        run: |
          sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/runtime.before.sha256
          python validation/fetch_rba_aud_es_balances_candidate.py --out /tmp/aud-es.json
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/NATIVE_LIQ_DATA.json
          python validation/apply_rba_aud_es_balances_candidate.py --candidate /tmp/aud-es.json --runtime /tmp/NATIVE_LIQ_DATA.json --apply > /tmp/aud-es-apply.json
          cat /tmp/aud-es-apply.json
          sha256sum -c /tmp/runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Verify persisted BOJ JPY reserve blocker
        run: |
          sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/jpy-runtime.before.sha256
          python - <<'PY'
          import json
          p='validation/liquidity/JPY_RESERVE_PROVENANCE_RESOLUTION_2026-10-13.json'
          d=json.load(open(p))
          assert d['schema']=='GMFQ_LIQUIDITY_JPY_RESERVE_PROVENANCE_RESOLUTION_V1', d
          assert d['source']['publisher']=='Bank of Japan', d
          assert d['source']['database']=='MD08', d
          assert d['status']=='WITHHELD_EXACT_SERIES_OR_RUNTIME_MATCH_PENDING', d
          assert d['proof']['metadata_candidate_count']==93, d
          assert d['proof']['tested_series_count']==93, d
          b=d['proof']['best_candidate']
          assert b['series_code']=='MACAB1181', b
          assert b['overlap']==128, b
          assert b['exact']==0 and b['exact_ratio']==0.0, b
          assert d['promotion_eligible'] is False, d
          assert d['automation_ready'] is False, d
          assert d['fail_closed'] is True, d
          assert d['runtime_mutated'] is False, d
          assert d['publication_performed'] is False, d
          print('JPY_RESERVE_PERSISTED_BLOCKER_PASS', b)
          PY
          sha256sum -c /tmp/jpy-runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Probe SNB CHF exact variants without promotion
        run: |
          sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/chf-runtime.before.sha256
          python validation/probe_snb_chf_exact_variants_v1.py | tee /tmp/chf-exact-variant-probe.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/chf-exact-variant-probe.json'))
          assert d['schema']=='GMFQ_SNB_CHF_EXACT_VARIANT_PROBE_V1', d
          assert d['sight_variants'], d
          for name, row in d['sight_variants'].items():
              assert row['overlap'] > 0, (name,row)
              assert row['scale'] in {1, 0.001, 1000.0, 0.000001, 1000000.0}, (name,row)
          ranked=sorted(d['sight_variants'].items(), key=lambda kv:(kv[1]['exact'], -(kv[1]['mae'] if kv[1]['mae'] is not None else 1e99)), reverse=True)
          print('CHF_SIGHT_BEST', ranked[0])
          PY
          sha256sum -c /tmp/chf-runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Summary
        run: |
          echo 'Effective Liquidity coverage: 11 READY / 15 pending / 26 total'
          echo 'JPY reserve provenance blocker: persisted fail-closed evidence, no live 93-series re-scan'
          echo 'CHF exact-variant probe: read-only, no automatic promotion'
          echo 'Tracked runtime mutation: NONE'
          echo 'Publication: NONE'
