name: Daily Data Orchestrator Effective Liquidity V1

on:
  push:
    branches:
      - release-candidate-daily-data-orchestrator-v1-2026-10-12
    paths:
      - 'validation/run_daily_data_orchestrator_effective_v1.py'
      - 'validation/run_daily_data_orchestrator_v1.py'
      - 'validation/liquidity/LIQUIDITY_POLICY_OVERRIDE_AUD_ES_V1_2026-10-13.json'
      - 'validation/liquidity/LIQUIDITY_POLICY_OVERRIDE_EUR_M3_V1_2026-10-13.json'
      - 'validation/liquidity/LIQUIDITY_POLICY_OVERRIDE_USD_SLOOS_CONDITIONS_V1_2026-10-13.json'
      - 'validation/liquidity/LIQUIDITY_POLICY_OVERRIDE_CAD_SLOS_CONDITIONS_V1_2026-10-13.json'
      - 'validation/liquidity/JPY_RESERVE_PROVENANCE_RESOLUTION_2026-10-13.json'
      - 'validation/liquidity/CHF_SIGHT_DEPOSITS_PROVENANCE_RESOLUTION_2026-10-13.json'
      - 'validation/liquidity/CHF_CREDIT_PROVENANCE_RESOLUTION_2026-10-13.json'
      - 'validation/fetch_rba_aud_es_balances_candidate.py'
      - 'validation/apply_rba_aud_es_balances_candidate.py'
      - 'validation/fetch_boe_gbp_liquidity_candidates.py'
      - 'validation/apply_boe_gbp_liquidity_candidates.py'
      - 'validation/diagnose_fed_usd_bank_credit_revision_v1.py'
      - 'validation/diagnose_fed_usd_sloos_conditions_v1.py'
      - 'validation/fetch_fed_usd_sloos_conditions_candidate.py'
      - 'validation/apply_fed_usd_sloos_conditions_candidate.py'
      - 'validation/fetch_boc_cad_slos_conditions_candidate.py'
      - 'validation/apply_boc_cad_slos_conditions_candidate.py'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
      - '.github/workflows/daily-data-orchestrator-effective-liquidity-v1.yml'
  pull_request:
    branches:
      - release-candidate-freshness-registry-v1-2026-10-12
    paths:
      - 'validation/run_daily_data_orchestrator_effective_v1.py'
      - 'validation/run_daily_data_orchestrator_v1.py'
      - 'validation/liquidity/LIQUIDITY_POLICY_OVERRIDE_AUD_ES_V1_2026-10-13.json'
      - 'validation/liquidity/LIQUIDITY_POLICY_OVERRIDE_EUR_M3_V1_2026-10-13.json'
      - 'validation/liquidity/LIQUIDITY_POLICY_OVERRIDE_USD_SLOOS_CONDITIONS_V1_2026-10-13.json'
      - 'validation/liquidity/LIQUIDITY_POLICY_OVERRIDE_CAD_SLOS_CONDITIONS_V1_2026-10-13.json'
      - 'validation/liquidity/JPY_RESERVE_PROVENANCE_RESOLUTION_2026-10-13.json'
      - 'validation/liquidity/CHF_SIGHT_DEPOSITS_PROVENANCE_RESOLUTION_2026-10-13.json'
      - 'validation/liquidity/CHF_CREDIT_PROVENANCE_RESOLUTION_2026-10-13.json'
      - 'validation/fetch_rba_aud_es_balances_candidate.py'
      - 'validation/apply_rba_aud_es_balances_candidate.py'
      - 'validation/fetch_boe_gbp_liquidity_candidates.py'
      - 'validation/apply_boe_gbp_liquidity_candidates.py'
      - 'validation/diagnose_fed_usd_bank_credit_revision_v1.py'
      - 'validation/diagnose_fed_usd_sloos_conditions_v1.py'
      - 'validation/fetch_fed_usd_sloos_conditions_candidate.py'
      - 'validation/apply_fed_usd_sloos_conditions_candidate.py'
      - 'validation/fetch_boc_cad_slos_conditions_candidate.py'
      - 'validation/apply_boc_cad_slos_conditions_candidate.py'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
      - '.github/workflows/daily-data-orchestrator-effective-liquidity-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  effective-liquidity-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build effective orchestrator receipt
        run: |
          python validation/run_daily_data_orchestrator_effective_v1.py > /tmp/effective-receipt.json
          cat /tmp/effective-receipt.json
      - name: Enforce 13 READY / 13 pending
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/effective-receipt.json'))
          liq=d['lanes']['LIQUIDITY']
          assert liq['automation_ready_subseries']==13, liq
          assert liq['mapping_pending_subseries']==13, liq
          assert liq['verified_subseries']==13, liq
          assert liq['unresolved_subseries']==13, liq
          assert liq['total_subseries']==26, liq
          assert liq['aud_es_automation_ready'] is True and liq['aud_es_controlled_apply_proven'] is True, liq
          assert liq['usd_sloos_automation_ready'] is True and liq['usd_sloos_controlled_apply_proven'] is True, liq
          assert liq['usd_sloos_series_key']=='SLOOS/SLOOS/SUBLPDCILS_N.Q', liq
          assert liq['cad_sloos_automation_ready'] is True and liq['cad_sloos_controlled_apply_proven'] is True, liq
          assert liq['cad_sloos_series_key']=='SLOS_BUS_LEND', liq
          assert liq['cad_sloos_collector']=='validation/fetch_boc_cad_slos_conditions_candidate.py', liq
          assert liq['cad_sloos_applier']=='validation/apply_boc_cad_slos_conditions_candidate.py', liq
          assert liq['cad_sloos_apply_proof_run_id']==38389936903, liq
          assert d['effective_liquidity_overlay']['ready']==13
          assert d['effective_liquidity_overlay']['pending']==13
          assert d['effective_liquidity_overlay']['runtime_mutated'] is False
          assert d['effective_liquidity_overlay']['publication_performed'] is False
          print('EFFECTIVE_LIQUIDITY_13_13_PASS')
          PY
      - name: Re-prove AUD controlled apply on runtime copy
        run: |
          sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/aud-runtime.before.sha256
          python validation/fetch_rba_aud_es_balances_candidate.py --out /tmp/aud-es.json
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/NATIVE_LIQ_DATA.aud.json
          python validation/apply_rba_aud_es_balances_candidate.py --candidate /tmp/aud-es.json --runtime /tmp/NATIVE_LIQ_DATA.aud.json --apply > /tmp/aud-es-apply.json
          cat /tmp/aud-es-apply.json
          sha256sum -c /tmp/aud-runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Prove GBP controlled apply on runtime copy
        run: |
          sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/gbp-runtime.before.sha256
          python validation/fetch_boe_gbp_liquidity_candidates.py --out /tmp/gbp-boe-candidates.json
          python validation/apply_boe_gbp_liquidity_candidates.py --candidate /tmp/gbp-boe-candidates.json > /tmp/gbp-boe-dry-run.json
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/NATIVE_LIQ_DATA.gbp.json
          python validation/apply_boe_gbp_liquidity_candidates.py --candidate /tmp/gbp-boe-candidates.json --runtime /tmp/NATIVE_LIQ_DATA.gbp.json --apply > /tmp/gbp-boe-apply.json
          python - <<'PY'
          import json
          c=json.load(open('/tmp/gbp-boe-candidates.json'))
          r=json.load(open('/tmp/gbp-boe-apply.json'))
          before=json.load(open('live_data/sections/NATIVE_LIQ_DATA.json'))
          after=json.load(open('/tmp/NATIVE_LIQ_DATA.gbp.json'))
          assert c['schema']=='GMFQ_LIQUIDITY_GBP_BOE_CANDIDATES_V1', c
          assert r['schema']=='GMFQ_LIQUIDITY_GBP_BOE_APPLY_RECEIPT_V1', r
          for key,runtime_key in {'GBP.liquidity':'liquidity','GBP.credit':'credit'}.items():
              o=before['GBP'][runtime_key]; a=after['GBP'][runtime_key]
              n=len(o['dates'])
              assert a['dates'][:n]==o['dates'] and a['values'][:n]==o['values'], key
              assert len(a['dates'])==len(a['values'])==n+r['results'][key]['appended_observations'], key
          assert r['publication_performed'] is False
          print('GBP_CONTROLLED_APPLY_PROOF_PASS')
          PY
          sha256sum -c /tmp/gbp-runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Prove Fed SLOOS controlled apply on runtime copy
        run: |
          sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/usd-sloos-runtime.before.sha256
          python validation/fetch_fed_usd_sloos_conditions_candidate.py --out /tmp/usd-sloos.json
          python validation/apply_fed_usd_sloos_conditions_candidate.py --candidate /tmp/usd-sloos.json > /tmp/usd-sloos-dry.json
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/NATIVE_LIQ_DATA.usd-sloos.json
          python validation/apply_fed_usd_sloos_conditions_candidate.py --candidate /tmp/usd-sloos.json --runtime /tmp/NATIVE_LIQ_DATA.usd-sloos.json --apply > /tmp/usd-sloos-apply.json
          python - <<'PY'
          import json
          c=json.load(open('/tmp/usd-sloos.json')); r=json.load(open('/tmp/usd-sloos-apply.json'))
          before=json.load(open('live_data/sections/NATIVE_LIQ_DATA.json'))['USD']['conditions']
          after=json.load(open('/tmp/NATIVE_LIQ_DATA.usd-sloos.json'))['USD']['conditions']
          p=c['proof']; n=len(before['dates'])
          assert p['overlap_count']==43 and p['exact_match_count']==43 and p['exact_match_ratio']==1.0, p
          assert after['dates'][:n]==before['dates'] and after['values'][:n]==before['values']
          assert len(after['dates'])==len(after['values'])==n+r['appended_observations']
          assert r['runtime_history_rewritten'] is False and r['publication_performed'] is False
          print('USD_SLOOS_CONTROLLED_APPLY_PROOF_PASS')
          PY
          sha256sum -c /tmp/usd-sloos-runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Prove BoC CAD SLOS controlled apply on runtime copy
        run: |
          sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/cad-sloos-runtime.before.sha256
          python validation/fetch_boc_cad_slos_conditions_candidate.py --out /tmp/cad-sloos.json
          python validation/apply_boc_cad_slos_conditions_candidate.py --candidate /tmp/cad-sloos.json > /tmp/cad-sloos-dry.json
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/NATIVE_LIQ_DATA.cad-sloos.json
          python validation/apply_boc_cad_slos_conditions_candidate.py --candidate /tmp/cad-sloos.json --runtime /tmp/NATIVE_LIQ_DATA.cad-sloos.json --apply > /tmp/cad-sloos-apply.json
          python - <<'PY'
          import json
          c=json.load(open('/tmp/cad-sloos.json')); r=json.load(open('/tmp/cad-sloos-apply.json'))
          before=json.load(open('live_data/sections/NATIVE_LIQ_DATA.json'))['CAD']['conditions']
          after=json.load(open('/tmp/NATIVE_LIQ_DATA.cad-sloos.json'))['CAD']['conditions']
          p=c['proof']; n=len(before['dates'])
          assert c['source']['series_id']=='SLOS_BUS_LEND', c
          assert p['overlap_count']==42 and p['exact_match_count']==42 and p['exact_match_ratio']==1.0, p
          assert p['runtime_history_unchanged_by_current_vintage'] is True and p['identity_transform'] is True, p
          assert after['dates'][:n]==before['dates'] and after['values'][:n]==before['values']
          assert len(after['dates'])==len(after['values'])==n+r['appended_observations']
          assert r['runtime_history_rewritten'] is False and r['publication_performed'] is False
          print('CAD_SLOOS_CONTROLLED_APPLY_PROOF_PASS', c['latest_date'], c['latest_value'], c['new_observations'])
          PY
          sha256sum -c /tmp/cad-sloos-runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Verify persisted liquidity blockers
        run: |
          sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/blockers-runtime.before.sha256
          python - <<'PY'
          import json
          j=json.load(open('validation/liquidity/JPY_RESERVE_PROVENANCE_RESOLUTION_2026-10-13.json'))
          assert j['status']=='WITHHELD_EXACT_SERIES_OR_RUNTIME_MATCH_PENDING' and j['automation_ready'] is False and j['fail_closed'] is True, j
          assert j['proof']['best_candidate']['series_code']=='MACAB1181' and j['proof']['best_candidate']['exact']==0, j
          s=json.load(open('validation/liquidity/CHF_SIGHT_DEPOSITS_PROVENANCE_RESOLUTION_2026-10-13.json'))
          assert s['status']=='WITHHELD_EXACT_VARIANT_RUNTIME_MATCH_PENDING' and s['automation_ready'] is False and s['fail_closed'] is True, s
          c=json.load(open('validation/liquidity/CHF_CREDIT_PROVENANCE_RESOLUTION_2026-10-13.json'))
          assert c['resolution']['status']=='SOURCE_FAMILY_MAPPED_EXACT_SERIES_UNRESOLVED', c
          assert c['resolution']['automation_ready'] is False and c['resolution']['fail_closed'] is True, c
          print('PERSISTED_BLOCKERS_PASS')
          PY
          sha256sum -c /tmp/blockers-runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Diagnose Fed H8 USD bank credit revision contract
        run: |
          sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/usd-credit-runtime.before.sha256
          python validation/diagnose_fed_usd_bank_credit_revision_v1.py | tee /tmp/usd-bank-credit-revision.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/usd-bank-credit-revision.json'))
          assert d['schema']=='GMFQ_LIQUIDITY_USD_BANK_CREDIT_REVISION_DIAGNOSTIC_V1', d
          assert d['source']['series_id']=='H8/H8/B1001NCBA', d
          assert d['automation_ready'] is False and d['promotion_performed'] is False, d
          assert d['runtime_mutated'] is False and d['publication_performed'] is False, d
          print('USD_CREDIT_DIAGNOSTIC', d['interpretation'], d['proof'])
          PY
          sha256sum -c /tmp/usd-credit-runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Summary
        run: |
          echo 'Effective Liquidity coverage: 13 READY / 13 pending / 26 total'
          echo 'AUD, GBP, USD SLOOS and CAD SLOS controlled apply: re-proven on isolated runtime copies'
          echo 'JPY reserve and CHF blockers: persisted fail-closed evidence'
          echo 'USD bank credit: revision diagnostic only, no promotion'
          echo 'Tracked runtime mutation: NONE'
          echo 'Publication: NONE'
