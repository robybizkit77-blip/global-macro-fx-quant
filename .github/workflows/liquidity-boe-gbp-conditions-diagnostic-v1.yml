name: Liquidity BoE GBP Conditions Diagnostic V1

on:
  push:
    branches:
      - release-candidate-daily-data-orchestrator-v1-2026-10-12
    paths:
      - 'validation/diagnose_boe_gbp_credit_conditions_v1.py'
      - '.github/workflows/liquidity-boe-gbp-conditions-diagnostic-v1.yml'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot runtime
        run: sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/runtime.before.sha256
      - name: Diagnose BoE GBP conditions mapping
        run: |
          python validation/diagnose_boe_gbp_credit_conditions_v1.py | tee /tmp/gbp-conditions.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/gbp-conditions.json'))
          assert d['schema']=='GMFQ_LIQUIDITY_GBP_CCS_DIAGNOSTIC_V1', d
          assert d['source']['publisher']=='Bank of England', d
          assert d['runtime']['lane']=='GBP.conditions', d
          assert d['automation_ready'] is False
          assert d['promotion_performed'] is False
          assert d['runtime_mutated'] is False
          assert d['publication_performed'] is False
          print('GBP_CONDITIONS_BEST', d['best_candidate'])
          print('GBP_CONDITIONS_CERTIFIED', d['runtime_match_certified'])
          PY
      - name: Verify runtime unchanged
        run: |
          sha256sum -c /tmp/runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
