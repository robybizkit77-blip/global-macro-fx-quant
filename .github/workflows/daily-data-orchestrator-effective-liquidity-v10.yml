name: Daily Data Orchestrator Effective Liquidity V10

on:
  push:
    branches: [release-candidate-daily-data-orchestrator-v1-2026-10-12]
    paths:
      - 'validation/run_daily_data_orchestrator_effective_v10.py'
      - 'validation/run_daily_data_orchestrator_effective_v9.py'
      - 'validation/liquidity/LIQUIDITY_POLICY_OVERRIDE_USD_BANK_CREDIT_REVISION_AWARE_V1_2026-10-13.json'
      - 'validation/fetch_fed_usd_bank_credit_revision_aware_candidate.py'
      - 'validation/apply_fed_usd_bank_credit_revision_aware_candidate.py'
      - '.github/workflows/daily-data-orchestrator-effective-liquidity-v9.yml'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
      - '.github/workflows/daily-data-orchestrator-effective-liquidity-v10.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  effective-liquidity-v10-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot tracked runtime
        run: sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/runtime.before.sha256
      - name: Build effective V10 receipt
        run: |
          python validation/run_daily_data_orchestrator_effective_v10.py > /tmp/effective-v10.json
          cat /tmp/effective-v10.json
      - name: Enforce 22 READY / 4 pending
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/effective-v10.json')); liq=d['lanes']['LIQUIDITY']; o=d['effective_liquidity_overlay_v10']
          assert liq['automation_ready_subseries']==22 and liq['mapping_pending_subseries']==4, liq
          assert liq['verified_subseries']==22 and liq['unresolved_subseries']==4 and liq['total_subseries']==26, liq
          assert liq['usd_credit_automation_ready'] is True and liq['usd_credit_controlled_apply_proven'] is True, liq
          assert liq['usd_credit_revision_aware_append_only'] is True and liq['usd_credit_controlled_append_proven'] is True, liq
          assert liq['usd_credit_series_id']=='B1001NCBA', liq
          assert liq['usd_credit_official_tail']=={'date':'2026-09-30','value':19883.1863}, liq
          assert o['ready']==22 and o['pending']==4 and o['total']==26 and o['runtime_mutated'] is False and o['publication_performed'] is False, o
          print('EFFECTIVE_LIQUIDITY_V10_22_4_PASS')
          PY
      - name: Re-prove USD credit controlled apply
        run: |
          python validation/fetch_fed_usd_bank_credit_revision_aware_candidate.py --out /tmp/usd-credit.json
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/NATIVE_LIQ_DATA.usd-credit.json
          python validation/apply_fed_usd_bank_credit_revision_aware_candidate.py --candidate /tmp/usd-credit.json --runtime /tmp/NATIVE_LIQ_DATA.usd-credit.json --apply > /tmp/usd-credit-apply.json
          python - <<'PY'
          import json
          c=json.load(open('/tmp/usd-credit.json')); r=json.load(open('/tmp/usd-credit-apply.json'))
          original=json.load(open('live_data/sections/NATIVE_LIQ_DATA.json'))['USD']['credit']
          applied=json.load(open('/tmp/NATIVE_LIQ_DATA.usd-credit.json'))['USD']['credit']; n=len(original['dates'])
          assert c['proof']['current_vintage_mismatch_count']>0, c
          assert applied['dates'][:n]==original['dates'] and applied['values'][:n]==original['values'], (applied,original)
          assert r['applied'] is True and r['appended_observations']==3 and r['runtime_history_rewritten'] is False, r
          assert r['after_last_date']=='2026-09-30' and abs(r['after_last_value']-19883.1863)<1e-9, r
          print('USD_CREDIT_V10_CONTROLLED_APPLY_REPROOF_PASS')
          PY
      - name: Verify tracked runtime unchanged
        run: |
          sha256sum -c /tmp/runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Summary
        run: |
          echo 'Effective Liquidity V10 coverage: 22 READY / 4 pending / 26 total'
          echo 'USD bank credit Fed H8 revision-aware controlled apply: GREEN'
          echo 'Tracked runtime mutation: NONE'
          echo 'Publication: NONE'
