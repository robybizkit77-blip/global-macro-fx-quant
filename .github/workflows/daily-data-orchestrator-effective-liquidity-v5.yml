name: Daily Data Orchestrator Effective Liquidity V5

on:
  push:
    branches:
      - release-candidate-daily-data-orchestrator-v1-2026-10-12
    paths:
      - 'validation/run_daily_data_orchestrator_effective_v5.py'
      - 'validation/run_daily_data_orchestrator_effective_v4.py'
      - 'validation/liquidity/LIQUIDITY_POLICY_OVERRIDE_JPY_TANKAN_CONDITIONS_V1_2026-10-13.json'
      - 'validation/liquidity/JPY_TANKAN_LENDING_ATTITUDE_PROVENANCE_RESOLUTION_2026-10-13.json'
      - 'validation/fetch_boj_jpy_tankan_lending_attitude_candidate.py'
      - 'validation/apply_boj_jpy_tankan_lending_attitude_candidate.py'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
      - '.github/workflows/daily-data-orchestrator-effective-liquidity-v5.yml'
  pull_request:
    branches:
      - release-candidate-freshness-registry-v1-2026-10-12
    paths:
      - 'validation/run_daily_data_orchestrator_effective_v5.py'
      - 'validation/run_daily_data_orchestrator_effective_v4.py'
      - 'validation/liquidity/LIQUIDITY_POLICY_OVERRIDE_JPY_TANKAN_CONDITIONS_V1_2026-10-13.json'
      - 'validation/liquidity/JPY_TANKAN_LENDING_ATTITUDE_PROVENANCE_RESOLUTION_2026-10-13.json'
      - 'validation/fetch_boj_jpy_tankan_lending_attitude_candidate.py'
      - 'validation/apply_boj_jpy_tankan_lending_attitude_candidate.py'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
      - '.github/workflows/daily-data-orchestrator-effective-liquidity-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  effective-liquidity-v5-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot tracked runtime
        run: sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/runtime.before.sha256
      - name: Build effective V5 receipt
        run: |
          python validation/run_daily_data_orchestrator_effective_v5.py > /tmp/effective-v5.json
          cat /tmp/effective-v5.json
      - name: Enforce 17 READY / 9 pending
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/effective-v5.json'))
          liq=d['lanes']['LIQUIDITY']
          assert liq['automation_ready_subseries']==17, liq
          assert liq['mapping_pending_subseries']==9, liq
          assert liq['verified_subseries']==17, liq
          assert liq['unresolved_subseries']==9, liq
          assert liq['total_subseries']==26, liq
          assert liq['jpy_conditions_automation_ready'] is True, liq
          assert liq['jpy_conditions_controlled_apply_proven'] is True, liq
          assert liq['jpy_conditions_series_id']=='TK99F0000612GCQ00000', liq
          assert liq['jpy_conditions_collector']=='validation/fetch_boj_jpy_tankan_lending_attitude_candidate.py', liq
          assert liq['jpy_conditions_applier']=='validation/apply_boj_jpy_tankan_lending_attitude_candidate.py', liq
          assert liq['jpy_conditions_apply_proof_run_id']==38400277145, liq
          assert liq['jpy_conditions_official_tail']=={'date':'2026-Q3','value':13.0}, liq
          o=d['effective_liquidity_overlay_v5']
          assert o['ready']==17 and o['pending']==9 and o['total']==26, o
          assert o['runtime_mutated'] is False and o['publication_performed'] is False, o
          print('EFFECTIVE_LIQUIDITY_V5_17_9_PASS')
          PY
      - name: Re-prove BOJ Tankan controlled apply on runtime copy
        run: |
          python validation/fetch_boj_jpy_tankan_lending_attitude_candidate.py --out /tmp/jpy-tankan.json
          python validation/apply_boj_jpy_tankan_lending_attitude_candidate.py --candidate /tmp/jpy-tankan.json > /tmp/jpy-tankan-dry.json
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/NATIVE_LIQ_DATA.jpy-tankan.json
          python validation/apply_boj_jpy_tankan_lending_attitude_candidate.py --candidate /tmp/jpy-tankan.json --runtime /tmp/NATIVE_LIQ_DATA.jpy-tankan.json --apply > /tmp/jpy-tankan-apply.json
          python - <<'PY'
          import json
          c=json.load(open('/tmp/jpy-tankan.json'))
          dry=json.load(open('/tmp/jpy-tankan-dry.json'))
          r=json.load(open('/tmp/jpy-tankan-apply.json'))
          original=json.load(open('live_data/sections/NATIVE_LIQ_DATA.json'))['JPY']['conditions']
          applied=json.load(open('/tmp/NATIVE_LIQ_DATA.jpy-tankan.json'))['JPY']['conditions']
          assert c['source']['database']=='CO' and c['source']['series_id']=='TK99F0000612GCQ00000', c
          assert c['runtime_overlap_count']==42 and c['runtime_exact_match_count']==42, c
          assert c['runtime_exact_match_ratio']==1.0, c
          assert c['runtime_history_unchanged_by_current_vintage'] is True, c
          assert c['latest_date']=='2026-Q3' and float(c['latest_value'])==13.0, c
          assert c['new_observations']==[{'date':'2026-Q3','value':13.0}], c
          assert dry['status']=='UPDATE_AVAILABLE' and dry['applied'] is False, dry
          assert dry['appended_observations']==1, dry
          assert r['status']=='UPDATE_AVAILABLE' and r['applied'] is True, r
          assert r['appended_observations']==1, r
          assert applied['dates'][:42]==original['dates'] and applied['values'][:42]==original['values'], (applied, original)
          assert applied['dates'][-1]=='2026-Q3' and float(applied['values'][-1])==13.0, applied
          assert applied['last_date']=='2026-Q3' and float(applied['last_value'])==13.0, applied
          print('JPY_TANKAN_CONTROLLED_APPLY_REPROOF_PASS')
          PY
      - name: Verify tracked runtime unchanged
        run: |
          sha256sum -c /tmp/runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Summary
        run: |
          echo 'Effective Liquidity V5 coverage: 17 READY / 9 pending / 26 total'
          echo 'JPY conditions BOJ Tankan controlled apply: GREEN'
          echo 'Tracked runtime mutation: NONE'
          echo 'Publication: NONE'
