name: FX Price Matrix Feasibility V1

on:
  push:
    branches:
      - audit-fx-price-matrix-feasibility-2026-10-06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe ECB historical G8 price matrix
        run: |
          mkdir -p /tmp/gmfq-fx-price
          python validation/fx_price_matrix_ecb_feasibility.py \
            --output /tmp/gmfq-fx-price/fx_price_matrix_ecb_feasibility.json
      - name: Confirm repository untouched
        run: git diff --exit-code
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: fx-price-matrix-ecb-feasibility-v1
          if-no-files-found: error
          retention-days: 14
          path: /tmp/gmfq-fx-price/fx_price_matrix_ecb_feasibility.json
