name: WTI Futures Secondary Market Proxy V1
on:
  pull_request:
    branches: [main]
    paths:
      - validation/estimated/refresh_wti_market_proxy_v1.py
      - validation/estimated/test_refresh_wti_market_proxy_v1.py
      - dashboard/risk-operational-v1.js
      - .github/workflows/wti-futures-secondary-market-proxy-v1.yml
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - validation/estimated/refresh_wti_market_proxy_v1.py
      - validation/estimated/test_refresh_wti_market_proxy_v1.py
      - .github/workflows/wti-futures-secondary-market-proxy-v1.yml
  schedule:
    - cron: '35 22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('wti-futures-pr-{0}', github.event.pull_request.number) || 'residual-proxy-shared-writers-v1' }}
  queue: max
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate independent WTI futures feed
        run: python -m unittest validation.estimated.test_refresh_wti_market_proxy_v1 -v
      - name: Refresh WTI CL=F futures proxy
        if: github.event_name != 'pull_request'
        run: python validation/estimated/refresh_wti_market_proxy_v1.py
      - name: Check data contract and governance
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          d=json.load(open('live_data/sections/ESTIMATED_RESIDUAL_GAPS.json'))
          w=d['lanes']['WTI.market_proxy']
          assert w['vendor_symbol']=='CL=F' and w['instrument_type']=='FUTURE'
          assert w['currency']=='USD' and w['value']>0
          assert w['official_canonical_untouched'] is True
          assert d['official_lanes_untouched'] is True
          assert all(d['governance'][key]=='NONE' for key in
              ('core_score_effect','bias_effect','sizing_effect','pair_engine_effect','forward_logger_effect'))
          assert d['governance']['backtest_eligible_as_official'] is False
          print('WTI_FUTURES_PROXY_PASS',w['proxy_as_of'],w['value'])
          PY
      - name: Persist only secondary residual lane
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        run: |
          set -euo pipefail
          changed="$(git diff --name-only -- live_data/sections/ESTIMATED_RESIDUAL_GAPS.json)"
          if [ -z "$changed" ]; then echo WTI_FUTURES_NO_CHANGE; exit 0; fi
          unexpected="$(git diff --name-only | grep -Ev '^live_data/sections/ESTIMATED_RESIDUAL_GAPS.json$' || true)"
          test -z "$unexpected" || { echo "Unexpected changes: $unexpected" >&2; exit 1; }
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$(git rev-parse HEAD)" || { echo "main moved; retry later" >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live_data/sections/ESTIMATED_RESIDUAL_GAPS.json
          git commit -m 'Refresh WTI CL=F secondary futures proxy'
          git push origin HEAD:main
