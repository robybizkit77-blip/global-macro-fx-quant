name: G4USD Relative Macro Turning 2Y Engine V1

on:
  push:
    branches:
      - validation-relative-macro-turning-2y-engine-v1-2026-10-12
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  RATES_STORE_SHA: 0f4f45190fa5d5e010650026a30a0f981373ec34
  USD_CPI_SEMANTIC_SHA: 2d70a0404d4591cca18ae7f8b86753627fd3a560c84523b9e991cc60d0a43485
  USD_LABOUR_SEMANTIC_SHA: 0c18bd5d6327c73e6a7421f4cfbad1374a08e17093de0dcc6b18b38dcbd602ff
  EUR_INF_SEMANTIC_SHA: fd19fea3a286b327019b9727a79ade5e51550cfc073538139ac3f600d81c68b1
  EUR_LAB_SEMANTIC_SHA: b8b9384ac5aefa293521137d5df9f713585d232c21999a59916f7058161113f9
  JPY_INF_SEMANTIC_SHA: 6981ccb92c24db17ea1fcdf49795887692ed950d833d77c38f09f21bfd3477c8
  CAD_INF_SEMANTIC_SHA: d35f3da5a41ea5550a3d51bc9d7087aeef7c8901a2ef59a48cd7bd674c1dce2a
  CAD_LAB_SEMANTIC_SHA: 77fd60f9eba8cf56189667256a2797f47c7259d5633e390ab876085b7541a56a
  AUD_INF_SEMANTIC_SHA: d448f8717ab8a7ae73af7d591fd1114512e578c6ef3821f3afe96ae9b789a31f
  AUD_LAB_SEMANTIC_SHA: b0f91883c118d15bffdb594d646786bd14d279090d7aafea1fad0f0c11faf436

jobs:
  mechanism-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parser dependency
        run: python -m pip install --disable-pip-version-check pypdf==5.9.0

      - name: Stage exact certified rates rowsets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/turning/rates
          git fetch --depth=1 origin "$RATES_STORE_SHA"
          for c in eur jpy cad aud usd; do
            git show FETCH_HEAD:"validation/rates_pit_rowsets/${c}_rates_2y_10y_temporal_pit_v1.csv" > "/tmp/turning/rates/${c}.csv"
          done
          python - <<'PY'
          import hashlib
          exp={
            'aud':'0959051ffea47d05f77a407e07ef7a8cd967dc38329f04323e0a6502daa8516c',
            'cad':'6e679c5ec165f415e3329a73424afa905f14ac2e5617fa835c78c017c9b873ce',
            'eur':'8afd7b64800e08ededeaf103c1607672653dbd299523a70789dbb80d05f87965',
            'jpy':'fef75eb7bf1ac99502a7a9dd0a322421343b8927a17bdf06a8ee05223509b97f',
            'usd':'3996517a6233eef43e6762576708030c14f12d171690c0ddee50819e5403e492',
          }
          for c,h in exp.items():
            b=open(f'/tmp/turning/rates/{c}.csv','rb').read()
            assert hashlib.sha256(b).hexdigest()==h,(c,hashlib.sha256(b).hexdigest())
          print('RATES_ROWSET_HASHES_PASS')
          PY

      - name: Download exact EUR inflation artifact
        uses: actions/download-artifact@v4
        with:
          name: eur-inflation-strict-pit-v1-38063873303
          path: /tmp/turning/eur-inf-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: robybizkit77-blip/global-macro-fx-quant
          run-id: 38063873303
      - name: Download exact EUR labour artifact
        uses: actions/download-artifact@v4
        with:
          name: eur-labour-strict-pit-v1-38076288187
          path: /tmp/turning/eur-lab-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: robybizkit77-blip/global-macro-fx-quant
          run-id: 38076288187
      - name: Stage and verify EUR macro
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/turning/eur-inf /tmp/turning/eur-lab
          cp /tmp/turning/eur-inf-artifact/a/EUR_INFLATION_STRICT_FIRST_RELEASE_FLASH_2018_2026_09.csv /tmp/turning/eur-inf/source.csv
          cp /tmp/turning/eur-inf-artifact/a/evidence.json /tmp/turning/eur-inf/evidence.json
          cp /tmp/turning/eur-lab-artifact/a/EUR_LABOUR_STRICT_FIRST_RELEASE_2018_2026_08.csv /tmp/turning/eur-lab/source.csv
          cp /tmp/turning/eur-lab-artifact/a/evidence.json /tmp/turning/eur-lab/evidence.json
          python - <<'PY'
          import json,os
          a=json.load(open('/tmp/turning/eur-inf/evidence.json')); b=json.load(open('/tmp/turning/eur-lab/evidence.json'))
          assert a['status']=='PASS' and b['status']=='PASS'
          assert a['semantic_rowset_sha256']==os.environ['EUR_INF_SEMANTIC_SHA']
          assert b['semantic_rowset_sha256']==os.environ['EUR_LAB_SEMANTIC_SHA']
          PY

      - name: Download exact JPY inflation artifact
        uses: actions/download-artifact@v4
        with:
          name: jpy-inflation-strict-pit-v1-38082623311
          path: /tmp/turning/jpy-inf-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: robybizkit77-blip/global-macro-fx-quant
          run-id: 38082623311
      - name: Download exact JPY labour artifact
        uses: actions/download-artifact@v4
        with:
          name: jpy-labour-strict-pit-v2-37939887981
          path: /tmp/turning/jpy-lab-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: robybizkit77-blip/global-macro-fx-quant
          run-id: 37939887981
      - name: Stage and verify JPY macro
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/turning/jpy-inf /tmp/turning/jpy-lab
          cp /tmp/turning/jpy-inf-artifact/jpy_inflation_strict_pit_evidence_v1_runtime.json /tmp/turning/jpy-inf/evidence.json
          cp /tmp/turning/jpy-lab-artifact/JPY_LABOUR_LFS_STRICT_FIRST_RELEASE_2018_2026_08.csv /tmp/turning/jpy-lab/source.csv
          cp /tmp/turning/jpy-lab-artifact/JPY_LABOUR_STRICT_PIT_EVIDENCE_V2.json /tmp/turning/jpy-lab/evidence.json
          python - <<'PY'
          import json,os
          a=json.load(open('/tmp/turning/jpy-inf/evidence.json')); b=json.load(open('/tmp/turning/jpy-lab/evidence.json'))
          assert a['schema']=='GMFQ_JPY_INFLATION_STRICT_PIT_EVIDENCE_V1_RUNTIME'
          assert a['verdict']=='STRICT_DIRECT_ARCHIVAL_PIT_CERTIFIABLE'
          assert a['semantic_rowset_sha256']==os.environ['JPY_INF_SEMANTIC_SHA']
          assert b['status']=='PASS'
          PY
          python validation/g4usd_readiness_json_rows_to_csv_v1.py --mode JPY_INFLATION --input /tmp/turning/jpy-inf/evidence.json --output /tmp/turning/jpy-inf/source.csv

      - name: Download exact CAD inflation artifact
        uses: actions/download-artifact@v4
        with:
          name: cad-inflation-strict-pit-v1-37976278850
          path: /tmp/turning/cad-inf-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: robybizkit77-blip/global-macro-fx-quant
          run-id: 37976278850
      - name: Download exact CAD labour artifact
        uses: actions/download-artifact@v4
        with:
          name: cad-labour-strict-pit-v1-37963733788
          path: /tmp/turning/cad-lab-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: robybizkit77-blip/global-macro-fx-quant
          run-id: 37963733788
      - name: Stage and verify CAD macro
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/turning/cad-inf /tmp/turning/cad-lab
          cp /tmp/turning/cad-inf-artifact/CAD_CPI_STRICT_FIRST_RELEASE_2018_2026_08.csv /tmp/turning/cad-inf/source.csv
          cp /tmp/turning/cad-inf-artifact/CAD_INFLATION_STRICT_PIT_EVIDENCE_V1.json /tmp/turning/cad-inf/evidence.json
          cp /tmp/turning/cad-lab-artifact/CAD_LABOUR_UNEMPLOYMENT_STRICT_FIRST_RELEASE_2018_2026_08.csv /tmp/turning/cad-lab/source.csv
          cp /tmp/turning/cad-lab-artifact/CAD_LABOUR_STRICT_PIT_EVIDENCE_V1.json /tmp/turning/cad-lab/evidence.json
          python - <<'PY'
          import json,os
          a=json.load(open('/tmp/turning/cad-inf/evidence.json')); b=json.load(open('/tmp/turning/cad-lab/evidence.json'))
          assert a['status']=='PASS' and b['status']=='PASS'
          assert a['semantic_rowset_sha256']==os.environ['CAD_INF_SEMANTIC_SHA']
          assert b['semantic_rowset_sha256']==os.environ['CAD_LAB_SEMANTIC_SHA']
          PY

      - name: Download exact AUD inflation artifact
        uses: actions/download-artifact@v4
        with:
          name: aud-inflation-strict-pit-v1-37956927900
          path: /tmp/turning/aud-inf-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: robybizkit77-blip/global-macro-fx-quant
          run-id: 37956927900
      - name: Download exact AUD labour artifact
        uses: actions/download-artifact@v4
        with:
          name: aud-labour-full-archive-probe-37947855930
          path: /tmp/turning/aud-lab-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: robybizkit77-blip/global-macro-fx-quant
          run-id: 37947855930
      - name: Stage and verify AUD macro
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/turning/aud-inf /tmp/turning/aud-lab
          cp /tmp/turning/aud-inf-artifact/AUD_CPI_Q_YOY_STRICT_FIRST_RELEASE_2018_2026Q2.csv /tmp/turning/aud-inf/source.csv
          cp /tmp/turning/aud-inf-artifact/AUD_INFLATION_STRICT_PIT_EVIDENCE_V1.json /tmp/turning/aud-inf/evidence.json
          cp /tmp/turning/aud-lab-artifact/aud-labour-full-archive-probe.json /tmp/turning/aud-lab/probe.json
          python - <<'PY'
          import hashlib,json,os
          a=json.load(open('/tmp/turning/aud-inf/evidence.json')); b=json.load(open('/tmp/turning/aud-lab/probe.json'))
          assert a['status']=='PASS' and a['semantic_rowset_sha256']==os.environ['AUD_INF_SEMANTIC_SHA']
          keys=['reference_month','unemployment_rate_sa','release_date','release_time','timezone','pit_status']
          canon=[{k:r[k] for k in keys} for r in b['rows']]
          semantic=hashlib.sha256(json.dumps(canon,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          assert semantic==os.environ['AUD_LAB_SEMANTIC_SHA']
          PY
          python validation/g4usd_readiness_json_rows_to_csv_v1.py --mode AUD_LABOUR --input /tmp/turning/aud-lab/probe.json --output /tmp/turning/aud-lab/source.csv

      - name: Materialize and verify certified USD macro
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/turning/usd-inf /tmp/turning/usd-lab
          python validation/macro/materialize_usd_cpi_bls_release_chain_v1.py --output /tmp/turning/usd-inf/calendar.json
          python validation/macro/materialize_usd_inflation_alfred_release_pit_v1.py --release-calendar /tmp/turning/usd-inf/calendar.json --output /tmp/turning/usd-inf/evidence.json
          python validation/macro/materialize_usd_labour_bls_release_pit_v1.py --output /tmp/turning/usd-lab/evidence.json
          python - <<'PY'
          import json,os
          a=json.load(open('/tmp/turning/usd-inf/evidence.json')); b=json.load(open('/tmp/turning/usd-lab/evidence.json'))
          assert a['status']=='CERTIFIABLE_STRICT_PIT_WITH_OFFICIAL_GAP'
          assert b['status']=='CERTIFIABLE_STRICT_PIT_WITH_OFFICIAL_GAP'
          assert a['semantic_sha256']==os.environ['USD_CPI_SEMANTIC_SHA']
          assert b['semantic_sha256']==os.environ['USD_LABOUR_SEMANTIC_SHA']
          PY
          python validation/g4usd_readiness_json_rows_to_csv_v1.py --mode USD_INFLATION --input /tmp/turning/usd-inf/evidence.json --output /tmp/turning/usd-inf/source.csv
          python validation/g4usd_readiness_json_rows_to_csv_v1.py --mode USD_LABOUR --input /tmp/turning/usd-lab/evidence.json --output /tmp/turning/usd-lab/source.csv

      - name: Execute frozen macro-turning mechanism test
        shell: bash
        run: |
          set -euo pipefail
          python validation/g4usd_relative_macro_turning_2y_v1.py \
            --eur-rates /tmp/turning/rates/eur.csv --jpy-rates /tmp/turning/rates/jpy.csv --cad-rates /tmp/turning/rates/cad.csv --aud-rates /tmp/turning/rates/aud.csv --usd-rates /tmp/turning/rates/usd.csv \
            --eur-inflation /tmp/turning/eur-inf/source.csv --eur-labour /tmp/turning/eur-lab/source.csv \
            --jpy-inflation /tmp/turning/jpy-inf/source.csv --jpy-labour /tmp/turning/jpy-lab/source.csv \
            --cad-inflation /tmp/turning/cad-inf/source.csv --cad-labour /tmp/turning/cad-lab/source.csv \
            --aud-inflation /tmp/turning/aud-inf/source.csv --aud-labour /tmp/turning/aud-lab/source.csv \
            --usd-inflation /tmp/turning/usd-inf/source.csv --usd-labour /tmp/turning/usd-lab/source.csv \
            --contract validation/G4USD_RELATIVE_MACRO_TURNING_2Y_CONTRACT_V1_2026-10-12.json \
            --output /tmp/turning/result.json

      - name: Assert market-performance boundary remains closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('/tmp/turning/result.json'))
          assert r['fx_outcomes_joined'] is False
          assert r['production_signal_authorized'] is False
          assert r['sizing_authorized'] is False
          # Verify the economic result schema itself contains no FX return/PnL fields.
          forbidden=('fx_return','sharpe','pnl','position_size','entry_price','exit_price')
          def walk(x):
              if isinstance(x,dict):
                  for k,v in x.items():
                      kl=k.lower()
                      assert not any(t in kl for t in forbidden), k
                      walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(r)
          print('NO_FX_OUTCOME_BOUNDARY_PASS')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4usd-relative-macro-turning-2y-v1-${{ github.run_id }}
          path: /tmp/turning/result.json
          retention-days: 90

      - name: Enforce predeclared mechanism gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('/tmp/turning/result.json'))
          print(json.dumps({'status':r['status'],'oos_pooled':r['oos_pooled'],'oos_per_currency':r['oos_per_currency'],'gates':r['gates']},indent=2,sort_keys=True))
          assert r['mechanism_survival'] is True, 'PREDECLARED_RELATIVE_MACRO_TURNING_2Y_GATE_FAILED'
          PY

      - name: Assert clean repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
