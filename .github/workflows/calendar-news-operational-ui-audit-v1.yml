name: Calendar News Operational UI Audit V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'dashboard/calendar-news-operational-v1.js'
      - 'live_data/sections/CALENDAR_OPERATIONAL_VIEW.json'
      - 'live_data/sections/NEWS_PULSE_OPERATIONAL.json'
      - 'index.html'
      - '.github/workflows/calendar-news-operational-ui-audit-v1.yml'
  push:
    branches: [main]
    paths:
      - 'dashboard/calendar-news-operational-v1.js'
      - 'live_data/sections/CALENDAR_OPERATIONAL_VIEW.json'
      - 'live_data/sections/NEWS_PULSE_OPERATIONAL.json'
      - 'index.html'
      - '.github/workflows/calendar-news-operational-ui-audit-v1.yml'
  workflow_dispatch:

jobs:
  browser-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Start local dashboard server
        run: |
          python3 -m http.server 8765 >/tmp/gmfq-calendar-news-server.log 2>&1 &
          echo $! >/tmp/gmfq-calendar-news-server.pid
      - name: Audit Calendar and News desktop/mobile
        run: |
          cat > calendar-news-ui-audit.js <<'JS'
          const {chromium}=require('playwright');
          const devices=[['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [name,viewport] of devices){
              const page=await browser.newPage({viewport});
              const errors=[];page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});page.on('pageerror',e=>errors.push(String(e)));
              await page.goto('http://127.0.0.1:8765/',{waitUntil:'networkidle'});
              await page.waitForFunction(()=>window.GMFQ_CALENDAR_NEWS_OPERATIONAL?.status==='ACTIVE',{timeout:20000});
              await page.evaluate(()=>window.showView&&window.showView('calendar'));
              await page.waitForSelector('#calendar [data-gmfq-operational="calendar"]',{state:'visible'});
              const cal=await page.evaluate(()=>({cards:document.querySelectorAll('#calendar .opCard').length,fresh:document.getElementById('calendar')?.dataset.gmfqEditorialFreshness,text:document.getElementById('calendar')?.innerText||'',w:document.querySelector('#calendar [data-gmfq-operational="calendar"]')?.scrollWidth,cw:document.querySelector('#calendar [data-gmfq-operational="calendar"]')?.clientWidth}));
              if(cal.cards!==8)throw new Error(`${name} calendar cards ${cal.cards}`);
              if(!/2026-10-28/.test(cal.text)||!/2026-12-10/.test(cal.text))throw new Error(`${name} calendar dates missing`);
              if(cal.fresh!=='FRESH')throw new Error(`${name} calendar freshness ${cal.fresh}`);
              if(cal.w>cal.cw+2)throw new Error(`${name} calendar overflow ${cal.w}/${cal.cw}`);
              await page.evaluate(()=>window.showView&&window.showView('news'));
              await page.waitForSelector('#news [data-gmfq-operational="news"]',{state:'visible'});
              const news=await page.evaluate(()=>({cards:document.querySelectorAll('#news .opCard').length,fresh:document.getElementById('news')?.dataset.gmfqEditorialFreshness,text:document.getElementById('news')?.innerText||'',w:document.querySelector('#news [data-gmfq-operational="news"]')?.scrollWidth,cw:document.querySelector('#news [data-gmfq-operational="news"]')?.clientWidth}));
              if(news.cards<4)throw new Error(`${name} news cards ${news.cards}`);
              if(!/News Pulse operativo/.test(news.text)||!/2026-10-14/.test(news.text))throw new Error(`${name} news as-of missing`);
              if(news.fresh!=='FRESH')throw new Error(`${name} news freshness ${news.fresh}`);
              if(news.w>news.cw+2)throw new Error(`${name} news overflow ${news.w}/${news.cw}`);
              if(errors.length)throw new Error(`${name} console errors: ${errors.join(' | ')}`);
              await page.screenshot({path:`calendar-news-${name}.png`,fullPage:true});
              console.log('CALENDAR_NEWS_UI_PASS',name,JSON.stringify({calendar:cal,news}));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node calendar-news-ui-audit.js
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-news-operational-ui-audit-v1
          path: calendar-news-*.png
          if-no-files-found: error
