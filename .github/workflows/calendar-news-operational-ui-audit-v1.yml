name: Calendar News Operational UI Audit V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/build_calendar_operational_v1.py'
      - 'validation/build_news_pulse_operational_v1.py'
      - 'validation/news_reaction_evidence_v1.py'
      - 'validation/collect_official_news_rss_v1.py'
      - 'dashboard/editorial-freshness-guard-v1.js'
      - 'dashboard/calendar-news-operational-v1.js'
      - 'validation/test_news_macro_actual_browser_contract_v1.cjs'
      - 'live_data/sections/CALENDAR_OPERATIONAL_VIEW.json'
      - 'live_data/sections/NEWS_PULSE_OPERATIONAL.json'
      - 'live_data/sections/MACRO_RELEASE_OFFICIAL_SEED_V1.json'
      - 'live_data/sections/MACRO_CONSENSUS_SECONDARY_V1.json'
      - 'index.html'
      - '.github/workflows/calendar-news-operational-ui-audit-v1.yml'
  push:
    branches: [main]
    paths:
      - 'validation/build_calendar_operational_v1.py'
      - 'validation/build_news_pulse_operational_v1.py'
      - 'validation/news_reaction_evidence_v1.py'
      - 'validation/collect_official_news_rss_v1.py'
      - 'dashboard/editorial-freshness-guard-v1.js'
      - 'dashboard/calendar-news-operational-v1.js'
      - 'validation/test_news_macro_actual_browser_contract_v1.cjs'
      - 'live_data/sections/CALENDAR_OPERATIONAL_VIEW.json'
      - 'live_data/sections/NEWS_PULSE_OPERATIONAL.json'
      - 'live_data/sections/MACRO_RELEASE_OFFICIAL_SEED_V1.json'
      - 'live_data/sections/MACRO_CONSENSUS_SECONDARY_V1.json'
      - 'index.html'
      - '.github/workflows/calendar-news-operational-ui-audit-v1.yml'
  workflow_dispatch:

jobs:
  browser-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Calendar V3
        run: python3 validation/build_calendar_operational_v1.py
      - name: Build dated official News Pulse for browser QA
        run: python3 validation/build_news_pulse_operational_v1.py
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Start local dashboard server
        run: |
          python3 -m http.server 8765 >/tmp/gmfq-calendar-news-server.log 2>&1 &
      - name: Audit Calendar and News desktop/mobile
        run: |
          cat > calendar-news-ui-audit.js <<'JS'
          const {chromium}=require('playwright');
          const devices=[['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [name,viewport] of devices){
              const page=await browser.newPage({viewport});
              const errors=[];page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});page.on('pageerror',e=>errors.push(String(e)));
              await page.goto('http://127.0.0.1:8765/',{waitUntil:'networkidle'});
              await page.waitForFunction(()=>window.GMFQ_CALENDAR_NEWS_OPERATIONAL?.status==='ACTIVE',{timeout:20000});
              await page.evaluate(()=>window.showView&&window.showView('calendar'));
              await page.waitForSelector('#calendar [data-gmfq-operational="calendar"]',{state:'visible'});
              const cal=await page.evaluate(()=>{
                const root=document.querySelector('#calendar [data-gmfq-operational="calendar"]');
                const macro=[...document.querySelectorAll('#calendar .opCard[data-kind="macro"]')];
                const valid=macro.filter(card=>['AVAILABLE','PREVIOUS_ONLY','NOT_PRESENT'].includes(card.dataset.consensusStatus)).length;
                const visibleSecondary=macro.filter(card=>card.querySelector('.opConsensus')).length;
                return {cb:document.querySelectorAll('#calendar .opCard[data-kind="cb"]').length,macro:macro.length,valid,visibleSecondary,fresh:document.getElementById('calendar')?.dataset.gmfqEditorialFreshness,text:document.getElementById('calendar')?.innerText||'',w:root?.scrollWidth,cw:root?.clientWidth};
              });
              if(cal.cb!==8)throw new Error(`${name} CB cards ${cal.cb}`);
              if(cal.macro<8)throw new Error(`${name} macro cards ${cal.macro}`);
              if(cal.valid!==cal.macro||cal.visibleSecondary!==cal.macro)throw new Error(`${name} consensus render ${cal.valid}/${cal.visibleSecondary}/${cal.macro}`);
              if(!/Core impact: 0/.test(cal.text))throw new Error(`${name} core impact label missing`);
              if(cal.fresh!=='FRESH')throw new Error(`${name} calendar freshness ${cal.fresh}`);
              if(cal.w>cal.cw+2)throw new Error(`${name} calendar overflow ${cal.w}/${cal.cw}`);
              await page.evaluate(()=>window.showView&&window.showView('news'));
              await page.waitForSelector('#news [data-gmfq-operational="news"]',{state:'visible'});
              const news=await page.evaluate(()=>{
                const node=document.getElementById('news');
                const ref=window.GMFQ_CALENDAR_NEWS_OPERATIONAL?.content_as_of;
                const now=new Date();now.setHours(0,0,0,0);
                const signal=ref?new Date(ref+'T00:00:00'):null;
                const age=signal?Math.floor((now-signal)/86400000):null;
                const expected=age===null?'UNVERIFIED':age>2?'STALE':'FRESH';
                const officialCards=[...document.querySelectorAll('#news .opCard[data-kind="official-release"]')];
                const sourceLinks=officialCards.map(card=>card.querySelector('a[href]')?.href||'');
                return {cards:document.querySelectorAll('#news .opCard').length,
                  officialCards:officialCards.length,sourceLinks,
                  proofLabelCount:officialCards.filter(c=>c.dataset.relevance==='MONITOR' && /Reazione(?: di mercato:)? non certificata/i.test(c.textContent)).length,
                  tiers:officialCards.map(card=>card.dataset.relevance),
                  monitorQuestions:officialCards.filter(card=>card.dataset.relevance==='MONITOR'&&
                    card.textContent.includes('Perché conta')&&card.textContent.includes('Cosa verificare')).length,
                  sections:[...document.querySelectorAll('#news [data-gmfq-operational="news"] .opSection')].map(el=>el.textContent.trim()),
                  fresh:node?.dataset.gmfqEditorialFreshness,expected,content_as_of:ref,
                  banner:node?.querySelector(':scope > .gmfqEditorialFreshnessBanner')?.innerText||'',
                  w:document.querySelector('#news [data-gmfq-operational="news"]')?.scrollWidth,
                  cw:document.querySelector('#news [data-gmfq-operational="news"]')?.clientWidth};
              });
              if(news.cards<4)throw new Error(`${name} news cards ${news.cards}`);
              // Regression: new macro source-clock lane must be rendered,
              // not merely present in operational JSON.
              const macroEvidence=await page.evaluate(async()=>{
                const payload=await (await fetch(
                  'live_data/sections/NEWS_PULSE_OPERATIONAL.json',
                  {cache:'no-store'})).json();
                const data=payload.macro_event_market_context;
                const cards=[...document.querySelectorAll(
                  '#news .opCard[data-kind="macro-evidence"]')];
                const ui=cards.map(card=>({
                  ccy:card.dataset.ccy,
                  stage:card.dataset.stage,
                  text:card.textContent||'',
                  t2:card.querySelectorAll('.opMacroRate').length,
                  width:card.scrollWidth,
                  clientWidth:card.clientWidth,
                  links:[...card.querySelectorAll('a[href]')].map(x=>x.href)
                }));
                return {schema:data?.schema,events:data?.events,ui};
              });
              if(macroEvidence.schema!=='GMFQ_MACRO_EVENT_CONTEXT_DAILY_MATCH_V1'||
                 macroEvidence.events.length!==2||macroEvidence.ui.length!==2)
                throw new Error(name+' macro evidence invisible: '+JSON.stringify(macroEvidence));
              const expectedLabels={USD:'Costo del lavoro USA',CAD:'PIL mensile Canada'};
              for(const event of macroEvidence.events){
                const card=macroEvidence.ui.find(x=>x.ccy===event.currency);
                if(!card||card.stage!==event.state||
                   !card.text.includes(expectedLabels[event.currency])||
                   !card.text.includes('Consenso congelato')||
                   !card.text.includes('Reazione evento')||
                   !card.text.includes('2Y')||
                   card.t2<4||card.width>card.clientWidth+2)
                  throw new Error(name+' macro card: '+JSON.stringify(card));
                if(event.official_actual_percent===null){
                  if(!card.text.includes('In attesa')||
                     !card.text.includes('Non calcolabile')||
                     card.links.length)
                    throw new Error(name+' premature actual: '+JSON.stringify(card));
                }else if(!card.text.includes('Actual − consenso')){
                  throw new Error(name+' missing source comparison: '+JSON.stringify(card));
                }
                if(card.links.some(url=>!(event.currency==='USD'?
                       /^https:\/\/www\.bls\.gov\//:
                       /^https:\/\/www150\.statcan\.gc\.ca\//).test(url)))
                  throw new Error(name+' unofficial issuer link: '+JSON.stringify(card));
              }

              const officialReceipt=await page.evaluate(async()=>(
                await (await fetch('live_data/sections/NEWS_PULSE_OPERATIONAL.json',{cache:'no-store'})).json()
              ).official_releases);
              if(!officialReceipt||news.officialCards!==officialReceipt.headlines.length)
                throw new Error(`${name} official UI/receipt mismatch ${news.officialCards}/${officialReceipt?.headlines?.length}`);
              if(!news.sections.some(x=>x.startsWith('Comunicazioni ufficiali'))||
                 !news.sections.some(x=>x.startsWith('Da monitorare'))||
                 !news.sections.some(x=>x.startsWith('Da approfondire'))||
                 !news.sections.some(x=>x.startsWith('Segnali quantitativi')))
                throw new Error(`${name} official and quantitative News Pulse lanes not separated ${JSON.stringify(news.sections)}`);
              const expectedMonitor=officialReceipt.headlines.filter(x=>x.desk_context?.operational_relevance==='MONITOR').length;
              if(news.tiers.some(t=>!['MONITOR','REVIEW','CONTEXT'].includes(t))||
                 news.tiers.filter(t=>t==='MONITOR').length!==expectedMonitor||
                 news.monitorQuestions!==expectedMonitor)
                throw new Error(`${name} desk context tier/questions mismatch ${JSON.stringify(news)}`);
              if(news.sourceLinks.length!==news.officialCards||news.sourceLinks.some(u=>!/^https:\/\/(www\.)?(federalreserve\.gov|ecb\.europa\.eu|ecb\.int|bankofengland\.co\.uk|boj\.or\.jp|snb\.ch|bankofcanada\.ca|rba\.gov\.au|rbnz\.govt\.nz|eia\.gov)\//.test(u)))
                throw new Error(`${name} unauthorised official RSS links ${JSON.stringify(news.sourceLinks)}`);
              if(news.proofLabelCount!==officialReceipt.headlines.filter(h=>h.desk_context?.operational_relevance==='MONITOR').length)throw new Error('News proof labels not visible');
              if(news.fresh!==news.expected)throw new Error(`${name} News signal vintage freshness ${JSON.stringify(news)}`);
              if(news.fresh==='STALE'&&!news.banner.includes(news.content_as_of))
                throw new Error(`${name} dated News signals not visibly caveated ${JSON.stringify(news)}`);
              if(news.w>news.cw+2)throw new Error(`${name} news overflow ${news.w}/${news.cw}`);
              if(errors.length)throw new Error(`${name} console errors: ${errors.join(' | ')}`);
              await page.screenshot({path:`calendar-news-${name}.png`,fullPage:true});
              console.log('CALENDAR_NEWS_UI_PASS',name,JSON.stringify({calendar:cal,news}));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node calendar-news-ui-audit.js
          node validation/test_news_macro_actual_browser_contract_v1.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-news-operational-ui-audit-v1
          path: calendar-news-*.png
          if-no-files-found: error
