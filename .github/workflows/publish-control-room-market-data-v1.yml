name: Publish Control Room Market Data V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-control-room-market-data-v1.yml'
      - 'live_data/sections/NATIVE_RATES_DATA.json'
      - 'live_data/sections/V250_COT_CHART_DATA.json'
      - 'live_data/sections/PAIR_SETUP_OPERATIONAL_VIEW.json'
      - 'live_data/sections/ECB_G8_PRICE_HISTORY.json'
      - 'live_data/sections/DXY_SYNTHETIC_ECB.json'
      - 'validation/RATES_SOURCE_ADAPTERS_V1_2026-10-05.json'
      - 'validation/fixtures/rbnz_b2_official_table_2026-10-19_review_required.json'
      - 'validation/fixtures/rbnz_b2_independent_source_review_2026-10-19.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish-control-room-market-data-v1.yml'
      - 'validation/publishing/verify_control_room_market_delivery_v1.py'
      - 'validation/publishing/test_market_mirror_after_pages_success_v1.py'
      - 'validation/publishing/test_control_room_market_delivery_v1.py'
      - 'validation/publishing/check_control_room_v10_0800_public_sla_v1.py'
      - 'validation/publishing/test_control_room_v10_0800_public_sla_v1.py'
      - 'validation/publishing/verify_control_room_v10_preview_parts_v1.py'
      - 'validation/publishing/test_verify_control_room_v10_preview_parts_v1.py'
      - 'validation/publishing/control_room_v10_frozen_preview_parts_v1.json'
      - 'validation/check_nzd_rates_reviewed_snapshot_v1.py'
      - 'validation/test_nzd_rates_reviewed_snapshot_v1.py'
      - 'validation/RATES_SOURCE_ADAPTERS_V1_2026-10-05.json'
      - 'validation/fixtures/rbnz_b2_official_table_2026-10-19_review_required.json'
      - 'validation/fixtures/rbnz_b2_independent_source_review_2026-10-19.json'
      - 'validation/run_rates_audit.py'
  workflow_run:
    # Pages publishes the canonical payload+manifest; its success is the
    # completion barrier before the separate market-feed mirror owner runs.
    # Recheck only after DXY succeeds: publication keeps strict DXY/ECB date parity.
    # A Rates workflow_run and the Pages job may otherwise contend for the
    # same gh-pages lease, cancelling one pending workflow and leaving the
    # payload current but NATIVE_RATES_DATA.json behind by one observation.
    workflows: ['Rates Persistent Daily V1','COT Persistent Weekly V1','Pair Setup Operational View V1','Price History Persistent Daily V1','DXY Synthetic ECB Research V1','Publish Dashboard Pages V1']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

# Preserve pending morning writes/retries instead of replacing an older
# pending run when another workflow/event is triggered in the same group.
# Each attempt remains serialized; downstream source/lease checks still apply.
# PR validation never occupies the production writer/retry queue.
# All main, workflow_run, workflow_dispatch and schedule triggers retain
# the original shared production group and serialized writes.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('market-data-validation-pr-{0}', github.event.pull_request.number) || 'publish-dashboard-pages-v1' }}
  queue: max
  cancel-in-progress: false

jobs:
  publish-control-room-data:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0

      - name: Validate source feeds
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          paths={
            'rates': Path('live_data/sections/NATIVE_RATES_DATA.json'),
            'cot': Path('live_data/sections/V250_COT_CHART_DATA.json'),
            'setup': Path('live_data/sections/PAIR_SETUP_OPERATIONAL_VIEW.json'),
            'prices': Path('live_data/sections/ECB_G8_PRICE_HISTORY.json'),
            'dxy': Path('live_data/sections/DXY_SYNTHETIC_ECB.json'),
          }
          for name,p in paths.items():
              assert p.is_file() and p.stat().st_size > 1000, f'{name} missing or too small'

          rates=json.loads(paths['rates'].read_text())
          cot=json.loads(paths['cot'].read_text())
          setup=json.loads(paths['setup'].read_text())
          prices=json.loads(paths['prices'].read_text())
          dxy=json.loads(paths['dxy'].read_text())

          g8={'USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'}
          assert set(rates) >= g8
          assert set(cot) >= g8
          assert rates['USD'].get('date')
          # Allow ONLY the NZD source snapshot explicitly reconciled across
          # registry, 2Y/10Y history, and two independent official B2 reviews.
          # A new date alone NEVER authorizes publication or a live fetch.
          from validation.check_nzd_rates_reviewed_snapshot_v1 import validate as validate_nzd
          registry=json.loads(Path('validation/RATES_SOURCE_ADAPTERS_V1_2026-10-05.json').read_text())
          verified_nzd=validate_nzd(rates,registry)
          print('NZD_RATES_TWO_REVIEW_REGISTRY_GATE_PASS',verified_nzd)
          assert cot['USD'].get('dates')

          assert setup.get('schema') == 'GMFQ_PAIR_SETUP_OPERATIONAL_VIEW_V1'
          assert setup.get('status') == 'CURRENT_CANONICAL_ENGINE'
          assert setup.get('pair_count') == 28
          assert len(setup.get('pairs') or {}) == 28
          assert setup.get('price_audit',{}).get('status') == 'PASS'

          assert prices.get('schema') == 'GMFQ_ECB_G8_PRICE_HISTORY_V1'
          assert prices.get('status') == 'CURRENT_OFFICIAL_HISTORY'
          assert isinstance(prices.get('rows'), list) and len(prices['rows']) > 100

          assert dxy.get('schema')=='GMFQ_DXY_SYNTHETIC_ECB_V1'
          assert dxy.get('status')=='ESTIMATED_INFORMATIONAL' and dxy.get('not_official_ice') is True
          assert dxy.get('usable_as_official_ice_or_trade_signal') is False
          assert dxy.get('as_of') == prices.get('last_as_of')
          print(
            'CONTROL_ROOM_MARKET_DATA_SOURCE_PASS',
            rates['USD'].get('date'),
            cot['USD']['dates'][-1],
            setup.get('price_asof'),
            prices['rows'][-1].get('Date'),
          )
          PY

      - name: Test market SHA parity and bounded CDN verifier
        run: |
          python validation/publishing/test_control_room_market_delivery_v1.py
          python validation/publishing/test_market_mirror_after_pages_success_v1.py
          python validation/test_nzd_rates_reviewed_snapshot_v1.py
          python validation/publishing/test_verify_pages_http_delivery_v1.py
          python validation/publishing/test_verify_control_room_v10_preview_parts_v1.py
          python validation/publishing/test_control_room_v10_0800_public_sla_v1.py

      - name: Publish exact feed scope to gh-pages with lease
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages --no-tags
          REMOTE_SHA="$(git rev-parse origin/gh-pages)"
          rm -rf /tmp/gmfq-control-room-data
          git worktree add --detach /tmp/gmfq-control-room-data origin/gh-pages
          mkdir -p /tmp/gmfq-control-room-data/live_data/sections

          FILES=(
            live_data/sections/NATIVE_RATES_DATA.json
            live_data/sections/V250_COT_CHART_DATA.json
            live_data/sections/PAIR_SETUP_OPERATIONAL_VIEW.json
            live_data/sections/ECB_G8_PRICE_HISTORY.json
            live_data/sections/DXY_SYNTHETIC_ECB.json
          )
          for f in "${FILES[@]}"; do
            cp "$f" "/tmp/gmfq-control-room-data/$f"
          done

          cd /tmp/gmfq-control-room-data
          python - <<'PY'
          import subprocess
          allowed={
            'live_data/sections/NATIVE_RATES_DATA.json',
            'live_data/sections/V250_COT_CHART_DATA.json',
            'live_data/sections/PAIR_SETUP_OPERATIONAL_VIEW.json',
            'live_data/sections/ECB_G8_PRICE_HISTORY.json',
            'live_data/sections/DXY_SYNTHETIC_ECB.json',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()) | set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit(f'Control Room data scope violation: {sorted(unexpected)}')
          print('CONTROL_ROOM_MARKET_DATA_SCOPE_PASS', sorted(changed))
          PY

          git add -- "${FILES[@]}"
          if git diff --cached --quiet; then
            echo CONTROL_ROOM_MARKET_DATA_ALREADY_CURRENT
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publish Control Room market data from main ${GITHUB_SHA}"
          REMOTE_SHA_2="$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')"
          test "$REMOTE_SHA_2" = "$REMOTE_SHA" || { echo 'gh-pages moved during Control Room data publication' >&2; exit 1; }
          git push --force-with-lease=refs/heads/gh-pages:$REMOTE_SHA origin HEAD:gh-pages
          echo CONTROL_ROOM_MARKET_DATA_PUBLISHED

      - name: Assert all five gh-pages mirrors and public CDN exact-byte parity
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages --no-tags
          python validation/publishing/verify_control_room_market_delivery_v1.py \
            --root . --budget-seconds 180 --interval-seconds 8 \
            --output /tmp/control-room-market-public-proof.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('/tmp/control-room-market-public-proof.json').read_text())
          assert receipt['status']=='PASS'
          assert receipt['branch']['status']=='PASS'
          assert receipt['public_http']['status']=='PASS'
          assert len(receipt['branch']['checks'])==len(receipt['public_http']['checks'])==5
          print('CONTROL_ROOM_ALL_FIVE_MARKET_PUBLIC_MIRRORS_GREEN')
          PY

      # Independent of Daily Data Orchestrator's 05:00/07:45 scheduled starts.
      # Market mirrors alone do not certify the complete v10 site: check the
      # main dashboard runtime, five market mirrors and preview loader/addons.
      # Read-only; late or incomplete receipts cannot rewrite market data.
      - name: Record full v10 morning public HTTP receipt
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python validation/publishing/check_control_room_v10_0800_public_sla_v1.py \
            --output /tmp/control-room-v10-0800-public-sla.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/control-room-v10-0800-public-sla.json',encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('\n### Control Room v10 · independent 08:00 public check\n')
              out.write('- Status: **'+d['status']+'**\n')
              out.write('- Source checked: '+str(d['source_checked_at_rome'])+'\n')
              out.write('- Public exact bytes: '+str(d['public_verified_at_rome'])+'\n')
              out.write('- Verified files: '+str(d['verified_file_count'])+'/'+str(d.get('expected_file_count'))+'\n')
              out.write('- Full browser rendering is assessed by separate v10 QA.\n')
          PY

      - name: Retain full v10 morning HTTP SLA evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: control-room-v10-0800-public-sla
          path: /tmp/control-room-v10-0800-public-sla.json
          if-no-files-found: warn
          retention-days: 21
