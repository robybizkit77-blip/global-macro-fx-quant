name: Hourly Certified Alert Readiness V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/hourly_alerts/test_build_certified_alert_snapshot.py'
      - 'validation/hourly_alerts/build_certified_alert_snapshot.py'
      - '.github/workflows/hourly-certified-alert-readiness-v1.yml'
  workflow_dispatch:
  schedule:
    # Every day, including weekends.  The classifier itself remains fail-closed.
    - cron: '7 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/hourly-certified-alert-readiness-v1.yml'

permissions:
  contents: write

concurrency:
  group: hourly-certified-alert-readiness-v1
  cancel-in-progress: false

jobs:
  # PR verification runs the exact classifier tests but cannot publish an
  # outbox or push to gh-pages. The schedule remains unchanged.
  validate-classifier:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fail-closed classifier on current certified fixtures
        run: |
          python validation/hourly_alerts/test_build_certified_alert_snapshot.py
          python validation/hourly_alerts/test_build_certified_macro_g8_feed.py
          python validation/hourly_alerts/test_build_chatgpt_market_context.py

  certify:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fail-closed classifier
        run: |
          python validation/hourly_alerts/test_build_certified_alert_snapshot.py
          python validation/hourly_alerts/test_build_certified_macro_g8_feed.py
          python validation/hourly_alerts/test_build_chatgpt_market_context.py
      - name: Validate certified G8 macro event feed
        # This is a committed GitHub snapshot, not a webhook or delivery endpoint.
        # A missing, stale or incomplete snapshot produces a withheld result.
        run: python validation/hourly_alerts/build_certified_macro_g8_feed.py --feed automation/macro_g8/certified-feed.json --output "$RUNNER_TEMP/certified-macro-g8-feed.json"
      - name: Build hourly eligibility receipt
        # Keep this as one shell line: it is safe under both LF and accidental
        # CRLF checkout settings and avoids a trailing-backslash continuation.
        run: python validation/hourly_alerts/build_certified_alert_snapshot.py --macro-feed-snapshot "$RUNNER_TEMP/certified-macro-g8-feed.json" --output "$RUNNER_TEMP/hourly-alert-certification.json"
      - name: Build certified market-context payload for ChatGPT alerts
        run: python validation/hourly_alerts/build_chatgpt_market_context.py --receipt "$RUNNER_TEMP/hourly-alert-certification.json" --output "$RUNNER_TEMP/chatgpt-market-context.json"
      - name: Build Macro Research Desk alert outbox
        run: python validation/hourly_alerts/build_macro_research_desk_alert.py --snapshot "$RUNNER_TEMP/hourly-alert-certification.json" --use-certified-macro-event --output "$RUNNER_TEMP/macro-research-desk-alert.json"
      - name: Build and publish fail-closed public alert JSON
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages --no-tags
          REMOTE_SHA="$(git rev-parse origin/gh-pages)"
          rm -rf /tmp/gmfq-public-alerts
          git worktree add --detach /tmp/gmfq-public-alerts origin/gh-pages
          mkdir -p /tmp/gmfq-public-alerts/live_data/sections
          python validation/hourly_alerts/build_public_macro_alerts.py \
            --receipt "$RUNNER_TEMP/hourly-alert-certification.json" \
            --outbox "$RUNNER_TEMP/macro-research-desk-alert.json" \
            --previous /tmp/gmfq-public-alerts/live_data/sections/MACRO_MARKET_ALERTS.json \
            --output /tmp/gmfq-public-alerts/live_data/sections/MACRO_MARKET_ALERTS.json
          cp "$RUNNER_TEMP/chatgpt-market-context.json" /tmp/gmfq-public-alerts/live_data/sections/CHATGPT_MARKET_CONTEXT.json
          cd /tmp/gmfq-public-alerts
          git add -- live_data/sections/MACRO_MARKET_ALERTS.json live_data/sections/CHATGPT_MARKET_CONTEXT.json
          if git diff --cached --quiet; then echo PUBLIC_ALERT_JSON_ALREADY_CURRENT; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publish certified macro alert view from main ${GITHUB_SHA}"
          REMOTE_SHA_2="$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')"
          test "$REMOTE_SHA_2" = "$REMOTE_SHA" || { echo 'gh-pages moved during alert publication' >&2; exit 1; }
          git push --force-with-lease=refs/heads/gh-pages:$REMOTE_SHA origin HEAD:gh-pages
      - name: Publish human-readable job summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          x=json.load(open(os.environ['RUNNER_TEMP']+'/hourly-alert-certification.json'))
          a=json.load(open(os.environ['RUNNER_TEMP']+'/macro-research-desk-alert.json'))
          s=x['summary']
          print('# Hourly alert certification')
          print(f"Evaluation date: `{x['as_of_evaluation_date']}`")
          print(f"Aggregate state: `{s['state']}` (aggregate GREEN intentionally disabled)")
          for key in ('available_certified','stale','unavailable'):
              print(f"\n## {key.replace('_', ' ').title()}")
              print(', '.join(s[key]) if s[key] else 'None')
          print('\n## Desk alert')
          print(f"Kind: `{a['kind']}`; delivery: `{a['delivery']['status']}`")
          print('GitHub produces a pull-only outbox. ChatGPT delivery is a separate scheduled-task action.')
          PY
      - name: Upload certification receipt
        uses: actions/upload-artifact@v4
        with:
          name: hourly-alert-certification-${{ github.run_id }}
          path: ${{ runner.temp }}/hourly-alert-certification.json
          retention-days: 30
      - name: Upload certified macro feed receipt and Desk alert outbox
        uses: actions/upload-artifact@v4
        with:
          name: macro-research-desk-alert-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/macro-research-desk-alert.json
            ${{ runner.temp }}/certified-macro-g8-feed.json
          retention-days: 30
