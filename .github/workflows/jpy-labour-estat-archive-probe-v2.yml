name: JPY Labour e-Stat Archive Probe V2

on:
  push:
    branches:
      - 'validation-jpy-labour-strict-pit-v2-*'
    paths:
      - 'validation/probe_jpy_labour_estat_archive_v2.py'
      - '.github/workflows/jpy-labour-estat-archive-probe-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe immutable e-Stat monthly archive route
        run: python validation/probe_jpy_labour_estat_archive_v2.py | tee /tmp/jpy-labour-estat-probe.json
      - name: Enforce read-only repository state
        run: git diff --exit-code
      - name: Upload route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpy-labour-estat-archive-probe-${{ github.run_id }}
          path: /tmp/jpy-labour-estat-probe.json
          if-no-files-found: error
          retention-days: 90
