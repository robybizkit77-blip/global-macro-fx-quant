name: JPY TONA Source Probe

on:
  push:
    branches:
      - validation-jpy-tona-refresh-readiness-2026-10-08
    paths:
      - '.github/workflows/jpy-tona-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser dependencies
        run: python3 -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Probe official TFX historical form
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          url='https://www.tfx.co.jp/en/historical/futures/'
          r=requests.get(url,timeout=30,headers={'User-Agent':'GLOBAL-MACRO-FX-QUANT validation'})
          r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          out=[]
          for i,form in enumerate(soup.find_all('form')):
            fields=[]
            for el in form.find_all(['input','select','button']):
              fields.append({'tag':el.name,'name':el.get('name'),'value':el.get('value'),'type':el.get('type'),'id':el.get('id')})
            text=' '.join(form.stripped_strings)
            if 'TONA' in text or 'Summary Data' in text or any('HistoricalData' in str(x.get('name')) for x in fields):
              out.append({'index':i,'action':urljoin(url,form.get('action') or ''),'method':(form.get('method') or 'GET').upper(),'text':text[:1200],'fields':fields})
          data={'page':url,'status_code':r.status_code,'forms':out}
          open('/tmp/tfx-form-probe.json','w').write(json.dumps(data,indent=2,ensure_ascii=False))
          print(json.dumps(data,indent=2,ensure_ascii=False))
          if not out:
            raise SystemExit('No relevant TFX historical form discovered')
          PY
      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: jpy-tona-source-probe
          path: /tmp/tfx-form-probe.json
          if-no-files-found: error
          retention-days: 7
