name: GBP BoE OIS browser test

on:
  push:
    branches:
      - test-gbp-boe-ois-browser-2026-09-30

jobs:
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify payload structure
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          for i in $(seq -w 0 15); do test -f "payload/part-${i}.txt"; done
          test "$(find payload -maxdepth 1 -type f -name 'part-*.txt' | wc -l)" -eq 16
      - name: Start local server
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/gmfq-server.log 2>&1 &
          sleep 2
      - name: Render and validate GBP OIS
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=15000 --dump-dom http://127.0.0.1:8000/ > rendered.html 2> chrome.log
          ! grep -q "Errore caricamento dashboard" rendered.html
          ! grep -q "Caricamento GLOBAL MACRO FX QUANT" rendered.html
          grep -q 'data-gbp-ois-audit="PASS"' rendered.html
          grep -q 'data-gbp-ois-asof="2026-09-29"' rendered.html
          grep -q "Bank of England · Sterling OIS" rendered.html
          grep -q "4.865918765906023" rendered.html
          test "$(wc -c < rendered.html)" -gt 500000
          echo "PASS: GBP BoE OIS active and rendered"
          echo "Rendered bytes: $(wc -c < rendered.html)"
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbp-boe-ois-browser-test
          path: |
            rendered.html
            chrome.log
            /tmp/gmfq-server.log
