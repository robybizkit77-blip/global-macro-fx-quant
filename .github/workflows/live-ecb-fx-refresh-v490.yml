name: Live ECB FX Refresh v490

on:
  push:
    branches: [staging-live-data-refresh-v1-2026-10-04]
    paths:
      - "validation/refresh_ecb_live_fx_prices.py"
      - ".github/workflows/live-ecb-fx-refresh-v490.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh FX prices from ECB reference rates
        run: python validation/refresh_ecb_live_fx_prices.py
      - name: Repack live data into v490 payload
        run: python validation/repack_v490_from_live_data.py --write
      - name: Verify engine unchanged
        run: python validation/verify_live_refresh_engine_unchanged.py
      - name: Re-inventory runtime
        run: python validation/inventory_v490_runtime_data.py
      - name: Commit staged ECB FX refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_data/sections/D.json payload validation/ECB_LIVE_FX_REFRESH_AUDIT_2026-10-04.json validation/V490_LIVE_DATA_REPACK_AUDIT_2026-10-04.json validation/LIVE_REFRESH_ENGINE_INTEGRITY_2026-10-04.json validation/LIVE_RUNTIME_DATA_INVENTORY_2026-10-04.json
          if git diff --cached --quiet; then
            echo "No FX refresh changes"
            exit 0
          fi
          git commit -m "Stage official ECB FX refresh to Oct 2"
          git push
