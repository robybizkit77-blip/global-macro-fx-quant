name: TEMP CAD Labour Row Diagnostic

on:
  push:
    branches:
      - 'validation-macro-cad-labour-pit-bootstrap-2026-10-09'
    paths:
      - '.github/workflows/temp-cad-labour-row-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print all matching StatCan labour rows for Jul/Aug 2026
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, io, json, urllib.request, zipfile
          from collections import Counter
          URL='https://www150.statcan.gc.ca/n1/en/tbl/csv/14100287-eng.zip'
          req=urllib.request.Request(URL,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=90) as r:data=r.read()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              name=next(n for n in z.namelist() if n.lower().endswith('.csv') and 'meta' not in n.lower())
              rows=list(csv.DictReader(io.StringIO(z.read(name).decode('utf-8-sig'))))
          def norm(x): return str(x or '').strip().lower()
          matches=[]
          for r in rows:
              if str(r.get('REF_DATE',''))[:7] not in {'2026-07','2026-08'}: continue
              if norm(r.get('GEO') or r.get('Geography'))!='canada': continue
              char=norm(r.get('Labour force characteristics'))
              sex=norm(r.get('Gender') or r.get('Sex'))
              age=norm(r.get('Age group'))
              stat=norm(r.get('Statistics'))
              data_type=norm(r.get('Data type'))
              if 'unemployment rate' not in char: continue
              if sex and 'both sexes' not in sex and 'total' not in sex: continue
              if age and '15 years and over' not in age: continue
              if stat and stat!='estimate': continue
              if data_type and data_type!='seasonally adjusted': continue
              matches.append(r)
          print(json.dumps({'count':len(matches),'columns':list(rows[0].keys()) if rows else []},indent=2))
          keep=['REF_DATE','GEO','Labour force characteristics','Gender','Sex','Age group','Statistics','Data type','UOM','VALUE','North American Industry Classification System (NAICS)','Educational attainment','Immigrant status','Population group','Class of worker','Job permanency','Full- and part-time','Type of work','Wages']
          for r in matches:
              print(json.dumps({k:r.get(k) for k in keep if k in r},ensure_ascii=False))
          for k in (rows[0].keys() if rows else []):
              vals=Counter(str(r.get(k,'')) for r in matches)
              if len(vals)>1:
                  print('VAR',k,dict(vals))
          PY
