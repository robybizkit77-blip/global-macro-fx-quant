name: Inflation Labour Hierarchy UI Gate V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'dashboard/inflationlabour-hierarchy-v1.js'
      - '.github/workflows/inflationlabour-hierarchy-ui-gate-v1.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'dashboard/inflationlabour-hierarchy-v1.js'
      - '.github/workflows/inflationlabour-hierarchy-ui-gate-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start dashboard
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/inflationlabour-hierarchy-ui.log 2>&1 &
          sleep 2
      - name: Verify Inflation Labour hierarchy desktop mobile
        run: |
          cat > inflationlabour-hierarchy-gate.js <<'EOF'
          const { chromium }=require('playwright');
          const CCYS=['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];
          async function run(viewport,label){
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport});
            const consoleErrors=[],pageErrors=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.settled_after_cad_chain===true,null,{timeout:120000});
            await page.waitForFunction(()=>window.GMFQ_PREMIUM_SHELL?.status==='ACTIVE'&&window.GMFQ_PRODUCT_LANGUAGE?.status==='ACTIVE'&&window.GMFQ_INFLATIONLABOUR_HIERARCHY?.status==='ACTIVE',null,{timeout:120000});
            await page.evaluate(()=>window.showView?.('inflationlabour'));
            await page.waitForTimeout(800);
            const snap=await page.evaluate(({vw,vh})=>{
              const root=document.getElementById('inflationlabour');
              const grid=document.getElementById('il407Grid');
              const cards=[...(grid?.querySelectorAll(':scope > .il407Card')||[])];
              const rb=root?.getBoundingClientRect(),gb=grid?.getBoundingClientRect();
              return {
                state:window.GMFQ_INFLATIONLABOUR_HIERARCHY,
                marker:root?.getAttribute('data-gmfq-hierarchy'),
                rootHeight:rb?.height||0,
                pageScreens:(rb?.height||0)/vh,
                grid:{w:gb?.width||0,h:gb?.height||0,scrollWidth:grid?.scrollWidth||0,clientWidth:grid?.clientWidth||0,overflowX:grid?getComputedStyle(grid).overflowX:null,display:grid?getComputedStyle(grid).display:null},
                cards:cards.map(c=>({text:String(c.innerText||'').replace(/\s+/g,' ').trim(),h:c.getBoundingClientRect().height,w:c.getBoundingClientRect().width,display:getComputedStyle(c).display})),
                documentOverflow:document.documentElement.scrollWidth-vw,
                macroIntegrity:typeof window.macroCategoryIntegrity==='function'?window.macroCategoryIntegrity():null,
                owner:window.GMFQ_MACRO_OPERATIONAL?.status||null
              };
            },{vw:viewport.width,vh:viewport.height});
            console.log(label,JSON.stringify(snap,null,2));
            if(snap.state?.schema!=='GMFQ_INFLATIONLABOUR_HIERARCHY_V1'||snap.state?.status!=='ACTIVE'||snap.state?.scope!=='PRESENTATION_ONLY'||snap.state?.core_effect!=='NONE') throw new Error(label+' bad hierarchy state '+JSON.stringify(snap.state));
            if(snap.marker!=='inflationlabour-v1') throw new Error(label+' hierarchy marker missing');
            if(snap.cards.length!==8) throw new Error(label+' expected 8 cards got '+snap.cards.length);
            const all=snap.cards.map(x=>x.text).join(' ');
            for(const c of CCYS) if(!all.includes(c)) throw new Error(label+' missing currency '+c);
            for(const term of ['Inflazione','Disoccupazione','percentile']) if(!all.includes(term)) throw new Error(label+' analytical content lost '+term);
            if(snap.cards.some(c=>c.display==='none'||c.h<=0||c.w<=0)) throw new Error(label+' hidden card '+JSON.stringify(snap.cards));
            if(snap.documentOverflow>4) throw new Error(label+' document horizontal overflow '+snap.documentOverflow);
            if(snap.macroIntegrity?.ok!==true) throw new Error(label+' macro integrity '+JSON.stringify(snap.macroIntegrity));
            if(label==='mobile'){
              if(!(snap.grid.scrollWidth>snap.grid.clientWidth+100)) throw new Error(label+' horizontal G8 rail missing '+JSON.stringify(snap.grid));
              if(snap.grid.overflowX!=='auto') throw new Error(label+' grid overflow not auto '+snap.grid.overflowX);
              if(snap.pageScreens>1.8) throw new Error(label+' page still too tall '+snap.pageScreens.toFixed(2)+' screens');
            }else{
              if(snap.pageScreens>3.2) throw new Error(label+' desktop regression '+snap.pageScreens.toFixed(2)+' screens');
            }
            const runtimeErr=/\b[A-Za-z_$][\w$]*\s+is\s+not\s+defined\b|ReferenceError/i;
            if(consoleErrors.some(x=>runtimeErr.test(x))||pageErrors.some(x=>runtimeErr.test(x))) throw new Error(label+' runtime scope error '+consoleErrors.concat(pageErrors).join(' | '));
            await browser.close();
            console.log(label,'INFLATIONLABOUR_HIERARCHY_UI_PASS',snap.pageScreens.toFixed(2));
          }
          (async()=>{await run({width:1440,height:1100},'desktop');await run({width:390,height:844},'mobile');console.log('INFLATIONLABOUR_HIERARCHY_UI_GATE_V1 PASS');})().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node inflationlabour-hierarchy-gate.js
