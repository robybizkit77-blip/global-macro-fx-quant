name: JPY Frozen Macro Replay V1
on:
  push:
    paths:
      - 'validation/run_jpy_frozen_macro_replay_v1.py'
      - '.github/workflows/jpy-frozen-macro-replay-v1.yml'
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-minimum-robust-pit-dataset-2026-10-06
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run JPY frozen Macro replay
        run: python validation/run_jpy_frozen_macro_replay_v1.py
      - name: Strict engine/live-data guard
        run: git diff --exit-code -- engine live_data
      - name: Commit evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/JPY_FROZEN_MACRO_REPLAY_V1_2026-10-06.json
          git diff --cached --quiet || git commit -m 'Record JPY frozen Macro replay V1'
          git pull --rebase origin audit-minimum-robust-pit-dataset-2026-10-06
          git push origin HEAD:audit-minimum-robust-pit-dataset-2026-10-06
