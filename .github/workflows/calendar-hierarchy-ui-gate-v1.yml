name: Calendar Hierarchy UI Gate V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'dashboard/calendar-hierarchy-v1.js'
      - '.github/workflows/calendar-hierarchy-ui-gate-v1.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'dashboard/calendar-hierarchy-v1.js'
      - '.github/workflows/calendar-hierarchy-ui-gate-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start dashboard
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/calendar-hierarchy-ui.log 2>&1 &
          sleep 2
      - name: Verify Calendar hierarchy desktop mobile
        run: |
          cat > calendar-hierarchy-gate.js <<'EOF'
          const { chromium }=require('playwright');
          async function run(viewport,label){
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport});
            const consoleErrors=[],pageErrors=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.settled_after_cad_chain===true,null,{timeout:120000});
            await page.waitForFunction(()=>window.GMFQ_PREMIUM_SHELL?.status==='ACTIVE'&&window.GMFQ_PRODUCT_LANGUAGE?.status==='ACTIVE'&&window.GMFQ_CALENDAR_HIERARCHY?.status==='ACTIVE',null,{timeout:120000});
            await page.evaluate(()=>window.showView?.('calendar'));
            await page.waitForTimeout(900);
            const snap=await page.evaluate(({vw,vh})=>{
              const view=document.getElementById('calendar');
              const root=view?.querySelector('[data-gmfq-operational="calendar"]');
              const cb=root?.querySelector('[data-gmfq-calendar-rail="cb"]');
              const macro=root?.querySelector('[data-gmfq-calendar-rail="macro"]');
              const cards=[...(root?.querySelectorAll('.opCard')||[])];
              const cbCards=cards.filter(x=>x.dataset.kind==='cb');
              const macroCards=cards.filter(x=>x.dataset.kind==='macro');
              const b=root?.getBoundingClientRect();
              const grid=g=>g?{h:g.getBoundingClientRect().height,w:g.getBoundingClientRect().width,scrollWidth:g.scrollWidth,clientWidth:g.clientWidth,overflowX:getComputedStyle(g).overflowX,display:getComputedStyle(g).display}:null;
              return {
                state:window.GMFQ_CALENDAR_HIERARCHY,
                operational:window.GMFQ_CALENDAR_NEWS_OPERATIONAL,
                marker:root?.getAttribute('data-gmfq-hierarchy'),
                pageScreens:(b?.height||0)/vh,
                total:cards.length,cbCount:cbCards.length,macroCount:macroCards.length,
                visibleCards:cards.filter(x=>getComputedStyle(x).display!=='none'&&x.getBoundingClientRect().height>0&&x.getBoundingClientRect().width>0).length,
                cb:grid(cb),macro:grid(macro),
                consensusCards:cards.filter(x=>x.querySelector('.opConsensus')).length,
                highCards:cards.filter(x=>x.querySelector('.opHigh')).length,
                text:String(root?.innerText||'').replace(/\s+/g,' ').trim(),
                documentOverflow:document.documentElement.scrollWidth-vw,
                ownerCount:view?.querySelectorAll('[data-gmfq-operational="calendar"]').length||0
              };
            },{vw:viewport.width,vh:viewport.height});
            console.log(label,JSON.stringify(snap,null,2));
            if(snap.state?.schema!=='GMFQ_CALENDAR_HIERARCHY_V1'||snap.state?.status!=='ACTIVE'||snap.state?.scope!=='PRESENTATION_ONLY'||snap.state?.core_effect!=='NONE') throw new Error(label+' bad hierarchy state '+JSON.stringify(snap.state));
            if(snap.marker!=='calendar-v1'||snap.ownerCount!==1) throw new Error(label+' Calendar owner/hierarchy marker '+JSON.stringify({marker:snap.marker,owner:snap.ownerCount}));
            if(snap.operational?.status!=='ACTIVE'||snap.operational?.calendar_events!==28||snap.operational?.macro_events!==20) throw new Error(label+' operational event coverage '+JSON.stringify(snap.operational));
            if(snap.total!==28||snap.cbCount!==8||snap.macroCount!==20||snap.visibleCards!==28) throw new Error(label+' visible event coverage '+JSON.stringify({total:snap.total,cb:snap.cbCount,macro:snap.macroCount,visible:snap.visibleCards}));
            if(snap.consensusCards<20||snap.highCards<1) throw new Error(label+' event detail coverage '+JSON.stringify({consensus:snap.consensusCards,high:snap.highCards}));
            for(const term of ['Calendario','Banche centrali','Dati macro','USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD','Consensus']) if(!snap.text.toLocaleLowerCase('it').includes(term.toLocaleLowerCase('it'))) throw new Error(label+' Calendar content lost '+term);
            if(snap.documentOverflow>4) throw new Error(label+' document horizontal overflow '+snap.documentOverflow);
            if(label==='mobile'){
              for(const [k,g] of Object.entries({cb:snap.cb,macro:snap.macro})){
                if(!g||g.overflowX!=='auto'||!(g.scrollWidth>g.clientWidth+100)) throw new Error(label+' expected horizontal rail missing '+k+' '+JSON.stringify(g));
              }
              if(snap.pageScreens>2.4) throw new Error(label+' Calendar still too tall '+snap.pageScreens.toFixed(2)+' screens');
            }else if(snap.pageScreens>4.5) throw new Error(label+' desktop Calendar regression '+snap.pageScreens.toFixed(2)+' screens');
            const runtimeErr=/\b[A-Za-z_$][\w$]*\s+is\s+not\s+defined\b|ReferenceError/i;
            if(consoleErrors.some(x=>runtimeErr.test(x))||pageErrors.some(x=>runtimeErr.test(x))) throw new Error(label+' runtime scope error '+consoleErrors.concat(pageErrors).join(' | '));
            await browser.close();
            console.log(label,'CALENDAR_HIERARCHY_UI_PASS',snap.pageScreens.toFixed(2));
          }
          (async()=>{await run({width:1440,height:1100},'desktop');await run({width:390,height:844},'mobile');console.log('CALENDAR_HIERARCHY_UI_GATE_V1 PASS');})().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node calendar-hierarchy-gate.js
