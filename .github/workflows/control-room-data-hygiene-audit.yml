name: Control Room Data Hygiene Audit

on:
  push:
    branches:
      - 'staging-control-room-data-hygiene-*'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/control-room-server.log 2>&1 &
          sleep 2
      - name: Audit Control Room data hygiene
        run: |
          cat > /tmp/control-room-audit.js <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            const pageErrors=[]; const consoleErrors=[]; const failed=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('requestfailed',r=>failed.push(`${r.url()} :: ${r.failure()?.errorText||'failed'}`));
            const res=await page.goto('http://127.0.0.1:8000/site/website-v1/',{waitUntil:'domcontentloaded',timeout:120000});
            if(!res?.ok()) throw new Error('Home HTTP failure');
            await page.waitForFunction(()=>document.documentElement.getAttribute('data-market-snapshot')==='READY'&&document.documentElement.getAttribute('data-website-live-adapter')==='READY',null,{timeout:120000});
            await page.waitForTimeout(1200);
            const before=await page.evaluate(()=>({
              attrs:{
                market:document.documentElement.getAttribute('data-market-snapshot'),
                adapter:document.documentElement.getAttribute('data-website-live-adapter'),
                fx:document.documentElement.getAttribute('data-fx-freshness'),
                rates:document.documentElement.getAttribute('data-rates-freshness'),
                ratesPanel:document.documentElement.getAttribute('data-rates-panel-freshness'),
                cot:document.documentElement.getAttribute('data-cot-freshness'),
                changed:document.documentElement.getAttribute('data-what-changed-freshness'),
                themes:document.documentElement.getAttribute('data-themes-freshness')
              },
              ticker:[...document.querySelectorAll('.ticker-strip .ticker')].map(x=>x.innerText.trim()),
              changed:document.querySelector('.changed .change-list')?.innerText||'',
              cot:document.querySelector('.cot-card')?.innerText||'',
              themes:document.querySelector('.themes .theme-grid')?.innerText||'',
              rates:document.querySelector('.rates')?.innerText||'',
              calendar:document.querySelector('.calendar-table')?.innerText||'',
              hierarchy:[...document.querySelectorAll('.hierarchy .rankrow em')].map(x=>x.textContent),
              navEntries:performance.getEntriesByType('navigation').length
            }));
            if(before.ticker.length!==8) throw new Error('Expected 8 ticker cards');
            const expected={market:'READY',adapter:'READY',fx:'FRESH',rates:'WITHHELD',ratesPanel:'WITHHELD',cot:'WITHHELD',changed:'WITHHELD',themes:'WITHHELD'};
            for(const [k,v] of Object.entries(expected)) if(before.attrs[k]!==v) throw new Error(`Freshness ${k}: expected ${v}, got ${before.attrs[k]}`);
            if(!before.changed.includes('Aggiornamento trattenuto')) throw new Error('What Changed not visibly withheld');
            if(!before.cot.includes('COT trattenuto')) throw new Error('COT not visibly withheld');
            if(!before.themes.includes('Top Themes trattenuti')) throw new Error('Themes not visibly withheld');
            if(!before.rates.includes('WITHHELD') || !before.rates.includes('6 Ott 2026')) throw new Error('Rates stale status not visible');
            if(!before.calendar.includes('19 Ott') || !before.calendar.includes('CAD')) throw new Error('Upcoming calendar not rendered');
            const fxBefore=before.ticker.slice(0,6).join('|');
            await page.evaluate(()=>window.__gmfqSentinel=Math.random());
            const sentinel=await page.evaluate(()=>window.__gmfqSentinel);
            await page.locator('.hero-tabs [data-timeframe="1W"]').click();
            await page.waitForTimeout(250);
            const after=await page.evaluate(()=>({
              sentinel:window.__gmfqSentinel,
              tf:new URLSearchParams(location.search).get('tf'),
              ticker:[...document.querySelectorAll('.ticker-strip .ticker')].map(x=>x.innerText.trim()),
              navEntries:performance.getEntriesByType('navigation').length
            }));
            if(after.sentinel!==sentinel || after.navEntries!==1) throw new Error('Timeframe caused document reload');
            if(after.tf!=='1W') throw new Error('Timeframe URL state not updated');
            if(after.ticker.slice(0,6).join('|')===fxBefore) throw new Error('FX timeframe values did not change');
            const hBefore=before.hierarchy.join('|');
            await page.locator('.hierarchy .mini-tabs b').filter({hasText:'1W'}).click();
            await page.waitForTimeout(150);
            const hAfter=await page.evaluate(()=>[...document.querySelectorAll('.hierarchy .rankrow em')].map(x=>x.textContent).join('|'));
            if(hAfter===hBefore) throw new Error('Hierarchy timeframe did not change');
            if(pageErrors.length) throw new Error('Page errors: '+pageErrors.join(' | '));
            if(consoleErrors.length) throw new Error('Console errors: '+consoleErrors.join(' | '));
            if(failed.length) throw new Error('Failed requests: '+failed.join(' | '));
            console.log(JSON.stringify({status:'PASS',before,after,hAfter},null,2));
            await page.screenshot({path:'control-room-data-hygiene.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error('::error title=Control Room data hygiene::'+String(e.message||e));process.exit(1)});
          EOF
          node /tmp/control-room-audit.js
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-room-data-hygiene
          path: |
            control-room-data-hygiene.png
            /tmp/control-room-server.log
