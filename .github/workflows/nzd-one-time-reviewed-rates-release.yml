name: NZD One Time Reviewed Rates Release
on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/publish_nzd_reviewed_rates_once_v1.py'
      - '.github/workflows/nzd-one-time-reviewed-rates-release.yml'
  push:
    branches: [main]
    paths:
      - 'validation/publish_nzd_reviewed_rates_once_v1.py'
      - '.github/workflows/nzd-one-time-reviewed-rates-release.yml'
permissions:
  contents: write
concurrency:
  group: nzd-reviewed-one-time-release
  cancel-in-progress: false
jobs:
  guarded-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck exact source and immutable original
        run: |
          set -euo pipefail
          mkdir -p /tmp/nzd-release
          python validation/publish_nzd_reviewed_rates_once_v1.py /tmp/nzd-release/NATIVE_RATES_DATA.json | tee /tmp/nzd-release/release-receipt.json
          git diff --exit-code -- live_data payload site
      - name: Run full candidate runtime publication in checkout
        run: |
          set -euo pipefail
          python validation/update_live_direct_section.py --section NATIVE_RATES_DATA --replacement /tmp/nzd-release/NATIVE_RATES_DATA.json --apply > /tmp/nzd-release/direct.json
          python validation/build_rates_audit_metadata.py --audit-date "$(date -u +%Y-%m-%d)" --output /tmp/nzd-release/RATES_AUDIT_METADATA.json
          python validation/update_live_derived_sections.py --rates /tmp/nzd-release/RATES_AUDIT_METADATA.json --apply > /tmp/nzd-release/derived.json
          python validation/build_live_manifest_v2.py --write live_data/manifest.v2.json > /tmp/nzd-release/manifest.json
          python validation/check_live_update_contract.py > /tmp/nzd-release/contract.json
          python validation/rebuild_live_data_runtime.py --verify-only > /tmp/nzd-release/roundtrip.json
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          folder=Path('/tmp/nzd-release')
          direct=json.load(open(folder/'direct.json'))
          contract=json.load(open(folder/'contract.json'))
          roundtrip=json.load(open(folder/'roundtrip.json'))
          assert direct['status']=='PASS' and direct['changed_payload_parts']==[0],direct
          assert contract['status']=='PASS',contract
          assert roundtrip['status']=='PASS' and roundtrip['noop_roundtrip_byte_identical'] is True,roundtrip
          d=json.load(open('live_data/sections/NATIVE_RATES_DATA.json'))
          assert d['NZD']['date']=='2026-10-16' and d['NZD']['2Y']==3.89 and d['NZD']['10Y']==5.0
          assert d['NZD']['quality']=='FULL_CURRENT_OFFICIAL_MANUAL_VERIFIED'
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={'live_data/sections/NATIVE_RATES_DATA.json','live_data/sections/RATES_AUDIT_METADATA.json',
             'live_data/manifest.v2.json','payload/part-00.txt','payload/part-15.txt'}
          assert 'live_data/sections/NATIVE_RATES_DATA.json' in changed and changed<=allowed,changed
          print('NZD_MANUAL_OFFICIAL_RELEASE_FULL_RUNTIME_GREEN',sorted(changed))
          PY
      - name: PR only simulates, does not publish
        if: github.event_name == 'pull_request'
        run: |
          git checkout -- live_data payload
          git diff --exit-code -- live_data payload site
          echo NZD_RELEASE_PR_DRY_RUN_ONLY_PASS
      - name: Atomic main push with head lease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$REMOTE_SHA" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live_data/sections/NATIVE_RATES_DATA.json live_data/sections/RATES_AUDIT_METADATA.json live_data/manifest.v2.json payload/part-00.txt payload/part-15.txt
          git diff --cached --quiet && { echo 'No changes to release'; exit 0; }
          git commit -m 'Promote independently reviewed NZD RBNZ B2 snapshot 16 Oct 2026'
          REMOTE_SHA2="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$REMOTE_SHA2" = "$GITHUB_SHA"
          git push origin HEAD:main
          echo NZD_REVIEWED_RATES_PRODUCTION_PUBLISHED
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nzd-one-time-reviewed-release-evidence
          path: /tmp/nzd-release/
          if-no-files-found: warn
