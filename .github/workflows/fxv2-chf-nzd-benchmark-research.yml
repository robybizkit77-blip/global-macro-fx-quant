name: FX Quant V2 CHF NZD Same-Basis Research Refresh

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/rates/refresh_fxv2_chf_nzd_benchmark_context.py'
      - 'validation/rates/fxv2_chf_nzd_schedule_gate_v1.py'
      - 'validation/rates/test_fxv2_chf_nzd_schedule_gate_v1.py'
      - 'validation/rates/report_fxv2_chf_nzd_freshness_v1.py'
      - 'validation/rates/test_report_fxv2_chf_nzd_freshness_v1.py'
      - 'validation/rates/collect_rbnz_b2_daily_web_v1.py'
      - 'validation/rates/collect_fxv2_nzd_eolas_api_v1.py'
      - 'validation/rates/test_collect_fxv2_nzd_eolas_api_v1.py'
      - 'validation/rates/test_collect_rbnz_b2_daily_web_v1.py'
      - 'validation/rates/test_refresh_fxv2_chf_nzd_benchmark_context.py'
      - 'site/fx-quant-v2/chf-nzd-benchmark-research.json'
      - 'site/fx-quant-v2/tassi.html'
      - '.github/workflows/fxv2-chf-nzd-benchmark-research.yml'
  push:
    branches: [main]
    paths:
      - 'validation/rates/refresh_fxv2_chf_nzd_benchmark_context.py'
      - 'validation/rates/fxv2_chf_nzd_schedule_gate_v1.py'
      - 'validation/rates/test_fxv2_chf_nzd_schedule_gate_v1.py'
      - 'validation/rates/report_fxv2_chf_nzd_freshness_v1.py'
      - 'validation/rates/test_report_fxv2_chf_nzd_freshness_v1.py'
      - 'validation/rates/collect_rbnz_b2_daily_web_v1.py'
      - 'validation/rates/collect_fxv2_nzd_eolas_api_v1.py'
      - 'validation/rates/test_collect_fxv2_nzd_eolas_api_v1.py'
      - 'validation/rates/test_collect_rbnz_b2_daily_web_v1.py'
      - 'validation/rates/test_refresh_fxv2_chf_nzd_benchmark_context.py'
      - 'site/fx-quant-v2/chf-nzd-benchmark-research.json'
      - 'site/fx-quant-v2/tassi.html'
      - '.github/workflows/fxv2-chf-nzd-benchmark-research.yml'
  schedule:
    # Early source attempt at 06:30 Europe/Rome before the 08:00 V2 check.
    # The gate below skips the duplicate UTC slot in CET/CEST.
    - cron: '30 4 * * 1-5'  # 06:30 CEST
    - cron: '30 5 * * 1-5'  # 06:30 CET
    # Retain the existing late official source retry slots.
    - cron: '45 8 * * 1-5'
    - cron: '30 18 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fxv2-chf-nzd-benchmark-research
  cancel-in-progress: false

jobs:
  research-feed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test CHF matched SNB tenors and NZD benchmark roll safeguards
        run: |
          python3 validation/rates/test_refresh_fxv2_chf_nzd_benchmark_context.py
          python3 validation/rates/test_fxv2_chf_nzd_schedule_gate_v1.py
          python3 validation/rates/test_report_fxv2_chf_nzd_freshness_v1.py
          python3 validation/rates/test_collect_rbnz_b2_daily_web_v1.py
          python3 validation/rates/test_collect_fxv2_nzd_eolas_api_v1.py
          python3 validation/rates/test_recover_chf_snb_paired_history_v1.py
      - name: Rome 06:30 DST-safe source collection gate
        id: gate
        shell: bash
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          python3 validation/rates/fxv2_chf_nzd_schedule_gate_v1.py \
            --event "$GH_EVENT_NAME" --cron "$GH_EVENT_SCHEDULE" \
            --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

      - name: Fetch the newest NZD B2 same-row government yields from RBNZ public HTML
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Do not convert a source outage into a false 'fresh' observation.
          # CHF remains independently refreshable if RBNZ is unavailable.
          if python3 validation/rates/collect_rbnz_b2_daily_web_v1.py \
            --output /tmp/fxv2-rbnz-b2-daily-source.json; then
            echo 'FXV2_RBNZ_B2_LIVE_SOURCE_READ_SUCCEEDED'
          else
            echo 'FXV2_RBNZ_B2_LIVE_SOURCE_UNAVAILABLE: previous dated NZD context retained'
            rm -f /tmp/fxv2-rbnz-b2-daily-source.json
          fi
      - name: Use authorized eolas API only when the quota-safe slot is permitted
        if: steps.gate.outputs.should_run == 'true' && github.event_name != 'pull_request'
        shell: bash
        env:
          EOLAS_API_KEY: ${{ secrets.EOLAS_API_KEY }}
          VENDOR_SLOT: ${{ steps.gate.outputs.vendor_slot }}
        run: |
          set -euo pipefail
          if [ -f /tmp/fxv2-rbnz-b2-daily-source.json ]; then
            echo 'NZD_SOURCE=RBNZ_OFFICIAL_HTML' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$VENDOR_SLOT" != "true" ]; then
            echo 'NZD_SOURCE=NO_VENDOR_REQUEST_THIS_SLOT: protect API quotas' >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "${EOLAS_API_KEY:-}" ]; then
            echo 'NZD_SOURCE=UNAVAILABLE: RBNZ HTTP block and EOLAS_API_KEY not configured' >> "$GITHUB_STEP_SUMMARY"
          elif python3 validation/rates/collect_fxv2_nzd_eolas_api_v1.py --output /tmp/fxv2-rbnz-b2-eolas-research.json; then
            echo 'NZD_SOURCE=EO_AUTHORIZED_RBNZ_REPUBLISHED_RESEARCH' >> "$GITHUB_STEP_SUMMARY"
          else
            rm -f /tmp/fxv2-rbnz-b2-eolas-research.json
            echo 'NZD_SOURCE=UNAVAILABLE: eolas API failed; previous dated observations retained' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build independently dated CHF source and NZD post-roll research
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=/tmp/fxv2-rbnz-b2-daily-source.json
          if [ ! -f "$CANDIDATE" ] && [ -f /tmp/fxv2-rbnz-b2-eolas-research.json ]; then
            CANDIDATE=/tmp/fxv2-rbnz-b2-eolas-research.json
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python3 validation/rates/refresh_fxv2_chf_nzd_benchmark_context.py \
              --nzd-daily-candidate "$CANDIDATE" \
              --output /tmp/fxv2-chf-nzd-research-candidate.json
          else
            python3 validation/rates/refresh_fxv2_chf_nzd_benchmark_context.py \
              --nzd-daily-candidate "$CANDIDATE"
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          path=Path('site/fx-quant-v2/chf-nzd-benchmark-research.json')
          j=json.loads(path.read_text())['NZD']
          note=('NZD latest research observation: '+j['latest_date']+
                ', method: '+j.get('source_capture_method','ARCHIVED_CONTEXT')+
                '. GitHub workflow green does not guarantee a new RBNZ observation.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('\n'+note+'\n')
          print('FXV2_NZD_SOURCE_STATUS',note)
          PY
      - name: Check dated CHF/NZD source age and preserve exact source evidence
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/rates/report_fxv2_chf_nzd_freshness_v1.py \
            --official-html-file /tmp/fxv2-rbnz-b2-daily-source.json \
            --vendor-file /tmp/fxv2-rbnz-b2-eolas-research.json \
            --output /tmp/fxv2-chf-nzd-freshness-receipt.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Publish only changed V2 research feed (no canonical Rates writes)
        if: steps.gate.outputs.should_run == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          FILE=site/fx-quant-v2/chf-nzd-benchmark-research.json
          git diff --exit-code -- live_data payload
          if git diff --quiet -- "$FILE"; then
            echo 'FXV2_CHF_NZD_UNCHANGED_SOURCE_OBSERVATIONS'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'data(fxv2): update separate SNB matched-pair and RBNZ benchmark-roll research'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo 'FXV2_CHF_NZD_RESEARCH_PUBLISHED_MAIN'
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep "$((attempt*12))"
              git fetch origin main
              git rebase origin/main
            fi
          done
          echo 'No update accepted after retries; previous research feed preserved' >&2
          exit 1
      - name: Keep source review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fxv2-chf-nzd-benchmark-evidence
          path: |
            /tmp/fxv2-rbnz-b2-daily-source.json
            /tmp/fxv2-rbnz-b2-eolas-research.json
            /tmp/fxv2-chf-nzd-research-candidate.json
            /tmp/fxv2-chf-nzd-freshness-receipt.json
            site/fx-quant-v2/chf-nzd-benchmark-research.json
          if-no-files-found: warn
          retention-days: 14
