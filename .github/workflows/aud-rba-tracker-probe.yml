name: AUD RBA tracker probe
on:
  push:
    branches: [test-aud-rba-tracker-probe-2026-09-30]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe ASX RBA tracker and public APIs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,html,json
          headers={"User-Agent":"Mozilla/5.0"}
          urls=[
            "https://www.asx.com.au/markets/trade-our-derivatives-market/futures-market/rba-rate-tracker.html",
            "https://asx.cmfyapp.com/js/manifest.js",
            "https://asx.cmfyapp.com/js/common.js"
          ]
          for u in urls:
            r=requests.get(u,headers=headers,timeout=30)
            print("\nURL",u,"STATUS",r.status_code,"LEN",len(r.text),"FINAL",r.url)
            t=r.text
            for line in t.splitlines():
              if re.search(r'RBA|rate|cash|IB|futures|endpoint|api|cmfy|markit|oda|contract|probab',line,re.I):
                s=re.sub(r'\s+',' ',line).strip()
                if s: print(s[:3500])
          PY
