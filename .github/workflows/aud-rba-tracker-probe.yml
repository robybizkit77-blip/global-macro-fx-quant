name: AUD RBA tracker probe
on:
  push:
    branches: [test-aud-rba-tracker-probe-2026-09-30]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official ASX tracker data files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests
          base="https://www.asx.com.au/content/dam/asx/data/"
          for name in ["dynamic_text.csv","market_exp.csv","yield_curve.csv"]:
            r=requests.get(base+name,headers={"User-Agent":"Mozilla/5.0"},timeout=30)
            print("\nFILE",name,"STATUS",r.status_code,"TYPE",r.headers.get("content-type"),"LEN",len(r.content))
            print(r.content.decode("utf-8","ignore")[:20000])
          PY
