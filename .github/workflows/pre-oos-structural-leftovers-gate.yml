name: Pre-OOS Structural Leftovers Gate

on:
  push:
    branches: [staging-pre-oos-structural-leftovers-fix-2026-10-01]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: npm init -y >/dev/null 2>&1 && npm install --save-dev playwright
      - name: Verify structural leftovers are committed cleanly
        run: |
          cat > verify.js <<'EOF'
          const {chromium}=require('playwright');
          const {execSync,spawn}=require('child_process');
          (async()=>{
            const srv=spawn('python3',['-m','http.server','8765'],{stdio:'ignore'});
            await new Promise(r=>setTimeout(r,1000));
            const cp=execSync('command -v google-chrome-stable || command -v google-chrome || command -v chromium').toString().trim();
            const browser=await chromium.launch({headless:true,executablePath:cp,args:['--no-sandbox']});
            const page=await browser.newPage();
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'networkidle',timeout:120000});
            await page.waitForTimeout(4500);
            const out=await page.evaluate(()=>{
              const ccys=['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];
              const pairs=[...(D?.pairs||[])].map(x=>x.pair).sort();
              const states=Object.fromEntries(ccys.map(c=>{
                const s=deriveCurrencyState(c)||{};
                return [c,{base:s.base||null,macro:Number(s.macro),policy:Number(s.policy),improvement:s.improvementState||null,driver:deriveCurrencyDriver(c)||null}];
              }));
              const frames=Object.fromEntries(pairs.map(p=>{
                const f=derivePairDecisionFrame(p)||{};
                return [p,{fav:f.fav||null,quality:f.quality||null,macro:f.structural?.macro?.side||null,policy:f.structural?.policy?.side||null}];
              }));
              const q=(typeof rebuildStructuralChangeQueue==='function'?rebuildStructuralChangeQueue():{});
              const fwd=(typeof forwardValidationSummary==='function'?forwardValidationSummary():null);
              const health=(typeof productionHealthCheck==='function'?productionHealthCheck():null);
              return {states,frames,queue:q,fingerprint:fwd?.current_rules_fingerprint||null,health,pair_count:pairs.length};
            });
            await browser.close();srv.kill();
            const issues=[];
            if(pageErrors.length) issues.push('page_errors='+JSON.stringify(pageErrors));
            if(out.fingerprint!=='3356baf0') issues.push('fingerprint='+out.fingerprint);
            if(out.pair_count!==28) issues.push('pair_count='+out.pair_count);
            if((out.health?.hard_errors||[]).length) issues.push('hard_errors='+JSON.stringify(out.health.hard_errors));
            if(out.queue?.GBP) issues.push('GBP still queued '+JSON.stringify(out.queue.GBP));
            if(out.queue?.JPY) issues.push('JPY still queued '+JSON.stringify(out.queue.JPY));
            const j=out.states.JPY||{};
            if(j.base!=='COSTRUTTIVA'||j.macro!==0||j.policy!==1||j.improvement!=='EARLY SHIFT POSITIVO'||j.driver!=='Rates / aspettative CB'){
              issues.push('JPY state unexpected '+JSON.stringify(j));
            }
            const g=out.states.GBP||{};
            if(g.base!=='COSTRUTTIVA'||g.macro!==0||g.policy!==1){
              issues.push('GBP state unexpected '+JSON.stringify(g));
            }
            const expected={
              'AUD/JPY':['AUD','VANTAGGIO RELATIVO PARZIALE','A','TIE'],
              'CAD/JPY':['—','PILASTRI DIVISI','A','B'],
              'CHF/JPY':['JPY','VANTAGGIO RELATIVO PARZIALE','TIE','B'],
              'EUR/JPY':['—','SEPARAZIONE RATES MATERIALE','TIE','TIE'],
              'GBP/JPY':['—','SEPARAZIONE RATES MATERIALE','TIE','TIE'],
              'NZD/JPY':['—','SEPARAZIONE RATES MATERIALE','TIE','TIE'],
              'USD/JPY':['USD','VANTAGGIO RELATIVO PARZIALE','A','TIE']
            };
            for(const [p,v] of Object.entries(expected)){
              const x=out.frames[p]||{};
              const got=[x.fav,x.quality,x.macro,x.policy];
              if(JSON.stringify(got)!==JSON.stringify(v)) issues.push(p+'='+JSON.stringify(got)+' expected '+JSON.stringify(v));
            }
            console.log(JSON.stringify({
              status:issues.length?'FAIL':'PASS',
              fingerprint:out.fingerprint,
              queue:out.queue,
              GBP:out.states.GBP,
              JPY:out.states.JPY,
              jpy_pairs:Object.fromEntries(Object.keys(expected).map(p=>[p,out.frames[p]])),
              health_status:out.health?.status||null,
              issues
            },null,2));
            if(issues.length) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node verify.js
