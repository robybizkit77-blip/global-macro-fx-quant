name: Canonical data refresh v274

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/canonical-data-refresh-v274.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Refresh canonical runtime data and validate
        shell: bash
        run: |
          python - <<'PY'
          import csv, io, json, hashlib, urllib.request, subprocess, time
          from pathlib import Path
          from datetime import datetime, timezone

          ROOT = Path(".")
          SEC = ROOT / "data" / "sections"
          CCYS = ["USD","EUR","GBP","JPY","CHF","CAD","AUD","NZD"]
          ASOF = "2026-09-25"
          RELEASE = "GLOBAL_MACRO_FX_QUANT_DAILY_v274_2026-09-27"

          def load(name):
              return json.loads((SEC/name).read_text(encoding="utf-8"))

          def dump(name, obj):
              (SEC/name).write_text(json.dumps(obj, ensure_ascii=False, separators=(",",":"), sort_keys=True)+"\n", encoding="utf-8")

          def dt(s):
              s=str(s).strip()
              for fmt in ("%Y-%m-%d","%Y/%m/%d","%d %b %Y","%d/%m/%Y"):
                  try: return datetime.strptime(s,fmt)
                  except: pass
              return None

          def points(row, include_null=False):
              out=[]
              for i,(d,v) in enumerate(zip(row.get("dates",[]),row.get("values",[]))):
                  p=dt(d)
                  if p is None or (v is None and not include_null): continue
                  out.append((p,i,d,v))
              out.sort(key=lambda x:(x[0],x[1]))
              return out

          def normalize_rates(rows):
              for row in rows:
                  if row.get("category")!="Rates": continue
                  pts=points(row, include_null=True)
                  if len(pts)!=len(row.get("dates",[])): continue
                  row["dates"]=[x[2] for x in pts]
                  row["values"]=[x[3] for x in pts]
                  nn=[x for x in pts if x[3] is not None]
                  if nn:
                      row["last_date"]=nn[-1][2]
                      row["last_value"]=nn[-1][3]

          def canonical_2y(rows):
              for row in rows:
                  ident=(str(row.get("id",""))+" "+str(row.get("label",""))).lower()
                  if row.get("category")=="Rates" and ("2y" in ident or "2d" in ident):
                      return row
              raise RuntimeError("canonical 2Y missing")

          def tenor(rows, n):
              needles=(f"{n}y",f"{n}d")
              for row in rows:
                  ident=(str(row.get("id",""))+" "+str(row.get("label",""))).lower()
                  if row.get("category")=="Rates" and any(x in ident for x in needles):
                      return row
              return None

          # ---- JPY: merge latest official MOF JGB curve, never a cosmetic close ----
          jpy=load("series_JPY.json")
          normalize_rates(jpy)
          try:
              req=urllib.request.Request(
                  "https://www.mof.go.jp/english/policy/jgbs/reference/interest_rate/jgbcme.csv",
                  headers={"User-Agent":"Mozilla/5.0"}
              )
              raw=urllib.request.urlopen(req, timeout=30).read()
              text=raw.decode("utf-8-sig", errors="replace")
              reader=csv.DictReader(io.StringIO(text))
              headers=[(h or "").strip() for h in (reader.fieldnames or [])]
              rows=list(reader)
              def find_col(n):
                  targets={f"{n}Y",f"{n}year",f"{n}-year",f"{n} years"}
                  for h in headers:
                      compact=h.replace(" ","")
                      if compact.upper()==f"{n}Y": return h
                  for h in headers:
                      if any(t.lower() in h.lower() for t in targets): return h
                  return None
              date_col=next((h for h in headers if "date" in h.lower()), headers[0] if headers else None)
              cols={n:find_col(n) for n in (2,5,10,30)}
              if date_col and cols[2] and cols[10]:
                  by_tenor={n:tenor(jpy,n) for n in (2,5,10,30)}
                  maps={}
                  for n,row in by_tenor.items():
                      if row:
                          maps[n]={str(d):v for d,v in zip(row.get("dates",[]),row.get("values",[]))}
                  for rr in rows:
                      ds=(rr.get(date_col) or "").strip()
                      if dt(ds) is None: continue
                      for n,col in cols.items():
                          if not col or n not in maps: continue
                          val=(rr.get(col) or "").strip()
                          if val in ("","-","NA","N/A"): continue
                          try: maps[n][ds]=float(val)
                          except: pass
                  for n,row in by_tenor.items():
                      if not row or n not in maps: continue
                      items=sorted(maps[n].items(), key=lambda kv: dt(kv[0]))
                      row["dates"]=[d for d,_ in items]
                      row["values"]=[v for _,v in items]
                      row["last_date"]=items[-1][0]
                      row["last_value"]=items[-1][1]
              else:
                  print("MOF CSV headers not recognized; keeping existing canonical JPY history")
          except Exception as exc:
              print("MOF refresh unavailable; keeping existing canonical JPY history:", exc)
          normalize_rates(jpy)
          dump("series_JPY.json", jpy)

          # ---- WTI: full official FRED/EIA DCOILWTICO history ----
          url="https://fred.stlouisfed.org/graph/fredgraph.csv?id=DCOILWTICO&cosd=2016-01-01&coed=2026-09-27"
          fred_path=Path("/tmp/DCOILWTICO.csv")
          cmd=["curl","-fL","--compressed","--retry","5","--retry-all-errors","--retry-delay","3",
               "--connect-timeout","20","--max-time","180","-A","Mozilla/5.0",url,"-o",str(fred_path)]
          subprocess.run(cmd,check=True)
          text=fred_path.read_text(encoding="utf-8-sig")
          rdr=csv.DictReader(io.StringIO(text))
          wti=[]
          for rr in rdr:
              ds=(rr.get("observation_date") or rr.get("DATE") or "").strip()
              vs=(rr.get("DCOILWTICO") or "").strip()
              if not ds or vs in ("",".","NA","N/A"): continue
              try: wti.append((ds,float(vs)))
              except: pass
          wti.sort(key=lambda x:dt(x[0]))
          if len(wti)<500 or wti[0][0]>"2016-01-31":
              raise RuntimeError(f"WTI canonical download invalid: {len(wti)} rows")

          dashboard=load("dashboard.json")
          dashboard.setdefault("risk",{})["WTI"]={
              "dates":[d for d,_ in wti],
              "values":[v for _,v in wti],
              "source":"U.S. EIA via FRED",
              "series_id":"DCOILWTICO",
              "frequency":"Daily",
              "last_date":wti[-1][0],
              "last_value":wti[-1][1],
          }

          # ---- Price binding: derive mechanically from live price history ----
          prices=dashboard.get("prices") or []
          if len(prices)<21: raise RuntimeError("insufficient price history")
          last,w1,w4=prices[-1],prices[-6],prices[-21]
          price_changes=[]
          for pair,state in (dashboard.get("pairStates") or {}).items():
              a,b=pair.split("/")
              def cross(row): return float(row[b])/float(row[a])
              r1=(cross(last)/cross(w1)-1)*100
              r4=(cross(last)/cross(w4)-1)*100
              def direction(x): return "FLAT" if abs(x)<0.20 else ("UP" if x>0 else "DOWN")
              d1,d4=direction(r1),direction(r4)
              if d1==d4 and d1!="FLAT":
                  expected=a if d1=="UP" else b
                  stored=(state.get("layers") or {}).get("price")
                  if stored!=expected:
                      state.setdefault("layers",{})["price"]=expected
                      price_changes.append((pair,stored,expected,round(r1,4),round(r4,4)))
          dump("dashboard.json", dashboard)

          # ---- Native Rates: strict JPY/AUD binding to canonical official histories ----
          native=load("native_rates.json")
          all_series={}
          for ccy in CCYS:
              arr=jpy if ccy=="JPY" else load(f"series_{ccy}.json")
              normalize_rates(arr)
              all_series[ccy]=arr
              if ccy!="JPY": dump(f"series_{ccy}.json",arr)

          def rate_snapshot(ccy, source, quality):
              rows=all_series[ccy]
              r2,r10=canonical_2y(rows),tenor(rows,10)
              p2,p10=points(r2),points(r10)
              if len(p2)<6 or len(p10)<6: raise RuntimeError(f"{ccy} rate history insufficient")
              n=native[ccy]
              n["date"]=p2[-1][2]; n["source"]=source; n["quality"]=quality
              n["2Y"]=p2[-1][3]; n["10Y"]=p10[-1][3]
              n["curve_bp"]=(float(p10[-1][3])-float(p2[-1][3]))*100
              n["chg2_bp"]=round((float(p2[-1][3])-float(p2[-6][3]))*100,2)
              n["chg10_bp"]=round((float(p10[-1][3])-float(p10[-6][3]))*100,2)
              if ccy=="JPY": n["curve_state"]="Flattening misto"
              elif n["chg2_bp"]>0 and n["chg10_bp"]>0 and n["chg2_bp"]>n["chg10_bp"]: n["curve_state"]="Bear flattening"
              ten=[]
              for maturity in (2,5,10,30):
                  rr=tenor(rows,maturity)
                  if rr:
                      pp=points(rr); ten.append({"tenor":f"{maturity}Y","value":pp[-1][3],"date":pp[-1][2]})
              n["tenors"]=ten
              # Keep display history but remove any noncanonical later patch, then merge canonical points.
              for key,rr in (("history2",r2),("history10",r10)):
                  hist=n.get(key) or {"label":rr.get("label",""),"dates":[],"values":[]}
                  cutoff=points(rr)[-1][0]
                  hm={str(d):v for d,v in zip(hist.get("dates",[]),hist.get("values",[])) if dt(d) and dt(d)<=cutoff and v is not None}
                  canon=points(rr)
                  start=min((dt(d) for d in hm if dt(d)),default=canon[max(0,len(canon)-400)][0])
                  for pp in canon:
                      if pp[0]>=start: hm[str(pp[2])]=pp[3]
                  items=sorted(hm.items(),key=lambda kv:dt(kv[0]))
                  n[key]={"label":hist.get("label") or rr.get("label",""),
                          "dates":[d for d,_ in items],"values":[v for _,v in items],
                          "last_date":items[-1][0],"last_value":items[-1][1]}
          rate_snapshot("JPY","Japan Ministry of Finance JGB curve","FULL_CURRENT")
          rate_snapshot("AUD","RBA Statistical Table F2","OFFICIAL_SCHEDULE_CURRENT")
          dump("native_rates.json",native)

          # ---- What Changed: canonical 2Y, exact same history as QA ----
          wc=load("what_changed.json")
          by={r.get("ccy"):r for r in wc}
          for ccy in CCYS:
              p=points(canonical_2y(all_series[ccy]))
              if len(p)<6: raise RuntimeError(f"{ccy} canonical 2Y history insufficient")
              by[ccy]["rate_move"]=round((float(p[-1][3])-float(p[-6][3]))*100,2)
          dump("what_changed.json",wc)

          # ---- Final data QA ----
          issues=[]
          ref=dt(ASOF)
          max_age={"AUD":10}
          for ccy in CCYS:
              s=canonical_2y(all_series[ccy]); p=points(s); age=(ref-p[-1][0]).days
              if age>max_age.get(ccy,7):
                  issues.append({"type":"canonical_2y_stale","ccy":ccy,"last_date":p[-1][2],"age_days":age})
              stored=by[ccy]["rate_move"]; exp=round((float(p[-1][3])-float(p[-6][3]))*100,2)
              if abs(float(stored)-exp)>0.15:
                  issues.append({"type":"what_changed_mismatch","ccy":ccy,"stored":stored,"expected":exp})
          for ccy in ("JPY","AUD"):
              p=points(canonical_2y(all_series[ccy]))
              n=native[ccy]
              if str(n.get("date"))!=str(p[-1][2]) or abs(float(n.get("2Y"))-float(p[-1][3]))>1e-9:
                  issues.append({"type":"strict_native_binding","ccy":ccy})
          risk=dashboard.get("risk",{}).get("WTI",{})
          if len(risk.get("dates",[]))<500 or risk.get("dates",[None])[0]>"2016-01-31":
              issues.append({"type":"wti_history_invalid"})
          # Re-run Price binding audit after correction.
          for pair,state in (dashboard.get("pairStates") or {}).items():
              a,b=pair.split("/")
              def cross(row): return float(row[b])/float(row[a])
              r1=(cross(last)/cross(w1)-1)*100; r4=(cross(last)/cross(w4)-1)*100
              def direction(x): return "FLAT" if abs(x)<0.20 else ("UP" if x>0 else "DOWN")
              d1,d4=direction(r1),direction(r4)
              if d1==d4 and d1!="FLAT":
                  expected=a if d1=="UP" else b
                  if (state.get("layers") or {}).get("price")!=expected:
                      issues.append({"type":"price_binding","pair":pair})
          if len(dashboard.get("pairs") or [])!=28 or len(dashboard.get("pairStates") or {})!=28:
              issues.append({"type":"pair_count"})
          if issues:
              raise RuntimeError("DATA_QA_FAIL "+json.dumps(issues,ensure_ascii=False))

          # ---- Manifest v274 with exact section hashes / payload round-trip ----
          mf=json.loads((ROOT/"data/manifest.json").read_text(encoding="utf-8"))
          section_objs={}
          new_sections=[]
          for sec in mf["sections"]:
              path=SEC/sec["file"]
              raw=path.read_bytes()
              obj=json.loads(raw.decode("utf-8"))
              # Ensure canonical JSON bytes for deterministic runtime.
              canon=json.dumps(obj,ensure_ascii=False,separators=(",",":"),sort_keys=True).encode("utf-8")
              path.write_bytes(canon+b"\n")
              section_objs[sec["key"]]=obj
              new_sections.append({"key":sec["key"],"file":sec["file"],
                                   "sha256":hashlib.sha256(canon).hexdigest(),
                                   "bytes":path.stat().st_size})
          payload_canon=json.dumps(section_objs,ensure_ascii=False,separators=(",",":"),sort_keys=True).encode("utf-8")
          mf.update({
              "release":RELEASE,
              "generated_at_utc":datetime.now(timezone.utc).isoformat(),
              "payload_sha256":hashlib.sha256(payload_canon).hexdigest(),
              "sections":new_sections,
              "architecture":"FULL_RUNTIME_DATA_V2"
          })
          (ROOT/"data/manifest.json").write_text(json.dumps(mf,ensure_ascii=False,separators=(",",":"),sort_keys=True)+"\n",encoding="utf-8")

          report={
              "status":"PASS",
              "release":RELEASE,
              "as_of":ASOF,
              "checks":{
                  "canonical_2y_freshness":True,
                  "aud_source_aware_freshness":True,
                  "jpy_official_source_binding":True,
                  "aud_official_source_binding":True,
                  "wti_full_history":True,
                  "what_changed_rates_canonical":True,
                  "price_pair_binding":True,
                  "pair_count_28":True,
              },
              "evidence":{
                  "wti":{"observations":len(wti),"first_date":wti[0][0],"last_date":wti[-1][0],"last_value":wti[-1][1]},
                  "jpy_2y":{"last_date":points(canonical_2y(all_series["JPY"]))[-1][2],"last_value":points(canonical_2y(all_series["JPY"]))[-1][3]},
                  "aud_2y":{"last_date":points(canonical_2y(all_series["AUD"]))[-1][2],"last_value":points(canonical_2y(all_series["AUD"]))[-1][3]},
                  "price_binding_changes":price_changes,
              }
          }
          (ROOT/"qa/data-quality-report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Commit validated v274 payload
        shell: bash
        run: |
          git config user.name "fx-quant-runtime-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sections data/manifest.json qa/data-quality-report.json
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Publish validated canonical runtime payload v274"
          git push
