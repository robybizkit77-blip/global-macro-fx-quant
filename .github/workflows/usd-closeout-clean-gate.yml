name: USD Closeout Clean Gate

on:
  push:
    branches: [staging-usd-closeout-clean-2026-10-01]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: npm init -y >/dev/null 2>&1 && npm install --save-dev playwright
      - name: Verify closeout and unchanged canonical engine
        run: |
          git fetch origin staging-oos-forward-clean-2026-10-01
          git show origin/staging-oos-forward-clean-2026-10-01:validation/CANONICAL_ENGINE_OOS_T0_2026-10-01.json > baseline.json
          cat > verify.js <<'EOF'
          const fs=require('fs');
          const {chromium}=require('playwright');
          const {execSync,spawn}=require('child_process');
          const baseline=JSON.parse(fs.readFileSync('baseline.json','utf8'));
          (async()=>{
            const srv=spawn('python3',['-m','http.server','8765'],{stdio:'ignore'});
            await new Promise(r=>setTimeout(r,1000));
            const cp=execSync('command -v google-chrome-stable || command -v google-chrome || command -v chromium').toString().trim();
            const browser=await chromium.launch({headless:true,executablePath:cp,args:['--no-sandbox']});
            const page=await browser.newPage();
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'networkidle',timeout:120000});
            await page.waitForFunction(()=>typeof D!=='undefined'&&typeof S!=='undefined'&&typeof deriveCurrencyState==='function',{timeout:120000});
            await page.waitForTimeout(3500);
            const out=await page.evaluate(()=>{
              const ccys=['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];
              const day=(typeof REAL_CALENDAR!=='undefined'?REAL_CALENDAR:[]).find(d=>d.key==='2026-09-30');
              const ev=(day?.events||[]).filter(e=>/ADP Employment Change|Core PCE.*Personal Spending/i.test(String(e.event||''))).map(e=>({event:e.event,prev:e.prev,forecast:e.forecast,actual:e.actual,status:e.status}));
              const states=Object.fromEntries(ccys.map(c=>{const s=deriveCurrencyState(c)||{},imp=currencyImprovementDiagnostic(c)||{};return[c,{base:s.base||null,macro:Number(s.macro),policy:Number(s.policy),improvement:s.improvementState||imp.state||null,driver:deriveCurrencyDriver(c)||null}]}));
              const pairs=[...(D?.pairs||[])].map(x=>x.pair).sort();
              const pairStates=Object.fromEntries(pairs.map(p=>{const f=derivePairDecisionFrame(p)||{};return[p,{favored:f.fav||null,quality:f.quality||null,macro_side:f.structural?.macro?.side||null,policy_side:f.structural?.policy?.side||null}]}));
              const fwd=forwardValidationSummary?.(),health=productionHealthCheck?.();
              return {events:ev,closeout:window.GMFQ_USD_SEP30_CLOSEOUT||null,manifest:window.GMFQ_REFRESH_MANIFEST_20260930_1318||null,freshness:window.AUXILIARY_FEED_FRESHNESS||null,states,pairStates,pair_count:pairs.length,fingerprint:fwd?.current_rules_fingerprint||null,health};
            });
            await browser.close();srv.kill();
            const issues=[...errors.map(x=>'page:'+x)];
            const adp=out.events.find(x=>/ADP/.test(x.event||'')),pce=out.events.find(x=>/Core PCE/.test(x.event||''));
            if(!adp||adp.actual!=='90K'||adp.forecast!=='70K'||adp.status!=='done')issues.push('ADP='+JSON.stringify(adp));
            if(!pce||pce.actual!=='0,2% / 0,9%'||pce.forecast!=='0,3% / 0,8%'||pce.status!=='done')issues.push('PCE='+JSON.stringify(pce));
            if((out.manifest?.pending||[]).length!==0)issues.push('pending='+JSON.stringify(out.manifest?.pending));
            if(out.freshness?.calendar?.status!=='LIVE_VALIDATED_US_RELEASES_COMPLETE')issues.push('calendar_freshness='+out.freshness?.calendar?.status);
            if(out.closeout?.status!=='PASS')issues.push('closeout='+JSON.stringify(out.closeout));
            if(out.fingerprint!==baseline.rules_fingerprint)issues.push('fingerprint');
            if(out.pair_count!==28)issues.push('pair_count='+out.pair_count);
            if((out.health?.hard_errors||[]).length)issues.push('hard_errors='+JSON.stringify(out.health.hard_errors));
            const currency_changes=[],pair_changes=[];
            for(const [c,b] of Object.entries(baseline.currencies)){const a=out.states[c]||{};for(const f of ['base','macro','policy','improvement','driver'])if(a[f]!==b[f])currency_changes.push({c,f,b:b[f],a:a[f]});}
            for(const [p,b] of Object.entries(baseline.pairs)){const a=out.pairStates[p]||{};for(const f of ['favored','quality','macro_side','policy_side'])if(a[f]!==b[f])pair_changes.push({p,f,b:b[f],a:a[f]});}
            if(currency_changes.length)issues.push('currency_changes');
            if(pair_changes.length)issues.push('pair_changes');
            console.log(JSON.stringify({status:issues.length?'FAIL':'PASS',events:out.events,fingerprint:out.fingerprint,currency_changes,pair_changes,health_status:out.health?.status,warnings:out.health?.warnings,issues},null,2));
            if(issues.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node verify.js
