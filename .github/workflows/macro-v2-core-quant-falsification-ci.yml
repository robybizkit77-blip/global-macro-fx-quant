name: Macro V2 quantitative Core falsification - research only
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/macro-v2-core-quant-falsification-ci.yml'
      - 'validation/macro/v2_core_quant_falsification_readiness_v1.py'
      - 'validation/macro/test_v2_core_quant_falsification_readiness_v1.py'
      - 'validation/macro/v2_us_chf_source_quality_propagation_v1.py'
      - 'validation/macro/test_v2_us_chf_source_quality_propagation_v1.py'
      - 'validation/macro/MACRO_V2_US_CHF_JOINT_QUALITY_PROPAGATION_2026-10-29.md'
      - 'validation/macro/v2_g8_growth_cross_country_comparability_v1.py'
      - 'validation/macro/test_v2_g8_growth_cross_country_comparability_v1.py'
      - 'validation/macro/MACRO_V2_G8_GDP_COMPARABILITY_2026-10-29.md'
      - 'validation/macro/v2_chf_seco_first_month_rounded_alternative_v1.py'
      - 'validation/macro/test_v2_chf_seco_first_month_rounded_alternative_v1.py'
      - 'validation/macro/MACRO_V2_24_SOURCE_TRAINING_WINDOW_GAP_AUDIT_2026-10-27.md'
      - 'validation/macro/MACRO_V2_CORE_QUANT_FALSIFICATION_DECISION_2026-10-28.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quantify-but-do-not-promote-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test research mathematics and reject unsupported PIT, beta, or forward claims
        run: |
          python -m unittest validation.macro.test_v2_domestic_candidate_explicit_formula_v1 -v
          python -m unittest validation.macro.test_v2_core_quant_falsification_readiness_v1 -v
          python -m unittest validation.macro.test_v2_chf_seco_first_month_rounded_alternative_v1 -v
          python -m unittest validation.macro.test_v2_g8_growth_cross_country_comparability_v1 -v
          python -m unittest validation.macro.test_v2_us_chf_source_quality_propagation_v1 -v
      - name: Generate dated quantitative model and archived forward receipt reconciliation
        run: |
          python -m validation.macro.v2_core_quant_falsification_readiness_v1 --as-of 2026-10-28 --out /tmp/gmfq-core-quant-falsification-2026-10-28.json
          python - <<'PY'
          import json,os
          f=json.load(open('/tmp/gmfq-core-quant-falsification-2026-10-28.json'))
          assert f['status']=='RESEARCH_QUANT_MATH_CHECKED__PIT_OOS_AND_OPERATIONAL_PROMOTION_BLOCKED'
          assert f['universe']['canonical_unique_unordered_pairs']==28
          assert f['formula_stress']['economic_axes']==24
          assert f['summary']['mathematical_research_gates_checked']==1
          assert f['summary']['unmet_or_blocked_launch_quant_gates']==6
          # Forward snapshots are append-only; verify every actual journal row.
          from pathlib import Path
          rows=[json.loads(x) for x in Path('validation/forward/decision_snapshots/CORE_DECISION_SNAPSHOTS_V1.jsonl').read_text().splitlines() if x.strip()]
          assert f['forward_truth']['decision_rows_in_actual_journal']==len(rows)>=84
          assert f['forward_truth']['journal_unique_cutoffs']==len({x['decision_cutoff'] for x in rows})>=3
          assert f['forward_truth']['journal_distinct_runs']==len({x['run_id'] for x in rows})>=3
          assert f['forward_truth']['realized_outcome_rows']==0
          assert f['forward_truth']['receipt_batches_claiming_written_rows_absent_from_journal']==0
          assert f['forward_truth']['three_date_archived_forward_observations_reconciled'] is True
          assert not f['safe_to_publish_new_D'] and not f['safe_to_recalculate_28_pairs']
          assert not f['safe_to_claim_quantitative_predictive_validation']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as o:
              o.write('### Macro V2 quantitative readiness - research proof, NOT forward model validation\n')
              o.write('- Reproducible 8-country domestic candidate, 24 economic axes, 3 predetermined growth weight scenarios. No cross-country FX strength permitted.\n')
              o.write('- Historical v9.3 walkforward is pseudo-OOS; it cannot validate the new domestic candidate.\n')
              o.write('- Actual Forward journal: row/cutoff counts verified against the persisted growing ledger; no validated future outcomes.\n')
              o.write('- 6 of 8 validation gates blocked; two research gates checked (formula and journal). CI green is not predictive proof. Core D and 28 FX pairs unchanged.\n')
          PY
      - name: Quantify real USD/CHF incomplete-source impact on the unpromoted V2 candidate
        run: |
          set -euo pipefail
          python -m validation.macro.v2_us_chf_source_quality_propagation_v1 --out /tmp/gmfq-us-chf-source-stress.json
          python - <<'PY'
          import json, os
          x=json.load(open('/tmp/gmfq-us-chf-source-stress.json'))
          assert x['status']=='TWO_MISSING_CORE_SOURCE_QUALITY_STRESSED_NO_PIT_FX_PROMOTION'
          assert x['USD_inflation']['unpublished_period']=='2025-10'
          assert x['USD_inflation']['training_observations']==24
          assert x['USD_inflation']['training_calendar_months']==25
          assert x['USD_inflation']['strict_consecutive_PIT_training_eligible'] is False
          assert x['CHF_labour']['exact_historical_snb_source_day_vintages']==0
          assert x['CHF_labour']['safe_to_replace_candidate_labour_axis'] is False
          assert x['summary']['source_day_training_vintage_series_certified']==0
          assert all(x[k] is False for k in ('safe_to_publish_new_D',
                      'safe_to_recalculate_28_pairs','safe_for_beta',
                      'safe_for_forward','writes_live_data'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('### USD CPI missing-month / CHF source-precision stress (research only)\\n')
              out.write(f"- USD issuer vs revised z: {x['USD_inflation']['issuer_minus_revised_z']:+.6f}; no 2025-10 source and no 24 consecutive PIT months.\\n")
              c=x['CHF_labour']
              out.write(f"- CHF hypothetical alternative SECO z interval: {c['hypothetical_precise_seco_unemployment_z_bounds']}; joint source/weight domestic range: {c['hypothetical_25_to_75_growth_weight_activity_interval']}. Not the canonical SNB first vintage.\\n")
              out.write('- Zero authorised FX signals or new Core.\\n')
          PY
      - name: Verify all 28 G8 GDP QoQ versus historical Z comparability diagnostics
        run: |
          python -m validation.macro.v2_g8_growth_cross_country_comparability_v1 --out /tmp/gmfq-g8-gdp-comparability-20261029.json
          python - <<'PY'
          import json,os
          x=json.load(open('/tmp/gmfq-g8-gdp-comparability-20261029.json'))
          t=x['summary']
          assert t['economies']==8 and t['pairs_audited_for_descriptive_representation']==28
          assert t['within_history_vs_qoq_order_agreements']+t['within_history_vs_qoq_order_inversions']+t['pairs_with_order_ties']==28
          assert t['pairs_with_EUR_or_CHF_definition_caveats']==13
          assert t['eligible_cross_country_FX_strength_pairs']==0
          assert t['original_release_day_binary_certified_training_panels']==0
          assert not x['safe_to_publish_D'] and not x['safe_to_recalculate_28_pairs']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('### G8 GDP cross-country representation test (research only)\\n')
              out.write(f"- 28 GDP comparisons: {t['within_history_vs_qoq_order_agreements']} agreements, {t['within_history_vs_qoq_order_inversions']} inverted rankings, {t['pairs_with_order_ties']} ties.\\n")
              out.write('- Same GDP economic quarter, not synchronized issuer vintages or a cross-country FX signal.\\n')
          PY
      - name: Assert no production, signals or archival journal writes
        run: |
          git diff --exit-code -- live_data site dashboard payload validation/forward/decision_snapshots
          test -z "$(git status --porcelain -- live_data site dashboard payload validation/forward/decision_snapshots)"
      - uses: actions/upload-artifact@v4
        with:
          name: macro-v2-core-quant-falsification-research
          path: |
            /tmp/gmfq-core-quant-falsification-2026-10-28.json
            /tmp/gmfq-us-chf-source-stress.json
            /tmp/gmfq-g8-gdp-comparability-20261029.json
          retention-days: 21
          if-no-files-found: error
