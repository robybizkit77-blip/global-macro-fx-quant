name: Macro V2 CPI August 2024 missing prior issuer source — one shot
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/macro-v2-us-bls-cpi-aug24-oneshot.yml"
      - "validation/macro/one_shot_us_blscpi_aug2024_prior24_source_v1.py"
permissions:
  contents: read
jobs:
  aug24-issuer-download-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch BLS Aug 2024 CPI SA index from dated issuer workbook
        run: python -m validation.macro.one_shot_us_blscpi_aug2024_prior24_source_v1
      - name: 'Strict proof - never original issuer-day historical bytes or PIT certification'
        run: |
          python - <<'PY'
          import json
          p='/tmp/macro-v2-aug24-issuer-workbook/receipt.json'
          r=json.load(open(p))
          assert r['economic_month']=='2024-08'
          assert r['publisher_release_day']=='2024-09-11'
          assert r['same_issuer_month_12mo_base_SA']
          assert len(r['download_SHA256'])==64
          assert r['BLS_first_issuer_day_binary_sha256_proven'] is False
          assert r['missing_2025_10_filled'] is False
          assert r['safe_to_publish_D'] is False
          assert r['safe_for_backtest_or_pair_ranking'] is False
          PY
      - name: Retain historical issuer-month source binary (7 days, not production)
        uses: actions/upload-artifact@v4
        with:
          name: macro-v2-bls-cpi-aug2024-issuer-month-oneshot
          path: /tmp/macro-v2-aug24-issuer-workbook/
          retention-days: 7
          if-no-files-found: error
