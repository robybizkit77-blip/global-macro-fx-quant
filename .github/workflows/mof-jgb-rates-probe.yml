name: MOF JGB Rates Probe

on:
  push:
    branches: [staging-live-data-refresh-v1-2026-10-04]
    paths:
      - ".github/workflows/mof-jgb-rates-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official MOF JGB CSV
        run: |
          python - <<'PY'
          import csv, json, urllib.request, pathlib
          url='https://www.mof.go.jp/english/policy/jgbs/reference/interest_rate/jgbcme.csv'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 GMFQ/1.0'})
          raw=urllib.request.urlopen(req,timeout=30).read()
          text=raw.decode('cp932')
          rows=list(csv.reader(text.splitlines()))
          out={'schema':'GMFQ_MOF_JGB_PROBE_V2','url':url,'header':rows[:3],'tail':rows[-8:]}
          pathlib.Path('validation/MOF_JGB_RATES_PROBE_2026-10-04.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/MOF_JGB_RATES_PROBE_2026-10-04.json
          git commit -m "Probe official MOF JGB curve" || exit 0
          git push
