name: CAD BoC Labour 2Y Paired Attribution V1

on:
  push:
    branches:
      - audit-minimum-robust-pit-dataset-2026-10-06
    paths:
      - 'validation/run_cad_boc_labour_2y_paired_attribution_v1.py'
      - '.github/workflows/cad-boc-labour-2y-paired-attribution-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-minimum-robust-pit-dataset-2026-10-06
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run CAD BoC Labour 2Y paired attribution
        run: python validation/run_cad_boc_labour_2y_paired_attribution_v1.py
      - name: Confirm engine and live data untouched
        run: git diff --exit-code -- engine live_data
      - name: Commit evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/CAD_BOC_LABOUR_2Y_PAIRED_ATTRIBUTION_V1_2026-10-06.json
          if git diff --cached --quiet; then
            echo "No evidence change"
          else
            git commit -m "Add CAD BoC Labour 2Y paired attribution evidence"
            git pull --rebase origin audit-minimum-robust-pit-dataset-2026-10-06
            git push origin HEAD:audit-minimum-robust-pit-dataset-2026-10-06
          fi
