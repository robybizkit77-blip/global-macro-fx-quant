name: JPY TONA history form probe
on:
  push:
    branches: [test-jpy-tona-archive-2026-09-30]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import requests,re,html
          u="https://port.jpx.co.jp/jpxhp/main/index.aspx?F=e_future&disptype=day_through"
          r=requests.get(u,headers={"User-Agent":"Mozilla/5.0"},timeout=30)
          t=r.text
          print("STATUS",r.status_code,"LEN",len(t),"FINAL",r.url)
          fm=re.search(r'<form[^>]*?(?:method="([^"]*)")?[^>]*?(?:action="([^"]*)")?[^>]*>',t,re.I)
          print("FORM",fm.groups() if fm else None)
          for m in re.finditer(r'<(?:input|select|button)\b[^>]*>',t,re.I):
              tag=m.group(0)
              name=re.search(r'name="([^"]*)"',tag,re.I)
              iid=re.search(r'id="([^"]*)"',tag,re.I)
              val=re.search(r'value="([^"]*)"',tag,re.I)
              print("FIELD",name.group(1) if name else None,iid.group(1) if iid else None,val.group(1) if val else None,tag[:600])
          for m in re.finditer(r'href="([^"]+)"',t,re.I):
              h=html.unescape(m.group(1))
              if re.search(r'date|future|day|csv|download',h,re.I):
                  print("LINK",h)
          PY
