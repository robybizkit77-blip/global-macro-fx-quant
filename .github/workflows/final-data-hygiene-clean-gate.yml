name: Final Data Hygiene Clean Gate

on:
  push:
    branches: [staging-final-data-hygiene-clean-2026-10-01]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: npm init -y >/dev/null 2>&1 && npm install --save-dev playwright
      - name: Verify BEA revisions and OOS integrity
        run: |
          git fetch origin staging-oos-forward-clean-2026-10-01
          git show origin/staging-oos-forward-clean-2026-10-01:validation/CANONICAL_ENGINE_OOS_T0_2026-10-01.json > baseline.json
          cat > verify.js <<'EOF'
          const fs=require('fs');
          const {chromium}=require('playwright');
          const {execSync,spawn}=require('child_process');
          const baseline=JSON.parse(fs.readFileSync('baseline.json','utf8'));
          (async()=>{
            const srv=spawn('python3',['-m','http.server','8765'],{stdio:'ignore'});
            await new Promise(r=>setTimeout(r,1000));
            const cp=execSync('command -v google-chrome-stable || command -v google-chrome || command -v chromium').toString().trim();
            const browser=await chromium.launch({headless:true,executablePath:cp,args:['--no-sandbox']});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'networkidle',timeout:120000});
            await page.waitForFunction(()=>typeof S!=='undefined'&&typeof D!=='undefined'&&typeof deriveCurrencyState==='function'&&typeof derivePairDecisionFrame==='function',{timeout:120000});
            await page.waitForTimeout(1000);
            const out=await page.evaluate(()=>{
              const ccys=['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];
              const ids=['US_PCEPI_history_value','US_PCEPILFE_history_value','US_PCEC96_history_value','US_DSPIC96_history_DSPIC96','US_PI_history_PI','US_PSAVERT_history_PSAVERT'];
              const bea=Object.fromEntries(ids.map(id=>{
                const s=(S.USD||[]).find(x=>x.id===id)||{};
                return [id,{last_date:s.last_date||null,last_value:s.last_value??null,revision_as_of:s.revision_as_of||null}];
              }));
              const states=Object.fromEntries(ccys.map(c=>{
                const s=deriveCurrencyState(c)||{};
                const imp=currencyImprovementDiagnostic(c)||{};
                return [c,{base:s.base||null,macro:Number(s.macro),policy:Number(s.policy),improvement:s.improvementState||imp.state||null,driver:deriveCurrencyDriver(c)||null}];
              }));
              const pairs=[...(D?.pairs||[])].map(x=>x.pair).sort();
              const pairStates=Object.fromEntries(pairs.map(p=>{
                const f=derivePairDecisionFrame(p)||{};
                return [p,{favored:f.fav||null,quality:f.quality||null,macro_side:f.structural?.macro?.side||null,policy_side:f.structural?.policy?.side||null}];
              }));
              const fwd=typeof forwardValidationSummary==='function'?forwardValidationSummary():null;
              const health=typeof productionHealthCheck==='function'?productionHealthCheck():null;
              return {bea,states,pairStates,pair_count:pairs.length,fingerprint:fwd?.current_rules_fingerprint||null,health};
            });
            await browser.close();srv.kill();
            const issues=[];
            const expected={
              US_PCEPI_history_value:131.579,
              US_PCEPILFE_history_value:130.455,
              US_PCEC96_history_value:16955.3,
              US_DSPIC96_history_DSPIC96:18410.5,
              US_PI_history_PI:27626.9,
              US_PSAVERT_history_PSAVERT:4.1
            };
            for(const [id,v] of Object.entries(expected)){
              const x=out.bea[id]||{};
              if(x.last_date!=='2026-08-01'||Math.abs(Number(x.last_value)-v)>1e-9||x.revision_as_of!=='2026-09-30') issues.push('BEA '+id+'='+JSON.stringify(x));
            }
            if(errors.length) issues.push('page_errors='+JSON.stringify(errors));
            if(out.fingerprint!==baseline.rules_fingerprint) issues.push('fingerprint '+out.fingerprint+' != '+baseline.rules_fingerprint);
            if(out.pair_count!==28) issues.push('pair_count='+out.pair_count);
            if((out.health?.hard_errors||[]).length) issues.push('hard_errors='+JSON.stringify(out.health.hard_errors));
            const cFields=['base','macro','policy','improvement','driver'];
            const currency_changes=[];
            for(const [c,b] of Object.entries(baseline.currencies)){
              const a=out.states[c]||{};
              for(const f of cFields) if(a[f]!==b[f]) currency_changes.push({currency:c,field:f,before:b[f],after:a[f]});
            }
            const pFields=['favored','quality','macro_side','policy_side'];
            const pair_changes=[];
            for(const [p,b] of Object.entries(baseline.pairs)){
              const a=out.pairStates[p]||{};
              for(const f of pFields) if(a[f]!==b[f]) pair_changes.push({pair:p,field:f,before:b[f],after:a[f]});
            }
            console.log(JSON.stringify({
              status:issues.length?'FAIL':'PASS',
              bea:out.bea,
              fingerprint:out.fingerprint,
              health_status:out.health?.status,
              currency_changes,
              pair_changes,
              issues
            },null,2));
            if(issues.length) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node verify.js
