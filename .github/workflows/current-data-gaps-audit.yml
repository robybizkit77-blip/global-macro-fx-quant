name: Current Data Gaps Audit
on:
  push:
    branches: [staging-current-data-gaps-audit-2026-10-01]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: npm init -y >/dev/null 2>&1 && npm install --save-dev playwright
      - name: Audit live runtime gaps
        run: |
          cat > audit.js <<'EOF'
          const {chromium}=require('playwright');
          const {execSync,spawn}=require('child_process');
          (async()=>{
            const srv=spawn('python3',['-m','http.server','8765'],{stdio:'ignore'});
            await new Promise(r=>setTimeout(r,1000));
            const cp=execSync('command -v google-chrome-stable || command -v google-chrome || command -v chromium').toString().trim();
            const browser=await chromium.launch({headless:true,executablePath:cp,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1600,height:1000}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'networkidle',timeout:120000});
            await page.waitForTimeout(3000);
            const out=await page.evaluate(()=>{
              const ccys=['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];
              const ois=Object.fromEntries(ccys.map(c=>{
                const d=window.__GMFQ_DATA?.OIS_DATA?.currencies?.[c]||null;
                const x=window.GMFQ_OIS?.currency?.(c)||null;
                return [c,{
                  runtime_status:x?.status||'WITHHELD',
                  record_status:d?.status||null,
                  as_of:d?.as_of||null,
                  source:d?.source||null,
                  validation:d?.validation||null
                }];
              }));
              const rates=Object.fromEntries(ccys.map(c=>{
                const d=window.NATIVE_RATES_DATA?.[c]||null;
                return [c,d?{
                  date:d.date||null,source:d.source||null,quality:d.quality||null,
                  y2:d['2Y']??null,y10:d['10Y']??null,chg2_bp:d.chg2_bp??null,chg10_bp:d.chg10_bp??null,
                  real:!!d.real,breakeven:!!d.breakeven,term_premium:!!d.term_premium
                }:null];
              }));
              const liq=Object.fromEntries(ccys.map(c=>{
                const d=window.NATIVE_LIQ_DATA?.[c]||null;
                return [c,d?{status:d.status||null,as_of:d.as_of||null,dir:d.liquidity_dir||null,source:d.source||null,quality:d.quality||null}:null];
              }));
              const cb=Object.fromEntries(ccys.map(c=>{
                const d=window.NATIVE_CB_DATA?.[c]||null;
                const mp=d?.market_pricing||{};
                return [c,d?{
                  last_date:d.last_date||null,next_meeting:d.next_meeting||null,pricing_tier:d.pricing_tier||null,
                  pricing_as_of:mp.as_of||null,pricing_quality:mp.quality||null,pricing_source:mp.source||null,
                  freshness:mp.freshness_status||null
                }:null];
              }));
              return {
                fingerprint:(typeof forwardValidationSummary==='function'?forwardValidationSummary()?.current_rules_fingerprint:null),
                health:(typeof productionHealthCheck==='function'?productionHealthCheck():null),
                refresh_health:window.GMFQ_REFRESH_HEALTH?.report?.()||null,
                ois_activation:window.GMFQ_OIS_SOURCE_MONITOR?.activationState?.()||null,
                unresolved:(typeof unresolvedSourceChecks==='function'?unresolvedSourceChecks():[]),
                ois,rates,liq,cb
              };
            });
            out.js_errors=errors;
            console.log('===DATA_GAPS_AUDIT===');
            console.log(JSON.stringify(out,null,2));
            console.log('===END_DATA_GAPS_AUDIT===');
            await browser.close();srv.kill();
            if(out.fingerprint!=='3356baf0') process.exit(2);
            if(out.js_errors.length) process.exit(3);
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node audit.js
