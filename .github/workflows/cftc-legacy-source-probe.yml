name: CFTC Legacy Source Probe

on:
  push:
    branches: [staging-live-data-refresh-v1-2026-10-04]
    paths:
      - "validation/probe_cftc_legacy_2026.py"
      - ".github/workflows/cftc-legacy-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe CFTC legacy futures-only annual file
        run: python validation/probe_cftc_legacy_2026.py
      - name: Commit probe
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- validation/COT_REFRESH_SOURCE_PROBE_2026-10-04.json)" ]; then
            echo "No probe change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/COT_REFRESH_SOURCE_PROBE_2026-10-04.json
          git commit -m "Probe official CFTC legacy source"
          git push
