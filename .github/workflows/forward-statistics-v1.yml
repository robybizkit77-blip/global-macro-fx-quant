name: Forward Statistics V1

on:
  push:
    branches:
      - research-transmission-conviction-layer-v1-2026-10-07
    paths:
      - 'validation/FORWARD_ECB_FIXING_STATE_V1_2026-10-07.json'
      - 'validation/FORWARD_SNAPSHOT_LEDGER_V1_2026-10-07.json'
      - 'validation/DASHBOARD_PAIR_RENDER_PAYLOAD_V1_2026-10-07.json'
      - 'validation/build_forward_statistics_v1.py'
      - '.github/workflows/forward-statistics-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-transmission-conviction-layer-v1-2026-10-07
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build forward statistics
        run: python validation/build_forward_statistics_v1.py
      - name: Validate forward statistics
        run: |
          python - <<'PY'
          import json
          p='validation/FORWARD_STATISTICS_V1_2026-10-07.json'
          x=json.load(open(p))
          assert x['schema']=='GMFQ_FORWARD_STATISTICS_V1'
          assert x['primary_horizon']==20
          assert set(x['horizons'])=={'5','20','60'}
          assert all(v is False for v in x['guards'].values())
          if x['status']=='AWAITING_MATURED_OUTCOMES':
              assert all(x['horizons'][h]['matured_pair_observations']==0 for h in ('5','20','60'))
          print('FORWARD_STATS_VALID', x['status'])
          PY
      - name: Commit statistics if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/FORWARD_STATISTICS_V1_2026-10-07.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update forward statistics v1'
          git push origin HEAD:research-transmission-conviction-layer-v1-2026-10-07
