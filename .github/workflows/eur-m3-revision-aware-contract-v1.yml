name: EUR M3 Revision Aware Contract V1

on:
  push:
    paths:
      - 'validation/fetch_ecb_eur_m3_revision_aware_candidate.py'
      - 'validation/apply_ecb_eur_m3_revision_aware_candidate.py'
      - '.github/workflows/eur-m3-revision-aware-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eur-m3-revision-aware-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot tracked runtime
        run: sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/runtime.before.sha256
      - name: Build official ECB revision-aware candidate
        run: |
          python validation/fetch_ecb_eur_m3_revision_aware_candidate.py --out /tmp/eur-m3.json
          cat /tmp/eur-m3.json
      - name: Validate source and revision contract
        run: |
          python - <<'PY'
          import json
          c=json.load(open('/tmp/eur-m3.json')); p=c['proof']
          assert c['schema']=='GMFQ_LIQUIDITY_EUR_M3_REVISION_AWARE_CANDIDATE_V1', c
          assert c['status']=='GREEN_SOURCE_CANDIDATE_ONLY', c
          assert c['source']['series_key']=='BSI.M.U2.Y.V.M30.X.1.U2.2300.Z01.E', c
          assert p['revision_aware_append_only'] is True and p['historical_runtime_values_frozen'] is True, p
          assert p['identity_transform_for_new_observations'] is True and p['overlap_count']>=12, p
          assert p['exact_match_count']>0 and p['revision_mismatch_count']>=1, p
          assert c['candidate_pipeline_ready'] is True and c['runtime_mutated'] is False and c['publication_performed'] is False, c
          print('EUR_M3_REVISION_AWARE_SOURCE_CONTRACT_PASS')
          PY
      - name: Dry-run controlled apply
        run: |
          python validation/apply_ecb_eur_m3_revision_aware_candidate.py --candidate /tmp/eur-m3.json > /tmp/eur-m3-dry.json
          cat /tmp/eur-m3-dry.json
      - name: Prove controlled apply on runtime copy
        run: |
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/NATIVE_LIQ_DATA.eur-m3.json
          python validation/apply_ecb_eur_m3_revision_aware_candidate.py --candidate /tmp/eur-m3.json --runtime /tmp/NATIVE_LIQ_DATA.eur-m3.json --apply > /tmp/eur-m3-apply.json
          cat /tmp/eur-m3-apply.json
          python - <<'PY'
          import json
          c=json.load(open('/tmp/eur-m3.json')); dry=json.load(open('/tmp/eur-m3-dry.json')); r=json.load(open('/tmp/eur-m3-apply.json'))
          original=json.load(open('live_data/sections/NATIVE_LIQ_DATA.json'))['EUR']['money']
          applied=json.load(open('/tmp/NATIVE_LIQ_DATA.eur-m3.json'))['EUR']['money']; n=len(original['dates'])
          assert applied['dates'][:n]==original['dates'] and applied['values'][:n]==original['values'], (applied,original)
          expected=len(c['new_observations'])
          assert dry['applied'] is False and dry['appended_observations']==expected, dry
          assert r['appended_observations']==expected and r['runtime_history_rewritten'] is False, r
          if expected:
              assert r['applied'] is True
              assert applied['dates'][-1]==c['new_observations'][-1]['date']
              assert float(applied['values'][-1])==float(c['new_observations'][-1]['value'])
          print('EUR_M3_REVISION_AWARE_CONTROLLED_APPLY_PASS')
          PY
      - name: Verify tracked runtime unchanged
        run: |
          sha256sum -c /tmp/runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Summary
        run: |
          echo 'EUR.money exact ECB M3 series: BSI.M.U2.Y.V.M30.X.1.U2.2300.Z01.E'
          echo 'Historical current-vintage revisions: diagnostic only; stored PIT history frozen'
          echo 'Controlled append-only apply: tested on runtime copy'
          echo 'Tracked runtime mutation: NONE'
          echo 'Publication: NONE'
