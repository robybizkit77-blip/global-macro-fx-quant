# retrigger: 2026-10-04 macro freshness audit
name: Live Macro Registry

on:
  push:
    branches: [staging-live-data-refresh-v1-2026-10-04]
    paths:
      - "validation/extract_live_macro_registry.py"
      - "live_data/sections/MACRO_THERMOMETER_DATA.json"
      - ".github/workflows/live-macro-registry.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact macro registry
        run: python validation/extract_live_macro_registry.py
      - name: Commit registry
        run: |
          if [ -z "$(git status --porcelain -- validation/LIVE_MACRO_REGISTRY_2026-10-04.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/LIVE_MACRO_REGISTRY_2026-10-04.json
          git commit -m "Build compact live macro registry"
          git push
