name: SNB CHF Rates Probe

on:
  push:
    branches: [staging-live-data-refresh-v1-2026-10-04]
    paths:
      - ".github/workflows/snb-chf-rates-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official SNB spot-rate cube
        run: |
          python - <<'PY'
          import json,pathlib,urllib.request
          base='https://data.snb.ch/api/cube/rendeiduebd'
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 GMFQ/1.0','Accept':'application/json'})
            return urllib.request.urlopen(req,timeout=60).read().decode('utf-8-sig')
          out={'schema':'GMFQ_SNB_CHF_RATES_PROBE_V2','base':base}
          for name,url in {
            'dimensions':base+'/dimensions/en',
            'last_update':base+'/lastUpdate',
            'data':base+'/data/json/en?dimSel=D0(CHF),D1(2J,10J)&fromDate=2026-09-20&toDate=2026-10-04'
          }.items():
            raw=get(url)
            try: out[name]=json.loads(raw)
            except: out[name]=raw[:20000]
          pathlib.Path('validation/SNB_CHF_RATES_PROBE_2026-10-04.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2)[:30000])
          PY
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/SNB_CHF_RATES_PROBE_2026-10-04.json
          git commit -m "Probe official SNB CHF spot rates" || exit 0
          git push
