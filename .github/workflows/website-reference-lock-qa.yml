name: Website Reference Lock QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/website-v1/**'
      - '.github/workflows/website-reference-lock-qa.yml'

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/website-v1.log 2>&1 &
          sleep 2
      - name: Capture website pages and verify Library report mirrors
        run: |
          cat > website-v1-qa.js <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const zlib = require('zlib');

          const GLOBAL_MACRO='Weekly_Global_Macro_Report_2026-10-10_DARK_DESK_DEFINITIVO.html';
          const GLOBAL_MACRO_PARTS=[
            'weekly-global-macro-2026-10-10.part1.txt',
            'weekly-global-macro-2026-10-10.part2.txt',
            'weekly-global-macro-2026-10-10.part3.txt',
            'weekly-global-macro-2026-10-10.part4.txt',
            'weekly-global-macro-2026-10-10.part5a.txt',
            'weekly-global-macro-2026-10-10.part5b.txt',
            'weekly-global-macro-2026-10-10.part5c.txt',
            'weekly-global-macro-2026-10-10.part5d.txt',
            'weekly-global-macro-2026-10-10.part6a.txt'
          ];

          function verifyReportFile(href){
            const local=path.join(process.cwd(),'site','website-v1',href);
            if(!fs.existsSync(local)) throw new Error(`${href}: local mirror missing`);
            const raw=fs.readFileSync(local,'utf8');
            const isGlobalMacro=path.basename(local)===GLOBAL_MACRO;
            let html=raw;
            let mode='raw';

            if(isGlobalMacro){
              const dir=path.dirname(local);
              for(const part of GLOBAL_MACRO_PARTS){
                if(!raw.includes(part)) throw new Error(`${href}: multipart loader missing ${part}`);
              }
              html=GLOBAL_MACRO_PARTS.map(part=>{
                const file=path.join(dir,part);
                if(!fs.existsSync(file)) throw new Error(`${href}: multipart fragment missing — ${part}`);
                return fs.readFileSync(file,'utf8');
              }).join('');
              mode='multipart raw HTML';
              if(raw.includes('DecompressionStream') || raw.includes("const b='H4sI")) throw new Error(`${href}: legacy gzip/base64 wrapper still present`);
            }else{
              const packed=raw.match(/const\s+b\s*=\s*'([^']+)'/s);
              if(packed){
                try{
                  html=zlib.gunzipSync(Buffer.from(packed[1],'base64')).toString('utf8');
                  mode='gzip';
                }catch(err){
                  throw new Error(`${href}: gzip payload invalid — ${err.message}`);
                }
              }
            }

            if(html.length<500) throw new Error(`${href}: HTML payload too short (${html.length})`);
            if(isGlobalMacro){
              if(!/^<!doctype html>/i.test(html.trimStart())) throw new Error(`${href}: multipart payload does not start with HTML doctype`);
              if(!/<\/html>\s*$/i.test(html.trimEnd())) throw new Error(`${href}: multipart payload does not end with </html>`);
            }else if(!/<(?:!doctype\s+html|html|head|body)\b/i.test(html)){
              throw new Error(`${href}: payload is not HTML`);
            }
            console.log(`QA report OK: ${href} · ${html.length} chars · ${mode}`);
          }

          (async()=>{
            const base='http://127.0.0.1:8000/site/website-v1/';
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1672,height:905},deviceScaleFactor:1});
            const shots=[
              ['','website-v1-reference.png'],
              ['valute.html','website-v1-valute.png'],
              ['tassi.html','website-v1-tassi.png'],
              ['banche-centrali.html','website-v1-banche-centrali.png'],
              ['posizionamento.html','website-v1-posizionamento.png'],
              ['coppie.html','website-v1-coppie.png'],
              ['coppia.html?pair=EURUSD','website-v1-coppia-eurusd.png'],
              ['rischio-eventi.html','website-v1-rischio-eventi.png'],
              ['top-themes.html','website-v1-top-themes.png'],
              ['library.html','website-v1-library.png']
            ];
            for(const [route,file] of shots){
              await page.goto(base+route,{waitUntil:'networkidle',timeout:120000});
              await page.screenshot({path:file,fullPage:false});
            }
            await page.goto(base+'library.html',{waitUntil:'networkidle',timeout:120000});
            const hrefs=await page.$$eval('a.report-action.ready',as=>as.map(a=>a.getAttribute('href')));
            if(hrefs.length!==9) throw new Error(`Expected 9 active Library web mirrors, found ${hrefs.length}`);
            hrefs.forEach(verifyReportFile);

            const pending=await page.$$eval('.report-action.disabled',els=>els.length);
            if(pending!==0) throw new Error(`Expected 0 Library mirrors pending, found ${pending}`);

            const first=await browser.newPage({viewport:{width:1280,height:800},deviceScaleFactor:1});
            const response=await first.goto(new URL(hrefs[0],base+'library.html').href,{waitUntil:'domcontentloaded',timeout:120000});
            if(!response || !response.ok()) throw new Error(`${hrefs[0]}: HTTP ${response?.status()}`);
            await first.screenshot({path:'website-v1-library-report.png',fullPage:false});
            await first.close();

            const globalHref=hrefs.find(href=>href.endsWith(GLOBAL_MACRO));
            if(!globalHref) throw new Error('Global Macro mirror is not active in Library');
            const macro=await browser.newPage({viewport:{width:1280,height:800},deviceScaleFactor:1});
            const macroResponse=await macro.goto(new URL(globalHref,base+'library.html').href,{waitUntil:'domcontentloaded',timeout:120000});
            if(!macroResponse || !macroResponse.ok()) throw new Error(`${globalHref}: HTTP ${macroResponse?.status()}`);
            await macro.waitForFunction(()=>document.body?.innerText?.includes('Il quadro globale in 45 secondi') && document.body?.innerText?.includes('Bottom line · desk takeaways'),null,{timeout:120000});
            console.log(`QA multipart render OK: ${globalHref}`);
            await macro.close();
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node website-v1-qa.js
      - uses: actions/upload-artifact@v4
        with:
          name: website-v1-reference-lock
          path: |
            website-v1-reference.png
            website-v1-valute.png
            website-v1-tassi.png
            website-v1-banche-centrali.png
            website-v1-posizionamento.png
            website-v1-coppie.png
            website-v1-coppia-eurusd.png
            website-v1-rischio-eventi.png
            website-v1-top-themes.png
            website-v1-library.png
            website-v1-library-report.png