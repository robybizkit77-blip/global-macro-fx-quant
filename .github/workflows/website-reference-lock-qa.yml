name: Website Reference Lock QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/website-v1/**'
      - '.github/workflows/website-reference-lock-qa.yml'

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/website-v1.log 2>&1 &
          sleep 2
      - name: Capture website pages and verify Library report mirrors
        run: |
          cat > website-v1-qa.js <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const base='http://127.0.0.1:8000/site/website-v1/';
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1672,height:905},deviceScaleFactor:1});
            const shots=[
              ['','website-v1-reference.png'],
              ['valute.html','website-v1-valute.png'],
              ['tassi.html','website-v1-tassi.png'],
              ['banche-centrali.html','website-v1-banche-centrali.png'],
              ['posizionamento.html','website-v1-posizionamento.png'],
              ['coppie.html','website-v1-coppie.png'],
              ['coppia.html?pair=EURUSD','website-v1-coppia-eurusd.png'],
              ['rischio-eventi.html','website-v1-rischio-eventi.png'],
              ['top-themes.html','website-v1-top-themes.png'],
              ['library.html','website-v1-library.png']
            ];
            for(const [path,file] of shots){
              await page.goto(base+path,{waitUntil:'networkidle',timeout:120000});
              await page.screenshot({path:file,fullPage:false});
            }
            await page.goto(base+'library.html',{waitUntil:'networkidle',timeout:120000});
            const hrefs=await page.$$eval('a.report-action.ready',as=>as.map(a=>a.getAttribute('href')));
            if(hrefs.length!==9) throw new Error(`Expected 9 Library mirrors, found ${hrefs.length}`);
            for(const href of hrefs){
              console.log(`QA report: ${href}`);
              const report=await browser.newPage({viewport:{width:1280,height:800},deviceScaleFactor:1});
              const response=await report.goto(new URL(href,base+'library.html').href,{waitUntil:'networkidle',timeout:120000});
              if(!response || !response.ok()) throw new Error(`${href}: HTTP ${response?.status()}`);
              await report.waitForFunction(()=>document.body && document.body.innerText.length>500,null,{timeout:120000});
              const body=(await report.locator('body').innerText())||'';
              if(body.includes('Impossibile aprire il report')) throw new Error(`${href}: report decompression failed`);
              await report.close();
            }
            const first=await browser.newPage({viewport:{width:1280,height:800},deviceScaleFactor:1});
            await first.goto(new URL(hrefs[0],base+'library.html').href,{waitUntil:'networkidle',timeout:120000});
            await first.screenshot({path:'website-v1-library-report.png',fullPage:false});
            await first.close();
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node website-v1-qa.js
      - uses: actions/upload-artifact@v4
        with:
          name: website-v1-reference-lock
          path: |
            website-v1-reference.png
            website-v1-valute.png
            website-v1-tassi.png
            website-v1-banche-centrali.png
            website-v1-posizionamento.png
            website-v1-coppie.png
            website-v1-coppia-eurusd.png
            website-v1-rischio-eventi.png
            website-v1-top-themes.png
            website-v1-library.png
            website-v1-library-report.png
