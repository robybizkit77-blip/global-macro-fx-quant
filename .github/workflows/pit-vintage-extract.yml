name: PIT Vintage Extract

on:
  push:
    branches:
      - engine-freeze-v1-2026-10-02
    paths:
      - 'validation/extract_structured_vintages.py'
      - '.github/workflows/pit-vintage-extract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engine-freeze-v1-2026-10-02
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - name: Download and inspect official real-time tables
        run: python validation/extract_structured_vintages.py
      - name: Commit validation artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/raw_structured/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Materialize CAD structured vintage raw extracts"
            git push origin HEAD:engine-freeze-v1-2026-10-02
          fi
