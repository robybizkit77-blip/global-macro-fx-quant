name: Frozen Core Macro Reference Comparison V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/frozen-core-macro-reference-comparison-v1.yml'
      - 'validation/forward/*check_frozen_core_macro_directions_v1.py'
      - 'validation/forward/observe_official_ecb_reference_outcomes_v1.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/frozen-core-macro-reference-comparison-v1.yml'
      - 'validation/forward/*check_frozen_core_macro_directions_v1.py'
  workflow_run:
    workflows: ['Forward ECB Reference Outcomes V1 (research only)']
    types: [completed]
  schedule:
    - cron: '37 22 * * 1-5'
      timezone: Europe/Rome

permissions:
  contents: read

jobs:
  observe:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify chronology, archive integrity and same-case comparison
        run: python -m unittest validation.forward.test_check_frozen_core_macro_directions_v1 -v
      - name: Compare archived frozen Core and Macro directions with later ECB fixes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python -m validation.forward.check_frozen_core_macro_directions_v1 \
            --receipt /tmp/frozen-core-macro-reference-comparison.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain dated read-only Core research receipt
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frozen-core-macro-reference-${{ github.run_id }}
          path: /tmp/frozen-core-macro-reference-comparison.json
          if-no-files-found: error
          retention-days: 90
