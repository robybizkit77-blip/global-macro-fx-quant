name: US BEA PIO PIT Crawl

on:
  push:
    branches: [staging-usd-pit-readiness-2026-10-03]
    paths:
      - validation/crawl_us_bea_personal_income_outlays.py
      - .github/workflows/us-bea-pio-pit-crawl.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us-bea-pio-pit-crawl
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-usd-pit-readiness-2026-10-03
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Crawl BEA Personal Income and Outlays dated releases
        run: python validation/crawl_us_bea_personal_income_outlays.py
      - name: Commit PIT batch artifact
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/pit_batch/bea/BEA_PIO_PIT_BATCH_V1_2026-10-03.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build BEA PIO PIT batch"
            git pull --rebase origin staging-usd-pit-readiness-2026-10-03
            git push origin HEAD:staging-usd-pit-readiness-2026-10-03
          fi
