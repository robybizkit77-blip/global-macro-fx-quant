name: COT Persistent Weekly V1

on:
  push:
    branches:
      - main
      - cot-persistent-weekly-v1-2026-10-14
    paths:
      - '.github/workflows/cot-persistent-weekly-v1.yml'
  pull_request:
    paths:
      - '.github/workflows/cot-persistent-weekly-v1.yml'
  workflow_dispatch:
  schedule:
    # Europe/Rome Saturday retry cadence: 00:00, 02:00, 05:00, 08:00.
    - cron: '0 22 * * 5'
    - cron: '0 23 * * 5'
    - cron: '0 0 * * 6'
    - cron: '0 1 * * 6'
    - cron: '0 3 * * 6'
    - cron: '0 4 * * 6'
    - cron: '0 6 * * 6'
    - cron: '0 7 * * 6'

permissions:
  contents: write

concurrency:
  group: cot-persistent-weekly-v1
  cancel-in-progress: false

jobs:
  persist-cot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Rome schedule gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          hh="$(TZ=Europe/Rome date +'%H')"
          dow="$(TZ=Europe/Rome date +'%u')"
          allowed='00 02 05 08'
          if [[ "${{ github.event_name }}" != "schedule" || ( "$dow" == "6" && " $allowed " == *" $hh "* ) ]]; then
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
          fi
          echo "event=${{ github.event_name }} rome_hour=$hh dow=$dow"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.should_run == 'true'
        with:
          python-version: '3.12'

      - name: Build official CFTC candidate and stories
        id: candidate
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cot-persistent
          python validation/build_cot_candidate.py \
            --output /tmp/cot-persistent/V250_COT_CHART_DATA.json \
            | tee /tmp/cot-persistent/candidate-summary.json
          python validation/build_cot_stories.py \
            --source /tmp/cot-persistent/V250_COT_CHART_DATA.json \
            --output /tmp/cot-persistent/V247_COT_STORIES.json \
            > /tmp/cot-persistent/stories-summary.json
          STATUS="$(python -c "import json; print(json.load(open('/tmp/cot-persistent/candidate-summary.json'))['status'])")"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          test "$STATUS" = 'NO_UPDATE' -o "$STATUS" = 'CANDIDATE_READY'
          git diff --exit-code -- live_data payload

      - name: Validate no-update identity
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'NO_UPDATE'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          pairs=[
            ('/tmp/cot-persistent/V250_COT_CHART_DATA.json','live_data/sections/V250_COT_CHART_DATA.json','V250'),
            ('/tmp/cot-persistent/V247_COT_STORIES.json','live_data/sections/V247_COT_STORIES.json','V247'),
          ]
          for candidate,current,label in pairs:
              a=json.load(open(candidate)); b=json.load(open(current))
              assert a == b, f'{label}: NO_UPDATE candidate differs from live section'
          print('COT_PERSISTENT_NO_UPDATE_IDENTITY_PASS')
          PY
          python validation/check_live_update_contract.py > /tmp/cot-persistent/live-contract.json
          python validation/rebuild_live_data_runtime.py --verify-only > /tmp/cot-persistent/runtime-roundtrip.json
          git diff --exit-code -- live_data payload

      - name: Apply validated COT candidate
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'CANDIDATE_READY'
        shell: bash
        run: |
          set -euo pipefail
          python validation/update_live_direct_section.py \
            --section V250_COT_CHART_DATA \
            --replacement /tmp/cot-persistent/V250_COT_CHART_DATA.json \
            --apply > /tmp/cot-persistent/direct-apply.json
          python validation/update_live_derived_sections.py \
            --cot /tmp/cot-persistent/V247_COT_STORIES.json \
            --apply > /tmp/cot-persistent/derived-apply.json
          python validation/build_live_manifest_v2.py \
            --write live_data/manifest.v2.json > /tmp/cot-persistent/manifest-build.json
          python validation/check_live_update_contract.py > /tmp/cot-persistent/live-contract.json
          python validation/rebuild_live_data_runtime.py --verify-only > /tmp/cot-persistent/runtime-roundtrip.json
          python - <<'PY'
          import json
          c=json.load(open('/tmp/cot-persistent/live-contract.json'))
          r=json.load(open('/tmp/cot-persistent/runtime-roundtrip.json'))
          assert c['status']=='PASS', c
          assert r['status']=='PASS' and r.get('noop_roundtrip_byte_identical') is True, r
          print('COT_PERSISTENT_CONTRACT_PASS')
          PY

      - name: Enforce COT-only tracked diff scope
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'CANDIDATE_READY'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/cot-persistent/changed.txt
          python - <<'PY'
          changed=set(open('/tmp/cot-persistent/changed.txt').read().splitlines())
          allowed={
            'live_data/sections/V250_COT_CHART_DATA.json',
            'live_data/sections/V247_COT_STORIES.json',
            'live_data/manifest.v2.json',
          }
          bad=sorted(x for x in changed if x not in allowed and not x.startswith('payload/part-'))
          assert not bad, f'COT scope violation: {bad}'
          need={'live_data/sections/V250_COT_CHART_DATA.json','live_data/sections/V247_COT_STORIES.json'}
          assert need.issubset(changed), changed
          print('COT_PERSISTENT_SCOPE_PASS', sorted(changed))
          PY

      - name: Validation branch leaves runtime unchanged
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'CANDIDATE_READY' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- live_data payload
          git diff --exit-code -- live_data payload
          echo COT_PERSISTENT_VALIDATION_ONLY_PASS

      - name: Commit validated COT update to main with remote-head lease
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'CANDIDATE_READY' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          TARGET_BRANCH: main
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$REMOTE_SHA" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live_data/sections/V250_COT_CHART_DATA.json live_data/sections/V247_COT_STORIES.json live_data/manifest.v2.json payload/part-*.txt
          git diff --cached --quiet && { echo 'No COT changes to persist'; exit 0; }
          git commit -m 'Refresh weekly COT runtime from official CFTC data'
          REMOTE_SHA_2="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$REMOTE_SHA_2" = "$GITHUB_SHA"
          git push origin "HEAD:$TARGET_BRANCH"
          echo COT_PERSISTENT_MAIN_UPDATE_PUSHED

      - name: Upload COT evidence
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cot-persistent-weekly-${{ github.run_id }}
          path: /tmp/cot-persistent/
          if-no-files-found: warn
          retention-days: 60
