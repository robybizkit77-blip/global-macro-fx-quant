name: COT Persistent Weekly V1

on:
  push:
    branches:
      - main
      - cot-persistent-weekly-v1-2026-10-14
    paths:
      - '.github/workflows/cot-persistent-weekly-v1.yml'
      - 'validation/orchestration/apply_cot_runtime_candidate_v1.sh'
      - 'validation/orchestration/plan_cot_release_window_v1.py'
      - 'validation/orchestration/test_plan_cot_release_window_v1.py'
      - 'validation/build_cot_official_oi_v1.py'
      - 'validation/test_cot_official_oi_v1.py'
  pull_request:
    paths:
      - '.github/workflows/cot-persistent-weekly-v1.yml'
      - 'validation/orchestration/apply_cot_runtime_candidate_v1.sh'
      - 'validation/orchestration/plan_cot_release_window_v1.py'
      - 'validation/orchestration/test_plan_cot_release_window_v1.py'
      - 'validation/build_cot_official_oi_v1.py'
      - 'validation/test_cot_official_oi_v1.py'
  workflow_dispatch:
  schedule:
    # Existing Saturday retry cadence. Add *same-workflow* Monday 22:20
    # Europe/Rome recovery for CFTC Friday releases delayed to Monday by
    # US holidays (2026-11-16, 2026-11-30). Duplicate UTC clocks are DST
    # alternatives, admitted by the guarded planner, not new workflows.
    - cron: '20 20 * * 1'
    - cron: '20 21 * * 1'
    # First official publication attempt at 15:45 New York; the weekend
    # slots remain independent retries when GitHub or the source is late.
    - cron: '45 19 * * 5'
    - cron: '45 20 * * 5'
    # Europe/Rome Saturday retry cadence: 00:00, 02:00, 05:00, 08:00.
    - cron: '0 22 * * 5'
    - cron: '0 23 * * 5'
    - cron: '0 0 * * 6'
    - cron: '0 1 * * 6'
    - cron: '0 3 * * 6'
    - cron: '0 4 * * 6'
    - cron: '0 6 * * 6'
    - cron: '0 7 * * 6'

permissions:
  contents: write

concurrency:
  group: cot-persistent-weekly-v1
  cancel-in-progress: false

jobs:
  persist-cot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Resolve official Friday CFTC release and recovery windows
        id: gate
        shell: bash
        env:
          CRON_SLOT: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          python3 -m unittest validation.orchestration.test_plan_cot_release_window_v1 validation.test_cot_official_oi_v1 -v
          python3 -m validation.orchestration.plan_cot_release_window_v1

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.should_run == 'true'
        with:
          python-version: '3.12'

      - name: Build official CFTC candidate and stories
        id: candidate
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cot-persistent
          python validation/build_cot_candidate.py \
            --output /tmp/cot-persistent/V250_COT_CHART_DATA.json \
            | tee /tmp/cot-persistent/candidate-summary.json
          python validation/build_cot_stories.py \
            --source /tmp/cot-persistent/V250_COT_CHART_DATA.json \
            --output /tmp/cot-persistent/V247_COT_STORIES.json \
            > /tmp/cot-persistent/stories-summary.json
          STATUS="$(python -c "import json; print(json.load(open('/tmp/cot-persistent/candidate-summary.json'))['status'])")"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          test "$STATUS" = 'NO_UPDATE' -o "$STATUS" = 'CANDIDATE_READY'
          git diff --exit-code -- live_data payload

      - name: Validate no-update identity
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'NO_UPDATE'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          pairs=[
            ('/tmp/cot-persistent/V250_COT_CHART_DATA.json','live_data/sections/V250_COT_CHART_DATA.json','V250'),
            ('/tmp/cot-persistent/V247_COT_STORIES.json','live_data/sections/V247_COT_STORIES.json','V247'),
          ]
          for candidate,current,label in pairs:
              a=json.load(open(candidate)); b=json.load(open(current))
              assert a == b, f'{label}: NO_UPDATE candidate differs from live section'
          print('COT_PERSISTENT_NO_UPDATE_IDENTITY_PASS')
          PY
          python validation/check_live_update_contract.py > /tmp/cot-persistent/live-contract.json
          python validation/rebuild_live_data_runtime.py --verify-only > /tmp/cot-persistent/runtime-roundtrip.json
          git diff --exit-code -- live_data payload

      - name: Apply validated COT candidate
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'CANDIDATE_READY'
        shell: bash
        run: bash validation/orchestration/apply_cot_runtime_candidate_v1.sh /tmp/cot-persistent

      - name: Validation branch leaves runtime unchanged
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'CANDIDATE_READY' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- live_data payload
          git diff --exit-code -- live_data payload
          echo COT_PERSISTENT_VALIDATION_ONLY_PASS

      - name: Persist validated COT update with scoped retry on main
        if: steps.gate.outputs.should_run == 'true' && steps.candidate.outputs.status == 'CANDIDATE_READY' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          TARGET_BRANCH: main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          chart=live_data/sections/V250_COT_CHART_DATA.json
          stories=live_data/sections/V247_COT_STORIES.json
          for attempt in 1 2 3 4; do
            base="$(git rev-parse HEAD)"
            mapfile -t paths < /tmp/cot-persistent/changed.txt
            git add -- "${paths[@]}"
            git commit -m 'Refresh weekly COT runtime from official CFTC data'
            if git push origin "HEAD:$TARGET_BRANCH"; then
              echo "COT_PERSISTENT_MAIN_UPDATE_PUSHED attempt=$attempt"
              exit 0
            fi
            git fetch --no-tags origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
            fresh="$(git rev-parse "origin/$TARGET_BRANCH")"
            if [[ "$fresh" == "$base" ]]; then
              echo 'COT push failed without a concurrent main update' >&2
              exit 1
            fi
            if ! git diff --quiet "$base" "$fresh" -- "$chart" "$stories" \
              'validation/build_cot*.py' validation/verify_cftc_current_snapshot.py \
              validation/orchestration/apply_cot_runtime_candidate_v1.sh \
              .github/workflows/cot-persistent-weekly-v1.yml; then
              echo 'COT input or method changed during persistence; the candidate needs a fresh collection' >&2
              exit 1
            fi
            if [[ "$attempt" != 4 ]]; then
              # Rebuild the shared payload and manifest on the latest checkout.
              git switch --detach "$fresh"
              bash validation/orchestration/apply_cot_runtime_candidate_v1.sh /tmp/cot-persistent
            fi
          done
          echo 'COT main persistence exhausted its four attempts' >&2
          exit 1

      - name: Preserve official OI research evidence from validated CFTC candidate
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python validation/build_cot_official_oi_v1.py \
            --summary /tmp/cot-persistent/candidate-summary.json \
            --chart /tmp/cot-persistent/V250_COT_CHART_DATA.json \
            --output /tmp/cot-persistent/cot-official-oi-v1.json
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then exit 0; fi
          target=site/fx-quant-v2/next/cot-official-oi-v1.json
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            git switch --detach origin/main
            python validation/build_cot_official_oi_v1.py \
              --summary /tmp/cot-persistent/candidate-summary.json \
              --chart live_data/sections/V250_COT_CHART_DATA.json \
              --output "$target"
            if git diff --quiet -- "$target"; then exit 0; fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- "$target"
            git commit -m 'Preserve exact official CFTC open interest research evidence'
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'CFTC OI evidence persistence exhausted retries' >&2
          exit 1

      - name: Upload COT evidence
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cot-persistent-weekly-${{ github.run_id }}
          path: /tmp/cot-persistent/
          if-no-files-found: warn
          retention-days: 60
