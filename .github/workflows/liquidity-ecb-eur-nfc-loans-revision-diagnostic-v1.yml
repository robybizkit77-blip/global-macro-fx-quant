name: Liquidity ECB EUR NFC Loans Revision Diagnostic V1

on:
  push:
    branches:
      - release-candidate-daily-data-orchestrator-v1-2026-10-12
    paths:
      - 'validation/diagnose_ecb_eur_nfc_loans_revision_contract_v1.py'
      - '.github/workflows/liquidity-ecb-eur-nfc-loans-revision-diagnostic-v1.yml'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose ECB EUR NFC loans revision contract
        run: python validation/diagnose_ecb_eur_nfc_loans_revision_contract_v1.py | tee /tmp/eur-nfc-revision.json
      - name: Enforce diagnostic-only contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/eur-nfc-revision.json'))
          assert d['schema']=='GMFQ_LIQUIDITY_EUR_NFC_LOANS_REVISION_DIAGNOSTIC_V1'
          assert d['status']=='DIAGNOSTIC_ONLY_NO_PROMOTION'
          assert d['runtime_mutated'] is False
          assert d['publication_performed'] is False
          assert d['promotion_performed'] is False
          print('PROOF',d['proof'])
          print('LATEST',d['latest_date'],d['latest_value'],'NEW',d['new_observations'])
          print('REVISION_AWARE_APPLY_SAFE',d['revision_aware_apply_safe'])
          PY
      - name: Verify tracked runtime unchanged
        run: git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
