name: COT Provenance Source Audit V1

on:
  push:
    branches:
      - 'audit-cot-provenance-source-v1-2026-10-12'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact COT provenance constants and policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('payload/part-14.txt')
          s=p.read_text()
          keys=['COT_CURRENT_ASOF','COT_PREV_ASOF','FX_PRICE_LATEST','PRODUCTION_PRICE_COT_LIQ_AUDIT','FINAL_SOURCE_POLICY_AUDIT']
          for k in keys:
              print('\n===',k,'===')
              start=0
              while True:
                  i=s.find(k,start)
                  if i<0: break
                  a=max(0,i-900); b=min(len(s),i+2200)
                  print(s[a:b].replace('\r',''))
                  print('\n--- occurrence end ---')
                  start=i+len(k)
          PY
