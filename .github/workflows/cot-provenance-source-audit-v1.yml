name: COT Provenance Runtime Audit V1

on:
  push:
    branches:
      - 'audit-cot-provenance-source-v1-2026-10-12'
    paths-ignore:
      - 'validation/audit/cot-provenance-runtime-output.json'
      - 'validation/audit/cot-provenance-source-locations.txt'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Trace static COT provenance sources
        run: |
          mkdir -p validation/audit
          {
            echo '=== 2026-09-22 ==='
            grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude='cot-provenance-runtime-output.json' --exclude='cot-provenance-source-locations.txt' '2026-09-22' . || true
            echo
            echo '=== PRODUCTION_PRICE_COT_LIQ_AUDIT ==='
            grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude='cot-provenance-runtime-output.json' --exclude='cot-provenance-source-locations.txt' 'PRODUCTION_PRICE_COT_LIQ_AUDIT' . || true
            echo
            echo '=== FINAL_SOURCE_POLICY_AUDIT ==='
            grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude='cot-provenance-runtime-output.json' --exclude='cot-provenance-source-locations.txt' 'FINAL_SOURCE_POLICY_AUDIT' . || true
          } > validation/audit/cot-provenance-source-locations.txt
          cat validation/audit/cot-provenance-source-locations.txt
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8145 --bind 127.0.0.1 >/tmp/gmfq-cot-runtime.log 2>&1 &
          sleep 2
      - name: Inspect runtime COT provenance and freshness
        run: |
          cat > cot-runtime-audit.js <<'EOF'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.stack||e)));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.addInitScript(()=>{
              window.__GMFQ_PROVENANCE_ASSIGNMENT_TRACES=[];
              for(const name of ['PRODUCTION_PRICE_COT_LIQ_AUDIT','FINAL_SOURCE_POLICY_AUDIT']){
                let value;
                try{
                  Object.defineProperty(window,name,{
                    configurable:true,
                    enumerable:true,
                    get(){return value;},
                    set(v){
                      let cloned=null;
                      try{cloned=JSON.parse(JSON.stringify(v));}catch(e){}
                      window.__GMFQ_PROVENANCE_ASSIGNMENT_TRACES.push({
                        name,
                        stack:String(new Error('assignment:'+name).stack||''),
                        value:cloned
                      });
                      value=v;
                    }
                  });
                }catch(e){
                  window.__GMFQ_PROVENANCE_ASSIGNMENT_TRACES.push({name,error:String(e)});
                }
              }
            });
            const r=await page.goto('http://127.0.0.1:8145/index.html',{waitUntil:'domcontentloaded',timeout:120000});
            if(!r||!r.ok())throw new Error('HTTP load failed');
            await page.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.settled_after_cad_chain===true||window.__GMFQ_BOOTSTRAP_ERROR,null,{timeout:120000});
            await page.waitForFunction(()=>{
              const s=window.__GMFQ_COT_FRESHNESS_GATE_STATE?.status;
              return (s&&s!=='WAITING_FOR_COT_PROVENANCE')||window.__GMFQ_BOOTSTRAP_ERROR;
            },null,{timeout:120000});
            const out=await page.evaluate(()=>{
              const clone=x=>{try{return JSON.parse(JSON.stringify(x))}catch{return null}};
              const keys=Object.keys(window).filter(k=>/COT|SOURCE_POLICY|PRICE.*LIQ|PRODUCTION/i.test(k)).sort();
              const candidates={};
              for(const k of keys){
                let v;try{v=window[k]}catch(e){continue}
                if(v&&typeof v==='object') candidates[k]=clone(v);
                else if(typeof v!=='function') candidates[k]=String(v);
              }
              const data=window.__GMFQ_DATA||{};
              const dataKeys=Object.keys(data).sort();
              const gmfqDataCots={};
              for(const k of dataKeys){
                if(!/COT|V247|V250/i.test(k))continue;
                let v;try{v=data[k]}catch(e){continue}
                gmfqDataCots[k]=clone(v);
              }
              return {
                cotGate:clone(window.__GMFQ_COT_FRESHNESS_GATE_STATE),
                priceGate:clone(window.__GMFQ_PRICE_FRESHNESS_GATE_STATE),
                productionType:typeof window.PRODUCTION_PRICE_COT_LIQ_AUDIT,
                sourcePolicyType:typeof window.FINAL_SOURCE_POLICY_AUDIT,
                production:clone(window.PRODUCTION_PRICE_COT_LIQ_AUDIT),
                sourcePolicy:clone(window.FINAL_SOURCE_POLICY_AUDIT),
                assignmentTraces:clone(window.__GMFQ_PROVENANCE_ASSIGNMENT_TRACES),
                gmfqDataKeys:dataKeys,
                gmfqDataCots,
                keys,candidates,
                eurHeat:typeof window.cotHeatState==='function'?clone(window.cotHeatState('EUR')):null,
                eurHeatOriginal:typeof window.cotHeatState?.__gmfqOriginal==='function'?clone(window.cotHeatState.__gmfqOriginal('EUR')):null,
                bootstrapError:window.__GMFQ_BOOTSTRAP_ERROR||null
              };
            });
            console.log(JSON.stringify(out,null,2));
            fs.mkdirSync('validation/audit',{recursive:true});
            fs.writeFileSync('validation/audit/cot-provenance-runtime-output.json',JSON.stringify(out,null,2)+'\n');
            await browser.close();
            if(out.bootstrapError)throw new Error(out.bootstrapError);
            if(errors.length)throw new Error('Browser errors: '+errors.join(' | '));
          })().catch(e=>{console.error('::error title=COT runtime audit::'+String(e.stack||e));process.exit(1)});
          EOF
          node cot-runtime-audit.js
      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/audit/cot-provenance-runtime-output.json validation/audit/cot-provenance-source-locations.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record COT provenance assignment trace'
            git push
          fi
