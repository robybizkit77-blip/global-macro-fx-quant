name: COT Provenance Source Audit V1

on:
  push:
    branches:
      - 'audit-cot-provenance-source-v1-2026-10-12'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate exact current-stack COT provenance
        run: |
          echo '=== symbol locations ==='
          grep -R -n -E 'PRODUCTION_PRICE_COT_LIQ_AUDIT|FINAL_SOURCE_POLICY_AUDIT|COT_CURRENT_ASOF|COT_PREV_ASOF' payload live_data index.html || true
          echo '=== stale COT provenance/date contexts ==='
          grep -R -n -E 'current_as_of.{0,80}2026-09-22|2026-09-22.{0,80}current_as_of|COT.{0,120}2026-09-22' payload live_data index.html || true
          echo '=== fresh 2026-10-06 contexts ==='
          grep -R -n '2026-10-06' payload live_data index.html | head -120 || true
