name: COT Provenance Source Audit V1

on:
  push:
    branches:
      - 'audit-cot-provenance-source-v1-2026-10-12'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate COT provenance producers
        run: |
          echo '=== PRODUCTION_PRICE_COT_LIQ_AUDIT / FINAL_SOURCE_POLICY_AUDIT definitions ==='
          grep -R -n -E 'PRODUCTION_PRICE_COT_LIQ_AUDIT|FINAL_SOURCE_POLICY_AUDIT' . --exclude-dir=.git || true
          echo '=== stale COT dates ==='
          grep -R -n '2026-09-22' payload live_data validation .github/workflows --exclude='cot-provenance-source-audit-v1.yml' || true
          echo '=== current COT date references ==='
          grep -R -n '2026-10-06' payload live_data validation .github/workflows --exclude='cot-provenance-source-audit-v1.yml' | head -100 || true
