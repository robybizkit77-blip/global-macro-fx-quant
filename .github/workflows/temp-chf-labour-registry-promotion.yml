name: TEMP CHF Labour Registry Promotion

on:
  push:
    branches:
      - validation-macro-chf-labour-pit-bootstrap-2026-10-09-v2
    paths:
      - '.github/workflows/temp-chf-labour-registry-promotion.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote only CHF labour reviewed replay evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json')
          s=p.read_text()
          old='''    "CHF.labour": {\n      "currency": "CHF",\n      "dimension": "labour",\n      "series_id": "CH_UNEMP_RATE",\n      "source": "Swiss National Bank data portal / SECO",\n      "authority": "SECO",\n      "frequency": "M",\n      "transformation": "level",\n      "transport_class": "OFFICIAL_DIRECT",\n      "source_adapter_status": "READY",\n      "historical_replay_certified": false,\n      "adapter": "validation/sources/chf_snb_official_core.py",\n      "workflow": ".github/workflows/chf-snb-source-contract-v1.yml"\n    },'''
          new='''    "CHF.labour": {\n      "currency": "CHF",\n      "dimension": "labour",\n      "series_id": "CH_UNEMP_RATE",\n      "source": "Swiss National Bank data portal / SECO",\n      "authority": "SECO",\n      "frequency": "M",\n      "transformation": "level",\n      "transport_class": "OFFICIAL_DIRECT",\n      "source_adapter_status": "READY",\n      "historical_replay_certified": true,\n      "adapter": "validation/sources/chf_snb_official_core.py",\n      "workflow": ".github/workflows/chf-snb-source-contract-v1.yml",\n      "historical_replay_evidence": {\n        "schema": "GMFQ_MACRO_PIT_CERTIFICATION_REF_V1",\n        "evidence_schema": "GMFQ_MACRO_PIT_ANCHOR_EVIDENCE_V1",\n        "evidence_sha256": "d5f657f360d47f1365a118fccd3fcaaf22769a8770c4f3981c9f51891e2a3e8f",\n        "evidence_class": "RECONSTRUCTED_HISTORICAL_REPLAY",\n        "macro_series_id": "CH_UNEMP_RATE_history_value",\n        "observation_date": "2026-08",\n        "value": 3.13682671641221,\n        "before_git_head": "462bb2304eeb75b602a36150fb821e28065b9032",\n        "after_git_head": "462bb2304eeb75b602a36150fb821e28065b9032",\n        "promotion_mode": "EXPLICIT_REVIEW_REQUIRED",\n        "before_state": "RECONSTRUCTED_FROM_BOUNDED_CANONICAL_AFTER_AND_OFFICIAL_PRIOR_RELEASE",\n        "after_state": "CANONICAL_RUNTIME",\n        "official_release_pair_verified": true,\n        "manifest_sha256": "f7e456f49fbe87a7764692edd84363499d7a0c4f10318d0164e75bb2e329f9e8"\n      }\n    },'''
          assert s.count(old)==1, f'expected exactly one CHF labour block, found {s.count(old)}'
          p.write_text(s.replace(old,new))
          PY
          git diff -- validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json').read_text())
          row=r['series']['CHF.labour']
          assert row['historical_replay_certified'] is True
          e=row['historical_replay_evidence']
          assert e['evidence_sha256']=='d5f657f360d47f1365a118fccd3fcaaf22769a8770c4f3981c9f51891e2a3e8f'
          assert e['before_git_head']==e['after_git_head']=='462bb2304eeb75b602a36150fb821e28065b9032'
          assert e['manifest_sha256']=='f7e456f49fbe87a7764692edd84363499d7a0c4f10318d0164e75bb2e329f9e8'
          print('CHF_LABOUR_REGISTRY_TARGET_ONLY_PASS')
          PY
      - name: Commit reviewed registry promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/macro/MACRO_SOURCE_REGISTRY_2026-10-08.json
          git diff --cached --quiet && { echo 'No change'; exit 0; }
          git commit -m 'Promote reviewed CHF labour historical replay evidence'
          git push origin HEAD:validation-macro-chf-labour-pit-bootstrap-2026-10-09-v2
