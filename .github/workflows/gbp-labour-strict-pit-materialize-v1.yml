name: GBP Labour Strict PIT Materialize V1

on:
  push:
    branches: ['validation-gbp-labour-strict-pit-v1-*']
    paths:
      - 'validation/materialize_gbp_labour_strict_pit_v1.py'
      - 'validation/materialize_gbp_labour_strict_pit_v1_2024_patch.py'
      - '.github/workflows/gbp-labour-strict-pit-materialize-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize-twice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently materialize ONS first-release chain twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gbp-labour-strict/{a,b}
          python validation/materialize_gbp_labour_strict_pit_v1_2024_patch.py --csv /tmp/gbp-labour-strict/a/GBP_LABOUR_STRICT_FIRST_RELEASE_2018_2026_06.csv --evidence /tmp/gbp-labour-strict/a/evidence.json
          python validation/materialize_gbp_labour_strict_pit_v1_2024_patch.py --csv /tmp/gbp-labour-strict/b/GBP_LABOUR_STRICT_FIRST_RELEASE_2018_2026_06.csv --evidence /tmp/gbp-labour-strict/b/evidence.json
      - name: Enforce semantic equivalence and strict direct PIT invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path('/tmp/gbp-labour-strict')
          a=json.loads((root/'a/evidence.json').read_text()); b=json.loads((root/'b/evidence.json').read_text())
          assert a['status']==b['status']=='PASS'
          assert a['semantic_rowset_sha256']==b['semantic_rowset_sha256']
          assert a['coverage']==b['coverage']=={'start':'2018-01','end':'2026-06','expected_months':102,'materialized_months':102}
          rows=list(csv.DictReader((root/'a/GBP_LABOUR_STRICT_FIRST_RELEASE_2018_2026_06.csv').open()))
          assert len(rows)==102 and rows[0]['reference_month']=='2018-01' and rows[-1]['reference_month']=='2026-06'
          assert all(r['pit_status']=='STRICT_FIRST_RELEASE' and r['release_date'] and r['source_url'] and r['page_sha256'] for r in rows)
          assert len({r['page_sha256'] for r in rows})==102
          by={r['reference_month']:r for r in rows}
          anchors={'2018-01':('November 2017 to January 2018','November 2017 to January 2018','4.3','2018-03-21'),'2020-02':('December 2019 to February 2020','December 2019 to February 2020','4.0','2020-04-21'),'2023-03':('January 2023 to March 2023','January to March 2023','3.9','2023-05-16'),'2026-06':('April 2026 to June 2026','April to June 2026','4.9','2026-08-18')}
          for month, expected in anchors.items():
              r=by[month]; assert (r['rolling_period'],r['source_rolling_period'],r['headline_unemployment_rate_pct'],r['release_date'])==expected, (month,r)
          print(json.dumps({'status':'PASS','semantic_rowset_sha256':a['semantic_rowset_sha256'],'anchors':anchors},indent=2))
          PY
      - name: Enforce no repository writes
        run: git diff --exit-code
      - name: Upload source evidence and reproducible datasets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbp-labour-strict-pit-v1-${{ github.run_id }}
          path: /tmp/gbp-labour-strict/
          if-no-files-found: error
          retention-days: 90
