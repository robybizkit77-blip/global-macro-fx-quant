name: Repack v490 Live Data Check

on:
  push:
    branches: [staging-live-data-refresh-v1-2026-10-04]
    paths:
      - "validation/repack_v490_from_live_data.py"
      - ".github/workflows/repack-v490-live-data-check.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repack-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify live-data repack without writing payload
        run: python validation/repack_v490_from_live_data.py
      - name: Commit repack audit
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- validation/V490_LIVE_DATA_REPACK_AUDIT_2026-10-04.json)" ]; then
            echo "No audit change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/V490_LIVE_DATA_REPACK_AUDIT_2026-10-04.json
          git commit -m "Verify v490 live-data repack"
          git push
