name: US ALFRED Claims PIT Crawl

on:
  push:
    branches:
      - staging-usd-pit-readiness-2026-10-03
    paths:
      - 'validation/crawl_us_alfred_claims_pit.py'
      - '.github/workflows/us-alfred-claims-pit.yml'
  workflow_dispatch:

concurrency:
  group: us-alfred-claims-pit-staging
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-usd-pit-readiness-2026-10-03
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Build ALFRED ICSA and CCSA PIT batch
        run: python validation/crawl_us_alfred_claims_pit.py
      - name: Commit ALFRED claims PIT artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/pit_batch/alfred/ALFRED_US_CLAIMS_PIT_BATCH_V1_2026-10-03.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build ALFRED US claims PIT batch"
            git pull --rebase origin staging-usd-pit-readiness-2026-10-03
            git push origin HEAD:staging-usd-pit-readiness-2026-10-03
          fi
