name: Macro V2 One-Shot SECO 25 First Monthly Registered Unemployment Reports
on:
  push:
    branches: [feature/macro-v2-seco-25-first-monthly-releases-20261027]
    paths:
      - '.github/workflows/macro-v2-one-shot-seco-25-20261027.yml'
      - 'validation/macro/one_shot_retain_seco_25_official_month_reports_v1.py'
permissions:
  contents: write
jobs:
  secure-first-issuer-recovery:
    if: github.repository == 'robybizkit77-blip/global-macro-fx-quant'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction dependencies only for one-time publisher audit
        run: python -m pip install --disable-pip-version-check --quiet pymupdf beautifulsoup4 requests
      - name: Recover original first-month SECO PDF tables without changing live Macro
        run: |
          python validation/macro/one_shot_retain_seco_25_official_month_reports_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('validation/macro/fixtures/seco_chf_sa_registered_unemployment_25_first_monthly_reports_2024_09_2026_09.json')
          d=json.loads(path.read_text())
          assert d['target_observations']==25
          assert d['verified_issuer_first_rounded_reports']>=21
          assert d['original_reports_currently_unavailable_periods']==['2024-09','2024-10','2024-11','2024-12']
          assert d['archived_issuer_first_rounded_reports'][0]['reference_month']=='2025-01'
          assert d['archived_issuer_first_rounded_reports'][-1]['reference_month']=='2026-09'
          assert d['archived_issuer_first_rounded_reports'][-1]['original_seco_rounded_sa_registered_unemployment_pct']==3.1
          assert d['can_replace_canonical_CH_UNEMP_RATE_history_value'] is False
          assert d['safe_to_publish_new_D'] is False and d['writes_live_data'] is False
          PY
      - name: Preserve 25 verified issuer report-derived rows only on feature branch
        run: |
          git diff --exit-code -- live_data/sections/D.json live_data/sections/PAIR_SETUP_OPERATIONAL_VIEW.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/macro/fixtures/seco_chf_sa_registered_unemployment_25_first_monthly_reports_2024_09_2026_09.json
          git commit -m "Research: retain 25 original SECO rounded monthly SA registered unemployment rates"
          git push origin "HEAD:${{ github.ref_name }}"
