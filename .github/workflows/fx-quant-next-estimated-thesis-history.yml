name: FX Quant Next Estimated Thesis History

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fx-quant-next-estimated-thesis-history.yml'
      - 'validation/pair_thesis/*estimated*'
      - 'site/fx-quant-v2/next/pair-estimate-history-v1.json'
      - 'site/fx-quant-v2/next/macro-strength-estimated-v1.js'
      - 'site/fx-quant-v2/next/pair-rankings.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/fx-quant-next-estimated-thesis-history.yml'
      - 'validation/pair_thesis/update_estimated_history_v1.cjs'
      - 'live_data/sections/ECB_G8_PRICE_HISTORY.json'
  workflow_run:
    workflows: ['Price History Persistent Daily V1']
    types: [completed]
  schedule:
    - cron: '35 8,17 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('next-estimated-thesis-pr-{0}', github.event.pull_request.number) || 'next-estimated-thesis-main' }}
  queue: max
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node validation/pair_thesis/test_estimated_history_v1.cjs
  capture:
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event != 'pull_request'))
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record one forward snapshot for a new fixing
        shell: bash
        run: |
          set -euo pipefail
          archive=site/fx-quant-v2/next/pair-estimate-history-v1.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin main
            git checkout --detach FETCH_HEAD
            rm -f "$RUNNER_TEMP/next-estimated-thesis.json"
            node validation/pair_thesis/update_estimated_history_v1.cjs \
              "$archive" "$RUNNER_TEMP/next-estimated-thesis.json" "$(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
            if [[ ! -f "$RUNNER_TEMP/next-estimated-thesis.json" ]]; then exit 0; fi
            cp "$RUNNER_TEMP/next-estimated-thesis.json" "$archive"
            git add -- "$archive"
            git commit -m 'Record dated Next estimated FX theses'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((2 * attempt))"
          done
          exit 1
