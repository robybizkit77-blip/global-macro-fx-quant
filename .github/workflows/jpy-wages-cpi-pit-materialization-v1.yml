name: JPY Wages CPI PIT Materialization V1
on:
  push:
    branches:
      - audit-jpy-reaction-source-probe-v1-2026-10-06
    paths:
      - validation/materialize_jpy_wages_cpi_pit_v1.py
      - .github/workflows/jpy-wages-cpi-pit-materialization-v1.yml
      - validation/JPY_WAGES_CPI_SOURCE_PROBE_V1_2026-10-06.json
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pypdf
      - name: Materialize JPY wages and CPI PIT panels
        run: python validation/materialize_jpy_wages_cpi_pit_v1.py
      - name: Require complete GREEN panels before CSV commit
        run: |
          python - <<'PY'
          import json,sys
          z=json.load(open('validation/JPY_WAGES_CPI_PIT_MATERIALIZATION_V1_2026-10-06.json'))
          if z['status']!='PASS_67_67_GREEN':
              print(json.dumps(z,ensure_ascii=False,indent=2)); sys.exit(1)
          PY
      - name: Strict engine live OOS guard
        run: |
          if git diff --name-only HEAD^ | grep -E '^(engine/|live_data/|validation/CANONICAL_ENGINE_OOS_T0_V3_2026-10-01.json$)'; then
            echo 'Protected runtime/OOS files changed'; exit 1
          fi
      - name: Commit PIT panels and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history/pit_v1/JPY_WAGES_SCHEDULED_CASH_EARNINGS_FIRST_RELEASE_2018_2023_07.csv history/pit_v1/JPY_CPI_HEADLINE_CORE_FIRST_RELEASE_2018_2023_07.csv validation/JPY_WAGES_CPI_PIT_MATERIALIZATION_V1_2026-10-06.json
          git diff --cached --quiet && exit 0
          git commit -m 'Materialize JPY wages and CPI first-release PIT panels'
          git push
