name: TEMP EUR Labour Full History Check

on:
  push:
    branches:
      - validation-macro-eur-labour-overlap-check-2026-10-09
    paths:
      - '.github/workflows/temp-eur-labour-overlap-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify entire 120-month EUR labour heatmap history against live Eurostat
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from validation.sources.eur_eurostat_core import fetch_payload, extract_series, CONFIG

          payload=fetch_payload('labour')
          official=extract_series(payload,CONFIG['labour']['filters'])
          heat=json.loads(Path('live_data/sections/MACRO_THERMOMETER_DATA.json').read_text())['currencies']['EUR']['labour']
          series=json.loads(Path('live_data/sections/MACRO_SERIES.json').read_text())
          row=next(x for x in series['EUR'] if x['id']=='EA_UNEMP_history_value')

          hv=[float(x) for x in heat['history']]
          off_dates=[d[:7] for d,v in official]
          off_vals=[float(v) for d,v in official]
          assert len(hv)==120
          assert len(off_vals)>=120
          official_tail=off_vals[-120:]
          official_dates=off_dates[-120:]
          diffs=[abs(a-b) for a,b in zip(official_tail,hv)]
          material=[(official_dates[i],official_tail[i],hv[i],d) for i,d in enumerate(diffs) if d>1e-12]
          print(json.dumps({
            'status':'PASS',
            'official_observations':len(off_vals),
            'official_tail_first_date':official_dates[0],
            'official_tail_last_date':official_dates[-1],
            'heat_len':len(hv),
            'heat_as_of':heat['as_of'],
            'exact_match_count':sum(1 for d in diffs if d==0),
            'mismatch_count':len(material),
            'max_abs_diff':max(diffs),
            'first_mismatches':material[:10],
            'macro_series_len':len(row['values']),
            'macro_series_first_date':row['dates'][0],
            'macro_series_last_date':row['dates'][-1],
          },indent=2))
          assert not material, f'Eurostat full 120m history differs from heatmap at {len(material)} observations'
          assert official_dates[-1]=='2026-08'
          assert official_tail[-1]==6.4
          PY
          git diff --exit-code -- live_data/sections/MACRO_SERIES.json live_data/sections/MACRO_THERMOMETER_DATA.json
