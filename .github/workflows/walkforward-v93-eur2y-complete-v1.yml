name: Walkforward V93 EUR 2Y Complete V1

on:
  push:
    branches:
      - validation-walkforward-eur2y-complete-v1-2026-10-06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: npm init -y >/dev/null 2>&1 && npm install --save-dev playwright
      - name: Recover immutable certified EUR 2Y history
        shell: bash
        run: |
          git fetch origin 1fcb585e56d71308a4827372faac01008dbb29df --depth=1
          git show 1fcb585e56d71308a4827372faac01008dbb29df:history/ECB_EUR_AAA_2Y_2016_2026_CANONICAL_V1.json > /tmp/eur2y.json
      - name: Extract exact original V93 and extend data only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/historical-walkforward-v93.yml')
          text=p.read_text()
          start=text.index("cat > walkforward.js <<'EOF'")+len("cat > walkforward.js <<'EOF'")
          end=text.index('\n          EOF',start)
          js=text[start:end]
          js='\n'.join(line[10:] if line.startswith('          ') else line for line in js.splitlines())

          anchor="await page.waitForTimeout(2500);"
          inject="""await page.waitForTimeout(2500);\n            const frozenPrice=JSON.parse(fs.readFileSync('history/ECB_FX_G8_2018_2026_CANONICAL_V1.json','utf8'));\n            const eurHist=JSON.parse(fs.readFileSync('/tmp/eur2y.json','utf8'));\n            await page.evaluate(({priceRows,eurHist})=>{\n              window.__GMFQ_FROZEN_PRICE_ROWS=priceRows;\n              const obs=eurHist.observations||[];\n              const series={\n                id:'EUR_ECB_AAA_SVENSSON_SPOT_2Y_HISTORY',\n                label:'EUR AAA Svensson spot 2Y',\n                category:'Rates',\n                dates:obs.map(x=>x.date),\n                values:obs.map(x=>Number(x.value)),\n                frequency:'Daily - businessweek',\n                unit:'Percent per annum',\n                source_file:'ECB Data Portal YC · YC.B.U2.EUR.4F.G_N_A.SV_C_YM.SR_2Y'\n              };\n              S.EUR=(S.EUR||[]).filter(x=>x.id!==series.id);\n              S.EUR.push(series);\n            },{priceRows:frozenPrice.rows,eurHist});"""
          assert anchor in js
          js=js.replace(anchor,inject,1)

          old_price="const prices=(D?.prices||[]).map(r=>({t:parseDate(r.Date),r})).filter(x=>x.t!=null).sort((a,b)=>a.t-b.t);"
          new_price="const prices=(window.__GMFQ_FROZEN_PRICE_ROWS||[]).map(r=>({t:parseDate(r.Date),r})).filter(x=>x.t!=null).sort((a,b)=>a.t-b.t);"
          assert old_price in js
          js=js.replace(old_price,new_price,1)

          old_ids="const HIST_2Y_IDS={\n                USD:'US_DGS2_history_DGS2',"
          new_ids="const HIST_2Y_IDS={\n                EUR:'EUR_ECB_AAA_SVENSSON_SPOT_2Y_HISTORY',\n                USD:'US_DGS2_history_DGS2',"
          assert old_ids in js
          js=js.replace(old_ids,new_ids,1)

          old_eur="if(c==='EUR') return null;"
          assert old_eur in js
          js=js.replace(old_eur,"",1)

          js=js.replace("test:'HISTORICAL_WALKFORWARD_V93_2026-10-01'","test:'HISTORICAL_WALKFORWARD_V93_EUR_2Y_COMPLETE_V1_2026-10-06'",1)
          js=js.replace("status:'PSEUDO_OOS_RECONSTRUCTIBLE_CORE_ONLY'","status:'PSEUDO_OOS_DATA_COMPLETENESS_EXTENSION_EUR_2Y'",1)
          Path('/tmp/walkforward-eur2y.js').write_text(js)
          print('PATCHED_EXACT_ORIGINAL_V93=YES')
          PY
      - name: Run extended walk-forward
        shell: bash
        run: |
          NODE_PATH="$PWD/node_modules" node /tmp/walkforward-eur2y.js | tee /tmp/walkforward-eur2y.log
          cp validation/HISTORICAL_WALKFORWARD_V93_2026-10-01.json /tmp/walkforward-eur2y-result.json
      - name: Restore legacy golden and assert governance
        shell: bash
        run: |
          git checkout -- validation/HISTORICAL_WALKFORWARD_V93_2026-10-01.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/walkforward-eur2y-result.json').read_text())
          old=json.loads(Path('validation/HISTORICAL_WALKFORWARD_V93_2026-10-01.json').read_text())
          assert x['rules_fingerprint']=='3356baf0',x
          assert x['sample']['checkpoint_count']==105,x['sample']
          assert x['sample']['pair_count']==28,x['sample']
          assert x['status']=='PSEUDO_OOS_DATA_COMPLETENESS_EXTENSION_EUR_2Y',x['status']
          print('OLD_COUNTS=',json.dumps(old['quality_counts_4w'],ensure_ascii=False))
          print('NEW_COUNTS=',json.dumps(x['quality_counts_4w'],ensure_ascii=False))
          print('WITHHELD_REDUCTION=',old['quality_counts_4w']['WITHHELD']-x['quality_counts_4w']['WITHHELD'])
          print('NEW_RESULTS=',json.dumps(x['results'],ensure_ascii=False))
          PY
          git diff --exit-code
      - name: Upload extension evidence
        uses: actions/upload-artifact@v4
        with:
          name: walkforward-v93-eur2y-complete-v1
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/walkforward-eur2y-result.json
            /tmp/walkforward-eur2y.log
