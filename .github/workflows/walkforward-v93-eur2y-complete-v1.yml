name: Walkforward V93 EUR 2Y Complete V1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-frozen-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen data-completeness extension
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p=Path('validation/HISTORICAL_WALKFORWARD_V93_EUR_2Y_COMPLETE_V1_2026-10-06.json')
          assert p.exists(), 'extended benchmark missing'
          x=json.loads(p.read_text())

          assert x['test']=='HISTORICAL_WALKFORWARD_V93_EUR_2Y_COMPLETE_V1_2026-10-06'
          assert x['status']=='PSEUDO_OOS_DATA_COMPLETENESS_EXTENSION_EUR_2Y'
          assert x['rules_fingerprint']=='3356baf0'
          assert x['sample']['checkpoint_count']==105
          assert x['sample']['pair_count']==28
          assert x['quality_counts_4w']=={
            'CONTRASTO STRUTTURALE FORTE':395,
            'VANTAGGIO RELATIVO PARZIALE':1334,
            'PILASTRI DIVISI':436,
            'NESSUN CONTRASTO':551,
            'WITHHELD':224
          }

          e=x['data_completeness_extension']
          assert e['type']=='DATA_COMPLETENESS_EXTENSION'
          assert e['source_series_key']=='YC.B.U2.EUR.4F.G_N_A.SV_C_YM.SR_2Y'
          assert e['source_commit']=='1fcb585e56d71308a4827372faac01008dbb29df'
          assert e['legacy_withheld']==926
          assert e['extended_withheld']==224
          assert e['withheld_reduction']==702
          assert e['model_rules_changed'] is False
          assert e['rules_fingerprint_unchanged']=='3356baf0'

          assert 'EUR Rates historical same-basis chain WITHHELD' not in x['methodology']['exclusions']
          assert 'all 8 G8 currencies' in x['methodology']['rates']

          print(json.dumps({
            'status':'PASS',
            'rules_fingerprint':x['rules_fingerprint'],
            'quality_counts_4w':x['quality_counts_4w'],
            'data_completeness_extension':e,
            'strong_84d':x['results']['84']['strong'],
            'strong_basket_84d':x['results']['84']['strong_basket']
          },indent=2,ensure_ascii=False))
          PY

      - name: Confirm repository untouched
        run: git diff --exit-code
