name: Early Morning Recovery V1

# Independent event path: VIX / Calendar source success can wake the guard
# even if the Daily Data Orchestrator's schedule event is lost or delayed.
# Source producer runs may be workflow_run-triggered or explicitly dispatched
# by the existing overnight phase; the recovery planner still checks real
# orchestration child steps, main branch, time window and retry caps.
on:
  schedule:
    # Rome 05:19 and 06:19, with CET/CEST counterparts.
    - cron: '19 3 * * 1-5'
    - cron: '19 4 * * 1-5'
    - cron: '19 5 * * 1-5'
  workflow_run:
    workflows:
      - 'VIX Persistent Apply V1'
      - 'Calendar News Operational Refresh V1'
    types: [completed]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/early-morning-recovery-v1.yml'
      - 'validation/orchestration/trigger_early_morning_recovery_v1.py'
      - 'validation/orchestration/test_trigger_early_morning_recovery_v1.py'
      - 'validation/orchestration/trigger_morning_editorial_recovery_v1.py'
      - 'validation/orchestration/test_trigger_morning_editorial_recovery_v1.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/early-morning-recovery-v1.yml'
      - 'validation/orchestration/trigger_early_morning_recovery_v1.py'
      - 'validation/orchestration/test_trigger_early_morning_recovery_v1.py'
      - 'validation/orchestration/trigger_morning_editorial_recovery_v1.py'
      - 'validation/orchestration/test_trigger_morning_editorial_recovery_v1.py'

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('early-morning-recovery-pr-{0}', github.event.pull_request.number) || 'early-morning-recovery-production' }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate fail-safe recovery planner
        run: python -m unittest validation.orchestration.test_trigger_early_morning_recovery_v1 -v
      - name: Test dated Morning Macro/FX editorial recovery bounds
        run: python -m unittest validation.orchestration.test_trigger_morning_editorial_recovery_v1 -v

  recover:
    needs: tests
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'workflow_dispatch' ||
        github.event.workflow_run.event == 'workflow_run'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover only missing morning production with at most two dispatches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m validation.orchestration.trigger_early_morning_recovery_v1
      - name: Recover missing Morning FX public edition without new scheduler
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m validation.orchestration.trigger_morning_editorial_recovery_v1
