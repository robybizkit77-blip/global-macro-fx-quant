name: EUR Eurex FST3 Historical BusDate Probe V1

on:
  push:
    branches:
      - validation-eur-eurex-fst3-price-report-probe-v1-2026-10-15
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe historical FST3 busDate REST surface
        run: python validation/cb_pricing/probe_eur_eurex_fst3_historical_busdate_v1.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: eur-eurex-fst3-historical-busdate-probe-receipt
          path: validation/cb_pricing/eur_eurex_fst3_historical_busdate_probe_receipt_v1.json
          if-no-files-found: error
