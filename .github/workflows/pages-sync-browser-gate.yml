name: Pages Sync Browser Gate

on:
  push:
    branches: [staging-gh-pages-sync-clean-2026-10-01]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: npm init -y >/dev/null 2>&1 && npm install --save-dev playwright
      - name: Verify browser runtime
        run: |
          cat > verify.js <<'EOF'
          const {chromium}=require('playwright');
          const {execSync,spawn}=require('child_process');
          (async()=>{
            const srv=spawn('python3',['-m','http.server','8765'],{stdio:'ignore'});
            await new Promise(r=>setTimeout(r,1000));
            const cp=execSync('command -v google-chrome-stable || command -v google-chrome || command -v chromium').toString().trim();
            const browser=await chromium.launch({headless:true,executablePath:cp,args:['--no-sandbox']});
            const page=await browser.newPage();
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'networkidle',timeout:120000});
            await page.waitForTimeout(2500);
            const out=await page.evaluate(()=>{
              const ccys=['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];
              const health=typeof productionHealthCheck==='function'?productionHealthCheck():null;
              const fwd=typeof forwardValidationSummary==='function'?forwardValidationSummary():null;
              const pairs=[...(D?.pairs||[])].map(x=>x.pair);
              const prov=window.GMFQ_RUNTIME_PROVENANCE_MANIFEST||null;
              return {
                fingerprint:fwd?.current_rules_fingerprint||null,
                health:health||null,
                currencies:ccys.map(c=>({c,state:deriveCurrencyState(c)?.base||null})),
                pair_count:pairs.length,
                metadata:prov?.coverage||null
              };
            });
            await browser.close(); srv.kill();
            const issues=[];
            if(out.fingerprint!=='3356baf0') issues.push('fingerprint '+out.fingerprint);
            if(out.pair_count!==28) issues.push('pair_count '+out.pair_count);
            if(out.currencies.some(x=>!x.state)) issues.push('missing currency state');
            if((out.health?.hard_errors||[]).length) issues.push('hard_errors '+JSON.stringify(out.health.hard_errors));
            if(errors.length) issues.push('JS errors '+JSON.stringify(errors));
            if(out.metadata?.series_total!==204||out.metadata?.frequency_present!==204||out.metadata?.unit_present!==204) issues.push('metadata coverage '+JSON.stringify(out.metadata));
            const result={status:issues.length?'FAIL':'PASS',fingerprint:out.fingerprint,pair_count:out.pair_count,health_status:out.health?.status||null,metadata:out.metadata,issues};
            console.log('===PAGES_GATE_START===');
            console.log(JSON.stringify(result,null,2));
            console.log('===PAGES_GATE_END===');
            if(issues.length) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node verify.js
