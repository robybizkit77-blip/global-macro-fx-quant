name: Publish FX Quant V2 (isolated site)

on:
  push:
    branches: [main]
    paths:
      - 'site/fx-quant-v2/**'
      - 'validation/publishing/test_next_pair_calendar_watch_v1.cjs'
      - 'validation/publishing/check_fxv2_mirror_source_contract_v1.py'
      - 'validation/publishing/test_fxv2_mirror_source_contract_v1.py'
      - '.github/workflows/publish-fx-quant-v2.yml'
      - 'validation/publishing/check_fxv2_publication_tree_v1.py'
      - 'validation/publishing/test_check_fxv2_publication_tree_v1.py'
  pull_request:
    branches: [main]
    paths:
      - 'site/fx-quant-v2/next/macro-studio.js'
      - 'site/fx-quant-v2/next/index.html'
      - 'site/fx-quant-v2/next/research-library.js'
      - 'site/fx-quant-v2/next/reports/**'
      - 'site/fx-quant-v2/next/currency-studio.css'
      - 'site/fx-quant-v2/next/currency-studio.js'
      - 'site/fx-quant-v2/next/pair-rankings.js'
      - 'validation/publishing/test_next_crosspage_editorial_coherence_v1.cjs'
      - 'validation/publishing/test_next_pair_calendar_watch_v1.cjs'
      - 'validation/publishing/check_fxv2_mirror_source_contract_v1.py'
      - 'validation/publishing/test_fxv2_mirror_source_contract_v1.py'
      - 'site/fx-quant-v2/next/pair-desk-narrative.js'
      - 'site/fx-quant-v2/next/macro-strength-estimated-v1.js'
      - 'site/fx-quant-v2/next/decision-journey.js'
      - 'site/fx-quant-v2/next/app.js'
      - 'site/fx-quant-v2/next/cot-studio.js'
      - 'site/fx-quant-v2/next/cot-studio.css'
      - 'site/fx-quant-v2/next/cot-report-reading-v26.js'
      - 'site/fx-quant-v2/next/editorial-v4.css'
      - 'validation/publishing/test_next_pair_desk_narrative_v18.cjs'
      - 'validation/publishing/test_next_macro_economic_reading_v19.cjs'
      - 'validation/publishing/test_next_rates_economic_reading_v20.cjs'
      - 'validation/publishing/test_next_currency_relative_v21.cjs'
      - 'validation/publishing/test_next_currency_first_read_v1.cjs'
      - 'validation/publishing/test_next_macro_estimated_engine_v1.cjs'
      - 'site/fx-quant-v2/next/currency-strength-reading.js'
      - 'validation/publishing/test_next_g8_macro_strength_v1.cjs'
      - 'site/fx-quant-v2/next/currency-data-fallback.js'
      - 'validation/publishing/test_next_g8_data_fallback_v1.cjs'
      - 'site/fx-quant-v2/next/g8-growth-shadow.js'
      - 'validation/publishing/test_next_g8_growth_shadow_v1.cjs'
      - 'site/fx-quant-v2/next/g8-macro-gap-scenarios.js'
      - 'validation/publishing/test_next_g8_macro_gap_scenarios_v1.cjs'
      - 'site/fx-quant-v2/next/g8-inflation-labour-shadow.js'
      - 'validation/publishing/test_next_g8_inflation_labour_shadow_v1.cjs'
      - 'site/fx-quant-v2/next/g8-macro-pricing-bridge.js'
      - 'validation/publishing/test_next_g8_macro_pricing_bridge_v1.cjs'
      - 'validation/publishing/test_next_g8_editorial_first_read_v1.cjs'
      - 'validation/publishing/test_next_cot_evidence_v22.cjs'
      - 'validation/publishing/test_next_cot_report_desk_v26.cjs'
      - 'validation/publishing/test_next_risk_economic_v23.cjs'
      - 'validation/publishing/test_next_news_evidence_v24.cjs'
      - 'validation/publishing/test_next_pair_chart_controls_v27.cjs'
      - 'site/fx-quant-v2/next/morning-desk-v1.js'
      - 'site/fx-quant-v2/next/morning-desk-v1.css'
      - 'validation/publishing/test_morning_desk_render_v1.cjs'
      - 'validation/publishing/test_macro_us_households_hero_v1.cjs'
      - '.github/workflows/publish-fx-quant-v2.yml'
      - 'validation/publishing/test_fxv2_publisher_source_trigger_v1.py'
      - 'validation/publishing/check_fxv2_publication_tree_v1.py'
      - 'validation/publishing/test_check_fxv2_publication_tree_v1.py'
      - 'validation/publishing/wait_gh_pages_idle_before_fxv2_push_v1.py'
      - 'validation/publishing/test_wait_gh_pages_idle_before_fxv2_push_v1.py'
  workflow_run:
    # GITHUB_TOKEN commits do NOT emit a new push workflow. Use the producer's
    # completed run as an independent publication signal after its main write.
    workflows:
      - 'FX Quant V2 AUD Official RBA F2 Research Refresh'
      - 'FX Quant V2 CHF NZD Same-Basis Research Refresh'
      - 'FX Quant V2 Cross-Asset Published Source Refresh'
      - 'FX Quant V2 Macro Candidate Descriptive Baseline'
      - 'OIS G8 History Persistent Daily V1'
      - 'FX Quant V2 Relative Pricing 28-Pair Research'
      - 'Pair Setup Operational View V1'
      - 'FX Quant V2 Rates FX Temporal Research Audit'
      - 'FX Quant V2 Preregistered 6M Prospective Research'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('fxv2-publish-validation-pr-{0}', github.event.pull_request.number) || 'publish-fx-quant-v2-isolated' }}
  queue: max
  cancel-in-progress: false

jobs:
  contract:
    # This workflow only certifies the transport/scope contract. The existing
    # FX Quant Next Research Coherence QA checks narratives and UI separately.
    # Historical unit fixtures must not hold approved market data on main
    # hostage after the live feed advances.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source triggers, exact tree, lease and four research JSON contracts
        run: |
          set -euo pipefail
          python3 validation/publishing/test_fxv2_publisher_source_trigger_v1.py
          python3 -m unittest validation.publishing.test_check_fxv2_publication_tree_v1 -v
          python3 -m unittest validation.publishing.test_wait_gh_pages_idle_before_fxv2_push_v1 -v
          python3 -m unittest validation.publishing.test_fxv2_mirror_source_contract_v1 -v
          python3 validation/publishing/check_fxv2_mirror_source_contract_v1.py
          node --check site/fx-quant-v2/next/app.js
          node --check site/fx-quant-v2/next/pair-rankings.js
          node --check site/fx-quant-v2/next/currency-studio.js

  sync-v2:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Detect V2-only changes before entering the Pages deployment queue
        id: v2-tree
        shell: bash
        run: |
          set -euo pipefail
          # Refresh BOTH tracked references: queued workflow_run events can
          # represent already-published older producer snapshots.
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/gh-pages:refs/remotes/origin/gh-pages'
          python3 validation/publishing/check_fxv2_publication_tree_v1.py --github-output "$GITHUB_OUTPUT"

      - name: Report branch-exact V2 no-op without claiming public HTTP delivery
        if: steps.v2-tree.outputs.publish_needed == 'false'
        run: echo FXV2_NO_NEW_GH_PAGES_WRITE_BRANCH_TREE_IN_SYNC

      - name: Verify the Pages collision guard with deterministic tests
        if: steps.v2-tree.outputs.publish_needed == 'true'
        run: |
          python3 -m unittest validation.publishing.test_check_fxv2_publication_tree_v1 -v
          python3 -m unittest validation.publishing.test_wait_gh_pages_idle_before_fxv2_push_v1 -v

      - name: Wait until preceding official Pages build/deployment has finished
        if: steps.v2-tree.outputs.publish_needed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 validation/publishing/wait_gh_pages_idle_before_fxv2_push_v1.py \
            --output "$RUNNER_TEMP/fxv2-pages-idle-before-publish.json" \
            --attempts 90 --delay 10

      - name: Re-fetch the latest approved main after deployment queue wait
        if: steps.v2-tree.outputs.publish_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git checkout --detach origin/main
          echo "FXV2_APPROVED_MAIN_AFTER_QUEUE=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate approved V2 research sources before mirroring to gh-pages
        if: steps.v2-tree.outputs.publish_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Every referenced file is already committed on main; no source
          # mutation, proxy promotion or market date fabrication is performed.
          # The separate Next Research Coherence QA owns narrative test coverage.
          python3 validation/publishing/check_fxv2_mirror_source_contract_v1.py
          node --check site/fx-quant-v2/next/app.js
          node --check site/fx-quant-v2/next/pair-rankings.js
          node --check site/fx-quant-v2/next/currency-studio.js
          node --check site/fx-quant-v2/next/morning-desk-v1.js

      - name: Publish only site/fx-quant-v2 without altering V10 or any other path
        if: steps.v2-tree.outputs.publish_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_root="$PWD/site/fx-quant-v2"
          test -f "$source_root/index.html"
          test -f "$source_root/ois.html"
          test -f "$source_root/ois-pricing-snapshot.json"
          test -f "$source_root/assets/site-nav.js"

          git fetch origin gh-pages --no-tags
          # Another publisher may have made the exact V2 tree current during
          # the Pages build wait. Recheck the complete subtree before writing.
          current_source_tree="$(git rev-parse HEAD:site/fx-quant-v2)"
          current_pages_tree="$(git rev-parse origin/gh-pages:site/fx-quant-v2)"
          if [[ "$current_source_tree" == "$current_pages_tree" ]]; then
            echo FXV2_PAGES_ALREADY_IN_SYNC_AFTER_WAIT
            exit 0
          fi
          git worktree add --detach ../fxv2-publish-worktree origin/gh-pages
          target="../fxv2-publish-worktree"
          mkdir -p "$target/site/fx-quant-v2"
          rsync -a --delete "$source_root/" "$target/site/fx-quant-v2/"

          cd "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- site/fx-quant-v2
          if git diff --cached --quiet; then
            echo "V2_PAGES_ALREADY_IN_SYNC"
            exit 0
          fi
          if git diff --cached --name-only | grep -v '^site/fx-quant-v2/' ; then
            echo "SCOPE_VIOLATION: refusing non-V2 path changes" >&2
            exit 1
          fi
          git commit -m 'Publish approved FX Quant V2 site from main'
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:gh-pages; then
              echo "V2_PAGES_SYNC_PUBLISHED"
              exit 0
            fi
            echo "Concurrent gh-pages update, fetch + rebase retry $attempt" >&2
            git fetch origin gh-pages --no-tags
            git rebase origin/gh-pages
            sleep "$((attempt * 2))"
          done
          echo 'V2_PAGES_SYNC_FAILED: no false success claimed' >&2
          exit 1
