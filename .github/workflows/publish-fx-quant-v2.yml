name: Publish FX Quant V2 (isolated site)

on:
  push:
    branches: [main]
    paths:
      - 'site/fx-quant-v2/**'
      - 'validation/publishing/test_next_pair_calendar_watch_v1.cjs'
      - 'validation/publishing/check_fxv2_mirror_source_contract_v1.py'
      - 'validation/publishing/test_fxv2_mirror_source_contract_v1.py'
      - '.github/workflows/publish-fx-quant-v2.yml'
      - 'validation/publishing/check_fxv2_publication_tree_v1.py'
      - 'validation/publishing/test_check_fxv2_publication_tree_v1.py'
      - 'validation/publishing/finalize_daily_briefing_v1.py'
      - 'validation/publishing/test_finalize_daily_briefing_v1.py'
  pull_request:
    branches: [main]
    paths:
      - 'site/fx-quant-v2/next/macro-studio.js'
      - 'site/fx-quant-v2/next/index.html'
      - 'site/fx-quant-v2/next/research-library.js'
      - 'site/fx-quant-v2/next/reports/**'
      - 'site/fx-quant-v2/next/currency-studio.css'
      - 'site/fx-quant-v2/next/currency-studio.js'
      - 'site/fx-quant-v2/next/pair-rankings.js'
      - 'validation/publishing/test_next_crosspage_editorial_coherence_v1.cjs'
      - 'validation/publishing/test_next_pair_calendar_watch_v1.cjs'
      - 'validation/publishing/check_fxv2_mirror_source_contract_v1.py'
      - 'validation/publishing/test_fxv2_mirror_source_contract_v1.py'
      - 'site/fx-quant-v2/next/pair-desk-narrative.js'
      - 'site/fx-quant-v2/next/macro-strength-estimated-v1.js'
      - 'site/fx-quant-v2/next/decision-journey.js'
      - 'site/fx-quant-v2/next/app.js'
      - 'site/fx-quant-v2/next/data-health-v1.js'
      - 'site/fx-quant-v2/next/activity-momentum-v1.js'
      - 'validation/publishing/test_next_activity_momentum_v1.cjs'
      - 'validation/publishing/test_next_data_health_v1.cjs'
      - 'site/fx-quant-v2/next/cot-studio.js'
      - 'site/fx-quant-v2/next/cot-studio.css'
      - 'site/fx-quant-v2/next/cot-report-reading-v26.js'
      - 'site/fx-quant-v2/next/editorial-v4.css'
      - 'validation/publishing/test_next_pair_desk_narrative_v18.cjs'
      - 'validation/publishing/test_next_macro_economic_reading_v19.cjs'
      - 'validation/publishing/test_next_rates_economic_reading_v20.cjs'
      - 'validation/publishing/test_next_currency_relative_v21.cjs'
      - 'validation/publishing/test_next_currency_first_read_v1.cjs'
      - 'validation/publishing/test_next_macro_estimated_engine_v1.cjs'
      - 'site/fx-quant-v2/next/currency-strength-reading.js'
      - 'validation/publishing/test_next_g8_macro_strength_v1.cjs'
      - 'site/fx-quant-v2/next/currency-data-fallback.js'
      - 'validation/publishing/test_next_g8_data_fallback_v1.cjs'
      - 'site/fx-quant-v2/next/g8-growth-shadow.js'
      - 'validation/publishing/test_next_g8_growth_shadow_v1.cjs'
      - 'site/fx-quant-v2/next/g8-macro-gap-scenarios.js'
      - 'validation/publishing/test_next_g8_macro_gap_scenarios_v1.cjs'
      - 'site/fx-quant-v2/next/g8-inflation-labour-shadow.js'
      - 'validation/publishing/test_next_g8_inflation_labour_shadow_v1.cjs'
      - 'site/fx-quant-v2/next/g8-macro-pricing-bridge.js'
      - 'validation/publishing/test_next_g8_macro_pricing_bridge_v1.cjs'
      - 'validation/publishing/test_next_g8_editorial_first_read_v1.cjs'
      - 'validation/publishing/test_next_cot_evidence_v22.cjs'
      - 'validation/publishing/test_next_cot_report_desk_v26.cjs'
      - 'validation/publishing/test_next_risk_economic_v23.cjs'
      - 'validation/publishing/test_next_news_evidence_v24.cjs'
      - 'validation/publishing/test_next_pair_chart_controls_v27.cjs'
      - 'site/fx-quant-v2/next/morning-desk-v1.js'
      - 'site/fx-quant-v2/next/morning-desk-v1.css'
      - 'validation/publishing/test_morning_desk_render_v1.cjs'
      - 'validation/publishing/test_macro_us_households_hero_v1.cjs'
      - '.github/workflows/publish-fx-quant-v2.yml'
      - 'validation/publishing/test_fxv2_publisher_source_trigger_v1.py'
      - 'validation/publishing/check_fxv2_publication_tree_v1.py'
      - 'validation/publishing/test_check_fxv2_publication_tree_v1.py'
      - 'validation/publishing/wait_gh_pages_idle_before_fxv2_push_v1.py'
      - 'validation/publishing/test_wait_gh_pages_idle_before_fxv2_push_v1.py'
      - 'validation/publishing/finalize_daily_briefing_v1.py'
      - 'validation/publishing/test_finalize_daily_briefing_v1.py'
  workflow_run:
    # GITHUB_TOKEN commits do NOT emit a new push workflow. Use the producer's
    # completed run as an independent publication signal after its main write.
    workflows:
      - 'G8 Economic Semaphore Source Recovery V1'
      - 'COT Persistent Weekly V1'
      - 'FX Quant Next RBNZ Monthly Liquidity Research'
      - 'BoE GBP Weekly Reserves Research Refresh V1'
      - 'US Fed H8 Bank Credit Research Refresh V1'
      - 'CAD Official Business Credit Research Refresh V1'
      - 'ECB EUR NFC Credit Research Refresh V1'
      - 'RBA AUD Business Credit Growth Research Refresh V1'
      - 'RBA AUD Exchange Settlement Balances Research Refresh V1'
      - 'BoE GBP Secured Credit Growth Research Refresh V1'
      - 'BoJ JPY Bank Credit Research Refresh V1'
      - 'FX Quant V2 AUD Official RBA F2 Research Refresh'
      - 'FX Quant V2 CHF NZD Same-Basis Research Refresh'
      - 'CHF SNB 10Y Informational Context V1'
      - 'FX Quant V2 Cross-Asset Published Source Refresh'
      - 'FX Quant V2 Macro Candidate Descriptive Baseline'
      - 'OIS G8 History Persistent Daily V1'
      - 'OIS Estimated Snapshot Repricing V1'
      - 'FX Quant V2 Relative Pricing 28-Pair Research'
      - 'Pair Setup Operational View V1'
      - 'FX Quant Next Estimated Thesis History'
      - 'FX Quant V2 Rates FX Temporal Research Audit'
      - 'FX Quant V2 Preregistered 6M Prospective Research'
      - 'FX Quant NEXT isolated design and interaction QA'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ (github.event_name == 'pull_request' && format('fxv2-publish-validation-pr-{0}', github.event.pull_request.number)) || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && format('fxv2-briefing-qa-{0}', github.event.workflow_run.head_sha)) || 'publish-fx-quant-v2-isolated' }}
  queue: max
  cancel-in-progress: false

jobs:
  contract:
    # This workflow only certifies the transport/scope contract. The existing
    # FX Quant Next Research Coherence QA checks narratives and UI separately.
    # Historical unit fixtures must not hold approved market data on main
    # hostage after the live feed advances.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source triggers, exact tree, lease and four research JSON contracts
        run: |
          set -euo pipefail
          python3 validation/publishing/test_fxv2_publisher_source_trigger_v1.py
          python3 -m unittest validation.publishing.test_check_fxv2_publication_tree_v1 -v
          python3 -m unittest validation.publishing.test_wait_gh_pages_idle_before_fxv2_push_v1 -v
          python3 -m unittest validation.publishing.test_fxv2_mirror_source_contract_v1 -v
          python3 -m unittest validation.publishing.test_finalize_daily_briefing_v1 -v
          python3 validation/publishing/check_fxv2_mirror_source_contract_v1.py
          node --check site/fx-quant-v2/next/app.js
          node validation/publishing/test_next_data_health_v1.cjs
          node validation/publishing/test_next_activity_momentum_v1.cjs
          node --check site/fx-quant-v2/next/pair-rankings.js
          node --check site/fx-quant-v2/next/currency-studio.js

  finalize-briefing:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'FX Quant NEXT isolated design and interaction QA' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (startsWith(github.event.workflow_run.head_branch, 'briefing/') ||
       startsWith(github.event.workflow_run.head_branch, 'publish/briefing-'))
    permissions:
      contents: write
      checks: read
      pull-requests: write
    outputs:
      briefing: ${{ steps.finalize.outputs.briefing }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Merge today's exact Briefing PR after all existing checks
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m validation.publishing.finalize_daily_briefing_v1

  sync-v2:
    needs: [finalize-briefing]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.name != 'FX Quant NEXT isolated design and interaction QA') ||
       (needs.finalize-briefing.result == 'success' && needs.finalize-briefing.outputs.briefing != ''))
    permissions:
      contents: write
      actions: read
      pages: write
    concurrency:
      group: publish-fx-quant-v2-isolated-writer
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Detect V2-only changes before entering the Pages deployment queue
        id: v2-tree
        shell: bash
        run: |
          set -euo pipefail
          # Refresh BOTH tracked references: queued workflow_run events can
          # represent already-published older producer snapshots.
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/gh-pages:refs/remotes/origin/gh-pages'
          python3 validation/publishing/check_fxv2_publication_tree_v1.py --github-output "$GITHUB_OUTPUT"

      - name: Report branch-exact V2 no-op without claiming public HTTP delivery
        if: steps.v2-tree.outputs.publish_needed == 'false'
        run: echo FXV2_NO_NEW_GH_PAGES_WRITE_BRANCH_TREE_IN_SYNC

      - name: Verify the Pages collision guard with deterministic tests
        if: steps.v2-tree.outputs.publish_needed == 'true'
        run: |
          python3 -m unittest validation.publishing.test_check_fxv2_publication_tree_v1 -v
          python3 -m unittest validation.publishing.test_wait_gh_pages_idle_before_fxv2_push_v1 -v

      - name: Wait until preceding official Pages build/deployment has finished
        if: steps.v2-tree.outputs.publish_needed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 validation/publishing/wait_gh_pages_idle_before_fxv2_push_v1.py \
            --output "$RUNNER_TEMP/fxv2-pages-idle-before-publish.json" \
            --attempts 90 --delay 10

      - name: Re-fetch the latest approved main after deployment queue wait
        if: steps.v2-tree.outputs.publish_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git checkout --detach origin/main
          echo "FXV2_APPROVED_MAIN_AFTER_QUEUE=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate approved V2 research sources before mirroring to gh-pages
        if: steps.v2-tree.outputs.publish_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Every referenced file is already committed on main; no source
          # mutation, proxy promotion or market date fabrication is performed.
          # The separate Next Research Coherence QA owns narrative test coverage.
          python3 validation/publishing/check_fxv2_mirror_source_contract_v1.py
          node --check site/fx-quant-v2/next/app.js
          node --check site/fx-quant-v2/next/pair-rankings.js
          node --check site/fx-quant-v2/next/currency-studio.js
          node --check site/fx-quant-v2/next/morning-desk-v1.js

      - name: Publish only site/fx-quant-v2 without altering V10 or any other path
        if: steps.v2-tree.outputs.publish_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_root="$PWD/site/fx-quant-v2"
          test -f "$source_root/index.html"
          test -f "$source_root/ois.html"
          test -f "$source_root/ois-pricing-snapshot.json"
          test -f "$source_root/assets/site-nav.js"

          git fetch origin gh-pages --no-tags
          # Another publisher may have made the exact V2 tree current during
          # the Pages build wait. Recheck the complete subtree before writing.
          current_source_tree="$(git rev-parse HEAD:site/fx-quant-v2)"
          current_pages_tree="$(git rev-parse origin/gh-pages:site/fx-quant-v2)"
          if [[ "$current_source_tree" == "$current_pages_tree" ]]; then
            echo FXV2_PAGES_ALREADY_IN_SYNC_AFTER_WAIT
            exit 0
          fi
          git worktree add --detach ../fxv2-publish-worktree origin/gh-pages
          target="../fxv2-publish-worktree"
          mkdir -p "$target/site/fx-quant-v2"
          rsync -a --delete "$source_root/" "$target/site/fx-quant-v2/"

          cd "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- site/fx-quant-v2
          if git diff --cached --quiet; then
            echo "V2_PAGES_ALREADY_IN_SYNC"
            exit 0
          fi
          if git diff --cached --name-only | grep -v '^site/fx-quant-v2/' ; then
            echo "SCOPE_VIOLATION: refusing non-V2 path changes" >&2
            exit 1
          fi
          git commit -m 'Publish approved FX Quant V2 site from main'
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:gh-pages; then
              echo "V2_PAGES_SYNC_PUBLISHED"
              exit 0
            fi
            echo "Concurrent gh-pages update, fetch + rebase retry $attempt" >&2
            git fetch origin gh-pages --no-tags
            git rebase origin/gh-pages
            sleep "$((attempt * 2))"
          done
          echo 'V2_PAGES_SYNC_FAILED: no false success claimed' >&2
          exit 1

      - name: Verify the updated Next data and its reader on public Pages
        if: >-
          github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' &&
          (github.event.workflow_run.name == 'FX Quant Next Estimated Thesis History' ||
           github.event.workflow_run.name == 'FX Quant V2 Cross-Asset Published Source Refresh' ||
           github.event.workflow_run.name == 'FX Quant V2 AUD Official RBA F2 Research Refresh' ||
           github.event.workflow_run.name == 'CHF SNB 10Y Informational Context V1' ||
           github.event.workflow_run.name == 'FX Quant V2 CHF NZD Same-Basis Research Refresh' ||
           github.event.workflow_run.name == 'OIS G8 History Persistent Daily V1' ||
           github.event.workflow_run.name == 'OIS Estimated Snapshot Repricing V1' ||
           github.event.workflow_run.name == 'FX Quant V2 Relative Pricing 28-Pair Research' ||
           github.event.workflow_run.name == 'G8 Economic Semaphore Source Recovery V1' ||
           github.event.workflow_run.name == 'COT Persistent Weekly V1' ||
           github.event.workflow_run.name == 'FX Quant Next RBNZ Monthly Liquidity Research' ||
           github.event.workflow_run.name == 'BoE GBP Weekly Reserves Research Refresh V1' ||
           github.event.workflow_run.name == 'US Fed H8 Bank Credit Research Refresh V1' ||
           github.event.workflow_run.name == 'CAD Official Business Credit Research Refresh V1' ||
           github.event.workflow_run.name == 'ECB EUR NFC Credit Research Refresh V1' ||
           github.event.workflow_run.name == 'RBA AUD Business Credit Growth Research Refresh V1' ||
           github.event.workflow_run.name == 'RBA AUD Exchange Settlement Balances Research Refresh V1' ||
           github.event.workflow_run.name == 'BoE GBP Secured Credit Growth Research Refresh V1' ||
           github.event.workflow_run.name == 'BoJ JPY Bank Credit Research Refresh V1'))
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_NEEDED: ${{ steps.v2-tree.outputs.publish_needed }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Pin the checked-out approved V2 tree. Shared data belongs to the
          # Dashboard publisher; compare the approved published shared snapshot,
          # not a moving main commit which this writer does not own.
          git fetch --no-tags origin '+refs/heads/gh-pages:refs/remotes/origin/gh-pages'
          if [[ "$PUBLISH_NEEDED" == "false" ]]; then
            git checkout --detach origin/main
          fi
          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            for f in live_data/sections/NATIVE_LIQ_DATA.json live_data/sections/ESTIMATED_RESIDUAL_GAPS.json live_data/sections/MACRO_SERIES.json; do
              git show "origin/gh-pages:$f" > "$f"
            done
          fi
          page_sha="$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')"
          latest="$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" 2>/dev/null || echo '{}')"
          if ! jq -e --arg sha "$page_sha" '.commit == $sha and
            (.status == "built" or .status == "building" or .status == "queued")' <<<"$latest" >/dev/null; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from validation.publishing.verify_pages_http_delivery_v1 import BASE_URL, verify

          research_sources = {
              "G8 Economic Semaphore Source Recovery V1": "semaphore-supplement-v1.json",
              "FX Quant Next RBNZ Monthly Liquidity Research": "nzd-rbnz-liquidity-research-v1.js",
              "BoE GBP Weekly Reserves Research Refresh V1": "gbp-boe-reserves-research-v1.js",
              "US Fed H8 Bank Credit Research Refresh V1": "us-h8-bank-credit-research-v1.js",
              "CAD Official Business Credit Research Refresh V1": "cad-official-credit-research-v1.js",
              "ECB EUR NFC Credit Research Refresh V1": "eur-ecb-nfc-credit-research-v1.js",
              "RBA AUD Business Credit Growth Research Refresh V1": "aud-rba-business-credit-growth-research-v1.js",
              "RBA AUD Exchange Settlement Balances Research Refresh V1": "aud-rba-es-balances-research-v1.js",
              "BoE GBP Secured Credit Growth Research Refresh V1": "gbp-boe-secured-credit-research-v1.js",
              "BoJ JPY Bank Credit Research Refresh V1": "jpy-boj-bank-credit-research-v1.js",
          }
          pricing_paths = (
              "site/fx-quant-v2/ois-pricing-snapshot.json",
              "site/fx-quant-v2/ois-same-contract-repricing-research.json",
              "site/fx-quant-v2/pricing-relative-28pairs-research.json",
              "site/fx-quant-v2/next/rates-pricing-history-v1.json",
              "site/fx-quant-v2/next/rates-pricing-history-v1.js",
              "site/fx-quant-v2/next/rates-pricing-moves-v1.js",
              "site/fx-quant-v2/next/rates-relative-pricing-v1.js",
              "site/fx-quant-v2/next/rates-studio.js",
              "site/fx-quant-v2/next/central-bank-studio.js",
              "site/fx-quant-v2/next/g8-rates-shadow.js",
          )
          government_paths = (
              "site/fx-quant-v2/chf-2y-estimate-research.json",
              "site/fx-quant-v2/chf-snb-paired-history.json",
              "site/fx-quant-v2/nzd-rbnz-b2-reconciled-research.json",
              "site/fx-quant-v2/next/fx-rates-bridge.js",
              "site/fx-quant-v2/next/decision-journey.js",
              "site/fx-quant-v2/next/currency-studio.js",
              "site/fx-quant-v2/next/currency-data-fallback.js",
              "site/fx-quant-v2/next/rates-studio.js",
          )
          cot_paths = (
              "site/fx-quant-v2/next/cot-official-oi-v1.json",
              "site/fx-quant-v2/next/positioning-research-score-v1.js",
              "site/fx-quant-v2/next/global-fx-research-composite-v1.js",
              "site/fx-quant-v2/next/cot-studio.js",
              "site/fx-quant-v2/next/currency-studio.js",
              "site/fx-quant-v2/next/app.js",
              "site/fx-quant-v2/next/index.html",
          )
          rate_workflows = {
              "OIS G8 History Persistent Daily V1",
              "OIS Estimated Snapshot Repricing V1",
              "FX Quant V2 Relative Pricing 28-Pair Research",
          }
          source_workflow = os.environ["SOURCE_WORKFLOW"]
          if os.environ["EVENT_NAME"] in ("push", "workflow_dispatch"):
              label = "NEXT_G8_LIQUIDITY_PUBLIC_HTTP"
              base = "site/fx-quant-v2/next/"
              paths = tuple(base + f for f in (
                  "index.html", "app.js", "liquidity-credit-studio.js",
                  "liquidity-source-policy-gate-v1.js",
                  *(file for name, file in research_sources.items()
                    if name != "G8 Economic Semaphore Source Recovery V1"),
              )) + ("live_data/sections/NATIVE_LIQ_DATA.json",
                    "live_data/sections/ESTIMATED_RESIDUAL_GAPS.json")
              paths += tuple(base + f for f in (
                  "semaphore-supplement-v1.json", "recession-traffic-light-v1.js",
                  "recession-traffic-light-v1.css", "macro-studio.js",
              )) + ("live_data/sections/MACRO_SERIES.json",)
              paths += ("site/fx-quant-v2/cross-asset-live-data.json", "site/fx-quant-v2/cross-asset.html",
                        base + "risk-evidence-reading.js")
              paths += pricing_paths + government_paths
              paths += cot_paths
          elif source_workflow == "COT Persistent Weekly V1":
              label = "NEXT_COT_OFFICIAL_OI_PUBLIC_HTTP"
              paths = cot_paths
          elif source_workflow in rate_workflows:
              label = "OIS_RATES_PUBLIC_HTTP"
              paths = pricing_paths + (
                  "site/fx-quant-v2/next/app.js",
                  "site/fx-quant-v2/next/index.html",
              )
          elif source_workflow == "FX Quant V2 Cross-Asset Published Source Refresh":
              label = "CROSS_ASSET_PUBLIC_HTTP"
              paths = (
                  "site/fx-quant-v2/cross-asset-live-data.json",
                  "site/fx-quant-v2/cross-asset.html",
                  "site/fx-quant-v2/next/risk-evidence-reading.js",
                  "site/fx-quant-v2/next/app.js",
                  "site/fx-quant-v2/next/index.html",
              )
          elif source_workflow in research_sources:
              label = "NEXT_MACRO_LIQUIDITY_PUBLIC_HTTP"
              base = "site/fx-quant-v2/next/"
              paths = (
                  base + research_sources[source_workflow],
                  base + "index.html",
                  base + "app.js",
              )
              if source_workflow == "G8 Economic Semaphore Source Recovery V1":
                  paths += (base + "recession-traffic-light-v1.js", base + "recession-traffic-light-v1.css", base + "macro-studio.js",
                            "live_data/sections/MACRO_SERIES.json")
              else:
                  paths += (base + "liquidity-credit-studio.js",
                            base + "liquidity-source-policy-gate-v1.js",
                            "live_data/sections/NATIVE_LIQ_DATA.json")
          elif os.environ["SOURCE_WORKFLOW"] == "FX Quant V2 AUD Official RBA F2 Research Refresh":
              label = "AUD_F2_PUBLIC_HTTP"
              paths = (
                  "site/fx-quant-v2/aud-rba-f2-history-research.json",
                  "site/fx-quant-v2/aud-rba-f2-research.json",
                  "site/fx-quant-v2/next/fx-rates-bridge.js",
              )
          elif source_workflow in ("CHF SNB 10Y Informational Context V1",
                                   "FX Quant V2 CHF NZD Same-Basis Research Refresh"):
              label = ("CHF_2Y_ESTIMATE_PUBLIC_HTTP" if source_workflow ==
                       "CHF SNB 10Y Informational Context V1" else "CHF_NZD_RESEARCH_PUBLIC_HTTP")
              paths = government_paths + (
                  "site/fx-quant-v2/next/app.js",
                  "site/fx-quant-v2/next/index.html",
              )
          else:
              label = "NEXT_THESIS_HISTORY_PUBLIC_HTTP"
              # Verify the exact public bytes of the receipt, its five inputs
              # and the readers rather than the history archive alone.
              paths = (
                  "site/fx-quant-v2/next/pair-estimate-history-v1.json",
                  "site/fx-quant-v2/next/pair-estimate-recalc-receipt-v1.json",
                  "site/control-room-preview/macro-v3-current-evidence.json",
                  "live_data/sections/ECB_G8_PRICE_HISTORY.json",
                  "site/fx-quant-v2/ois-pricing-snapshot.json",
                  "live_data/sections/NATIVE_RATES_DATA.json",
                  "live_data/sections/PAIR_SETUP_OPERATIONAL_VIEW.json",
                  "site/fx-quant-v2/next/macro-strength-estimated-v1.js",
                  "site/fx-quant-v2/next/home-thesis-recalc-v1.js",
                  "site/fx-quant-v2/next/pair-rankings.js",
                  "site/fx-quant-v2/next/app.js",
                  "site/fx-quant-v2/next/index.html",
              )
          # The overview and source checks also require its shared diagnostic reader.
          paths += ("site/fx-quant-v2/next/data-health-v1.js",
                    "site/fx-quant-v2/next/activity-momentum-v1.js",)
          # Remove overlapping consumers without weakening exact-byte checks.
          paths = tuple(dict.fromkeys(paths))
          proof = verify(Path("."), BASE_URL, paths, budget_seconds=480, interval_seconds=10)
          print(label, json.dumps(proof, sort_keys=True), flush=True)
          if proof["status"] != "PASS":
              raise SystemExit("Next data or its reader did not reach public Pages")
          PY

      - name: Verify the Briefing index and original HTML on public Pages
        if: needs.finalize-briefing.outputs.briefing != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRIEFING_FILE: ${{ needs.finalize-briefing.outputs.briefing }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/gh-pages:refs/remotes/origin/gh-pages'
          git checkout --detach origin/main
          python3 -m validation.publishing.finalize_daily_briefing_v1 --verify-public "$BRIEFING_FILE"
