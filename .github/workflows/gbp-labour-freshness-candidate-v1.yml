name: GBP Labour Freshness Candidate V1

on:
  push:
    branches:
      - 'validation-gbp-labour-freshness-*'
  workflow_dispatch:

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build July 2026 evidence candidate without mutating canonical collector
        run: |
          cp validation/materialize_gbp_labour_strict_pit_v1.py /tmp/materialize_gbp_labour_candidate.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/materialize_gbp_labour_candidate.py')
          s=p.read_text()
          old="targets = list(month_range((2018, 1), (2026, 6)))"
          if old not in s:
              raise SystemExit('expected GBP labour target contract not found')
          s=s.replace(old,"targets = list(month_range((2018, 1), (2026, 7)))",1)
          s=s.replace('GBP_LABOUR_STRICT_FIRST_RELEASE_2018_2026_06_','GBP_LABOUR_STRICT_FIRST_RELEASE_2018_2026_07_',1)
          p.write_text(s)
          PY

          mkdir -p /tmp/gbp-candidate-a /tmp/gbp-candidate-b
          python3 /tmp/materialize_gbp_labour_candidate.py --output-dir /tmp/gbp-candidate-a
          sleep 2
          python3 /tmp/materialize_gbp_labour_candidate.py --output-dir /tmp/gbp-candidate-b

          python3 - <<'PY'
          import glob,hashlib,json,os
          a=glob.glob('/tmp/gbp-candidate-a/*.json')
          b=glob.glob('/tmp/gbp-candidate-b/*.json')
          if len(a)!=1 or len(b)!=1:
              raise SystemExit(f'unexpected candidate files a={a} b={b}')
          ja=json.load(open(a[0])); jb=json.load(open(b[0]))
          def semantic(x):
              return x.get('observations',x)
          sa=json.dumps(semantic(ja),sort_keys=True,separators=(',',':')).encode()
          sb=json.dumps(semantic(jb),sort_keys=True,separators=(',',':')).encode()
          sha_a=hashlib.sha256(sa).hexdigest(); sha_b=hashlib.sha256(sb).hexdigest()
          if sha_a!=sha_b:
              raise SystemExit(f'non deterministic candidate {sha_a} != {sha_b}')
          obs=ja.get('observations',[])
          if not obs:
              raise SystemExit('candidate observations missing')
          last=obs[-1]
          if last.get('reference_month')!='2026-07':
              raise SystemExit(f"unexpected last reference month {last.get('reference_month')}")
          evidence={
              'schema':'GMFQ_GBP_LABOUR_FRESHNESS_CANDIDATE_V1',
              'target_end':'2026-07',
              'observation_count':len(obs),
              'last_observation':last,
              'semantic_sha256':sha_a,
              'deterministic_two_pass':True,
              'canonical_collector_modified':False
          }
          os.makedirs('validation_evidence',exist_ok=True)
          json.dump(evidence,open('validation_evidence/gbp_labour_freshness_candidate_v1.json','w'),indent=2)
          print(json.dumps(evidence,indent=2))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbp-labour-freshness-candidate-v1
          path: |
            validation_evidence/gbp_labour_freshness_candidate_v1.json
            /tmp/gbp-candidate-a/*.json
            /tmp/gbp-candidate-b/*.json
