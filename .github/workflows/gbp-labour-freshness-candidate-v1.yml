name: GBP Labour Freshness Candidate V1

on:
  push:
    branches:
      - 'validation-gbp-labour-freshness-*'
  workflow_dispatch:

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build July 2026 evidence candidate without mutating canonical collector
        run: |
          cp validation/materialize_gbp_labour_strict_pit_v1.py /tmp/materialize_gbp_labour_candidate.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/materialize_gbp_labour_candidate.py')
          s=p.read_text()
          replacements={
            "target = list(month_range((2018, 1), (2026, 6)))":"target = list(month_range((2018, 1), (2026, 7)))",
            "len(rows) != 102":"len(rows) != 103",
            "len({r['reference_month'] for r in rows}) != 102":"len({r['reference_month'] for r in rows}) != 103",
            "len({r['page_sha256'] for r in rows}) != 102":"len({r['page_sha256'] for r in rows}) != 103",
            "'end': '2026-06', 'expected_months': 102":"'end': '2026-07', 'expected_months': 103",
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'expected GBP labour contract fragment not found: {old}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY

          mkdir -p /tmp/gbp-candidate-a /tmp/gbp-candidate-b validation_evidence
          python3 /tmp/materialize_gbp_labour_candidate.py \
            --csv /tmp/gbp-candidate-a/gbp_labour.csv \
            --evidence /tmp/gbp-candidate-a/gbp_labour_evidence.json
          sleep 2
          python3 /tmp/materialize_gbp_labour_candidate.py \
            --csv /tmp/gbp-candidate-b/gbp_labour.csv \
            --evidence /tmp/gbp-candidate-b/gbp_labour_evidence.json

          python3 - <<'PY'
          import csv,hashlib,json,os
          ea=json.load(open('/tmp/gbp-candidate-a/gbp_labour_evidence.json'))
          eb=json.load(open('/tmp/gbp-candidate-b/gbp_labour_evidence.json'))
          rows_a=list(csv.DictReader(open('/tmp/gbp-candidate-a/gbp_labour.csv',encoding='utf-8')))
          rows_b=list(csv.DictReader(open('/tmp/gbp-candidate-b/gbp_labour.csv',encoding='utf-8')))
          if ea.get('semantic_rowset_sha256') != eb.get('semantic_rowset_sha256'):
              raise SystemExit('non deterministic semantic rowset')
          if rows_a != rows_b:
              raise SystemExit('non deterministic CSV rowset')
          if len(rows_a)!=103:
              raise SystemExit(f'unexpected observation count {len(rows_a)}')
          last=rows_a[-1]
          if last.get('reference_month')!='2026-07':
              raise SystemExit(f"unexpected last reference month {last.get('reference_month')}")
          evidence={
              'schema':'GMFQ_GBP_LABOUR_FRESHNESS_CANDIDATE_V1',
              'target_end':'2026-07',
              'observation_count':len(rows_a),
              'last_observation':last,
              'semantic_sha256':ea.get('semantic_rowset_sha256'),
              'raw_fetch_sha256':ea.get('raw_fetch_rowset_sha256'),
              'deterministic_two_pass':True,
              'canonical_collector_modified':False,
              'source_contract':ea.get('series_contract'),
              'route_counts':ea.get('route_counts')
          }
          json.dump(evidence,open('validation_evidence/gbp_labour_freshness_candidate_v1.json','w'),indent=2)
          print(json.dumps(evidence,indent=2))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbp-labour-freshness-candidate-v1
          path: |
            validation_evidence/gbp_labour_freshness_candidate_v1.json
            /tmp/gbp-candidate-a/gbp_labour.csv
            /tmp/gbp-candidate-a/gbp_labour_evidence.json
            /tmp/gbp-candidate-b/gbp_labour.csv
            /tmp/gbp-candidate-b/gbp_labour_evidence.json
