name: ECB Mandate Sensitivity V1

on:
  push:
    branches: [validation-ecb-mandate-sensitivity-v1-2026-10-11]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  EUR_INFLATION_ARTIFACT_ID: '11674452706'
  EUR_INFLATION_ARTIFACT_DIGEST: 'sha256:ddab80f0b0cfe51a5e8b37dc482d77285353916cf499d7be3791273fdc677c6d'
  EUR_LABOUR_ARTIFACT_ID: '11678794954'
  EUR_LABOUR_ARTIFACT_DIGEST: 'sha256:933a0032ba3712050d7306908a3c64fd23a2c7731cd68f44cf4f4c6ea7b0e677'
  RATES_STORE_SHA: 0f4f45190fa5d5e010650026a30a0f981373ec34
  GH_TOKEN: ${{ github.token }}

jobs:
  sensitivity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download exact certified EUR Macro artifacts
        run: |
          set -euo pipefail
          mkdir -p /tmp/mandate/inf /tmp/mandate/lab
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          for aid,digest in [(os.environ['EUR_INFLATION_ARTIFACT_ID'],os.environ['EUR_INFLATION_ARTIFACT_DIGEST']),(os.environ['EUR_LABOUR_ARTIFACT_ID'],os.environ['EUR_LABOUR_ARTIFACT_DIGEST'])]:
              m=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts/{aid}'],text=True))
              assert not m['expired'] and m.get('digest')==digest
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EUR_INFLATION_ARTIFACT_ID}/zip" > /tmp/mandate/inf.zip
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EUR_LABOUR_ARTIFACT_ID}/zip" > /tmp/mandate/lab.zip
          unzip -q /tmp/mandate/inf.zip -d /tmp/mandate/inf
          unzip -q /tmp/mandate/lab.zip -d /tmp/mandate/lab
      - name: Borrow exact frozen certified EUR Rates rowset
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$RATES_STORE_SHA"
          git checkout FETCH_HEAD -- validation/rates_pit_rowsets/eur_rates_2y_10y_temporal_pit_v1.csv
          cp validation/rates_pit_rowsets/eur_rates_2y_10y_temporal_pit_v1.csv /tmp/mandate/rates.csv
          git reset --hard "$GITHUB_SHA"
          git clean -fd
      - name: Download official ECB EURUSD history
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 --max-time 120 'https://data-api.ecb.europa.eu/service/data/EXR/D.USD.EUR.SP00.A?startPeriod=2018-03-01&endPeriod=2026-09-30&format=csvdata' -o /tmp/mandate/ecb.csv
      - name: Run fixed mandate sensitivity diagnostic
        run: |
          set -euo pipefail
          INF=/tmp/mandate/inf/a/EUR_INFLATION_STRICT_FIRST_RELEASE_FLASH_2018_2026_09.csv
          LAB=/tmp/mandate/lab/a/EUR_LABOUR_STRICT_FIRST_RELEASE_2018_2026_08.csv
          python validation/ecb_mandate_sensitivity_v1.py --inflation "$INF" --labour "$LAB" --rates /tmp/mandate/rates.csv --ecb /tmp/mandate/ecb.csv --output /tmp/mandate/result.json
          python validation/ecb_mandate_sensitivity_v1.py --inflation "$INF" --labour "$LAB" --rates /tmp/mandate/rates.csv --ecb /tmp/mandate/ecb.csv --output /tmp/mandate/result-b.json >/dev/null
          cmp /tmp/mandate/result.json /tmp/mandate/result-b.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/mandate/result.json'))
          assert r['status']=='DIAGNOSTIC_COMPLETE'
          assert r['scope']['snapshot_count']==102 and r['scope']['oos_predictions']==65
          assert r['method']['hyperparameter_tuning'] is False
          assert r['policy']['production_signal_authorized'] is False
          print(json.dumps({'comparison':r['comparison'],'old':r['models']['OLD_EQUAL_MANDATE'],'new':r['models']['ECB_PRICE_STABILITY_FIRST']},indent=2,sort_keys=True))
          PY
      - name: Assert repository clean
        run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecb-mandate-sensitivity-${{ github.run_id }}
          path: /tmp/mandate/result.json
          retention-days: 90
