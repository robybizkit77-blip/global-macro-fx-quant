name: Macro Surprise Coverage Gate
on:
  push:
    branches: [staging-macro-surprise-coverage-fix-2026-10-01]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y >/dev/null 2>&1 && npm install --save-dev playwright
      - name: Verify surprise coverage
        run: |
          cat > verify.js <<'EOF'
          const {chromium}=require('playwright');
          const {execSync,spawn}=require('child_process');
          (async()=>{
            const srv=spawn('python3',['-m','http.server','8765'],{stdio:'ignore'});
            await new Promise(r=>setTimeout(r,900));
            const cp=execSync('command -v google-chrome-stable || command -v google-chrome || command -v chromium').toString().trim();
            const browser=await chromium.launch({headless:true,executablePath:cp,args:['--no-sandbox']});
            const page=await browser.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(3500);
            const out=await page.evaluate(()=>({
              fp:typeof forwardValidationSummary==='function'?forwardValidationSummary()?.current_rules_fingerprint:null,
              pairs:(D?.pairs||[]).length,
              diag:window.GMFQ_MACRO_SURPRISE_DIAGNOSTIC||null,
              hard:(typeof productionHealthCheck==='function'?productionHealthCheck()?.hard_errors:[])||[]
            }));
            out.js=errors;
            console.log(JSON.stringify(out,null,2));
            await browser.close();srv.kill();
            const issues=[];
            if(out.fp!=='3356baf0')issues.push('fingerprint');
            if(out.pairs!==28)issues.push('pairs');
            if(out.diag?.version!=='1.1')issues.push('version');
            if(out.diag?.totals?.coverage_pct!==93)issues.push('coverage '+out.diag?.totals?.coverage_pct);
            if(out.diag?.summary?.EUR?.coverage_pct!==100)issues.push('EUR '+out.diag?.summary?.EUR?.coverage_pct);
            if(out.diag?.summary?.AUD?.coverage_pct!==100)issues.push('AUD '+out.diag?.summary?.AUD?.coverage_pct);
            if(out.diag?.summary?.NZD?.without_consensus!==1)issues.push('NZD');
            if(out.diag?.summary?.CHF?.state!=='NO_RECENT_RELEASE')issues.push('CHF');
            if(JSON.stringify(out.diag?.coverage_gaps?.map(x=>x.currency))!==JSON.stringify(['NZD']))issues.push('gaps '+JSON.stringify(out.diag?.coverage_gaps));
            if(out.diag?.policy?.changes_model_rules!==false||out.diag?.policy?.oos_restart_required!==false)issues.push('policy');
            if(out.hard.length)issues.push('hard '+JSON.stringify(out.hard));
            if(out.js.length)issues.push('js '+JSON.stringify(out.js));
            if(issues.length){console.error(issues);process.exit(1);}
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node verify.js
