name: Price Refresh Promotion Runner V1

on:
  push:
    branches:
      - validation-price-refresh-promotion-runner-v1-2026-10-12
    paths:
      - '.github/workflows/price-refresh-promotion-runner-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build clean ECB Price candidate
        shell: bash
        run: |
          set -euo pipefail
          cp validation/price_refresh_apply_v1.py /tmp/price_refresh_apply_v1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --detach 25e88d725d597ece9a46a509e13d5110e2a1e286
          git switch -c candidate-price-refresh-v1-2026-10-12
          python /tmp/price_refresh_apply_v1.py
          test "$(git diff --name-only)" = "payload/part-15.txt"
          grep -q 'gmfq-price-ecb-20261012' payload/part-15.txt
          grep -q "as_of:'2026-10-12'" payload/part-15.txt
          grep -q 'USD:1.1181' payload/part-15.txt
          if grep -q 'gmfq-price-ecb-20260930' payload/part-15.txt; then exit 1; fi
          git add payload/part-15.txt
          git commit -m 'Refresh ECB G8 Price fixing to 2026-10-12'
          git push --force-with-lease origin candidate-price-refresh-v1-2026-10-12
          git rev-parse HEAD
