name: USD Macro Browser Audit

on:
  push:
    branches:
      - staging-usd-macro-2026-09-30
  workflow_dispatch:

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright package
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/gmfq-server.log 2>&1 &
          sleep 2
      - name: Verify USD BEA annual update runtime
        run: |
          cat > browser-audit.js <<'EOF'
          const { chromium }=require('playwright');
          const { execSync }=require('child_process');
          (async()=>{
            const chromePath=execSync('command -v google-chrome-stable || command -v google-chrome || command -v chromium').toString().trim();
            const browser=await chromium.launch({headless:true,executablePath:chromePath,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            const consoleErrors=[], pageErrors=[], httpErrors=[];
            page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('response',r=>{if(r.status()>=400) httpErrors.push({status:r.status(),url:r.url()})});
            const res=await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle',timeout:120000});
            if(!res?.ok()) throw new Error('HTTP load failed');
            await page.waitForFunction(()=>document.documentElement.getAttribute('data-usd-bea-audit')==='PASS',null,{timeout:120000});
            const x=await page.evaluate(()=>{
              const get=id=>(S.USD||[]).find(z=>z.id===id);
              const day=(REAL_CALENDAR||[]).find(d=>d.key==='2026-09-30');
              const adp=(day?.events||[]).find(e=>/ADP Employment Change/i.test(e.event));
              const pce=(day?.events||[]).find(e=>/Core PCE.*Personal Spending/i.test(e.event));
              return {
                audit:window.GMFQ_USD_BEA_ANNUAL_UPDATE_AUDIT||null,
                finalAudit:window.GMFQ_POST_GATE_FINAL_AUDIT||null,
                macro:D.macro.USD||null,
                canonical:window.CANONICAL_LAYER_STATE?.USD?.macro||null,
                consistency:typeof canonicalConsistencyQa==='function'?canonicalConsistencyQa():null,
                viewQa:typeof canonicalViewQa==='function'?canonicalViewQa():null,
                pairCount:D.pairs?.length||0,
                series:{
                  pce:get('US_PCEPI_history_value'),
                  core:get('US_PCEPILFE_history_value'),
                  realpce:get('US_PCEC96_history_value'),
                  realdpi:get('US_DSPIC96_history_DSPIC96'),
                  pi:get('US_PI_history_PI'),
                  save:get('US_PSAVERT_history_PSAVERT'),
                  payroll:get('US_PAYEMS_history_value')
                },
                adp,pce,
                freshness:window.AUXILIARY_FEED_FRESHNESS||null,
                news:(window.__GMFQ_DATA?.NEWS_PULSE_STRUCT||[]).filter(z=>z.ccy==='USD').slice(0,8)
              };
            });
            console.log(JSON.stringify({x,consoleErrors,pageErrors,httpErrors},null,2));
            const near=(a,b)=>Math.abs(Number(a)-Number(b))<1e-8;
            if(x.audit?.status!=='PASS') throw new Error('USD BEA audit not PASS');
            const expected={
              pce:131.579,core:130.455,realpce:16955.3,realdpi:18410.5,pi:27626.9,save:4.1
            };
            for(const [k,v] of Object.entries(expected)){
              const s=x.series[k];
              if(s?.last_date!=='2026-08-01'||!near(s?.last_value,v)) throw new Error(k+' latest mismatch '+JSON.stringify({date:s?.last_date,value:s?.last_value}));
            }
            if(x.series.payroll?.last_date!=='2026-08-01'||!near(x.series.payroll?.last_value,159075)) throw new Error('Payroll was improperly altered by ADP');
            if(x.adp?.status!=='done'||x.adp?.actual!=='90K') throw new Error('ADP calendar not completed');
            if(x.pce?.status!=='done'||x.pce?.actual!=='0,2% / 0,9%') throw new Error('PCE calendar not completed');
            if(x.pairCount!==28) throw new Error('Pair count '+x.pairCount);
            if(x.consistency?.ok!==true) throw new Error('Canonical consistency fail '+JSON.stringify(x.consistency));
            if(x.viewQa?.ok!==true) throw new Error('Canonical view fail '+JSON.stringify(x.viewQa));
            if(x.finalAudit?.status!=='PASS') throw new Error('Final audit not PASS');
            if(x.freshness?.calendar?.status!=='LIVE_VALIDATED_US_RELEASES_COMPLETE') throw new Error('Calendar freshness stale');
            const nonBenignHttp=httpErrors.filter(e=>!String(e.url).endsWith('/favicon.ico'));
            const nonBenignConsole=consoleErrors.filter(e=>!String(e).includes('404'));
            if(nonBenignHttp.length||nonBenignConsole.length||pageErrors.length) throw new Error('Browser errors '+JSON.stringify({nonBenignHttp,nonBenignConsole,pageErrors}));
            await page.screenshot({path:'usd-macro-browser-audit.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node browser-audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usd-macro-browser-audit
          path: |
            usd-macro-browser-audit.png
            /tmp/gmfq-server.log
