name: Editorial Freshness Guard V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'payload/**'
      - 'dashboard/editorial-freshness-guard-v1.js'
      - 'dashboard/calendar-news-operational-v1.js'
      - 'dashboard/top-themes-operational-v1.js'
      - 'dashboard/what-changed-operational-v1.js'
      - 'dashboard/risk-operational-v1.js'
      - 'live_data/sections/CALENDAR_OPERATIONAL_VIEW.json'
      - 'live_data/sections/NEWS_PULSE_OPERATIONAL.json'
      - 'live_data/sections/D.json'
      - 'live_data/sections/ESTIMATED_RESIDUAL_GAPS.json'
      - '.github/workflows/editorial-freshness-guard-v1.yml'
      - '.github/workflows/publish-dashboard-pages-v1.yml'
  push:
    branches:
      - 'fix-editorial-freshness-*'
      - main
    paths:
      - 'index.html'
      - 'payload/**'
      - 'dashboard/editorial-freshness-guard-v1.js'
      - 'dashboard/calendar-news-operational-v1.js'
      - 'dashboard/top-themes-operational-v1.js'
      - 'dashboard/what-changed-operational-v1.js'
      - 'dashboard/risk-operational-v1.js'
      - 'live_data/sections/CALENDAR_OPERATIONAL_VIEW.json'
      - 'live_data/sections/NEWS_PULSE_OPERATIONAL.json'
      - 'live_data/sections/D.json'
      - 'live_data/sections/ESTIMATED_RESIDUAL_GAPS.json'
      - '.github/workflows/editorial-freshness-guard-v1.yml'
      - '.github/workflows/publish-dashboard-pages-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start local dashboard server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/editorial-freshness-server.log 2>&1 &
          echo $! > /tmp/editorial-freshness-server.pid
          sleep 2
      - name: Verify fail-closed editorial freshness state
        run: |
          mkdir -p editorial-freshness-evidence
          cat > editorial-freshness-audit.js <<'EOF'
          const { chromium }=require('playwright');
          const fs=require('fs');
          const IDS=['overview','wow','themes','calendar','news','risk'];
          const AUTH={
            wow:'NEWS_PULSE_OPERATIONAL.content_as_of',
            themes:'NEWS_PULSE_OPERATIONAL.content_as_of',
            calendar:'CALENDAR_OPERATIONAL_VIEW.generated_at_utc',
            news:'NEWS_PULSE_OPERATIONAL.content_as_of',
            risk:'OLDEST_REQUIRED(D.risk.VIX.last_date,D.risk.WTI.last_date,ESTIMATED_RESIDUAL_GAPS.BRENT.proxy_as_of)'
          };
          async function run(viewport,label){
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport});
            const errors=[];
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            page.on('pageerror',e=>errors.push(String(e)));
            const response=await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:120000});
            if(!response||!response.ok())throw new Error(label+' HTTP load failed');
            await page.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.settled_after_cad_chain===true,null,{timeout:120000});
            await page.waitForFunction(()=>window.GMFQ_EDITORIAL_FRESHNESS?.operational_loaded===true,null,{timeout:30000});
            await page.waitForFunction(()=>window.GMFQ_CALENDAR_NEWS_OPERATIONAL?.status==='ACTIVE',null,{timeout:30000});
            await page.waitForFunction(()=>window.GMFQ_TOP_THEMES_OPERATIONAL?.status==='ACTIVE',null,{timeout:30000});
            await page.waitForFunction(()=>window.GMFQ_WHAT_CHANGED_OPERATIONAL?.status==='ACTIVE',null,{timeout:30000});
            await page.waitForFunction(()=>window.GMFQ_RISK_OPERATIONAL?.status==='ACTIVE',null,{timeout:30000});
            const vixCard=await page.evaluate(()=>{
              const el=document.querySelector('#risk [data-risk="VIX"]');
              const source=window.GMFQ_RISK_OPERATIONAL||{};
              return {state:el?.dataset.freshness,label:el?.querySelector('.rkBadge')?.textContent,
                asof:el?.querySelector('.rkAs')?.textContent,meta:source.vix_freshness};
            });
            if(!vixCard.asof||!['FRESH','STALE','UNVERIFIED'].includes(vixCard.state)||
               vixCard.state!==vixCard.meta||
               (vixCard.state==='STALE'&&!vixCard.label?.includes('non corrente'))||
               (vixCard.state==='UNVERIFIED'&&!vixCard.label?.includes('WITHHELD')))
              throw new Error(label+' VIX per-card freshness mismatch '+JSON.stringify(vixCard));
            const audit=await page.evaluate(()=>window.gmfqEditorialFreshnessAudit?.());
            if(!audit||audit.schema!=='GMFQ_EDITORIAL_FRESHNESS_GUARD_V3_OPERATIONAL_AUTHORITY')throw new Error(label+' freshness schema '+audit?.schema);
            if(audit.legacy_authority!=='NONE')throw new Error(label+' legacy freshness authority '+audit.legacy_authority);
            if(!['PASS_FAIL_CLOSED_STALE','PASS_FRESH','PASS_WITH_UNVERIFIED'].includes(audit.status))throw new Error(label+' freshness status '+audit.status);
            for(const [id,authority] of Object.entries(AUTH)){
              if(audit.sections?.[id]?.authority!==authority)throw new Error(label+' '+id+' authority drift '+JSON.stringify(audit.sections?.[id]));
            }
            // Risk freshness must be determined by the OLDEST complete lane,
            // never a newer Brent quote masking a stale VIX or WTI.
            const laneAudit=audit.sections?.risk;
            const dates=laneAudit?.risk_as_of_by_lane||{};
            const allRiskLanes=['VIX','WTI','BRENT'];
            if(allRiskLanes.some(c=>!(c in dates)))throw new Error(label+' missing risk source metadata '+JSON.stringify(laneAudit));
            const missing=allRiskLanes.filter(c=>!/^20\d{2}-\d{2}-\d{2}$/.test(dates[c]||''));
            if(missing.length){
              if(laneAudit.status!=='UNVERIFIED'||JSON.stringify(laneAudit.missing_risk_lanes)!==JSON.stringify(missing))
                throw new Error(label+' incomplete risk lanes not fail-closed '+JSON.stringify(laneAudit));
            }else{
              const oldest=allRiskLanes.map(c=>({lane:c,date:dates[c]})).sort((a,b)=>a.date.localeCompare(b.date))[0];
              if(laneAudit.reference_date!==oldest.date||laneAudit.oldest_lane!==oldest.lane)
                throw new Error(label+' risk stale older lane masked '+JSON.stringify({oldest,laneAudit}));
            }
            for(const id of IDS){
              const s=audit.sections?.[id];
              if(!s)throw new Error(label+' missing section state '+id);
              if(!['FRESH','STALE','UNVERIFIED'].includes(s.status))throw new Error(label+' invalid freshness '+id+': '+JSON.stringify(s));
              await page.evaluate(v=>window.showView?.(v),id);
              await page.waitForTimeout(150);
              const r=await page.evaluate(id=>{
                const el=document.getElementById(id);const banner=el?.querySelector(':scope > .gmfqEditorialFreshnessBanner');
                const box=banner?.getBoundingClientRect();
                return {status:el?.dataset?.gmfqEditorialFreshness||null,authority:el?.dataset?.gmfqFreshnessAuthority||null,banner:!!banner,bannerText:banner?.innerText||'',visible:!!banner&&box.width>0&&box.height>0,operational:!!el?.querySelector('[data-gmfq-operational]')};
              },id);
              if(['wow','themes','calendar','news','risk'].includes(id)&&!r.operational)throw new Error(label+' missing operational owner '+id);
              if(AUTH[id]&&r.authority!==AUTH[id])throw new Error(label+' '+id+' DOM authority '+JSON.stringify(r));
              if(r.status==='STALE'&&(!r.banner||!r.visible||!r.bannerText.includes('FRESHNESS FAIL-CLOSED')))throw new Error(label+' stale section not visibly fail-closed '+id+': '+JSON.stringify(r));
              if(r.status==='UNVERIFIED'&&(!r.banner||!r.visible||!r.bannerText.includes('FRESHNESS OPERATIVA NON VERIFICABILE')))throw new Error(label+' unverified section not visibly labelled '+id+': '+JSON.stringify(r));
              if(r.status==='FRESH'&&r.banner)throw new Error(label+' fresh section should not show freshness banner '+id);
              await page.locator('#'+id).screenshot({path:`editorial-freshness-evidence/${label}-${id}.png`});
            }
            if(errors.length)throw new Error(label+' console/page errors: '+errors.join(' | '));
            // Regression: a dated but missing VIX value must not be displayed as
            // 0.00 or considered FRESH by the overall Risk freshness guard.
            const damaged=await browser.newPage({viewport});
            await damaged.route('**/live_data/sections/D.json',async route=>{
              const response=await route.fetch();
              const body=await response.json();
              body.risk.VIX.last_value=null;
              await route.fulfill({response,contentType:'application/json',body:JSON.stringify(body)});
            });
            await damaged.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:120000});
            await damaged.waitForFunction(()=>window.GMFQ_RISK_OPERATIONAL?.status==='ACTIVE'&&
              window.GMFQ_EDITORIAL_FRESHNESS?.operational_loaded===true,null,{timeout:120000});
            const negative=await damaged.evaluate(()=>{
              const card=document.querySelector('#risk [data-risk="VIX"]');
              const audit=window.gmfqEditorialFreshnessAudit?.().sections?.risk;
              return {state:card?.dataset.freshness,value:card?.querySelector('.rkValue')?.textContent,
                badge:card?.querySelector('.rkBadge')?.textContent,aggregate:audit?.status,
                missing:audit?.missing_risk_lanes};
            });
            if(negative.state!=='UNVERIFIED'||negative.value!=='—'||
              !negative.badge?.includes('WITHHELD')||negative.aggregate!=='UNVERIFIED'||
              !negative.missing?.includes('VIX'))
              throw Error(label+' invalid VIX failed to close '+JSON.stringify(negative));
            await damaged.close();
            fs.writeFileSync(`editorial-freshness-evidence/${label}.json`,JSON.stringify(audit,null,2));
            console.log(label,JSON.stringify(audit,null,2));
            await browser.close();
          }
          (async()=>{await run({width:1440,height:1100},'desktop');await run({width:390,height:844},'mobile');})().catch(e=>{console.error('::error title=Editorial freshness guard::'+String(e.message||e));process.exit(1)});
          EOF
          node editorial-freshness-audit.js
      - name: Upload freshness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-freshness-guard-v1
          path: |
            editorial-freshness-evidence/**
            /tmp/editorial-freshness-server.log
