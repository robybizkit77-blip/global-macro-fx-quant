name: JPY Growth GDP ITA PIT V1
on:
  push:
    paths:
      - 'validation/materialize_jpy_growth_gdp_ita_pit_v1.py'
      - '.github/workflows/jpy-growth-gdp-ita-pit-v1.yml'
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-minimum-robust-pit-dataset-2026-10-06
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pypdf beautifulsoup4
      - name: Materialize JPY GDP plus ITA PIT
        run: python validation/materialize_jpy_growth_gdp_ita_pit_v1.py
      - name: Strict engine/live-data guard
        run: git diff --exit-code -- engine live_data
      - name: Commit evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add history/pit_v1/JPY_GROWTH_ITA_FIRST_RELEASE_2018_2023.csv history/pit_v1/JPY_GROWTH_GDP_FIRST_PRELIM_2018_2023.csv validation/JPY_GROWTH_GDP_ITA_PIT_ACTIVATION_V1_2026-10-06.json
          git diff --cached --quiet || git commit -m 'Activate JPY Growth GDP ITA PIT dataset'
          git pull --rebase origin audit-minimum-robust-pit-dataset-2026-10-06
          git push origin HEAD:audit-minimum-robust-pit-dataset-2026-10-06
