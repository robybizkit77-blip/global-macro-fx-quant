name: Dashboard UI Ownership V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'payload/**'
      - 'dashboard/**'
      - 'validation/ui/**'
      - '.github/workflows/dashboard-ui-ownership-v1.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'payload/**'
      - 'dashboard/**'
      - 'validation/ui/**'
      - '.github/workflows/dashboard-ui-ownership-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static ownership contract
        run: python validation/ui/check_dashboard_ui_ownership_v1.py
      - name: Audit Calendar News legacy dependencies
        run: python validation/ui/audit_calendar_news_legacy_dependencies_v1.py | tee /tmp/calendar-news-legacy-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-news-legacy-dependency-audit
          path: /tmp/calendar-news-legacy-audit.json
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start dashboard
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/ui-owner-server.log 2>&1 &
          sleep 2
      - name: Verify visible ownership desktop/mobile
        run: |
          cat > ui-owner.js <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const registry = JSON.parse(fs.readFileSync('validation/ui/DASHBOARD_UI_OWNERSHIP_REGISTRY_V1_2026-10-15.json','utf8'));
          const VIEWS=Object.keys(registry.views);
          async function run(viewport,label){
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport});
            const errs=[]; page.on('console',m=>{if(m.type()==='error')errs.push(m.text())});
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>window.GMFQ_POST_GATE_FINAL_AUDIT?.settled_after_cad_chain===true,null,{timeout:120000});
            await page.waitForFunction(()=>window.GMFQ_EDITORIAL_FRESHNESS?.operational_loaded===true,null,{timeout:120000});
            await page.waitForFunction(()=>window.GMFQ_TOP_THEMES_OPERATIONAL?.status==='ACTIVE',null,{timeout:120000});
            await page.waitForTimeout(700);
            for(const view of VIEWS){
              await page.evaluate(v=>window.showView?.(v),view);
              await page.waitForTimeout(view==='ratesdesk'?500:250);
              const spec=registry.views[view];
              const result=await page.evaluate(({view,spec})=>{
                const el=document.getElementById(view);
                const active=[...document.querySelectorAll('.view.active,[data-view].active')].map(x=>x.id).filter(Boolean);
                const text=(el?.innerText||'').replace(/\s+/g,' ').trim();
                const out={exists:!!el,active,textLength:text.length,required:null,mounts:[]};
                if(spec.required_selector) out.required=el?.querySelectorAll(spec.required_selector).length||0;
                for(const m of (spec.dynamic_mounts||[])) out.mounts.push({selector:m.selector,count:el?.querySelectorAll(m.selector).length||0,expected:m.count});
                return out;
              },{view,spec});
              if(!result.exists) throw new Error(`${label} ${view}: missing view`);
              if(result.active.length!==1||result.active[0]!==view) throw new Error(`${label} ${view}: active owner drift ${JSON.stringify(result.active)}`);
              if(result.textLength<20) throw new Error(`${label} ${view}: empty owner`);
              if(spec.required_selector && result.required!==1) throw new Error(`${label} ${view}: required owner selector count ${result.required}`);
              for(const m of result.mounts) if(m.count!==m.expected) throw new Error(`${label} ${view}: mount ${m.selector} count ${m.count}/${m.expected}`);
            }
            const themes=await page.evaluate(()=>({state:window.GMFQ_TOP_THEMES_OPERATIONAL,cards:[...document.querySelectorAll('#themes .ttCard')].map(x=>x.dataset.ccy),top:[...document.querySelectorAll('#themes .ttCard[data-tier="top"]')].map(x=>x.dataset.ccy),owner:document.querySelectorAll('#themes [data-gmfq-operational="themes"]').length}));
            if(themes.state?.schema!=='GMFQ_TOP_THEMES_OPERATIONAL_UI_V1') throw new Error(`${label}: themes schema ${themes.state?.schema}`);
            if(themes.state?.core_effect!=='NONE') throw new Error(`${label}: themes core effect ${themes.state?.core_effect}`);
            if(themes.owner!==1) throw new Error(`${label}: themes owner count ${themes.owner}`);
            if(themes.cards.length!==8||new Set(themes.cards).size!==8) throw new Error(`${label}: themes G8 coverage ${JSON.stringify(themes.cards)}`);
            if(themes.top.length!==4) throw new Error(`${label}: top theme count ${themes.top.length}`);
            const freshness=await page.evaluate(()=>window.gmfqEditorialFreshnessAudit?.());
            if(!freshness) throw new Error(`${label}: freshness audit missing`);
            if(freshness.schema!=='GMFQ_EDITORIAL_FRESHNESS_GUARD_V2_OPERATIONAL_AUTHORITY') throw new Error(`${label}: freshness schema ${freshness.schema}`);
            if(freshness.legacy_authority!=='NONE') throw new Error(`${label}: legacy freshness authority ${freshness.legacy_authority}`);
            if(freshness.sections?.calendar?.authority!=='CALENDAR_OPERATIONAL_VIEW.generated_at_utc') throw new Error(`${label}: calendar freshness authority drift`);
            if(freshness.sections?.news?.authority!=='NEWS_PULSE_OPERATIONAL.content_as_of') throw new Error(`${label}: news freshness authority drift`);
            if(freshness.sections?.calendar?.status!=='FRESH') throw new Error(`${label}: calendar freshness ${JSON.stringify(freshness.sections?.calendar)}`);
            if(freshness.sections?.news?.status!=='FRESH') throw new Error(`${label}: news freshness ${JSON.stringify(freshness.sections?.news)}`);
            if(errs.length) throw new Error(`${label}: console errors ${errs.join(' | ')}`);
            await browser.close();
            console.log(label,'OWNERSHIP_PASS','TOP_THEMES_OPERATIONAL_PASS','FRESHNESS_OPERATIONAL_AUTHORITY_PASS');
          }
          (async()=>{await run({width:1440,height:1100},'desktop');await run({width:390,height:844},'mobile');console.log('DASHBOARD_UI_OWNERSHIP_V1 PASS');})().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node ui-owner.js
