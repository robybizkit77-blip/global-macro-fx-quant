name: CAD MX CORRA Refresh Readiness
on:
  push:
    branches:
      - validation-cad-corra-refresh-readiness-2026-10-08
      - release-candidate-cad-cb-pricing-refresh-2026-10-08
      - release-candidate-cad-daily-ready-2026-10-08
    paths:
      - 'validation/cb_pricing/collect_cad_mx_corra.py'
      - 'validation/cb_pricing/build_cad_mx_corra_candidate.py'
      - 'validation/cb_pricing/apply_cad_mx_corra_candidate.py'
      - 'validation/cb_pricing/ACTIVE_REFRESH_READINESS_2026-10-08.json'
      - '.github/workflows/cad-mx-corra-refresh-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install collector dependencies
        run: python3 -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Regression check against certified 2026-09-29 MX observation
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/cb_pricing/collect_cad_mx_corra.py --as-of 2026-09-29 --output /tmp/cad-benchmark.json
          python3 validation/cb_pricing/build_cad_mx_corra_candidate.py --snapshot /tmp/cad-benchmark.json --output /tmp/cad-benchmark-candidate.json
          python3 - <<'PY'
          import json,pathlib
          s=json.loads(pathlib.Path('/tmp/cad-benchmark.json').read_text()); c=json.loads(pathlib.Path('/tmp/cad-benchmark-candidate.json').read_text())
          exp={'current':{'date':'2026-09-29','3m':2.75,'6m':3.105,'12m':3.515},'t_minus_1':{'date':'2026-09-28','3m':2.755,'6m':3.115,'12m':3.52},'weekly_reference':{'date':'2026-09-22','3m':2.74,'6m':3.065,'12m':3.41}}
          ids={'current':6192,'t_minus_1':6191,'weekly_reference':6187}
          for b,w in exp.items():
            g=s['observations'][b]
            if g['date']!=w['date'] or g['market_review_id']!=ids[b]: raise SystemExit(f'{b} identity mismatch {g}')
            for k in ('3m','6m','12m'):
              if abs(float(g[k])-w[k])>1e-9: raise SystemExit(f'{b} {k} mismatch {g[k]}')
          if s['contract_mapping']!={'3m':'DE 26','6m':'MR 27','12m':'SE 27'}: raise SystemExit('contract mapping mismatch')
          got=[c['horizons'][k]['change_1d_bp'] for k in ('3m','6m','12m')]
          if got!=[-0.5,-1.0,-0.5]: raise SystemExit(f'1D mismatch {got}')
          got=[c['horizons'][k]['change_1w_bp'] for k in ('3m','6m','12m')]
          if got!=[1.0,4.0,10.5]: raise SystemExit(f'1W mismatch {got}')
          print('CAD_MX_CERTIFIED_REGRESSION_PASS')
          PY
      - name: Build latest official source snapshot and candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/cb_pricing/collect_cad_mx_corra.py --output /tmp/cad-latest.json
          python3 validation/cb_pricing/build_cad_mx_corra_candidate.py --snapshot /tmp/cad-latest.json --output /tmp/cad-latest-candidate.json
      - name: Deterministic CAD-only dry-run apply
        shell: bash
        run: |
          set -euo pipefail
          cp live_data/sections/OIS_DATA.json /tmp/OIS.before.json
          cp live_data/sections/NATIVE_CB_DATA.json /tmp/NATIVE.before.json
          cp payload/part-00.txt /tmp/part-00.before.txt
          cp live_data/manifest.v2.json /tmp/manifest.before.json
          python3 validation/cb_pricing/apply_cad_mx_corra_candidate.py --candidate /tmp/cad-latest-candidate.json
          python3 validation/build_live_manifest_v2.py --write live_data/manifest.v2.json >/tmp/manifest-build.json
          python3 validation/check_cb_pricing_source_registry.py >/tmp/source-registry-check.json
          python3 validation/check_live_update_contract.py >/tmp/live-contract-check.json
          python3 validation/rebuild_live_data_runtime.py --verify-only >/tmp/runtime-roundtrip.json
          python3 - <<'PY'
          import json,pathlib,subprocess
          bo=json.loads(pathlib.Path('/tmp/OIS.before.json').read_text()); ao=json.loads(pathlib.Path('live_data/sections/OIS_DATA.json').read_text())
          bn=json.loads(pathlib.Path('/tmp/NATIVE.before.json').read_text()); an=json.loads(pathlib.Path('live_data/sections/NATIVE_CB_DATA.json').read_text())
          co=[k for k in bo['currencies'] if bo['currencies'][k]!=ao['currencies'][k]]; cn=[k for k in bn if bn[k]!=an[k]]
          if co!=['CAD'] or cn!=['CAD']: raise SystemExit(f'bad semantic scope {co} {cn}')
          changed=sorted(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()); expected=sorted(['live_data/manifest.v2.json','live_data/sections/NATIVE_CB_DATA.json','live_data/sections/OIS_DATA.json','payload/part-00.txt'])
          if changed!=expected: raise SystemExit(f'bad file scope {changed}')
          c=json.loads(pathlib.Path('/tmp/cad-latest-candidate.json').read_text())
          if ao['currencies']['CAD']['as_of']!=c['as_of'] or ao['currencies']['CAD']['source_meta'].get('contract_mapping')!=c['contract_mapping']: raise SystemExit('CAD applied candidate mismatch')
          print('CAD_DRY_RUN_PASS',c['as_of'])
          PY
      - name: Prove second refresh can read structured contract mapping
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/cb_pricing/collect_cad_mx_corra.py --as-of 2026-09-29 --output /tmp/cad-second-pass.json
          python3 - <<'PY'
          import json,pathlib
          s=json.loads(pathlib.Path('/tmp/cad-second-pass.json').read_text())
          if s['contract_mapping']!={'3m':'DE 26','6m':'MR 27','12m':'SE 27'}: raise SystemExit('second-pass mapping failed')
          print('CAD_SECOND_REFRESH_MAPPING_PASS')
          PY
      - name: Restore checkout and prove no publication
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- live_data/manifest.v2.json live_data/sections/OIS_DATA.json live_data/sections/NATIVE_CB_DATA.json payload/part-00.txt || true
          if ! git diff --quiet; then git status --short; exit 1; fi
          echo CAD_DRY_RUN_RESTORED_NO_PUBLICATION
      - name: Upload CAD readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: cad-mx-corra-refresh-readiness
          path: |
            /tmp/cad-benchmark.json
            /tmp/cad-benchmark-candidate.json
            /tmp/cad-latest.json
            /tmp/cad-latest-candidate.json
            /tmp/cad-second-pass.json
            /tmp/manifest-build.json
            /tmp/source-registry-check.json
            /tmp/live-contract-check.json
            /tmp/runtime-roundtrip.json
          if-no-files-found: error
          retention-days: 30
