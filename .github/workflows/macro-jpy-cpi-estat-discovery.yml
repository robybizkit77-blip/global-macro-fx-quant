name: JPY CPI e-Stat Discovery

on:
  push:
    branches:
      - validation-macro-g8-source-consolidation-2026-10-08
    paths:
      - '.github/workflows/macro-jpy-cpi-estat-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E_STAT_APP_ID: ${{ secrets.E_STAT_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official CPI 2025-base e-Stat table metadata
        run: |
          python - <<'PY'
          import json, os, re, urllib.parse, urllib.request
          app=os.environ.get('E_STAT_APP_ID','').strip()
          assert app, 'E_STAT_APP_ID missing'
          stats_id='0004052037'
          params=urllib.parse.urlencode({'appId':app,'statsDataId':stats_id,'metaGetFlg':'Y','cntGetFlg':'N','lang':'E','limit':100000})
          req=urllib.request.Request('https://api.e-stat.go.jp/rest/3.0/app/json/getStatsData?'+params,headers={'User-Agent':'global-macro-fx-quant/1.0'})
          with urllib.request.urlopen(req,timeout=45) as r: payload=json.load(r)
          root=payload['GET_STATS_DATA']; result=root.get('RESULT',{})
          assert str(result.get('STATUS','0')) in ('0','000'), result
          stat=root['STATISTICAL_DATA']
          objs=stat.get('CLASS_INF',{}).get('CLASS_OBJ',[])
          if isinstance(objs,dict): objs=[objs]
          maps={}
          meta=[]
          for obj in objs:
              dim=str(obj.get('@id','')); classes=obj.get('CLASS',[])
              if isinstance(classes,dict): classes=[classes]
              maps[dim]={str(x.get('@code','')):str(x.get('@name','')) for x in classes}
              meta.append({'id':dim,'name':obj.get('@name'),'sample':list(maps[dim].items())[:12],'count':len(maps[dim])})
          vals=stat.get('DATA_INF',{}).get('VALUE',[])
          if isinstance(vals,dict): vals=[vals]
          def label(v):
              parts=[]
              for k,code in v.items():
                  if k.startswith('@'):
                      lab=maps.get(k[1:],{}).get(str(code))
                      if lab: parts.append(f'{k[1:]}={lab}')
              return ' | '.join(parts)
          scored=[]
          for v in vals:
              lab=label(v); low=lab.lower()
              score=0
              if 'change over the year' in low: score+=100
              if re.search(r'(^|[ =|])all items($|[ |])',low): score+=80
              if 'japan' in low: score+=30
              if 'ku-area' in low or 'tokyo' in low: score-=80
              if score>=180 and str(v.get('$','')).strip() not in ('','-','***','…','...'):
                  scored.append({'score':score,'raw':v.get('$'),'attrs':{k:x for k,x in v.items() if k.startswith('@')},'label':lab})
          # Keep recent rows only, sorted by time code when present.
          scored.sort(key=lambda x:str(x['attrs'].get('@time','')))
          out={'status':'PASS','stats_data_id':stats_id,'table_title':stat.get('TABLE_INF',{}).get('TITLE'),'dimensions':meta,'semantic_matches_count':len(scored),'semantic_matches_tail':scored[-24:]}
          print(json.dumps(out,ensure_ascii=False,indent=2))
          open('/tmp/jpy-cpi-estat-discovery.json','w').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jpy-cpi-estat-discovery
          retention-days: 14
          path: /tmp/jpy-cpi-estat-discovery.json
