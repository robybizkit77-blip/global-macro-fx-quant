name: AUD ASX IB Refresh Readiness
on:
  push:
    branches:
      - validation-aud-asx-refresh-readiness-2026-10-08
      - release-candidate-aud-cb-pricing-refresh-2026-10-08
      - release-candidate-aud-daily-ready-2026-10-08
    paths:
      - 'validation/cb_pricing/collect_aud_asx_ib.py'
      - 'validation/cb_pricing/build_aud_asx_ib_candidate.py'
      - 'validation/cb_pricing/apply_aud_asx_ib_candidate.py'
      - 'validation/cb_pricing/ACTIVE_REFRESH_READINESS_2026-10-08.json'
      - '.github/workflows/aud-asx-ib-refresh-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install collector dependencies
        run: python3 -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Regression check against exact official 2026-09-30 ASX observation
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/cb_pricing/collect_aud_asx_ib.py --as-of 2026-09-30 --output /tmp/aud-benchmark.json
          python3 validation/cb_pricing/build_aud_asx_ib_candidate.py --snapshot /tmp/aud-benchmark.json --output /tmp/aud-benchmark-candidate.json
          python3 - <<'PY'
          import json,pathlib
          s=json.loads(pathlib.Path('/tmp/aud-benchmark.json').read_text()); c=json.loads(pathlib.Path('/tmp/aud-benchmark-candidate.json').read_text())
          exp={'current':{'date':'2026-09-30','3m':4.685,'6m':4.81,'12m':4.91},'t_minus_1':{'date':'2026-09-29','3m':4.74,'6m':4.855,'12m':4.96},'weekly_reference':{'date':'2026-09-23','3m':4.725,'6m':4.84,'12m':4.935}}
          for b,w in exp.items():
            g=s['observations'][b]
            if g['date']!=w['date']: raise SystemExit(f'{b} date mismatch {g}')
            for k in ('3m','6m','12m'):
              if abs(float(g[k])-w[k])>1e-9: raise SystemExit(f'{b} {k} mismatch {g[k]}')
          if s['contract_mapping']!={'3m':'Dec 2026','6m':'Mar 2027','12m':'Sep 2027'}: raise SystemExit('contract mapping mismatch')
          got=[c['horizons'][k]['change_1d_bp'] for k in ('3m','6m','12m')]
          if got!=[-5.5,-4.5,-5.0]: raise SystemExit(f'1D mismatch {got}')
          got=[c['horizons'][k]['change_1w_bp'] for k in ('3m','6m','12m')]
          if got!=[-4.0,-3.0,-2.5]: raise SystemExit(f'1W mismatch {got}')
          if s['validation']['weekly_reference_rule']!='fifth prior complete official ASX SFN trading session (T-5); no calendar approximation': raise SystemExit('weekly rule mismatch')
          print('AUD_ASX_EXACT_T5_REGRESSION_PASS')
          PY
      - name: Build latest official source snapshot and candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/cb_pricing/collect_aud_asx_ib.py --output /tmp/aud-latest.json
          python3 validation/cb_pricing/build_aud_asx_ib_candidate.py --snapshot /tmp/aud-latest.json --output /tmp/aud-latest-candidate.json
      - name: Deterministic AUD-only dry-run apply
        shell: bash
        run: |
          set -euo pipefail
          cp live_data/sections/OIS_DATA.json /tmp/OIS.before.json
          cp live_data/sections/NATIVE_CB_DATA.json /tmp/NATIVE.before.json
          cp payload/part-00.txt /tmp/part-00.before.txt
          cp live_data/manifest.v2.json /tmp/manifest.before.json
          python3 validation/cb_pricing/apply_aud_asx_ib_candidate.py --candidate /tmp/aud-latest-candidate.json
          python3 validation/build_live_manifest_v2.py --write live_data/manifest.v2.json >/tmp/manifest-build.json
          python3 validation/check_cb_pricing_source_registry.py >/tmp/source-registry-check.json
          python3 validation/check_live_update_contract.py >/tmp/live-contract-check.json
          python3 validation/rebuild_live_data_runtime.py --verify-only >/tmp/runtime-roundtrip.json
          python3 - <<'PY'
          import json,pathlib,subprocess
          bo=json.loads(pathlib.Path('/tmp/OIS.before.json').read_text()); ao=json.loads(pathlib.Path('live_data/sections/OIS_DATA.json').read_text())
          bn=json.loads(pathlib.Path('/tmp/NATIVE.before.json').read_text()); an=json.loads(pathlib.Path('live_data/sections/NATIVE_CB_DATA.json').read_text())
          co=[k for k in bo['currencies'] if bo['currencies'][k]!=ao['currencies'][k]]; cn=[k for k in bn if bn[k]!=an[k]]
          if co!=['AUD'] or cn!=['AUD']: raise SystemExit(f'bad semantic scope {co} {cn}')
          changed=sorted(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()); expected=sorted(['live_data/manifest.v2.json','live_data/sections/NATIVE_CB_DATA.json','live_data/sections/OIS_DATA.json','payload/part-00.txt'])
          if changed!=expected: raise SystemExit(f'bad file scope {changed}')
          c=json.loads(pathlib.Path('/tmp/aud-latest-candidate.json').read_text())
          if ao['currencies']['AUD']['as_of']!=c['as_of'] or ao['currencies']['AUD']['source_meta'].get('contract_mapping')!=c['contract_mapping']: raise SystemExit('AUD applied candidate mismatch')
          print('AUD_DRY_RUN_PASS',c['as_of'])
          PY
      - name: Prove second refresh can read canonical mapping
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/cb_pricing/collect_aud_asx_ib.py --as-of 2026-09-30 --output /tmp/aud-second-pass.json
          python3 - <<'PY'
          import json,pathlib
          s=json.loads(pathlib.Path('/tmp/aud-second-pass.json').read_text())
          if s['contract_mapping']!={'3m':'Dec 2026','6m':'Mar 2027','12m':'Sep 2027'}: raise SystemExit('second-pass mapping failed')
          if s['observations']['weekly_reference']['date']!='2026-09-23': raise SystemExit('second-pass T-5 failed')
          print('AUD_SECOND_REFRESH_MAPPING_PASS')
          PY
      - name: Restore checkout and prove no publication
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- live_data/manifest.v2.json live_data/sections/OIS_DATA.json live_data/sections/NATIVE_CB_DATA.json payload/part-00.txt || true
          if ! git diff --quiet; then git status --short; exit 1; fi
          echo AUD_DRY_RUN_RESTORED_NO_PUBLICATION
      - name: Upload AUD readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: aud-asx-ib-refresh-readiness
          path: |
            /tmp/aud-benchmark.json
            /tmp/aud-benchmark-candidate.json
            /tmp/aud-latest.json
            /tmp/aud-latest-candidate.json
            /tmp/aud-second-pass.json
            /tmp/manifest-build.json
            /tmp/source-registry-check.json
            /tmp/live-contract-check.json
            /tmp/runtime-roundtrip.json
          if-no-files-found: error
          retention-days: 30
