name: CAD MX Markup Probe Once
on:
  push:
    branches: [validation-cad-corra-refresh-readiness-2026-10-08]
    paths: ['.github/workflows/cad-mx-markup-probe-once.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact certified review and print CRA row markup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests
          u='https://www.m-x.ca/en/trading/data/market-review?id=6192'
          r=requests.get(u,headers={'User-Agent':'Mozilla/5.0 GMFQ validation'},timeout=30); r.raise_for_status()
          low=r.text.lower()
          for needle in ['de 26','mr 27','se 27']:
            i=low.find(needle)
            print('\n===== '+needle+' =====')
            print(r.text[max(0,i-700):i+1400] if i>=0 else 'NOT FOUND')
          PY
