name: StatCan Metadata Probe

on:
  push:
    branches:
      - engine-freeze-v1-2026-10-02
    paths:
      - 'validation/probe_statcan_metadata.py'
      - '.github/workflows/statcan-metadata-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engine-freeze-v1-2026-10-02
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch compact cube metadata
        run: python validation/probe_statcan_metadata.py
      - name: Commit metadata probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin engine-freeze-v1-2026-10-02
          git add validation/statcan_metadata/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Probe StatCan vintage cube metadata"
            git push origin HEAD:engine-freeze-v1-2026-10-02
          fi
