name: CHF Residual Proxy Refresh V1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - chf-residual-proxy-refresh-v1-2026-10-15
    paths:
      - validation/estimated/refresh_chf_residual_proxies_v1.py
      # Changes written by OTHER producers are not new observations for this source.
      # Scheduled/manual refresh continues independently; no self-trigger cascade.
      - .github/workflows/chf-residual-proxy-refresh-v1.yml
  schedule:
    - cron: '35 06 * * 1-5'

permissions:
  contents: write

# One shared file is written by four independent producers; never overlap their commits.
concurrency:
  group: residual-proxy-shared-writers-v1
  queue: max
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh CHF official residual proxies
        run: |
          set -euo pipefail
          python validation/estimated/refresh_chf_residual_proxies_v1.py

      - name: Validate governance and proxy semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('live_data/sections/ESTIMATED_RESIDUAL_GAPS.json').read_text())
          assert d['schema']=='GMFQ_ESTIMATED_RESIDUAL_GAPS_V1'
          assert d['official_lanes_untouched'] is True
          for key in ('CHF.credit','CHF.sight_deposits'):
              lane=d['lanes'][key]
              assert lane['status']=='ESTIMATED_ACTIVE_AUTO_REFRESH_OFFICIAL_PROXY'
              assert lane['proxy_value'] is not None and lane['proxy_value']>0
              assert lane['proxy_as_of']
              assert lane['official_canonical_untouched'] is True
              assert 'SNB official API' in lane['source']
              assert lane['timeseries_key']
          assert d['lanes']['CHF.credit']['confidence']=='B/C'
          assert d['lanes']['CHF.sight_deposits']['confidence']=='C'
          gov=d['governance']
          assert gov['core_score_effect']=='NONE'
          assert gov['bias_effect']=='NONE'
          assert gov['sizing_effect']=='NONE'
          assert gov['pair_engine_effect']=='NONE'
          assert gov['forward_logger_effect']=='NONE'
          assert gov['backtest_eligible_as_official'] is False
          print('CHF_RESIDUAL_PROXY_REFRESH_PASS',
                d['lanes']['CHF.credit']['proxy_as_of'], d['lanes']['CHF.credit']['proxy_value'],
                d['lanes']['CHF.sight_deposits']['proxy_as_of'], d['lanes']['CHF.sight_deposits']['proxy_value'])
          PY

      - name: Persist changed CHF proxies on main only
        if: github.ref_name == 'main'
        run: |
          set -euo pipefail
          changed="$(git diff --name-only -- live_data/sections/ESTIMATED_RESIDUAL_GAPS.json)"
          if [ -z "$changed" ]; then echo CHF_PROXY_NO_CHANGE; exit 0; fi
          unexpected="$(git diff --name-only | grep -Ev '^live_data/sections/ESTIMATED_RESIDUAL_GAPS.json$' || true)"
          test -z "$unexpected" || { echo "Unexpected changes: $unexpected" >&2; exit 1; }
          REMOTE_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          LOCAL_SHA="$(git rev-parse HEAD)"
          test "$REMOTE_SHA" = "$LOCAL_SHA" || { echo 'main moved during CHF proxy refresh' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live_data/sections/ESTIMATED_RESIDUAL_GAPS.json
          git commit -m 'Refresh CHF residual official proxies'
          git push origin HEAD:main
