name: CB Pricing Persistent Daily V1

on:
  push:
    branches:
      - main
      - cb-pricing-persistent-daily-v1-2026-10-14
    paths:
      - '.github/workflows/cb-pricing-persistent-daily-v1.yml'
      - 'validation/cb_pricing/run_active_cb_pricing_daily.sh'
      - 'validation/cb_pricing/apply_aud_asx_ib_candidate.py'
      - 'validation/cb_pricing/apply_cad_mx_corra_candidate.py'
      - 'validation/cb_pricing/apply_gbp_boe_ois_candidate.py'
      - 'validation/cb_pricing/apply_jpy_tfx_tona_candidate.py'
      - 'validation/cb_pricing/test_apply_jpy_tfx_tona_candidate.py'
      - 'validation/cb_pricing/cb_pricing_schedule_gate_v1.py'
      - 'validation/cb_pricing/test_cb_pricing_schedule_gate_v1.py'
      - 'validation/cb_pricing/check_cb_pricing_recovery_v1.py'
      - 'validation/cb_pricing/test_check_cb_pricing_recovery_v1.py'
  pull_request:
    paths:
      - '.github/workflows/cb-pricing-persistent-daily-v1.yml'
      - 'validation/cb_pricing/run_active_cb_pricing_daily.sh'
      - 'validation/cb_pricing/apply_aud_asx_ib_candidate.py'
      - 'validation/cb_pricing/apply_cad_mx_corra_candidate.py'
      - 'validation/cb_pricing/apply_gbp_boe_ois_candidate.py'
      - 'validation/cb_pricing/apply_jpy_tfx_tona_candidate.py'
      - 'validation/cb_pricing/test_apply_jpy_tfx_tona_candidate.py'
      - 'validation/cb_pricing/cb_pricing_schedule_gate_v1.py'
      - 'validation/cb_pricing/test_cb_pricing_schedule_gate_v1.py'
      - 'validation/cb_pricing/check_cb_pricing_recovery_v1.py'
      - 'validation/cb_pricing/test_check_cb_pricing_recovery_v1.py'
  workflow_run:
    # Independent existing hourly/rates and operational observation workflows
    # can recover dropped CB cron. The observation cadences are already active
    # (not newly scheduled), and the read-only gate prevents duplicate writes.
    workflows:
      - 'Hourly Certified Alert Readiness V1'
      - 'Rates Persistent Daily V1'
      - 'CB Pricing Daily Operational Observation'
      - 'Rates Daily Operational Observation'
    types: [completed]
  workflow_dispatch:
  schedule:
    # Europe/Rome retries: 06:13, 06:43, 07:13; off-hour to reduce cron load.
    # DST/CET duplicates are validated against the intended local slots.
    - cron: '13 4 * * 1-5'
    - cron: '13 5 * * 1-5'
    - cron: '43 4 * * 1-5'
    - cron: '43 5 * * 1-5'
    - cron: '13 6 * * 1-5'

permissions:
  contents: write
  actions: read

# Preserve pending morning writes/retries instead of replacing an older
# pending run when another workflow/event is triggered in the same group.
# Each attempt remains serialized; downstream source/lease checks still apply.
# PR validation never occupies the production writer/retry queue.
# All main, workflow_run, workflow_dispatch and schedule triggers retain
# the original shared production group and serialized writes.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('cb-pricing-validation-pr-{0}', github.event.pull_request.number) || 'cb-pricing-persistent-daily-v1' }}
  queue: max
  cancel-in-progress: false

jobs:
  persist-cb-pricing:
    # PR/dispatch/schedule unchanged; never let a non-main or failed parent recover.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Rome schedule gate (DST and GitHub cron delay tolerant)
        id: gate
        shell: bash
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_EVENT_SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GH_EVENT_NAME" == "workflow_run" ]]; then
            # Read-only API evidence: never blindly dispatch or retry POST requests.
            python3 validation/cb_pricing/check_cb_pricing_recovery_v1.py \
              --repo "$GITHUB_REPOSITORY" --current-run-id "$GITHUB_RUN_ID" \
              --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          else
            python3 validation/cb_pricing/cb_pricing_schedule_gate_v1.py \
              --event "$GH_EVENT_NAME" --cron "$GH_EVENT_SCHEDULE" \
              --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          fi

      - name: "Regression: JPY TONA OIS-only and native-only apply must remain isolated"
        run: python3 -m unittest validation.cb_pricing.test_apply_jpy_tfx_tona_candidate -v

      - name: Test Rome DST, duplicate UTC slots and delayed starts
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python3 validation/cb_pricing/test_cb_pricing_schedule_gate_v1.py
          python3 validation/cb_pricing/test_check_cb_pricing_recovery_v1.py

      - name: Install source parser dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: python3 -m pip install --disable-pip-version-check requests beautifulsoup4 pandas openpyxl

      - name: Run per-currency certified dry-run preflight
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CB_DAILY_WORKDIR=/tmp/cb-pricing-persistent bash validation/cb_pricing/run_active_cb_pricing_daily.sh
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/cb-pricing-persistent/DAILY_RECEIPT.json'))
          expected=['AUD','CAD','GBP','JPY']
          assert d['working_tree_clean'] is True,d
          assert sorted(d['currencies'])==expected,d
          assert d['per_currency_dry_run_required'] is True,d
          assert not d['promotion_performed'] and not d['live_data_published'],d
          eligible=[c for c in expected if d['currencies'][c]['status']=='GREEN']
          blocked=[c for c in expected if d['currencies'][c]['status']!='GREEN']
          assert eligible and d['eligible_currencies']==eligible,d
          assert d['blocked_currencies']==blocked,d
          assert all(d['currencies'][c]['status'] in ('FAILED','STALE') for c in blocked),d
          assert d['status']==('ALL_GREEN_NO_PUBLICATION' if not blocked else 'PARTIAL_GREEN_NO_PUBLICATION'),d
          assert d['all_or_nothing_gate'] is (not blocked),d
          for c in eligible:
              row=d['currencies'][c]
              assert row['candidate_status']=='READY_FOR_DRY_RUN' and row['isolated_dry_run']=='PASS',row
              assert row['isolated_semantic_scope']==[c],row
              assert row['business_day_lag'] in (0,1,2),row
              candidate=json.load(open('/tmp/cb-pricing-persistent/'+c+'.candidate.json'))
              assert candidate['currency']==c and candidate['as_of']==row['as_of'],candidate
              assert candidate['status']=='READY_FOR_DRY_RUN',candidate
          # Negative fixture against the exact eligibility predicate:
          # a failed CAD collector cannot be selected for application.
          from copy import deepcopy
          simulated=deepcopy(d['currencies'])
          simulated['CAD']['status']='FAILED'
          simulated_ok=[c for c in expected if simulated[c]['status']=='GREEN']
          assert 'CAD' not in simulated_ok
          assert set(simulated_ok)==set(eligible)-{'CAD'}
          simulated_all_failed=deepcopy(d['currencies'])
          for c in expected: simulated_all_failed[c]['status']='FAILED'
          assert not [c for c in expected if simulated_all_failed[c]['status']=='GREEN']
          print('CB_PRICING_FAILED_CAD_ISOLATION_FIXTURE_PASS',simulated_ok)
          print('CB_PRICING_CERTIFIED_LANES_PREFLIGHT_PASS',eligible,'BLOCKED',blocked)
          with open('/tmp/cb-pricing-persistent/eligible.json','w') as f: json.dump(eligible,f)

          PY
          git diff --exit-code -- live_data payload

      - name: Snapshot baseline
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          cp live_data/sections/OIS_DATA.json /tmp/cb-pricing-persistent/OIS.before.json
          cp live_data/sections/NATIVE_CB_DATA.json /tmp/cb-pricing-persistent/NATIVE.before.json
          cp payload/part-00.txt /tmp/cb-pricing-persistent/part-00.before.txt
          cp live_data/manifest.v2.json /tmp/cb-pricing-persistent/manifest.before.json

      - name: Apply independently certified source candidates only
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('/tmp/cb-pricing-persistent')
          eligible=json.loads((root/'eligible.json').read_text())
          scripts={'AUD':'apply_aud_asx_ib_candidate.py','CAD':'apply_cad_mx_corra_candidate.py',
                   'GBP':'apply_gbp_boe_ois_candidate.py','JPY':'apply_jpy_tfx_tona_candidate.py'}
          assert eligible and len(eligible)==len(set(eligible))
          assert set(eligible)<=set(scripts),eligible
          for c in eligible:
              with (root/(c+'.apply.json')).open('w') as log:
                  subprocess.run(['python3','validation/cb_pricing/'+scripts[c],
                     '--candidate',str(root/(c+'.candidate.json'))],stdout=log,check=True)
              print('CB_PRICING_INDEPENDENT_OFFICIAL_CANDIDATE_APPLIED',c)
          print('CB_PRICING_SOURCE_BLOCKED_NOT_APPLIED',sorted(set(scripts)-set(eligible)))
          PY
          python3 validation/build_live_manifest_v2.py --write live_data/manifest.v2.json > /tmp/cb-pricing-persistent/manifest-build.json
          python3 validation/check_cb_pricing_source_registry.py > /tmp/cb-pricing-persistent/registry.json
          python3 validation/check_live_update_contract.py > /tmp/cb-pricing-persistent/live-contract.json
          python3 validation/rebuild_live_data_runtime.py --verify-only > /tmp/cb-pricing-persistent/runtime-roundtrip.json

      - name: Enforce semantic and tracked scope
        id: scope
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          bo=json.load(open('/tmp/cb-pricing-persistent/OIS.before.json'))
          ao=json.load(open('live_data/sections/OIS_DATA.json'))
          bn=json.load(open('/tmp/cb-pricing-persistent/NATIVE.before.json'))
          an=json.load(open('live_data/sections/NATIVE_CB_DATA.json'))
          co=sorted(k for k in bo['currencies'] if bo['currencies'][k]!=ao['currencies'][k])
          cn=sorted(k for k in bn if bn[k]!=an[k])
          eligible=json.load(open('/tmp/cb-pricing-persistent/eligible.json'))
          assert set(co).issubset(eligible),('unexpected currency published',co,eligible)
          assert set(cn).issubset(eligible),('unexpected currency published',cn,eligible)
          assert co==cn,(co,cn)
          changed=sorted(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed=['live_data/manifest.v2.json','live_data/sections/NATIVE_CB_DATA.json','live_data/sections/OIS_DATA.json','payload/part-00.txt']
          assert set(changed).issubset(allowed),(changed,allowed)
          c=json.load(open('/tmp/cb-pricing-persistent/live-contract.json'))
          r=json.load(open('/tmp/cb-pricing-persistent/runtime-roundtrip.json'))
          assert c['status']=='PASS',c
          assert r['status']=='PASS' and r.get('noop_roundtrip_byte_identical') is True,r
          print('CB_PRICING_PERSISTENT_SCOPE_PASS',co,changed)
          open('/tmp/cb-pricing-persistent/changed.flag','w').write('yes\n' if changed else 'no\n')
          PY
          echo "changed=$(cat /tmp/cb-pricing-persistent/changed.flag)" >> "$GITHUB_OUTPUT"

      - name: Validation branch restores runtime
        if: steps.gate.outputs.should_run == 'true' && steps.scope.outputs.changed == 'yes' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- live_data/sections/OIS_DATA.json live_data/sections/NATIVE_CB_DATA.json live_data/manifest.v2.json payload/part-00.txt
          git diff --exit-code -- live_data payload
          echo CB_PRICING_PERSISTENT_VALIDATION_ONLY_PASS

      - name: Commit validated CB Pricing update to main with remote-head lease
        if: steps.gate.outputs.should_run == 'true' && steps.scope.outputs.changed == 'yes' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          TARGET_BRANCH: main
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$REMOTE_SHA" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live_data/sections/OIS_DATA.json live_data/sections/NATIVE_CB_DATA.json live_data/manifest.v2.json payload/part-00.txt
          git diff --cached --quiet && { echo 'No CB Pricing changes to persist'; exit 0; }
          git commit -m 'Refresh daily CB pricing runtime from official market sources'
          REMOTE_SHA_2="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$REMOTE_SHA_2" = "$GITHUB_SHA"
          git push origin "HEAD:$TARGET_BRANCH"
          echo CB_PRICING_PERSISTENT_MAIN_UPDATE_PUSHED

      - name: Confirm clean no-change case
        if: steps.gate.outputs.should_run == 'true' && steps.scope.outputs.changed == 'no'
        run: git diff --exit-code -- live_data payload

      - name: Upload CB Pricing evidence
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cb-pricing-persistent-daily-${{ github.run_id }}
          path: /tmp/cb-pricing-persistent/
          if-no-files-found: warn
          retention-days: 30
