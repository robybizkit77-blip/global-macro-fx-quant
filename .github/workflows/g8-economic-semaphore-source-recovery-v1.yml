name: G8 Economic Semaphore Source Recovery V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/macro/collect_g8_semaphore_gaps_v1.py'
      - 'validation/macro/test_collect_g8_semaphore_gaps_v1.py'
      - 'site/fx-quant-v2/next/semaphore-supplement-v1.json'
      - 'site/fx-quant-v2/next/recession-traffic-light-v1.js'
      - 'site/fx-quant-v2/next/macro-studio.js'
      - 'site/fx-quant-v2/next/app.js'
      - '.github/workflows/g8-economic-semaphore-source-recovery-v1.yml'
  push:
    branches: [main]
    paths:
      - 'validation/macro/collect_g8_semaphore_gaps_v1.py'
      - 'validation/macro/test_collect_g8_semaphore_gaps_v1.py'
      - '.github/workflows/g8-economic-semaphore-source-recovery-v1.yml'
  schedule:
    - cron: '45 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: g8-economic-semaphore-source-recovery-v1
  cancel-in-progress: false

jobs:
  source-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source identities, time series, recency and quarantine (offline)
        run: python -m unittest validation.macro.test_collect_g8_semaphore_gaps_v1 -v
      - name: Validate G8 semaphore JavaScript with optional supplement
        run: |
          node --check site/fx-quant-v2/next/recession-traffic-light-v1.js
          node validation/qa_usa_economic_semaphore_v1.cjs
      - name: Probe eight publishers and record which series are actually fresh (PR only)
        if: github.event_name == 'pull_request'
        run: python validation/macro/collect_g8_semaphore_gaps_v1.py --dry-run | tee /tmp/g8-semaphore-source-probe.txt
      - name: Collect revised observations without editing Macro Core
        if: github.event_name != 'pull_request'
        run: |
          python validation/macro/collect_g8_semaphore_gaps_v1.py --output site/fx-quant-v2/next/semaphore-supplement-v1.json \
           | tee /tmp/semaphore-source-intake.txt
          cat /tmp/semaphore-source-intake.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Persist only dated source supplement, never canonical Macro or FX
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=site/fx-quant-v2/next/semaphore-supplement-v1.json
          git diff --exit-code -- live_data/sections/MACRO_SERIES.json live_data/sections/MACRO_THERMOMETER_DATA.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- "$path"; then
            echo "SEM_G8_SUPPLEMENT_NO_CHANGE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git add -- "$path"
          git commit -m "Refresh G8 semaphore source evidence (revised, non-PIT)"
          git fetch origin main --no-tags
          # Rebase fails on overlap instead of overwriting another writer.
          git rebase origin/main
          git push origin HEAD:main
          echo "SEM_G8_SUPPLEMENT_PERSISTED_TO_MAIN" >> "$GITHUB_STEP_SUMMARY"
          # A GITHUB_TOKEN push does not trigger downstream push workflows.
          gh workflow run publish-fx-quant-v2.yml --ref main
