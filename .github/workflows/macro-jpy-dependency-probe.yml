name: Macro JPY Dependency Probe
on:
  push:
    branches:
      - validation-macro-inventory-v1-2026-10-05
    paths:
      - 'validation/probe_macro_jpy_labour_dependencies.py'
      - '.github/workflows/macro-jpy-dependency-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe JPY labour dependencies
        shell: bash
        run: |
          set -euo pipefail
          python validation/probe_macro_jpy_labour_dependencies.py | tee /tmp/jpy-macro-dependencies.json
      - name: Enforce read-only scope
        run: git diff --exit-code -- live_data payload
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: macro-jpy-dependency-probe
          path: /tmp/jpy-macro-dependencies.json
