name: Current Data Gap Cleanup Gate
on:
  push:
    branches: [staging-current-data-gap-cleanup-2026-10-01]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: npm init -y >/dev/null 2>&1 && npm install --save-dev playwright
      - name: Verify reconciled warnings
        run: |
          cat > verify.js <<'EOF'
          const {chromium}=require('playwright');
          const {execSync,spawn}=require('child_process');
          (async()=>{
            const srv=spawn('python3',['-m','http.server','8765'],{stdio:'ignore'});
            await new Promise(r=>setTimeout(r,1000));
            const cp=execSync('command -v google-chrome-stable || command -v google-chrome || command -v chromium').toString().trim();
            const browser=await chromium.launch({headless:true,executablePath:cp,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1600,height:1000}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'networkidle',timeout:120000});
            await page.waitForTimeout(3000);
            const out=await page.evaluate(()=>{
              const unresolved=(typeof unresolvedSourceChecks==='function'?unresolvedSourceChecks():[]);
              const activation=window.GMFQ_OIS_SOURCE_MONITOR?.activationState?.()||null;
              const recon=window.GMFQ_CURRENT_DATA_GAP_RECONCILIATION||null;
              const health=typeof productionHealthCheck==='function'?productionHealthCheck():null;
              const fwd=typeof forwardValidationSummary==='function'?forwardValidationSummary():null;
              return {
                fingerprint:fwd?.current_rules_fingerprint||null,
                activation,
                unresolved:unresolved.map(x=>x.id),
                recon,
                health_warnings:health?.warnings||[],
                hard_errors:health?.hard_errors||[],
                pair_count:(D?.pairs||[]).length
              };
            });
            out.js_errors=errors;
            console.log(JSON.stringify(out,null,2));
            await browser.close();srv.kill();
            const issues=[];
            if(out.fingerprint!=='3356baf0')issues.push('fingerprint');
            if(out.pair_count!==28)issues.push('pair_count');
            if(out.activation?.active!==5)issues.push('ois active '+JSON.stringify(out.activation));
            const expected=['USD_CB_PRICING','CHF_CB_PRICING','NZD_CB_PRICING'];
            if(JSON.stringify(out.unresolved)!==JSON.stringify(expected))issues.push('unresolved '+JSON.stringify(out.unresolved));
            if(out.health_warnings.some(x=>String(x).includes('GBP')))issues.push('stale GBP warning');
            if(out.hard_errors.length)issues.push('hard_errors '+JSON.stringify(out.hard_errors));
            if(out.js_errors.length)issues.push('js '+JSON.stringify(out.js_errors));
            if(out.recon?.status!=='PASS')issues.push('reconciliation');
            if(issues.length){console.error(issues);process.exit(1);}
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node verify.js
