name: JPY Reaction Function Replay Source V1
on:
  push:
    branches:
      - audit-jpy-reaction-source-probe-v1-2026-10-06
    paths:
      - history/pit_v1/JPY_WAGES_SCHEDULED_CASH_EARNINGS_FIRST_RELEASE_2018_2023_07.csv
      - history/pit_v1/JPY_CPI_HEADLINE_CORE_FIRST_RELEASE_2018_2023_07.csv
      - validation/run_jpy_reaction_function_replay_v1.py
      - validation/JPY_REACTION_FUNCTION_V1_SPEC_2026-10-06.json
      - .github/workflows/jpy-reaction-function-replay-source-v1.yml
jobs:
  replay:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen JPY reaction replay
        run: python validation/run_jpy_reaction_function_replay_v1.py
      - name: Require actual replay vote
        run: |
          python - <<'PY'
          import json
          p='validation/JPY_REACTION_FUNCTION_REPLAY_V1_2026-10-06.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x.get('status')=='PASS_DIAGNOSTIC_NOT_PROMOTED', x.get('status')
          assert x['event_universe']['directional_checkpoint_count']>0
          print(json.dumps({'events':x['event_universe'],'full':x['full_sample'],'oos':x['walkforward']['pooled_oos']},indent=2))
          PY
      - name: Strict engine live OOS guard
        run: |
          if git diff --name-only HEAD^ | grep -E '^(engine/|live_data/|validation/CANONICAL_ENGINE_OOS_T0_V3_2026-10-01.json$)'; then
            echo 'Protected runtime/OOS files changed'; exit 1
          fi
      - name: Commit replay evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/JPY_REACTION_FUNCTION_REPLAY_V1_2026-10-06.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record frozen JPY reaction-function replay evidence'
          git push
