name: Liquidity BOJ JPY Reserve XLSX Revision Window V1

on:
  push:
    branches:
      - release-candidate-daily-data-orchestrator-v1-2026-10-12
    paths:
      - 'validation/diagnose_boj_jpy_reserve_xlsx_revision_window_v1.py'
      - '.github/workflows/liquidity-boj-jpy-reserve-xlsx-revision-window-v1.yml'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revision-window-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot tracked runtime
        run: sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/runtime.before.sha256
      - name: Compare 2026 BOJ reserve workbook row to runtime vintage
        run: python validation/diagnose_boj_jpy_reserve_xlsx_revision_window_v1.py | tee /tmp/jpy-reserve-revision-window.json
      - name: Enforce diagnostic-only contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/jpy-reserve-revision-window.json'))
          assert d['schema']=='GMFQ_LIQUIDITY_JPY_RESERVE_XLSX_REVISION_WINDOW_V1', d
          assert d['status']=='DIAGNOSTIC_ONLY', d
          assert d['runtime_mutated'] is False and d['publication_performed'] is False, d
          assert d['overlap'] >= 6, d
          print('JPY_XLSX_REVISION_WINDOW overlap=',d['overlap'],'exact=',d['exact'],'mae=',d['mae'],'max_abs_diff=',d['max_abs_diff'],'max_abs_pct=',d['max_abs_pct'])
          for r in d['rows']:
              print('ROW',r)
          PY
      - name: Verify tracked runtime unchanged
        run: |
          sha256sum -c /tmp/runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Summary
        run: |
          echo 'JPY reserve XLSX revision-window diagnostic complete'
          echo 'Promotion: NONE'
          echo 'Tracked runtime mutation: NONE'
