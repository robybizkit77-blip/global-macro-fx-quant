name: Dashboard Pair Transmission Rule Sensitivity V1
on:
  push:
    branches: [research-transmission-conviction-layer-v1-2026-10-07]
    paths:
      - 'validation/run_dashboard_pair_transmission_rule_sensitivity_v1.py'
      - 'validation/DASHBOARD_PAIR_SIGNED_INPUTS_V1_2026-10-07.json'
      - '.github/workflows/dashboard-pair-transmission-rule-sensitivity-v1.yml'
permissions:
  contents: write
jobs:
  sensitivity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run rule sensitivity audit
        run: python validation/run_dashboard_pair_transmission_rule_sensitivity_v1.py
      - name: Commit sensitivity evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/DASHBOARD_PAIR_TRANSMISSION_RULE_SENSITIVITY_V1_2026-10-07.json
          git diff --cached --quiet || git commit -m 'Materialize pair transmission rule sensitivity V1'
          git push
