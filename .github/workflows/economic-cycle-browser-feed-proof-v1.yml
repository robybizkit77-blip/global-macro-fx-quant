name: Economic Cycle Browser Feed Proof V1
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/fx-quant-v2/next/app.js'
      - 'site/fx-quant-v2/next/macro-studio.js'
      - 'site/fx-quant-v2/next/macro-approved-layout.*'
      - 'site/fx-quant-v2/next/recession-traffic-light-v1.js'
      - 'site/fx-quant-v2/next/index.html'
      - 'validation/qa_economic_cycle_browser_feed_v1.cjs'
      - '.github/workflows/economic-cycle-browser-feed-proof-v1.yml'
  workflow_run:
    workflows: ['Publish FX Quant V2 (isolated site)']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-proof:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Verify browser normal load and injected source failure recovery
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/sem-browser-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/site/fx-quant-v2/next/ >/dev/null && break; sleep 1; done
          node validation/qa_economic_cycle_browser_feed_v1.cjs
      - name: Verify actual public browser coverage
        if: github.event_name != 'pull_request'
        env:
          SEMAPHORE_PUBLIC: '1'
          SEMAPHORE_BASE: 'https://robybizkit77-blip.github.io/global-macro-fx-quant/site/fx-quant-v2/next/'
        run: node validation/qa_economic_cycle_browser_feed_v1.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-approved-macro-visual-review
          path: next-approved-macro-*.png
          if-no-files-found: ignore
