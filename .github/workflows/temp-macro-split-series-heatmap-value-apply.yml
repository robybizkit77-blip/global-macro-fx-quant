name: TEMP Macro Split Series Heatmap Value Apply

on:
  push:
    branches:
      - 'feature/macro-split-series-heatmap-value-2026-10-09'
    paths:
      - '.github/workflows/temp-macro-split-series-heatmap-value-apply.yml'
      - 'validation/temp_apply_split_value_contract.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch and test split-value contract
        run: |
          set -euo pipefail
          python3 validation/temp_apply_split_value_contract.py
          sed -i 's/penultimate canonical value differs/penultimate canonical series value differs/' validation/test_macro_pit_historical_bootstrap.py
          python3 validation/build_macro_candidate.py --self-test >/tmp/builder-self-test.json
          python3 validation/test_macro_pit_historical_bootstrap.py
          python3 validation/test_macro_pit_registry_promotion.py
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = $'validation/build_macro_candidate.py\nvalidation/macro_pit_historical_bootstrap.py\nvalidation/test_macro_pit_historical_bootstrap.py'
      - name: Commit split-value support
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/build_macro_candidate.py validation/macro_pit_historical_bootstrap.py validation/test_macro_pit_historical_bootstrap.py
          git commit -m 'Support split macro series and heatmap values'
          git push origin HEAD:feature/macro-split-series-heatmap-value-2026-10-09
