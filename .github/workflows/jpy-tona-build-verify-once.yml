name: JPY TONA Build Verify Once

on:
  push:
    branches:
      - validation-cb-pricing-jpy-2026-10-08
    paths:
      - .github/workflows/jpy-tona-build-verify-once.yml

permissions:
  contents: write

jobs:
  sync-jpy-runtime-to-gh-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Fetch canonical main runtime
        run: git fetch origin main

      - name: Copy only canonical JPY runtime files from main
        shell: bash
        run: |
          git show origin/main:live_data/sections/OIS_DATA.json > live_data/sections/OIS_DATA.json
          git show origin/main:live_data/sections/NATIVE_CB_DATA.json > live_data/sections/NATIVE_CB_DATA.json
          git show origin/main:live_data/manifest.v2.json > live_data/manifest.v2.json
          git show origin/main:payload/part-00.txt > payload/part-00.txt

          allowed='^(live_data/manifest.v2.json|live_data/sections/NATIVE_CB_DATA.json|live_data/sections/OIS_DATA.json|payload/part-00.txt)$'
          bad=$(git status --porcelain | sed -E 's/^...//' | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then
            echo 'Unexpected gh-pages files changed:'
            echo "$bad"
            exit 1
          fi

          changed=$(git diff --name-only)
          echo 'Changed files:'
          printf '%s\n' "$changed"
          if ! printf '%s\n' "$changed" | grep -qx 'live_data/sections/OIS_DATA.json'; then
            echo 'Expected JPY OIS runtime change missing'
            exit 1
          fi

          for f in live_data/sections/OIS_DATA.json live_data/sections/NATIVE_CB_DATA.json live_data/manifest.v2.json payload/part-00.txt; do
            test "$(sha256sum "$f" | awk '{print $1}')" = "$(git show origin/main:"$f" | sha256sum | awk '{print $1}')"
          done
          echo 'GH_PAGES_RUNTIME_MATCHES_MAIN'

      - name: Commit gh-pages runtime sync
        shell: bash
        run: |
          git add live_data/sections/OIS_DATA.json \
                  live_data/sections/NATIVE_CB_DATA.json \
                  live_data/manifest.v2.json \
                  payload/part-00.txt
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish JPY TONA pricing runtime'
          git push origin HEAD:gh-pages
