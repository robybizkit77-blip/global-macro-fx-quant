name: Runtime Metadata Completion Gate

on:
  push:
    branches: [staging-runtime-metadata-complete-latest-2026-10-01]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: npm init -y >/dev/null 2>&1 && npm install --save-dev playwright
      - name: Compare metadata staging to current main
        run: |
          git fetch origin main
          git worktree add /tmp/mainref origin/main
          cat > verify.js <<'EOF'
          const {chromium}=require('playwright');
          const {execSync,spawn}=require('child_process');
          async function snap(port,dir){
            const srv=spawn('python3',['-m','http.server',String(port)],{cwd:dir,stdio:'ignore'});
            await new Promise(r=>setTimeout(r,1200));
            const cp=execSync('command -v google-chrome-stable || command -v google-chrome || command -v chromium').toString().trim();
            const browser=await chromium.launch({headless:true,executablePath:cp,args:['--no-sandbox']});
            const page=await browser.newPage();
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:'+port+'/index.html',{waitUntil:'networkidle',timeout:120000});
            await page.waitForTimeout(3500);
            const out=await page.evaluate(()=>{
              const ccys=['USD','EUR','GBP','JPY','CHF','CAD','AUD','NZD'];
              const rows=[];
              if(typeof S!=='undefined') for(const c of ccys) for(const x of (S[c]||[])){
                rows.push({ccy:c,id:x.id||null,category:x.category||null,frequency:x.frequency||x.freq||null,unit:x.unit||x.units||null,source_file:x.source_file||null});
              }
              const currencies=Object.fromEntries(ccys.map(c=>{
                const s=deriveCurrencyState(c)||{};
                const imp=currencyImprovementDiagnostic(c)||{};
                return [c,{base:s.base||null,macro:Number(s.macro),policy:Number(s.policy),improvement:s.improvementState||imp.state||null,driver:deriveCurrencyDriver(c)||null}];
              }));
              const pairs=[...(D?.pairs||[])].map(x=>x.pair).sort();
              const pairStates=Object.fromEntries(pairs.map(p=>{
                const f=derivePairDecisionFrame(p)||{};
                return [p,{favored:f.fav||null,quality:f.quality||null,macro_side:f.structural?.macro?.side||null,policy_side:f.structural?.policy?.side||null}];
              }));
              const fwd=typeof forwardValidationSummary==='function'?forwardValidationSummary():null;
              const health=typeof productionHealthCheck==='function'?productionHealthCheck():null;
              return {rows,currencies,pairs:pairStates,fingerprint:fwd?.current_rules_fingerprint||null,health:health||null};
            });
            await browser.close(); srv.kill();
            out.errors=errors; return out;
          }
          (async()=>{
            const main=await snap(8765,'/tmp/mainref');
            const stage=await snap(8766,process.cwd());
            const incomplete=stage.rows.filter(x=>!x.source_file||!x.frequency||!x.unit);
            const issues=[];
            if(stage.rows.length!==204) issues.push('series count '+stage.rows.length+' != 204');
            if(incomplete.length) issues.push('incomplete metadata '+JSON.stringify(incomplete));
            if(stage.fingerprint!==main.fingerprint) issues.push('fingerprint changed');
            if(JSON.stringify(stage.currencies)!==JSON.stringify(main.currencies)) issues.push('currency states changed');
            if(JSON.stringify(stage.pairs)!==JSON.stringify(main.pairs)) issues.push('pair states changed');
            if((stage.health?.hard_errors||[]).length) issues.push('hard errors '+JSON.stringify(stage.health.hard_errors));
            if(stage.errors.length) issues.push('JS errors '+JSON.stringify(stage.errors));
            const result={
              status:issues.length?'FAIL':'PASS',
              main_fingerprint:main.fingerprint,
              stage_fingerprint:stage.fingerprint,
              series_total:stage.rows.length,
              metadata_complete:stage.rows.length-incomplete.length,
              metadata_incomplete:incomplete.length,
              currency_states_identical:JSON.stringify(stage.currencies)===JSON.stringify(main.currencies),
              pair_states_identical:JSON.stringify(stage.pairs)===JSON.stringify(main.pairs),
              health_status:stage.health?.status||null,
              issues
            };
            console.log('===METADATA_GATE_START===');
            console.log(JSON.stringify(result,null,2));
            console.log('===METADATA_GATE_END===');
            if(issues.length) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node verify.js
