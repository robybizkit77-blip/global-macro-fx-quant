name: CAD Rates PIT History

on:
  push:
    branches:
      - engine-freeze-v1-2026-10-02
    paths:
      - 'validation/fetch_cad_boc_rates_history.py'
      - '.github/workflows/cad-rates-pit-history.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engine-freeze-v1-2026-10-02
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Fetch official Bank of Canada daily benchmark rates
        run: python validation/fetch_cad_boc_rates_history.py
      - name: Commit rates PIT history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/cad_rates_pit/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Materialize CAD official rates PIT history"
            git pull --rebase origin engine-freeze-v1-2026-10-02
            git push origin HEAD:engine-freeze-v1-2026-10-02
          fi
