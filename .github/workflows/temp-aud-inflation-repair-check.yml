name: TEMP AUD Inflation Repair Check

on:
  push:
    branches:
      - validation-macro-aud-inflation-repair-check-2026-10-09
    paths:
      - '.github/workflows/temp-aud-inflation-repair-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare official AUD inflation with canonical layers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aud-infl
          python3 validation/sources/aud_abs_core.py --dimension inflation --output /tmp/aud-infl/candidate.json --audit-output /tmp/aud-infl/audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/aud-infl/candidate.json').read_text())
          a=json.loads(Path('/tmp/aud-infl/audit.json').read_text())
          s=json.loads(Path('live_data/sections/MACRO_SERIES.json').read_text())
          h=json.loads(Path('live_data/sections/MACRO_THERMOMETER_DATA.json').read_text())['currencies']['AUD']['inflation']
          row=next(x for x in s['AUD'] if x['id']=='AU_CPI_HEADLINE_Q_YOY_history_value')
          print(json.dumps({
            'candidate':c,
            'audit':a,
            'series_len':len(row.get('values',[])),
            'series_dates_tail':row.get('dates',[])[-6:],
            'series_values_tail':row.get('values',[])[-6:],
            'series_last_date':row.get('last_date'),
            'series_last_value':row.get('last_value'),
            'heat_as_of':h.get('as_of'),
            'heat_latest_value':h.get('latest_value'),
            'heat_history_len':len(h.get('history',[])),
            'heat_history_tail':h.get('history',[])[-6:],
            'heat_percentile':h.get('percentile'),
            'heat_direction':h.get('direction'),
            'heat_acceleration':h.get('acceleration'),
            'heat_source':h.get('source'),
          },indent=2))
          PY
          git diff --exit-code -- live_data/sections/MACRO_SERIES.json live_data/sections/MACRO_THERMOMETER_DATA.json
