name: USD CPI Release Archive Transport V1

on:
  push:
    branches:
      - validation-usd-cpi-release-archive-transport-v1-2026-10-11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe archived release transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/usd-cpi-release-archive
          python validation/macro/probe_usd_cpi_release_archive_transport_v1.py \
            --output /tmp/usd-cpi-release-archive/result.json
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usd-cpi-release-archive-transport-${{ github.run_id }}
          path: /tmp/usd-cpi-release-archive/
          retention-days: 90
