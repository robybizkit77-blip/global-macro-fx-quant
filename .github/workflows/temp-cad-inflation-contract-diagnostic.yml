name: TEMP CAD Inflation Format Repair

on:
  push:
    branches:
      - validation-macro-cad-inflation-contract-repair-2026-10-09
    paths:
      - '.github/workflows/temp-cad-inflation-contract-diagnostic.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore canonical minified heatmap and apply one CAD metadata change
        shell: bash
        run: |
          set -euo pipefail
          git show 7b5e85fa702bf671675281fdff12655af6a4ab61:live_data/sections/MACRO_THERMOMETER_DATA.json > /tmp/heatmap.base
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/heatmap.base')
          s=p.read_text()
          old='"CAD":{"status":"ACTIVE","as_of":null,"labour":'
          assert old in s
          i=s.index(old)
          j=s.index('"AUD":{"status":"ACTIVE"',i)
          block=s[i:j]
          needle='"series_id":"CA_CPI_HEADLINE_YOY","source":"Statistics Canada","frequency":"M","transformation":"reported_yoy_rate"'
          replacement='"series_id":"CA_CPI_HEADLINE_YOY","source":"Statistics Canada","frequency":"M","transformation":"derived_yoy_from_index"'
          assert block.count(needle)==1, block.count(needle)
          block=block.replace(needle,replacement,1)
          out=s[:i]+block+s[j:]
          Path('live_data/sections/MACRO_THERMOMETER_DATA.json').write_text(out)
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('live_data/sections/MACRO_THERMOMETER_DATA.json').read_text())['currencies']['CAD']['inflation']
          assert h['transformation']=='derived_yoy_from_index'
          assert h['latest_value']==3.033980582524287
          assert h['history'][-2:]==[3.032141,3.033981]
          print('CAD inflation metadata-only repair verified')
          PY
          git diff --numstat 7b5e85fa702bf671675281fdff12655af6a4ab61 -- live_data/sections/MACRO_THERMOMETER_DATA.json
          git diff --word-diff=plain 7b5e85fa702bf671675281fdff12655af6a4ab61 -- live_data/sections/MACRO_THERMOMETER_DATA.json | tail -n 5
          test "$(git diff --numstat 7b5e85fa702bf671675281fdff12655af6a4ab61 -- live_data/sections/MACRO_THERMOMETER_DATA.json | awk '{print $1+$2}')" -le 2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live_data/sections/MACRO_THERMOMETER_DATA.json
          git commit -m 'Restore compact CAD inflation metadata repair'
          git push
