name: TEMP CAD Inflation Contract Diagnostic

on:
  push:
    branches:
      - validation-macro-cad-inflation-contract-repair-2026-10-09
    paths:
      - '.github/workflows/temp-cad-inflation-contract-diagnostic.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect CAD CPI contract and recompute official-index YoY
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from validation.sources.cad_statcan_core import download_csv, rows_from_text

          rows=rows_from_text(download_csv('18100004'))
          idx={}
          for r in rows:
              if str(r.get('GEO','')).strip()!='Canada':
                  continue
              if str(r.get('Products and product groups','')).strip()!='All-items':
                  continue
              if str(r.get('UOM','')).strip()!='2002=100':
                  continue
              d=str(r.get('REF_DATE',''))[:7]
              v=r.get('VALUE')
              if d and v not in (None,''):
                  idx[d]=float(v)
          def yoy(period):
              y,m=map(int,period.split('-'))
              prev=f'{y-1:04d}-{m:02d}'
              return (idx[period]/idx[prev]-1.0)*100.0

          series=json.loads(Path('live_data/sections/MACRO_SERIES.json').read_text())
          row=next(x for x in series['CAD'] if x['id']=='CA_CPI_HEADLINE_YOY_history_value')
          heat=json.loads(Path('live_data/sections/MACRO_THERMOMETER_DATA.json').read_text())['currencies']['CAD']['inflation']
          out={
              'series_keys': sorted(row.keys()),
              'series_metadata': {k:row.get(k) for k in row.keys() if k not in ('dates','values')},
              'heat_metadata': {k:v for k,v in heat.items() if k!='history'},
              'official_index_tail': {p:idx[p] for p in sorted(idx)[-15:]},
              'derived_jul': yoy('2026-07'),
              'derived_aug': yoy('2026-08'),
              'canonical_jul': row['values'][-2],
              'canonical_aug': row['values'][-1],
              'exact_jul': abs(yoy('2026-07')-float(row['values'][-2]))<1e-12,
              'exact_aug': abs(yoy('2026-08')-float(row['values'][-1]))<1e-12,
          }
          print(json.dumps(out,ensure_ascii=False,indent=2))
          assert out['exact_jul'] and out['exact_aug']
          PY
          git diff --exit-code -- live_data/sections/MACRO_SERIES.json live_data/sections/MACRO_THERMOMETER_DATA.json
