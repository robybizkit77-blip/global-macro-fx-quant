name: TEMP CAD Inflation Full Reported History Check

on:
  push:
    branches:
      - validation-macro-cad-inflation-quick-check-2026-10-09
    paths:
      - '.github/workflows/temp-cad-inflation-quick-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare official reported YoY history with canonical derived YoY
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from validation.sources.cad_statcan_core import download_csv, rows_from_text, extract_fixture_inflation

          official=extract_fixture_inflation(rows_from_text(download_csv('18100004')))
          off={d[:7]:float(v) for d,v in official}
          series=json.loads(Path('live_data/sections/MACRO_SERIES.json').read_text())
          row=next(x for x in series['CAD'] if x['id']=='CA_CPI_HEADLINE_YOY_history_value')
          pairs=[]
          missing=[]
          for d,v in zip(row['dates'],row['values']):
              key=str(d)[:7]
              if key not in off:
                  missing.append(key); continue
              ov=off[key]; cv=float(v)
              pairs.append((key,cv,ov,round(cv,1),abs(round(cv,1)-ov)))
          mism=[x for x in pairs if x[4]>1e-12]
          print(json.dumps({
            'status':'PASS',
            'official_count':len(official),
            'canonical_count':len(row['values']),
            'matched_count':len(pairs),
            'missing_count':len(missing),
            'rounded_exact_match_count':len(pairs)-len(mism),
            'rounded_mismatch_count':len(mism),
            'max_rounded_diff':max([x[4] for x in pairs],default=None),
            'first_mismatches':mism[:12],
            'tail_comparison':pairs[-8:],
          },indent=2))
          assert not missing, missing[:10]
          assert not mism, f'{len(mism)} canonical values do not round to official reported YoY'
          PY
          git diff --exit-code -- live_data/sections/MACRO_SERIES.json live_data/sections/MACRO_THERMOMETER_DATA.json
