name: TEMP CAD Inflation CSV Shape Probe

on:
  push:
    branches:
      - validation-macro-cad-inflation-quick-check-2026-10-09
    paths:
      - '.github/workflows/temp-cad-inflation-quick-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect official StatCan CPI CSV schema only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from validation.sources.cad_statcan_core import download_csv, rows_from_text
          rows=rows_from_text(download_csv('18100004'))
          print(json.dumps({
            'row_count':len(rows),
            'columns':list(rows[0].keys()) if rows else [],
            'first_row':rows[0] if rows else None,
            'all_items_samples':[r for r in rows if 'all-items' in ' '.join(str(v) for v in r.values()).lower()][-5:],
          },ensure_ascii=False,indent=2))
          assert rows
          PY
          git diff --exit-code -- live_data/sections/MACRO_SERIES.json live_data/sections/MACRO_THERMOMETER_DATA.json
