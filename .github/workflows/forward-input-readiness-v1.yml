name: Forward Input Readiness V1

on:
  push:
    branches:
      - validation-forward-input-readiness-v1-2026-10-12
    paths:
      - 'validation/FORWARD_INPUT_READINESS_CONTRACT_V1_2026-10-12.json'
      - 'validation/FORWARD_INPUT_REFRESH_SOURCE_MAP_V1_2026-10-12.json'
      - 'validation/check_forward_input_refresh_source_map_v1.py'
      - 'validation/forward_input_readiness_v1.py'
      - '.github/workflows/forward-input-readiness-v1.yml'
  pull_request:
    branches:
      - validation-relative-macro-turning-2y-fx-forward-engine-v1-2026-10-12
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  RATES_STORE_SHA: 0f4f45190fa5d5e010650026a30a0f981373ec34
  READINESS_RUN_ID: '38169617850'
  READINESS_ARTIFACT: g4usd-alignment-integration-readiness-fast-v3-38169617850

jobs:
  readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate canonical forward refresh source map
        shell: bash
        run: |
          set -euo pipefail
          python validation/check_forward_input_refresh_source_map_v1.py | tee /tmp/forward-refresh-source-map.json

      - name: Materialize exact certified macro snapshot
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.READINESS_ARTIFACT }}
          path: /tmp/forward-readiness/readiness
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: robybizkit77-blip/global-macro-fx-quant
          run-id: ${{ env.READINESS_RUN_ID }}

      - name: Assert macro snapshot identity and canonical set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/forward-readiness/macro
          cp /tmp/forward-readiness/readiness/canonical/*.csv /tmp/forward-readiness/macro/
          python - <<'PY'
          from pathlib import Path
          expected={f'{c}_{d}.csv' for c in ('usd','eur','jpy','cad','aud') for d in ('inflation','labour')}
          got={p.name for p in Path('/tmp/forward-readiness/macro').glob('*.csv')}
          missing=expected-got
          assert not missing, f'missing canonical macro inputs: {sorted(missing)}'
          print('MACRO_CANONICAL_10_OF_10_PRESENT')
          PY

      - name: Materialize exact certified Temporal-PIT rates rowsets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/forward-readiness/rates
          git fetch --depth=1 origin "$RATES_STORE_SHA"
          for c in usd eur jpy cad aud; do
            git checkout FETCH_HEAD -- "validation/rates_pit_rowsets/${c}_rates_2y_10y_temporal_pit_v1.csv"
            cp "validation/rates_pit_rowsets/${c}_rates_2y_10y_temporal_pit_v1.csv" "/tmp/forward-readiness/rates/${c}.csv"
          done
          git reset --hard "$GITHUB_SHA"
          git clean -fd

      - name: Build fail-closed unified readiness receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/forward-readiness/out
          python validation/forward_input_readiness_v1.py \
            --contract validation/FORWARD_INPUT_READINESS_CONTRACT_V1_2026-10-12.json \
            --macro-dir /tmp/forward-readiness/macro \
            --rates-dir /tmp/forward-readiness/rates \
            --output /tmp/forward-readiness/out/forward-input-readiness.json

      - name: Enforce current boundary and future fail-closed state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='/tmp/forward-readiness/out/forward-input-readiness.json'
          r=json.load(open(p))
          assert r['current_max_certified_decision_point']=='2026-10-10'
          assert r['next_required_decision_point']=='2026-11-10'
          assert r['current_inputs_green']==15
          assert r['macro_green']==10 and r['rates_green']==5
          assert r['next_decision_point_ready'] is False
          assert len(r['next_decision_point_blockers'])==15
          assert r['historical_backfill_used'] is False
          assert r['production_signal_authorized'] is False
          assert r['sizing_authorized'] is False
          assert r['repository_write_performed'] is False
          print('FORWARD_READINESS_FAIL_CLOSED_PASS')
          PY

      - name: Prove workflow is read-only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

      - uses: actions/upload-artifact@v4
        with:
          name: forward-input-readiness-${{ github.run_id }}
          path: |
            /tmp/forward-readiness/out/
            /tmp/forward-refresh-source-map.json
          if-no-files-found: error
          retention-days: 90
