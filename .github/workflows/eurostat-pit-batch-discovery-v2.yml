name: Eurostat PIT Batch Discovery V2

on:
  push:
    branches:
      - engine-freeze-v1-2026-10-02
    paths:
      - 'validation/discover_eurostat_vintages_v2.py'
      - '.github/workflows/eurostat-pit-batch-discovery-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engine-freeze-v1-2026-10-02
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover Eurostat vintage dataflows robustly
        run: python validation/discover_eurostat_vintages_v2.py
      - name: Commit Eurostat discovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/pit_batch/eurostat/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Discover Eurostat vintage dataflows robustly"
            git push origin HEAD:engine-freeze-v1-2026-10-02
          fi
