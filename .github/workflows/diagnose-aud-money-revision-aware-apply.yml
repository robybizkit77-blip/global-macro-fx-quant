name: Diagnose AUD Money Revision-Aware Apply

on:
  push:
    branches:
      - release-candidate-daily-data-orchestrator-v1-2026-10-12
    paths:
      - 'validation/fetch_rba_aud_broad_money_revision_aware_candidate.py'
      - 'validation/apply_rba_aud_broad_money_revision_aware_candidate.py'
      - '.github/workflows/diagnose-aud-money-revision-aware-apply.yml'
      - 'live_data/sections/NATIVE_LIQ_DATA.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aud-money-revision-aware-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook parser
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Snapshot tracked runtime
        run: sha256sum live_data/sections/NATIVE_LIQ_DATA.json > /tmp/runtime.before.sha256
      - name: Build official RBA revision-aware candidate
        run: |
          python validation/fetch_rba_aud_broad_money_revision_aware_candidate.py --out /tmp/aud-money.json
          cat /tmp/aud-money.json
      - name: Validate source transform and revision contract
        run: |
          python - <<'PY'
          import json
          c=json.load(open('/tmp/aud-money.json'))
          assert c['schema']=='GMFQ_LIQUIDITY_AUD_BROAD_MONEY_REVISION_AWARE_CANDIDATE_V1', c
          assert c['status']=='GREEN_SOURCE_CANDIDATE_ONLY', c
          assert c['source']['series_key']=='DMABMS', c
          p=c['proof']
          assert p['revision_aware_append_only'] is True, p
          assert p['historical_runtime_values_frozen'] is True, p
          assert p['new_observation_transform']=='ROUND_1DP', p
          assert p['overlap_count'] >= 60, p
          assert p['rounded_1dp_match_count'] > 0, p
          assert c['candidate_pipeline_ready'] is True, c
          assert c['runtime_mutated'] is False and c['publication_performed'] is False, c
          print('AUD_MONEY_REVISION_AWARE_SOURCE_CONTRACT_PASS')
          PY
      - name: Dry-run controlled apply
        run: |
          python validation/apply_rba_aud_broad_money_revision_aware_candidate.py --candidate /tmp/aud-money.json > /tmp/aud-money-dry.json
          cat /tmp/aud-money-dry.json
      - name: Prove controlled apply on runtime copy
        run: |
          cp live_data/sections/NATIVE_LIQ_DATA.json /tmp/NATIVE_LIQ_DATA.aud-money.json
          python validation/apply_rba_aud_broad_money_revision_aware_candidate.py --candidate /tmp/aud-money.json --runtime /tmp/NATIVE_LIQ_DATA.aud-money.json --apply > /tmp/aud-money-apply.json
          cat /tmp/aud-money-apply.json
          python - <<'PY'
          import json
          c=json.load(open('/tmp/aud-money.json'))
          dry=json.load(open('/tmp/aud-money-dry.json'))
          r=json.load(open('/tmp/aud-money-apply.json'))
          original=json.load(open('live_data/sections/NATIVE_LIQ_DATA.json'))['AUD']['money']
          applied=json.load(open('/tmp/NATIVE_LIQ_DATA.aud-money.json'))['AUD']['money']
          n=len(original['dates'])
          assert applied['dates'][:n]==original['dates'], (applied,original)
          assert applied['values'][:n]==original['values'], (applied,original)
          assert r['runtime_history_rewritten'] is False, r
          assert r['revision_aware_append_only'] is True, r
          assert dry['applied'] is False, dry
          expected=len(c['new_observations'])
          assert dry['appended_observations']==expected, (dry,c)
          assert r['appended_observations']==expected, (r,c)
          if expected:
              assert r['applied'] is True and r['status']=='UPDATE_AVAILABLE', r
              assert applied['dates'][-1]==c['new_observations'][-1]['date'], (applied,c)
              assert float(applied['values'][-1])==float(c['new_observations'][-1]['value']), (applied,c)
          else:
              assert r['applied'] is False and r['status']=='NO_CHANGE', r
          print('AUD_MONEY_REVISION_AWARE_CONTROLLED_APPLY_PASS')
          PY
      - name: Verify tracked runtime unchanged
        run: |
          sha256sum -c /tmp/runtime.before.sha256
          git diff --exit-code -- live_data/sections/NATIVE_LIQ_DATA.json
      - name: Summary
        run: |
          echo 'AUD.money RBA exact series: DMABMS'
          echo 'Historical current-vintage revisions: diagnostic only; stored PIT history frozen'
          echo 'New observations: normalized to existing runtime precision (1dp)'
          echo 'Tracked runtime mutation: NONE'
          echo 'Publication: NONE'
