name: Risk Runtime Diagnostic V1

on:
  push:
    branches:
      - 'release-candidate-daily-data-orchestrator-v1-2026-10-12'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Risk runtime object
        run: python3 validation/inspect_risk_runtime_v1.py | tee risk-runtime-diagnostic.json
      - uses: actions/upload-artifact@v4
        with:
          name: risk-runtime-diagnostic-v1
          path: risk-runtime-diagnostic.json
