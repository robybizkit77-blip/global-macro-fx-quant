name: EURUSD Relative Repricing Pilot V1

on:
  push:
    branches:
      - validation-eurusd-relative-repricing-pilot-v1-2026-10-11
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  RATES_STORE_SHA: 0f4f45190fa5d5e010650026a30a0f981373ec34

jobs:
  relative-repricing-pilot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Borrow exact certified frozen EUR and USD rates rowsets
        run: |
          set -euo pipefail
          mkdir -p /tmp/relative-repricing
          git fetch --depth=1 origin "$RATES_STORE_SHA"
          git checkout FETCH_HEAD -- validation/rates_pit_rowsets/eur_rates_2y_10y_temporal_pit_v1.csv validation/rates_pit_rowsets/usd_rates_2y_10y_temporal_pit_v1.csv
          cp validation/rates_pit_rowsets/eur_rates_2y_10y_temporal_pit_v1.csv /tmp/relative-repricing/eur.csv
          cp validation/rates_pit_rowsets/usd_rates_2y_10y_temporal_pit_v1.csv /tmp/relative-repricing/usd.csv
          git reset --hard "$GITHUB_SHA"
          git clean -fd

      - name: Download official ECB EURUSD reference-rate history
        run: |
          set -euo pipefail
          URL='https://data-api.ecb.europa.eu/service/data/EXR/D.USD.EUR.SP00.A?startPeriod=2018-03-01&endPeriod=2026-09-30&format=csvdata'
          ok=0
          for attempt in 1 2 3; do
            if curl -fL --connect-timeout 20 --max-time 120 "$URL" -o /tmp/relative-repricing/ecb-eurusd.csv; then ok=1; break; fi
            sleep $((attempt * 5))
          done
          test "$ok" -eq 1

      - name: Run fixed relative repricing OOS diagnostic
        run: |
          set -euo pipefail
          python validation/eurusd_relative_repricing_pilot_v1.py --eur-rates /tmp/relative-repricing/eur.csv --usd-rates /tmp/relative-repricing/usd.csv --ecb-csv /tmp/relative-repricing/ecb-eurusd.csv --output /tmp/relative-repricing/result.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/relative-repricing/result.json'))
          assert r['status']=='DIAGNOSTIC_COMPLETE'
          assert r['scope']['monthly_repricing_rows']==101
          assert r['scope']['oos_predictions_per_model']==64
          assert set(r['models'])=={'RELATIVE_REPRICING','EUR_REPRICING_ONLY','USD_REPRICING_ONLY'}
          assert r['method']['hyperparameter_tuning'] is False
          assert r['policy']['production_signal_authorized'] is False
          print(json.dumps({'comparison':r['comparison'],'relative':r['models']['RELATIVE_REPRICING']['overall'],'blocks':r['models']['RELATIVE_REPRICING']['time_blocks']},indent=2,sort_keys=True))
          PY

      - name: Require deterministic exact result
        run: |
          set -euo pipefail
          python validation/eurusd_relative_repricing_pilot_v1.py --eur-rates /tmp/relative-repricing/eur.csv --usd-rates /tmp/relative-repricing/usd.csv --ecb-csv /tmp/relative-repricing/ecb-eurusd.csv --output /tmp/relative-repricing/result-b.json >/dev/null
          cmp /tmp/relative-repricing/result.json /tmp/relative-repricing/result-b.json

      - name: Assert repository clean
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eurusd-relative-repricing-pilot-${{ github.run_id }}
          path: /tmp/relative-repricing/result.json
          retention-days: 90
