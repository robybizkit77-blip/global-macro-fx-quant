<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOBAL MACRO FX QUANT</title></head>
<body><div style="font:14px system-ui;padding:24px">Caricamento GLOBAL MACRO FX QUANT…</div>
<script>
(async()=>{
 const parts=["payload/part-00.txt","payload/part-01.txt","payload/part-02.txt","payload/part-03.txt","payload/part-04.txt","payload/part-05.txt","payload/part-06.txt","payload/part-07.txt","payload/part-08.txt","payload/part-09.txt","payload/part-10.txt","payload/part-11.txt","payload/part-12.txt","payload/part-13.txt","payload/part-14.txt","payload/part-15.txt"];
 const responses=await Promise.all(parts.map(async p=>{
   const r=await fetch(p,{cache:'default'});
   if(!r.ok) throw new Error('Impossibile caricare '+p);
   return r.text();
 }));
 let html=responses.join('\n');
 if(!html.includes('GMFQ_RUNTIME_VALIDATION_MANIFEST')) throw new Error('Payload v490 non validato');
 let refreshCalls=0;
 html=html.replace(/\bstableModelRefresh\s*\(\s*\)/g,(m,offset,src)=>{
   const prefix=src.slice(Math.max(0,offset-24),offset);
   if(/function\s+$/.test(prefix)) return m;
   refreshCalls++;
   return '(window.__GMFQ_STABLE_REFRESH_QUEUED=true)';
 });
 if(refreshCalls!==25) throw new Error('Bootstrap refresh manifest inatteso: '+refreshCalls);

 const forwardReliabilityCall='const rel=reliabilityLabel(st);';
 const forwardReliabilityMatches=html.split(forwardReliabilityCall).length-1;
 if(forwardReliabilityMatches!==1) throw new Error('Forward reliability scope manifest inatteso: '+forwardReliabilityMatches);
 const forwardReliabilityInline="const rel=(!st.n)?{label:'In attesa',cls:'fwdNeu'}:(st.n<10)?{label:'Troppo presto',cls:'fwdWarn'}:(st.n<20)?{label:'Preliminare',cls:'fwdWarn'}:(st.n<40)?{label:'Campione in costruzione',cls:'fwdWarn'}:{label:'Più affidabile',cls:'fwdPos'};";
 html=html.replace(forwardReliabilityCall,forwardReliabilityInline);

 const forwardPathRiskDef='function pathRiskStats(series){';
 const forwardSnapshotBasketDef='function snapshotBasketSeries(outcomes,horizon){';
 const forwardPairedOverlayDef='function pairedOverlayStats(outcomes,horizon,kind,value){';
 const forwardPathRiskCall='const rs=pathRiskStats(snapshotBasketSeries(outcomes,h));';
 const forwardPairedOverlayCall="const s=pairedOverlayStats(outcomes,'1W',k,v);";
 const pathRiskDefMatches=html.split(forwardPathRiskDef).length-1;
 const snapshotBasketDefMatches=html.split(forwardSnapshotBasketDef).length-1;
 const pairedOverlayDefMatches=html.split(forwardPairedOverlayDef).length-1;
 const pathRiskCallMatches=html.split(forwardPathRiskCall).length-1;
 const pairedOverlayCallMatches=html.split(forwardPairedOverlayCall).length-1;
 if(pathRiskDefMatches!==1 || snapshotBasketDefMatches!==1 || pairedOverlayDefMatches!==1 || pathRiskCallMatches!==1 || pairedOverlayCallMatches!==1){
   throw new Error('Forward helper scope manifest inatteso: '+[pathRiskDefMatches,snapshotBasketDefMatches,pairedOverlayDefMatches,pathRiskCallMatches,pairedOverlayCallMatches].join('/'));
 }
 html=html.replace(forwardPathRiskDef,'window.gmfqForwardPathRiskStats=pathRiskStats;\n'+forwardPathRiskDef);
 html=html.replace(forwardSnapshotBasketDef,'window.gmfqForwardSnapshotBasketSeries=snapshotBasketSeries;\n'+forwardSnapshotBasketDef);
 html=html.replace(forwardPairedOverlayDef,'window.gmfqForwardPairedOverlayStats=pairedOverlayStats;\n'+forwardPairedOverlayDef);
 html=html.replace(forwardPathRiskCall,'const rs=window.gmfqForwardPathRiskStats(window.gmfqForwardSnapshotBasketSeries(outcomes,h));');
 html=html.replace(forwardPairedOverlayCall,"const s=window.gmfqForwardPairedOverlayStats(outcomes,'1W',k,v);");

 // Runtime quarantine V2: obsolete September-era QA/editorial mutators remain in
 // the immutable legacy payload for audit/rollback, but must no longer execute.
 // Current visible editorial surfaces are owned by validated operational modules.
 const quarantinedLegacyScripts=[
   'gmfq-propagation-qa','gmfq-e2e-live-italy','gmfq-runtime-refresh-fix-20260930',
   'gmfq-usd-sep30-closeout-20261001','gmfq-usd-sep30-closeout-finalizer-20261001'
 ];
 for(const id of quarantinedLegacyScripts){
   const escaped=id.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
   const re=new RegExp('<script\\s+id=["\\\']'+escaped+'["\\\'][^>]*>[\\s\\S]*?<\\/script>','g');
   const matches=html.match(re)||[];
   if(matches.length!==1) throw new Error('Legacy quarantine manifest inatteso per '+id+': '+matches.length);
   html=html.replace(re,'<!-- GMFQ_LEGACY_QUARANTINED:'+id+' -->');
 }
 const quarantinedLegacyFingerprints=[{name:'LIVE_REFRESH_20260930_AM',needle:'window.LIVE_REFRESH_20260930_AM='}];
 for(const item of quarantinedLegacyFingerprints){
   const blocks=html.match(/<script(?:\s[^>]*)?>[\s\S]*?<\/script>/g)||[];
   const matches=blocks.filter(block=>block.includes(item.needle));
   if(matches.length!==1) throw new Error('Legacy fingerprint quarantine inatteso per '+item.name+': '+matches.length);
   html=html.replace(matches[0],'<!-- GMFQ_LEGACY_QUARANTINED_FINGERPRINT:'+item.name+' -->');
 }

 const marker='<script id="gmfq-post-gate-final-audit-settlement">';
 if(!html.includes(marker)) throw new Error('Final audit settlement marker mancante');
 const finalRefresh='<script id="gmfq-single-final-stable-refresh">try{if(typeof stableModelRefresh===\'function\')stableModelRefresh();}catch(e){console.error(\'single-final-refresh\',e);}</scr'+'ipt>\n';
 html=html.replace(marker,finalRefresh+marker);
 const assets=[
   ['gmfq-ois-operational-ui','dashboard/ois-operational-monitor-v1.js'],
   ['gmfq-calendar-news-operational-ui','dashboard/calendar-news-operational-v1.js'],
   ['gmfq-top-themes-operational-ui','dashboard/top-themes-operational-v1.js'],
   ['gmfq-what-changed-operational-ui','dashboard/what-changed-operational-v1.js'],
   ['gmfq-risk-operational-ui','dashboard/risk-operational-v1.js'],
   ['gmfq-cotdesk-operational-ui','dashboard/cotdesk-operational-v1.js'],
   ['gmfq-pairs-operational-ui','dashboard/pairs-operational-v1.js'],
   ['gmfq-overview-asof-operational-ui','dashboard/overview-asof-operational-v1.js'],
   ['gmfq-currencies-operational-ui','dashboard/currencies-operational-v1.js'],
   ['gmfq-macro-operational-ui','dashboard/macro-operational-v1.js'],
   ['gmfq-ratesdesk-operational-ui','dashboard/ratesdesk-operational-v1.js'],
   ['gmfq-cbdesk-operational-ui','dashboard/cbdesk-operational-v1.js'],
   ['gmfq-liquiditydesk-operational-ui','dashboard/liquiditydesk-operational-v1.js'],
   ['gmfq-forwarddesk-operational-ui','dashboard/forwarddesk-operational-v1.js'],
   ['gmfq-editorial-freshness-guard','dashboard/editorial-freshness-guard-v1.js'],
   ['gmfq-premium-shell-v1','dashboard/premium-shell-v1.js'],
   ['gmfq-product-language-v1','dashboard/product-language-v1.js'],
   ['gmfq-overview-hierarchy-v1','dashboard/overview-hierarchy-v1.js'],
   ['gmfq-inflationlabour-hierarchy-v1','dashboard/inflationlabour-hierarchy-v1.js'],
   ['gmfq-calendar-hierarchy-v1','dashboard/calendar-hierarchy-v1.js'],
   ['gmfq-themes-hierarchy-v1','dashboard/themes-hierarchy-v1.js'],
   ['gmfq-currencies-hierarchy-v1','dashboard/currencies-hierarchy-v1.js'],
   ['gmfq-control-room-shell-v1','dashboard/control-room-shell-v1.js'],
   ['gmfq-control-room-insights-v3','dashboard/control-room-insights-v3.js'],
   ['gmfq-control-room-snapshot-v1','dashboard/control-room-snapshot-v1.js']
 ];
 const injected=assets.map(([id,src])=>`<script id="${id}" src="${src}" defer></scr`+'ipt>\n').join('');
 if(!html.includes('</body>')) throw new Error('Payload body close mancante');
 html=html.replace('</body>',injected+'</body>');
 document.open(); document.write(html); document.close();
})().catch(e=>document.body.innerHTML='<pre style="white-space:pre-wrap;padding:20px">Errore caricamento dashboard: '+e.message+'</pre>');
</script></body></html>
