<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOBAL MACRO FX QUANT</title></head>
<body><div style="font:14px system-ui;padding:24px">Caricamento GLOBAL MACRO FX QUANT…</div>
<script>
(async()=>{
 const parts=["payload/part-00.txt","payload/part-01.txt","payload/part-02.txt","payload/part-03.txt","payload/part-04.txt","payload/part-05.txt","payload/part-06.txt","payload/part-07.txt","payload/part-08.txt","payload/part-09.txt","payload/part-10.txt","payload/part-11.txt","payload/part-12.txt","payload/part-13.txt","payload/part-14.txt","payload/part-15.txt"];
 const responses=await Promise.all(parts.map(async p=>{
   const r=await fetch(p,{cache:'default'});
   if(!r.ok) throw new Error('Impossibile caricare '+p);
   return r.text();
 }));
 let html=responses.join('\n');
 if(!html.includes('GMFQ_RUNTIME_VALIDATION_MANIFEST')) throw new Error('Payload v490 non validato');
 let refreshCalls=0;
 html=html.replace(/\bstableModelRefresh\s*\(\s*\)/g,(m,offset,src)=>{
   const prefix=src.slice(Math.max(0,offset-24),offset);
   if(/function\s+$/.test(prefix)) return m;
   refreshCalls++;
   return '(window.__GMFQ_STABLE_REFRESH_QUEUED=true)';
 });
 if(refreshCalls!==25) throw new Error('Bootstrap refresh manifest inatteso: '+refreshCalls);

 // Forward presentation compatibility: one later legacy renderer calls a helper
 // that exists only inside an earlier IIFE. Patch exactly that call with the same
 // thresholds/labels; this does not alter Forward snapshots, outcomes or OOS rules.
 const forwardReliabilityCall='const rel=reliabilityLabel(st);';
 const forwardReliabilityMatches=html.split(forwardReliabilityCall).length-1;
 if(forwardReliabilityMatches!==1) throw new Error('Forward reliability scope manifest inatteso: '+forwardReliabilityMatches);
 const forwardReliabilityInline="const rel=(!st.n)?{label:'In attesa',cls:'fwdNeu'}:(st.n<10)?{label:'Troppo presto',cls:'fwdWarn'}:(st.n<20)?{label:'Preliminare',cls:'fwdWarn'}:(st.n<40)?{label:'Campione in costruzione',cls:'fwdWarn'}:{label:'Più affidabile',cls:'fwdPos'};";
 html=html.replace(forwardReliabilityCall,forwardReliabilityInline);

 // Runtime quarantine V2: obsolete September-era QA/editorial mutators remain in
 // the immutable legacy payload for audit/rollback, but must no longer execute.
 // Current visible editorial surfaces are owned by validated operational modules.
 const quarantinedLegacyScripts=[
   'gmfq-propagation-qa',
   'gmfq-e2e-live-italy',
   'gmfq-runtime-refresh-fix-20260930',
   'gmfq-usd-sep30-closeout-20261001',
   'gmfq-usd-sep30-closeout-finalizer-20261001'
 ];
 for(const id of quarantinedLegacyScripts){
   const escaped=id.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
   const re=new RegExp('<script\\s+id=["\\\']'+escaped+'["\\\'][^>]*>[\\s\\S]*?<\\/script>','g');
   const matches=html.match(re)||[];
   if(matches.length!==1) throw new Error('Legacy quarantine manifest inatteso per '+id+': '+matches.length);
   html=html.replace(re,'<!-- GMFQ_LEGACY_QUARANTINED:'+id+' -->');
 }

 // One old 30-Sep refresh block is anonymous. Quarantine it by a unique runtime
 // fingerprint, requiring exactly one matching script block so drift fails closed.
 const quarantinedLegacyFingerprints=[
   {name:'LIVE_REFRESH_20260930_AM',needle:'window.LIVE_REFRESH_20260930_AM='}
 ];
 for(const item of quarantinedLegacyFingerprints){
   const blocks=html.match(/<script(?:\s[^>]*)?>[\s\S]*?<\/script>/g)||[];
   const matches=blocks.filter(block=>block.includes(item.needle));
   if(matches.length!==1) throw new Error('Legacy fingerprint quarantine inatteso per '+item.name+': '+matches.length);
   html=html.replace(matches[0],'<!-- GMFQ_LEGACY_QUARANTINED_FINGERPRINT:'+item.name+' -->');
 }

 const marker='<script id="gmfq-post-gate-final-audit-settlement">';
 if(!html.includes(marker)) throw new Error('Final audit settlement marker mancante');
 const finalRefresh='<script id="gmfq-single-final-stable-refresh">try{if(typeof stableModelRefresh===\'function\')stableModelRefresh();}catch(e){console.error(\'single-final-refresh\',e);}</scr'+'ipt>\n';
 html=html.replace(marker,finalRefresh+marker);
 const oisUi='<script id="gmfq-ois-operational-ui" src="dashboard/ois-operational-monitor-v1.js" defer></scr'+'ipt>\n';
 const calendarNews='<script id="gmfq-calendar-news-operational-ui" src="dashboard/calendar-news-operational-v1.js" defer></scr'+'ipt>\n';
 const topThemes='<script id="gmfq-top-themes-operational-ui" src="dashboard/top-themes-operational-v1.js" defer></scr'+'ipt>\n';
 const whatChanged='<script id="gmfq-what-changed-operational-ui" src="dashboard/what-changed-operational-v1.js" defer></scr'+'ipt>\n';
 const riskOperational='<script id="gmfq-risk-operational-ui" src="dashboard/risk-operational-v1.js" defer></scr'+'ipt>\n';
 const pairsOperational='<script id="gmfq-pairs-operational-ui" src="dashboard/pairs-operational-v1.js" defer></scr'+'ipt>\n';
 const overviewAsOf='<script id="gmfq-overview-asof-operational-ui" src="dashboard/overview-asof-operational-v1.js" defer></scr'+'ipt>\n';
 const editorialFreshness='<script id="gmfq-editorial-freshness-guard" src="dashboard/editorial-freshness-guard-v1.js" defer></scr'+'ipt>\n';
 if(!html.includes('</body>')) throw new Error('Payload body close mancante');
 html=html.replace('</body>',oisUi+calendarNews+topThemes+whatChanged+riskOperational+pairsOperational+overviewAsOf+editorialFreshness+'</body>');
 document.open(); document.write(html); document.close();
})().catch(e=>document.body.innerHTML='<pre style="white-space:pre-wrap;padding:20px">Errore caricamento dashboard: '+e.message+'</pre>');
</script></body></html>
