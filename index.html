<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOBAL MACRO FX QUANT</title></head>
<body><div style="font:14px system-ui;padding:24px">Caricamento GLOBAL MACRO FX QUANT…</div>
<script>
(async()=>{
 const parts=["payload/part-00.txt","payload/part-01.txt","payload/part-02.txt","payload/part-03.txt","payload/part-04.txt","payload/part-05.txt","payload/part-06.txt","payload/part-07.txt","payload/part-08.txt","payload/part-09.txt","payload/part-10.txt","payload/part-11.txt","payload/part-12.txt","payload/part-13.txt","payload/part-14.txt","payload/part-15.txt"];
 const responses=await Promise.all(parts.map(async p=>{
   const r=await fetch(p,{cache:'default'});
   if(!r.ok) throw new Error('Impossibile caricare '+p);
   return r.text();
 }));
 let html=responses.join('\n');
 if(!html.includes('GMFQ_RUNTIME_VALIDATION_MANIFEST')) throw new Error('Payload v490 non validato');

 // Expose references to the two legacy Macro lexical bindings from inside the
 // exact scope where each binding is declared. This does not alter or rebind
 // either object; it only gives the canonical runtime overlay a stable handle.
 const exposeBinding=(source,name,refName)=>{
   const re=new RegExp('\\b(?:const|let|var)\\s+'+name+'\\s*=','g');
   const matches=[...source.matchAll(re)];
   if(matches.length!==1) throw new Error('Macro bridge declaration inattesa '+name+': '+matches.length);
   const m=matches[0];
   let i=m.index+m[0].length, depth=0, quote=null, escaped=false;
   for(;i<source.length;i++){
     const ch=source[i];
     if(quote){
       if(escaped){escaped=false;continue;}
       if(ch==='\\\\'){escaped=true;continue;}
       if(ch===quote) quote=null;
       continue;
     }
     if(ch==='"'||ch==="'"||ch==='`'){quote=ch;continue;}
     if(ch==='('||ch==='['||ch==='{'){depth++;continue;}
     if(ch===')'||ch===']'||ch==='}'){depth--;if(depth<0)throw new Error('Macro bridge nesting invalido '+name);continue;}
     if(ch===';'&&depth===0){
       const bridge='window.'+refName+'='+name+';';
       return source.slice(0,i+1)+bridge+source.slice(i+1);
     }
   }
   throw new Error('Macro bridge terminatore non trovato '+name);
 };
 html=exposeBinding(html,'MACRO_THERMOMETER_DATA','__GMFQ_MACRO_THERMOMETER_REF');
 html=exposeBinding(html,'MACRO_SERIES','__GMFQ_MACRO_SERIES_REF');

 let refreshCalls=0;
 html=html.replace(/\bstableModelRefresh\s*\(\s*\)/g,(m,offset,src)=>{
   const prefix=src.slice(Math.max(0,offset-24),offset);
   if(/function\s+$/.test(prefix)) return m;
   refreshCalls++;
   return '(window.__GMFQ_STABLE_REFRESH_QUEUED=true)';
 });
 if(refreshCalls!==25) throw new Error('Bootstrap refresh manifest inatteso: '+refreshCalls);
 const marker='<script id="gmfq-post-gate-final-audit-settlement">';
 if(!html.includes(marker)) throw new Error('Final audit settlement marker mancante');
 const canonicalOverlay='<script id="gmfq-canonical-runtime-overlay" src="live_data/canonical-runtime-overlay.js"></scr'+'ipt>\n';
 const researchUi='<script id="gmfq-research-status-card-loader" src="live_data/research-state-card.js"></scr'+'ipt>\n';
 const researchBootstrap='<script id="gmfq-research-state-sidecar">(async()=>{try{const r=await fetch(\'live_data/sections/RESEARCH_STATE.json\',{cache:\'no-store\'});if(!r.ok)throw new Error(\'research-state-http-\'+r.status);const x=await r.json();if(x.research_signal_state!==\'WITHHELD\'||x.decision_weight!==0||x.may_modify_pair_bias!==false||x.may_modify_currency_score!==false||x.may_modify_sizing!==false)throw new Error(\'research-state-fail-closed\');Object.freeze(x.context_only||[]);window.__GMFQ_RESEARCH_STATE=Object.freeze(x);window.dispatchEvent(new CustomEvent(\'gmfq:research-state-ready\',{detail:window.__GMFQ_RESEARCH_STATE}));}catch(e){window.__GMFQ_RESEARCH_STATE=Object.freeze({research_signal_state:\'WITHHELD\',decision_weight:0,context_only:[],load_error:String(e&&e.message||e)});console.error(\'research-state-sidecar\',e);}})();</scr'+'ipt>\n';
 const finalRefresh='<script id="gmfq-single-final-stable-refresh">(async()=>{try{if(window.__GMFQ_CANONICAL_OVERLAY_READY)await window.__GMFQ_CANONICAL_OVERLAY_READY;if(window.__GMFQ_CANONICAL_OVERLAY_STATE&&window.__GMFQ_CANONICAL_OVERLAY_STATE.status!==\'PASS_CANONICAL_MACRO_OVERLAY\')throw new Error(\'canonical-overlay-not-ready\');if(typeof stableModelRefresh===\'function\')stableModelRefresh();}catch(e){console.error(\'single-final-refresh\',e);window.__GMFQ_FINAL_REFRESH_ERROR=String(e&&e.message||e);}})();</scr'+'ipt>\n';
 html=html.replace(marker,canonicalOverlay+researchUi+researchBootstrap+finalRefresh+marker);
 document.open(); document.write(html); document.close();
})().catch(e=>{
 window.__GMFQ_BOOTSTRAP_ERROR=String(e&&e.stack||e);
 console.error('dashboard-bootstrap',e);
 document.body.innerHTML='<pre style="white-space:pre-wrap;padding:20px">Errore caricamento dashboard: '+String(e&&e.message||e)+'</pre>';
});
</script></body></html>
