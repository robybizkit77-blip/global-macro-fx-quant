<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLOBAL MACRO FX QUANT</title>
<style>html,body{margin:0;background:#06131f;color:#eef7ff;font:16px Arial,sans-serif}#loading{padding:24px}</style>
</head><body><div id="loading">Caricamento GLOBAL MACRO FX QUANT…</div>
<script>
(async()=>{
 let manifest=null,files;
 try{
   const m=await fetch('site/current.json',{cache:'no-store'});
   if(!m.ok) throw new Error('manifest '+m.status);
   manifest=await m.json();
   if(!Array.isArray(manifest.files)||!manifest.files.length) throw new Error('manifest non valido');
   files=manifest.files;
 }catch(_){
   files=["site/part-001.b64","site/part-002.b64","site/part-003.b64","site/part-004.b64","site/part-005.b64","site/part-006.b64","site/part-007.b64","site/part-008.b64","site/part-009.b64","site/part-010.b64","site/part-011.b64","site/part-012.b64"];
 }
 let b64='';
 for(const f of files){
   const r=await fetch(f,{cache:'no-store'});
   if(!r.ok) throw new Error(f+' '+r.status);
   b64+=(await r.text()).trim();
 }
 const bin=atob(b64);
 let bytes=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
 if(manifest && manifest.encoding==='gzip-base64'){
   if(typeof DecompressionStream==='undefined') throw new Error('DecompressionStream non supportato');
   const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
   bytes=new Uint8Array(await new Response(stream).arrayBuffer());
 }
 const dash=new TextDecoder('utf-8').decode(bytes);
 document.open();document.write(dash);document.close();
})().catch(e=>{
 document.body.innerHTML='<div style="padding:24px;font:16px Arial;color:#fff;background:#06131f">Errore nel caricamento della dashboard. Riprova tra poco.<br><small>'+String(e)+'</small></div>';
});
</script></body></html>
